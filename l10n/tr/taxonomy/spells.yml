# Turkish Taxonomy: Spellcasting Terminology (Büyücülük Terimleri)
# Reference: docs/architecture/turkish-taxonomy-alignment.md

spell-rank:
  name: Büyü Derecesi
  description: Büyünün gücünü belirten derece (1 ile 10 arası).

spell-slot:
  name: Büyü Slotu
  description: Belirli derecedeki büyüleri hazırlamak veya anlık yapmak için harcanan büyü hakkı.

cantrip:
  name: Kantrip
  description: Büyü slotu harcamayan, gün boyunca sınırsız kullanılabilen ve karakter seviyenizin yarısına otomatik güçlenen büyü.

focus-spell:
  name: Odak Büyüsü
  description: Sınıfın iç cevherinden gelen ve Odak Puanı harcayarak yapılan özel sınıf büyüsü.

focus-point:
  name: Odak Puanı
  description: Odak Büyülerini kullanmak için harcanan özel kaynak havuzu (en fazla 3).

refocus:
  name: Odak Yenile
  description: 10 dakika harcayarak 1 Odak Puanı geri kazanma eylemi.

heightened:
  name: Güçlendirilmiş
  description: Büyüyü temel derecesinden daha yüksek bir slotta yaparak ek etkiler kazanma.

sustained:
  name: Sürdürülen
  description: Etkisini devam ettirmek için her sırada 1 eylem harcanarak sürdürülebilir.

innate-spell:
  name: Özgü Büyü
  description: Büyü slotu harcamadan, genellikle bir soy veya miras yeteneği sayesinde günde sınırlı sayıda yapılan büyü.

spontaneous-spell:
  name: Spontane Büyü
  description: Önceden hazırlanmadan, bilinen büyüler havuzundan büyü slotu harcanarak anlık olarak yapılan büyü.

emanation:
  name: Yayılım
  description: Büyüyü yapan karakterin merkezinden dışarıya doğru her yöne yayılan alan etkisi.

line:
  name: Hat
  description: Büyüyü yapan karakterden başlayıp düz bir çizgi boyunca uzanan alan etkisi.

locus:
  name: Büyü Lokusu
  description: Büyünün etki merkezini oluşturan veya büyü gücünü toplayan odak noktası.
