# Turkish Taxonomy: Proficiency Ranks (Yetkinlik Dereceleri)
# Reference: docs/architecture/turkish-taxonomy-alignment.md

untrained:
  name: Eğitimsiz
  abbreviation: EĞİ
  bonus: 0
  description: Herhangi bir eğitim alınmamış, yalnızca nitelik bonusu eklenir.

trained:
  name: Eğitimli
  abbreviation: EĞT
  bonus: "seviye + 2"
  description: Temel eğitim tamamlanmış, seviye ve +2 bonus eklenir.

expert:
  name: Uzman
  abbreviation: UZM
  bonus: "seviye + 4"
  description: İleri seviye uzmanlık, seviye ve +4 bonus eklenir.

master:
  name: Usta
  abbreviation: UST
  bonus: "seviye + 6"
  description: Ustalık mertebesi, seviye ve +6 bonus eklenir.

legendary:
  name: Efsanevi
  abbreviation: EFS
  bonus: "seviye + 8"
  description: Dünyada az kişinin ulaştığı efsanevi kabiliyet, seviye ve +8 bonus eklenir.
