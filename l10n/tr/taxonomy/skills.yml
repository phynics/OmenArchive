# Turkish Taxonomy: Skills (Beceriler)
# Reference: docs/architecture/turkish-taxonomy-alignment.md

acrobatics:
  name: Akrobasi
  attribute: dexterity
  description: Denge, takla ve çeviklik gerektiren hareketler.

arcana:
  name: Arkana
  attribute: intelligence
  description: Sihir teorisi, ejderhalar, büyülü yaratıklar ve düzlemler üstü sihir bilgisi.

athletics:
  name: Atletizm
  attribute: strength
  description: Tırmanma, yüzme, zıplama ve kuvvet gerektiren hareketler.

crafting:
  name: Zanaat
  attribute: intelligence
  description: Eşya yapımı, tamiri ve maddelerin işlenmesi.

deception:
  name: Aldatma
  attribute: charisma
  description: Yalan söyleme, kılık değiştirme ve yanıltma.

diplomacy:
  name: Diplomasi
  attribute: charisma
  description: İkna, müzakere ve sosyal izlenim bırakma.

intimidation:
  name: Gözdağı
  attribute: charisma
  description: Korkutma, tehdit etme ve baskı kurma.

medicine:
  name: Tıp
  attribute: wisdom
  description: Yaralanma tedavisi, hastalık teşhisi ve ilk yardım.

nature:
  name: Doğa
  attribute: wisdom
  description: Vahşi yaşam, bitkiler, hayvanlar ve doğa olayları bilgisi.

occultism:
  name: Okültizm
  attribute: intelligence
  description: Gizemli gelenekler, ruhlar ve doğaüstü olaylar bilgisi.

performance:
  name: Performans
  attribute: charisma
  description: Müzik, dans, hitabet ve sahne sanatları.

religion:
  name: Din
  attribute: wisdom
  description: Tanrılar, ilahi gelenekler ve dini ritüeller bilgisi.

society:
  name: Sosyoloji
  attribute: intelligence
  description: Kültürler, tarih, hukuk ve sosyal yapılar bilgisi.

stealth:
  name: Gizlilik
  attribute: dexterity
  description: Saklanma, sessiz hareket ve fark edilmeden izleme.

survival:
  name: Hayatta Kalma
  attribute: wisdom
  description: İz sürme, yön bulma, kamp kurma ve vahşi doğada hayatta kalma.

thievery:
  name: Hırsızlık
  attribute: dexterity
  description: Kilit açma, yankesicilik, tuzak etkisizleştirme.

lore:
  name: İrfan
  description: Belirli bir konudaki uzmanlık; alt türü konuya göre adlandırılır.
