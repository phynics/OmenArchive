# Turkish Taxonomy: Attributes (Nitelikler)
# Reference: docs/architecture/turkish-taxonomy-alignment.md

strength:
  name: Kuvvet
  abbreviation: KUV
  description: Fiziksel güç, yakın dövüş saldırıları ve taşıma kapasitesi.

dexterity:
  name: Çeviklik
  abbreviation: ÇEV
  description: Çeviklik, refleksler, denge ve menzilli saldırılar.

constitution:
  name: Bünye
  abbreviation: BÜN
  description: Beden direnci, zindelik ve can puanı artışı.

intelligence:
  name: Zekâ
  abbreviation: ZEK
  description: Mantık, hafıza, büyü ilimleri ve diller.

wisdom:
  name: Bilgelik
  abbreviation: BİL
  description: Sezgi, farkındalık, inanç ve dikkat.

charisma:
  name: Karizma
  abbreviation: KAR
  description: Kişilik gücü, ikna kabiliyeti ve liderlik.

attribute-modifier:
  name: Nitelik Değiştiricisi
  description: Nitelik değerinin zarlara eklenen bonusu veya cezası.
