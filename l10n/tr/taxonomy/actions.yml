# Turkish Taxonomy: Actions & Combat (Eylemler ve Savaş)
# Reference: docs/architecture/turkish-taxonomy-alignment.md

action:
  name: Tek Eylem
  abbreviation: 1E
  symbol: "[one-action]"
  description: Bir sırada kullanılabilen standart tek eylem birimi.

two-actions:
  name: İki Eylem
  abbreviation: 2E
  symbol: "[two-actions]"
  description: İki eylem birimi harcayan kapsamlı faaliyet veya büyü.

three-actions:
  name: Üç Eylem
  abbreviation: 3E
  symbol: "[three-actions]"
  description: Bir sıranın tamamını alan büyük faaliyet veya tam büyü ritüeli.

free-action:
  name: Serbest Eylem
  symbol: "[free-action]"
  description: Eylem hakkı harcamayan, genellikle bir tetikleyiciye bağlı anlık eylem.

reaction:
  name: Reaksiyon
  symbol: "[reaction]"
  description: Başka birinin eylemine veya çevresel tetikleyiciye karşılık olarak sıra dışında yapılan anlık eylem.

step:
  name: Adım
  description: Reaktif vuruş veya reaksiyon tetiklemeyen 5 fitlik güvenli manevra.

stride:
  name: Depar
  description: Karakterin tüm hareket hızını kullanarak sahada ilerlemesi.

strike:
  name: Vuruş Yap
  description: Yakın dövüş veya menzilli silahla temel vuruş yapma eylemi.

move:
  name: Hareket
  description: Konum değiştiren tüm eylemlerin genel özelliği.

multiple-attack-penalty:
  name: Çoklu Saldırı Cezası
  abbreviation: ÇSC
  description: Aynı sıra içindeki ikinci (-5) ve üçüncü (-10) saldırılara uygulanan ceza.

seek:
  name: Tara
  description: Çevredeki gizli veya saptanmamış nesneleri ve yaratıkları bulmak için yapılan anlık arama eylemi.

search:
  name: Ara
  description: Keşif faaliyeti sırasında bir alanı sistematik olarak arama eylemi.

investigate:
  name: Araştır
  description: İpuçlarını inceleyerek veya bilgi toplayarak gizemleri çözmeye çalışma keşif faaliyeti.

take-cover:
  name: Siper Al
  description: Savunma Değeri ve Refleks kurtarışlarına siper bonusu kazanmak için bir nesnenin arkasına sığınma eylemi.

ready:
  name: Hazırlan
  description: Belirlenen bir tetikleyici gerçekleştiğinde kullanılmak üzere bir eylemi önceden hazırlama faaliyeti.

delay:
  name: Ertele
  description: Sırayı inisiyatif sırasında daha sonraya erteleme serbest eylemi.

interact:
  name: Etkileşime Gir
  description: Bir eşyayı tutma, kapıyı açma veya nesneleri manipüle etme eylemi.

crawl:
  name: Sürün
  description: Yerdeyken hareket etme eylemi.

reposition:
  name: Yerinden Oynat
  description: Bir yaratığı mevcut konumundan yakındaki başka bir konuma hareket ettirme manevrası.

tumble-through:
  name: Sıyrılıp Geç
  description: Bir düşmanın alanından akrobasiyle geçerek hareket etme eylemi.

sense-motive:
  name: Niyetini Tart
  description: Bir yaratığın dürüstlüğünü, duygusal durumunu veya niyetini anlama eylemi.

demoralize:
  name: Gözdağı Ver
  description: Düşmanı korkutarak korkmuş durumuna sokma eylemi.

disrupt-an-action:
  name: Eylemi Boz
  description: Tetiklenen bir düşman eylemini geçersiz kılma veya yarıda kesme etkisi.

disable-a-device:
  name: Düzeneği Etkisizleştir
  description: Tuzak veya mekanik düzenekleri devre dışı bırakma eylemi.

treat-disease:
  name: Hastalığı Tedavi Et
  description: Tıp becerisi kullanarak hastalıktan muzdarip birini iyileştirme faaliyeti.

treat-poison:
  name: Zehirlenmeyi Tedavi Et
  description: Tıp becerisi kullanarak zehirlenmiş birine müdahale etme eylemi.
