# Turkish Taxonomy: Defenses & Saves (Savunmalar ve Kurtarışlar)
# Reference: docs/architecture/turkish-taxonomy-alignment.md

armor-class:
  name: Savunma Değeri
  abbreviation: SD
  description: Fiziksel saldırıların isabet etmesi için aşılması gereken savunma değeri.

hit-points:
  name: Can Puanı
  abbreviation: CP
  description: Karakterin bilincini ve hayatta kalma kapasitesini temsil eden dayanıklılık puanı.

temporary-hit-points:
  name: Geçici Can Puanı
  abbreviation: GCP
  description: Gerçek can puanından önce hasarı emen geçici koruma puanı.

saving-throw:
  name: Kurtarış
  abbreviation: KUR
  description: Ani tehlikelere, büyülere, zehirlere veya tuzaklara karşı koyma denemesi.

fortitude:
  name: Dayanıklılık Kurtarışı
  abbreviation: DAY
  attribute: constitution
  description: Zehirlere, hastalıklara ve bedensel travmalara karşı koyma kabiliyeti.

reflex:
  name: Refleks Kurtarışı
  abbreviation: REF
  attribute: dexterity
  description: Alan etkilerinden, patlamalardan ve ani engellerden sakınma kabiliyeti.

will:
  name: İrade Kurtarışı
  abbreviation: İRA
  attribute: wisdom
  description: Zihinsel etkilere, yanılsamalara, büyüye ve korkuya direnme gücü.

perception:
  name: Dikkat
  abbreviation: DİK
  attribute: wisdom
  description: Çevredeki tehlikeleri, gizli varlıkları fark etme ve çatışmada inisiyatif alma kabiliyeti.
