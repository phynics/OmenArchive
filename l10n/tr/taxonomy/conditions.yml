# Turkish Taxonomy: Conditions (Durumlar)
# Reference: docs/architecture/turkish-taxonomy-alignment.md

blinded:
  name: Körleşmiş
  description: Göremezsiniz. Tüm araziler zorlu arazi sayılır. Görsel saptama testlerinde kritik başarısız sayılırsınız.

clumsy:
  name: Sakar
  description: Çeviklik temelli zarlara, saldırılara, Refleks kurtarışlarına ve Savunma Değeri'ne ceza alırsınız.

concealed:
  name: Belirsiz
  description: Hedef sis, duman veya gölge nedeniyle net algılanamaz; hedeflemek için ZD 5 düz deneme gerekir.

confused:
  name: Aklı Bulanmış
  description: Müttefik ve düşman ayrımı yapamazsınız; her sırada hedefinizi rastgele seçersiniz veya kendinize vurursunuz; reaksiyon kullanamazsınız.

dazzled:
  name: Gözü Kamaşmış
  description: Parlak ışık nedeniyle her şey size karşı belirsiz (ZD 5) sayılır.

deafened:
  name: Sağır
  description: Duyamazsınız. İşitsel testlerde otomatik başarısız olursunuz.

doomed:
  name: Eceli Gelmiş
  description: Ölmekte durumuna düşerseniz ölme eşiğiniz değer kadar azalır (ör. Eceli Gelmiş 1 ile 3'te ölürsünüz).

drained:
  name: İçi Çekilmiş
  description: Bünye denemelerine ceza alırsınız ve maksimum Can Puanınız seviyeniz başına değer kadar düşer.

dying:
  name: Ölmekte
  description: Bilinciniz kapalıdır ve her sırada toparlanma denemesi (ZD 10 + değer) yapılır.

enfeebled:
  name: Güçten Düşmüş
  description: Kuvvet temelli zarlara, yakın dövüş saldırılarına ve hasarlarına ceza alırsınız.

fascinated:
  name: Kendini Kaptırmış
  description: Büyüleyici bir hedefe odaklanmış durumdasınız; diğer hedeflere karşı Dikkat veya Odaklanma Etiketi gerektiren eylemler yapamazsınız.

fatigued:
  name: Bitkin
  description: Savunma Değeri ve kurtarışlara -1 ceza alırsınız. Keşif faaliyetleri yapamazsınız.

fleeing:
  name: Kaçan
  description: Tehdit kaynağından tüm eylemlerinizle koşarak uzaklaşmak zorundasınız.

frightened:
  name: Korkmuş
  description: Tüm test ve zarlarınıza ceza alırsınız; her sıranın sonunda 1 azalır.

grabbed:
  name: Kavranmış
  description: Hareketsiz sayılırsınız ve saldırılara karşı dikkatiniz dağınıktır (Savunma Değeri -2).

hidden:
  name: Gizlenmiş
  description: Hedefin nerede olduğu bilinir fakat net biçimde algılanmaz; hedeflemek için ZD 11 düz deneme gerekir.

immobilized:
  name: Hareketsiz
  description: Kendi hareket hızınızı kullanarak hiçbir hareket eylemi yapamazsınız.

invisible:
  name: Görünmez
  description: Görsel olarak saptanamazsınız. Düşmanlar için konumu saptanmamış sayılırsınız.

off-guard:
  name: Gafil
  description: Saldırılara karşı gafil durumdasınız; Savunma Değerinize -2 durumsal ceza alırsınız.

paralyzed:
  name: Felçli
  description: Donup kalmış haldesiniz; yalnızca zihinsel eylemler yapabilirsiniz. Savunma Değeri -2 ceza alır.

petrified:
  name: Taşlaşmış
  description: Taşa dönüşmüş durumdasınız; bilinciniz kapalıdır ve nesne muamelesi görürsünüz.

prone:
  name: Yerde
  description: Yerde yatıyorsunuz; yakın dövüş saldırılarına -2 ceza alırsınız, ayağa kalkmak için 1 eylem harcamanız gerekir.

quickened:
  name: Hızlanmış
  description: Her sırada fazladan 1 eylem kazanırsınız (genellikle Adım, Depar veya Vuruş Yap ile sınırlıdır).

restrained:
  name: Kısıtlanmış
  description: Kavranmış durumun daha ağır hâlidir; yalnızca Kurtul eylemini (Escape) kullanabilirsiniz.

sickened:
  name: Midesi Bulanmış
  description: Tüm zarlara ceza alırsınız; iyileşmek için 1 eylem harcayıp öğürme/kusma testi yapmanız gerekir.

slowed:
  name: Yavaşlamış
  description: Her sırada değer kadar eylem kaybedilir.

stunned:
  name: Sersemlemiş
  description: Hiçbir eylem veya reaksiyon kullanamazsınız; değer kadar eyleminiz boşa gider.

stupefied:
  name: Zihni Uyuşmuş
  description: Zekâ, Bilgelik ve Karizma zarlarına ceza alırsınız; büyü yaparken ZD 5 + değer düz zar gerekir.

unconscious:
  name: Bilincini Yitirmiş
  description: Baygın veya uykudasınız; yüzüstü düşersiniz, Savunma Değeriniz -4 ceza alır.

undetected:
  name: Konumu Saptanmamış
  description: Hedefin varlığı bilinebilir fakat konumu bilinmez; doğrudan hedef alınamaz.

unfriendly:
  name: Hoşnutsuz
  description: Hedef size karşı hoşnutsuzdur; sosyal etkileşimlerde işbirliğine yanaşmaz ve olumsuz yaklaşır.

unnoticed:
  name: Fark Edilmemiş
  description: Gözlemci hedefin varlığından bile haberdar değildir.

wounded:
  name: Yaralı
  description: Ölmekte durumundan kurtulduğunuzda kazanırsınız; tekrar 0 cana düşerseniz ölmekte değerinize eklenir.
