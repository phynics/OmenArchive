# Turkish Taxonomy: Spell Traditions (Büyü Gelenekleri)
# Reference: docs/architecture/turkish-taxonomy-alignment.md

arcane:
  name: Mistik
  description: Akıl, mantık ve kozmosun kurallarını çözerek yapılan büyü ilmi (Wizard, Witch).

divine:
  name: İlahi
  description: Tanrılardan, inançtan ve düzlemlerin ruhsal güçlerinden gelen büyü (Rahip, Şampiyon).

occult:
  name: Okült
  description: Bilinçaltı, zihin, ruhlar ve kadim gizemlerle şekillenen büyü (Ozan, Witch).

primal:
  name: Doğa
  description: Doğa, elementler ve yaşam döngüsünün saf gücünü kullanan büyü (Druid, Korucu).
