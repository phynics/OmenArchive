# tr overrides: versatile-heritage

omen://versatile-heritage/dhampir?source=paizo-pathfinder-player-core-2:
  name: Dampir
  description: "Bir vampirin neslindensiniz; yarı canlı ve yarı hortlaksınız; tekinsiz bir çekicilik ve zarafet, kansız bir solgunluk ve uzamış kesici dişlerle donatılmışsınızdır. Soyunuzdan gelen özelliklere ek olarak dampir özelliğini kazanırsınız. Boşluk iyileşmesi yeteneğine sahipsinizdir; bu da bir hortlakmışsınız gibi canlılık hasarından zarar gördüğünüz ve boşluk etkileriyle iyileştiğiniz anlamına gelir. Ayrıca loş ışıkta görüş kazanırsınız veya soyunuz zaten loş ışıkta görüşe sahipse karanlıkgörüş kazanırsınız. Ne zaman bir soy hüneri kazansanız dampir hünerlerinden ve soyunuzdan gelen hünerlerden seçim yapabilirsiniz."

omen://versatile-heritage/dragonblood?source=paizo-pathfinder-player-core-2:
  name: Ejderkan
  description: Bir şekilde bir ejderhanın soyundan gelmektesiniz. Fiziksel özellikleriniz bunu dışarıdan bir çift ejder boynuzu, pullu deri parçaları veya hatta bir kuyruk ile gösterebilir ya da ejderha gücünden oluşan bir içsel rezerv geliştirebilirsiniz. Soyunuzdan gelen özelliklere ek olarak ejderkan özelliğini kazanırsınız. Ejderce'yi soyunuzun ek diller listesine eklersiniz (bu sayede Zekâ nitelik bonusunuz pozitifse onu bir dil olarak seçebilirsiniz). Bir korku etkisine karşı kurtarışta bir başarı elde ettiğinizde bunun yerine kritik başarı elde edersiniz. Ne zaman bir soy hüneri kazansanız ejderkan hünerlerinden ve soyunuzdan gelen hünerlerden seçim yapabilirsiniz.

omen://versatile-heritage/duskwalker?source=paizo-pathfinder-player-core-2:
  name: Alacakaranlık Gezgini
  description: "Kadim bir pazarlık sayesinde ruhunuz bir alacakaranlık gezgini olarak yeniden doğmuştur; bu, psikopomplarla ve Kemiklik ile bağı olan düzlemsel bir vâristir. Alacakaranlık gezgini özelliğini kazanırsınız. Ayrıca loş ışıkta görüş kazanırsınız veya soyunuz zaten loş ışıkta görüşe sahipse karanlıkgörüş kazanırsınız. Ne bedeniniz ne de ruhunuz asla bir hortlağa dönüşemez. Ne zaman bir soy hüneri kazansanız alacakaranlık gezgini hünerlerinden ve soyunuzdan gelen hünerlerden seçim yapabilirsiniz."
