# tr overrides: ancestry

omen://ancestry/catfolk/catfolk?source=paizo-pathfinder-player-core-2:
  name: Kedisoy
  description: >
    Kedisoylar; merak, esneklik ve kahramanlık tutkusuyla dolu, kedi benzeri insansılardır. Catfolk


omen://ancestry/catfolk/features/land-on-your-feet?source=paizo-pathfinder-player-core-2:
  name: Dört Ayak Üstüne Düşme
  description: Zarafetiniz ve esnekliğiniz yükseklerden düşmenize ve dört ayak üstüne inmenize olanak tanır. Ne zaman düşseniz, düşüşten normal hasarın yalnızca yarısını alırsınız ve yere Yüzüstü düşmezsiniz.

omen://ancestry/catfolk/heritages/clawed-catfolk?source=paizo-pathfinder-player-core-2:
  name: Pençeli Kedisoy
  description: Aileniz, hain bir pençe darbesiyle kanatıcı yaralar açabilen özellikle uzun ve keskin pençelere sahiptir. 1d6 kesici hasar veren bir pençe silahsız saldırısı kazanırsınız. Pençeleriniz brawling grubundadır ve agile, finesse ile unarmed özelliklerine sahiptir.

omen://ancestry/catfolk/heritages/hunting-catfolk?source=paizo-pathfinder-player-core-2:
  name: Avcı Kedisoy
  description: Yetenekli avcı ve iz sürücülerden oluşan köklü bir soydan gelirsiniz ve özellikle keskin bir koku alma duyusuna sahipsinizdir. 30 fit menzile sahip belirsiz koku duyusu kazanırsınız. Bu, bir yaratığın konumunu belirlemek için koku alma duyunuzu kullanabileceğiniz anlamına gelir. Yaratığa göre rüzgâr altındaysanız GM genellikle bu menzili iki katına çıkarır, rüzgâr üstündeyseniz menzili yarıya indirir. Ayrıca koku menzilinizdeki bir yaratığın veya nesnenin İzini Sürmek için yapılan Dikkat testlerine +2 durumsal bonus kazanırsınız.

omen://ancestry/catfolk/heritages/jungle-catfolk?source=paizo-pathfinder-player-core-2:
  name: Cengel Kedisoyu
  description: Balta girmemiş orman avcılarının soyundan gelirsiniz ve normalde yıkıcı olabilecek bir düşüşten kendinizi kurtarabilirsiniz. Akrobasi konusunda eğitimli olmasanız bile Kedi Düşüşü beceri hünerini bonus hüner olarak kazanırsınız.

omen://ancestry/catfolk/heritages/liminal-catfolk?source=paizo-pathfinder-player-core-2:
  name: Eşik Kedisoyu
  description: Görünemeyen şeyleri görürsünüz. Büyü Tespit Et kantripini istediğiniz zaman bir okült özgü büyü olarak yapabilirsiniz. Kantrip, seviyenizin yukarı yuvarlanmış yarısına eşit bir büyü derecesine yükseltilir. Ayrıca konumu saptanmamış ve gizlenmiş yaratıkları Taramak için yapılan testlere +1 durumsal bonus kazanırsınız.

omen://ancestry/catfolk/heritages/nine-lives-catfolk?source=paizo-pathfinder-player-core-2:
  name: Dokuz Canlı Kedisoy
  description: "Aileniz her daim felaketlerden dönmeyi başarmış gibi görünür. Diğer kedisoylar sizin dokuz canlı olduğunuzu söyler. Bir kritik vuruşla 0 Can Puanına düşürülürseniz, bunun yerine yalnızca normal hasar almayı seçebilirsiniz; ancak bu durum sizi o kritik vuruşun neden olduğu diğer etkilerden (kritik uzmanlaşma etkileri gibi) korumaz. 0 Can Puanına düşürülürseniz, ölmekte durumunuzu ölmekte 1'in ötesine artırmazsınız. Ayrıca Zor Ölür hünerini bonus hüner olarak kazanırsınız."

omen://ancestry/catfolk/heritages/sharp-eared-catfolk?source=paizo-pathfinder-player-core-2:
  name: Sivrikulak Kedisoy
  description: Ruh hâlinizle birlikte hareket eden ve beklenmedik her seste dikilen büyük, etkileyici kulaklarla doğdunuz. Bir Tara eylemiyle 30 fit içinde duyabildiğiniz konumu saptanmamış yaratıkların yerini belirlemek için +2 durumsal bonus kazanırsınız. Bir yaratığın ses yoluyla farkında olduğunuz sürece, sıranızda bir kez, kulaklarınız serbest eylem olarak o yaratığı tüm müttefiklerinize İşaret Etmenize yardımcı olabilir.

omen://ancestry/catfolk/heritages/winter-catfolk?source=paizo-pathfinder-player-core-2:
  name: Kış Kedisoyu
  description: Sizi soğuk sıcaklıklardan koruyan kalın ve gür bir kürkünüz vardır. Seviyenizin yarısına eşit (en az 1) soğuk direnci kazanırsınız. Çevresel soğuk etkilerini bir kademe daha az aşırıymış gibi ele alırsınız (inanılmaz soğuk aşırı soğuk olur, aşırı soğuk şiddetli soğuk olur vb.).

omen://ancestry/hobgoblin/heritages/elfbane-hobgoblin?source=paizo-pathfinder-player-core-2:
  name: Elfkıran Hobgoblin
  description: Hobgoblinler kadim zamanlarda elflerle savaşmak üzere tasarlanmıştır ve sizin soyunuz bu direncin çoğunu diğerlerinden daha fazla korumuştur. Elf Büyüsüne Diren tepkisini kazanırsınız.

omen://ancestry/hobgoblin/heritages/runtboss-hobgoblin?source=paizo-pathfinder-player-core-2:
  name: Çelimsiz Başı Hobgoblin
  description: "Goblinlere komuta etmiş köklü bir hobgoblin soyundan gelirsiniz. Diğer hobgoblinlerden daha küçüksünüzdür ancak haykırdığınız her komutu goblinler yine de dinler. Grup Tehdidi beceri hünerini kazanırsınız. Bir goblini Tehditle Zorlamak için yapılan bir Gözdağı testinde başarı elde ettiğinizde bunun yerine kritik başarı kazanırsınız; kritik başarısızlık elde ederseniz bunun yerine başarısızlık kazanırsınız."

omen://ancestry/hobgoblin/heritages/shortshanks-hobgoblin?source=paizo-pathfinder-player-core-2:
  name: Kısabacak Hobgoblin
  description: "Çoğu hobgoblinden daha uzun bir gövdeye ve daha geniş omuzlara sahipsinizdir; bu da bacaklarınızın kıyasla kısa görünmesine neden olur. Bu size güçlü, kaslı bir gövde çekirdeği kazandırır ve ağırlık merkezinizi düşürür—bu özellikler binicilik ve tırmanmada size yardımcı olur—ve çok erken yaşlardan itibaren eyerde binicilik eğitimi almışsınızdır. Binicilik hünerini kazanırsınız. Ayrıca Tırmanırken Gafil kalmazsınız."

omen://ancestry/hobgoblin/heritages/smokeworker-hobgoblin?source=paizo-pathfinder-player-core-2:
  name: Duman İşçisi Hobgoblin
  description: "Soydaşlarınız gibi savaş için yetiştirilmediniz; bunun yerine demirhanelerin yoğun dumanında veya laboratuvarların simyasal sislerinde çalışmak üzere eğitildiniz. Duman içindeyken gözleriniz yaşarmaz, öksürmezsiniz veya mideniz bulanmaz. Duman nedeniyle Gizlenmiş bir yaratığı hedeflerken vurmak için düz test denemeniz gerekmez ve duman etkilerine karşı attığınız her kurtarışta bir kritik başarı kazanırsınız."

omen://ancestry/hobgoblin/heritages/warmarch-hobgoblin?source=paizo-pathfinder-player-core-2:
  name: Savaş Seferi Hobgoblini
  description: Sürekli seferde olan ve yollarda yiyecek toplayan gezgin paralı askerlerin soyundan gelirsiniz. Yaban arazide Barınmak konusunda başarısız olursanız ancak kritik başarısız olmazsanız, yine de yetersiz öğünlerle karnınızı doyurabilirsiniz. Keşif yaparken durmak zorunda kalmadan önce iki kat daha uzun süre Tempoyu Artırabilirsiniz.

omen://ancestry/hobgoblin/heritages/warrenbred-hobgoblin?source=paizo-pathfinder-player-core-2:
  name: Yeraltı Doğumlu Hobgoblin
  description: Atalarınız yer altında yaşadı. Kulaklarınız diğer hobgoblinlerinkinden daha büyüktür ve yankılara karşı hassastır. Yer altındayken sizden Belirsiz veya sizden Gizlenmiş bir rakibi hedeflediğinizde, düz testin ZD'sini Belirsiz hedef için 3'e, Gizlenmiş hedef için 9'a düşürün. Ayrıca Dar Yerden Geçmek için bir Akrobasi testinde başarı elde ettiğinizde bunun yerine kritik başarı kazanırsınız.

omen://ancestry/hobgoblin/hobgoblin?source=paizo-pathfinder-player-core-2:
  name: Hobgoblin
  description: >
    Goblin akrabalarından daha uzun ve güçlü olan hobgoblinler, geniş omuzları ve uzun, güçlü kollarıyla güç ve boyut bakımından insanlarla denktir. Hobgoblin


omen://ancestry/kholo/features/bite?source=paizo-pathfinder-player-core-2:
  name: Isırık
  description: Keskin dişleriniz ve güçlü çeneleriniz korkutucu silahlardır. 1d6 delici hasar veren bir çene silahsız saldırısına sahipsinizdir. Çeneniz brawling grubundadır.

omen://ancestry/kholo/heritages/ant-kholo?source=paizo-pathfinder-player-core-2:
  name: Karınca Kholosu
  description: Yaklaşık 3 fit boyunda, keskin hatlı ve büyük kulaklı bir kholosunuz. Birçoğu sizin aslında bir kholo olduğunuza şüpheyle yaklaşır. Boyutunuz Orta yerine Küçüktür. Aldatmaca konusunda eğitimlisinizdir (Aldatmaca konusunda zaten eğitimliyseniz başka bir beceride). Özellikle masumiyet iddia ederken Yalan Söylemek için yapılan Aldatmaca testlerine, bu tür yalanları ortaya çıkarmaya yönelik Niyetini Tart testlerine karşı Aldatmaca ZD'nize ve inisiyatif için Aldatmaca zarı attığınızda inisiyatif testlerine +1 durumsal bonus kazanırsınız.

omen://ancestry/kholo/heritages/cave-kholo?source=paizo-pathfinder-player-core-2:
  name: Mağara Kholosu
  description: "Hikâye anlatıcıları, türünüzün çoğu ışığa çıkmadan önce kholoların mağaralarda ve yer altında yaşadığını iddia eden kadim hikâyeler anlatır. Benekler yerine kısa siyah kesiklere benzeyen izleriniz ve geniş göğsünüzle o kadim ataların bir yansımasısınız. Gözleriniz karanlıkta kusursuz görecek şekilde gelişmiştir; klanınız için değerli bir avantajdır. Karanlıkgörüş kazanırsınız."

omen://ancestry/kholo/heritages/dog-kholo?source=paizo-pathfinder-player-core-2:
  name: Köpek Kholosu
  description: "Tarih öncesine ait, neredeyse köpeğe benzer bir yapıya sahip, çevik gövdeli bir kholosunuz. Genellikle dört ayaklı gibi hareket etseniz de iki ayaklı gibi ayakta durabilir ve savaşabilirsiniz; bu da tüm teçhizatı normal şekilde kullanmanıza olanak tanır. Her iki eliniz de boşsa dört ayak üzerinde koşarken Hareket Hızınızı 30 fite çıkarabilirsiniz."

omen://ancestry/kholo/heritages/great-kholo?source=paizo-pathfinder-player-core-2:
  name: Ulu Kholo
  description: Postunuzdaki kahverengi benekler ve sarımsı kahve kürkünüzle heybetli, güçlü bir kholosunuz. Soyunuzdan 8 yerine 10 Can Puanı kazanırsınız ve Yerinden Oynatmak, İtmek veya Çelme Takmak için yapılan Atletizm testlerine +1 durumsal bonus kazanırsınız.

omen://ancestry/kholo/heritages/sweetbreath-kholo?source=paizo-pathfinder-player-core-2:
  name: Tatlınefes Kholo
  description: Avınızı büyülemek için kullanabileceğiniz, garip şekilde hoş kokan bir nefese sahip, çizgili, soluk kürk bir kholosunuz. Diplomasi konusunda eğitimlisinizdir (Diplomasi konusunda zaten eğitimliyseniz başka bir beceride). Hedef nefesinizin kokusunu alabiliyorsa İyi İzlenim Bırakmak için yapılan testlere de +1 durumsal bonus kazanırsınız.

omen://ancestry/kholo/heritages/winter-kholo?source=paizo-pathfinder-player-core-2:
  name: Kış Kholosu
  description: Daha soğuk bölgelerin çetin kışlarında hayatta kalmanızı sağlayan kalın, püsküllü bir kürkle kaplı dayanıklı bir kholosunuz. Seviyenizin yarısına eşit (en az 1) soğuk direnci kazanırsınız. Çevresel soğuk etkilerini bir kademe daha az aşırıymış gibi ele alırsınız (inanılmaz soğuk aşırı soğuk olur, aşırı soğuk şiddetli soğuk olur vb.).

omen://ancestry/kholo/heritages/witch-kholo?source=paizo-pathfinder-player-core-2:
  name: Cadı Kholosu
  description: Gerçekten tekinsiz sesler çıkarabilen, dağınık, koyu renk kürk bir kholosunuz. Hayal Kırıntısı kantripini istediğiniz zaman bir okült özgü büyü olarak yapabilirsiniz. Kantrip, seviyenizin yukarı yuvarlanmış yarısına eşit bir büyü derecesine yükseltilir. Ayrıca yalnızca sesinizi kullanırken Dikkat Dağıtmak ve Kılığına Bürünmek için yapılan testlere +1 durumsal bonus kazanırsınız.

omen://ancestry/kholo/kholo?source=paizo-pathfinder-player-core-2:
  name: Kholo
  description: >
    Khololar; acımasız akıncılar ve iblis tapanlar olarak kötü bir üne sahiptir. Birçoğu kholoların cadı, yamyam ve daha beteri olduğuna inanır. Gerçek ise daha karmaşıktır. Khololar son derece pratik ve pragmatik avcılar ve akıncılardır. Onlar için onur, anlamsız riskin diğer adıdır. Bir kholonun kaybı yalnızca bireyi değil, sürü arkadaşlarını ve akrabalarını da etkiler. Zafer dışında herhangi bir şeye zaman harcamak—ister merhamet ister zulüm olsun—neredeyse ahlaksızlık olarak görülür. Khololar pusuların, taktiksel yanıltmacaların ve psikolojik savaşın ustalarıdır. Kholoların ata tapınması ve içyamyamlık uygulamaları da aynı derecede yanlış anlaşılmaktadır. Khololar, ölülerini bir saygı göstergesi olarak tüketir; büyük bir şölen düzenler ve kemikleri sanat eserine ya da silahlara dönüştürürler. Khololar bu onuru saygı duydukları düşmanlarına da göstererek düşmanın kurnazlığını veya gücünü klana katmayı umarlar. xBV8oGvecw7abZxc


omen://ancestry/kobold/heritages/cavernstalker-kobold?source=paizo-pathfinder-player-core-2:
  name: Mağara Avcısı Kobold
  description: "İlksel toprak enerjisine sahip bir varlığa da ev sahipliği yapan dar tünelli bir yuvada yumurtadan çıktınız; bu da sizi çevik ve esnek kıldı. Kaya duvarlarına, sarkıtlara ve diğer doğal taş unsurlara Tırmanırken bir başarıda Hareket Hızınızın yarısıyla, bir kritik başarıda ise tam Hareket Hızınızla hareket edersiniz (ve Hızlı Tırmanma hüneriniz varsa bir başarıda tam Hareket Hızınızla hareket edersiniz). Bir tırmanma Hareket Hızı kullanıyorsanız bu sizi etkilemez. Dar Yerden Geçmek için bir Akrobasi testinde başarı elde ettiğinizde bunun yerine kritik başarı kazanırsınız."

omen://ancestry/kobold/heritages/dragonscaled-kobold?source=paizo-pathfinder-player-core-2:
  name: Ejder Pullu Kobold
  description: Yuvanızın bir ejderhayla olan bağı sayesinde pullarınız diğer koboldlarınkinden daha sağlamdır. Soyunuzdan 6 yerine 10 Can Puanı kazanırsınız. Ejderha nefesine, sleep özelliğine sahip etkilere ve sizi Felçli kılacak etkilere karşı kurtarışlara +1 durumsal bonus kazanırsınız.

omen://ancestry/kobold/heritages/elementheart-kobold?source=paizo-pathfinder-player-core-2:
  name: Element Yürekli Kobold
  description: "Yumurtadan çıktığınızda, bir element veya cin gibi Element Düzlemlerinden biriyle güçlü bir şekilde bağlantılı bir yaratığa bağlandınız. Element koruyucunuz için hava, toprak, ateş, metal, su veya tahta seçin. Element koruyucunuzla ilişkili hasar türüne karşı seviyenizin yarısına eşit (en az 1) direnç kazanırsınız: hava için soğuk, toprak için elektrik, ateş için ateş, metal için sonik, su için asit veya tahta için zehir."

omen://ancestry/kobold/heritages/spellhorn-kobold?source=paizo-pathfinder-player-core-2:
  name: Büyü Boynuzlu Kobold
  description: Güçlü bir büyü kaynağının yakınında yumurtadan çıktığınızdan beri onun bir izi damarlarınızda akar. Arkana büyü listesinden yaygın bir kantrip seçin. Bu Büyüyü istediğiniz zaman bir arkana özgü büyü olarak Yapabilirsiniz. Kantrip, seviyenizin yukarı yuvarlanmış yarısına eşit bir büyü derecesine yükseltilir. Büyü saldırı bonusu ve büyü ZD istatistiklerinde eğitimlisinizdir ve kantripcülük niteliğiniz Karizmadır.

omen://ancestry/kobold/heritages/strongjaw-kobold?source=paizo-pathfinder-player-core-2:
  name: Güçlü Çeneli Kobold
  description: Yuvanız, gerek doğal yırtıcılardan korunmaya yardımcı olması gerekse kudretli bir canavara duyulan hürmet nedeniyle güçlü çeneleri ve keskin dişleriyle tanınır. 1d6 delici hasar veren bir çene silahsız saldırısı kazanırsınız. Çeneniz brawling grubundadır ve finesse ile unarmed özelliklerine sahiptir.

omen://ancestry/kobold/heritages/tunnelflood-kobold?source=paizo-pathfinder-player-core-2:
  name: Tünel Seli Koboldu
  description: Doğal veya kazılmış su altı geçitleriyle örülü bir yuvada büyüdünüz ve güçlü bir sucul varlığın veya ilksel su varlığının etkisinde kaldınız. 15 fitlik bir yüzme Hareket Hızı kazanırsınız.

omen://ancestry/kobold/heritages/venomtail-kobold?source=paizo-pathfinder-player-core-2:
  name: Zehirli Kuyruk Kobold
  description: Yuvanızın zehirli bir yaratığa yakınlığı sayesinde, kuyruğunuzda ölümcül zehir salgılayan körelmiş bir mahmuzla doğdunuz. Kuyruk Zehri eylemini kazanırsınız.

omen://ancestry/kobold/kobold?source=paizo-pathfinder-player-core-2:
  name: Kobold
  description: >
    Her kobold gücün önemini içgüdüsel olarak anlar ve birçoğu, ister kudretli ejderhalar, acımasız ifritler, buyurgan periler veya hatta kadim eserler olsun, güce sahip olanlara hürmet etmeye meyillidir. Koboldlar bu ittifakları bir pragmatizm duygusuyla ararlar—sonuçta kadim bir ejderhaya hizmet eden bir kobolda kim zorbalık yapmaya cesaret edebilir?—ancak aynı zamanda bu tür güç odaklarının yakınında kuluçkalanan kobold yumurtaları yuvanın velinimetine benzer fiziksel özellikler (ve bazen yetenekler) kazandığı için de böyledir. Tek başlarına koboldlar hünerli zanaatkârlar ve sadık müttefiklerdir; ancak bölgelerine izinsiz giren yabancılar onları ilham verici akıncılar ve zeki pusucular olarak bulur. Yine de bu sürüngen fırsatçılar kendi lehlerine olduğunda diğer insansılarla iş birliği yapmaktan mutluluk duyar; geniş dünyada servetlerini kazanmak için temkin ve kurnazlığı birleştirirler. Kobold


omen://ancestry/lizardfolk/features/aquatic-adaptation?source=paizo-pathfinder-player-core-2:
  name: Suya Uyum
  description: Sürüngen biyolojiniz nefesinizi uzun süre tutmanıza olanak tanır. Nefes Kontrolü genel hünerini bonus hüner olarak kazanırsınız.

omen://ancestry/lizardfolk/features/claws?source=paizo-pathfinder-player-core-2:
  name: Pençeler
  description: Keskin pençeleriniz, diğer insansıların kavgaya getirdiği yumruklara bir alternatif sunar. 1d4 kesici hasar veren ve agile ile finesse özelliklerine sahip bir pençe silahsız saldırınız vardır.

omen://ancestry/lizardfolk/heritages/cliffscale-lizardfolk?source=paizo-pathfinder-player-core-2:
  name: Sarpkayalı Kertenkelesoy
  description: Ayak parmaklarınız tutunmaya ve tırmanmaya uyum sağlamıştır. Muharebe Tırmanıcısı hünerini bonus hüner olarak kazanırsınız ve ayakkabı giymediğiniz sürece ayaklarınızdaki yapışkan tabanları ellerinizi serbest bırakarak tırmanmak için kullanabilirsiniz. Ayrıca tırmanmak için yapılan bir Atletizm testinde başarı elde ettiğinizde bunun yerine kritik başarı kazanırsınız.

omen://ancestry/lizardfolk/heritages/cloudleaper-lizardfolk?source=paizo-pathfinder-player-core-2:
  name: Bulut Sıçrayan Kertenkelesoy
  description: Altınızdan geçen havayı yakalayan, uzuvlarınız boyunca uzanan deri kanatlarıyla vücudunuz hafiftir. Eylemde bulunabildiğiniz ve yeterli alanınız olduğu sürece hasar almaktan kaçınmaya yetecek kadar herhangi bir düşüşü yavaşlatmak için kanatları açabilirsiniz (bunu yapacak alana sahip olup olmadığınız GM'nin takdirine bağlıdır).

omen://ancestry/lizardfolk/heritages/frilled-lizardfolk?source=paizo-pathfinder-player-core-2:
  name: Yakalı Kertenkelesoy
  description: "Boyun yakanızı açabilir ve sırt dikenlerinizi gererek düşmanlarınıza Gözdağı Verebilirsiniz. Bunu yaptığınızda Gözdağı Ver, auditory özelliğini kaybeder ve visual özelliğini kazanır; ayrıca dilinizi anlamayan bir yaratığa Gözdağı Vermeye çalıştığınızda ceza almazsınız. Tehditkâr Yaklaşım eylemini de kazanırsınız."

omen://ancestry/lizardfolk/heritages/sandstrider-lizardfolk?source=paizo-pathfinder-player-core-2:
  name: Kum Gezen Kertenkelesoy
  description: Kalın pullarınız su tutmanıza ve güneşin parıltısıyla mücadele etmenize yardımcı olur. Seviyenizin yarısına eşit (en az 1) ateş direnci kazanırsınız. Çevresel sıcaklık etkileri sizin için bir kademe daha az aşırıdır ve açlık ya da susuzluktan etkilenmeden önce normalden 10 kat daha uzun süre dayanabilirsiniz. Ancak koruyucu donanım giymediğiniz veya bir sığınağa çekilmediğiniz sürece çevresel soğuk etkileri sizin için bir kademe daha aşırıdır.

omen://ancestry/lizardfolk/heritages/unseen-lizardfolk?source=paizo-pathfinder-player-core-2:
  name: Görünmez Kertenkelesoy
  description: Tek bir eylemle küçük değişimler ve bir saat boyunca dramatik değişiklikler yaparak çevrenize uyum sağlamak için deri renginizi değiştirebilirsiniz. Renginizin çevreye kabaca benzediği bir alandayken (örneğin bir ormanda orman yeşili), çevrenize karışmanıza yardımcı olacak bölgesel değişiklikler yapmak için bu yeteneğin küçük, tek eylemli uygulamasını kullanabilir ve çevrenizin rengi ya da deseni değişene kadar Gizlilik testlerine +2 durumsal bonus kazanırsınız.

omen://ancestry/lizardfolk/heritages/wetlander-lizardfolk?source=paizo-pathfinder-player-core-2:
  name: Sulakalan Kertenkelesoyu
  description: Aileniz en yaygın kertenkelesoy mirasından gelmektedir ve su ortamlarına alışıksınızdır. 15 fitlik bir yüzme Hareket Hızı kazanırsınız.

omen://ancestry/lizardfolk/heritages/woodstalker-lizardfolk?source=paizo-pathfinder-player-core-2:
  name: Orman Avcısı Kertenkelesoy
  description: Her dalı veya çalıyı kullanarak sık orman ve balta girmemiş ormanlarda kolayca hareket edersiniz. Orman veya balta girmemiş orman arazisindeyken, normalde arkasında Siper Alabileceğiniz bir engelin yanında olmasanız bile siper kazanmak için her zaman Siper Al eylemini kullanabilirsiniz. Gizlilik konusunda eğitimli olmasanız bile Arazi Pusucusu hünerini kazanırsınız ve seçtiğiniz arazi olarak çalılık seçmelisiniz.

omen://ancestry/lizardfolk/lizardfolk?source=paizo-pathfinder-player-core-2:
  name: Kertenkelesoy
  description: >
    Kertenkelesoylar; elflerce bile kadim sayılan imparatorlukların vârisleri, kusursuz hayatta kalanlardır. Lizardfolk


omen://ancestry/ratfolk/features/sharp-teeth?source=paizo-pathfinder-player-core-2:
  name: Sivri Dişler
  description: Belirgin kesici dişleriniz, diğer insansıların kavgaya getirdiği yumruklara bir alternatif sunar. 1d4 delici hasar veren, brawling grubunda yer alan ve agile ile finesse özelliklerine sahip bir çene silahsız saldırınız vardır.

omen://ancestry/ratfolk/heritages/deep-rat?source=paizo-pathfinder-player-core-2:
  name: Derinlik Sıçanı
  description: Atalarınız diğer sıçansoylardan daha derin yer altında yaşamıştır ve bu da size karanlıkta görme yeteneği kazandırır. Karanlıkgörüş kazanırsınız.

omen://ancestry/ratfolk/heritages/desert-rat?source=paizo-pathfinder-player-core-2:
  name: Çöl Sıçanı
  description: Kurak ovaların yerlisisiniz ve muhtemelen yollarda seyahat ederek büyüdünüz. Her iki eliniz de boşsa dört ayak üzerinde koşarken Hareket Hızınızı 30 fite çıkarabilirsiniz. Ayrıca çevresel sıcaklık etkileri sizin için bir derece daha az aşırıdır ve açlık ya da susuzluktan etkilenmeden önce normalden 10 kat daha uzun süre dayanabilirsiniz. Ancak koruyucu donanım giymediğiniz veya bir sığınağa çekilmediğiniz sürece çevresel soğuk etkileri sizin için bir derece daha aşırıdır.

omen://ancestry/ratfolk/heritages/longsnout-rat?source=paizo-pathfinder-player-core-2:
  name: Uzun Burunlu Sıçan
  description: >
    Uzun burnunuz size çoğu sıçansoydan daha keskin bir koku alma duyusu verir. 30 fit menzile sahip belirsiz koku duyusu kazanırsınız. Bu, bir yaratığın konumunu belirlemek için koku alma duyunuzu kullanabileceğiniz anlamına gelir. Yaratığa göre rüzgâr altındaysanız GM genellikle bu menzili iki katına çıkarır, rüzgâr üstündeyseniz menzili yarıya indirir. Ayrıca koku menzilinizdeki bir yaratığı veya nesneyi Taramak için yapılan Dikkat testlerine +2 durumsal bonus kazanırsınız.


omen://ancestry/ratfolk/heritages/sewer-rat?source=paizo-pathfinder-player-core-2:
  name: Kanalizasyon Sıçanı
  description: Büyük bir yerleşimin altındaki kanalizasyonlarda topluluk kurmuş köklü bir sıçansoy silsilesinden gelirsiniz. Kokuşmuş veba hastalığına karşı bağışıksınızdır. Hastalıklara ve zehirlere karşı kurtarışlara +1 durumsal bonus kazanırsınız. Bir hastalığa veya zehre karşı kurtarışta başarı elde ettiğinizde bunun yerine kritik başarı kazanırsınız. Kurtarışı bu şekilde geliştirecek farklı bir yeteneğiniz varsa (örneğin Savaşta Pişmiş dövüşçü sınıf özelliği), kurtarışta kritik başarısızlık elde ederseniz bunun yerine başarısızlık kazanırsınız.

omen://ancestry/ratfolk/heritages/shadow-rat?source=paizo-pathfinder-player-core-2:
  name: Gölge Sıçanı
  description: >
    Atalarınız yer altındaki karanlık alanlarda yaşadı ve bu size koyu renk bir kürk ile hafifçe tekinsiz bir eda kazandırdı. Gözdağı konusunda eğitimli uzmanlık derecesi kazanırsınız ve hayvanları Tehditle Zorlamak için Gözdağı kullanabilirsiniz. Bir hayvana Gözdağı Verdiğinizde onunla bir dili paylaşmadığınız için ceza almazsınız. Gözdağı konusunda otomatik olarak eğitimli hâle gelecekseniz (örneğin geçmişinizden veya sınıfınızdan), seçtiğiniz başka bir beceride eğitimli olursunuz. Hayvanların size karşı tavırları normalden bir derece daha kötü başlar; evcil hayvanlar için kayıtsız yerine genellikle düşmanca olmayan, vahşi hayvanlar içinse düşmanca olmayan yerine düşmanca tavırla başlar.


omen://ancestry/ratfolk/heritages/snow-rat?source=paizo-pathfinder-player-core-2:
  name: Kar Sıçanı
  description: "Soğuğa karşı korunmak için daha kalın bir kürkünüz ve daha iri bir cisseniz vardır; bu da size seviyenizin yarısına eşit (en az 1) soğuk direnci kazandırır. Çevresel soğuk etkilerini bir kademe daha az aşırıymış gibi ele alırsınız (inanılmaz soğuk aşırı soğuk olur, aşırı soğuk şiddetli soğuk olur vb.)."

omen://ancestry/ratfolk/heritages/tunnel-rat?source=paizo-pathfinder-player-core-2:
  name: Tünel Sıçanı
  description: Vücudunuzu kolayca sıkıştırabilir ve boşluklardan sıyrılabilirsiniz. Akrobasi konusunda eğitimli olmasanız bile Hızlı Sıyrılma hünerini bonus hüner olarak kazanırsınız. Dar Yerden Geç eylemini gerektirecek kadar dar olmayan sıkışık alanlar sizin için zorlu arazi sayılmaz.

omen://ancestry/ratfolk/ratfolk?source=paizo-pathfinder-player-core-2:
  name: Sıçansoy
  description: >
    Ysokiler, yüzeyde yaşayan çoğu insansının "sıçansoy" olarak adlandırdığı varlıklardır. Belirli bir evde 100'e kadar bireyin yaşadığı, sıkışık koşulları tercih eden toplulukçu bir halktır. Kasabada ev bulamazlarsa sıçansoylar bunun yerine mağaralarda ve mağara komplekslerinde yaşayabilir; zira buralar ticaret seferlerinden getirdikleri çok çeşitli mallar için mükemmel bir depolama alanı sağlar. Ratfolk


omen://ancestry/tengu/features/sharp-beak?source=paizo-pathfinder-player-core-2:
  name: Sivri Gaga
  description: Keskin gaganızla asla silahsız kalmazsınız. 1d6 delici hasar veren bir gaga silahsız saldırınız vardır. Gaganız brawling silah grubundadır ve finesse ile unarmed özelliklerine sahiptir.

omen://ancestry/tengu/heritages/dogtooth-tengu?source=paizo-pathfinder-player-core-2:
  name: Köpek Dişli Tengu
  description: Bir gaganın yanı sıra ağzınızda çok sayıda hırçın, sivri diş de bulunur. Bazı efsaneler güçlü çenelerinizin çeliği bile ısırıp koparabildiğini iddia eder. Henüz o kadar güçlü olmasanız da sivri dişleriniz yine de korkunç yaralar açabilir. Gaga silahsız saldırınız deadly d8 özelliği kazanır.

omen://ancestry/tengu/heritages/jinxed-tengu?source=paizo-pathfinder-player-core-2:
  name: Uğursuz Tengu
  description: Soyunuz lanet üstüne lanete maruz kalmıştır ve artık bunlar tüylerinizden yağmur gibi kayıp gider. Bir lanet veya talihsizlik etkisine karşı bir kurtarışta başarılı olursanız, bunun yerine kritik başarı elde edersiniz. Lanetlenmiş durumunu kazanacağınız zaman bir deneyin. Bir başarıda kazanacağınız lanetlenmiş durumunun değerini 1 azaltın.

omen://ancestry/tengu/heritages/mountainkeeper-tengu?source=paizo-pathfinder-player-core-2:
  name: Dağ Muhafızı Tengu
  description: Dünyanın ve Ulu Ötelerin ruhlarıyla aranızda bir bağ bırakan tengu münzevileri soyundan gelirsiniz. Canlılık Kırbacı kantripini istediğiniz zaman bir ilksel özgü büyü olarak yapabilirsiniz. Kantrip, seviyenizin yukarı yuvarlanmış yarısına eşit bir büyü derecesine yükseltilir. Bir tengu mirasından veya soy hünerinden bir büyü yaptığınız her defasında, bunun ilahi mi yoksa ilksel bir büyü mü olduğuna karar verebilirsiniz.

omen://ancestry/tengu/heritages/skyborn-tengu?source=paizo-pathfinder-player-core-2:
  name: Gökdoğumlu Tengu
  description: Kemikleriniz özellikle hafif olabilir, kanatlı nadir bir tengu olabilirsiniz veya rüzgâr ve gökyüzü ruhlarıyla olan bağınız çoğundan daha güçlü olup havadaki inişinizi yavaşlatıyor olabilir. Düştüğünüz mesafe ne olursa olsun düşmekten hasar almazsınız.

omen://ancestry/tengu/heritages/stormtossed-tengu?source=paizo-pathfinder-player-core-2:
  name: Fırtınayla Savrulan Tengu
  description: İster Hei Feng'in bir lütfu olsun ister bir bora sırasında yumurtadan çıkmış olun, fırtınalara karşı dirençlisinizdir. Seviyenizin yarısına eşit (en az 1) elektrik direnci kazanırsınız. Bir yaratık yalnızca yağmur veya sis nedeniyle gizlenmişse, Gizlenmiş o yaratığı hedeflemek için yapılan düz testte otomatik olarak başarılı olursunuz.

omen://ancestry/tengu/heritages/taloned-tengu?source=paizo-pathfinder-player-core-2:
  name: Pençeli Tengu
  description: Pençeleriniz en az gaganız kadar keskin ve güçlüdür. 1d4 kesici hasar veren bir pençe silahsız saldırısı kazanırsınız. Pençeleriniz brawling grubundadır ve agile, finesse, unarmed ile versatile P özelliklerine sahiptir.

omen://ancestry/tengu/heritages/wavediver-tengu?source=paizo-pathfinder-player-core-2:
  name: Dalgaya Dalan Tengu
  description: Bir kuşun havayı yarması gibi suyu yarabilen nadir tengulardan birisiniz ve genellikle nehirlerde veya okyanuslarda pek az kişinin sizi beklediği yerlerde pusuya yatarsınız. 15 fitlik bir yüzme Hareket Hızı kazanırsınız.

omen://ancestry/tengu/tengu?source=paizo-pathfinder-player-core-2:
  name: Tengu
  description: >
    Tengular; yaban hayatta yaşamakla yoğun şehirlerde kendilerine bir yer bulma konusunda eşit derecede rahat olan hayatta kalıcılar ve sohbet ehlidirler. Seyahat ettikçe koleksiyonlarına katarak bilgi, alet ve yoldaş biriktirirler. Tengu


omen://ancestry/tripkee/features/natural-climber?source=paizo-pathfinder-player-core-2:
  name: Doğuştan Tırmanıcı
  description: Tırmanmak için yapılan Atletizm testlerine +2 durumsal bonus kazanırsınız.

omen://ancestry/tripkee/heritages/poisonhide-tripkee?source=paizo-pathfinder-player-core-2:
  name: Zehirli Derili Tripkee
  description: Küçük olabilirsiniz ancak vücudunuzun dört bir yanına gizlenmiş zehir bezleri ölümcül bir savunma saklar. Zehirli Ten tepkisini kazanırsınız.

omen://ancestry/tripkee/heritages/riverside-tripkee?source=paizo-pathfinder-player-core-2:
  name: Nehir Kenarı Tripkee
  description: Atalarınız suda ve su üzerinde yaşamıştır. 15 fitlik bir yüzme Hareket Hızı kazanırsınız.

omen://ancestry/tripkee/heritages/snaptongue-tripkee?source=paizo-pathfinder-player-core-2:
  name: Şaklayan Dilli Tripkee
  description: Diliniz özellikle uzundur ve onu olağanüstü bir menzil ve hassasiyetle fırlatabilirsiniz. Dilinizi temas menziline sahip büyüleri iletmek ve kilitli olmayan bazı kapı türlerini açmak gibi son derece basit Etkileşime Gir eylemlerini gerçekleştirmek için kullanabilirsiniz. Diliniz, başarılı olmak için bir test gerektiren herhangi bir eylem de dâhil olmak üzere parmak veya önemli ölçüde el becerisi gerektiren eylemleri gerçekleştiremez ve onu eşyaları tutmak için kullanamazsınız.

omen://ancestry/tripkee/heritages/stickytoe-tripkee?source=paizo-pathfinder-player-core-2:
  name: Yapışkan Parmaklı Tripkee
  description: Elleriniz ve ayaklarınız yüzeylere yapışmalarına yardımcı olan bir katman salgılar. Sizi Silahsızlandırma, İtme, Yerinden Oynatma veya Çelme Takma girişimlerine karşı Dayanıklılık ve Refleks ZD'nize +2 durumsal bonus kazanırsınız. Ağaçlara, asmalara ve diğer bitki örtüsüne tırmanırken Tırmanmak için yapılan Atletizm testinde başarı elde ettiğinizde bunun yerine kritik başarı kazanırsınız.

omen://ancestry/tripkee/heritages/thickskin-tripkee?source=paizo-pathfinder-player-core-2:
  name: Kalın Derili Tripkee
  description: Kalın kösele deriniz bir karakurbağasınınkini andırır. Soyunuzdan 6 yerine 8 Can Puanı kazanırsınız. Hastalıklara ve zehirlere karşı Dayanıklılık kurtarışlarına +1 durumsal bonus kazanırsınız.

omen://ancestry/tripkee/heritages/windweb-tripkee?source=paizo-pathfinder-player-core-2:
  name: Rüzgâr Perdeli Tripkee
  description: Elleriniz ve ayak parmaklarınız boyunca uzanan sert perdeler her türlü düşüşü yavaşlatabilir. Bir eliniz boş olduğu sürece, düştüğünüz mesafe ne olursa olsun düşme hasarı almazsınız.

omen://ancestry/tripkee/tripkee?source=paizo-pathfinder-player-core-2:
  name: Tripkee
  description: >
    Tripkeeler, genellikle başkalarının işlerine karışmaktan kaçınmaya çalışan utangaç ve temkinli bir halktır. Temkinli bakış açılarına ve küçük yapılı oluşlarına rağmen, maceraperest tripkeeler durum gerektirdiğinde cesur ve asil adımlar atarlar. FhIJtKcINEe7fipX
