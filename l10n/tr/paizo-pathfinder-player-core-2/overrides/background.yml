# tr overrides: background

omen://background/amnesiac?source=paizo-pathfinder-player-core-2:
  name: Hafıza Kaybı
  description: >
    Geçmişiniz... şey... dürüst olmak gerekirse hatırlamıyorsunuz! Zihninizin derinliklerinde bazı sezgileriniz, olağandışı duyguların dip dalgaları veya belirli insanlara ya da durumlara karşı beklenmedik tepkileriniz olabilir; ancak nihayetinde bir zamanlar kim olduğunuzu bilmiyorsunuz. Özellikle kendinizi keşfetmeye yardımcı olmak için maceraya atılmış olabilirsiniz. Karakterinizin geçmiş hikâyesinin ardındaki gerçeği nasıl ele alacağınız size ve GM'ye kalmıştır. Bir sır olarak kalması için bunu GM'ye bırakabilir, GM ile birlikte çalışabilir veya daha sonraya kadar kararlaştırılmamış bırakmayı bile seçebilirsiniz. Her durumda, geçmişinize dair ilk ipuçlarını elde etmek için siz ve GM'niz karakteriniz veya eşyaları hakkında dikkate değer birkaç ayrıntı belirlemelisiniz. Üç serbest nitelik artışı kazanırsınız. İkisini siz seçersiniz ve üçüncüsünü karakterinizin olası geçmişine dair ilk sezgilerine dayanarak GM seçer.


omen://background/astrologer?source=paizo-pathfinder-player-core-2:
  name: Müneccim
  description: >
    Müneccimler işaretler ve kehanetler için yıldızlara bakar, göklerdeki konumlarını altlarında yaşayanların rotalarını çizmek için kullanırlar. Göksel küreler hareket ettikçe kaderin kendisi de hareket eder. Yıldızları incelediniz ve onların rehberliğine dayanarak yolunuzu sezmeyi öğrendiniz. İster yıldızlar sizi doğrudan bir macera hayatına çağırmış olsun, ister keşfetme arzunuza rehberlik etmesi için yıldızları kullanın, bir macera hayatında yıldızların rehberliğini yaşıyorsunuz. İki nitelik artışı seçin. Biri Zekâ veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır. Okültizm ve Astroloji İlimi konusunda eğitimlisiniz. Tuhaflık Teşhisi beceri hünerini kazanırsınız.


omen://background/barber?source=paizo-pathfinder-player-core-2:
  name: Berber
  description: >
    Saç kesimi, diş hekimliği, kan alma ve cerrahi—eğer sabit bir el ve ustura gerektiriyorsa, bunu yapabilirsiniz. Becerilerinizi geliştirmek veya hastalarınızı bu denli hırpalanmış ve yaralanmış bırakan bir dünyaya karşı kendinizi sınamak için yollara düşmüş olabilirsiniz. İki nitelik artışı seçin. Biri Çeviklik veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır. Tıp becerisinde ve Cerrahi İlimi becerisinde eğitimlisiniz. Riskli Cerrahi beceri hünerini kazanırsınız.


omen://background/blessed?source=paizo-pathfinder-player-core-2:
  name: Kutsanmış
  description: >
    Bir ilahiyat tarafından kutsandınız. Bilinmeyen bir nedenle ve gerçek inançlarınızdan bağımsız olarak, bir ilah size iyi veya kötü amaçlarla kullanabileceğiniz bir lütufta bulundu. Kutsanmanız, mücadelelerinizde size yardımcı olacak bilgelik ve kavrayış sağlar. Sizi kutsayan varlığın kimliğini bilebilir veya bilmeyebilirsiniz ve kutsama, daha sonra keşfedeceğiniz bir bedelle birlikte gelebilir. İki nitelik artışı seçin. Biri Bilgelik veya Karizma olmalı ve diğeri serbest nitelik artışıdır. Kimliğini biliyorsanız sizi kutsayan ilahla ilişkili bir İlim becerisinde (Shelyn İlimi gibi), bilmiyorsanız GM'nin seçtiği bir İlim becerisinde eğitimlisiniz. Rehberlik büyüsünü istediğiniz zaman ilahi bir özgü büyü olarak yapabilirsiniz ya da GM tarafından belirlenen benzer bir lütuf kazanırsınız.


omen://background/bookkeeper?source=paizo-pathfinder-player-core-2:
  name: Muhasebeci
  description: >
    Büyük bir çiftlikte, bir tüccarın girişimlerinde veya şehirdeki büyük bir loncada hesapları tuttunuz. İyisiyle kötüsüyle giderleri, bordroları, kârları ve parayla ilgili diğer her şeyi takip ettiniz. İyi durumdaysanız, başkalarının bu ticareti nasıl icra ettiğini öğrenmek için maceraya atılıyor olabilirsiniz. Kötü durumdaysanız, kimsenin sizi bulamaması umuduyla yaklaşan sonuçlardan kaçıyor olabilirsiniz. İki nitelik artışı seçin. Biri Zekâ veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır. Sosyoloji becerisinde ve Muhasebe İlimi becerisinde eğitimlisiniz. Sayı Gözü beceri hünerini kazanırsınız.


omen://background/courier?source=paizo-pathfinder-player-core-2:
  name: Ulak
  description: >
    Gençliğinizde kalabalık şehir sokaklarında hızla ilerleyerek zengin ve nüfuzlu kişiler için mesaj taşıyıp para kazandınız. Mesajınızı ulaştırmaya yönelik kararlı bağlılığınız, bir maceracının hayatı için iyi bir eğitim oldu. İki nitelik artışı seçin. Biri Çeviklik veya Zekâ olmalı ve diğeri serbest nitelik artışıdır. Sosyoloji becerisinde ve büyüdüğünüz şehir için İlim becerisinde eğitimlisiniz. İçeriği Çıkar beceri hünerini kazanırsınız.


omen://background/cursed?source=paizo-pathfinder-player-core-2:
  name: Lanetli
  description: >
    Kişisel veya kalıtsal bir lanetin kurbanısınız. Büyük bir çaba ve okült çalışmalar sayesinde, lanetin en kötü etkilerini savuşturmayı öğrendiniz ve dolayısıyla kendinizi diğer zararlı büyülere karşı koruyabilirsiniz. Ancak lanet hâlâ üzerinizdedir ve bazen tehlikeli şekillerde tezahür eder. İki nitelik artışı seçin. Biri Zekâ veya Karizma olmalı ve diğeri serbest nitelik artışıdır. Okültizm ve Lanet İlimi konusunda eğitimlisiniz. Koruyucu İşaret reaksiyonunu kazanırsınız. Şimdilik çoğunu savuşturmuş olsanız da siz ve GM lanetin tüm etkilerini belirlemelisiniz. GM, genellikle en azından sabit veya çok sık tematik bir etki ve ara sıra daha tehlikeli etkiler içeren lanetin üzerinizdeki kalıcı tezahürlerini belirler.


omen://background/feral-child?source=paizo-pathfinder-player-core-2:
  name: Yabani Çocuk
  description: >
    Gençliğinizi vahşi doğada, hayvanların yakınında yaşayarak veya belki de hayvanlar tarafından büyütülerek geçirdiniz. Bu hayvanlarla yakın, mistik bir bağınız vardır ve zihinsel uğraşlardaki çok yönlülüğünüzü sınırlamış olsa da onlardan belirli yetenekler kazandınız. Bir nitelik artışı seçin. Kuvvet, Çeviklik veya Dayanıklılık olmalıdır. Doğa ve Hayatta Kalma konusunda eğitimlisiniz. Alacakaranlık görüşü (zaten alacakaranlık görüşünüz varsa karanlık görüşü), 30 fit menzilli belirsiz koku alma duyusu ve Yiyecek Arayıcısı beceri hünerini kazanırsınız.


omen://background/feybound?source=paizo-pathfinder-player-core-2:
  name: Peri Bağlısı
  description: >
    İlk Dünya'da veya perilerin başka bir diyarında zaman geçirdiniz ve tamamen eskiden olduğunuz kişi değilsiniz. Belki de efsanevi Witchmarket'tan bir alışveriş yaptınız veya peri yiyecek ve şarabından bolca tattınız. Durum ne olursa olsun, isteyerek veya farkında olmadan perilerle bir pazarlık yaptınız ve bu pazarlığın getirdiği faydalar bir bedelle gelir. İki nitelik artışı seçin. Biri Çeviklik veya Karizma olmalı ve diğeri serbest nitelik artışıdır. Peri İlimi konusunda eğitimlisiniz ve Peri Talihi serbest eylemini kazanırsınız. Perilerle yaptığınız anlaşmanın bir parçası olarak bazı kurallara veya sınırlamalara uymalısınız. Kuralı ihlal ederseniz, Doğa becerisini kullanan başarılı bir Keffaret ritüelinin etkilerini alana kadar Peri Talihi'ni kaybedersiniz. Kesin sınırlama size ve GM'ye kalmıştır, ancak en yaygın gereksinim, adınızı bilen herhangi bir perinin tek bir isteğini yerine getirmeniz gerektiğidir.


omen://background/haunted?source=paizo-pathfinder-player-core-2:
  name: Musallatlı
  description: >
    İster çocukluğunuzdan beri ister önemli bir olaydan bu yana bir ruh veya varlık tarafından takip ediliyorsunuz. Siz ve başkaları bu varlığı görmüş olabilirsiniz. Durumunuzu anlamaya çalışarak ezoterik konular üzerinde çalıştınız, ancak hayatınızdaki bu varlık bir gizem olarak kalmaya devam ediyor. Bu varlık ne olursa veya ne isterse istesin, hayatınızı ince yollarla ve her zaman iyi yönde olmayacak şekilde etkiler. Bazen varlık size yardım eder, ancak diğer zamanlarda etkisi kötü niyetli veya zararlıdır. Varlığın en çok stresli durumlarda ortaya çıkması muhtemeldir. İki nitelik artışı seçin. Biri Bilgelik veya Karizma olmalı ve diğeri serbest nitelik artışıdır. Okültizm konusunda ve GM tarafından belirlenen, musallat olan varlığın yetkin olduğu ek bir beceride eğitimlisiniz. Varlığın becerisi için her beceri testi denediğinizde, GM sanki varlık size Yardım Ediyormuş gibi teste +1 durumsal bonus teklif edebilir. Kabul eder ancak testi başaramazsanız Korkmuş 2 olursunuz (kritik başarısızlıkta Korkmuş 4). İlk Korkmuş değeri, durumu azaltacak veya önleyecek etkilerle azaltılamaz (bir savaşçının cesareti gibi).


omen://background/insurgent?source=paizo-pathfinder-player-core-2:
  name: İsyancı
  description: >
    Bir asiden daha fazlasıydınız; yeni veya daha iyi bir ülke vaadi için savaşan bir devrimciydiniz. Dava yoluna hâlâ inanıyor veya inanmıyor olabilirsiniz ya da belki de zafer veya sürgün, zaferinizi haykırmak... veya yenilginizin sonuçlarından kaçmak için sizi bu yeni yolculuğa çıkarmıştır. İki nitelik artışı seçin. Biri Kuvvet veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır. Aldatma becerisinde ve Savaş İlimi becerisinde eğitimlisiniz. Uzun Dikkat Dağıtma beceri hünerini kazanırsınız.


omen://background/outrider?source=paizo-pathfinder-player-core-2:
  name: Öncü Süvari
  description: >
    Gençliğinizde yerleşim yeriniz, bir ordu veya başka bir grup için öncü olarak hizmet vererek engin çayırlarda at koşturdunuz. Birçok farklı toprak görmek, dünyanın yanından sadece hızla geçmek yerine onu keşfetme ve maceralara atılma arzusunu içinizde uyandırdı. İki nitelik artışı seçin. Biri Dayanıklılık veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır. Doğa becerisinde ve Ova İlimi becerisinde eğitimlisiniz. Süratli Süvari beceri hünerini kazanırsınız.


omen://background/pilgrim?source=paizo-pathfinder-player-core-2:
  name: Hac Yolcusu
  description: >
    Gençliğinizde önemli tapınaklara ve kutsal mekânlara birçok hac ziyareti yaptınız. Gezgin bir keşiş, dini emanetler (gerçek veya sahte) satan biri veya sadece inancının gereklerini yerine getiren basit bir çiftçi olabilirsiniz. Artık yolculuklarınızın amacı ne olursa olsun, inancınız sizi yollarda hâlâ korur. İki nitelik artışı seçin. Biri Bilgelik veya Karizma olmalı ve diğeri serbest nitelik artışıdır. Din becerisinde ve hamisi olduğunuz ilahın İlim becerisinde eğitimlisiniz. Hac Yolcusu Nişanı beceri hünerini kazanırsınız.


omen://background/refugee?source=paizo-pathfinder-player-core-2:
  name: Mülteci
  description: >
    Savaş, salgın hastalık veya sadece fırsat arayışı yüzünden sürüklendiğiniz, şu anda içinde bulunduğunuz yerden çok uzak bir diyardan geliyorsunuz. Kökeniniz veya evinizi terk etme nedeniniz ne olursa olsun, kendinizi bu yeni diyarda bir yabancı olarak buluyorsunuz. Maceracılık, en çok ihtiyacı olanlara umut sunarken kendinizi geçindirmenin bir yoludur. İki nitelik artışı seçin. Biri Dayanıklılık veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır. Sosyoloji becerisinde ve geldiğiniz yerleşim yeriyle ilgili bir İlim becerisinde eğitimlisiniz. Sokak Görmüş beceri hünerini kazanırsınız.


omen://background/returned?source=paizo-pathfinder-player-core-2:
  name: Ölümden Dönen
  description: >
    Öldünüz ve ölümün ötesindeki diyarların bilgisiyle ve yaşama daha güçlü bir bağla mucizevi bir şekilde geri döndünüz. Bazı ölü ve hortlak ruhlar sizinle garip, içgüdüsel bir akrabalık hissedebilir. İki nitelik artışı seçin. Biri Dayanıklılık veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır. Zor Ölür hünerini ve Boneyard İlimi için Ek İlim hünerini kazanırsınız.


omen://background/root-worker?source=paizo-pathfinder-player-core-2:
  name: Kök Şifacısı
  description: >
    Bazı rahatsızlıklar sadece şifalı otlarla tedavi edilemez. Ağrıları dindirmek ve kem gözü savuşturmak için doğa ruhlarına yakararak ritüel tedaviler de öğrendiniz. Maceracılarla birlik olmak yolda size yoldaşlık sağladığı gibi sizi sahtekâr—ya da daha kötüsü—olarak damgalayacak kişilerden de koruma sağladı. İki nitelik artışı seçin. Biri Zekâ veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır. Okültizm becerisinde ve Bitkicilik İlimi becerisinde eğitimlisiniz. Kök Büyüsü beceri hünerini kazanırsınız.


omen://background/royalty?source=paizo-pathfinder-player-core-2:
  name: Hanedan Mensubu
  description: >
    Kraliyet ailesinin önde gelen bir üyesisiniz. Kraliyet hayatının günlük rutinlerinden kaçındınız ve maceralı bir göreve atıldınız—belki tahtını geri kazanmayı uman tahttan indirilmiş bir kraliçe, daha heyecanlı bir hayat arayan bir prens ya da gizli bir görevdeki hükümdar vârisisiniz. İki nitelik artışı seçin. Biri Zekâ veya Karizma olmalı ve diğeri serbest nitelik artışıdır. Sosyoloji konusunda eğitimlisiniz. Saray Nezaketi beceri hünerini kazanırsınız ve ailenizin topraklarındaki halkın yanı sıra her yerdeki soyluları etkileyebilirsiniz. Daha sonra Bağlantıları Kullan beceri hünerini kazanırsanız, kraliyet ailenizin topraklarındaki herhangi bir topluluk içinde otomatik olarak halktan ve soylu bağlantılarına sahip olursunuz ve bölgeniz dışındaki büyük topluluklarda da soylu bağlantılarına sahip olursunuz.


omen://background/saboteur?source=paizo-pathfinder-player-core-2:
  name: Sabotajcı
  description: >
    İster kişisel zevk için yapın ister bir paralı asker birliğinin veya askeri örgütün emriyle, bir şeyleri yok etme konusunda özel bir yeteneğiniz vardır. Bir nesnenin veya yapının zayıf noktalarını sezer ve bir çekiç darbesini veya simyasal bombayı nereye indireceğinizi bilirsiniz. Becerilerinizi geliştirmek veya belirli bir görevi tamamlamak için maceraya atılırsınız. İki nitelik artışı seçin. Biri Kuvvet veya Çeviklik olmalı ve diğeri serbest nitelik artışıdır. Hırsızlık becerisinde ve Mühendislik İlimi becerisinde eğitimlisiniz. Gizleyici El Çabukluğu beceri hünerini kazanırsınız.


omen://background/scavenger?source=paizo-pathfinder-player-core-2:
  name: Hurdacı
  description: >
    Toplumun çöpe attığı şeyleri ayıklayarak geçiminizi sağladınız. Sadece hayatta kalmak için hurdacılık yapmış olabilir veya paçavracı, gübre taşıyıcısı veya benzeri bir iş yapmış olabilirsiniz. O hayatı geride bırakmış olsanız da alışkanlıktan ötürü bir gözünüzü hâlâ yerde tutarsınız. İki nitelik artışı seçin. Biri Zekâ veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır. Hayatta Kalma becerisinde ve hurdacılık yaparak büyüdüğünüz yerleşim yeri için İlim becerisinde eğitimlisiniz. Yiyecek Arayıcısı beceri hünerini kazanırsınız.


omen://background/servant?source=paizo-pathfinder-player-core-2:
  name: Hizmetkâr
  description: >
    Soylulara hizmet eden ve evin sırdaşlarından biri olarak onların güvenini kazanan bir kulluk rolü üstlendiniz. İyi şartlarda ayrılmış olabilirsiniz ya da eski işverenleriniz hakkında tehlikeli sırlar biliyor olabilirsiniz. Ne olursa olsun, bir değişiklik için maceraya atılıyorsunuz ve bu yeni rolde öğrendiğiniz becerilerin artık size hizmet ettiğini görüyorsunuz. İki nitelik artışı seçin. Biri Çeviklik veya Karizma olmalı ve diğeri serbest nitelik artışıdır. Sosyoloji becerisinde ve İşçilik İlimi becerisinde eğitimlisiniz. Dudak Oku beceri hünerini kazanırsınız.


omen://background/squire?source=paizo-pathfinder-player-core-2:
  name: Silahtar
  description: >
    Bir şövalyenin yanında eğitim aldınız, teçhizatlarının bakımını yaptınız ve turnuvalarda ve savaşta onları desteklediniz. Şimdi tam şövalyeliğe lâyık olduğunuzu kanıtlayacak bir meydan okuma arıyorsunuz ya da daha az resmi olsa da dürüst bir çatışmada kendinizi sınamak için tantanayı ve törenleri bir kenara bıraktınız. İki nitelik artışı seçin. Biri Kuvvet veya Dayanıklılık olmalı ve diğeri serbest nitelik artışıdır. Atletizm becerisinde ve seçiminize göre Arma İlimi veya Savaş İlimi becerisinde eğitimlisiniz. Zırh Kuşanma Desteği beceri hünerini kazanırsınız.


omen://background/tax-collector?source=paizo-pathfinder-player-core-2:
  name: Vergi Memuru
  description: >
    Nefret edilen ancak gerekli olan biri olarak, vergilerin vadesi geldiğinde siz gönderilirdiniz. İşinizi yapmak seyahat ve ikna gerektirmiş olabilir ya da ticaret üzerinden vergi toplamaktan sorumluydunuz. Her iki durumda da bazen ellerin kirlenmesi anlamına geliyordu ve macera size bir sonraki mantıklı adım gibi göründü. İki nitelik artışı seçin. Biri Kuvvet veya Karizma olmalı ve diğeri serbest nitelik artışıdır. Gözdağı becerisinde ve sizi istihdam eden yerleşim yeri için İlim becerisinde eğitimlisiniz. Hızlı Tehdit beceri hünerini kazanırsınız.


omen://background/ward?source=paizo-pathfinder-player-core-2:
  name: Vesayetli
  description: >
    Gençken başka bir evin vesayeti altına girdiniz—barındınız, beslendiniz ve eğitildiniz, ancak hiçbir zaman ailenin tam bir parçası olmadınız. Belki sizi beslemeleri ve büyütmeleri karşılığında onların ihtiyaçlarıyla ilgilenmek zorunda kaldınız, belki de bakıldınız ama görmezden gelindiniz. Şimdi maceracılık, büyümeniz ve özgürce dolaşmanız için bir fırsattır. İki nitelik artışı seçin. Biri Dayanıklılık veya Karizma olmalı ve diğeri serbest nitelik artışıdır. Gösteri becerisinde ve Soykütüğü İlimi becerisinde eğitimlisiniz. Büyüleyici Performans beceri hünerini kazanırsınız.
