# tr overrides: feat

omen://feat/a-home-in-every-port?source=paizo-pathfinder-player-core-2:
  name: Her Limanda Bir Ev
  description: >
    Ziyaret ettiğiniz kasaba ve köylerde iyi bir üne sahipsinizdir ve oralarda yaşayanlar
    kapılarını size açmaya her zaman isteklidir. Bir kasaba veya köydeyken, boş zaman
    aktivitesi sırasında 8 saat harcayarak siz ve en fazla altı müttefikiniz için
    24 saate kadar ücretsiz konaklama sağlamaya istekli bir yerli bulabilirsiniz.
    Edinilen konaklama yerindeki yaşam standardı konforludur ve doyurucu öğünler hiçbir
    ücret talep edilmeden sunulur. 24 saatin ardından, konaklamaya ve yemeklere devam
    etmek için standart ücretleri ödemeli ya da sizi ağırlamaya istekli yeni bir yerli
    bulmak için bu hüneri tekrar kullanmalısınız.
  prerequisites:
  - text: Karizma +3
omen://feat/absorb-strength?source=paizo-pathfinder-player-core-2:
  name: Kuvveti Soğur
  description: Düşmanınızdan bir parça tüketerek onun gücünü soğurursunuz. 1 dakika
    süren, düşmanın seviyesine eşit miktarda geçici Can Puanı kazanırsınız.
omen://feat/absorb-toxin?source=paizo-pathfinder-player-core-2:
  name: Toksini Soğur
  description: Teniniz zehri kolayca emer ve başkalarını korumak için toksinleri bilinçli
    olarak kendi vücudunuza çekebilir. Tetikleyen etkiye karşı bir etkisizleştirme
    testi deneyin; etkisizleştirme dereceniz seviyenizin yarısına (yukarı yuvarlanmış)
    eşittir ve atış için sınıf ZD'niz – 10 veya büyü yapma nitelik bonusunuz artı
    büyü yapma yetkinlik bonusunuzu kullanırsınız. Tetikleyen etkiyi başarıyla etkisizleştirirseniz,
    o alandaki diğer tüm yaratıklar için etkiyi sonlandırırsınız; ancak ilk kurtarışa
    -2 ceza alarak etkiye karşı kurtarış yapmanız gerekir.
  prerequisites:
  - text: Hastalıklara veya zehirlere karşı bağışık olmamalısınız
omen://feat/acrobatic-performer?source=paizo-pathfinder-player-core-2:
  name: Akrobatik Gösterici
  description: İnanılmaz bir akrobatsınızdır; hünerinizle izleyicileri büyüler ve
    hayran bırakırsınız. Gösteri Yap eylemini kullanırken Gösteri testi yerine bir
    Akrobasi testi atabilirsiniz. Hem Akrobasi hem de Gösteri konularında eğitimliyseniz,
    Gösteri Yapmak için denenen Akrobasi testlerine +1 durumsal bonus kazanırsınız.
  prerequisites:
  - text: Eğitimli Akrobasi
omen://feat/acute-scent?source=paizo-pathfinder-player-core-2:
  name: Keskin Koku Alma
  description: Öfkeniz yükseldiğinde koku alma duyunuz gelişir. Öfkeliyken 30 fit
    menzilli hassas olmayan koku alma duyusu kazanırsınız.
omen://feat/acute-vision?source=paizo-pathfinder-player-core-2:
  name: Keskin Görüş
  description: Öfkelendiğinizde görme duyularınız gelişerek size karanlıkta görüş
    kazandırır.
omen://feat/adrenaline-rush?source=paizo-pathfinder-player-core-2:
  name: Adrenalin Patlaması
  description: >
    Savaşın sıcağında inanılmaz güç gösterileri sergileyebilirsiniz. Öfkeliyken yüklü
    ve maksimum Yük sınırlarınızı 2 artırırsınız; ayrıca ağır nesneleri kaldırmak,
    Kurtulma ve Zorlayarak Açmak için yapılan Atletizm testlerine +1 statü bonusu
    kazanırsınız.
omen://feat/advanced-qi-spells?source=paizo-pathfinder-player-core-2:
  name: İleri Qi Büyüleri
  description: Qi'nizi kontrol etme yeteneğiniz yeni doruklara ulaştı. Qi Patlaması,
    Açıklığı Daralt veya erişiminiz olan başka bir 3. derece qi büyüsü kazanırsınız.
  prerequisites:
  - text: Qi Büyüleri
omen://feat/aerobatics-mastery?source=paizo-pathfinder-player-core-2:
  name: Hava Akrobasisi Ustalığı
  description: >
    Uçarken zarafetle hareket eder ve hayranlık uyandıran hava gösterileri sergileyebilirsiniz.
    Havada Manevra Yapmak için yapılan Akrobasi testlerine +2 durumsal bonus kazanırsınız
    ve dik bir tırmanış veya iniş yaparken yön değiştirmek ya da fırtına şiddetindeki
    rüzgarlarda havada asılı kalmak gibi iki manevrayı tek bir eylemde birleştirebilirsiniz.
    Akrobasi testinin ZD'si, en zorlu manevranın ZD'si + 5'e eşittir. Akrobasi konusunda
    efsaneviyseniz, bu tür üç manevrayı tek bir eylemde birleştirebilirsiniz; Akrobasi
    testinin ZD'si, en zorlu manevranın ZD'si + 10'a eşittir. Kombinasyon ne olursa
    olsun, bu manevralar nadiren Uçma Hızınızdan daha uzağa hareket etmenize izin
    verir.
  prerequisites:
  - text: Usta Akrobasi
omen://feat/affliction-resistance?source=paizo-pathfinder-player-core-2:
  name: İllet Direnci
  description: Beslenme tarzınız sizi hastalıklara ve zehirlere karşı güçlendirdi.
    Hastalıklara ve zehirlere karşı yapılan kurtarışlara +1 durumsal bonus kazanırsınız.
    Bir hastalığa veya zehre karşı kurtarışta bir başarı elde ederseniz, bunun yerine
    kritik başarı kazanırsınız. Kurtarışı bu şekilde iyileştiren farklı bir yeteneğe
    sahipseniz (savaşçı sınıfının Savaşta Pişmiş özelliği gibi), kurtarışta bir kritik
    başarısızlık atarsanız bunun yerine başarısızlık alırsınız.
omen://feat/after-you?source=paizo-pathfinder-player-core-2:
  name: Sizden Sonra
  description: 'İnanılmaz bir özgüven gösterisiyle düşmanlarınızın ilk hamleyi yapmasına
    izin verirsiniz. İnisiyatif zarı atmazsınız; bunun yerine gönüllü olarak en son
    sıraya geçersiniz. Fiyaka kazanırsınız. Birden fazla karakter bu yeteneği veya
    en son hareket etmeyi sağlayan başka bir yeteneği kullanırsa, eşitlikleri çözmek
    için normal kuralları kullanın: YK''ler ve canavarlar OY''lerden önce hareket
    eder ve bu gruplar içinde yaratıklar istedikleri sırayı seçebilir.'
omen://feat/aggravating-scratch?source=paizo-pathfinder-player-core-2:
  name: Azan Tırmık
  description: Pençeleriniz sizin için zararsız ancak başkaları için can yakıcı olan
    bir tahriş edici madde taşır. Pençe Saldırılarınız bir kritik vuruşta fazladan
    1d4 süren zehir hasarı verir.
  prerequisites:
  - text: pençe silahsız saldırısı
omen://feat/agile-maneuvers?source=paizo-pathfinder-player-core-2:
  name: Çevik Manevralar
  description: 'Düşmanlarınıza karşı kolaylıkla manevra yaparsınız. Silahsızlandır,
    Kavra, Yerinden Oynat, İt ve Çelme Tak eylemleriniz daha düşük bir çoklu saldırı
    cezasına tabidir. Silahınız veya silahsız saldırınız çevik özelliğe sahip olmasa
    bile, eylem sıranızdaki ikinci saldırınızsa ceza –4, üçüncü veya sonraki saldırınızsa
    –8 olur. Silahınız veya silahsız saldırınız çevikse ve Fiyakaya sahipseniz ceza
    daha da azalır: sıranızdaki ikinci saldırıysa –3, üçüncü veya sonrakiyse –6 olur.'
  prerequisites:
  - text: Uzman Atletizm
omen://feat/agonizing-rebuke?source=paizo-pathfinder-player-core-2:
  name: Kahredici Azarlama
  description: Düşmanlarınızı dehşete düşürdüğünüzde onlara acı verici bir zihinsel
    ızdırap da çektirirsiniz. Bir düşmana Başarıyla Gözdağı Verdiğinizde, o düşman
    sıralarının her birinin başlangıcında ternary(gte(@actor.system.skills.intimidation.rank,4),3,ternary(gte(@actor.system.skills.intimidation.rank,3),2,1))d4[mental]
    hasar alır. Bu etki; yaratık korkmuş durumunu kaybederse, sizden 30 fitten daha
    uzakta olursa veya 1 dakika geçerse (hangisi önce gerçekleşirse) sona erer. Gözdağı
    becerisinde usta yetkinliğe sahipseniz hasar 2d4'e, efsanevi yetkinliğe sahipseniz
    3d4'e yükselir.
omen://feat/alchemical-discoveries?source=paizo-pathfinder-player-core-2:
  name: Simyasal Keşifler
  description: Simya bilginizi geliştirmek için laboratuvarda fazladan zaman harcadınız.
    Her seviye atladığınızda bir yerine iki simyasal eşyanın formülünü öğrenirsiniz;
    bunlar yine iksir veya alet olmalıdır. Her gün üretebileceğiniz çok yönlü flakon
    sayısı, Zanaat konusunda uzmansanız bir, ustaysanız iki, efsaneviyseniz üç artar.
  prerequisites:
  - text: Simyasal Bilimler Metodolojisi
omen://feat/alchemical-scholar?source=paizo-pathfinder-player-core-2:
  name: Simya Âlimi
  description: Simyasal Zanaat hünerini kazanırsınız. Bu hüneri otomatik olarak kazanacak
    olsaydınız (örneğin geçmişinizden veya simyacı sınıfından), bunun yerine farklı
    bir 1. seviye Zanaat beceri hüneri kazanırsınız. Bu hüneri aldığınızda formül
    kitabınıza ilave bir yaygın 1. seviye simyasal formül ekleyin. 1. seviyenin ötesinde
    her seviye kazandığınızda, formül kitabınıza o seviyeden bir yaygın simyasal formül
    ekleyin.
omen://feat/align-qi?source=paizo-pathfinder-player-core-2:
  name: Qi Hizalama
  description: Qi'nizin gücü yaralarınızı yatıştırır ve savaş için size enerji verir.
    Seviyeniz artı Bilgelik bonusunuza eşit Can Puanı kazanırsınız.
  prerequisites:
  - text: Qi Büyüleri
omen://feat/allys-shelter?source=paizo-pathfinder-player-core-2:
  name: Müttefik Sığınağı
  description: Müttefiklerinizin örneğini takip edersiniz. Kurtarışı kendi bonusunuz
    yerine o türdeki kurtarış için bitişiğinizdeki bir müttefikin bonusunu kullanarak
    atın.
omen://feat/ambush-hunter?source=paizo-pathfinder-player-core-2:
  name: Pusu Avcısı
  description: Düşmanlarınızı pusuya düşürmek için her zaman mükemmel fırsatı kollarsınız.
    Gözcülük Yap keşif aktivitesini, Fark Edilmekten Kaçın keşif aktivitesiyle aynı
    anda gerçekleştirebilirsiniz.
omen://feat/ancestors-rage?source=paizo-pathfinder-player-core-2:
  name: Ata Öfkesi
  description: Devasa, tekinsiz bir sırtlana dönüşürsünüz. Günde bir kez 5. derece
    okült özgü büyü olarak Hayvan Biçimi (yalnızca köpeksi biçim) büyüleyebilirsiniz.
omen://feat/animal-skin?source=paizo-pathfinder-player-core-2:
  name: Hayvan Postu
  description: Zırhsız savunmadaki yetkinliğiniz uzman seviyesine yükselir. Öfkeliyken
    ve zırhsızken teniniz kalın bir posta dönüşür. Savunma Değerine +2 eşya bonusu
    kazanırsınız (Büyük Juggernaut sınıf özelliğine sahipseniz +3). Postunuzun kalınlığı
    SD'nize en fazla +3 Çeviklik bonusu eklemenize izin verir. Savunma Değerine gelen
    bu eşya bonusu kâşif giysinizdeki Zırh Kudreti rünleri, Mistik Zırh ve Güç Kuşakları
    ile birikir.
  prerequisites:
  - text: Hayvan İçgüdüsü
omen://feat/animalistic-brutality?source=paizo-pathfinder-player-core-2:
  name: Hayvansı Vahşet
  description: 'Hayvan içgüdülerinizle olan bağınızı derinleştirirsiniz. Vahşi öfkeden
    gelen silahsız saldırınız öfkeniz sona erene kadar şu özelliklerden birini kazanır:
    backswing, forceful, parry, razing veya sweep. Bu yeteneği bir sonraki Öfkenize
    kadar tekrar kullanamazsınız. Hayvansı Vahşet''i her kullandığınızda farklı bir
    özellik seçebilirsiniz.'
  prerequisites:
  - text: Hayvan İçgüdüsü
omen://feat/annihilating-swing?source=paizo-pathfinder-player-core-2:
  name: Yok Edici Savuruş
  description: >
    Kaba yıkıcı gücü benimsediniz. Hedefin sahip olduğu tüm dirençleri yok sayan bir
    yakın dövüş Saldırısı yaparsınız. Saldırınızla sahipsiz, katı bir nesneyi veya
    yüzeyi hedef alırsanız, bir saldırı zarı atmadan onu otomatik olarak yok edebilirsiniz.
    Büyülü bir eşya veya bir büyünün etkisi olmayan, Sertliği 20 veya daha az olan
    herhangi bir nesneyi ya da yüzeyi hedef alırsanız onu yok edersiniz. Hedef nesne
    veya yüzey büyülü bir eşya ya da bir büyünün etkisiyse, etkisizleştirme testi
    için Saldırıdaki saldırı bonusunuzu kullanarak onu etkisizleştirmeyi denersiniz.
    Etkisizleştirme dereceniz 10'dur. Başarılı bir etkisizleştirme testinde, Sertliği
    20'den büyük olmadıkça, bir eser (artifact) olmadıkça veya benzer şekilde yok
    edilmesi güç olmadıkça nesneyi ya da yüzeyi yok edersiniz. Orta boyuttan büyük
    bir nesnenin veya yüzeyin 5 fitlik küpüne kadar olan kısmını yok edersiniz.
omen://feat/antagonize?source=paizo-pathfinder-player-core-2:
  name: Kışkırtma
  description: Alaylarınız ve tehditleriniz düşmanlarınızın öfkesini celbeder. Bir
    yaratığa başarıyla Gözdağı Verdiğinizde, size karşı düşmanca bir eylem kullanana
    veya en az 1 tur boyunca sizi artık gözlemleyemeyene ya da sezemeyene kadar Korkmuş
    durumu sırasının sonunda 1'in altına düşemez.
omen://feat/arcane-dragonblood?source=paizo-pathfinder-player-core-2:
  name: Mistik Ejderkan
  description: Talih ejderhası veya serap ejderhası gibi büyüsel yeteneklerinde ustalaşmış
    bir ejderhanın soyundan geliyorsunuz. Bu sayede büyünün inceliklerini içgüdüsel
    olarak kavrayabilirsiniz. Arkana konusunda eğitimli yetkinlik derecesi kazanırsınız.
    Arkana konusunda otomatik olarak eğitimli olacak olsaydınız (örneğin geçmişinizden
    veya sınıfınızdan), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz. Mistik
    Sezi beceri hünerini kazanırsınız. Bir ejderha timsali seçerseniz mistik bir ejderha
    seçmelisiniz.
omen://feat/armor-assist?source=paizo-pathfinder-player-core-2:
  name: Zırh Kuşanma Desteği
  description: >
    Zırhlı muhariplere yardım ettiğiniz hizmetinizin ardından, kendinize ve başkalarına
    ağır teçhizatlar giydirme konusunda deneyim kazandınız. Zırh kuşanmak için harcadığınız
    süreyi yarıya indirmek amacıyla GM tarafından belirlenen bir ZD ile (yaygın zırhlar
    için genellikle 15, yaygın olmayan zırhlar için ZD 20 ve nadir zırhlar için ZD
    25) bir Atletizm veya Harp Bilgisi testi deneyebilirsiniz. Bir müttefikle birlikte
    çalışarak ve aynı ZD'ye karşı bir Atletizm veya Harp Bilgisi testinde başarılı
    olarak müttefikinizin zırh kuşanma süresini yarıya indirebilirsiniz.
  prerequisites:
  - text: Eğitimli Atletizm veya Harp Bilgisi
omen://feat/armored-stealth?source=paizo-pathfinder-player-core-2:
  name: Zırhlı Gizlilik
  description: >
    Çıkardığınız gürültüyü azaltmak için zırhınızı ve hareketlerinizi ayarlama ve
    değiştirme tekniklerini öğrendiniz. Eğitimli olduğunuz gürültüsüz bir zırh giydiğinizde,
    Gizlilik testlerinize uygulanan ceza 1 azalır (en az 0 ceza olacak şekilde). Gizlilik
    konusunda ustaysanız cezayı 2, efsaneviyseniz 3 azaltırsınız. Zırhınız gürültülü
    (noisy) özelliğe sahipse, Gizlilik testlerindeki cezayı azaltmak yerine gürültülü
    özelliğin etkilerini yok sayarsınız; bu da normalde olduğu gibi yeterli bir Kuvvet
    değeriyle cezayı tamamen kaldırmanızı sağlar.
  prerequisites:
  - text: Uzman Gizlilik
omen://feat/ask-the-bones?source=paizo-pathfinder-player-core-2:
  name: Kemiklere Danış
  description: Tavsiye almak üzere başvurmak için bir atanızın veya bir dostunuzun
    kemiğini yanınızda taşırsınız. Bilgi Hatırlamayı deneyin. Kemikler o konuda özellikle
    bilgili birine aitse testinize +1 durumsal bonus kazanırsınız.
omen://feat/assured-identification?source=paizo-pathfinder-player-core-2:
  name: Garantili Tanılama
  description: Bir eşyayı nadiren yanlış tanılarsınız. Büyüyü Tanımak için Arkana,
    Doğa, Okültizm veya Din testleri kullanırken kritik başarısızlık atarsanız bunun
    yerine başarısızlık alırsınız. Bir başarı atıp kritik başarı atamadığınız için
    lanetli bir eşyayı yanlış tanımlayacak olursanız, bunun yerine eşyayı sadece tanılayamazsınız.
  prerequisites:
  - text: Uzman Arkana, Doğa, Okültizm veya Din
omen://feat/athletic-strategist?source=paizo-pathfinder-player-core-2:
  name: Atletik Stratejist
  description: >
    Eklemleri ve vücut ağırlığını hesaplı bir şekilde manipüle etmeyi bilirsiniz.
    Bir saldırı stratejisinin zar yerine geçmesini bir Saldırı için kullanmanın yanı
    sıra; Silahsızlandır, Kavra, Yerinden Oynat, İt veya Çelme Tak girişimlerini değiştirmek
    için de kullanabilir, Atletizm testi yerine Strateji Geliştir zarınızı koyabilirsiniz.
    Bu zar değişimini, ister bir Saldırı ister Atletizm eylemlerinden biri olsun,
    yaptığınız uygun ilk saldırıya uygulamalısınız. Strateji Geliştir zarınızı yerine
    koyduğunuzda, manevra için bir silah kullanmıyorsanız ve silah bir stratejiyle
    Zekâ kullanma kısıtlamalarına uymuyorsa, Atletizm testi için Kuvvet yerine Zekâ
    bonusunuzu da kullanabilirsiniz.
  prerequisites:
  - text: Eğitimli Atletizm
omen://feat/awesome-blow?source=paizo-pathfinder-player-core-2:
  name: Müthiş Darbe
  description: Saldırılarınız o kadar güçlüdür ki rakiplerinizi yere serebilir. Geri
    İtme kullandığınızda, hedefinizin Dayanıklılık ZD'sine karşı bir test deneyebilirsiniz.
  prerequisites:
  - text: Geri İtme
omen://feat/backup-disguise?source=paizo-pathfinder-player-core-2:
  name: Yedek Kılık
  description: Dış giysinizin altına giydiğiniz, hazırda tuttuğunuz özel bir kılığınız
    vardır. Kılığına Bürünmek amacıyla bu kılığa bürünmeyi 3 eylemli bir aktivite
    olarak yapabilirsiniz. Aldatma konusunda ustaysanız bu 2 eylemli bir aktivite
    olur; Aldatma konusunda efsaneviyseniz tek bir eylemdir. Kılığına Bürünmek için
    harcadığınız normal süreyi harcayarak yeni bir yedek kılık oluşturabilirsiniz,
    ancak aynı anda yalnızca bir yedek kılığa sahip olabilirsiniz. Yedek bir kılığa
    sahip olmak, zırhınızı veya diğer karmaşık giysi parçalarını daha hızlı çıkarmanızı
    sağlamaz; ancak bunları çıkardıktan sonra kılık hemen kullanıma hazırdır. Yedek
    kılığı hazırda bulundurduğunuz için, kapsamlı bir aramanın kılığın bazı unsurlarını
    ortaya çıkarması mümkündür (Gizlilik becerisindeki Eşya Gizle kısmına bakın).
  prerequisites:
  - text: Uzman Aldatma
omen://feat/bashing-charge?source=paizo-pathfinder-player-core-2:
  name: Toslayarak Hücum
  description: >
    Katı engellerin arasından hiç tereddüt etmeden kırıp dökerek ve toslayarak hücum
    edersiniz. İki kez Depar atın. Hareketiniz sırasında bir kez, hareketiniz bir
    kapı, pencere, çit, duvar veya benzer bir engelin içinden geçerse ya da bitişiğinde
    sona ererse, zara +1 durumsal bonus ile engeli Zorlayarak Açmak için bir Atletizm
    testi deneyebilirsiniz; başarısızlık durumunda hareketiniz o engelde sona erer.
  prerequisites:
  - text: Eğitimli Atletizm
omen://feat/battle-planner?source=paizo-pathfinder-player-core-2:
  name: Savaş Planlayıcısı
  description: >
    Sürekli planlar ve savaş senaryoları hazırlar, daha sonra kullanmak üzere stratejiler
    ve toplanan istihbaratı bir araya getirirsiniz. Bir düşmanın konumunu gözetlediğinizde
    veya düşmanın konumunu gözetleyen bir müttefikten ayrıntılı bir rapor aldığınızda,
    potansiyel düşmanlarınızın sayısı, konumu ve kimlikleri hakkında net bir bilgiye
    sahipseniz, bu potansiyel faktörleri hesaba katan ve şansın denklemdeki rolünü
    azaltan bir savaş planı hazırlamak için 1 dakika harcayabilirsiniz. Bir Harp Bilgisi
    testi atın. Bilgiler doğru olduğu ve bu düşmanlara karşı inisiyatif attığınızda
    doğru kalmaya devam ettiği sürece, inisiyatif zarınız için daha önce attığınız
    Harp Bilgisi sonucunu kullanabilirsiniz; bunu yaparsanız bu bir talih etkisidir.
  prerequisites:
  - text: Uzman Harp Bilgisi
omen://feat/benefactors-majesty?source=paizo-pathfinder-player-core-2:
  name: Velinimetin Haşmeti
  description: Koloninizin velinimetinin görkeminden güç alırsınız. 1 dakika süren,
    seviyenize eşit miktarda geçici Can Puanı kazanırsınız. Ayrıca sahip olduğunuz
    her bir süren hasar türünü gidermek için hemen bir düz zar deneyebilirsiniz. Son
    olarak, bir sonraki sıranızın başlangıcına kadar sizi zararlı bir saldırı, büyü
    veya yetenekle hedef alan herhangi bir yaratık önce başarılı bir kurtarış yapmalıdır;
    aksi takdirde yaratık haşmetinize gözlerini dikmekten kaçındığı için eylem bozulur.
omen://feat/between-the-scales?source=paizo-pathfinder-player-core-2:
  name: Pulların Arasından
  description: Düşmanlarınızın savunmalarındaki açıklıklardan yararlanmayı öğrendiniz.
    Çevik ve ustalık özelliklerine sahip bir yakın dövüş silahı veya silahsız saldırı
    kullanarak Gafil bir yaratığa Vuruş Yaptığınızda, saldırı gafil vuran özelliğini
    kazanır.
omen://feat/big-mouth?source=paizo-pathfinder-player-core-2:
  name: Geniş Ağız
  description: Yanak keselerinizde Hafif Yüke sahip en fazla dört eşya saklamak yerine,
    1 Yük değerine kadar eşya saklayabilirsiniz. Belirli bir eşyanın maksimum boyutu
    değişmez.
  prerequisites:
  - text: Yanak Keseleri
omen://feat/biographical-eye?source=paizo-pathfinder-player-core-2:
  name: Biyografik Bakış
  description: Kısa bir konuşmada veya sosyal etkileşimde bile, bir kişinin kökeni
    ve geçmişi hakkında çok şey öğrenmek için ince sosyal ve görsel ipuçlarını yakalarsınız.
    Kişinin tırnaklarının altındaki yeşillikleri fark edip onun bir aktar olduğunu
    anlayabilir, gizli bir cemiyete üyeliğini gösteren bir iğneyi yakalayabilir veya
    benzer bir şeyi sezebilirsiniz. Yalnızca toplumsal rolleriyle ilgili ayrıntıları
    yakalarsınız; dolayısıyla bir vampirin yaşadığı şehir bölgesini öğrenebilirsiniz
    ancak zaaflarını, hatta bir vampir olduğunu bile mutlaka öğrenemezsiniz. Daha
    önce karşılaşmadığınız veya Biyografik Bakış hünerini kazandıktan sonra karşılaşmadığınız
    birinin huzurunda 1 dakika geçirin, ardından bir Sosyoloji testi deneyin. Bu süre
    zarfında kişiyle sohbete girdiyseniz teste +1 durumsal bonus kazanırsınız. Kişi
    kasıtlı olarak doğasını gizlemeye veya sahte bir kimlik sunmaya çalışıyorsa, Sosyoloji
    testi sonucunuz onun İrade ZD'sini aşmadıkça gerçek biyografisi yerine sahte biyografisini
    öğrenirsiniz.
  prerequisites:
  - text: Usta Sosyoloji
omen://feat/black-cat-curse?source=paizo-pathfinder-player-core-2:
  name: Kara Kedi Laneti
  description: Hınç dolu bir lanet tıslarsınız. Hedef tetikleyen kurtarışı yeniden
    atar ve daha kötü olan sonucu kullanır.
omen://feat/bleeding-finisher?source=paizo-pathfinder-player-core-2:
  name: Kanamalı Bitirici Hamle
  description: Darbeniz oluk gibi kanamaya yol açar. Kesici veya delici bir Vuruş
    Yapın. İsabet ettirirseniz, hedef ayrıca hassas saldırı bitirici hamle hasarınıza
    eşit süren kanama hasarı alır.
omen://feat/bloodletting-fangs?source=paizo-pathfinder-player-core-2:
  name: Kan Dökücü Dişler
  description: Bir kurbandan kan çekmek için vampir ebeveyninizin tekniklerini taklit
    edersiniz. Diş Saldırılarınız kritik vuruşta fazladan 1d4 süren kanama hasarı
    verir.
  prerequisites:
  - text: diş silahsız saldırısı
omen://feat/bon-mot?source=paizo-pathfinder-player-core-2:
  name: Nükte
  description: >
    Bir düşmana dikkatini dağıtan zekice bir laf sokarsınız. 30 fit içindeki bir düşmanı
    seçin ve hedefin İrade ZD'sine karşı bir Diplomasi testi atın. Hedef, Nüktenize
    hazırcevap bir karşılık vererek etkiyi erken sonlandırabilir. Bu, odaklanma özelliğine
    sahip tek bir eylem veya karşılıklarını çerçevelemek için uygun bir beceri eylemi
    olabilir. En az 1 eylem sürmesi gerekse de hangi beceri eylemlerinin uygun olduğuna
    GM karar verir. Tipik olarak karşılığın dilsel ve Karizmaya dayalı bir beceri
    eylemi kullanması gerekir.
  prerequisites:
  - text: Eğitimli Diplomasi
omen://feat/bone-investiture?source=paizo-pathfinder-player-core-2:
  name: Kemik Kuşanma
  description: Devasa bir dinozora dönüşmek için kendinizi ruhani dinozor kemikleriyle
    kaplarsınız. Günde bir kez kendinize 5. derece özgü büyü olarak Dinozor Biçimi
    büyüleyebilirsiniz.
  prerequisites:
  - text: Kemik Büyüsü
omen://feat/bone-magic?source=paizo-pathfinder-player-core-2:
  name: Kemik Büyüsü
  description: Iruxi atalarınızla olan bağınız, bir atanın kemik parçasını kullanarak
    büyülediğiniz basit bir doğa büyüsü olarak kendini gösterir. Okült büyü listesinden
    veya doğa büyüsü listesinden bir kantrip seçin. Bu kantripi istediğiniz zaman
    özgü büyü olarak yapabilirsiniz ve seviyenizin yarısına (yukarı yuvarlanmış) eşit
    bir büyü derecesine yükseltilir.
omen://feat/bonekeepers-bane?source=paizo-pathfinder-player-core-2:
  name: Kemik Muhafızının Felaketi
  description: Bir düşman sırasına sizin bitişiğinizde başladığında, sınıf ZD'niz
    veya büyü ZD'nizden hangisi yüksekse ona karşı bir İrade kurtarış yapmalıdır.
    Başarısızlık durumunda düşman, sizin bitişiğinizde kaldığı sürece saldırı zarlarına
    ve beceri testlerine –1 statü cezası alır. Kurtarışın sonucu ne olursa olsun yaratık
    24 saat boyunca kemik muhafızının felaketine karşı geçici olarak bağışık olur.
omen://feat/boneyards-call?source=paizo-pathfinder-player-core-2:
  name: Boneyard'ın Çağrısı
  description: Boneyard ve onun divanlarıyla olan güçlü bağınız, size Boneyard'a gidip
    gelme yeteneği bahşeder. Haftada iki kez ilahi özgü büyü olarak Düzlemlerarası
    Işınlanma yapabilirsiniz. Bu büyü yalnızca Boneyard'a seyahat etmek veya Boneyard'dan
    Evren'e dönmek için kullanılabilir. Boneyard ile olan eşsiz bağınız nedeniyle
    vücudunuz odak noktası görevi görür ve bir düzlemsel anahtar gerekmez.
omen://feat/brandishing-draw?source=paizo-pathfinder-player-core-2:
  name: Fiyakalı Kılıç Çekme
  description: Aynı hareketle hem silahınızı çeker hem de saldırırsınız. Bir silah
    çekmek için Etkileşime Girersiniz, ardından ya bir Vuruş Yaparsınız ya da tek
    eylemli bir bitirici hamle kullanırsınız. Yine de bir bitirici hamle kullanmak
    için gereken diğer tüm gereksinimleri karşılamanız gerekir ve yapacağınız her
    türlü Saldırı çektiğiniz silahla yapılmalıdır.
omen://feat/breath-like-honey?source=paizo-pathfinder-player-core-2:
  name: Bal Gibi Nefes
  description: Bal ve leziz şeyler gibi kokarsınız. Hedef nefesinizin kokusunu alabiliyorsa
    İyi İzlenim Bırakmak için yapılan testlere aldığınız durumsal bonus +2'ye yükselir.
    Ayrıca, büyünün 30 fit menzile sahip olması ve işitsel özellik yerine koku alma
    özelliğine sahip olması dışında günde bir kez 3. derece okült özgü büyü olarak
    Büyüle büyüleyebilirsiniz. Hedefler sizinle aynı fikirde olmadıkları için herhangi
    bir durumsal bonus kazanmaz.
  prerequisites:
  - text: Tatlınefes Kholo mirası
omen://feat/breath-of-the-dragon-dragonblood?source=paizo-pathfinder-player-core-2:
  name: Ejderha Nefesi (Ejderkan)
  description: >
    Ejderha atanızın fizyolojisinden güç alarak bir koni veya bir hat şeklinde enerji
    seli püskürtebilir ve 1d4 hasar verebilirsiniz. Alandaki her yaratık sınıf ZD'niz
    veya büyü ZD'nizden yüksek olanına karşı temel bir kurtarış yapmalıdır. Bu yeteneği
    1d4 tur boyunca tekrar kullanamazsınız. 3. seviyede ve sonrasındaki her 2 seviyede
    bir hasar 1d4 artar. Nefesin biçimi, hasar türü ve kurtarış ejderha timsalinizinkilerle
    eşleşir. Bu yetenek verdiği hasar türüyle ilişkili özelliğe sahiptir.
omen://feat/briar-battler?source=paizo-pathfinder-player-core-2:
  name: Çalı Savaşçısı
  description: Çevresel bir unsurdan kaynaklanan zorlu arazideyken, bu unsur normalde
    Siper Almanız için yeterince büyük olmasa bile Siper Alabilirsiniz.
omen://feat/brutal-bully?source=paizo-pathfinder-player-core-2:
  name: Gaddar Zorba
  description: Düşmanlarınızı hırpalar ve üzerlerinde morluklar bırakırsınız. Öfkeliyken
    bir düşmanı Silahsızlandırdığınızda, Kavradığınızda, Yerinden Oynattığınızda,
    İttiğinizde veya Çelme Taktığınızda, o düşmana Kuvvet bonusunuza eşit ezici hasar
    verirsiniz; bunu Çelme Takmada kritik başarıdan gelen hasara ekleyin.
  prerequisites:
  - text: Uzman Atletizm
omen://feat/brutal-critical?source=paizo-pathfinder-player-core-2:
  name: Gaddar Kritik
  description: Kritik vuruşlarınız özellikle yıkıcıdır. Yakın dövüş Saldırısında bir
    kritik vuruş elde ettiğinizde bir ekstra hasar zarı ekleyin. Bu, silah ölümcül
    veya can alıcı özelliklerine sahipse kazandığınız ekstra zarlara ilavedir. Hedef
    ayrıca iki hasar zarına eşit süren kanama hasarı alır.
omen://feat/buckler-dance?source=paizo-pathfinder-player-core-2:
  name: Bakler Dansı
  description: Baklerinizi her saldırıya karşı savunmacı bir tavırla döndürürsünüz.
    Bu eylemin gereksinimlerini karşıladığınız sürece, sanki Kalkan Kaldır eylemini
    kullanmış gibi baklerinizi sürekli havada tutarsınız.
omen://feat/call-the-swarm?source=paizo-pathfinder-player-core-2:
  name: Sürüyü Çağır
  description: Tiz bir ıslık çalıp işaret edersiniz ve çevre araziden 120 fit içindeki
    bir patlamayı dolduracak şekilde devasa bir sıçan sürüsü fışkırır. Sıçanlar yerlerde
    koşuşturur, duvarlara ve yüzeylere tırmanır, alandaki tüm düşmanlara 6d8[piercing]|options:area-damage
    hasar vererek ısırır ve tırmalar. Sıçanlar sonraki bir dakika boyunca alanda sürü
    hâlinde dolaşmaya devam ederek, alanda sırasını bitiren herhangi bir düşmana 3d8[piercing]|options:area-damage
    hasar verir ve alanı zorlu araziye dönüştürür (ancak sıçanlar sizin ve müttefiklerinizin
    normal şekilde geçmesine izin verir). Bu etkiyi Sonlandırabilirsiniz.
  prerequisites:
  - text: Sıçan Dili
omen://feat/cant-fall-here?source=paizo-pathfinder-player-core-2:
  name: Burada Yıkılamazsın
  description: Bir müttefikinizin ayakta kalmasına fiziksel olarak yardım eder ve
    korkunç zorluklara karşı acıya göğüs germesi için onu cesaretlendirirsiniz. Müttefikiniz
    Bilinçsiz kalmaz ve 1 Can Puanında kalır. Müttefik ayrıca 1 dakika süren, seviyenize
    eşit miktarda geçici Can Puanı kazanır. Böylesi bir yaralanmayla savaşmaya devam
    etmek sonuçsuz kalmaz; müttefikinizin Yaralı durumu 1 artar.
omen://feat/cantorian-reinforcement?source=paizo-pathfinder-player-core-2:
  name: Cantorian Takviyesi
  description: İlk hobgoblinlerin yaratılmasına yardımcı olan yaşam enerjisi sizde
    özellikle güçlüdür ve sizi süregelen illetlerden korur. Bir hastalığa veya zehre
    karşı kurtarışta bir başarı elde ederseniz, bunun yerine kritik başarı kazanırsınız.
    Kurtarışı bu şekilde iyileştiren farklı bir yeteneğe sahipseniz (savaşçı sınıfının
    Savaşta Pişmiş özelliği gibi), kurtarışta kritik başarısızlık atarsanız bunun
    yerine başarısızlık alırsınız.
omen://feat/cantorian-rejuvenation?source=paizo-pathfinder-player-core-2:
  name: Cantorian Gençleşmesi
  description: Kanınızda dolaşan hayat veren enerji sizi canlandırır. ternary(gte(@actor.level,15),6,4)d6[healing]
    Can Puanı yenilersiniz ve 1 dakika boyunca 10 geçici Can Puanı kazanırsınız. 15.
    seviyede, bunun yerine 6d6 CP yeniler ve 15 geçici CP kazanırsınız.
omen://feat/cantorian-restoration?source=paizo-pathfinder-player-core-2:
  name: Cantorian Yenilenmesi
  description: Kanınızda akan enerji en karanlık anlarda bir hayat kurtarabilir. Yaratığın
    ölmesini engeller ve ona 6d8 + Dayanıklılık bonusunuz kadar Can Puanı kazandırırsınız.
    Tetikleyen etki bir ölüm etkisi veya Disintegrate gibi geride hiçbir kalıntı bırakmayan
    bir etkiyse Cantorian Yenilenmesi'ni kullanamazsınız.
omen://feat/caravan-leader?source=paizo-pathfinder-player-core-2:
  name: Kervan Lideri
  description: Yoldayken müttefiklerinizden en iyi verimi nasıl alacağınızı bilirsiniz.
    Grubunuz, tek başına en uzun süre Acele Edebilen üyenin süresinin 20 dakika ötesinde
    fazladan Acele Edebilir.
  prerequisites:
  - text: Tempoyu Artır
omen://feat/cat-nap?source=paizo-pathfinder-player-core-2:
  name: Kedi Kestirmesi
  description: Kısa bir şekerlemeyle enerjinizi hızla toplayabilirsiniz. 10 dakika
    uyursunuz, ardından 1 saat süren ve seviyenize eşit miktarda geçici Can Puanı
    kazanırsınız.
omen://feat/caterwaul?source=paizo-pathfinder-player-core-2:
  name: Kedi Çığlığı
  description: Cüretkâr bir miyavlamayla yoldaşınızı bilinçsizliğin eşiğinden geri
    çağırırsınız. Müttefikiniz yere serilmez ve 1 Can Puanında kalır. Yaralı durumu,
    sanki Ölmekte durumuna düşüp toparlanmış gibi yine de 1 artar.
omen://feat/catfolk-dance?source=paizo-pathfinder-player-core-2:
  name: Kedisoy Dansı
  description: Diğer yaratıklar hareket etmeye çalıştığında sürekli onların yoluna
    çıkma alışkanlığınız vardır. Bitişiğinizdeki bir yaratığın Refleks ZD'sine karşı
    bir Akrobasi testi deneyin.
omen://feat/catfolk-lore?source=paizo-pathfinder-player-core-2:
  name: Kedisoy İlimi
  description: >
    Kedisoylar arasında büyümek size geleneksel özgürlük, muhafızlık ve belalara karşı
    hızlı tepki verme değerlerini öğretti. Akrobasi ve Hayatta Kalma konularında eğitimli
    yetkinlik derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak eğitimli
    olacak olsaydınız (örneğin geçmişinizden veya sınıfınızdan), bunun yerine seçtiğiniz
    bir beceride eğitimli olursunuz. Ayrıca Kedisoy İlimi için İlave Bilgi genel hünerini
    kazanırsınız.
omen://feat/catfolk-weapon-familiarity?source=paizo-pathfinder-player-core-2:
  name: Kedisoy Silah Aşinalığı
  description: >
    Kedisoy özelliğine sahip tüm yaygın olmayan silahlara erişim kazanırsınız. Kedisoy
    özelliğine sahip silahların yanı sıra kama, kukri, pala ve orağa aşinasınızdır—yetkinlik
    amacıyla, bunlardan askeri silah olanları basit silahlar, gelişmiş silah olanları
    ise askeri silahlar olarak değerlendirirsiniz. 5. seviyede, bu silahlardan biriyle
    kritik vuruş yaptığınızda onun kritik uzmanlaşma etkisini kazanırsınız.
omen://feat/cats-luck?source=paizo-pathfinder-player-core-2:
  name: Kedi Şansı
  description: İçgüdüsel olarak tehlikeden sıyrılırsınız. Tetikleyen kurtarışı yeniden
    atabilir ve daha iyi olan sonucu kullanabilirsiniz.
omen://feat/certain-stratagem?source=paizo-pathfinder-player-core-2:
  name: Kesin Strateji
  description: Zayıf noktalarını hedef almak için bir düşmana tam olarak nereden vuracağınızı
    bilirsiniz. Strateji Geliştirmekten dolayı Zekâ bonusunuzu eklediğiniz bir Vuruş
    Yapıp ıskaladığınızda, hedefe Stratejik Saldırı hasarınızın yarısını verirsiniz.
    Bu hasar türü, Saldırı için kullandığınız silahın veya silahsız saldırının hasar
    türüdür.
omen://feat/chance-death?source=paizo-pathfinder-player-core-2:
  name: Ölümle Kumar
  description: Önceki yaşamınız yıldırım çarpması veya balık kılçığıyla boğulma gibi
    tamamen kötü bir şans yüzünden sona erdi. Tetikleyen toparlanma denemesini veya
    kurtarışı yeniden atabilirsiniz, ancak daha kötü olsa bile yeni sonucu kullanmalısınız.
omen://feat/charmed-life?source=paizo-pathfinder-player-core-2:
  name: Tılsımlı Yaşam
  description: Tehlike kapıyı çaldığında işin içinden sağ salim çıkmak konusunda tuhaf
    bir hüneriniz vardır. Tetikleyen kurtarışa +2 durumsal bonus kazanırsınız. Tetikleyen
    kurtarışta başarılı olursanız, bir sonraki sıranızın sonuna kadar Fiyaka kazanırsınız.
  prerequisites:
  - text: Karizma +2
omen://feat/cheat-death?source=paizo-pathfinder-player-core-2:
  name: Ölümü Atlat
  description: >
    Her nasılsa ecelin elinden kıl payı kurtulmayı her zaman başarırsınız. Yere serilmekten
    veya öldürülmekten kurtulup 1 Can Puanında kalır ve Fiyaka kazanırsınız; ancak
    Lanetlenmiş 1 durumuna düşersiniz (veya zaten lanetlenmişseniz lanetlenmiş değerinizi
    1 artırırsınız). Ölümü Atlat'tan gelen lanetlenmiş durumunu azaltamaz veya yok
    sayamazsınız. Ölümü Atlat'tan gelen lanetlenmiş durumu 10 dakika sürer, ancak
    sahip olduğunuz başka herhangi bir lanetlenmiş durumunun süresini etkilemez.
omen://feat/cheek-pouches?source=paizo-pathfinder-player-core-2:
  name: Yanak Keseleri
  description: Yanaklarınız esnektir ve bu yanak keselerinde Hafif Yüke sahip veya
    daha az olan en fazla dört eşya saklayabilirsiniz. Bu eşyaların hiçbirinin boyutu
    1 fitten uzun olamaz. Yanak keselerinizde en az bir eşya bulunduğu sürece konuşmanızın
    anlaşılması belirgin şekilde güçleşir. Yanak kesenize bir eşya koymak veya birini
    çıkarmak bir Etkileşime Gir eylemidir. Tek bir eylemle ağzınızı boşaltarak yanak
    keselerinizde sakladığınız her şeyin karenizdeki zemine düşmesini sağlayabilirsiniz.
omen://feat/cleave?source=paizo-pathfinder-player-core-2:
  name: Yarma
  description: Silahınızı bir düşmandan bütünüyle geçirip diğerine savurursunuz. İkinci
    düşmana karşı bir yakın dövüş Vuruşu yapın.
omen://feat/climbing-claws?source=paizo-pathfinder-player-core-2:
  name: Tırmanma Pençeleri
  description: Tırmanmanıza yardımcı olması için pençelerinizi uzatabilirsiniz. 10
    fitlik bir tırmanma Hızı kazanırsınız.
omen://feat/clinging-shadows-initiate?source=paizo-pathfinder-player-core-2:
  name: Yapışkan Gölgeler Müridi
  description: Qi'nizi uzuvlarınızı saran yapışkan bir dumana dönüştüren mistik bir
    duruş öğrenirsiniz. Yapışkan Gölgeler Duruşu qi büyüsünü kazanırsınız. Duruşa
    girmek bir qi büyüsü olsa da sağladığı gölge kavrayışı saldırıları büyü değildir;
    bu nedenle duruştayken bunları istediğiniz sıklıkta kullanabilirsiniz.
  prerequisites:
  - text: Qi Büyüleri
omen://feat/close-quarters?source=paizo-pathfinder-player-core-2:
  name: Göğüs Göğüse
  description: Küçük veya daha ufak boyuttaysanız, hareketinizi Küçük veya daha ufak
    boyuttaki bir müttefikinizle aynı karede sonlandırabilirsiniz. Bu yeteneği veya
    benzer bir yeteneği kullanırken aynı alanı en fazla iki yaratık paylaşabilir.
omen://feat/clue-them-all-in?source=paizo-pathfinder-player-core-2:
  name: Hepsine İpucu Ver
  description: Bütün müttefiklerinize aynı anda ipucu verebilirsiniz. İpucu Ver reaksiyonunu
    kullandığınızda, aktif soruşturmalarınızdan birini araştırmak için aynı testi
    deneyen müttefiklerinizin tümü İpucu Ver'den gelen durumsal bonusunu alır. Bu
    yeteneği bir karşılaşma sırasında kullanırsanız, testlerini onlara İpucu Verdiğiniz
    andan itibaren 1 tur içinde denemelidirler.
omen://feat/cobra-envenom?source=paizo-pathfinder-player-core-2:
  name: Kobra Zehirlemesi
  description: Düşmanınızı zehirleme gücü ve sinsi bir niyetle saldırmak için eklemlerinizi
    hafifçe yerinden oynatırsınız. Bir kobra dişi Saldırısı yapın. Bu Saldırıdaki
    erişiminiz normalden 5 fit daha fazladır. Bu Saldırı isabet ederse, venomous özelliğinizden
    gelen süregelen zehir hasarı silah hasar zarı başına 1d4[persistent,poison] hasara
    yükselir.
  prerequisites:
  - text: Kobra Duruşu
  - text: silahsız saldırılarda uzman
omen://feat/cobra-stance?source=paizo-pathfinder-player-core-2:
  name: Kobra Duruşu
  description: >
    Saldırıya hazır bir kobra gibi çöreklenmiş, ellerinizi zehirli dişler gibi konumlandırarak
    sıkı bir duruşa geçersiniz. Bu duruştayken yapabileceğiniz tek Saldırılar kobra
    dişi silahsız saldırılarıdır. Bunlar 1d4 delici hasar verir; boğuşma (brawling)
    grubundadır; ve çevik, deadly d10, ustalık, silahsız ve venomous özelliklerine
    sahiptir. Kobra Duruşundayken Dayanıklılık kurtarışlarına ve Dayanıklılık ZD'nize
    +1 durumsal bonus kazanırsınız ve seviyenizin yarısına eşit zehir direnci kazanırsınız.
omen://feat/collateral-thrash?source=paizo-pathfinder-player-core-2:
  name: Yan Hasarlı Hırpalama
  description: Hırpaladığınız düşmanı bir başkasına çarparsınız. Hırpala kullandığınızda
    Kavranmış düşmanın bitişiğindeki başka bir düşmanı seçin. O düşman da sınıf ZD'nize
    karşı bir kurtarışla Hırpalama hasarınızı alır.
  prerequisites:
  - text: Hırpala
omen://feat/combination-finisher?source=paizo-pathfinder-player-core-2:
  name: Kombinasyon Bitirici Hamle
  description: 'Bir dizi saldırıyı güçlü bir bitirici darbeyle birleştirirsiniz. Bitirici
    hamlelerinizin Saldırıları daha düşük bir çoklu saldırı cezasına tabidir: sıranızdaki
    ikinci saldırıysa sırasıyla -5 ve -10 yerine -4 (veya çevik bir silahla -3), üçüncü
    veya sonraki saldırıysa -8 (veya çevik bir silahla -6).'
omen://feat/come-and-get-me?source=paizo-pathfinder-player-core-2:
  name: Sıkıysa Gel
  description: Karşılık verebilmek için kendinizi saldırılara açarsınız. Öfkeniz sona
    erene kadar Gafil kalırsınız ve size karşı yapılan hasar zarları +2 durumsal bonus
    kazanır. Bir yaratık size isabet ettirirse, o yaratık bir sonraki sıranızın sonuna
    kadar size karşı Gafil kalır. Bir sonraki sıranızın sonundan önce ona vurursanız,
    Dayanıklılık bonusunuza eşit geçici Can Puanı kazanırsınız (kritik vuruşta iki
    katı). Bu geçici Can Puanları öfkenizin sonuna kadar sürer.
omen://feat/concealing-legerdemain?source=paizo-pathfinder-player-core-2:
  name: Gizleyici El Çabukluğu
  description: >
    Bir nesneyi müfettişlerin aramayacağı bir yere saklamak yerine, onu sürekli hareket
    ettirerek baktıkları yerde asla bulunmamasını sağlama konusunda hünerlisinizdir.
    Hafif Yüke sahip veya daha az olan bir Eşyayı Gizlediğinizde, testleriniz ve aktif
    bir arayıcının Dikkat testinin ZD'si için Gizlilik yerine Hırsızlık kullanabilirsiniz.
    Zarı yalnızca bir kez atarsınız ancak süreç boyunca Eşya Gizlemek için eylemler
    kullanmaya devam etmelisiniz.
  prerequisites:
  - text: Eğitimli Hırsızlık
omen://feat/connect-the-dots?source=paizo-pathfinder-player-core-2:
  name: Noktaları Birleştir
  description: İnsanlar, yerler ve kavramlar arasındaki geçici bağlantılar çoğu kişi
    için görünmezdir ancak bunları görmek sizin uzmanlık alanınızdır. Bir müttefik
    ve müttefik olmayan bir yaratık seçin. İkisini de görebiliyor olmalısınız. İkisinin
    de hareket tarzını kısaca inceler ve müttefik olmayan yaratığın Aldatma ZD'si
    veya İrade ZD'sinden yüksek olanına karşı bir Dikkat testi denersiniz. Ardından
    her iki hedef de 10 dakika boyunca Noktaları Birleştir'e karşı geçici olarak bağışık
    olur.
omen://feat/consult-the-spirits?source=paizo-pathfinder-player-core-2:
  name: Ruhlara Danış
  description: Bir mekândaki küçük, görünmez ruhları algılamanızı sağlayan ayinler
    veya meditasyonlar öğrendiniz. Bu hüneri seçtiğinizde Doğa, Okültizm veya Din'i
    seçin. Doğa; ruhani enerjiden ziyade saf yaşam özünden doğan ve yakındaki su veya
    bitki örtüsünün konumu gibi doğal unsurlar hakkındaki soruları yanıtlayabilen
    leshyleri oluşturan doğa ruhlarıyla iletişime geçmenizi sağlar. Din; güçlü yaşam
    enerjisi kaynakları veya Boşluk enerjisi, kutsal ya da murdar etkiler veya hortlakların
    varlığı hakkında bilgi sağlayan, ilahi varlıklara hizmet eden meleksi, iblisimsi
    veya diğer ruhların varlığını ortaya çıkarır. Okültizm; geride kalan ruhlar, göçüp
    giden ölülerin psişik yankıları ve gerçekliğin ötesindeki ruhlarla iletişime geçmenizi
    sağlayarak tuhaf auralar, etkiler veya doğal olmayan okült varlıkların mevcudiyeti
    gibi konularda size bilgi verir. 10 dakika harcayın ve seçilen beceriyle Bilgi
    Hatırlamak için bir test deneyin; ZD, GM tarafından belirlenir (genellikle bölgede
    karşılaşabileceğiniz en yüksek seviyeli yaratığın seviyesi için çok yüksek bir
    ZD). Seçilen beceride efsaneviyseniz, bu hüneri günde yalnızca bir kez yerine
    saatte bir kez kullanabilirsiniz; ancak önceki bir alanla örtüşen herhangi bir
    alanda tekrar kullanamazsınız.
  prerequisites:
  - text: Usta Doğa, Okültizm veya Din
omen://feat/contagious-rage?source=paizo-pathfinder-player-core-2:
  name: Bulaşıcı Öfke
  description: Müttefiklerinizi bir çılgınlığa sürükleyerek onlara inanılmaz faydalar
    sağlayabilirsiniz. Bir Öfke sırasında birden fazla kez kullanarak Öfkeyi Paylaş'ın
    gereksinimlerini yok sayabilirsiniz. Öfkeyi Paylaş'tan etkilenen müttefikler,
    içgüdü yeteneğinizi ve silah uzmanlaşmasından kazandığı uzmanlaşma yeteneğini
    (ancak büyük silah uzmanlaşmasını değil) kazanmayı seçebilirler. Bunu yaparlarsa
    içgüdünüzün tüm kısıtlamalarına uymalıdırlar (örneğin hurafe içgüdüsünün aforozu
    gibi).
  prerequisites:
  - text: Öfkeyi Paylaş
omen://feat/cornered-fury?source=paizo-pathfinder-player-core-2:
  name: Köşeye Sıkışmışın Gazabı
  description: Sizden daha büyük boyuttaki bir düşman size kritik vuruş yapar ve hasar
    verirse, o düşman 1 tur boyunca size karşı Gafil kalır.
omen://feat/crafters-appraisal?source=paizo-pathfinder-player-core-2:
  name: Zanaatkâr Değerlemesi
  description: Eşyaların yapımına dair bilginiz, büyülü etkilerini de ayırt etmenizi
    sağlar. Büyülü eşyalar üzerinde Büyüyü Tanımak için bir büyü geleneğiyle ilişkili
    bir beceri yerine Zanaat becerisini kullanabilirsiniz; ancak başka hiçbir büyü
    türünde bunu kullanamazsınız.
  prerequisites:
  - text: Eğitimli Zanaat
omen://feat/crane-flutter?source=paizo-pathfinder-player-core-2:
  name: Turna Kanat Çırpışı
  description: Kolunuzu kendinizle rakibiniz arasına sokarsınız. Turna Duruşu'ndan
    gelen Savunma Değeri durumsal bonusunuz tetikleyen saldırıya karşı +3'e yükselir.
    Saldırı sizi ıskalarsa ve saldırgan erişim mesafeniz içindeyse, saldırgana karşı
    hemen –2 ceza ile bir turna kanadı Saldırısı yapabilirsiniz.
  prerequisites:
  - text: Turna Duruşu
omen://feat/crane-stance?source=paizo-pathfinder-player-core-2:
  name: Turna Duruşu
  description: >
    Kollarınız bir turnanın kanatları gibi çırpınır. Savunma Değerine +1 durumsal
    bonus kazanırsınız, ancak yapabileceğiniz tek Saldırılar turna kanadı saldırılarıdır.
    Bunlar 1d6 ezici hasar verir; boğuşma grubundadır; ve çevik, ustalık, öldürücü
    olmayan ve silahsız özelliklerine sahiptir. Turna Duruşundayken Yüksek Atlama
    ve Uzun Atlama için ZD'yi 5 azaltırsınız ve Sıçradığınızda yatay olarak fazladan
    5 fit veya dikey olarak 2 fit hareket edebilirsiniz.
omen://feat/cringe?source=paizo-pathfinder-player-core-2:
  name: Sinme
  description: Acınası bir duruşla düşmanınızın ölümcül bir saldırıyı geri çekmesine
    neden olursunuz. Saldıran yaratık, tetikleyen Saldırının hasarına seviyeniz +
    2'ye eşit bir durumsal ceza alır. Bu ceza, kritik vuruş için hasar ikiye katlandıktan
    sonra uygulanır. Saldırgan ardından 24 saat boyunca Sinmenize karşı bağışık olur.
omen://feat/croak-talker?source=paizo-pathfinder-player-core-2:
  name: Vıraklayan
  description: Uzun vıraklamalar kullanarak en basit kurbağalarla ve diğer benzer
    yaratıklarla iletişim kurabilirsiniz. Amfibi olan hayvanlara (çoğu amfibi amphibious
    özelliğine sahiptir) sorular sorabilir, onlardan cevaplar alabilir ve onlarla
    Diplomasi becerisini kullanabilirsiniz.
omen://feat/crunch?source=paizo-pathfinder-player-core-2:
  name: Kemik Çatırtısı
  description: Çeneleriniz kemikleri ezebilir ve zırhları ısırıp geçebilir. Çene silahsız
    saldırınız 1d6 yerine 1d8 delici hasar verir ve kavrama özelliğini kazanır.
omen://feat/crushing-grab?source=paizo-pathfinder-player-core-2:
  name: Ezici Kavrama
  description: Güçlü bir boa yılanı gibi, amansız tutuşunuzda hedefleri ezersiniz.
    Bir yaratığı başarıyla Kavradığınızda, o yaratığa Kuvvet bonusunuza eşit ezici
    hasar verebilirsiniz. Bu saldırıyı cezasız olarak öldürücü olmayan hale getirebilirsiniz.
omen://feat/dancing-leaf?source=paizo-pathfinder-player-core-2:
  name: Dans Eden Yaprak
  description: Rüzgârda savrulan bir yaprak kadar hafifsinizdir. Sıçradığınızda veya
    bir Yüksek Atlama ya da Uzun Atlamada başarılı olduğunuzda, atladığınız mesafeyi
    5 fit artırın. Düşmekten aldığınız hasarı hesaplarken, bir duvara bitişik olduğunuz
    sırada düşülen hiçbir mesafeyi hesaba katmayın.
omen://feat/dangle?source=paizo-pathfinder-player-core-2:
  name: Kuyrukla Asılma
  description: Genellikle tırmanırken bir ağaç dalı, balkon veya kayalık çıkıntı gibi
    (GM'in takdirine bağlı olarak) uygun herhangi bir sabitleme noktasından kuyruğunuzla
    asılabilirsiniz. Asılıyken diğer tüm uzuvlarınızı serbestçe kullanabilirsiniz;
    bu sayede yay fırlatmak veya çift elli kılıç savurmak gibi iki el gerektiren görevleri
    gerçekleştirebilirsiniz.
omen://feat/dastardly-dash?source=paizo-pathfinder-player-core-2:
  name: Alçakça Depar
  description: Hileli taktiklerle kafasını karıştırarak bir rakibin yanından hızla
    geçersiniz. Hızınızın yarısına kadar Depar atın. Hareketiniz sırasında herhangi
    bir noktada menziline girdiğiniz bir rakibe karşı Çelme Takmayı veya bir Kirli
    Numarayı (bu eyleme sahipseniz) deneyebilirsiniz.
omen://feat/deadly-aspect?source=paizo-pathfinder-player-core-2:
  name: Ölümcül Suret
  description: Ejderha mirasınızın size bahşettiği silahsız saldırıyı ölümcül bir
    dereceye kadar bilediniz. Ejderha Sureti'nden kazandığınız silahsız saldırı ölümcül
    d8 özelliğini kazanır.
  prerequisites:
  - text: Ejderha Sureti
omen://feat/deadly-grace?source=paizo-pathfinder-player-core-2:
  name: Ölümcül Zarafet
  description: Zarif saldırılarınız özellikle güçlüdür. Ölümcül özelliğine sahip çevik
    veya ustalık bir yakın dövüş silahıyla kritik vuruş yaptığınızda, bu özellikten
    gelen zar sayısını ikiye katlarsınız. Ölümcül özelliğine sahip olmayan çevik veya
    ustalık bir yakın dövüş silahı kuşandığınızda, silah bunun yerine ölümcül d8 özelliğini
    kazanır.
omen://feat/deceptive-worship?source=paizo-pathfinder-player-core-2:
  name: Aldatıcı İbadet
  description: Tarikatınızın üyeleri sıklıkla kendilerini diğer dinlerin ibadetçileri
    olarak tanıtırlar. Başka bir inancın tipik bir ibadetçisinin Kılığına Bürünmek
    veya özellikle Kılığına Büründüğünüz inancın bir üyesi olduğunuzu iddia ederek
    Yalan Söylemek için Aldatma yerine Okültizm kullanabilirsiniz. Belirli bir ibadetçinin
    Kılığına Bürünmek veya başka herhangi bir konuda Yalan Söylemeye çalışmak gibi
    diğer aldatıcı eylemleri gerçekleştirmek için yine de Aldatma becerisini kullanmanız
    gerekir.
  prerequisites:
  - text: Eğitimli Okültizm
omen://feat/defensive-stratagem?source=paizo-pathfinder-player-core-2:
  name: Savunmacı Strateji
  description: >
    Bir düşmanı dikkatle inceleyerek onun saldırılarından nasıl daha iyi kaçınacağınızı
    öğrenirsiniz. Strateji Geliştir kullandığınızda, bir d20 attıktan sonra bir saldırı
    veya beceri stratejisi yerine savunmacı bir strateji seçebilirsiniz. Savunmacı
    Strateji: Bir sonraki turunuzun başlangıcına kadar hedefi Saldırı ile vurmayı
    deneyemezsiniz. Bir sonraki turunuzun başlangıcına kadar, hedefin neden olduğu
    etkilere karşı tüm savunmalarınıza +1 durumsal bonus kazanırsınız.
omen://feat/deflect-projectile?source=paizo-pathfinder-player-core-2:
  name: Mermiyi Saptır
  description: Tetikleyen saldırıya karşı Savunma Değerine +4 durumsal bonus kazanırsınız.
    Saldırı ıskalarsa onu saptırmış olursunuz. Bu hüneri olağandışı büyüklükteki menzilli
    mermileri (kaya veya balista okları gibi) saptırmak için kullanamazsınız.
omen://feat/deliberate-death?source=paizo-pathfinder-player-core-2:
  name: Bilinçli Ölüm
  description: Bir zamanlar bir katil, canavar veya asker sizi yere sermeyi seçtiği
    için öldünüz. Bilincinizi kaybetmeden hemen önce, tetikleyen yaratığa karşı bir
    yakın dövüş Vuruşu yapın.
omen://feat/derring-do?source=paizo-pathfinder-player-core-2:
  name: Gözü Peklik
  description: Fiyakayı daha da fazla gözü peklikle birleştirdiğinizde, bir şekilde
    işler yolunda gitmeye meyillidir. Zaten Fiyakaya sahip olduğunuzda, Fiyakalı Muharip'ten
    gelen durumsal bonusunun uygulandığı testlerde (Sıyrılıp Geç ve fiyaka özelliğine
    sahip tüm beceri eylemleri) iki kez zar atabilir ve daha yüksek olan sonucu kullanabilirsiniz.
omen://feat/desperate-wrath?source=paizo-pathfinder-player-core-2:
  name: Çaresiz Gazap
  description: Darbe aldığınızda kanınız kaynar ve dövüşü bitirmek için tedbiri elden
    bırakırsınız. Saldırı zarlarına +2 durumsal bonus, Savunma Değerine –1 ceza ve
    kurtarışlara –1 ceza alırsınız. Bu bonuslar ve cezalar Öfkeniz sona erene veya
    Can Puanınızın yarısının üzerine çıkana kadar (hangisi önce gelirse) sürer.
omen://feat/detectives-readiness?source=paizo-pathfinder-player-core-2:
  name: Dedektif Teyakkuzu
  description: Bir vaka üzerindeyken şüphelinizin yapabileceği numaralardan kaçınmak
    için uyanık ve kararlı kalırsınız. Açık bir soruşturmanın merkezindeki soruyla
    ilgili yaratıklara veya etkilere karşı kurtarışlarnda (ve normal olduğu gibi onların
    ZD'lerinde) İpucunu Takip Et'ten gelen soruşturma bonusunuzu kazanırsınız ve bir
    müttefikin o yaratığa veya etkiye karşı kurtarışa destek olmak için İpucu Ver
    eylemini kullanabilirsiniz.
omen://feat/diamond-fists?source=paizo-pathfinder-player-core-2:
  name: Elmas Yumruklar
  description: Saldırılarınızı birleştirdikçe vücudunuz sertleşerek bitirici darbelerinizi
    daha fazla hasar verici hale getirir. Silahsız saldırılarınız kuvvetli ve ölümcül
    d10 özelliklerini kazanır. Bu özelliklerden birine veya her ikisine zaten sahip
    olan saldırıların silah hasar zarları bir basamak artar.
omen://feat/didactic-strike?source=paizo-pathfinder-player-core-2:
  name: Öğretici Saldırı
  description: >
    Bariz bir zaaf bulduğunuzda müttefiklerinizi düşmanınızı yok etmeye yönlendirebilirsiniz.
    Paylaşılan Strateji kullandığınızda yalnızca bir müttefik yerine en fazla 10 müttefik
    belirleyebilirsiniz. Düşman, bir sonraki sıranızdan önce belirlenen her müttefikin
    ilk saldırısına karşı Gafil kalır ve her müttefikin ilk saldırısı isabet ederse
    hedefe fazladan 2d6 zayıf nokta hasarı verir.
  prerequisites:
  - text: Paylaşılan Strateji
omen://feat/dirty-trick?source=paizo-pathfinder-player-core-2:
  name: Kirli Numara
  description: Düşmanın ayakkabı bağcıklarını birbirine bağlar, şapkasını gözlerinin
    üzerine çeker, kemerini gevşetir ya da hileli bir taktikle hareket kabiliyetini
    sekteye uğratırsınız. Hedefin Refleks ZD'sine karşı bir test deneyin.
  prerequisites:
  - text: Eğitimli Hırsızlık
omen://feat/disarming-assault?source=paizo-pathfinder-player-core-2:
  name: Silahsızlandıran Taarruz
  description: Silahı düşmanınızın ellerinden düşürmeye yetecek güçle saldırırsınız.
    Bir yakın dövüş Saldırısı yapın; isabet ettirirseniz, o düşmanı Silahsızlandırmak
    için bir Atletizm testi deneyebilirsiniz.
  prerequisites:
  - text: Eğitimli Atletizm
omen://feat/disarming-flair?source=paizo-pathfinder-player-core-2:
  name: Silahsızlandıran Fiyaka
  description: Silahları düşmanlarınızın ellerinden fiyakayla düşürürsünüz. Silahsızlandırdığınızda
    eylem fiyaka özelliğini kazanır.
omen://feat/discreet-inquiry?source=paizo-pathfinder-player-core-2:
  name: Gizli Soruşturma
  description: >
    Bilmeniz gereken şeyleri öğrenme çabalarınızda oldukça ketumsunuzdur. Bilgi Toplarken,
    testin zorluğunu artırmadan veya Bilgi Toplamak için daha fazla zaman harcamadan,
    soruşturmanızın gerçek konusunu ilginizi çekmeyen diğer konular arasına gizleyebilirsiniz.
    Söz konusu konu hakkında bir başkasının etrafta soru sorup sormadığını belirlemek
    için Bilgi Toplamaya çalışan herhangi biri, sizin Aldatma ZD'nizi veya soruşturmalarınız
    hakkında Bilgi Toplamak için gereken normal ZD'den yüksek olanını aşmalıdır; aksi
    takdirde çabalarınızdan haberdar olamaz.
  prerequisites:
  - text: Uzman Aldatma veya Diplomasi
omen://feat/disrupt-qi?source=paizo-pathfinder-player-core-2:
  name: Qi Bozumu
  description: İç yaşam gücünü engellemek için bir yaratığın baskı noktalarını dikkatle
    hedeflersiniz. Bir silahsız Vuruş Yapın. Yaşayan bir yaratığa hasar verirse, o
    yaratık (floor(@actor.level/6))d6[persistent,void] hasar alır ve süregelen hasar
    sona erene kadar Güçten Düşmüş 1 olur. 18. seviye veya üzerindeyseniz, süregelen
    boşluk hasarı 3d6'ya yükselir.
omen://feat/distant-cackle?source=paizo-pathfinder-player-core-2:
  name: Uzak Kahkaha
  description: Yaşadığınız kahkahalarla tekinsizleşmiş ormana girmek çok cesur bir
    yürek gerektirir. Günde bir kez 1. derece okült özgü büyü olarak Vantrilokluk
    büyüleyebilirsiniz.
  prerequisites:
  - text: Witch Kholosu mirası
omen://feat/distracting-performance?source=paizo-pathfinder-player-core-2:
  name: Dikkat Dağıtıcı Gösteri
  description: >
    Gösterileriniz özellikle dikkat dağıtıcıdır ve müttefiklerinizin kolaylıkla Sessizce
    İlerlemesine olanak tanır. Aldatma yerine bir Gösteri testi atmanız ve başarılı
    testlerin faydalarının sizin yerinize seçtiğiniz bir müttefike uygulanması dışında
    Dikkat Dağıtırsınız. Başarının etkileri o müttefikin sırasının sonuna kadar sürer
    ve müttefikin eylemlerine bağlı olarak erken sona erebilir. Müttefikinizi gözlemliyor
    veya nerede olduğunu biliyor olmanız gerekmez, ancak onu seçebilmek için orada
    bulunduğunu bilmeniz gerekir. Dikkat Dağıt - Dikkat Dağıtıcı Sözler Dikkat Dağıt
    - El Kol Hareketi Dikkat Dağıt - Numara
  prerequisites:
  - text: Uzman Gösteri
omen://feat/distracting-toss?source=paizo-pathfinder-player-core-2:
  name: Dikkat Dağıtıcı Atış
  description: >
    Bir silahı fırlatırken dikkat dağıtmak için diğer silahı havaya atarsınız. 30
    fit içindeki bir yaratığı seçin ve ona karşı Yanıltıcı Hamle yapın; hedef yakın
    dövüş menzilinde olmasa bile bu Yanıltıcı Hamleyi deneyebilirsiniz ve hedef Yanıltıcı
    Hamle sonucunda Gafil kalırsa, bu süre boyunca fırlatmalı silah Vuruşlarınız için
    geçerli olur. Sonuç ne olursa olsun, fırlatmalı bir silah çekmek için Etkileşime
    Girebilir ve hedefe karşı fırlatmalı bir silahla Vuruş Yapabilirsiniz. Boş bir
    eliniz varsa, Yanıltıcı Hamle girişiminizde kritik başarısızlık yaşamadığınız
    sürece başlangıçta havaya attığınız silahı yakalarsınız; kritik başarısızlıkta
    ise silah ayaklarınızın dibine düşer.
omen://feat/disturbing-knowledge?source=paizo-pathfinder-player-core-2:
  name: Huzursuz Edici Bilgi
  description: >
    Yasaklanmış cilt ve tomarları incelemenizden elde ettiğiniz, ölümlü kavrayışının
    ötesindeki diyarların korkunç isimlerini, kehanetlerini ve tasvirlerini bir dua
    gibi art arda sıralarsınız. Dilinizi anlamayanlar bile bu dehşetengiz sırlardan
    huzursuz olur. Bir Okültizm testi deneyin ve sonucu 30 fit içindeki bir düşmanın
    İrade ZD'siyle (Okültizm konusunda efsaneviyseniz 30 fit içindeki istediğiniz
    sayıda düşmanın İrade ZD'leriyle) karşılaştırın. Bu yaratıklar 24 saat boyunca
    geçici olarak bağışık olur.
  prerequisites:
  - text: Usta Okültizm
omen://feat/divine-dragonblood?source=paizo-pathfinder-player-core-2:
  name: İlahi Ejderkan
  description: 'Soyunuzu diabolic ejderha veya empyreal ejderha gibi neredeyse tanrısal
    güçlere sahip bir ejderhaya dayandırabilirsiniz. Küçük bir ilahi koruma lütfuyla
    kutsanmışsınızdır. Din konusunda eğitimli yetkinlik derecesi kazanırsınız. Din
    konusunda otomatik olarak eğitimli olacak olsaydınız (örneğin geçmişinizden veya
    sınıfınızdan), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz. Ayrıca
    hızlı reaksiyonlarla donatılırsınız: inisiyatif zarlarına +1 durumsal bonus kazanırsınız.
    Bir ejderha timsali seçerseniz ilahi bir ejderha seçmelisiniz.'
omen://feat/dodging-roll?source=paizo-pathfinder-player-core-2:
  name: Kaçınma Yuvarlanması
  description: >
    Mümkün olan son anda bir darbeden sıyrılırsınız. Bir Adım atarsınız ve tetikleyen
    etkiye karşı seviyenize eşit miktarda tüm hasarlara karşı direnç kazanırsınız.
    Adımınız sizi tetikleyen etkinin alanının dışına çıkarırsa bu direnç seviyeniz
    artı Çeviklik bonusunuza eşit olur.
  prerequisites:
  - text: Usta Akrobasi
omen://feat/doublespeak?source=paizo-pathfinder-player-core-2:
  name: Muğlak Konuşma
  description: >
    Farklı bir şey kastederken bir şey söyleme konusunda hünerlisinizdir. Yalnızca
    müttefiklerinizin anlayacağı anlamı iletmek için ince vurgulara ve paylaşılan
    deneyimlere güvenerek gerçek kastınızı diğer sözcüklerin ve ifadelerin arkasına
    gizlersiniz. En az 1 tam hafta boyunca sizinle birlikte seyahat etmiş olan tüm
    müttefikler kastınızı otomatik olarak anlar. Diğer gözlemciler gizli bir mesaj
    ilettiğinizi fark etmek için Aldatma ZD'nize karşı bir Dikkat testinde başarılı
    olmalıdır ve mesajın kendisini anlamak için kritik başarı elde etmelidirler.
  prerequisites:
  - text: Usta Aldatma
omen://feat/draconic-arrogance?source=paizo-pathfinder-player-core-2:
  name: Ejderha Kibri
  description: Savaşın öfkesi içinizi doldururken pek az kişi sizi hedeflerinizden
    saptırabilir. Öfkeliyken duygu etkilerine karşı yapılan kurtarışlara +2 statü
    bonusu kazanırsınız.
  prerequisites:
  - text: Ejderha İçgüdüsü
omen://feat/draconic-aspect?source=paizo-pathfinder-player-core-2:
  name: Ejderha Sureti
  description: 'Saldırgan amaçla kullanabileceğiniz keskin pençeler, keskin dişlerle
    dolu bir burun veya güçlü bir sürüngen kuyruğu gibi bariz bir ejderha uzvuna sahipsinizdir.
    Aşağıdaki silahsız saldırılardan birini seçerek kazanırsınız. Saldırı boğuşma
    grubundadır ve listelenen hasar zarına ve özelliklere sahiptir: • Pençe 1d4 kesici
    (çevik, ustalık, silahsız) • Çene 1d6 delici (forceful, silahsız) • Kuyruk 1d6
    ezici (sweep, çelme, silahsız)'
omen://feat/draconic-resistance?source=paizo-pathfinder-player-core-2:
  name: Ejderha Direnci
  description: >
    Ejderha büyüsü sizi zararlardan korur. Ejderha timsalinizle ilişkili hasar türüne
    karşı seviyenizin yarısına eşit (en az 1) direnç kazanırsınız. Ejderhalar tarafından
    size verilen bu türdeki hasara karşı direnci ikiye katlayın. Ejderha timsaliniz
    ezici, delici veya kesici hasarla ilişkiliyse, bu türe karşı direnç kazanmak yerine
    asit, soğuk, ateş, elektrik veya sonik hasarı seçebilirsiniz.
omen://feat/draconic-scent?source=paizo-pathfinder-player-core-2:
  name: Ejderha Kokusu
  description: Koku alma duyunuz bir ejderhanınki kadar keskin olacak şekilde gelişti.
    30 fit menzilli hassas olmayan koku alma duyusu kazanırsınız. GM'in takdirine
    bağlı olarak, yaratığın rüzgâr altındaysanız bu menzil ikiye katlanabilir veya
    rüzgâr üstündeyseniz menzil yarıya inebilir.
omen://feat/draconic-sight?source=paizo-pathfinder-player-core-2:
  name: Ejderha Görüşü
  description: Ejderha atanızın duyularının bir parçasına sahipsinizdir. Alacakaranlık
    görüşü kazanırsınız veya soyunuz size zaten alacakaranlık görüşü sağlıyorsa karanlıkta
    görüş kazanırsınız.
omen://feat/draconic-veil?source=paizo-pathfinder-player-core-2:
  name: Ejderha Örtüsü
  description: Bazı ejderhalar gibi atanız da insansılar arasında yürümek için biçim
    değiştirme doğaüstü yeteneğine sahipti. Bu yeteneği taklit etmeyi öğrendiniz.
    Süresinin 1 saate çıkarılması dışında günde bir kez 5. derece özgü büyü olarak
    İnsansı Biçim büyüleyebilirsiniz. Büyünün geleneği ejderha timsalinizinkiyle eşleşir.
omen://feat/dragon-lore?source=paizo-pathfinder-player-core-2:
  name: Ejderha İlimi
  description: >
    Atanız ve onun soydaşları hakkında daha fazla şey öğrenmeye karar verdiniz ve
    belki de bir ejderha ebeveyn tarafından büyütüldünüz. Ejderhaların nasıl korku
    salabileceğini ama aynı zamanda bir bütün olarak topluma nasıl katkıda bulunduklarını
    anladınız. Diplomasi ve Gözdağı konularında eğitimli yetkinlik derecesi kazanırsınız.
    Bu becerilerden birinde otomatik olarak eğitimli olacak olsaydınız (örneğin geçmişinizden
    veya sınıfınızdan), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz. Ayrıca
    Ejderha İlimi için İlave Bilgi genel hünerini kazanırsınız.
omen://feat/dragon-roar?source=paizo-pathfinder-player-core-2:
  name: Ejderha Kükremesi
  description: >
    Düşmanlarınıza korku salarak kükrersiniz. Bir yayılma alanı içindeki düşmanlar
    Gözdağı ZD'nize karşı bir will|against:intimidation|options:area-effect,inflicts:frightened
    kurtarışında başarılı olmalı ya da Korkmuş 1 (kritik başarısızlıkta Korkmuş 2)
    olmalıdır. Kükremeyle korkutulan bir yaratık sırasına bitişiğinizde başladığında,
    o sıra korkmuş değerini 1'in altına indiremez. Kükredikten sonra ve bir sonraki
    sıranızın bitiminden önce korkmuş bir yaratığa isabet eden ilk saldırınız hasara
    +4 durumsal bonus kazanır. Ejderha Kükremesi'ni kullandıktan sonra 1d4 tur boyunca
    tekrar kullanamazsınız. Ejderha Duruşu'ndan çıkarsanız etkileri derhal sona erer.
    Alandaki yaratıklar daha sonra 1 dakika boyunca geçici olarak bağışık hâle gelir.
  prerequisites:
  - text: Ejderha Duruşu
omen://feat/dragon-stance?source=paizo-pathfinder-player-core-2:
  name: Ejderha Duruşu
  description: >
    Bir ejderhanın duruşuna geçer ve savrulan bir ejderha kuyruğu gibi güçlü bacak
    darbeleri vurursunuz. 1d10 ezici hasar veren ejderha kuyruğu saldırıları yapabilirsiniz.
    Bunlar boğuşma grubundadır ve backswing, öldürücü olmayan ve silahsız özelliklerine
    sahiptir. Ejderha Duruşundayken Depar atarken zorlu arazinin ilk karesini yok
    sayabilirsiniz.
omen://feat/dragon-transformation?source=paizo-pathfinder-player-core-2:
  name: Ejderha Dönüşümü
  description: >
    Vahşi, Büyük boyutta bir ejderhaya dönüşerek 6. derece Ejderha Biçimi etkilerini
    kazanırsınız; ancak kendi Savunma Değerinizi ve saldırı bonusunuzu kullanırsınız,
    Öfke'den gelen ilave hasarınızı uygularsınız ve Ejderha Nefesi eylemi sınıf ZD'nizi
    kullanır. Ejderha biçiminden gelen geçici Can Puanlarını bir öfkeye girmekten
    (veya öfke özelliğine sahip başka herhangi bir eylemden) zaten sahip olduklarınıza
    ekleyin. Dönüşümü Sonlandırma eylemi öfke özelliğini kazanır. 18. seviyede, uçma
    Hızınıza +20 fitlik statü bonusu kazanırsınız, ejderha Vuruşları ile olan hasar
    bonusunuz +12'ye yükselir ve Ejderha Nefesi hasarınıza +14 statü bonusu kazanırsınız.
  prerequisites:
  - text: Ejderha Öfkesi Kanatları
omen://feat/dragons-flight?source=paizo-pathfinder-player-core-2:
  name: Ejderha Uçuşu
  description: Küçük bir çift ejderha kanadı çıkardınız veya doğumdan beri sahip olduğunuz
    kanatları kullanma konusunda ustalaştınız. Uçarsınız. Normalde bir uçma Hızınız
    yoksa, bu hareket için 20 fitlik bir uçma Hızı kazanırsınız. Bu hareketin sonunda
    sağlam bir zeminde değilseniz düşersiniz.
omen://feat/dragons-presence?source=paizo-pathfinder-player-core-2:
  name: Ejderha Varlığı
  description: >
    Ejderhasoyunun akrabası olarak sarsılmaz bir özgüven yayarsınız (en ölümcül düşmanlar
    karşısında felaket bir şekilde çökse de). Bir korku etkisine karşı kurtarışta
    bir başarı elde ederseniz bunun yerine kritik başarı kazanırsınız. Bir korku etkisine
    karşı başarısızlık atarsanız bunun yerine kritik başarısızlık alırsınız. Ayrıca
    seviyenizdeki veya daha düşük bir düşmanın Gözdağı Vermeyi denediğinizde Gözdağı
    testine +1 durumsal bonus kazanırsınız.
  prerequisites:
  - text: Ejder Pullu Kobold mirası
omen://feat/dragons-rage-breath?source=paizo-pathfinder-player-core-2:
  name: Ejderha Öfkesi Nefesi
  description: Derin bir nefes alır ve bir koni şeklinde güçlü bir enerji üflersiniz;
    alandaki her yaratığa sınıf ZD'nize karşı bir reflex|against:barbarian|basic|options:area-effect
    kurtarışıyla (@actor.level)d6[@actor.flags.system.barbarian.instinct.dragon.damageType]|options:area-damage
    hasar verirsiniz. Hasar türü içgüdünüzün ejderha nefesiyle eşleşir ve bu eylem
    ejderha içgüdünüzün geleneğinin özelliğini kazanır.
  prerequisites:
  - text: Ejderha İçgüdüsü
omen://feat/dragons-rage-wings?source=paizo-pathfinder-player-core-2:
  name: Ejderha Öfkesi Kanatları
  description: Sırtınızdan seçtiğiniz ejderhayla aynı renkte ejderha kanatları çıkarırsınız.
    Öfkeliyken kara Hızınıza eşit bir uçma Hızı kazanırsınız. Öfkeniz sona erdiğinde
    uçuyorsanız düşmeye başlarsınız ancak dönüşümünüz son ana kadar geri dönmez, bu
    nedenle düşüşten hasar almazsınız ve ayakta yere inersiniz. Bu eylem ejderha içgüdünüzün
    geleneğinin özelliğini kazanır.
  prerequisites:
  - text: Ejderha İçgüdüsü
omen://feat/dual-finisher?source=paizo-pathfinder-player-core-2:
  name: Çifte Bitirici Hamle
  description: >
    Saldırılarınızı bölersiniz. Gerekli silahların her biriyle biri olmak üzere iki
    yakın dövüş Saldırısı yapın, her biri farklı bir düşmana karşı olmalıdır. İkinci
    Saldırı çevik olmayan bir silahla yapılırsa -2 ceza alır. Çoklu saldırı cezanızı
    ancak her iki Saldırıyı da denedikten sonra artırın.
omen://feat/duskwalker-lore?source=paizo-pathfinder-player-core-2:
  name: Alacakaranlık Gezgini İlimi
  description: >
    Ya size soyunuzun sırlarını öğreten başka bir alacakaranlık gezgini buldunuz ya
    da sıra dışı mirasınızı araştırmayı başardınız. Tıp ve Din konularında eğitimli
    yetkinlik derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak eğitimli
    olacak olsaydınız (örneğin geçmişinizden veya sınıfınızdan), bunun yerine seçtiğiniz
    bir beceride eğitimli olursunuz. Ayrıca Boneyard İlimi için İlave Bilgi genel
    hünerini kazanırsınız.
omen://feat/duskwalker-magic?source=paizo-pathfinder-player-core-2:
  name: Alacakaranlık Gezgini Büyüsü
  description: Psikopomplarla olan bağınız size yakın geleceğe göz atma ve cesetleri
    hortlaklığın tahribatından koruma gücü verir. Günde birer kez 2. derece ilahi
    özgü büyüler olarak Kehanet ve Huzurlu İstirahat büyüleyebilirsiniz.
omen://feat/duskwalker-weapon-familiarity?source=paizo-pathfinder-player-core-2:
  name: Alacakaranlık Gezgini Silah Aşinalığı
  description: >
    Bo asası, uzun yay, kompozit uzun yay, tırpan ve asaya aşinasınızdır—yetkinlik
    amacıyla, bunlardan askeri silah olanları basit silahlar, gelişmiş silah olanları
    ise askeri silahlar olarak değerlendirirsiniz. 5. seviyede, bu silahlardan biriyle
    kritik vuruş yaptığınızda onun kritik uzmanlaşma etkisini kazanırsınız.
omen://feat/eat-fortune?source=paizo-pathfinder-player-core-2:
  name: Talihi Ye
  description: Birisi kaderi bükmeye çalıştığında bu müdahaleyi tüketirsiniz. Tetikleyen
    etki bozulur. Bir talihsizlik (misfortune) etkisiyse, Talihi Ye talih özelliğini
    kazanır; bir talih etkisiyse, Talihi Ye talihsizlik özelliğini kazanır. Bu talih
    veya talihsizlik, tetikleyen etkinin uygulanacağı aynı zara uygulanır; bu nedenle
    Talihi Ye ile bir talih etkisini geçersiz kılıp ardından aynı zara bir talihsizlik
    etkisi uygulayamazsınız.
omen://feat/elegant-buckler?source=paizo-pathfinder-player-core-2:
  name: Zarif Bakler
  description: >
    Baklerinizi daha fazla koruma sağlayacak şekilde konumlandırmanın esnek bir yolunu
    öğrendiniz. Bir baklerden Savunma Değerine durumsal bonus kazanmak için Kalkan
    Kaldırdığınızda bonusu +1'den +2'ye çıkarırsınız. Bakleriniz kalkık durumdayken
    bir yaratık bir Saldırıyla sizi kritik olarak ıskalarsa, bir sonraki sıranızın
    sonuna kadar Fiyaka kazanırsınız.
omen://feat/elemental-fist?source=paizo-pathfinder-player-core-2:
  name: Element Yumruğu
  description: 'Qi''nizi parlak elementsel enerjiyle renklendirebilirsiniz. İçsel
    Çalkantı büyülediğinizde, normalde mevcut olan hasar türlerine ek olarak fazladan
    hasarı element büyüsüyle verebilir, elementin özelliğini ekleyebilir ve hasar
    türünü listelenenle değiştirebilirsiniz: hava elektrik (kıvılcımlı rüzgâr esintisi),
    toprak ezici (taş parçası), ateş ateş (titreşen alev), metal kesici (uçuşan metal
    parçaları), su soğuk (dondurucu su dalgası) veya ahşap ezici (vurucu çam kozalakları).'
  prerequisites:
  - text: İçsel Çalkantı
omen://feat/eliminate-red-herrings?source=paizo-pathfinder-player-core-2:
  name: Sahte İpuçlarını Ele
  description: Yanıltıcı araştırma yollarından kaçınma konusunda keskin bir sezginiz
    vardır. Aktif soruşturmalarınızdan birine dair bir soruyla ilgili Bilgi Hatırlamak
    için yapılan bir beceri testinde kritik başarısızlık atarsanız bunun yerine başarısızlık
    alırsınız.
omen://feat/elude-trouble?source=paizo-pathfinder-player-core-2:
  name: Beladan Sıyrıl
  description: Hızınıza kadar Depar atın. Bu hareket sizi ıskalayan yaratıktan gelen
    reaksiyonları tetiklemez.
omen://feat/embrace-the-pain?source=paizo-pathfinder-player-core-2:
  name: Acıyı Kucakla
  description: Acınızı yok sayarak uzanır ve size zarar veren yaratığı veya silahı
    yakalarsınız. Tetikleyen yaratığı Kavramak veya yaratığa size zarar verdiği silahı
    Silahsızlandırmak için bir Atletizm testi deneyin.
omen://feat/empiricists-eye?source=paizo-pathfinder-player-core-2:
  name: Deneycinin Gözü
  description: Keskin ve delici olan gözleriniz her şeyi görür ve daha fazlasını aktarır.
    İşaret Et eylemleriniz işitsel özelliğini kaybeder ve bilgiyi müttefiklerinize
    aktarmak için sesinizin duyulmasına gerek kalmaz. Ayrıca İşaret Ettiğiniz bir
    yaratık bir sonraki sıranızın başlangıcına kadar müttefiklerinize karşı Gafil
    kalır.
  prerequisites:
  - text: Deneycilik Metodolojisi
omen://feat/enduring-quickness?source=paizo-pathfinder-player-core-2:
  name: Kalıcı Çabukluk
  description: >
    Rüzgârın kendisi kadar hızlı ve yükseğe hareket edersiniz. Kalıcı olarak Hızlanmış
    durumdasınızdır. Ekstra eyleminizi Depar atmak veya Sıçramak için ya da Yüksek
    Atlama veya Uzun Atlama için gereken eylemlerden birini sağlamak amacıyla kullanabilirsiniz.
omen://feat/enjoy-the-show?source=paizo-pathfinder-player-core-2:
  name: Gösterinin Tadını Çıkar
  description: Dövüşünüze tanık olan bir müttefike veya herhangi bir seyirciye seslenerek
    düşmanlarınıza ne kadar az ilgi gerektirdiklerini gösterişle sergilersiniz. Gösteri
    Yaptığınızda 30 fit içindeki tek bir yaratığı seçebilir ve normal sonuçlar yerine
    aşağıdaki başarı, kritik başarı ve kritik başarısızlık etkilerini kullanabilirsiniz;
    bunu yaparsanız Gösteri Yapmak fiyaka özelliğinin yanı sıra hitabet için normal
    olduğu üzere işitsel ve dilsel özellikleri kazanır.
omen://feat/enthralling-allure?source=paizo-pathfinder-player-core-2:
  name: Büyüleyici Cazibe
  description: Atalarınızın uyguladığı tahakküm güçleri sizde de tezahür etti. Günde
    bir kez ilahi özgü büyü olarak Büyüle büyüleyebilirsiniz. Büyü derecesi seviyenizin
    yarısına (yukarı yuvarlanmış) eşittir, ancak 4. ve 8. derecede süresini veya hedef
    sayısını artırmaz.
omen://feat/envenom-fangs?source=paizo-pathfinder-player-core-2:
  name: Dişleri Zehirle
  description: Dişlerinizi zehirlersiniz. Bir sonraki sıranızın sonundan önce yaptığınız
    bir sonraki diş Saldırısı isabet eder ve hasar verirse, Saldırı fazladan 1d6 süren
    zehir hasarı verir. Zehir isabet ettirdiğinizde veya bir sonraki sıranızın sonunda
    (hangisi önce gelirse) etkisiz hale gelir.
  prerequisites:
  - text: Iruxi Teçhizatı (Dişler)
omen://feat/envenomed-edge?source=paizo-pathfinder-player-core-2:
  name: Zehirli Namlu
  description: Zehir bezlerinizin ve bitkisel karışımlarınızın birleşimiyle, bir düşmanın
    zayıf noktalarına vurduğunuzda tutarlı bir şekilde zehirli saldırılar yapabilirsiniz.
    Bir silah veya silahsız saldırı ile bir Saldırı kullanarak kritik vuruş yaptığınızda
    ve bu Saldırıyla kesici veya delici hasar verdiğinizde hedefinize fazladan 1d4
    süren zehir hasarı verirsiniz.
omen://feat/environmental-guide?source=paizo-pathfinder-player-core-2:
  name: Çevre Rehberi
  description: İklimlere hızla uyum sağlayabilir ve başkalarının da aynısını yapmasına
    yardımcı olabilirsiniz. Bir ortamda bir saat geçirdikten sonra, siz ve en fazla
    beş müttefikiniz bir ortamın doğal sıcaklık etkilerini bir basamak daha az şiddetli
    sayabilirsiniz (örneğin aşırı soğuğu şiddetli soğuk veya aşırı sıcağı şiddetli
    sıcak olarak değerlendirebilirsiniz). Şiddetteki bu azalma tüm teçhizatlar (soğuk
    hava donanımı gibi) veya büyüler (çevresel dayanıklılık gibi) ile birikir. Hayatta
    Kalma konusunda efsaneviyseniz kendinizi ve en fazla beş müttefiki koruyabilir
    ve sıcaklık etkilerini iki basamak daha az şiddetli sayabilirsiniz.
  prerequisites:
  - text: Usta Hayatta Kalma
omen://feat/evade-doom?source=paizo-pathfinder-player-core-2:
  name: Lanetten Kaçın
  description: Doğaüstü felaketlerden sıyrılabilirsiniz. Lanetlenmiş durumunu kazanacağınız
    zaman bir düz zar deneyebilirsiniz. Başarı durumunda Lanetlenmiş durumunu kazanmazsınız.
omen://feat/evangelize?source=paizo-pathfinder-player-core-2:
  name: Tebliğ Et
  description: İnancınızı tartışmasız bir şekilde destekleyen bir ayrıntıya işaret
    ederek dinleyicinin zihnini allak bullak edersiniz. Bir Diplomasi testi deneyin
    ve sonucu sizi duyabilen ve dilinizi anlayan tek bir hedefin İrade ZD'siyle karşılaştırın;
    bu hedef ardından tanrınız veya felsefeniz açısından 1 gün boyunca Tebliğ Et'e
    karşı geçici olarak bağışık olur. Sizinle zaten aynı fikirde olan bir yaratık
    etkilenmez ve GM'in takdirine bağlı olarak argüman sonucunda bakış açısını inancınızı
    destekleyecek şekilde samimiyetle değiştiren bir hedef de diğer bakımlardan etkilenmez.
  prerequisites:
  - text: Usta Diplomasi
  - text: belirli bir dinin veya felsefenin takipçisi
omen://feat/even-the-odds?source=paizo-pathfinder-player-core-2:
  name: Dengeyi Sağla
  description: En çaresiz anlarda en parlak şekilde parlarsınız. Kendine güvenen bir
    gülümseme takınır veya poz verirsiniz ve turunuzun sonuna kadar Fiyaka kazanırsınız.
omen://feat/everyones-a-suspect?source=paizo-pathfinder-player-core-2:
  name: Herkes Şüpheli
  description: >
    Karşılaştığınız herkesten o kadar şüphelenirsiniz ki kendi müttefikleriniz de
    dahil olmak üzere hepsini nasıl alt edeceğinize dair zihinsel notlar tutarsınız.
    Bir yaratıkla en az 1 dakika etkileşimde bulunduktan sonra, o yaratık konu olacak
    şekilde otomatik olarak İpucunu Takip Edersiniz. Herhangi bir zamanda bu türden
    istediğiniz sayıda ipucuna sahip olabilirsiniz ve tekrar İpucunu Takip Ettiğinizde
    bu otomatik konulardan hiçbirinden vazgeçmezsiniz.
omen://feat/evolved-spellhorn?source=paizo-pathfinder-player-core-2:
  name: Evrilmiş Büyü Boynuzu
  description: Doğuştan gelen mistik gücünüz büyür. Bir yaygın 1. derece mistik büyü
    ve bir yaygın 2. derece mistik büyü seçin. Bu büyülerin her birini günde bir kez
    mistik özgü büyü olarak büyüleyebilirsiniz.
omen://feat/exhort-the-faithful?source=paizo-pathfinder-player-core-2:
  name: Müminleri Gayrete Getir
  description: >
    İnancınızın ilkelerine dair bilginiz, inancınızdan olan diğer kişilerin size yardım
    etmesini veya yönlendirmelerinizi takip etmesini sağlamanın en iyi yollarına dair
    size içgörü kazandırır. Kendi inancınızın üyelerinden bir şey Rica Ettiğinizde
    veya onları Tehditle Zorladığınızda, Diplomasi veya Gözdağı yerine bir Din testi
    deneyebilirsiniz ve teste +2 durumsal bonus kazanırsınız. Rica Etme girişiminde
    kritik olarak başarısız olunduğunda hedefin size karşı tutumu kötüleşmez.
  prerequisites:
  - text: Uzman Din
  - text: belirli bir dinin takipçisi
omen://feat/expert-drill-sergeant?source=paizo-pathfinder-player-core-2:
  name: Uzman Talim Çavuşu
  description: Keşif yaparken siz öncülük ettiğinizde ve müttefikler Uzmanı Takip
    Ettiğinde, ilgili beceride +2 durumsal bonus vermek yerine uzmansanız +3 durumsal
    bonus, ustaysanız +4 durumsal bonus verirsiniz.
omen://feat/exploit-blunder?source=paizo-pathfinder-player-core-2:
  name: Hatayı Fırsata Çevir
  description: Düşmanlarınızı yakından izleyerek onların hatalarından en iyi şekilde
    yararlanabilirsiniz. Bir Adım atarsınız.
omen://feat/express-rider?source=paizo-pathfinder-player-core-2:
  name: Süratli Süvari
  description: Binek hayvanınızı mesafeleri hızla kat etmesi için teşvik edebilirsiniz.
    Binek üzerindeyken gün boyunca seyahat Hızınızı hesaplarken binek hayvanınızın
    seyahat Hızını artırmak için Hayvana Komut Vermek amacıyla bir Doğa testi deneyebilirsiniz.
    ZD, GM tarafından belirlenir ancak genellikle binek hayvanının seviyesine veya
    ortamın zorluğuna (hangisi daha zorsa) dayanır. Başarı durumunda binek hayvanınızın
    seyahat Hızını yarı yarıya artırın. Bunun binek hayvanınızın karşılaşmalardaki
    hareketine hiçbir etkisi yoktur. Bu fayda, sizinle seyahat eden tüm müttefiklerin
    de binekli olması veya en az 30 fit Hıza sahip dört ayaklılar olması koşuluyla,
    sizinle seyahat eden en fazla altı diğer müttefiki de kapsar.
  prerequisites:
  - text: Eğitimli Doğa
omen://feat/extravagant-parry?source=paizo-pathfinder-player-core-2:
  name: Gösterişli Savuşturma
  description: Fiyakayla savuşturmak için tek elli silahlar kullanırsınız. Bir sonraki
    turunuzun başlangıcına kadar Savunma Değerine +1 durumsal bonus kazanırsınız;
    boş bir eliniz varsa veya savuşturma özelliğine sahip bir silah kuşanıyorsanız
    bu bonus +2 durumsal bonus olur. Bu hünerin gereksinimini artık karşılamıyorsanız
    bu durumsal bonusunu kaybedersiniz. Bu bonusa sahipken bir yaratık bir Vuruşla
    sizi ıskalarsa, bir sonraki sıranızın sonuna kadar Fiyaka kazanırsınız.
omen://feat/eyes-of-night?source=paizo-pathfinder-player-core-2:
  name: Gecenin Gözleri
  description: Gerçek bir vampir kadar kolaylıkla karanlıkta görebilirsiniz. Karanlıkta
    görüş kazanırsınız.
  prerequisites:
  - text: alacakaranlık görüşü
omen://feat/eyes-of-the-city?source=paizo-pathfinder-player-core-2:
  name: Şehrin Gözleri
  description: Yerlilerin yardımıyla hedeflerin izini sürebilirsiniz. Yerleşim yerlerindeki
    yaratıkların İzini Sürmek için hangisinde eğitimliyseniz Diplomasi veya Sosyoloji
    kullanabilirsiniz. İzini Sürdüğünüz yaratıkların ardında bıraktığı ipuçlarını
    takip etmeye yardımcı olması için yerlilerle sohbet edersiniz. GM'in takdirine
    bağlı olarak, izin takibini sürdürmek için konuşulacak yeterli sayıda insan bulunmayabilir.
  prerequisites:
  - text: Eğitimli Diplomasi veya Sosyoloji
omen://feat/fangs?source=paizo-pathfinder-player-core-2:
  name: Sivri Dişler
  description: 'Kesici dişleriniz gerçek sivri dişlere dönüştü: uzun, keskin ve kan
    akıtmaya fazlasıyla uygun. 1d6 delici hasar veren bir diş silahsız saldırısı kazanırsınız.
    Dişleriniz boğuşma grubundadır ve kavrama ile silahsız özelliklerine sahiptir.'
omen://feat/fantastic-leaps?source=paizo-pathfinder-player-core-2:
  name: Fantastik Sıçrayışlar
  description: Tek bir sıçrayışta havada süzülürken sıçrayışlarınız yerçekimine meydan
    okur gibi görünür. Sıçrarken yatay olarak Sıçrayabileceğiniz maksimum mesafeyi
    10 fit, dikey olarak Sıçrayabileceğiniz maksimum mesafeyi 5 fit artırırsınız.
omen://feat/felicitous-riposte?source=paizo-pathfinder-player-core-2:
  name: Uğurlu Karşı Saldırı
  description: >
    Düşmanınızın verdiği açıkları tekinsiz bir talihle değerlendirirsiniz. Fırsat
    Karşı Saldırısı yaptığınızda saldırı zarında iki kez zar atın ve daha iyi olan
    sonucu kullanın.
omen://feat/fell-rider?source=paizo-pathfinder-player-core-2:
  name: Korkunç Binici
  description: Savaş alanında dehşet verici bir juggernaut olmak için yoldaş hayvanınızla
    birlikte talim yaptınız. Yoldaş Hayvanınız Gözdağı konusunda eğitimli olur. Yoldaş
    Hayvanınız bineğiniz olarak hizmet ederken Destek eylemini kullanırsa, reaksiyon
    kullanamasa bile aynı sırada Gözdağı Vermek için yaptığınız ilk Gözdağı testinde
    size Yardım Et reaksiyonunun etkilerini sağlar.
  prerequisites:
  - text: yoldaş hayvan
omen://feat/finishing-follow-through?source=paizo-pathfinder-player-core-2:
  name: Bitirici Hamle Takibi
  description: Bir düşmanı yere sermek çalımınızı korumanızı sağlar. Bitirici hamleniz
    bir hedefi 0 Can Puanına düşürdüğünde Fiyaka kazanırsınız.
omen://feat/first-to-strike-first-to-fall?source=paizo-pathfinder-player-core-2:
  name: İlk Vuran İlk Düşer
  description: Savaşın ilk turunda henüz hareket etmemiş bir yaratığa başarılı bir
    Vuruş Yaptığınızda, o yaratık bir sonraki sıranızın sonuna kadar Gafil kalır.
    O yaratık bir sonraki sıranızın sonundan önce 0 Can Puanına düşürülürse, siz ve
    yaratığın 30 fit içindeki tüm müttefikler bir sonraki sıranızın sonuna kadar Hızlanmış
    durumuna geçersiniz. Ekstra eylemi yalnızca Adım atmak, Depar atmak veya Vuruş
    Yapmak için kullanabilirsiniz.
omen://feat/flamboyant-athlete?source=paizo-pathfinder-player-core-2:
  name: Gösterişli Atlet
  description: 'Fiyakanız inanılmaz hünerler sergilemenizi sağlar: normal kapasitenizin
    çok ötesinde tırmanmak, yüzmek ve sıçramak. Fiyakaya sahip olduğunuz sürece aşağıdaki
    faydaları kazanırsınız: • Kara Hızınızın yarısına eşit tırmanma ve yüzme Hızları
    kazanırsınız. • Yüksek Atlama ve Uzun Atlamalarınızın ZD''leri 10 azalır. Bu,
    o ZD''leri azaltan diğer yeteneklerle birleşmez. • Dikey bir Sıçrama ile hareket
    edebileceğiniz mesafe 5 fite çıkar. Hızınız en az 15 fit ise yatay Sıçrama mesafeniz
    15 fite, Hızınız en az 30 fit ise 20 fite çıkar.'
  prerequisites:
  - text: Uzman Atletizm
omen://feat/flamboyant-leap?source=paizo-pathfinder-player-core-2:
  name: Gösterişli Sıçrayış
  description: >
    Fiyakayla sıçrar ve güçlü bir bitirici darbe indirirsiniz. Bir Sıçrama, Yüksek
    Atlama veya Uzun Atlama yapın ve zıplayışınız sırasında herhangi bir noktada tek
    eylemli bir bitirici hamle deneyin; bitirici hamle Hareketli Bitirici Hamle gibi
    başka bir hareket içeren bir hamle olamaz. Bitirici hamleden hemen sonra havadaysanız,
    sıçrayışınızın maksimum mesafesine ulaşmamış olsanız bile yere düşersiniz. Düştüğünüz
    mesafe sıçrayışınızın yüksekliğinden fazla değilse hasar almazsınız ve ayakta
    yere inersiniz. Gösterişli Sıçrayış sırasında bir Yüksek Atlama veya Uzun Atlama
    denerken Uzun Atlama ZD'lerini kullanarak ZD'yi belirleyin ve maksimum mesafeyi
    yalnızca Hızınız yerine Hızınızın iki katına çıkarın.
  prerequisites:
  - text: Usta Atletizm
  - text: Gösterişli Atlet
omen://feat/flashy-dodge?source=paizo-pathfinder-player-core-2:
  name: Fiyakalı Kaçınma
  description: Ustalıkla yoldan çekilerek tetikleyen saldırıya karşı Savunma Değerine
    +2 durumsal bonus kazanırsınız. Saldırı ıskalarsa bir sonraki sıranızın sonuna
    kadar Fiyaka kazanırsınız.
omen://feat/flashy-roll?source=paizo-pathfinder-player-core-2:
  name: Fiyakalı Yuvarlanma
  description: >
    Fiyakalı Kaçınma'yı asıl tetikleyicisine ek olarak bir Refleks kurtarışı denemeden
    önce de kullanabilirsiniz. Bunu yaparsanız durumsal bonus tetikleyen etkiye karşı
    Refleks kurtarışınıza uygulanır. Fiyakalı Kaçınma'yı kullandığınızda ve tetikleyen
    saldırı başarısız veya kritik başarısız olduğunda ya da kurtarışta başarılı veya
    kritik başarılı olduğunuzda reaksiyonun bir parçası olarak 10 fite kadar Depar
    da atabilirsiniz. Bunu yaparsanız reaksiyon hareket (move) özelliğini kazanır.
    İlgili hareket türüne sahipseniz Fiyakalı Yuvarlanma'yı Depar atmak yerine Uçarken
    veya Yüzerken de kullanabilirsiniz.
  prerequisites:
  - text: Fiyakalı Kaçınma
omen://feat/fleeing-shriek?source=paizo-pathfinder-player-core-2:
  name: Kaçış Çığlığı
  description: >
    Kulakları sağır eden bir çığlık atarsınız. Bir yayılma alanı içindeki her yaratık,
    sınıf ZD'niz veya büyü ZD'nizden hangisi daha yüksekse ona karşı bir fortitude|against:class-spell|basic|options:area-effect
    kurtarışla ceil(@actor.level/2)d6[sonic]|options:area-damage hasar alır. Ardından
    Depar atarsınız ve bu hareket kurtarışta başarısız veya kritik başarısız olan
    hiçbir yaratıktan reaksiyon tetiklemez. 11. seviyede ve sonrasındaki her 2 seviyede
    bir hasar 1d6 artar.
omen://feat/flexible-studies?source=paizo-pathfinder-player-core-2:
  name: Esnek Çalışmalar
  description: Çeşitli görevlere hazırlanırken başvurabileceğiniz çeşitli disiplinler
    hakkında kapsamlı bir bilgi birikimi topladınız. Günlük hazırlıklarınız sırasında
    seçtiğiniz bir beceride geçici olarak eğitimli olmak için belirli bir konuya yoğunlaşabilirsiniz.
    Bu yetkinlik tekrar hazırlanana kadar sürer. Bu yetkinlik geçici olduğundan beceri
    artışı veya hüner gibi kalıcı bir karakter seçeneği için bir ön koşul olarak kullanamazsınız.
omen://feat/flexible-tail?source=paizo-pathfinder-player-core-2:
  name: Esnek Kuyruk
  description: Kilitli olmayan bir kapıyı açmak gibi basit Etkileşime Gir eylemlerini
    kuyruğunuzla gerçekleştirebilirsiniz. Kuyruğunuz parmak veya önemli bir el becerisi
    gerektiren eylemleri (başarmak için bir zar gerektiren herhangi bir eylem dahil)
    gerçekleştiremez ve onu eşyaları tutmak için kullanamazsınız.
omen://feat/flurry-of-maneuvers?source=paizo-pathfinder-player-core-2:
  name: Manevra Yaylımı
  description: Yaylımınız bir manevralar kombinasyonudur. Darbe Yaylımı sırasındaki
    saldırılarınızdan birini veya her ikisini Kavrama, Yerinden Oynatma, İtme veya
    Çelme Takma ile değiştirebilirsiniz.
  prerequisites:
  - text: Uzman Atletizm
omen://feat/flying-blade?source=paizo-pathfinder-player-core-2:
  name: Uçan Bıçak
  description: Fiyakalı tekniklerinizi yakın dövüş saldırılarına olduğu kadar fırlatmalı
    silahlara da kolaylıkla uygularsınız. O silahın ilk menzil kademesi içinde fırlatmalı
    bir silahla yaptığınız menzilli Vuruşlarda Hassas Saldırı hasarınızı uygularsınız.
    Fırlatmalı silah çevik veya ustalık bir silah olmalıdır. Bu ayrıca Özgüvenli Bitirici
    Hamle ve hassas saldırınızdan yararlanabilecek bir Saldırı içeren diğer herhangi
    bir bitirici hamle için fırlatmalı silahla menzilli Vuruş Yapmanıza da olanak
    tanır.
  prerequisites:
  - text: Hassas Saldırı
omen://feat/flying-kick?source=paizo-pathfinder-player-core-2:
  name: Uçan Tekme
  description: >
    Kendinizi bir düşmana doğru fırlatırsınız. Bir Sıçrama yapın ya da bir Yüksek
    Atlama veya Uzun Atlama deneyin. Atlamanın sonunda bir düşmana bitişikseniz, düşman
    havada olsa bile o düşmana silahsız bir saldırıyla hemen Vuruş Yapabilirsiniz.
    Saldırıdan sonra yere düşersiniz. Düştüğünüz mesafe zıplayışınızın yüksekliğinden
    fazla değilse ayakta yere iner ve hasar almazsınız.
omen://feat/focused-fascination?source=paizo-pathfinder-player-core-2:
  name: Odaklanmış Büyülenme
  description: Bir çatışma karşılaşmasında Büyüleyici Gösteri kullandığınızda, hedefinizi
    Kendini Kaptırmış durumuna getirmek için kritik başarı yerine yalnızca bir başarıya
    ihtiyacınız vardır. Bu yalnızca tek bir hedefi Kendini Kaptırmış duruma getirmeye
    çalışıyorsanız işe yarar. Örneğin Gösteri konusunda uzmansanız, normal şekilde
    birden fazla yaratığı hedeflemeyi seçebilir veya tek bir yaratığı hedefleyip onu
    bir başarıda Kendini Kaptırmış duruma getirebilirsiniz.
  prerequisites:
  - text: Büyüleyici Gösteri
omen://feat/focused-shot?source=paizo-pathfinder-player-core-2:
  name: Odaklanmış Atış
  description: >
    Saldırınızı serbest bırakmadan önce kusursuz bir dinginlik durumuna ulaşır, isabetinizi
    artırmak için zihninizi çevrenizdeki dünyanın ince hareketlerine açarsınız. Silahınızın
    ilk menzil kademesi içindeki bir hedefe karşı menzilli bir silahla Vuruş Yapın.
    Bu Vuruş hedefin Belirsiz durumunu ve tüm siperlerini yok sayar.
  prerequisites:
  - text: Manastır Okçusu Duruşu
omen://feat/follow-up-assault?source=paizo-pathfinder-player-core-2:
  name: Devam Taarruzu
  description: Başarısızlık karşısında bile başarmaya kararlı bir şekilde saldırıyı
    sürdürürsünüz. Aynı silahla bu Vuruşa karşı savuruş ve kuvvetli silah özelliklerini
    ekleyerek bir Vuruş Yapın.
omen://feat/forensic-acumen?source=paizo-pathfinder-player-core-2:
  name: Adli Sezgi
  description: >
    Adli tıbbın ilkelerini anlar, ölüm veya yaralanma nedenini belirlemek için bir
    cesedi inceleme konusunda daha iyi hale gelirsiniz. Tıp becerisindeki Bilgi Hatırla
    altında açıklandığı üzere bir ceset üzerinde adli incelemeyi normalde alacağı
    sürenin yarısında (en az 5 dakika olacak şekilde) gerçekleştirebilirsiniz. Testinizde
    başarılı olursanız bulduğunuz bir şeyi takip etmek için +2 durumsal bonus ile
    hemen Bilgi Hatırlamak amacıyla bir test deneyebilirsiniz. Bu test genellikle
    kullanılan bir zehri veya silahı belirlemek için bir Zanaat testi ya da belirli
    bir hastalığı belirlemek için ilave bir Tıp testi gibi yaralanma veya ölüm nedeni
    ile ilgilidir. Tercih ederseniz uygun beceriyi kullanarak ve aynı durumsal bonusunu
    alarak cesedini incelediğiniz yaratığın türü hakkında Bilgi Hatırlamayı da deneyebilirsiniz.
    Tıp konusunda usta yetkinliğe sahipseniz durumsal bonus +3'e, efsanevi yetkinliğe
    sahipseniz +4'e yükselir.
  prerequisites:
  - text: Eğitimli Tıp
omen://feat/foresee-danger?source=paizo-pathfinder-player-core-2:
  name: Tehlikeyi Öngör
  description: >
    Düşmanınızın saldırısının isabet edebileceği her olası yolu sezer ve hepsinden
    kaçınmaya çalışırsınız. Tetikleyen saldırı zarı Savunma Değeriniz yerine Dikkat
    ZD'nizi hedefler. Bu, Savunma Değerinize ceza almaktan kaçınmanızı sağlasa da
    bu tür cezalara neden olan hiçbir durumu veya diğer etkiyi ortadan kaldırmaz.
    Örneğin sinsi saldırıya sahip bir düşman, saldırıya karşı savunurken –2 durumsal
    ceza almasanız bile Gafil olduğunuz için size yine de fazladan hasar verir.
omen://feat/form-of-the-bat?source=paizo-pathfinder-player-core-2:
  name: Yarasa Biçimi
  description: Zararsız bir yarasaya dönüşebilirsiniz. Her zaman bir yarasaya dönüşmeniz
    dışında 4. derece Haşere Biçimi etkilerini kazanırsınız.
omen://feat/form-of-the-dragon?source=paizo-pathfinder-player-core-2:
  name: Ejderha Biçimi
  description: Ejderha soyunuzun kusursuz bir örneğine kısa süreliğine dönüşebilirsiniz.
    Günde bir kez 8. derece özgü büyü olarak Ejderha Biçimi büyüleyebilirsiniz. Bu
    büyü ejderha timsalinizle aynı geleneğe sahiptir. Bu özgü büyüyü büyülediğinizde
    ejderha timsalinize dönüşmelisiniz. Ancak Mistik Ejderkan, İlahi Ejderkan, Okült
    Ejderkan veya İlkel Ejderkan kalıtsal hünerine sahipseniz bunun yerine o geleneğe
    ait herhangi bir ejderhayı seçebilirsiniz.
omen://feat/formidable-breath?source=paizo-pathfinder-player-core-2:
  name: Heybetli Nefes
  description: Sıkı nefes egzersizleri ve soyunuza benzer bir beslenme düzeni sayesinde
    büyülü nefesiniz daha güçlüdür. Ejderha Nefesinizin alanı bir koni için 30 fite
    veya bir hat için 60 fite çıkar ve hasar zarları d4 yerine d6 olur.
  prerequisites:
  - text: Ejderha Nefesi (Ejderkan)
omen://feat/fossil-rider?source=paizo-pathfinder-player-core-2:
  name: Fosil Binicisi
  description: Atalarınızın kemiklerini kullanarak onların ruhlarını etrafınızda fosilleşmiş
    bir biçimde tezahür ettirirsiniz. Günde bir kez kendinize özgü büyü olarak Terör
    Maskesi büyüleyebilirsiniz. Bunu yaptığınızda sizi gözlemleyenlerin en derin korkularını
    uyandıracak şekilde bükülmüş, iskeletimsi bir kertenkeleadam atası olarak görünürsünüz.
  prerequisites:
  - text: Kemik Büyüsü
omen://feat/friendly-toss?source=paizo-pathfinder-player-core-2:
  name: Dostça Fırlatma
  description: Dostlarınızı savaş alanında fırlatırsınız. Boyutunuzda veya daha küçük
    olan bitişiğinizdeki bir müttefiki kaldırın ve 30 fit içinde görebildiğiniz boş
    bir alana fırlatın. Onların hareketi reaksiyonları tetiklemez. Müttefikiniz bu
    hareketi ayakları üzerinde tamamlar ve düşüşten hasar almaz. Müttefikiniz bu hareketi
    en az bir düşmanın yakın dövüş erişim mesafesinde tamamlarsa, böyle bir düşmana
    karşı bir yakın dövüş Saldırısı yapmak için reaksiyonunu kullanabilir.
omen://feat/furious-bully?source=paizo-pathfinder-player-core-2:
  name: Öfkeli Zorba
  description: Savaş alanındaki düşmanları hırpalarsınız. Öfkeliyken saldırı eylemleri
    için yapılan Atletizm testlerine +2 durumsal bonus kazanırsınız.
  prerequisites:
  - text: Usta Atletizm
omen://feat/furious-finish?source=paizo-pathfinder-player-core-2:
  name: Öfkeli Bitiş
  description: Dövüşü bitirmek için çaresiz kalarak tüm öfkenizi son bir darbeye akıtırsınız.
    Bir Vuruş Yapın. İsabet ederse Öfkenizde kalan tur sayısına eşit (en fazla 10)
    bir hasar durumsal bonus kazanırsınız. Bu Vuruştan sonra Öfkeniz hemen sona erer
    ve en az 10 dakika dinlenene kadar Bitkin düşersiniz.
omen://feat/furious-grab?source=paizo-pathfinder-player-core-2:
  name: Öfkeli Kavrama
  description: Saldırınızla dikkati dağılmışken düşmanınızı yakalarsınız. Vurduğunuz
    düşman, sanki onu Kavramak için yapılan bir Atletizm testinde başarılı olmuşsunuz
    gibi Kavranmış durumuna düşer.
omen://feat/furious-sprint?source=paizo-pathfinder-player-core-2:
  name: Öfkeli Depar
  description: İleriye doğru hücum edersiniz. Beş kereye kadar (3 eylem kullandıysanız
    sekiz kereye kadar) Depar atın. Tüm bu hareket düz bir hat üzerinde olmalıdır
    (GM makul bir sapmaya izin verebilir). İhtiyaç duyarsanız bu Deparlardan herhangi
    birini Denge eylemiyle değiştirebilirsiniz; bunu aynı ZD'yi kullanarak Akrobasi
    testi yerine bir Atletizm testiyle denersiniz.
omen://feat/furious-vengeance?source=paizo-pathfinder-player-core-2:
  name: Öfkeli İntikam
  description: Düşmanınızın darbesi öfkenizi körükler ve anında misilleme yapmanıza
    neden olur. Tetikleyen düşmana karşı bir yakın dövüş Vuruşu yapın.
  prerequisites:
  - text: Gazap İçgüdüsü
omen://feat/fuse-stance?source=paizo-pathfinder-player-core-2:
  name: Bileşik Duruş
  description: >
    İki duruşu tamamen kendinize ait tek bir duruşta birleştirdiniz. Bu hüneri aldığınızda
    bildiğiniz iki duruşu seçin ve bunları tek bir kaynaşmış duruşta birleştirin.
    Yeni kaynaşmış duruşunuza benzersiz bir isim verin. Kaynaşmış duruşunuza girdiğinizde
    gereksinimler ve kısıtlamalar da dahil olmak üzere her iki duruşun tüm etkilerini
    kazanırsınız. Duruşların her ikisi de özel saldırılar sağlıyorsa bu saldırıların
    tümünü kazanırsınız. Bir duruş sizi belirli bir saldırıyla kısıtlıyorsa (Turna
    Duruşu gibi), bu kısıtlamaya uymalısınız. Kaynaşmış duruşlar uyumsuz kısıtlamalara
    sahipse hangilerinin geçerli olacağına veya bu duruşları hiç birleştiremeyeceğinize
    GM karar verir.
  prerequisites:
  - text: en az iki duruş
omen://feat/geckos-grip?source=paizo-pathfinder-player-core-2:
  name: Geko Tutuşu
  description: Doğaüstü bir kavrayışla duvarlara tutunursunuz. Bonus hüner olarak
    Dövüş Tırmanıcısı hünerini kazanırsınız ve tırmanmak için yapılan bir Atletizm
    testinde bir başarı atarsanız bunun yerine kritik başarı elde edersiniz.
omen://feat/get-used-to-disappointment?source=paizo-pathfinder-player-core-2:
  name: Hayal Kırıklığına Alış
  description: Rakibinizin başarısızlığını kendinizle rakibiniz arasındaki beceri
    uçurumunu ona hatırlatarak kendini beğenmiş bir tavır ve çalımla fırsata çevirirsiniz.
    Rakibin Gözdağı Vermeyi denersiniz. Sonuç ne olursa olsun hedef 1 dakika boyunca
    geçici olarak bağışık olur.
  prerequisites:
  - text: Uzman Gözdağı
omen://feat/ghost-hunter?source=paizo-pathfinder-player-core-2:
  name: Hayalet Avcısı
  description: Boneyard ile olan bağınız, darbelerinizin hayaletsi varlıklara karşı
    tam isabet bulmasını sağlar. Cisimleşmemiş yaratıklara karşı yaptığınız silah
    ve silahsız Vuruşlarınız büyülü hale gelir. Zaten büyülüyse bunun yerine hayalet
    dokunuşu (ghost touch) nitelik rününün etkilerini kazanırlar.
omen://feat/giants-lunge?source=paizo-pathfinder-player-core-2:
  name: Dev Hamlesi
  description: Vücudunuzu uzatır ve normal erişim mesafenizin dışındaki düşmanlara
    saldırmaya hazırlanırsınız. Öfkeniz sona erene kadar tüm yakın dövüş silahlarınız
    ve silahsız saldırılarınız 10 fitlik bir erişim mesafesi kazanır. Bu, halihazırda
    erişim özelliğine sahip olan herhangi bir silahın veya silahsız saldırının erişimini
    artırmaz ancak Dev Cüssesi gibi artan boyut nedeniyle erişiminizi artıran yeteneklerle
    birleşir.
  prerequisites:
  - text: Dev İçgüdüsü
omen://feat/giants-stature?source=paizo-pathfinder-player-core-2:
  name: Dev Cüssesi
  description: İnanılmaz bir boyuta ulaşırsınız. Büyük boyuta geçerek erişiminizi
    5 fit artırır ve öfkenizi durdurana kadar Sakar 1 durumunu kazanırsınız. Teçhizatınız
    sizinle birlikte büyür.
  prerequisites:
  - text: Dev İçgüdüsü
omen://feat/glean-contents?source=paizo-pathfinder-player-core-2:
  name: İçeriği Çıkar
  description: Dağınık kâğıtları hızla tarama ve mühre zarar vermeden mühürlü mektupların
    içeriğini dikkatle sezme konusunda ustasınızdır. Yalnızca kısmen görülebilen,
    bakış açınıza göre baş aşağı veya ters duran bir mesaj üzerinde Yazıyı Çözmek
    için Sosyoloji testleri deneyebilir ve bunu yaparken teste +1 durumsal bonus kazanırsınız.
    Bu hüneri mühürlü mektupları deşifre etmek için de kullanabilir, Yazıyı Çözme
    girişiminize manipülasyon özelliğini eklersiniz. Bu, tanıkların çabalarınızı fark
    etmesini engellemez; fark edilmekten kaçınmak için Aldatma veya Gizlilik testleri
    denemeniz gerekebilir. Bu hünerin her iki kullanımında da kritik bir başarısızlıkta
    alıcı çabalarınızdan haberdar olur (örneğin dikkatle bakarken yakalanabilirsiniz
    veya kâğıtları sahibinin fark edeceği şekilde dağıtabilirsiniz).
  prerequisites:
  - text: Eğitimli Sosyoloji
omen://feat/goading-feint?source=paizo-pathfinder-player-core-2:
  name: Kışkırtıcı Yanıltma
  description: Numaralarınız düşmanların saldırılarında haddinden fazla açılmasına
    yol açar. Bir Yanıltıcı Hamlede, Yanıltıcı Hamle yaptığınızda kazanacağınız diğer
    etkiler yerine aşağıdaki başarı ve kritik başarı etkilerini kullanabilirsiniz;
    bunu yaparsanız Yanıltıcı Hamlenizin normal etkilerini ayarlayan diğer yetenekler
    artık geçerli olmaz. Belirli bir düşmana her Yanıltıcı Hamle yaptığınızda Kışkırtıcı
    Yanıltma faydalarını mı yoksa normal faydaları mı kullanacağınızı seçebilirsiniz.
  prerequisites:
  - text: Eğitimli Aldatma
omen://feat/godbreaker?source=paizo-pathfinder-player-core-2:
  name: Tanrıkıran
  description: >
    En kudretli düşmanları bile kırıp geçirebilecek nihai bir boğuşma tekniğinde ustalaştınız.
    Yaratığı 20 fit havaya fırlatır, güçlü bir sıçrayışla ardından gider ve sonra
    silahsız bir Vuruş Yaparsınız. Vuruş başarılı olursa bu süreci iki kez daha tekrarlayabilir,
    her Vuruşla yaratığı doğrudan havaya 20 fit daha taşıyabilirsiniz; yaratık sekans
    boyunca kavranmış veya zaptedilmiş durumunu korur. Vuruşlardan herhangi birini
    ıskalarsanız Tanrıkıran ile kavranmış veya zaptedilmiş durumu hemen sona erer
    ve hem siz hem de rakibiniz düşerek sıçrayışınızın toplam yüksekliği kadar normal
    düşme hasarı alırsınız. Üç Vuruş da başarılı olursa yaratığı hemen yakalar ve
    yere çarparak ona silahsız Vuruş hasarınız artı düşme hasarı verirsiniz. Yaratığın
    bitişiğinde ayaklarınızın üzerine inersiniz, düşüşten hasar almazsınız ve yaratık
    tarafınızdan kavranmış veya zaptedilmiş kalmaya devam eder.
  prerequisites:
  - text: Ezici Kavrama
  - text: Fırıldak Fırlatma
omen://feat/graceful-guidance?source=paizo-pathfinder-player-core-2:
  name: Zarif Rehberlik
  description: Tehlikeli etkilerden nasıl hızla sıyrılacağını gösterebilirsiniz. Bir
    müttefikin Refleks kurtarışa bonus vermek için Yardım Et reaksiyonunu kullanabilirsiniz.
    Yardım Et için her zamanki gibi müttefiki cesaretlendirmek amacıyla sıranızda
    bir eylem kullanarak hazırlanmanız gerekir.
omen://feat/grandmaster-qi-spells?source=paizo-pathfinder-player-core-2:
  name: Büyükusta Qi Büyüleri
  description: Yalnızca hem bedenlerinde hem de ruhlarında tam bir ustalık elde edenlerin
    ulaşabileceği bir qi tekniğinin kilidini açtınız. Hiçliği Kucakla, Qi Biçimi veya
    erişiminiz olan başka bir 9. derece qi büyüsü kazanırsınız.
  prerequisites:
  - text: Qi Büyüleri
omen://feat/grandmothers-wisdom?source=paizo-pathfinder-player-core-2:
  name: Büyükanne Bilgeliği
  description: Atalarınızın kemiklerini yanınızda taşır ve onlardan öğüt isteyebilirsiniz.
    Günde iki kez 2. derece okült özgü büyü olarak Kehanet büyüleyebilirsiniz.
omen://feat/gravesight?source=paizo-pathfinder-player-core-2:
  name: Mezar Görüşü
  description: Bir psikopomp kadar kolaylıkla karanlıkta görebilirsiniz. Karanlıkta
    görüş kazanırsınız.
  prerequisites:
  - text: alacakaranlık görüşü
omen://feat/great-cleave?source=paizo-pathfinder-player-core-2:
  name: Büyük Yarma
  description: Öfkeniz silahınızı birden fazla düşmanın arasından geçirir. Yarma yaptığınızda
    Vuruşunuz hedefini 0 Can Puanına da düşürürse, bir yaratığı 0 Can Puanına düşürmeyen
    bir Vuruş Yapana kadar veya Yarma sırasında saldırdığınız en son yaratığın bitişiğinde
    hiç yaratık kalmayana kadar (hangisi önce gelirse) yakın dövüş Vuruşları yapmaya
    devam edebilirsiniz.
  prerequisites:
  - text: Yarma
omen://feat/great-tengu-form?source=paizo-pathfinder-player-core-2:
  name: Ulu Tengu Biçimi
  description: Büyük, kanatlı bir ruhun heybetli biçimine bürünürsünüz. Günde bir
    kez Uzun Burunlu Biçim'i kullanmanın bir parçası olarak 4. derece Büyüt ve Uçuş
    büyülerinin de faydalarını kazanırsınız. Bu etki 5 dakika veya Uzun Burunlu Biçiminizden
    çıkana kadar (hangisi önce olursa) sürer.
  prerequisites:
  - text: Uzun Burunlu Biçim
omen://feat/greater-than-the-sum?source=paizo-pathfinder-player-core-2:
  name: Bütünden Daha Büyük
  description: Savaşta ezici bir güç haline gelmek için müttefiklerinizle ve diğer
    sıçansoylarla paylaştığınız ailesel bağlara başvurursunuz. Günde bir kez 6. derece
    ilkel özgü büyü olarak Büyüt büyüleyebilirsiniz.
omen://feat/grovel?source=paizo-pathfinder-player-core-2:
  name: Yerlere Kapanma
  description: Düşmanınızı daha az bir tehdit olduğunuza ikna edersiniz. Bir yaratığa
    karşı Yanıltıcı Hamle yapmayı denersiniz. Normal bir Yanıltıcı Hamleden farklı
    olarak yaratık yakın dövüş erişim mesafenizde olmak yerine 30 fit içinde olabilir
    ve testinizi yaratığın Dikkat ZD'si yerine İrade ZD'sine karşı yaparsınız.
  prerequisites:
  - text: Eğitimli Aldatma
omen://feat/guarded-movement?source=paizo-pathfinder-player-core-2:
  name: Temkinli Hareket
  description: Hareket ederken bile savunmanız yerindedir. Hareketinizin tetiklediği
    reaksiyonlara karşı Savunma Değerine +4 durumsal bonus kazanırsınız.
omen://feat/guardians-deflection-swashbuckler?source=paizo-pathfinder-player-core-2:
  name: Muhafızın Savuşturması (Kabadayı)
  description: Müttefikinize yönelik saldırıyı saptırmak için silahınızı kullanarak
    tetikleyen saldırıya karşı müttefikinizin Savunma Değerine +2 durumsal bonus verirsiniz.
    Bu, tetikleyen kritik vuruşu bir vuruşa veya tetikleyen vuruşu bir ıskalamaya
    dönüştürür. Bir sonraki sıranızın sonuna kadar Fiyaka kazanırsınız.
omen://feat/harbingers-caw?source=paizo-pathfinder-player-core-2:
  name: Habercinin Gaklaması
  description: Uğursuzca gaklayarak yaratığı talihsizlikle lanetlersiniz. Hedef yaratık
    tetikleyen zarı iki kez atmalı ve daha düşük olan sonucu almalıdır.
omen://feat/hobgoblin-lore?source=paizo-pathfinder-player-core-2:
  name: Hobgoblin İlimi
  description: >
    Hepsi militarist bir eğilime sahip olan geleneksel hobgoblin egzersizlerini ve
    arazi sanatını incelediniz. Atletizm ve Zanaat konularında eğitimli yetkinlik
    derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak eğitimli olacak
    olsaydınız (örneğin geçmişinizden veya sınıfınızdan), bunun yerine seçtiğiniz
    bir beceride eğitimli olursunuz. Hobgoblin İlimi için İlave Bilgi genel hünerini
    kazanırsınız.
omen://feat/hobgoblin-weapon-familiarity?source=paizo-pathfinder-player-core-2:
  name: Hobgoblin Silah Aşinalığı
  description: >
    Hobgoblin özelliğine sahip tüm sıra dışı silahlara erişim kazanırsınız. Hobgoblin
    özelliğine sahip silahların yanı sıra kompozit uzun yay, kompozit kısa yay, kargı,
    uzun yay, uzun kılıç ve kısa yaya aşinasınızdır—yetkinlik amacıyla, bunlardan
    askeri silah olanları basit silahlar, gelişmiş silah olanları ise askeri silahlar
    olarak değerlendirirsiniz. 5. seviyede, bu silahlardan biriyle kritik vuruş yaptığınızda
    onun kritik uzmanlaşma etkisini kazanırsınız.
omen://feat/hone-claws?source=paizo-pathfinder-player-core-2:
  name: Pençeleri Bile
  description: Pençelerinize özellikle zalimce bir keskinlik kazandırmak için onları
    sürter veya kemirirsiniz. İsabet edip hasar verdiğiniz bir sonraki pençe Vuruşu
    fazladan 1d6 kanama hasarı verir. Aynı anda birden fazla Pençeleri Bile etkisini
    aktif tutamazsınız.
  prerequisites:
  - text: Iruxi Teçhizatı (Pençeler)
omen://feat/hop-up?source=paizo-pathfinder-player-core-2:
  name: Sıçrayıp Kalkma
  description: Kurbağa benzeri çevikliğiniz siz uyanır uyanmaz harekete geçer. Ayağa
    Kalkarsınız. Bu hareket reaksiyonları tetiklemez.
omen://feat/hunters-defense?source=paizo-pathfinder-player-core-2:
  name: Avcı Savunması
  description: Doğal ve ilkel yaratıklara dair kurnazca kavrayışınız, onların saldırılarını
    öngörmenize ve onlardan kaçınmanıza yardımcı olur. Tetikleyen saldırı zarı Savunma
    Değeriniz yerine Doğa ZD'nizi hedefler. Bu, Savunma Değerinize ceza almaktan kaçınmanızı
    sağlasa da bu tür cezalara neden olan hiçbir durumu veya diğer etkiyi ortadan
    kaldırmaz. Örneğin sinsi saldırıya sahip bir düşman, saldırıya karşı savunurken
    –2 durumsal ceza almasanız bile Gafil olduğunuz için size yine de fazladan hasar
    verir.
  prerequisites:
  - text: Eğitimli Doğa
omen://feat/hyena-familiar?source=paizo-pathfinder-player-core-2:
  name: Sırtlan Ruhdaş Hayvan
  description: Sırtlanlar khololara evcil hayvan ve iz sürücü olarak hizmet eder.
    Sizin gibi bazı khololar, büyülü ruhlar için kap görevi gören daha küçük sırtlanların
    dikkatini çeker. Ruhdaş Hayvan olarak Minik bir sırtlan kazanırsınız.
omen://feat/illimitable-finisher?source=paizo-pathfinder-player-core-2:
  name: Sınırsız Bitirici Hamle
  description: Darbeleriniz sonsuz bir akışla devam eder. Adım atın ve tek eylemli
    tek bir bitirici hamle deneyin. Bu Vuruş fiyaka özelliğini kazanır ve muhtemelen
    Fiyakanızı yeniler; fiyakanızı geri kazanırsanız, bir bitirici hamleden sonra
    saldırı özelliğine sahip eylemleri kullanma kısıtlamasını yok sayarak bu eylemin
    bir parçası olarak hemen başka bir bitirici hamle deneyebilirsiniz.
omen://feat/immortal-techniques?source=paizo-pathfinder-player-core-2:
  name: Ölümsüz Teknikler
  description: Ustalaştığınız her tarzı benimsedikçe kendinizi yenileyerek bir teknikten
    diğerine akarsınız. Her turda hem keşiş hem de duruş özelliklerine sahip bir eylemi
    ilk kez kullandığınızda, bir sonraki sıranızın başlangıcına kadar süren 20 geçici
    Can Puanı kazanırsınız.
  prerequisites:
  - text: Birçok Tarzın Ustası
omen://feat/impaling-bone?source=paizo-pathfinder-player-core-2:
  name: Saplanan Kemik
  description: Günde bir kez, kazığın soğuk demir yerine kemikten yapılması dışında
    Saplayıcı Kazık büyüsünü 7. derece okült özgü büyü olarak büyüleyebilirsiniz.
    Büyüden çıkan kemik hayalet dokunuşu (ghost touch) nitelik rününün etkilerine
    sahiptir ve cisimleşmemiş yaratıkları sanki cismaniymiş gibi Hareketsizleştirebilir.
omen://feat/impaling-finisher?source=paizo-pathfinder-player-core-2:
  name: Saplayıcı Bitirici Hamle
  description: >
    Tek bir batırmayla iki düşmanı şişlersiniz veya tek bir yumrukla onları birbirine
    çarparsınız. Ezici veya delici bir yakın dövüş Vuruşu yapın ve saldırı zarı sonucunu
    en fazla iki düşmanın Savunma Değeriyle karşılaştırın. Düşmanlardan biri bitişiğinizde
    olmalı ve diğer düşman alanınızdan düz bir hat üzerinde birinci düşmanın doğrudan
    arkasında ve ona bitişik olmalıdır. Hasarı bir kez atın ve vurduğunuz her yaratığa
    uygulayın. Bir Saplayıcı Bitirici Hamle, çoklu saldırı cezanızı hesaplarken iki
    saldırı sayılır.
omen://feat/impaling-thrust?source=paizo-pathfinder-player-core-2:
  name: Saplayıcı Hamle
  description: Düşmanınızı şişler, silahınızla yerinde tutar ve kurtulduğunda onu
    kanar halde bırakırsınız. Delici hasar veren bir yakın dövüş silahıyla bir yakın
    dövüş Vuruşu yapın. Vuruş isabet eder ve hasar verirse hedefiniz başarıyla Kurtulana,
    silahla tekrar saldırana veya gerekli silahı Bırakana kadar (hangisi önce gelirse)
    Kavranmış kalır. Hedef artık kavranmadığında silahın hasar zarı sayısına eşit
    süren kanama hasarı alır.
omen://feat/implausible-purchase-investigator?source=paizo-pathfinder-player-core-2:
  name: Akıl Almaz Tedarik (Müfettiş)
  description: >
    İmkânsız gibi görünse de her açıyı analiz ettiniz ve uzak diyarlarda bile tam
    olarak ihtiyacınız olan eşyayı çekip çıkarmaya devam edebilirsiniz. Eşya satın
    aldıktan sonra zaten kullanmış olsanız bile İleriyi Gören Planlamacı'yı kullanabilirsiniz
    ve onu eşyayı çekmek için Etkileşime Girdiğiniz 2 eylemli bir etkinlik yerine
    tek bir eylem olarak kullanabilirsiniz. Ayrıca günde beş kez, seviyenizden 6 seviyeye
    kadar daha düşük yaygın bir tüketilebilir eşyayı çekip çıkarmak için İleriyi Gören
    Planlamacı'yı kullanabilirsiniz.
  prerequisites:
  - text: Öngörülü Satın Alım
omen://feat/impossible-riposte?source=paizo-pathfinder-player-core-2:
  name: İmkânsız Karşı Saldırı
  description: >
    Karşı saldırılarınız saldırıları kaynağına geri saptırabilir. Normal tetikleyicisine
    ek olarak Fırsat Karşı Saldırısı'nı "Erişim mesafenizin dışındaki bir düşman size
    karşı bir saldırı zarında kritik başarısızlık yaşar" tetikleyicisiyle kullanabilirsiniz.
    Bu yeni tetikleyiciyle menzilli bir saldırıya karşı Fırsat Karşı Saldırısı kullandığınızda
    Vuruşunuz tetikleyen etkinin bir kısmını kaynağına geri saptırır. Saldırı zarınızın
    sonucunu tetikleyen düşmanın Savunma Değeriyle karşılaştırın. İsabet durumunda
    Vuruşunuz için normal miktarda hasar verirsiniz ancak hasar türü tetikleyen saldırınınkiyle
    değişir. Örneğin Alev Saçan Ok büyüsünü saptırmak için Fırsat Karşı Saldırısı
    kullandıysanız Vuruşunuz normal hasar türü yerine ateş hasarı verir.
  prerequisites:
  - text: Fırsat Karşı Saldırısı
omen://feat/impossible-technique?source=paizo-pathfinder-player-core-2:
  name: İmkânsız Teknik
  description: İmkânsıza meydan okuyan bir manevra gerçekleştirirsiniz. Tetikleyen
    etki bir düşmanın size isabet eden saldırısıysa düşman saldırı zarını tekrar atar
    ve daha düşük olan sonucu kullanır. Tetikleyen etki bir kurtarışta başarısız olmanızsa
    kurtarışı tekrar atar ve daha yüksek olan sonucu kullanırsınız.
omen://feat/impressive-landing?source=paizo-pathfinder-player-core-2:
  name: Etkileyici İniş
  description: Yere çarpıp etrafınızdaki zemini parçalarsınız. Düşüşü 10 fit daha
    kısa sayın. Ayaklarınızın üzerine inersiniz. Bir yayılma alanı içindeki zemin
    zorlu arazi hâline gelir. İndiğinizde yayılma alanı içindeki herhangi bir yaratık,
    molozların çarpmasıyla 5[bludgeoning]|options:area-damage hasar alır ve bir sonraki
    sırasının başlangıcına kadar Gafil kalır.
omen://feat/improved-knockback?source=paizo-pathfinder-player-core-2:
  name: Gelişmiş Geri İtme
  description: Bir yaratığı başarıyla İttiğinizde, hem yaratığı itebileceğiniz mesafeyi
    hem de hedefi takip etmek için hareket edebileceğiniz mesafeyi bir başarıda 5
    fit, kritik başarıda 10 fit artırırsınız. Hedefi başka bir yaratığa veya engele
    doğru iterseniz, her ikisi de engellenen her 5 fitlik hareket başına 1d6[bludgeoning]
    hasar alır.
  prerequisites:
  - text: Geri İten Saldırı
omen://feat/improvise-tool?source=paizo-pathfinder-player-core-2:
  name: Alet Doğaçla
  description: >
    Elinizde uygun aletler olmadığında geçici çözümler üretebilirsiniz. Bir tamir
    alet takımı olmadan hasarlı eşyaları Tamir Etmeyi deneyebilirsiniz. Gerekli hammaddelere
    sahipseniz temel bir Diken seti, Mum, Pusula, Levye, Balık Oltası Takımı, Çakmaktaşı
    ve Çelik, Çekiç, Merdiven, Piton, Halat, On Fitlik Sırık, Yedek Düzenbaz Maymuncukları,
    Uzun Alet veya Kısa Alet ya da Meşale formüllerine sahipmişsiniz gibi İmal Edebilirsiniz.
  prerequisites:
  - text: Eğitimli Zanaat
omen://feat/improvised-repair?source=paizo-pathfinder-player-core-2:
  name: Doğaçlama Tamir
  description: Hasarlı teçhizatı alelacele bir araya getirebilirsiniz ancak geçici
    onarım kalıcı tamirler için gereken tam özenden yoksundur. Kendinizin veya bitişiğinizdeki
    gönüllü bir yaratığın sahip olduğu kırık bir eşyayı geçici olarak tamir edersiniz.
    Eşya tekrar hasar alana kadar kendi türünde uyduruk (shoddy) bir eşya olarak işlev
    görmeye devam eder. Büyülü bir eşyaysa veya aktivasyonlara sahip başka bir eşyaysa
    geçici olarak tamir edildiğinde aktive edilemez ancak normal işlevler için kullanılabilir
    (bir silahla Vuruş Yapmak veya bir kalkanla Kalkanla Bloklamak gibi). Bu etkinlik
    hiçbir Can Puanı yenilemez, bu nedenle eşyanın yok edilmesi kolaydır. Eşya artık
    kırık olmayacak şekilde normal olarak Tamir Edildiğinde artık uyduruk da sayılmaz.
omen://feat/incredible-luck-swashbuckler?source=paizo-pathfinder-player-core-2:
  name: İnanılmaz Talih (Kabadayı)
  description: Her zaman en kötü durumlardan toparlanmayı başarırsınız. Tılsımlı Hayat
    kullandığınızda kurtarışı iki kez atın (Tılsımlı Hayat'tan gelen +2 durumsal bonus
    dahil) ve daha iyi olan sonucu kullanın.
  prerequisites:
  - text: Tılsımlı Hayat
omen://feat/incredible-scout?source=paizo-pathfinder-player-core-2:
  name: İnanılmaz Gözcü
  description: Gözcülük yaptığınızda tehlikeye karşı özellikle tetiktesinizdir ve
    müttefiklerinize dövüşe hazırlanmaları için değerli anlar kazandırırsınız. Gözcülük
    keşif etkinliğini kullanırken müttefiklerinize inisiyatif zarlarında +1 durumsal
    bonus yerine +2 durumsal bonus sağlarsınız.
  prerequisites:
  - text: Usta Dikkat
omen://feat/inexhaustible-countermoves?source=paizo-pathfinder-player-core-2:
  name: Tükenmez Karşı Hamleler
  description: Bir düşman savunmasında bir açık bıraktığında her an tepki verebilirsiniz.
    Her düşmanın sırasının başında, yalnızca o sıra sırasında bir Fırsat Karşı Saldırısı
    veya o reaksiyona sahipseniz bir Reaktif Vuruş gerçekleştirmek için kullanabileceğiniz
    ekstra bir reaksiyon kazanırsınız.
omen://feat/influence-nature?source=paizo-pathfinder-player-core-2:
  name: Doğayı Etkile
  description: >
    Sabır ve zamanla kuş sesleri çıkarabilir, av izleri bırakabilir ve nihayetinde
    bölgedeki belirli bir hayvan türünün davranışlarını sonraki günlerde sizi kayıracak
    ve hatta size yardım edecek şekilde etkileyebilirsiniz. Gereken herhangi bir testin
    ZD'sini ve çalışmanızın gerektirdiği süreyi GM belirler (genellikle en az bir
    veya iki günlük boş zaman). Doğayı nasıl etkilediğinizi doğrudan kontrol edemeseniz
    de daha kolay avlar veya tehlike yaklaştığında kuşların sessizliğe bürünmesi gibi
    belirli etkileri umabilirsiniz. Doğa konusunda efsaneviyseniz bölgedeki hayvan
    davranışlarına yönelik bu aynı ayarlamaları yalnızca 10 dakika harcayarak ortaya
    çıkarabilirsiniz.
  prerequisites:
  - text: Usta Doğa
omen://feat/inner-strength?source=paizo-pathfinder-player-core-2:
  name: İçsel Güç
  description: >
    Gücünüz öfkenizin bir parçasıdır. Öfkeniz sürdüğü sürece her türlü takatsizliğin
    üstesinden gelmek için gücünüzü ve öfkenizi toplayabilirsiniz. Güçten Düşmüş durumunuzun
    değerini 1 azaltırsınız.
  prerequisites:
  - text: Ruh İçgüdüsü
omen://feat/inoculation?source=paizo-pathfinder-player-core-2:
  name: Aşılama
  description: >
    Vebayla mücadele etme pratiğiniz vardır ve hastalarınızın bir süre boyunca aynı
    hastalığa tekrar yenik düşme olasılığı daha düşüktür. Biri üzerinde Hastalığı
    Tedavi Et eyleminde başarılı olduğunuzda ve o kişi hastalıktan tamamen kurtulduğunda,
    1 hafta boyunca aynı hastalığa karşı kurtarışlarnda +2 durumsal bonus kazanır.
  prerequisites:
  - text: Eğitimli Tıp
omen://feat/instinctive-strike?source=paizo-pathfinder-player-core-2:
  name: İçgüdüsel Saldırı
  description: İçgüdülerinize ve koku alma duyunuza güvenir, rakibinizin yerini tam
    olarak belirlemek için tüm duyularınızı kullanırsınız. Koku alma duyusunu kullanarak
    tespit ettiğiniz bir rakibe karşı yakın dövüş Vuruşu yaptığınızda, hedefin Belirsiz
    veya Gizlenmiş olmasından kaynaklanan zorunlu düz zarları yok sayın.
  prerequisites:
  - text: Keskin Koku veya koku alma
omen://feat/invulnerable-rager?source=paizo-pathfinder-player-core-2:
  name: Zarar Görmez Öfkeli
  description: En ağır zırhlar bile yalnızca dizginlenemez öfkenizi artırmaya yarar.
    Ağır zırhta eğitimli olursunuz. Orta zırhta uzman veya daha yüksek yetkinlik sağlayan
    bir barbar sınıf yeteneği kazandığınız her seferde, o yetkinliği ağır zırhta da
    kazanırsınız. Tez Canlı eylemine sahipseniz, ağır zırh giyerken de onu kullanabilirsiniz.
omen://feat/ironblood-stance?source=paizo-pathfinder-player-core-2:
  name: Demirkan Duruşu
  description: >
    Hiçbir darbeye boyun eğmeyi kabul etmeyerek delinmez demirin duruşuna geçersiniz.
    Demir süpürme silahsız saldırıları yapabilirsiniz. Bunlar 1d8 ezici hasar verir;
    boğuşma grubundadır; ve öldürücü olmayan, savuşturma, süpürme ve silahsız özelliklerine
    sahiptir. Demirkan Duruşundayken tüm hasarlara karşı 2 direnç kazanırsınız. Direnç
    12. seviyede 3'e, 16. seviyede 4'e ve 20. seviyede 5'e yükselir.
omen://feat/ironblood-surge?source=paizo-pathfinder-player-core-2:
  name: Demirkan Kabarması
  description: >
    Yaklaşan saldırılara direnmeye hazırlanarak ve darbeyi emmek için kaslarınızı
    kullanarak kendinizi çelikleştirirsiniz. Demir süpürmenizin savuşturma özelliğinin
    faydalarını (bir sonraki sıranızın başlangıcına kadar Savunma Değerine +1 durumsal
    bonus) kazanırsınız ve Demirkan Duruşu'ndan gelen direnciniz aynı süre boyunca
    Kuvvet bonusunuza yükselir (daha yüksekse).
  prerequisites:
  - text: Demirkan Duruşu
omen://feat/iruxi-armaments?source=paizo-pathfinder-player-core-2:
  name: Iruxi Teçhizatı
  description: >
    Silahlarınız doğuştan sahip olduklarınızdır. Aşağıdaki seçeneklerden birini seçin:
    • Pençeler Pençe saldırınız 1d4 yerine 1d6 kesici hasar verir ve çok yönlü D (versatile
    P) özelliğini kazanır. • Dişler 1d8 delici hasar veren ve boğuşma grubunda olan
    bir diş silahsız saldırısı kazanırsınız. • Kuyruk 1d6 ezici hasar veren, boğuşma
    grubunda olan ve süpürme özelliğine sahip bir kuyruk silahsız saldırısı kazanırsınız.
    5. seviyede, bu hünerle kazandığınız veya geliştirdiğiniz silahsız saldırılardan
    biriyle kritik vuruş yaptığınızda onun kritik uzmanlaşma etkisini kazanırsınız.
omen://feat/iruxi-spirit-strike?source=paizo-pathfinder-player-core-2:
  name: Iruxi Ruh Saldırısı
  description: Iruxi silahsız saldırılarınız atalarınızın ruhani enerjisini kanalize
    eder. Kertenkeleadam soyundan, kertenkeleadam miraslarından veya kertenkeleadam
    soy hünerlerinden edindiğiniz tüm silahsız saldırılar bir hayalet dokunuşu (ghost
    touch) nitelik rününün etkilerini kazanır.
omen://feat/jinx-glutton?source=paizo-pathfinder-player-core-2:
  name: Uğursuzluk Oburu
  description: Günde bir kez yerine saatte bir kez Talihi Ye eylemini kullanabilirsiniz.
  prerequisites:
  - text: Talihi Ye
omen://feat/jungle-strider?source=paizo-pathfinder-player-core-2:
  name: Cengel Gezgini
  description: Köklerden, bitki örtüsünden ve diğer orman engellerinden kaçınma konusunda
    hünerlisinizdir. Ormanlarda ve cengellerde zorlu araziyi yok sayarsınız. Ayrıca
    bitki materyalinden yapılmış dar yüzeylerde veya engebeli zeminde Denge kurmak
    için Akrobasi becerisini kullandığınızda Gafil kalmazsınız ve bu Akrobasi testlerinden
    birinde bir başarı elde ettiğinizde bunun yerine kritik başarı kazanırsınız.
omen://feat/just-as-planned?source=paizo-pathfinder-player-core-2:
  name: Tam Planlandığı Gibi
  description: Göz açıp kapayıncaya kadar düşmanınızın hareketlerini hesaplar ve bir
    sonraki darbenizi tam olarak nereye yönelteceğinizi bilirsiniz. Bir sonraki eyleminiz
    Strateji Geliştirmek ise d20 zarını iki kez atabilir ve daha yüksek sonucu alabilirsiniz.
omen://feat/just-one-more-thing?source=paizo-pathfinder-player-core-2:
  name: Bir Şey Daha Var
  description: >
    Birini etkileme girişiminiz kötü gittikten sonra, başka bir bilgi parçası ekler
    veya iğneleyici bir soru sorarak muhtemelen önceki girişiminizi kurtarırsınız.
    Başarısız testi tekrar atın ve yeni sonucu kullanın. Başarısız testin hedefi aktif
    soruşturmalarınızdan biriyle ilgiliyse, tekrar atılan teste İpucunu Takip Et'ten
    gelen soruşturma bonusunuzu ikiye katlayın. O yaratık 1 gün boyunca Bir Şey Daha
    Var'a karşı geçici olarak bağışık olur. Bu eylemi Yalan Söyleme, Bilgi Toplama,
    İyi İzlenim Bırakma veya Tehditle Zorlama testinde başarısız olduysanız (ancak
    kritik olarak başarısız olmadıysanız) da kullanabilirsiniz. Bu durumda 1 eylem
    harcamak yerine Bir Şey Daha Var eklemek, en az 1 tur daha olmak üzere test için
    başlangıçta harcadığınız sürenin yarısını alır.
omen://feat/just-the-facts?source=paizo-pathfinder-player-core-2:
  name: Yalnızca Gerçekler
  description: 'Araştırmanızın yanlış olmasının imkânsız olacağı noktaya kadar her
    şeyi temelden anlarsınız. Kalıcı olarak Hızlanmış durumdasınızdır ve ekstra eylemi
    Bilgi Hatırlamak için kullanabilirsiniz. Ayrıca Bilgi Hatırlama ile aşağıdaki
    faydaları kazanırsınız: • Bilgi Hatırlamak için yaptığınız testler artık gizli
    değildir. • Bilgi Hatırladığınızda testinizin sonucundan bir derece daha iyi başarı
    sonucunu kullanırsınız. • Bir etki (Şüpheli Bilgi gibi) Bilgi Hatırla testinizden
    size yanlış bilgi verecek olursa hangi bilginin yanlış olduğunu bilirsiniz. •
    Müttefiklerinizden biri Bilgi Hatırladığında ve yanlış bilgi edindiğinde, bunu
    sizinle paylaşırlarsa o bilginin yanlış olduğunu da bilirsiniz.'
  prerequisites:
  - text: Kapsamlı Araştırma
omen://feat/keen-follower?source=paizo-pathfinder-player-core-2:
  name: Hevesli Takipçi
  description: >
    Müttefiklerinizi keskin bir şekilde gözlemlemeniz, onların liderliğini takip etme
    konusunda sizi daha iyi hale getirdi. Keşif modunda Uzmanı Takip Et etkinliğini
    kullanırken takip ettiğiniz müttefik bir uzmansa +3 durumsal bonus, müttefikiniz
    bir ustaysa +4 durumsal bonus kazanırsınız. Grubu daha da koordine etmeye yardımcı
    olmak için gözlemlerinizi başkalarıyla paylaşabilirsiniz. Takip ettiğiniz müttefik
    Sessiz Müttefikler hünerine veya grubun bir keşif etkinliği için tek bir beceri
    testi atmasına ve en düşük bonusu kullanmasına olanak tanıyan başka bir beceri
    hünerine sahipse, en düşüğü olmasa bile bunun yerine sizin bonusunuzu kullanabilirler.
omen://feat/kholo-lore?source=paizo-pathfinder-player-core-2:
  name: Kholo İlimi
  description: >
    Numaralarını öğrenmek için klanınızdaki kıdemli avcılara çok dikkat ettiniz. Gizlilik
    ve Hayatta Kalma konularında eğitimli yetkinlik derecesi kazanırsınız. Bu becerilerden
    birinde otomatik olarak eğitimli olacak olsaydınız (örneğin geçmişinizden veya
    sınıfınızdan), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz. Ayrıca
    Kholo İlimi için İlave Bilgi genel hünerini kazanırsınız.
omen://feat/kholo-weapon-familiarity?source=paizo-pathfinder-player-core-2:
  name: Kholo Silah Aşinalığı
  description: >
    Kholo özelliğine sahip tüm sıra dışı silahlara erişim kazanırsınız. Kholo özelliğine
    sahip silahların yanı sıra gürz, khopesh, mambele ve savaş gürzüne aşinasınızdır—yetkinlik
    amacıyla, bunlardan askeri silah olanları basit silahlar, gelişmiş silah olanları
    ise askeri silahlar olarak değerlendirirsiniz. 5. seviyede, bu silahlardan biriyle
    kritik vuruş yaptığınızda onun kritik uzmanlaşma etkisini kazanırsınız.
omen://feat/knockback-strike?source=paizo-pathfinder-player-core-2:
  name: Geri İten Saldırı
  description: Gücünüzü bir düşmanı sizden uzağa itecek kadar güçlü bir darbeye odaklarsınız.
    Silahsız bir Vuruş Yapın. İsabet ettirirseniz hedefi İtmek için bir Atletizm testi
    deneyin. Bu saldırı Vuruşunuzla aynı çoklu saldırı cezasını kullanır ve çoklu
    saldırı cezanıza dahil edilmez.
omen://feat/knockback?source=paizo-pathfinder-player-core-2:
  name: Geri İtme
  description: Savuruşunuzun ağırlığı düşmanınızı geri püskürtür. Başarılı bir İtme
    etkileriyle düşmanı 5 fit geri itersiniz. Başarılı bir İtme için normal olduğu
    üzere düşmanı takip edebilirsiniz.
omen://feat/known-weaknesses?source=paizo-pathfinder-player-core-2:
  name: Bilinen Zaaflar
  description: Ne zaman Strateji Geliştirseniz, d20 atmadan önce bu eylemin bir parçası
    olarak Bilgi Hatırlamak amacıyla bir test de deneyebilirsiniz. Bilgi Hatırla testinde
    kritik başarı elde ederseniz bir zaafı fark eder ve müttefiklerinize bilgi aktararak
    saldırıları bir sonraki sıranızın başlangıcından önce yapıldığı sürece hedefe
    karşı yapacakları bir sonraki saldırı zarına her birine +1 durumsal bonus sağlayabilirsiniz.
    Bir saldırı stratejisi seçerseniz bu bonus o saldırı zarına da uygulanır.
omen://feat/kobold-lore?source=paizo-pathfinder-player-core-2:
  name: Kobold İlimi
  description: >
    Büyüklerinizden temel kobold hayatta kalma stratejilerini dikkatle öğrendiniz.
    Gizlilik ve Hırsızlık konularında eğitimli yetkinlik derecesi kazanırsınız. Bu
    becerilerden birinde otomatik olarak eğitimli olacak olsaydınız (örneğin geçmişinizden
    veya sınıfınızdan), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz. Ayrıca
    Kobold İlimi için İlave Bilgi genel hünerini kazanırsınız.
omen://feat/kobold-weapon-familiarity?source=paizo-pathfinder-player-core-2:
  name: Kobold Silah Aşinalığı
  description: >
    Kobold özelliğine sahip tüm sıra dışı silahlara erişim kazanırsınız. Kobold özelliğine
    sahip silahların yanı sıra ulu kazma, hafif kazma ve kazmaya aşinasınızdır—yetkinlik
    amacıyla, bunlardan askeri silah olanları basit silahlar, gelişmiş silah olanları
    ise askeri silahlar olarak değerlendirirsiniz. 5. seviyede, bu silahlardan biriyle
    kritik vuruş yaptığınızda onun kritik uzmanlaşma etkisini kazanırsınız.
omen://feat/lab-rat?source=paizo-pathfinder-player-core-2:
  name: Laboratuvar Sıçanı
  description: Bir simya laboratuvarında payınıza düşenden fazlasını geçirdiniz. Çok
    çeşitli simyasal zehirlere ve zararlı maddelere maruz kaldınız, bu da sizi bunların
    etkilerine karşı artan bir toleransla baş başa bıraktı. Zehirlere ve hastalıklara
    karşı kurtarışlarnda +1 durumsal bonusuna sahip olursunuz. Bir zehre veya hastalığa
    karşı kurtarışınızda bir başarı elde ederseniz bunun yerine kritik başarı kazanırsınız.
omen://feat/laughing-kholo?source=paizo-pathfinder-player-core-2:
  name: Gülen Kholo
  description: Uğursuz kıkırdamanız bir uyarı ve tehdit sesidir. Savaş Narası beceri
    hünerini kazanırsınız. Dilinizi anlamayan bir yaratığın Gözdağı Vermeyi denediğinizde
    ceza almazsınız.
  prerequisites:
  - text: Usta Gözdağı
omen://feat/lead-climber?source=paizo-pathfinder-player-core-2:
  name: Öncü Tırmanıcı
  description: Tırmanırken başkalarının takip etmesi için rotalar hazırlayabilir ve
    felaketi önlemek için müttefiklerinizi yukarı çekebilirsiniz. Müttefikleriniz
    Uzmanı Takip Et keşif etkinliğini kullanarak belirlediğiniz bir rotaya Tırmanmayı
    denerken içlerinden biri Tırmanma testinde kritik olarak başarısız olursa aynı
    ZD'ye karşı bir Atletizm testi deneyebilirsiniz. Başarırsanız müttefikiniz kritik
    başarısızlık yerine yalnızca başarısız olur. Siz de kritik başarısızlık yaşarsanız
    ikiniz de kritik başarısızlığın sonuçlarını yaşarsınız.
  prerequisites:
  - text: Uzman Atletizm
omen://feat/lead-investigator?source=paizo-pathfinder-player-core-2:
  name: Baş Müfettiş
  description: Açık soruşturmalarınızdan biri hakkında en fazla dört müttefiki bilgilendirmek
    için 1 dakika harcarsınız. Bu müttefikler o soruşturmanın merkezindeki soruyu
    araştırmak için yapılan testlerde İpucunu Takip Et'ten kazandığınız durumsal bonusunun
    aynısını kazanırlar. Bu bonus o İpucunu Takip Etmeyi bırakana kadar veya 1 gün
    boyunca (hangisi önce gelirse) sürer. Bu, Dedektif Teyakkuzu ile kurtarışlarıza
    durumsal bonus eklemek gibi bir ipucunu takip etmenin diğer faydalarını sağlamaz.
  prerequisites:
  - text: Hepsine İpucu Ver
omen://feat/leading-dance?source=paizo-pathfinder-player-core-2:
  name: Yönlendiren Dans
  description: Düşmanınızı dansınızın içine çekersiniz. Bitişikteki bir düşmanın İrade
    ZD'sine karşı bir Gösteri testi deneyin.
  prerequisites:
  - text: Eğitimli Gösteri
omen://feat/leech-clip?source=paizo-pathfinder-player-core-2:
  name: Sülük Kıskacı
  description: Firarileri veya "sülükleri" yakalamak için eğitildiniz. Gürz grubundan
    bir silahla yakın dövüş Vuruşu yapın. Bir isabette hedef Hızına –10 fitlik statü
    cezası alır (veya kritik vuruşta –15 fitlik statü cezası). Ceza 1 tur sürer. Yalnızca
    hedefin bir kara Hızı varsa ve kara Hızını kullanmak için bacaklara veya hedeflenebilir
    diğer uzuvlara bağımlıysa geçerlidir. Hıza uygulanan tüm cezalarda olduğu gibi
    bu ceza bir yaratığın Hızını 5 fitin altına düşüremez.
omen://feat/left-hand-blood?source=paizo-pathfinder-player-core-2:
  name: Sol El Kanı
  description: Bir sırtlanın sağ tarafındaki etin hastalıkları iyileştirebildiği,
    ancak sol tarafındaki etin ölümcül ve zehirli olduğu söylenir. Tuttuğunuz bir
    silahı zehirlemek için kendinize 1[slashing]|immutable:true hasar verirsiniz.
    Silahla isabet ettirip hasar verirseniz hedef ayrıca 1d4[persistent,poison] hasar
    alır. Silahınızdaki zehir isabet ettirdikten sonra veya bir sonraki sıranızın
    sonunda (hangisi önce gerçekleşirse) etkisiz hâle gelir.
omen://feat/legendary-guide?source=paizo-pathfinder-player-core-2:
  name: Efsanevi Rehber
  description: >
    Vahşi doğayı o kadar iyi bilirsiniz ki grubunuzun orada kolaylıkla seyahat etmesine
    yardımcı olabilirsiniz. Vahşi doğa arazisinde grubunuz için yolu belirlerken grubunuz
    seyahat hızını hesaplamak amacıyla Hızına +10 fitlik bir durumsal bonus kazanır,
    grubunuzun seyahat hızı zorlu arazide azalmaz ve daha zorlu arazi grubunuzun seyahat
    hızını üçte bire indirmek yerine yarıya indirir. Bu, bir karşılaşma sırasında
    grubunuzun Hızını artırmaz veya bir karşılaşma sırasında grubunuzun zorlu araziyi
    yok saymasına izin vermez.
  prerequisites:
  - text: Efsanevi Hayatta Kalma
omen://feat/legendary-laugh?source=paizo-pathfinder-player-core-2:
  name: Efsanevi Kahkaha
  description: Kahkahanız düşmanlarınızın zihninde yankılanır. 60 fite kadar uzaktaki
    yaratıklara Gözdağı Verebilirsiniz. Ek olarak, bir yaratığa her başarıyla Gözdağı
    Verdiğinizde 3d8[mental] hasar (veya kritik bir başarıda 6d8[mental] hasar) alır.
  prerequisites:
  - text: Gülen Kholo
omen://feat/lethal-finisher?source=paizo-pathfinder-player-core-2:
  name: Ölümcül Bitirici Hamle
  description: >
    Düşmanınızı hayati bir organından bıçaklarsınız ve muhtemelen onu anında öldürürsünüz.
    Bir Vuruş Yapın. Başarı durumunda, bitirici hamleden gelen hassas saldırı hasarınızdan
    feragat edersiniz. Bunun yerine hedefiniz, sınıf ZD'nize karşı bir kurtarışa bağlı
    olarak ek zayıf nokta hasarı alır. Vuruşunuz kritik vuruş olduysa, hedefin kurtarış
    sonucu bir derece daha kötü sayılır.
  prerequisites:
  - text: Hassas Saldırı 6d6
omen://feat/leverage-connections?source=paizo-pathfinder-player-core-2:
  name: Bağlantıları Kullan
  description: Belirli çevrelerde sizin için işleri halledebilecek doğru insanları
    tanırsınız. Haftada bir kez, nüfuzlu soylulardan, ticari elitlerden veya benzerlerinden
    oluşan köklü bir grubun bulunduğu bir bölgedeyseniz (Saray Nezaketi'ne sahipseniz)
    ya da hırsızlar loncası gibi tekinsiz karakterlerden oluşan bir ağdaysanız (Sokak
    Görmüş hünerine sahipseniz), sanki size karşı dost canlısıymışlar gibi o kişilerden
    bir iyilik veya yardım İstemek için Sosyoloji becerisini kullanabilirsiniz. Talebiniz
    temas kurduğunuz insan türü için mantıklı olmalıdır. Örneğin, kraliyet sarayının
    bir üyesi gösterişli bir balo için size uygun bir davetiye ayarlayabilirken, yerel
    bir hırsız aynı partiye gizlice sızmanın bir yolunu gösterebilir. Bu testte kritik
    başarı elde ederseniz bağlantınız size faydalı bir tavsiyede bulunur veya küçük
    bir sır verir; bu da iyilik doğrultusunda hareket ederken deneyeceğiniz ilk beceri
    testine size veya grubunuzun bir üyesine +2 durumsal bonus kazandırır. Bu testte
    kritik başarısızlık elde ederseniz GM tarafından belirleneceği üzere bağlantınızın
    gözüne tekrar girebilmek için ona bir hizmette bulunmanız gerekebilir.
  prerequisites:
  - text: Uzman Sosyoloji
  - text: Saray Nezaketi veya Sokak Görmüş
omen://feat/lie-detector?source=paizo-pathfinder-player-core-2:
  name: Yalan Dedektörü
  description: >
    Bir yalancının ipuçlarını (terleme, kızarma, titreyen bir ses, hızlanan nabız)
    fark etmekte ustasınız. Niyetini Tartmak için yapılan Dikkat testlerine ve size
    Yalan Söyleme girişimlerine karşı Dikkat ZD'nize +1 durumsal bonus kazanırsınız.
    Birinin size yalan söylediğini tespit ettiğinizde, sonraki 1 dakika içinde o yaratığa
    karşı deneyeceğiniz ilk Aldatma, Diplomasi, Gözdağı veya Gösteri testinde onun
    aldatmacasını kendi lehinize kullanarak +1 durumsal bonus kazanırsınız. Yukarıdaki
    testlerden herhangi birine İpucunu Takip Et soruşturma bonusunuzu kazanacak olursanız,
    listelenen +1 bonusunu kazanmak yerine bu bonus 1 artar.
  prerequisites:
  - text: ampirizm veya sorgu metodolojisi
omen://feat/lifesense?source=paizo-pathfinder-player-core-2:
  name: Yaşam Sezisi
  description: Psikopomp atalarınız gibi yaşam gücünü sezme konusunda sınırlı bir
    yeteneğe sahipsiniz. 10 fit menzilli kusurlu bir duyu olarak yaşam sezisi kazanırsınız.
    Bu, belirtilen menzil içindeki yaşayan ve hortlak yaratıkların yaşam gücünü sezmenizi
    sağlar. Görme duyusunun renkleri ayırt etmesi gibi, bu duyu da yaşayan yaratıkları
    canlandıran dirimsellik enerjisi ile hortlak yaratıkları canlandıran hiçlik enerjisini
    birbirinden ayırt edebilir.
omen://feat/light-paws?source=paizo-pathfinder-player-core-2:
  name: Hafif Patiler
  description: Engellerin üzerinden dikkatlice geçmek için ayak parmaklarınızın üzerinde
    denge sağlayabilirsiniz. Bu hareket sırasında zorlu araziyi yok sayarak Depar
    atıp ardından Adım atarsınız veya Adım atıp ardından Depar atarsınız.
omen://feat/lightning-qi?source=paizo-pathfinder-player-core-2:
  name: Yıldırım Qi
  description: Qi içinizden özgürce akar. Bir sonraki eyleminiz yapılması en az iki
    eylem alan bir qi büyüsü yapmaksa, onu yapmak için gereken eylem sayısını 1 azaltırsınız
    (en az 1 eylem).
omen://feat/lingering-breath?source=paizo-pathfinder-player-core-2:
  name: Kalıcı Nefes
  description: Ejderimsi nefesiniz çevredeki ortamı tahrip eder ve düşmanlarınızı
    acı içinde bırakır. Ejderha Nefesi kullandığınızda, nefesinizin alanı 1 dakika
    boyunca zorlu araziye dönüşür. Ayrıca, kurtarışta başarısız veya kritik başarısız
    olan bir yaratık aynı türden 2d6 süren hasar alır.
  prerequisites:
  - text: Ejderha Nefesi
omen://feat/lizardfolk-lore?source=paizo-pathfinder-player-core-2:
  name: Kertenkelesoy İlimi
  description: >
    Topluluğunuz arasında nesilden nesile aktarılan hikâyeleri dikkatle dinlediniz.
    Hayatta Kalma ile Doğa veya Okültizm becerilerinden birinde eğitimli yetkinlik
    derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak eğitimli olursanız
    (örneğin geçmişinizden veya sınıfınızdan), bunun yerine seçeceğiniz bir beceride
    eğitimli hâle gelirsiniz. Ayrıca Astroloji İlimi veya Kertenkelesoy İlimi için
    Ek İlim genel hünerini kazanırsınız.
omen://feat/long-nosed-form?source=paizo-pathfinder-player-core-2:
  name: Uzun Burunlu Biçim
  description: >
    Belirli, tuhaf görünümlü bir insan formuna dönüşürsünüz. Bu insan formu tengu
    formunuzla aynı yaş ve vücut tipindedir ve boy gibi kabaca benzer fiziksel özelliklere
    sahiptir; ancak insan formunuzun ten rengi ne olursa olsun burnunuz gaganız kadar
    uzun kalır ve teniniz kırmızı alt tonlara sahiptir. Uzun Burunlu Biçim kullanmak,
    Aldatma becerisinin Kılığına Bürün kullanımı için bir kılık değiştirmek sayılır.
    Kusurlu dönüşümünüz nedeniyle, tengu özelliklerinizi açıklayabilseniz veya gizleyebilseniz
    de dönüşümünüz insan olup olmadığınızı belirlemek için yapılan Dikkat ZD'lerini
    otomatik olarak alt etmez. İnsan formunuzdayken gaga silahsız Vuruşunuzu ve bir
    tengu mirasından ya da soy hünerinden kazandığınız diğer tüm silahsız Vuruşları
    kaybedersiniz. Bu etkiyi Sonlandırana kadar süresiz olarak insan formunuzda kalırsınız.
omen://feat/long-tongue?source=paizo-pathfinder-player-core-2:
  name: Uzun Dil
  description: Son derece uzun dilinizi orijinal sınırlarının ötesine esnetmeyi öğrendiniz.
    Dilinizi temas menzilli büyüleri iletmek veya çok basit Etkileşime Gir eylemlerini
    gerçekleştirmek için kullandığınızda, bunu olağan erişiminizin 5 fit ötesindeki
    bir mesafede yapabilirsiniz.
  prerequisites:
  - text: şaklayan dilli tripkee
omen://feat/luck-of-the-clowder?source=paizo-pathfinder-player-core-2:
  name: Kedi Sürüsü Talihi
  description: Yeniden zar atmak için Kedi Şansı kullandığınızda, 10 fit içinde seçtiğiniz
    ve aynı etkiye (örneğin tek bir büyüye) karşı az önce başarısız olmuş herhangi
    bir yaratık da kurtarışları yeniden atabilir ve daha iyi sonucu kullanabilir.
  prerequisites:
  - text: Kedi Şansı
omen://feat/lucky-break?source=paizo-pathfinder-player-core-2:
  name: Şans Anı
  description: Çoğu kedisoydan bile daha şanslısınız. Refleks kurtarışlara ek olarak
    bir Dayanıklılık kurtarışta, İrade kurtarışta, Akrobasi testinde veya Atletizm
    testinde başarısız ya da kritik başarısız olduğunuzda da Kedi Şansı'nı tetikleyebilirsiniz.
    Kedi Şansı'nı yine de günde yalnızca bir kez kullanabilirsiniz.
  prerequisites:
  - text: Kedi Şansı
omen://feat/mage-hunter?source=paizo-pathfinder-player-core-2:
  name: Büyücü Avcısı
  description: Büyüye olan nefretinizi bilinen bir büyü yapıcıya saldırmak için kullanırsınız.
    Gerekli yaratığa karşı yakın dövüş Vuruşu yapın. İsabet eder ve hasar verirseniz,
    bir sonraki sıranızın başlangıcına kadar hedef Zihni Uyuşmuş 1 (kritik vuruşta
    Zihni Uyuşmuş 2) olur.
  prerequisites:
  - text: hurafe içgüdüsü
omen://feat/magpie-snatch?source=paizo-pathfinder-player-core-2:
  name: Saksağan Kapması
  description: Hızlı hareket ederek gözünüze çarpan parlak bir eşyayı kaparsınız.
    İki kez Depar atarsınız ve hareketinizin herhangi bir noktasında sahipsiz bir
    nesneyi almak için Etkileşime Girebilirsiniz.
omen://feat/majestic-presence?source=paizo-pathfinder-player-core-2:
  name: Görkemli Varlık
  description: Etkileyici bir duruş sergileyerek kişiliğinizin tüm kudretiyle daha
    aşağı varlıkları sindirirsiniz. Bir yayılım içindeki her yaratık, sınıf ZD'niz
    veya büyü ZD'nizden yüksek olanına karşı bir İrade kurtarış denemelidir. Kurtarışın
    sonucuna bakılmaksızın, yaratık 24 saat boyunca Görkemli Varlık hünerinize geçici
    olarak bağışık kalır.
omen://feat/make-em-sweat?source=paizo-pathfinder-player-core-2:
  name: Terlet
  description: Soru sorma tarzınız, şüphelinin içinin okunduğunu anlamasını sağlayarak
    onu iliklerine kadar sarsar. İğneleyici Soru kullanmakta başarılı olduğunuzda
    hedef ayrıca Korkmuş 1 (kritik başarıda Korkmuş 2) olur. Bu ek etki bir duygu
    ve korku etkisidir, ancak hedef korkuya bağışık olsa bile İğneleyici Soru'nun
    diğer etkileri geçerliliğini korur.
  prerequisites:
  - text: sorgu metodolojisi
omen://feat/mariners-fire?source=paizo-pathfinder-player-core-2:
  name: Denizcinin Ateşi
  description: Su yüzeyinin üstünde veya altında süzülen tekinsiz ruhani alev küreleri
    çağırırsınız. Tutuşturma kantripini, seviyenizin yukarı yuvarlanmış yarısına eşit
    bir büyü derecesine yükseltilmiş olarak istediğiniz zaman doğa özgü büyüsü şeklinde
    yapabilirsiniz. Tutuşturma büyünüz ateş küreleri biçimini alır ve onu su altında
    yapabilirsiniz.
omen://feat/marsh-runner?source=paizo-pathfinder-player-core-2:
  name: Bataklık Koşucusu
  description: Adım eylemini kullandığınızda su baskınları, bataklıklar veya bataklık
    kumunun neden olduğu zorlu araziyi yok sayabilirsiniz. Ayrıca dar yüzeylerde veya
    engebeli bataklık zemininde Dengede Kalmak için Akrobasi becerisini kullandığınızda
    Gafil olmazsınız ve Akrobasi testinde başarı elde ederseniz bunun yerine kritik
    başarı elde edersiniz.
  prerequisites:
  - text: Yüzme Hızına sahipsiniz
omen://feat/master-qi-spells?source=paizo-pathfinder-player-core-2:
  name: Usta Qi Büyüleri
  description: Qi'niz üzerinde neredeyse tam bir ustalık elde ettiniz. Medusa Gazabı,
    Ölüm Dokunuşu veya erişiminiz olan başka bir 8. derece qi büyüsü kazanırsınız.
  prerequisites:
  - text: Qi Büyüleri
omen://feat/meditative-focus?source=paizo-pathfinder-player-core-2:
  name: Meditatif Odak
  description: Meditasyonunuz o kadar etkilidir ki çevrenizdeki dünyayla derin bir
    odaklanmaya ulaşabilirsiniz. Odaklandığınızda, 1 Odak Puanı yerine tüm Odak Puanlarınızı
    geri kazanırsınız.
  prerequisites:
  - text: Qi Büyüleri
omen://feat/mixed-maneuver?source=paizo-pathfinder-player-core-2:
  name: Karma Manevra
  description: Farklı manevraları tek bir akıcı kombinasyonda harmanlamak için dövüş
    sanatları bilginizden yararlanırsınız. Kavra, Yerinden Oynat, İt ve Çelme Tak
    arasından herhangi ikisini seçin. Seçtiğiniz her iki saldırıyı da aynı veya farklı
    yaratıklara karşı deneyin, ancak çoklu saldırı cezasını her iki saldırı da sonuçlanana
    kadar uygulamayın.
  prerequisites:
  - text: Usta Atletizm
omen://feat/mobile-finisher?source=paizo-pathfinder-player-core-2:
  name: Hareketli Bitirici Hamle
  description: >
    Hareket halindeyken saldırırsınız. Depar atın ve ardından Vuruş Yapın. İlgili
    hareket türüne sahipseniz Depar atmak yerine Kazma, Tırmanma, Uçma veya Yüzme
    sırasında da Hareketli Bitirici Hamle kullanabilirsiniz.
omen://feat/moisture-bath?source=paizo-pathfinder-player-core-2:
  name: Nem Banyosu
  description: Nemli deriniz sıcaklığı değiştiren etkilerden gelen hasara karşı özellikle
    dirençlidir. Bir düz test deneyin; başarı durumunda süregelen tüm süren ateş ve
    süren soğuk hasarından kurtulursunuz. Ek olarak, 1 dakika boyunca seviyenizin
    yarısına eşit ateş ve soğuk direnci kazanırsınız.
omen://feat/moment-of-clarity?source=paizo-pathfinder-player-core-2:
  name: Zihin Açıklığı Anı
  description: Net düşünebilmek için öfkenizi bir anlığına bastırırsınız. Bu sıranın
    sonuna kadar, concentrate özelliğine sahip eylemler rage özelliğine sahip olmasa
    bile bu eylemleri kullanabilirsiniz.
omen://feat/monastic-archer-stance?source=paizo-pathfinder-player-core-2:
  name: Manastır Okçusu Duruşu
  description: >
    Yay kullanımına odaklanan benzersiz bir dövüş sanatı için özelleşmiş bir duruşa
    geçersiniz. Bu duruştayken yapabileceğiniz tek Vuruşlar uzun yaylar, kısa yaylar
    veya monk özelliğine sahip yaylar kullananlardır. Bu yaylarla Darbe Yaylımı kullanabilirsiniz.
    Hüner veya yetenek tek ve belirli bir Vuruş gerektirmediği sürece, ilk menzil
    artışının yarısı içinde (normalde uzun yay için 50 fit ve kısa yay için 30 fit)
    saldırırken normalde silahsız saldırı gerektiren diğer keşiş hünerlerinizi veya
    keşiş yeteneklerinizi bu yaylarla kullanabilirsiniz.
omen://feat/monastic-weaponry?source=paizo-pathfinder-player-core-2:
  name: Manastır Silahları
  description: Manastırınızın veya okulunuzun silahlarıyla eğitim aldınız. Monk özelliğine
    sahip sıra dışı silahlara erişim kazanırsınız ve basit ile askeri keşiş silahlarında
    eğitimli olursunuz. Silahsız saldırılardaki yetkinliğiniz uzman veya ustaya yükseldiğinde,
    bu silahlardaki yetkinlik dereceniz de uzman veya ustaya yükselir. Çevik veya
    incelikli bir silaha aşinalığınız varsa (Kedisoy Silah Aşinalığı hünerinden olduğu
    gibi), o silah da sizin için monk özelliği kazanır. Bu hüner veya yetenek Turna
    Duruşu gibi tek ve belirli bir saldırı türü kullanmanızı gerektirmediği sürece,
    normalde silahsız saldırı gerektiren herhangi bir keşiş hünerinizle veya keşiş
    yeteneğinizle yakın dövüş keşiş silahlarını kullanabilirsiniz. Silahsız saldırılar
    için kritik uzmanlaşma avantajı kazanırsanız (örneğin Uzman Saldırılar sınıf özelliğiyle),
    bunu keşiş silahlarıyla da kazanırsınız.
omen://feat/mountain-quake?source=paizo-pathfinder-player-core-2:
  name: Dağ Depremi
  description: Yere sertçe basarak altınızdaki toprağı sarsarsınız. Bir yayılım içinde
    yerdeki yaratıklar, sınıf ZD'nize karşı bir kurtarışla Kuvvet değiştiricinize
    eşit (en az 0) hasar alır. Başarısızlık durumunda ayrıca Yüzüstü yere düşerler.
    Bu eylemi kullandıktan sonra 1d4 tur boyunca tekrar kullanamazsınız.
  prerequisites:
  - text: Dağ Kalesi
omen://feat/mountain-stance?source=paizo-pathfinder-player-core-2:
  name: Dağ Duruşu
  description: >
    Cüce keşişler tarafından yaratılmış bir teknik olan sarsılmaz bir dağın duruşuna
    geçerek bir çığın ağırlığıyla vurmanızı ve giysilerinizle darbeleri savuşturmanızı
    sağlarsınız. Yapabileceğiniz tek Vuruşlar düşen taş silahsız saldırılarıdır. Bunlar
    1d8[bludgeoning] hasar verir; brawling grubundadır ve kuvvetli, öldürücü olmayan
    ile silahsız özelliklerine sahiptir. Dağ Duruşundayken SD'ye +4 eşya bonusu ve
    Yerinden Oynatma, İtme, Çelme Takma ve diğer zorunlu hareket etkilerine karşı
    tüm savunmalara +2 durumsal bonus kazanırsınız. SD'nize yönelik Çeviklik değiştirici
    sınırınız +0'dır, yani SD'nize Çevikliğinizi eklemezsiniz ve Hızlarınızın tümü
    5 fit azalır. Dağ Duruşu'ndan gelen SD eşya bonusu, kaşif giysilerinizdeki zırh
    kudreti rünleri, mistik zırh ve kuvvet bileklikleri ile kümülatiftir.
omen://feat/mountain-stronghold?source=paizo-pathfinder-player-core-2:
  name: Dağ Kalesi
  description: Toprakla olan bağınıza odaklanır ve size yönelik saldırıları engellemesi
    için dağı çağırırsınız. Bir sonraki turunuzun başlangıcına kadar SD'nize +2 durumsal
    bonus kazanırsınız.
  prerequisites:
  - text: Dağ Duruşu
omen://feat/necromantic-physiology?source=paizo-pathfinder-player-core-2:
  name: Nekromantik Fizyoloji
  description: Sıra dışı fizyolojiniz, parazitlerin ve diğer istilaların sizi avlamasını
    zorlaştıracak şekilde gelişmiştir. Hastalıklara karşı yapılan kurtarışlara +2
    durumsal bonus kazanırsınız. Bir hastalığa karşı kurtarışta başarı elde ederseniz
    bunun yerine kritik başarı elde edersiniz. Kurtarışı bu şekilde iyileştiren farklı
    bir yeteneğiniz varsa (Savaşta Pişmiş savaşçı sınıf özelliği gibi), kurtarışta
    kritik başarısızlık elde ederseniz bunun yerine başarısızlık elde edersiniz.
omen://feat/night-magic?source=paizo-pathfinder-player-core-2:
  name: Gece Büyüsü
  description: Damarlarınızda akan büyüye erişebilirsiniz. 2. derece ilahi özgü büyüler
    olarak Hayvan Biçimi (yalnızca kurt, köpekgil istatistikleri kullanılarak) ve
    Sis kazanırsınız. Bu büyülerin her birini günde bir kez yapabilirsiniz.
omen://feat/no-escape?source=paizo-pathfinder-player-core-2:
  name: Kaçış Yok
  description: Geri çekilen bir düşmana ayak uydurursunuz. Düşmanı takip ederek ve
    hareketi boyunca onu erişiminizde tutarak Hızınıza kadar Depar atarsınız; düşman
    durana veya siz tam Hızınız kadar hareket edene kadar sürer. İlgili hareket türüne
    sahipseniz Depar atmak yerine Kazma, Tırmanma, Uçma veya Yüzme için de Kaçış Yok
    kullanabilirsiniz.
omen://feat/nocturnal-senses?source=paizo-pathfinder-player-core-2:
  name: Gece Duyuları
  description: Duyularınız daha da büyük bir berraklık kazanır. Öfkeliyken, alacakaranlık
    görüşünüz varsa karanlık görüşü kazanırsınız; koku alma duyunuz varsa kusurlu
    koku alma duyunuzun menzili 60 fite çıkar.
  prerequisites:
  - text: alacakaranlık görüşü veya koku alma
omen://feat/nocturnal-tripkee?source=paizo-pathfinder-player-core-2:
  name: Gececil Tripkee
  description: Avlarınızın ve işlerinizin çoğunu gece yapma eğilimindesinizdir ve
    gece yaşamının gereksinimlerine uyum sağlamışsınızdır. Karanlıkta ve loş ışıkta
    tıpkı parlak ışıkta olduğu kadar iyi görmenizi sağlayan karanlık görüşü kazanırsınız.
    Ancak karanlıkta yalnızca siyah-beyaz görürsünüz.
omen://feat/numb-to-death?source=paizo-pathfinder-player-core-2:
  name: Ölüme Karşı Hissiz
  description: Geçmişiniz sizi ölümün çağrısına karşı hissiz bırakmıştır. Her gün
    ölmekteyken Can Puanı geri kazandığınız ilk seferde, geri kazandığınız Can Puanı
    miktarına seviyenize eşit bir durumsal bonus kazanırsınız; ayrıca yaralı durumu
    kazanmaz ve bu durumun değerini artırmazsınız.
  prerequisites:
  - text: Zor Ölür
  - text: En az bir kez ölmüş olmalısınız
omen://feat/occult-dragonblood?source=paizo-pathfinder-player-core-2:
  name: Okült Ejderkan
  description: Kanınız, fesatçı ejderha ya da kehanet ejderhası gibi gizemli bir ejderhadan
    gelen sıra dışı veya açıklanamaz gücün küçük bir parçasını barındırır. Dünyanın
    daha tuhaf taraflarına çekilirsiniz ve genellikle bir bakışta onları fark edebilirsiniz.
    Okültizm becerisinde eğitimli yetkinlik derecesi kazanırsınız. Okültizm becerisinde
    otomatik olarak eğitimli olursanız (örneğin geçmişinizden veya sınıfınızdan),
    bunun yerine seçeceğiniz bir beceride eğitimli hâle gelirsiniz. Tuhaflık Tespiti
    beceri hünerini kazanırsınız. Bir ejderimsi nümune seçerseniz okült bir ejderha
    seçmelisiniz.
omen://feat/one-for-all?source=paizo-pathfinder-player-core-2:
  name: Birimiz Hepimiz İçin
  description: Tam yerinde cesaret verici sözlerle bir müttefikin çabalarını pekiştirirsiniz.
    30 fit içindeki bir müttefiki belirleyin; bu eylem o müttefike Yardım Etmek için
    yeterli hazırlık sayılır. O müttefike yardım etmek için Yardım Et reaksiyonunu
    kullandığınızda, olağan test yerine Diplomasi testi atabilirsiniz ve eylem fiyaka
    özelliği kazanır.
  prerequisites:
  - text: Eğitimli Diplomasi
omen://feat/one-inch-punch?source=paizo-pathfinder-player-core-2:
  name: Bir İnçlik Yumruk
  description: >
    Tüm kuvvetinizi tek, kudretli ve dikkatle kontrol edilen bir darbeye verirsiniz.
    Bir silahsız Vuruş Yapın. İki eylem harcarsanız ve bu Vuruş isabet ederse, fazladan
    bir silah hasar zarı verirsiniz. İsabet halinde ikinci bir ek silah hasar zarı
    vererek daha da güçlü bir saldırı gerçekleştirmek için bunun yerine 3 eylem harcayabilirsiniz.
    En az 10. seviyedeyseniz, bu hünerden eklediğiniz ilave zar sayısı iki katına
    çıkar; yani 2 eylem harcarsanız toplam 2 ilave zar, 3 eylem harcarsanız 4 ilave
    zar eklersiniz. En az 18. seviyedeyseniz, bu hünerden eklediğiniz ilave zar sayısı
    üç katına çıkar; yani 2 eylem harcarsanız toplam 3 ilave zar, 3 eylem harcarsanız
    6 ilave zar eklersiniz.
  prerequisites:
  - text: Uzman Saldırılar
omen://feat/one-millimeter-punch?source=paizo-pathfinder-player-core-2:
  name: Bir Milimetrelik Yumruk
  description: Yumruklarınız inanılmaz bir kuvvete ve kontrole sahiptir. Bir İnçlik
    Yumruk kullanarak bir hedefe hasar verdiğinizde, düşmanı fırlatmak için qi'nize
    odaklanabilirsiniz. Bunu yaparsanız hedef sınıf ZD'nize karşı bir Dayanıklılık
    kurtarış denemelidir.
  prerequisites:
  - text: Bir İnçlik Yumruk
omen://feat/one-toed-hop?source=paizo-pathfinder-player-core-2:
  name: Tek Parmak Üstünde Sıçrama
  description: Tuhaf bir duruş alarak her ayak parmağınız üzerinde kısa bir sıçrama
    yaparsınız. Hareket eylemleriyle veya bir kareden çıkıldığında ya da bir kareye
    girildiğinde tetiklenebilen reaksiyonları tetiklemeden dikey bir Sıçrama gerçekleştirirsiniz.
omen://feat/ongoing-investigation?source=paizo-pathfinder-player-core-2:
  name: Süregelen Soruşturma
  description: Başka aktiviteler yaparken bile her zaman etrafınızdakileri soruşturursunuz.
    İncele keşif aktivitesini kullanırken tam Hızınızla hareket edebilirsiniz ve İnceleme
    yaparken başka bir keşif aktivitesi daha kullanabilirsiniz.
omen://feat/ongoing-strategy?source=paizo-pathfinder-player-core-2:
  name: Süregelen Strateji
  description: >
    Önceden belirlenmiş bir stratejiniz olmasa bile herkesin hareketlerinin küçük
    ayrıntılarını sürekli incelersiniz. Strateji Geliştirmediğiniz herhangi bir Vuruşta,
    kullandığınız silah veya silahsız saldırı Strateji Geliştirmiş olsaydınız Zekâ
    değiştiricinizi kullanmanıza izin verecek bir silah olduğu sürece, yine de stratejik
    saldırı hasar zarlarınızın sayısına eşit zayıf nokta hasarı verirsiniz.
  prerequisites:
  - text: Stratejik Saldırı
omen://feat/overcrowd?source=paizo-pathfinder-player-core-2:
  name: İç İçe Geçme
  description: Küçük boyutlu olduğunuz sürece, hareketinizi Küçük boyutlu bir müttefikle
    aynı karede sonlandırabilirsiniz. Bu yeteneği veya benzer bir yeteneği kullanırken
    aynı alanı toplamda yalnızca iki yaratık paylaşabilir.
omen://feat/overpowering-charge?source=paizo-pathfinder-player-core-2:
  name: Karşı Konulmaz Hücum
  description: Düşmanlarınızın yanından hücum edip geçerken onları çiğnersiniz. Bodoslama
    Hücum kullandığınızda ve bir yaratığın alanından başarıyla geçtiğinizde, o yaratık
    Kuvvet değiştiricinize eşit ezici hasar alır. Kritik başarı elde ederseniz yaratık
    bu hasarın iki katını alır ve bir sonraki sıranızın sonuna kadar Gafil kalır.
  prerequisites:
  - text: Bodoslama Hücum
omen://feat/oversized-throw?source=paizo-pathfinder-player-core-2:
  name: Aşırı Büyük Fırlatma
  description: Büyük bir hamleyle etrafınızdan bir kaya, kütük, masa, vagon veya bir
    toprak parçası gibi bir nesneyi kavrar ve düşmanlarınıza fırlatırsınız. Nesne
    sizin boyutunuzda veya sizden bir boy küçük olmalı ve en başta onu kaldırmanız
    için çok fazla Yüke (Bulk) sahip olmamalıdır. Nesneyle menzilli bir Vuruş Yapın;
    sonuca bakılmaksızın nesne, bir başarı durumunda vereceği hasar kadar hasar alır.
omen://feat/overwhelming-breath?source=paizo-pathfinder-player-core-2:
  name: Ezici Nefes
  description: Rakibinizin direncini kırmak için nefesinizi kontrol eder ve onu qi'nizle
    hizalayarak kontrollü bir kuvvetle dışarı verirsiniz. Bir sonraki eyleminizi monk
    özelliğine sahip ve süresi olmayan bir Büyü Yapmak için kullanırsanız, büyü ve
    onu yapmanız sonucunda yapacağınız tüm Vuruşlar hedefin fiziksel hasar direncinin
    seviyenize eşit bir miktarını yok sayar.
  prerequisites:
  - text: Qi Büyüleri
omen://feat/pack-hunter?source=paizo-pathfinder-player-core-2:
  name: Sürü Avcısı
  description: Bir sürünün parçası olarak avlanmayı öğrendiniz. Yardım Etme testlerine
    +2 durumsal bonus kazanırsınız ve müttefikleriniz size Yardım Etme testlerine
    +2 durumsal bonus kazanır.
omen://feat/pack-rat?source=paizo-pathfinder-player-core-2:
  name: İstifçi Sıçan
  description: Küçük alanlara büyük miktarları nasıl sığdıracağınızı öğrendiniz. Sıradan
    depolama kaplarına veya araçlara listelenen Yük kapasitesinin fazladan %50'sini
    sığdırabilirsiniz. Örneğin, bir sırt çantasına 6 Yük veya bir sandığa 12 Yük sığdırabilirsiniz.
    Bu, eşyaların Yükünü değiştirmez ve geniş kese gibi büyülü ya da boyutlararası
    bir depolama alanında ne kadar saklayabileceğinizi de etkilemez.
omen://feat/pack-stalker?source=paizo-pathfinder-player-core-2:
  name: Sürü Takipçisi
  description: Pusular saygın bir kholo geleneğidir. Arazi Pusucusu hünerini kazanırsınız
    ve sizden 10 fit mesafede kaldıkları sürece etkilerini tek bir müttefike genişletebilirsiniz.
    Gizlilik becerisinde usta yetkinliğiniz varsa etkiyi iki müttefike genişletebilirsiniz.
    Gizlilik becerisinde efsanevi yetkinliğiniz varsa dört müttefike genişletebilirsiniz.
  prerequisites:
  - text: Uzman Gizlilik
omen://feat/panache-paragon?source=paizo-pathfinder-player-core-2:
  name: Fiyaka Şahikası
  description: Başkalarının kalp atışları ve göz kırpmaları arasındaki anlarda şık
    numaralar sergileme fırsatları bulursunuz. Kalıcı olarak Hızlanmış (Quickened)
    durumdasınızdır. Ek eylemi yalnızca bir fiyaka eylemi gerçekleştirmek için kullanabilirsiniz.
omen://feat/parry-and-riposte?source=paizo-pathfinder-player-core-2:
  name: Savuşturma ve Karşı Saldırı
  description: >
    Savuşturmalarınız ve bitirici hamleleriniz, en ufak bir kışkırtmada karşı vuruş
    yapmanızı sağlar. Son sıranızda bir bitirici hamleyle o yaratığa hasar vermiş
    olmanız ve şu anda savuşturma silah özelliğinden veya Gösterişli Savuşturma'dan
    gelen bir SD durumsal bonusuna sahip olmanız şartıyla, size karşı bir Vuruşta
    başarısız olan (yalnızca kritik başarısız değil) bir düşmana karşı Fırsat Karşı
    Saldırısı kullanabilirsiniz.
  prerequisites:
  - text: Fırsat Karşı Saldırısı
omen://feat/parthenogenic-hatchling?source=paizo-pathfinder-player-core-2:
  name: Partenogenetik Yavru
  description: >
    Halkınız için zor zamanlarda döllenmemiş bir yumurtadan çıktınız ve annenizin
    biyolojik bir kopyasısınız. Hastalıklara karşı yapılan kurtarışlara +1 durumsal
    bonus kazanırsınız. Bir hastalığa karşı kurtarışta başarı elde ederseniz bunun
    yerine kritik başarı elde edersiniz. Kurtarışı bu şekilde iyileştiren farklı bir
    yeteneğiniz varsa (Savaşta Pişmiş savaşçı sınıf özelliği gibi), kurtarışta kritik
    başarısızlık elde ederseniz bunun yerine başarısızlık elde edersiniz. Susuzluktan
    her saat ve açlıktan her gün hasar almak yerine, susuzluktan yalnızca 2 saatte
    bir ve açlıktan 2 günde bir hasar alırsınız.
omen://feat/peerless-form?source=paizo-pathfinder-player-core-2:
  name: Eşsiz Form
  description: Bedeniniz üzerindeki ustalığınız, zamanın yıpratıcı etkilerini geride
    tutacak kadar kusursuzdur. Zamanınız dolduğunda yine de ölmenize rağmen yaşlanmanız
    durur. Ek olarak, Dayanıklılık ve İrade kurtarışlarına +2 statü bonusu kazanırsınız.
omen://feat/penetrating-projectile?source=paizo-pathfinder-player-core-2:
  name: Delici Mermi
  description: Mermileriniz et ve kemik tarafından engellenmez. Bir hat üzerindeki
    her yaratığa karşı delici hasar veren menzilli veya fırlatılan bir silahla menzilli
    bir Vuruş Yapın (Vuruş sayısına bakılmaksızın bu yalnızca tek bir mermi kullanır).
    Bu Vuruşlar yaratıkların sağladığı tüm siperleri yok sayar. Hasarı yalnızca bir
    kez atın ve isabet ettiğiniz her yaratığa uygulayın. Her saldırı çoklu saldırı
    cezanıza sayılır, ancak tüm saldırılarınızı yapana kadar cezanızı artırmayın.
omen://feat/perfect-clarity?source=paizo-pathfinder-player-core-2:
  name: Kusursuz Açıklık
  description: Saldırınızın hedefe ulaşmasını ve zihninizin özgür kalmasını sağlamak
    için tüm öfkenizi yakıp kül edersiniz. Tetikleyici saldırı zarını veya İrade kurtarışı
    +2 durumsal bonusuyla yeniden atın ve daha iyi sonucu kullanın. Ardından hemen
    öfkelenmeyi bırakırsınız.
omen://feat/perfect-finisher?source=paizo-pathfinder-player-core-2:
  name: Kusursuz Bitirici Hamle
  description: Fiyakanızı kusursuz bir taarruza odaklarsınız. Saldırı zarını iki kez
    atıp daha iyi sonucu kullanarak bir Vuruş Yapın.
omen://feat/person-of-interest?source=paizo-pathfinder-player-core-2:
  name: Şüpheli Şahıs
  description: Bazen bir soruşturmanın ortasında ipuçlarını geldikçe takip etmeniz
    gerekir. Bildiğiniz kadarıyla mevcut soruşturmalarınızın hiçbiriyle bağlantılı
    olmayan görebildiğiniz bir yaratık seçin. Sonraki 1 dakika boyunca, o yaratığa
    karşı serbest eylem olarak Strateji Geliştirebilirsiniz.
omen://feat/pick-up-the-pace?source=paizo-pathfinder-player-core-2:
  name: Tempoyu Artır
  description: Örnek olarak liderlik edersiniz ve başkalarının kendilerini normal
    sınırlarının ötesine zorlamalarına yardımcı olabilirsiniz. Keşif modunda bir grup
    halinde Hızlanırken grubunuz, tek başına en uzun süre Hızlanabilecek üye kadar
    uzun süre Hızlanabilir.
  prerequisites:
  - text: Dayanıklılık +2
omen://feat/pinning-fire?source=paizo-pathfinder-player-core-2:
  name: Sabitleyici Atış
  description: >
    Rakibinizi yere veya yakındaki bir yüzeye sabitlemek için delici mermilerle onun
    kıyafetlerini, teçhizatını veya gevşek etini hedef alırsınız. Her iki saldırınız
    da isabet ederse hedef, sınıf ZD'nize karşı bir Refleks kurtarışta başarılı olmalı
    ya da kendisi veya bitişiğindeki bir yaratık sabitleyen mermileri çıkarmak için
    bir Sabitleyici Mermiler testinde başarılı olana kadar Hareketsiz kalmalıdır.
    Yaratık cisimsizse, sıvıysa (su elementi veya bazı jöleler gibi) veya başka bir
    şekilde çaba harcamadan kaçabiliyorsa saplanıp kalmaz.
omen://feat/plot-the-future?source=paizo-pathfinder-player-core-2:
  name: Geleceği Tasarla
  description: >
    Olayların nasıl gelişeceğini tekinsiz bir şekilde tahmin etmek için tefekküre
    10 dakika harcarsınız. 1 hafta içinde girişmeyi planladığınız belirli bir hedef
    veya etkinlik ya da 1 hafta içinde gerçekleşmesini beklediğiniz bir olay seçin.
    Gerçekleşmesinin muhtemel olup olmadığını analiz eder; çok muhtemel, biraz muhtemel,
    biraz muhtemel değil veya hiç muhtemel değil şeklinde öğrenirsiniz. Ayrıca, hangisini
    tercih ederseniz seçilen olayı daha fazla veya daha az muhtemel kılabilecek, sizin
    veya müttefiklerinizin atabileceği bir hareket tarzı öneren bir tavsiye kazanırsınız.
    Olayın gerçekleşme ihtimalini ve öğrendiğiniz tavsiyeyi GM belirler.
omen://feat/precise-finisher?source=paizo-pathfinder-player-core-2:
  name: Hassas Bitirici Hamle
  description: Düşmanınız Kendinden Emin Bitirici Hamlenizden kaçındığında bile hayati
    bir noktaya vurabilirsiniz. Kendinden Emin Bitirici Hamle ile bir başarısızlık
    durumunda, yarısı yerine tam hassas saldırı hasarınızı uygularsınız.
  prerequisites:
  - text: Kendinden Emin Bitirici Hamle
omen://feat/predators-growl?source=paizo-pathfinder-player-core-2:
  name: Yırtıcı Hırıltısı
  description: Yeni bulduğunuz bir yaratığın Gözdağı Vermeye çalışmak için gırtlaktan
    gelen bir hırıltı çıkarırsınız. Yaratıkla aynı dili paylaşmadığınız için uygulanan
    -4 cezasını almazsınız.
  prerequisites:
  - text: Uzman Gözdağı
omen://feat/predators-pounce?source=paizo-pathfinder-player-core-2:
  name: Yırtıcı Atılışı
  description: Avınızla aranızdaki mesafeyi göz açıp kapayıncaya kadar kapatır, yaratık
    tepki veremeden üzerine atlarsınız. Hızınıza kadar Depar atarsınız ve hareketinizin
    sonunda bir Vuruş Yaparsınız.
  prerequisites:
  - text: hayvan içgüdüsü
omen://feat/predictive-purchase-investigator?source=paizo-pathfinder-player-core-2:
  name: Öngörülü Tedarik (Müfettiş)
  description: >
    Durum için tam gereken şeye sahipsinizdir. Öngörülü Plancı ve Öngörülü Sarf Malzemesi
    hünerlerini kazanırsınız. Öngörülü Plancı'yı kullanırken 1 dakika harcamak yerine
    sırt çantanızı (veya benzeri bir kabı) çıkarıp eşyayı çekmek için 2 eylemlik bir
    aktiviteyle eşyayı çekip çıkarabilirsiniz.
omen://feat/prevailing-position?source=paizo-pathfinder-player-core-2:
  name: Hâkim Konum
  description: Duruşlar konusundaki esnekliğiniz, kendinizi daha iyi korumak için
    onların avantajlarını feda etmenize olanak tanır. Bulunduğunuz duruştan çıkarak
    tetikleyici kurtarışa veya tetikleyici saldırıya karşı SD'nize +4 durumsal bonus
    kazanırsınız.
  prerequisites:
  - text: en az bir duruş hüneri
omen://feat/pride-hunter?source=paizo-pathfinder-player-core-2:
  name: Kedi Sürüsü Avcısı
  description: Müttefiklerinize odaklanmış yaratıkların dikkatinden kaçınırsınız.
    Saklanmak için müttefiklerinizden gelen küçük siperi kullanabilirsiniz.
omen://feat/pride-in-arms?source=paizo-pathfinder-player-core-2:
  name: Silah Gururu
  description: Bir zafer narasıyla bir müttefike savaşmaya devam etmesi için ilham
    verirsiniz. Tetikleyici müttefik, bir sonraki sırasının sonuna kadar Dayanıklılık
    değiştiricisine eşit geçici Can Puanı kazanır.
omen://feat/primal-dragonblood?source=paizo-pathfinder-player-core-2:
  name: Doğa Ejderkanı
  description: Adamantin ejderha veya boynuzlu ejderha gibi doğal dünyayla derin bağı
    olan bir ejderha soy ağacınızda yer alır. İçgüdülerinize güvenme eğilimindesinizdir
    ve vahşi doğanın koruyucusu rolünü üstlenebilirsiniz. Doğa becerisinde eğitimli
    yetkinlik derecesi kazanırsınız. Doğa becerisinde otomatik olarak eğitimli olursanız
    (örneğin geçmişinizden veya sınıfınızdan), bunun yerine seçeceğiniz bir beceride
    eğitimli hâle gelirsiniz. Yön Sezmek ve vahşi doğada Barınmak için Doğa becerisini
    kullanabilirsiniz. Bir ejderimsi nümune seçerseniz doğa ejderhası seçmelisiniz.
omen://feat/primal-rampage?source=paizo-pathfinder-player-core-2:
  name: İlkel Kuduruş
  description: Günde bir kez yapabileceğiniz 4. derece doğa özgü büyüleri olarak Serbest
    Hareket ve Dağ Dayanıklılığı kazanırsınız. 3 eylemlik bir aktivite olarak, her
    ikisi de o gün için hâlâ mevcut olduğu sürece, bu özgü büyülerin her ikisini de
    yapmak için iki kez Büyü Yapabilirsiniz.
omen://feat/prodigious-climber?source=paizo-pathfinder-player-core-2:
  name: Olağanüstü Tırmanıcı
  description: Doğal tırmanma kabiliyetiniz ve tekniğiniz sizi güçlü bir tırmanıcı
    yapmıştır. 10 fitlik bir tırmanma Hızı kazanırsınız.
omen://feat/projectile-snatching?source=paizo-pathfinder-player-core-2:
  name: Mermi Yakalama
  description: Havadan mermileri kapar ve onları kaynağına geri fırlatırsınız. Mermiyi
    Saptır ile bir saldırıyı başarıyla saptırdığınızda, aynı reaksiyonun bir parçası
    olarak saptırdığınız mermiyi kullanarak saldırgana karşı hemen menzilli bir Vuruş
    Yapabilirsiniz. Bu, tetikleyici saldırıyla aynı menzil artışına ve isabet etkisine
    sahip fırlatılan bir silahtır.
  prerequisites:
  - text: Mermiyi Saptır
omen://feat/qi-center?source=paizo-pathfinder-player-core-2:
  name: Qi Merkezi
  description: Kendinizi evrenle dengeler ve onun engin kudretinden yararlanırsınız.
    Bir Odak Puanı harcamadan, stance özelliğine sahip tek eylemlik bir qi büyüsü
    yaparsınız.
  prerequisites:
  - text: Birçok Tarzın Ustası
  - text: Qi Büyüleri
omen://feat/qi-spells?source=paizo-pathfinder-player-core-2:
  name: Qi Büyüleri
  description: Büyülü etkiler üretmek için qi'nizi geliştirdiniz. İçsel Çalkantı,
    Qi Atılımı veya erişiminiz olan başka bir 1. derece keşiş qi büyüsü kazanırsınız.
omen://feat/quaking-stomp?source=paizo-pathfinder-player-core-2:
  name: Sarsıcı Basış
  description: Yere öylesine bir kuvvetle basarsınız ki sınıf ZD'nizi kullanan Deprem
    büyüsünün etkilerine sahip küçük bir deprem yaratır.
omen://feat/quick-stow-ratfolk?source=paizo-pathfinder-player-core-2:
  name: Hızlı Zula (Sıçansoy)
  description: Tuttuğunuz bir eşyayı (sığması koşuluyla) yanak keselerinizde saklamak
    için Etkileşime Girersiniz.
  prerequisites:
  - text: Yanak Keseleri
omen://feat/quietus-strikes?source=paizo-pathfinder-player-core-2:
  name: Ebedi İstirahat Saldırıları
  description: Kemiklik ile olan bağınız, yaşamın ve ölümsüzlüğün her formunun zaaflarını
    istismar ederek onlara ölüm getirmeniz için sizi güçlendirir. Tüm silah ve silahsız
    Vuruşlarınız büyülüdür; yaşayan yaratıklara 1 ek hiçlik hasarı, hortlaklara ise
    1 ek dirimsellik hasarı verir. Vuruş bir +3 kuvvet rününe sahipse ek hasar 2'ye
    çıkar.
omen://feat/rabid-sprint?source=paizo-pathfinder-player-core-2:
  name: Kuduz Depar
  description: Dört ayak üzerinde olabildiğince hızlı koşarsınız. Üç kez Depar atın.
  prerequisites:
  - text: köpek kholo mirası
omen://feat/raging-athlete?source=paizo-pathfinder-player-core-2:
  name: Öfkeli Atlet
  description: Fiziksel engeller öfkenizi durduramaz. Öfkeliyken, kara Hızınıza eşit
    bir tırmanma Hızı ve yüzme Hızı kazanırsınız; Yüksek Atlama ve Uzun Atlama ZD'leriniz
    10 azalır ve başarılı bir Uzun Atlamadaki mesafenizi 10 fit artırırsınız. Dikey
    bir Sıçrama için mesafeniz dikeyde 5 fite çıkar; yatay bir Sıçrama için mesafeniz
    Hızınız en az 15 fit ise 15 fite, Hızınız en az 30 fit ise 20 fite çıkar.
  prerequisites:
  - text: Uzman Atletizm
omen://feat/raging-intimidation?source=paizo-pathfinder-player-core-2:
  name: Öfkeli Gözdağı
  description: Öfkeniz düşmanlarınızı korkuyla doldurur. Öfkeliyken, Gözdağı Ver ve
    Korkudan Öldür eylemleriniz (sırasıyla Gözdağı becerisinden ve bir Gözdağı beceri
    hünerinden) öfke özelliği kazanarak bunları öfkeliyken kullanmanıza olanak tanır.
    Korkutucu Bakış ve Korkudan Öldür beceri hünerlerinin önkoşullarını karşıladığınız
    anda bu hünerleri kazanırsınız.
omen://feat/raging-thrower?source=paizo-pathfinder-player-core-2:
  name: Öfkeli Fırlatıcı
  description: Fırlatılan silahlar öfkeniz içinde özellikle ölümcül hâle gelir. Öfke'den
    gelen ek hasarı fırlatılan silah saldırılarınıza uygularsınız. Gaddar Kritik hünerine
    veya Yıkıcı sınıf özelliğine sahipseniz, bunların avantajlarını fırlatılan silah
    saldırılarına uygulayın.
omen://feat/rallying-cry?source=paizo-pathfinder-player-core-2:
  name: Toplanma Çağrısı
  description: Müttefiklerinize seslenir ve savaşta her şeylerini ortaya koymaları
    için onları teşvik edersiniz. Sizi duyabilen bir yayılım içindeki tüm müttefikler,
    seviyenize eşit sayıda geçici Can Puanı kazanır. Ek olarak, bu müttefikler 1 dakika
    boyunca Hızlanmış (Quickened) hâle gelir ancak fazladan eylemi yalnızca Adım atmak,
    Depar atmak veya Vuruş Yapmak için kullanabilirler.
omen://feat/rapid-affixture?source=paizo-pathfinder-player-core-2:
  name: Hızlı Tutturma
  description: Bir Tılsım Tutturmak için yalnızca 1 dakika harcarsınız. Zanaat becerisinde
    efsaneviyseniz, 3 eylemlik bir aktivite olarak bir Tılsım Tutturabilirsiniz.
  prerequisites:
  - text: Usta Zanaat
omen://feat/rat-familiar?source=paizo-pathfinder-player-core-2:
  name: Sıçan Ruhdaş Hayvan
  description: Sizinle büyülü bir bağ kurmuş evcil bir sıçanınız var. Bir ruhdaş hayvan
    kazanırsınız ve bu ruhdaş hayvan bir sıçan olmalıdır. Ruhdaş Hayvan yeteneklerinin
    avantajlarını almaya devam eder, ancak temel formu bir sıçan olarak kalır.
omen://feat/rat-form?source=paizo-pathfinder-player-core-2:
  name: Sıçan Biçimi
  description: Zararsız görünen bir sıçana dönüşebilirsiniz. 1. derece bir Haşere
    Formu büyüsünün etkilerini kazanırsınız, ancak Ufacık bir sıçanın savaş formuna
    bürünmelisiniz.
omen://feat/rat-magic?source=paizo-pathfinder-player-core-2:
  name: Sıçan Büyüsü
  description: Sizin için mesajları taşıyacak küçük bir sıçan etrafta her zaman var
    gibi görünür. Hayvan Ulak büyüsünü günde bir kez ilkel özgü büyü olarak yapabilirsiniz.
    Bunu yaptığınızda yanıt veren hayvan her zaman bir sıçandır. Menzil içinde hiç
    sıçan yoksa büyü ziyan olur.
omen://feat/ratfolk-lore?source=paizo-pathfinder-player-core-2:
  name: Sıçansoy İlimi
  description: >
    Sıçansoy toplulukları arasındaki yılların deneyimi sizi çevik kılmıştır; düşmanlar
    tehdit ettiğinde kaçmayı ve saklanmayı öğrendiniz. Akrobasi ve Gizlilik becerilerinde
    eğitimli yetkinlik derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak
    eğitimli olursanız (örneğin geçmişinizden veya sınıfınızdan), bunun yerine seçeceğiniz
    bir beceride eğitimli hâle gelirsiniz. Ayrıca Sıçansoy İlimi için Ek İlim genel
    hünerini kazanırsınız.
omen://feat/ratfolk-roll?source=paizo-pathfinder-player-core-2:
  name: Sıçansoy Yuvarlanması
  description: Bir top gibi kıvrılır ve bir eğimden aşağı düz bir hat üzerinde Hızınızın
    dört katına kadar hareket edersiniz. Bu ilk hareket sırasında eğimin dibine ulaşırsanız
    veya bir engele çarparsanız, güvenli bir şekilde yuvarlanmayı bırakırsınız. Aksi
    takdirde, eğimin dibine ulaşana veya bir engel bu hareketi sonlandırana kadar
    (bu durum sıranızın ortasında gerçekleşebilir) sonraki sıralarda bu Hızda otomatik
    olarak yuvarlanmaya devam edersiniz. Yuvarlanmaya devam ettiğiniz ilkinden sonraki
    her sıra Yavaşlatılmış 2 olursunuz ve ilkinden sonraki bir sırada bir engele çarparsanız
    hem siz hem de engel 4d6[bludgeoning] hasar alırsınız ve yuvarlanmayı bırakırsınız.
omen://feat/ratspeak?source=paizo-pathfinder-player-core-2:
  name: Sıçan Dili
  description: Kunduzlar, fareler, oklukirpiler, sıçanlar ve sincaplar dahil olmak
    üzere kemirgenlere soru sorabilir, onlardan yanıt alabilir ve onlarla Diplomasi
    becerisini kullanabilirsiniz; ancak köpekler veya yarasalar gibi diğer memelilerle
    bunu yapamazsınız. Hangi hayvanların kemirgen sayılacağını GM belirler.
omen://feat/reactive-strike?source=paizo-pathfinder-player-core-2:
  name: Reaktif Saldırı
  description: Açık veren bir düşmana vurursunuz. Tetikleyici yaratığa karşı yakın
    dövüş Vuruşu yapın. Vuruşunuz kritik bir vuruşsa ve tetikleyici bir manipülasyon
    eylemi idiyse, o eylemi bozarsınız. Bu Vuruş çoklu saldırı cezanıza sayılmaz ve
    çoklu saldırı cezanız bu Vuruşa uygulanmaz.
omen://feat/reason-rapidly?source=paizo-pathfinder-player-core-2:
  name: Hızlı Akıl Yürütme
  description: Zihniniz inanılmaz bir hızla ipuçlarını çözer. Anında en fazla beş
    Bilgi Hatırla eylemi kullanırsınız. Bilgi Hatırladığınızda normalde tetiklenecek
    özel yetenekleriniz veya serbest eylemleriniz varsa, bunları bu eylemler için
    kullanamazsınız.
omen://feat/recognize-ambush?source=paizo-pathfinder-player-core-2:
  name: Pusuyu Fark Et
  description: Savaş eğitiminiz sizi her an bir saldırıya hazır olacak şekilde bilemiştir.
    Bir silah çekmek için Etkileşime Girersiniz.
omen://feat/reflexive-riposte?source=paizo-pathfinder-player-core-2:
  name: Refleksif Karşı Saldırı
  description: Neredeyse hiç düşünmeden karşı vuruş yapabilirsiniz. Eylemlerinizi
    geri kazandığınız her sıranızın başında, yalnızca bir Fırsat Karşı Saldırısı gerçekleştirmek
    için kullanılabilecek ek bir reaksiyon kazanırsınız.
  prerequisites:
  - text: Fırsat Karşı Saldırısı
omen://feat/reflexive-stance?source=paizo-pathfinder-player-core-2:
  name: Refleksif Duruş
  description: Düşünmeden bir duruşa geçersiniz. Stance özelliğine sahip bir eylem
    kullanın.
omen://feat/reliable-luck?source=paizo-pathfinder-player-core-2:
  name: Güvenilir Şans
  description: Şaşırtıcı bir düzenlilikle tehlikelerden sağ çıkarsınız. Kedi Şansı'nı
    günde bir kez yerine saatte bir kez kullanabilirsiniz.
  prerequisites:
  - text: Kedi Şansı
omen://feat/remorseless-lash?source=paizo-pathfinder-player-core-2:
  name: Merhametsiz Kırbaç
  description: Morali zaten bozulmakta olan bir düşmanı hırpalamakta ustasınız. Korkmuş
    bir düşmana karşı yakın dövüş silahıyla bir Vuruşta başarılı olduğunuzda, o düşman
    bir sonraki sıranızın başlangıcına kadar korkmuş durum değerini 1'in altına düşüremez.
omen://feat/renewed-vigor?source=paizo-pathfinder-player-core-2:
  name: Tazelenen Gayret
  description: Savaşın sisi arasından öfkeli gayretinizi hızla toparlarsınız. Seviyenizin
    yarısı artı Dayanıklılık değiştiricinize eşit geçici Can Puanı kazanırsınız. Bu
    sırada bir saldırı eylemi yaptıysanız, geçici Can Puanı miktarını seviyeniz artı
    Dayanıklılık değiştiricinize çıkarın. Bu geçici Can Puanları öfkenizin sonuna
    kadar sürer.
omen://feat/reptile-speaker?source=paizo-pathfinder-player-core-2:
  name: Sürüngen Dili
  description: Sürüngenlerin çıkardığı sesleri bir dil olarak duyarsınız. Sürüngen
    olan hayvanlara soru sorabilir, onlardan yanıt alabilir ve onlarla Diplomasi becerisini
    kullanabilirsiniz (hangi hayvanların sürüngen sayılacağını GM belirler).
omen://feat/resist-ruin?source=paizo-pathfinder-player-core-2:
  name: Yıkıma Diren
  description: Alacakaranlıkgezer mirasınız, hiçlik enerjisine karşı korumayı genişletmenize
    olanak tanır. Hiçlik enerjisine karşı 5 direnç kazanırsınız ve günde bir kez 5.
    derece ilahi özgü büyü olarak Sahte Canlılık yapabilirsiniz.
omen://feat/resounding-blow?source=paizo-pathfinder-player-core-2:
  name: Yankılanan Darbe
  description: Düşmanınızın kafasına kulaklarını çınlatacak kadar büyük bir kuvvetle
    vurursunuz. Bir yakın dövüş Vuruşu yapın. Vuruş isabet eder ve hasar verirse,
    hedef bir sonraki sıranızın başlangıcına kadar (veya kritik vuruşta 1 dakika boyunca)
    Sağırlaşır.
omen://feat/resplendent-spellhorn?source=paizo-pathfinder-player-core-2:
  name: Görkemli Büyü Boynuzu
  description: Büyünüz serpilmeye devam ediyor. Yaygın bir 3. derece arkana büyü ve
    yaygın bir 4. derece arkana büyü seçin. Bu büyülerin her birini günde bir kez
    arkana özgü büyü olarak yapabilirsiniz.
  prerequisites:
  - text: Evrilmiş Büyü Boynuzu
omen://feat/retreating-finisher?source=paizo-pathfinder-player-core-2:
  name: Geri Çekilen Bitirici Hamle
  description: Savunmanızı düşürmeden hesaplı bir vuruş yaparsınız. Aşağıdaki başarısızlık
    etkisine sahip bir yakın dövüş Vuruşu yapın.
omen://feat/return-fire?source=paizo-pathfinder-player-core-2:
  name: Karşı Ateş
  description: Havadan bir oku kaparak anında yayınıza yerleştirir ve karşı ateş açarsınız.
    Ok olan bir saldırıyı Mermiyi Saptır ile başarıyla savuşturduğunuzda, bu reaksiyonun
    bir parçası olarak saptırdığınız oku ateşleyerek kendi yayınızdan hemen menzilli
    bir yay Vuruşu yapabilirsiniz.
  prerequisites:
  - text: Mermiyi Saptır
  - text: Manastır Okçusu Duruşu
omen://feat/revitalizing-finisher?source=paizo-pathfinder-player-core-2:
  name: Canlandırıcı Bitirici Hamle
  description: Fiyakanız size ve müttefiklerinize güven aşılar. Bir Vuruş Yapın. İsabet
    durumunda, siz ve 30 fit içindeki tüm müttefikler seviyenizin yarısına eşit geçici
    Can Puanı kazanırsınız.
omen://feat/ricocheting-leap?source=paizo-pathfinder-player-core-2:
  name: Seken Sıçrayış
  description: Düşmanları devirmek ve üzerlerinden sıçramak için momentumunuzu hızla
    kullanırsınız. Sizden daha büyük yaratıkları duvarlarmış gibi kullanarak üzerlerinden
    ek atlamalar yapmak için Duvar Sıçrayışı hünerini kullanabilirsiniz. Bu şekilde
    bir yaratığın üzerinden ek bir atlama yaptığınızda sırada bir kez, serbest bir
    eylem olarak o yaratığı İtmeyi veya ona Çelme Takmayı da deneyebilirsiniz.
  prerequisites:
  - text: Duvar Sıçrayışı
omen://feat/right-hand-blood?source=paizo-pathfinder-player-core-2:
  name: Sağ El Kanı
  description: Bir sırtlanın sağ tarafındaki etin hastalıkları iyileştirebildiği,
    ancak sol tarafındaki etin ölümcül ve zehirli olduğu söylenir. Birine sağ tarafınızdan
    kan içirmek ve İlk Yardım Uygulamak için kendinize 1[slashing] hasar verebilir
    ya da Hastalık Tedavi Etmek veya Yaraları Sarmak için 2d8[untyped] hasar alabilirsiniz;
    her iki durumda da şifacı alet takımına ihtiyacınız olmaz ve testinize +1 eşya
    bonusu kazanırsınız. Sol tarafınızdan gelen kan testin otomatik olarak kritik
    başarısız olmasına yol açar.
omen://feat/risky-surgery?source=paizo-pathfinder-player-core-2:
  name: Riskli Cerrahi
  description: >
    Ameliyatınız bir hastayı ölümün eşiğinden döndürebilir, ancak onu uçurumdan aşağı
    da itebilir. Yaraları İyileştirdiğinizde, Yaraları İyileştir etkilerini uygulamadan
    hemen önce hastanıza 1d8 kesici hasar verebilirsiniz. Bunu yaparsanız, Yaraları
    İyileştirmek için yapılan Tıp testinize +2 durumsal bonus kazanırsınız ve başarı
    zarı atarsanız bunun yerine kritik başarı elde edersiniz.
  prerequisites:
  - text: Eğitimli Tıp
omen://feat/robust-health?source=paizo-pathfinder-player-core-2:
  name: Sapasağlam Sağlık
  description: Fizyolojiniz ilk yardıma iyi yanıt verir. Yaralarınızı İyileştirmeye
    veya üzerinizde Muharebe Tıbbı kullanmaya yönelik başarılı bir girişimden geri
    kazandığınız Can Puanı miktarına seviyenize eşit bir durumsal bonus kazanırsınız.
    Siz veya bir müttefikiniz üzerinizde Muharebe Tıbbı kullandıktan sonra, 1 gün
    yerine yalnızca 1 saat boyunca o Muharebe Tıbbına geçici olarak bağışık kalırsınız.
omen://feat/rolling-landing?source=paizo-pathfinder-player-core-2:
  name: Yuvarlanarak İniş
  description: Momentumunuzu korumanıza yardımcı olan hızlı yuvarlanışlarla yere inersiniz.
    5 fitten fazla düşer ve (genellikle düşüşü daha kısa bir mesafe saymanız nedeniyle)
    hasar almazsanız, yere indiğinizde hemen kısa bir yuvarlanışa girmek ve Adım atmak
    için reaksiyonunuzu kullanabilirsiniz. Akrobasi becerisinde uzmansanız, Hızınızın
    yarısına kadar Adım atmak veya Depar atmak için reaksiyonunuzu kullanabilirsiniz.
    Akrobasi becerisinde ustaysanız, tam Hızınıza kadar Adım atmak veya Depar atmak
    için reaksiyonunuzu kullanabilirsiniz. Akrobasi becerisinde efsaneviyseniz, bu
    şekilde Depar attığınızda hareketle tetiklenen reaksiyonları tetiklemezsiniz.
  prerequisites:
  - text: Kedi Düşüşü
omen://feat/root-magic?source=paizo-pathfinder-player-core-2:
  name: Kök Büyüsü
  description: Tılsımlarınız habis büyüye karşı korur. Günlük hazırlıklarınız sırasında,
    bir müttefike vermek üzere şifalı otlar, saç, kutsal yağlar ve diğer ritüel malzemeleriyle
    küçük bir kese hazırlayabilirsiniz; bu müttefik kendiniz olamazsınız. O gün müttefik
    bir büyüye veya musallata karşı bir kurtarış denediğinde ilk seferinde zara +1
    durumsal bonus kazanır. Okültizm becerisinde uzmansanız bu bonus +2'ye, efsaneviyseniz
    +3'e çıkar.
  prerequisites:
  - text: Eğitimli Okültizm
omen://feat/runtsage?source=paizo-pathfinder-player-core-2:
  name: Çelimsiz Bilgesi
  description: Goblinleri utanç kaynağı veya gözden çıkarılabilir baş belaları olarak
    gören ırkdaşlarınızın çoğunun aksine, onların sorumsuz ve anlaşılmaz eylemlerinin
    ardındaki metodolojiyi incelediniz. Benimsenmiş Soy genel hünerini kazanırsınız
    ve hünerin seçilen soyu olarak goblini seçmelisiniz. Ayrıca 1. seviye bir goblin
    soy hüneri kazanırsınız.
omen://feat/saber-teeth?source=paizo-pathfinder-player-core-2:
  name: Kılıç Dişler
  description: Doğal ya da sonradan kazanılmış uzun dişlere sahipsiniz. 1d6 delici
    hasar veren bir çene silahsız saldırısı kazanırsınız. Çeneniz brawling grubundadır
    ve silahsız özelliğine sahiptir.
omen://feat/sanctify-water?source=paizo-pathfinder-player-core-2:
  name: Suyu Kutsama
  description: Suya ilahınızın lütfunu aşılarsınız. Sizin veya erişiminizdeki bir
    müttefikin sahip olduğu hafif Yüke sahip bir su kabı seçin. Bir sonraki sıranızın
    sonuna kadar mübarek su veya şerli su hâline gelir. İlahınız mübarek keramete
    izin veriyorsa mübarek suyu, şerli keramete izin veriyorsa şerli suyu veya ilahınız
    her iki keramete de izin veriyorsa her ikisinden birini seçebilirsiniz. Bu geçici
    bir etkidir; parasal bir değer katmaz veya suyun ritüellerin masrafları ya da
    benzeri amaçlar için kullanılmasına izin vermez. Din becerisinde ustaysanız bu
    eylemi gerçekleştirdiğinizde iki kabı, efsaneviyseniz üç kabı kutsayabilirsiniz.
  prerequisites:
  - text: Uzman Din
  - text: kerametinde "mübarek" veya "şerli" listeleyen bir ilaha tapmalıdır
omen://feat/scalpels-point?source=paizo-pathfinder-player-core-2:
  name: Neşter Ucu
  description: Stratejileriniz anatomi konusundaki hassas bilginizden faydalanır.
    Strateji Geliştirme nedeniyle saldırı zarınızı ikame ettiğiniz bir saldırıyla
    kritik vuruş yaptığınızda, saldırınız delici veya kesici hasar verdiyse hedefinize
    ayrıca 1d6[bleed] verirsiniz.
  prerequisites:
  - text: Adli Tıp Metodolojisi
omen://feat/scaly-hide?source=paizo-pathfinder-player-core-2:
  name: Pullu Deri
  description: Tüm vücudunuzda ejderha atanızın pullarına benzeyen bir pul tabakasıyla
    doğdunuz. Zırhsız olduğunuzda, pullar en fazla +3 Çeviklik sınırı ile SD'nize
    +1 eşya bonusu verir. SD'ye gelen eşya bonusu 5. seviyede +2'ye çıkar. Bu pullardan
    gelen SD eşya bonusu kâşif kıyafetlerinizdeki zırh kuvveti rünleri, Mistik Zırh
    büyüsü veya Kuvvet Bileklikleri ile birikir.
omen://feat/scamper?source=paizo-pathfinder-player-core-2:
  name: Hızlı Kaçış
  description: Hızınıza +5 fit statü bonusu ile Hızınıza kadar Depar atarsınız ve
    bu hareketle tetiklenen reaksiyonlara karşı SD'nize +2 durumsal bonus kazanırsınız.
    Bu hareketi hiçbir düşmana bitişik olmayan bir alanda sonlandırmalısınız.
omen://feat/scars-of-steel?source=paizo-pathfinder-player-core-2:
  name: Çelik Yaraları
  description: Darbelerin en güçlüsüyle vurulduğunuzda, hasarın bir kısmını savuşturmak
    için kaslarınızı esnetebilirsiniz. Tetikleyici saldırıya karşı Dayanıklılık değiştiriciniz
    artı seviyenizin yarısına eşit direnç kazanırsınız.
  prerequisites:
  - text: Öfke İçgüdüsü
omen://feat/scavengers-search?source=paizo-pathfinder-player-core-2:
  name: Leşçinin Araması
  description: Her zaman erzak ve değerli eşyalar için tetiktesinizdir. Bir Tara eylemiyle
    30 fit içinde aradığınız nesneleri (gizli kapılar ve tehlikeler dahil) bulmak
    için +2 durumsal bonus kazanırsınız.
omen://feat/scion-transformation?source=paizo-pathfinder-player-core-2:
  name: Halef Dönüşümü
  description: Yirmi dört saat boyunca kış uykusuna yatar ve atalarınıza adanmış bir
    ritüel gerçekleştirerek tek seferlik bir başkalaşım geçirirsiniz. Kalıcı olarak
    Büyüt büyüsünün etkilerini kazanırsınız ve maksimum Can Puanınız seviyeniz kadar
    artar. Ritüel, teçhizatınızın çoğunu yeni vücudunuz için uygun boyuta dönüştürür
    (yine de kutsal emanetler veya orijinal boyutlarına güçlü şekilde bağlı eşyalar
    gibi güçlü nesneler GM'nin takdirine bağlı olarak dönüşmeyebilir).
omen://feat/scouring-rage?source=paizo-pathfinder-player-core-2:
  name: Kavurucu Öfke
  description: Öfkenizi serbest bıraktığınızda güçlü bir içgüdüsel enerji dalgası
    yayarsınız. 20 fit içindeki her düşman, o Öfke sırasındaki ek hasarınızla aynı
    türden seviyenize eşit hasar alır (sınıf ZD'nize karşı temel Dayanıklılık kurtarış).
  prerequisites:
  - text: Öfke'den gelen ek hasarınızı farklı bir hasar türüne dönüştürmenize izin
      veren bir içgüdü
omen://feat/second-wind?source=paizo-pathfinder-player-core-2:
  name: İkinci Soluk
  description: İkinci bir öfkeye girebilirsiniz, ancak sonrasında nefesinizi toplamanız
    gerekir. Öfkelendiğinizde, 1 dakika geçmemiş olsa bile (veya Canlandırıcı Öfke
    sınıf özelliğine sahipseniz tam bir sıra) Öfke'den gelen geçici CP'yi kazanmayı
    seçebilirsiniz. Bunu yaparsanız, bu Öfke sona erdiğinde 10 dakika dinlenene kadar
    Bitkin hâle gelirsiniz.
omen://feat/sensitive-nose?source=paizo-pathfinder-player-core-2:
  name: Hassas Burun
  description: Büyük siyah burnunuz yalnızca gösteriş için değildir. Yakınınızdaki
    en hafif kokuları bile alabilir ve onların izini sürebilirsiniz. 30 fit menzilli
    kusurlu koku alma duyusu kazanırsınız.
omen://feat/shadow-mark?source=paizo-pathfinder-player-core-2:
  name: Gölge İşareti
  description: >
    Kişileri fark edilmeden takip etmenize yardımcı olan özel numaralar öğrendiniz.
    Belirli bir hedefi takip ederken Fark Edilmekten Kaçınmak için bir Gizlilik testi
    denediğinizde, hedef Dikkat ZD'sine -2 durumsal ceza alır. Gizlilik becerisinde
    usta yetkinliğiniz varsa bu ceza -3, efsaneviyseniz -4 olur. Hedefi gölge gibi
    izlerken onunla bir karşılaşma başlatırsanız hedef, Sinsice Yaklaş eyleminde olağan
    olduğu üzere inisiyatif zarına ve sizi fark edip etmediğini belirlemek için Dikkat
    ZD'sine bu cezayı alır.
  prerequisites:
  - text: Uzman Gizlilik
omen://feat/shake-it-off?source=paizo-pathfinder-player-core-2:
  name: Silkin
  description: Öfkenize odaklanarak korkunun üstesinden gelir ve hastalıkla mücadele
    edersiniz. Korkmuş durum değerinizi 1 azaltın ve öğürmek için bir eylem harcamışsınız
    gibi Midesi Bulanmış durumundan kurtulmak için bir Dayanıklılık kurtarış deneyin;
    hastalanmış durum değerinizi başarısızlık durumunda 1 (ancak kritik başarısızlıkta
    değil), başarıda 2 veya kritik başarıda 3 azaltırsınız.
omen://feat/share-rage?source=paizo-pathfinder-player-core-2:
  name: Öfkeyi Paylaş
  description: Bir müttefikin öfkesini körüklersiniz. Siz öfkeliyken, 30 fit içindeki
    gönüllü bir yaratık konsantre eylemlerini kullanabilmesi haricinde Öfke eyleminin
    etkilerini kazanır. İçgüdünüzden, hünerlerinizden veya benzerlerinden gelen hiçbir
    ek avantajı almaz.
omen://feat/share-tincture?source=paizo-pathfinder-player-core-2:
  name: Tentürü Paylaş
  description: Hızlı Tentür kullanırsınız ve ürettiğiniz eşya bir sonraki sıranızın
    başlangıcına kadar etkisini korur. Ardından eşyayı başka bir yaratığa aktarmak
    için Etkileşime Girebilirsiniz. Fırlatarak aktarırsanız menzilli saldırınız otomatik
    olarak başarılı olur. Hızlı Tentür kullanmak için normalde olduğu gibi çok yönlü
    bir şişeye sahip olmalısınız.
  prerequisites:
  - text: simyasal bilimler metodolojisi
omen://feat/shared-stratagem?source=paizo-pathfinder-player-core-2:
  name: Paylaşılan Strateji
  description: Yaptığınız planlar kendiniz kadar müttefiklerinizi de kapsar. Strateji
    Geliştirme nedeniyle saldırı zarınızı değiştirdiğiniz bir saldırıyla bir yaratığa
    isabet ettirdiğinizde bir müttefik belirleyin. İsabet ettiğiniz yaratık, bir sonraki
    sıranızın başlangıcından önce o müttefikin o yaratığa karşı yapacağı bir sonraki
    saldırıda o müttefike karşı Gafil kalır.
omen://feat/shattering-blows?source=paizo-pathfinder-player-core-2:
  name: Parçalayıcı Darbeler
  description: Güçlü darbeleriniz nesneleri kolaylıkla parçalar. Öfkeliyken, yakın
    dövüş Vuruşlarınızdan gelen hasar bir nesnenin Sertliğinin ilk 5 puanını yok sayar.
    Yıkıcı sınıf özelliğine sahipseniz, hasar bunun yerine bir nesnenin Sertliğinin
    ilk 10 puanını yok sayar.
omen://feat/shattering-strike-monk?source=paizo-pathfinder-player-core-2:
  name: Parçalayıcı Saldırı (Keşiş)
  description: İnceden inceye düşünülmüş darbenizin kuvveti nesneleri ve savunmaları
    aynı şekilde paramparça eder. Bir silahsız Vuruş Yapın. Hedefin dirençlerini aşar.
    Hedefin Sertliği varsa, Vuruş Sertliği değerinin yarısıymış gibi muamele eder.
omen://feat/shed-tail?source=paizo-pathfinder-player-core-2:
  name: Kuyruk Bırakma
  description: Kaçmak için kuyruğunuzun bir kısmını bırakabilirsiniz. Yakalanmış olmaktan
    çıkarsınız ve ardından sizi yakalayan yaratıktan herhangi bir reaksiyon tetiklemeden
    Depar atarsınız. Kuyruğunuzun tamamen yeniden büyümesi 1 gün sürer. Büyüyene kadar
    kuyruk silahsız saldırınızı kullanamazsınız ve Dengede Kalma testlerinde -2 durumsal
    ceza alırsınız.
  prerequisites:
  - text: Iruxi Teçhizatı (Kuyruk)
omen://feat/shinstabber?source=paizo-pathfinder-player-core-2:
  name: Kaval Kesen
  description: Küçük veya daha küçük boyutta olduğunuz sürece hareketinizi herhangi
    bir boyuttaki bir müttefikle aynı karede sonlandırabilirsiniz. Bu yeteneği veya
    benzer bir yeteneği kullanırken aynı alanı toplamda yalnızca iki yaratık paylaşabilir.
  prerequisites:
  - text: İç İçe Geçme
omen://feat/shooting-stars-stance?source=paizo-pathfinder-player-core-2:
  name: Kayan Yıldızlar Duruşu
  description: >
    Yıldırım hızıyla şuriken fırlatmanızı sağlayan bir duruşa geçersiniz. Bu duruştayken,
    normalde silahsız saldırı gerektiren keşiş hünerlerinizi veya keşiş yeteneklerinizi
    bunun yerine şuriken ile kullanabilirsiniz.
  prerequisites:
  - text: Manastır Silahları
omen://feat/signature-crafting?source=paizo-pathfinder-player-core-2:
  name: İmza Zanaatçılığı
  description: >
    Ürettiğiniz büyülü eşyalar el işçiliğinize özgü bir damga taşır. Kalıcı bir büyülü
    eşyayı Zanaat ile başarıyla ürettiğinizde, eşya tamamen bittiğinde bir düz test
    atın. Bir yaratığın bir eşya tuhaflığından kazandığı herhangi bir avantaj, yalnızca
    yaratık eşyayı taktığı (takılan bir eşya için) veya tuttuğu (elde tutulan bir
    eşya için) sürece geçerlidir. GM, listelenenlere benzer özel tuhaflıklara izin
    verebilir. d10 Tuhaflık Açıklama 1 Oynak Kullanılmadığında yerinde dans eder.
    2 Temiz Kirliliğe rağmen kusursuz kalır. 3 Çevresel Görünümü bulunduğu çevreye
    uyum sağlayacak şekilde değişir. 4 Pasaklı Üzerinde her zaman bir kir tabakası
    kalır. 5 Yüzen Düşürüldüğünde yavaşça alçalır. 6 Işıltılı Bir meşale kadar parlak
    bir ışıkla parıldar ve parlar. 7 Görünmez Eşya görünmezdir, ancak kullanıldıktan
    sonra 1 tur boyunca görünür hâle gelir. 8 Sadık Sanki bir iple bağlıymış gibi
    sahibinin 5 fiti içinde havada süzülür (ancak yine de başkası tarafından kapılabilir).
    9 Ruh hâli renkleşmesi Kullanıcının ruh hâli eşyanın rengini etkiler. 10 Becerikli
    Eşya bir tür beceri testine +1 eşya bonusu kazandırır.
  prerequisites:
  - text: Usta Zanaat
  - text: Büyülü Zanaatçılık
omen://feat/silencing-strike?source=paizo-pathfinder-player-core-2:
  name: Susturucu Saldırı
  description: Yüze veya ağza indirilen hızlı bir darbe rakibinizi susturur. Bir düşmana
    karşı yakın dövüş Vuruşu yapın. İsabet ederse, düşman sınıf ZD'nize karşı bir
    Dayanıklılık kurtarışta başarılı olmalıdır.
omen://feat/silent-step?source=paizo-pathfinder-player-core-2:
  name: Sessiz Adım
  description: Adım atarsınız, ardından Saklanır veya Sinsice Yaklaşırsınız. Normalde
    olduğu gibi Saklanma veya Sinsice Yaklaşma gereksinimlerini yine de karşılamanız
    gerekir.
omen://feat/skittering-sneak?source=paizo-pathfinder-player-core-2:
  name: Pıtırtılı Gizlenme
  description: Büyük bir hız ve gizlilikle siperden sipere sıkışır, sokulur ve pıtır
    pıtır ilerlersiniz. Sinsice Yaklaştığınızda tam Hızınıza kadar hareket edebilirsiniz.
omen://feat/sleeper-hold?source=paizo-pathfinder-player-core-2:
  name: Boğma Tutuşu
  description: Hedefinizin sinir sisteminin can alıcı noktalarını sıkarak işlev görme
    yeteneğini engellersiniz. Yaratığı Kavramak için olağan etkiler yerine aşağıdaki
    başarı ve kritik başarı etkileriyle bir Atletizm testi deneyin.
omen://feat/slippery-prey?source=paizo-pathfinder-player-core-2:
  name: Kaygan Av
  description: Bağlardan diğerlerinden daha kolay kaçabilirsiniz. Akrobasi veya Atletizm
    kullanarak Kaçmaya kalkıştığınızda, beceride eğitimliyseniz tekrarlanan girişimlerdeki
    çoklu saldırı cezasını -4 ve -8'e düşürürsünüz. Uygun beceride uzmansanız ceza
    -3 ve -6 olur. Beceride efsaneviyseniz, aynı sıra içindeki birden fazla Kaçma
    girişimi için ceza almazsınız. Eğitiminiz ne olursa olsun, Kaçma girişimleriniz
    yine de attack özelliğine sahiptir ve diğer eylemlerle birlikte çoklu saldırı
    cezasına tabidir.
  prerequisites:
  - text: Akrobasi veya Atletizmde eğitimli
omen://feat/snare-crafting?source=paizo-pathfinder-player-core-2:
  name: Kapan Yapımı
  description: Kapanlar oluşturmak için Zanaat aktivitesini kullanabilirsiniz. Bu
    hüneri seçtiğinizde formül defterinize dört yaygın 1. seviye kapan formülü eklersiniz.
  prerequisites:
  - text: Eğitimli Zanaat
omen://feat/snare-genius?source=paizo-pathfinder-player-core-2:
  name: Kapan Dâhisi
  description: >
    Kapanın üretilmesi normalde 1 dakika sürüyorsa, bunun yerine 3 Etkileşime Gir
    eylemiyle üretebilirsiniz. Her gün günlük hazırlıklarınız sırasında formül defterinizden
    hızlı kurulum için üç kapan hazırlayabilirsiniz (Zanaat becerisinde uzmansanız
    dört, efsaneviyseniz beş kapana çıkar). Bu şekilde hazırlanan kapanları üretmek
    size herhangi bir kaynağa mal olmaz. Bir yaratık ürettiğiniz ve kurduğunuz bir
    kapanın ilk etkisine karşı kurtarışta kritik başarısızlık elde ettiğinde ve hasar
    aldığında, o yaratık bir sonraki sırasının sonuna kadar Gafil kalır.
  prerequisites:
  - text: Uzman Zanaat
  - text: Kapan Yapımı
omen://feat/snare-setter?source=paizo-pathfinder-player-core-2:
  name: Kapan Kurucu
  description: Tuzak yapma konusundaki köklü kobold sanatında ustasınız. Zanaat becerisinde
    eğitimli yetkinlik kazanırsınız. Zanaat becerisinde zaten eğitimliyseniz, bunun
    yerine seçeceğiniz bir beceride eğitimli hâle gelirsiniz. Yaygın olmayan tüm kobold
    kapanlarına erişim kazanırsınız. Kapan Yapımı hünerini kazanırsınız; ancak o hüner
    için formüllerinizi seçerken yaygın kapanların yanı sıra yaygın olmayan kobold
    kapanları arasından da seçim yapabilirsiniz.
  prerequisites:
  - text: Eğitimli Zanaat
omen://feat/sneaky?source=paizo-pathfinder-player-core-2:
  name: Sinsi
  description: >
    Gizlilik, cephaneliğinizdeki önemli bir araçtır. Sinsice Yaklaş eylemini gerçekleştirdiğinizde
    Hızınıza kadar olmak üzere 5 fit daha uzağa hareket edebilirsiniz. Ek olarak,
    Sinsice Yaklaş eylemlerini kullanmaya devam ettiğiniz ve Gizlilik testinizde başarılı
    olduğunuz sürece, sıranızın sonunda siperiniz veya üstün siperiniz olduğu ya da
    Belirsiz olduğunuz müddetçe, Sinsice Yaklaş eyleminin sonunda siperiniz ya da
    üstün siperiniz olmasa ve Belirsiz olmasanız bile gözlemlenir hâle gelmezsiniz.
omen://feat/soaring-flight?source=paizo-pathfinder-player-core-2:
  name: Süzülen Uçuş
  description: Uçarsınız. Normalde uçma Hızınız yoksa bu hareket için 20 fitlik bir
    uçma Hızı kazanırsınız. Bu hareketin sonunda katı bir zeminde değilseniz düşersiniz.
  prerequisites:
  - text: gökdoğan tengu mirası
omen://feat/soaring-form?source=paizo-pathfinder-player-core-2:
  name: Süzülen Biçim
  description: Her zaman 20 fitlik bir uçma Hızına sahip olursunuz.
  prerequisites:
  - text: Süzülen Uçuş
omen://feat/solid-lead?source=paizo-pathfinder-player-core-2:
  name: Sağlam İpucu
  description: >
    Bazen vakanız daha küçük gizemlere bölünür, ancak siz asla büyük resmi gözden
    kaçırmazsınız. İpucunu Takip Et eylemini tekrar kullanmanız nedeniyle bir ipucunun
    konusundan vazgeçtiğinizde günde bir kez, peşini bıraktığınız ipucunu o gün için
    sağlam ipucunuz olarak belirleyebilirsiniz. Sağlam ipucunu takip etmeyi bırakmış
    olsanız bile, odaklanma özelliğine sahip tek bir eylem kullanarak istediğiniz
    sayıda sağlam ipucunuza geri dönebilirsiniz. Bunu yapmak, olağan olduğu üzere
    mevcut ipuçlarınızdan birini sonlandırır. Bir sonraki günlük hazırlıklarınız sırasında
    sağlam ipucunuzu koruyabilir veya kaldırabilirsiniz; kaldırmak o gün daha sonra
    yeni bir sağlam ipucu belirlemenize olanak tanır.
omen://feat/sow-rumor?source=paizo-pathfinder-player-core-2:
  name: Söylenti Yay
  description: Belirli bir konu hakkında doğru olabilecek veya olmayabilecek söylentiler
    yayarsınız. Söylentinizin konusu şu anda çelişkili herhangi bir söylentinin konusu
    değilse, bu işlem normalde Bilgi Toplamanızın alacağı süre kadar sürer (genellikle
    2 saat); bunun sonunda GM söylentiyi ne kadar iyi yaydığınızı görmek için belirlediği
    bir ZD'ye karşı gizli bir Aldatma testi atar. Söylentiniz konu hakkındaki mevcut
    söylentilerden herhangi biriyle örtüşüyorsa yayılması daha az zaman alır ve özellikle
    popüler ve çelişkili bir söylentinin önüne geçmeye çalışıyorsanız çok daha uzun
    sürer veya imkânsız olabilir. ZD de benzer şekilde söylentinizin ne kadar makul
    olduğuna bağlı olarak artar veya azalır. Örneğin, sevilen ve cömert belediye başkanının
    cani iblis tapıcılarından oluşan bir tarikatın lideri olduğuna dair bir söylenti
    yaymak daha zor olabilir.
  prerequisites:
  - text: Uzman Aldatma
omen://feat/spirit-soother?source=paizo-pathfinder-player-core-2:
  name: Ruh Yatıştırıcı
  description: Huzursuz ruhların küçük seslerine ve hislerine uyumlusunuz. Arama yapmıyor
    olsanız bile, normalde Arama yapmanızı gerektiren musallatları bulmak için bir
    test deneyebilirsiniz. Musallatı bulmak için diğer tüm gereksinimleri yine de
    karşılamanız gerekir. Musallatları etkisiz hale getirme testlerine +1 durumsal
    bonus kazanırsınız.
omen://feat/spirits-interference?source=paizo-pathfinder-player-core-2:
  name: Ruhların Müdahalesi
  description: Menzilli saldırıları savuşturmak için koruyucu ruhları çağırırsınız.
    Öfkeniz sona erene kadar, size karşı menzilli bir vuruş yapan herkes bir düz testte
    başarılı olmalıdır, aksi takdirde saldırı hiçbir etki olmaksızın ıskalar.
  prerequisites:
  - text: ruh içgüdüsü
omen://feat/spirits-wrath?source=paizo-pathfinder-player-core-2:
  name: Ruhun Gazabı
  description: Genellikle bir atanın veya bir doğa ruhunun hayaleti olan ve bir irap
    (wisp) biçimini alan fani bir ruh çağırırsınız. İrap, sizden 120 fit içindeki
    bir düşmana karşı yakın dövüş irap atılışı silahsız saldırısı yapar. İrapın saldırı
    değiştiricisi, askeri silahlar için yetkinlik bonusunuz artı Kuvvet değiştiriciniz
    artı +2 eşya bonusuna eşittir ve sahip olduğunuz durumsal ve statü bonuslarını
    ve cezalarını aynen uygular. İsabet durumunda irap, 4d8 artı Dayanıklılık değiştiricinize
    eşit ruh hasarı verir. Öfke hasarınızı veya silah uzmanlaşması hasarınızı uygulamayın;
    ancak irapın hasarını da etkileyecek olan durumsal ve statü bonusları ile cezaları
    geçerlidir. Kritik vuruşta irap iki kat hasar verir ve hedef Korkmuş 1 olur. Bu
    saldırı, saldıran sizmişsiniz gibi çoklu saldırı cezanızı kullanır ve buna sayılır.
  prerequisites:
  - text: ruh içgüdüsü
omen://feat/spiritual-guides?source=paizo-pathfinder-player-core-2:
  name: Ruhani Rehberler
  description: Kimse onları görmese ve yalnızca siz onları duyabilseniz de etrafınızdaki
    ruhlar, siz öfkelenmediğiniz sürece sürekli gevezelik ederler. Bazen faydalı bile
    olurlar ve rehberlikleri öfkenizin sisini bile yarabilir. İkinci sonuç daha kötü
    olsa bile onu kullanarak tetikleyici testi yeniden atın.
  prerequisites:
  - text: ruh içgüdüsü
omen://feat/springing-leaper?source=paizo-pathfinder-player-core-2:
  name: Yay Gibi Sıçrayan
  description: Güçlü bacaklarınız ani ve çarpıcı sıçramalar yapmanızı sağlar. Dikey
    olarak Sıçrayabileceğiniz mesafeyi iki katına çıkarmak için 2 eylemlik bir aktivite
    olarak Sıçrayabilir veya dikey olarak Sıçrayabileceğiniz mesafeyi üç katına çıkarmak
    için 3 eylemlik bir aktivite olarak Sıçrayabilirsiniz. Deparınızdan farklı bir
    yöne atladığınız için Uzun Atlamada otomatik olarak başarısız olmazsınız.
  prerequisites:
  - text: Uzman Atletizm
omen://feat/squad-tactics?source=paizo-pathfinder-player-core-2:
  name: Müfreze Taktikleri
  description: Bir düşmanı kuşatmak için müttefiklerinizle birlikte çalışmakta ustasınız.
    Bir düşman sizin ve en az iki müttefikinizin erişimi içindeyse, o düşman size
    karşı Gafildir.
omen://feat/squawk?source=paizo-pathfinder-player-core-2:
  name: Gakla!
  description: Sosyal bir hatayı veya gafı örtbas etmek için garip bir gaklama sesi
    çıkarır, tüylerinizi kabartır veya kuş benzeri başka bir tiki taklit edersiniz.
    Tetikleyici testte kritik başarısızlık yerine başarısızlık elde edersiniz. Gaklamanıza
    tanık olan tüm yaratıklar 24 saat boyunca geçici olarak bağışık kalır.
omen://feat/stand-still?source=paizo-pathfinder-player-core-2:
  name: Kımıldama
  description: Düşmanınız kaçmaya çalıştığında saldırırsınız. Tetikleyici yaratığa
    karşı yakın dövüş Vuruşu yapın. Vuruş kritik vuruşsa ve tetikleyici bir hareket
    eylemi idiyse, o eylemi bozarsınız.
omen://feat/stone-face?source=paizo-pathfinder-player-core-2:
  name: Taş Yüz
  description: Korku karşısında bile sükûnet sanatında ustalaştınız. Korku özelliğine
    sahip etkilere karşı kurtarışlara +1 durumsal bonus ve Gözdağı Ver gibi Gözdağı
    beceri eylemlerine karşı İrade ZD'nize +2 durumsal bonus kazanırsınız.
omen://feat/storms-lash?source=paizo-pathfinder-player-core-2:
  name: Fırtına Kırbacı
  description: Rüzgâr ve yıldırım sizin için her zaman dost olmuştur. Elektrik Arkı
    kantripini istediğiniz zaman bir ilkel özgü büyü olarak yapabilirsiniz. Bir kantrip,
    seviyenizin yukarı yuvarlanmış yarısına eşit bir büyü derecesine yükseltilir.
omen://feat/strategic-assessment?source=paizo-pathfinder-player-core-2:
  name: Stratejik Değerlendirme
  description: >
    Düşmanlarınızın hareketlerini izleyerek onların güçlü ve zayıf yönlerini öğrenirsiniz.
    Strateji Geliştirme nedeniyle saldırı zarınızı değiştirdiğiniz bir Vuruş ile bir
    yaratığa isabet ettirdiğinizde GM, düşman hakkında size söylemek üzere aşağıdaki
    bilgilerden birini seçer: • Düşmanın en yüksek zaafı hangisi • Düşmanın en yüksek
    direnci hangisi • Düşmanın en düşük kurtarış hangisi • Düşmanın sahip olduğu bir
    bağışıklık GM bilinçli olarak veya rastgele seçim yapabilir, ancak geçerli olmayan
    bir bilgiyi seçemez (bağışıklığı olmayan bir düşman için bağışıklık seçmek gibi).
    Bu kural, belirli bir yaratığa ilk kez isabet ettirdiğinizde geçerlidir.
omen://feat/strategic-bypass?source=paizo-pathfinder-player-core-2:
  name: Stratejik Baypas
  description: Planlarınız düşmanlarınızın dirençlerini hesaba katarak etkili bir
    darbe indirmenizi sağlar. Strateji Geliştirme nedeniyle saldırı zarınızı değiştirdiğiniz
    bir Vuruş ile isabet sağladığınızda, saldırınıza karşı geçerli olan her bir direnç
    için Zekâ değiştiricinize eşit miktarda direnci yok sayarsınız.
omen://feat/straveika?source=paizo-pathfinder-player-core-2:
  name: Straveika
  description: Gerçek anlamda kadim vampirlerden birinin, sonsuz yaşamla ama sonsuz
    gençlikle değil lanetlenmiş bir nosferatunun soyundan geliyorsunuz. İnsanlar size
    straveika veya kadim doğumlu der. Atanızın hâkimiyet güçlerinin kalıntıları, bir
    yaratığın niyetlerinin davranışlarını nasıl değiştirdiğini anlamanızı sağlamıştır.
    Niyetini Tartmak için yapılan Dikkat testlerine ve size Yalan Söyleme girişimlerine
    karşı Dikkat ZD'nize +1 durumsal bonus kazanırsınız.
omen://feat/stumbling-feint?source=paizo-pathfinder-player-core-2:
  name: Tökezleten Yanıltma
  description: >
    Zayıf bir hamle gibi görünen kafa karıştırıcı bir vuruş yaparsınız, ancak bu hamle
    gafil avlanan düşmanınızın üzerine tehlikeli bir darbe yaylımı salmanıza olanak
    tanır. Darbe Yaylımı kullandığınızda, ilk Vuruştan hemen önce serbest bir eylem
    olarak Yanıltıcı Hamle testi deneyebilirsiniz. Başarı durumunda, hedefi bir sonraki
    saldırınıza karşı Gafil bırakmak yerine, Darbe Yaylımı'ndan gelen her iki saldırıya
    karşı da Gafil kalır.
  prerequisites:
  - text: Uzman Aldatma
  - text: Tökezleme Duruşu
omen://feat/stumbling-finisher?source=paizo-pathfinder-player-core-2:
  name: Tökezleten Bitirici Hamle
  description: Dövüş yeteneğinizin mükemmel sergilenişi rakibinizi geriye tökezletir.
    Bir Vuruş Yapın. İsabet ederseniz hedef 5 fit geriye itilir (kritik vuruşta 10
    fit).
omen://feat/stumbling-stance?source=paizo-pathfinder-player-core-2:
  name: Tökezleme Duruşu
  description: >
    Sarhoşların hareketlerini taklit eden, görünüşte odaklanmamış bir duruşa geçersiniz;
    sallanır, kıvrılır, sahte açıklar verir ve düşmanlarınızın dikkatini gerçek hareketlerinizden
    uzaklaştırırsınız. Bu duruştayken, Yanıltıcı Hamle yapmak için Aldatma testlerine
    +1 durumsal bonus kazanırsınız. Yapabileceğiniz tek Vuruşlar tökezleyen savuruş
    silahsız saldırılarıdır. Bunlar 1d8 ezici hasar verir; brawling grubundadır; ve
    çevik, gafil vuran, ustalık, öldürücü olmayan ile silahsız özelliklerine sahiptir.
    Bir düşman bu duruştayken size yakın dövüş Vuruşuyla isabet ederse, bir sonraki
    sıranızın sonundan önce ona karşı yapacağınız bir sonraki tökezleyen savuruş Vuruşuna
    karşı Gafil hâle gelir.
  prerequisites:
  - text: Eğitimli Aldatma
omen://feat/stunning-blows?source=paizo-pathfinder-player-core-2:
  name: Sersemletici Darbeler
  description: Yaylımınızın odaklanmış gücü rakibinizi ezmekle tehdit eder. Darbe
    Yaylımı'nızdaki iki Vuruşla aynı yaratığı hedef aldığınızda yaratığı sersemletmeyi
    deneyebilirsiniz. Vuruşlardan biri isabet eder ve hasar verirse, hedef sınıf ZD'nize
    karşı bir Dayanıklılık kurtarışta başarılı olmalı ya da Sersemlemiş 1 (kritik
    başarısızlıkta Sersemlemiş 3) olmalıdır. Bu bir incapacitation etkisidir.
  prerequisites:
  - text: Darbe Yaylımı
omen://feat/stunning-finisher?source=paizo-pathfinder-player-core-2:
  name: Sersemletici Bitirici Hamle
  description: Sersemletici bir darbe denersiniz. Bir yakın dövüş Vuruşu yapın. İsabet
    ederseniz, düşmanınız aşağıdaki sonuçlarla sınıf ZD'nize karşı bir Dayanıklılık
    kurtarış denemelidir; kurtarış incapacitation özelliğine sahiptir.
omen://feat/sunder-enchantment?source=paizo-pathfinder-player-core-2:
  name: Efsunu Parçala
  description: Kendi başına var olan büyüleri ve yaratıklar üzerinde aktif olanları
    yok etmenin yanı sıra, bir eşyanın büyüsünü bozmak için de hurafenize odaklanabilirsiniz.
    Büyüyü Parçala kullandığınızda bunun yerine sahipsiz bir büyülü eşyayı veya hedefinizin
    büyülü eşyalarından birini etkisiz kılmayı deneyebilirsiniz. Etkisiz kılma girişiminiz
    başarılı olursa, eşya 10 dakika boyunca kendi türünden sıradan bir eşya hâline
    gelir. Bir kutsal emaneti, zeki bir eşyayı veya benzer şekilde özellikle güçlü
    bir eşyayı hedef alırsanız etkisiz kılma girişiminiz otomatik olarak başarısız
    olur.
  prerequisites:
  - text: Büyüyü Parçala
omen://feat/sunder-spell?source=paizo-pathfinder-player-core-2:
  name: Büyüyü Parçala
  description: >
    Bir büyüyü yok etmek için batıl inanç öfkenizden yararlanırsınız. Bir yaratığa,
    nesneye veya bir büyü tezahürüne (Ateş Duvarı ile oluşturulan duvar veya Ruhani
    Muhafız'dan gelen koruyucu gibi) karşı bir silah veya silahsız saldırı ile yakın
    dövüş Vuruşu yapın. Listelenmiş bir SD'si olmayan bir şeyi hedefliyorsanız, bu
    Vuruşa karşı SD'si bir duvar gibi vurulması çok kolay hedefler için genellikle
    10'dur veya GM tarafından belirlenen farklı bir SD'dir. Vuruşunuz isabet ederse
    hedef üzerindeki tek bir büyüyü veya büyülü etkiyi etkisiz kılmayı deneyebilirsiniz.
    Bu girişim için etkisiz kılma dereceniz, seviyenizin yukarı yuvarlanmış yarısına
    eşittir ve etkisiz kılma testi için saldırı zarınızın sonucunu kullanırsınız.
    Vuruşunuzda başarılı olun veya olmayın hedef, 24 saat boyunca Büyüyü Parçala hünerinize
    karşı geçici olarak bağışık kalır.
  prerequisites:
  - text: hurafe içgüdüsü
omen://feat/supernatural-senses?source=paizo-pathfinder-player-core-2:
  name: Doğaüstü Duyular
  description: Koku duyunuz doğaüstü derecede keskindir ve görüşünüz bozulduğunda
    size yol göstermesi için koku duyunuza her zaman güvenebilirsiniz. Öfkeliyken
    Belirsiz veya Gizlenmiş bir rakibi hedef aldığınızda düz testin ZD'sini Belirsiz
    bir hedef için 3'e, Gizlenmiş bir hedef için 9'a düşürürsünüz.
  prerequisites:
  - text: Keskin Koku Alma veya koku alma
omen://feat/supertaster?source=paizo-pathfinder-player-core-2:
  name: Hassas Damak
  description: >
    Damağınızı geliştirdiniz ve yiyecek ve içeceklerin lezzet ve dokusundaki anormallikleri
    tespit edebilen keskin bir tat alma duyusuna sahipsiniz. Bir yemek yerken veya
    bir içecek içerken malzemeleri otomatik olarak belirlemeye çalışırsınız; bu da
    zehirler gibi değişikliklerin veya katkı maddelerinin varlığı konusunda sizi uyarabilir.
    GM zehrin seviyesine göre belirlenen bir ZD'ye karşı gizli bir Dikkat testi atar;
    yiyecek veya içecek zehirliyse, bir başarı durumunda yiyecek veya içeceğin zehirli
    olduğunu öğrenirsiniz ancak kullanılan belirli zehri öğrenemezsiniz. Yiyecek veya
    içeceğin zehirli olduğunu başarıyla tespit ederseniz, o zehre maruz kalmamak için
    yiyeceği veya içeceği zamanında tükürebilirsiniz (zehirli yiyecek veya içeceği
    tüketmeye devam etmediğiniz sürece). İnceleme yaparken veya bir şeyi tanımlamak
    için Bilgi Hatırlamaya çalışırken bir şeyi yalar veya tadarsanız ve tat almak
    (GM'nin takdirine bağlı olarak) ilgili ek bilgiler sağlayacaksa, testinize +2
    durumsal bonus kazanırsınız.
  prerequisites:
  - text: Usta Dikkat
omen://feat/surgical-shock?source=paizo-pathfinder-player-core-2:
  name: Cerrahi Şok
  description: Yumruğunuzla veya silahınızla iyi yerleştirilmiş birkaç dürtüşle rakibinizi
    şaşkına çevirir veya hantal hâle getirirsiniz. Erişiminiz içindeki bir hedefin
    Dayanıklılık ZD'sine karşı bir Tıp testi deneyin. Testinizin sonucu uyguladığınız
    durumun şiddetini belirler.
  prerequisites:
  - text: adli tıp metodolojisi
omen://feat/suspect-of-opportunity?source=paizo-pathfinder-player-core-2:
  name: Fırsat Şüphelisi
  description: Bazen soruşturmanızı sona erdirmek için gönderilen bir pusu gibi bir
    durum beklenmedik şekilde vakanıza müdahale eder. Tetikleyici yaratığa karşı Şüpheli
    Şahıs hünerini kullanırsınız. Bu, Şüpheli Şahıs'ı normalden daha sık kullanmanıza
    izin vermez.
  prerequisites:
  - text: Şüpheli Şahıs
omen://feat/svetocher?source=paizo-pathfinder-player-core-2:
  name: Svetocher
  description: En yaygın vampirler olan moroilerden birinden doğdunuz ve onların doğaüstü
    metanetini ve ikna gücünü paylaşıyorsunuz. İçi Çekilmiş durumuna sahip olduğunuzda,
    Dayanıklılık kurtarışlarıza uygulanan cezayı ve Can Puanı kaybınızı durum değeri
    1 daha düşükmüş gibi hesaplarsınız. Diplomasi becerisinde eğitimlisiniz. Onda
    otomatik olarak eğitimli olursanız, bunun yerine seçeceğiniz bir beceride eğitimli
    hâle gelirsiniz.
omen://feat/swaggering-initiative?source=paizo-pathfinder-player-core-2:
  name: Çalımlı İnisiyatif
  description: Her kavgaya çalımla girersiniz. İnisiyatif zarınıza +2 durumsal bonus
    kazanırsınız ve bir silah çekmek için Etkileşime Girebilirsiniz. Savaşta ilk hareket
    eden siz olursanız Fiyaka kazanırsınız.
omen://feat/swift-river?source=paizo-pathfinder-player-core-2:
  name: Hızlı Nehir
  description: Tüm kısıtlamalardan kaçınarak su gibi akarsınız. Hızınıza yönelik bir
    statü cezasını sonlandırın veya sizi etkileyen bir hareketsiz ya da yavaşlamış
    durumunu sonlandırın.
omen://feat/swift-swimmer?source=paizo-pathfinder-player-core-2:
  name: Çevik Yüzücü
  description: 15 fitlik bir yüzme Hızı kazanırsınız.
omen://feat/switcheroo?source=paizo-pathfinder-player-core-2:
  name: Ters Köşe
  description: Saldırıdan kaçınmak için bitişiğinizdeki bir düşmanla ustaca yer değiştirmeye
    çalışırsınız. Bitişikteki bir düşmanı seçin ve onu Yerinden Oynatmayı deneyin.
    Yerinden Oynat'ın normal sonuçları yerine aşağıdakileri kullanın.
omen://feat/symphony-of-blood?source=paizo-pathfinder-player-core-2:
  name: Kan Senfonisi
  description: Size zindelik vermesi için düşmanlarınızın kanını çağırırsınız. Günde
    bir kez 7. derece ilahi özgü büyü olarak Vampirik Kan Emme yapabilirsiniz.
omen://feat/takedown-expert?source=paizo-pathfinder-player-core-2:
  name: İndirme Uzmanı
  description: Yakına girmenizi ve failleri canlı ele geçirmenizi sağlayan dövüş uygulamalarında
    ustalaştınız. Olağan silahlara ek olarak bir elinizde sopa grubundan bir silah
    (sopa veya asa gibi) kullanıyorsanız saldırı stratejisi için saldırı zarlarında
    Zekâ değiştiricinizi kullanabilirsiniz ve bu Vuruşlar stratejik saldırınız için
    uygundur. Ek olarak, normal -2 cezasını almadan Vuruşlarınızın herhangi birini
    öldürücü olmayan yapabilirsiniz.
omen://feat/tangle-of-battle?source=paizo-pathfinder-player-core-2:
  name: Savaş Kargaşası
  description: Hırçın darbeniz düşmanınızı daha yakına çeker ve size onu yakalama
    fırsatı verir. Tetikleyici düşmanı Kavramayı deneyin.
omen://feat/tangled-forest-rake?source=paizo-pathfinder-player-core-2:
  name: Dolaşık Orman Tırmığı
  description: Düşmanları tırmıklayan saldırılarla yerinden oynatırsınız. Kırbaç dal
    Vuruşu yapın. İsabet eder ve hasar verirseniz, hedefi 10 fite kadar Yerinden Oynatabilirsiniz.
    Bu hareket sırasında hedefi kendi alanınızdan geçirebilirsiniz.
  prerequisites:
  - text: Dolaşık Orman Duruşu
omen://feat/tangled-forest-stance?source=paizo-pathfinder-player-core-2:
  name: Dolaşık Orman Duruşu
  description: >
    Düşmanlarınızın hareketlerine engel olmak için kollarınızı budaklı dallar gibi
    uzatırsınız. Kırbaç dal silahsız saldırıları yapabilirsiniz. Bunlar 1d8 kesici
    hasar verir; brawling grubundadır; ve çevik, ustalık, öldürücü olmayan ile silahsız
    özelliklerine sahiptir. Dolaşık Orman Duruşu'ndayken ve hareket edebiliyorken,
    erişiminiz içinde sizden uzaklaşmaya çalışan her düşman, sınıf ZD'nize karşı bir
    Refleks kurtarışta, Akrobasi testinde veya Atletizm testinde başarılı olmalı ya
    da o eylem için Hareketsiz kalmalıdır. Tercih ederseniz düşmanın hareket etmesine
    izin verebilirsiniz.
omen://feat/targeting-finisher?source=paizo-pathfinder-player-core-2:
  name: Hedef Alan Bitirici Hamle
  description: >
    Saldırınız düşmanınıza zarar verir ve onu engeller. Aşağıdaki listeden düşmanınızın
    belirli bir bölümünü seçin ve Vuruş Yapın. Hedefe isabet edip hasar verirseniz,
    seçilen bölüme karşılık gelen etkiyi uygulayın. Bu engel bir sonraki sıranızın
    sonuna kadar sürer. Kritik vuruşta ayrıca 1 dakika süren daha küçük bir etki uygularsınız:
    • Kol (veya dokunaç gibi saldırılar için kullanılan başka bir uzuv) Hedef Güçten
    Düşmüş 2 olur. Kritik vuruşta ayrıca 1 dakika boyunca Güçten Düşmüş 1 olur. •
    Kafa Hedef Zihni Uyuşmuş 2 olur. Kritik vuruşta ayrıca 1 dakika boyunca Zihni
    Uyuşmuş 1 olur. • Bacaklar Hedef, Hızlarına -10 fit statü cezası alır. Kritik
    vuruşta ayrıca 1 dakika boyunca Hızlarına -5 fit statü cezası alır.
omen://feat/ten-lives?source=paizo-pathfinder-player-core-2:
  name: On Canlı
  description: Karakteriniz ölecek olduğunda bir düz test deneyebilirsiniz. Başarı
    durumunda, bunun yerine 0 CP'ye ve normalde sizi öldürecek olandan 1 daha az bir
    Ölmekte değerine (genellikle ölmekte 3) düşersiniz. Bu, etkilenen başka hiçbir
    yaratık için sonucu değiştirmez.
  prerequisites:
  - text: Kaderden Kaçın
omen://feat/tenacious-net?source=paizo-pathfinder-player-core-2:
  name: Sağlam Ağ
  description: Ağlarınızdan kaçmak basit bir iş değildir. Ağlarınızı Zorla Açmak veya
    onlardan Kaçmak için gereken Atletizm ZD'si 16'dan 18'e çıkar. Ağla Yakaladığınız
    bir yaratık Kaçtıktan veya ağı Zorla Açtıktan sonra ağın sarkan ipleri yaratığa
    takılı kalarak bir sonraki sırasının başlangıcına kadar Gafil kalmasına neden
    olur.
omen://feat/tengu-lore?source=paizo-pathfinder-player-core-2:
  name: Tengu İlimi
  description: >
    Halkınızın dağıldığı yerde hayatta kalmak için gereken becerileri öğrendiniz.
    Sosyoloji ve Hayatta Kalma becerilerinde eğitimli yetkinlik derecesi kazanırsınız.
    Bu becerilerden birinde otomatik olarak eğitimli olursanız (örneğin geçmişinizden
    veya sınıfınızdan), bunun yerine seçeceğiniz bir beceride eğitimli hâle gelirsiniz.
    Ayrıca Tengu İlimi için Ek İlim genel hünerini kazanırsınız.
omen://feat/tengu-weapon-familiarity?source=paizo-pathfinder-player-core-2:
  name: Tengu Silah Aşinalığı
  description: >
    Tengu özelliğine sahip tüm yaygın olmayan silahların yanı sıra katana, khakkara,
    tapınak kılıcı ve wakizashi'ye erişim kazanırsınız. Bu silahlara aşinalığınız
    vardır; yetkinlik amacıyla bunlardan askeri silah olanları basit silahlar, ileri
    silah olanları ise askeri silahlar olarak değerlendirirsiniz. Günlük hazırlıklarınız
    sırasında sahip olduğunuz kılıç grubundan bir silahla pratik yapabilirsiniz. O
    silaha karşı da aşinalık kazanırsınız. Bu, aynı şekilde farklı bir kılıçla pratik
    yapana kadar sürer. 5. seviyede, bu silahlardan biriyle her kritik vuruş yaptığınızda
    kritik uzmanlaşma etkisini elde edersiniz.
omen://feat/terrain-advantage?source=paizo-pathfinder-player-core-2:
  name: Arazi Avantajı
  description: Zorlu arazide bulunan kertenkelesoy harici yaratıklar size karşı Gafildir.
    Yüzme Hızınız varsa, suda bulunan ve yüzme Hızı olmayan kertenkelesoy harici yaratıklar
    da size karşı Gafildir.
omen://feat/terrifying-croak?source=paizo-pathfinder-player-core-2:
  name: Korkutucu Vıraklama
  description: Etrafınızdakilere korkularını hatırlatan tüyler ürpertici bir vıraklama
    salarsınız. 30 fit içindeki bir yaratığın Gözdağı Vermek için bir Gözdağı testi
    deneyin; bir dil konuşmadığınız için bu teste ceza almazsınız. Test başarılı olursa,
    hedef 1 tur boyunca korkmuş durum değerini 1'in altına düşüremez.
  prerequisites:
  - text: Eğitimli Gözdağı
omen://feat/terrifying-howl?source=paizo-pathfinder-player-core-2:
  name: Korkunç Uluma
  description: Korkunç bir uluma salarsınız. 30 fit içindeki her düşmanın Gözdağı
    Vermek için Gözdağı testleri deneyin; yaratık sizin dilinizi anlamıyorsa ceza
    almazsınız. Testlerinizin sonuçlarına bakılmaksızın her hedef daha sonra 1 dakika
    boyunca Korkunç Uluma'ya karşı geçici olarak bağışık kalır.
omen://feat/terrifying-resistance?source=paizo-pathfinder-player-core-2:
  name: Korkutucu Direnç
  description: Gözdağı Verdiğiniz kişilerin büyüleri üzerinizde daha az etkilidir.
    Bir yaratığın Gözdağı Vermekte başarılı olursanız, sonraki 24 saat boyunca o yaratığın
    büyüleriyle yapılan kurtarışlara +1 durumsal bonus kazanırsınız.
  prerequisites:
  - text: Uzman Gözdağı
omen://feat/thats-odd?source=paizo-pathfinder-player-core-2:
  name: Bu İşte Bir Tuhaflık Var
  description: >
    Oda veya koridor gibi yeni bir mekâna girdiğinizde, olağandışı tek bir şeyi hemen
    fark edersiniz. Bir test yapmadan veya özel olarak aramadan kolayca fark edilebilecek
    bariz ipuçlarını atlayarak bunun ne olduğunu veya mantıklı hiçbir şeyin bulunup
    bulunmadığını GM belirler. Yalnızca bir alanın veya nesnenin şüpheli olduğunu
    öğrenirsiniz, ancak neden şüpheli olduğunu öğrenemezsiniz. Örneğin, yerde büyük
    bir kan lekesi olan bir çalışma odasına girdiyseniz kan lekesi o kadar bariz bir
    şekilde şüphelidir ki sizin için zaten aşikârdır; bu nedenle GM bunun yerine masa
    çekmecesinde şüpheli bir şey olduğunu belirtebilir. Daha sonra neyin olağandışı
    olduğunu bulmak için çekmeceyi daha ayrıntılı incelemeniz gerekir. İsterseniz
    10 dakikadan daha kısa bir süre önce bir İpucunu Takip Etmiş olsanız bile bu ayrıntıyla
    ilgili bir İpucunu Takip Edebilirsiniz. Bu İşte Bir Tuhaflık Var, yaratıkların
    şüpheli olup olmadığını ortaya çıkarmaz. Bir yerden ayrılıp geri döndüğünüzde
    normalde herhangi bir avantaj elde etmezsiniz; ancak orada büyük bir değişiklik
    olmuşsa ve zaman geçmişse GM elde edebileceğinizi belirleyebilir.
omen://feat/the-bigger-they-are?source=paizo-pathfinder-player-core-2:
  name: Ne Kadar Büyük Olurlarsa
  description: Pervasız bir hızla, daha savunmasız bir nokta bulmak için bir yaratığın
    etrafında atılır, sıçrar ve savrulursunuz. Aşağıdaki etkileri kullanarak sizden
    en az bir boy kategorisi daha büyük bir yaratığın Sıyrılıp Geçmeyi deneyin.
omen://feat/thorough-research?source=paizo-pathfinder-player-core-2:
  name: Kapsamlı Araştırma
  description: İlgi alanlarınızda kapsamlı bir bilgiye sahipsinizdir. Bir Bilgi Hatırla
    testinde başarılı olduğunuzda ek bilgi veya bağlam kazanırsınız. Bilgi Hatırlamak
    için yapılan bir testte kritik başarı elde ettiğinizde ek bilgi veya bağlam kazanırsınız
    ya da ek bir takip sorusu sorabilirsiniz (hangisi olduğunu GM seçer).
omen://feat/thorough-search?source=paizo-pathfinder-player-core-2:
  name: Kapsamlı Arama
  description: Her şeyi bulduğunuzdan emin olmak için ararken acele etmezsiniz. Arama
    yaparken aramak için iki kat daha uzun süre harcayabilirsiniz. Normalde bu, her
    şeyi kontrol etmek için Hızınızın dörtte birine kadar (dakikada en fazla 150 fit)
    veya bir alana girmeden önce her şeyi kontrol etmek için dakikada 75 fit hızla
    Arama yaptığınız anlamına gelir. Bunu yaparsanız ve GM bir şeyi fark etmeniz için
    gizli Tara testinizi atarsa, o Dikkat testine +2 durumsal bonus kazanırsınız ve
    başarı elde ederseniz bunun yerine kritik başarı elde edersiniz.
  prerequisites:
  - text: Uzman Dikkat
omen://feat/thrash?source=paizo-pathfinder-player-core-2:
  name: Hırpala
  description: Düşmanınızı sağa sola hırpalarsınız. Yakaladığınız veya kısıtladığınız
    bir düşman Kuvvet değiştiriciniz artı silah uzmanlaşması hasarınız artı Öfke hasarınıza
    eşit ezici hasar alır (sınıf ZD'nize karşı temel Dayanıklılık kurtarış ile).
omen://feat/thunder-gods-fan?source=paizo-pathfinder-player-core-2:
  name: Gök Gürültüsü Tanrısının Yelpazesi
  description: Yelpazeniz fırtınanın gazabını serbest bırakır. Yelpazeyi Salla aktivasyonunu
    günde bir ek kez kullanabilirsiniz. Yelpazenizde bulunan büyülere 5. derece bir
    Şimşek Oku büyüsü ekleyin.
  prerequisites:
  - text: Tengu Tüy Yelpazesi
omen://feat/tiger-slash?source=paizo-pathfinder-player-core-2:
  name: Kaplan Darbesi
  description: >
    İki elinizle vahşi bir savuruş yaparsınız. Bir kaplan pençesi Vuruşu yapın. İki
    ilave silah hasar zarı verir (14. seviye veya daha yüksekteyseniz üç ilave zar)
    ve hedefi başarıyla İtmişsiniz gibi 5 fit uzağa itebilirsiniz. Saldırı kritik
    başarıysa ve hasar verirse, kaplan pençenizden gelen süren kanama hasarına Kuvvet
    değiştiricinizi ekleyin.
  prerequisites:
  - text: Kaplan Duruşu
omen://feat/tiger-stance?source=paizo-pathfinder-player-core-2:
  name: Kaplan Duruşu
  description: >
    Bir kaplanın duruşuna geçersiniz ve kaplan pençesi saldırıları yapabilirsiniz.
    Bunlar 1d8 kesici hasar verir; brawling grubundadır; ve çevik, ustalık, öldürücü
    olmayan ile silahsız özelliklerine sahiptir. Kaplan pençelerinizle kritik bir
    başarıda hasar verirseniz hedef 1d4 süren kanama hasarı alır. Kaplan Duruşu'ndayken
    Hızınız en az 20 fit olduğu sürece 10 fit Adım atabilirsiniz.
omen://feat/tinkering-fingers?source=paizo-pathfinder-player-core-2:
  name: Kurcalayan Parmaklar
  description: Zanaat becerisinde eğitimlisiniz. Başka bir kaynaktan (örneğin geçmişinizden
    veya sınıfınızdan) Zanaat becerisinde zaten eğitimliyseniz, bunun yerine seçeceğiniz
    bir beceride eğitimli hâle gelirsiniz. Elinizdeki malzemelerden aletler uydurarak
    -2 durumsal cezasını almadan bir tamir takımı kullanmaksızın bir eşyayı Onarabilirsiniz.
    Bir tamir takımınız olduğunda bir eşyayı Onarmak için yapılan Zanaat testlerine
    +1 durumsal bonus kazanırsınız.
omen://feat/titans-stature?source=paizo-pathfinder-player-core-2:
  name: Titan Cüssesi
  description: Daha da büyük bir boyuta ulaşırsınız. Dev Cüssesi kullanırken bunun
    yerine Kocaman olabilirsiniz (Orta veya daha küçük boyuttaysanız erişiminizi 10
    fit artırır).
  prerequisites:
  - text: Dev Cüssesi
omen://feat/tongue-tether?source=paizo-pathfinder-player-core-2:
  name: Dil Bağı
  description: Diliniz, elleriniz kadar kolay bir şekilde anlık olarak kenetlenebilir.
    Ağzınızı serbestçe açabildiğiniz sürece Silahsız Bırakmak, Kenara Tutunmak, Yerinden
    Oynatmak veya Çelme Takmak için serbest ellere ihtiyacınız yoktur. Uzun Dil hünerine
    sahipseniz normal erişiminizin 5 fit ötesindeki bir mesafede dilinizle Silahsız
    Bırakabilir, Kenara Tutunabilir, Yerinden Oynatabilir ve Çelme Takabilirsiniz.
  prerequisites:
  - text: şaklayan dilli tripkee
omen://feat/traditional-resistances?source=paizo-pathfinder-player-core-2:
  name: Geleneksel Dirençler
  description: Kanınız nedeniyle belirli büyü türlerine karşı bir miktar direnciniz
    vardır. Soyunuzla aynı gelenekten gelen büyülere ve diğer büyülü etkilere karşı
    SD'nize ve kurtarışlarıza +1 statü bonusu kazanırsınız. Bu bonus uyku ve felç
    etkilerine karşı +2'ye çıkar.
  prerequisites:
  - text: Mistik Ejderkanı, İlahi Ejderkan, Okült Ejderkan veya Doğa Ejderkanı
omen://feat/triangle-shot?source=paizo-pathfinder-player-core-2:
  name: Üçgen Atışı
  description: Yayınıza üç ok takar ve hepsini birden ateşlersiniz. Gerekli silahla
    tek bir hedefe karşı her biri mevcut çoklu saldırı cezanızı kullanan üç menzilli
    Vuruş Yapın ve ilave –2 ceza alırsınız. Bu, çoklu saldırı cezanızı hesaplarken
    iki saldırı sayılır ve dirençler ile zaaflar açısından saldırıların hasarını birleştirirsiniz.
    Sersemletici Darbeler avantajınız, bir Darbe Yaylımı olmasa bile Üçgen Atışı için
    geçerlidir. Üç Vuruş da isabet ederse hedef 3d6[persistent,bleed] hasar alır.
  prerequisites:
  - text: Manastır Okçusu Duruşu
  - text: Sersemletici Darbeler
omen://feat/trickster-tengu?source=paizo-pathfinder-player-core-2:
  name: Düzenbaz Tengu
  description: Hoşnutsuzluğunuzu ifade etmek için kendinizi veya başkalarının bedenlerini
    dönüştürebilirsiniz. Günde bir kez, 7. derece bir ilkel özgü büyü olarak Uçan
    Form veya Lanetli Başkalaşım yapabilirsiniz. Bu uçan formu yaparken bir kuş formuna
    bürünmelisiniz.
omen://feat/tricksters-ace?source=paizo-pathfinder-player-core-2:
  name: Düzenbazın Kozu
  description: İster derme çatma büyülü eşyalardan, ister büyülü etkileşimlerin incelenmesinden
    yapılan çıkarımlardan veya başka yollardan olsun, çaresiz durumlar için arka cebinizde
    bir beklenmedik durum saklarsınız. Tetikleyici gerçekleştiğinde büyünün yürürlüğe
    girmesini sağlarsınız. Büyü normalde kaç yaratığı etkileyecek olursa olsun yalnızca
    sizi hedefler. GM tarafından belirleneceği üzere özellikle karmaşık koşullar tanımlarsanız
    tetikleyici başarısız olabilir. Beklenmedik durum tetiklendiğinde büyü bir sonraki
    günlük hazırlıklarınıza kadar tükenir.
omen://feat/tripkee-glide?source=paizo-pathfinder-player-core-2:
  name: Tripkee Süzülüşü
  description: Düşüşünüzü yönlendirmek için perdeli ayaklarınızı kullanabilirsiniz.
    Havada 5 fit aşağı (her iki eliniz de serbest değilse 10 fit) ve 25 fite kadar
    ileriye doğru yere yavaşça süzülürsünüz. Her turda süzülerek en az 1 eylem harcadığınız
    ve henüz yere ulaşmadığınız sürece, sıranızın sonunda havada kalırsınız.
  prerequisites:
  - text: rüzgârağı tripkee
omen://feat/tripkee-lore?source=paizo-pathfinder-player-core-2:
  name: Tripkee İlimi
  description: >
    Tripkee kültüründe ve taktiklerinde oldukça bilgilisinizdir. Doğa ve Gizlilik
    becerilerinde eğitimli yetkinlik kazanırsınız. Bu becerilerden birinde otomatik
    olarak eğitimli olursanız, bunun yerine seçeceğiniz bir beceride eğitimli hâle
    gelirsiniz. Ayrıca Tripkee İlimi için Ek İlim genel hünerini kazanırsınız.
omen://feat/tripkee-weapon-familiarity?source=paizo-pathfinder-player-core-2:
  name: Tripkee Silah Aşinalığı
  description: >
    Tripkee özelliğine sahip tüm yaygın olmayan silahlara erişim kazanırsınız. Tripkee
    özelliğine sahip silahların yanı sıra üfleme borusu, fırlatma oku, nacak, tırpan
    ve kısa yaya aşinalığınız vardır; yetkinlik amacıyla bunlardan askeri silah olanları
    basit silahlar, ileri silah olanları ise askeri silahlar olarak değerlendirirsiniz.
    5. seviyede, bu silahlardan biriyle her kritik vuruş yaptığınızda kritik uzmanlaşma
    etkisini elde edersiniz.
omen://feat/true-dragons-flight?source=paizo-pathfinder-player-core-2:
  name: Hakiki Ejderha Uçuşu
  description: Kanatlarınız daha da güçlendi ve sizi havada daha uzun süre tutabilir
    hâle geldi. Her zaman 20 fitlik bir uçma Hızına sahip olursunuz.
  prerequisites:
  - text: Ejderha Uçuşu
omen://feat/true-perception?source=paizo-pathfinder-player-core-2:
  name: Hakiki Sezi
  description: Algısal yetenekleriniz ve duyusal bilgileri işleme kabiliyetiniz o
    kadar olağanüstüdür ki her türlü illüzyon ve fiziksel dönüşümdeki en küçük tutarsızlıkları
    fark edersiniz. Etkisiz kılma testi için Dikkat değiştiricinizi kullanarak sürekli
    olarak 6. derece bir Hakikatgörüşü büyüsünün etkileri altındasınızdır.
  prerequisites:
  - text: Efsanevi Dikkat
omen://feat/tumble-behind-swashbuckler?source=paizo-pathfinder-player-core-2:
  name: Arkasına Sıyrıl (Kabadayı)
  description: Sıyrılmalarınız düşmanlarınızı hazırlıksız yakalar. Sıyrılıp Geçmeyi
    başarıyla gerçekleştirdiğinizde, Sıyrılıp Geçtiğiniz düşman, sıranızın bitiminden
    önce yapacağınız bir sonraki saldırıya karşı Gafil kalır.
omen://feat/tumbling-diversion?source=paizo-pathfinder-player-core-2:
  name: Sıyrılarak Dikkat Dağıtma
  description: Bir rakibin alanının Sıyrılıp Geçmeyi deneyin. Başarılı veya kritik
    başarılı olursanız ve hareketinizi o rakibe bitişik olarak sonlandırmazsanız,
    o rakibin dikkatini dağıtmak için Dikkat Dağıtmayı deneyebilirsiniz. Dikkat Dağıtmak
    için yapılan Aldatma testine +1 durumsal bonus kazanırsınız (Sıyrılıp Geçmek için
    yapılan Akrobasi testinde kritik başarı elde ettiyseniz +2 durumsal bonus). Dikkat
    Dağıtmada başarılı veya kritik başarılı olursanız, yalnızca alanının Sıyrılıp
    Geçtiğiniz yaratığa karşı Gizlenmiş hâle gelirsiniz.
  prerequisites:
  - text: Akrobasi ve Aldatmada uzman
omen://feat/tumbling-teamwork?source=paizo-pathfinder-player-core-2:
  name: Sıyrılarak Ekip Çalışması
  description: Sıyrılmanız bir düşmanın dikkatini müttefiklerinizden biri için bir
    avantaj yaratacak kadar dağıtır. Bir düşmanın alanının Sıyrılıp Geçmeyi başarıyla
    gerçekleştirdiğinizde, o düşmana bitişik bir müttefik bir reaksiyon olarak Adım
    atabilir, ancak o düşmana bitişik kalmalıdır.
  prerequisites:
  - text: Uzman Akrobasi
omen://feat/tumbling-theft?source=paizo-pathfinder-player-core-2:
  name: Sıyrılarak Hırsızlık
  description: Bir düşmanın yanından geçerken onun bir eşyasına uzanırsınız. Bir düşmanın
    alanının Sıyrılıp Geçme testinizde kritik başarı elde ederseniz, bir reaksiyon
    olarak düşmandan bir şey Çalmayı deneyebilirsiniz. Sıyrılmanız düşmanınızın hareketinizi
    takip etmesini zorlaştırdığı için Çalma amaçlı Hırsızlık testinize +1 durumsal
    bonus kazanırsınız. Düşmanın üzerinde kemerinde asılı bir iksir veya bozuk para
    kesesi gibi hemen erişilebilir, hafif ya da ihmal edilebilir Yüke sahip herhangi
    bir eşyayı Çalabilirsiniz; ancak bir kabın içindeki veya düşmanın tuttuğu herhangi
    bir şeyi çalamazsınız. Neyi Çalabileceğiniz konusunda son söz GM'ye aittir.
  prerequisites:
  - text: Akrobasi ve Hırsızlıkta uzman
omen://feat/twirling-throw?source=paizo-pathfinder-player-core-2:
  name: Fırıl Fırıl Fırlatma
  description: Fırlattığınız silahlar havada süzülürken ve bir vuruştan sonra dönüp
    size geri gelirken fizik kurallarına meydan okuyor gibi görünür. İkinci ve üçüncü
    menzil artışı içinde menzilli saldırılar yapmaktan kaynaklanan cezayı yok sayarak
    bir fırlatılan silah saldırısı yapın. Saldırı zarında kritik bir başarısızlık
    elde etmediğiniz sürece silah saldırıdan sonra elinize geri döner.
  prerequisites:
  - text: Uçan Bıçak
omen://feat/unbalancing-finisher?source=paizo-pathfinder-player-core-2:
  name: Denge Bozan Bitirici Hamle
  description: Hedefinizi dengesiz bırakan gösterişli bir vuruş yaparsınız. Bir yakın
    dövüş Vuruşu yapın. İsabet eder ve hasar verirseniz, hedef bir sonraki sıranızın
    sonuna kadar Gafil kalır.
omen://feat/unbalancing-sweep?source=paizo-pathfinder-player-core-2:
  name: Denge Bozan Süpürme
  description: Yaratıkları ayaklarından kaydırıp sizden uzağa savurarak silahınızla
    veya yumruklarınızla etrafınızda büyük bir süpürme hareketi yaparsınız. Erişiminiz
    içindeki en fazla üç düşmanı seçin ve üçünü birden İtmeyi mi yoksa üçüne birden
    Çelme Takmayı mı istediğinizi seçin. İki seçenekten hangisini seçerseniz seçin,
    her düşmana karşı aynı eylemi gerçekleştirerek her düşmana karşı ayrı bir Atletizm
    testi atın. Her girişim çoklu saldırı cezanıza sayılır, ancak tüm girişimleri
    yapana kadar cezanızı artırmayın.
omen://feat/unbound-leaper?source=paizo-pathfinder-player-core-2:
  name: Sınırsız Sıçrayıcı
  description: Zıplama ustalığınız eşsizdir. Yere dokunmadan ve bir Atletizm testi
    gerektirmeden herhangi bir yönde 30 fite kadar Sıçrayabilirsiniz; bunu yaparken
    sizden 30 fit içindeki sağlam bir zemin alanına inmelisiniz, aksi takdirde bir
    sonraki eyleminizi kullandıktan sonra düşersiniz. Sıçrarken normal Hızınızı aşabilirsiniz.
omen://feat/uncanny-agility?source=paizo-pathfinder-player-core-2:
  name: Akıl Almaz Çeviklik
  description: En dengesiz yüzeylerde bile hızla hareket etmenizi sağlayan doğaüstüne
    yakın bir dengeniz vardır. Sağlam Denge beceri hünerini kazanırsınız. Kayalık
    bir tarla, engebeli bir yokuş veya sallanan bir gemi gibi engebeli zeminin neden
    olduğu zorlu araziye Adım atabilirsiniz.
omen://feat/uncanny-cheeks?source=paizo-pathfinder-player-core-2:
  name: Akıl Almaz Yanaklar
  description: Eşyaları her zaman yanak keselerinizden çekip çıkarmanız haricinde
    Öngörülü Sarf Malzemesi ve Öngörülü Plancı hünerlerini kazanırsınız. Bu, aldığınız
    nesnenin yanak keselerinize sığması gerektiği anlamına gelir; Yanak Keseleri hünerine
    de sahip olmadığınız sürece bu genellikle ihmal edilebilir Yüke sahip bir eşyadır.
omen://feat/undead-slayer?source=paizo-pathfinder-player-core-2:
  name: Hortlak Katili
  description: Yarı-yaşayan anatominiz hakkındaki bilginiz, savaştaki deneyiminizle
    birleşerek hortlak düşmanları kolaylıkla alt etmenize yardımcı olur. Hortlak yaratıklara
    karşı, silah ve silahsız Vuruşlarla verilen hasara o Vuruşun silah hasar zarlarının
    sayısına eşit bir durumsal bonus kazanırsınız. Hedefiniz vampir özelliğine sahipse
    bu bonus silah hasar zarlarının iki katına çıkar.
omen://feat/underground-network?source=paizo-pathfinder-player-core-2:
  name: Yeraltı Ağı
  description: >
    Sokaklarda neler olup bittiğini bilen gruplarla bağlantınız vardır ve onlardan
    hızlıca bilgi alabilirsiniz. Bir ağınızın olduğu bir bölgede (genellikle en az
    bir hafta geçirdiğiniz veya daha hızlı bir ağ kurmak için bir gün boş zaman harcadığınız
    bir yerleşim yerinde) Bilgi Toplamak için Sosyoloji becerisini kullandığınızda,
    bilgiyi doğrudan onlardan almak için bu grupların bir üyesiyle iletişime geçebilirsiniz.
    Bu genellikle yaklaşık bir saat sürer ve halk arasında Bilgi Toplamak kadar dikkat
    çekmez. Test ve elde edilen bilgi, diğer açılardan Bilgi Toplama'nın normal kurallarını
    takip eder. Ek olarak, yeraltı ağına başarıyla danıştıysanız, Bilgi Topladığınız
    konu hakkında deneyeceğiniz bir sonraki Bilgi Hatırla testine +1 durumsal bonus
    veya test için Yeraltı Dünyası İlimi kullanıyorsanız +2 durumsal bonus kazanırsınız.
    Bulunduğunuz konuma veya yararlandığınız ağın özelliklerine bağlı olarak GM ağla
    ilgili İlim becerisini değiştirebilir.
  prerequisites:
  - text: Uzman Sosyoloji
  - text: Sokak Görmüş
omen://feat/underworld-investigator?source=paizo-pathfinder-player-core-2:
  name: Yeraltı Müfettişi
  description: Bir müfettiş olarak çalışmalarınız sizi suç unsurlarına aşina kılmıştır.
    Kendiniz de bir suçlu olabilirsiniz ya da dışarıdan onların nasıl çalıştığına
    dair bir anlayış kazanmış olabilirsiniz. Yeraltı Dünyası İlimi becerisinde eğitimli
    hâle gelirsiniz ve bir vakayı soruşturmak için yapılan Hırsızlık testlerine (bir
    şüpheliden bir ipucu Çalmak veya suçlayıcı belgelerin bulunduğu bir kasayı açmak
    için Kilit Açmak gibi testler) İpucunu Takip Et soruşturma bonusunuzu kazanırsınız.
omen://feat/unstoppable-juggernaut?source=paizo-pathfinder-player-core-2:
  name: Durdurulamaz Juggernaut
  description: >
    Ölümcül yaraları kolaylıkla savuşturabilen, doğanın acımasız ve durdurulamaz bir
    gücü hâline geldiniz. Tüm hasarlara karşı 3 + Dayanıklılık değiştiricinize eşit
    direnç kazanırsınız ve öfkeden gelen direnciniz 8 + Dayanıklılık değiştiricinize
    çıkar. Ek olarak, öfkeliyken Can Puanınız 0'a düşerse, 1 Can Puanında kalmak için
    bir reaksiyon olarak öfkenizi sonlandırabilirsiniz. Bunu yaparsanız Yaralı 2 olursunuz
    (zaten yaralıysanız yaralı durum değerinizi 2 artırırsınız).
omen://feat/vampire-lore?source=paizo-pathfinder-player-core-2:
  name: Vampir İlimi
  description: >
    Vampir ebeveyniniz tarafından büyütüldünüz veya hortlak atalarınızın sırlarını
    araştırmak için önemli miktarda zaman ve enerji harcadınız. Din ve Sosyoloji becerilerinde
    eğitimlisiniz. Bu becerilerden birinde otomatik olarak eğitimli olursanız (örneğin
    geçmişinizden veya sınıfınızdan), bunun yerine seçeceğiniz bir beceride eğitimli
    hâle gelirsiniz. Ayrıca Vampir İlimi için Ek İlim genel hünerini kazanırsınız.
omen://feat/vengeful-strike?source=paizo-pathfinder-player-core-2:
  name: İntikam Saldırısı
  description: Bir düşman tarafından vurulduğunuzda aynı şekilde karşılık verirsiniz.
    Tetikleyici yaratığa karşı yakın dövüş Vuruşu yapın. Tetikleyici saldırı kritik
    bir başarı idiyse, İntikam Saldırısı'nı bir reaksiyon yerine serbest bir eylem
    olarak kullanabilirsiniz.
  prerequisites:
  - text: Sıkıysa Gel
omen://feat/vexing-tumble?source=paizo-pathfinder-player-core-2:
  name: Can Sıkıcı Sıyrılma
  description: Düşmanlarınızın etrafında taklalar atarak onların reaksiyonlarından
    ustaca kaçınırsınız. Hızınızın yarısına kadar Depar atın ve bir akrobasi testi
    atın. Sonucu, hareket sırasında menzilinde başladığınız veya girdiğiniz her düşmanın
    Refleks ZD'si ile sırayla karşılaştırın.
omen://feat/vicious-evisceration?source=paizo-pathfinder-player-core-2:
  name: Vahşi Deşme
  description: Düşmanınızı sakatlayan vahşi bir darbe indirirsiniz. Bir yakın dövüş
    Vuruşu yapın. Vuruş isabet eder ve hasar verirse hedef İçi Çekilmiş 1, kritik
    başarıda ise İçi Çekilmiş 2 olur.
omen://feat/vicious-incisors?source=paizo-pathfinder-player-core-2:
  name: Vahşi Kesici Dişler
  description: Çene silahsız saldırınız 1d4 yerine 1d6 delici hasar verir ve gafil
    vuran özelliği kazanır. Dişlerinizi törpüleyebilir ve daha sonra yeniden uzatabilirsiniz;
    bu da bu hüneri herhangi bir seviyede seçmenize ve bu hünere yeniden eğitilip
    hünerden çıkmanıza olanak tanır.
omen://feat/vicious-snares?source=paizo-pathfinder-player-core-2:
  name: Acımasız Kapanlar
  description: Ürettiğiniz hasar kapanlarıyla fazladan 1d6 zayıf nokta hasarı verirsiniz.
    Zanaat becerisinde efsaneviyseniz bu miktar 2d6 ek zayıf nokta hasarıa çıkar.
  prerequisites:
  - text: Uzman Zanaat
  - text: Kapan Yapımı
omen://feat/vigorous-health?source=paizo-pathfinder-player-core-2:
  name: Zinde Sıhhat
  description: Kan kaybına şaşırtıcı derecede iyi dayanırsınız. İçi Çekilmiş durumunu
    kazanacak olduğunuz her seferinde bir düz test deneyebilirsiniz. Başarı durumunda
    içi çekilmiş durumunu kazanmazsınız.
omen://feat/vivacious-bravado?source=paizo-pathfinder-player-core-2:
  name: Hayat Dolu Fiyaka
  description: Egonuz kabararak acınıza geçici bir mola verir. Bir sonraki turunuzun
    başlangıcına kadar süren seviyeniz artı Karizma değiştiricinize eşit geçici Can
    Puanı kazanırsınız.
omen://feat/voice-of-the-night?source=paizo-pathfinder-player-core-2:
  name: Gecenin Sesi
  description: Karanlığı paylaştığınız yaratıkların sözlerini duyar ve anlarsınız.
    Yarasalara, sıçanlara ve kurtlara soru sorabilir, onlardan yanıt alabilir ve onlarla
    Diplomasi becerisini kullanabilirsiniz. Ayrıca bu tür hayvanlar üzerinde İyi Bir
    İzlenim Bırakma testlerine +1 durumsal bonus kazanırsınız.
omen://feat/vomit-stomach?source=paizo-pathfinder-player-core-2:
  name: Mide Çıkarma
  description: Zor koşullarda toksinleri dışarı atmak için midenizi kusabilirsiniz.
    Midesi Bulanmış durumunuzu 2 azaltın ve son bir dakika içinde maruz kaldığınız
    yutulan zehirlere karşı hemen +2 durumsal bonusuyla bir kurtarış deneyin. Açığa
    çıkan mideniz sizi saldırılara karşı özellikle savunmasız kıldığı için 1 tur boyunca
    Gafil kalırsınız.
omen://feat/wall-run?source=paizo-pathfinder-player-core-2:
  name: Duvarda Koşu
  description: >
    Yerçekimine meydan okuyarak dikey düzlemleri de yer kadar kolay katedersiniz.
    Hızınıza kadar Depar atın. Hareketinize yatay bir yüzeyde başlamalısınız. Bu hareket
    sırasında tam Hızınızla duvarlar gibi dikey yüzeylerde yukarı koşabilirsiniz.
    Deparı yerden uzakta sonlandırırsanız, bir sonraki eyleminizi yaptıktan sonra
    veya sıranız sona erdiğinde (hangisi önce gelirse) düşersiniz (yine de uygunsa
    Kenara Tutunabilirsiniz). Suda Adım veya benzeri bir yeteneğiniz varsa Duvarda
    Koşu, dayanıksız dikey yüzeylerin yanı sıra şelale gibi dikey sıvıların üzerinde
    de koşmanıza olanak tanır.
omen://feat/war-conditioning?source=paizo-pathfinder-player-core-2:
  name: Savaş Şartlanması
  description: Uzak ortamlarda kapsamlı eğitiminiz vardır; bu da bu alanlarda kolayca
    hareket etmenizi sağlar. Bu hüneri kazandığınızda 20 fitlik bir tırmanma Hızı
    veya 20 fitlik bir yüzme Hızı kazanmayı seçebilirsiniz.
omen://feat/ward-against-corruption?source=paizo-pathfinder-player-core-2:
  name: Yozlaşmaya Karşı Koruma
  description: Ruhunuz ölümsüzlüğün ve vebanın gücüne karşı olduğu kadar sahkil olarak
    bilinen kötü eski psikopompların gücüne karşı da korunur. Ölüm etkilerine, hastalıklara
    ve hortlaklardan ya da sahkillerden gelen tüm etkilere karşı yapılan kurtarışlara
    +1 durumsal bonus kazanırsınız. Bu bonus bir hortlağın veya sahkilin ölüm etkisine
    ya da hastalığına karşı +2'ye çıkar.
omen://feat/warren-digger?source=paizo-pathfinder-player-core-2:
  name: Yeraltı Kazıcısı
  description: Sağlam pençelerinizi toprağı kazmak için kullanmayı öğrendiniz. 15
    fitlik bir kazma Hızı kazanırsınız.
omen://feat/warren-navigator?source=paizo-pathfinder-player-core-2:
  name: Yeraltı Kılavuzu
  description: Hayatta Kalma becerisinde eğitimli yetkinlik derecesi kazanırsınız.
    Hayatta Kalma becerisinde otomatik olarak eğitimli olursanız (örneğin geçmişinizden
    veya sınıfınızdan), bunun yerine seçeceğiniz başka bir beceride eğitimli hâle
    gelirsiniz. Yön Sezdiğinizde veya Çıkmaz büyüsüne karşı bir zar denediğinizde
    attığınızdan bir derece daha iyi bir başarı sonucu elde edersiniz. Bir pusulanız
    olmadığında Yön Sezmeye ceza almazsınız.
omen://feat/wary-skulker?source=paizo-pathfinder-player-core-2:
  name: Temkinli Gizlenen
  description: İzci keşif aktivitesini Fark Edilmekten Kaçın keşif aktivitesiyle aynı
    anda gerçekleştirebilirsiniz.
omen://feat/water-sprint?source=paizo-pathfinder-player-core-2:
  name: Suda Depar
  description: >
    Deneyim ve eğitim size suyun, usta bir koşucunun yüzeyi geçebilmesi için tam da
    yeterli yüzey gerilimine sahip olduğunu öğretmiştir. Düz bir çizgide Depar attığınızda
    yer üzerinde en az yarı Hızınız kadar hareket ederseniz, kalan mesafenin herhangi
    bir miktarını durgun bir su kütlesi boyunca kat edebilirsiniz. Deparınızı katı
    zeminde sonlandırmazsanız suya düşersiniz. Atletizm becerisinde efsaneviyseniz
    katı zeminde başladığınız sürece, düz bir çizgide hareket etmiyor olsanız bile
    Deparınızın herhangi bir kısmı su yüzeyinden geçebilir; yine de hareketinizi katı
    zeminde bitirmezseniz suya düşersiniz.
  prerequisites:
  - text: Usta Atletizm
omen://feat/water-step?source=paizo-pathfinder-player-core-2:
  name: Suda Adım
  description: Sıvıların ve ağırlığınızı taşımayan yüzeylerin üzerinden Depar atabilirsiniz.
    Bu avantaj yalnızca hareketiniz sırasında geçerlidir. Hareketinizi sizi taşıyamayan
    bir yüzeyde sonlandırırsanız normalde olduğu gibi içine düşersiniz veya yüzey
    çöker.
omen://feat/well-groomed?source=paizo-pathfinder-player-core-2:
  name: Bakımlı
  description: Temiz kalma konusunda titizsinizdir. Hastalıklara karşı yapılan kurtarışlara
    +2 durumsal bonus kazanırsınız. Bir hastalığa karşı kurtarışta başarı elde ederseniz
    bunun yerine kritik başarı elde edersiniz. Kurtarışı bu şekilde iyileştiren farklı
    bir yeteneğiniz varsa (Savaşta Pişmiş savaşçı sınıf özelliği gibi), kurtarışta
    kritik başarısızlık elde ederseniz bunun yerine başarısızlık elde edersiniz.
omen://feat/well-met-traveler?source=paizo-pathfinder-player-core-2:
  name: Hoş Karşılanan Yolcu
  description: >
    Başkalarıyla tanışırken doğal olarak hoş ve cana yakın bir tavır takınırsınız.
    Diplomasi becerisinde eğitimlisiniz. Onda otomatik olarak eğitimli olursanız (örneğin
    geçmişinizden veya sınıfınızdan), bunun yerine seçeceğiniz bir beceride eğitimli
    hâle gelirsiniz. Ek olarak Ayaküstü Sohbetçi beceri hünerini kazanırsınız.
omen://feat/whirling-blade-stance?source=paizo-pathfinder-player-core-2:
  name: Dönen Bıçak Duruşu
  description: >
    Keşiş silahlarınızla aranızda derin bir bağ kuran dikkatli bir duruşa geçersiniz;
    bu duruş uzaktan bile onları qi'nizle yönlendirmenize olanak tanır. Ustalık özelliğine
    sahip kullandığınız tüm yakın dövüş keşiş silahları fırlatılan 10 fit özelliği
    kazanır (daha büyük menzilli fırlatılan özelliğine zaten sahip değillerse). Böyle
    bir silahla fırlatılan bir Vuruş Yaptığınızda, uzaktan bile olsa onunla ek saldırılar
    yapmak için fırlatışınızın hassasiyetini kullanabilirsiniz. Menzil artışını ve
    yeni hedefin siperi olup olmadığını belirlemek için önceki Vuruşun hedefinin alanından
    başlayın. Sıranızın sonunda fırlatılan silah düz bir çizgide doğrudan size geri
    uçar. Katı bir engel yolunu keserse engele çarptıktan sonra yere düşer.
  prerequisites:
  - text: Manastır Silahları
omen://feat/whirling-throw?source=paizo-pathfinder-player-core-2:
  name: Döndürerek Fırlatma
  description: Düşmanınızı uzağa savurursunuz. Düşmanın Dayanıklılık ZD'sine karşı
    bir Atletizm testi deneyin. Hedef sizden bir boy büyükse testinize -2 durumsal
    ceza, bundan daha büyükse -4 durumsal ceza alırsınız. Hedef sizden bir boy küçükse
    testinize +2 durumsal bonus, bundan daha küçükse +4 durumsal bonus kazanırsınız.
omen://feat/whirlwind-strike?source=paizo-pathfinder-player-core-2:
  name: Hortum Saldırısı
  description: Yakındaki tüm hasımlara saldırırsınız. Yakın dövüş erişiminiz içindeki
    her düşmana karşı bir yakın dövüş Vuruşu yapın. Her saldırı çoklu saldırı cezanıza
    sayılır, ancak tüm saldırılarınızı yapana kadar cezanızı artırmayın.
omen://feat/whirlwind-toss?source=paizo-pathfinder-player-core-2:
  name: Hortum Atışı
  description: >
    Bir düşmanı çok uzağa fırlatmadan önce yakındaki tüm yaratıklara çarpmak üzere
    fırıl fırıl döndürürsünüz. Hırpalarsınız. Bu Hırpalama sırasında Yan Hasarlı Hırpalama
    hüneriniz size bitişik olan tüm diğer düşmanlara uygulanır. Ardından Yakalanan
    yaratığı 10 fit uzağa fırlatabilirsiniz; burada Yüzüstü yere düşer. Yan Hasarlı
    Hırpalama için seçtiğiniz düşman da size bitişikse, yalnızca tek bir kurtarış
    dener ve hasarı yalnızca bir kez alır.
  prerequisites:
  - text: Yan Hasarlı Hırpalama
omen://feat/whodunnit?source=paizo-pathfinder-player-core-2:
  name: Katil Kim?
  description: Vakanızı dikkatlice değerlendirir ve bazı ayrıntıları daraltırsınız.
    Bir İpucunu Takip Ettiğinizde ve daha büyük bir gizem olduğunu öğrendiğinizde,
    soruşturmayı başlattığınızda soruşturmanızla ilgili iki soru sorabilirsiniz. Cevap
    yanıltıcı olacaksa veya soruşturmanıza pratik bir faydası yoksa GM "önemsiz" yanıtını
    verebilse de GM dürüstçe "evet" veya "hayır" şeklinde yanıt vermelidir. Katil
    Kim?'i farklı günlerde olsa dahi aynı ipucu için birden fazla kullanamazsınız.
    Sorularınız, soruşturmanızı tetikleyen ayrıntıya uygulanarak aşağıdaki listeden
    gelmelidir. • Bu ipucu bir [creature trait] tarafından mı bırakıldı? (İnsansı,
    hortlak veya cüce gibi bir yaratık özelliği seçin; bu özellik ipucunun bırakıldığı
    an itibarıyla doğru olmalıdır.) • Bu ipucu son bir saat içinde mi bırakıldı? •
    Bu ipucu son bir gün içinde mi bırakıldı? • Bu ipucunu bırakan yaratık, ipucunu
    bıraktığında aşırı duygusal bir durumda mıydı? • Herhangi biri bu ipucunu gizlemeye
    çalıştı mı?
omen://feat/wild-winds-gust?source=paizo-pathfinder-player-core-2:
  name: Vahşi Rüzgârlar Esintisi
  description: Büyük bir hücum rüzgârı saldırısı hilali serbest bırakmadan önce tekrarlanan
    hareketlerle hava basıncı oluşturursunuz. Koni veya hat arasından yapacağınız
    seçimle her yaratığa karşı bir rüzgâr çarpması Vuruşu yapın. Bu saldırıların tümü
    çoklu saldırı cezanıza sayılır, ancak tüm saldırıları yapana kadar ceza artmaz.
  prerequisites:
  - text: Vahşi Rüzgârlar Müridi
omen://feat/wild-winds-initiate?source=paizo-pathfinder-player-core-2:
  name: Vahşi Rüzgârlar Müridi
  description: >
    Uzaktan saldırmanızı sağlayan bir duruş öğrenirsiniz. Vahşi Rüzgârlar Duruşu qi
    büyüsünü kazanırsınız. Duruşa geçmek bir qi büyüsü olsa da duruşun sağladığı rüzgâr
    çarpması Vuruşları büyü değildir; bu nedenle duruştayken bunları istediğiniz sıklıkta
    kullanabilirsiniz.
  prerequisites:
  - text: Qi Büyüleri
omen://feat/wind-gods-fan?source=paizo-pathfinder-player-core-2:
  name: Rüzgâr Tanrısının Yelpazesi
  description: Yelpazeniz daha da güçlü rüzgârlar estirebilir. Yelpazeyi Salla aktivasyonunu
    günde bir ek kez kullanabilirsiniz. Yelpazenizde bulunan büyülere 3. derece bir
    Rüzgâr Duvarı büyüsü ekleyin.
  prerequisites:
  - text: Tengu Tüy Yelpazesi
omen://feat/winding-flow?source=paizo-pathfinder-player-core-2:
  name: Kıvrılan Akış
  description: 'Her yolculuk sadece hedefinize ulaşmaktan daha fazlasından ibarettir.
    Herhangi bir sırada şu eylemlerden ikisini kullanırsınız: Ayağa Kalk, Adım ve
    Depar. Aynı eylemi iki kez kullanamazsınız.'
omen://feat/wing-buffet?source=paizo-pathfinder-player-core-2:
  name: Kanat Darbesi
  description: Düşmanlarınızı hırpalayıp itecek kadar güçlü bir çift ejderha kanadına
    sahipsiniz. Size bitişik en fazla iki yaratık seçin. Bir Atletizm testi deneyin
    ve bunu her hedefin Dayanıklılık ZD'si ile karşılaştırın. Bu, çoklu saldırı cezanız
    için iki saldırı sayılır, ancak ceza her iki saldırıdan sonrasına kadar artmaz.
  prerequisites:
  - text: Atletizmde uzman
omen://feat/winglet-flight?source=paizo-pathfinder-player-core-2:
  name: Kanatçık Uçuşu
  description: Yoğun kullanım ve egzersiz kanatçıklarınızı daha güçlü hâle getirdi.
    Uçma eylemini gerçekleştirirsiniz. Normalde uçma Hızınız yoksa bu hareket için
    20 fit uçma Hızı kazanırsınız. Bu hareketin sonunda katı zeminde değilseniz düşersiniz.
  prerequisites:
  - text: Kanatçıklar
omen://feat/winglets?source=paizo-pathfinder-player-core-2:
  name: Kanatçıklar
  description: Koloninizin koruyucusunun süregelen etkisiyle küçük bir çift kanat
    çıkardınız. Tam bir uçuş için uygun olmasa da bu zayıf kanatlar küçük bir çırpınışla
    daha uzağa zıplamanıza yardımcı olabilir. Yatay olarak Zıplarken fazladan 5 fit
    hareket edersiniz. Bu ek mesafe, Güçlü Sıçrayış hünerinden gelen artırılmış Zıplama
    mesafesiyle birikmez. Ayrıca Uzun Atlama denediğinizde, Hızınızdan daha uzağa
    zıplayamasanız da Atletizm testinizin sonucuna bağlı olarak normalde zıplayabileceğinizden
    10 fite kadar daha uzağa zıplayabilirsiniz. Öncesinde en az 10 fit Depar atmazsanız
    Yüksek Atlama veya Uzun Atlama testlerinizde otomatik olarak başarısız olmazsınız.
omen://feat/wolf-drag?source=paizo-pathfinder-player-core-2:
  name: Kurt Sürüklemesi
  description: >
    Düşmanınızın ayaklarını yerden kesersiniz. Bir kurt çenesi Vuruşu yapın. Kurt
    çeneniz bu Vuruş için can alıcı d12 özelliği kazanır ve saldırı başarılı olursa
    hedefi Yüzüstü yere devirirsiniz.
  prerequisites:
  - text: Kurt Duruşu
omen://feat/wolf-stance?source=paizo-pathfinder-player-core-2:
  name: Kurt Duruşu
  description: >
    Ellerinizi sivri dişler gibi tutarak yere yakın bir kurt duruşuna geçersiniz.
    Kurt çenesi silahsız saldırıları yapabilirsiniz. Bunlar 1d8 delici hasar verir;
    brawling grubundadır; ve çevik, gafil vuran, ustalık, öldürücü olmayan ile silahsız
    özelliklerine sahiptir. Kurt Duruşundayken bir hedefi kıstırıyorsanız, kurt çenesi
    silahsız saldırılarınız çelme takma özelliği de kazanır.
omen://feat/wounded-rage?source=paizo-pathfinder-player-core-2:
  name: Yaralı Öfkesi
  description: Acı içinde kükreyerek içinizdeki öfkeyi uyandırırsınız. Öfkeye girersiniz.
