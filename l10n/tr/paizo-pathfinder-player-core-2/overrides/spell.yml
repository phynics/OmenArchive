# tr overrides: spell

omen://spell/aberrant-whispers?source=paizo-pathfinder-player-core-2:
  name: Sapma Fısıltıları
  description: >
    Bilinmeyen bir dilde sözler mırıldanarak yakındakilerin zihinlerine saldırırsınız. Her hedef bir İrade kurtarışı denemelidir. Kurtarışın sonucuna bakılmaksızın, her hedef ardından 1 dakika boyunca geçici olarak bağışık olur. Büyüyü Yaparken kullandığınız her ilave eylem için yayılmanın yarıçapını 5 fit artırırsınız. Başarı Hedef etkilenmez. Başarısızlık Hedef Zihni Uyuşmuş 2 olur. Kritik Başarısızlık Hedefin Kafası Karışır. Güçlendirilmiş (+3) Başlangıç yarıçapı 5 fit artar.


omen://spell/access-lore?source=paizo-pathfinder-player-core-2:
  name: İlime Eriş
  description: Belirli bir konuyla ilgili kırıntıları arayarak çoklu evrenin ilahi bilgisini tararsınız. Bir İlim yeteneği seçin. Kâhin büyücülüğünüzdeki uzmanlık derecenizle aynı uzmanlık derecesini geçici olarak o İlim yeteneğinde kazanırsınız.

omen://spell/ancestral-defense?source=paizo-pathfinder-player-core-2:
  name: Ata Savunması
  description: >
    Tetikleyici: Bir İrade kurtarışı denemek üzeresiniz. Atanız, iradenizi bükmek isteyenlere karşı sizi korur. Tetikleyici kurtarışı iki kez atarsınız ve daha iyi olan sonucu kullanırsınız.


omen://spell/ancestral-form?source=paizo-pathfinder-player-core-2:
  name: Ata Formu
  description: >
    Ata ruhlarınızın formuna bürünerek Görünmez ve yarı-cismani hâle gelirsiniz. Tüm hasarlara karşı 10 direnç kazanırsınız (güç, ruh ve Hayalet Dokunuşu özellik rününe sahip Saldırılardan gelen hasar hariç) ve bu direnç büyüsel olmayan ile zayıf nokta hasarlarına karşı iki katına çıkar. Kara Hızınıza eşit bir uçma Hareket Hızı kazanırsınız; Uçarken yukarı doğru hareket etmek sizin için zorlu arazi sayılmaz. Katı nesnelerin içinden geçemezsiniz, ancak minik yarıklardan süzülebilirsiniz. Büyü Yapamazsınız (ancak Büyüleri Sürdürebilirsiniz), eşyaları etkinleştiremezsiniz veya saldırı ya da manipülasyon özelliğine sahip eylemleri kullanamazsınız. Güçlendirilmiş (+2) Direnç 5 artar.


omen://spell/ancestral-memories?source=paizo-pathfinder-player-core-2:
  name: Ata Anıları
  description: >
    Çoktan ölmüş büyücülerin anıları size onların bilgisini bağışlayarak büyülerinizi daha heybetli hâle getirir. Sıranızın sonundan önce deneyeceğiniz bir sonraki büyü saldırı zarına +1 statü bonusu kazanırsınız ya da 60 fit içindeki bir düşman sıranızın sonundan önce yapacağınız bir büyüye karşı deneyeceği bir sonraki kurtarışa –1 statü cezası alır. Güçlendirilmiş (5.) Bonus +2'ye veya ceza –2'ye yükselir. Güçlendirilmiş (8.) Bonus +3'e veya ceza –3'e yükselir.


omen://spell/ancestral-touch?source=paizo-pathfinder-player-core-2:
  name: Ata Dokunuşu
  description: >
    Bir yaratığa dokunarak sizi çevreleyen ataları görmeye ve hissetmeye zorlarsınız. Hedef, bir İrade kurtarışına bağlı sonuçlarla birlikte 2d4 zihinsel hasar alır. Kritik Başarı Hedef etkilenmez. Başarı Hedef yarı hasar alır. Başarısızlık Hedef Korkmuş 1 olur ve tam hasar alır. Kritik Başarısızlık Hedef Korkmuş 2 olur ve iki kat hasar alır. Güçlendirilmiş (+1) Zihinsel hasar 1d4 artar.


omen://spell/angelic-halo?source=paizo-pathfinder-player-core-2:
  name: Melek Halesi
  description: İyileştir büyüsünden müttefiklerin aldığı iyileştirmeyi artıran bir auraya sahip meleksi bir hale kazanırsınız. Halenizin yayılma alanında olan ve bir iyileştir büyüsü ile iyileştirilen müttefikler, iyileştir büyüsünün derecesinin iki katına eşit miktarda geri kazanılan Can Puanlarına bir statü bonusu elde ederler.

omen://spell/angelic-wings?source=paizo-pathfinder-player-core-2:
  name: Melek Kanatları
  description: >
    Hızınıza eşit bir uçma Hareket Hızı sağlayarak sırtınızdan saf ışıktan kanatlar uzanır. Kanatlarınız 30 fit yarıçapında parlak ışık saçar. Bu büyünün süresi sona erdiğinde, hâlâ uçuyorsanız Yumuşak İniş'te olduğu gibi yere süzülürsünüz. Güçlendirilmiş (5.) Süre 1 dakikaya çıkar.


omen://spell/animal-vision?source=paizo-pathfinder-player-core-2:
  name: Hayvan Görüşü
  description: "Hedefin duyularına bağlanarak büyünün süresi boyunca onun algıladığı her şeyi algılamanızı sağlarsınız. Hedef bunu yapmanızı engellemek isterse bir İrade kurtarışı deneyebilir ve başarı durumunda büyüyü geçersiz kılabilir; ancak çoğu hayvan bunu yapma zahmetine girmez. Hedefin duyularına bağlıyken kendi bedeninizin duyularını kullanamazsınız, ancak bir Sürdür eylemi kullanarak kendi bedeninizin duyuları ile hedefin duyuları arasında geçiş yapabilirsiniz."

omen://spell/animated-assault?source=paizo-pathfinder-player-core-2:
  name: Canlandırılmış Saldırı
  description: "Alandaki sahipsiz nesneleri zihninizle manipüle ederek saldırmaları için geçici olarak canlandırırsınız. Nesneler havada asılı kalır, ardından kaotik bir moloz silsilesi hâlinde yakındaki yaratıklara fırlarlar. Bu saldırı, alandaki her bir yaratığa 2d10 gürz hasarı verir (temel Refleks kurtarışı). Sonraki turlarda, bu Büyüyü her tur ilk kez Sürdürdüğünüzde alandaki her bir yaratığa (floor(spell rank/2))d10[bludgeoning] hasar verir (temel Refleks kurtarışı). Yükseltilmiş (+2) Başlangıç hasarı 2d10 artar ve sonraki hasar 1d10 artar."

omen://spell/anointed-ground?source=paizo-pathfinder-player-core-2:
  name: Takdis Edilmiş Zemin
  description: "Alanı takdis eder, belirli yağlar saçar ve düşmanlarınıza karşı korursunuz. Sapmalar, celestiallar, ejderhalar, iblisler, gözcüler veya hortlaklar arasından birini seçin. Alandaki tüm yaratıklar; seçilen yaratıklara karşı ZK'lerine, saldırı zarlarına, hasar zarlarına ve kurtarışlara +1 statü bonusu kazanır."

omen://spell/arcane-countermeasure?source=paizo-pathfinder-player-core-2:
  name: Arkana Karşı Tedbiri
  description: >
    Tetikleyici: Menzil içindeki görebildiğiniz bir yaratık bir Büyü Yapar. Hedef büyüyü baltalayarak ona karşı savunmayı kolaylaştırırsınız. Büyünün derecesini 1 azaltırsınız ve büyünün hedefleri ona karşı yapılacak herhangi bir kurtarışa, yetenek testine, ZK'ye veya ZD'ye +2 statü bonusu kazanır. Büyünün derecesini asgari seviyesinin altına düşüremezsiniz. Örneğin, 5. dereceden bir Uğultulu Tipi 5. derecede kalır, ancak 5. dereceden bir Ateş Topu 4. dereceye düşer. Büyünün derecesini düşürmeseniz bile hedefler diğer tüm faydaları yine de elde eder.


omen://spell/armor-of-bones?source=paizo-pathfinder-player-core-2:
  name: Kemik Zırh
  description: >
    Kemik dayanıklılığını taklit ederek fiziksel formunuzu kemikleştirirsiniz. Soğuk, elektrik, ateş, delici ve kesici hasara karşı 3 direnç kazanırsınız. Güçlendirilmiş (+1) Direnci 1 artırın.


omen://spell/astral-projection?source=paizo-pathfinder-player-core-2:
  name: Astral Projeksiyon
  description: >
    Hedeflerin ruhani özlerini Astral Düzlem'e yansıtarak cansız fiziksel formlarını geride bırakırsınız. Bu astral formlar Astral Düzlem'i süresiz olarak keşfetmek için kullanılabilir; bu sırada hedeflerin bedenleri ritüelin yapıldığı düzlemde güvenli bir şekilde dondurulmuş hâlde kalır (burada Bilinçsiz kalırlar ve normal yollarla uyandırılamazlar). Büyücüler, büyü yapma süresi boyunca bir çember içinde birbiriyle fiziksel temas hâlinde olmalıdır ve tüm hedefler bu büyücüler arasından seçilmelidir. Bir hedefin astral formu, hedefin ve taşıdığı her şeyin bir kopyasıdır; kopya bir eşyanın başına gelen her şey orijinaline de olur. Örneğin, bir eşyanın kopyasını kullanır, harcar, yok eder, kaybeder veya başkasına verirseniz, orijinali de mülkiyetinizden kaybolur. Ritüelin süresi boyunca hedeflerden herhangi biri tek bir eylem harcayarak astral formunu Sonlandırabilir ve anında fiziksel bedenine dönebilir. Birincil büyücü olarak, astral formunuzu Sonlandırdığınızda aynı eylemin bir parçası olarak diğer tüm hedeflerin astral formlarını da Sonlandırabilir ve tüm hedefleri aynı anda fiziksel formlarına döndürebilirsiniz. Astral Düzlem'deyken diğer hedefler siz olmadan yön bulamazlar ve sizden ayrılırlarsa sizin dönüşünüzü beklemeli veya kendi astral formlarını Sonlandırmalıdırlar. Ritüel sona erdiğinde hedeflerin astral formları kaybolur. Bir hedefin astral formu ile karşılık gelen fiziksel formu, yalnızca Astral Düzlem'de görülebilen cisimsiz bir gümüş kordonla birbirine bağlıdır. Neredeyse kırılmaz olan bu kordon bir iletken ve güvenlik hattı görevi görür; koparılırsa hedefin hem astral hem de fiziksel formları anında katledilir. Ritüel, bir hedefin fiziksel veya astral formu üzerine büyü boz yapılması gibi harici bir güç tarafından kesintiye uğratılırsa, hedef anında ve zarar görmeden fiziksel bedenine döndürülür. Bir hedefin astral formu katledilirse gümüş kordon onu hemen fiziksel bedenine geri çeker; bu zorlanma, ritüelin birincil testiyle aynı ZD'ye sahip bir Dayanıklılık kurtarışı denemesini gerektirir. Başarısızlık durumunda yaratık ölür; başarı durumunda ise 1 hafta boyunca Sakar 2, İçi Çekilmiş 2, Lanetlenmiş 2 ve Güçten Düşmüş 2 olur; bu durumlar hafta geçene kadar hiçbir şekilde kaldırılamaz veya azaltılamaz. Bir hedefin fiziksel bedeni ritüel süresince askıya alınmış canlılıkta kalır, ancak yok edilirse yaratık ölür ve astral formu da kaybolur. Bu ritüel hedeflerin bilinçlerinin yalnızca bir kısmını Astral Düzlem'e yansıtır. Astral Düzlem'e fiziksel olarak seyahat etmek (örneğin Dış Düzlemler'e ulaşmak için) düzlemlerarası ışınlanma gibi büyüleri gerektirir. Kritik Başarı Tüm hedefler Astral Düzlem'de bağımsız olarak yön bulabilirler. Her hedefin gümüş kordonu her zamankinden daha güçlüdür ve astral formunun ölmesi durumunda ölmekten kaçınmak için yapacağı Dayanıklılık kurtarışına +4 durumsal bonus sağlar. Başarı Hedefleri başarıyla yansıtırsınız. Başarısızlık Hedefleri yansıtamazsınız. Kritik Başarısızlık Hedeflerin ruhlarını bedenlerinden ayırma süreci karmaşıktır ve bir şeyler felaket derecesinde ters gider. Tüm büyücüler Lanetlenmiş 1 olur, anında 0 Can Puanına düşer ve ölmekte durumuna geçer.


omen://spell/battlefield-persistence?source=paizo-pathfinder-player-core-2:
  name: Savaş Alanı Sebatı
  description: >
    Tetikleyici: Bir kurtarış denemek üzeresiniz, ancak henüz zar atmadınız. Savaşta sizi caydırmak zordur. Tetikleyici kurtarışa +2 statü bonusu kazanırsınız ve tetikleyici kurtarış bir etkisizleştirme etkisine karşıysa, sizi 2 seviye daha yüksekmişsiniz gibi değerlendirir.


omen://spell/bestial-curse?source=paizo-pathfinder-player-core-2:
  name: Hayvani Lanet
  description: >
    Hedefin içsel varlığına dokunur ve onu kendisinin hayvani bir versiyonuna dönüşmesi için lanetlersiniz. Etki, Dayanıklılık kurtarışına dayanır. Kritik Başarı Hedef etkilenmez. Başarı Hedefin bedeni küçük hayvani özellikler kazanır. Kısmen dönüştükçe iç organları çalkalanır ve 1 tur boyunca Sakar 1 olmasına neden olur. Sakar durumundan kurtulduğunda özellikleri normale döner ve büyü sona erer. Başarısızlık Hedef 1 saat boyunca hayvani bir forma dönüşür. Hedef Sakar 1 olur ve gümüşe karşı 1 zaaf kazanır. Hedefin silahsız Vuruş istatistiklerini kullanan bir pençe, toynak, boynuz veya çene Saldırısı (seçiminiz) kazanır; ancak hasar türü uygun şekilde ezici, delici veya kesici olarak değişir. Hedef herhangi bir manipülasyon eylemi kullanmaya çalıştığında bir testte başarılı olmalıdır, aksi takdirde eylem kaybolur. Kritik Başarısızlık Başarısızlık gibi, ancak süre sınırsızdır.


omen://spell/blanket-of-stars?source=paizo-pathfinder-player-core-2:
  name: Yıldız Örtüsü
  description: >
    Uzak yıldızlar gibi ışık noktacıklarıyla dolu, zifiri karanlıktan oluşan dalgalanan bir pelerin üzerinizi örter. Size kozmosun durağanlığını aşılayarak Gizlenmek ve Sessizce İlerlemek için yapılan Gizlilik testlerine +2 statü bonusu kazandırır. Yıldızlı bir gece göğü altında dışarıdayken, hareketsiz kaldığınız sürece ayrıca Görünmez olursunuz. Yıldızlı bir gece göğü altında hareket ederken bunun yerine Gizlenmiş sayılırsınız. Yıldızlara çok yakından bakmak yön duygusunu bozar. Bitişiğinizde turunu bitiren herhangi bir yaratık bir İrade kurtarışı denemelidir; bu zihinsel, görsel bir etkidir. Başarı Yaratık etkilenmez. Başarısızlık Yaratık bir sonraki sırasının sonuna kadar Gözü Kamaşmış olur. Kritik Başarısızlık Yaratığın bir sonraki sırasının sonuna kadar Kafası Karışır ve gözü kamaşır.


omen://spell/blinding-fury?source=paizo-pathfinder-player-core-2:
  name: Kör Eden Öfke
  description: >
    Tetikleyici: Bir yaratık size hasar verir. Hedefi, saldırıya uğramış olmanın verdiği öfkenizle lanetlersiniz. Etki, hedefin İrade kurtarışına göre belirlenir. Kritik Başarı Hedef etkilenmez. Başarı Hedef sırasının sonuna kadar sizi Gözlemleyemez ve şu anda onun tarafından gözlemleniyorsanız ona karşı Gizli hâle gelirsiniz. Başarısızlık Başarı gibi olup 1 dakika boyunca hedef size her hasar verdiğinde sırasının sonuna kadar sizi gözlemleyemez. Kritik Başarısızlık Başarı gibi olup sınırsız bir süre boyunca, hedef her turda bir yaratığa ilk hasar verdiğinde sırasının sonuna kadar o yaratığı gözlemleyemez. Aynı anda birkaç yaratığa hasar verirse algılayamadığı yaratık bu yaratıklar arasından rastgele seçilir.

  requirements: Bir yaratık size hasar vermelidir.

omen://spell/blister?source=paizo-pathfinder-player-core-2:
  name: Kabarcık
  description: >
    Menzildeki bir hedefe işaret edersiniz ve derisinde yakıcı sıvıyla dolu kavurucu kabarcıklar büyür. Hedef bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedefte bir kabarcık büyür. Bir kabarcığı patlatmak için konsantrasyon özelliğine sahip tek bir eylem harcayabilirsiniz. Hedef ve hedeften kaynaklanan bir koni içindeki her yaratık 7d6 asit hasarı alır (basit Dayanıklılık kurtarışı). Hedefi içeremeyen koninin yönünü siz seçersiniz. Hiçbir kabarcık kalmadığında büyü sona erer. Başarısızlık Başarı gibi, ancak hedefte iki kabarcık büyür. Kritik Başarısızlık Başarı gibi, ancak hedefte dört kabarcık büyür. Güçlendirilmiş (+1) Patlayan bir kabarcığın hasarı 1d6 artar.


omen://spell/blistering-invective?source=paizo-pathfinder-player-core-2:
  name: Yakıcı Yerme
  description: >
    Ağzınızdan bir dizi hakaret ve yerme dökülür; bu sözler öylesine yıkıcıdır ki düşmanlarınız azarlamanızın şiddetiyle yanar. Sözleriniz 2d6 süren ateş hasarı verir ve hedef bir İrade kurtarışı denemelidir. Hedef dili anlamıyorsa veya bir dil konuşmuyorsanız kurtarışa +4 durumsal bonus kazanır. Kritik Başarı Hedef etkilenmez. Başarı Hedef süren ateş hasarının yarısını alır. Başarısızlık Hedef Korkmuş 1 olur ve süren ateş hasarının tamamını alır. Kritik Başarısızlık Hedef Korkmuş 2 olur ve süren ateş hasarının iki katını alır. Güçlendirilmiş (+2) İki ilave yaratığı hedef alabilirsiniz ve süren hasar 2d6 artar.


omen://spell/brain-drain?source=paizo-pathfinder-player-core-2:
  name: Zihin Sömürüsü
  description: >
    Bilgi toplamak için hedefin zihnini yoklarsınız. Bu durum basit bir İrade kurtarışı ile 1d8 zihinsel hasar verir. Hedef kurtarışta başarısız olursa çalınan anıları tarayarak Bilgi Hatırla için tek bir test denersiniz. Bilgi Hatırla eylemine sahip bir yetenek seçin ve test için hedefin yetenek bonusunu kullanın. Güçlendirilmiş (+1) Zihinsel hasar 1d8 artar.


omen://spell/bullhorn?source=paizo-pathfinder-player-core-2:
  name: Megafon
  description: >
    Sesinizi büyük bir mesafeden kolayca duyulabileceğiniz kadar yükseltirsiniz. Süre boyunca sesiniz, diğer ortam gürültüleri sesi engelleyecek olsa bile 500 fit içindeki tüm dinleyiciler tarafından yüksek ve net bir şekilde duyulabilir. Ses düzeyine rağmen bu durum sesinizi rahatsız edici veya dikkat dağıtıcı yapmaz. Bu durum diğer işitsel veya dilsel etkilerin menzilini veya alanını artırmaz ve duvarlar ile kapılar gibi fiziksel engeller sesinizi normal şekilde engellemeye veya boğmaya devam eder. Yüksek sesiniz başkalarını Tehditle Zorlamayı kolaylaştırır ve akustiği büyük bir mekânda Gösteri Yapmaya yardımcı olur. Tehditle Zorlama testlerine ve büyük bir mekânda Gösteri Yapmak için yapılan işitsel Gösteri testlerine +1 statü bonusu kazanırsınız. Bu büyüyü Sonlandırabilirsiniz. Güçlendirilmiş (5.) Sesiniz 1.200 fit mesafeye kadar net bir şekilde duyulabilir. Güçlendirilmiş (7.) Sesiniz 1 mil mesafeye kadar net bir şekilde duyulabilir.


omen://spell/carryall?source=paizo-pathfinder-player-core-2:
  name: Yük Taşıyıcı
  description: >
    Yük taşımak için bitişiğinizde sihirli güçten küçük bir platform belirir. Görünmezdir veya hayaletsi bir görünüme sahiptir, 2 fit çapındadır ve yerden hemen yukarıda süzülerek 5 fit arkanızdan sizi takip eder. 5 Yüke kadar nesne taşır (üzerine sığabiliyorlarsa). Büyü sona erdiğinde platformun üzerindeki nesneler yere düşer. Platformu zemin boyunca 30 fite kadar hareket ettirmek, yerinde sabit tutmak veya size dönmesini sağlayıp sizi takip etmeye devam ettirmek için büyüyü Sürdürebilirsiniz. Bir yaratık platformun üzerine binmeye çalışırsa, platform aşırı yüklenirse, herhangi biri platformu yerden daha yükseğe kaldırmaya veya zorlamaya çalışırsa ya da platformdan 60 fitten daha fazla uzaklaşırsanız büyü sona erer. Güçlendirilmiş (4.) Platform 10 Yük taşıyabilir, yaratıklar üzerine binebilir ve yalnızca yerde değil havada da asılı kalabilir.


omen://spell/celestial-brand?source=paizo-pathfinder-player-core-2:
  name: Celestial Damga
  description: >
    Hedefin üzerinde ilahi adaletle yüzleşmesi için onu lanetleyen alevli bir sembol belirir. Siz ve müttefikleriniz ona karşı saldırı zarlarınıza ve yetenek testlerinize +1 statü bonusu alırsınız. Mübarek bir yaratık ona her hasar verdiğinde, mübarek yaratık fazladan 1d4 ruh hasarı verir. Hedef ardından 1 dakika boyunca geçici olarak bağışık olur. Güçlendirilmiş (+2) Ruh hasarı 1 artar.


omen://spell/chameleon-coat?source=paizo-pathfinder-player-core-2:
  name: Bukalemun Postu
  description: >
    Hedeflerin hareketsiz kaldıklarında çevrelerine daha yakın olmaları için giysi ve teçhizatlarının en dış katmanının renklerini değiştirirsiniz. Büyüden etkilenen yaratıklar Gizlenmek için yapılan Gizlilik testlerine +3 statü bonusu kazanır. Büyünün sağladığı değişen renk, köklü değişiklikler olsa bile her zaman çevreye uyum sağlayacak şekilde değişir. Büyüden etkilenen herhangi bir teçhizat veya giysi parçası bir yaratıktan çıkarılırsa o yaratık için büyü sona erer. Güçlendirilmiş (6.) Bu büyüden etkilenen bir yaratık, kendisini fark edecek bir yaratığın 30 fit yakınında Sessizce İlerlemek için yaptığı Gizlilik testinde kritik başarısızlık elde ederse, büyü fark edeni hafifçe hipnoz ettiğinden testinde yalnızca başarısız olur. Güçlendirilmiş (8.) 6. derece gibi olup statü bonusu +4 olur.


omen://spell/champions-sacrifice?source=paizo-pathfinder-player-core-2:
  name: Şampiyonun Fedakârlığı
  description: >
    Tetikleyici: Bir müttefik bir Saldırı ile vurulur veya bir müttefik sizi etkilemeyen bir etkiye karşı bir kurtarışta başarısız olur. Bir müttefikle bir bağ kurarak onun yerine zarar görmenizi sağlarsınız. Vuruşun veya başarısız kurtarışın tüm etkileri hedef yerine size uygulanır. Örneğin, hedef bir ateş topuna karşı yapılan bir kurtarışta kritik başarısızlık elde ederse iki kat hasar alırsınız. Bu etkiler, onları herhangi bir şekilde hafifletebilecek sahip olduğunuz tüm dirençleri, bağışıklıkları veya diğer yetenekleri göz ardı eder; ancak siz etkiyi almadan önce hedefin direnç ve bağışıklıkları uygulanır.


omen://spell/charitable-urge?source=paizo-pathfinder-player-core-2:
  name: Hayırseverlik Dürtüsü
  description: >
    Hedefi mülklerini dağıtmaya zorlayarak hayırseverliğin erdemi üzerine konuşursunuz. Hedef bir İrade kurtarışı denemelidir. Hedefin üzerinde hiçbir eşya yoksa büyü başarısız olur. Kritik Başarı Hedef etkilenmez. Başarı Hedef bu dürtüyle mücadele ederken Sersemlemiş 1 olur. Başarısızlık Bir sonraki sırasında, başka bir şey yapmadan önce hedef en yakınındaki yaratığa mülkiyetindeki bir eşyayı sunmalıdır; hedef hangi eşyayı vereceğini kendisi seçer ve sahip olduğu tek eşya şu anda kendisini savunmak için kullandığı bir eşyaysa (örneğin bir çatışma karşılaşması sırasındaki bir silah), eşyayı vermek yerine 1 tur boyunca sersemlemiş olmayı seçebilir. Bu durum hedefin bir eşyayı almak için Etkileşime Girmesini veya en yakın yaratığa ulaşmak için hareket etmesini gerektirebilir ve eşyayı devretmek normal şekilde bir Etkileşime Gir eylemi gerektirir. Kritik Başarısızlık Sürenin 4 tur olması ve hedefin turlarının her birinde başarısızlığın etkilerini tekrarlamak zorunda olması haricinde başarısızlık gibidir. Turlarının her birinin sonunda hedef kalan süreyi 1 tur azaltmak için yeni bir İrade kurtarışı deneyebilir; kritik başarı durumunda etkiler tamamen sona erer.


omen://spell/chilling-spray?source=paizo-pathfinder-player-core-2:
  name: Dondurucu Püskürtme
  description: >
    Açık ellerinizden buzlu parçacıklardan oluşan bir koni fışkırır ve hedefleri bir don tabakasıyla kaplar. Alandaki yaratıklara 2d4 soğuk hasarı verirsiniz; her biri bir Refleks kurtarışı denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarı hasar alır. Başarısızlık Yaratık tam hasar alır ve 2 tur boyunca Hareket Hızına –5 fitlik statü cezası alır. Kritik Başarısızlık Yaratık iki kat hasar alır ve 2 tur boyunca Hareket Hızına –10 fitlik statü cezası alır. Güçlendirilmiş (+1) Hasar 2d4 artar.


omen://spell/chroma-leach?source=paizo-pathfinder-player-core-2:
  name: Renk Sülüğü
  description: >
    Eliniz yıldızların ötesinden gelen imkânsız renklerle parlar ve dokunuşunuz yaşayanların hem rengini hem de canlılığını emer. Hedef bir Dayanıklılık kurtarışı denemelidir; gnom özelliğine sahip yaratıklar bu kurtarışa –2 durumsal ceza alırlar. Kritik Başarı Hedef etkilenmez. Başarı Hedef 1 tur boyunca Güçten Düşmüş 2 olur. Başarısızlık Hedef 1 dakika boyunca Güçten Düşmüş 2 ve İçi Çekilmiş 1 olur. Hedef ayrıca bir uyuşukluk ve can sıkıntısıyla dolar. 1 tur boyunca hedef bir hareket eylemi kullanmaya çalışırsa büyü ZD'nize karşı bir İrade kurtarışında başarılı olmalıdır, aksi takdirde eylem kaybolur; bu etki zihinsel ve duygu özelliklerine sahiptir. Kritik Başarısızlık Başarısızlık gibi, ancak yaratık kalıcı olarak Güçten Düşmüş 2 ve İçi Çekilmiş 2 olur (buna rağmen Sağlam Beden gibi büyüler bu durumları kaldırabilir).


omen://spell/chthonian-wrath?source=paizo-pathfinder-player-core-2:
  name: Khtonik Gazap
  description: >
    Dış Yarıklar'ın bir bölgesinin enerjisini çağırırsınız. Büyünün hasar türleri (biri enerji, biri fiziksel) aşağıdaki tabloda atılan d4 sonucuna göre belirlenir. Konideki her yaratığa ilgili hasar türlerinin her birinden 4d6 hasar verirsiniz (toplam 8d6 hasar).
    Güçlendirilmiş (+1) Her hasar türünün hasarı 1d6 artar.
    Khtonik Gazap — d4; Diyar; Tezahür; Hasar türleri
    1; Gökler; Şimşekler, yıldırımlar ve uçuşan döküntüler; Ezici ve elektrik
    2; Derinlikler; Asit ve iblis kabukları; Asit ve kesici
    3; Donmuş; Dondurucu hava ve buz; Ezici ve soğuk
    4; Volkanik; Sivri volkanik kayalar ve magma; Ateş ve delici

omen://spell/claim-undead?source=paizo-pathfinder-player-core-2:
  name: Hortlağı Sahiplen
  description: >
    Hedef bir hortlağın kontrolünü ele geçirmeye veya sizi efendisi olarak tanımaya zorlamaya çalışırsınız. Hedef başka bir yaratık tarafından kontrol ediliyorsa o kontrolcü kontrolü elinde tutmak için bir İrade kurtarış dener; aksi takdirde hedefin kendisi bir İrade kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedef emirlerinizle savaşırken 1 tur boyunca Sersemlemiş 1 ve Kafası Karışmış olur. Başarısızlık Hedef sizin tarafınızdan kontrol edilir ve emirlerinizi dinler. Kendisi (veya daha önce onu kontrol eden yaratık) turlarının her birinin sonunda yeni bir İrade kurtarışı deneyebilir; bir başarı durumunda büyü sona erer ve yaratık 1 tur boyunca Sersemlemiş 1 ve Kafası Karışmış olur. Açıkça kendine zarar verici bir emir verirseniz hedef siz yeni bir emir verene kadar hareket etmez. Kritik Başarısızlık Başarısızlık gibi, ancak hedef (veya daha önce onu kontrol eden yaratık) yalnızca doğasına aykırı yeni bir emir verirseniz yeni bir kurtarış hakkı elde eder.


omen://spell/clinging-shadows-stance?source=paizo-pathfinder-player-core-2:
  name: Yapışkan Gölgeler Duruşu
  description: "Yapışkan gölgeler duruşuna geçersiniz. Gölge kavraması Saldırıları yapabilirsiniz. Bunlar 1d4 hiçlik hasarı verir; brawling grubundadır; ve agile, grapple, reach ile unarmed özelliklerine sahiptir. Yapışkan gölgeler duruşundayken, Kavrama yapmak için Atletizm testlerine ve yaratıkların sizden Kurtulma ZD'sine +2 durumsal bonus kazanırsınız."

omen://spell/cloak-of-colors?source=paizo-pathfinder-player-core-2:
  name: Renkler Pelerini
  description: >
    Girdap gibi dönen renklerden oluşan bir pelerin hedefi sarar. Bitişiğindeki yaratıklar Gözü Kamaşmış olur ve hedefe saldırmak parlak bir ışık parlamasına neden olur. Hedefe bir yakın dövüş saldırısıyla vuran bir yaratık bir İrade kurtarışı denemelidir. Yaratık ardından sırasının sonuna kadar geçici olarak bağışık olur; bu etki etkisizleştirme özelliğine sahiptir. Başarı Saldırgan etkilenmez. Başarısızlık Saldırgan 1 tur boyunca Kör olur. Kritik Başarısızlık Saldırgan 1 tur boyunca Sersemlemiş olur.


omen://spell/clone?source=paizo-pathfinder-player-core-2:
  name: Klon
  description: >
    Ritüel boyunca hazır bulunması gereken ve büyücülerden biri olabilen hedeften saç, tırnak kırpıntıları ile deri ve kan örnekleri toplarsınız. Daha sonra bu örnekleri kullanarak hedefin ölüm anında ruhunu barındıracak fiziksel formunun bir kopyasını büyütürsünüz. Bu kopya fiziksel olarak orijinal yaratıkla aynıdır. Ritüeli gerçekleştirmek için genişletilmiş bir simyacı laboratuvarına veya üstün bir ekipman setine ihtiyacınız vardır. Ritüel başarıyla tamamlandıktan sonra kopya, laboratuvar ekipmanı içinde 2d4 ay boyunca büyür. Bu büyüme döneminde doğrudan müdahale gerekmese de her türlü müdahaleyi veya kesintiyi önlemelisiniz, aksi takdirde ritüel başarısız olur. Kopya tamamlandığında, ruh özgür ve istekli olduğu sürece orijinal yaratığın ruhu orijinal bedenleri ölür ölmez veya aradan geçen aylar içinde yaratık öldüyse hemen kopyanın içine girer. Pharasma hedefin vaktinin geldiğine karar verdiyse ya da hedefin ruhu tuzağa düşürüldüyse veya geri dönmek istemiyorsa, engel ortadan kaldırılana kadar kopya boş kalır. Boş durumdayken çürümesini önlemek için hareketsiz kopya uygun simyasal ekipmanda korunmalıdır. Kritik Başarı Klonlama işlemi başarılıdır. Ruh tamamlanan klonu işgal ettiğinde 1 hafta boyunca Sakar 1, İçi Çekilmiş 1, Lanetlenmiş 1 ve Güçten Düşmüş 1 olur; bu durumlar hafta geçene kadar hiçbir şekilde kaldırılamaz veya azaltılamaz. Başarı Kritik başarı gibi, ancak her bir durum değeri 2'dir. Başarısızlık Klonu oluşturamazsınız. Kritik Başarısızlık Klon başarılı görünür ancak bir şeyler korkunç derecede ters gitmiştir. Tam boyutuna ulaştığında hedefin ruhunu tutamaz ve bunun yerine kötü niyetli bir zekâya veya istilacı bir yaratığa (güçlü bir iblis gibi) ev sahipliği yapar.


omen://spell/collective-transposition?source=paizo-pathfinder-player-core-2:
  name: Toplu Yer Değiştirme
  description: >
    Hedefleri alan içindeki yeni konumlara ışınlarsınız. Yaratıkların her biri yeni alanlarına sığabilmeli ve konumları boş, tamamen alan içinde ve görme hattınızda olmalıdır. İstemeyen yaratıklar bir İrade kurtarışı deneyebilir. Kritik Başarı Hedef isterse ışınlanabilir, ancak menzil içindeki varış noktasını kendisi seçer. Başarı Hedef etkilenmez. Başarısızlık Hedefi siz ışınlarsınız ve varış noktasını siz seçersiniz. Güçlendirilmiş (+1) Hedef sayısı 1 artar.


omen://spell/concordant-choir?source=paizo-pathfinder-player-core-2:
  name: Uyumlu Koro
  description: >
    Tek bir hedefe odaklanan veya birçok düşmana hasar vermek için yayılan tehlikeli bir yankılanan ses uyumu salıverirsiniz. Bu Büyüyü Yaparken harcadığınız eylem sayısı hedeflerini, menzilini, alanını ve diğer parametrelerini belirler. 1 eylem: Büyü, basit bir Dayanıklılık kurtarışı ile tek bir düşmana 1d4 sonik hasar verir. 2 eylem (manipülasyon): Büyü, basit bir Dayanıklılık kurtarışı ile bir patlama içindeki tüm yaratıklara 2d4 sonik hasar verir. 3 eylem (manipülasyon): Büyü, basit bir Dayanıklılık kurtarışı ile bir yayılma içindeki tüm yaratıklara 2d4 sonik hasar verir. Güçlendirilmiş (+1) Hasar 1 eylemli versiyon için 1d4 veya diğer versiyonlar için 2d4 artar.


omen://spell/confusing-colors?source=paizo-pathfinder-player-core-2:
  name: Şaşırtıcı Renkler
  description: >
    Havada çağlayan gibi dökülen, sürekli değişen renklerden oluşan bir bulut belirir. Bulutun içindeki yaratıklar Gözü Kamaşmış olur; aynı şekilde bulutun alanının 20 fit yakınındakiler de gözü kamaşmış olur. Bir yaratık büyüyü yaptığınızda bulutun içindeyse, buluta girerse, turunu bulutun içinde bitirirse veya bulut üzerinde bir Ara ya da Etkileşime Gir eylemi kullanırsa bir İrade kurtarışı denemelidir. Şu anda buluttan etkilenen bir yaratığın yeni kurtarışlar denemesi gerekmez. Başarı Yaratık etkilenmez. Başarısızlık Yaratığın 1d4 tur boyunca Kafası Karışır. Kritik Başarısızlık Yaratık 1d4 tur boyunca Sersemlemiş olur. Sersemlemiş durumu sona erdikten sonra yaratığın kafası büyünün kalan süresi boyunca karışır.


omen://spell/containment?source=paizo-pathfinder-player-core-2:
  name: Muhafaza Altına Alma
  description: >
    İster onu korumak ister etrafındakileri korumak için olsun, bir yaratığı hareketsiz bir güç alanına sararsınız. Alan; hedef de dâhil olmak üzere içinden geçecek saldırıları, etkileri ve yaratıkları engeller. Alanın Sertliği 10, Can Puanı 40'tır ve kritik vuruşlara ile zayıf nokta hasarına karşı bağışıklığı vardır. Muhafaza altına almanın hedefi isteksizse, etkiler hedefin Refleks kurtarışına bağlıdır. Kritik Başarı Hedef oluşurken alandan kaçarak çökmesine neden olur. Başarı Alan 40 yerine 10 Can Puanı ile kısmen oluşur. Başarısızlık Alan normal etkisini gösterir. Güçlendirilmiş (+1) Alanın Can Puanı başarıda 5, başarısızlıkta 15 daha yüksektir.


omen://spell/corrosive-muck?source=paizo-pathfinder-player-core-2:
  name: Korozif Balçık
  description: "Alan 10 fitlik iki patlama içindeki tüm kareler. İçinden yürüyen herkesin hareketini engelleyen asidik balçıktan iki su birikintisi yaratırsınız. Her bir havuzun alanı daha büyük zorlu arazi hâline gelir. Bir yaratığın havuzlardan birinde turuna başladığı veya kullandığı bir hareket eylemi sırasında bir havuza girdiği her tur, yaratık temel bir Refleks kurtarışıyla 8d6 asit hasarı alır. Kurtarışta kritik başarısız olan bir yaratık ayrıca 1d6[acid,persistent] alır. Normalde olduğu gibi, Büyük veya daha büyük bir yaratık turuna her iki havuzda birden başlarsa hasarı yalnızca bir kez alır. Yükseltilmiş (+2) İlave bir 10 fitlik patlama yaratırsınız."

omen://spell/countless-eyes?source=paizo-pathfinder-player-core-2:
  name: Sayısız Göz
  description: Dokunulan yaratığın vücudunun her yerinde gözler oluşarak aynı anda her yöne bakmasını sağlar. Özne, büyünün süresi boyunca kuşatılamaz. Buna ek olarak, özne Arama yaparken başarılı olduğunda bunun yerine kritik başarı elde eder.

omen://spell/crashing-wave?source=paizo-pathfinder-player-core-2:
  name: Çarpan Dalga
  description: >
    Sizden uzağa doğru süpüren çarpan bir dalga çağırırsınız. Alandaki yaratıklara 6d6 ezici hasar verirsiniz. Su ayrıca alandaki büyüsel olmayan yangınları söndürür. Güçlendirilmiş (+1) Hasar 2d6 artar.


omen://spell/curse-of-lost-time?source=paizo-pathfinder-player-core-2:
  name: Kayıp Zaman Laneti
  description: >
    Hedefi hızlı yaşlanma veya erozyonla lanetlersiniz. Etki hedefin bir nesne, bir yapı veya yaşayan bir yaratık olmasına bağlıdır. Eserler ile değerli malzemelerden yapılmış nesneler ve yapılar (GM tarafından belirlendiği üzere) bağışıktır. Nesne: Nesne taşınıyorsa taşıyıcısı bir Dayanıklılık kurtarışı deneyebilir. Taşıyıcı başarısız olursa veya nesne sahipsizse, nesne hemen 4d6 hasar alır (Sertlik normal şekilde uygulanır) ve eşya sınırsız bir süreyle lanetlenir. Lanet sona erene kadar eşya kusurlu hâle gelir ve Tamir Edilemez; ayrıca lanet nesnenin Can Puanlarını geri kazandıracak herhangi bir büyüyü etkisizleştirmeye çalışır. İlleti Temizle bu büyüden etkilenen bir nesneyi hedef alabilir. Yapı: Yapı 4d6 hasar alır (basit Dayanıklılık kurtarışı). Başarısızlık durumunda yapı 1 saat boyunca Sakar 1 ve Güçten Düşmüş 1 olur ve Tamir Edilemez; ayrıca lanet yapının Can Puanlarını geri kazandıracak herhangi bir büyüyü etkisizleştirmeye çalışır. Kritik başarısızlık durumunda bu etkiler sınırsız bir süreye sahiptir. Yaşayan Yaratık: Yaşayan yaratık bir Dayanıklılık kurtarışı denemelidir. Yaşlanmayan yaratıklar bağışıktır. Kritik Başarı Yaşayan yaratık etkilenmez. Başarı Yaşayan yaratık kısa süreliğine yaşlanır, 1 tur boyunca Sakar 1 ve Güçten Düşmüş 1 olur. Başarısızlık 1 saatlik bir süre ile başarı gibi. Kritik Başarısızlık Sınırsız bir süre ile başarı gibi. Güçlendirilmiş (+1) Hasar 1d6 artar.


omen://spell/delay-affliction?source=paizo-pathfinder-player-core-2:
  name: İlleti Geciktir
  description: >
    Bir iyileştirici enerji dalgasıyla hedefi tehdit eden bir illete karşı koyar ve az miktarda iyileşme sağlarsınız. Hedef 3d8 Can Puanı geri kazanır. Hedefin sahip olduğunu bildiğiniz herhangi bir illeti etkisizleştirmeye çalışırsınız; başarı durumunda onu kaldırmak yerine etkilerini 1 saat boyunca askıya alırsınız. Hedef ardından 1 gün boyunca illeti geciktire karşı geçici olarak bağışık olur. Belirli illetin adını tanımlamış olmanız gerekmez, ancak farkında olmanız gerekir; örneğin, zehrin farkında olmadığınız sürece sindirilen bir zehri başlangıç süresi boyunca geciktiremezsiniz. Güçlendirilmiş (+1) Hedef fazladan 1d8 Can Puanı geri kazanır ve ilave bir illeti askıya almayı deneyebilirsiniz.


omen://spell/diabolic-edict?source=paizo-pathfinder-player-core-2:
  name: Şeytani Ferman
  description: Hedefin belirli bir görevi yerine getirmesini talep eden ve yerine getirilmesi karşılığında ödüller sunan şeytani bir ferman yayınlarsınız. Hedef, görevi yerine getirmeyle ilgili saldırı zarlarına ve yetenek testlerine +1 statü bonusu kazanır. Bildirdiğiniz görevi yerine getirmeyi reddederse bunun yerine tüm saldırı zarlarına ve yetenek testlerine –1 statü cezası alır.

omen://spell/dismantle?source=paizo-pathfinder-player-core-2:
  name: Parçala
  description: >
    Bir nesneye dokunursunuz ve anında kendisini bileşen parçalarına ayırır. Hedef bileşen parçalardan yoksunsa (tek bir taş bloktan oyulmuş bir heykel gibi) büyü başarısız olur ve bunu bir bubi tuzağı veya kapan gibi tehlikeli bir nesne üzerinde kullanmak genellikle onu tetikler. Nesne Kırık durumunu kazanır ve bileşen parçalar normal giysi ve zırh altında Gizlenecek kadar küçülür. Büyüyü Sonlandırabilirsiniz. Büyü sona erdiğinde nesne orijinal formunda kendisini yeniden birleştirir; elleriniz boşsa elinizde veya ellerinizde, aksi takdirde önünüzdeki yerde belirir. Yeniden birleştirildikten sonra nesne Kırık durumunu kaybeder ve Can Puanları Büyüyü Yaptığınız sırada nesnenin sahip olduğu değere geri döner. Güçlendirilmiş (4.) Büyü 10 dakika sürer. Güçlendirilmiş (6.) Büyü bir sonraki günlük hazırlıklarınıza kadar sürer.


omen://spell/dragon-breath?source=paizo-pathfinder-player-core-2:
  name: Ejderha Nefesi
  description: >
    Ağzınızdan enerji püskürterek basit bir Refleks kurtarışı ile 5d6 hasar verirsiniz. Hasar türü kan bağınızı etkileyen ejderhayla ilgili büyü geleneğine bağlıdır. Güçlendirilmiş (+1) Hasar 2d6 artar.


omen://spell/dragon-wings?source=paizo-pathfinder-player-core-2:
  name: Ejderha Kanatları
  description: >
    Sırtınızdan kösele gibi kanatlar çıkarak size 60 fitlik veya Hızınızdan hangisi daha hızlıysa o kadar bir uçma Hareket Hızı kazandırır. Bu büyünün süresi sona erdiğinde hâlâ uçuyorsanız Yumuşak İniş'in etkilerinde olduğu gibi yere süzülürsünüz. Güçlendirilmiş (8.) Süre 10 dakikaya çıkar.


omen://spell/drain-life?source=paizo-pathfinder-player-core-2:
  name: Yaşam Em
  description: >
    Elinizi kapatır ve başka bir yaratıktan yaşam enerjisini kendinize çekersiniz. Bu durum 3d4 hiçlik hasarı verir; hedef basit bir Dayanıklılık kurtarışı denemelidir. Hedefin kurtarışı çözdükten ve varsa bir kan büyüsü etkisi uyguladıktan sonra hedefin aldığı hasara eşit miktarda geçici Can Puanı kazanırsınız. Hedefin Can Puanı verdiğiniz hasardan daha düşükse, bunun yerine kalan Can Puanlarına eşit miktarda geçici Can Puanı kazanırsınız. Geçici Can Puanları 1 dakika sürer. Güçlendirilmiş (+1) Hasar 1d4 artar.


omen://spell/dread-secret?source=paizo-pathfinder-player-core-2:
  name: Dehşet Sırrı
  description: >
    Hedef yaratıkların temel doğasıyla çelişen güçlü bir sır söylersiniz. Bilgi Hatırla veya hedeflerle önceki deneyimleriniz nedeniyle hedeflerden birinin veya daha fazlasının sahip olduğuna inandığınız sayısal bir değere sahip belirli bir direnç veya zaaf seçin (örneğin ateşe karşı direnç veya gümüşe karşı zaaf). Belirli bir hedef için bilgi yanlışsa büyü o hedef üzerinde hiçbir etki göstermez. Etkilenen hedefler bir İrade kurtarış denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Bir zaaf seçtiyseniz yaratık seçtiğiniz zaaf türü veya özelliğiyle eşleşen 1 hasar alır (böylece yaratığın zayıflığını tetikler); bir direnç seçtiyseniz bir sonraki sıranızın sonuna kadar direncini kaybeder. Başarısızlık Başarı gibi olup yaratık dehşet sırrının açığa çıkmasından dolayı Korkmuş 1 olur. Kritik Başarısızlık Yaratığın Korkmuş 3 olması haricinde başarısızlık gibidir.


omen://spell/dream-council?source=paizo-pathfinder-player-core-2:
  name: Düş Meclisi
  description: Bu Büyüyü Yaptığınızda siz de dâhil olmak üzere herhangi bir hedef hemen uykuya dalmayı seçebilir. Uykuya dalmayı seçmeyen yaratıklar için büyü sona erer. Uyuyanlar aynı odadaymış gibi birbirleriyle iletişim kurabilecekleri paylaşılan bir rüyaya katılırlar. Bireysel hedefler uyandıklarında bu paylaşılan rüyadan ayrılırlar ve tüm hedefler uyanırsa büyü sona erer.

omen://spell/drop-dead?source=paizo-pathfinder-player-core-2:
  name: Ölü Numarası
  description: >
    Tetikleyici: Menzil içindeki bir yaratık bir düşmanın saldırısıyla vurulur. Hedef aslında Görünmez hâle gelmesine rağmen ölmüş gibi yere düşer. İnandırıcı bir ölümcül yara ile tamamlanmış yanılsama cesedi düştüğü yerde kalır. Bu yanılsama ölü bir beden gibi görünür ve hissedilir. Hedefin ölümü absürt görünüyorsa (örneğin tam sağlıktaki bir barbarın 2 hasarla katledilmiş gibi görünmesi) GM saldırgana yanılsamaya inanmamak için acil bir algı testi hakkı tanıyabilir. Hedef düşmanca eylemler kullanırsa büyü sona erer. Bu durum tüm büyüyü sona erdirir, böylece yanılsama ceset de kaybolur. Güçlendirilmiş (7.) Hedef düşmanca bir eylem kullanırsa büyü sona ermez.


omen://spell/dull-ambition?source=paizo-pathfinder-player-core-2:
  name: Hırsı Körelt
  description: >
    Hedefi her fırsatta kendi hedeflerini istemeden baltaladığından, azim ve hırs gerektiren hayatının tüm yollarında başarısız olması için lanetlersiniz. Etki, hedefin İrade kurtarışına dayanır. Kritik Başarı Hedef etkilenmez. Başarı 1 saat boyunca hedef inisiyatif zarlarında iki kez atar ve daha düşük olan sonucu kullanır. Başarısızlık 1 gün boyunca hedef inisiyatif zarlarında ve bir dinlenme faaliyeti başarısını belirlemek için yapılan herhangi bir testte iki kez atar ve daha düşük sonucu kullanır. Kritik Başarısızlık Başarısızlık gibi, ancak süre sınırsızdır.


omen://spell/déjà-vu?source=paizo-pathfinder-player-core-2:
  name: Dejavu
  description: Hedefin zihninde bir düşünce sürecini döngüye sokarak onu bir anlık eylemlerini tekrarlamaya zorlarsınız. Hedef bir İrade kurtarışı denemelidir. Hedef başarısız olursa bir sonraki sırasında hangi eylemleri kullanırsa kullansın sonraki sırasında bunları tekrarlamalıdır. Eylemler aynı sırayla ve mümkün olduğunca aynı ayrıntılara yakın şekilde tekrarlanmalıdır. Örneğin, hedef bir vuruş yaparsa mümkünse aynı yaratığa karşı saldırıyı tekrarlamalıdır ve hedef hareket ederse sonraki sırasında mümkünse aynı mesafede ve yönde hareket etmelidir. Hedef tükenmiş bir Büyü Yapmak veya ölmüş bir yaratığı hedef alma gereksinimi gibi bir eylemi tekrarlayamazsa o eylem için dilediği gibi hareket edebilir ancak sırasının sonuna kadar Zihni Uyuşmuş 1 olur.

omen://spell/elemental-blast?source=paizo-pathfinder-player-core-2:
  name: Elementel Patlama
  description: >
    Alan: patlama, koni veya çizgi Elementel enerjiyi toplar ve seçtiğiniz listelenen çeşitli biçimlerden birinde düşmanlarınıza patlatarak 8d6 hasar verirsiniz. Bu büyü elementel etkinize göre hasar verir (örneğin hava için kesici veya ateş için ateş) ve elementinizin özelliğine sahiptir. Güçlendirilmiş (+1) Hasar 2d6 artar.


omen://spell/elemental-motion?source=paizo-pathfinder-player-core-2:
  name: Elementel Hareket
  description: >
    Sizi itmesi için elementinizi çağırır, elementinize bağlı olarak Hareket Hızınızı artırırsınız. Bu büyü elementinizin özelliğine sahiptir. Hava: Hızınıza eşit bir uçma Hareket Hızı kazanırsınız. Toprak: 10 fitlik bir kazma Hızı kazanırsınız. Ateş: Hızınıza eşit bir uçma Hareket Hızı kazanırsınız. Metal: 10 fitlik bir kazma Hızı kazanırsınız. Su: Hızınıza eşit bir yüzme Hareket Hızı kazanırsınız ve su altında nefes alabilirsiniz. Tahta: Hızınıza eşit bir tırmanma Hareket Hızı kazanırsınız. Güçlendirilmiş (6.) Hızlarınıza ayrıca +10 fitlik statü bonusu kazanırsınız. Güçlendirilmiş (9.) Statü bonusu +20 fite yükselir.


omen://spell/elemental-toss?source=paizo-pathfinder-player-core-2:
  name: Elementel Fırlatma
  description: >
    Bileğinizin bir hareketiyle düşmanınıza elementel maddenizden bir parça fırlatırsınız. Bir menzilli büyü saldırı zarı atın; başarı durumunda 1d8 hasar ve kritik başarı durumunda iki kat hasar verir. Bu büyü elementel etkinize göre hasar verir (örneğin hava için kesici veya ateş için ateş) ve elementinizin özelliğine sahiptir. Güçlendirilmiş (+1) Hasar 1d8 artar.


omen://spell/embrace-nothingness?source=paizo-pathfinder-player-core-2:
  name: Hiçliği Kucakla
  description: Vücudunuzu maddeden arındırarak hiçlikle bir olursunuz. Seviyenize eşit fiziksel hasar direnci kazanırsınız. Normal Hareket Hızınızın yarısıyla hareket edersiniz, ancak herhangi bir yönde (yukarı ve aşağı dâhil) hareket edebilirsiniz. Hareket ederken gizlenmeye sahip olursunuz. Sizin turunuz değilken ve turunuz sırasında hareket özelliğine sahip bir eylem yapana kadar Görünmez olursunuz. 2 fitten daha kalın olmadıkları sürece katı cansız nesnelerin içinden geçebilirsiniz.

omen://spell/embrace-the-pit?source=paizo-pathfinder-player-core-2:
  name: Çukuru Kucakla
  description: >
    Kafatası kemiğinizden şeytan boynuzları çıkar ve cildiniz şeytani kan bağınızdan sorumlu olan şeytanın özelliklerini alır. Ateşe ve zehre karşı 5 direnç ve fiziksel hasara karşı 1 direnç (gümüş hariç) kazanırsınız. Güçlendirilmiş (+2) Ateş ve zehir direnci 5 artar ve fiziksel hasar direnci (gümüş hariç) 2 artar.


omen://spell/extend-blood-magic?source=paizo-pathfinder-player-core-2:
  name: Kan Büyüsünü Uzat
  description: Kanınızda dolaşan arkana enerjiyi çağırarak sağladığı büyüyü uzatırsınız. Bir sonraki eyleminiz size en az 1 tur süren bir kan büyüsü etkisi sağlayan bir Büyü Yapmaksa, siz veya bir hedef kan büyüsü etkisini ilave bir tur boyunca kazanırsınız. Aynı anda yalnızca bir uzatılmış kan büyüsü etkisine sahip olabilirsiniz.

omen://spell/faerie-dust?source=paizo-pathfinder-player-core-2:
  name: Peri Tozu
  description: >
    Büyünün alanına sihirli toz serpiştirerek içeridekilerin kandırılmasını kolaylaştırırsınız. Alandaki her yaratık bir İrade kurtarışı denemelidir. Büyüyü Yaparken kullandığınız her ilave eylem için patlamanın yarıçapını 5 fit artırırsınız. Başarı Yaratık etkilenmez. Başarısızlık Yaratık tepkileri kullanamaz ve Dikkat testleri ile İrade kurtarışlarına –2 statü cezası alır. Kritik Başarısızlık Başarısızlık gibi olup yaratık ayrıca 1 dakika boyunca Dikkat testleri ve İrade kurtarışlarına –1 statü cezası alır. Güçlendirilmiş (+3) Başlangıç yarıçapı 5 fit artar.


omen://spell/familiars-face?source=paizo-pathfinder-player-core-2:
  name: Tanıdığın Yüzü
  description: Hedef bir kehanet duyargasına dönüşerek onun gözlerinden görmenizi, kokladığını koklamanızı ve benzer şekilde diğer duyularını kullanmanızı sağlar. Bu büyü etkinken Görünmeyeni Gör gibi duyularınızı etkileyen ifşa özelliğine sahip bir Büyü Yaparsanız, büyünün faydasını kendi duyularınız yerine hedefin duyuları aracılığıyla elde edersiniz. Ayrıca hedefin homurtularının veya ciyaklamalarının tını ve karakterinin bir kısmını alsa da hedefin aracılığıyla sesinize çok benzeyen bir sesle konuşabilirsiniz. Bu büyüyü Sürdürmenin bir parçası olarak hedef üzerinde Hayvana Emret eylemini kullanabilirsiniz. Bu Büyüyü Yaptığınızda hedefinize yönelik görüş hattına veya etki hattına ihtiyacınız yoktur.

omen://spell/fantastic-facade?source=paizo-pathfinder-player-core-2:
  name: Fantastik Cephe
  description: >
    Alan: merkezinde sizin olduğunuz 1 mile kadar yarıçaplı daire. Ritüelin yapıldığı anda içindeki yapıların, arazinin ve yaratıkların görünümünü, sesini, dokusunu ve kokusunu seçerek hedef yerleşim yerinin üzerine kalıcı bir karmaşık yanılsama dizisi çizersiniz. Mevcut yapıların ve yaratıkların görünümünü değiştirebilir ve yanılsama yapılar veya yaratıklar ekleyebilirsiniz. Örneğin, hedef alandaki her şeyin ve herkesin yeşil görünmesini sağlayabilir, yerleşimi dışarıdan gizleyen sık bir gölgeliğe sahip yanılsama bir orman yaratabilir veya boş kalıntıların sakinleri olan el değmemiş yerler gibi görünmesini sağlayabilirsiniz. Cepheyi oluşturduğunuzda hangi yanılsama unsurların durağan kalacağını (rüzgârda dalgalanan bayraklar gibi temel doğal hareketlerle sınırlı) ve hangilerinin temel bir programı izleyeceğini (örneğin bando takımıyla birlikte kasaba meydanında günlük bir geçit töreni) belirlersiniz. Cepheyi oluşturduktan sonra programları değiştiremezsiniz. Yaratıkları 3. dereceden bir yanılsama kılık ile aynı etkilerle dilediğiniz gibi kamufle edebilirsiniz. Cepheden etkilenen bir yaratık alandan ayrılırsa onu etkileyen yanılsamalar 1 gün sonra kaybolur. Ritüeli yaparken yeni gelenlerin yanılsamalar tarafından kamufle edilip edilmeyeceğine ve kılığın hemen mi yoksa 1 haftaya kadar belirlenen bir süreden sonra mı ortaya çıkacağına siz karar verirsiniz. Hedef yerleşim yeriyle cephenin yanılsama doğasını düşündürecek veya ortaya çıkaracak şekilde etkileşime giren bir yaratık (örneğin cepheden etkilenen bir binayı boyamaya çalışmak veya yanılsama bir yapıya tırmanmak gibi) yanılsamaya inanmamayı deneyebilir. Büyünün yarattığı yanılsamalar zararsızdır, bu yüzden yanılsama bir lav nehri hasara yol açmaz ya da yanılsama bir gül çalısındaki dikenler birine batamaz. Kritik Başarı Cepheyi açıklandığı gibi yaratırsınız ve cephenizdeki programları yeniden programlamak için 1 gün harcayarak değiştirebilirsiniz. Başarı Cepheyi açıklandığı gibi yaratırsınız. Başarısızlık Yanılsamalarınız başarısız olur ve ritüelin hiçbir etkisi olmaz. Kritik Başarısızlık Ritüeliniz, binalarda beklenmedik ve yavaş yavaş değişen renkler, hoş olmayan kokular ve iskeletler gibi görünen yaratıklar gibi planladığınızdan farklı beklenmedik ve kontrolsüz yanılsamalar üretir. Bu etkiler 1 ay sonra kaybolur. Güçlendirilmiş (10.) Masraf 100.000 gp'ye çıkar ve yarıçap 5 mile kadar olabilir.


omen://spell/fey-disappearance?source=paizo-pathfinder-player-core-2:
  name: Peri Kayboluşu
  description: >
    Görünmez olursunuz ve doğal zorlu araziyi (çalılar gibi) göz ardı edersiniz. Kullandığınız herhangi bir düşmanca eylem bu görünmezliği sona erdirir, ancak doğal zorlu araziyi göz ardı etmeye devam edersiniz. Güçlendirilmiş (5.) Düşmanca bir eylem kullanırsanız görünmezlik sona ermez.


omen://spell/fey-glamour?source=paizo-pathfinder-player-core-2:
  name: Peri Cazibesi
  description: Bir alanı veya hedefleri yanılsamayla örtmek için peri cazibesini çağırırsınız. Bu durum peri cazibesinin menzilini ve süresini kullanarak, fey glamour derecesinden 1 derece daha düşük bir dereceye güçlendirilmiş gibi alan üzerinde Yanılsama Sahne veya yaratıklar üzerinde Yanılsama Kılık etkisine sahiptir.

omen://spell/final-sacrifice?source=paizo-pathfinder-player-core-2:
  name: Son Kurban
  description: >
    Siz ve uşağınız arasındaki bağ aracılığıyla yıkıcı enerjileri kanalize ederek onun şiddetle patlamasına neden olursunuz. Hedef anında katledilir ve patlama, basit bir Refleks kurtarışı ile 20 fit yakınındaki yaratıklara 6d6 ateş hasarı verir. Hedefin soğuk veya su özelliği varsa büyü ateş hasarı ve ateş özelliği yerine soğuk hasarı verir ve soğuk özelliğine sahip olur. Hortlak bağla tarafından komuta edilen bir hortlak gibi geçici olarak kontrolünü ele geçirdiğiniz bir yaratığı hedef alarak bu büyüyü yapma girişimi otomatik olarak başarısız olur ve kontrol etkisini bozar. Güçlendirilmiş (+1) Hasar 2d6 artar.


omen://spell/flaming-fusillade?source=paizo-pathfinder-player-core-2:
  name: Alevli Yaylım Ateşi
  description: >
    Minyatür güneşler gibi etrafınızda patlayan bir dizi patlama olan sonsuz bir alev yaylımı çağırırsınız. Alevli yaylım ateşini yapmanın bir parçası olarak Tutuşturma yaparsınız. Alevli yaylım ateşi süresi boyunca tutuşturmanın büyü yapma süresi 2 eylemden 1'e düşer. Güçlendirilmiş (9.) Süre boyunca tutuşturma tarafından verilen hasara, alevli yaylım ateşinin büyü derecesine eşit bir statü bonusu da kazanırsınız.


omen://spell/flurry-of-claws?source=paizo-pathfinder-player-core-2:
  name: Pençe Yaylımı
  description: >
    Acımasız ejderha pençeleri belirir ve yakındaki iki düşmana saldırır. Her yaratığa karşı bir büyü saldırı zarı atın. Bu durum çoklu saldırı cezanız için iki saldırı sayılır, ancak her iki saldırıyı da yapana kadar ceza artmaz. İsabet hâlinde yaratık 1d8 kesici hasar ve kan bağınızı etkileyen ejderhayla ilgili büyü geleneğine göre belirlenen bir türde 1d4 ilave hasar alır: arkana güç, ilahi ruh, okült zihinsel veya ilksel ateş. Güçlendirilmiş (+1) Başlangıç hasarı 1d8 artar ve ilave hasar 1d4 artar.


omen://spell/fortifying-brew?source=paizo-pathfinder-player-core-2:
  name: Güçlendirici İksir
  description: >
    Canlandırıcı bir çay, ferahlatıcı bir bira veya uyarıcı bir simyasal tonik gibi büyük miktarda onarıcı içecek üretirsiniz. Ritüel, şarap yapmak için meyveleri fermente etmek gibi içeceği üretmeye yönelik tüm doğal süreçleri hızlandırır. Ritüelin ilk 3 saatinin sonunda, herhangi biri ritüelin ikincil büyücü olabilecek 10 kişiye kadar içecek üretirsiniz. İçecek daha sonra sonraki bir saat içinde tüketilmelidir. İçecek alkollü olsa bile içenlerin sarhoş olma tehlikesi yoktur. Bu bir saat tamamlandığında siz ve ikincil büyücü testlerinizi normal şekilde denersiniz. Kritik Başarı İçecek lezzetli ve canlandırıcıdır. Birincil yetenek testi bonusunuzu etkisizleştirme bonusu olarak kullanarak, ilgili her bir illet veya durum için her bir içene 4. dereceden bir İlleti Temizle, 4. dereceden bir Berrak Zihin ve 4. dereceden bir Sağlam Beden yapar. Her bir içen ayrıca 12 saat süren 20 geçici Can Puanı ve sonraki 12 saat boyunca hastalıklara ve zehirlere karşı kurtarışlara +2 statü bonusu kazanır. Başarı İçenlerin yalnızca 10 geçici Can Puanı kazanması ve kurtarışlara statü bonusu kazanmaması haricinde kritik başarı gibidir. Başarısızlık Siz ve diğer içenler ekşi bir tatla baş başa kalırsınız; mayalama sürecinde bir şeyler ters gitmiştir. Kritik Başarısızlık İçeceği üretme girişiminiz bir zehre daha yakın bir şeyle sonuçlanmıştır. Siz ve diğer içenler Midesi Bulanmış 4 olursunuz ve 12 saat boyunca durumu azaltamazsınız. Güçlendirilmiş (+1) Geçici Can Puanları 2 artar (veya kritik başarıda 4).


omen://spell/fungal-infestation?source=paizo-pathfinder-player-core-2:
  name: Mantar İstilası
  description: >
    Zehirli sporlar alandaki yaratıkların üzerine üşüşerek onların grotesk mantar oluşumlarıyla kaplanmasına neden olur. Bu zararlı oluşumlar 2d6 süren zehir hasarı verir ve her yaratık bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Hedef süren zehir hasarının yarısını alır. Başarısızlık Hedef süren zehir hasarının tamamını alır. Bu süren zehir hasarını aldığı sürece ateşe karşı 1 zayıflığa ve kesici hasara karşı 1 zayıflığa sahiptir. Kritik Başarısızlık İki kat süren zehir hasarı olması haricinde başarısızlık gibidir. Bu süren zehir hasarını aldığı sürece ateşe karşı 2 zayıflığa ve kesici hasara karşı 2 zayıflığa sahiptir. Güçlendirilmiş (+2) Süren hasar 2d6 artar ve zaaf 1 artar (veya kritik başarısızlıkta 2).


omen://spell/gale-blast?source=paizo-pathfinder-player-core-2:
  name: Fırtına Esintisi
  description: >
    Uzatılmış ellerinizden rüzgâr akar ve 5 fitlik bir yayılma içinde etrafınızda döner. Alandaki her yaratık bir Dayanıklılık kurtarışı ile 1d6 ezici hasar alır. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarı hasar alır. Başarısızlık Yaratık tam hasar alır ve sizden 5 fit uzağa itilir. Kritik Başarısızlık Yaratık iki kat hasar alır ve sizden 10 fit uzağa itilir. Güçlendirilmiş (+1) Hasar 1d6 artar.


omen://spell/gathering-call?source=paizo-pathfinder-player-core-2:
  name: Toplanma Çağrısı
  description: >
    Ritüeli gerçekleştirdiğiniz ve sığınak olarak anılan belirli güvenli konuma kendinizi ve müttefiklerinizi bağlarsınız. Bu durum katılımcıların daha sonra sadece bir kelime söyleyerek geri dönmelerine olanak tanır. Başarı Sığınakla bağlantıyı kurarsınız. Ritüeldeki herhangi bir katılımcı ritüeli Sonlandırabilir. Bunu yaptıklarında, tüm katılımcılar sığınakla aynı düzlemde oldukları sürece herhangi bir mesafeden sığınağa hemen dönebilirler. Her katılımcı ritüelin yapılışı sırasında durduğu konumda varır. Kelime söylendiğinde diğer tüm katılımcılar bunu bilir ve her biri o anda sığınağa dönüp dönmemeyi seçebilir. Ritüel daha sonra hemen sona erer. Başarısızlık Katılımcılar ile sığınak arasındaki bağlantıyı kuramazsınız ve ritüelin başarısız olduğunun farkındasınızdır. Kritik Başarısızlık Ritüel yanlışlıkla başka bir düzlemdeki bir konumla bağlantı kurar. Büyücüler bu yanlış hizalamanın farkında değildir. Kelime söylendiğinde tüm ritüel katılımcıları bu düzlemler ötesi konuma kaydırılır. Güçlendirilmiş (+1) Masraf 5.000 gp artar, ritüel bir yaratığı daha hedef alabilir ve hedef alabileceği azami yaratık seviyesi 2 artar.


omen://spell/ghostly-tragedy?source=paizo-pathfinder-player-core-2:
  name: Hayaletsi Trajedi
  description: "Bu büyü, yerel ruhları, farkında olduğunuz ve Büyüyü Yaparken adlandırdığınız yakın geçmişteki şiddetli bir olayı yeniden canlandırmaya zorlar. Birincil kurbanın rolünü siz üstlenirsiniz. Canlandırma, kurbanın ölümüne veya yaralanmasına yol açan son 9 dakikayı ve sonraki bir dakikayı oynatır. Ruhlar form değiştirmez, bu nedenle bu durum faillerin görünüşlerinden tespit edilmesine yardımcı olmaz. Olay için gerekli olan kayıp yaratıkların ruhani formları gerektiğinde tezahür eder ve kayıp eşyalar gölgeli hatlar olarak belirir. Sahne sona erdiğinde sahnede yer alan her hayaletsi görüntü için 2d6[void] hasar alırsınız (genellikle kurban dışındaki olaya dahil olan yaratıkların sayısına eşittir). Siz de dahil olmak üzere hayaletsi canlandırmayı gözlemleyen herhangi bir yaratık, yeni ipuçları ve bilgiler keşfetmek amacıyla olayı araştırmak için testler deneyebilir."

omen://spell/ghoulish-cravings?source=paizo-pathfinder-player-core-2:
  name: Gul Aşermesi
  description: >
    Çiğ et yeme yönünde karşı konulmaz bir arzu aşılamak için hedefe dokunursunuz. Hedef bir İrade kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedef davetsiz açlığından dolayı Midesi Bulanmış 1 olur. Başarısızlık Hedef Midesi Bulanmış 2 olur ve önce biraz çiğ et tüketene kadar bu durumu midesi bulanmış 1'in altına düşüremez; yaratığın çiğ ete erişimi yoksa bir Etkileşime Gir eylemi olarak erişim mesafesindeki bir cesetten bir ısırık alabilir. Kritik Başarısızlık Başarısızlık gibi, ancak hedef çiğ et tüketene kadar durumu midesi bulanmış 2'nin altına düşüremez.


omen://spell/gluttons-jaws?source=paizo-pathfinder-player-core-2:
  name: Oburun Çenesi
  description: >
    Bir hedefin altında salyalar akıtan bir çene açılır ve ondan bir ısırık almaya çalışır. Bir büyü saldırı zarı atın. İsabet hâlinde ağız 2d6 delici hasar verir ve bir sonraki sıranızın başlangıcına kadar süren 1d4 geçici Can Puanı kazanırsınız. Güçlendirilmiş (+1) Hasar 2d6 artar ve geçici Can Puanları 1d4 artar.


omen://spell/grasping-grave?source=paizo-pathfinder-player-core-2:
  name: Kavrayan Mezar
  description: >
    Alandaki yerden yüzlerce iskelet kol fışkırır, içindeki yaratıkları tırmalar ve onları yerinde tutmaya çalışır. İskelet kollar 6d6 kesici hasar verir. Alandaki her yaratık bir Refleks kurtarışı denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarı hasar alır. Başarısızlık Yaratık tam hasar alır ve 1 tur boyunca Hareket Hızına –10 fitlik durumsal ceza alır. Kritik Başarısızlık Yaratık iki kat hasar alır ve 1 tur boyunca ya da Kurtulana kadar Hareketsiz Kılınır. Güçlendirilmiş (+1) Hasar 2d6 artar.


omen://spell/gravity-well?source=paizo-pathfinder-player-core-2:
  name: Yerçekimi Kuyusu
  description: Alışılmadık bir yerçekimi küresi yaratırsınız. Alandaki tüm yaratıklar ve sabitlenmemiş nesneler, Refleks kurtarışlara bağlı olarak merkeze doğru hareket eder. Bu, zorlanmış hareket kurallarını takip eder. Kürenin merkezine yakın yeterli alan yoksa merkeze daha yakın olan yaratıklar ve nesneler önce hareket eder, diğerleri ise kurtarış sonuçlarıyla belirlenen miktara kadar engellenmeden gidebildikleri kadar uzağa hareket eder. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık merkeze doğru 5 fit hareket eder. Başarısızlık Yaratık merkeze doğru 15 fit hareket eder. Kritik Başarısızlık Yaratık merkeze doğru 30 fit hareket eder.

omen://spell/grisly-growths?source=paizo-pathfinder-player-core-2:
  name: Tüyler Ürpertici Urlar
  description: "Bu korkunç büyü; parmakların eller çalılara benzeyene kadar çoğalması, tuhaf yerlerde gözlerin açılması, vücudun yan tarafından bacakların fırlaması veya başka bir sonuç olsun, hedefin fazla uzuvlar ve organlar büyütmesine neden olur. Yeni unsurlar patlak verdikçe hedef 10d6 delici hasar (temel Dayanıklılık kurtarış) alır. Bu büyünün balçık veya protean gibi değişken bir anatomiye sahip veya uzuvsuz bir hedef üzerinde hiçbir etkisi yoktur. Urlar hızla çürür ve 1 tur sonra düşer. Ayrıca ilk hedef kritik başarı elde etmedikçe, hedef de dâhil olmak üzere hedefin 30 fiti içindeki yaratıklar İrade kurtarışlar denemelidir; ardından tüyler ürpertici urların bu ikincil etkisine karşı 1 saat boyunca geçici olarak bağışık olurlar. Bu ek etki zihinsel ve görsel bir etkidir. Başarı Yaratık etkilenmez. Başarısızlık Yaratık Midesi Bulanmış 1 olur. Kritik Başarısızlık Yaratık Midesi Bulanmış 2 olur. dereceli (+1) Hasar 2d6 artar."

omen://spell/harmonize-self?source=paizo-pathfinder-player-core-2:
  name: Öz Uyum
  description: "Büyüyü yaptığınızda sizin tarafınızdan seçilen aşağıdaki yollardan biriyle kendinizi iyileştirirsiniz. 8 Can Puanı kazanırsınız. Sizi etkileyen bir zehri veya hastalığı iyileştirmeye çalışırsınız; musibeti etkisiz kılmayı deneyin. dereceli (+1) Can Puanı kazanmayı seçerseniz, kazanılan Can Puanı 8 artar."

omen://spell/haunting-hymn?source=paizo-pathfinder-player-core-2:
  name: Ürkütücü İlahi
  description: Yalnızca alandaki yaratıkların duyabileceği sarsıcı bir ilahiyi yankılarsınız. İlahi, temel bir Dayanıklılık kurtarış ile 1d8 sonik hasar verir. Bir hedef kurtarışta kritik başarısızlık elde ederse 1 dakika boyunca Sağır da olur. Kademeli (+2) Hasar 1d8 artar.

omen://spell/heartbond?source=paizo-pathfinder-player-core-2:
  name: Gönül Bağı
  description: Ritüelin ikincil büyücüleri olan ve birbirlerine karşı samimi bir sevgi beslemesi gereken iki veya daha fazla istekli yaratık arasında büyülü bir bağın oluşturulmasını yönetirsiniz. Ritüelin bir parçası olarak bağın tüm üyeleri, ortak bağlarını sembolize etmek için bir yüzük, muska veya benzeri bir nişane alır. Nişaneyi takmadıklarında ritüelin etkilerini kaybederler ve nişanelerden biri yok edilirse bağ kopar. Başarılı bir gönül bağı ritüelinden yararlanan yaratıklar, daha sonra gerekli zamanı harcayarak ve iki maliyetin farkını ödeyerek yeni testler gerektirmeksizin ritüelin yükseltilmiş bir versiyonuna katılabilirler. Bir yaratık aynı anda birden fazla gönül bağı ritüelinin etkisi altında olabilir. Kritik Başarı Günde bir kez, bağlanan her yaratık, odaklanma özelliğine sahip 2 eylemli bir faaliyeti kullanarak bağlı olan diğer bir yaratığın o anki durumunu öğrenebilir. Yaratık, diğer yaratığın yönünü ve mesafesini ve onu etkileyen tüm durumları bilir. Her katılımcı mesaj büyüsünü istediği zaman bir ilahi özgü büyü olarak yapabilir, ancak yalnızca başka bir katılımcıyı hedefleyebilir. Başarı Kritik başarıdaki gibi, ancak bağlanan yaratıklar mesaj büyüsünü ilahi özgü büyü olarak yapamaz. Başarısızlık Ritüelin hiçbir etkisi yoktur. Kritik Başarısızlık Büyü geri tepmesi katılımcılar arasında uyumsuz bir enerji yaratır. 1 hafta boyunca her ikincil büyücü, başka bir ikincil büyücünün 30 fiti içinde olduğu her an Sakar 2 ve Zihni Uyuşmuş 2 olur. dereceli (6.) Maliyet ikincil büyücü başına 300 gp'ye çıkar. Bir başarıda ikincil büyücüler kalıcı olarak 6. derece telepati büyüsünün etkilerini kazanırlar, ancak yalnızca birbirleriyle.

omen://spell/hellfire-plume?source=paizo-pathfinder-player-core-2:
  name: Cehennem Ateşi Sütunu
  description: Aşağıdan patlak veren, 4d6 ateş hasarı ve 4d6 ruh hasarı veren bir cehennem ateşi sütunu çağırırsınız. Kademeli (+1) Ateş ve ruh hasarı 1d6'şar artar.

omen://spell/heros-defiance?source=paizo-pathfinder-player-core-2:
  name: Kahramanın Meydan Okuyuşu
  description: Tetikleyici Bir saldırı sizi 0 Can Puanına indirecektir. Meydan okuyarak haykırırsınız ve bir iyileşme patlamasıyla dolarsınız. Saldırının hasarını uygulamadan hemen önce 6d8+20 Can Puanı geri kazanırsınız. Eğer bu miktar saldırının sizi 0 Can Puanına indirmesini önlemeye yetiyorsa Bilinçsiz veya Ölmekte olmazsınız. Her iki durumda da ölümden kaçmak zordur ve Yeniden Odaklanana veya günlük hazırlıklarınızı yapana kadar kahramanın meydan okuyuşunu tekrar kullanamazsınız. Kahramanın meydan okuyuşu, ölüm özelliğine sahip veya parçalama gibi geride kalıntı bırakmayacak etkilere karşı kullanılamaz.

omen://spell/holy-cascade?source=paizo-pathfinder-player-core-2:
  name: Mübarek Çağlayan
  description: "Mübarek suyu güçlendirmek için mübarek enerjiyi çağırır ve onu inanılmaz bir mesafeye fırlatırsınız. Su çağlayanından kaynaklanan alandaki yaratıklara 3d6 gürz hasarı veren muazzam bir patlamayla infilak eder. Su, alandaki şerli özelliğine sahip yaratıklara ilave ((spell rank*2)-2)d6[spirit] hasar verir. Yükseltilmiş (+1) Gürz hasarı 1d6 artar ve ilave ruh hasarı 2d6 artar."
  requirements: bir şişe mübarek su

omen://spell/horrific-visage?source=paizo-pathfinder-player-core-2:
  name: Korkunç Çehre
  description: Düşmanlarınıza korku salarak hatlarınızı kısa bir süreliğine bir cadının korkunç çehresine dönüştürürsünüz. Alandaki düşmanlar bir İrade kurtarış denemelidir. Başarı Düşman etkilenmez. Başarısızlık Düşman Korkmuş 1 olur. Kritik Başarısızlık Düşman Korkmuş 2 olur. Kademeli (5.) Alandaki düşmanlar bir başarıda Korkmuş 1, bir başarısızlıkta Korkmuş 2 ve bir kritik başarısızlıkta Korkmuş 3 ve 1 tur boyunca Kaçan olur. Bir kritik başarıda yine de etkilenmezler.

omen://spell/ice-storm?source=paizo-pathfinder-player-core-2:
  name: Buz Fırtınası
  description: "Yaratıkları buzlu bir sağanakla döven gri bir fırtına bulutu yaratırsınız. Büyüyü Yaptığınızda, büyülü bir dolu patlaması bulutun altındaki alandaki her bir yaratığa 2d8 gürz hasarı ve 2d8 soğuk hasarı verir (temel Refleks kurtarışı). Kar ve sulusepken, büyünün süresinin geri kalanı boyunca alana yağmaya devam ederek alanı zorlu arazi hâline getirir. Turunu fırtınanın içinde bitiren herhangi bir yaratık (floor(spell rank/2))[cold] hasar alır. Bu Büyüyü açık havada Yaparsanız, bir bulut yerine birbiriyle örtüşmeyen iki bulut yaratabilirsiniz. Normalde olduğu gibi, Büyük veya daha büyük bir yaratık her iki bulutun içinde yer alıyorsa, başlangıç hasarını yine yalnızca bir kez ve devam eden hasarı tur başına bir kez alır. Yükseltilmiş (+2) Başlangıçtaki gürz hasarı ve soğuk hasarı 1d8 artar ve yaratıkların turlarının sonunda aldıkları soğuk hasarı 1 artar."

omen://spell/imaginary-lockbox?source=paizo-pathfinder-player-core-2:
  name: Hayali Kasa
  description: "Bir kabı ve içindekileri, zihninizde depolanan, yalnızca sizin görebileceğiniz ve etkileşime girebileceğiniz hayali bir forma dönüştürürsünüz. Kabın fiziksel özellikleri—yapıldığı malzeme, kilitleri veya diğer özellikleri—bu büyünün yapılışıyla alakasızdır ancak kap hiçbir yaratığı barındıramaz. Kabın Yükü yoktur ve içindeki her şeyi gözünüzde canlandırabilirsiniz. Odaklanma ve manipüle etme özelliklerine sahip, 3 eylem alan bir faaliyet olarak kasadan bir eşya çıkarabilirsiniz. Eşyaları geri koymak mümkün değildir. Büyüyü Sonlandırabilirsiniz. Büyü sona erdiğinde kap normal durumuna döner; sığabiliyorsa ellerinizde, sığmıyorsa yanınızdaki zeminde belirir."

omen://spell/imprint-message?source=paizo-pathfinder-player-core-2:
  name: Mesaj Nakşet
  description: Hedef nesneye psişik titreşimler yansıtarak onu kendi tasarladığınız kısa bir mesajla veya duygusal bir temayla nakşedersiniz. Nakşedilen bu his, hedef nesneye Nesne Okuma yapan bir yaratığa açığa çıkar ve eşyanın tanık olduğu duygusal olayların yerini alır. Nesne bir Geriye Bakış büyüsünün alanındaysa, nakşedilen mesajlar zaman çizelgesinde büyük olaylar olarak görünür ancak diğer vizyonlara müdahale etmez. Nesneye mesaj nakşetten daha yüksek büyü derecesine sahip Aurayı Oku büyüsü hedeflenirse, büyücü nesnenin büyülü olarak değiştirildiğini öğrenir. Bu Büyüyü Yaptığınızda, önceki mesaj nakşet büyüleriyle bir nesneye yerleştirilen önceki titreşimler kaybolur.

omen://spell/incendiary-aura?source=paizo-pathfinder-player-core-2:
  name: Yanıcı Aura
  description: "Kendinizi yanıcı bir aurayla sararsınız. Yayılma alanı içindeki bir yaratık her ateş hasarı aldığında alev alır ve (ceil(spell rank/2)+1)d4[persistent,fire] hasar alır. Yükseltilmiş (+2) Süregelen hasarı 1d4 ve yayılma alanının yarıçapını 5 fit artırırsınız."

omen://spell/inner-upheaval?source=paizo-pathfinder-player-core-2:
  name: İçsel Çalkantı
  description: "Qinizi yıkıcı büyülü saldırılara odaklarsınız. Silahsız bir Saldırı veya Darbe Yağmuru yapın (bu, tur başına yalnızca bir gösteriş kullanma sınırını değiştirmez). Saldırılarla yapılan saldırı zarlarınıza +1 statü bonusu kazanırsınız ve Saldırılar 1d6 ekstra hasar verir. Bu hasar her Vuruş Yaptığınızda seçilen aşağıdaki türlerden biri olabilir: kuvvet, ruh, canlılık veya boşluk. dereceli (+4) Ekstra hasar 1d6 artar."

omen://spell/interstellar-void?source=paizo-pathfinder-player-core-2:
  name: Yıldızlararası Boşluk
  description: "Düşmanınıza korkunç bir ayaz getirmek için uzayın dondurucu derinliklerine başvurursunuz. Hedef, dondurucu boşluğa bürünür; bu da temel bir Dayanıklılık kurtarış ile hemen ve gelecekteki turlarda Büyüyü Sürdürdüğünüz her turun ilk seferinde 3d6 soğuk hasarı verir. Hedef, etki sürdüğü müddetçe Bitkindur. dereceli (+1) Soğuk hasarı 1d6 artar."

omen://spell/inveigle?source=paizo-pathfinder-player-core-2:
  name: Aklını Çel
  description: "Hedefin zihnini kazanırsınız, sizi yakın ve güvenilir bir dost olarak görmesine ve her önerinizi makul bulmasına neden olursunuz. Hedef size karşı yardımseverdir, bu yüzden size yardım etmek için elinden geleni yapacaktır. Diğer tüm yardımsever yaratıklarda olduğu gibi ondan isteyebileceklerinizin de sınırları vardır. Hediften doğasına tamamen aykırı veya hedefe ya da çıkarlarına gereksiz yere zarar verecek bir şey yapmasını isterseniz, yalnızca reddetmekle kalmaz, aynı zamanda etkiyi erken sonlandırmak için bir İrade kurtarış da deneyebilir. Yapılış süresi ve menzili nedeniyle, hedef istekli olmadıkça (belki de ritüelin başka bir etkisi olacağına ikna edilmiş) veya zapt edilmedikçe bu ritüeli yapmak genellikle zordur. Yaratık ritüeli kabul etmek istemiyorsa etkiyi yok saymak için bir İrade kurtarış deneyebilir. Kritik Başarı Ritüel başarılı olur ve hedef, etkiyi sonlandırmak için yapılan İrade kurtarışlara -4 statü cezası alır. Başarı Ritüel başarılı olur. Başarısızlık Ritüel başarısız olur. Kritik Başarısızlık Ritüel başarısız olur ve hedef bunun yerine sizden nefret ederek süre boyunca size karşı düşmanca hâle gelir. dereceli (6.) Maliyetin içinde kullanılan yağlara karıştırdığınız yaratığın vücudundan bir parçaya sahip olduğunuz sürece, yapılış boyunca 1 mile kadar uzaktaki bir yaratık üzerinde aklını çeli kullanabilirsiniz. Taban maliyet 100 gp'dir. Süre daha kısadır ve yaratığın vücudunun ne kadar büyük bir parçasını kullandığınıza bağlıdır: kan, saç, pul ve benzeri için 1 hafta ya da bir el veya benzer şekilde önemli bir vücut parçası için 1 ay."

omen://spell/invisible-item?source=paizo-pathfinder-player-core-2:
  name: Görünmez Eşya
  description: "Nesneyi Görünmez kılarsınız. Bu, nesneyi tüm yaratıklar için Konumu Saptanmamış hâle getirir; ancak yaratıklar hedefi bulmaya çalışabilir ve başarılı olurlarsa nesne onlar için Gizlenmiş hâle gelir. Eşya düşmanca bir eylemin parçası olarak kullanılırsa o düşmanca eylem tamamlandıktan sonra büyü sona erer. Bir silahı görünmez kılmak, görünmez fırlatılan bir silahın veya mühimmatın saldırganın saklandığı yer hakkında mutlaka bilgi vermeden saldırı için kullanılabilmesi dışında (silah saldırgana geri dönmediği sürece) saldırıya genellikle herhangi bir avantaj sağlamaz. dereceli (3.) Süre, bir sonraki günlük hazırlıklarınızı yapana kadardır. dereceli (7.) Süre sınırsızdır."

omen://spell/jealous-hex?source=paizo-pathfinder-player-core-2:
  name: Kıskanç Nazar
  description: "Bir hedefin en büyük niteliğini elinden almak için bir cadının doğuştan gelen kıskançlığını ortaya çıkarırsınız. Hedef, en yüksek nitelik değiştiricisine bağlı olarak olumsuz bir durumla lanetlenir: Kuvvet (Güçten Düşmüş); Çeviklik (Sakar); Bünye (İçi Çekilmiş); veya Zekâ, Sezgi ya da Karizma (Zihni Uyuşmuş). Beraberlik durumunda yaratık, berabere kalan niteliklerle ilişkili durumlardan hangisini alacağına karar verir. Hedef bir İrade kurtarış denemelidir. Turlarınızın her birinin başında hedef, bir başka İrade kurtarış deneyebilir ve bir başarıda etkiyi sonlandırabilir. Başarı Hedef etkilenmez. Başarısızlık Durumun değeri 1'dir. Kritik Başarısızlık Durumun değeri 2'dir."

omen://spell/lay-on-hands?source=paizo-pathfinder-player-core-2:
  name: El Basma
  description: "Elleriniz; yaşayan bir yaratığı iyileştirebilen veya bir ölümsüz yaratığa dokunuşla hasar verebilen güçlü bir canlılıkla dolar. İstekli Yaşayan Yaratık Hedef 6 Can Puanı geri kazanır. Hedef kendinizden başka biriyse 1 tur boyunca SD'ye +2 statü bonusu da kazanır. Ölümsüz Yaratık Hedef temel bir Dayanıklılık kurtarış ile 1d6 canlılık hasarı alır; bir başarısızlıkta hedef 1 tur boyunca SD'ye –2 statü cezası da alır. Kademeli (+1) İyileşme miktarı 6 artar ve ölümsüz hedefe verilen hasar 1d6 artar."

omen://spell/leaden-steps?source=paizo-pathfinder-player-core-2:
  name: Kurşun Adımlar
  description: Bir düşmanın ayaklarını kısmen hantal metal plakalara dönüştürerek adımlarını yavaşlatırsınız. Hedef bir Dayanıklılık kurtarış dener. Kritik Başarı Hedef etkilenmez. Başarı Hedef bir sonraki sıranızın sonuna kadar Aşırı Yüklü olur ve elektriğe karşı zaaf 2'ye sahip olur. Büyü sürdürülemez. Başarısızlık Hedef aşırı yüklü olur ve elektriğe karşı zaaf 2'ye sahip olur. Kritik Başarısızlık Hedef aşırı yüklü olur ve elektriğe karşı zaaf 3'e sahip olur. dereceli (+1) Zaaf 1 artar.

omen://spell/life-giving-form?source=paizo-pathfinder-player-core-2:
  name: Can Veren Form
  description: "Fiziksel formunuzun ötesine geçerek bir şifa enerjisi fenerine dönüşürsünüz. Vücudunuz meşale gibi parlak bir ışık yayar. Zayıf nokta hasarına karşı direnç 5 ve boşluk hasarına karşı zaaf 5 kazanırsınız; silahsız Vuruşlarınız fazladan 1d4 dirim hasarı verir. Yaşayan bir yaratığa (spell rank)d8[healing,vitality]:true Can Puanı yenilemek için bir Etkileşim eylemiyle dokunabilirsiniz ve bir yaratık size bir Etkileşim eylemiyle dokunduğunda aynı iyileşmeyi kazanmasına izin verebilirsiniz; her iki durumda da yaratık 1 dakika boyunca can veren formun iyileştirmesine karşı geçici olarak bağışık hâle gelir. Bu bir dirimsel iyileştirme etkisidir. Can veren form ile kendinizi iyileştiremezsiniz. Dirim hasarından zarar gören (hortlak gibi) ve size dokunan veya silahsız bir saldırı ya da erişimsiz bir yakın dövüş silahıyla size hasar veren bir yaratık bunun yerine (3d4 + (spell rank - 6))[vitality] hasar alır ve geçici olarak bağışık hâle gelmez. Bu büyüyü Sonlandırabilirsiniz. Yükseltilmiş (+1) Bir Etkileşim eylemiyle yenilenen Can Puanı 1d8 artar, dirim hasarı 1 artar ve direnç ile zaaf 1 artar."

omen://spell/life-link?source=paizo-pathfinder-player-core-2:
  name: Yaşam Bağı
  description: "Siz ve hedefiniz arasında bir yaşam enerjisi bağı kurarak zararı ikiniz arasında paylaştırırsınız. Büyüyü ilk Yaptığınızda hedef 1d4 Can Puanı geri kazanır. Hedefin her sırada hasar aldığı ilk seferde aldığı hasarı 3 azaltın (en az 0 hasara inecek şekilde). Her defasında 3 Can Puanı veya 3'ten azsa verilen toplam hasar kadar kaybedersiniz; bu hasar sahip olduğunuz tüm bağışıklıkları veya dirençleri yok sayar ve başka hiçbir şekilde hafifletilemez. Bilinçsiz kalırsanız büyü hemen sona erer. Büyüyü Sonlandırabilirsiniz. dereceli (3.) Sizden başka 2 yaratığı hedefleyebilirsiniz. Başlangıçtaki iyileşme 3d4 Can Puanına çıkar ve azaltılan maksimum hasar ile kaybedilen Can Puanı 5'e yükselir. dereceli (6.) Sizden başka 3 yaratığı hedefleyebilirsiniz. Başlangıçtaki iyileşme 6d4 Can Puanına çıkar ve azaltılan maksimum hasar ile kaybedilen Can Puanı 10'a yükselir. dereceli (9.) Sizden başka 4 yaratığı hedefleyebilirsiniz. Başlangıçtaki iyileşme 9d4 Can Puanına çıkar ve azaltılan maksimum hasar ile kaybedilen Can Puanı 15'e yükselir."

omen://spell/lifewood-cage?source=paizo-pathfinder-player-core-2:
  name: Canodunu Kafesi
  description: "Yaratılış Ocağı'ndan gelen canlılık enerjisiyle bezenmiş sertleştirilmiş ahşaptan hareketsiz, Görünmez bir hapishane yaratırsınız. Kafes; her biri yarım inç kalınlığında ve yarım inç aralıklı ahşap dallardan yapılmış 20 fitlik bir küptür. Kafesi yarattığınız alandaki her yaratık bir Refleks kurtarış denemelidir. Böyle bir yaratık başarısız olursa kafesin içine hapsolur. Başarılı olursa kafesin dışına, kendi seçtiği bir alana itilir. Alandaki bir yaratık hapishanenin içine sığmayacak kadar büyükse büyü otomatik olarak başarısız olur. Kafes SD 10'a, Sertlik 20'ye ve 40 Can Puanına sahiptir ve boşluk hasarına karşı zaaf 5'i olmasına rağmen kritik vuruşlara ve zayıf nokta hasarına karşı bağışıktır. Parmaklıklar arasındaki boşluktan geçebilen bir yaratık (genellikle Minik bir yaratık) çıkabilir; diğerlerinin tümü içeride hapsedilir. Ahşaba sinen canlılık enerjisi, bedensiz ölümsüz yaratıkların kirişlerin arasından geçmesini engeller. Parmaklıkların arasına sığmayacak kadar büyük bir silahla yapılan saldırılar kafesten geçemez ve parmaklıklar, boşluklardan geçebilen saldırılara karşı bile standart siper sağlar. Büyüler ve çoğu alan etkisi (ejderha nefesi gibi) kafesten engelsizce geçebilir."

omen://spell/lightning-storm?source=paizo-pathfinder-player-core-2:
  name: Şimşek Fırtınası
  description: "Siyah, gürleyen bir fırtına bulutu yaratırsınız ve büyünün alanı içine bir şimşek oku çağırırsınız. Ok, fırtına bulutunun tepesinden aşağıdaki yere kadar uzanan dikey bir hattır ve hattaki yaratıklara 4d12 elektrik hasarı verir (temel Refleks kurtarış). Sonraki turlarda, her tur Büyüyü Sürdürdüğünüz ilk seferde alan içinde başka bir şimşek oku çağırabilirsiniz. Bu Büyüyü açık havada Yaparsanız, bir yerine birbiriyle örtüşmeyen iki bulut yaratabilirsiniz; ancak yine de tur başına yalnızca bir ok çağırabilirsiniz. dereceli (+2) Her okun hasarı 1d12 artar."

omen://spell/live-wire?source=paizo-pathfinder-player-core-2:
  name: Canlı Tel
  description: "Düşmanınıza doğru saldıran, elektrik akımıyla vızıldayan keskin bir bakır filaman uzunluğu çağırırsınız. Tel, hedefin SD'sine karşı yaptığınız büyü saldırı zarınıza bağlı olarak 1d4 kesici hasar ve 1d4 elektrik hasarı verir. Kritik Başarı Hedef iki kat hasar ve (ceil(spell rank / 2))d4[persistent,electricity] hasar alır. Başarı Hedef tam hasar alır. Başarısızlık Hedef elektrik hasarını alır, ancak kesici hasarı almaz. Kritik Başarısızlık Hedef etkilenmez. Yükseltilmiş (+2) Kesici hasar, başlangıçtaki elektrik hasarı ve kritik vuruştaki süregelen elektrik hasarı 1d4 artar."

omen://spell/medusas-wrath?source=paizo-pathfinder-player-core-2:
  name: Medusa Gazabı
  description: "Bir medusanın taşlaştırıcı gücüyle dolu bir vuruş yaparsınız. Aşağıdaki ek etkilerle silahsız bir Vuruş Yapın. Kritik Başarı Hedef Yavaşlamış 2 olur ve her sırasının sonunda bir Dayanıklılık kurtarış denemelidir; bu devam eden kurtarış incapacitation özelliğine sahiptir. Başarısız bir kurtarışta yavaşlamış durumu 1 artar (kritik başarısızlıkta 2). Başarılı bir kurtarma yavaşlamış durumunu 1 azaltır. Bir yaratık medusa gazabından kaynaklanan yavaşlamış durumu nedeniyle eylemde bulunamadığında kalıcı olarak Taşlaşmış olur. Yaratık taşlaşırsa veya yavaşlamış durumu kaldırılırsa büyü sona erer. Başarı Kritik başarıdaki gibi, ancak hedef başlangıçta Yavaşlamış 1 olur."

omen://spell/moonlight-bridge?source=paizo-pathfinder-player-core-2:
  name: Ay Işığı Köprüsü
  description: "Işıltılı, parıldayan ay ışığından bir köprü çağırırsınız. 10 fit genişliğindeki açıklık menzil içindeki bir noktada zeminden başlamalıdır ve 120 fite kadar ya düz bir çizgide ya da yukarı veya aşağı 45 dereceye kadar herhangi bir açıda yatay bir düzlem olarak uzanır. Bu köprü SD 10'a, Sertlik 30'a ve 60 Can Puanına sahiptir ve tüm hasarlara (kuvvet, ruh ve Hayalet Dokunuşu özellik rününe sahip Saldırılardan gelen hasar hariç) bağışıktır. Siz ve müttefikleriniz köprüyü normal şekilde geçebilirsiniz, ancak diğer yaratıklar bunu yapmaya çalışırlarsa içinden geçip giderler. Köprü; yukarıdan veya aşağıdan olsun, fiziksel, eterik ve bedensiz saldırıların geçişini engeller. Büyüyü Sonlandırabilirsiniz. dereceli (+1) Köprünün uzunluğu 20 fit artar, Can Puanı 20 artar ve açıklığın genişliğini 5 fite kadar daha artırabilirsiniz."

omen://spell/mud-pit?source=paizo-pathfinder-player-core-2:
  name: Çamur Çukuru
  description: 1 fit derinliğinde kalın, yapışkan çamur zemini kaplar. Çamur zorlu arazidir.

omen://spell/natures-enmity?source=paizo-pathfinder-player-core-2:
  name: Doğanın Düşmanlığı
  description: "Alandaki hayvanlar, bitkiler ve mantarlar hedeflere karşı cephe alır. Her hedef, alanda kaldığı sürece aşağıdaki etkilerden muzdarip olur. Bitki örtüsü her yüzeyden fışkırarak her hedefe, bitkilerin ve mantarların bitişiğinde olduğu her an Hızına –10 fitlik durumsal ceza verir. Saldırgan hayvanlar tahmin edilemez şekilde saldırır. Sırasının başlangıcında her hedef bir flat|dc:8 atar. Başarısızlık durumunda 2d10[slashing] hasar veren yaratıklar tarafından saldırıya uğrar. Hedef temel bir Refleks kurtarışı dener ve kritik başarı dışındaki herhangi bir sonuçta 1 tur boyunca Gafil kalır. Hedef, doğayla veya doğal yaratıklarla olan tüm bağını kaybeder. Hedef herhangi bir ilksel büyü yapırken bir flat|dc:5 testinde başarılı olmalıdır, aksi takdirde büyü başarısız olur. Dahası; hayvan, mantar ve bitki yaratıkları, yoldaş hayvan gibi hedefle güçlü bağı olan biri bile olsa hedefe karşı düşmanca hâle gelir. GM, bir doğa tanrısının elçisi gibi bazı yaratıkları doğanın gazabına maruz bırakamayacağınıza karar verebilir."

omen://spell/noxious-vapors?source=paizo-pathfinder-player-core-2:
  name: Zararlı Buharlar
  description: Sizi geçici olarak görüşten gizleyen zehirli bir duman bulutu yayarsınız. Büyüyü Yaptığınızda alanda bulunan siz hariç her yaratık 1d6 zehir hasarı alır (temel Dayanıklılık kurtarış). Kurtarışta kritik başarısızlık elde eden bir yaratık Midesi Bulanmış 1 da olur. Alandaki tüm yaratıklar Gizlenmiş hâle gelir ve dumanın dışındaki tüm yaratıklar dumanın içindeki yaratıklara karşı gizlenmiş hâle gelir. Bu duman güçlü bir rüzgârla dağıtılabilir. dereceli (+1) Hasar 1d6 artar.

omen://spell/object-reading?source=paizo-pathfinder-player-core-2:
  name: Nesne Okuma
  description: GM tarafından belirlenen, geçmiş bir hafta içinde nesneyi ilgilendiren duygusal bir olay hakkında bir bilgi öğrenmek için elinizi bir nesnenin üzerine koyarsınız. Aynı eşyaya birden fazla kez nesne okuma yaparsanız, ya o olay hakkında ek bilgiler edinmek için tek bir olaya odaklanabilir ya da geçerli zaman dilimindeki başka bir duygusal olay hakkında bir bilgi edinebilirsiniz. Kademeli (2.) Son bir ay içinde meydana gelmiş bir olay hakkında bilgi edinebilirsiniz. Kademeli (4.) Son bir yıl içinde meydana gelmiş bir olay hakkında bilgi edinebilirsiniz. Kademeli (6.) Son on yıl içinde meydana gelmiş bir olay hakkında bilgi edinebilirsiniz. Kademeli (8.) Son bir yüzyıl içinde meydana gelmiş bir olay hakkında bilgi edinebilirsiniz. Kademeli (9.) Nesnenin tüm tarihi içinde meydana gelmiş bir olay hakkında bilgi edinebilirsiniz.

omen://spell/phantasmal-custodians?source=paizo-pathfinder-player-core-2:
  name: Hayali Muhafızlar
  description: "Alan 100 fit × 100 fit, 20 fite kadar yükseklik Belirli bir konumda temel görevleri yerine getirecek varlıklar oluşturarak Hayali Hizmetkâr'ın uzun ömürlü bir uyarlamasını yaratırsınız. Kritik Başarı Ritüel altı hayali hizmetkâr yaratır. Onlara odaklanmanız gerekmez ve onlar çağrılmış hizmetkârlar değildir. Odaklanma özelliğine sahip bir eylem harcayarak birine temel bir görevi yerine getirmesini emredebilirsiniz; tekrar emredilene kadar görevi yerine getirmeye devam eder. Başarı Kritik başarıdaki gibi, ancak ritüel üç hizmetkâr yaratır. Başarısızlık Ritüel herhangi bir hayali hizmetkâr yaratamaz. Kritik Başarısızlık Ritüel altı hayali hizmetkâr yaratır; ancak bu yaratıklar düşmancadır ve birincil beceri testi için beceri niteleyicinize eşit bir saldırı bonusuyla yumruk Saldırıları yaparak 1d6 kuvvet hasarı verebilirler. Size ve müttefiklerinize saldırırlar ve alan içinde size ve müttefiklerinize ait nesneleri kırmaya çalışırlar. Kademeli (6.) Yok edilirlerse hayali hizmetkârlar ertesi sabah yeniden oluşur. Maliyet 30 gp'ye çıkar."

omen://spell/phantasmal-treasure?source=paizo-pathfinder-player-core-2:
  name: Hayali Hazine
  description: Büyünün menzili içindeki seçtiğiniz bir konumda, hedef için hayal edilebilecek en değerli şeyin hayali bir görüntüsü belirir. Bir eşya yığını, ilahi bir suret ya da çok sevilen bir yakını veya kahraman olsun, hazinenin belirsiz şeklini görebilseniz de hazineyi yalnızca büyünün hedefi görebilir. Hedefin hazineye tepkisi, hedefin İrade kurtarışın sonucuna dayanır. Kritik Başarı Hedef etkilenmez. Başarı Hedef hazineye karşı Kendini Kaptırmış olur ve süre hedefinin sırasının sonuna kadardır. Hedef ayrıca hazineye dokunursa, onu incelemek için Ararsa ya da illüzyon bir kişi veya benzeri gibi görünüyorsa onunla konuşursa illüzyona inanmamayı deneyebilir. Hedef illüzyona inanmazsa büyü sona erer. Başarısızlık Başarıdaki gibi, ancak süre 1 dakikadır. Kritik Başarısızlık Başarıdaki gibi, ancak süre 1 dakikadır. Hedef hazineyi o kadar çekici bulur ki büyü sona erene kadar her eylemini ona odaklanarak harcamalıdır. Bu, hedef hazinenin yanında değilse ona doğru hareket etmeyi ve hedef hazinenin yanındaysa hazineyle Etkileşime Girmeyi içerebilir. (İllüzyon bir kişi veya benzeri gibi görünüyorsa, hedef onunla sohbet etmek için de Etkileşime Girebilir.)

omen://spell/primal-herd?source=paizo-pathfinder-player-core-2:
  name: İlksel Sürü
  description: "Doğal dünyanın gücünü çağırarak hedefleri bir mamut sürüsüne dönüştürürsünüz ve her biri Devasa bir savaş formuna bürünür. Her hedefin içine doğru genişleyebileceği yeterli alana sahip olması gerekir, aksi takdirde büyü o hedef için başarısız olur. Her hedef hayvan özelliği kazanır. Her hedef kendi üzerindeki büyü etkilerini Sonlandırabilir. Dönüşüm sırasında her hedef aşağıdakileri kazanır. SD = 22 + hedefin seviyesi. Zırh kontrol cezasını ve Hız azalmasını yok sayın. 20 geçici Can Puanı. Hız 40 fit. Loş ışıkta görüş. Hedefin Saldırmak için kullanabileceği tek saldırılar olan aşağıdaki silahsız yakın dövüş saldırıları. Bu saldırılarla Saldırırken hedef, en avantajlı silahının veya silahsız Vuruşunun uzmanlık ve eşya bonuslarıyla birlikte saldırı bonusunu kullanır ve hasar her saldırı için listelenmiştir. Bu saldırılar Kuvvet tabanlıdır (örneğin Güçten Düşmüş durumu için). Yakın Dövüş 1 fildişi (erişim 15 fit), Hasar 4d8+19 delici Yakın Dövüş 1 hortum (agile, erişim 15 fit), Hasar 4d6+16 ezici Yakın Dövüş 1 ayak (agile, erişim 15 fit), Hasar 4d6+13 ezici. Hedefin kendi niteleyicisi daha yüksek olmadıkça +30 Atletizm niteleyicisi. Her hedef Çiğne eylemini kullanabilir. Çiğne 3 Hareket Hızınızın iki katına kadar hareket edersiniz ve Büyük veya daha küçük yaratıkların alanından geçerek alanına girdiğiniz her yaratığı çiğnersiniz. Çiğnenen bir yaratık, temel bir Refleks kurtarışa (ZD = 19 + seviyeniz) bağlı olarak ayak Saldırınızdan hasar alır."

omen://spell/protector-tree?source=paizo-pathfinder-player-core-2:
  name: Koruyucu Ağaç
  description: Menzil içindeki boş bir karede aniden Orta boyutlu bir ağaç büyür. Ağacın SD 10'u ve 10 Can Puanı vardır. Ağaca bitişik bir müttefike bir Saldırı ile vurulduğunda ağaç dallarını araya sokar ve hasarı önce alır. Ağacı 0 Can Puanına indirmek için gerekenin ötesindeki ek hasar asıl hedefe verilir. Ağaç karesinden hareketi engelleyecek kadar büyük değildir. Ağaç toprak içindeyse ve büyünün süresinin sonuna kadar hayatta kalırsa sıradan, büyülü olmayan bir ağaç olarak kalır ve büyümeye devam eder. GM belirli elverişsiz durumlarda ağacın hemen yok olduğuna karar verebilir. dereceli (+1) Ağacın ek 10 Can Puanı olur.

omen://spell/puff-of-poison?source=paizo-pathfinder-player-core-2:
  name: Zehir Püfü
  description: "Düşmanın yüzüne doğru parıldayan bir zehirli nefes bulutu üflersiniz. Hedef, Dayanıklılık kurtarışına bağlı olarak 1d4 zehir hasarı ve (ceil(spell rank/2))d4[persistent,poison] alır. Kritik Başarı Yaratık etkilenmez. Başarı Hedef başlangıç hasarının yarısını alır ve süregelen hasar almaz. Başarısızlık Hedef başlangıç ve süregelen hasarın tamamını alır. Kritik Başarısızlık Hedef iki kat başlangıç ve süregelen hasar alır. Yükseltilmiş (+2) Başlangıçtaki zehir hasarı 1d4 artar ve süregelen zehir hasarı 1d4 artar."

omen://spell/qi-blast?source=paizo-pathfinder-player-core-2:
  name: Qi Patlaması
  description: Qinizi 2d6 kuvvet hasarı veren güçlü bir patlama olarak serbest bırakırsınız. Qi patlaması yapmak için 2 eylem kullanırsanız koninin boyutunu 30 fite ve hasarı 3d6'ya çıkarın. Qi patlaması yapmak için 3 eylem kullanırsanız koniyi 60 fite ve hasarı 4d6'ya çıkarın. Alandaki her yaratık bir Dayanıklılık kurtarış denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarım hasar alır. Başarısızlık Yaratık tam hasar alır ve 5 fit itilir. Kritik Başarısızlık Yaratık iki kat hasar alır ve 10 fit itilir. Kademeli (+1) Hasar 1d6 artar ya da 2 veya 3 eylem kullanırsanız 2d6 artar.

omen://spell/qi-form?source=paizo-pathfinder-player-core-2:
  name: Qi Formu
  description: "Manevi gücün derin kaynaklarından yararlanarak özel bir qi formuna bürünürsünüz. Qi formunuzda saçlarınız, tüyleriniz, deriniz veya pullarınız renk değiştirir ve parıldamaya başlar. Bu formda kara Hızınıza eşit bir uçma Hareket Hızı kazanırsınız. Kuvvet, ruh, canlılık veya boşluk hasarı seçin. Tüm Saldırılarınız seçilen türde 1d6 ek hasar verir. Tüm vücudunuz ayrıca içsel qinizle aynı renkte parlayan bir hale ile çevrelenir; bu bir ışık etkisidir. Haleniz, emisyon içinde sıralarına başlayan yaratıklara seçilen türde 2d6 hasar veren 5 fitlik bir emisyondaki bir auradır. Emisyon bir karanlık etkisiyle örtüşürse halenin ışıltısı karanlığı etkisiz kılmaya çalışır. Sonuç ne olursa olsun hale 1 gün boyunca o etkiyi tekrar etkisiz kılmaya çalışamaz. Halenizi 30 fitlik bir emisyon hâline getirmek veya haleyi 5 fitlik bir emisyona döndürmek için Sürdürebilirsiniz. Qi formunuzda duygularınız ön plana çıkar ve saldırılarınızı dizginlemek zordur. Silahlarınız ve silahsız saldırılarınız nonlethal özelliğini kaybeder. Duygu etkilerine karşı kurtarışlara –2 statü cezası alırsınız ancak diğer tüm zihinsel etkilere karşı kurtarışlara +2 statü bonusu kazanırsınız."

omen://spell/qi-rush?source=paizo-pathfinder-player-core-2:
  name: Qi Atılımı
  description: "Qiniz tarafından hızlandırılarak o kadar hızlı hareket edersiniz ki bir bulanıklık hâline gelirsiniz. İki kez hareket edin: iki Adımlama, iki Yanaşma veya bir Adımlama ve bir Yanaşma (herhangi bir sırada). Bu hareket sırasında ve bir sonraki sıranızın başına kadar Gizlenmiş durumunu kazanırsınız."

omen://spell/reapers-lantern?source=paizo-pathfinder-player-core-2:
  name: Azrail Feneri
  description: Yaşayanları ölüme, ölümsüzleri ise gerçek ölüme doğru yönlendiren hayaletsi bir fener çağırırsınız. Büyünün alanında parlak ışık ve bu alanın iki katı mesafeye kadar loş ışık saçar. Fener maddesizdir ve geçici, iskeletsi bir elden asılı olarak yakınınızda havada süzülür. Büyüyü Yaptığınızda alanda bulunan veya daha sonra alana giren yaşayan yaratıklar ve ölümsüzler Dayanıklılık kurtarışlar denemelidir. Dayanıklılık kurtarışlarnda başarısız olan yaşayan yaratıklar, alan içindeyken iyileştirme etkilerinden normal faydanın yalnızca yarısını kazanırlar. Dayanıklılık kurtarışlarnda başarısız olan ölümsüz hedefler, alan içindeyken Güçten Düşmüş 1 olurlar. Bir yaratık azrail fenerine karşı bir kurtarış denedikten sonra, alandan ayrılıp tekrar girerse aynı sonucu kullanır. Azrail fenerini yaptıktan sonraki turdan itibaren tur başına bir kez, emisyonun yarıçapını 5 fit artırmak için büyüyü Sürdürebilirsiniz. Bunu yaptığınızda alanda henüz azrail fenerine karşı bir kurtarma denememiş olan yaratıkları bir kurtarma denemeye zorlarsınız.

omen://spell/reincarnate?source=paizo-pathfinder-player-core-2:
  name: Yeniden Bedenlenme
  description: "Hedefin ruhunu çağırır ve onu yepyeni bir bedene yerleştirmeye çalışırsınız. Ruh orijinal bedene geri dönmeyeceğinden yaratığın kalıntılarının yalnızca küçük bir kısmı gereklidir. Bu kalıntılar ölüm anında orijinal bedenin bir parçası olmalı ve hedef geçmiş bir hafta içinde ölmüş olmalıdır. Pharasma hedefin vaktinin geldiğine karar verdiyse ya da hedefin ruhu kapana kısılmışsa veya geri dönmek istemiyorsa bu ritüel otomatik olarak başarısız olur; ancak bunu Din testinde başarılı olduktan sonra keşfedersiniz ve maliyeti ödemeden ritüeli sonlandırabilirsiniz. Ritüel başarılı olursa hedefin yeni bedeni rastgele bir soya sahip olur. 1d20 atın. 1 ila 14 arasındaki bir sonuçta yeni beden yaygın bir soydan biri olurken, 15 ila 20 arasında ender veya nadir bir soyun üyesi olur. GM bölgede bulunanlara dayalı olarak olası soyları seçer ve soyu rastgele belirler. Örneğin GM Oyuncu El Kitabı'ndan yaygın bir soy seçmek için 1d8 atabilir. Hedef soy Can Puanını, boyutunu, Hareket Hızlarını, nitelik artışlarını ve kusurlarını, özelliklerini ve özel yeteneklerini yeni soyununkilerle değiştirir. Hedef, miras ve soy hünerlerini kaybeder ve yeni soyundan yenilerini seçer. Hedefin geçmişi, sınıf özellikleri ve dilleri değişmeden kalır. Kritik Başarı Hedefi yeni bir yetişkin bedende reenkarne edersiniz. Bu yeni beden tam CP'ye sahiptir ve orijinal bedenin öldüğünde hazırladığı büyülerin aynısını hazırlamıştır. Başarı Yeni bedenin 1 CP'ye sahip olması ve hiçbir büyünün hazırlanmamış olması haricinde kritik başarıdaki gibi. Ruhun yeni bedenine alışması biraz zaman alır; bu da onları 1 hafta boyunca Sakar 2, İçi Çekilmiş 2 ve Güçten Düşmüş 2 bırakır; bu durumlar hafta geçene kadar hiçbir şekilde kaldırılamaz veya azaltılamaz. Başarısızlık Hedefi reenkarne etmede başarısız olursunuz. Kritik Başarısızlık Hedefin ruhu, seviyesi hedefin seviyesinin yarısından büyük olmayan, GM'nin seçtiği zekâsız bir hayvan yaratıkta kapana kısılır. Kapana kısıldığı süre boyunca hedefin Zekâ niteleyicisi –5 olur ve kendi yeteneklerinin hiçbirini kullanamaz. dereceli (4.) Hedefin maksimum seviyesi 10'a çıkar. Maliyet hedefin seviyesi (en az 1) × 40 gp'dir. dereceli (5.) Hedefin maksimum seviyesi 12'ye çıkar. Maliyet hedefin seviyesi (en az 1) × 75 gp'dir. dereceli (6.) Hedefin maksimum seviyesi 14'e çıkar. Maliyet hedefin seviyesi (en az 1) × 125 gp'dir. Hedef geçmiş bir ay içinde ölmüş olmalıdır. dereceli (7.) Hedefin maksimum seviyesi 16'ya çıkar. Maliyet hedefin seviyesi (en az 1) × 200 gp'dir. Hedef geçmiş bir ay içinde ölmüş olmalıdır. dereceli (8.) Hedefin maksimum seviyesi 18'e çıkar. Maliyet hedefin seviyesi (en az 1) × 300 gp'dir. Hedef geçmiş bir yıl içinde ölmüş olmalıdır. dereceli (9.) Hedefin maksimum seviyesi 20'ye çıkar. Maliyet hedefin seviyesi (en az 1) × 600 gp'dir. Hedef geçmiş bir on yıl içinde ölmüş olmalıdır."

omen://spell/resplendent-mansion?source=paizo-pathfinder-player-core-2:
  name: Görkemli Köşk
  description: Dört kata kadar yükseklikte ve bir kenarı 300 fite kadar olan görkemli bir köşk çağırırsınız. Büyüyü Yaparken zihninizde köşkün ve istenen görünümünün bir imgesini tutarsınız. Köşk arzuladığınız kadar çok veya az oda içerebilir ve hayal ettiğiniz gibi dekore edilmiştir. Köşkün her odası için bir amaç hayal edebilirsiniz ve uygun teçhizatlar içeride belirir. Herhangi bir mobilya veya diğer sıradan demirbaşlar köşkün içindeki herkes için normal şekilde işlev görür ancak duvarlarının ötesine götürülürlerse varlıkları sona erer. Bu büyüyle yaratılan hiçbir demirbaş büyülü etkiler yaratamaz ancak köşke getirilen büyülü aygıtlar normal şekilde işlev görür. Köşkünüz Düzlemsel Saray büyüsü tarafından yaratılanla aynı tür ve miktarda erzak ve hizmetkâr içerir. Köşkün dış kapı ve pencerelerinin her biri Alarm büyüleriyle korunur. Büyüyü Yaparken her alarmın işitilebilir mi yoksa zihinsel mi olduğunu seçersiniz ve her biri farklı bir sese (işitilebilir bir alarm için) veya hisse (zihinsel bir alarm için) sahip olup hangi geçidin kullanıldığını anında belirlemenize olanak tanır.

omen://spell/rest-eternal?source=paizo-pathfinder-player-core-2:
  name: Ebedi İstirahat
  description: "Bir yaratığın ruhunun geri dönmesini sonsuza dek engellemek için tanrıları, ruhları ve daha yabancı varlıkları çağırırsınız. Bu şekilde kısıtlanmak istemeyen bir ruh bu ritüele direnmek için bir İrade kurtarış deneyebilir; bir kritik başarıda ritüelin başarılı olduğuna sizi inandırarak kandırır. Bu ritüelin ölümsüz olan veya ruhu ahirette bulunmayan bir hedef üzerinde hiçbir etkisi yoktur. Kritik Başarı Öznenin ruhunu ahirete tecrit edersiniz. Ölü yaratıkla iletişim kurma, onu hayata döndürme, onu bir ölümsüze dönüştürme veya ahiretini başka şekilde rahatsız etme girişimleri, etkinin etkisiz kılma derecesi ebedi istirahatinkinden en az 2 daha yüksek olmadıkça ya da bir eserden veya bir tanrıdan kaynaklanmadıkça başarısız olur. Yaratığı başarıyla hayata döndürmek ebedi istirahat tarafından konulan kısıtlamaları sonlandırır. Başarı Kritik başarıdaki gibi, ancak ruhla etkileşime girme etkileri, etkinin etkisiz kılma derecesi ebedi istirahatinkinden daha yüksek olmadıkça ya da bir eserden veya bir tanrıdan kaynaklanmadıkça başarısız olur. Başarısızlık Ritüelin hiçbir etkisi yoktur. Kritik Başarısızlık Ritüel başarısız olur ve yakardığınız ruhlar öfkelenir. Tüm büyücüler 1 hafta boyunca Lanetlenmiş 1 olur."

omen://spell/revel-in-retribution?source=paizo-pathfinder-player-core-2:
  name: İntikam Keyfi
  description: Zaman sizin için yavaşlıyor gibi görünür ve rakiplerinize hareketlerinin ortasında vurmanıza olanak tanır. Reaktif Saldırı yeteneğini kazanırsınız ve hemen yalnızca Reaktif Saldırı kullanmak için kullanabileceğiniz ikinci bir tepki kazanırsınız. Eylemlerinizi geri kazandığınız sonraki turlarınızın her birinin başında, yalnızca bir Reaktif Saldırı denemek için kullanılabilecek ek bir tepki kazanırsınız. Gafil bir düşmana saldırmak sizi muharebe heyecanıyla canlandırır ve Reaktif Saldırı ile her başarılı vuruş yaptığınızda size 5 geçici Can Puanı kazandırır. Geçici Can Puanları büyünün süresi boyunca devam eder. dereceli (+1) Başarılı bir Reaktif Saldırıdan kazandığınız geçici Can Puanı 1 artar.

omen://spell/rouse-skeletons?source=paizo-pathfinder-player-core-2:
  name: İskeletleri Uyandır
  description: "Biçimsiz iskelet formları taş zemin gibi katı bir yüzeyden fışkırır ve patlamayı doldurur. Doldurdukları alan zorlu arazidir. Kavrayıcı pençeleri, iskeletler ilk belirdiğinde alandaki zeminde bulunan yaratıklara temel bir Refleks kurtarış ile 2d6 kesici hasar verir. Sonraki turlarda, her tur Büyüyü Sürdürdüğünüz ilk seferde iskeletlerin alanını büyünün menzili içinde 20 fite kadar hareket ettirebilir ve yeni alandaki her yaratığa temel bir Refleks kurtarış ile 2d6 kesici hasar verebilirsiniz. İskeletlere hasar vermek veya onları yok etmek anlamsızdır; çünkü yok edilenlerin yerini almak ve onları onarmak için yerden yeni kemikler çıkar. dereceli (+2) Hasar 1d6 artar."

omen://spell/sacred-form?source=paizo-pathfinder-player-core-2:
  name: Kutsal Form
  description: "Tüm ilahi enerjinizi odaklar ve kendinizi normal formunuza benzer ve sizinle aynı boyutta, ancak güçlü ilahi silahlar kuşanan bir savaş formuna dönüştürürsünüz. Bu formdayken aşağıda listelenen istatistikleri ve yetenekleri kazanırsınız. Bu savaş formunda elleriniz vardır ve manipüle etme eylemlerini kullanabilirsiniz. Büyüyü Sonlandırabilirsiniz. Aşağıdaki istatistikleri ve yetenekleri kazanırsınız. SD = 20 + seviyeniz. Zırhınızın kontrol cezasını ve Hareket Hızı azalmasını yok sayın. 10 geçici Can Puanı. Hareket Hızı 40 fit. Fiziksel hasara karşı direnç 3. Karanlıkgörüş. Kullanabileceğiniz tek saldırı olan kutsal bir silahla özel bir saldırı. Kutsal silahla saldırı bonusunuz +21'dir ve hasar bonusunuz +8'dir (veya menzilli bir saldırı için +6). Silahla yapılan Vuruşlar için hasar zarları 3d6 ezici hasar artı 1d6 ruh hasarıdır. Bir ilahınız varsa silahın ilahınızın gözde silahının biçimini almasını sağlayabilir ve onun hasar zarı boyutunu, hasar türünü ve özelliklerini kullanabilirsiniz. Gözde silah 1d4 veya 1d6 hasar zarına sahip basit bir silahsa, ruh hasarı değişmese de silah hasar zarları normalden bir boy daha büyüktür. Büyü tarafından verilenden daha yüksekse bu gözde silahla olan saldırı bonusunuzu da kullanabilirsiniz. Kendi niteleyiciniz daha yüksek olmadıkça +23 Atletizm niteleyicisi. dereceli (8.) Bunun yerine SD = 21 + seviyeniz, 15 geçici Can Puanı, fiziksel hasara karşı direnç 4, saldırı bonusu +28, hasar bonusu +15 (menzilli bir saldırı için +12) ve Atletizm +29 kazanırsınız. Orta veya daha küçükseniz savaş formunuz Büyük olur ve saldırılarınız 10 fit erişime ya da erişimli bir gözde silah kullanıyorsanız 15 fit erişime de sahip olur."

omen://spell/scatter-scree?source=paizo-pathfinder-player-core-2:
  name: Moloz Saç
  description: Bir kaya yığını alana çağlayan gibi dökülür. Saçılan kayalar 2d4 ezici hasar verir (temel Refleks kurtarış). Alandaki zemin, büyünün süresi boyunca zorlu arazi hâline gelir. Bir yaratık bu molozun bir karesini temizlemek için Etkileşime Girebilir. Bu büyüyü tekrar yaparsanız yaptığınız önceki tüm moloz saç büyüleri sona erer. dereceli (+1) Hasar 1d4 artar.

omen://spell/schadenfreude?source=paizo-pathfinder-player-core-2:
  name: Kötücül Sevinç
  description: Tetikleyici Bir düşmanın etkisine karşı bir kurtarışta kritik başarısızlık elde edersiniz. Felaket boyutunda başarısız olduğunuzda düşmanınızın dikkatini onun kendini beğenmiş zevk duygusuyla dağıtırsınız. Düşman bir İrade kurtarış denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratığın dikkati eğlencesiyle dağılır ve 1 tur boyunca Dikkat testlerine ve İrade kurtarışlara -1 statü cezası alır. Başarısızlık Yaratık eğlencesine yenik düşer ve 1 tur boyunca Zihni Uyuşmuş 1 olur. Kritik Başarısızlık Yaratık eğlencesinde kaybolur ve 1 tur boyunca Zihni Uyuşmuş 2 ve Sersemlemiş 1 olur.

omen://spell/scintillating-safeguard?source=paizo-pathfinder-player-core-2:
  name: Işıltılı Siper
  description: "Tetikleyici Bir etki size veya menzil içindeki bir yaratığa fiziksel hasar veya enerji hasarı verecektir. Parıldayan büyülü bir bariyer her hedefi sararak onları tetikleyici etkiye karşı korur. Tetikleyici etkinin verdiği bir tür fiziksel hasar veya enerji hasarı seçin. Her hedef tetikleyici etki için o hasar türüne karşı direnç 10 kazanır. Direnç yalnızca başlangıç hasarına karşı uygulanır; herhangi bir süren hasara veya diğer süregelen etkilere karşı uygulanmaz. dereceli (+1) Direnç 1 artar."

omen://spell/seal-fate?source=paizo-pathfinder-player-core-2:
  name: Kaderi Mühürle
  description: "Bir yaratığın belirli bir sonla karşılaşacağına dair bir lanet savurursunuz—donarak, bıçaklanarak veya tasarladığınız başka bir yolla bir ölüm. Aşağıdaki listeden bir hasar türü seçin: asit, ezici, soğuk, elektrik, ateş, delici, kesici, sonik veya boşluk. Etki hedefin Dayanıklılık kurtarışa dayanır. Kritik Başarı Hedef etkilenmez. Başarı Hedef bir sonraki sıranızın sonuna kadar seçilen hasar türüne karşı zaaf 2 kazanır. Başarısızlık Başarıdaki gibi, ancak süre 1 dakikadır. Yaratık seçilen hasarla 0 Can Puanına indirilirse ve seviyesi 7 veya daha azsa ölür. Kritik Başarısızlık Başarısızlıktaki gibi, ancak süre sınırsızdır. Kademeli (+2) Zaaf 1 artar ve otomatik olarak öldürülebilecek yaratığın maksimum seviyesi 4 artar."

omen://spell/shadow-double?source=paizo-pathfinder-player-core-2:
  name: Gölge Suret
  description: "Yeraltı Dünyası'ndan gölgeli maddeler çekip yarı katı bir forma yontarak hedef yaratığın yanılsamalı bir kopyasını yaratırsınız. Gölge suret, hiçbir özel yeteneği olmayan 4. seviye bir yaratıktır. Bir zar atması veya bir ZD kullanması gerekirse, aşağıda belirtilenler dışında bir canavar için makul sayıyı kullanın. Hedefe ait belirli anıları yoktur ancak hedefi Kılığına Bürünmek için büyücülerden herhangi birinden yaratık hakkında edinilen bilgileri kullanabilir. Tam olarak hedefe benzer ve Aldatmaca testini atan ikincil büyücünün niteleyicisine eşit, +4 statü bonusuna sahip bir Kılığına Bürünme Aldatmaca niteleyicisine sahiptir. Orijinalin ejderha nefesi gibi özel yeteneklerinden hiçbirine sahip olmasa da yanılsamalar bu yetenekleri kullanıyor gibi görünmesine olanak tanır; sadece hiçbir zaman bir etkisi varmış gibi görünmezler. Örneğin bir suretin ejderha nefesine karşı alandaki tüm yaratıklar kurtarışlarnda kritik başarı elde etmiş gibi görünür ve hasar almazlar. Yaratıklar, Aldatmaca testini atan ikincil büyücünün Aldatmaca ZD'sine karşı bir Dikkat testi deneyerek yanılsamaya inanmamayı deneyebilirler. Kritik Başarı Gölge sureti yaratırsınız. Minion özelliğine sahiptir ve mutlak kontrolünüz altındadır. Gölge suretle doğrudan zihinsel bir bağ kazanırsınız ve uzaktan bile olsa bu bağ aracılığıyla gölge surete komut vermek için bir eylem harcayabilirsiniz. Başarı Kritik bir başarıdaki gibi, ancak siz ve gölge suret arasında özel bir bağ yoktur. Ona sözlü olarak veya başka bir yolla komut vermek için bir eylem harcamalısınız. Başarısızlık Ritüel başarısız olur ve hiçbir etkisi olmaz. Kritik Başarısızlık Gölge suret yaratılır ancak sizin minyonunuz değildir ve tüm büyücülere düşmandır. Onları yok etmek için elinden gelen her şeyi yapar ancak onları hemen katledemezse gölge suret kaçmaya çalışır ve ölümlerini planlar."

omen://spell/shadows-web?source=paizo-pathfinder-player-core-2:
  name: Gölge Ağı
  description: Kavrayıcı karanlık sizden taşarak 14d4 boşluk hasarı verir. Alandaki her yaratık bir Dayanıklılık kurtarış denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarım hasar alır ve 1 tur boyunca Güçten Düşmüş 1 olur. Başarısızlık Yaratık tam hasar alır ve 1 tur boyunca Güçten Düşmüş 2 olur. Kritik Başarısızlık Yaratık iki kat hasar alır, Sersemlemiş 1 olur, 1 tur boyunca Güçten Düşmüş 2 olur ve hangisi önce gelirse 1 tur boyunca veya Kaçana kadar Hareketsiz kalır. Kademeli (+1) Boşluk hasarı 2d4 artar.
  requirements: Yapışkan Gölgeler Duruşu içindesinizdir.

omen://spell/shared-invisibility?source=paizo-pathfinder-player-core-2:
  name: Paylaşımlı Görünmezlik
  description: Hedefler emisyon içinde kaldığı sürece siz ve tüm hedefler birbiriniz hariç Görünmez olursunuz. Bu büyüyle görünmez kılınan bir yaratık büyünün alanından ayrılırsa görünür hâle gelir ve büyünün alanına geri dönse bile öyle kalır. Bu büyüyle görünmez kılınan herhangi bir yaratık düşmanca bir eylem kullanırsa düşmanca eylem tamamlandıktan sonra büyü sona erer. dereceli (5.) Hedefler siz ve 10'a kadar istekli yaratığa çıkar. Süre 1 saate çıkar.

omen://spell/shields-of-the-spirit?source=paizo-pathfinder-player-core-2:
  name: Ruh Kalkanları
  description: "Gereksinimler Bir kalkan kuşanmış durumdasınız. Kalkanınızı Kaldırırsınız ve şampiyonunuzun aurası içinde geçici ruh kalkanlarının havada süzülmesine neden olursunuz. Kalkanlar bir sonraki sıranızın başına kadar veya artık kalkanınızı kaldırmayana kadar (hangisi önce gelirse) devam eder. Müttefiklerinizden biri şampiyonunuzun aurasındayken kalkanlar onlara SD'ye +1 statü bonusu verir ve bir düşman müttefike her vuruş yaptığında düşman 1d4 ruh hasarı alır (ıskalasa bile). Bu fayda yalnızca bir müttefik auranızdayken geçerlidir; ayrılan müttefikler için sona erer ve daha sonra girenlere uygulanır. Normalde olduğu gibi kendi müttefikiniz sayılmazsınız ve bu nedenle ruh kalkanlarının faydalarını kendiniz elde etmezsiniz. Kademeli (+2) Hasar 1d4 artar."
  requirements: Bir kalkan kuşanmış durumdasınız.

omen://spell/shrink-item?source=paizo-pathfinder-player-core-2:
  name: Eşyayı Küçült
  description: Hedefi ihmal edilebilir Yüke sahip kabaca bir madeni para boyutuna küçültürsünüz. Büyüyü Sonlandırabilirsiniz ve nesneyi katı bir yüzeye fırlatırsanız büyü sona erer. Nesne normal boyutuna dönme sürecinde saldırmak veya hasara neden olmak için kullanılamaz. Büyü sona erdiğinde nesnenin normal boyutuna dönmesi için yer yoksa nesne normal boyutunu barındıracak kadar büyük bir yerde olana kadar büyünün süresi devam eder.

omen://spell/shrink-the-span?source=paizo-pathfinder-player-core-2:
  name: Mesafeyi Daralt
  description: Düzlemsel sınırların ötesinde bulanıklaşacak kadar hızlı hareket edersiniz. Görüş alanınız içinde Hızınıza eşit bir mesafeye kadar ışınlanırsınız.

omen://spell/soul-siphon?source=paizo-pathfinder-player-core-2:
  name: Ruh Sifonu
  description: Kendi canlılığınızı pekiştirmek için hedefin ruhunun bir kısmını çekersiniz. Hedef bir Dayanıklılık kurtarış denemelidir, aksi takdirde 1d4 boşluk hasarı alır. Hedefin kaybettiği toplam CP miktarına eşit (İçi Çekilmiş hâle gelmekten kaybedilen CP dâhil) geçici Can Puanı kazanırsınız. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarım hasar alır. Başarısızlık Yaratık tam hasar alır ve İçi Çekilmiş 1 olur. Kritik Başarısızlık Yaratık iki kat hasar alır ve İçi Çekilmiş 2 olur. Kademeli (+1) Hasarı 1d4 artırın.

omen://spell/spectral-advance?source=paizo-pathfinder-player-core-2:
  name: Spektral İlerleme
  description: Ruhani bir forma bürünerek bir düşmanla çarpışmak için savaş alanında hızla ilerlersiniz. Bir düşmana bitişik bir alana Adımlarsınız. Büyüyü 2 eylem kullanarak yaparsanız bir yerine iki kez Adımlayabilirsiniz. Bir uçma Hızınız varsa Adımlamak yerine Uçabilirsiniz. Binekliyseniz sizin yerinize bineğinizin hareket etmesini sağlayabilirsiniz. Spektral ilerlemeden kaynaklanan hareket tepkileri tetiklemez ve zorlu arazi ile büyük zorlu araziyi yok sayar. Hareket sırasında siz (veya bineğiniz) tüm hasarlara karşı seviyenize eşit dirence sahip olursunuz.

omen://spell/spell-riposte?source=paizo-pathfinder-player-core-2:
  name: Büyü Karşı Saldırısı
  description: Tetikleyici Farkında olduğunuz bir büyünün hedefisinizdir. Tetikleyici büyüyü etkisiz kılmaya çalışırsınız. Büyü etkisiz kılınacaksa bunun yerine siz hedef olmak yerine büyücü hedef olarak devam eder. Büyü karşı saldırısı hedeflenmemiş büyüleri (alan büyüleri gibi) etkileyemez.

omen://spell/spirit-sense?source=paizo-pathfinder-player-core-2:
  name: Ruh Sezisi
  description: "Yakındaki ruhları sezebilmenizi sağlayarak zihninizi metafizik olana açarsınız. Aramıyor olsanız bile alandaki musallatları ve ruhları bulmak için bir test elde edersiniz. Musallatlar veya ruhlarla ilgili aşağıdaki testlere +1 statü bonusu kazanırsınız: Taramak için yapılan Dikkat testleri, Bilgiyi Hatırla denemeleri, varlıklarının nedenini belirlemek için yapılan beceri testleri ve bir musallatı etkisiz hâle getirmek için yapılan beceri testleri. Musallatlara ve ruhlara karşı SD'ye ve kurtarışlara da +1 statü bonusu kazanırsınız. dereceli (6.) Büyünün süresi bir sonraki günlük hazırlıklarınızı yapana kadar sürer."

omen://spell/spirit-song?source=paizo-pathfinder-player-core-2:
  name: Ruh Şarkısı
  description: "Uğursuz şarkınız alandaki yaratıkların ruhlarına saldırmak için eterik enerjinin titreşen dalgalarını gönderir; ezginin hipnotik doğasından ötürü bedenlerinin anlık olarak donmasına neden olan ve Dayanıklılık kurtarışların sonucuna bağlı olarak 14d6 ruh hasarı verir. Ruh şarkısının titreşen dalgaları katı engellerin içine nüfuz eder ancak içinden geçip gitmez; alandaki katı nesnelerde saklanan bedensiz yaratıklara hasar verir ancak diğer odalardaki yaratıklara hasar vermek üzere öteye geçmez. Kritik Başarı Yaratık hasar almaz. Başarı Yaratık yarım hasar alır ve sırasının başına kadar tepkileri kullanamaz. Başarısızlık Yaratık tam hasar alır, sırasının başına kadar tepkileri kullanamaz ve Sersemlemiş 1 olur. Kritik Başarısızlık Yaratık iki kat hasar alır, sırasının başına kadar tepkileri kullanamaz ve Sersemlemiş 2 olur. Kademeli (+1) Hasar 2d6 artar."

omen://spell/spiritual-epidemic?source=paizo-pathfinder-player-core-2:
  name: Ruhsal Salgın
  description: Hedefin ruhunu tüketerek ve özünde bulaşıcı bir tuzak bırakarak hedefi lanetlersiniz. Hedef bir İrade kurtarış denemelidir. Hedef etkilenmiş durumdayken onun üzerine ilahi veya okült bir büyü yapan herhangi bir yaratık ruhsal salgın tarafından hedeflenir ve o da bir İrade kurtarış denemelidir. Lanet bu şekilde yayılmaya devam eder. Kritik Başarı Hedef etkilenmez. Başarı Hedef 1 tur boyunca Güçten Düşmüş 2 ve Zihni Uyuşmuş 2 olur. Başarısızlık Hedef 1 dakika boyunca Güçten Düşmüş 2 ve Zihni Uyuşmuş 2 ve kalıcı olarak Güçten Düşmüş 1 ve Zihni Uyuşmuş 1 olur. Kritik Başarısızlık Hedef 1 dakika boyunca Güçten Düşmüş 3 ve Zihni Uyuşmuş 3 ve kalıcı olarak Güçten Düşmüş 2 ve Zihni Uyuşmuş 2 olur.

omen://spell/spout?source=paizo-pathfinder-player-core-2:
  name: Su Fışkırması
  description: Yerden çıkan, bir havuzdan yükselen ve hatta havadan tezahür eden su yukarı doğru patlar. Alandaki tüm yaratıklar temel bir Refleks kurtarış ile 2d4 ezici hasar alır. Kurtarışta kritik başarısızlık elde eden bir yaratık, su patlamasıyla yönünü şaşırarak bir sonraki sıranızın sonuna kadar Gafil hâle gelir. Patlamayı bir su kütlesinde merkezlemeniz koşuluyla bu büyünün alanını bir patlamaya dönüştürebilirsiniz. Bu su kütlesi bir gölet veya dere kadar küçük olabilir ancak bir su birikintisi veya küvet kadar küçük olamaz. dereceli (+1) Hasar 1d4 artar.

omen://spell/spray-of-stars?source=paizo-pathfinder-player-core-2:
  name: Yıldız Serpintisi
  description: 2d4 ateş hasarı veren küçük kayan yıldızlardan oluşan bir serpinti savurursunuz. Alandaki her yaratık bir Refleks kurtarış denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarım hasar alır ve 1 tur boyunca Kamaşmış olur. Başarısızlık Yaratık tam hasar alır ve 3 tur boyunca kamaşmış olur. Kritik Başarısızlık Yaratık iki kat hasar alır ve 1 dakika boyunca kamaşmış olur. Kademeli (+1) Hasarı 1d4 artırın.

omen://spell/strange-geometry?source=paizo-pathfinder-player-core-2:
  name: Tuhaf Geometri
  description: "Alan Her bir kenarı 10 fit olan 4 küp Alanların tuhaf bir uzamsal geometride birbirine dolanarak kabarmış, bükülmüş ve kırılmış gibi görünmesine neden olursunuz. Büyünün alanındaki küpler birbirine bitişik olamaz. Büyüyü Yaptığınızda küplerden birinde bulunan veya daha sonra alanlardan birine giren bir yaratık aşağıdaki etkilerle bir İrade kurtarış denemelidir. İllüzyonla etkileşime giren bir yaratık normalde olduğu gibi illüzyona inanmamak için bir İrade kurtarış da deneyebilir. Başarı Yaratık illüzyona inanmaz. Başarısızlık Küplerdeki tüm arazi yaratık için zorlu arazidir; buna yaratık uçuyorsa hava, tırmanıyorsa duvarlar vb. dâhildir. Yaratık küplerden birinden çıkacağı zaman GM tarafından rastgele belirlenen birinden çıkar. Bu bir ışınlanma etkisidir. O küpün seçtiği herhangi bir kenarından çıkabilir. Rastgele bir küp seçerken GM, yaratığın arazisiyle eşleşmeyenleri hariç tutar; örneğin yaratık zemin boyunca çıkıyorsa GM zeminde çıkışı olmayan herhangi bir küpü hariç tutar."

omen://spell/sudden-blight?source=paizo-pathfinder-player-core-2:
  name: Ani Kuruma
  description: Alandaki çürüme süreçlerini hızlandırırsınız. Alandaki yaşayan her yaratık temel bir Dayanıklılık kurtarış ile 2d10 boşluk hasarı alır. Bir hastalıktan muzdarip bir yaratık bu kurtarışa –2 durumsal ceza alır. Büyümeyi ayrıca alandaki Küçük ve Minik yaratık olmayan tüm bitkileri çürütmeye, büyülü olmayan çalılıkları ve bunlardan kaynaklanan zorlu araziyi, siperi ve gizlenmeyi ortadan kaldırmaya yönlendirebilirsiniz. Ani kuruma, bitkileri soldurmadan önce üzerlerindeki herhangi bir büyülü etkiyi etkisiz kılmaya çalışır. dereceli (+1) Hasar 1d10 artar.

omen://spell/summon-lesser-servitor?source=paizo-pathfinder-player-core-2:
  name: Küçük Hizmetkâr Çağır
  description: >
    İlahlar en kudretli hizmetkârlarını inançta derinleşmemiş olanların çağırma büyülerinden kıskançlıkla korurken, bu büyü Dış Küre'nin bir sakinini ilahın izni olsun ya da olmasın çağırmanıza olanak tanır. –1. seviye sıradan bir celestial, iblis veya gözcü çağırırsınız. Bunun yerine Dış Küre'den gelen –1. seviye sıradan bir hayvan çağırmayı da seçebilirsiniz; bu hayvanın celestial ve mübarek özelliklerini, iblis ve şerli özelliklerini veya gözcü özelliğini kazanmasını seçebilirsiniz. İlahınızın kutsaması için izin verilmeyen bir mübarek veya şerli özelliğe sahip bir hizmetkârı çağırmak sizin için yasaktır. Örneğin, Sarenrae'nin kutsaması "mübarek seçebilir" şeklindedir, bu yüzden şerli bir yaratık çağıramazsınız; Pharasma'nınki ise "yok" şeklindedir, bu yüzden mübarek veya şerli bir yaratık çağıramazsınız. GM, ilahınızın belirli türdeki yaratıkları daha da kısıtladığına ve onları çağırmanın da yasak olduğuna karar verebilir. Güçlendirilmiş (2.) Yaratık 1. seviye veya daha düşük olabilir. Güçlendirilmiş (3.) Yaratık 2. seviye veya daha düşük olabilir. Güçlendirilmiş (4.) Yaratık 3. seviye veya daha düşük olabilir.


omen://spell/swamp-of-sloth?source=paizo-pathfinder-player-core-2:
  name: Tembellik Bataklığı
  description: >
    Alandaki zemin bataklık ve pis kokulu hâle gelir. Alan zorlu arazidir. Bataklığın dibindeki balçık, iblisvari bir görünüme sahip minik balçık canavarlarına dönüşür. Bunlar normal yaratıklar gibi işlev görmez, ancak bataklıktaki yaratıkların üzerine üşüşür ve zararlı bir koku yayarlar. Bataklık, alanda turunu bitiren yaratıklara 1d6 zehir hasarı verir (basit Dayanıklılık kurtarışı). Büyüyü Yaparken kullandığınız her ilave eylem için patlamanın yarıçapını 5 fit artırırsınız. Güçlendirilmiş (+2) Hasar 1d6 artar ve başlangıç yarıçapı 5 fit artar.


omen://spell/synesthesia?source=paizo-pathfinder-player-core-2:
  name: Sinestezi
  description: >
    Hedefin duyuları beklenmedik şekillerde aniden yeniden bağlanır; bu da gürültüleri renk patlamaları, kokuları sesler gibi algılamalarına yol açar. Bunun üç etkisi vardır ve hedef bir İrade kurtarışı denemelidir. Dikkat dağınıklığı nedeniyle, hedef konsantrasyon eylemi kullandığı her seferde bir testte başarılı olmalıdır, aksi takdirde eylem başarısız olur ve boşa gider. Hedefin görsel girdileri işlemekteki zorluğu, tüm yaratıkların ve nesnelerin ona karşı Gizlenmiş olmasına neden olur. Yaratık hareket etmekte zorlanır; bu durum onu Sakar 3 yapar ve Hareket Hızına –10 fitlik statü cezası verir. Kritik Başarı Hedef etkilenmez. Başarı Hedef 1 tur boyunca etkilenir. Başarısızlık Hedef 1 dakika boyunca etkilenir. Kritik Başarısızlık Başarısızlık gibi olup hedef duyusal değişimleri anlamlandırmaya çalışırken Sersemlemiş 2 olur. Güçlendirilmiş (9.) En fazla beş yaratığı hedef alabilirsiniz.


omen://spell/telepathic-demand?source=paizo-pathfinder-player-core-2:
  name: Telepatik Talep
  description: "Hedefe 25 veya daha az kelimeden oluşan bir mesaj gönderirsiniz ve hedef anında 25 veya daha az kelimeden oluşan kendi mesajıyla yanıt verebilir. Mesajınız sinsi bir yapıdadır ve sözlü telkinin yerini mesajınızın almasıyla Telkin büyüsü etkisine sahiptir. Başarılı bir kurtarışta hedef 1 gün boyunca geçici olarak bağışık olur; kritik başarıda ise hedef 1 ay boyunca geçici olarak bağışık olur. Bir yaratığı yalnızca daha önce onunla telepatik temas kurduysanız (örneğin telepati büyüsü aracılığıyla) hedef alabilirsiniz."

omen://spell/teleportation-circle?source=paizo-pathfinder-player-core-2:
  name: Işınlanma Çemberi
  description: >
    Yerde ritüel sırasında belirlenen bir hedefe açılan geçit işlevi gören 10 fit çapında bir çember yaratırsınız. Işınlanmanın varış noktasını ritüelin bir parçası olarak belirlersiniz. Bu varış noktası değiştirilemez. Varış noktası 1.000 mil mesafede ve ışınlanma çemberiyle aynı düzlemde bir konum olmalıdır. Konumu hem ışınlanma çemberini yarattığınız konuma göre konumuyla hem de hedefin görünümüyle (veya diğer tanımlayıcı özellikleriyle) kesin olarak belirleyebilmelisiniz. Varış noktası ayrıca hiçbir katı yapıyla çakışmayan 10 fit çapında bir çember olmalıdır, ancak zararlı veya tehlikeli bir yer olabilir. Bu ritüel için Hayatta Kalma testi deneyen ikincil bir büyücü, başlangıç noktası yerine varış noktasında bulunabilir. İkincil büyücü varış noktasındaki testinde başarılı olursa ve siz bir başarı atarsanız, ritüel bunun yerine bir kritik başarı olur. Çember aktifken, tamamen çemberin içine girecek şekilde hareket eden herhangi bir yaratık anında varış noktasına ışınlanır. Işınlanmak istemeyen bir yaratık etkiye direnmek için bir İrade kurtarışı deneyebilir. Çemberin içinde kalırsa yaratık her sırasının sonunda bu kurtarışı tekrar denemelidir. Çember normalde yalnızca tek yönde çalışır, ancak her iki yönde de çalışmasını sağlamak için masrafı iki katına çıkarabilirsiniz. Kritik Başarı Işınlanma çemberini yaratırsınız ve kat edilen mesafeden bağımsız olarak son derece hassastır. Yolcular tam olarak belirlenen noktaya varırlar. Başarı Kritik başarı gibi, ancak varış noktası kat edilen mesafenin yaklaşık yüzde 1'i kadar (en fazla 10 mil) sapar. Başarısızlık Işınlanma çemberi işlev görmez. Kritik Başarısızlık Işınlanma çemberi son derece hatalıdır. Başlangıç noktasından yaklaşık olarak aynı mesafedeki rastgele bir hedefe çıkar ve olağandışı başka bir aksiliğin yaşanma olasılığı çok daha yüksektir. Güçlendirilmiş (9.) Masraf 2.000 gp'dir, süre 1 aydır ve varış noktası aynı gezegendeki herhangi bir yer olabilir. Güçlendirilmiş (10.) Masraf 10.000 gp'dir, süre sınırsızdır ve varış noktası aynı gezegendeki herhangi bir yer olabilir.


omen://spell/tempest-form?source=paizo-pathfinder-player-core-2:
  name: Fırtına Formu
  description: "Çevrenize daha iyi uyum sağlamak için bedeniniz akışkan hâle gelir. Hava, su veya sis olmayı seçin. Hava veya sisi seçerseniz büyü hava özelliğini, su veya sisi seçerseniz su özelliğini kazanır. Zırhınız gibi siz de şekilsiz hâle gelirsiniz. SD'ye gelen tüm eşya bonuslarını kaybedersiniz ve SD'nizi belirlemek için zırhsız savunma yetkinlik bonusunuzu kullanırsınız. Ayrıca fiziksel hasara karşı direnç 10 kazanırsınız ve zayıf nokta hasarına bağışık hâle gelirsiniz. Minik yarıklardan kayabilir ve nefes almaya ihtiyaç duymazsınız. Bu büyünün bahşettikleri haricinde büyü yapamaz, eşyaları etkinleştiremez veya saldırı ya da manipüle özelliğine sahip eylemleri kullanamazsınız. Ayrıca formunuza bağlı olarak aşağıdaki etkileri kazanırsınız. Hava 20 fitlik bir uçma Hareket Hızı kazanırsınız ve havadayken Görünmez olursunuz. 2 eylemli bir aktivite olarak alanınızdan manipüle özelliğine sahip bir Rüzgâr Esintisi etkileri yaratabilirsiniz. Sis 20 fitlik bir uçma Hareket Hızı kazanırsınız ve içinizden bakmak zorlaşır. Alanınızın bir tarafında bulunan ve karşı taraftaki bir yaratık tarafından hedeflenen herhangi bir yaratık, hedefleyen yaratığa karşı Gizlenmiş sayılır. Su 20 fitlik bir yüzme Hareket Hızı kazanırsınız ve sudayken görünmez olursunuz. Manipüle özelliğine sahip tek bir eylem harcayarak kendinizi elektriksel olarak yükleyebilirsiniz. Bunu yaparsanız elektriğin konumunuzu belli etmesi nedeniyle artık suda görünmez kalmazsınız, ancak size karşı bir yakın dövüş saldırısı yapan herhangi bir yaratık (1d6+max(0,floor(spell rank/2) -3))[electricity] hasar alır. Yükseltilmiş (+2) Direnci 5 ve yüklü su formundan gelen elektrik hasarını 1 artırırsınız."

omen://spell/tempest-touch?source=paizo-pathfinder-player-core-2:
  name: Fırtına Dokunuşu
  description: >
    Dokunuşunuz hedefinize yapışan çalkantılı buzlu bir su kütlesi çağırarak 1d4 ezici hasar ve 1d4 soğuk hasarı verir. Hedef bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedef yarı hasar alır ve bir sonraki sıranızın sonuna kadar Hareket Hızına –5 fitlik durumsal ceza alır. Başarısızlık Hedef tam hasar alır ve bir sonraki sıranızın sonuna kadar Hareket Hızına –10 fitlik durumsal ceza alır. Kritik Başarısızlık Başarısızlık gibi, ancak hedef iki kat hasar alır. Güçlendirilmiş (+1) Ezici ve soğuk hasarları her biri 1d4 artar.


omen://spell/tentacular-limbs?source=paizo-pathfinder-player-core-2:
  name: Dokunaçlı Uzuvlar
  description: >
    Kollarınız uzun, esnek dokunaçlara dönüşerek temas menzilli büyüleri iletirken ve kollarınızla silahsız Vuruşlar yaparken (yumruk ve pençe Saldırıları gibi) erişiminizi 10 fite çıkarır. Bu durum yakın dövüş silah saldırılarınızın erişimini değiştirmez. Süre boyunca, ne zaman bir Büyü Yaparsanız, o büyüyü iletmek amacıyla erişiminizi geçici olarak 20 fite uzatmak için o büyünün yapılışına fazladan bir eylem ekleyebilirsiniz. Güçlendirilmiş (+2) Erişiminizi geçici olarak uzatmak için bir büyüye ilave bir eylem eklediğinizde, o büyüyü iletmek için erişiminiz fazladan 10 fit daha artar.


omen://spell/thoughtful-gift?source=paizo-pathfinder-player-core-2:
  name: Düşünceli Hediye
  description: >
    Elinizde tuttuğunuz hafif veya önemsiz Yükteki bir nesneyi hedefe ışınlarsınız. Nesne, hedefin boş bir eli varsa anında hedefin elinde belirir, yoksa ayaklarının dibinde belirir. Hedef, kendisine hangi nesneyi göndermeye çalıştığınızı bilir. Hedef Bilinçsizse veya hediyenizi kabul etmeyi reddederse ya da büyü bir yaratığı ışınlayacaksa (yaratık boyutötesi bir kapta olsa bile), büyü başarısız olur. Güçlendirilmiş (3.) Büyünün menzili 500 fite çıkar. Güçlendirilmiş (5.) 3. seviye gibi olup nesnenin azami Yükü 1'e çıkar. Büyüyü 1 eylem yerine 3 eylemle Yapabilirsiniz; bunu yapmak menzili 1 mile çıkarır ve hedefi doğrudan görme hattına ihtiyaç duymazsınız, ancak hedefi son derece iyi tanımanız gerekir.


omen://spell/threefold-aspect?source=paizo-pathfinder-player-core-2:
  name: Üçlü Suret
  description: "Bu büyü, kendinizin farklı yaşlardaki üç hâli arasında geçiş yapmanıza olanak tanır: bir genç kız (genç yetişkin), bir anne (yetişkin) veya bir anaerkil kadın (yaşlı). Büyüyü Yaptığınızda birini seçersiniz. Büyü devam ettiği sürece, büyüyü Sürdürerek yaşınızı bu üçünden birine veya doğal yaşınıza değiştirebilirsiniz. Formunuz yaştan bağımsız olarak her zaman size benzer ve sizi tanıyan yaratıklar sizi yine tanır ve yaşınızın farklı olduğunu anlayabilir. Üçlü suret, çeşitli yaşlarda kendinizin özgün bir versiyonunu sunmak için fiziksel görünüşünüzü ve kişiliğinizi değiştirir. Bu durum, seçilen yaşta görünmek için yapılan Aldatma testlerine +4 statü bonusu sağlar ve eğitimsiz olsanız bile seviyenizi bu testlere uzmanlık bonusu olarak ekleyebilirsiniz. Dahası, bir yaratık özellikle bir Ara eylemi kullanmadıkça veya sizi dikkatlice incelemedikçe gerçek yaşınızda olmadığınızı fark etme şansı elde edemez. Bu büyüyü Sonlandırabilirsiniz."

omen://spell/thunderburst?source=paizo-pathfinder-player-core-2:
  name: Gök Gürültüsü Patlaması
  description: >
    Güçlü bir hava patlaması ve yüksek bir gök gürültüsü sesi yaratarak 2d6 ezici hasar ve 2d6 sonik hasar verirsiniz. Alandaki her yaratık bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarı hasar alır. Başarısızlık Yaratık tam hasar alır ve 1 dakika boyunca Sağır olur. Kritik Başarısızlık Yaratık iki kat hasar alır ve 1 saat boyunca sağır olur. Güçlendirilmiş (+2) Her hasar türü 2d6 artar ve alan 5 fit genişler.


omen://spell/touch-of-death?source=paizo-pathfinder-player-core-2:
  name: Ölüm Dokunuşu
  description: >
    Bir yakın dövüş silahsız Vuruş Yaparsınız. Vurursanız ve hedef hayattaysa, süre boyunca herhangi bir zamanda, onu anında öldürebilecek bir ölüm kelimesi söylemek için işitsel ve konsantrasyon özelliklerine sahip tek bir eylem harcayabilirsiniz. Hedef bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Hedef hayatta kalır, büyü sona erer ve hedef ardından 24 saat boyunca geçici olarak bağışık olur. Başarı Hedef Sersemlemiş 1 olur ve 5*büyü derecesi kadar hasar alır, büyü sona erer ve hedef ardından 24 saat boyunca geçici olarak bağışık olur. Başarısızlık Hedef Sersemlemiş 3 olur ve 10*büyü derecesi kadar hasar alır. Büyünün süresi devam eder, ancak hedef ardından ölüm dokunuşu tarafından öldürülmeye karşı 24 saat boyunca geçici olarak bağışık olur. Kritik Başarısızlık Hedef ölür. Ölüm dokunuşunu tekrar yaparsanız, daha önce yapmış olduğunuz herhangi bir ölüm dokunuşunun etkileri sona erer. Güçlendirilmiş (+1) Hasar başarısızlıkta 10, başarıda 5 artar.


omen://spell/touch-of-the-void?source=paizo-pathfinder-player-core-2:
  name: Boşluk Dokunuşu
  description: >
    Hedefe hiçlik enerjisi aşılayarak hortlakları iyileştirir veya yaşayan bir yaratığa hasar verirsiniz. Gönüllü Hortlak Yaratık: Hedef 6 Can Puanı geri kazanır. Hedef sizseniz, ayrıca 1 tur boyunca hasar zarlarına +2 statü bonusu kazanırsınız. Yaşayan Yaratık: Hedef basit bir Dayanıklılık kurtarışı ile 1d6 hiçlik hasarı alır; başarısızlık durumunda hedef ayrıca 1 tur boyunca ZK'sine –2 statü cezası alır. Güçlendirilmiş (+1) İyileşme miktarı 6 artar ve yaşayan hedefe verilen hasar 1d6 artar.


omen://spell/undeaths-blessing?source=paizo-pathfinder-player-core-2:
  name: Hortlaklık Lütfu
  description: >
    Bir yaratığın içine mezarın dokunuşunu aşılarsınız. Süre boyunca Zarar Ver ve İyileştir büyüleri yaratığa hortlak muamelesi yapar. Buna ek olarak, zarar ver büyüleri hedefe geri kazandırılan Can Puanlarına +2 statü bonusu kazanır. İstemeyen bir hedef etkileri azaltmak için bir İrade kurtarışı deneyebilir. Kritik Başarı Hedef etkilenmez. Başarı Hedef 1 tur boyunca iyileştir büyüsünden yarı yarıya daha az iyileşir ve zarar ver büyüsünden yarı yarıya daha az hasar alır. Başarısızlık Etkiler yukarıda açıklandığı gibidir. Güçlendirilmiş (+1) Geri kazandırılan Can Puanlarına gelen statü bonusu 2 artar.


omen://spell/unusual-anatomy?source=paizo-pathfinder-player-core-2:
  name: Olağandışı Anatomi
  description: >
    Etinizi ve organlarınızı parıldayan deri, kaba pullar, kıl kümeleri ve tümörlü çıkıntılardan oluşan tuhaf bir karışıma dönüştürürsünüz. Bunun üç etkisi vardır: Zayıf nokta hasarına karşı 10 direnç ve kritik vuruşlardan kaynaklanan fazladan hasara karşı 10 direnç kazanırsınız. Direnç fazladan hasardan büyükse, fazladan hasarı 0'a indirir ancak saldırının normal hasarını azaltmaz. Karanlıkgörüş kazanırsınız. Derinizden asit sızar. Size silahsız bir saldırı veya erişim özelliği olmayan bir yakın dövüş silahıyla vuran herhangi bir yaratık 2d6 asit hasarı alır. Güçlendirilmiş (+2) Dirençler 5 artar ve asit hasarı 1d6 artar.


omen://spell/vampiric-maiden?source=paizo-pathfinder-player-core-2:
  name: Vampirik Demir Bakire
  description: >
    Hedefin üzerine hayaletsi bir demir bakire kapanır ve sizin menfaatiniz için onun canlılığını emer. Bu durum 4d4 delici hasar ve 4d4 hiçlik hasarı verir ve hedef bir Dayanıklılık kurtarışı denemelidir. Hedefin aldığı hiçlik hasarına eşit miktarda geçici Can Puanı kazanırsınız (dirençler, zaaflar ve benzerleri uygulandıktan sonra). Kalan geçici Can Puanlarını 1 dakika sonra kaybedersiniz. Kritik Başarı Hedef etkilenmez. Başarı Hedef yarı hasar alır. Başarısızlık Hedef kısa süreliğine vampirik demir bakirenin içine hapsolur. Hedef tam hasar alır ve 1 tur boyunca ya da kendisini kurtarmak için bir Etkileşime Gir eylemi kullanana kadar (hangisi önce gelirse) demir bakire tarafından Hareketsiz Kılınır. Kritik Başarısızlık Hedef iki kat hasar alır ve 1 tur boyunca ya da Kurtulana kadar (ZD büyü ZD'nizdir) vampirik demir bakire tarafından hareketsiz kılınır (hangisi önce gelirse). Güçlendirilmiş (+1) Delici ve hiçlik hasarları her biri 1d4 artar.


omen://spell/visions-of-danger?source=paizo-pathfinder-player-core-2:
  name: Tehlike Görüleri
  description: >
    Korkunç yaratıklardan oluşan bir yanılsama büyünün alanını doldurur. Yaratıklar, şeytani sinekler veya hareketli testere bıçakları gibi sizin seçeceğiniz belirli bir görünüme sahip Minik sürü canavarlarına benzer. Patlama, yaratıldığında patlamanın içinde olan, patlamaya giren veya turuna patlamanın içinde başlayan her yaratığa basit bir İrade kurtarışı ile 8d8 zihinsel hasar verir. İrade kurtarışında kritik başarı elde eden bir yaratık anında yanılsamaya inanmamayı deneyebilir. Canavarlarla Etkileşime Girmeyi deneyen veya bir Ara eylemiyle birini gözlemleyen bir yaratık yanılsamaya inanmamayı deneyebilir. Yanılsamaya inanmayan yaratıklar bundan sonra yanılsamadan hasar almazlar. Güçlendirilmiş (+1) Zihinsel hasar 1d8 artar.


omen://spell/vomit-swarm?source=paizo-pathfinder-player-core-2:
  name: Sürü Kus
  description: >
    Büyülü haşaratlardan oluşan bir sürü kusarsınız. Yaratıkları kendi hayal gücünüzden çağırıp şekillendirirsiniz; bu durum yaratıkların görünümünü değiştirmenize olanak tanır (genellikle kırkayaklar, hamamböcekleri, yaban arıları ve solucanların bir karışımı), ancak bu büyünün etkisini değiştirmez. Haşaratlar alandaki herkesin üzerine üşüşür; ısırıkları ve iğneleri 2d8 delici hasar verir (basit Refleks kurtarışı). Kurtarışta başarısız olan bir yaratık ayrıca Midesi Bulanmış 1 olur. Büyü sona erdiğinde sürü kaybolur. Güçlendirilmiş (+1) Hasar 1d8 artar.


omen://spell/wall-of-flesh?source=paizo-pathfinder-player-core-2:
  name: Et Duvarı
  description: "30 fite kadar uzunlukta düz bir hat üzerinde 20 fit yüksekliğinde yaşayan etten bir duvar örersiniz. Duvar 3 fit kalınlığındadır ve her 5 fitlik bölümün SD'si 10 ve Can Puanı 75'tir. Dilerseniz duvar daha küçük bir uzunlukta veya yükseklikte olabilir. Duvarı kesintisiz açık bir alanda oluşturmalısınız, öyle ki kenarları hiçbir yaratığın veya nesnenin içinden geçmemelidir; aksi takdirde büyü kaybolur. Duvar Onarılamaz ancak dirim ile ve iyileştirme büyüleri ve yetenekleriyle iyileştirilebilir. Büyüyü Yaptığınızda duvarınız için aşağıdaki özelliklerden birini seçin. Ağızlar Duvarın yüzeyi boyunca sayısız dişli ağız bulunur. Ağızlar, duvarın 5 fiti içinde turunu bitiren herhangi bir yaratığa bu Saldırılar için büyü saldırı niteleyicinizi kullanarak Saldırır ve (1+(ceil((spell rank - 4) / 2)))d6[piercing] hasar verir. Ağızlar iksirleri tüketme yeteneğine sahiptir; duvar canlı olduğu için bir İyileştirme İksirinden Can Puanı geri kazanabilir, ancak ona hareket etme yeteneği verecek herhangi bir etkiden faydalanamaz. Bunun dışında hangi iksirlerin duvarı etkileyebileceğini GM belirler. Gözler Duvar yüzlerce kırpışmayan göz çıkarır. Bu gözlerden görebilir, duvarın görüş hattı içinde görsel Dikkat testlerine +2 durumsal bonus kazanırsınız. Gözleri menzilli saldırılar ve büyüler için görüş hattını belirlemede de kullanabilirsiniz, ancak duvarın içinden etki hattına sahip olmazsınız. Kollar Duvar kavrayan kollardan oluşan bir yığındır. Duvarın 5 fiti içinde turunu bitiren herhangi bir yaratık bir Refleks kurtarışı denemelidir. Başarı Yaratık etkilenmez. Başarısızlık Yaratık 1 tur boyunca veya büyü ZD'nize karşı Kurtulana kadar (hangisi önce gerçekleşirse) duvar tarafından Kavranır. Kritik Başarısızlık Yaratık 1 tur boyunca veya büyü ZD'nize karşı Kurtulana kadar (hangisi önce gerçekleşirse) duvar tarafından Bağlanır. Yükseltilmiş (+2) Duvarın her bir bölümünün Can Puanı 10 artar ve duvarın ağızlarının verdiği delici hasar 1d6 artar."

omen://spell/wanderers-guide?source=paizo-pathfinder-player-core-2:
  name: Gezginin Rehberi
  description: "Rotanızı yönlendirmesi için ötelerden çağrıda bulunursunuz. Bu Büyüyü Yaptığınızda bir varış noktası seçersiniz; bu hedefe yönelik ilham verici bir rota alırsınız; bu da ilham verici rotadan sapmadığınız sürece, sizin ve sizinle birlikte karadan seyahat eden müttefiklerinizin süre boyunca zorlu araziden kaynaklanan hareket cezasını yarı yarıya azaltmasına olanak tanır. Bunun karşılaşmalar sırasındaki harekete herhangi bir etkisi yoktur. Süre dolmadan önce bu yeteneği tekrar kullanırsanız bu etki sona erer ve yerini yeni rotanınkine bırakır."

omen://spell/ward-domain?source=paizo-pathfinder-player-core-2:
  name: Alanı Mühürle
  description: >
    Alan: 100 fit × 100 fit, 50 fite kadar yükseklikte. Bu ritüel güçlü hükümdarların, büyücülerin ve diğer önemli şahsiyetlerin özel sığınaklarını korumak için uzun süredir kullanılmaktadır. Siz ve diğer büyücüler, büyü yapma süresini tütsü yakarak, kapı pervazlarını meshederek ve girişlerin üzerine toz hâlindeki gümüşle çizgiler çekerek geçirirsiniz. Ritüel, alan içinde aşağıdaki büyüsel etkileri yaratır; bu etkiler alanı mühürle seviyesine güçlendirilir ve süre boyunca kalır. Alandaki tüm kapılar, geçitler, pencereler ve benzeri açıklıklar (varsa) Kilitle etkileriyle kilitlenir. Buna ek olarak, alan içindeki en fazla altı kapıyı, kapı aralığını veya benzeri girişi Yanılsama Nesne etkileriyle düz duvarlar gibi görünecek şekilde gizleyebilirsiniz. Kehanet büyüleri alandan hiçbir uyarıcıyı algılayamaz ve alanı mühürle, ritüelin kurtarış ZD'si – 10'a eşit bir bonus kullanarak alana yaratık çağırma girişimleri de dâhil olmak üzere alanın içine veya dışına yapılan ışınlanma etkilerini bozmaya çalışır. Belirli bir etki üzerinde kullanılan başarılı bir Büyü Boz yalnızca o etkiyi kaldırır (örneğin bir penceredeki kilitleme etkisi). Başarılı bir Büyü Patlat ise tüm ritüeli sona erdirir. Kritik Başarı Yukarıda açıklanan etkileri yaratırsınız ve iki kat büyüklükte bir alanı korursunuz. Başarı Yukarıda açıklanan etkileri yaratırsınız. Başarısızlık Ritüel hiçbir etki göstermez. Kritik Başarısızlık Alan, öngörmediğiniz bir şekilde siz ve müttefikleriniz için tuzaklı ve düşmanca bir hâl alır. Güçlendirilmiş (+1) Mühür, orijinal alanla bitişik, 50 fite kadar yükseklikte ilave bir 100 fit × 100 fitlik alanı kapsar.


omen://spell/weapon-of-judgment?source=paizo-pathfinder-player-core-2:
  name: Yargı Silahı
  description: >
    Ruhani enerjiden devasa bir silah belirir ve hedefin üzerindeki havada süzülür. Silah, ilahınızın gözde silahının hayaletsi görsel görünümüne sahiptir. Bu büyüyü yapırken savaş ya da barış adını verin. "Savaş" derseniz, zihnen bir yaratık seçin. Bu, hem sizin hem de hedefin görebildiği bir yaratık olmalıdır. Hedef içgüdüsel olarak bunun hangi yaratık olduğunu bilir. Hedefin her sırasının sonunda, hedef o tur sırasında seçtiğiniz yaratığa karşı düşmanca bir eylem kullanmadıysa silah hedefe Saldırır. "Barış" derseniz, zihnen en fazla beş müttefik seçin. Hedef içgüdüsel olarak o müttefiklerin kim olduğunu bilir. Hedef size veya seçilen müttefiklerden birine karşı her düşmanca eylem kullandığında silah hedefe Saldırır. Silah, eylem birden fazla müttefiki hedef alsa bile (Ateş Topu veya Hortum Saldırısı gibi) eylem başına yalnızca bir kez Saldırır. Silahla yapılan Saldırılar yakın dövüş silah saldırılarıdır, ancak sizin büyü saldırı bonusunuzu kullanırlar. Görünüşü ne olursa olsun silah 4d10 hasar verir. Hasar türü seçilen silahla aynıdır (veya çok yönlü bir silah için türlerinden herhangi biri). GM tarafından belirlendiği üzere yaratık için daha zararlı olacaksa saldırı bunun yerine ruh hasarı verir. Silahın başka hiçbir istatistiği veya niteliği geçerli değildir ve menzilli bir silah bile yalnızca bitişik yaratıklara saldırır. Silah, hedefin turu boyunca artan bir çoklu saldırı cezası alır, ancak cezası sizinkinden ayrıdır. Yargı silahı; tetikleyiciler, dirençler ve benzeri amaçlar bakımından bir silahtır. Silah yer kaplamaz, kuşatma sağlamaz veya bir yaratığın sahip olacağı başka herhangi bir niteliğe sahip değildir. Silah, Saldırısı dışında hiçbir vuruş yapamaz ve silahları etkileyen hünerler veya büyüler bu silah için geçerli değildir. Güçlendirilmiş (10.) Hasar 1d10 artar.

  requirements: Bir ilahınız olmalıdır.

omen://spell/weapon-trance?source=paizo-pathfinder-player-core-2:
  name: Silah Transı
  description: Şiddetin dinginliği zihninizi doldurarak silahlarınızın tam olarak nerede olması gerektiğine dair yükseltilmiş bir his verir. Süre boyunca, harp silahlarındaki uzmanlığınız basit silahlardaki uzmanlığınıza eşit olur.

omen://spell/web?source=paizo-pathfinder-player-core-2:
  name: Ağ
  description: >
    Alanda yaratıkların hareketini engelleyen yapışkan bir ağ yaratırsınız. Ağla kaplı kareler zorlu arazidir. Ağın içindeki bir yaratık bir hareket eylemi kullanmaya başladığı veya kullandığı bir hareket eylemi sırasında ağa girdiği her seferde, Hareket Hızına durumsal ceza almaktan veya Hareketsiz Kılınmaktan kaçınmak için büyü ZD'nize karşı bir Atletizm testi veya Refleks kurtarışı denemelidir. Ağdan çıkan bir yaratık ağdan dolayı Hızına durumsal ceza almayı bırakır. Her bir kare, en az 5 kesici hasar veya 1 ateş hasarı veren tek bir saldırı ya da etkiyle ağdan temizlenebilir. Bir karenin ZK'si 5'tir ve kurtarışlarnda otomatik olarak başarısız olur. Kritik Başarı Yaratık etkilenmez ve bu tur ağa karşı daha fazla Atletizm testi veya kurtarış denemesi gerekmez. Bir Atletizm testi kullandıysa hareketi sırasında terk ettiği her kareden ağı temizler. Başarı Yaratık eylemi sırasında etkilenmez. Bir Atletizm testi kullandıysa hareketi sırasında terk ettiği her kareden ağı temizler. Başarısızlık Yaratık bir sonraki sırasının başlangıcına kadar Hareket Hızına –10 fitlik durumsal ceza alır. Kritik Başarısızlık Yaratık bir sonraki sırasının başlangıcına kadar hareketsiz kılınır, ardından 1 tur boyunca Hareket Hızına –10 fitlik durumsal ceza alır. Hareketsiz kılınmış durumunu ortadan kaldırmak için Kurtulmayı deneyebilir. Güçlendirilmiş (4.) Büyünün alanı bir patlamaya genişler ve menzili 60 fite çıkar.


omen://spell/whirling-flames?source=paizo-pathfinder-player-core-2:
  name: Girdap Alevleri
  description: >
    O alandaki tüm yaratıkları saran ve basit bir Refleks kurtarışı ile 5d6 ateş hasarı veren bir fırıl fırıl dönen alev fırtınası çağırırsınız. Güçlendirilmiş (+2) Hasar 3d6 artar ve alana çakışmayan bir 5 fitlik patlama daha ekleyebilirsiniz.


omen://spell/whispers-of-the-void?source=paizo-pathfinder-player-core-2:
  name: Boşluk Fısıltıları
  description: "Dili aşan ve düşmanlarınızın kulaklarına sihirli bir şekilde taşınan meşum sırlar fısıldarsınız. Sözcükler fiziksel bir biçim alarak her biri bir Dayanıklılık kurtarışı denemesi gereken hedeflerin yaşam gücünü zayıflatır. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık (floor(spell rank/2))d8[persistent,void] hasar alır. Başarısızlık Yaratık (floor(spell rank/2)*2)d8[persistent,void] hasar alır ve İçi Çekilmiş 1 olur. Kritik Başarısızlık Yaratık (floor(spell rank/2)*2)d8[persistent,void] hasar alır, İçi Çekilmiş 2 ve Lanetlenmiş 1 olur. Yükseltilmiş (+2) Bir başarıda süregelen boşluk hasarı 1d8, bir başarısızlık veya kritik başarısızlıkta ise 2d8 artar."

omen://spell/wild-winds-stance?source=paizo-pathfinder-player-core-2:
  name: Vahşi Rüzgârlar Duruşu
  description: "Akıp giden rüzgârların duruşunu alarak uzaktan enerji dalgaları gönderirsiniz. 30 fit içindeki hedeflere karşı menzilli Saldırılar olarak rüzgâr çarpması silahsız Vuruşları yapabilirsiniz. Bunlar 1d6 ezici hasar verir; brawling grubundadır; ve agile, nonlethal, propulsive ile unarmed özelliklerine sahiptir. Rüzgâr çarpması Saldırıları Gizlenmeyi ve tüm siperleri göz ardı eder. Vahşi rüzgârlar duruşundayken, menzilli saldırılara karşı ZK'nize +2 durumsal bonus kazanırsınız."

omen://spell/wind-jump?source=paizo-pathfinder-player-core-2:
  name: Rüzgâr Sıçrayışı
  description: >
    Hızınıza eşit bir uçma Hareket Hızı kazanırsınız. Sıranızı katı bir zeminde bitirmelisiniz, aksi takdirde düşersiniz. Güçlendirilmiş (6.) Sıranızın sonunda, havada tutunacak yer bulmak için bir test deneyebilirsiniz. Başarılı olursanız düşmezsiniz.


omen://spell/youre-mine?source=paizo-pathfinder-player-core-2:
  name: Sen Benimsin
  description: >
    Hedefin duygularını manipüle ederek kısa bir an için onu kontrol etme potansiyeli elde edersiniz. Hedef bir İrade kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedef Sersemlemiş 1 olur. Başarısızlık Hedefin bir sonraki sırasında hedef Sersemlemiş 1 olur ve siz onu kısmen kontrol ederek seçtiğiniz tek bir eylemi yapmasını sağlarsınız. Eylemleri kaldıysa normal şekilde hareket edebilir. Kritik Başarısızlık Hedef 1 tur boyunca Kontrol Edilir. Güçlendirilmiş (7.) Başarısızlıkta hedef 1 tur boyunca Kontrol Edilir. Kritik başarısızlıkta hedef 1 dakikaya kadar kontrol edilir; her sırasının sonunda yeni bir İrade kurtarışı alır ve başarı durumunda büyü sona erer.
