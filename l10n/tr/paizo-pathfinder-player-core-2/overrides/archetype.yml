# tr overrides: archetype

omen://archetype/acrobat/feats/graceful-leaper?source=paizo-pathfinder-player-core-2:
  name: Zarif Sıçrayıcı
  description: >
    Kendinizi havaya fırlatırken kütle ve kas anlamsızdır; yalnızca zarafet ve denge
    önemlidir. Bir Yüksek Atlama veya Uzun Atlama yaparken bir Atletizm testi yerine
    bir Akrobasi testi atabilirsiniz.
  prerequisites:
  - text: Akrobat Yolu
  - text: Usta Akrobasi
omen://archetype/archaeologist/feats/scholastic-identification?source=paizo-pathfinder-player-core-2:
  name: Akademik Tanılama
  description: >
    Kadim metinleri ve kültürel eserleri anlamak için gereken bilgiye sahipsiniz.
    İncelediğiniz yazı türü ne olursa olsun, Yazı Çözümlerken Sosyoloji becerisini
    kullanabilirsiniz. Ayrıca kültürel öneme sahip büyülü bir nesneyi veya mekânı
    incelerken Büyüyü Tanılamak için Sosyoloji becerisini kullanabilirsiniz.
  prerequisites:
  - text: Arkeolog Yolu
  - text: Usta Sosyoloji
omen://archetype/archaeologist/feats/settlement-scholastics?source=paizo-pathfinder-player-core-2:
  name: Yerleşim İlimleri
  description: Çalışmalarınız yeni ufuklar açar. Belirli bir yerleşim yeri seçin.
    O yerleşim yeri için İlim becerisinde Ek İlim beceri hünerini kazanırsınız ve
    o yerleşim yerinde yaygın olan, seçeceğiniz yaygın veya yaygın olmayan tek bir
    dili öğrenirsiniz.
  prerequisites:
  - text: Arkeolog Yolu
omen://archetype/cavalier/feats/quick-mount?source=paizo-pathfinder-player-core-2:
  name: Hızlı Biniş
  description: Siz ve binek hayvanınız bir anlık uyarıyla harekete geçebilirsiniz.
    Yaratığa Biner ve ona seçtiğiniz bir emri vermek için Bir Hayvana Komut Verirsiniz.
  prerequisites:
  - text: Süvari Yolu
  - text: Uzman Doğa
omen://archetype/dandy/feats/distracting-flattery?source=paizo-pathfinder-player-core-2:
  name: Dikkat Dağıtıcı İltifat
  description: >
    Kaba saba bir ortamda bile iyi bir izlenimi nasıl sürdüreceğinizi ve imajınızı
    nasıl yöneteceğinizi bilirsiniz. Hedefin İrade ZD'sine karşı bir Aldatma testi
    yapın. Sonucunuz ne olursa olsun hedef 10 dakika boyunca Dikkat Dağıtıcı İltifatınıza
    karşı geçici olarak bağışık olur.
  prerequisites:
  - text: Züppe Yolu
  - text: Uzman Aldatma
omen://archetype/dandy/feats/fabricated-connections?source=paizo-pathfinder-player-core-2:
  name: Uydurma Bağlantılar
  description: >
    Bir eylemi gerçekleştirdiğinize dair o kadar ikna edici bir şekilde yalan söyleyebilirsiniz
    ki, onu başarıyla tamamlamanın tüm somut faydalarını elde edersiniz. Gelir Elde
    Et, İyi İzlenim Bırak, Rica Et veya Barın girişimlerinde bulunurken farklı bir
    beceri yerine Aldatma zarı atabilirsiniz. İyi İzlenim Bırakmak veya Rica Etmek
    için Uydurma Bağlantılar'ı günde bir kez kullanabilirsiniz; ayrıca Gelir Elde
    Etmek veya Barınmak için haftada bir kez kullanabilirsiniz.
  prerequisites:
  - text: Züppe Yolu
  - text: Usta Aldatma
omen://archetype/dandy/feats/party-crasher?source=paizo-pathfinder-player-core-2:
  name: Davetsiz Misafir
  description: >
    Ne kadar seçkin olurlarsa olsunlar, tüm şık sosyete partilerine katılırsınız.
    Taç giyme töreni, kraliyet galası veya başka bir sosyete etkinliği gibi normalde
    erişiminizin reddedileceği bir sosyal etkinlikle karşılaştığınızda, bir beceri
    testine gerek kalmadan giriş sağlamak için 1d4 saat harcayabilirsiniz. Kendiniz
    ve müttefikleriniz için davetiyeler, şık eşlikçiler arayan davetliler, ikram görevlileriyle
    geçici işler, başka tarafa bakmaya istekli etkinlik personeli veya başka bir erişim
    yolu bulursunuz. Bu yetenek gizli etkinliklere veya personelin, eşlikçilerin ya
    da yabancıların dahil olmadığı diğer küçük özel toplantılara uygulanmaz.
  prerequisites:
  - text: Züppe Yolu
  - text: Usta Sosyoloji
omen://archetype/gladiator/feats/fancy-moves?source=paizo-pathfinder-player-core-2:
  name: Fiyakalı Hareketler
  description: Düşmanlarınızın hevesini kırmak için dövüş tarzınızı sergilersiniz.
    Gözdağı Vermek için Gösteri becerisini kullanabilirsiniz.
  prerequisites:
  - text: Gladyatör Yolu
  - text: Uzman Gösteri
omen://archetype/herbalist/feats/fresh-ingredients?source=paizo-pathfinder-player-core-2:
  name: Taze Malzemeler
  description: Taze şifalı otların yarattığı fark inanılmazdır. Yaraları Tedavi Etmek
    için Doğal Tıp kullanırken, vahşi doğada olmasanız bile taze malzemelere sahip
    olmaktan gelen +2 durumsal bonusunu kazanırsınız. Bunu vahşi doğada yaparsanız
    bunun yerine +4 durumsal bonus kazanırsınız.
  prerequisites:
  - text: Otacı Yolu
omen://archetype/linguist/feats/analyze-idiolect?source=paizo-pathfinder-player-core-2:
  name: Ağız Analizi
  description: >
    Belirli bir bireyin bireysel konuşma ağzını çözümler, konuşma tarzını ve alışkanlıklarını
    ezberlersiniz. Biriyle en az 10 dakika etkileşimde bulunursanız, daha sonra o
    kişinin Kılığına Bürünmeyi denediğinizde Aldatma testlerinize ve ZD'lerinize +4
    durumsal bonus kazanırsınız. Gereken yoğun karakter incelemesi nedeniyle, aynı
    anda birden fazla kişinin konuşma ağzını aklınızda tutamazsınız.
  prerequisites:
  - text: Dilbilimci Yolu
  - text: Uzman Aldatma
  - text: Uzman Sosyoloji
omen://archetype/linguist/feats/multilingual-cipher?source=paizo-pathfinder-player-core-2:
  name: Çok Dilli Şifre
  description: >
    Kodlar oluşturmak ve kırmak için birden fazla dil kullanırsınız. Yazı Çözümleme
    testlerine +1 durumsal bonus kazanırsınız. Başka bir yaratık şifrelediğiniz bir
    Yazıyı Çözümlemeye kalkışırsa, yazıyı oluştururken kullandığınız tüm dilleri konuşmadığı
    sürece -2 durumsal ceza alır.
  prerequisites:
  - text: Dilbilimci Yolu
  - text: Uzman Sosyoloji
omen://archetype/linguist/feats/phonetic-training?source=paizo-pathfinder-player-core-2:
  name: Fonetik Eğitim
  description: Anlamlarını anlamasanız bile kelimeleri neredeyse kusursuz bir doğrulukla
    telaffuz edip tekrarlayabilir ve bunları sizin veya Fonetik Eğitim'e sahip başka
    bir yaratığın daha sonra okumasına olanak tanıyan fonetik bir yazıyla yazabilirsiniz.
    Kelimeler telaffuz edemediğiniz seslere sahip bir dilde olsa bile onları aslına
    sadık kalarak aktarabilirsiniz. Uzun kelime dizilerini ezberlemek normalde olduğu
    kadar zor kalmaya devam eder.
  prerequisites:
  - text: Dilbilimci Yolu
  - text: Uzman Sosyoloji
omen://archetype/linguist/feats/read-shibboleths?source=paizo-pathfinder-player-core-2:
  name: Parolaları Çöz
  description: >
    Tüm iletişim hafif ipuçları ve sinyallerle doludur. Biriyle en az 10 dakika etkileşimde
    bulunursanız, bölgesel kelimeleri, telaffuz değişiklikleri ve sözsüz ipuçları
    size onun memleketi veya ait olabileceği belirli gruplar gibi sosyal çevresi hakkında
    küçük bir bilgi sağlar. Bu yeteneğin hedefi, bir soylu gibi davranan bir halktan
    biri gibi sosyal çevresi hakkında aldatıcı davranıyorsa, Sosyoloji ZD'nize karşı
    bir Aldatma, Sosyoloji veya uygun bir İlim testi denemelidir; başarı durumunda
    benimsediği kimlikle tutarlı sahte ve önemsiz bir bilgi verir. Bir kişi hakkında
    bir veya daha fazla doğru önemsiz bilgi edindikten sonra, kendinizi ona tanıdık
    gelecek bir şekilde sunmak için bu tavırları konuşmanıza dahil edebilirsiniz.
    Bu, onunla yapacağınız Diplomasi ve Aldatma testlerinize +1 durumsal bonus kazandırır.
  prerequisites:
  - text: Dilbilimci Yolu
  - text: Usta Sosyoloji
omen://archetype/medic/feats/holistic-care?source=paizo-pathfinder-player-core-2:
  name: Bütüncül Bakım
  description: Duygusal ve ruhsal bakım sağlarsınız. Durumu Tedavi Et ile azaltabileceğiniz
    durumlar listesine Korkmuş, Zihni Uyuşmuş ve Sersemlemiş durumlarını ekleyin.
    Sersemlemiş durumunun bir değer yerine bir süresi varsa, onu azaltmak için Durumu
    Tedavi Et eylemini kullanamazsınız.
  prerequisites:
  - text: Eğitimli Diplomasi
  - text: Durumu Tedavi Et
omen://archetype/medic/feats/treat-condition?source=paizo-pathfinder-player-core-2:
  name: Durumu Tedavi Et
  description: Sakar, Güçten Düşmüş veya Midesi Bulanmış durumunu azaltmak amacıyla
    bitişiğinizdeki bir yaratığı tedavi edersiniz. Bir yaratık bu listeden birden
    fazla duruma sahipse birini seçin. Etkisiz kılma değiştiriciniz olarak Tıp değiştiricinizi
    ve ZD'yi belirlemek için durumun kaynağını kullanarak duruma karşı bir etkisiz
    kılma testi deneyin. Efsanevi Sıhhiyeci hünerine sahip olmadığınız sürece 20.
    seviyenin üzerindeki bir kutsal emanetten veya etkiden gelen bir durumu tedavi
    edemezsiniz; sahip olsanız bile etkisiz kılma ZD'si 10 artar. Belirli koşullar
    altında sürekli uygulanan bir Durumu Tedavi Etmek (örneğin mübarek bir karakterin
    şerli rüne sahip bir silah taşımasından kazandığı güçten düşmüş durumu), bu koşullar
    devam ettiği sürece hiçbir etki göstermez.
  prerequisites:
  - text: Sıhhiyeci Yolu
omen://archetype/pirate/feats/rope-runner?source=paizo-pathfinder-player-core-2:
  name: İp Koşucusu
  description: İpler ve donanımlar üzerinde neredeyse yerdeki kadar kolay koşar ve
    tırmanırsınız. Yalnızca iplere ve benzeri nesnelere tırmanırken olmak üzere 15
    fitlik bir tırmanma Hızı kazanırsınız. Tırmanmak için bir Atletizm testinde veya
    Dengede Kalmak için bir Akrobasi testinde her başarı elde ettiğinizde, bunun yerine
    kritik başarı elde edersiniz. Bir ip veya benzeri nesne üzerinde Tırmanırken ya
    da Dengede Kalırken Gafil kalmazsınız.
  prerequisites:
  - text: Eğitimli Akrobasi
  - text: Eğitimli Atletizm
  - text: Korsan Yolu
omen://archetype/ritualist/feats/resourceful-ritualist?source=paizo-pathfinder-player-core-2:
  name: Becerikli Ritüelci
  description: Normalde becerinizin hemen ötesinde olabilecek zorlu ritüelleri yapabilirsiniz.
    Eğitimliyseniz uzman yetkinlik gerektiren, uzmansanız usta yetkinlik gerektiren
    veya ustaysanız efsanevi yetkinlik gerektiren bir ritüeli yapmak için testler
    deneyebilirsiniz.
  prerequisites:
  - text: Ritüelci Yolu
omen://archetype/scrounger/feats/expert-disassembly?source=paizo-pathfinder-player-core-2:
  name: Uzman Parçalama
  description: >
    Nesneleri tersine mühendislikle çözmek için kullandığınız tekniklerin aynısını
    tehlikeli tuzakları devre dışı bırakmak ve kilitleri kırmak için de uygulayabilirsiniz.
    Düzeni Etkisizleştirmek veya Kilit Açmak için Hırsızlık yerine Zanaat kullanabilirsiniz.
    Kilit Aç Düzeni Etkisizleştir
  prerequisites:
  - text: Usta Zanaat
  - text: Arakçı Yolu
omen://archetype/scrounger/feats/reverse-engineering?source=paizo-pathfinder-player-core-2:
  name: Tersine Mühendislik
  description: >
    Nesnelerle neredeyse sürekli uğraşıp kurcalamanız, eşyaları formüllere dönüştürmek
    için tersine mühendisliği çoğu kişiden daha etkili şekilde yapabildiğiniz anlamına
    gelir. Bir eşyadan bir formülü tersine mühendislikle çıkarmak için yapılan Zanaat
    testlerine +2 durumsal bonus kazanırsınız ve 2 gün yerine hazırlık için 1 günlük
    çalışma harcadıktan sonra bir eşyayı tersine mühendislikle incelemek üzere bir
    Zanaat testi deneyebilirsiniz. Ek olarak, Zanaat testinizde kritik başarı elde
    ederseniz, yalnızca formülü oluşturmakla kalmayıp aynı zamanda orijinal eşyayı
    da yeniden monte etmeyi seçebilirsiniz; bu da formül ve eşya değerinin yarısına
    eşit hammadde yerine formül ve eşya ile kalmanızı sağlar.
  prerequisites:
  - text: Uzman Zanaat
  - text: Hurdacı Yolu
omen://archetype/sentinel/feats/steel-skin?source=paizo-pathfinder-player-core-2:
  name: Çelik Ten
  description: Zırhınızı ikinci bir deri gibi giyer, sunduğu korumada teselli bulursunuz.
    Zırh giyerken uyursanız Bitkin hâle gelmezsiniz.
  prerequisites:
  - text: Eğitimli Hayatta Kalma
  - text: Gözcü Yolu
omen://archetype/vigilante/feats/hidden-magic?source=paizo-pathfinder-player-core-2:
  name: Gizli Büyü
  description: >
    Teçhizatınızın büyülü auralarını gizlemeyi öğrendiniz. Günlük hazırlıklarınız
    sırasında büyülü eşyalarınızın herhangi birini veya tamamını büyülü değilmiş gibi
    görünecek şekilde dikkatlice ayarlarsınız. Bu şekilde ayarlanan nesneler bir sonraki
    hazırlıklarınıza kadar öyle kalır. Büyüyü Tespit Et veya Aura Oku kullanan bir
    büyü kullanıcısı, yanıltmacalarınızı fark edebilmek için Aldatma ZD'nize karşı
    bir Dikkat testinde başarılı olmalıdır.
  prerequisites:
  - text: Uzman Arkana, Doğa, Okültizm veya Din
  - text: Yasadışı Kanun Koruyucu Yolu
omen://archetype/vigilante/feats/minion-guise?source=paizo-pathfinder-player-core-2:
  name: Yandaş Kılığı
  description: >
    Sosyal kimliğinizdeyken, bir sınıf özelliğinden kazandığınız bir yoldaş hayvanına,
    tanıdığa veya başka bir yandaşa da sosyal bir kimlik bahşedebilirsiniz. Sosyal
    kimliğinize bürünürken, yandaşınızın görünümünü de kendi türünün sosyal olarak
    kabul edilebilir bir yaratığına dönüştürürsünüz; örneğin bir kurdu büyük bir köpek
    gibi tımar eder veya bir ruhdaş hayvanı egzotik bir evcil hayvan gibi gizlersiniz.
    Bu sosyal kimlikteyken yandaşınıza sınıf özelliklerinizden veya hünerlerinizden
    kazandığı olağandışı büyülü ya da savaş yeteneklerini kullanmasını emretmek, milis
    kimliğinizi ifşa etme riski taşır.
  prerequisites:
  - text: yoldaş hayvan veya ruhdaş hayvan
  - text: Uzman Aldatma
  - text: Milis Yolu
omen://archetype/vigilante/feats/subjective-truth?source=paizo-pathfinder-player-core-2:
  name: Öznel Hakikat
  description: Farklı kimlikleriniz, yalanları tespit eden büyüyü alt etmenize olanak
    tanır. Söyledikleriniz mevcut kimliğinizin bakış açısından doğru olduğu sürece,
    Hakikat Yüzüğü gibi yalanları açığa çıkaran etkileri aldatabilirsiniz.
  prerequisites:
  - text: Usta Aldatma
  - text: Milis Yolu
