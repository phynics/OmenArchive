omen://class/barbarian/instincts/fury-instinct?source=paizo-pathfinder-player-core-2:
  name: Gazap İçgüdüsü
  description: >
    Öfkeniz içinizdeki derin ve tamamen kişisel bir kaynaktan gelir. Öfkenizi dilediğiniz gibi kullanırsınız. İçgüdü Yeteneği—Durdurulamaz Çılgınlık Öfke eyleminden gelen ek hasarı 2'den 3'e yükseltin. 1. seviye fazladan bir barbar hüneri kazanırsınız. Öfke Direnci (9.) Fiziksel silah hasarına direnirsiniz, ancak diğer kaynaklardan (örneğin silahsız saldırılardan) gelen fiziksel hasara direnmezsiniz.


omen://class/barbarian/instincts/giant-instinct?source=paizo-pathfinder-player-core-2:
  name: Dev İçgüdüsü
  description: >
    Öfkeniz size bir devin saf gücünü ve boyutunu kazandırır. Bu mutlaka devlere saygı duyduğunuz anlamına gelmez—onlarla alay edebilir, hatta onları katletmeyi arzulayabilirsiniz! Olağanüstü kuvvetiniz veya hayatın olağan sınırlarını aşan duygularınız ve egonuz nedeniyle diğer insanlara bir dev gibi de görünebilirsiniz. İçgüdü Yeteneği—Titan Ezici Küçük veya Orta boyuttaysanız Büyük bir yaratık için yapılmış bir silahı kullanabilirsiniz (hem normalde hem de öfkeliyken). Küçük veya Orta boyutta değilseniz, sizden bir boy büyük bir yaratık için yapılmış bir silahı kullanabilirsiniz. Ücretsiz olarak edindiğiniz böyle bir silahla başlarsınız. Bu silah yaygın bir yakın dövüş veya menzilli silah olmalı, Fiyatı 9 gp veya daha az olmalı (daha büyük bir silah olmaktan kaynaklanan Fiyat ayarlaması hariç) ve yaygın olmalı ya da başka bir şekilde erişiminiz bulunmalıdır. Bu sizin kişisel silahınızdır ve daha sonra üzerine rünler eklemediğiniz sürece satıldığında hiçbir değeri yoktur; ayrıca boyutundaki bir silah için normal Yüke sahiptir. Savaşta daha büyük bir silah kuşanırken, Öfke eyleminden gelen ek hasarınızı 2'den 6'ya yükseltin; ancak silahın hantal boyutu nedeniyle Sakar 1 durumuna sahip olursunuz. Silahı kuşanırken hiçbir yolla bu Sakar durumunu kaldıramaz veya cezalarını yok sayamazsınız. Öfke Direnci (9.) Ezici hasara ve öfke direnci kazandığınızda seçtiğiniz soğuk, elektrik veya ateş hasarlarından birine direnirsiniz.


omen://class/barbarian/instincts/spirit-instinct?source=paizo-pathfinder-player-core-2:
  name: Ruh İçgüdüsü
  description: >
    İster etrafınızdaki ruhlara karşı duygusal olarak duyarlı olun; ister atalara ya da hayaletlere tapının; ister bir atanın, akrabanın, dostun veya düşmanın tayfı peşinizi bırakmıyor olsun, öfkeniz ruhani bir sahiplenilme biçimini alır. İçgüdü Yeteneği—Ruh Öfkesi Öfkelendiğinizde, Öfke eyleminden gelen ek hasarı 2'den 3'e yükseltebilir ve hasar türünü silahınız veya silahsız saldırınızın hasar türü yerine ruh olarak değiştirebilirsiniz (her Öfke kullandığınızda seçin). Ruh hasarı vermeyi seçerseniz, silahınız veya silahsız saldırınız bedensiz yaratıklara karşı daha etkili olmasını sağlayan Ghost Touch özellik rününün etkilerini kazanır ve Öfke eyleminiz divine ile spirit özelliklerini kazanır. Öfke Direnci (9.) Boşluk hasarının yanı sıra hasar türüne bakılmaksızın hortlak yaratıkların saldırıları ve yetenekleri tarafından verilen hasara direnirsiniz.


omen://class/barbarian/instincts/superstition-instinct?source=paizo-pathfinder-player-core-2:
  name: Hurafe İçgüdüsü
  description: >
    Büyüye karşı duyulan derin bir güvensizlik, sizi büyücülerin metafizik saçmalıklarından vazgeçmeye ve bunlara karşı koymaya iter. İster büyüye güvenmeyen hurafeci bir ailenin veya kültürün üyesi olun, ister Wizard ve Witch'lere karşı sürekli savaşan bir savaşçı, ister zihninizde ve bedeninizde yoğun bir nefret uyandıran büyülü bir kazadan sağ kurtulan biri, ister büyü direnciyle bilinen bir soyun temsilcisi olun, öfkeniz büyüye düşmandır. Bu durum sizi mükemmel bir büyücü avcısı yapar, ancak büyü sanatlarını icra edenlere güvenmekte yavaş kalırsınız. İçgüdü Yeteneği—Hurafeci Direnç Derin hurafeniz gereği, bir Büyü Yapmak veya öğrenmek ya da Büyü Yapmak için etkinleştirilebilen bir eşyayı kuşanmak veya kullanmak sizin için anathema (lanet) sayılır. Bu laneti ihlal ederseniz, kendinizi yeniden dengelemek için 1 günlük boş zaman harcayana kadar içgüdünün yeteneklerini ve bu içgüdüyü ön koşul olarak listeleyen tüm hünerleri kaybedersiniz; ancak diğer tüm barbar yeteneklerinizi korursunuz. Öfkeliyken büyüye karşı tüm kurtarışlara +2 statü bonusu kazanırsınız. Öfke eyleminden gelen hasarınızı 2'den 3'e veya son bir saat içinde Büyü Yaptığına tanık olduğunuz yaratıklara karşı 4'e yükseltin. Öfkeye girdiğinizde, Öfke eyleminden kazandığınız geçici CP'ye eşit Can Puanı geri kazanırsınız; ardından 10 dakika boyunca bu şekilde tekrar CP kazanamazsınız. Öfkeliyken sihirli bir büyünün veya etkinin sonuçlarını isteyerek kabul ederseniz Korkmuş 1 olursunuz. Büyüden veya etkiden etkilendiğiniz sürece korkmuş durumunuzu 1'in altına düşüremezsiniz. Öfke Direnci (9.) İlişkili iki büyü geleneği seçin: mistik ve okült, mistik ve doğa, ilahi ve okült veya ilahi ve doğa. Öfke direnci sınıf özelliğinizden gelen direnç, büyünün verdiği hasarın türüne bakılmaksızın bu iki büyü geleneğiyle yapılan büyülerden aldığınız tüm hasarlara karşı geçerlidir.


omen://class/investigator/features/deductive-improvisation?source=paizo-pathfinder-player-core-2:
  name: Tümdengelimsel Doğaçlama
  description: >
    Tümdengelim becerilerinizi, vakayı çözmek için gerekli olan her türlü görevi yerine getirmek için kullanırsınız. Bir beceride eğitimli olmanızı gerektiren her türlü testi, onda eğitimsiz olsanız bile deneyebilirsiniz; bir beceride uzman yetkinliğe sahip olmanızı gerektiren her türlü testi, onda eğitimli olduğunuz sürece deneyebilirsiniz; ve bir beceride usta yetkinliğe sahip olmanızı gerektiren her türlü testi, onda uzman yetkinliğe sahip olduğunuz sürece deneyebilirsiniz.


omen://class/investigator/features/fortitude-expertise?source=paizo-pathfinder-player-core-2:
  name: Dayanıklılık Uzmanlığı
  description: >
    Animist: Ruhani enerji bedeninizi takviye ederek sizi daha dirençli kılar. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

    Ozan, Komutan, Müfettiş, Kabadayı: Maceralarınızda bünyeniz dayanıklı hâle geldi. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

    Druid: Maceralar bünyenizi daha dayanıklı hâle getirdi. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

    Psychic: Zihniniz, bedeninizi bilinçaltındaki zihinsel benlik imajınıza bağlı tutar. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.


omen://class/investigator/features/investigator-skill-advancement?source=paizo-pathfinder-player-core-2:
  name: Müfettiş Beceri İlerlemesi
  description: Bir müfettiş, her karakterin aldığı beceri hünerleri ve beceri artışlarının ötesinde, 3, 5, 7, 9, 11, 13, 15, 17 ve 19. seviyelerde fazladan bir beceri hüneri ve 2, 4, 6, 8, 10, 12, 14, 16, 18 ve 20. seviyelerde fazladan bir beceri artışı kazanır.

omen://class/investigator/features/light-armor-expertise?source=paizo-pathfinder-player-core-2:
  name: Hafif Zırh Uzmanlığı
  description: Hafif zırh giyerken veya zırhsızken nasıl sıyrılacağınızı öğrendiniz. Hafif zırh ve zırhsız savunma için yetkinlik dereceleriniz uzmanlığa yükselir.

omen://class/investigator/features/master-detective?source=paizo-pathfinder-player-core-2:
  name: Usta Dedektif
  description: >
    Usta bir dedektif olarak her vakayı çözebilir ve mevcut tüm ipuçlarını bulabilirsiniz. Şöhretiniz sizden önce gelir ve en yetenekli suçlular ile sahtekârlar bile sizden korkar. Müfettiş sınıf ZD'niz için yetkinlik dereceniz ustalığa yükselir. Ayrıca, aktif soruşturmalarınızdan birinin kalbindeki soruyu yanıtlamaya yönelik başka bir ipucu içeren yeni bir konuma girerseniz GM sizi ipucunun varlığından ve türünden haberdar eder: bir nesne, kişi, büyü etkisi veya benzeri. İpucunu bulduğunuzda GM bulduğunuzu size bildirir. Konumda birden fazla ipucu varsa GM size bildirmek için birini seçer. O konumdaki ipuçlarından herhangi birini bulduğunuzda, GM'nin seçtiği ipucu olmasa veya bulmadığınız başka ipuçları olsa bile GM bulduğunuzu size bildirir.


omen://class/investigator/features/methodology?source=paizo-pathfinder-player-core-2:
  name: Metodoloji
  description: >
    Çalışmalarınız sizi birçok alanda bilgili kıldı, ancak biri özellikle yoğun ilginizi çekti. Bir metodoloji seçin. Metodolojiler şunlardır:
     • Simyasal Bilimler Metodolojisi
     • Deneycilik Metodolojisi
     • Adli Tıp Metodolojisi
     • Sorgu Metodolojisi


omen://class/investigator/features/skillful-lessons?source=paizo-pathfinder-player-core-2:
  name: Becerikli Dersler
  description: 3. seviyede ve sonrasındaki her tek sayılı seviyede bir beceri hüneri kazanırsınız. Bu hüner Zekâ, Akıl veya Karizma temelli bir beceri için ya da metodolojinizden kazandığınız beceri için olmalıdır.

omen://class/investigator/features/weapon-expertise?source=paizo-pathfinder-player-core-2:
  name: Silah Uzmanlığı
  description: >
    Şampiyon, Timsal, Müfettiş, Magus, Rün Ustası: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Druid, Kinetikçi: Savaş becerinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir.

    Muhafız: Bazen en iyi savunma iyi bir taarruzdur. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Nekromansır, Kâhin: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Psychic: Eğitim, muhtemelen okült büyünüzle de pekiştirilerek silah tekniğinizi geliştirdi. Basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir.

    Sorcerer: Savaş becerinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Kabadayı: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir. Uzman yetkinliğe sahip olduğunuz tüm silahların kritik uzmanlaşma etkilerine erişim kazanırsınız.

    Thaumaturge: Silahlarınızın en etkili şekilde çalışma sırlarını öğrendiniz. Silahsız saldırılar, basit silahlar ve askeri silahlar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Witch, Wizard: Katıksız deneyim sayesinde silahlarınızla olan tekniğinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.


omen://class/investigator/features/weapon-mastery?source=paizo-pathfinder-player-core-2:
  name: Silah Ustalığı
  description: >
    Barbar: Öfkeniz kuşandığınız silahlarla sizi daha da etkili kılar. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.

    Komutan: Silahlarınız konusunda kapsamlı tatbikatlar yaptınız. Silahsız saldırılar, basit silahlar ve askeri silahlar için yetkinlik dereceleriniz ustalığa yükselir.

    Muhafız: Savaş alanındaki saatler süren deneyiminiz size daha büyük bir hüner kazandırır. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.

    Magus, Rün Ustası, Thaumaturge: Silahlarınızı tamamen anlarsınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.


omen://class/investigator/investigator?source=paizo-pathfinder-player-core-2:
  name: Müfettiş
  description: >
    Hain kötülerin planlarını ortaya çıkarmak, kadim sırları keşfetmek veya diğer gizemleri aydınlatmak için inatla ipuçlarının peşinden giderek gerçeği gün yüzüne çıkarmaya çalışırsınız. Analitik zihniniz karmaşık problemlere hızla çözümler üretir ve bilenmiş duyularınız en belirsiz ipuçlarını bile tanımlar. Bilgiyi bir silah olarak kullanarak zaaflarından yararlanmak amacıyla karşılaştığınız yaratıkları ve tehlikeleri incelersiniz.


omen://class/investigator/methodologies/alchemical-sciences-methodology?source=paizo-pathfinder-player-core-2:
  name: Simyasal Bilimler Metodolojisi
  description: >
    Metodolojiniz, olay yerinde bulunan alışılmadık parçacıklardan ve sıvılardan bilgi toplayarak kimyasal ve simyasal analizi vurgular. Vakalarınızda size yardımcı olacak birkaç tentür hazırlamaya yetecek kadar simyasal bilgi birikimine sahipsiniz. Zanaat becerisinde eğitimlisiniz ve Simyasal Zanaat beceri hünerini kazanırsınız. Simyasal Zanaat'tan kazanılan formüllere ek olarak, seçtiğiniz iki yaygın 1. seviye simyasal eşyanın formüllerini içeren (bunlar iksirler veya aletler olmalıdır) standart bir formül kitabıyla başlarsınız. Her seviye atladığınızda, üretebileceğiniz herhangi bir eşya seviyesindeki yaygın bir simyasal iksirin veya simyasal aletin formülünü öğrenirsiniz. Günlük hazırlıklarınız sırasında Zekâ bonusunuza eşit sayıda çok yönlü şişe yaratabilirsiniz. Çok yönlü şişelerin istatistikleri simyacı sınıfında yer alır. Bu şişelerden birini formülünü bildiğiniz bir iksire veya simyasal alete dönüştürmek için kullanabileceğiniz Hızlı Tentür eylemini kazanırsınız. Birden fazla kaynaktan çok yönlü şişe yaratma yeteneğiniz varsa (örneğin simyacı çoklu sınıf arketipi), çok yönlü şişelerinizden herhangi birini onları gerektiren herhangi bir yeteneğiniz için kullanabilirsiniz.


omen://class/investigator/methodologies/empiricism-methodology?source=paizo-pathfinder-player-core-2:
  name: Deneycilik Metodolojisi
  description: >
    Her şey verilere dayanır. İstatistikleri hesaplamak, sayıları işlemek ve tümevarımsal akıl yürütmeyi kullanmak, herhangi bir senaryonun en olası sonucunu belirlemenizi sağlar ve yersiz olan her şey keskin dikkatinizi çeker. Seçtiğiniz Zekâ temelli bir beceride eğitimlisiniz. Bu İşte Bir Tuhaflık Var müfettiş hünerini kazanırsınız ve Hızlı İnceleme serbest eylemini elde edersiniz.


omen://class/investigator/methodologies/forensic-medicine-methodology?source=paizo-pathfinder-player-core-2:
  name: Adli Tıp Metodolojisi
  description: >
    Çoğu vakada, özellikle de cinayetlerde, suçluların bedende inanmak istediklerinden daha fazla suç kanıtı bırakma eğiliminde olduğunu öğrendiniz. Morluklardan, kemik kırıklarından, kan sıçramalarından ve hatta leş böceklerinin yaşam döngüsünden elde edilen bilgiler, olay yerini yeniden canlandırmaya yardımcı olan değerli ipuçları sağlayabilir. Tıp becerisinde eğitimlisiniz ve Adli Sezgi ile Muharebe Tıbbı beceri hünerlerini kazanırsınız. Muharebe Tıbbı kullandığınızda, bir başarı durumunda hedef seviyenize eşit ek Can Puanı kazanır ve hedef 1 gün yerine yalnızca 1 saat boyunca geçici olarak bağışık hâle gelir.


omen://class/investigator/methodologies/interrogation-methodology?source=paizo-pathfinder-player-core-2:
  name: Sorgu Metodolojisi
  description: >
    İster doğuştan gelen sevimliliğiniz ister gerçeğe bağlı kalma konusundaki kararlı ısrarınız sayesinde olsun, insanlar size güvenmekten kendilerini alamazlar. Başkalarını konuşturan bir tarzınız vardır ve soruşturmalarınızın gerçeğine ulaşmanıza yardımcı olacak sorgulama teknikleri geliştirdiniz. Diplomasi becerisinde eğitimlisiniz. Telaşa Mahal Yok beceri hünerini kazanırsınız. Ayrıca konuştuğunuz yaratıkla veya konuşmanızın bir konusuyla ilgili bir soru sorduğunuz sürece, İyi İzlenim Bırak eylemiyle aynı anda İpucunu Takip Et eylemini de gerçekleştirebilirsiniz. Ayrıca İğneleyici Soru eylemini de kazanırsınız.


omen://class/monk/features/expert-strikes?source=paizo-pathfinder-player-core-2:
  name: Uzman Saldırılar
  description: Dövüş sanatları pratiği yaptınız ve artık önceki hünerinizi aştınız. Silahsız saldırılar ve basit silahlar için yetkinlik dereceleriniz uzmanlığa yükselir. Brawling grubundaki bir silahsız saldırıyla kritik vuruş yaptığınızda, onun kritik uzmanlaşma etkisini elde edersiniz.

omen://class/monk/features/flurry-of-blows?source=paizo-pathfinder-player-core-2:
  name: Darbe Yaylımı
  description: İki silahsız Vuruş Yapın. Her ikisi de aynı yaratığa isabet ederse dirençler ve zaaflar açısından hasarlarını birleştirin. Çoklu saldırı cezanızı Vuruşlara normal şekilde uygulayın. Bir gösterişli yeteneği olarak, Darbe Yaylımı'nı her sıranızda yalnızca bir kez kullanabilirsiniz.

omen://class/monk/features/graceful-mastery?source=paizo-pathfinder-player-core-2:
  name: Zarif Ustalık
  description: Darbeleri savuşturarak sürekli bir zarafetle hareket edersiniz. Zırhsız savunma için yetkinlik dereceniz ustalığa yükselir.

omen://class/monk/features/master-strikes?source=paizo-pathfinder-player-core-2:
  name: Usta Saldırıları
  description: Bedeninizi daha da ölümcül bir silaha dönüştürdünüz. Silahsız saldırılar ve basit silahlar için yetkinlik dereceleriniz ustalığa yükselir.

omen://class/monk/features/path-to-perfection?source=paizo-pathfinder-player-core-2:
  name: Mükemmellik Yolu
  description: Aydınlanmaya giden kendi yolunuzda ilerlediniz. Dayanıklılık, Refleks veya İrade kurtarışınızı seçin. Seçilen kurtarış için yetkinlik dereceniz ustalığa yükselir. Seçilen kurtarışta bir başarı attığınızda, bunun yerine bir kritik başarı elde edersiniz.

omen://class/monk/features/perception-expertise?source=paizo-pathfinder-player-core-2:
  name: Dikkat Uzmanlığı
  description: Çevrenizdeki tehditlere karşı tetikte kalırsınız. Dikkat için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/monk/features/perfected-form?source=paizo-pathfinder-player-core-2:
  name: Kusursuzlaşmış Form
  description: Tekniklerinizden yetersizliği arındırdınız. Sıranızın ilk Vuruşunda 10'dan daha düşük bir zar atarsanız, saldırı zarını 10 olarak kabul edebilirsiniz. Bu bir talih etkisidir.

omen://class/monk/features/second-path-to-perfection?source=paizo-pathfinder-player-core-2:
  name: İkinci Mükemmellik Yolu
  description: Her başarıda mükemmelliği bulmayı öğrendiniz. Mükemmellik yolunuz için seçtiğinizden farklı bir kurtarış seçin. Seçilen kurtarış için yetkinlik dereceniz ustalığa yükselir. Seçilen kurtarışla bir başarı atarsanız, bunun yerine kritik başarı elde edersiniz.

omen://class/monk/features/third-path-to-perfection?source=paizo-pathfinder-player-core-2:
  name: Üçüncü Mükemmellik Yolu
  description: Kişisel aydınlanma çalışmalarınızda büyük ilerleme kaydettiniz. Mükemmellik yolu veya ikinci mükemmellik yolu için seçtiğiniz kurtarışlardan birini seçin. Seçilen kurtarış türü için yetkinlik dereceniz efsaneviliğe yükselir. Seçilen kurtarış türünde kritik başarısızlık attığınızda bunun yerine başarısızlık elde edersiniz. Seçilen kurtarış türünde hasar veren bir etkiye karşı başarısızlık attığınızda yarı hasar alırsınız.

omen://class/monk/monk?source=paizo-pathfinder-player-core-2:
  name: Keşiş
  description: >
    Yumruğunuzun gücü zihninizden ve ruhunuzdan akar. Bedeninizi kusursuz bir enstrümana, zihninizi ise düzenli bir bilgelik kalesine dönüştürerek mükemmelliği ararsınız. Dövüş sanatları becerileri ve size benzersiz dövüş hamleleri kazandıran dövüş duruşlarıyla tanınan azılı bir savaşçısınız. Birçok dövüş tarzında ustalaşmanın getirdiği meydan okuma sizi büyük zirvelere taşırken, felsefi sorular üzerine meditasyon yapmaktan ve huzur ile aydınlanmaya ulaşmanın yeni yollarını keşfetmekten de keyif alırsınız.


omen://class/swashbuckler/features/continuous-flair?source=paizo-pathfinder-player-core-2:
  name: Kesintisiz Fiyaka
  description: Savaştaki fiyakanıza denk olmasa da her durumda dramatik bir havaya sahipsiniz. Fiyakalı Savaşçı'dan gelen durumsal bonus keşif modunda da geçerlidir.

omen://class/swashbuckler/features/exemplary-finisher?source=paizo-pathfinder-player-core-2:
  name: Örnek Bitirici Hamle
  description: >
    Bitirici hamlelerinizi muhteşem bir gösterişle gerçekleştirerek bitirici hamlelerinize özel etkiler eklersiniz. Bir bitirici hamlenin parçası olarak yaptığınız bir Vuruş bir düşmana isabet ederse, kabadayı tarzınıza bağlı olarak Vuruşa aşağıdaki etkilerden birini eklersiniz.
     • Cenk Dansçısı: Bitirici hamlenin hemen ardından serbest eylem olarak Adım atabilirsiniz.
     • Böbürlenen: Düşman sizin Gözdağı Ver eyleminize karşı geçici olarak bağışıksa geçici bağışıklığı sona erer.
     • Eskrimci: Düşman bir sonraki sıranıza kadar Gafil kalır.
     • Cimnastikçi: Düşman Kavranmış, Bağlanmış veya Yüzüstü durumundaysa hasar zarına silah hasar zarlarının sayısının iki katına eşit bir durumsal bonus kazanırsınız.
     • Hayta: Düşman bir sonraki sıranızın başlangıcına kadar Hareket Hızına -10 fit durumsal ceza alır.
     • Hazırcevap: Düşman bir sonraki sıranızın başlangıcına kadar size karşı yapılan saldırı zarlarına -2 durumsal ceza alır.


omen://class/swashbuckler/features/fortitude-expertise?source=paizo-pathfinder-player-core-2:
  name: Dayanıklılık Uzmanlığı
  description: >
    Animist: Ruhani enerji bedeninizi takviye ederek sizi daha dirençli kılar. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

    Ozan, Komutan, Müfettiş, Kabadayı: Maceralarınızda bünyeniz dayanıklı hâle geldi. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

    Druid: Maceralar bünyenizi daha dayanıklı hâle getirdi. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

    Psychic: Zihniniz, bedeninizi bilinçaltındaki zihinsel benlik imajınıza bağlı tutar. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.


omen://class/swashbuckler/features/light-armor-expertise?source=paizo-pathfinder-player-core-2:
  name: Hafif Zırh Uzmanlığı
  description: Hafif zırh giyerken veya zırhsızken nasıl sıyrılacağınızı öğrendiniz. Hafif zırh ve zırhsız savunma için yetkinlik dereceleriniz uzmanlığa yükselir.

omen://class/swashbuckler/features/light-armor-mastery?source=paizo-pathfinder-player-core-2:
  name: Hafif Zırh Ustalığı
  description: Hafif zırhtaki hüneriniz gelişerek darbelerden sakınma yeteneğinizi artırır. Hafif zırh ve zırhsız savunma için yetkinlik dereceleriniz ustalığa yükselir.

omen://class/swashbuckler/features/stylish-tricks?source=paizo-pathfinder-player-core-2:
  name: Fiyakalı Numaralar
  description: 3. seviyede, 7. seviyede ve 15. seviyede yalnızca Akrobasiye veya kabadayı tarzınızdan gelen beceriye uygulayabileceğiniz ek bir beceri artışı kazanırsınız. Ayrıca bu seviyelerde ek bir beceri hüneri kazanırsınız. Bu hüner Akrobasi veya kabadayı tarzınızdan gelen eğitimli beceri için olmalıdır.

omen://class/swashbuckler/features/swashbuckler-skill-advancement?source=paizo-pathfinder-player-core-2:
  name: Kabadayı Beceri İlerlemesi
  description: Bir kabadayı, her karakterin aldığı beceri hünerleri ve beceri artışlarının ötesinde 3, 7 ve 15. seviyelerde fazladan bir beceri hüneri kazanır.

omen://class/swashbuckler/features/swashbucklers-style?source=paizo-pathfinder-player-core-2:
  name: Kabadayı Tarzı
  description: Kendinize has belirgin tarzınız her durumun üstesinden zarafetle gelmenizi sağlar. Bir kabadayı tarzı seçin. Bu tarz, fiyaka kazanmak için kullandığınız ek eylemleri belirler ve sizi o eylemle ilgili beceride eğitimli kılar.

omen://class/swashbuckler/features/weapon-expertise-swashbuckler?source=paizo-pathfinder-player-core-2:
  name: Silah Uzmanlığı (Kabadayı)
  description: >
    Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir. Uzman yetkinliğe sahip olduğunuz tüm silahların kritik uzmanlaşma etkilerine erişim kazanırsınız.


omen://class/swashbuckler/features/weapon-expertise?source=paizo-pathfinder-player-core-2:
  name: Silah Uzmanlığı
  description: >
    Şampiyon, Timsal, Müfettiş, Magus, Rün Ustası: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Druid, Kinetikçi: Savaş becerinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir.

    Muhafız: Bazen en iyi savunma iyi bir taarruzdur. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Nekromansır, Kâhin: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Psychic: Eğitim, muhtemelen okült büyünüzle de pekiştirilerek silah tekniğinizi geliştirdi. Basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir.

    Sorcerer: Savaş becerinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Kabadayı: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir. Uzman yetkinliğe sahip olduğunuz tüm silahların kritik uzmanlaşma etkilerine erişim kazanırsınız.

    Thaumaturge: Silahlarınızın en etkili şekilde çalışma sırlarını öğrendiniz. Silahsız saldırılar, basit silahlar ve askeri silahlar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Witch, Wizard: Katıksız deneyim sayesinde silahlarınızla olan tekniğinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.


omen://class/swashbuckler/features/weapon-mastery?source=paizo-pathfinder-player-core-2:
  name: Silah Ustalığı
  description: >
    Barbar: Öfkeniz kuşandığınız silahlarla sizi daha da etkili kılar. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.

    Komutan: Silahlarınız konusunda kapsamlı tatbikatlar yaptınız. Silahsız saldırılar, basit silahlar ve askeri silahlar için yetkinlik dereceleriniz ustalığa yükselir.

    Muhafız: Savaş alanındaki saatler süren deneyiminiz size daha büyük bir hüner kazandırır. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.

    Magus, Rün Ustası, Thaumaturge: Silahlarınızı tamamen anlarsınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.


omen://class/swashbuckler/styles/battledancer?source=paizo-pathfinder-player-core-2:
  name: Cenk Dansçısı
  description: Sizin için bir dövüş bir tür gösteri sanatıdır ve büyüleyici hareketlerle düşmanlarınızın dikkatini üzerinize çekersiniz. Performans becerisinde eğitimlisiniz ve Büyüleyici Performans beceri hünerini kazanırsınız. Gösteri Yap eylemini kullandığınızda, eylem bravado özelliği kazanır.

omen://class/swashbuckler/styles/braggart?source=paizo-pathfinder-player-core-2:
  name: Böbürlenen
  description: Düşmanlarınıza böbürlenir, sataşır ve psikolojik olarak iğnelersiniz. Gözdağı becerisinde eğitimlisiniz. Gözdağı Ver eylemini kullandığınızda, eylem bravado özelliği kazanır.

omen://class/swashbuckler/styles/fencer?source=paizo-pathfinder-player-core-2:
  name: Eskrimci
  description: Düşmanlarınızı zamansız saldırılara yönlendirmek için yanıltıcı hamleler yapıp sahte açıklar yaratarak dikkatlice hareket edersiniz. Aldatma becerisinde eğitimlisiniz. Dikkat Dağıt veya Yanıltıcı Hamle eylemlerini kullandığınızda, eylem bravado özelliği kazanır.

omen://class/swashbuckler/styles/gymnast?source=paizo-pathfinder-player-core-2:
  name: Cimnastikçi
  description: Cüretkâr fiziksel hüner gösterileriyle düşmanlarınızı yerinden oynatır, manevralar yapar ve şaşırtırsınız. Atletizm becerisinde eğitimlisiniz. Kavra, Yerinden Oynat, İt veya Çelme Tak eylemlerini kullandığınızda, eylem bravado özelliği kazanır.

omen://class/swashbuckler/styles/rascal?source=paizo-pathfinder-player-core-2:
  name: Hayta
  description: Rakiplerinize karşı üstünlük sağlamak için el altından taktikler kullanmaktan korkmazsınız. Hırsızlık becerisinde eğitimlisiniz ve Kirli Numara genel hünerini kazanırsınız. Kirli Numara kullandığınızda, eylem bravado özelliği kazanır.

omen://class/swashbuckler/styles/wit?source=paizo-pathfinder-player-core-2:
  name: Hazırcevap
  description: Daima ne söyleyeceğinizi bilerek cana yakın, zeki ve mizah dolusunuz. Nükteleriniz düşmanları saldırılarınızın becerisine ve hızına karşı hazırlıksız bırakır. Diplomasi becerisinde eğitimlisiniz ve Nükte beceri hünerini kazanırsınız. Nükte kullandığınızda, eylem bravado özelliği kazanır.

omen://class/swashbuckler/swashbuckler?source=paizo-pathfinder-player-core-2:
  name: Kabadayı
  description: >
    Pek çok savaşçı kaba kuvvete, ağır zırhlara veya hantal silahlara güvenir. Sizin içinse muharebe, düşmanlar arasında tarz ve zarafetle süzüldüğünüz bir danstır. Savaşçıların arasında fiyakayla fırlar; düşmanların dengesini bozan zarif misillemelerle saldırıları karşılarken bileğin bir hareketi ve kılıcın parıltısıyla güçlü bitirici hamleler indirirsiniz. Düşmanlarınızı yıpratıp engellemek, soğukkanlılık ve bolca fiyakayla kadere hükmetmenizi ve ölümü defalarca atlatmanızı sağlar.
