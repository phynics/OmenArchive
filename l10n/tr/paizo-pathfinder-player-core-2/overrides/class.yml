omen://class/barbarian/instincts/dragon-instinct?source=paizo-pathfinder-player-core-2:
  name: Ejderha İçgüdüsü
  description: |
    Kudretli bir ejderhanın gazabını çağırır ve inanılmaz yetenekler sergilersiniz. Belki kültürünüz ejderha haşmetine saygı duyuyordur, belki bir ejderhanın kanını içerek veya kanıyla yıkanarak ya da yağmacı bir ejderhanın köyünüzü yakmasını izleyerek içgörüler kazandınız. Ejderha İçgüdüleri tablosundan içgüdünüzün ejderha türü olarak bir ejderha türü seçin. Bunlar Monster Core'dan ejderhalardır, ancak GM'niz diğer kaynaklardan ejderhalar seçmenize ve bunların gelenekleri ile ejderha nefesi türlerini belirlemenize izin verebilir.

    İçgüdü Yeteneği—Ejderha Öfkesi Öfkelendiğinizde, Öfke eyleminden gelen ek hasarı 2'den 4'e yükseltebilir ve hasar türünü silahınız veya silahsız saldırınızın hasar türü yerine içgüdünüzün ejderha nefesiyle eşleşecek şekilde değiştirebilirsiniz. Bunu yaparsanız Öfke eyleminiz ejderha içgüdünüzün geleneğiyle eşleşen özelliğin yanı sıra geçerli olduğu durumlarda hasar türüyle eşleşen özelliği de kazanır.

    Öfke Direnci (9.) Delici hasara ve içgüdünüzün ejderha nefesinin hasar türüne direnirsiniz.

