# tr overrides: class

omen://class/barbarian/barbarian?source=paizo-pathfinder-player-core-2:
  name: Barbar
  description: >
    Savaşta sizi öfke sarar. Karmaşık tekniklere ya da katı bir eğitime ihtiyaç duymadan, şaşırtıcı bir dayanıklılığa güvenerek ortalığı kasıp kavurmaktan ve güçlü silahlar kullanarak düşmanlarınızı yarıp geçmekten zevk alırsınız. Öfkeleriniz; bir hayvanla, bir ruhla veya kendinizin bir parçasıyla bağdaştırabileceğiniz vahşi bir içgüdüden beslenir. Birçok barbar için kaba kuvvet bir çekiçtir ve her sorun bir çivi gibi görünür; diğerleriyse içlerindeki duygu fırtınasını dizginlemeye çalışır ve öfkelerini ancak en çok gerektiğinde serbest bırakır.


omen://class/barbarian/features/armor-mastery?source=paizo-pathfinder-player-core-2:
  name: Zırh Ustalığı
  description: >
    Barbar: Eğitiminiz ve öfkeniz zırhınızla olan bağınızı derinleştirir. Hafif zırh, orta zırh ve zırhsız savunma için yetkinlik dereceleriniz ustalığa yükselir.

    Şampiyon, Komutan: Zırhtaki hüneriniz gelişerek daha fazla darbeden sakınmanıza yardımcı olur. Hafif, orta ve ağır zırhın yanı sıra zırhsız savunma için de yetkinlik dereceleriniz ustalığa yükselir.

    Savaşçı: Zırhtaki hüneriniz daha da gelişir. Hafif, orta ve ağır zırhın yanı sıra zırhsız savunma için de yetkinlik dereceleriniz ustalığa yükselir.


omen://class/barbarian/features/brutality?source=paizo-pathfinder-player-core-2:
  name: Vahşet
  description: Gazabınız silahlarınızı ölümcül kılar. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir. Öfkeliyken, yakın dövüş silahları ve silahsız saldırılar için kritik uzmanlaşma faydalarına sahip olursunuz.

omen://class/barbarian/features/devastator?source=paizo-pathfinder-player-core-2:
  name: Yıkıcı
  description: Saldırılarınız öylesine yıkıcıdır ki dirençleri neredeyse hiç umursamazsınız ve barbar yetenekleriniz benzersizdir. Barbar sınıf ZD'niz için yetkinlik dereceniz ustalığa yükselir. Yakın dövüş Saldırılarınız, verdikleri fiziksel hasara karşı 10'a kadar direnci yok sayar.

omen://class/barbarian/features/instinct?source=paizo-pathfinder-player-core-2:
  name: İçgüdü
  description: Öfkeniz baskın bir içgüdüden—bir gelenekten öğrendiğiniz veya size doğal olarak gelen bir içgüdüden—kaynaklanır. İçgüdünüz size bir yetenek kazandırır, belirli davranışlardan kaçınmanızı gerektirir, daha yüksek seviyelerde artırılmış hasar ve dirençler sağlar ve içgüdünüze bağlı hünerleri seçmenize olanak tanır.

omen://class/barbarian/features/medium-armor-expertise?source=paizo-pathfinder-player-core-2:
  name: Orta Zırh Uzmanlığı
  description: >
    Saldırılara karşı kendinizi daha iyi savunmayı öğrendiniz. Hafif zırh, orta zırh ve zırhsız savunma için yetkinlik dereceleriniz uzmanlığa yükselir.

    Mucit: Orta veya ağır zırh icadınız varsa, zırh icadınızla kritik uzmanlaşma etkisine erişim kazanırsınız.


omen://class/barbarian/features/perception-mastery?source=paizo-pathfinder-player-core-2:
  name: Dikkat Ustalığı
  description: >
    Barbar: İçgüdünüz duyularınızın her birini daha da keskinleştirir. Dikkat için yetkinlik dereceniz ustalığa yükselir.

    Ozan, Silahşör, Düzenbaz: Keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.

    Komutan: Bir senaryoyu her yönüyle görebilme yeteneği geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.

    Timsal: Maceralarınız boyunca, koruduklarınıza göz kulak olmak ve canavarlara ile diğer tehditlere karşı tetikte olmak için keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.

    Müfettiş, Kabadayı, Thaumaturge: Maceralarınız boyunca keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.

    Korucu: Son derece gelişmiş bir keskinliğe ve ayrıntılara dikkate sahipsiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.


omen://class/barbarian/features/raging-resistance?source=paizo-pathfinder-player-core-2:
  name: Öfke Direnci
  description: >
    Sürekli maruz kalma ve sertleşmiş deri, zararları savuşturmanızı sağlar. Öfkeliyken, içgüdünüze dayalı hasar türlerine karşı 3 + Dayanıklılık bonusunuza eşit direnç kazanırsınız. Daha fazla bilgi için ilgili içgüdülere bakın.


omen://class/barbarian/features/reflex-expertise?source=paizo-pathfinder-player-core-2:
  name: Refleks Uzmanlığı
  description: >
    Tehlikelerden sıyrılma konusunda bir ustalık geliştirdiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

    Muhafız: En ağır zırhların içindeyken bile geniş çaplı etkilere karşı kendinizi hazırlayabilirsiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.


omen://class/barbarian/features/revitalizing-rage?source=paizo-pathfinder-player-core-2:
  name: Canlandırıcı Öfke
  description: Öfkeniz sizi daha sık ayakta tutarak savaşa yeniden atılmaya hazır kılar. Öfke eyleminden tekrar geçici Can Puanı kazanabilmek için 1 dakika beklemeniz gerekmesi yerine, yalnızca en az bir tam turu Öfke içinde olmadan geçirmeniz yeterlidir.

omen://class/barbarian/features/weapon-mastery?source=paizo-pathfinder-player-core-2:
  name: Silah Ustalığı
  description: >
    Barbar: Öfkeniz kuşandığınız silahlarla sizi daha da etkili kılar. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.

    Komutan: Silahlarınız konusunda kapsamlı tatbikatlar yaptınız. Silahsız saldırılar, basit silahlar ve askeri silahlar için yetkinlik dereceleriniz ustalığa yükselir.

    Muhafız: Savaş alanındaki saatler süren deneyiminiz size daha büyük bir hüner kazandırır. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.

    Magus, Rün Ustası, Thaumaturge: Silahlarınızı tamamen anlarsınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.


omen://class/barbarian/instincts/animal-instinct?source=paizo-pathfinder-player-core-2:
  name: Hayvan İçgüdüsü
  description: |
    Öfkeye girdiğinizde vahşi bir yırtıcının hiddeti içinizi doldurarak size amansız silahsız saldırılar kazandırır. Yırtıcı hayvanlara (örneğin maymunlara veya ayılara) saygı duyan kültürler bu içgüdüye sahip barbarlar yetiştirir. Kişiliğinizin kontrol edilemez, hayvansı bir yönüyle savaş halinde de olabilirsiniz veya bir kurtadamın ya da başka bir kurtyaratığın soyundan geliyor olabilirsiniz. Seçtiğiniz hayvana en uygun olanı Hayvan İçgüdüleri tablosundan seçin.

    İçgüdü Yeteneği—Vahşi Öfke Öfkeliyken seçtiğiniz hayvanın silahsız saldırısını (veya saldırılarını) kazanırsınız, ancak silah kullanamazsınız. Kazanılan özel saldırı, verdiği hasar ve özellikleri Hayvan İçgüdüleri tablosunda listelenmiştir. Bu saldırılar brawling grubundadır. Öfke eyleminiz morph ve primal özelliklerini kazanır.

    Öfke Direnci (9.) Delici ve kesici hasara direnirsiniz.

