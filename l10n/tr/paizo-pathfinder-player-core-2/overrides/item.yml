omen://item/comprehension-elixir-greater?source=paizo-pathfinder-player-core-2:
  name: Kavrama İksiri (Büyük)
  description: >
    Etkinleştir 1 (manipulate) Bu acı yudum, zihninizi yazılı sözcüklerin potansiyeline açar. Bu iksiri içtikten sonra listelenen süre boyunca yaygın bir dilde yazılmış olduğu sürece okuduğunuz her sözcüğü anlayabilirsiniz. Bu iksir şifreleri veya son derece ezoterik metinleri otomatik olarak anlamanızı sağlamaz; yine de Yazı Çözümlemek için bir beceri testi denemeniz gerekir. Süre 10 dakikadır.


omen://item/comprehension-elixir-lesser?source=paizo-pathfinder-player-core-2:
  name: Kavrama İksiri (Küçük)
  description: >
    Etkinleştir 1 (manipulate) Bu acı yudum, zihninizi yazılı sözcüklerin potansiyeline açar. Bu iksiri içtikten sonra listelenen süre boyunca yaygın bir dilde yazılmış olduğu sürece okuduğunuz her sözcüğü anlayabilirsiniz. Bu iksir şifreleri veya son derece ezoterik metinleri otomatik olarak anlamanızı sağlamaz; yine de Yazı Çözümlemek için bir beceri testi denemeniz gerekir. Süre 1 dakikadır.


omen://item/cooling-elixir-greater?source=paizo-pathfinder-player-core-2:
  name: Soğutma İksiri (Büyük)
  description: >
    Etkinleştir 1 (manipulate) Bu iksir ateşe dayanabilmesi için semender pullarından yapılmıştır. 24 saat boyunca şiddetli sıcağın etkilerinden korunursunuz. Ayrıca aşırı ve inanılmaz sıcaktan da korunursunuz.


omen://item/cooling-elixir-lesser?source=paizo-pathfinder-player-core-2:
  name: Soğutma İksiri (Küçük)
  description: >
    Etkinleştir 1 (manipulate) Bu iksir ateşe dayanabilmesi için semender pullarından yapılmıştır. 24 saat boyunca şiddetli sıcağın etkilerinden korunursunuz.


omen://item/cooling-elixir-moderate?source=paizo-pathfinder-player-core-2:
  name: Soğutma İksiri (Orta)
  description: >
    Etkinleştir 1 (manipulate) Bu iksir ateşe dayanabilmesi için semender pullarından yapılmıştır. 24 saat boyunca şiddetli sıcağın etkilerinden korunursunuz. Ayrıca aşırı sıcaktan da korunursunuz.


omen://item/corrosive-ammunition?source=paizo-pathfinder-player-core-2:
  name: Aşındırıcı Mühimmat
  description: >
    Etkinleştir 1 (manipulate)
    Bu tuhaf mühimmat, dokunduğu her şeyde leke bırakan sarı bir tozla kaplanmıştır. Etkinleştirilmiş aşındırıcı mühimmat bir hedefe çarptığında hedefin zırhı üzerinde çözünür. Zırh, zırhın Sertliğini yok sayan 1d8[persistent,acid] hasar alır; hedef zırh giymiyorsa asit hasarını bunun yerine kendisi alır. Bu hasar hedefin turlarının sonunda gerçekleşir.
    Yaratık aşındırıcı tozu silmek için bir Etkileşim eylemi harcayarak bu etkiyi sona erdirebilir; aksi takdirde etki zırh kırık hâle geldiğinde sona erer.

omen://item/cruuk?source=paizo-pathfinder-player-core-2:
  name: Cruuk
  description: Bu özel sopa fırlatmak için tasarlanmıştır ve hem savaşta hem de avlanmada faydalıdır. Tripkeeler bunları ağaç tepelerinde saklanan yaratıkları avlamak için kullanır.

omen://item/crystal-shards-greater?source=paizo-pathfinder-player-core-2:
  name: Kristal Parçacıkları (Büyük)
  description: >
    Etkinleştir A Vuruş Yap
    Bu şişe, süblimleşmiş kristal parçacıklarıyla benekli, basınçlı kırmızımsı kahverengi bir gaz içerir. Saldırı zarlarına +2 eşya bonusu kazanırsınız. Bomba patladığında, karışım aniden yüksek hızlarda uçuşan katı kristallere dönüşürken 3d4[piercing] hasar ve 5 delici sıçrama hasarı verir.
    İsabet durumunda hedef etine gömülen kristallerden 1[persistent,bleed] hasar alır. Kanama hasarı devam ettiği sürece hedef ayrıca hızına –5 fitlik bir ceza alır. Hedef kristalleri çıkarmak için bir Etkileşim eylemi harcayarak kanamayı durdurma ZD'sini düşürebilir.

omen://item/crystal-shards-major?source=paizo-pathfinder-player-core-2:
