omen://item/berserkers-cloak-greater?source=paizo-pathfinder-player-core-2:
  name: Berserker Pelerini (Büyük)
  description: >
    Bu ayı postu, alındığı kudretli yaratığın başını ve çıplak dişlerini içerir. Giyildiğinde pelerin başınızın üzerine ve omuzlarınızın etrafına dökülerek size bir ayının vahşetini aşılar. Öfke eylemine sahipseniz, öfkelendiğiniz sırada 1d10 piercing hasar veren çeneler ve 1d6 slashing hasar veren ve agile özelliğine sahip pençeler çıkarırsınız. Bu dönüşüm bir morph etkisidir ve hem çeneler hem de pençeler brawling silah grubundaki silahsız saldırılardır. Bu saldırılarla bir +2 silah kudreti rünü ve büyük hasar zarı rününün avantajlarını kazanırsınız (saldırı zarlarına +2 eşya bonusu kazanır ve silah hasar zarlarını iki artırırsınız). Bir hayvan içgüdüsüne ve yırtıcı öfke içgüdü yeteneğine sahipseniz, bu silahsız saldırıları kazanmak yerine yırtıcı öfke içgüdü yeteneğinizden gelen silahsız saldırılarınız bir +3 silah kudreti rünü ve üstün hasar zarı rününün avantajlarını kazanır (saldırı zarlarına +3 eşya bonusu verir ve silah hasar zarlarını üç artırır).


omen://item/berserkers-cloak?source=paizo-pathfinder-player-core-2:
  name: Berserker Pelerini
  description: >
    Bu ayı postu, alındığı kudretli yaratığın başını ve çıplak dişlerini içerir. Giyildiğinde pelerin başınızın üzerine ve omuzlarınızın etrafına dökülerek size bir ayının vahşetini aşılar. Öfke eylemine sahipseniz, öfkelendiğiniz sırada 1d10 piercing hasar veren çeneler ve 1d6 slashing hasar veren ve agile özelliğine sahip pençeler çıkarırsınız. Bu dönüşüm bir morph etkisidir ve hem çeneler hem de pençeler brawling silah grubundaki silahsız saldırılardır. Bu saldırılarla bir +1 silah kudreti rünü ve hasar zarı rünün avantajlarını kazanırsınız (saldırı zarlarına +1 eşya bonusu kazanır ve silah hasar zarlarını bir artırırsınız). Bir hayvan içgüdüsüne ve yırtıcı öfke içgüdü yeteneğine sahipseniz, bu silahsız saldırıları kazanmak yerine yırtıcı öfke içgüdü yeteneğinizden gelen silahsız saldırılarınız bir +2 silah kudreti rünü ve büyük hasar zarı rününün avantajlarını kazanır (saldırı zarlarına +2 eşya bonusu verir ve silah hasar zarlarını iki artırır).


omen://item/bestial-mutagen-greater?source=paizo-pathfinder-player-core-2:
  name: Yırtıcı Mutajen (Büyük)
  description: >
    Etkinleştir A (manipulate) Beden hatlarınız vahşi ve hantal bir şeye dönüşür. Fayda: Atletizm testlerine ve silahsız saldırı zarlarına +3 eşya bonusu kazanırsınız. Agile özelliğine sahip bir pençe silahsız saldırısı (3d8 slashing hasar) ve bir çene silahsız saldırısı (3d10 piercing hasar) kazanırsınız. Hasar Zarı rünler bu saldırıların verdiği hasarı değiştirmez. Dezavantaj: Refleks kurtarışlarına, Akrobasi testlerine ve Gizlilik testlerine -2 ceza alırsınız. Süre: 1 saat.


