omen://item/skinstitch-salve?source=paizo-pathfinder-player-core-2:
  name: Deridiken Merhem
  description: >
    Bu yapışkan merhem yaraları inatla kapalı tutar ve hızlı doğal iyileşmeyi teşvik eder. Merhemi aşağıdaki yollardan biriyle etkinleştirebilirsiniz. Etkinleştir—Dikiş Uygula 1 (manipulate) Etki: Şifacı Alet Takımı gerektirmeden İlk Yardım Uygularsınız. Tıp testine ya +2 eşya bonusu kazanırsınız ya da kendinizinki yerine deridiken merhemin 1d20+13 olan Tıp değiştiricisini kullanabilirsiniz. Etkinleştir—Yaraları Dik f (manipulate) Etki: Tetikleyici Tıp testine +2 eşya bonusu kazanırsınız. Tıp testinde başarı atarsanız, bunun yerine kritik başarı elde edersiniz.


omen://item/slumber-arrow?source=paizo-pathfinder-player-core-2:
  name: Uyku Oku
  description: >
    Etkinleştir A (manipulate) Uyku oklarının gövdeleri genellikle koyu mavi veya siyahtır ve yelekleri son derece yumuşak ve tüylüdür. Etkinleştirilmiş bir uyku oku hasar vermez, ancak onun vurduğu yaşayan bir yaratık uyuşuklaşır ve bir kurtarış denemelidir. Başarısızlık durumunda 1 tur boyunca Hareket Hızına –5 fitlik bir statü cezası alır ve kritik başarısızlıkta ayrıca 1 tur boyunca Yavaşlamış 1 olur.


omen://item/slumber-wine?source=paizo-pathfinder-player-core-2:
  name: Uyku Şarabı
  description: >
    Uyku şarabı en büyük kullanımını, ortalıkta görünmemenin yaralanmaktan daha yıkıcı olabileceği sosyal entrika meselelerinde bulur. Uyku şarabından bilincini kaybetmiş karakterler zehir sürdüğü sürece hiçbir şekilde uyanamazlar, bu şekilde bilinci kapalıyken yiyip içmelerine gerek kalmaz ve bir incelemeci bir Uyku Şarabı testinde başarılı olmadıkça yeni ölmüş gibi görünürler. Etkinleştir A (manipulate) Kurtarış Başlangıç 1 saat Maksimum Süre 7 gün Aşama 1 Bilinçsiz (1 gün) Aşama 2 Bilinçsiz (2 gün) Aşama 3 Bilinçsiz (3 gün)


omen://item/snagging-hook-snare?source=paizo-pathfinder-player-core-2:
  name: Takan Kanca Kapanı
  description: >
    Bu kapan hain metal kancalarıyla bir yaratığı takıp yakalar. Kareye giren ilk yaratık bir kurtarışla 5d8 delici hasar ve 5d8 kesici hasar alır. Kritik başarısızlık durumunda etini delen kancalar, yaratığı başarılı bir şekilde Kurtulana kadar Hareketsiz Kılınmış hâle getirir.


omen://item/spellguard-blade?source=paizo-pathfinder-player-core-2:
  name: Büyü Kalkanı Kılıcı
  description: >
    Bu +1 hasar zarı ana el hançerinin koruması, büyüye karşı koruyan mistik gliflerle kazınmıştır. Bu silahın savuşturma özelliğinden gelen SD'ye +1 durumsal bonustan faydalandığınızda, bu durumsal bonusu sizi hedef alan büyülere karşı kurtarışlarınıza da uygularsınız.


omen://item/spider-root?source=paizo-pathfinder-player-core-2:
  name: Örümcek Kökü
  description: >
    Belirli bir sarmaşık türünün ince, ipliksi köklerinin ezilmesiyle elde edilen bir macun olan örümcek kökü, kurbanı sakar ve beceriksiz kılar.
    Etkinleştir A (manipulate)
    Kurtarış fortitude|dc:28|showDC:all
    Başlangıç 1 dakika
    Maksimum Süre 6 dakika
    Aşama 1 3d6[poison] hasar ve Sakar 1 (1 dakika)
    Aşama 2 4d6[poison] hasar ve Sakar 2 (1 dakika)
    Aşama 3 6d6[poison] hasar ve Sakar 3 (1 dakika)

omen://item/spider-venom?source=paizo-pathfinder-player-core-2:
  name: Örümcek Zehri
  description: >
    Bu örümcek zehri hedefin savunmasını aşındırır.
    Etkinleştir 2 (manipulate)
    Kurtarış fortitude|dc:22|showDC:all
    Maksimum Süre 6 tur
    Aşama 1 1d10[poison] hasar ve Midesi Bulanmış 1 (1 tur)
    Aşama 2 1d12[poison] hasar, Sakar 1 ve Midesi Bulanmış 2 (1 tur)
    Aşama 3 2d6[poison] hasar, Sakar 2 ve Midesi Bulanmış 3 (1 tur)

omen://item/spike-snare?source=paizo-pathfinder-player-core-2:
  name: Kazık Kapanı
  description: "Bu temel kapan, kapanın karesine giren bir yaratığı kesmek veya potansiyel olarak kazığa oturtmak için yaratığın momentumundan faydalanan gizli kazıklardan oluşur ve 2d8[piercing] hasar verir. Yaratık bir reflex|showDC:all|dc:17|basic kurtarış denemelidir."

omen://item/spirit-thresher?source=paizo-pathfinder-player-core-2:
  name: Ruh Dövgeni
  description: Güçlü bir harman döveni oluşturmak için bazıları sağlam, bazıları kıymıklara ayrılmış kemikler uzun bir sopanın ucundaki metal zincirlere tutturulmuştur. Birçok kholo savaşçısı, silahın vururken çıkardığı şiddetli çatırtının, tahıllardan vurularak ayrılan kavuzlar gibi ruh parçalarını gevşettiğini öne sürer.

omen://item/spiritsight-crossbow?source=paizo-pathfinder-player-core-2:
  name: Ruhgörür Tatar Yayı
  description: >
    Bu +1 hasar zarı hayalet dokunuşlu tatar yayı, kundağı boyunca kristal merceklere ve gümüş bağlantı parçalarına sahiptir ve garip bir şekilde hafif hissettirir. Etkinleştir—Ruhani Görüş 1 (concentrate) Etki: Tatar yayının kristal merceklerinden nişan alarak sıranızın sonuna kadar normal duyularınıza ek olarak 60 fit menzilli Eterik Düzlem'e yönelik belirsiz görüş kazanırsınız. Bu yolla Evren'deki nesnelerin içinden hissedebilirsiniz ve duyu yaratıkları tespit etmek için nettir. Bu duyu ruhsal enerjiyi tespit ettiğinden, ruha bağışık bir yaratık bu şekilde tespit edilemez. Etkinleştir—Ruhani Atış 1 Etki: Ruhgörür tatar yayı ile Vuruş Yaparsınız. Bu atış Eterik Düzlem üzerinden ilerleyerek Ruhani Görüşünüzün menzili içindeki fiziksel nesnelerin içinden geçmesine ve siperlerini yok saymasına olanak tanır.


omen://item/staff-of-impossible-visions-greater?source=paizo-pathfinder-player-core-2:
  name: İmkânsız Görüler Asası (Büyük)
  description: >
    Bu tuhaf asa meşeden yapılmıştır ve görüşünüzün köşesinde hareket ediyor ve dalgalanıyor gibi görünen göz şeklinde bir değerli taş kümesiyle taçlandırılmıştır. Asayı kuşanırken kendi gözleriniz yerine asanın üzerindeki gözlerden bakabilir, normal görsel duyularınızı (Görünmeyeni Gör gibi büyülerin getirdiği tüm faydalar dahil) kullanabilirsiniz. Köşelerin etrafını, daha yüksek kotları veya asanın sığabileceği ancak başınızın sığamayacağı yerleri görmek için asayı yönlendirebilirsiniz. Bu, köşelerin etrafındaki yaratıkları hedeflemek için yeterli etki hattı sağlamaz. Gözler sizin gözleriniz kadar savunmasızdır ve kör edici bir ışık parlaması gibi görüşünüzü değiştiren herhangi bir şeyden etkilenebilir. Etkinleştir Büyü Yap Etki: Asanın listesinden bir büyü yapmak için asadan belirli sayıda yük harcarsınız.  • Kantrip Sersemlet  • 1. Derece Fantom Acısı, Korku  • 2. Derece Fâl, Paranoya  • 3. Derece Felç Et, Hipnoz Et  • 4. Derece Ölüm Görüsü, Sayısız Göz  • 5. Derece Tuhaf Geometri


