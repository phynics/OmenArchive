omen://item/sash-of-prowess-greater?source=paizo-pathfinder-player-core-2:
  name: Hüner Kuşağı (Büyük)
  description: >
    Bu mütevazı kuşak bele veya göğsün üzerinden çapraz olarak takılabilir. Bir hüner kuşağı sıklıkla eğitim aldığınız manastırı temsil eden bir renk veya desen taşır ancak Irori'nin açık eli gibi dini sembolleri de sergileyebilir. Akrobasi ve Atletizm beceri testlerine +3 eşya bonusu kazanırsınız. Etkinleştir—Zahmetsiz Ustalık f (concentrate) Etki: Bunun yerine kritik başarı elde edersiniz. Etkinleştir—İç Güç Rezervleri f (concentrate) Etki: Yalnızca bir qi büyüsü yapmak için harcayabileceğiniz 1 Odak Puanı kazanırsınız. Bu Odak Puanını bu turun sonuna kadar harcamazsanız kaybolur.


