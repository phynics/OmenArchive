omen://item/staff-of-the-tempest-greater?source=paizo-pathfinder-player-core-2:
  name: Fırtına Asası (Büyük)
  description: >
    Bir fırtına asası genellikle yıldırım çarpmış bir ağacın odunundan üretilir. Sıklıkla budaklı ve kararmıştır ve boyu boyunca ara sıra elektrik kıvılcımları parlar. Asayı kuşanırken görüşünüz fırtınalı havadan daha az etkilenir. Asayı tuttuğunuz sürece sis, yağış ve benzeri durumlardan kaynaklanan Saklanmış durumunu yok sayarsınız. Etkinleştir Büyü Yap Etki: Asanın listesinden bir büyü yapmak için asadan belirli sayıda yük harcarsınız.  • Kantrip Elektrik Arkı  • 1. Derece Hidrolik İtiş, Yıldırım Çarpması  • 2. Derece Enerji Direnci (yalnızca elektrik), Sis, Yıldırım Çarpması  • 3. Derece Rüzgâr Duvarı, Şimşek Oku  • 4. Derece Hidrolik Sel, Şimşek Oku


