omen://item/cytillesh-oil?source=paizo-pathfinder-player-core-2:
  name: Sitileş Yağı
  description: >
    Bu yoğun madde, zihin çalan sitileş mantarından damıtılmıştır ancak hafızayı değiştirme yeteneğinden yoksundur.
    Etkinleştir 2 (manipulate)
    Kurtarış fortitude|dc:19|showDC:all
    Maksimum Süre 4 tur
    Aşama 1 1d8[poison] hasar (1 tur)
    Aşama 2 1d10[poison] hasar (1 tur)
    Aşama 3 2d8[poison] hasar (1 tur)

omen://item/daikyu?source=paizo-pathfinder-player-core-2:
  name: Daikyu
  description: Lamine bambu, ahşap ve deriden yapılmış bu asimetrik yay 6 fit veya daha fazla boydadır. En sık binek üzerindeyken kullanılır.

omen://item/deadweight-snare?source=paizo-pathfinder-player-core-2:
  name: Ölü Ağırlık Kapanı
  description: Bu kapan bir tuzak teline veya basınç plakasına bağlanmış mıknatıslı ağırlıklardan ve ağır halatlardan yapılmıştır. Bir yaratık kareye girdiğinde mıknatıslar ve halatlar açılarak yaratığın silahlarını ve uzuvlarını ağırlaştırır. Yaratık bir kurtarış denemelidir.

omen://item/deathcap-powder?source=paizo-pathfinder-player-core-2:
  name: Köygöçüren Tozu
  description: >
    Zehirli köygöçüren mantarı kurutulup öğütülebilir ve hızlandırılmış etkilere sahip tatsız bir toz elde etmek için işlenebilir.
    Etkinleştir A (manipulate)
    Kurtarış fortitude|dc:33|showDC:all
    Başlangıç 10 dakika
    Maksimum Süre 6 dakika
    Aşama 1 7d8[poison] hasar (1 dakika)
    Aşama 2 9d6[poison] hasar ve Midesi Bulanmış 2 (1 dakika)
    Aşama 3 8d10[poison] hasar ve Midesi Bulanmış 3 (1 dakika)

omen://item/disintegration-bolt?source=paizo-pathfinder-player-core-2:
  name: Ayrıştırma Oku
  description: >
    Etkinleştir 1 (manipulate) Bu arbalet okunun gövdesi kavrulmuş ve kararmıştır ve onu tutmak parmaklarınızı ince siyah bir tozla kaplar. Etkinleştirilmiş bir ayrıştırma oku bir hedefe çarptığında bir kurtarış gerektiren Kül Et büyüsüne maruz kalır. Büyüde olduğu gibi saldırı zarındaki kritik bir isabet, hedefin kurtarış sonucunun bir derece daha kötü olmasına neden olur.


omen://item/dragonplate?source=paizo-pathfinder-player-core-2:
  name: Ejderha Zırhı
  description: >
    Bu +2 büyük kurtarış ejderha derisi tam levha zırh, korkunç bir ejderhaya benzemeyi sağlar. Zırh, yapıldığı ejderha türüne göre birçok çeşitte üretilir; ancak genellikle dört büyü geleneğinden birine uyar.
    Etkinleştir—Ejderha Nefesi 2 (manipulate)
    Etki: Zırhın yapımında kullanılan ejderhanın geleneğine karşılık gelen bir hasar türü ve kurtarışla bir enerji konisi salıverirsiniz (aşağıdaki tabloya bakın). Koni 14d6 hasar verir; alandaki her yaratık ZD 36 temel kurtarış yapmalıdır.
    Ejderha Geleneği: Hasar
    Mistik: Kuvvet (Refleks)
    İlahi: Ruh (Refleks)
    Okült: Zihinsel (İrade)
    İlksel: Zehir (Beden)

omen://item/drakeheart-mutagen-greater?source=paizo-pathfinder-player-core-2:
  name: Ejderkalbi Mutajeni (Büyük)
  description: >
    Etkinleştir A (manipulate) Derinizde bir drake gibi pullar büyür, görüşünüz keskinleşir ve göz bebekleriniz yarık hâline gelir ancak zihniniz ve refleksleriniz yavaşlar. Fayda: SD'ye +6 eşya bonusu, +2 Çeviklik sınırı (her zamanki gibi birden fazlaysa en düşük Çeviklik sınırınızı kullanın) ve Dikkat testlerine +3 eşya bonusu kazanırsınız. Zırh giyiyorsanız ejderkalbi mutajeni daha yüksek bir eşya bonusuna sahip olsa bile SD'ye olan yetkinlik bonusunuzu giydiğiniz zırhtaki yetkinliğinize göre hesaplamaya devam edersiniz. Ayrıca Son Atılım eylemini kazanırsınız. Dezavantaj: İrade kurtarışlarına, Refleks kurtarışlarına ve Bilgi Hatırlamak için yapılan tüm beceri testlerine -1 ceza alırsınız. Süre: Hangisi önce gerçekleşirse, 1 saat veya Son Atılımı kullanana kadar.


omen://item/drakeheart-mutagen-lesser?source=paizo-pathfinder-player-core-2:
  name: Ejderkalbi Mutajeni (Küçük)
  description: >
    Etkinleştir A (manipulate) Derinizde bir drake gibi pullar büyür, görüşünüz keskinleşir ve göz bebekleriniz yarık hâline gelir ancak zihniniz ve refleksleriniz yavaşlar. Fayda: SD'ye +4 eşya bonusu, +2 Çeviklik sınırı (her zamanki gibi birden fazlaysa en düşük Çeviklik sınırınızı kullanın) ve Dikkat testlerine +1 eşya bonusu kazanırsınız. Zırh giyiyorsanız ejderkalbi mutajeni daha yüksek bir eşya bonusuna sahip olsa bile SD'ye olan yetkinlik bonusunuzu giydiğiniz zırhtaki yetkinliğinize göre hesaplamaya devam edersiniz. Ayrıca Son Atılım eylemini kazanırsınız. Dezavantaj: İrade kurtarışlarına, Refleks kurtarışlarına ve Bilgi Hatırlamak için yapılan tüm beceri testlerine -1 ceza alırsınız. Süre: Hangisi önce gerçekleşirse, 1 dakika veya Son Atılımı kullanana kadar.


omen://item/drakeheart-mutagen-major?source=paizo-pathfinder-player-core-2:
  name: Ejderkalbi Mutajeni (Üstün)
  description: >
    Etkinleştir A (manipulate) Derinizde bir drake gibi pullar büyür, görüşünüz keskinleşir ve göz bebekleriniz yarık hâline gelir ancak zihniniz ve refleksleriniz yavaşlar. Fayda: SD'ye +7 eşya bonusu, +2 Çeviklik sınırı (her zamanki gibi birden fazlaysa en düşük Çeviklik sınırınızı kullanın) ve Dikkat testlerine +4 eşya bonusu kazanırsınız. Zırh giyiyorsanız ejderkalbi mutajeni daha yüksek bir eşya bonusuna sahip olsa bile SD'ye olan yetkinlik bonusunuzu giydiğiniz zırhtaki yetkinliğinize göre hesaplamaya devam edersiniz. Ayrıca Son Atılım eylemini kazanırsınız. Dezavantaj: İrade kurtarışlarına, Refleks kurtarışlarına ve Bilgi Hatırlamak için yapılan tüm beceri testlerine -1 ceza alırsınız. Süre: Hangisi önce gerçekleşirse, 1 saat veya Son Atılımı kullanana kadar.


omen://item/drakeheart-mutagen-moderate?source=paizo-pathfinder-player-core-2:
  name: Ejderkalbi Mutajeni (Orta)
  description: >
    Etkinleştir A Etkileşime Gir Derinizde bir drake gibi sert pullar büyür, görüşünüz keskinleşir ve göz bebekleriniz yarık hâline gelir, uzuvlarınız çevik ve hızlı olur ancak zihniniz ve refleksleriniz yavaşlar. Fayda: SD'ye +5 eşya bonusu, +2 Çeviklik sınırı (her zamanki gibi birden fazlaysa en düşük Çeviklik sınırınızı kullanın) ve Dikkat testlerine +2 eşya bonusu kazanırsınız. Zırh giyiyorsanız ejderkalbi mutajeni daha yüksek bir eşya bonusuna sahip olsa bile SD'ye olan yetkinlik bonusunuzu giydiğiniz zırhtaki yetkinliğinize göre hesaplamaya devam edersiniz. Ayrıca Son Atılım eylemini kazanırsınız. Dezavantaj: İrade kurtarışlarına, Refleks kurtarışlarına ve Bilgi Hatırlamak için yapılan tüm beceri testlerine -1 ceza alırsınız. Süre: Hangisi önce gerçekleşirse, 10 dakika veya Son Atılımı kullanana kadar.


omen://item/dust-of-corpse-animation-greater?source=paizo-pathfinder-player-core-2:
  name: Ceset Canlandırma Tozu (Büyük)
  description: >
    Etkinleştir 2 (manipulate) Bu siyah kese, ince kemik tozu gibi görünen bir madde içerir. Tozu bir cesedin üzerine özel bir desenle dökmek onu yaşayan ölü bir yaratığa dönüştürür. Yaratılan yaşayan ölünün türü cesedin durumuna bağlıdır ve bir iskelet veya zombi ile sonuçlanır. Yaşayan ölünün seviyesi 11'den büyük olacaksa toz onu canlandırmakta başarısız olur. Beden yaratmak istediğiniz yaşayan ölü için uygun bir boyutta ve türde olmalıdır; örneğin iskelet bir atı canlandırmak için tozu bir atın iskeletine serpmelisiniz. Seviye aralığında birden fazla yaşayan ölü uygunsa (Orta boy bir insansı iskelet için iskelet muhafız veya iskelet şampiyon gibi), siz seçersiniz. Canlandırılan yaşayan ölü minion özelliğine sahiptir, yani ona Emrettiğinizde 2 eylem kullanabilir. Etkinleştirmenin bir parçası olarak mevcut tur için bir Emir verebilirsiniz. Yaşayan ölü yaratık ceset formuna geri çökmeden önce 1 dakika boyunca canlanmış kalır. Her zamanki gibi kontrolünüz altında en fazla dört minyona sahip olabilirsiniz.


omen://item/dust-of-corpse-animation?source=paizo-pathfinder-player-core-2:
  name: Ceset Canlandırma Tozu
  description: >
    Etkinleştir 2 (manipulate) Bu siyah kese, ince kemik tozu gibi görünen bir madde içerir. Tozu bir cesedin üzerine özel bir desenle dökmek onu yaşayan ölü bir yaratığa dönüştürür. Yaratılan yaşayan ölünün türü cesedin durumuna bağlıdır ve bir iskelet veya zombi ile sonuçlanır. Yaşayan ölünün seviyesi 3'ten büyük olacaksa toz onu canlandırmakta başarısız olur. Beden yaratmak istediğiniz yaşayan ölü için uygun bir boyutta ve türde olmalıdır; örneğin iskelet bir atı canlandırmak için tozu bir atın iskeletine serpmelisiniz. Seviye aralığında birden fazla yaşayan ölü uygunsa (Orta boy bir insansı iskelet için iskelet muhafız veya iskelet şampiyon gibi), siz seçersiniz. Canlandırılan yaşayan ölü minion özelliğine sahiptir, yani ona Emrettiğinizde 2 eylem kullanabilir. Etkinleştirmenin bir parçası olarak mevcut tur için bir Emir verebilirsiniz. Yaşayan ölü yaratık ceset formuna geri çökmeden önce 1 dakika boyunca canlanmış kalır. Her zamanki gibi kontrolünüz altında en fazla dört minyona sahip olabilirsiniz.


omen://item/earthsight-box?source=paizo-pathfinder-player-core-2:
  name: Toprakgörür Kutusu
  description: >
    Bu kaliteli ahşap kutu Cüce rünleriyle işlenmiştir, menteşeleri ve tokası dövme demirdendir. Kutu birkaç avuç ince kum içerir. Etkinleştir—Toprağı Kopyala 1 dakika (concentrate, manipulate) Etki: Kutuyu kapalı tutar ve araziyi zihninizde canlandırırken kutuyu saat yönünde üç kez çevirirsiniz. Kutuyu açtığınızda kum 60 fitlik bir menzile kadar etrafınızdaki taş araziyi minyatür olarak ortaya çıkarır. Bu taş ve topraktan yapıldıkları sürece patikaların, tepelerin, setlerin, kayaların ve hatta duvarlar ile hendekler gibi yapay yapıların ayrıntılarını gösterir. Yeraltındaysanız mevcut derinliğinizde 60 fit içindeki tünelleri ve topraktaki boşlukları ortaya çıkarır. Kum kutuyu kapatana kadar şeklini korur.


omen://item/elixir-of-gender-transformation-greater?source=paizo-pathfinder-player-core-2:
  name: Cinsiyet Değiştirme İksiri (Büyük)
  description: >
    Etkinleştir 1 (manipulate) Bu berrak, acı sıvı belirli ikincil cinsiyet özelliklerini değiştirmek için içilebilir. Farklı formülasyonlar farklı değişiklikler yaratır; örneğin bir çeşidi sesin kalınlaşmasına ve vücut ile yüz kıllarının uzamasına neden olabilirken, bir diğeri kalça etrafındaki yağ dağılımına ve göğüslerin büyümesine yol açabilir. Bu değişikliklere genellikle yüzdeki yağın kayması eşlik eder ve kullanıcının görünümünü bazen dramatik bazen de daha hafif bir şekilde değiştirir. İksir bir kez alınmalıdır ve değişiklikler 6 ay boyunca gerçekleşir.


omen://item/elixir-of-gender-transformation-lesser?source=paizo-pathfinder-player-core-2:
  name: Cinsiyet Değiştirme İksiri (Küçük)
  description: >
    Etkinleştir 1 (manipulate) Bu berrak, acı sıvı belirli ikincil cinsiyet özelliklerini değiştirmek için içilebilir. Farklı formülasyonlar farklı değişiklikler yaratır; örneğin bir çeşidi sesin kalınlaşmasına ve vücut ile yüz kıllarının uzamasına neden olabilirken, bir diğeri kalça etrafındaki yağ dağılımına ve göğüslerin büyümesine yol açabilir. Bu değişikliklere genellikle yüzdeki yağın kayması eşlik eder ve kullanıcının görünümünü bazen dramatik bazen de daha hafif bir şekilde değiştirir. İksir her hafta alınmalıdır ve değişiklikler bir yıl veya daha uzun bir süre boyunca gerçekleşir.


omen://item/elixir-of-gender-transformation-moderate?source=paizo-pathfinder-player-core-2:
  name: Cinsiyet Değiştirme İksiri (Orta)
  description: >
    Etkinleştir 1 (manipulate) Bu berrak, acı sıvı belirli ikincil cinsiyet özelliklerini değiştirmek için içilebilir. Farklı formülasyonlar farklı değişiklikler yaratır; örneğin bir çeşidi sesin kalınlaşmasına ve vücut ile yüz kıllarının uzamasına neden olabilirken, bir diğeri kalça etrafındaki yağ dağılımına ve göğüslerin büyümesine yol açabilir. Bu değişikliklere genellikle yüzdeki yağın kayması eşlik eder ve kullanıcının görünümünü bazen dramatik bazen de daha hafif bir şekilde değiştirir. İksir ayda bir kez alınmalıdır ve değişiklikler bir yıl boyunca gerçekleşir.


omen://item/elixir-of-rejuvenation?source=paizo-pathfinder-player-core-2:
  name: Gençleşme İksiri
  description: >
    Etkinleştir 1 (manipulate) Gençleşme iksiri bir yaratığı tam sağlığına kavuşturur ve onu etkileyen toksinleri yok eder. Bu iksiri içtiğinizde maksimum Can Puanınıza geri dönersiniz ve sizi etkileyen 20. seviye veya daha düşük tüm rahatsızlıklar giderilir. Bunun yerine bu iksiri bir hafta veya daha kısa süredir ölü olan bir yaratığa içirebilirsiniz. Bunu yaptığınızda o yaratık 1 Can Puanı ile ve hiçbir büyü yuvası, Odak Puanı veya diğer günlük kaynakları olmadan anında hayata döndürülür.


omen://item/enervating-powder?source=paizo-pathfinder-player-core-2:
  name: Güçten Düşürücü Toz
  description: >
    Mantar sporları ve öğütülmüş kemiklerden özenle hazırlanan bu karışım, onu değerli bir zehir kılan felç edici özelliklere sahiptir.
    Etkinleştir A (manipulate)
    Kurtarış fortitude|dc:28|showDC:all
    Başlangıç 10 dakika
    Maksimum Süre 6 dakika
    Aşama 1 Bitkin (1 dakika)
    Aşama 2 5d6[poison] hasar ve Bitkin (1 dakika)
    Aşama 3 6d6[poison] hasar, Bitkin ve Felçli (1 dakika)

omen://item/engulfing-snare?source=paizo-pathfinder-player-core-2:
  name: Yutan Kapan
  description: "Rahatsız edildiğinde yaylanarak fırlaması için kemiklerden, özellikle sert bitki örtüsünden veya başka malzemelerden dikenli bir kafes kurarsınız. Kapan bu kareye giren ilk yaratığa 10d8[piercing] hasar verir; o yaratık bir reflex|showDC:all|dc:34 kurtarışı denemelidir."

omen://item/everlasting-adhesive?source=paizo-pathfinder-player-core-2:
  name: Ebedi Yapıştırıcı
  description: >
    Etkinleştir 1 dakika (manipulate) Bu tuhaf kehribar rengi yapıştırıcı iki yüzeyi neredeyse ayrılamaz şekilde birbirine bağlar. Tek bir şişe 1 fit kareye kadar bir alanı kaplar ve iki yüzey arasında tek bir bağ oluşturmak için tek seferde kullanılmalıdır. Etkinleştirme kesintiye uğrarsa bağ başarısız olur ve yapıştırıcı boşa gider. İki yüzey ebedi yapıştırıcı ile birleştirildikten sonra bir yaratık onları yalnızca başarılı bir testle ayırabilir. Yapıştırılan nesneler özellikle dayanıklı olmadıkça yapıştırıcıdan önce kırılma eğilimindedir ancak nesneleri ayırmaya kararlı bir yaratık ebedi yapıştırıcı ile bağlanan parçaları koparabilir ve daha sonra nesneleri Onarabilir. Yapıştırıcı yaratıkları yalnızca istekli olmaları durumunda etkileyebilir ve bağı derinin en dış tabakası soyularak kırılabilir.


omen://item/exploding-shield?source=paizo-pathfinder-player-core-2:
  name: Patlayan Kalkan
  description: >
    Bu ahşap kalkanın (Sertlik 3, CP 12, Kırılma Eşiği 6) içindeki büyü, kalkan yok edilirken düşmanlarınıza saldırır.
    Etkinleştir—Kıymıklı Patlama f (manipulate)
    Etki: Kalkan dışa doğru patlayarak bir koni içindeki her yaratığa 4d6[piercing] hasar verir (reflex|dc:19|basic kurtarışı).
    Sertlik
    CP
    BT
    3
    12
    6

omen://item/fangwire?source=paizo-pathfinder-player-core-2:
  name: Dişli Tel
  description: "Bu kobold teli ince ve görülmesi zordur bu da onu bir pusu için mükemmel kılar. Silahı kullanan kişi tel için bir tutucu görevi görmesi amacıyla bir kabzayı savunmasız bir noktanın etrafında savurur ardından diğer kabzayı geriye çekerek teli sıkar ve acı verici yırtıklara neden olur. İşlev ve isim \"yavaş diş\" adı verilen tel tabanlı bir tuzaktan gelir."

omen://item/fearflower-nectar?source=paizo-pathfinder-player-core-2:
  name: Korkuçiçeği Nektarı
  description: >
    Gece açan bir çöl çiçeğinin nektarı, kurbanın merkezi sinir sistemine saldırır ve panik hislerine yol açar.
    Etkinleştir 2 (manipulate)
    Kurtarış fortitude|dc:21|showDC:all
    Maksimum Süre 6 tur
    Aşama 1 1d6[poison] hasar ve Korkmuş 1 (1 tur)
    Aşama 2 1d6 zehir hasarı ve Korkmuş 2 (1 tur)
    Aşama 3 1d6 zehir hasarı ve Korkmuş 3 (1 tur)

omen://item/fire-jump-ring?source=paizo-pathfinder-player-core-2:
  name: Ateş Sıçraması Yüzüğü
  description: >
    Bu siyah metal yüzük ara sıra duman püskürten yakutlarla işlenmiştir. Atletizm testlerine +2 eşya bonusu verir. Etkinleştir—Ateş Sıçraması 2 (concentrate, manipulate, teleportation) Etki: Büyülü ateşler de dâhil olmak üzere sizi içine alacak kadar büyük herhangi bir ateşin içine Depar atarsınız (veya ilgili Hıza sahipseniz Kazınır ya da Uçarsınız). Ateşin içinde kaybolursunuz ve ondan hasar almazsınız. Kaybolduğunuz yerin 100 fit içindeki yeterince büyük tüm ateşleri hissedebilirsiniz ve bu ateşlerin herhangi birinden ateşin içinden veya ona bitişik olarak yeniden ortaya çıkarsınız. Hareketinizi ateşin içinde bitirirseniz sizi normal şekilde etkiler.


omen://item/flame-navette?source=paizo-pathfinder-player-core-2:
  name: Alev Naveti
  description: >
    Kullanım: zırha iliştirilmiş Etkinleştir A (concentrate) Bu bronzit parçası her iki ucu sivri bir oval şeklinde biçimlendirilmiştir. Merkezinde oyulmuş bir alev bulunur ve geleneksel olarak kalbin üzerine takılır. Günde yalnızca bir alev naveti etkinleştirebilirsiniz. Naveti etkinleştirdiğinizde 8 karşı koyma kademesi ve +22 karşı koyma değiştiricisi ile savaşçının Kararlılık sınıf hünerinin avantajını kazanırsınız. Kararlılık hünerine sahipseniz daha iyiyse kendi değiştiricinizi kullanabilirsiniz.


omen://item/flare-snare?source=paizo-pathfinder-player-core-2:
  name: İşaret Fişeği Kapanı
  description: Biyolüminesan madde veya simyasal reaktifler kullanarak bir tuzak teline veya basınç plakasına kısa ömürlü bir fişek bağlarsınız. Küçük veya daha büyük bir yaratık kareye girdiğinde bu fişek gökyüzüne fırlar. Gökyüzünü net gören yaratıklar için bu fişek açık bir günde 2 mile kadar veya açık bir gecede 5 mile kadar uzaktan görülebilir.

omen://item/flying-blade-wheel-snare?source=paizo-pathfinder-player-core-2:
  name: Uçan Bıçak Çarkı Kapanı
  description: "Bir yaratık kareye girdiğinde, dönen bıçaklardan oluşan ölümcül bir uçan çark ona doğru fırlar; +35 saldırı niteleyicisiyle bir Vuruş Yapar ve 8d8[slashing] hasar verir. Sıranızın her birinde bir kez, çarkın 120 fiti içinde bir Etkileşim eylemi kullanarak çarkın kovaladığı yaratığa doğru 60 fite kadar Uçmasını ve hareket ettikten sonra hedefinin 5 fiti içindeyse başka bir Vuruş Yapmasını sağlayabilirsiniz. 1 dakika sonra dönme durur ve çark yere düşer. Yaratıklar çarkı durdurmak için onu yok edebilir (SD 37, Beden +29, Refleks +20, CP 200, Sertlik 10, nesne bağışıklıkları)."

omen://item/flying-talon?source=paizo-pathfinder-player-core-2:
  name: Uçan Pençe
  description: Bu silah bir zincir parçasına tutturulmuş üç uçlu dikenli bir kancadan oluşur. Düşmanları bıçaklamak için yakın dövüşte kullanılabilir veya uzaktan fırlatılabilir. Bazı koboldlar özellikle kendilerine hizmet edenlerin üzerinde bir tür mevki nişanı olarak uçan pençeleri kullanmaya düşkündür.

omen://item/forensic-dye?source=paizo-pathfinder-player-core-2:
  name: Adli Boya
  description: >
    Etkinleştir 1 (manipulate) Bu renksiz sıvı şişesini etkinleştirmek kan veya çamur gibi az miktarda başka bir kimyasal veya malzemenin eklenmesini gerektirir. Şişe hızla tepki vererek bulanık, kırmızımsı kahverengi bir maddeye dönüşür. Etkinleştirildikten sonra boya 10 dakikaya kadar etkisini korur bu süre boyunca 1 dakikanızı harcayarak 1 Bulk'a kadar tek bir nesneye veya tek bir 5 fitlik kare boyunca yere sürebilirsiniz. Boya etkinleştirici kimyasalın tam bir eşleşmesiyle temas ettiğinde parlak mavi bir ton alır etkinleştirici bileşenin bulunmadığı alanlarda ise şeffaf kalır.


omen://item/four-ways-dogslicer?source=paizo-pathfinder-player-core-2:
  name: Dört Yönlü Köpekbiçen
  description: >
    Bu +2 vuruşlu köpekbiçen, güvenlikten çok çok yönlülüğe değer veren parlak ancak kavgacı bir ustanın açıkça eseridir. Dört dişli mücevher namlunun keskin kenarı boyunca dizilmiştir; bunlardan üçü parıldar—biri ateşli kırmızı ışıkla, biri soğuk bir maviyle ve biri kıvılcımlar saçarak—sonuncusu ise parlak bir siyahtır. Bu mücevherlerin her biri bir silah niteliği rününü somutlaştırır, ancak aynı anda yalnızca bir rün aktif olabilir.
    Etkinleştir—Mücevher Döndürme 1 (manipulate)
    Etki: Namlu boyunca istenen silah rününe karşılık gelen mücevheri çevirirsiniz: alevli için kırmızı, don için mavi veya şok için sarı. Seçilen rünün verdiği türde 1d6[untyped] hasar alırsınız. Bunun yerine aktif nitelik rününü devre dışı bırakmak için siyah mücevheri çevirebilir, böylece hiç hasar almazsınız.

omen://item/freezing-ammunition?source=paizo-pathfinder-player-core-2:
  name: Dondurucu Mühimmat
  description: >
    Etkinleştir 1 (manipulate) Bu soğuk mühimmat koyu mavidir ve dokunulduğunda soğuktur. Etkinleştirilmiş dondurucu mühimmat bir hedefe çarptığında hedef bir kurtarışta başarılı olmalı ya da şiddetli soğuk nedeniyle 1 tur boyunca Yavaşlatılmış 1 olmalıdır (kritik başarısızlıkta 1 dakika boyunca yavaşlatılmış 1).


omen://item/frost-vial-greater?source=paizo-pathfinder-player-core-2:
  name: Don Şişesi (Büyük)
  description: >
    Etkinleştir 1 Vuruş Yap Bu şişedeki parlak mavi sıvı reaktifler havaya maruz kaldığında ısıyı hızla emer. Bir don şişesi 3d6 cold hasar ve 3 cold sıçrama hasarı verir. Bir isabette hedef bir sonraki sırasının sonuna kadar Hareket Hızına –10 fit statü cezası alır. Saldırı zarlarına +2 eşya bonusu kazanırsınız.


omen://item/frost-vial-lesser?source=paizo-pathfinder-player-core-2:
  name: Don Şişesi (Küçük)
  description: >
    Etkinleştir 1 Vuruş Yap Bu şişedeki parlak mavi sıvı reaktifler havaya maruz kaldığında ısıyı hızla emer. Bir don şişesi 1d6 cold hasar ve 1 cold sıçrama hasarı verir. Bir isabette hedef bir sonraki sırasının sonuna kadar Hareket Hızına –5 fit statü cezası alır.


omen://item/frost-vial-major?source=paizo-pathfinder-player-core-2:
  name: Don Şişesi (Üstün)
  description: >
    Etkinleştir 1 Vuruş Yap Bu şişedeki parlak mavi sıvı reaktifler havaya maruz kaldığında ısıyı hızla emer. Bir don şişesi 4d6 cold hasar ve 4 cold sıçrama hasarı verir. Bir isabette hedef bir sonraki sırasının sonuna kadar Hareket Hızına –15 fit statü cezası alır. Saldırı zarlarına +3 eşya bonusu kazanırsınız.


omen://item/frost-vial-moderate?source=paizo-pathfinder-player-core-2:
  name: Don Şişesi (Orta)
  description: >
    Etkinleştir 1 Vuruş Yap Bu şişedeki parlak mavi sıvı reaktifler havaya maruz kaldığında ısıyı hızla emer. Bir don şişesi 2d6 cold hasar ve 2 cold sıçrama hasarı verir. Bir isabette hedef bir sonraki sırasının sonuna kadar Hareket Hızına –10 fit statü cezası alır. Saldırı zarlarına +1 eşya bonusu kazanırsınız.


omen://item/ghost-charge-greater?source=paizo-pathfinder-player-core-2:
  name: Hayalet Bombası (Büyük)
  description: >
    Etkinleştir A Vuruş Yap Bu yaylı metal kutular yakındaki yaşayan ölü yaratıkları tüketen ve ayrıştıran bir kimyasal ve tuz karışımı içerir. Bir hayalet bombası saldırı zarlarına +2 eşya bonusu verir 3d8 vitality hasar ve 3 vitality sıçrama hasarı verir ancak vitality hasarı için her zamanki gibi bu hasar yalnızca yaşayan ölülere ve void healing özelliğine sahip yaratıklara zarar verir. Bir hayalet bombasından hasar alan birincil hedef bir sonraki sıranızın başlangıcına kadar Güçten Düşmüş 2 olur. Hayalet bombaları ruhani bir maddeyle temas ettiğinde bile patlayacak şekilde tasarlanmıştır bu da onları bedensiz yaşayan ölülere hasar vermek için ideal kılar.


omen://item/ghost-charge-lesser?source=paizo-pathfinder-player-core-2:
  name: Hayalet Bombası (Küçük)
  description: >
    Etkinleştir A Vuruş Yap Bu yaylı metal kutular yakındaki yaşayan ölü yaratıkları tüketen ve ayrıştıran bir kimyasal ve tuz karışımı içerir. Bir hayalet bombası 1d8 vitality hasar ve 1 vitality sıçrama hasarı verir ancak vitality hasarı için her zamanki gibi bu hasar yalnızca yaşayan ölülere ve void healing özelliğine sahip yaratıklara zarar verir. Bir hayalet bombasından hasar alan birincil hedef bir sonraki sıranızın başlangıcına kadar Güçten Düşmüş 1 olur. Hayalet bombaları ruhani bir maddeyle temas ettiğinde bile patlayacak şekilde tasarlanmıştır bu da onları bedensiz yaşayan ölülere hasar vermek için ideal kılar.


omen://item/ghost-charge-major?source=paizo-pathfinder-player-core-2:
  name: Hayalet Bombası (Üstün)
  description: >
    Etkinleştir A Vuruş Yap Bu yaylı metal kutular yakındaki yaşayan ölü yaratıkları tüketen ve ayrıştıran bir kimyasal ve tuz karışımı içerir. Bir hayalet bombası saldırı zarlarına +3 eşya bonusu verir 4d8 vitality hasar ve 4 vitality sıçrama hasarı verir ancak vitality hasarı için her zamanki gibi bu hasar yalnızca yaşayan ölülere ve void healing özelliğine sahip yaratıklara zarar verir. Bir hayalet bombasından hasar alan birincil hedef bir sonraki sıranızın başlangıcına kadar Güçten Düşmüş 2 olur. Hayalet bombaları ruhani bir maddeyle temas ettiğinde bile patlayacak şekilde tasarlanmıştır bu da onları bedensiz yaşayan ölülere hasar vermek için ideal kılar.


omen://item/ghost-charge-moderate?source=paizo-pathfinder-player-core-2:
  name: Hayalet Bombası (Orta)
  description: >
    Etkinleştir A Vuruş Yap Bu yaylı metal kutular yakındaki yaşayan ölü yaratıkları tüketen ve ayrıştıran bir kimyasal ve tuz karışımı içerir. Bir hayalet bombası saldırı zarlarına +1 eşya bonusu verir 2d8 vitality hasar ve 2 vitality sıçrama hasarı verir ancak vitality hasarı için her zamanki gibi bu hasar yalnızca yaşayan ölülere ve void healing özelliğine sahip yaratıklara zarar verir. Bir hayalet bombasından hasar alan birincil hedef bir sonraki sıranızın başlangıcına kadar Güçten Düşmüş 1 olur. Hayalet bombaları ruhani bir maddeyle temas ettiğinde bile patlayacak şekilde tasarlanmıştır bu da onları bedensiz yaşayan ölülere hasar vermek için ideal kılar.


omen://item/ghost-ink?source=paizo-pathfinder-player-core-2:
  name: Hayalet Mürekkebi
  description: >
    Etkinleştir 10 dakika (manipulate) Bu soluk mavi mürekkep hızla kurur ve uygulamadan 1 dakika sonra tamamen şeffaf hâle gelir. Mürekkep bir meşale veya diğer açık alev gibi ısıya maruz kaldığında kırmızı renkte parlar. Bu parıltı yalnızca mürekkep ısıya maruz kaldığı sürece devam eder ardından mürekkep tekrar Görünmez olur. Hayalet mürekkebinin zanaatkârı bunun yerine mürekkebi güneş ışığına, yıldız ışığına, büyülü ışığa veya Işıldayan Çubuk gibi simyasal bir etkiyle yaratılan ısısız ışığa duyarlı kılmak için formülü biraz değiştirebilir. Metin parlamıyorken hayalet mürekkebiyle işaretlenmiş bir yüzeyi yakından inceleyen bir yaratık başarılı bir testle mürekkebin varlığını tespit edebilir. Kritik bir başarıda Yazı Çözümlemek için Sosyoloji becerisini kullanabilecek kadar mürekkebi iyi ayırt edebilirler. Bir şişe hayalet mürekkebi bir sayfa değerinde metin yazmak için yeterlidir.


omen://item/ghoul-hide?source=paizo-pathfinder-player-core-2:
  name: Gulyabani Postu Zırhı
  description: Gulyabani derisi parçalarından birbirine dikilmiş bu +1 post zırh takımı lanetlere karşı kurtarışlara +1 eşya bonusu verir ve sizi gulyabanilerin pis kokusuna karşı bağışık kılar. Kurtarış rünü olan gulyabani postu zırhı kurtarış rününün lanetlere karşı kurtarışlara verdiği eşya bonusunu 1 artırır (en fazla +4).

omen://item/giant-centipede-venom?source=paizo-pathfinder-player-core-2:
  name: Dev Çıyan Zehri
  description: >
    Dev çıyan zehri şiddetli kas sertliğine ve genel yorgunluğa yol açar.
    Etkinleştir 2 (manipulate)
    Kurtarış fortitude|dc:17|showDC:all
    Maksimum Süre 6 tur
    Aşama 1 1d4[poison] hasar (1 tur)
    Aşama 2 1d4 zehir hasarı ve Bitkin (1 tur)
    Aşama 3 1d4 zehir hasarı, Sakar 1 ve Bitkin (1 tur)

omen://item/giant-scorpion-venom?source=paizo-pathfinder-player-core-2:
  name: Dev Akrep Zehri
  description: >
    Bir dev akrebin zehri dayanılmaz derecede acı vericidir ve etkileri bir dereceye kadar güçten düşürücüdür.
    Etkinleştir 2 (manipulate)
    Kurtarış fortitude|dc:22|showDC:all
    Maksimum Süre 6 tur
    Aşama 1 2d6[poison] hasar ve Güçten Düşmüş 1 (1 tur)
    Aşama 2 2d8[poison] hasar ve Güçten Düşmüş 1 (1 tur)
    Aşama 3 2d10[poison] hasar ve Güçten Düşmüş 2 (1 tur)

omen://item/glamorous-buckler?source=paizo-pathfinder-player-core-2:
  name: Göz Alıcı Küçük Kalkan
  description: >
    Göz alıcı küçük kalkan (Sertlik 3, CP 6, KE 3) ışıkta parıldayan yaldızlar ve kakma değerli taşlarla cömertçe süslenmiştir. Kaldırdığınız sürece göz alıcı küçük kalkan Şaşırtmaca yapmak için yapılan Aldatma testlerine +1 eşya bonusu verir. Etkinleştir—Göz Kamaştırıcı Şaşırtmaca f (concentrate) Etki: Şaşırtmaca yaparken göz alıcı küçük kalkan görkemli bir şekilde parıldar. Başarılı bir Şaşırtmacada hedef 1 tur boyunca Gözü Kamaşmış olur. Sertlik 3, CP 6, KE 3


omen://item/grasping-snare?source=paizo-pathfinder-player-core-2:
  name: Kavrayan Kapan
  description: Bir yaratığı yerinde tutmak için sarmaşıklar ve halatlar kurarsınız. Kareye giren ilk yaratık aşağıdaki etkilerle bir kurtarış denemelidir.

omen://item/graveroot?source=paizo-pathfinder-player-core-2:
  name: Mezarkökü
  description: >
    Mezarkökü çalısından elde edilen opak beyaz reçine zihni bulandırır.
    Etkinleştir 2 (manipulate)
    Kurtarış fortitude|dc:19|showDC:all
    Maksimum Süre 4 tur
    Aşama 1 1d8[poison] hasar (1 tur)
    Aşama 2 1d10[poison] hasar ve Zihni Uyuşmuş 1 (1 tur)
    Aşama 3 2d6[poison] hasar ve Zihni Uyuşmuş 2 (1 tur)

omen://item/guise-of-the-smirking-devil-greater?source=paizo-pathfinder-player-core-2:
  name: Sırıtan İblis Sureti (Büyük)
  description: >
    Bu buz mavisi yarım maske, takanın ağzını kaplayan ve yüzün geri kalanını açıkta bırakan hain bir gümüş tebessümle süslenmiştir. Gözdağı testlerine +3 eşya bonusu kazanırsınız.
    Etkinleştir—Korkunç Feryat 2 (concentrate, manipulate)
    Etki: Maske 9. derecede Lanetlilerin Feryatları yapar.
    Bir yayılma alanı içindeki her yaşayan yaratık 8d10[void]|options:area-damage hasar alır ve bir fortitude|dc:41|options:area-effect,damaging-effect kurtarışı denemelidir.

omen://item/guise-of-the-smirking-devil?source=paizo-pathfinder-player-core-2:
  name: Sırıtan İblis Sureti
  description: >
    Bu buz mavisi yarım maske, takanın ağzını kaplayan ve yüzün geri kalanını açıkta bırakan hain bir gümüş tebessümle süslenmiştir. Gözdağı testlerine +2 eşya bonusu kazanırsınız.
    Etkinleştir—Korkunç Feryat 2 (concentrate, manipulate)
    Etki: Maske, bir yayılma alanı içindeki her yaşayan yaratığa 6d10[void]|options:area-damage hasar veren ruh dondurucu bir çığlık yayar (fortitude|dc:25|basic|options:area-effect kurtarışı).

omen://item/hail-of-arrows-snare?source=paizo-pathfinder-player-core-2:
  name: Ok Yağmuru Kapanı
  description: "Bir yaratık kapanın karesine girdiğinde, kapan özenle hazırlanmış yüzlerce oku serbest bırakarak, kapanın karesinin etrafındaki 20 fitlik bir yarıçapı 18d6[piercing]|options:area-damage hasar veren yoğun bir ok ateşiyle kaplar. Alandaki yaratıklar bir reflex|showDC:all|dc:37|basic|options:area-effect kurtarışı denemelidir."

omen://item/hampering-snare?source=paizo-pathfinder-player-core-2:
  name: Engelleyici Kapan
  description: Bir yaratığın hareketini engellemek için böğürtlenler, teller, yapışkan vıcık madde veya diğer malzemeleri düzenlersiniz. Bu kapanın bulunduğu kare ve bitişik üç kare (10 fitlik 10 fitlik bir alan oluşturmak için) ilk yaratık kapanın karesine girdiğinde zorlu arazi hâline gelir. Zorlu arazi yaratığın hareketini hemen tetikleyici kareye hareketi de dâhil olmak üzere etkiler ve kapan tetiklendikten sonra 1d4 tur sürer. Bir yaratık zorlu araziyi erken bir aşamada tek bir kareden temizlemek için bir Etkileşime Gir eylemi kullanabilir.

omen://item/hand-adze?source=paizo-pathfinder-player-core-2:
  name: El Keseri
  description: Keserin daha küçük versiyonu dar alanlarda hassas ahşap işçiliği için faydalıdır. Tripkeeler el keserlerini zanaat için ve yakın dövüş silahları olarak kullanır.

omen://item/helm-of-zeal-greater?source=paizo-pathfinder-player-core-2:
  name: Şevk Miğferi (Büyük)
  description: >
    Bu gösterişli miğfer miğfer imal edildiğinde seçilen bir ilahın ilahi sembolleriyle bezenmiştir. O ilahın İlahi Becerisine +3 eşya bonusu kazanırsınız. Etkinleştir—Davaya Katıl f (concentrate) Etki: Yalnızca bir bağlılık büyüsü yapmak için harcayabileceğiniz 1 Odak Puanı kazanırsınız. Bu Odak Puanını bu turun sonuna kadar harcamazsanız kaybolur. Etkinleştir—İlahi Coşku f (concentrate) Etki: Yalnızca şampiyonunuzun tepkisi için kullanabileceğiniz ek bir tepki kazanırsınız. Bu tepkiyi bir sonraki sıranızın başlangıcına kadar kullanmazsanız kaybedersiniz.


omen://item/helm-of-zeal?source=paizo-pathfinder-player-core-2:
  name: Şevk Miğferi
  description: >
    Bu gösterişli miğfer miğfer imal edildiğinde seçilen bir ilahın ilahi sembolleriyle bezenmiştir. O ilahın İlahi Becerisine +2 eşya bonusu kazanırsınız. Etkinleştir—Davaya Katıl f (concentrate) Etki: Yalnızca bir bağlılık büyüsü yapmak için harcayabileceğiniz 1 Odak Puanı kazanırsınız. Bu Odak Puanını bu turun sonuna kadar harcamazsanız kaybolur. Etkinleştir—İlahi Coşku f (concentrate) Etki: Yalnızca şampiyonunuzun tepkisi için kullanabileceğiniz ek bir tepki kazanırsınız. Bu tepkiyi bir sonraki sıranızın başlangıcına kadar kullanmazsanız kaybedersiniz.


omen://item/hemlock?source=paizo-pathfinder-player-core-2:
  name: Baldıran
  description: >
    Konsantre baldıran; kurbanın kalbi de dahil olmak üzere kas hareketlerini durduran, özellikle ölümcül bir toksindir.
    Etkinleştir A (manipulate)
    Kurtarış fortitude|dc:38|showDC:all
    Başlangıç 30 dakika
    Maksimum Süre 60 dakika
    Aşama 1 16d6[poison] hasar ve Güçten Düşmüş 2 (10 dakika)
    Aşama 2 17d6[poison] hasar ve Güçten Düşmüş 3 (10 dakika)
    Aşama 3 18d6[poison] hasar ve Güçten Düşmüş 4 (10 dakika)

omen://item/hobbling-snare?source=paizo-pathfinder-player-core-2:
  name: Topallatan Kapan
  description: Bu kapanı tetikleyen bir yaratığın etrafını sıkıca sarmak için sarmaşıklar, halatlar veya teller kurarsınız. Kareye giren ilk yaratık bir kurtarış denemelidir.

omen://item/holy-chain?source=paizo-pathfinder-player-core-2:
  name: Mübarek Zincir Zırh
  description: >
    Bu +2 kurtarış zincir zırh takımı garip ve hafif yarı saydam soluk bir metalin ince beyaz halkalarından yapılmıştır ve kolları ile eteği tüylere benzeyen daha küçük hatlar hâlinde biçimlendirilmiştir. Normal zincir zırhın aksine mübarek zincir zırhın Hız azaltması yoktur, zırh kontrol cezası 0'dır ve Bulk'ı 1'dir. Fiendlere karşı SD'ye ve kurtarışlara +1 durumsal bonus kazanırsınız. Zırhı giydiğiniz sürece parlak görünürsünüz bu da size fiendler dışındaki tüm yaratıklara karşı Diplomasi testlerine +2 eşya bonusu verir. Unholy özelliğine sahipseniz mübarek zincir zırh giyerken İçi Çekilmiş 2 olursunuz. Zırhı giydiğiniz sürece bu durumdan kurtulamazsınız. Etkinleştir—Celestial Uçuş 1 (concentrate) Etki: Zırh size 30 fitlik bir uçma Hareket Hızı veren parıldayan kanatlar filizlendirir. Kanatlar 40 fitlik bir yarıçapta parlak ışık (ve sonraki 40 fite kadar loş ışık) saçar. Kanatlar 10 dakika sonra kaybolur.


omen://item/hunters-bane?source=paizo-pathfinder-player-core-2:
  name: Avcıkıran
  description: >
    Kullanım: zırha iliştirilmiş Etkinleştir F (concentrate) Bu tılsım kurutulmuş, birbirine örülmüş saman parçalarından oluşan bir halkadır. Avcıkıranı etkinleştirdiğinizde saldıranın tam yerini hissedersiniz. Sizden Gizlenmişse tarafınızdan Gözlemlenir hâle gelir veya Konumu Saptanmamışsa Gizlenmiş hâle gelir. Saldırgan kurşunun arkasındaysa avcıkıranın hiçbir etkisi yoktur.


omen://item/incense-of-distilled-death?source=paizo-pathfinder-player-core-2:
  name: Damıtılmış Ölüm Tütsüsü
  description: >
    Etkinleştir 1 (manipulate) Bu siyah tütsü taze toprak ve kül kokar. Tütsüyü yakarak etkinleştirirsiniz bunun üzerine bir yayılmayı yağlı duman ve güçlü void enerjisiyle doldurur. Bedensiz yaşayan ölüler de dâhil olmak üzere yaşayan ölü yaratıklar alandayken hızlı iyileşme 4 kazanır; bu iyileşme void enerjisinden gelse de yaşayan yaratıkları olumsuz etkilemez. Yakıldıktan sonra tütsü 1 dakika boyunca yanar ve söndürülemez.


omen://item/infiltrators-accessory?source=paizo-pathfinder-player-core-2:
  name: Sızmacı Aksesuarı
  description: >
    Bu zarif +1 hasar zarı kılıçlı baston silahların genellikle izin verilmediği yüksek sosyete etkinliklerine uygun hem şık bir aksesuar hem de gizli bir silah olarak eşit derecede iyi hizmet eder. Etkinleştir—Büyüyü Gizle A (manipulate) Etki: Kılıçlı bastonun kabzasını çevirerek bıçağı sihirli bir şekilde bastonla birleştirirsiniz. Bıçak birleşikken çekilemez ve büyülü görünmemesi için 3. derece Büyüyü Maskele büyüsünün avantajlarını kazanır. Pasif gözlemciler bastonun mükemmel de olsa sıradan bir moda aksesuarından başka bir şey olduğunu fark etmek için bir test deneyemezler. Onu dikkatle inceleyenler bastonun göründüğünden daha fazlası olduğunu ayırt edebilirler ancak bunu yapmak son derece zordur (). Kılıçlı bastonu tekrar etkinleştirmek bıçağı serbest bırakarak normal şekilde çekilmesini sağlar.


omen://item/instant-evisceration-snare?source=paizo-pathfinder-player-core-2:
  name: Ani Deşme Kapanı
  description: "Bir yaratık kapanın karesine girdiğinde, kapan yaratığa inanılmaz bir bıçak cephaneliği fırlatarak 18d8[piercing] hasar verir (reflex|showDC:all|dc:42|basic kurtarışı)."

omen://item/iron-cudgel?source=paizo-pathfinder-player-core-2:
  name: Demir Tokaç
  description: >
    Kullanım: bir yakın dövüş silahına iliştirilmiş Etkinleştir A (manipulate) Bu minyatür tokmak genellikle silaha demir bir zincirle tutturulur. Tokmağı etkinleştirdiğinizde savaşçı hüneri gibi Vahşi Bitiş kullanırsınız. Press özelliğindekiler de dâhil olmak üzere normal gereksinimleri karşılamalısınız. Vahşi Bitiş hünerine sahipseniz normal sonuçlara bir başarıda veya başarısızlıkta ek bir silah hasar zarı ekleyin.


omen://item/iron-equalizer?source=paizo-pathfinder-player-core-2:
  name: Demir Dengeleyici
  description: >
    Kullanım: bir silaha iliştirilmiş Etkinleştir A (manipulate) Bu küçük demir halka iliştirilmiş silahın dengesini eşitlemeye yardımcı olan kayar bir ağırlığa sahiptir. Etkinleştirdiğinizde savaşçı hüneri gibi Kesin Saldırı kullanırsınız. Press özelliğindekiler de dâhil olmak üzere normal gereksinimleri karşılamalısınız. Kesin Saldırı hünerine sahipseniz başarısızlık etkisi silahın normal hasarını verecek şekilde artar.


omen://item/jade-bauble?source=paizo-pathfinder-player-core-2:
  name: Yeşim Süs
  description: >
    Etkinleştir A (concentrate) Bu yeşim parçası genellikle bir düellocu veya bazen çok kollu bir yaratık şeklinde oyulur. Süsü etkinleştirdiğinizde düşmanların dikkatini sihirli bir şekilde çeker. Bir sonraki sıranızın başlangıcına kadar tılsımın iliştirildiği silahın erişimi içindeki düşmanlar Gafil kalır.


omen://item/juggernaut-mutagen-greater?source=paizo-pathfinder-player-core-2:
  name: Durdurulamaz Mutajen (Büyük)
  description: >
    Etkinleştir A (manipulate) Bedeniniz sağlam ve ağırbaşlı hâle gelir. Fayda Dayanıklılık kurtarışlarına +3 eşya bonusu ve 30 geçici Can Puanı kazanırsınız. En az 1 tam dakika boyunca maksimum Can Puanında olduğunuzda, geçici Can Puanlarını yeniden kazanırsınız. Bir Dayanıklılık kurtarışında başarı attığınızda, bunun yerine kritik başarı elde edersiniz. Dezavantaj İrade kurtarışlarına, Dikkat testlerine ve inisiyatif zarlarına -2 ceza alırsınız. Süre 1 saat.


omen://item/juggernaut-mutagen-lesser?source=paizo-pathfinder-player-core-2:
  name: Durdurulamaz Mutajen (Küçük)
  description: >
    Etkinleştir A (manipulate) Bedeniniz sağlam ve ağırbaşlı hâle gelir. Fayda Dayanıklılık kurtarışlarına +1 eşya bonusu ve 5 geçici Can Puanı kazanırsınız. En az 1 tam dakika boyunca maksimum Can Puanında olduğunuzda, geçici Can Puanlarını yeniden kazanırsınız. Dezavantaj İrade kurtarışlarına, Dikkat testlerine ve inisiyatif zarlarına -2 ceza alırsınız. Süre 1 dakika.


omen://item/juggernaut-mutagen-major?source=paizo-pathfinder-player-core-2:
  name: Durdurulamaz Mutajen (Üstün)
  description: >
    Etkinleştir A (manipulate) Bedeniniz sağlam ve ağırbaşlı hâle gelir. Fayda Dayanıklılık kurtarışlarına +4 eşya bonusu ve 45 geçici Can Puanı kazanırsınız. En az 1 tam dakika boyunca maksimum Can Puanında olduğunuzda, geçici Can Puanlarını yeniden kazanırsınız. Bir Dayanıklılık kurtarışında başarı attığınızda bunun yerine kritik başarı elde edersiniz ve Dayanıklılık kurtarışlarındaki kritik başarısızlıklarınız bunun yerine başarısızlık olur. Dezavantaj İrade kurtarışlarına, Dikkat testlerine ve inisiyatif zarlarına -2 ceza alırsınız. Süre 1 saat.


omen://item/juggernaut-mutagen-moderate?source=paizo-pathfinder-player-core-2:
  name: Durdurulamaz Mutajen (Orta)
  description: >
    Etkinleştir A (manipulate) Bedeniniz sağlam ve ağırbaşlı hâle gelir. Fayda Dayanıklılık kurtarışlarına +2 eşya bonusu ve 10 geçici Can Puanı kazanırsınız. En az 1 tam dakika boyunca maksimum Can Puanında olduğunuzda, geçici Can Puanlarını yeniden kazanırsınız. Dezavantaj İrade kurtarışlarına, Dikkat testlerine ve inisiyatif zarlarına -2 ceza alırsınız. Süre 10 dakika.


omen://item/khopesh?source=paizo-pathfinder-player-core-2:
  name: Hopeş
  description: "Bu kavisli orak kılıç sivri bir uca sahiptir; geniş kavislerle savrulmasına veya düşman savunmalarının etrafından dikey olarak saplanmasına olanak tanır. Bir hopeşin ucu kancalıdır ve bir rakibe çelme takmak için kullanılabilir."

omen://item/kings-sleep?source=paizo-pathfinder-player-core-2:
  name: Kral Uykusu
  description: >
    Kral uykusu; yaşlı bir hedefte bir hastalık ve hatta doğal nedenlerle ölüm gibi görünebilen, sinsi ve uzun vadeli bir zehirdir. Kral uykusundan kaynaklanan İçi Çekilmiş durumu her başarısız kurtarışla birikir ve zehir sürdüğü sürece giderilemez. Etkinleştir A (manipulate) Kurtarış Başlangıç 1 gün Aşama 1 İçi Çekilmiş 1 (1 gün) Aşama 2 İçi Çekilmiş 1 (1 gün) Aşama 3 İçi Çekilmiş 2 (1 gün)


omen://item/leadenleg?source=paizo-pathfinder-player-core-2:
  name: Kurşunbacak
  description: >
    Enjekte edildiğinde bu sentetik toksin uzuvlara çöker ve onları neredeyse felç derecesinde uyuşturur.
    Etkinleştir 2 (manipulate)
    Kurtarış fortitude|dc:20|showDC:all
    Maksimum Süre 6 tur
    Aşama 1 1d10[poison] hasar ve tüm Hızlara –5 fit statü cezası (1 tur)
    Aşama 2 2d6[poison] hasar ve tüm Hızlara –10 fit statü cezası (1 tur)
    Aşama 3 2d6 zehir hasarı ve tüm Hızlara –20 fit statü cezası (1 tur)

omen://item/lethargy-poison?source=paizo-pathfinder-player-core-2:
  name: Uyuşukluk Zehri
  description: >
    Uyuşukluk zehri, kurbanlarını canlı isteyen saldırganlar tarafından vur-kaç taktiklerinde yaygın olarak kullanılır; pusu kuran kişi zehir etkisini gösterene ve kurban bilincini kaybedene kadar geri çekilir. Uyuşukluk zehrine daha fazla maruz kalmak hedefin ek kurtarışlar denemesini gerektirmez; yalnızca süregelen bir maruziyete karşı kurtarışta başarısız olmak aşamasını ilerletebilir. Etkinleştir 2 (manipulate) Kurtarış Maksimum Süre 4 saat Aşama 1 Yavaşlamış 1 (1 tur) Aşama 2 Yavaşlamış 1 (1 dakika) Aşama 3 Uyanmak için Dikkat testi olmaksızın Bilinçsiz (1 tur) Aşama 4 Uyanmak için Dikkat testi olmaksızın Bilinçsiz (1d4 saat).


omen://item/mambele?source=paizo-pathfinder-player-core-2:
  name: Mambele
  description: Hunga munga veya danisco olarak da bilinen bu bıçak-balta melezi silah, bir kabza ve kullanan kişiye doğru geriye bükülen bir namludan oluşur. Namlunun kavisi öyledir ki, bir kurban mambele ile vurulduktan sonra silah kurbanın bedeninden çıkarılırken daha fazla hasar verilir.

omen://item/mariners-splint?source=paizo-pathfinder-player-core-2:
  name: Denizci Şerit Zırhı
  description: Bu +1 şerit zırh takımı, savaş gemilerindeki mümkün olduğunca fazla koruma isteyen ancak yine de donanımlara tırmanacak veya ihtiyaç duyulması hâlinde yüzecek kadar hareketli kalması gereken kıdemli denizciler tarafından giyilir. Plakalar maksimum esneklik için düzenlenmiştir ve dolgulu zırhın alt katmanı genellikle pamuklu bir gömlekten fazlası değildir. Zırh, Tırmanmak veya Yüzmek için yapılan Atletizm testlerine +1 eşya bonusu verir ve başarılı bir şekilde Tırmandığınızda veya Yüzdüğünüzde katettiğiniz mesafeyi 5 fit artırır.

omen://item/marking-snare?source=paizo-pathfinder-player-core-2:
  name: İşaretleme Kapanı
  description: Bu kapan, davetsiz misafirleri daha sonra takip etmek veya teşhis etmek amacıyla işaretlemek için sıklıkla kullanılır. Bu kapanı yarattığınızda, onu bir boya veya koku işaretleyicisi yapmaya karar vermelisiniz. Her iki işaretleme türü de yaratığı 24 saate kadar veya boya ya da koku yıkanana kadar (en az bir galon su ve 10 dakikalık fırçalama gerektirir) İz Sürerken +2 durumsal bonus verir. Kapanın bir karesine giren bir yaratık bir kurtarış denemelidir.

omen://item/medusas-scream-greater?source=paizo-pathfinder-player-core-2:
  name: Medusa Çığlığı (Büyük)
  description: >
    Katledilmiş bir medusanın başının korkunç çehresi bu çelik kalkandan (Sertlik 15, CP 60, KK 30) dışarı bakar. Kalkan, başı gizlemek için kalın deri bir örtü ile birlikte gelir. Etkinleştir—Taşlaştıran Bakış 2 (manipulate, visual) Etki: Medusanın yüzünü açığa çıkararak bakışlarını 30 fit içindeki bir yaratığa odaklarsınız. Kalkan, 30 fit menzilli bir ZD 35 Taşlaştır büyüsü yapar. Sertlik CP KK 15 60 30


omen://item/medusas-scream?source=paizo-pathfinder-player-core-2:
  name: Medusa Çığlığı
  description: >
    Katledilmiş bir medusanın başının korkunç çehresi bu çelik kalkandan (Sertlik 13, CP 52, KK 26) dışarı bakar. Kalkan, başı gizlemek için kalın deri bir örtü ile birlikte gelir. Etkinleştir—Taşlaştıran Bakış 2 (manipulate, visual) Etki: Medusanın yüzünü açığa çıkararak bakışlarını 30 fit içindeki bir yaratığa odaklarsınız. Kalkan, 30 fit menzilli bir ZD 30 Taşlaştır büyüsü yapar. Sertlik CP KK 13 52 26


omen://item/mindfog-mist?source=paizo-pathfinder-player-core-2:
  name: Zihin Sisi Buharı
  description: >
    Zihin sisi buharı, kurbanın zihinsel melekeleri üzerindeki etkisi hızlı ve güçlü olduğundan büyücülerin altını oymak için kullanılabilir. Etkinleştir A (manipulate) Kurtarış Başlangıç 1 tur Maksimum Süre 6 tur Aşama 1 Sersemlemiş 2 (1 tur) Aşama 2 Aklı Bulanmış ve Sersemlemiş 3 (1 tur) Aşama 3 Aklı Bulanmış ve Sersemlemiş 4 (1 tur)


omen://item/mudrock-snare?source=paizo-pathfinder-player-core-2:
  name: Çamurtaşı Kapanı
  description: "Pişmiş kil, aralarına hızlı kuruyan bir maddenin kırılgan şişeleri serpiştirilmiş sığ ve cıvık bir çamur çukurunu kaplar. Kareye basan ilk yaratık kili kırarak çukura batar; şişeleri çatlatır ve çamuru sertleştiren kimyasalları serbest bırakır. Çamur bacaklarının üzerinde katılaşırken bu yaratık bir kurtarış denemelidir."

omen://item/nauseating-snare?source=paizo-pathfinder-player-core-2:
  name: Mide Bulandıran Kapan
  description: Özellikle pis maddeleri bir yaratığın üzerine sıçrayacak şekilde yerleştirirsiniz. Kareye giren ilk yaratık bir kurtarış denemelidir.

omen://item/nethershade?source=paizo-pathfinder-player-core-2:
  name: Aşağıgölge
  description: >
    Aşağı Dünya'dan damıtılan bu yağlı madde kasvetli etkilere yol açar. Aşağıgölgeden kaynaklanan Güçten Düşmüş durumu 24 saat sürer.
    Etkinleştir 2 (manipulate)
    Kurtarış fortitude|dc:29|showDC:all
    Maksimum Süre 6 tur
    Aşama 1 2d6[void],2d6[poison] hasar (1 tur)
    Aşama 2 3d6[void],2d6[poison] hasar ve Güçten Düşmüş 1 (1 tur)
    Aşama 3 3d6[void],3d6[poison] hasar ve Güçten Düşmüş 2 (1 tur)

omen://item/nettleweed-residue?source=paizo-pathfinder-player-core-2:
  name: Isırgan Otu Kalıntısı
  description: >
    Isırgan otlarının konsantre özsuyu etkili bir toksin oluşturur.
    Etkinleştir A (manipulate)
    Kurtarış fortitude|dc:27|showDC:all
    Başlangıç 1 dakika
    Maksimum Süre 6 dakika
    Aşama 1 3d6[poison] hasar (1 dakika)
    Aşama 2 4d6[poison] hasar (1 dakika)
    Aşama 3 6d6[poison] hasar (1 dakika)

omen://item/oil-of-dynamism-greater?source=paizo-pathfinder-player-core-2:
  name: Dinamizm Yağı (Büyük)
  description: >
    Etkinleştir 2 (manipulate) Bu kaliteli altın rengi yağ küçük mavi bir kutuda gelir. Yağı dikkatlice bir nesnenin üzerine yaymak, onu aynı türden canlandırılmış bir nesneye dönüştürür. Örneğin bir heykelin üzerine serpmek onu canlandırılmış bir heykel yapar. Canlandırılmış nesnenin seviyesi 11'den büyük olacaksa, yağ onu canlandırmakta zorlanır ve nihayetinde başarısız olur. Bu canlandırılmış nesne köle özelliğine sahiptir, yani ona Komuta Ettiğinizde 2 eylem kullanabilir. Etkinleştirmenin bir parçası olarak mevcut tur için bir Komut verebilirsiniz. Nesne hareketsiz düşmeden önce 1 dakika boyunca canlandırılmış olarak kalır. Normalde olduğu gibi, kontrolünüz altında en fazla dört köle bulunabilir.


omen://item/oil-of-dynamism?source=paizo-pathfinder-player-core-2:
  name: Dinamizm Yağı
  description: >
    Etkinleştir 2 (manipulate) Bu kaliteli altın rengi yağ küçük mavi bir kutuda gelir. Yağı dikkatlice bir nesnenin üzerine yaymak, onu aynı türden canlandırılmış bir nesneye dönüştürür. Örneğin bir heykelin üzerine serpmek onu canlandırılmış bir heykel yapar. Canlandırılmış nesnenin seviyesi 3'ten büyük olacaksa, yağ onu canlandırmakta zorlanır ve nihayetinde başarısız olur. Bu canlandırılmış nesne köle özelliğine sahiptir, yani ona Komuta Ettiğinizde 2 eylem kullanabilir. Etkinleştirmenin bir parçası olarak mevcut tur için bir Komut verebilirsiniz. Nesne hareketsiz düşmeden önce 1 dakika boyunca canlandırılmış olarak kalır. Normalde olduğu gibi, kontrolünüz altında en fazla dört köle bulunabilir.


omen://item/oil-of-revelation?source=paizo-pathfinder-player-core-2:
  name: Açığa Çıkarma Yağı
  description: >
    İlk olarak insanlar tarafından karanlıkta savaşmalarına yardımcı olacak bir araç olarak yaratılan bu parlak yağ, süspansiyon hâlinde minik değerli taş parçacıkları tutar ve çakılmış bir kibrit gibi kokar. Bu yağla kaplanmış bir silah bir yaratığa ilk kez hasar verdiğinde, yara 1 dakika boyunca ışıkla parlar. Yaratık Görünmez ise, ışığın konumu, aksi takdirde onu göremeyecek olan yaratıklar için Konumu Saptanmamış olmak yerine yalnızca Belirsiz olduğu anlamına gelir. Işık ayrıca aydınlatma koşullarından kaynaklanan Belirsiz durumunu da ortadan kaldırır. Kaplanmış silah 1 saat içinde bir yaratığa hasar vermezse, yağ dökülür ve gücünü kaybeder.


omen://item/omnidirectional-spear-snare?source=paizo-pathfinder-player-core-2:
  name: Her Yöne Mızrak Kapanı
  description: "Bir yaratık kapanın karesine girer girmez, kapan her yönden yaratığa doğru tekinsiz derecede güçlü mızraklar fırlatarak 15d8[piercing] hasar verir (reflex|showDC:all|dc:37|basic kurtarışı)."

omen://item/onslaught-hide?source=paizo-pathfinder-player-core-2:
  name: Hücum Postu Zırhı
  description: "Bu +1 dayanıklı post zırh, katledilmiş birçok canavarın boynuzlarıyla süslenmiştir. –2 yerine –1 zırh kontrol cezasına sahiptir. Bu zırhı giyerken Ani Hücum sınıf hünerini kullandığınızda, Saldırınız ilave 1d8[untyped] hasar verir."

omen://item/philosophers-stone?source=paizo-pathfinder-player-core-2:
  name: Felsefe Taşı
  description: >
    Etkinleştir 1 (manipulate) veya 1 ya da daha fazla gün; aşağıya bakın Felsefe Taşı Üret hünerine sahip bir simyacı, bu eşyanın formülünü formül kitabına ekler. Bu, gelişmiş simyayı kullanarak günlük hazırlıkları sırasında ayda bir kez bir felsefe taşı yaratmalarına olanak tanır. Gelişmiş simyayla yaratılan diğer eşyaların aksine, felsefe taşı 1 ay boyunca veya simyacı yenisini yaratana kadar etkisini korur. Bu, bir felsefe taşı yaratmanın tek yoludur. İlk bakışta bir felsefe taşı sıradan, isli doğal bir kaya parçası gibi görünür. Kayayı Zorlayarak Aç eylemiyle (ZD 35) kırmak taşın kalbindeki bir boşluğu açığa çıkarır. Bu boşluk, adi metalleri değerli metallere dönüştürebilen veya bir gençleşme iksiri yaratabilen nadir bir cıva türüyle kaplıdır. Cıvayı kullanmak için Zanaat konusunda efsanevi olmalı ve Simyasal Zanaat hünerine sahip olmalısınız. Daha sonra taşın cıvasını iki etkiden biri için kullanabilirsiniz.  • Bir Etkileş eylemi kullanarak taşın cıvasını aşılanmış bir Yaşam İksiri (Hakiki)'ne uygulayabilirsiniz. Bu, iksiri anında aşılanmış bir Gençleşme İksiri'ne dönüştürür. Bu herhangi bir üretim süresi veya ek malzeme gerektirmez.  • Boş zamanda bir aya kadar süre harcayarak cıvayı gümüş yaratmak için demire veya altın yaratmak için kurşuna uygulayabilirsiniz. Başarı durumunda günde 500 gp değerinde veya kritik başarı durumunda günde 750 gp değerinde seçtiğiniz metalden üretmeniz haricinde, bunu Zanaat kullanarak Gelir Elde Etmek için 20. seviye bir görev gibi değerlendirin.


omen://item/pilgrims-token?source=paizo-pathfinder-player-core-2:
  name: Hac Yolcusu Nişanı
  description: >
    Bu ahşap dini sembol, inancınız için mübarek olan bir mekândan gelen küçük bir koruma nişanesidir. Bu dini sembol üzerinizde olduğu sürece, bir hasmın inisiyatif zarıyla berabere kaldığınızda ilk siz hareket edersiniz. Bu dini sembolü kaybederseniz, yenisini satın almalı veya Üretmeli ve ona uyumlanmalısınız. Böyle bir nişane genellikle en az 1 sp tutar ve uyumlanma 10 dakikalık dua gerektirir. Aynı sürede farklı bir dini sembole de uyumlanabilirsiniz, ancak önceki dini sembolün faydasını kaybedersiniz.


omen://item/potion-of-acid-retaliation-greater?source=paizo-pathfinder-player-core-2:
  name: Asit Misillemesi İksiri (Büyük)
  description: >
    Etkinleştir 1 (manipulate)
    Bir asit misillemesi iksiri içtikten sonra 1 dakika boyunca soluk bir asit enerjisi aurasıyla parlarsınız ve size dokunan (silahsız bir vuruş yapmak veya size karşı menzili dokunma olan bir büyü kullanmak gibi) ya da bitişiğinizde olup bir yakın dövüş silahı saldırısıyla size vuran bir yaratık asit hasarı alır.
    Aura 3d6[acid] hasar verir.

omen://item/potion-of-acid-retaliation-lesser?source=paizo-pathfinder-player-core-2:
  name: Asit Misillemesi İksiri (Küçük)
  description: >
    Etkinleştir 1 (manipulate)
    Bir asit misillemesi iksiri içtikten sonra 1 dakika boyunca soluk bir asit enerjisi aurasıyla parlarsınız ve size dokunan bir yaratık (silahsız bir vuruş yapmak veya size karşı menzili dokunma olan bir büyü kullanmak gibi) asit hasarı alır.
    Aura 1d4[acid] hasar verir.

omen://item/potion-of-acid-retaliation-major?source=paizo-pathfinder-player-core-2:
  name: Asit Misillemesi İksiri (Üstün)
  description: >
    Etkinleştir 1 (manipulate)
    Bir asit misillemesi iksiri içtikten sonra 1 dakika boyunca soluk bir asit enerjisi aurasıyla parlarsınız ve size dokunan (silahsız bir vuruş yapmak veya size karşı menzili dokunma olan bir büyü kullanmak gibi) ya da bitişiğinizde olup bir yakın dövüş silahı saldırısıyla size vuran bir yaratık asit hasarı alır.
    Aura 4d8[acid] hasar verir.

omen://item/potion-of-acid-retaliation-minor?source=paizo-pathfinder-player-core-2:
  name: Asit Misillemesi İksiri (Ufak)
  description: >
    Etkinleştir 1 (manipulate)
    Bir asit misillemesi iksiri içtikten sonra 1 dakika boyunca soluk bir asit enerjisi aurasıyla parlarsınız ve size dokunan bir yaratık (silahsız bir vuruş yapmak veya size karşı menzili dokunma olan bir büyü kullanmak gibi) asit hasarı alır.
    Aura 1[acid] hasar verir.

omen://item/potion-of-acid-retaliation-moderate?source=paizo-pathfinder-player-core-2:
  name: Asit Misillemesi İksiri (Orta)
  description: >
    Etkinleştir 1 (manipulate)
