omen://item/absolute-solvent-greater?source=paizo-pathfinder-player-core-2:
  name: Mutlak Çözücü (Büyük)
  description: >
    Etkinleştir 1 (manipulate) İlk olarak Ebedi Yapıştırıcıyı çözmek amacıyla formüle edilen bu güçlü çözücü, neredeyse her yapıştırıcının tutuşunu kırabilir. Mutlak çözücü özellikle ebedi yapıştırıcıya karşı etkili olduğundan, ebedi yapıştırıcıyı otomatik olarak çözer. Tutkal Bombaları gibi diğer yapıştırıcılara 9. derecede karşı koymayı dener ve +28 karşı koyma bonusuna sahiptir.


