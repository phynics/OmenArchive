omen://item/wand-of-overflowing-life-3rd-rank-spell?source=paizo-pathfinder-player-core-2:
  name: Taşan Yaşam Değneği (3. Derece Büyü)
  description: >
    Bu kaymaktaşı değneğin ucunda berrak bir kristal bulunur. Etkinleştir Büyü Yap Etki: 3. derecede İyileştir yaparsınız. Büyüyü yaptıktan sonra, bir sonraki sıranızın başında, aşırı şifa büyüsü değnekten fışkırır ve tıpkı kendinize 3. derecede iyileştir büyüsünün 1 eylemlik versiyonunu yapmışsınız gibi sizi iyileştirir. Aynı turda birden fazla taşan yaşam değneğinden iyileştir büyüsü yapsanız bile bu faydayı tur başına yalnızca bir kez kazanırsınız.


