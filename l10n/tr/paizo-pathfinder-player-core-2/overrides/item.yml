omen://item/bottled-lightning-greater?source=paizo-pathfinder-player-core-2:
  name: Şişelenmiş Yıldırım (Büyük)
  description: >
    Etkinleştir A Vuruş Yap Şişelenmiş yıldırım, havaya maruz kaldığında bir elektrik patlaması yaratan uçucu reaktiflerle doludur. Şişelenmiş yıldırım 3d6 electricity hasar ve 3 electricity sıçrama hasarı verir. Bir isabette hedef bir sonraki sıranızın başlangıcına kadar Gafil kalır. Saldırı zarlarına +2 eşya bonusu kazanırsınız.


omen://item/bottled-lightning-lesser?source=paizo-pathfinder-player-core-2:
