omen://item/predictable-silver-piece?source=paizo-pathfinder-player-core-2:
  name: Tahmin Edilebilir Gümüş Para
  description: >
    Görünüşte dikkat çekmeyen, yıpranmış bu gümüş paranın tura yüzünde isimsiz bir hükümdarın büstü, yazı yüzünde ise görkemli bir kuş yer alır. Parayı etkinleştirmeden de atabilirsiniz; bu durumda normal olasılık yasalarını takip eder. Etkinleştir—Kaderi Aldat 1 (manipulate) Etki: Kaderin ipliklerini hafifçe bükme niyetiyle başparmağınızı madeni paranın bir yüzüne sürter, ardından bir yazı tura atışında parayı havaya fırlatırsınız. Atış nasıl sonuçlanırsa sonuçlansın—paranın yere düşmesine izin vermek, elinizin tersine çarparak kapatmak veya açık avucunuzda yakalamak—her zaman sürttüğünüz yüz yukarı bakacak şekilde gelir.


omen://item/prognostic-veil-greater?source=paizo-pathfinder-player-core-2:
  name: Kehanet Peçesi (Büyük)
  description: >
    Bu tül benzeri mor peçe, kehanet önemi taşıyan sembollerle işlenmiştir. Lanetiniz kötüleştikçe, peçe giderek artan görünmeyen bir rüzgârda dalgalanır. Din testlerine +3 eşya bonusu kazanırsınız. Etkinleştir—Geleceği Hatırla f (concentrate) Etki: Yalnızca bir vahiy büyüsü yapmak için harcayabileceğiniz 1 Odak Puanı kazanırsınız. Bu Odak Puanını bu turun sonuna kadar harcamazsanız kaybolur. Etkinleştir—Kaderin Çilelerini Bük r (concentrate) Etki: Müttefik, kurtarışa veya saldırı zarına lanetbağlı durumunuzun değerine eşit bir statü bonusu kazanır.


omen://item/prognostic-veil?source=paizo-pathfinder-player-core-2:
  name: Kehanet Peçesi
  description: >
    Bu tül benzeri mor peçe, kehanet önemi taşıyan sembollerle işlenmiştir. Lanetiniz kötüleştikçe, peçe giderek artan görünmeyen bir rüzgârda dalgalanır. Din testlerine +2 eşya bonusu kazanırsınız. Etkinleştir—Geleceği Hatırla f (concentrate) Etki: Yalnızca bir vahiy büyüsü yapmak için harcayabileceğiniz 1 Odak Puanı kazanırsınız. Bu Odak Puanını bu turun sonuna kadar harcamazsanız kaybolur. Etkinleştir—Kaderin Çilelerini Bük r (concentrate) Etki: Müttefik, kurtarışa lanetbağlı durumunuzun değerine eşit bir statü bonusu kazanır.


omen://item/quicksilver-mutagen-greater?source=paizo-pathfinder-player-core-2:
  name: Cıva Mutajeni (Büyük)
  description: >
    Etkinleştir A (manipulate) Daha hızlı ve daha çevik hâle gelirsiniz ancak aynı zamanda kırılganlaşırsınız. Fayda Akrobasi testlerine, Gizlilik testlerine, Hırsızlık testlerine, Refleks kurtarışlarına ve Çeviklik temelli saldırı zarlarına +3 eşya bonusu kazanırsınız ve Hızınıza +15 fitlik bir statü bonusu kazanırsınız. Dezavantaj Seviyenizin iki katına eşit hasar alırsınız; mutajen sürdüğü sürece bu şekilde kaybedilen Can Puanlarını hiçbir yolla geri kazanamazsınız. Dayanıklılık kurtarışlarına -2 ceza alırsınız. Süre 1 saat.


omen://item/quicksilver-mutagen-lesser?source=paizo-pathfinder-player-core-2:
