  description: Bir yaratık kareye girdiğinde, ona saplanmak üzere dikenli iğneler dışarı fırlar ve 8d8 piercing hasar ile 2d8 persistent bleed hasar verir. Yaratık bir kurtarış denemelidir. İlk tetiklenmeden sonra iğneler 1 dakika boyunca art arda geri çekilip tekrar fırlar ve alana giren veya sırasını bu alanda bitiren herhangi bir yaratığı iğnelerden hasar almaya zorlar (aynı temel Refleks kurtarışını dener).

