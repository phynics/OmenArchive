omen://item/ration-tonic-greater?source=paizo-pathfinder-player-core-2:
  name: Kumanya Toniği (Büyük)
  description: >
    Etkinleştir 1 (manipulate) Bu ince şişe, hafif meyvemsi bir kokuya sahip temiz ve berrak su içeriyor gibi görünür. Bir kumanya toniği içmek, besini hafta boyunca sabit ve sağlıklı bir akışla dağıtarak sizi bir haftalık yiyecek ve suya eşdeğer şekilde büyüyle besler. Toniğin hoş ve hafif bir tadı vardır; ayrıntıları iksir üretildiğinde seçilir.


omen://item/ration-tonic?source=paizo-pathfinder-player-core-2:
  name: Kumanya Toniği
  description: >
    Etkinleştir 1 (manipulate) Bu ince şişe, hafif meyvemsi bir kokuya sahip temiz ve berrak su içeriyor gibi görünür. Bir kumanya toniği içmek sizi bir günlük yiyecek ve suya eşdeğer şekilde büyüyle besler. Toniğin hoş ve hafif bir tadı vardır; ayrıntıları iksir üretildiğinde seçilir.


omen://item/rending-snare?source=paizo-pathfinder-player-core-2:
  name: Parçalayan Kapan
  description: "Keskin metal çeneler bu kapanın baskı plakası mekanizmasına sıkıca sarılmıştır. Tetiklendiğinde çeneler kenetlenip dönerek uzuvlara hasar verir. Kapan, kareye giren ilk yaratığa 10d8[piercing] hasar verir; o yaratık bir reflex|dc:34|showDC:all kurtarışı denemelidir."

omen://item/ring-of-maniacal-devices-greater?source=paizo-pathfinder-player-core-2:
  name: Maniak Düzenekler Yüzüğü (Büyük)
  description: >
    Bu sihirli yüzük basit, kararmış bir pirinç gibi görünür ancak her türlü tuzak ve düzeneğe yönelik merakınızı artırır. Yüzükten bir Hırsız Alet Takımı çıkarmak için bir Etkileş eylemi kullanabilirsiniz. Bu alet takımı elinizde belirir ve herhangi bir parçası zilyetliğinizden çıkacak olursa yüzüğün içine geri katlanır. Bir Düzenek Etkisizleştirmek ve Kilit Açmak için yapılan Hırsızlık testlerine +3 eşya bonusu sağlarlar ve yüzüğün kavrayışları kapan ve tuzakları Üretmek ve Tamir Etmek için yapılan Zanaat testlerine de aynı bonusu verir. Etkinleştir—Ateş Topu Tuzağı 10 dakika (manipulate) Etki: Seçiminize göre 7. derece bir Uğultulu Tipi veya 7. derece Ateş Topu içeren bir Tılsımlı Rün ritüelinin etkilerini yaratırsınız. Birden fazla yüzüğünüz olsa bile, bir manyak düzenekler yüzüğünden aynı anda yalnızca bir aktif tuzaklı rüne sahip olabilirsiniz ve yüzükteki yatırımı kaybederseniz rün kaybolur.


omen://item/ring-of-maniacal-devices?source=paizo-pathfinder-player-core-2:
  name: Maniak Düzenekler Yüzüğü
