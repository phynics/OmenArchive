omen://item/adze?source=paizo-pathfinder-player-core-2:
  name: Keser
  description: "Yaygın bir kesici alet olan keser, bir baltayı andırır; ancak kesici ağzı dikey değil yataydır. Keserin şekli onu ahşap ustaları arasında popüler kılar ve tripkee inşaatçıları bunları genellikle ağaç tepesindeki evlerini inşa etmek için kullanır. Bu alet, kısmen onu savurmak için gereken muazzam güç nedeniyle etkili bir silah olarak da hizmet eder."

omen://item/alarm-snare?source=paizo-pathfinder-player-core-2:
  name: Alarm Kapanı
  description: Bir tuzak teline veya basınç plakasına bir veya daha fazla ses çıkaran nesne bağlayarak bir alarm kapanı yaratırsınız. Bir alarm kapanı kurduğunuzda, duyulabileceği 100 ila 500 fit arasında bir menzil belirlersiniz. Küçük veya daha büyük bir yaratık kareye girdiğinde, kapan belirlediğiniz menzildeki tüm yaratıklar tarafından duyulabilecek kadar yüksek bir ses çıkarır.

omen://item/alchemist-goggles-greater?source=paizo-pathfinder-player-core-2:
  name: Simyacı Gözlüğü (Büyük)
  description: >
    Bu pirinç gözlükler alev desenleriyle işlenmiştir ve kalın, ağır merceklere sahiptir. Takılıyken, simyasal eşyalar İmal Etmek için yapılan Zanaat testlerine +2 eşya bonusu verir. Simyasal bombalarla Saldırılar yaparken küçük siperi yok sayarsınız. Simyasal bir bombayla yaptığınız Saldırı başarısız olursa (ancak kritik başarısız olmazsa), Saldırının hedefinin aldığı sıçrama hasarına +2 eşya bonusu kazanırsınız.


