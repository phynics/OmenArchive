omen://item/whip-claw?source=paizo-pathfinder-player-core-2:
  name: Kamçı Pençe
  description: "Kamçı pençe, pençe benzeri hançerlere tutturulmuş uzun bir kordondur; kullanan kişinin onları ölümcül bir hassasiyetle fırlatıp geri çekmesine olanak tanır. Kedi halkı bu silahı ilk olarak tehlikeli hayvanları avlarken daha uzun erişim sağlamak için geliştirmiştir ve onu benzersiz bir ustalıkla kullanırlar."

