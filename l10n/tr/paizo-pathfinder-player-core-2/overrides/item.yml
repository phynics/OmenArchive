  name: Bomba Kapanı
  description: Bir yaratık kapanı tetiklediğinde aynı türden 3. seviye üç orta boy simyasal bombanın patlamasına neden olan bir kapan yaratırsınız. Kapan, bileşen bombalardan birinin doğrudan isabet hasarının üç katına eşit hasar verirken (örneğin, üç orta boy şişelenmiş yıldırımdan 6d6 elektrik hasarı) sıçrama hasarı veya başka bir etki yaratmadığından hedef ve bitişik karelerdeki tüm yaratıklar bir kurtarış denemelidir.

omen://item/bottled-catharsis-greater?source=paizo-pathfinder-player-core-2:
