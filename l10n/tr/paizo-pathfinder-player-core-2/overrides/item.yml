omen://item/breaching-pike?source=paizo-pathfinder-player-core-2:
  name: Gedik Kargısı
  description: Mızrak ucu olarak ağır bir metal kamayla dövülen gedik kargıları, genellikle hobgoblin piyadeleri tarafından bir kule kalkanı ile birlikte kullanılır. Gedik kargıları düşman kalkanlarına hasar vermede özellikle etkilidir ve geride büyük, üçgen delikler bırakır.

omen://item/brimstone-fumes?source=paizo-pathfinder-player-core-2:
  name: Kükürt Dumanı
  description: >
    Cehennemin demir ocaklarından çıkan dumanlar hem sağlığı hem de gücü tüketir.
    Etkinleştir A (manipulate)
    Kurtarış fortitude|dc:36|showDC:all
    Başlangıç 1 tur
    Maksimum Süre 6 tur
    Aşama 1 7d8[poison] hasar ve Güçten Düşmüş 1 (1 tur)
    Aşama 2 8d8[poison] hasar ve Güçten Düşmüş 2 (1 tur)
    Aşama 3 10d8[poison] hasar ve Güçten Düşmüş 3 (1 tur)

omen://item/caltrop-snare?source=paizo-pathfinder-player-core-2:
  name: Tuzak Dikeni Kapanı
  description: >
    Bu kapan, bir tuzak teline bağlanmış gizli bir Tuzak Dikeni kutusundan oluşur. Kapan tetiklendiğinde tuzak dikenlerini kapanın karesine veya kapana bitişik bir kareye fırlatır. Kapanı kurarken hangi kare olacağını seçersiniz. Tuzak dikenleri bir yaratıkla aynı kareye saçılırsa o yaratık Akrobasi testini hemen denemelidir.


omen://item/candle-of-revealing?source=paizo-pathfinder-player-core-2:
  name: Açığa Çıkarma Mumu
  description: >
    Etkinleştir 1 (manipulate) Yakıldığında bu siyah mumun tekinsiz mavi alevi Görünmez yaratıkların varlığını açığa çıkarır. Yanan mumun 10 fitlik yarıçapı içinde yaratıklar görünmez durumundan faydalanamaz. Bedenleri tamamen görünür değil, ana hatlarıyla belirgindir; bu yüzden Gizlenmiş sayılırlar. Mum bir kez yakıldığında 1 dakika boyunca yanar, ardından etki sona erer. Söndürülürse tekrar yakılamaz.


omen://item/capturing-spetum?source=paizo-pathfinder-player-core-2:
  name: Yakalama Spetumu
  description: Hobgoblinler bu sırıklı silahları hem saldırgan askeri birlikler için standart teçhizat olarak hem de firarileri avlamak için bireysel bazda kullanırlar.

omen://item/cave-worm-venom?source=paizo-pathfinder-player-core-2:
  name: Mağara Solucanı Zehri
  description: >
    Devasa mağara solucanlarından elde edilen zehir, kurbanı güçten düşürür.
    Etkinleştir 2 (manipulate)
    Kurtarış fortitude|dc:32|showDC:all
    Maksimum Süre 6 tur
    Aşama 1 5d6[poison] hasar ve Güçten Düşmüş 2 (1 tur)
    Aşama 2 6d6[poison] hasar ve Güçten Düşmüş 2 (1 tur)
    Aşama 3 8d6[poison] hasar ve Güçten Düşmüş 2 (1 tur)

omen://item/cerulean-scourge?source=paizo-pathfinder-player-core-2:
  name: Gök Mavisi Bela
  description: >
    Bu zehir, acı verici şekilde patlamadan önce kurbanın kan damarlarının parlak mavi bir ışıkla parlamasına neden olmasıyla ünlüdür.
    Etkinleştir 2 (manipulate)
    Kurtarış fortitude|dc:37|showDC:all
    Maksimum Süre 6 tur
    Aşama 1 10d6[poison] hasar (1 tur)
    Aşama 2 12d6[poison] hasar (1 tur)
    Aşama 3 14d6[poison] hasar (1 tur)

omen://item/chalice-of-justice?source=paizo-pathfinder-player-core-2:
  name: Adalet Kadehi
  description: >
    Bu parıldayan altın kılıç, yalnızca mübarek bir inancın en layık kahramanlarına verilen +2 büyük vuruşlu mübarek soğuk demir uzun kılıçtır. Namluyu hem soğuk demir hem de gümüş yapan mübarek, gizli bir alaşımdan yapılmıştır. Şerli iseniz bir adalet kadehi tutarken İçi Çekilmiş 2 olursunuz. Silahı tuttuğunuz sürece bu durumdan kurtulamazsınız.
    Etkinleştir—Adalet Yudumu 1 (manipulate)
    Etki: Silahın kabza topuzu minyatür bir kadeh şekline dönüşür. Kadehten derin bir yudum alır ve kadehin seviyesine eşit CP geri kazanırsınız. Mübarek iseniz iki kat CP geri kazanırsınız ve 1 dakika boyunca adalet kadehi ile şerli bir yaratığa her kritik vuruş yaptığınızda yaratık 2d6[persistent,spirit] hasar alır ve 1 tur boyunca Yavaşlatılmış 1 olur. Süregelen ruh hasarı mübarek özelliğine sahiptir.

omen://item/claw-blade?source=paizo-pathfinder-player-core-2:
  name: Pençe Bıçağı
  description: Bu elde tutulan silahın üç paralel bıçağı parmakların arasından uzanarak onları yaratan kedi halkının doğal pençelerini andırır ve uygun doğal pençeleri olmayan kedi halkının akrabalarının dövüş geleneklerini paylaşması için bir yol sağlar.

omen://item/cloth-of-nullification?source=paizo-pathfinder-player-core-2:
  name: Hükümsüz Kılma Kumaşı
  description: >
    Bu küçük işlemeli kumaş parçası tüm büyülere düşmandır.
    Etkinleştir—Büyüyü Hükümsüz Kıl 2 (manipulate)
    Etki: Büyülü bir eşyayı kumaşla örter veya kumaşı büyülü bir etkinin yakınında sallar ve etkiyi ya da eşyayı etkisiz kılmayı denersiniz. Kumaşın etkisiz kılma testi niteleyicisi +32 ve etkisiz kılma derecesi 10'dur. Sonuç ne olursa olsun, hükümsüz kılma kumaşı [[/br 2d6 #hours]]{2d6 hours} boyunca tekrar etkinleştirilemez. Başarı durumunda, etki veya eşya aynı süre boyunca devre dışı kalır ve varsa süresi bu süre boyunca işlemeye devam eder. Başarılı bir etkisiz kılma testiyle, bunun yerine etkiden veya eşyadan gelen büyüyü tamamen hükümsüz kılma kumaşının içine emmeyi seçebilirsiniz. Bunu yaparsanız her ikisi de tamamen büyü dışı hâle gelir ve büyüleri yeniden yaratma büyüsüyle dahi geri kazanılamaz.
    Hükümsüz kılma kumaşı çoğu eseri ve benzer güçteki eşyaları etkisiz kılmada otomatik olarak başarısız olur

omen://item/cognitive-mutagen-greater?source=paizo-pathfinder-player-core-2:
  name: Bilişsel Mutajen (Büyük)
  description: >
    Etkinleştir A (manipulate)
    Zihniniz berraklaşır, ancak fiziksel meseleler geçici görünür.
    Fayda: Arkana, Zanaat, Bilgi, Okültizm ve Sosyoloji testlerine ve Bilgi Hatırlamak için yapılan tüm testlere +3 eşya bonusu kazanırsınız. Bilgi Hatırla testlerindeki kritik başarısızlıklarınız bunun yerine başarısızlık sayılır. Üretim sırasında seçilen, Zekâ temelli bir [Arcana, Crafting, Lore, Occultism, Society] becerisinde eğitimli hâle gelirsiniz.
    Dezavantaj: Silah ve silahsız saldırı zarlarına, Atletizm testlerine ve Akrobasi testlerine -2 ceza alırsınız. Yüklü hâle gelmeden önce normalden 2 daha az Bulk taşıyabilirsiniz ve taşıyabileceğiniz maksimum Bulk 4 azaltılır.
    Süre 1 saat.

omen://item/cognitive-mutagen-lesser?source=paizo-pathfinder-player-core-2:
  name: Bilişsel Mutajen (Küçük)
  description: >
    Etkinleştir A (manipulate) Zihniniz berraklaşır, ancak fiziksel meseleler geçici görünür. Fayda: Arkana, Zanaat, Bilgi, Okültizm ve Sosyoloji testlerine ve Bilgi Hatırlamak için yapılan tüm testlere +1 eşya bonusu kazanırsınız. Bilgi Hatırla testlerindeki kritik başarısızlıklarınız bunun yerine başarısızlık sayılır. Dezavantaj: Silah ve silahsız saldırı zarlarına, Atletizm testlerine ve Akrobasi testlerine -2 ceza alırsınız. Yüklü hâle gelmeden önce normalden 2 daha az Bulk taşıyabilirsiniz ve taşıyabileceğiniz maksimum Bulk 4 azaltılır. Süre: 1 dakika.


omen://item/cognitive-mutagen-major?source=paizo-pathfinder-player-core-2:
  name: Bilişsel Mutajen (Üstün)
  description: >
    Etkinleştir A (manipulate) Zihniniz berraklaşır, ancak fiziksel meseleler geçici görünür. Fayda: Arkana, Zanaat, Bilgi, Okültizm ve Sosyoloji testlerine ve Bilgi Hatırlamak için yapılan tüm testlere +4 eşya bonusu kazanırsınız. Bilgi Hatırla testlerindeki kritik başarısızlıklarınız bunun yerine başarısızlık sayılır. Yaratım anında seçilen bir beceride eğitimli hâle gelirsiniz. Dezavantaj: Silah ve silahsız saldırı zarlarına, Atletizm testlerine ve Akrobasi testlerine -2 ceza alırsınız. Yüklü hâle gelmeden önce normalden 2 daha az Bulk taşıyabilirsiniz ve taşıyabileceğiniz maksimum Bulk 4 azaltılır. Süre: 1 saat.


