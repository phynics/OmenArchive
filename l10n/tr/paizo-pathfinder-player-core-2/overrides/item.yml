omen://item/antler-arrow?source=paizo-pathfinder-player-core-2:
  name: Geyik Boynuzu Oku
  description: >
    Etkinleştir A (manipulate) Bu okların yaratılması, düşmanlarını barışçıl yollarla zapt etmeye çalışan boynuzlu bir arkon gözcüsüyle karşılaşmadan esinlenmiştir. Etkinleştirilmiş bir geyik boynuzu oku bir hedefe çarptığında, onu yere sabitlemek için kemik boynuzlar uzar. Hedef bir kurtarışta başarılı olmalı ya da bir yayın kritik uzmanlaşma etkilerini alarak yüzeye yapışıp kalmalıdır. Geyik boynuzu okuyla yapılan isabet kritik bir isabetse ve yay kritik uzmanlaşma etkisine erişiminiz varsa, Atletizm testinin ZD'si 15'e yükselir.


omen://item/arsenic?source=paizo-pathfinder-player-core-2:
  name: Arsenik
  description: >
    Bu toksin, arsenik ve diğer maddelerin bir bileşiğidir. Etkilenmiş durumdayken midesi bulanmış durumunuzu azaltamazsınız.
    Etkinleştir A (manipulate)
    Kurtarış fortitude|dc:18|showDC:all
