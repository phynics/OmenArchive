omen://item/scything-blade-snare?source=paizo-pathfinder-player-core-2:
  name: Tırpan Bıçak Kapanı
  description: "Bu kapan, kapanın karesine giren bir yaratığı biçmek üzere bir dizi güçlü tırpan bıçağı fırlatarak 10d8[slashing] hasar verir (reflex|showDC:all|dc:32|basic kurtarışı)."

omen://item/serene-mutagen-greater?source=paizo-pathfinder-player-core-2:
  name: Dingin Mutajen (Büyük)
  description: >
    Etkinleştir A (manipulate) İç huzur kazanırsınız ancak şiddeti itici bulursunuz. Fayda İrade kurtarışlarına ve Dikkat, Tıp, Doğa, Din ve Hayatta Kalma testlerine +3 eşya bonusu kazanırsınız. Zihinsel etkilere karşı İrade kurtarışları denediğinizde bu bonus +4'e yükselir. Zihinsel bir etkiye karşı İrade kurtarışında başarı attığınızda, bunun yerine kritik başarı elde edersiniz. Dezavantaj Saldırı zarlarına ve saldırı büyülerinin kurtarış ZD'lerine -1 ceza, ayrıca tüm silah, silahsız saldırı ve büyü hasarlarına hasar zarı başına -1 ceza alırsınız. Süre 1 saat.


omen://item/serene-mutagen-lesser?source=paizo-pathfinder-player-core-2:
