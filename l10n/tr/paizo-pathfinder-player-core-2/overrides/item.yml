omen://item/shielding-salve?source=paizo-pathfinder-player-core-2:
  name: Koruyucu Merhem
  description: >
    Etkinleştir 1 Etkileş Bu ışıltılı macun, Kalkan büyüsünün birçok özelliğine sahiptir. Bir yaratığa veya nesneye sürdüğünüzde, hedef 1 tur boyunca SD'sine +1 durumsal bonus kazanır. O tur boyunca fiziksel bir saldırı veya bir kuvvet yaylımı hedefe ilk kez vurduğunda, yağ o saldırıdan veya büyüden gelen 5 hasarı önler ve ardından yağın etkisi sona erer.


omen://item/signaling-snare?source=paizo-pathfinder-player-core-2:
  name: Sinyal Kapanı
  description: "Avlanmada veya iz sürmede kullanılan incelikli bir tuzak olan sinyal kapanı sıklıkla özenle hazırlanmış toprak, yığılmış kum veya taşlar, özel bitki örtüsü düzenlemeleri vb. unsurlardan oluşur. Bir yaratık sinyal kapanının bir karesine girdiğinde yaratığa hiçbir şey olmaz; bunun yerine arazide küçük, göze çarpmayan bir bozulmaya neden olur; bu da kapanın yaratıcısının veya ne arayacağını bilen başka bir yaratığın kareye uygun boyutta bir yaratığın girip girmediğini belirlemesine olanak tanır."

omen://item/silvertongue-mutagen-greater?source=paizo-pathfinder-player-core-2:
  name: Gümüşdil Mutajeni (Büyük)
  description: >
    Etkinleştir A (manipulate) Hatlarınız çarpıcı hâle gelir ve sesiniz ahenkli ve buyurgan olur, ancak duygular muhakemenizi gölgeler. Fayda Aldatma, Diplomasi, Gözdağı ve Gösteri testlerine +3 eşya bonusu kazanırsınız. Bu becerilerden herhangi birindeki kritik başarısızlıklarınız bunun yerine başarısızlık olur. Dezavantaj Gizem, Zanaat, İlim, Okültizm ve Sosyoloji testlerine -2 eşya cezası alırsınız. Eğitimli olduğunuz bir beceri seçin; süre boyunca o beceride eğitimsiz hâle gelirsiniz. Bilgi Hatırlama konusundaki tüm başarısızlıklarınız kritik başarısızlık olur. Süre 1 saat.


