    Bu şişe, süblimleşmiş kristal parçacıklarıyla benekli, basınçlı kırmızımsı kahverengi bir gaz içerir. Saldırı zarlarına +3 eşya bonusu kazanırsınız. Bomba patladığında, karışım aniden yüksek hızlarda uçuşan katı kristallere dönüşürken 4d4[piercing] hasar ve 6 delici sıçrama hasarı verir.
