omen://item/tangle-root-toxin?source=paizo-pathfinder-player-core-2:
  name: Sarmaşık Kökü Toksini
  description: >
    Sarmaşık kökü toksini, casusluk ve iz sürmenin yanı sıra atletizm yarışmalarında rakipleri engellemek için de kullanılır. Etkinleştir 1 (manipulate) Kurtarış Başlangıç 1 dakika Maksimum Süre 6 dakika Aşama 1 Sakar 1 ve tüm Hızlara –10 fit statü cezası (1 dakika) Aşama 2 Sakar 2 ve tüm Hızlara –20 fit statü cezası (1 dakika) Aşama 3 Sakar 3, Gafil ve tüm Hızlara –30 fit statü cezası (1 dakika)


omen://item/taper-of-sanctification?source=paizo-pathfinder-player-core-2:
  name: Kutsama Mumu
  description: >
    Etkinleştir 1 (manipulate) Bu ince altın mumun yüzeyinde belirli bir ilahın sembolü işlenmiştir ve etrafı o ilahın inancının ikonografisiyle çevrilidir. Bir kutsama mumu mübarek veya şerli olarak kutsanabilen bir ilaha adanmış olmalıdır ve ilgili özelliğe sahiptir. İlahın kutsaması her iki seçeneği de listeliyorsa üretici mum yapılırken birini seçmelidir. Bir kez yakıldığında bu mum 1 saat boyunca yanar ve söndürülemez. İstekli bir yaratık yanan mumun 10 fiti içinde ilaha dua ederek tam bir saat geçirdiğinde, o yaratığın Saldırıları bir sonraki günlük hazırlıklarını yapana kadar (muma uygun şekilde) mübarek veya şerli özelliğini kazanır. Bu süre zarfında yaratık ilahın aforozuyla bağlıdır. Aforozu ihlal ederse kutsama mumunun faydasını kaybeder. Mübarek bir yaratık şerli bir kutsama mumundan faydalanamaz ve şerli bir yaratık da mübarek olandan faydalanamaz.


omen://item/tears-of-death?source=paizo-pathfinder-player-core-2:
  name: Ölüm Gözyaşları
  description: >
    Ölüm gözyaşları, diğer beş ölümcül zehrin özütlerinden tam doğru oranlarda damıtılmış, simyasal zehirlerin en güçlüleri arasındadır.
    Etkinleştir A (manipulate)
    Kurtarış fortitude|dc:44|showDC:all
    Başlangıç 1 dakika
    Maksimum Süre 10 dakika
    Aşama 1 20d6[poison] hasar ve Felçli (1 tur)
    Aşama 2 22d6[poison] hasar ve Felçli (1 dakika)
    Aşama 3 24d6[poison] hasar ve Felçli (1 dakika)

omen://item/tengu-feather-fan?source=paizo-pathfinder-player-core-2:
  name: Tengu Tüy Yelpazesi
  description: >
    Etkinleştir—Yelpaze Salla (manipulate) Etki: Tengu tüy yelpazenizde bulunan büyülerden birini seçerek yaparsınız. Bunun yerine bir kökenden veya atasal hünerden kazandığınız bir kantripi yapabilirsiniz; bu yelpazenin günlük etkinleştirmelerinden birini harcamaz. Bu etkinleştirme büyünün normal eylem sayısını alır. Büyünün ZD'si sınıf ZD'niz veya büyü ZD'nizdir (hangisi daha yüksekse).


omen://item/tengu-gale-blade?source=paizo-pathfinder-player-core-2:
  name: Tengu Fırtına Kılıcı
  description: Tengu demircileri tarafından tasarlanan bu yelpaze şeklindeki kılıç, kabzasında birleşen beş geniş namluya sahiptir. Tengu denizcileri bunları derme çatma rüzgâr gülü olarak kullanırlar, çünkü kılıç havada gevşek bir şekilde tutulduğunda rüzgârın yönünde döner.

omen://item/terrifying-ammunition?source=paizo-pathfinder-player-core-2:
  name: Korkutucu Mühimmat
  description: >
    Etkinleştir 1 (manipulate) Bu siyah ve gri mühimmatın üzerine okült semboller ve sırıtan minik kafatasları kazınmıştır. Etkinleştirilmiş korkutucu mühimmat bir yaratığa hasar verdiğinde, yaratığın zihnini kendi başarısızlıklarının, trajedilerinin ve nihayetinde kendi ölümünün görüntüleriyle doldurur. Yaratık bir kurtarış denemelidir.


omen://item/thunder-sling?source=paizo-pathfinder-player-core-2:
  name: Gök Gürültüsü Sapanı
  description: "Tengular bu özel sapanları, dartları elle fırlatıldığından daha uzağa ve daha büyük bir güçle fırlatmak için kullanır. Gök gürültüsü sapanı mühimmat olarak dart kullanır. Mühimmat olarak üfleme borusu iğnelerini de fırlatabilir, ancak bu şekilde kullanıldığında 1d6 yerine (1d4)[piercing] hasar verir."

omen://item/timeless-salts?source=paizo-pathfinder-player-core-2:
  name: Zamansız Tuzlar
  description: Bu tuzları 1 hafta boyunca muhafaza etmek için hacmi 10 fit küpe kadar ve Yükü en fazla 40 olan tek bir nesnenin üzerine serpersiniz. Nesne çürümez ve nesnenin taze olmasını gerektiren etkiler, bu süre boyunca geçen zamanı geçmiş saymaz. Bir cesedin üzerine serpildiğinde bu, bir yaratığın büyüyle diriltilebileceği süreyi ve ayrıca bir cesedin Konuşan Ceset ile yeniden hedeflenebilmesi için gereken bekleme süresini uzatır. Tuzlar sıradan haşerelerin hedefi tüketmesini engeller (bir ceset için kurtçuklar veya bir giysi parçası için güveler gibi). Herhangi bir yaratık sahipsiz bir nesnedeki tuzları dağıtmak ve bu etkiyi sona erdirmek için bir Etkileş eylemi kullanabilir.

omen://item/tricky-liniment?source=paizo-pathfinder-player-core-2:
  name: Hileli Merhem
  description: >
    Etkinleştir A (manipulate) Bu yeşilimsi, kalıcı yağ, zırhı 8 saat boyunca son derece kaygan hâle getirmek için uygulanabilir ve giyene Kurtulmak veya Sıkışarak Geçmek için yapılan Akrobasi testlerine +2 eşya bonusu sağlar.


omen://item/tricky-pick?source=paizo-pathfinder-player-core-2:
  name: Hileli Kazma
  description: Bu dahiyane kobold kazması, kullanan kişinin çeşitli hasar verici bıçaklar ve ezici yüzeylerle düşmanları kandırmak ve sersemletmek için etkinleştirebileceği birkaç gizli tuzak saklar.

omen://item/trip-snare?source=paizo-pathfinder-player-core-2:
  name: Çelme Kapanı
  description: >
    Bir yaratığa çelme takmak için kurnazca bir tel kurarsınız. Bu kapanın karesine giren Orta veya daha küçük boyuttaki bir yaratık bir kurtarış denemelidir. Daha büyük bir yaratığa çelme takmak amacıyla bir çelme kapanı yaratmak istiyorsanız, o daha büyük yaratığın alanının kenarına eşit uzunlukta bitişik kapanlardan oluşan bir grup yaratmalısınız ve yaratık tam kapan setinin içine girecek şekilde hareket etmelidir. Örneğin 15 fitlik bir hat üzerindeki üç çelme kapanı, bir koridordan aşağı kapan hattına doğru gelen Kocaman bir yaratığa çelme takabilir.


omen://item/twisting-twine-greater?source=paizo-pathfinder-player-core-2:
  name: Bükümlü Sicim (Büyük)
  description: >
    Bu kenevir sicim yumağı, elle çözülme çabalarına direnir. Etkinleştir—Sicimi Çöz 1 (manipulate) Etki: Sicim yumağını 20 fit içindeki bir kareye fırlatırsınız. Sicim ardından çözülüp canlanır ve Atletizm testine toplam +15 ile o karedeki bir yaratığı Silahsızlandırmayı veya ona Çelme Takmayı (seçiminize bağlı olarak) dener. Sıranızın sonunda sicim kendiliğinden tekrar bir yumak hâlinde sarılır ve elinize döner; boş bir eliniz yoksa bunun yerine sizin alanınıza döner.


omen://item/twisting-twine-lesser?source=paizo-pathfinder-player-core-2:
  name: Bükümlü Sicim (Küçük)
  description: >
    Bu kenevir sicim yumağı, elle çözülme çabalarına direnir. Etkinleştir—Sicimi Çöz 1 (manipulate) Etki: Sicim yumağını 20 fit içindeki bir kareye fırlatırsınız. Sicim ardından çözülüp canlanır ve Atletizm testine toplam +9 ile o karedeki bir yaratığı Silahsızlandırmayı veya ona Çelme Takmayı (seçiminize bağlı olarak) dener. Sıranızın sonunda sicim kendiliğinden tekrar bir yumak hâlinde sarılır ve elinize döner; boş bir eliniz yoksa bunun yerine sizin alanınıza döner.


omen://item/twisting-twine-moderate?source=paizo-pathfinder-player-core-2:
  name: Bükümlü Sicim (Orta)
  description: >
    Bu kenevir sicim yumağı, elle çözülme çabalarına direnir. Etkinleştir—Sicimi Çöz 1 (manipulate) Etki: Sicim yumağını 20 fit içindeki bir kareye fırlatırsınız. Sicim ardından çözülüp canlanır ve Atletizm testine toplam +12 ile o karedeki bir yaratığı Silahsızlandırmayı veya ona Çelme Takmayı (seçiminize bağlı olarak) dener. Sıranızın sonunda sicim kendiliğinden tekrar bir yumak hâlinde sarılır ve elinize döner; boş bir eliniz yoksa bunun yerine sizin alanınıza döner.


omen://item/unholy-plate?source=paizo-pathfinder-player-core-2:
  name: Şerli Levha Zırh
  description: >
    Kara demirden dövülmüş bu kaba +2 kurtarış tam levha zırh, yüzünüz canavarın çığlık atan ağzından dışarı bakacak şekilde boynuzlu bir iblis gibi görünmeniz için tasarlanmıştır. Zırhı giyerken miğferin boynuzlarıyla saldırabilirsiniz. Bunlar, +2 silah kudreti rününün etkilerine sahip bir askeri yakın dövüş silahıdır. 2d8 piercing hasar verirler ve deadly d12 ile unholy özelliklerine sahiptirler. Boynuzlarla kritik bir isabette, hedef bir kurtarışta başarılı olmalı ya da İçi Çekilmiş 1 (kritik başarısızlıkta İçi Çekilmiş 2) hâline gelmelidir. Boynuzlara herhangi bir rün işlenemez. Holy özelliğine sahipseniz, şerli levha zırh giyerken İçi Çekilmiş 2 olursunuz ve zırhı giydiğiniz sürece bu durumdan kurtulamazsınız. Etkinleştir—İblis Kayması 2 (concentrate) Etki: Yer Değiştir büyüsü yaparsınız.


omen://item/urn-of-ashes?source=paizo-pathfinder-player-core-2:
  name: Kül Vazosu
  description: >
    Bu mühürlü kalay vazo, sizi korumak için çabalayan geçmişten kalan bir ruh parçasıyla birlikte hayırsever bir atanın küllerini içerir.
    Etkinleştir—Vazoyu Lanetle r (concentrate)
    Etki: Vazodaki küller araya girerek sizin yerinize lanetlenmiş durumunu üstlenir ve siz lanetlenmiş durumunu kazanmaz ya da değerini artırmazsınız. Tam bir gece dinlendiğiniz her gece, kendi lanetlenmiş durumunuzu veya vazonunkini azaltabilirsiniz, ancak her ikisini birden azaltamazsınız.
    Etkinleştir—Ruhun Gazabı 1 (attack, concentrate, manipulate)
    Etki: Vazo, 30 fit içindeki bir düşmana bir boşluk enerjisi oku fırlatır. Hedefin SD'sine karşı +15 veya kendi büyü saldırı niteleyicinizden (hangisi daha yüksekse) bir niteleyici kullanarak bir büyü saldırı zarı deneyin. Başarı durumunda ok 4d4[void] hasar verir (kritik başarıda iki katına çıkar).

omen://item/versatile-vial?source=paizo-pathfinder-player-core-2:
  name: Çok Yönlü Şişe
  description: Bu minik cam şişe, zor anlarda saldırı amaçlı kullanılabilecek uçucu kimyasallar içerir. Bomba asit hasarı ve asit sıçrama hasarı verir.

omen://item/viper-arrow?source=paizo-pathfinder-player-core-2:
  name: Engerek Oku
  description: >
    Etkinleştir A (manipulate) Bu okun gövdesi ince yeşil pullarla kaplıdır ve demir ucu neredeyse dişlere benzeyen bir çift sivri uca ayrılır. Etkinleştirilmiş bir engerek oku bir hedefe isabet ettikten sonra ok bir Engereğe dönüşür. Hedef, ısırılmış gibi engereğin zehrinden etkilenir. Engerek ardından hedefin bitişiğindeki boş bir alana iner. Engerek summoned özelliğine sahiptir ve Büyüyü Sürdür eylemini kullanmamış olsanız bile sıranızın sonunda hareket eder. GM'nin kontrolü altındadır, ancak genellikle okun vurduğu yaratığa saldırır. Engerek 1 dakika sonra veya katledildiğinde kaybolur.


omen://item/wand-of-crackling-lightning-3rd-rank-spell?source=paizo-pathfinder-player-core-2:
  name: Çatırtılı Yıldırım Değneği (3. Derece Büyü)
  description: >
    Bu değnek, iki bakır plaka ve seramik bir merkezden yapılmıştır. Etkinleştir Büyü Yap Etki: 3. derecede Şimşek Oku yaparsınız, ancak büyünün alanı iki kat daha geniştir (bitişik ve paralel iki adet 120 fitlik hat) ve kurtarışta başarısız olan yaratıklar 1 tur boyunca Gafil kalır.


