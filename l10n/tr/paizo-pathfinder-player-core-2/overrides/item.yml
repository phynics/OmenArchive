  description: >
    Bu cilalı siyah değneğin ucunda yeşil bir mücevher bulunur ve içine bakan herkes sırıtan bir kafatasının yansımasını görür.
    Etkinleştir Büyü Yap
    Etki: 7. derecede İnfaz Et yaparsınız. Büyü yaşayan bir hedefi katlederse ceset, bir yayılma alanında kasvetli bir enerji salarak 14[void] hasar verir.

