omen://item/wand-of-hopeless-night-2nd-rank-spell?source=paizo-pathfinder-player-core-2:
  name: Umutsuz Gece Değneği (2. Derece Büyü)
  description: >
    Bu değnek, işlenmiş siyah demirden bir parçadır. Etkinleştir Büyü Yap Etki: 2. derecede Karanlık yaparsınız. Turunu büyünün alanı içinde bitiren her yaratık bir kurtarışta başarılı olmalı ya da Korkmuş 1 (kritik başarısızlıkta Korkmuş 2) hâline gelmelidir.


omen://item/wand-of-hopeless-night-4th-rank-spell?source=paizo-pathfinder-player-core-2:
