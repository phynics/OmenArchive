omen://item/wand-of-the-spider-2nd-rank-spell?source=paizo-pathfinder-player-core-2:
  name: Örümcek Değneği (2. Derece Büyü)
  description: >
    Bu değneğin gövdesi bir çift bükülmüş dev örümcek bacağıdır.
    Etkinleştir Büyü Yap
    Etki: 2. derecede Ağ yaparsınız, ancak ağın iplikleri zehirlidir. Ağda gezinmek için yaptığı Atletizm testinde veya Refleks kurtarışında başarısız olan herhangi bir yaratık 1d6[poison] hasar alır.

omen://item/wand-of-the-spider-4th-rank-spell?source=paizo-pathfinder-player-core-2:
  name: Örümcek Değneği (4. Derece Büyü)
  description: >
    Bu değneğin boyu, birbirine dolanmış bir çift dev örümcek bacağından oluşur. Etkinleştir Büyü Yap Etki: 4. derecede Ağ yaparsınız, ancak ağın telleri zehirlidir. Ağda ilerlemek için yapılan Atletizm testinde veya Refleks kurtarışında başarısız olan her yaratık 2d6 poison hasar artı 1d6 persistent poison hasar alır.


omen://item/warleaders-bulwark-greater?source=paizo-pathfinder-player-core-2:
  name: Savaş Lideri Siperi (Gelişmiş)
  description: >
    Bu +2 kurtarış göğüslük zırh, sadık askerlerin tasvirleriyle süslenmiş takviyeli altın panellerle kaplı parıldayan bronzdan yapılmıştır. Bu göğüslüğü takmak size komuta edici bir aura kazandırır. Diplomasi testlerine +3 eşya bonusu kazanırsınız, ancak Gizlenmek ve Sessizce İlerlemek için yapılan Gizlilik testleri ile Kılığına Bürünmek için yapılan Aldatma testlerinde -3 eşya cezası alırsınız. Etkinleştir—Cesaret Emret 1 (concentrate) Etki: 100 fit içindeki müttefiklere korku etkilerine karşı kurtarışlarnda 1 dakika boyunca +2 statü bonusu verirsiniz. Bu yeteneği etkinleştirdiğinizde, etkilenen ve Korkmuş olan her müttefik korkmuş değerini 1 azaltır.


