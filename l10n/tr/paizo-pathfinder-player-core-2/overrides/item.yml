omen://item/potion-of-disguise-greater?source=paizo-pathfinder-player-core-2:
  name: Kılık Değiştirme İksiri (Büyük)
  description: >
    Etkinleştir 1 (manipulate)
    Bu iksiri içtiğinizde [[/br 2d12 #hours]]{2d12 hours} boyunca belirli bir yaratık türünün görünümünü alırsınız. Yaratığın türü iksir üretildiğinde belirlenir. Örneğin bir elf kılık değiştirme iksiriniz veya kurbağa kılık değiştirme iksiriniz olabilir. İksiri içmek etkinin ne kadar süreceği bilgisini vermez; GM süreyi gizlice atar.
    Kılık değiştirme özelliklerinizi veya istatistiklerinizi değiştirmez ve taklit ettiğiniz yaratığın özel yeteneklerinden hiçbirini size kazandırmaz. Hangi eşyaları tutabileceğinizi veya giyebileceğinizi etkileyebilir (örneğin yeni formunuzda karşıt başparmaklar bulunmayabilir). İksir sizi en az Minik boyuta kadar küçültür ya da yaratık sizden daha büyükse boyutunuzu en fazla Büyük boyuta kadar büyütür. Bu durum Minik bir yaratık olarak erişiminizi 0'a düşürmek dışında istatistiklerinizin hiçbirini değiştirmez. Yaratık sadece "kedi" yerine "leopar" veya "aslan" ya da sadece "dev" yerine "ateş devi" veya "ogre" gibi belirli bir türden olmalıdır, ancak iksir belirli bir bireysel yaratığı taklit etmenize yol açamaz.
    Bu iksirin etkileri Aldatma becerisinin Kimliğe Bürünme aktivitesiyle aynı kuralları kullanır. Etraftakiler aktif olarak Arama yapmadıkları sürece her zaman seçilen türden bir yaratık olduğunuzu varsayar. Bu tür Dikkat testlerine karşı Aldatma ZD'nize +4 statü bonusu kazanırsınız ve eğitimsiz olsanız bile seviyenizi eklersiniz.
    Büyük bir kılık değiştirme iksiri içerken dönüşmek istediğiniz belirli formu zihninizde canlandırırsanız, iksir sizi o forma dönüştürür. Yine de Aldatma zarı atmanız gerekse de belirli bir bireyin Kimliğine Bürünmeyi deneyebilirsiniz.

