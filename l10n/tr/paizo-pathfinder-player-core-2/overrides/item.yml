    Maksimum Süre 5 dakika
    Aşama 1 1d4[poison] hasar ve Midesi Bulanmış 1 (1 dakika)
    Aşama 2 1d6[poison] hasar ve Midesi Bulanmış 2 (1 dakika)
    Aşama 3 1d8[poison] hasar ve Midesi Bulanmış 3 (1 dakika)

omen://item/balisse-feather-greater?source=paizo-pathfinder-player-core-2:
  name: Balisse Tüyü (Büyük)
  description: >
    Kullanım: bir silaha iliştirilmiş Etkinleştir F (concentrate) Bu uzun, ateş kırmızısı tüy süslediği silahtan için için tüter. Tüyü etkinleştirdiğinizde, hasar verdiğiniz yaratık mübarek ışıkla yanar. Yaratık bir kurtarışta başarılı olmalı ya da SD'sine ve kurtarışlara –2 statü cezası almalı ve dirençlerini 10 azaltmalıdır. Bu etkiler bir sonraki sıranızın sonuna kadar sürer. Bu eşyanın holy özelliğine sahip bir yaratık üzerinde hiçbir etkisi yoktur.


