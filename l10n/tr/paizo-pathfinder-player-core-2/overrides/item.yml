omen://item/sanguine-pendant-greater?source=paizo-pathfinder-player-core-2:
  name: Kan Kırmızı Kolye Ucu (Büyük)
  description: >
    Bu berrak kristal kolye ucu, siz büyü yaptıkça genişleyen ve büzülen Sorcerer'ın kanından bir damla içerir. Bir kan kırmızı kolye ucu Sorcerer sınıfına ait belirli bir soyaçekimiyle ilişkilidir ve yalnızca bu soyaçekimine sahip Sorcerer sınıfı üyeleri bu eşyaya yatırım yapabilir. Bu eşya, o soyaçekiminin geleneğiyle eşleşen özelliği kazanır. Kolye ucu, her iki soyaçekimi becerinize de +3 eşya bonusu verir. Etkinleştir—Kanın Çağrısı f (concentrate) Etki: Yalnızca bir soyaçekim büyüsü yapmak için harcayabileceğiniz 1 Odak Puanı kazanırsınız. Bu Odak Puanını bu turun sonuna kadar harcamazsanız kaybolur.


