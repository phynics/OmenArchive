omen://item/stalker-bane-snare?source=paizo-pathfinder-player-core-2:
  name: Avcıkıran Kapanı
  description: Bu kapan, karesine basan bir yaratığa yapışabilen yapışkan bir toz patlamasıyla infilak eder. Bir avcıkıran kapanının karesine giren bir yaratık bir kurtarış denemelidir.

omen://item/storm-arrow?source=paizo-pathfinder-player-core-2:
  name: Fırtına Oku
  description: >
    Etkinleştir A (manipulate)
    Bu okun ucu parıldayan bakırdan yapılmıştır.
    Etkinleştirilmiş bir fırtına oku bir hedefe çarptığında, hedef şiddetli rüzgârlarla savrulur ve 3d12[electricity] hasar veren bir yıldırım okuyla vurulur; hedef bir reflex|dc:25 kurtarış denemelidir. Bu ok shock nitelik rününe sahip bir silahtan atılırsa kurtarış ZD'si 27'ye yükselir, ancak saldırı shock nitelik rününün kendisinden faydalanamaz.

omen://item/striking-snare?source=paizo-pathfinder-player-core-2:
  name: Hasar Zarı Kapan
  description: "Kapanın karesine giren bir yaratığa vurmak için taşlardan veya tahta kazıklardan oluşan bir gruba bir tetikleme ipi veya başka bir tetikleyici bağlarsınız. Yaratık bir reflex|showDC:all|dc:26|basic kurtarış denemelidir. Taşları seçerseniz kapan 9d8[bludgeoning] hasar verir; kazıkları seçerseniz 9d8[piercing] hasar verir."

omen://item/stunning-snare?source=paizo-pathfinder-player-core-2:
  name: Sersemletici Kapan
  description: "Bir yaratığı hızlı bir darbeyle sersemleterek kendini savunma yeteneğini neredeyse tamamen ortadan kaldırmak üzere bir kapan kurarsınız. Kapan, karesine giren ilk yaratığa 10d6[bludgeoning] hasar verir; o yaratık bir reflex|showDC:all|dc:32 kurtarışı denemelidir."

omen://item/surging-serum-greater?source=paizo-pathfinder-player-core-2:
  name: Kabaran Serum (Büyük)
  description: >
    Etkinleştir 1 (manipulate) İçicinin bedeninde istemsiz sarsıntılar ve enerji dalgalanmaları hareket ederek normal kas kontrolünü yeniden kazandırır. Bu iksiri içtiğinizde, 6. derece bir bertaraf ve +19 bertaraf değiştiricisi kullanarak üzerinize Sakar veya Güçten Düşmüş durumu uygulayan her etkiyi bertaraf etmeyi dener.


omen://item/surging-serum-lesser?source=paizo-pathfinder-player-core-2:
