# tr overrides: ancestry

omen://ancestry/dwarf/dwarf?source=paizo-pathfinder-player-core:
  name: Cüce
  description: >
    Cüceler; som kayalardan oyulmuş hisarlar ve şehirler içinde konuşlanmış, metanetli ve sert bir halk olarak hak edilmiş bir üne sahiptir. Bazıları onları taş ve metalin asık suratlı, mizahtan yoksun zanaatkârları olarak görse de, cüceler ve aralarında vakit geçirmiş olanlar, onların işlerine duydukları dizginsiz tutkuyu anlar; nicelikten çok niteliğe önem verirler. Bir yabancıya güvensiz ve klanına düşkün görünebilirler; ancak dostları ve aileleri için sıcak ve şefkatlidirler, salonları kahkaha ve örse vuran çekiç sesleriyle yankılanır.
    Cüce

omen://ancestry/dwarf/heritages/ancient-blooded-dwarf?source=paizo-pathfinder-player-core:
  name: Kadim Kanlı Cüce
  description: Eski cüce kahramanları düşmanlarının büyüsünü kolayca savuşturabilirdi ve bu direncin bir kısmı sizde tezahür eder. Kadim Kanı Çağır reaksiyonunu kazanırsınız.

omen://ancestry/dwarf/heritages/death-warden-dwarf?source=paizo-pathfinder-player-core:
  name: Ölüm Muhafızı Cüce
  description: Atalarınız mezar muhafızlarıydı ve onların ölümü savuşturma gücü size geçti. Boşluk özelliğine sahip veya bir hortlak yaratık tarafından oluşturulmuş bir etkiye karşı kurtarışta başarı elde ederseniz, bunun yerine kritik başarı elde edersiniz.

omen://ancestry/dwarf/heritages/forge-dwarf?source=paizo-pathfinder-player-core:
  name: Demirhane Cücesi
  description: Sıcak ortamlara karşı kayda değer bir adaptasyonunuz vardır. Bu durum seviyenizin yarısına eşit (en az 1) ateş direnci sağlar ve çevresel sıcaklık etkilerini bir derece daha az aşırıymış gibi ele alırsınız (inanılmaz sıcaklık aşırıya dönüşür, aşırı sıcaklık şiddetliye dönüşür vb.).

omen://ancestry/dwarf/heritages/rock-dwarf?source=paizo-pathfinder-player-core:
  name: Kaya Cücesi
  description: >
    Atalarınız dağların kadim taşları arasında veya yerin derinliklerinde yaşadı ve çalıştı. Bu durum, ayaklarınızı yere bastığınızda kaya gibi sağlam olmanızı sağlar. Sizi Yerinden Oynatma, İtme veya Çelme Takma girişimlerine karşı Beden veya Refleks ZD'nize +2 durumsal bonus kazanırsınız. Bu bonus ayrıca sizi zorla hareket ettirmeye veya Yüzüstü düşürmeye çalışan büyülere ya da etkilere karşı kurtarışlar için de geçerlidir.
    Ayrıca herhangi bir etki sizi 10 fit veya daha fazla hareket etmeye zorlarsa, mesafenin yalnızca yarısı kadar hareket ettirilirsiniz.

omen://ancestry/dwarf/heritages/strong-blooded-dwarf?source=paizo-pathfinder-player-core:
  name: Güçlü Kanlı Cüce
  description: "Kanınız gürbüz ve güçlü akar ve toksinleri kolayca atlatabilirsiniz. Seviyenizin yarısına eşit (en az 1) zehir direnci kazanırsınız ve zehir illetine karşı her başarılı kurtarışınız illetin evresini 2 azaltır; habis zehir için ise 1 azaltır. Devam eden bir zehre karşı her kritik başarı, illetin evresini 3 azaltır; habis zehir için ise 2 azaltır."

omen://ancestry/elf/elf?source=paizo-pathfinder-player-core:
  name: Elf
  description: >
    Kadim bir halk olarak elfler büyük değişimlere tanıklık etmiştir ve yalnızca tarihin akışını izlemekle edinilebilecek bir bakış açısına sahiptir. Kadim zamanlarda dünyayı terk ettikten sonra değişmiş bir diyara geri döndüler ve başta topraklarının bir kısmını istila eden korkunç iblisler olmak üzere ata yurtlarını geri almak için hâlâ mücadele etmektedirler. Bazılarına göre elfler; muazzam yetenek ve bilgiye sahip, zarif ve güzel, hayranlık uyandıran varlıklardır. Ancak kendi aralarında elfler, bu ideallere uygun yaşamaktan ziyade kişisel özgürlüğe çok daha fazla önem verir.
    Elf

omen://ancestry/elf/heritages/ancient-elf?source=paizo-pathfinder-player-core:
  name: Kadim Elf
  description: Uzun yaşamınızda pek çok yola ve stile adım attınız. Tipik bir kadim elf en az 100 yaşındadır, ancak GM'nin takdirine bağlı olarak daha genç de olabilirsiniz. Kendi sınıfınız dışında bir sınıf seçin. Seviye önkoşulunu karşılamasanız bile o sınıf için çoklu sınıf adanmışlık hünerini kazanırsınız. Hüneri kazanmak için yine de diğer önkoşullarını karşılamalısınız.

omen://ancestry/elf/heritages/arctic-elf?source=paizo-pathfinder-player-core:
  name: Kutup Elfi
  description: "Donmuş kuzeyin derinliklerinde yaşıyorsunuz ve soğuk ortamlara karşı inanılmaz bir dayanıklılık kazandınız; bu da seviyenizin yarısına eşit (en az 1) soğuk direnci sağlar. Çevresel soğuk etkilerini bir derece daha az aşırıymış gibi ele alırsınız (inanılmaz soğuk aşırıya dönüşür, aşırı soğuk şiddetliye dönüşür vb.)."

omen://ancestry/elf/heritages/cavern-elf?source=paizo-pathfinder-player-core:
  name: Mağara Elfi
  description: Işığın kıt olduğu yer altı tünellerinde veya mağaralarda doğdunuz ya da buralarda uzun yıllar geçirdiniz. Karanlıkta görme kazanırsınız.

omen://ancestry/elf/heritages/seer-elf?source=paizo-pathfinder-player-core:
  name: Kâhin Elf
  description: >
    Büyülü olayları tespit etme ve anlama konusunda doğuştan gelen bir yeteneğe sahipsiniz. Büyüyü Tespit Et kantripini istediğiniz zaman mistik özgü büyü olarak yapabilirsiniz. Bir kantrip, yukarı yuvarlanmış seviyenizin yarısına eşit bir büyü derecesine otomatik olarak güçlendirilir.
    Ayrıca Büyüyü Tanıma testlerine ve büyülü nitelikteki Yazıyı Çözümleme testlerine +1 durumsal bonus kazanırsınız. Bu beceri eylemleri tipik olarak Mistik İlim, Doğa, Okültizm veya Din becerisini kullanır.

omen://ancestry/elf/heritages/whisper-elf?source=paizo-pathfinder-player-core:
  name: Fısıltı Elfi
  description: "Kulaklarınız son derece hassastır; seslerin en ufak fısıltılarını bile algılayabilir. 30 fit yakınınızdaki Gizlenmiş veya Konumu Saptanmamış yaratıkları bulmak için Ara eylemini kullandığınızda +2 durumsal bonus kazanırsınız. Sizden Belirsiz veya sizden Gizlenmiş bir rakibi hedef aldığınızda, yalın testin ZD'sini Belirsiz bir hedef için 3'e, Gizlenmiş bir hedef için 9'a düşürün. Bu fayda duyamıyorsanız veya yaratık ses çıkaramayacak durumdaysa (örneğin Sessizlik büyüsünden etkilenmişse) geçerli değildir."

omen://ancestry/elf/heritages/woodland-elf?source=paizo-pathfinder-player-core:
  name: Orman Elfi
  description: >
    Ormanda, balta girmemiş vahşi doğada veya benzeri bir ortamda yaşama uyum sağladınız; ağaçlara nasıl tırmanacağınızı ve yaprak örtüsünü kendi lehinize nasıl kullanacağınızı bilirsiniz. Ağaçlara, sarmaşıklara ve diğer yeşilliklere Tırmanırken bir başarıda Hızınızın yarısıyla, kritik başarıda ise tam Hızınızla hareket edersiniz (ve Hızlı Tırmanma hünerine sahipseniz bir başarıda tam Hızınızla hareket edersiniz). Tırmanma Hareket Hızı kullanıyorsanız bu durum sizi etkilemez.
    Orman arazisi içindeyken siper kazanmak için, arkasına Siper Alabileceğiniz bir engelin yanında olmasanız bile her zaman Siper Al eylemini kullanabilirsiniz.

omen://ancestry/gnome/gnome?source=paizo-pathfinder-player-core:
  name: Gnom
  description: >
    Çok uzun zaman önce, ilk gnom ataları perilerin diyarı olan İlk Dünya'dan göç etti. İlk gnomların Golarion'a neden göç ettiği belirsiz olsa da, bu soy modern gnomlarda tuhaf akıl yürütmeler, eksantriklik, takıntılı eğilimler ve bazılarının saflık olarak gördüğü niteliklerle kendini gösterir. Bu nitelikler; ince uzun uzuvlar, parlak renkli saçlar ve onların öte dünyalı kökenlerini daha da yansıtan çocuksu ve son derece ifadeli yüz hatları gibi fiziksel özelliklerinde de kendini belli eder.
    Gnom

omen://ancestry/gnome/heritages/chameleon-gnome?source=paizo-pathfinder-player-core:
  name: Bukalemun Gnom
  description: "Saçınızın ve teninizin rengi, muhtemelen İlk Dünya etkilerinden gelen gizil büyü veya kalıcı illüzyon etkileri nedeniyle değişebilir niteliktedir. Canlılığını ve tam rengini yavaşça değiştirebilirsiniz ve renk vücudunuzun farklı yerlerinde farklılık gösterebilir; bu da desenler veya başka renkli tasarımlar oluşturmanıza olanak tanır. Küçük yerel değişimler tek bir eylem, vücudunuz genelindeki dramatik değişimler ise bir saate kadar sürer. Siz uyurken renkler rüyalarınızla uyumlu olarak kendi kendine değişir ve her sabah size alışılmadık bir renk tonu kazandırır. Renk tonunuzun çevreye kabaca benzediği bir alandayken (örneğin bir ormanda orman yeşili), çevrenize karışmanıza yardımcı olmak üzere tasarlanmış küçük yerel değişimler yapmak için tek bir eylem kullanabilirsiniz. Bu, çevrenizin rengi veya deseni değişene kadar Gizlilik testlerine +2 durumsal bonus kazandırır."

omen://ancestry/gnome/heritages/fey-touched-gnome?source=paizo-pathfinder-player-core:
  name: Peri Dokunuşlu Gnom
  description: "Damarlarınızda peri kanı akar, sizi onların büyüsüyle doldurur ve sizi gerçekten onlardan biri yapar. Gnom ve insansı özelliklerine ek olarak peri özelliğini kazanırsınız. Doğa büyüsü listesinden bir kantrip seçin. Bu büyüyü istediğiniz zaman doğa özgü büyüsü olarak yapabilirsiniz. Bir kantrip, yukarı yuvarlanmış seviyenizin yarısına eşit bir büyü derecesine güçlendirilir. Kendinizi İlk Dünya ile yeniden uyumlu hâle getirmek için meditasyon yaparak bu kantripi günde bir kez aynı listeden farklı bir büyüyle değiştirebilirsiniz; bu, odaklanma özelliğine sahip 10 dakikalık bir etkinliktir."

omen://ancestry/gnome/heritages/sensate-gnome?source=paizo-pathfinder-player-core:
  name: Duyarlı Gnom
  description: >
    Tüm renkleri daha parlak görür, tüm sesleri daha zengin duyar ve özellikle tüm kokuları inanılmaz ayrıntılarla alırsınız. Özel bir duyu kazanırsınız: 30 fit menzilli belirsiz koku alma. Bu, bir yaratığın tam konumunu belirlemek için koku alma duyunuzu kullanabileceğiniz anlamına gelir. Yaratığa göre rüzgâr altındaysanız GM genellikle menzili iki katına çıkarır, rüzgâr üstündeyseniz menzili yarıya indirir.
    Ayrıca kokunuzun menzili içindeki konumu saptanmamış bir yaratığın yerini tespit etmeye çalıştığınızda Dikkat testlerine +2 durumsal bonus kazanırsınız.

omen://ancestry/gnome/heritages/umbral-gnome?source=paizo-pathfinder-player-core:
  name: Gölge Gnomu
  description: İster karanlık veya gölgeli perilerle olan bir bağdan, ister drathnelar olarak bilinen yer altı gnomlarından, isterse başka bir kaynaktan olsun, zifiri karanlıkta görebilirsiniz. Karanlıkta görme kazanırsınız.

omen://ancestry/gnome/heritages/wellspring-gnome?source=paizo-pathfinder-player-core:
  name: Kaynak Gnomu
  description: >
    Başka bir büyü kaynağı, üzerinizde peri soyunuzun doğa büyüsünden daha büyük bir etkiye sahiptir. Bu bağ bir okült düzlemden ya da kadim bir okült ezgiden; bir ilah, göksel varlık veya ifritten; bir büyücü savaşının geride bıraktığı büyülü atıklardan ya da kadim rün büyüsünden kaynaklanıyor olabilir.
    Mistik, ilahi veya okült geleneklerinden birini seçin. Bu büyü geleneğinin büyü listesinden bir kantrip kazanırsınız. Bu büyüyü istediğiniz zaman seçtiğiniz geleneğin bir büyüsü olarak özgü büyü şeklinde yapabilirsiniz. Bir kantrip, yukarı yuvarlanmış seviyenizin yarısına eşit bir büyü derecesine güçlendirilir. Bir gnom soy hünerinden ne zaman doğa özgü bir büyü kazansanız, onun geleneğini doğadan seçtiğiniz geleneğe dönüştürün.

omen://ancestry/goblin/goblin?source=paizo-pathfinder-player-core:
  name: Goblin
  description: >
    Diğer halkların sıkı sıkıya sarıldığı karmaşık tarihler goblinlerin ilgisini çekmez. Bu küçük halk anı yaşar ve gerçek kayıtlara abartılı masalları tercih eder. Birkaç on yıl önceki savaşlar onlar için pekâlâ kadim geçmişten kalma olabilir. Diğer halklar tarafından yanlış anlaşılan goblinler oldukları gibi mutludur. Goblin erdemleri anda olmak, yaratıcı olmak ve dürüst olmakla ilgilidir. Yolculuklarının nasıl biteceği konusunda endişelenmek yerine doyumlu hayatlar yaşamaya çabalarlar. Gerçeklerin kılı kırk yaran ayrıntılarına takılmak yerine hikâyeler anlatmak. Küçük olmak ama büyük hayaller kurmak.
    Goblin

omen://ancestry/goblin/heritages/charhide-goblin?source=paizo-pathfinder-player-core:
  name: Yanıkderi Goblini
  description: Atalarınızın ateşe her zaman bir bağı ve yanmaya direnmenizi sağlayan daha kalın bir derisi olmuştur. Seviyenizin yarısına eşit (en az 1) ateş direnci kazanırsınız. Ayrıca alevler içinde kalmaktan daha kolay kurtulabilirsiniz. Süregelen ateş hasarını gidermek için yapacağınız yalın testin ZD'si 15 yerine 10'dur ve başka bir yaratık yardım etmek için özellikle uygun bir eylem kullanırsa bu değer düşürülür.

omen://ancestry/goblin/heritages/irongut-goblin?source=paizo-pathfinder-player-core:
  name: Demirmide Goblini
  description: >
    Çoğu insanın bozulmuş sayacağı yiyeceklerle geçinebilirsiniz. Çöpler kolayca bulunabildiği sürece, Geçimini Sağla mola etkinliğini kullanmadan bir yerleşim yerinde kalitesiz öğünlerle karnınızı doyurabilirsiniz. Midesi Bulanmış hâldeyken bir şeyler yiyip içebilirsiniz.
    İlletlere karşı, midesi bulanmış durumunu kazanmaya karşı ve midesi bulanmış durumunu gidermeye yönelik kurtarışlara +2 durumsal bonus kazanırsınız. Bu bonustan etkilenen bir Dayanıklılık kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz. Tüm bu faydalar yalnızca illet veya durum yuttuğunuz bir şeyden kaynaklandığında geçerlidir.

omen://ancestry/goblin/heritages/razortooth-goblin?source=paizo-pathfinder-player-core:
  name: Usturadiş Goblini
  description: Ailenizin dişleri müthiş birer silahtır. 1d6 delici hasar veren bir çene silahsız saldırısı kazanırsınız. Çeneniz boğuşma grubundadır ve incelik ile silahsız özelliklerine sahiptir.

omen://ancestry/goblin/heritages/snow-goblin?source=paizo-pathfinder-player-core:
  name: Kar Goblini
  description: "Dondurucu diyarlarda yaşamaya alışıksınız; rengi gök mavisinden laciverte kadar değişen bir deriye ve mavi kürke sahipsiniz. Seviyenizin yarısına eşit (en az 1) soğuk direnci kazanırsınız. Çevresel soğuk etkilerini bir derece daha az aşırıymış gibi ele alırsınız (inanılmaz soğuk aşırıya dönüşür, aşırı soğuk şiddetliye dönüşür vb.)."

omen://ancestry/goblin/heritages/unbreakable-goblin?source=paizo-pathfinder-player-core:
  name: Kırılmaz Goblin
  description: Son derece kalın bir kafatası, kıkırdaklı kemikler veya bir başka lütuf sayesinde yaralanmalardan kolayca toparlanabilirsiniz. Soyunuzdan 6 yerine 10 Can Puanı kazanırsınız. Düştüğünüzde, aldığınız düşme hasarını mesafenin yarısı kadar düşmüşsünüz gibi azaltın.

omen://ancestry/halfling/features/keen-eyes?source=paizo-pathfinder-player-core:
  name: Keskin Gözler
  description: "Gözleriniz keskindir; başkalarının kaçırabileceği Belirsiz ve hatta Görünmez yaratıklar hakkındaki küçük ayrıntıları fark etmenizi sağlar. 30 fit yakınınızdaki Gizlenmiş veya Konumu Saptanmamış yaratıkları bulmak için Ara eylemini kullandığınızda +2 durumsal bonus kazanırsınız. Sizden Belirsiz veya sizden Gizlenmiş bir rakibi hedef aldığınızda, yalın testin ZD'sini Belirsiz bir hedef için 3'e, Gizlenmiş bir hedef için 9'a düşürün."

omen://ancestry/halfling/halfling?source=paizo-pathfinder-player-core:
  name: Buçukluk
  description: >
    Kendilerine ait bir yer iddia etmeyen buçukluklar, köylerden daha büyük çok az yerleşim yerini kontrol eder. Bunun yerine, sık sık daha büyük şehirlerin surları içinde insanların arasında yaşar, daha uzun boylu halkların yanı başında küçük topluluklar kurarlar. Pek çok buçukluk, daha iri komşularının gölgesinde son derece doyumlu hayatlar sürerken, diğerleri göçebe bir yaşamı tercih ederek dünyayı gezer ve önlerine çıkan fırsatları ve maceraları değerlendirir.
    Buçukluk

omen://ancestry/halfling/heritages/gutsy-halfling?source=paizo-pathfinder-player-core:
  name: Cesur Buçukluk
  description: Soyunuz, işler sarpa sardığında soğukkanlılığını koruması ve korkuyu savuşturmasıyla bilinir. Bir duygu etkisine karşı kurtarışta başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://ancestry/halfling/heritages/hillock-halfling?source=paizo-pathfinder-player-core:
  name: Tepe Buçukluğu
  description: Tepelerde sakin bir yaşama alışkın olan halkınız, dinlenmeyi ve rahatlamayı, özellikle de küçük dünyevi zevklerin tadını çıkarırken son derece tazeleyici bulur. Gece boyunca Can Puanı geri kazandığınızda, geri kazanılan Can Puanına seviyenizi ekleyin. Biri Yaralarınızı Tedavi Etmek için Tıp becerisini kullandığında, tedaviden geri kazandığınız Can Puanına seviyenizi eklemek için bir atıştırmalık yiyebilirsiniz.

omen://ancestry/halfling/heritages/jinxed-halfling?source=paizo-pathfinder-player-core:
  name: Uğursuz Buçukluk
  description: "Garip bir lütufla doğdunuz: tipik buçukluk şansından yoksun olarak, bunun yerine başkalarının talihini manipüle edebilirsiniz. Asla Buçukluk Şansı hünerini alamazsınız ve Kem Göz eylemini kazanırsınız."

omen://ancestry/halfling/heritages/nomadic-halfling?source=paizo-pathfinder-player-core:
  name: Göçebe Buçukluk
  description: Atalarınız nesiller boyunca bir yerden bir yere seyahat etti, asla yerleşmekle yetinmedi. Erişebildiğiniz yaygın ve az bulunur diller arasından seçtiğiniz iki ek dil kazanırsınız ve Çokdilli hünerini her aldığınızda bir yeni dil daha kazanırsınız.

omen://ancestry/halfling/heritages/twilight-halfling?source=paizo-pathfinder-player-core:
  name: Alacakaranlık Buçukluğu
  description: Atalarınız ister iyi ister kötü niyetle olsun, alacakaranlığın gizleyici örtüsü altında pek çok gizli iş gerçekleştirdi ve zamanla buçuklukların alışılagelmiş keskin görüşünün bile ötesinde alacakaranlıkta görme yeteneği geliştirdi. Loş ışıkta görme kazanırsınız.

omen://ancestry/halfling/heritages/wildwood-halfling?source=paizo-pathfinder-player-core:
  name: Yabanorman Buçukluğu
  description: Balta girmemiş bir ormanın veya korunun derinliklerinden geliyorsunuz ve çalıların ile diğer engellerin arasından kıvrılıp geçmek için küçük boyutunuzu nasıl kullanacağınızı öğrendiniz. Çalılar, sarmaşıklar ve fundalıklar gibi bitkiler ve mantarlardan kaynaklanan zorlu arazileri yok sayarsınız.

omen://ancestry/human/heritages/skilled-human?source=paizo-pathfinder-player-core:
  name: Becerikli İnsan
  description: Hüneriniz çok çeşitli becerilerde eğitilmenizi sağlar. Kendi seçtiğiniz bir beceride eğitimli olursunuz. 5. seviyede, seçilen beceride uzman olursunuz.

omen://ancestry/human/heritages/versatile-human?source=paizo-pathfinder-player-core:
  name: Çok Yönlü İnsan
  description: İnsanlığın çok yönlülüğü ve hırsı, dünya çapındaki pek çok ulusta en yaygın soy olmasına zemin hazırlamıştır. Önkoşullarını karşıladığınız, kendi seçtiğiniz bir genel hüner belirleyin (soy hünerinizde olduğu gibi, bu genel hüneri de karakter oluşturma sırasında herhangi bir noktada seçebilirsiniz).

omen://ancestry/human/human?source=paizo-pathfinder-player-core:
  name: İnsan
  description: >
    Golarion'un diğer tüm halkları kadar öngörülemez ve çeşitli olan insanlar; olağanüstü bir azme, dayanma ve yayılma kapasitesine sahiptir. İnsanlık öne çıkmadan önce pek çok uygarlık gelişmiş olsa da, insanlar tarih boyunca en muazzam ve en korkunç toplumlardan bazılarını inşa etmiştir ve bugün İç Deniz çevresindeki diyarlarda en kalabalık halk konumundadırlar.
    İnsan

omen://ancestry/leshy/features/plant-nourishment?source=paizo-pathfinder-player-core:
  name: Bitkisel Beslenme
  description: "Vücut tipinize uyan bitkilerin veya mantarların normalde yaptığı gibi fotosentez, köklerinizle mineralleri emme veya çürüyen maddeleri tüketme kombinasyonlarıyla besin elde edersiniz. Normalde yiyecek için para ödemeniz gerekmez. Normalde fotosenteze bel bağlıyorsanız ve 1 hafta boyunca güneş ışığından mahrum kalırsanız, açlık çekmeye başlarsınız. Doğal güneş ışığı yerine özel olarak formüle edilmiş güneş ışığı şişelerinden de besin sağlayabilirsiniz; ancak bu şişeler standart kumanyaların 10 katına (veya 40 sp'ye) mal olur."

omen://ancestry/leshy/heritages/cactus-leshy?source=paizo-pathfinder-player-core:
  name: Kaktüs Leshy
  description: Dikenler vücudunuzu kaplar. 1d6 delici hasar veren bir diken silahsız saldırısı kazanırsınız. Dikenleriniz boğuşma grubundadır ve incelik ile silahsız özelliklerine sahiptir.

omen://ancestry/leshy/heritages/fruit-leshy?source=paizo-pathfinder-player-core:
  name: Meyve Leshy
  description: "Vücudunuz sürekli olarak doğa büyüsüyle aşılanmış küçük meyveler üretir. Her gün şafak vaktinde yeni bir meyve olgunlaşır. Siz veya bir müttefikiniz bir Etkileşime Gir eylemi olarak bu meyveyi koparabilirsiniz. Meyveden beslenebilen canlı bir yaratık sonraki bir saat içinde onu bir Etkileşime Gir eylemi olarak tüketirse, (ceil(@actor.level/2))d8[vitality,healing] Can Puanı ve buna ek olarak 1. seviyenin üzerindeki her 2 seviyeniz başına fazladan 1d8 Can Puanı kazanır. Bu etki iyileşme ve canlılık özelliklerine sahiptir."

omen://ancestry/leshy/heritages/fungus-leshy?source=paizo-pathfinder-player-core:
  name: Mantar Leshy
  description: "Vücudunuz mağaraların ve ağaçların gölgesinde yetişen mantarlardan meydana gelmiştir; karanlık mağaralarda ve yer altı oyuklarında kendinizi evinizde hissedersiniz. Karanlıkta görme kazanırsınız. Bitki özelliğini kaybeder ve mantar özelliğini kazanırsınız."

omen://ancestry/leshy/heritages/gourd-leshy?source=paizo-pathfinder-player-core:
  name: Kabak Leshy
  description: Kafatası yerine büyük bir su kabağınız vardır ve fiziksel bir beyniniz olmadığı için başınızın içindeki boşluğu kullanabilirsiniz. Başınızın içinde toplamda 1 Bulk'a kadar nesne saklayabilirsiniz. Başınızın içinden nesneleri Çalma testlerinin ZD'si 4 artar. Ayrıca başınızın içinde yalnızca tek bir nesne saklıyorsanız, nesneyi kullanmaya yönelik başka bir eylemin parçası olarak onu zahmetsizce elinize çekebilirsiniz. Eşyayı çekmek, bu diğer eyleme manipülasyon özelliği kazandırır.

omen://ancestry/leshy/heritages/leaf-leshy?source=paizo-pathfinder-player-core:
  name: Yaprak Leshy
  description: Vücudunuz çoğunlukla doğal yaprak örtüsünden oluşur ve tıpkı ağaçtan süzülen bir yaprak gibi düşüşlerde yere son derece zarif inersiniz. Ne kadar mesafeden düşerseniz düşün düşme kaynaklı hiçbir hasar almazsınız.

omen://ancestry/leshy/heritages/lotus-leshy?source=paizo-pathfinder-player-core:
  name: Lotus Leshy
  description: "Su yüzeyinde zahmetsizce yüzersiniz. Durgun suyun ve hasar vermeyen diğer sıvıların yüzeyinde normal Hızınızın yarısıyla yürüyebilirsiniz. Ayrıca suyun içinde hareket etmek için gereken bir Yüzme testinin ZD'sini kullanarak akan suyun yüzeyinde ilerlemek üzere Dengede Kalmayı deneyebilirsiniz. Bunu yaptığınızda Hızınızın yarısından daha hızlı hareket edemezsiniz; başarısız olursanız veya kritik başarısızlık elde ederseniz normal etkiler yerine suya düşersiniz."

omen://ancestry/leshy/heritages/root-leshy?source=paizo-pathfinder-player-core:
  name: Kök Leshy
  description: Vücudunuz, sizi yere sıkıca tutturan dayanıklı köklerden oluşur. Soyunuzdan 8 yerine 10 Can Puanı kazanırsınız. Açlık çekmeye başlamadan önce 2 hafta boyunca güneş ışığı olmadan yaşayabilirsiniz. Sizi Yerinden Oynatma, İtme veya Çelme Takma girişimlerine karşı Beden veya Refleks ZD'nize +2 durumsal bonus kazanırsınız. Bu bonus ayrıca sizi hareket ettirmeye veya Yüzüstü düşürmeye çalışan büyülere ya da etkilere karşı kurtarışlar için de geçerlidir.

omen://ancestry/leshy/heritages/seaweed-leshy?source=paizo-pathfinder-player-core:
  name: Deniz Yosunu Leshy
  description: Vücudunuz örülü deniz yosunundan yapılmıştır ve karada olduğu kadar su altında da rahat edersiniz. 20 fit yüzme Hareket Hızı kazanırsınız ve su altında her zaman nefes alabilirsiniz. Ancak kara Hareket Hızınız 5 fit azalır (çoğu deniz yosunu leshy için 20 fite düşer).

omen://ancestry/leshy/heritages/vine-leshy?source=paizo-pathfinder-player-core:
  name: Sarmaşık Leshy
  description: Kavrayıcı sarmaşıklarınız size tırmanma konusunda eşsiz bir beceri kazandırır. Tırmanmak için ellerinizin boş olmasına gerek yoktur. Ayrıca Tırmanmak için bir Atletizm testinde başarı elde ederseniz, bunun yerine kritik başarı elde edersiniz.

omen://ancestry/leshy/leshy?source=paizo-pathfinder-player-core:
  name: Leshy
  description: >
    Çevrenin muhafızları ve elçileri olan leshyler; doğanın geçici olarak fiziksel bir form bahşedilmiş ölümsüz ruhlarıdır.
    Leshy

omen://ancestry/orc/heritages/badlands-orc?source=paizo-pathfinder-player-core:
  name: Çorak Toprak Orku
  description: "Güneşten kavrulmuş çorak topraklardan geliyorsunuz; burada uzun bacaklar ve doğa unsurlarına göğüs germe yeteneği gelişmenize yardımcı oldu. Keşif yaparken durmak zorunda kalmadan önce iki kat daha uzun süre Acele Edebilirsiniz ve çevresel sıcaklık etkilerini bir derece daha az aşırıymış gibi ele alırsınız (inanılmaz sıcaklık aşırıya dönüşür, aşırı sıcaklık şiddetliye dönüşür vb.)."

omen://ancestry/orc/heritages/battle-ready-orc?source=paizo-pathfinder-player-core:
  name: Savaşa Hazır Ork
  description: Korkunç savaş meydanı komutanlarının soyundan geliyorsunuz. Gözdağı Verme becerisinde eğitimli olursunuz ve Korkutucu Bakış beceri hünerini kazanırsınız.

omen://ancestry/orc/heritages/deep-orc?source=paizo-pathfinder-player-core:
  name: Derinlik Orku
  description: "Nasır tutmuş elleriniz ve kırmızı gözleriniz; kayalık uçurumlarda savaşmayı ve asgari kaynaklarla hayatta kalmayı öğrendiğiniz dağ mağaralarının derin karanlığında geçmiş bir hayata tanıklık eder. Yeraltı arazisi için Arazi Uzmanlığı beceri hünerini ve Muharebe Tırmanıcısı beceri hünerini kazanırsınız."

omen://ancestry/orc/heritages/grave-orc?source=paizo-pathfinder-player-core:
  name: Mezar Orku
  description: "Sizi öldürmesi gereken güçlü nekromansi enerjilerine maruz kaldınız; ancak hayatta kaldınız. Teniniz soğuk, nemli ve gridir. Seviyenizin yarısına eşit (en az 1) boşluk hasarı direnci kazanırsınız. Ayrıca ölüm veya boşluk özelliğine sahip etkilere karşı kurtarışlara +1 durumsal bonus kazanırsınız."

omen://ancestry/orc/heritages/hold-scarred-orc?source=paizo-pathfinder-player-core:
  name: Hisar Yaralı Ork
  description: Ritüel yara açma veya dövme uygulamalarına katılan bir ork topluluğunun parçasısınız. Teninizdeki izler olağanüstü dayanıklılığınızı ve canlılığınızı gösterir. Soyunuzdan 10 yerine 12 Can Puanı kazanırsınız. Ayrıca Zor Ölür hünerini kazanırsınız.

omen://ancestry/orc/heritages/rainfall-orc?source=paizo-pathfinder-player-core:
  name: Yağmur Orku
  description: Yalnızca birbirine dolanmış ağaçların şiddetli fırtınalardan ve ani sellerden koruma sağladığı bir yağmur ormanında doğdunuz. Vahşi orman arazisinde ustalıkla ilerlemeyi ve nemli ortamlarda yaygın olan çeşitli rahatsızlıklara direnmeyi öğrendiniz. Tırmanma veya Yüzme için yapılan Atletizm testlerine +2 durumsal bonus ve hastalıklara karşı kurtarışlara +1 durumsal bonus kazanırsınız.

omen://ancestry/orc/heritages/winter-orc?source=paizo-pathfinder-player-core:
  name: Kış Orku
  description: Atalarınız soğuk iklimlerde hayatta kaldı. Hayatta Kalma becerisinde eğitimli olursunuz ve çevresel soğuk etkilerini bir derece daha az aşırıymış gibi ele alırsınız (inanılmaz soğuk aşırıya dönüşür, aşırı soğuk şiddetliye dönüşür vb.).

omen://ancestry/orc/orc?source=paizo-pathfinder-player-core:
  name: Ork
  description: >
    Orklar genellikle doğdukları andan itibaren şiddet ve çatışma ateşinde dövülür. Hayatları sıklıkla acımasızca kısa kesildiğinden, orklar topluluklarındaki daha üst rütbeli bir üyeye hâkimiyet için meydan okuyarak veya komşu bir yerleşime akınlar düzenleyerek güçlerini layık düşmanlara karşı sınamaktan zevk alırlar. Pek çok ork yürüyebildiği ve bir kılıç ya da sopa taşıyabildiği andan itibaren vahşi canavarları evcilleştirerek veya ölümcül canavarları avlayarak zafer peşinde koşar.
    Ork
