# tr overrides: versatile-heritage

omen://versatile-heritage/aiuvarin?source=paizo-pathfinder-player-core:
  name: Aiuvarin
  description: Aile ağacınızda elfler veya muhtemelen başka aiuvarinler vardır. Sivri kulaklara ve elf mirasının diğer belirgin işaretlerine sahipsinizdir. Elf özelliğini, aiuvarin özelliğini ve loş ışıkta görüş kazanırsınız. Ayrıca bir soy hüneri kazandığınızda, soyunuzdan gelenlere ek olarak aiuvarin ve elf hünerlerinden seçim yapabilirsiniz.

omen://versatile-heritage/changeling?source=paizo-pathfinder-player-core:
  name: Değişen
  description: Anneniz bir kocakarıydı. Gözlerinizdeki heterokromi bu ebeveynliğin en bariz göstergesidir, ancak diğer ebeveyninizin soyunun çoğu üyesine kıyasla muhtemelen daha narin bir yapıya, daha soluk bir tene ve daha koyu saçlara da sahipsinizdir. Değişen özelliğini kazanırsınız. Ayrıca loş ışıkta görüş kazanırsınız veya soyunuz zaten loş ışıkta görüşe sahipse karanlıkgörüş kazanırsınız. Ne zaman bir soy hüneri kazansanız, değişen hünerlerinden ve diğer ebeveyninizin soyundan gelen hünerlerden seçim yapabilirsiniz.

omen://versatile-heritage/dromaar?source=paizo-pathfinder-player-core:
  name: Dromaar
  description: Ork gücü soyunuzu cesaretlendirir. Teninizde yeşil bir ton ve ork mirasının diğer belirtileri vardır. Ork özelliğini, dromaar özelliğini ve loş ışıkta görüş kazanırsınız. Bir soy hüneri kazandığınızda, soyunuzdan gelenlere ek olarak dromaar ve ork hünerlerinden seçim yapabilirsiniz.

omen://versatile-heritage/nephilim?source=paizo-pathfinder-player-core:
  name: Nephilim
  description: "Doğanız celestiallar, fiendler veya monitorlardan etkilenmiştir. Bu; altın sarısı gözler, bir hâle, boynuzlar veya bir kuyruk gibi mirasınızı ele veren özelliklerin bir kombinasyonu olarak tezahür eder. Soyunuzdan gelen özelliklere ek olarak nephilim özelliğini kazanırsınız. Loş ışıkta görüş kazanırsınız veya soyunuz zaten loş ışıkta görüşe sahipse karanlıkgörüş kazanırsınız. Ne zaman bir soy hüneri kazansanız nephilim hünerlerinden ve soyunuzdan gelen hünerlerden seçim yapabilirsiniz."
