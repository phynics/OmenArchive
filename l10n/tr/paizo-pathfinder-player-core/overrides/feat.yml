# tr overrides: feat

omen://feat/accompany?source=paizo-pathfinder-player-core:
  name: Eşlik Et
  description: Bir müttefikinizin büyü yapmasını desteklemek için gösterinizi kullanır, onun yerine büyüsü için büyüsel enerji sağlarsınız. Müttefikinizin seviyesine göre çok yüksek bir ZD kullanarak bir Gösteri testi deneyin ve bir Odak Puanı harcayın (tetikleyen büyü bir odak büyüsüyse) veya tetikleyen büyüden en az 1 derece daha yüksek bir büyü slotu harcayın. Gösteri testinizde başarılı olursanız, müttefikinizin büyüsü o müttefikin normalde harcaması gereken Odak Puanı veya büyü slotuna mal olmaz.

omen://feat/accursed-claws?source=paizo-pathfinder-player-core:
  name: Lanetli Pençeler
  description: Pençeleriniz anneniz olan cadının büyüsünü taşır. Bir pençe Vuruşu ile kritik vuruş yaptığınızda, hedef fazladan 1d4 süren zihinsel hasar alır.
  prerequisites:
  - text: "pençe silahsız saldırısı"

omen://feat/adapted-cantrip?source=paizo-pathfinder-player-core:
  name: Uyarlanmış Kantrip
  description: >
    Birden fazla büyü geleneğini inceleyerek, bir büyüyü kendi büyücülük tarzınıza uyacak şekilde değiştirdiniz. Kendi geleneğiniz dışındaki bir büyü geleneğinden bir kantrip seçin. Büyü hazırlıyorsanız, diğer seçeneklerinize ek olarak kantriplerinizi hazırlarken bu büyüyü seçebilirsiniz. Bir büyü repertuvarınız varsa, bildiğiniz kantriplerden birini seçilen büyüyle değiştirin. Bu kantripi sınıfınızın geleneğine ait bir büyü olarak yapabilirsiniz.
    Daha sonra bu kantripi takas eder veya yeniden eğitirseniz, yerine geçecek büyüyü aynı alternatif gelenekten ya da farklı bir gelenekten seçebilirsiniz.
  prerequisites:
  - text: "büyücülük sınıf özelliği"

omen://feat/adaptive-adept?source=paizo-pathfinder-player-core:
  name: Uyumlu Uzman
  description: "Büyünüzü uyarlamaya devam ederek sınıfınızın geleneği ile uyarlanmış geleneğinizi harmanladınız. Uyarlanmış Kantrip hünerinizden gelen kantriple aynı büyü geleneğinden bir kantrip veya 1. derece bir büyü seçin. Tıpkı Uyarlanmış Kantrip'den gelen kantrip gibi bu büyüyü de kazanarak büyü seçeneklerinize eklersiniz. Bu büyüyü sınıfınızın büyü geleneğine ait bir büyü olarak yapabilirsiniz. 1. derece bir büyü seçerseniz, o büyünün güçlendirilmiş versiyonlarına erişim kazanamazsınız; yani büyü hazırlıyorsanız onları hazırlayamazsınız ve bir büyü repertuvarınız varsa onları öğrenemez veya büyüyü imza büyü olarak seçemezsiniz."
  prerequisites:
  - text: "Uyarlanmış Kantrip"
  - text: "3. derece büyü yapabilme"

omen://feat/additional-lore?source=paizo-pathfinder-player-core:
  name: Ek İlim
  description: Bilginiz yeni bir alanı kapsayacak şekilde genişledi. Bir İlim becerisi alt kategorisi seçin. Onda eğitimli hale gelirsiniz. 3., 7. ve 15. seviyelerde, yalnızca seçilen İlim alt kategorisine uygulayabileceğiniz ek bir beceri artışı kazanırsınız.

omen://feat/additional-recollection?source=paizo-pathfinder-player-core:
  name: Ek Hatırlama
  description: Savaş alanını hızla tarar, karşılaştığınız birden fazla rakip hakkındaki kritik ayrıntıları hatırlarsınız. Algılayabildiğiniz farklı bir yaratık hakkında derhal Bilgi Hatırla testi denersiniz.

omen://feat/adopted-ancestry?source=paizo-pathfinder-player-core:
  name: Benimsenmiş Soy
  description: İster içinde doğmuş olun, ister bir erginlenme töreniyle hak kazanmış olun ya da derin bir dostluk veya romantik bir bağ kurmuş olun, başka bir soyun kültürüne ve geleneklerine tamamen uyum sağladınız. Yaygın bir soy veya erişiminiz olan başka bir soy seçin. GM tarafından belirlendiği üzere sahip olmadığınız herhangi bir fizyolojik özellik gerektirmediği sürece, karakterinizin kendi soyuna ek olarak seçtiğiniz soydan da soy hünerleri seçebilirsiniz.

omen://feat/advanced-domain?source=paizo-pathfinder-player-core:
  name: İleri Alan
  description: Dualarınız ilahınızın alanının daha derin sırlarını açığa çıkardı. Başlangıç alan büyüsüne sahip olduğunuz alanlarınızdan birinden bir ileri alan büyüsü kazanırsınız.
  prerequisites:
  - text: "Alan Çömezi"

omen://feat/advanced-first-aid?source=paizo-pathfinder-player-core:
  name: İleri İlk Yardım
  description: Tıbbi eğitiminizi hastalıkları hafifletmek veya korkuları yatıştırmak için kullanırsınız. İlk Yardım Uygulamak için Tıp becerisini kullandığınızda, bir karakteri Stabilize Etmek veya Kanamayı Durdurmak yerine bir müttefikin Korkmuş veya Midesi Bulanmış durumunu 2 azaltabilir ya da kritik başarı durumunda bu durumlardan birini tamamen kaldırabilirsiniz. Tek seferde yalnızca bir durumu kaldırabilirsiniz. Tıp testi için ZD genellikle duruma yol açan etkinin ZD'sidir.
  prerequisites:
  - text: "Tıp becerisinde usta"

omen://feat/advanced-general-training?source=paizo-pathfinder-player-core:
  name: İleri Genel Eğitim
  description: Macera dolu hayatınızın uzun seyri boyunca uyum sağlama kabiliyetiniz çok sayıda yararlı yetenek edinmenizi sağladı. 7. seviye veya daha düşük bir genel hüner kazanırsınız. Hünerin ön koşullarını karşılamalısınız.

omen://feat/advanced-school-spell?source=paizo-pathfinder-player-core:
  name: İleri Okul Büyüsü
  description: Mistik kurumunuzun ileri düzey öğretilerine erişim kazanarak güçlü ve yeni bir okul büyüsü öğrenirsiniz. Mistik okulunuz için ileri okul büyüsünü kazanırsınız.
  prerequisites:
  - text: "mistik okul"

omen://feat/advanced-warden?source=paizo-pathfinder-player-core:
  name: İleri Muhafız
  description: >
    Daha güçlü doğa büyülerini açığa çıkarırsınız. İleri muhafız büyülerinden seçtiğiniz bir muhafız büyüsü kazanırsınız:
    Hayvani Nitelik
    Yoldaşı Büyüt
    Avcının Şansı
    Yatıştırıcı Sis
  prerequisites:
  - text: "Çömez Muhafız"

omen://feat/advanced-weapon-training?source=paizo-pathfinder-player-core:
  name: İleri Silah Eğitimi
  description: İleri bir silahı kullanma sanatını çalıştınız. Bir silah grubu seçin. O gruptaki tüm ileri silahlarda, sanki kendi silah gruplarının askeri silahlarıymış gibi yetkinlik kazanırsınız.

omen://feat/advantageous-assault?source=paizo-pathfinder-player-core:
  name: Avantajlı Taarruz
  description: "Düşmanınızın hareket kabiliyetini kısıtladıktan sonra daha ölümcül bir darbe indirirsiniz. Kavranmış, Yüzüstü veya Bağlanmış durumdaki bir yaratığa karşı bir Vuruş Yapın. Bu Vuruşta silah hasar zarı sayısına eşit miktarda hasara durumsal bonusu kazanırsınız; silahı iki elle kullanıyorsanız bu sayı + 2 olur. Vuruş aşağıdaki başarısızlık etkisini kazanır."

omen://feat/ageless-patience?source=paizo-pathfinder-player-core:
  name: Ebedi Sabır
  description: >
    Uzun ömürlülükten doğan ve titizliğinizi artıran bir tempoda çalışırsınız. 1 eylem veya daha uzun süren bir Dikkat testinde ya da beceri testinde gönüllü olarak normalin iki katı zaman harcayabilirsiniz. Bunu yaparsanız teste +2 durumsal bonusu kazanırsınız ve doğal 1 attığınızda başarı derecenizi otomatik olarak düşürmezsiniz (yalnızca sonucunuz ZD'den 10 düşükse kritik başarısızlık alırsınız). Örneğin, normalde 1 eylem süren Tara eylemine 2 eylem harcayarak bu faydaları elde edebilirsiniz. Keşif sırasında normalin iki katı süre keşif yaparak veya boş zamanda iki katı boş zaman harcayarak bu faydaları kazanabilirsiniz.
    Sabırsız bir yaratıkla yapılan gergin bir müzakere gibi gecikmenin başarınıza doğrudan engel olacağı bir durumda GM bu faydayı kazanamayacağınıza karar verebilir.

omen://feat/aggressive-block?source=paizo-pathfinder-player-core:
  name: Saldırgan Engelleme
  description: "Engellerken geri iterek düşmanınızı uzaklaştırır veya dengesini bozarsınız. Kalkanınızı kullanarak tetikleyen yaratığı itersiniz; onu otomatik olarak 5 fit İter ya da bir sonraki sıranızın başlangıcına kadar Gafil kalmasına neden olursunuz. Tetikleyen yaratık hareket ettirilmeyi veya gafil kalmayı seçer. Hareket ettirilmeyi seçerse yönü siz belirlersiniz. İtme eylemi katı bir nesneye çarpmasına, zorlu arazi karesine girmesine veya başka bir yaratığın alanına girmesine neden olacaksa, hareket ettirilmek yerine gafil kalmak zorundadır."

omen://feat/agile-grace?source=paizo-pathfinder-player-core:
  name: Kıvrak Zarafet
  description: Kıvrak silahlarla sergilediğiniz zarif hareketlerin eşi benzeri yoktur. Kıvrak silahlar ve kıvrak silahsız saldırılarla çoklu saldırı cezanız ikinci saldırınız için –3 ve sonraki saldırılarınız için –6 olur (–4 ve –8 yerine).

omen://feat/alchemical-crafting?source=paizo-pathfinder-player-core:
  name: Simyasal Zanaat
  description: Simyasal eşyalar yaratmak için Zanaat aktivitesini kullanabilirsiniz. Bu hüneri seçtiğinizde, dört yaygın 1. seviye simyasal eşyanın formüllerini derhal formül kitabınıza eklersiniz.
  prerequisites:
  - text: "Zanaat becerisinde eğitimli"

omen://feat/all-in-my-head?source=paizo-pathfinder-player-core:
  name: Hepsi Kafamda
  description: Okült bağlantılarınızı ve inanılmaz ikna gücünüzü kullanarak, tetikleyen hasarın hayal gücünüzün bir ürünü olduğuna kendinizi inandırırsınız. Hasar olağan hasar türünden zihinsel hasara dönüşür ve hasar veren etki öldürücü olmayan özelliğini kazanır. Zihinsel etkilere veya zihinsel hasara karşı bağışıksanız bu reaksiyonu kullanamazsınız.

omen://feat/allegro?source=paizo-pathfinder-player-core:
  name: Allegro
  description: Hızlı tempolu bir performansla müttefiklerinizi hızlandırabilirsiniz. Allegro beste kantripini öğrenirsiniz.

omen://feat/analyze-weakness?source=paizo-pathfinder-player-core:
  name: Zayıflığı Analiz Et
  description: >
    Bir yaratığın anatomisine dair bilginiz tam isabetle saldırmanıza yardımcı olur. Konumundaki veya fiziksel yapısındaki özellikle zayıf noktaları tespit etmek için tanımladığınız bir yaratığı dikkatle incelersiniz. Sıranızın sonundan önce bir Vuruş ile seçilen yaratığa bir sonraki sinsi saldırı hasarı verdiğinizde, fazladan 2d6 zayıf nokta hasarı eklersiniz.
    11. seviyede bu ek hasar 3d6'ya, 17. seviyede ise 4d6'ya çıkar.
  prerequisites:
  - text: "sinsi saldırı 2d6"

omen://feat/ancestral-longevity?source=paizo-pathfinder-player-core:
  name: Soy Uzun Ömürlülüğü
  description: Yıllar boyunca engin bir yaşam tecrübesi biriktirdiniz. Günlük hazırlıklarınız sırasında yaşam deneyimlerinizi anımsayarak seçtiğiniz bir beceride eğitimli yetkinlik derecesi kazanabilirsiniz. Bu yetkinlik tekrar hazırlık yapana kadar sürer. Bu yetkinlik geçici olduğundan, onu bir beceri artışı veya bir hüner gibi kalıcı bir karakter seçeneği için ön koşul olarak kullanamazsınız.
  prerequisites:
  - text: "en az 100 yaşında"

omen://feat/ancestral-paragon?source=paizo-pathfinder-player-core:
  name: Soy Timsali
  description: İster içgüdü, ister çalışma, ister büyü yoluyla olsun, soyunuzla daha derin bir bağ hissedersiniz. 1. seviye bir soy hüneri kazanırsınız.

omen://feat/ancestral-suspicion?source=paizo-pathfinder-player-core:
  name: Soy Şüphesi
  description: "Uzun ömürlü elfler medeniyetlerin yükselişine ve çöküşüne, genellikle dış güçlerin eliyle tanık olmuşlardır. Sonuç olarak kendilerini etkilemeye veya kontrol etmeye çalışabilecek başkalarına karşı bir temkinlilik geliştirmişlerdir. Bu tür manipülasyonlara direnmek üzere eğitildiniz; Hükmet gibi sizi Kontrol Edilen yapacak etkilere karşı kurtarışlara ve bir yaratığın böyle bir etkinin altında olup olmadığını belirlemeye çalışırken Niyetini Tartmak için yapılan Dikkat testlerine +2 durumsal bonusu kazanırsınız. Böyle bir etkiye karşı kurtarışta başarı elde ettiğinizde bunun yerine kritik başarı kazanırsınız."

omen://feat/anchoring-roots?source=paizo-pathfinder-player-core:
  name: Sabitleyici Kökler
  description: Ayaklarınızdan çıkan küçük kökler hareket ederken sizi dengeler. Akrobasi konusunda eğitimli olmasanız bile Sağlam Denge beceri hünerini kazanırsınız ve Demirle eylemini kullanabilirsiniz.

omen://feat/angelkin?source=paizo-pathfinder-player-core:
  name: Meleksoylu
  description: Nirvana'dan veya diğer celestial alemlerden birinden gelen kanatlı bir ulak olan meleklerin soyundan geliyorsunuz. Sosyoloji becerisinde eğitimli yetkinlik derecesi kazanırsınız. Sosyoloji becerisinde otomatik olarak eğitimli olacaksanız (örneğin geçmişinizden veya sınıfınızdan), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz. Empyrean dilini bilirsiniz ve Çokdilli beceri hünerini kazanırsınız.

omen://feat/animal-accomplice?source=paizo-pathfinder-player-core:
  name: Hayvan Suçortağı
  description: Size büyüsel olarak bağlanan bir hayvanla yakın ilişki kurarsınız. Bir ruhdaş hayvan kazanırsınız. Hayvanın türü size bağlıdır, ancak çoğu gnom kazma Hızına sahip hayvanları seçer.

omen://feat/animal-companion-ranger?source=paizo-pathfinder-player-core:
  name: Yoldaş Hayvan (Korucu)
  description: Sizinle seyahat eden ve basit emirlere uyan genç bir yoldaş hayvanının hizmetini kazanırsınız. Av Peşine Düş eylemini kullandığınızda, yoldaş hayvanınız bu eylemin faydalarını ve varsa avcı üstünlüğü avantajınızı kazanır.

omen://feat/animal-companion?source=paizo-pathfinder-player-core:
  name: Yoldaş Hayvan
  description: Maceralarınızda sizinle seyahat eden ve ona verdiğiniz basit emirleri yetenekleri dahilinde en iyi şekilde yerine getiren genç bir yoldaş hayvanının hizmetini kazanırsınız.
  prerequisites:
  - text: "hayvan tarikatı"

omen://feat/animal-elocutionist?source=paizo-pathfinder-player-core:
  name: Hayvan Hatibi
  description: Hayvan seslerini anlamsız gürültüler yerine konuşmalar olarak duyar ve karşılık verebilirsiniz. Hayvanlara sorular sorabilir, onlardan cevaplar alabilir ve hayvanlarla Diplomasi becerisini kullanabilirsiniz. Çoğu durumda vahşi hayvanlar meramınızı anlatmanız için size zaman tanır. Hayvanlar üzerinde İzlenim Bırakmak için +1 durumsal bonusu kazanırsınız.

omen://feat/animal-empathy-ranger?source=paizo-pathfinder-player-core:
  name: Hayvan Empatisi (Korucu)
  description: Doğal dünyanın yaratıklarıyla aranızda, onlarla temel düzeyde iletişim kurmanızı sağlayan bir bağ vardır. Hayvanlar üzerinde İzlenim Bırakmak ve onlardan çok basit ricalarda bulunmak için Diplomasi becerisini kullanabilirsiniz. Çoğu durumda vahşi hayvanlar meramınızı anlatmanız için size zaman tanır.

omen://feat/animal-empathy?source=paizo-pathfinder-player-core:
  name: Hayvan Empatisi
  description: Doğal dünyanın yaratıklarıyla aranızda, onlarla temel düzeyde iletişim kurmanızı sağlayan bir bağ vardır. Hayvanlara sorular sorabilir, cevaplar alabilir ve hayvanlarla Diplomasi becerisini kullanabilirsiniz. Çoğu durumda vahşi hayvanlar meramınızı anlatmanız için size zaman tanır.

omen://feat/annotate-composition?source=paizo-pathfinder-player-core:
  name: Besteye Not Düş
  description: >
    Bestelemeyi kâğıda dökerek başkalarının okuyup anlayabileceği etkileyici sözler veya şarkılar içeren bir kaynak yaratabilirsiniz. Kendinizin veya başka bir yaratığın daha sonra etkinleştirebileceği özel bir parşömene bir beste büyüsünü aktarmak için 10 dakika ve 1 Odak Puanı harcarsınız. Bu beste büyüsünü yapmak tek bir eylem almalıdır. Seçilen beste büyüsü yapmanın parçası olarak bir Gösteri testi gerektiriyorsa, bestenizi not düşerken GM bu testi gizli test olarak atar.
    Fortissimo Beste veya Kalıcı Beste büyülerine sahipseniz, not düşülen bestenin bu değişiklikten faydalanabilmesi koşuluyla, bu büyülerden birini de not düşülen besteyi değiştirmek için kullanabilirsiniz. GM gizli Gösteri testini atar. Bunu yaparsanız, gizli test başarısız olsa bile ek bir Odak Puanı harcarsınız.
    Bestenize not düşerken kullandığınız dili okuyabilen herhangi bir yaratık, konsantrasyon özelliğine sahip tek bir eylem harcayarak Eşyayı Etkinleştirebilir. Bu, etkinleştiren yaratık Büyüyü Yapmış gibi bestenin etkilerini ortaya çıkarır.
    Bu yolla yarattığınız bir beste, bir sonraki günlük hazırlıklarınızı yaptığınızda gücünü kaybeder. Beste sizin elinizdeyken, konsantrasyon özelliğine sahip tek bir eylem kullanarak onu etkisiz hale getirebilirsiniz. Not düşülen besteyi oluşturmak için harcadığınız Odak Puanlarını, beste etkinleştirilene veya büyüsünü kaybedene kadar geri kazanamazsınız.

omen://feat/anthropomorphic-shape?source=paizo-pathfinder-player-core:
  name: İnsansı Form
  description: "İnsansıların hayvanlardan ayrı olduğu düşüncesi bir yanılgıdır; onların formlarını benimsemek sadece biraz fazladan pratik gerektirir. İnsansı Form büyüsünde listelenen formları Ehlileşmemiş Form listenize eklersiniz."
  prerequisites:
  - text: "Ehlileşmemiş Form"

omen://feat/anticipate-ambush?source=paizo-pathfinder-player-core:
  name: Pusuyu Öngör
  description: Seyahat Hızınızın yarısıyla ilerleyerek Gizlenmiş yaratıklara veya tehlikeli yerlere karşı tetikte kalırsınız. Bir karşılaşmanın başında Pusuyu Öngörüyorsanız, inisiyatif için bir Dikkat testi atarsınız ve inisiyatif için Gizlilik atan tüm düşmanlar Gizlilik testlerine –2 durumsal cezası alır.
  prerequisites:
  - text: "Gizlilik becerisinde uzman"

omen://feat/arcane-sense?source=paizo-pathfinder-player-core:
  name: Mistik Sezi
  description: "Büyü çalışmalarınız büyünün varlığını içgüdüsel olarak hissetmenizi sağlar. 1. derece Büyü Tespiti büyüsünü mistik özgü büyü olarak istediğiniz zaman yapabilirsiniz. Arkana konusunda uzmansanız büyü 3. dereceye güçlendirilir; efsaneviyseniz 4. dereceye güçlendirilir."
  prerequisites:
  - text: "Arkana becerisinde eğitimli"

omen://feat/archwizards-might?source=paizo-pathfinder-player-core:
  name: Başsihirbazın Kudreti
  description: Mistik büyünün en büyük sırlarında ustalaştınız. Fazladan bir 10. derece büyü slotu kazanırsınız.
  prerequisites:
  - text: "Başsihirbazın Büyü Zanaatı"

omen://feat/armor-proficiency?source=paizo-pathfinder-player-core:
  name: Zırh Yetkinliği
  description: Hafif zırhta eğitimli hale gelirsiniz. Zaten hafif zırhta eğitimliyseniz, orta zırhta eğitim kazanırsınız. Her ikisinde de eğitimliyseniz, ağır zırhta eğitimli hale gelirsiniz. En az 13. seviyedeyseniz, bu zırh türünde uzman olursunuz.

omen://feat/assisting-shot?source=paizo-pathfinder-player-core:
  name: Destek Atışı
  description: "İsabetinizi ölçmek için son atışınızı kullanarak, çatışmada bir düşmanı engellemek için hızlı bir atış yapabilirsiniz. Menzilli bir silahla bir Vuruş Yapın. Vuruş isabet ederse, bir sonraki sıranızın başlangıcından önce aynı hedefe saldıracak sizden başka bir sonraki yaratık zarına +1 durumsal bonusu kazanır; Vuruşunuz kritik vuruş olduysa bu bonus +2 durumsal bonusu olur."

omen://feat/assurance?source=paizo-pathfinder-player-core:
  name: Özgüven
  description: En kötü koşullarda bile temel görevleri yerine getirebilirsiniz. Eğitimli olduğunuz bir beceri seçin. O beceri için beceri testi atmaktan feragat ederek bunun yerine 10 + yetkinlik bonusunuz sonucunu alabilirsiniz (başka hiçbir bonus, ceza veya belirleyici uygulanamaz).
  prerequisites:
  - text: "en az bir beceride eğitimli"

omen://feat/assured-knowledge?source=paizo-pathfinder-player-core:
  name: Emin Bilgi
  description: >
    Güvenle bilgi edinebilirsiniz. Herhangi bir beceriyi (Ozan İlimi dahil) kullanarak her Bilgi Hatırladığınızda, test atmaktan vazgeçip bunun yerine 10 + yetkinlik bonusu sonucunu alabilirsiniz (başka hiçbir bonus, ceza veya niteleyici uygulanamaz).
    Bir beceride uzman olduğunuz sürece, o beceride Özgüven hünerine sahip olmasanız bile o becerideki Otomatik Bilgi beceri hünerinin ön koşullarını karşılarsınız.
  prerequisites:
  - text: "muamma ilham perisi"

omen://feat/athletic-might?source=paizo-pathfinder-player-core:
  name: Atletik Kudret
  description: Zorlu arazide hayatta kalmak size hareketlilik konusunda büyük bir yetenek kazandırdı. Tırmanmak veya Yüzmek için yapılan bir Atletizm testinde başarı elde ettiğinizde bunun yerine kritik başarı kazanırsınız.

omen://feat/automatic-knowledge?source=paizo-pathfinder-player-core:
  name: Otomatik Bilgi
  description: Temel gerçekleri ezbere bilirsiniz. Bilgi Hatırla eylemine sahip ve Özgüven hünerine sahip olduğunuz, uzmanı olduğunuz bir beceri seçin. O beceriyle Bilgi Hatırla eylemini turda bir kez serbest eylem olarak kullanabilirsiniz. Bunu yaparsanız, beceri testinde Özgüven hünerini kullanmalısınız.
  prerequisites:
  - text: "Bilgi Hatırla eylemine sahip bir beceride uzman"
  - text: "O beceride Özgüven"

omen://feat/avatars-audience?source=paizo-pathfinder-player-core:
  name: Avatarın Huzuru
  description: "Kapsamlı hizmetiniz size belirli ilahi ayrıcalıklar sağlar. İlk olarak, karşılaştığınız her yaratık ilahınız adına konuştuğunuzu içgüdüsel olarak bilir. İkinci olarak, ilahınızla iletişim kurmak için İstişare ritüelini yönetirseniz herhangi bir bedel ödemeniz gerekmez ve otomatik olarak kritik başarı kazanırsınız. Üçüncü olarak, günde bir kez Düzlemlerarası Işınlanma büyüsünü ilahi özgü büyü olarak yapabilirsiniz; ancak yalnızca ilahınızın alemine seyahat etmek için. Bu şekilde yaptığınızda yapma süresi 1 dakikadır, dini sembolünüz bu büyü için yeterli bir düzlemsel anahtardır ve tam olarak olmak istediğiniz yerde belirirsiniz. Bu büyü sayesinde ilahınızın aleminde bulunuyorsanız, yaptığınızda ayrıldığınız noktaya konsantrasyon ve ilahi özelliklerine sahip tek bir eylem harcayarak dönebilirsiniz."

omen://feat/avatars-protection?source=paizo-pathfinder-player-core:
  name: Avatarın Koruması
  description: Tehlike anlarında tanrınızın formunu bir anda yardıma çağırabilirsiniz. Büyü slotlarınızdan avatar büyüsü yaparsınız. Tetikleyen kritik vuruş normal bir vuruşa indirgenir ve hasarı avatar büyüsünün geçici Can Puanı kazanıldıktan sonra uygulanır.

omen://feat/avenge-ally?source=paizo-pathfinder-player-core:
  name: Müttefikin Öcünü Al
  description: Sonunda yoldaşlarınızdan daha uzun yaşayacağınızı bilseniz de, onları ölümün eşiğinde görmek saldırılarınıza netlik kazandırır. Bir Vuruş Yapın. Saldırı zarı için iki kez zar atın ve yüksek olan sonucu kullanın.

omen://feat/bardic-lore?source=paizo-pathfinder-player-core:
  name: Ozan İlimi
  description: "Çalışmalarınız her konuda bilgi sahibi olmanızı sağlar. Yalnızca Bilgi Hatırlamak için kullanılabilen ancak her konuda geçerli olan özel bir İlim becerisi olan Ozan İlimi konusunda eğitimli olursunuz. Okültizm konusunda efsanevi yetkinliğe sahipseniz, Ozan İlimi konusunda uzman yetkinlik kazanırsınız; ancak Ozan İlimi yetkinlik derecenizi başka hiçbir yolla artıramazsınız."
  prerequisites:
  - text: "muamma ilham perisi"

omen://feat/bargain-hunter?source=paizo-pathfinder-player-core:
  name: Kelepir Avcısı
  description: "Diplomasi kullanarak Gelir Elde Edebilir, günlerinizi kelepir peşinde koşarak ve kârla yeniden satarak geçirebilirsiniz. Ayrıca belirli bir eşyada büyük bir fırsat yakalamak için özel olarak zaman harcayabilirsiniz; bu, para kazanmak yerine eşyayı kazanacağınız paraya eşit bir indirimle satın almanız dışında Diplomasi ile Gelir Elde Etmek gibi çalışır; elde ettiğiniz gelir eşyanın maliyetine eşit veya fazlaysa eşyayı ücretsiz kazanırsınız. Son olarak, 1. seviyede karakter yaratımı sırasında Kelepir Avcısı'nı seçerseniz, oyuna fazladan 2 gp ile başlarsınız."
  prerequisites:
  - text: "Diplomasi becerisinde eğitimli"

omen://feat/bark-and-tendril?source=paizo-pathfinder-player-core:
  name: Kabuk ve Filiz
  description: Doğa büyüsünü yönlendirirsiniz. Dolaşık Bitkiler ve Meşe Dayanıklılığı büyülerini günde birer kez 2. derece doğa özgü büyüleri olarak yapabilirsiniz.

omen://feat/barreling-charge?source=paizo-pathfinder-player-core:
  name: Bodoslama Hücum
  description: "Düşmanınıza ulaşmak için aradaki düşmanları bir kenara iterek ileri atılırsınız. Düşmanlarınızın alanlarından geçmeyi deneyerek Depar atarsınız. Bir athletics|defense:fortitude testi zarlayın ve sonucu, Deparınız sırasında alanından geçmeyi denediğiniz her yaratığın Dayanıklılık ZD'si ile karşılaştırın; başarıda onun alanından geçersiniz, ancak başarısızlıkta alanına girmeden önce hareketinizi sonlandırırsınız. Ardından Deparınızın nasıl sonlandığına bakılmaksızın Vuruş Yapabilirsiniz. İlgili hareket türüne sahipseniz, Depar yerine Kazma, Tırmanma, Uçma veya Yüzme ile Bodoslama Hücum kullanabilirsiniz."
  prerequisites:
  - text: "Atletizm becerisinde eğitimli"

omen://feat/basic-lesson?source=paizo-pathfinder-player-core:
  name: Temel Ders
  description: Haminiz size doğasının gizli bir yönünü açığa çıkaran özel bir ders verir. Bir temel ders seçin. Dersle ilişkili nazar büyüsünü kazanırsınız ve tanıdığınız ilişkili büyüyü öğrenir.

omen://feat/battle-cry?source=paizo-pathfinder-player-core:
  name: Savaş Narası
  description: İnisiyatif attığınızda, kudretli bir savaş narası atabilir ve serbest eylem olarak gözlemlediğiniz bir düşmanın Gözdağı Verebilirsiniz. Gözdağı konusunda efsaneviyseniz, bir saldırı zarında kritik başarı elde ettiğinizde düşmanınıza Gözdağı Vermek için bir reaksiyon kullanabilirsiniz.
  prerequisites:
  - text: "Gözdağı becerisinde usta"

omen://feat/battle-medicine?source=paizo-pathfinder-player-core:
  name: Muharebe Tıbbı
  description: "Savaşta bile yaraları sarabilirsiniz. Yaraları Tedavi Et ile aynı ZD'ye sahip bir Tıp testi deneyin ve buna karşılık gelen miktarda CP yenileyin; bu, Yaralı durumunu kaldırmaz. Tıpkı Yaraları Tedavi Et gibi, asgari yetkinlik derecesine sahipseniz daha yüksek ZD'lere karşı testler deneyebilirsiniz. Hedef daha sonra 1 gün boyunca Muharebe Tıbbınıza karşı bağışık hale gelir. Bu durum onları Yaraları Tedavi Et eylemine karşı bağışık kılmaz ya da bu eylem yerine sayılmaz."
  prerequisites:
  - text: "Tıp becerisinde eğitimli"

omen://feat/beast-trainer?source=paizo-pathfinder-player-core:
  name: Canavar Terbiyecisi
  description: Vahşi canavarları evcilleştirmek ve onlara hükmetmek konusunda etkileyici bir doğuştan yeteneğe sahipsiniz. Doğa becerisinde eğitimli hale gelirsiniz ve Evcil Hayvan genel hüneri ile Hayvan Eğit beceri hüneri arasından seçiminizi kazanırsınız.

omen://feat/bespell-strikes?source=paizo-pathfinder-player-core:
  name: Büyülü Vuruşlar
  description: >
    Kahin Büyü enerjisini kullandığınız bir silaha veya yumruk gibi silahsız saldırılarınızdan birine aktarırsınız. Sıranızın sonuna kadar, silah veya silahsız saldırı fazladan 1d6 kuvvet hasarı verir ve zaten sahip değilse ilahi özelliğini kazanır. Büyü farklı bir tür hasar verdiyse, Vuruş bunun yerine bu türde hasar verir (veya büyü birden fazla hasar türü verebiliyorsa seçtiğiniz bir türde).
    Sorcerer Büyü enerjisini kullandığınız bir silaha veya yumruk gibi silahsız saldırılarınızdan birine aktarırsınız. Sıranızın sonuna kadar, silah veya silahsız saldırı fazladan 1d6 kuvvet hasarı verir ve zaten sahip değilse soyunuzun büyü geleneğinin özelliğini kazanır. Büyü farklı bir tür hasar verdiyse, Vuruş bunun yerine bu türde hasar verir (veya büyü birden fazla hasar türü verebiliyorsa seçtiğiniz bir türde).
    Wizard Büyü enerjisini kullandığınız bir silaha veya yumruk gibi silahsız saldırılarınızdan birine aktarırsınız. Sıranızın sonuna kadar, silah veya silahsız saldırı fazladan 1d6 kuvvet hasarı verir ve zaten sahip değilse mistik özelliğini kazanır. Büyü farklı bir tür hasar verdiyse, Vuruş bunun yerine bu türde hasar verir (veya büyü birden fazla hasar türü verebiliyorsa seçtiğiniz bir türde).

omen://feat/bestial-manifestation?source=paizo-pathfinder-player-core:
  name: Vahşi Tezahür
  description: >
    Vücudunuzun bir parçası, düzlemsel bir yaratıktan gelen hayvani bir etki taşır. Elleriniz pençelerle biter, ayaklar yerine toynaklarınız vardır, ağzınızı keskin dişler doldurur ya da omurganızdan bir kuyruk uzanır. Aşağıdaki silahsız saldırılardan birini seçerek kazanırsınız. Vuruş boğuşma grubundadır ve listelenen hasar zarına ve özelliklere sahiptir.
    Pençe 1d4 kesici (kıvrak, incelikli, silahsız, çok yönlü delici)
    Toynak 1d6 ezici (incelikli, silahsız)
    Çene 1d6 delici (incelikli, silahsız)
    Kuyruk 1d4 ezici (kıvrak, incelikli, silahsız)

omen://feat/bizarre-magic?source=paizo-pathfinder-player-core:
  name: Tuhaf Büyü
  description: Okült büyüler yapıp yapamayacağınıza bakılmaksızın, büyü yapmanızdaki tuhaf varyasyonlardan yararlanabilirsiniz. Yaptığınız Büyüleri Tanımak ve kullandığınız Büyüyü Tanımlamak için gereken ZD'ler 5 artar.
  prerequisites:
  - text: "Okültizm becerisinde usta"

omen://feat/blade-brake?source=paizo-pathfinder-player-core:
  name: Kılıç Freni
  description: Silahınızı zemine, duvara veya başka bir sağlam yüzeye saplayarak kendinizi yere sabitlersiniz. 20 fit veya daha fazla hareket ettirilecek olursanız, yalnızca 5 fit hareket ettirilirsiniz. Aksi takdirde hiç hareket etmezsiniz.

omen://feat/blank-slate?source=paizo-pathfinder-player-core:
  name: Boş Levha
  description: Yanıltmacalarınız, sizi gözetleyebilecek en güçlü büyüyü bile şaşırtır. Tespit, ifşa ve gözetleme etkileri tespit eden etkinin etkisizleştirme derecesi 10 veya daha yüksek olmadığı sürece sizi, eşyalarınızı ve auralarınızı doğrudan atlayarak hiçbir şey algılamaz. Örneğin, Büyü Tespiti alandaki diğer büyüleri tespit eder ama sizin üzerinizdeki hiçbir büyüyü tespit edemez, Hakikatgörüşü sizi açığa çıkaramaz, Konum Bul veya Gözetleme sizi bulamaz ve benzeri.
  prerequisites:
  - text: "Aldatma becerisinde efsanevi"

omen://feat/blessed-blood-nephilim?source=paizo-pathfinder-player-core:
  name: Kutsanmış Kan (Nephilim)
  description: "Dökülen kanınız Kutsal Su'ya benzer etkilere sahip olacak şekilde kerametlidir. Bir fiend, hortlak veya mübareğe karşı zaafı olan bir yaratık kanınızı içtiğinde ya da çene, sivri diş veya benzeri bir saldırıyla size delici veya kesici hasar verdiğinde, o yaratık mübarek özelliğiyle 1d6[spirit]|traits:holy hasar alır. Kanınızı malzemelerden biri olarak kullanarak kutsal su Üretmek için yapılan Zanaat testlerine +4 durumsal bonus kazanırsınız."

omen://feat/blind-fight?source=paizo-pathfinder-player-core:
  name: Kör Dövüşü
  description: >
    Savaşçı, Düzenbaz, Araştırmacı Muharebe içgüdüleriniz sizi Belirsiz ve Görünmez rakiplere karşı daha dikkatli kılar.
    Korucu Güçlenmiş duyularınız görünmeyen rakipleri içgüdüsel olarak tespit etmenizi sağlar.
    Belirsiz yaratıkları hedef almak için düz testte başarılı olmanız gerekmez. Sizden Gizlenmiş olan yaratıklara karşı Gafil kalmazsınız (Gizlenmiş durumunun dışındaki nedenlerle onlara karşı gafil değilseniz) ve Gizlenmiş bir yaratığı hedef almak için yalnızca başarılı bir teste ihtiyacınız vardır.
    Seviyenizde veya daha düşük bir seviyedeki Fark Edilmemiş bir yaratığa bitişikken, o yaratık sizin için yalnızca Gizlenmiş kalır.
  prerequisites:
  - text: "Dikkat konusunda usta"

omen://feat/bloody-blows?source=paizo-pathfinder-player-core:
  name: Kanlı Darbeler
  description: Öldürücü silahsız saldırılarınız kanlı yaralar bırakır veya şiddetli iç kanamaya yol açar. Öldürücü olmayan özelliğe sahip olmayan bir silahsız saldırıyla bir Vuruşta kritik vuruş yaptığınızda, hedef 1d4 süren kanama hasarı alır. Bu, öldürücü bir saldırı için yumruk kullanma cezasını almanızdan veya Sivri Dişler ya da benzer bir yetenek nedeniyle öldürücü olmayan özelliğine sahip olmayan bir silahsız saldırınız olmasından kaynaklanabilir.

omen://feat/bloody-debilitation?source=paizo-pathfinder-player-core:
  name: Kanlı Güçten Düşürme
  description: "Vuruşlarınız atardamarları ve toplardamarları keser. Güçten Düşürücü Vuruş kullandığınızda seçebileceğiniz listeye aşağıdaki güçten düşürmeyi ekleyin. • Güçten Düşürme Hedef 3d6[bleed] hasar alır."
  prerequisites:
  - text: "Tıp becerisinde eğitimli"
  - text: "Güçten Düşürücü Vuruş"

omen://feat/bond-conservation?source=paizo-pathfinder-player-core:
  name: Bağ Tasarrufu
  description: Bağlı eşyanız tarafından açığa çıkarılan mistik enerjileri verimli ve dikkatli bir şekilde yönlendirerek, biraz daha zayıf olsa da başka bir büyü yapmak için tam yetecek kadar gücü muhafaza edebilirsiniz. Bağlı Eşyayı Tüket eyleminin fazladan bir kullanımını kazanırsınız. Bunu önceki büyüden 2 veya daha fazla derece daha düşük bir büyü yapmak için kullanabilirsiniz ve bir sonraki sıranızın sonundan önce kullanmalısınız, aksi takdirde kaybedersiniz.
  prerequisites:
  - text: "mistik bağ"

omen://feat/bonded-animal?source=paizo-pathfinder-player-core:
  name: Bağlı Hayvan
  description: >
    Hayvanlarla güçlü bağlar kurarsınız. Size karşı dost canlısı veya yardımsever olan normal bir hayvanla (bir yoldaş veya başka özel bir hayvan değil) düzenli olarak etkileşime girerek 7 günlük boş zaman harcayabilirsiniz. Bu sürenin ardından hayvanın İrade ZD'sine karşı bir nature|defense:will testi deneyin. Başarılı olursanız hayvanla bağ kurarsınız. Hayvan, farklı bir hayvanla bağ kurana veya bağınızı koparacak feci bir şey yapana kadar kalıcı olarak size bağlı kalır.
    Yardımsever bir hayvanı yönlendirmek daha kolaydır. Bağlı hayvanınız seviye –1 ise, ona daha verimli bir şekilde komut vermenizi sağlayan minyon özelliğini kazanır. Minyonunuz olabilecek yaratığın maksimum seviyesi, Doğa konusunda ustaysanız 3'e, efsaneviyseniz 11'e yükselir.
  prerequisites:
  - text: "Doğa becerisinde uzman"

omen://feat/bonded-focus?source=paizo-pathfinder-player-core:
  name: Bağlı Odak
  description: Bağlı eşyanızla olan bağınız odak havuzunuzu artırır. Bağlı eşyanız yanınızdayken ne zaman Odaklansanız, odak havuzunuzu tamamen doldurursunuz.
  prerequisites:
  - text: "mistik bağ"

omen://feat/boulder-roll?source=paizo-pathfinder-player-core:
  name: Kaya Yuvarlama
  description: >
    Tıpkı yeraltı mağarasında yuvarlanan kudretli bir kaya gibi, cüce yapınız düşmanları itip kakmanıza olanak tanır. Boyutunuzda veya daha küçük bir düşmanın karesine Adım atın; düşman hemen arkasındaki boş alana hareket etmek zorundadır. Düşman bunu yapmak kendisini tehlikeye atsa bile hareket etmelidir. Düşman Adımınızı engellemek için Atletizm ZD'nize karşı bir fortitude|against:athletics kurtarış deneyebilir. Düşman bu kurtarışı denerse, kritik başarı elde etmedikçe seviyeniz artı Kuvvet bonusunuza eşit ezici hasar alır.
    Düşman boş bir alana hareket edemiyorsa (örneğin katı nesneler veya diğer yaratıklarla çevriliyse), Kaya Yuvarlamanızın hiçbir etkisi olmaz.
  prerequisites:
  - text: "Kaya Koşucusu"

omen://feat/bounce-back?source=paizo-pathfinder-player-core:
  name: Çabuk Toparlanma
  description: Ölümün eşiğindeki deneyimlerden hayret verici bir dirençle toparlanırsınız. Ölmekte durumunu kaybetmekten dolayı Yaralı durumunuzun değerini artırmazsınız.

omen://feat/boundless-reprisals?source=paizo-pathfinder-player-core:
  name: Sınırsız Misillemeler
  description: >
    Savaşçı Çatışmanın akışına yönelik altıncı hissinizle, gerektiğinde her duruma hızla reaksiyon verebilirsiniz. Her düşmanın sırasının başında, yalnızca o sıra sırasında bir savaşçı hünerinden veya sınıf özelliğinden gelen herhangi bir reaksiyon için kullanabileceğiniz bir reaksiyon kazanırsınız.
    Muhafız Çatışmanın akışına yönelik altıncı hissinizle, gerektiğinde her duruma hızla reaksiyon verebilirsiniz. Her düşmanın sırasının başında, yalnızca o sıra sırasında bir muhafız hünerinden veya sınıf özelliğinden gelen herhangi bir reaksiyon için kullanabileceğiniz bir reaksiyon kazanırsınız.

omen://feat/break-curse?source=paizo-pathfinder-player-core:
  name: Laneti Kır
  description: Hedef üzerinde 8 saat boyunca dua ederek veya okült ayinler gerçekleştirerek bir lanetin onlar üzerindeki gücünü zayıflatırsınız. Etkisizleştirme testiniz için Okültizm veya Din ve etkisizleştirme derecesi için seviyenizin yukarı yuvarlanmış yarısını kullanarak laneti etkisizleştirmeyi deneyin. Okültizm veya Din konusunda efsaneviyseniz Laneti Kır yalnızca 10 dakikalık dua ve ayin gerektirir.
  prerequisites:
  - text: "Okültizm veya Din becerisinde usta"

omen://feat/breath-control?source=paizo-pathfinder-player-core:
  name: Nefes Kontrolü
  description: Tehlikeli veya seyrek havada bile nefes alabilirsiniz. Boğulmadan önce nefesinizi normalden 25 kat daha uzun süre tutabilirsiniz. Solunan zehirler gibi solunan tehditlere karşı kurtarışlara +1 durumsal bonusu kazanırsınız ve böyle bir kurtarışta başarı elde ederseniz bunun yerine kritik başarı kazanırsınız.

omen://feat/brine-may?source=paizo-pathfinder-player-core:
  name: Tuzcul May
  description: Annenizin bir deniz cadısı olması size deniz yeşili veya mavi bir göz kazandırdı. Hem denizde hem de kıyıda rahatlık bulursunuz. Yüzmek için yapılan bir Atletizm testinde başarı elde ettiğinizde bunun yerine kritik başarı kazanırsınız. O turda bir Yüzme eyleminde başarılı olmadan sıranızı suda tamamlarsanız batmazsınız (ancak yine de akıntı tarafından sürüklenebilirsiniz).

omen://feat/brutal-beating?source=paizo-pathfinder-player-core:
  name: Acımasız Dayak
  description: Kritik vuruşlarınız düşmanlarınızın özgüvenini sarsar. Vuruşunuz kritik vuruş olup hasar verdiğinde, hedef Korkmuş 1 olur.
  prerequisites:
  - text: "kabadayı düzeni"

omen://feat/brutal-finish?source=paizo-pathfinder-player-core:
  name: Acımasız Bitiş
  description: "Son darbeniz bir düşmanın savunmasından sekse bile etki bırakabilir. İki elle kullandığınız bir yakın dövüş silahıyla bir Vuruş Yapın. Vuruştan sonra sıranız sona erer. Vuruş fazladan bir silah hasar zarı verir; en az 18. seviyedeyseniz iki ilave silah hasar zarı verir. Vuruş ayrıca aşağıdaki başarısızlık etkisini kazanır."

omen://feat/brutish-shove?source=paizo-pathfinder-player-core:
  name: Kaba İtiş
  description: >
    Son saldırınızın momentumunu bir sonrakine ağırlığınızı koymak için kullanarak rakibinizin tökezlemesine yol açarsınız. İki elli bir yakın dövüş silahıyla bir Vuruş Yapın. Boyutunuzda veya daha küçük bir hedefe vurursanız, o yaratık mevcut sıranızın sonuna kadar Gafil kalır ve İt eylemiyle aynı faydalarla (Vuruşunuz kritik bir vuruş idiyse kritik başarı etkisi dahil) onu otomatik olarak İtebilirsiniz. Hedefi takip etmek için hareket ederseniz hareketiniz reaksiyonları tetiklemez.
    Bu Vuruş aşağıdaki başarısızlık etkisine sahiptir.

omen://feat/bullseye?source=paizo-pathfinder-player-core:
  name: Tam İsabet
  description: "Düşmanınızın gizlenmesini ve siperini bertaraf etmek için dikkatle nişan alırsınız. Sıranızın sonundan önce fırlatılan bir silahla yapacağınız bir sonraki Vuruşta, saldırı zarınıza +1 durumsal bonusu kazanırsınız ve hedefinizin Belirsiz durumunun yanı sıra hedefinizin az siperini veya standart siperini yok sayarsınız; hedef daha büyük sipere sahipse, Vuruşa karşı yalnızca standart sipere sahip olur."

omen://feat/burn-it?source=paizo-pathfinder-player-core:
  name: "Yak Gitsin!"
  description: Ateş sizi büyüler. Yangın hasarı veren büyü ve simyasal eşyalarınız büyünün derecesinin yarısına veya eşyanın seviyesinin dörtte birine eşit miktarda hasara statü bonusu kazanır (asgari bonus +1). Ayrıca verdiğiniz her türlü süren yangın hasarına +1 statü bonusu kazanırsınız.

omen://feat/cackle?source=paizo-pathfinder-player-core:
  name: Kıkırdama
  description: "Haminizin gücü sizi özgüvenle doldurur; dudaklarınızdan hızlı bir kahkaha patlaması dökülürken bile büyüsel bir işleyişi sürdürmenizi sağlar. Kıkırdama nazar büyüsünü öğrenirsiniz."

omen://feat/call-and-response?source=paizo-pathfinder-player-core:
  name: Çağrı ve Yanıt
  description: Besteniz, müttefiklerinizin etkiyi siz olmadan da sürdürmelerini sağlayan bir çağrı ve yanıt ilahisi biçimini alır. Bir sonraki eyleminiz süresi 1 tur olan bir beste kantripi yapmaksa, bu bir çağrıya dönüşür. Büyü etkinken, büyüden etkilenen seçtiğiniz bir müttefik, büyünün süresini 1 tur uzatmak için işitsel ve konsantrasyon özelliklerine sahip tek bir eylem olarak çağrınıza yanıt verebilir. Belirli bir çağrıya yalnızca tek bir müttefik yanıt verebilir ve müttefikin yanıtına yanıt vermenin ek bir etkisi yoktur.

omen://feat/call-of-the-green-man?source=paizo-pathfinder-player-core:
  name: Yeşil Adamın Çağrısı
  description: Bedeninizi güçlendirmek için yakındaki doğa ruhlarını çağırabilirsiniz. Günde bir kez, 5. derece doğa özgü büyü olarak Bitki Formu yapabilirsiniz. 17. seviyeye ulaştığınızda, yaptığınızda büyüyü 6. dereceye güçlendirebilirsiniz.

omen://feat/call-of-the-wild?source=paizo-pathfinder-player-core:
  name: Vahşi Doğanın Çağrısı
  description: Doğanın yaratıklarını yardıma çağırırsınız. Druid büyü slotlarınızdan birinde hazırladığınız bir büyüyü aynı derecedeki Hayvan Çağır veya Bitki veya Mantar Çağır büyüsüyle değiştirmek için doğayla uyum içinde 10 dakika geçirebilirsiniz.

omen://feat/call-wizardly-tools?source=paizo-pathfinder-player-core:
  name: Wizard Aletlerini Çağır
  description: Wizard aletlerinize mistik olarak bağlısınız, bu da onları yanlış yere koyduğunuzda her zaman bulabilmenizi sağlar. Bağlı eşyanızı veya büyü kitabınızı kendinize ışınlarsınız. Boş bir eliniz varsa elinize, yoksa ayaklarınızın dibine ulaşır. Eşya 1 mil mesafede olmalı ve 1 Yük veya daha az olmalıdır.
  prerequisites:
  - text: "mistik bağ"

omen://feat/called?source=paizo-pathfinder-player-core:
  name: Çağrılmış
  description: Çağrı'yı duydunuz ve ona direnerek zihninizi hedef alan etkilere karşı bir siper geliştirdiniz. Zihinsel etkilere karşı İrade kurtarışlara +1 durumsal bonusu kazanırsınız. Sizi Kontrol Edilen yapacak zihinsel bir etkiye karşı kurtarışınızda başarı elde ederseniz bunun yerine kritik başarı kazanırsınız.

omen://feat/callow-may?source=paizo-pathfinder-player-core:
  name: Toy May
  description: Değişenlerin en yaygın olanları arasındasınız—tatlı cadılardan doğanlar—ve canlı yeşil bir göz bu ebeveynliği simgeler. Annenizin manipülatif doğası ve çok yönlü sesi, başkalarını aldatırken size bir üstünlük sağlar. Sevimli Yalancı beceri hünerini kazanırsınız. İnisiyatif için Aldatma atarsanız, o muharebe karşılaşmasında henüz eylemde bulunmamış düşmanlar size karşı Gafil kalır.

omen://feat/camouflage?source=paizo-pathfinder-player-core:
  name: Kamuflaj
  description: Vahşi doğaya uyum sağlamak için görünümünüzü değiştirirsiniz. Doğal arazide siper olmadan veya Gizlenmiş durumda bulunmadan da Saklanabilir ve Sessizce İlerleyebilirsiniz.
  prerequisites:
  - text: "Gizlilik becerisinde usta"

omen://feat/canny-acumen?source=paizo-pathfinder-player-core:
  name: Kurnaz Sezgi
  description: Kaçınma veya gözlem kabiliyetiniz mesleğinizdekilerin çoğunun kavrayışının ötesindedir. Dayanıklılık kurtarışları, Refleks kurtarışları, İrade kurtarışları veya Dikkat arasından birini seçin. Seçiminizde uzman olursunuz. 17. seviyede seçiminizde usta olursunuz.

omen://feat/cantrip-expansion?source=paizo-pathfinder-player-core:
  name: Kantrip Genişletmesi
  description: >
    Ozan, Kahin, Sorcerer: Çalışma, basit büyülerden oluşan yelpazenizi genişletir.
    Rahip: Daha geniş bir basit büyü yelpazesi üzerinde çalışırsınız.
    Magus, Wizard: Kapsamlı çalışma, her durum için daha geniş bir basit büyü yelpazesi hazırlamanıza olanak tanır.
    Psychic: Zihninizin başarabileceklerini genişletirsiniz.
    Witch: Haminiz esneklik ve çok yönlülük ihtiyacınızı kabul eder ve size daha geniş bir basit büyü yelpazesi hazırlama gücü bahşeder.
    Hazırlıklı: Her gün fazladan iki kantrip hazırlayabilirsiniz.
    Spontane: Büyü listenizden iki ilave kantripi repertuarınıza eklersiniz.

omen://feat/cast-down?source=paizo-pathfinder-player-core:
  name: Yere Çarp
  description: İnancınızın katıksız gücü bir düşmanı yere serebilir. Kullandığınız bir sonraki eylem tek bir yaratığa hasar vermek için Zarar Ver veya İyileştir yapmaksa, hedef büyüden herhangi bir hasar alırsa Yüzüstü yere devrilir. Hedef büyüye karşı kurtarışında kritik başarısız olursa, ayrıca 1 dakika boyunca Hızına –10 fit statü cezası alır.
  prerequisites:
  - text: "zararlı pınar veya şifalı pınar"

omen://feat/castigating-weapon?source=paizo-pathfinder-player-core:
  name: Azarlayan Silah
  description: İlahınızın azarlamasının gücü, düşmanı ve müttefiklerini alt edebilmeniz için bedeninizi güçlendirir. İlahi Azap nedeniyle ruh hasarı verdikten sonra, silahınız veya silahsız Vuruşlarınız mübarek ya da şerli özelliğinizi kazanır ve sıranızın sonuna kadar fazladan ruh hasarı verir. Ruh hasarı, onunla ruh hasarı verdiğiniz zarar ver veya iyileştir büyüsünün derecesine eşittir ve silahın zaten verdiği herhangi bir ruh hasarına (mübarek rün gibi) ilavedir.
  prerequisites:
  - text: "İlahi Azap"

omen://feat/cat-fall?source=paizo-pathfinder-player-core:
  name: Kedi Düşüşü
  description: Kediye özgü havada akrobasiniz düşüşlerinizi yumuşatmanızı sağlar. Düşüşleri 10 fit daha kısa kabul edin. Akrobasi konusunda uzmansanız düşüşleri 25 fit daha kısa, ustaysanız 50 fit daha kısa kabul edin. Akrobasi konusunda efsaneviyseniz düşüşün mesafesine bakılmaksızın her zaman ayaklarınızın üstüne düşersiniz ve hasar almazsınız.
  prerequisites:
  - text: "Akrobasi becerisinde eğitimli"

omen://feat/cauldron?source=paizo-pathfinder-player-core:
  name: Kazan
  description: >
    Kazanınızda büyü demleyebilir, faydalı büyüsel karışımlar yaratabilirsiniz. Yağlar ve iksirler yaratmak için Zanaat aktivitesini kullanabilirsiniz. Dört yaygın 1. seviye yağ veya iksirin formüllerini derhal kazanırsınız. 4. seviyede ve bundan sonraki her 2 seviyede bir, o seviyede veya daha düşük yaygın bir yağ veya iksirin formülünü kazanırsınız (4. seviyedeyseniz 4. seviye bir iksir, 6. seviyedeyseniz 6. seviye bir iksir vb.). Bir ruhdaş hayvanınız varsa, bu formülleri bir formül kitabında saklamak yerine ruhdaş hayvanınızın öğrenmesini sağlayabilirsiniz. Ruhdaş Hayvanınız yeni formülleri tıpkı yeni büyüleri öğrendiği gibi öğrenebilir ve bu formüller, öldürülen bir ruhdaş hayvandan yeni bir ruhdaş hayvana büyülerle aynı şekilde aktarılır.
    Günlük hazırlıklarınız sırasında bildiğiniz bir formülü kullanarak geçici bir yağ veya iksir yaratabilirsiniz. Büyü ZD'sinde usta yetkinliğe sahipseniz günlük hazırlıklarınız sırasında iki geçici yağ veya iksirden oluşan bir parti, efsanevi yetkinliğe sahipseniz üçlük bir parti yaratabilirsiniz. Bu yolla yarattığınız tüm eşyalar, bir sonraki günlük hazırlıklarınızı yaptığınızda etkisiz sıvı şişelerine dönüşür ve geçici eşyaların kalan tüm etkileri sona erer. Geçici bir yağ veya iksirin hiçbir değeri yoktur.

omen://feat/cautious-curiosity?source=paizo-pathfinder-player-core:
  name: Temkinli Merak
  description: Fark edilmeden belaya girip beladan kurtulmak için birkaç büyüsel teknik öğrendiniz. Büyü Gizle ve Sessizlik büyülerini 2. derece mistik veya okült özgü büyüler olarak kazanırsınız. Bu büyülerin geleneği, gnom soy seçenekleriniz için kullandığınız gelenekle eşleşmelidir. Her büyüyü günde bir kez yapabilirsiniz ve yalnızca kendinizi hedef alabilirsiniz.
  prerequisites:
  - text: "gnom mirasından veya gnom soy hünerinden kazanılmış en az bir mistik ya da okült özgü büyü"

omen://feat/cave-climber?source=paizo-pathfinder-player-core:
  name: Mağara Tırmanıcısı
  description: Yıllarca mağaralarda tırmandıktan sonra gittiğiniz her yerde kolayca tırmanabilirsiniz. 10 fit tırmanma Hızı kazanırsınız.

omen://feat/ceaseless-shadows?source=paizo-pathfinder-player-core:
  name: Bitimsiz Gölgeler
  description: "Özellikle kalabalık arasında fark edilmemekte üstünüze yoktur. Saklanmak veya Sessizce İlerlemek için artık sipere sahip olmanız veya Gizlenmiş durumda bulunmanız gerekmez. Bir yaratıktan az siper alacak olsaydınız bunun yerine standart siper alırsınız ve Siper Alebilirsiniz; bir yaratıktan standart siper alacak olsaydınız bunun yerine büyük siper kazanırsınız."
  prerequisites:
  - text: "Dikkat Dağıtıcı Gölgeler"

omen://feat/celestial-magic?source=paizo-pathfinder-player-core:
  name: Celestial Büyüsü
  description: >
    Celestial büyüsüne sahipsiniz. Şu büyülerden ikisini seçin: Berrak Zihin, Sönmeyen Işık, İnsansı Form, Açığa Çıkaran Işık, Yaşam Paylaş veya Sağlam Basış. Seçilen büyülerin her birini günde bir kez 2. derece ilahi özgü büyü olarak kullanabilirsiniz.
    Meleksoylular genellikle berrak zihin ve insansı form alır; yasagetirenler genellikle sönmeyen ışık ve yaşam paylaş alır; ilhamla dokunulmuşlar ise genellikle açığa çıkaran ışık ve sağlam basış alır.
  prerequisites:
  - text: "Meleksoylu, Yasagetiren, İlhamla Dokunulmuş veya Celestial'larla ilişkili başka bir kalıtsal hüner"

omen://feat/celestial-mercy?source=paizo-pathfinder-player-core:
  name: Celestial Merhameti
  description: Celestial güçleriniz daha hafif illetleri kolaylıkla gidermenizi sağlar. İlleti Temizle büyüsünü günde iki kez 4. derece ilahi özgü büyü olarak yapabilirsiniz.
  prerequisites:
  - text: "Meleksoylu, Yasagetiren, İlhamla Dokunulmuş veya Celestial'larla ilişkili başka bir kalıtsal hüner"

omen://feat/ceremonial-knife?source=paizo-pathfinder-player-core:
  name: Tören Bıçağı
  description: >
    Büyü yaparken enerjileri yönlendirmek için özel bir bıçak hazırladınız. Günlük hazırlıklarınız sırasında siz ve tanıdığınız bıçak grubundaki bir silah üzerinde—genellikle bir hançer—kısa bir ritüel gerçekleştirebilirsiniz. Bu, bıçağın tanıdığınızın bildiği herhangi bir 1. derece büyüyü içeren büyüsel bir asa gibi işlev görmesini sağlar. Bir asa için normal olduğu gibi, içindeki Büyüyü Yapmak için bıçağı yalnızca siz Etkinleştirebilirsiniz. Bıçağı aşırı yüklemeyi deneyebilirsiniz; bu, normal olduğu gibi bıçağı kırabilir veya yok edebilir. Aynı anda yalnızca bir tören bıçağına sahip olabilirsiniz.
    8. seviyede ve sonrasındaki her 2 seviyede bir, tören bıçağınızın tutabileceği azami büyü derecesi 1 artar.

omen://feat/certain-strike?source=paizo-pathfinder-player-core:
  name: Kesin Vuruş
  description: Tam isabetle vuramadığınızda bile sıyırıcı bir darbe indirebilirsiniz. Bir yakın dövüş Vuruşu yapın. Aşağıdaki başarısızlık etkisini kazanır.

omen://feat/changeling-lore?source=paizo-pathfinder-player-core:
  name: Değişen İlimi
  description: >
    Gerçek doğanızın gayet farkında olarak, kocakarıları ve güçlerini incelediniz. Aldatma ve Okültizm becerilerinde eğitimli yetkinlik derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak eğitimli olacaksanız (örneğin geçmişinizden veya sınıfınızdan), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz.
    Ayrıca Kocakarı İlimi için Ek İlim genel hünerini kazanırsınız.

omen://feat/channel-smite?source=paizo-pathfinder-player-core:
  name: Kanal Darbesi
  description: >
    Bedel Bir Zarar Ver veya İyileştir büyüsü harcayın.
    Yaşam ve ölüm enerjilerini bir yakın dövüş saldırısıyla düşmanınıza aktarırsınız. Bir yakın dövüş Vuruşu yapın. İsabet durumunda, Vuruşunuzdan gelen normal hasara ek olarak hedefe hasar vermek için harcanan büyünün 1 eylemli versiyonunu yaparsınız. Hedef kurtarışta otomatik olarak başarısızlık alır (veya Vuruşunuz kritik vuruş olduysa kritik başarısızlık). Büyü bu şekilde yapıldığında manipülasyon özelliğine sahip değildir.
    Vuruşunuz başarısız olursa veya o enerji türünden zarar görmeyen bir yaratığa vurursa (örneğin bir hortlak olmayan yaratığa iyileştir büyüsüyle vurmanız gibi) büyü hiçbir etki olmadan harcanır.

omen://feat/channeling-block?source=paizo-pathfinder-player-core:
  name: Kanallı Engelleme
  description: Çaresiz bir engellemeye ilahi enerji aktarırsınız. Kalkanla Engelleme yaptığınızda, bir Zarar Ver veya İyileştir büyüsü harcayabilirsiniz. Büyünün her derecesi için 1d8 atın ve bu engelleme için kalkanın Sertliğini toplam kadar artırın.
  prerequisites:
  - text: "Kalkanla Engelleme"

omen://feat/charming-liar?source=paizo-pathfinder-player-core:
  name: Sevimli Yalancı
  description: Cazibeniz yalan söylediğiniz kişileri kazanmanızı sağlar. Yalan Söyle eylemini kullanarak kritik bir başarı elde ettiğinizde, tıpkı Diplomasi kullanarak İzlenim Bırakmada başarılı olmuşsunuz gibi hedefin size karşı tutumu bir basamak iyileşir. Bu, konuşma başına yalnızca bir kez işe yarar ve aynı sonucu kullanarak birden fazla hedefe karşı kritik başarı elde ederseniz tutumu iyileşecek bir yaratık seçersiniz. Önemsiz veya alakasız yalanların başaramayacağı şekilde, görünüşte önemli bilgiler vermek, statünüzü şişirmek veya kendinizi sevdirmek için yalan söylüyor olmalısınız.
  prerequisites:
  - text: "Aldatma becerisinde eğitimli"

omen://feat/city-scavenger?source=paizo-pathfinder-player-core:
  name: Şehir Yağmacısı
  description: >
    En büyük hazinelerin genellikle çöp gibi göründüğünü bilirsiniz. Barınmak için yapılan testlere +1 durumsal bonusu kazanırsınız ve bir yerleşim yerinde Barındığınızda Sosyoloji veya Hayatta Kalma becerisini kullanabilirsiniz.
    Bir şehirde Barındığınızda, aptal uzunbacaklıların çöpe attığı değerli hurdaları da toplarsınız. Herhangi bir ilave boş zaman harcamaksızın, Barınırken aynı zamanda Sosyoloji veya Hayatta Kalma kullanarak Gelir Elde Edebilirsiniz. Bu teste de +1 durumsal bonusu kazanırsınız.

omen://feat/clever-counterspell?source=paizo-pathfinder-player-core:
  name: Zekice Büyü Bozumu
  description: "Rakiplerinizin büyülerinin çok daha geniş bir çeşitliliğini Bozmak için hazırladığınız büyüleri yaratıcı bir şekilde uygularsınız. Bir düşmanın büyüsünü yalnızca aynı büyüyü hazırlamışsanız Büyü Bozumu ile bozabilmek yerine, düşmanın yaptığı büyü büyü kitabınızda olduğu sürece Büyü Bozumu hünerini kullanabilirsiniz. Büyü Bozumu'nu bu şekilde kullandığınızda yine de hazırlanmış bir büyü harcamanız gerekir; harcadığınız hazırlanmış büyü tetikleyen büyü ile konsantrasyon, manipülasyon veya gelenek özelliği dışındaki bir özelliği paylaşmalıdır. GM bunun yerine karşıt bir özelliğe sahip olan veya mantıksal olarak tetikleyen büyüyü karşılayacak bir büyü kullanmanıza izin verebilir (örneğin Ateş Topu büyüsünü karşılamak için bir soğuk ya da su büyüsü kullanmak veya bir korku büyüsünü karşılamak için Berrak Zihin kullanmak gibi)."
  prerequisites:
  - text: "Büyü Bozumu"
  - text: "Hızlı Tanıma"

omen://feat/clever-gambit?source=paizo-pathfinder-player-core:
  name: Zekice Hamle
  description: "Savaş taktiklerinize düşmanınızın kabiliyetlerini ve menzilini değerlendirmek yardımcı olur. Adım atar veya Depar atarsınız; bu hareket tetikleyen yaratıktan gelen reaksiyonları tetiklemez."
  prerequisites:
  - text: "elebaşı düzeni"

omen://feat/clever-improviser?source=paizo-pathfinder-player-core:
  name: Becerikli Doğaçlamacı
  description: Boyunuzu aşan durumlarla nasıl başa çıkacağınızı öğrendiniz. Eğitimsiz Doğaçlama genel hünerini kazanırsınız. Ayrıca, eğitimsiz olsanız bile normalde eğitimli olmanızı gerektiren beceri eylemlerini deneyebilirsiniz.

omen://feat/cling?source=paizo-pathfinder-player-core:
  name: Yapışma
  description: Bir düşmana yapışarak onu pes ettirene kadar rahatsız edersiniz. Siz ona yapışmışken hedefiniz hareket ederse, hedefle birlikte hareket etmeyi seçebilirsiniz. Hedefle birlikte hareket etmemeyi seçerseniz, bir sonraki sıranızın başında veya hedef Kaçtığında hedef serbest kalır. Yapışma'dan Kaçma girişimleri Akrobasi ZD'nize karşı yapılır, ancak Kaç eyleminin normalde sonlandırdığı durumlar yerine Yapışma'yı sonlandırır.

omen://feat/cloak-of-poison?source=paizo-pathfinder-player-core:
  name: Zehir Pelerini
  description: "Size saldırmaya cüret eden herkese zarar veren yoğunlaştırılmış bir zehir pelerini salgılarsınız. 1 dakika boyunca, size dokunan veya silahsız bir saldırı ya da erişim özelliği olmayan yakın dövüş silahıyla size hasar veren herhangi bir yaratık 3d6[poison] hasar alır."

omen://feat/cloud-jump?source=paizo-pathfinder-player-core:
  name: Bulut Sıçrayışı
  description: >
    Emsalsiz atletik beceriniz imkânsız mesafeleri atlamanızı sağlar. Başarılı bir Uzun Atlama ile atladığınız mesafeyi üçe katlayın (böylece 30 Atletizm sonucu ile 90 fit atlayabilirsiniz). Başarılı bir Yüksek Atlama yaptığınızda, bir Uzun Atlama için atlanan mesafeyi ve mesafe sınırını kullanın ancak mesafeyi üçe katlamayın.
    Uzun Atlama veya Yüksek Atlama yaparken ek eylemler harcayarak Hızınızdan daha büyük bir mesafeye atlayabilirsiniz. Harcanan her ek eylem için mesafe sınırına Hızınızı ekleyin.
  prerequisites:
  - text: "Atletizm becerisinde efsanevi"

omen://feat/cloud-step?source=paizo-pathfinder-player-core:
  name: Bulut Adımı
  description: Olağanüstü akrobatik becerinizi kullanarak maddesel olmayan yüzeylerde kısa mesafeler boyunca yürüyebilirsiniz. Depar attığınızda, suyun, havanın ve yalnızca sınırlı ağırlık taşıyabilen katı yüzeylerin üzerinde sanki normal zeminmiş gibi hareket edebilirsiniz. Ağırlığa duyarlı baskı plakasına sahip bir tuzağın üzerinden Depar atarsanız onu tetiklemezsiniz. Sıranızın sonunda, mevcut konumunuz için normal olduğu gibi batar, düşer, kırılgan yüzeyleri kırar veya tuzakları tetiklersiniz.
  prerequisites:
  - text: "Akrobasi becerisinde efsanevi"

omen://feat/cognitive-loophole?source=paizo-pathfinder-player-core:
  name: Bilişsel Boşluk
  description: Zihinsel bir etkinin üstesinden geçici olarak gelmek için onda bir açık kapı bulabilirsiniz. Bir sonraki sıranızın sonuna kadar tek bir zihinsel etkiyi yok sayarsınız. Bilişsel Boşluk kullanarak belirli bir etkiyi yalnızca bir kez bastırabilirsiniz. Bilişsel Boşluk hünerini sizi etkilemesini bizzat seçtiğiniz bir etkiyi bastırmak için kullanamazsınız.

omen://feat/combat-assessment?source=paizo-pathfinder-player-core:
  name: Muharebe Değerlendirmesi
  description: Düşmanınız hakkında bilgi edinmek için niyetinizi açık eden bir vuruş yaparsınız. Bir yakın dövüş Vuruşu yapın. İsabet durumunda, hedef hakkında derhal Bilgi Hatırla testi deneyebilirsiniz. Kritik vuruş durumunda, Bilgi Hatırla testine +2 durumsal bonusu kazanırsınız. Hedef 1 gün boyunca Muharebe Değerlendirmesi'ne geçici olarak bağışık hale gelir.

omen://feat/combat-climber?source=paizo-pathfinder-player-core:
  name: Muharebe Tırmanıcısı
  description: Teknikleriniz tırmanırken dövüşmenize olanak tanır. Tırmanırken Gafil kalmazsınız ve bir eliniz doluyken de Tırmanabilirsiniz. Tırmanmak için yine de diğer elinizi ve her iki bacağınızı kullanmanız gerekir.
  prerequisites:
  - text: "Atletizm becerisinde eğitimli"

omen://feat/combat-grab?source=paizo-pathfinder-player-core:
  name: Muharebe Kavraması
  description: Rakibinizin gardını düşürmek için önceki saldırınızı kullanarak bir vuruş daha yapar ve onu yakalarsınız. Bir elinizi boş tutarak bir yakın dövüş Vuruşu yapın. Vuruş isabet ederse, boş elinizi kullanarak hedefi kavrarsınız. Yaratık, hangisi önce gelirse bir sonraki sıranızın sonuna kadar veya Kaçana kadar Kavranmış olarak kalır.

omen://feat/combat-reading?source=paizo-pathfinder-player-core:
  name: Muharebe Okuması
  description: Düşmanınızın güçlü ve zayıf yönlerini keşfetmek için bir göstericinin soğuk okuma tekniklerini, aura okumasını ve diğer hileleri kullanırsınız. GM, sizden Gizlenmemiş, sizden Gizlenmiş olmayan veya sizin tarafınızdan Fark Edilmemiş ve çatışmaya dahil olan seçtiğiniz bir düşmanın Aldatma ya da Gizlilik ZD'sine karşı (hangisi daha yüksekse) sizin adınıza gizli bir Okültizm testi atar. GM sizinle düşman arasındaki mesafe için bir ceza uygulayabilir. Düşman daha sonra 1 gün boyunca Muharebe Okumanıza karşı geçici olarak bağışık hale gelir.

omen://feat/communal-crafting?source=paizo-pathfinder-player-core:
  name: İmece Zanaat
  description: "Yönlendirmeniz altında diğer oyuncu karakterlerinin bir eşyayı Üretmenize yardım etmesini sağlayabilirsiniz. Yardımcı bir oyuncu karakteri, eğitimli olduğu bir beceriyle test atar. GM tarafından belirlendiği üzere bu beceri Zanaat veya eşyayla ilgili başka bir beceri olmalıdır. Örneğin bir oyuncu karakteri, ilahi özelliğe sahip bir eşyayı Üretmenize yardım etmek için Din becerisini veya bir silah Üretmenize yardım etmek için Savaş İlimi becerisini kullanabilir. Eşyayı başarıyla yaratıp yaratmadığınızı yine sizin zarınız belirler. Herhangi bir yardımcının zarı, Gelir Elde Et tablosundaki sayıları kullanarak hammadde maliyetini düşürmeye katkıda bulunur; bu, müttefik oyuncu karakterinin becerideki yetkinlik derecesini ve seviyesi için karakter seviyesi – 1'i kullanır. Yardım eden oyuncu karakterleri Zanaat aktivitesi boyunca size eşlik etmelidir (bu onların diğer boş zaman aktivitelerini yürütmesini engeller), aksi takdirde fayda kaybolur. GM koşullara bağlı olarak yalnızca belirli sayıda oyuncu karakterinin yardım edebileceğine karar verebilir. İmece Zanaat ayrıca, başkası zanaat yaparken yardımınızı kabul etmesi koşuluyla bir yardımcı rolü üstlenmenize de olanak tanır."
  prerequisites:
  - text: "Zanaat becerisinde uzman"

omen://feat/communal-healing?source=paizo-pathfinder-player-core:
  name: Toplu Şifa
  description: Canlılık için olağanüstü bir kanalsınız ve onu içinizden akıtırken bir kısmını kendinizi veya başka bir yaratığı iyileştirmek için yönlendirebilirsiniz. Tek bir yaratığı iyileştirmek için İyileştir büyüsünü yaptığınızda, iyileştir büyünüzün menzili içindeki başka bir gönüllü yaşayan yaratığın iyileştir büyüsünün derecesine eşit miktarda Can Puanı geri kazanmasını sağlayın.

omen://feat/companions-cry?source=paizo-pathfinder-player-core:
  name: Yoldaşın Çağrısı
  description: Yoldaşınızı elinden gelenin en iyisini yapmaya teşvik edebilirsiniz. Yoldaş Hayvanınıza emir verirken Hayvana Emret eylemi için 1 yerine 2 eylem harcayabilirsiniz. Bunu yaparsanız yoldaş hayvanınız fazladan bir eylem kullanır.
  prerequisites:
  - text: "bir yoldaş hayvan"

omen://feat/conceal-spell?source=paizo-pathfinder-player-core:
  name: Büyüyü Gizle
  description: >
    Animist Ruhların duyulmayan sesiyle konuşursunuz.
    Necromancer Büyülerinizin büyüsel enerjilerini ve parametrelerini tam bir konsantrasyonla şekillendirerek, büyü yapmak için gereken sözleri ve hareketleri neredeyse fark edilmeyecek hale getirebilirsiniz.
    Witch Katıksız bir zihinsel çabayla, büyü yapmak için gereken sözleri ve hareketleri neredeyse fark edilmeyecek hale getirebilirsiniz.
    Wizard Büyülerinizin büyüsel enerjilerini ve parametrelerini tam bir konsantrasyonla tamamen kafanızda şekillendirerek, büyü yapmak için gereken sözleri ve hareketleri neredeyse fark edilmeyecek hale getirebilirsiniz.
    Kullandığınız bir sonraki eylem Büyü Yapmak ise, büyü göze çarpmayan özelliğini kazanarak büyü yaptığınızı normalde ele veren parıldayan rünleri, büyü kıvılcımlarını ve diğer tezahürleri gizler. Bu özellik yalnızca büyünün büyü yapma eylemlerini ve tezahürlerini gizler, etkilerini değil; bu nedenle bir gözlemci sizden bir ışının fırladığını veya havada yok olduğunuzu yine de görebilir.

omen://feat/confabulator?source=paizo-pathfinder-player-core:
  name: Usta Masalcı
  description: "Yalanlarınız yakalandığında bile yalan üstüne yalan yığarsınız. Bir hedefin daha önce ona karşı Dikkat Dağıtma veya Yalan Söyleme girişimlerinizden kazandığı durumsal bonusunu +4'ten +2'ye düşürün. Aldatma konusunda ustaysanız bonusu +1'e düşürün; efsaneviyseniz hedefleriniz bu bonusları hiç almaz."
  prerequisites:
  - text: "Aldatma becerisinde uzman"

omen://feat/continual-recovery?source=paizo-pathfinder-player-core:
  name: Kesintisiz İyileşme
  description: Tedaviyi daha hızlı uygulamak için bir hastanın durumunu gayretle izlersiniz. Yaraları Tedavi Ettiğinizde, hastanız 1 saat yerine yalnızca 10 dakika boyunca bağışık kalır. Bu yalnızca sizin Yaraları Tedavi Et aktiviteleriniz için geçerlidir, hastanın başkalarından aldığı tedaviler için değil.
  prerequisites:
  - text: "Tıp becerisinde uzman"

omen://feat/convincing-illusion?source=paizo-pathfinder-player-core:
  name: İkna Edici İllüzyon
  description: "İllüzyonlarınızın daha da gerçek görünmesini sağlamak için aldatma becerilerinizi kullanırsınız. Hedefin Dikkat ZD'sine karşı bir deception|defense:perception testi deneyin. Başarılı olursanız hedef illüzyona inanmamakta başarısız olur."
  prerequisites:
  - text: "Aldatma becerisinde uzman"

omen://feat/cooperative-nature?source=paizo-pathfinder-player-core:
  name: Dayanışmacı Doğa
  description: "Kısa insan ömrü olaylara geniş bir bakış açısı kazandırır; küçük yaşlardan itibaren farklılıkları bir kenara bırakmayı ve büyüklüğe ulaşmak için başkalarıyla birlikte çalışmayı öğretmiştir. Yardım Etme testlerinde +4 durumsal bonusu kazanırsınız."

omen://feat/cooperative-soul?source=paizo-pathfinder-player-core:
  name: Dayanışmacı Ruh
  description: Yoldaşlarınızla ruhunuza işleyen bir bağ geliştirdiniz ve onlarla daha da yüksek düzeyde bir iş birliği sürdürürsünüz. Yardım Ettiğiniz beceride en azından uzmansanız, bir beceri testine Yardım Etmek için başarısızlık veya kritik başarısızlık attığınızda bunun yerine başarı elde edersiniz.

omen://feat/counterspell-prepared?source=paizo-pathfinder-player-core:
  name: Büyü Bozumu (Hazırlıklı)
  description: Bir düşman Büyü Yaptığında ve siz onun tezahürlerini görebildiğinizde, onu engellemek için büyünüzü kullanabilirsiniz. Tetikleyen yaratığın aynı büyüyü yapmasını karşılamak için hazırlanmış bir büyüyü harcarsınız. Tetikleyen büyüyü kendiniz yapmışsınız gibi büyü slotunuzu kaybedersiniz. Ardından tetikleyen büyüyü etkisizleştirmeyi denersiniz.

omen://feat/courageous-advance?source=paizo-pathfinder-player-core:
  name: Cesur İlerleme
  description: Coşkulu bir çağrıyla bir müttefiki ilerlemeye teşvik edersiniz. Bir sonraki eyleminiz Cesaret Marşı beste kantripini yapmaksa, büyüden bir statü bonusu kazanan seçtiğiniz bir müttefik, derhal reaksiyonunu kullanarak Depar atabilir.
  prerequisites:
  - text: "savaşçı ilham perisi"

omen://feat/courageous-assault?source=paizo-pathfinder-player-core:
  name: Cesur Taarruz
  description: Kudretli bir haykırışla bir müttefiki saldırmaya teşvik edebilirsiniz. Bir sonraki eyleminiz Cesaret Marşı beste kantripini yapmaksa, büyüden bir statü bonusu kazanan seçtiğiniz bir müttefik, derhal reaksiyonunu kullanarak bir yakın dövüş Vuruşu yapabilir.
  prerequisites:
  - text: "savaşçı ilham perisi"

omen://feat/courageous-onslaught?source=paizo-pathfinder-player-core:
  name: Cesur Hücum
  description: Düşmanlarınıza karşı bir hücumu organize etmek için performansınızı kullanırsınız. Bir sonraki eyleminiz Cesaret Marşı beste kantripini yapmaksa, büyüden bir statü bonusu kazanan seçtiğiniz bir müttefik, derhal reaksiyonunu kullanarak Depar atabilir ve ardından bir yakın dövüş Vuruşu yapabilir.
  prerequisites:
  - text: "Cesur İlerleme"
  - text: "Cesur Taarruz"

omen://feat/courtly-graces?source=paizo-pathfinder-player-core:
  name: Saray Nezaketi
  description: "Soylular arasında büyüdünüz ya da uygun görgü ve duruş kurallarını öğrendiniz; bu da kendinizi bir soylu gibi takdim etmenize, nüfuz ve politika oyunları oynamanıza olanak tanır. Kasıtlı olarak kendinizi farklı tanıtmadığınız sürece, sizinle konuşan herkes sizin bir soylu veya soylularla yakın ilişkisi olan biri (örneğin önde gelen bir hizmetkâr) olduğunuzu varsayar. Bir soylu üzerinde İzlenim Bırakmak için Sosyoloji becerisini kullanabileceğiniz gibi, belirli bir tür soylu veya belirli bir bireysel soylu gibi görünmek için Kılığına Gir eylemiyle de Sosyoloji becerisini kullanabilirsiniz. Bu durumlarda normal becerileri kullanırsanız, bunun yerine teste +1 durumsal bonusu alırsınız."
  prerequisites:
  - text: "Sosyoloji becerisinde eğitimli"

omen://feat/coven-spell?source=paizo-pathfinder-player-core:
  name: Meclis Büyüsü
  description: "Müttefikinizin büyü sözleriyle kafiye yapar veya hareketlerini yankılarsınız; büyüsünü iki yoldan biriyle güçlendirmek için büyünüzü birbirine bağlarsınız: • Büyüsü hasar veriyorsa ve bir süreye sahip değilse, o büyüye derecesine eşit miktarda hasara bir statü bonusu verirsiniz. • Büyüsüne uygulanmış bir büyübiçim etkisi yoksa, bildiğiniz herhangi bir büyübiçim hünerinin etkilerini büyüye uygularsınız. Büyübiçim hüneri tetikleyen büyüye uygulanabilen bir hüner olmalı ve onu kullanabiliyor olmalısınız (örneğin, büyübiçim hüneri günde yalnızca sınırlı sayıda kullanılabiliyorsa)."

omen://feat/craft-anything?source=paizo-pathfinder-player-core:
  name: Her Şeyi Üret
  description: Kısıtlamalara rağmen neredeyse her şeyi üretmenin yollarını bulabilirsiniz. Uygun Zanaat beceri hünerine sahip olduğunuz (büyülü eşyalar için Büyülü Zanaat gibi) ve eşyanın seviye ile yetkinlik gereksinimlerini karşıladığınız sürece, belirli bir soydan olmak veya büyü sağlamak gibi neredeyse diğer tüm gereksinimleri yok sayarsınız. Bir gereksinim eşyanın maliyetini artırıyorsa, bunu yine de ödemelisiniz (kendi başına bir maliyeti olan büyülerin yapılması dahil). Eserler gibi özel erişim ve Üretim yollarına sahip özel eşyaların gereksinimlerini yok sayamazsınız. Bir gereksinimi yok sayıp sayamayacağınıza GM karar verir.
  prerequisites:
  - text: "Zanaat becerisinde efsanevi"

omen://feat/crashing-slam?source=paizo-pathfinder-player-core:
  name: Şiddetli Çarpma
  description: >
    Düşmanınızı tek bir darbeyle yere serebilirsiniz. Yere Çalma ile yaptığınız Vuruş isabet ederse, test atmak yerine Çelme Takma eyleminizde otomatik olarak kritik bir başarı elde edebilirsiniz. (Hem Vuruş hem de Çelme Takma yine de çoklu saldırı cezanıza dahil edilir).
    Vuruş için iki elli bir yakın dövüş silahı kullandıysanız, kritik bir Çelme Takma hasarı için normal zar boyutu yerine silahın hasar zarı boyutunu kullanabilirsiniz.
  prerequisites:
  - text: "Yere Çalma"

omen://feat/cremate-undead?source=paizo-pathfinder-player-core:
  name: Hortlak Kül Et
  description: Ezici canlılığınız hortlakları ateşe verir. Hortlaklara hasar vermek için bir İyileştir büyüsü kullandığınızda, hasar alan her hortlak ayrıca büyünün derecesine eşit miktarda süren yangın hasarı alır.

omen://feat/critical-debilitation?source=paizo-pathfinder-player-core:
  name: Kritik Güçten Düşürme
  description: Güçten düşürmeleriniz en güçlü saldırılarınızda özellikle etkilidir. Bir düşmana karşı saldırı zarında ne zaman kritik başarı elde edip Güçten Düşürücü Vuruş kullansanız, seçebileceğiniz listeye aşağıdaki güçten düşürmeyi eklersiniz.
  prerequisites:
  - text: "Güçten Düşürücü Vuruş"

omen://feat/crossbow-ace?source=paizo-pathfinder-player-core:
  name: Tatar Yayı Ası
  description: "Tatar yayına dair derin anlayışınız, karşı ateş hattından çıkarken verimli bir şekilde yeniden doldurmanızı sağlar. Ya Dikkat Dağıtın ya da Siper Alın, ardından yeniden doldurmak için Etkileşime Girin. Normal olduğu gibi, Siper Alma gereksinimlerini karşılamalısınız; Yüzüstü olmalı, siperden faydalanıyor olmalı veya Siper Almanıza izin veren bir unsurun yakınında bulunmalısınız."

omen://feat/cultural-adaptability?source=paizo-pathfinder-player-core:
  name: Kültürel Uyum
  description: Maceralarınız sırasında etrafınızdaki baskın soyun kültürüne uyum sağlama yeteneğinizi geliştirdiniz. Benimsenmiş Soy genel hünerini kazanırsınız ve ayrıca Benimsenmiş Soy hüneri için seçtiğiniz soydan bir 1. seviye soy hüneri kazanırsınız.

omen://feat/current-spell?source=paizo-pathfinder-player-core:
  name: Akıntı Büyüsü
  description: Hava veya suyu yönlendirmek için büyünüzü kullanırken, etrafınızda bir bariyer oluşturmak için onun akıntılarının bir kısmını döndürürsünüz. Bir sonraki eyleminiz hava veya su özelliğine sahip bir Büyü Yapmaksa, bir sonraki sıranızın başlangıcına kadar SD'nize +1 durumsal bonusu veya menzilli saldırılara karşı +2 durumsal bonusu kazanırsınız. Bu etki yaptığınız büyünün özelliklerine bağlı olarak hava veya su özelliğine ya da her ikisine birden sahiptir. Ayrıca büyünün özelliklerine bağlı olarak bir sonraki sıranızın başlangıcına kadar hava özelliği, su özelliği veya her ikisine birden sahip etkilere karşı tüm kurtarışlara +1 durumsal bonusu kazanırsınız.

omen://feat/cut-from-the-air?source=paizo-pathfinder-player-core:
  name: Havada Kes
  description: Menzilli saldırıları savuşturabilirsiniz. Tetikleyen saldırıya karşı SD'nize +4 durumsal bonusu kazanırsınız. Vuruş ıskalarsa, onu havada savurmuş veya kesmişsinizdir.

omen://feat/dance-underfoot?source=paizo-pathfinder-player-core:
  name: Ayaklar Altında Dans
  description: Muharebede düşmanlarınızın bacakları arasından fırlarsınız. Başarılı bir Sıyrılıp Geçma eylemini Büyük veya daha büyük bir düşmanın alanında sonlandırabilirsiniz. Ayrıca Kıvrak Adım hünerini kullanırken tetikleyen düşmanın alanına Adım atabilirsiniz. GM tarafından belirlendiği üzere, düşmanın uzuvları olmalı veya bu manevra için size yeterli alan bırakmalıdır. Örneğin bir dev veya ejderha ile aynı alanı paylaşabilirsiniz ancak bir pelte ile paylaşamazsınız.
  prerequisites:
  - text: "Kıvrak Adım"

omen://feat/dashing-strike?source=paizo-pathfinder-player-core:
  name: Atılgan Vuruş
  description: Bir düşmandan sıyrılarak diğerine Vuruş Yaparsınız. Hızınıza kadar Depar atın, ancak bu hareketi farklı bir düşmanın yakın dövüş erişimi içinde sonlandırmalısınız. Hareketinizin sonunda, artık erişiminiz içindeki bir düşmana karşı bir yakın dövüş Vuruşu yapın. İlgili hareket türüne sahipseniz, Depar atmak yerine Kazma, Tırmanma, Uçma veya Yüzme sırasında da Atılgan Vuruş kullanabilirsiniz.

omen://feat/dazing-blow?source=paizo-pathfinder-player-core:
  name: Sersemletici Darbe
  description: "Tuttuğunuz düşmanı sersemletme umuduyla yumruklarsınız. Kavradığınız bir yaratığa yakın dövüş Vuruşu yapın. Bu Vuruştan gelen silah hasarı ezici hasardır. Vuruş isabet ederse yaratık sınıf ZD'nize karşı bir fortitude|against:fighter|traits:incapacitation kurtarışı denemelidir; bu bir etkisizleştirme etkisidir."

omen://feat/deadly-aim?source=paizo-pathfinder-player-core:
  name: Ölümcül Nişan
  description: Avınızın zayıf noktalarına nişan alarak atışınızı daha zorlu hale getirir, ancak isabet ettirirseniz daha fazla hasar verirsiniz. Avlanan avınıza karşı –2 ceza ile menzilli bir Vuruş Yapın. Bu Vuruşta hasara +4 durumsal bonusu kazanırsınız. Bu bonus 11. seviyede +6'ya, 15. seviyede ise +8'e yükselir.
  prerequisites:
  - text: "silah uzmanlaşması"

omen://feat/deadly-simplicity?source=paizo-pathfinder-player-core:
  name: Ölümcül Sadelik
  description: >
    İlahınızın tercih ettiği silahı kullanırken, o silahın hasar zarı boyutunu bir basamak artırın.
    İlahınızın tercih ettiği silah bir silahsız saldırıysa (örneğin Irori'ye tapıyorsanız yumruk gibi) ve hasar zarı d6'dan küçükse, bunun yerine hasar zarı boyutunu d6'ya yükseltin.
  prerequisites:
  - text: "tercih ettiği silahı basit silah veya silahsız saldırı olan bir ilah"
  - text: "ilahınızın tercih ettiği silahta eğitimli"

omen://feat/debilitating-shot?source=paizo-pathfinder-player-core:
  name: Güçten Düşüren Atış
  description: Zayıf bir noktaya nişan alarak hassas bir atışla düşmanınızı engellersiniz. Menzilli bir silahla Vuruş Yapın. İsabet eder ve hasar verirse hedef bir sonraki sırasının sonuna kadar Yavaşlamış 1 olur.

omen://feat/deep-lore?source=paizo-pathfinder-player-core:
  name: Derin İlim
  description: Repertuvarınız geniştir ve normalden çok daha fazla büyü içerir. Yapabildiğiniz her büyü derecesinden repertuvarınıza bir büyü ekleyin.
  prerequisites:
  - text: "muamma ilham perisi"
  - text: "Okültizm becerisinde efsanevi"

omen://feat/defensive-coordination?source=paizo-pathfinder-player-core:
  name: Savunma Koordinasyonu
  description: Ezici zorluklar karşısında direnen destansı kahramanlar gibi, siz ve müttefikleriniz hattı koruyacaksınız. Bir sonraki eyleminiz Toplanma Marşı beste kantripini yapmaksa, Kalkan Kaldırabilirsiniz ve büyüden statü bonusu kazanan seçtiğiniz bir müttefik derhal reaksiyonunu kullanarak Kalkan Kaldırabilir.
  prerequisites:
  - text: "savaşçı ilham perisi"
  - text: "Toplanma Marşı"

omen://feat/defensive-recovery?source=paizo-pathfinder-player-core:
  name: Savunmacı İyileşme
  description: İnancınız iyileşmeye ek olarak geçici koruma sağlar. Kullandığınız bir sonraki eylem tek bir hedefe Zarar Ver veya İyileştir yapmaksa ve hedef büyüden Can Puanı geri kazanırsa, ayrıca 1 tur boyunca SD'ye ve kurtarışlara +2 statü bonusu kazanır.

omen://feat/defensive-roll?source=paizo-pathfinder-player-core:
  name: Savunmacı Yuvarlanma
  description: Darbenin gücünü dağıtmak için yuvarlanarak ölümcül bir saldırıdan kısmen kaçınabilir ve bilincinizi koruyabilirsiniz. Tetikleyen saldırıdan yarı hasar alırsınız.

omen://feat/defy-death?source=paizo-pathfinder-player-core:
  name: Ölüme Meydan Oku
  description: Sizi öldürmek olağanüstü derecede zordur. Toparlanma denemelerinizin ZD'si 9 + ölmekte değerinize, Metanet genel hünerine sahipseniz 8 + ölmekte değerinize eşittir. Ek olarak, birisi sizi normalde bir hafta boyunca takatsiz bırakacak bir büyü kullanarak (Ölüyü Dirilt veya Yeniden Canlandır ritüeli gibi) hayata döndürdüğünde, bu duruma maruz kalmazsınız.
  prerequisites:
  - text: "Ork Vahşeti"

omen://feat/defy-the-darkness?source=paizo-pathfinder-player-core:
  name: Karanlığa Meydan Oku
  description: Büyüsel karanlık kullanan düşmanlarla savaşmak için geliştirilmiş kadim cüce yöntemlerini kullanarak karanlıkta görüşünüzü bilediniz ve bu tür büyüleri kendiniz kullanmamaya yemin ettiniz. Normalde karanlıkta görüşü engelleyen büyüsel karanlıkların bile (4. derece bir Karanlık büyüsünün yarattığı karanlık gibi) arkasını görmenizi sağlayan üstün karanlıkta görüş kazanırsınız. Karanlık özelliğine sahip büyüleri yapamaz, karanlık özelliğine sahip eşya etkinleştirmelerini kullanamaz veya karanlık özelliğine sahip başka herhangi bir yeteneği kullanamazsınız.
  prerequisites:
  - text: "karanlıkta görüş"

omen://feat/deimatic-display?source=paizo-pathfinder-player-core:
  name: Tehditkâr Gösteri
  description: Hayvan tehdit gösterilerini taklit ederek kendinizi daha büyük ve daha heybetli gösterirsiniz. 30 fit içindeki her düşmanın Gözdağı Vermek için bir Gözdağı testi deneyin. Bu girişim görsel özelliğine sahiptir, işitsel özelliğini kaybeder ve yaratık dilinizi anlamıyorsa ceza almazsınız. Testinizi yalnızca bir kez atın ve her hedefin İrade ZD'si ile karşılaştırın. Hayvan, mantar ve bitki yaratıklara karşı teste +2 durumsal bonusu kazanır, diğer yaratıklara karşı –2 durumsal cezası alırsınız. Her hedef daha sonra 1 dakika boyunca geçici olarak bağışık kalır.
  prerequisites:
  - text: "Gözdağı becerisinde eğitimli"

omen://feat/deitys-protection?source=paizo-pathfinder-player-core:
  name: İlahın Koruması
  description: İlahınızın gücünü alanının vaadini yerine getirmek için yardıma çağırdığınızda, ilahi koruma kazanırsınız. Bir alan büyüsü yaptıktan sonra, bir sonraki sıranızın başlangıcına kadar tüm hasarlara karşı direnç kazanırsınız. Direnç miktarı, yaptığınız alan büyüsünün derecesine eşittir.
  prerequisites:
  - text: "İleri Alan"

omen://feat/delay-trap?source=paizo-pathfinder-player-core:
  name: Tuzağı Geciktir
  description: Etkilerini geciktirmek için bir tuzağın mekanizmasını sıkıştırmaya çalışırsınız. Tuzak üzerinde Düzeneği Etkisizleştirmak için eylemin normal sonuçları yerine aşağıdaki sonuçlarla bir Hırsızlık testi deneyin.

omen://feat/desperate-finisher?source=paizo-pathfinder-player-core:
  name: Çaresiz Bitirici Hamle
  description: Her şeyinizi son, pervasız bir baskıya koyarsınız. Bildiğiniz baskı özelliğine sahip tek bir eylemi kullanın. Bir sonraki sıranızın başlangıcına kadar reaksiyonları kullanma yeteneğinizden feragat edersiniz. Bu baskı normal olduğu gibi çoklu saldırı cezanızı kullanır.

omen://feat/determination?source=paizo-pathfinder-player-core:
  name: Kararlılık
  description: >
    Eğitiminiz, durum vahim olduğunda düşmanlarınızın büyülerini ve durumlarını üzerinizden atmanıza olanak tanır. Sizi etkileyen kalıcı olmayan tek bir durum, büyü veya büyüsel etki seçin. Bir durum seçtiyseniz onun sizin üzerinizdeki etkisi sona erer. Bir büyü veya başka bir büyüsel etki seçtiyseniz büyüyü etkisizleştirmeyi deneyin (etkisizleştirme dereceniz seviyenizin yukarı yuvarlanmış yarısına eşittir ve etkisizleştirme testiniz olarak bir İrade kurtarışı denersiniz).
    Bu, büyüden veya durumdan zaten almış olduğunuz herhangi bir Can Puanı hasarını ortadan kaldırmaz ve etkiyi diğer yaratıklardan veya etrafınızdaki çevreden değil, yalnızca sizden kaldırır. Devam eden bir illeti kaldıramaz veya böyle bir illetin daha sonra size durumlar yüklemesini engelleyemez. Durumunuz veya konumlandırmanız nedeniyle otomatik olarak ortaya çıkan durumları (Yüzüstü veya kıstırılmış gibi) kaldıramaz.

omen://feat/diehard?source=paizo-pathfinder-player-core:
  name: Zor Ölür
  description: Sizi öldürmek çoğu kişiden daha fazlasını gerektirir. Ölmekte durumundan ölmekte 4 yerine ölmekte 5'te ölürsünüz.

omen://feat/directed-audience?source=paizo-pathfinder-player-core:
  name: Yönlendirilmiş Kitle
  description: Beste büyülerinizin alanını şekillendirebilirsiniz. Alanı bir yayılım olan bir beste büyüsü yaptığınızda, büyünün alanını orijinal alanın en fazla iki katı olacak şekilde 10 fit daha büyük bir koni olarak değiştirebilirsiniz. Örneğin, bir yayılımı etkileyen bir beste büyüsünü bir koniyi etkileyecek şekilde değiştirebilirsiniz, ancak bir yayılım yalnızca bir koni haline gelebilir.

omen://feat/directed-channel?source=paizo-pathfinder-player-core:
  name: Yönlendirilmiş Kanal
  description: Kanalize ettiğiniz enerjiyi tek bir yönde şekillendirebilirsiniz. Bir alana sahip olan bir Zarar Ver veya İyileştir versiyonunu yaptığınızda, alanını bir yayılım yerine bir koni yapabilirsiniz.

omen://feat/dirge-of-doom?source=paizo-pathfinder-player-core:
  name: Kıyamet Ağıtı
  description: Düşmanlarınızı korkutan ve korkularından tamamen kurtulmalarını engelleyen Kıyamet Ağıtı beste kantripini öğrenirsiniz.

omen://feat/disarming-stance?source=paizo-pathfinder-player-core:
  name: Silahsızlandırıcı Duruş
  description: Silahınız üzerindeki kontrolünüzü artıran bir eskrim duruşu benimsersiniz. Bu duruştayken Silahsızlandırmak için yapılan Atletizm testlerine +1 durumsal bonusu ve sizi Silahsızlandırma testlerine karşı savunurken Refleks ZD'nize +2 durumsal bonusu kazanırsınız. Ayrıca sizden iki boyuta kadar daha büyük yaratıkları Silahsızlandırmayı deneyebilirsiniz.
  prerequisites:
  - text: "Atletizm becerisinde eğitimli"

omen://feat/disarming-twist?source=paizo-pathfinder-player-core:
  name: Silahsızlandırıcı Kıvrılma
  description: İlk saldırınız düşmanınızın savunmasını başka yöne çektikten sonra, devamındaki hamleniz silahını elinden söker alır. Tek elli bir yakın dövüş silahıyla bir yakın dövüş Vuruşu yapın. Diğer etkilerine ek olarak bu Vuruş, Silahsızlandır eyleminin başarı ve kritik başarı etkilerini kazanır. Vuruş ayrıca aşağıdaki başarısızlık etkisine sahiptir.
  prerequisites:
  - text: "Atletizm becerisinde eğitimli"

omen://feat/discordant-voice?source=paizo-pathfinder-player-core:
  name: Ahenksiz Ses
  description: Cesaret Marşınız, müttefiklerinizin saldırılarına güçlü sonik yankılanmalar aşılayan ahenksiz bir çığlık salıverir. Müttefikleriniz cesaret marşınızdan etkilendiği sürece, silah Vuruşları ve silahsız saldırıları fazladan 1d6 sonik hasar verir.
  prerequisites:
  - text: "cesaret marşı"

omen://feat/disorienting-opening?source=paizo-pathfinder-player-core:
  name: Sersemletici Açık
  description: Daha da büyük zaafları açığa çıkarmak için düşmanlarınızın verdiği açıkları kullanırsınız. Reaktif Vuruş'nın bir parçası olarak bir yaratığa vurduğunuzda, o yaratık bir sonraki sıranızın başlangıcına kadar Gafil hale gelir.
  prerequisites:
  - text: "Reaktif Vuruş"

omen://feat/dispelling-slice?source=paizo-pathfinder-player-core:
  name: Büyü Bozan Darbe
  description: Sinsi saldırınız büyüyü bir hedefe bağlayan iplikleri kesip atar. Gafil durumdaki bir yaratığa karşı bir Vuruş Yapın. Vuruşunuz sinsi saldırı hasarı verirse, hedef üzerinde aktif olan seçtiğiniz tek bir büyüyü etkisizleştirmeyi denersiniz. Etkisizleştirme dereceniz seviyenizin yukarı yuvarlanmış yarısına eşittir ve etkisizleştirme testi belirleyiciniz sınıf ZD'niz – 10'a eşittir.

omen://feat/disrupt-prey?source=paizo-pathfinder-player-core:
  name: Avı Engelle
  description: Avınıza karşı bir yakın dövüş Vuruşu yapın. Vuruş kritik bir vuruşsa, tetikleyen eylemi engellersiniz.

omen://feat/disruptive-stance?source=paizo-pathfinder-player-core:
  name: Bozucu Duruş
  description: En ufak bir dikkat dağınıklığı gazabınızı kışkırtabilir ve siz düşmanların eylemlerini boşa çıkarmaya hazırsınızdır. Bu duruşta olduğunuz sürece, manipülasyon ve hareket eylemlerine ek olarak menziliniz içindeki bir yaratık konsantrasyon eylemi kullandığında da Reaktif Vuruş kullanabilirsiniz. Ayrıca Vuruşunuz isabet ederse (yalnızca kritik vuruş olduğunda değil), tetikleyen konsantrasyon veya manipülasyon eylemini engellersiniz.

omen://feat/distracting-feint?source=paizo-pathfinder-player-core:
  name: Dikkat Dağıtıcı Yanıltma
  description: Yanıltmalarınız normalden çok daha fazla dikkat dağıtıcıdır. Bir yaratık Yanıltmanız nedeniyle Gafil kaldığı sürece, ayrıca Dikkat testlerine ve Refleks kurtarışlarına –2 durumsal cezası alır.
  prerequisites:
  - text: "serseri düzeni"

omen://feat/distracting-shadows?source=paizo-pathfinder-player-core:
  name: Dikkat Dağıtıcı Gölgeler
  description: "Kendinize dikkat çekmekten kaçınmak için daha iri halkları bir dikkat dağıtıcı olarak kullanarak Gizlenmiş kalmayı öğrendiniz. Sizden en az bir boyut daha büyük olan yaratıkları (genellikle Orta veya daha büyük) Saklanma ve Sessizce İlerleme eylemleri için siper olarak kullanabilirsiniz; ancak bu tür yaratıkları Siper Alma eylemi gibi diğer kullanımlar için siper olarak kullanamazsınız."

omen://feat/distracting-shot?source=paizo-pathfinder-player-core:
  name: Dikkat Dağıtıcı Atış
  description: Saldırılarınızın katıksız gücü veya ezici sayısı bir düşmanı şaşkına çevirir. Avlanan avınıza menzilli bir silahla kritik vuruş yaparsanız veya aynı sırada menzilli bir silahla en az iki kez vurursanız, bir sonraki sıranızın başlangıcına kadar Gafil kalır.

omen://feat/divine-apex?source=paizo-pathfinder-player-core:
  name: İlahi Zirve
  description: Kullananın sınırlarını aşmasını sağlayacak şekilde bir eşyaya ilahi güç aktarabilirsiniz. Günlük hazırlıklarınızı tamamladığınızda, giyilen ve zirve özelliğine sahip olmayan bir büyülü eşyaya dokunabilirsiniz. Bir sonraki hazırlıklarınıza kadar zirve özelliğini kazanır ve ilahınızın ilahi niteliklerinden birini seçersiniz. Eşya, o nitelik belirleyicisini 1 veya hangisi daha yüksekse +4 artırır. Normal olduğu gibi, bir karakter aynı anda yalnızca bir zirve eşyasından faydalanabilir.

omen://feat/divine-castigation?source=paizo-pathfinder-player-core:
  name: İlahi Azap
  description: İlahınızın lütfu yeminli düşmanlarınıza uzanmaz. Bir Zarar Ver veya İyileştir büyüsü yaptığınızda, ona mübarek ya da şerli özelliğinizi ekleyebilirsiniz. Bunu yaparsanız büyü, normalde onlara hasar vermeyecek olsa bile zıt özelliğe sahip yaratıklara hasar verir. Büyü bu şekilde kullanıldığında ruh hasarı verir. Örneğin mübarekseniz, bir İyileştir büyüsüne mübarek özelliğini ekleyebilir ve şerli özelliğine sahip bir fiend'e ruh hasarı verebilirsiniz.
  prerequisites:
  - text: "mübarek veya şerli özelliği"

omen://feat/divine-countermeasures?source=paizo-pathfinder-player-core:
  name: İlahi Karşı Tedbirler
  description: İster düzlemdışı soyunuzla müttefik ister ona karşıt yaratıklara karşı olsun, kendinizi daha iyi savunmak amacıyla düzlemdışı mirasınızı incelediniz ve tekniklerinizin Celestial'lara, Fiend'lere ve diğer ilahi varlıklara karşı eşit derecede güçlü olduğunu gördünüz. İlahi etkilere karşı yapılan tüm kurtarışlara +1 durumsal bonusu kazanırsınız.

omen://feat/divine-declaration?source=paizo-pathfinder-player-core:
  name: İlahi Beyan
  description: Düşmanlarınızı cezalandırmak için ötelerdeki alemlerden mübarek ya da şerli bir söz çağırabilirsiniz. Günde bir kez, 7. derece ilahi özgü büyü olarak İlahi Ferman yapabilirsiniz.

omen://feat/divine-guidance?source=paizo-pathfinder-player-core:
  name: İlahi Rehberlik
  description: İlahi kutsal metinlere öylesine dalmışsınızdır ki, metinlerinizde her durum için bir anlam ve rehberlik bulursunuz. Karşılaştığınız belirli bir sorun veya muamma üzerinde düşünürken ilahınızın veya felsefenizin dini kutsal metinleri üzerinde Yazı Deşifre Etmek için 10 dakika harcayın ve ardından bir din testi deneyin (ZD GM tarafından belirlenir). Başarılı olursanız, ilerlemenize yardımcı olabilecek veya muammanızı çözmeye yardımcı olmak için düşüncenizi değiştirebilecek ilgili bir pasaj, mesel ya da aforizma ortaya çıkarırsınız.
  prerequisites:
  - text: "Din becerisinde efsanevi"

omen://feat/divine-infusion?source=paizo-pathfinder-player-core:
  name: İlahi Aşılama
  description: >
    Saldırılarını güçlendirmek için iyileştirmenizin öznesine enerji aktarırsınız. Kullandığınız bir sonraki eylem tek bir yaratığa Can Puanı yenilemek için Zarar Ver veya İyileştir yapmaksa, hedef bir sonraki sırasının sonuna kadar yakın dövüş silahları ve silahsız saldırılarıyla fazladan 1d6 hasar verir. Zarar ver yaptıysanız hasar türü boşluk, iyileştir yaptıysanız canlılıktır.
    Yapılan büyü en az 5. dereceyse bu hasar 2d6'ya, büyü en az 8. dereceyse hasar 3d6'ya yükselir.

omen://feat/divine-rebuttal?source=paizo-pathfinder-player-core:
  name: İlahi Reddiye
  description: Büyüsel tehditlere karşı fiziksel ve ruhsal olarak mücadele edersiniz. Bitişikteki yaratığa ilahınızın tercih ettiği silahla Vuruş Yapabilirsiniz. Mübarek veya şerliyseniz Vuruş bu özelliği kazanır. Vuruşunuz isabet ederse, tüm müttefikleriniz tetikleyen kurtarışa +2 durumsal bonusu (kritik vuruş durumunda +3 durumsal bonusu) kazanır.

omen://feat/divine-weapon?source=paizo-pathfinder-player-core:
  name: İlahi Silah
  description: Kalan büyü enerjisini kullandığınız bir silaha aktarırsınız. Sıranızın sonuna kadar silah fazladan 1d4 ruh hasarı verir. Mübarek veya şerliyseniz silahla yapılan Vuruşlar da bu özelliği kazanır ve zıt özelliğe sahip yaratıklara karşı ek hasar 2d4'e yükselir.

omen://feat/divine-wings?source=paizo-pathfinder-player-core:
  name: İlahi Kanatlar
  description: Biraz çabayla, sırtınızdan düzlemdışı soyunuzunkine benzer görünümde—ister zarif tüylü kanatlar ister tekinsiz yarasa kanatları olsun—büyülü kanatlar çağırabilirsiniz. Bu kanatlar 10 dakika boyunca kalır. Kanatlarınızı tezahür ettirdiğiniz sürece Hızınıza eşit bir uçma Hızı kazanırsınız.

omen://feat/domain-focus?source=paizo-pathfinder-player-core:
  name: Alan Odaku
  description: İlahınızın alanlarına olan bağlılığınız artar ve size bahşedilen güç de öyle. Ne zaman Odaklansanız, odak havuzunuzu tamamen doldurursunuz.
  prerequisites:
  - text: "bir veya daha fazla alan büyüsü"

omen://feat/domain-initiate?source=paizo-pathfinder-player-core:
  name: Alan Çömezi
  description: >
    İlahınız, güçleriyle ilgili özel bir büyü bahşeder. İlahınızın listesinden dininiz içinde özel ilginizi çeken bir konu olan bir alan seçin. O alan için, o alana özgü ve diğer rahiplerin erişemeyeceği bir başlangıç alan büyüsü kazanırsınız.
    Alan büyüleri bir tür odak büyüsüdür. Bir odak büyüsü yapmak 1 Odak Puanına mal olur ve 1 Odak Puanlık bir odak havuzu ile başlarsınız. Günlük hazırlıklarınız sırasında odak havuzunuzu doldurursunuz ve ilahınıza dua etmek veya amaçları doğrultusunda hizmet etmek için Odak Yenileme eylemini kullanarak 10 dakika harcayarak 1 Odak Puanı geri kazanabilirsiniz.
    Odak büyüleri tıpkı kantripler gibi otomatik olarak seviyenizin yukarı yuvarlanmış yarısına güçlendirilir. Odak büyüleri büyü slotları gerektirmez ve büyü slotları kullanılarak yapılamaz. Odak havuzunuz, sahip olduğunuz her odak büyüsü için 3 puana kadar bir Odak Puanı tutabilir.

omen://feat/double-double?source=paizo-pathfinder-player-core:
  name: Çifte, Çifte
  description: "Günlük hazırlıklarınız sırasında demlediğiniz her geçici yağ veya iksir için onun iki kopyasını demlersiniz. Bu, her gün iki geçici yağ veya iksir demlemenizi sağlar; büyü ZD'sinde usta yetkinliğiniz varsa dört, efsanevi yetkinliğiniz varsa altı tane demlersiniz."
  prerequisites:
  - text: "Kazan"

omen://feat/double-prey?source=paizo-pathfinder-player-core:
  name: Çifte Av
  description: Her ikisini de avlayarak aynı anda iki düşmana odaklanabilirsiniz. Av Peşine Düş eylemini kullandığınızda, iki yaratığı avınız olarak seçebilirsiniz.

omen://feat/double-shot?source=paizo-pathfinder-player-core:
  name: Çifte Atış
  description: Göz kamaştırıcı bir hızla art arda iki kez ateş edersiniz. Her biri ayrı bir hedefe ve –2 ceza ile iki Vuruş Yapın. Her iki saldırı da çoklu saldırı cezanıza sayılır, ancak her ikisini de yapana kadar ceza artmaz.

omen://feat/double-slice?source=paizo-pathfinder-player-core:
  name: Çift Darbe
  description: >
    Her iki silahınızla aynı hedefe eşzamanlı iki darbe indirirsiniz. Biri birincil silahınızla, diğeri ikincil silahınızla olmak üzere iki yakın dövüş Vuruşu yaparsınız. Her iki saldırı da mevcut Çoklu Saldırı Cezanızla yapılır. İki vuruş da isabet ederse hasarları birleştirilerek tek bir darbe gibi hesaplanır (direnç ve zaafları aşmada büyük avantaj sağlar).

  requirements: Her iki elinizde de birer yakın dövüş silahı tutuyor olmalısınız.

omen://feat/dragon-shape?source=paizo-pathfinder-player-core:
  name: Ejderha Formu
  description: Dünyanın en korkunç yaratıklarından bazılarının biçimini alabilirsiniz. Ejderha Formu büyüsünde listelenen formları Ehlileşmemiş Form listenize ekleyin. Ehlileşmemiş form kullanarak ne zaman başka bir forma dönüşseniz, ezici veya zehir arasından seçiminize karşı direnç 5 kazanırsınız.
  prerequisites:
  - text: "Süzülen Form"

omen://feat/dread-striker?source=paizo-pathfinder-player-core:
  name: Dehşet Vurucusu
  description: Düşmanlarınızın savunmalarını aşmak için onların korkusundan yararlanırsınız. Korkmuş durumuna sahip herhangi bir yaratık, saldırılarınıza karşı da Gafil kalır.

omen://feat/dream-may?source=paizo-pathfinder-player-core:
  name: Rüya Mayi
  description: >
    Bir guguk kuşu cadısının çocuğusunuz; bu da gözlerinizden birini menekşe rengi hatta siyah yapar. Annenizin uyku ve rüyalar üzerindeki güçleri size bu etkilere karşı bir dereceye kadar direnç kazandırmıştır; uyku etkilerine ve rüyalara neden olan veya rüyaları değiştiren etkilere karşı tüm kurtarışlara +2 durumsal bonusu kazanırsınız.
    Ek olarak, uyku sizin için daha tazeleyicidir. Dayanıklılık belirleyiciniz × seviyenizin iki katı kadar CP geri kazanırsınız (yalnızca × seviyeniz yerine) ve sahip olduğunuz herhangi bir Tükenmiş ve Lanetlenmiş durumunu 1 yerine 2 azaltırsınız.

omen://feat/dual-handed-assault?source=paizo-pathfinder-player-core:
  name: Çift Elli Taarruz
  description: Momentum katmak ve rakibinize daha güçlü bir darbe indirmek için yetecek kadar bir süre boyunca boş elinizi silahınızı kavramak üzere hızla uzatırsınız. Gereken silahla bir Vuruş Yapın. Vuruşu iki elle yapmak için Vuruş sırasında tutuşunuzu hızla değiştirirsiniz. Silah normalde İki Elle Kullanım niteliğine sahip değilse, bu saldırı için silah hasar zarını bir basamak artırın. Silah İki Elle Kullanım niteliğine sahipse, o özelliğin faydasını ve silahın hasar zarı sayısına eşit hasara bir durumsal bonusu kazanırsınız. Vuruş tamamlandığında, silahı yalnızca tek elle tutmaya geri dönersiniz. Bu eylem, bir elinizin boş olmasını gerektiren herhangi bir duruş veya savaşçı hüneri etkisini sonlandırmaz.

omen://feat/dubious-knowledge?source=paizo-pathfinder-player-core:
  name: Şüpheli Bilgi
  description: "Bir bilgi hazinesisiniz, ancak hepsi güvenilir kaynaklardan gelmez. Herhangi bir beceriyi kullanarak bir Bilgi Hatırla testinde başarısız olduğunuzda (ancak kritik başarısız olmadığınızda), doğru cevabı ve hatalı bir cevabı öğrenirsiniz; ancak hangisinin hangisi olduğunu ayırt etmenin hiçbir yolu yoktur. Bu, bir şeyin önemli olduğunu bilmek ancak iyi mi yoksa kötü mü olduğunu bilememek şeklinde ortaya çıkabilir."
  prerequisites:
  - text: "Bilgi Hatırla eylemine sahip bir beceride eğitimli"

omen://feat/dueling-dance-fighter?source=paizo-pathfinder-player-core:
  name: Düello Dansı (Savaşçı)
  description: Boş bir eli dayanak noktası ve denge unsuru olarak kullanarak, silahınızla hem saldırır hem de savunursunuz. Bu duruştayken sürekli olarak Düello Savuşturması faydalarına sahip olursunuz.
  prerequisites:
  - text: "Düello Savuşturması"

omen://feat/dueling-parry?source=paizo-pathfinder-player-core:
  name: Düello Savuşturması
  description: Tek elli silahınızla size karşı yapılan saldırıları savuşturabilirsiniz. Gereksinimleri karşılamaya devam ettiğiniz sürece, bir sonraki sıranızın başlangıcına kadar SD'ye +2 durumsal bonusu kazanırsınız.

omen://feat/dueling-riposte?source=paizo-pathfinder-player-core:
  name: Düello Karşı Darbesi
  description: Bocalayan düşmanınıza karşı zarifçe karşı saldırıya geçersiniz. Tetikleyen yaratığa karşı bir yakın dövüş Vuruşu yapın veya onu Silahsızlandırmayı deneyin.
  prerequisites:
  - text: "Düello Savuşturması"

omen://feat/dwarven-doughtiness?source=paizo-pathfinder-player-core:
  name: Cüce Yılmazlığı
  description: Yaklaşan tehlike karşısında doğuştan sakin ve soğukkanlısınız. Sıranızın sonunda Korkmuş durumunuzu 1 yerine 2 azaltın.

omen://feat/dwarven-lore?source=paizo-pathfinder-player-core:
  name: Cüce İlimi
  description: >
    Atalarınızın, tanrılarınızın ve halkınızın eski hikayelerini ve geleneklerini hevesle özümsediniz; nesiller boyu aktarılan konuları ve teknikleri çalıştınız. Zanaat ve Din becerilerinde eğitimli yetkinlik derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak eğitimli olacaksanız (örneğin geçmişinizden veya sınıfınızdan), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz.
    Ayrıca Cüce İlimi için Ek İlim genel hünerini kazanırsınız.

omen://feat/dwarven-reinforcement?source=paizo-pathfinder-player-core:
  name: Cüce Takviyesi
  description: "Mühendislik ve metal işleme bilginizi kalın nesneleri ve yapıları geçici olarak güçlendirmek için kullanabilirsiniz. Bir eşya üzerinde çalışarak 1 saat harcayarak ona 24 saat boyunca Sertliğine +1 durumsal bonusu verebilirsiniz. Zanaat konusunda uzmansanız bonus +2, efsaneviyseniz +3 olur. Bir yapının bir kısmını güçlendirebilirsiniz; ancak 1 saat genellikle yalnızca bir kapıyı, birkaç pencereyi veya 10 fitlik bir küpün içine sığan başka bir bölümü güçlendirir."
  prerequisites:
  - text: "Zanaat becerisinde uzman"

omen://feat/dwarven-weapon-familiarity?source=paizo-pathfinder-player-core:
  name: Cüce Silah Aşinalığı
  description: >
    Halkınız içinize sert vuran silahlara yönelik bir yakınlık aşıladı ve siz bunları daha zarif silahlara tercih edersiniz. Cüce özelliğine sahip tüm nadir silahlara erişim kazanırsınız. Cüce özelliğine sahip silahların yanı sıra savaş baltası, kazma ve savaş çekicine aşinalığınız vardır; yetkinlik amaçları doğrultusunda, bunlardan askeri silah olanları basit silahlar ve ileri silah olanları askeri silahlar olarak değerlendirirsiniz.
    5. seviyede, bu silahlardan biriyle her kritik vuruş yaptığınızda onun kritik uzmanlaşma etkisini kazanırsınız.

omen://feat/earned-glory?source=paizo-pathfinder-player-core:
  name: Hak Edilmiş Şan
  description: >
    Elfler genellikle aiuvarinleri hafife alma eğilimindedir ve siz onların saygısını kazanmak için başarılarınızın hikayelerini anlatma konusunda deneyimlisinizdir. Gösteri konusunda eğitimli olursunuz. Gösteri konusunda otomatik olarak eğitimli olacaksanız (örneğin geçmişinizden veya sınıfınızdan), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz.
    Etkileyici Performans hünerini kazanırsınız. Bir elf üzerinde İzlenim Bırakmak için bir Gösteri testi denediğinizde kritik başarısızlık atarsanız bunun yerine başarısızlık alırsınız.

omen://feat/earworm?source=paizo-pathfinder-player-core:
  name: Kulağa Takılan Melodi
  description: >
    Bir motifi durmaksızın tekrarlayarak, müttefiklerinizin kafasında tekrar tekrar yankılanan akılda kalıcı bir şarkı yerleştirir ve onları daha sonra buna yanıt vermeye hazırlarsınız. Bir beste kantripi seçin ve o kantripi somutlaştıran bir melodiyi, ilahiyi, konuşmayı, hareketler dizisini veya benzeri bir gösteriyi tekrarlayarak 10 dakika harcayın. Bu aktivite, gösterinin türüne uygun özellikleri kazanır. Kulağa takılan melodiyi, tüm aktivite boyunca sizi görebilen veya duyabilen (gösterinin türüne uygun olarak) tüm müttefiklerin içine yerleştirirsiniz.
    Kulağa takılan melodiyi oluşturduktan sonra, onu etkinleştirmek için serbest eylem olarak bir Gösteri testi deneyebilirsiniz. Bu test, etkinleştirme anında hazır bulunan kulağa takılan melodinin hedeflerinin en yüksek İrade ZD'sini kullanır. Başarı durumunda, kulağa takılan melodiyi öğrenen ve performansınızı algılayabilen tüm müttefiklere kantripi yaparsınız; başarısızlık durumunda kulağa takılan melodi bozulur ve kaybolur. Daha önceki tekrarlara dayandığından, etkinleştirilmiş melodiyi değiştirmek için kalıcı beste veya fortissimo beste gibi daha fazla serbest eylem kullanamazsınız. Müttefikler kulağa takılan melodiyi etkinleştirildikten sonra, başka bir kulağa takılan melodi yerleştirmek için 10 dakika harcarsanız veya bir sonraki günlük hazırlıklarınız sırasında (hangisi önce gelirse) unuturlar.

omen://feat/ebb-and-flow?source=paizo-pathfinder-player-core:
  name: Gelgit
  description: Düşmanlarınıza zarar vermek ve müttefiklerinizi iyileştirmek için hem canlılığı hem de boşluğu aynı anda çekip çıkarabilirsiniz. Bir sonraki eyleminiz 1 eylemli veya 2 eylemli bir İyileştir ya da Zarar Ver büyüsü yapmaksa, menzildeki büyüden zarar görecek bir yaratığı ve menzil içindeki büyüyle iyileşecek başka bir yaratığı seçin. İyileştir veya zarar ver büyünüz her iki yaratığı da hedefler.
  prerequisites:
  - text: "Çok Yönlü Pınar"

omen://feat/echoes-in-stone?source=paizo-pathfinder-player-core:
  name: Taştaki Yankılar
  description: Duyularınızı etrafınızdaki taşa uyumlamak için bir an duraklarsınız. Bir sonraki sıranızın başlangıcına kadar 20 fit menzilli hassas olmayan titreşim duyusu kazanırsınız.

omen://feat/echoing-channel?source=paizo-pathfinder-player-core:
  name: Yankılanan Kanal
  description: >
    Animist Yaşam ve ölümün güçlerini kanalize ettiğinizde, tezahürünüz ruhsal enerjiyi emer ve güçlendirerek yakındaki bir müttefike taşır.
    Rahip Canlılık veya boşluk enerjisini açığa çıkardığınızda, o enerjiden daha küçük bir cep de yaratırsınız.
    Kullandığınız bir sonraki eylem tek bir yaratığı iyileştirmek veya ona hasar vermek için 2 eylemli bir Zarar Ver veya İyileştir yapmaksa, menzilde ek bir yaratık seçin. O yaratığı aynı büyünün 1 eylemli versiyonuyla hedefleyin. Bu büyü yaptığınız 2 eylemli zarar ver veya iyileştir ile aynı derecededir ve başka bir büyü slotuna mal olmaz.
  prerequisites:
  - text: "Denge Tezahürü veya Rahip"

omen://feat/eclectic-polymath?source=paizo-pathfinder-player-core:
  name: Eklektik Hezarfen
  description: Esnek zihniniz bir büyüden diğerine hızla geçebilir. Günlük hazırlıklarınız sırasında Ezoterik Hezarfen'i kullanarak repertuvarınıza bir büyü eklerseniz, tekrar hazırlık yaptığınızda Ezoterik Hezarfen'den gelen yeni büyüyü repertuvarınızda tutmayı seçebilir ve bunun yerine repertuvarınızdaki aynı dereceden başka bir büyüye erişimi kaybedebilirsiniz.
  prerequisites:
  - text: "Ezoterik Hezarfen"

omen://feat/eclectic-skill?source=paizo-pathfinder-player-core:
  name: Eklektik Beceri
  description: Geniş deneyimleriniz bir dizi beceriye dönüşür. Eğitimsiz beceri testlerine yetkinlik bonusunuz seviyenize eşittir. Eğitimsiz olsanız bile normalde eğitimli olmanızı gerektiren herhangi bir beceri testini deneyebilirsiniz. Okültizm konusunda efsanevi yetkinliğe sahipseniz, eğitimsiz veya eğitimli olsanız bile normalde uzman yetkinliğe sahip olmanızı gerektiren herhangi bir beceri testini deneyebilirsiniz.
  prerequisites:
  - text: "hezarfen ilham perisi"
  - text: "Okültizm becerisinde usta"

omen://feat/educate-allies?source=paizo-pathfinder-player-core:
  name: Müttefikleri Eğit
  description: "Savunma bilginizin bir kısmını aktarmak için beste büyünüzün özelliklerini ayarlarsınız. Beste büyünüzden etkilenen tüm müttefikler, bir sonraki sıranızın başlangıcına kadar Görgülü hünerinden gelen +1 durumsal bonusunuzu kazanır. Müttefiklerinize öğretmek kendi becerilerinizi de pekiştirir; Görgülü'den gelen kişisel durumsal bonusunuz da bir sonraki sıranızın başlangıcına kadar +2'ye yükselir."
  prerequisites:
  - text: "Görgülü"

omen://feat/effortless-concentration?source=paizo-pathfinder-player-core:
  name: Zahmetsiz Konsantrasyon
  description: Aktif büyülerinizi neredeyse hiç düşünmeden sürdürürsünüz. Aktif sınıf büyülerinizden biri için derhal bir Sürdür eyleminin etkilerini kazanırsınız.

omen://feat/elemental-shape?source=paizo-pathfinder-player-core:
  name: Elementel Form
  description: Doğanın temel elementlerini öyle iyi anlarsınız ki, onları vücudunuza aşılayabilir ve bu elementlerin yaşayan bir tecellisi olarak tezahür edebilirsiniz. Elementel Form büyüsündeki formları Ehlileşmemiş Form listenize ekleyin. Ehlileşmemiş form kullanarak ne zaman başka bir biçime bürünseniz, ateşe karşı direnç 5 kazanırsınız.
  prerequisites:
  - text: "Ehlileşmemiş Form"

omen://feat/elemental-summons?source=paizo-pathfinder-player-core:
  name: Elementel Çağrı
  description: Elementleri kendinize çağırabilirsiniz. Druid büyü slotlarınızdan birinde hazırladığınız bir büyüyü aynı derecedeki bir Elementel Çağır büyüsüyle değiştirmek için doğayla uyum içinde 10 dakika geçirebilirsiniz.

omen://feat/elf-atavism?source=paizo-pathfinder-player-core:
  name: Elf Atavizmi
  description: Elf kanınız özellikle güçlü akar ve size tipik bir aiuvarinden çok daha fazla elf özelliği kazandırır. Ayrıca elfler arasında yetiştirilmiş ve elf atalarınızın mirasıyla yoğrulmuş olabilirsiniz. Elf ebeveyninizin veya atalarınızın elf mirasının faydalarını kazanırsınız. Genellikle sahip olmadığınız bir elf özelliğine dayanan veya onu geliştiren bir mirası seçemezsiniz. Örneğin, elf olmayan soyunuzun da birden fazla yüzyılla ölçülen bir yaşam süresi olmadığı sürece Kadim Elf mirasını alamazsınız. Bu durumlarda, GM'in takdirine bağlı olarak farklı bir fayda kazanabilirsiniz.

omen://feat/elf-step?source=paizo-pathfinder-player-core:
  name: Elf Adımı
  description: Zarif bir dansla hareket edersiniz ve adımlarınız bile geniştir. İki kez 5 fit Adım atarsınız.

omen://feat/elven-lore?source=paizo-pathfinder-player-core:
  name: Elf İlimi
  description: >
    Geleneksel elf sanatlarını incelediniz; mistik büyü ve etrafınızdaki dünya hakkında bilgi edindiniz. Arkana ve Doğa becerilerinde eğitimli yetkinlik derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak eğitimli olacaksanız (örneğin geçmişinizden veya sınıfınızdan), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz.
    Ayrıca Elf İlimi için Ek İlim genel hünerini kazanırsınız.

omen://feat/elven-weapon-familiarity?source=paizo-pathfinder-player-core:
  name: Elf Silah Aşinalığı
  description: >
    Yayları ve diğer zarif silahları tercih edersiniz. Elf özelliğine sahip tüm nadir silahlara erişim kazanırsınız. Elf özelliğine sahip silahların yanı sıra Uzun Yaylar, Kompozit Uzun Yaylar, Meçler, Kısa Yaylar ve Kompozit Kısa Yaylara aşinalığınız vardır; yetkinlik amaçları doğrultusunda, bunlardan askeri silah olanları basit silahlar ve ileri silah olanları askeri silahlar olarak değerlendirirsiniz.
    5. seviyede, bu silahlardan biriyle her kritik vuruş yaptığınızda onun kritik uzmanlaşma etkisini kazanırsınız.

omen://feat/emblazon-antimagic?source=paizo-pathfinder-player-core:
  name: Büyübozan Mühür
  description: "İlahınızın sembolü saldırgan büyüye karşı korur. Teçhizatı Mühürle kullandığınızda, o hünerde listelenen etkiler yerine aşağıdaki etkilerden birini seçebilirsiniz. Bu etkiler temel seçeneklerle aynı kısıtlamalara sahiptir. • Kalkan Kullanan kalkanı kaldırdığında, büyüye karşı kurtarışlara kalkanın durumsal bonusunu kazanır ve düşmanlarının büyülerinden gelen hasara karşı Kalkanla Engelleme kullanabilir. • Silah Silahı kullanan silahla kritik vuruş yaptığında, seviyesinin yukarı yuvarlanmış yarısını etkisizleştirme derecesi olarak kullanarak hedefindeki bir büyüyü etkisizleştirmeyi deneyebilir. Bunu yapmaya kalkışırsa, mühürlenen sembol derhal kaybolur."
  prerequisites:
  - text: "Mühürlü Teçhizat"

omen://feat/emblazon-armament?source=paizo-pathfinder-player-core:
  name: Mühürlü Teçhizat
  description: >
    Fiziksel bir nesneye kutsal bir tasviri özenle kazıyarak kendinizi savaşa hazırlarsınız. Bir silah veya kalkan üzerine ilahınızın bir sembolünü mühürlemek için 10 dakika harcayabilirsiniz. Sembol 1 yıl geçene kadar silinmez; ancak Teçhizatı Mühürle eylemini kullanırsanız daha önce mühürlediğiniz herhangi bir sembol ve o eşya üzerinde zaten mühürlenmiş olan herhangi bir sembol anında kaybolur.
    Mühürlenen eşya, normal amacına ek olarak ilahınızın dini bir sembolüdür ve eşyanın türüne göre belirlenen başka bir fayda kazanır. Fayda yalnızca sembolün temsil ettiği ilahın takipçileri için geçerlidir, ancak diğerleri eşyayı normal şekilde kullanabilir. • Kalkan Kalkan, Sertliğine +1 statü bonusu kazanır. (Bu, Kalkanla Engelleme reaksiyonu ile daha fazla hasar azaltmasını sağlar.) • Silah Silahı kullanan, silahla yapılan hasar zarlarına +1 statü bonusu kazanır.

omen://feat/emblazon-energy?source=paizo-pathfinder-player-core:
  name: Enerji Mührü
  description: "Elementel güçlerle mühürlediğiniz sembolleri daha etkili kılarsınız. Teçhizatı Mühürle kullandığınızda, o hünerde listelenen etkiler yerine aşağıdaki etkilerden birini seçebilirsiniz. Bu etkiler temel seçeneklerle aynı kısıtlamalara sahiptir. • Kalkan Asit, soğuk, elektrik, ateş veya sonik seçin. Kullanan kişi bu hasar türüne karşı kurtarışlara kalkanın durumsal bonusunu kazanır ve o türdeki hasara karşı Kalkanla Engelleme kullanabilir. O türle eşleşen bir özelliğe sahip bir alan büyünüz varsa (Ateş Işını gibi), kalkan ayrıca seviyenizin yarısına eşit miktarda o hasar türüne karşı direnç kazanır. • Silah Asit, soğuk, elektrik, ateş veya sonik seçin. Silah o türden fazladan 1d4 hasar verir. O türle eşleşen bir özelliğe sahip bir alan büyünüz varsa (ateş ışını gibi) bu ekstra hasarı 1d6'ya yükseltin."
  prerequisites:
  - text: "Mühürlü Teçhizat"

omen://feat/emotional-push?source=paizo-pathfinder-player-core:
  name: Duygusal Dürtü
  description: Düşmanınızın ani duygu değişiminden yararlanmaya hazırlanırsınız. Hedef, bir sonraki sıranızın sonundan önceki bir sonraki saldırınıza karşı Gafil kalır.

omen://feat/energized-font?source=paizo-pathfinder-player-core:
  name: Enerjili Pınar
  description: İçinizde akan büyü sayesinde zihninizi daha hızlı odaklayabilirsiniz. Normal azami sınırınıza kadar 1 Odak Puanı geri kazanırsınız.
  prerequisites:
  - text: "odak havuzu"
  - text: "gnom mirasından veya soy hünerinden gelen ve odak büyülerin en az biriyle gelenek paylaşan en az bir özgü büyü"

omen://feat/energy-ablation?source=paizo-pathfinder-player-core:
  name: Enerji Aşınması
  description: Bir düşmana yıkıcı enerji yöneltirken, gücünün bir kısmını sizi zarardan koruyan koruyucu bir bariyere aktarabilirsiniz. Bir sonraki eyleminiz en az bir tür enerji hasarı (asit, soğuk, elektrik, ateş, kuvvet, sonik, canlılık veya boşluk) veren bir Büyü Yapmaksa, seçtiğiniz bir enerji hasarı türüne karşı büyünün derecesine eşit direnç kazanırsınız. Direnç bir sonraki sıranızın sonuna kadar sürer. Büyünüzün hasar verip vermediğine bakılmaksızın direnci kazanırsınız.

omen://feat/enhanced-familiar?source=paizo-pathfinder-player-core:
  name: Gelişmiş Ruhdaş Hayvan
  description: >
    Animist Uyumlandığınız tezahürün özünü daha fazla maddileştirebilir, onun yerleşip size yardım etmesi için daha güçlü bir kap yaratabilirsiniz.
    Druid Tanıdığınıza ilave ilksel enerji aşılayarak yeteneklerini artırırsınız.
    Magus Tanıdığınıza daha fazla büyü enerjisi aşılarsınız.
    Sorcerer, Wizard, Witch Tanıdığınıza ilave büyü enerjisi aşılarsınız.
    Thaumaturge Birden fazla büyü geleneğinin en iyi yönlerini uygulayarak, tanıdığınızın enerjisini depolaması için daha verimli bir yol buldunuz.
    Her gün iki yerine dört ruhdaş hayvan veya usta yeteneği seçebilirsiniz.
  prerequisites:
  - text: "bir ruhdaş hayvan"

omen://feat/enigmas-knowledge?source=paizo-pathfinder-player-core:
  name: Muammanın Bilgisi
  description: İlham periniz size tüm doğru anlarda bilgi fısıldar. Bilgi Hatırlamak için kullanabileceğiniz herhangi bir beceriyle Otomatik Bilgi beceri hünerinin faydalarını kazanırsınız. Otomatik Bilgi hünerindeki özel madde uyarınca, Otomatik Bilgi'yi tur başına yine de yalnızca bir kez kullanabilirsiniz.
  prerequisites:
  - text: "Emin Bilgi"

omen://feat/esoteric-polymath?source=paizo-pathfinder-player-core:
  name: Ezoterik Hezarfen
  description: >
    Bir Wizard'ın büyü kitabına benzer şekilde bir okült büyüler kitabı tutarsınız ve onun büyülerini büyü repertuvarınızı desteklemek için kullanabilirsiniz. Repertuvarınızdaki tüm büyüleri bu kitaba ücretsiz olarak ekleyin. Büyü Öğrenmek ve uygun maliyeti ödeyerek büyü kitabınıza eklemek için Okültizm becerisini kullanabilirsiniz.
    Günlük hazırlıklarınız sırasında, okült büyüler kitabınızdan herhangi bir büyü seçin. Bu büyü zaten büyü repertuvarınızdaysa, o gün onu ilave bir imza büyüsü olarak değerlendirebilirsiniz. Repertuvarınızda yoksa, bir sonraki günlük hazırlıklarınıza kadar repertuarınızdaymış gibi değerlendirin.
  prerequisites:
  - text: "hezarfen ilham perisi"

omen://feat/eternal-bane?source=paizo-pathfinder-player-core:
  name: Ebedi Afat
  description: "Yaşamınız sizi ilahınızın aşağılık gücü için bir odak noktası haline getirdi. Seviyenizin yukarı yuvarlanmış yarısına eşit bir büyü derecesine sahip bir Afat büyüsüyle sürekli olarak çevrilisinizdir. Yarıçap 15 fittir ve onu artıramazsınız. Büyüyü Sonlandırabilirsiniz; bunu yaparsanız 1 dakika sonra otomatik olarak geri döner."
  prerequisites:
  - text: "şerli"

omen://feat/eternal-blessing?source=paizo-pathfinder-player-core:
  name: Ebedi Kutsama
  description: "Eylemleriniz, sonsuza dek ilahınızın lütfunu size getirdi. Seviyenizin yukarı yuvarlanmış yarısına eşit bir büyü derecesine sahip bir Kutsama büyüsüyle sürekli olarak çevrilisinizdir. Yarıçap 15 fittir ve onu artıramazsınız. Büyüyü Sonlandırabilirsiniz; bunu yaparsanız 1 dakika sonra otomatik olarak geri döner."
  prerequisites:
  - text: "kutsal"

omen://feat/eternal-composition?source=paizo-pathfinder-player-core:
  name: Ebedi Beste
  description: "Dünya her zaman üzerinde performans sergilediğiniz bir sahnedir. Kalıcı olarak Hızlanmış olursunuz; fazladan eyleminizi yalnızca yapılması 1 eylem gerektiren bir beste kantripi yapmak için kullanabilirsiniz. Keşif modundayken, herhangi bir keşif taktiğini kullanırken uygun bir beste kantripi sergilediğinizi beyan edebilirsiniz. Bir çatışma karşılaşmasındaki ilk sıranızdan önce bile, o kantrip bir önceki sıranızda yapmışsınız gibi aktiftir."
  prerequisites:
  - text: "maestro ilham perisi"

omen://feat/eternal-wings-nephilim?source=paizo-pathfinder-player-core:
  name: Ebedi Kanatlar (Nephilim)
  description: Kanatlarınız artık vücudunuzun kalıcı bir parçasıdır. İlahi Kanatlar'ın etkilerini günde bir kez 10 dakika boyunca değil, her zaman kazanırsınız.
  prerequisites:
  - text: "İlahi Kanatlar"

omen://feat/evasiveness?source=paizo-pathfinder-player-core:
  name: Sakınma Kabiliyeti
  description: Refleks kurtarışları için yetkinlik dereceniz ustaya yükselir.
  prerequisites:
  - text: "Düzenbaz İthafı veya Silahşor İthafı"
  - text: "Refleks kurtarışlarında uzman"

omen://feat/exacting-strike?source=paizo-pathfinder-player-core:
  name: Özenli Vuruş
  description: Momentumunuzu tamamen hesaba katarak kontrollü bir devam saldırısı yaparsınız. Bir Vuruş Yapın. Vuruş aşağıdaki başarısızlık etkisini kazanır.

omen://feat/expeditious-search?source=paizo-pathfinder-player-core:
  name: Hızlı Arama
  description: Büyük bir hızla arama yapmanızı, ayrıntıları ve sırları başkalarının iki katı hızla bulmanızı sağlayan bir sisteminiz vardır. Arama Yaparken, belirli bir alanı Aramak normalin yarısı kadar sürer. Bu, keşif yaparken, bir alana girmeden önce orayı Aradığınızdan emin olurken hareket edebileceğiniz Hızı ikiye katladığınız anlamına gelir (Hızınızın yarısına kadar). Dikkat konusunda efsaneviyseniz, alanları bunun yerine dört kat daha hızlı Ararsınız.
  prerequisites:
  - text: "Dikkat konusunda usta"

omen://feat/experienced-professional?source=paizo-pathfinder-player-core:
  name: Deneyimli Meslek Erbabı
  description: Felaketi önlemek için mesleki çabalarınızı dikkatle korursunuz. Gelir Elde Etmek için İlim kullandığınızda kritik başarısızlık atarsanız bunun yerine başarısızlık alırsınız. İlim konusunda uzmansanız, aslen kritik başarısızlık olmadığı sürece Gelir Elde Etmek için yapılan başarısız bir testten iki kat daha fazla gelir elde edersiniz.
  prerequisites:
  - text: "İlim becerisinde eğitimli"

omen://feat/experienced-smuggler?source=paizo-pathfinder-player-core:
  name: Deneyimli Kaçakçı
  description: >
    Yetkililerin gözünden eşyaları sık sık kaçırırsınız. GM pasif bir gözlemcinin gizlediğiniz küçük bir eşyayı fark edip etmediğini görmek için Gizlilik testinizi attığında, Gizlilik testi sonucunuzu belirlemek için atılan zarı Gizlilik belirleyicinize eklemek üzere atılan sayıyı veya hangisi daha yüksekse 10'u zar atışınızın sonucu olarak kullanır. Gizlilik konusunda ustaysanız GM atılan sayıyı veya 15'i kullanır; Gizlilik konusunda efsaneviyseniz pasif gözlemcilerden küçük ve gizlenmiş bir eşyayı saklamada otomatik olarak başarılı olursunuz. Bir yaratık gizli eşyalar için sizi aktif olarak ararken bir Dikkat testi denediğinde bu hiçbir fayda sağlamaz.
    PFS Notu Bu hüner, Yeraltı Dünyası İlimi ile seviyeniz – 1 seviyesindeki görevlerle Gelir Elde Etmenize olanak tanır (normal seviye – 2 yerine).
  prerequisites:
  - text: "Gizlilik becerisinde eğitimli"

omen://feat/experienced-tracker?source=paizo-pathfinder-player-core:
  name: Deneyimli İz Sürücü
  description: "İz sürmek sizin için ikinci bir doğadır ve gerektiğinde duraksamadan bir izi takip edebilirsiniz. Hayatta Kalma testinize –5 ceza alarak tam Hızla hareket ederken İz Sürebilirsiniz. Hayatta Kalma konusunda ustaysanız –5 cezasını almazsınız. Hayatta Kalma konusunda efsaneviyseniz, iz sürme sırasında her saat başı yeni bir Hayatta Kalma testi atmanıza gerek kalmaz; ancak izde önemli değişiklikler olduğunda yine de test atmanız gerekir."
  prerequisites:
  - text: "Hayatta Kalma becerisinde eğitimli"

omen://feat/expert-longevity?source=paizo-pathfinder-player-core:
  name: Uzman Ömür
  description: >
    Yaşamınız boyunca kazandığınız bilgi ve becerileri geliştirmeye devam ettiniz. Soy Uzun Ömürlülüğü ile eğitimli olacağınız bir beceri seçtiğinizde, zaten eğitimli olduğunuz bir beceriyi de seçerek o beceride uzman olabilirsiniz. Bu, Soy Uzun Ömürlülüğünüz sona erene kadar sürer.
    Soy Uzun Ömürlülüğü ve Uzman Ömür etkileri sona erdiğinde, beceri artışlarınızdan birini yeniden eğitebilirsiniz. Bu yeniden eğitimden kazandığınız beceri artışı, sizi ya Soy Uzun Ömürlülüğü ile seçtiğiniz beceride eğitimli yapmalı ya da Uzman Ömür ile seçtiğiniz beceride uzman yapmalıdır.
  prerequisites:
  - text: "Soy Uzun Ömürlülüğü"

omen://feat/explosive-arrival?source=paizo-pathfinder-player-core:
  name: Patlamalı Geliş
  description: Çağrılan yaratığınız mistik rünlerin patlamasıyla ortaya çıkar. Bir sonraki eyleminiz çağırma özelliğine sahip bir Büyü Yapmaksa, çağırdığınız yaratığın etrafındaki bir yayılım içindeki tüm yaratıklar büyü derecesi başına 1d4 ateş hasarı alır. Çağrılan yaratık asit, soğuk, elektrik, sonik veya ruh özelliğine sahipse, bunun yerine bu türde hasar verebilirsiniz.

omen://feat/extraplanar-supplication?source=paizo-pathfinder-player-core:
  name: Düzlemdışı Yakarış
  description: Müttefiklerinize bir hayır duası veya düşmanlarınıza bir lanet yerleştirmek için ilahi gücü yardıma çağırırsınız. Kutsama veya Afat arasından birini seçin. Seçilen büyüyü günde bir kez 1. derece ilahi özgü büyü olarak yapabilirsiniz.

omen://feat/familiar?source=paizo-pathfinder-player-core:
  name: Ruhdaş Hayvan
  description: >
    Magus, Sorcerer Bir hayvan size hizmet eder ve büyü yapmanıza yardımcı olur.
    Wizard Size hizmet eden ve büyü yapmanıza yardımcı olan bir yaratıkla antlaşma yaparsınız.
    Thaumaturge İster okült ritüelleri takip ederek ister mistik teorinin kırıntılarını bir araya getirerek veya başka bir yöntemle olsun, doğaüstü çalışmalarınızda artık sürekli yoldaşınız olarak hizmet eden bir yaratığı çağırdınız.
    Bir ruhdaş hayvan kazanırsınız.

omen://feat/familiars-language?source=paizo-pathfinder-player-core:
  name: Tanıdığın Dili
  description: Tanıdığınızla ve onun gibi diğer yaratıklarla konuşmayı öğrendiniz. Tanıdığınızla aynı hayvan familyasından olan yaratıklara sorular sorabilir, cevaplar alabilir ve onlarla Diplomasi becerisini kullanabilirsiniz. Örneğin tanıdığınız bir kediyse, kedigillerden herhangi biri için (leoparlar, aslanlar ve kaplanlar dahil) Hayvanlarla Konuş büyüsünün etkilerini kazanabilirsiniz. Bu yetenek onları normalden daha dost canlısı yapmaz. Tanıdığınız başka bir yaratığa dönüşürse, yeni tanıdığınızın dilini özümserken 1 hafta boyunca bu yeteneği kullanamazsınız.
  prerequisites:
  - text: "bir ruhdaş hayvan"

omen://feat/fantastic-leap?source=paizo-pathfinder-player-core:
  name: Harikulade Sıçrayış
  description: >
    Havada bir düşmana doğru kendinizi fırlatırsınız. Bir Yüksek Atlama veya Uzun Atlama deneyin. Bir Yüksek Atlama denerseniz, atlayışınızın yüksekliğini bir Uzun Atlama mesafesini belirler gibi belirleyin. Atlayışınızın sonunda bir yakın dövüş Vuruşu yapabilirsiniz.
    Vuruşunuzdan sonra havadaysanız yere düşersiniz. Düşüşünüzün mesafesi atlayışınızın yüksekliğinden fazla değilse, hasar almazsınız ve dik olarak yere inersiniz.

omen://feat/far-shot?source=paizo-pathfinder-player-core:
  name: Uzak Atış
  description: Alandaki deneyiminiz, isabetinizi artırarak uzaktan nasıl nişan alacağınızı öğretti. Silahlarınızın menzil artışlarını ikiye katlayın.

omen://feat/far-throw?source=paizo-pathfinder-player-core:
  name: Uzak Fırlatma
  description: Fırlatılan bir silahla Vuruş Yaptığınızda, siz ve hedef arasındaki her ilave menzil artışı için –2 ceza yerine yalnızca –1 ceza alırsınız.

omen://feat/fascinating-performance?source=paizo-pathfinder-player-core:
  name: Büyüleyici Performans
  description: >
    Gösteri Yaptığınızda, sonucunuzu bir gözlemcinin İrade ZD'si ile karşılaştırın. Başarılı olursanız, hedef 1 tur boyunca size Kendini Kaptırmış olur. Gözlemci çatışma gibi anında dikkat gerektiren bir durumdaysa, onu büyülemek için kritik başarı elde etmelisiniz ve Gösteri Yap eylemi etkisizleştirme özelliğini kazanır. Testinizi atmadan önce hangi yaratığı büyülemeye çalıştığınızı seçmelisiniz; hedef daha sonra 1 saat boyunca geçici olarak bağışık kalır.
    Gösteri konusunda uzmansanız dört gözlemciye kadar büyüleyebilirsiniz; ustaysanız 10 gözlemciye kadar büyüleyebilirsiniz; efsaneviyseniz aynı anda dilediğiniz sayıda gözlemciyi büyüleyebilirsiniz.
  prerequisites:
  - text: "Gösteri becerisinde eğitimli"

omen://feat/fast-channel?source=paizo-pathfinder-player-core:
  name: Hızlı Kanal
  description: >
    İlahi güç her zaman parmaklarınızın ucundadır ve çağrınıza hızla yanıt verir. 2 eylem harcayarak Zarar Ver veya İyileştir yaptığınızda, 2 eylemli versiyon yerine 3 eylemli versiyonun etkilerini elde edebilirsiniz.
    Zararlı pınarınız varsa bunu zarar ver ile, şifalı pınarınız varsa iyileştir ile (veya Çok Yönlü Pınarınız varsa her ikisiyle) yapabilirsiniz.
  prerequisites:
  - text: "zararlı pınar veya şifalı pınar"

omen://feat/fast-recovery?source=paizo-pathfinder-player-core:
  name: Hızlı Toparlanma
  description: "Vücudunuz illetlerden hızla kurtulur. Dinlenmekten iki kat daha fazla Can Puanı kazanırsınız. Devam eden bir hastalığa veya zehre karşı bir Dayanıklılık kurtarışında her başarılı olduğunuzda aşamasını 2 azaltırsınız; habis bir hastalık veya zehre karşı 1 azaltırsınız. Devam eden bir hastalığa veya zehre karşı elde ettiğiniz her kritik başarı aşamasını 3 azaltır; habis bir hastalık veya zehre karşı 2 azaltır. Ek olarak, bir gece dinlendiğinizde Tükenmiş durumunuzun şiddetini 1 yerine 2 azaltırsınız."
  prerequisites:
  - text: "Dayanıklılık +2"

omen://feat/fatal-aria?source=paizo-pathfinder-player-core:
  name: Can Alıcı Arya
  description: Şarkılarınız hedefi dayanılmaz duygularla boğar ve potansiyel olarak onu oracıkta öldürür. Can Alıcı Arya beste büyüsünü öğrenirsiniz.

omen://feat/favored-prey?source=paizo-pathfinder-player-core:
  name: Gözde Av
  description: >
    Belirli bir tür vahşi yaratığı çalıştınız ve onu daha kolay avlayabilirsiniz. Bu hüneri kazandığınızda gözde avınız olarak hayvanlar, canavarlar, ejderhalar veya hem mantarlar hem de bitkileri seçin. İnisiyatif attığınızda ve seçilen kategoriye ait bir düşmanı görebildiğinizde, serbest eylem olarak o düşmanı belirleyerek Av Peşine Düşebilirsiniz.
    Bu serbest eylemi, Bilgi Hatırla ile yaratığı henüz tanımlamamış olsanız bile kullanabilirsiniz. Fayda, diğer yaratıklar kılığına girmiş gözde düşmanlara karşı geçerli değildir ve GM bunun gözde bir av kılığına girmiş bir yaratığa karşı geçerli olup olmadığını belirler.

omen://feat/favored-terrain?source=paizo-pathfinder-player-core:
  name: Gözde Arazi
  description: "Zorluklarının üstesinden gelmek için belirli bir araziyi çalıştınız. Gözde araziniz olarak sucul, kutup, çöl, orman, dağ, ova, gökyüzü, bataklık veya yeraltını seçin. O arazideyken, büyüsel olmayan zorlu arazinin etkilerini yok sayabilirsiniz. Engelsiz yolculuk sınıf özelliğine sahipseniz, gözde arazinizdeyken tercihinize bağlı olarak ikinci bir fayda kazanırsınız: • Sucul Hızınıza eşit bir yüzme Hızı kazanırsınız. Zaten bir yüzme Hızınız varsa, bunun yerine yüzme Hızınıza +10 fitlik bir statü bonusu kazanırsınız. • Kutup Normalin yalnızca onda biri kadar yiyip içmeniz gerekir, şiddetli veya aşırı soğuktan etkilenmezsiniz ve Dengeyi Korumaya gerek kalmadan buz ve kar üzerinde tam Hızla yürüyebilirsiniz. • Çöl Normalin yalnızca onda biri kadar yiyip içmeniz gerekir, şiddetli veya aşırı sıcaktan etkilenmezsiniz ve Dengeyi Korumaya gerek kalmadan kum üzerinde tam Hızla yürüyebilirsiniz. • Orman, Dağ veya Yeraltı Hızınıza eşit bir tırmanma Hızı kazanırsınız. Zaten bir tırmanma Hızınız varsa, bunun yerine tırmanma Hızınıza +10 fitlik bir statü bonusu kazanırsınız. • Ova Kara Hızınıza +10 fitlik bir statü bonusu kazanırsınız. • Gökyüzü Varsa, uçma Hızınıza +10 fitlik bir statü bonusu kazanırsınız. • Bataklık Bataklıklar daha büyük zorlu arazi oluşturacak kadar derin olsa veya normalde Yüzmenizi gerektirse bile, bataklıklar üzerinde tam Hızla hareket edebilirsiniz."

omen://feat/fearsome-brute?source=paizo-pathfinder-player-core:
  name: Korkunç Zorba
  description: >
    Korku, düşmanlarınızı zayıf ve saldırılarınıza karşı daha savunmasız hale getirir. Korkmuş yaratıklara karşı Vuruşlar için yapılan hasar zarlarına bir durumsal bonusu kazanırsınız. Bonus, hedefin korkmuş değerinin iki katına eşittir.
    Gözdağı konusunda ustaysanız bonusu hedefin korkmuş değerinin üç katına yükseltin.

omen://feat/feather-step?source=paizo-pathfinder-player-core:
  name: Kuş Tüyü Adım
  description: Dikkatli ve hızlı adım atarsınız. Zorlu araziye Adım atabilirsiniz.
  prerequisites:
  - text: "Çeviklik +2"

omen://feat/felling-shot?source=paizo-pathfinder-player-core:
  name: Düşüren Atış
  description: "Menzilli saldırılarınız hazırlıksız bir düşmanı doğrudan havadan vurup düşürebilir. Gafil bir yaratığa menzilli Vuruş Yapın. Vuruş başarılı olur ve hasar verirse, hedef sınıf ZD'nize karşı bir reflex|against:rogue kurtarışı denemelidir."

omen://feat/felling-strike?source=paizo-pathfinder-player-core:
  name: Düşüren Vuruş
  description: >
    Vuruşunuz havadaki bir düşmanı yere indirebilir. Bir Vuruş Yapın. Uçan bir hedefe isabet eder ve hasar verirse, hedef 120 fite kadar düşer. Düşüş, hedefin yere çarpmasına neden olsa bile düşüşten hasar almayacağı kadar kademelidir.
    Vuruş kritik bir vuruşsa, hedef bir sonraki sıranızın sonuna kadar Uçamaz, Sıçrayamaz, havaya yükselemez veya başka bir şekilde yerden ayrılamaz.

omen://feat/ferocious-beasts?source=paizo-pathfinder-player-core:
  name: Vahşi Canavarlar
  description: Antik çağlardan bu yana, en kudretli ork canavar terbiyecileri yaratıkları orkun kendi kanını içeren bir içecekle besleyerek yoldaş canavarlarının gerçek dövüş ruhunu ortaya çıkarırdı. Sahip olduğunuz tüm yoldaş hayvanları, evcil hayvanlar, ruhdaş hayvanlar ve bağlı hayvanlar Ork Vahşeti hünerini kazanır ve tur başına yalnızca Ork Vahşeti için kullanabilecekleri bir reaksiyon kazanır. Ölümsüz Vahşet soy hünerine sahipseniz, sahip olduğunuz tüm yoldaş hayvanları, evcil hayvanlar, ruhdaş hayvanlar ve bağlı hayvanlar da Ork Vahşeti reaksiyonunu kullanırken o hünerin faydalarını kazanır.
  prerequisites:
  - text: "yoldaş hayvan, Evcil Hayvan veya Bağlı Hayvan"
  - text: "Ork Vahşeti"

omen://feat/ferocious-shape?source=paizo-pathfinder-player-core:
  name: Vahşi Form
  description: Dinozorların formunda ustalaştınız. Dinozor Formu büyüsünde listelenen formları ehlileşmemiş form listenize ekleyin. Ehlileşmemiş Form'u size belirli bir Atletizm belirleyicisi veren bir form almak için her kullandığınızda, Atletizm testlerinize +1 statü bonusu kazanırsınız.
  prerequisites:
  - text: "Ehlileşmemiş Form"

omen://feat/fey-caller?source=paizo-pathfinder-player-core:
  name: Peri Çağırıcısı
  description: Perilerin ilksel büyüyü illüzyonlara ve hilekârlığa doğru bükmek için kullandıkları bazı numaraları öğrendiniz. Yanılsama Kılık, Yanılsama Nesne ve Yanılsama Sahne büyülerini büyü listenize eklersiniz ve bunları ilksel büyüler olarak yaparsınız.

omen://feat/fey-fellowship?source=paizo-pathfinder-player-core:
  name: Peri Yoldaşlığı
  description: >
    Gelişmiş peri bağınız (ister kanınız yoluyla ister onların türüyle uzun süreli temas yoluyla olsun), İlk Dünya'nın yaratıklarından daha sıcak bir karşılama görmenizi sağlamanın yanı sıra onların numaralarını boşa çıkaracak veya büyüleriyle başa çıkacak araçlar sunar. Perilere karşı hem Dikkat testlerine hem de kurtarışlara +2 durumsal bonusu kazanırsınız.
    Ek olarak, sosyal bir durumda bir peri yaratığıyla her karşılaştığınızda, 1 dakika boyunca konuşmaya gerek kalmadan o yaratık üzerinde İzlenim Bırakmak için derhal bir Diplomasi testi deneyebilirsiniz. Teste –5 ceza alırsınız. Başarısız olursanız, başarısızlık veya kritik başarısızlık sonucunu kabul etmek yerine 1 dakikalık bir konuşmaya girebilir ve bu sürenin sonunda yeni bir test deneyebilirsiniz.

omen://feat/fiendish-magic?source=paizo-pathfinder-player-core:
  name: Şeytani Büyü
  description: >
    Şeytani büyüye sahipsiniz. Şu büyülerden ikisini seçin: Büyü Gizle, Sahte Canlılık, Görünmezlik, Görünmeyeni Gör, Parçala veya Paranoya. Seçilen büyülerin her birini günde bir kez 2. derece ilahi özgü büyü olarak kullanabilirsiniz.
    Karakasvetsoylular genellikle sahte canlılık ve görünmeyeni gör alır, çukursoylular genellikle paranoya ve parçala alır, cehennemsoylular ise genellikle görünmezlik ve büyü gizle alır.
  prerequisites:
  - text: "Karakasvetsoylu, Çukursoylu, Cehennemsoylu veya Fiend'lerle ilişkili başka bir kalıtsal hüner"

omen://feat/first-world-adept?source=paizo-pathfinder-player-core:
  name: İlk Dünya Uzmanı
  description: Zamanla peri büyünüz daha da güçlendi. 2. derece ilksel özgü büyüler olarak Görünmezlik ve Açığa Çıkaran Işık kazanırsınız. Bu ilksel özgü büyülerin her birini günde bir kez yapabilirsiniz.
  prerequisites:
  - text: "en az bir ilksel özgü büyü"

omen://feat/first-world-magic?source=paizo-pathfinder-player-core:
  name: İlk Dünya Büyüsü
  description: İlk Dünya ile olan bağınız, tıpkı perilerinki gibi size ilksel bir özgü büyü bahşeder. İlksel büyü listesinden bir kantrip seçin. Bu büyüyü istediğiniz zaman ilksel özgü büyü olarak yapabilirsiniz. Bir kantrip otomatik olarak seviyenizin yukarı yuvarlanmış yarısına eşit bir büyü derecesine güçlendirilir.

omen://feat/fleet?source=paizo-pathfinder-player-core:
  name: Çevik Adımlar
  description: Yürüyerek daha hızlı hareket edersiniz. Hızınız 5 fit artar.

omen://feat/flinging-charge?source=paizo-pathfinder-player-core:
  name: Fırlatmalı Hücum
  description: >
    Taarruzunuza başlamak üzere aradaki mesafeyi kapatırken rakibinizin dikkatini dağıtmak için bir silah fırlatırsınız. İki kez Depar atarsınız; bu hareket sırasında herhangi bir noktada, fırlatmalı bir silahla menzilli bir Vuruş Yapabilirsiniz. Vuruş isabet ederse hedef, mevcut sıranızın sonundan önce ona karşı deneyeceğiniz bir sonraki yakın dövüş saldırısına karşı Gafil kalır.


omen://feat/flinging-shove?source=paizo-pathfinder-player-core:
  name: Fırlatmalı İtiş
  description: >
    Rakiplerinizi ister bir kalkanla ister büyük bir silahla itin, onları daha da uzağa itmeyi öğrendiniz. Saldırgan Engelleme veya Kaba İtiş ile rakibinizi İtme mesafenizi başarı durumunda 10 fite, kritik başarı durumunda ise 20 fite çıkarırsınız. Saldırgan Engelleme kullandığınızda, hedefin Gafil mı yoksa İtilmiş mi olacağını seçebilirsiniz. Kaba İtiş yaptığınızda, başarısızlık durumunda da hedefi 5 fit İtersiniz.

  prerequisites:
  - text: "Saldırgan Engelleme veya Kaba İtiş"

omen://feat/floral-restoration?source=paizo-pathfinder-player-core:
  name: Bitkisel İyileşme
  description: >
    Bedeninizi ve büyünüzü yenilemek için yakındaki bitkilerin canlılıklarını sizinle paylaşmasını talep edersiniz. 1 Odak Puanı ve ceil(spell rank/2)d8[healing] Can Puanı kazanırsınız.
    En az 15 fit x 15 fitlik sağlıklı bir bitki örtüsünün bulunduğu bir konumda olmalısınız; bu çimen, liken, deniz yosunu veya doğal olarak oluşan başka bir bitki örtüsü olabilir. Doğanın belirli bir bölümünde Bitkisel İyileşme kullanmak ona zarar vermez; ancak o doğa parçasının 24 saat boyunca başka bir Bitkisel İyileşme kullanımına canlılık vermesini engeller.
    9. seviyede ve sonrasındaki her 2 seviyede bir, iyileşmeyi 1d8 artırın.
  prerequisites:
  - text: "yaprak düzeni"

omen://feat/flourish-and-ruin?source=paizo-pathfinder-player-core:
  name: Çiçeklenme ve Yıkım
  description: >
    Müttefiklerinize hayat bahşetmek ve düşmanlarınızı sarıp ezmek üzere sarmaşıklar çağırmak için ruhunuzun hayati özüne başvurabilirsiniz. Yaşam Sahası ve Dolanıcı Sürünücüler büyülerini günde birer kez 6. derece doğa özgü büyüleri olarak yapabilirsiniz.


omen://feat/foil-senses?source=paizo-pathfinder-player-core:
  name: Duyuları Yanılt
  description: >
    Yaratıkların özel duyularını yanıltmakta ustasınız ve onlara karşı her zaman tedbirli davranırsınız. Fark Edilmekten Kaçın, Gizlen veya Sessizce İlerle eylemlerini her kullandığınızda, özel duyulara karşı daima önlem alıyor sayılırsınız.

  prerequisites:
  - text: "Usta Gizlilik"

omen://feat/folksy-patter?source=paizo-pathfinder-player-core:
  name: Halk Ağzı Lafazanlık
  description: "Kodlanmış mesajları halk ağzı deyimler olarak gizlemede mahirsinizdir. Argo, şakalar, buçukluk alıntı kelimeleri ve benzerlerini kullanarak üç temel kelimeden oluşan basit bir mesaj iletirsiniz (\"Tehlike suikastçı kaç\" veya \"Buluş benimle ay-doğumu\" gibi). Amaçlanan dinleyiciniz mesajı ayırt etmek için bir perception|dc:20 testi deneyebilir. Dinleyici bir buçukluksa veya Halk Ağzı Lafazanlık hünerine sahipse bu ZD 5 azalır, her ikisi birden geçerliyse 10 azalır (perception|dc:15 perception|dc:10). Kulak misafiri olanlar da anlamınızı ayırt etmek için Aldatma ZD'nize karşı bir perception|against:deception testi deneyebilir. Niyetini Tartmak için yapılan Dikkat testlerine uygulanan herhangi bir bonus veya ceza, Halk Ağzı Lafazanlığı anlamak için yapılan testlere de uygulanır."

omen://feat/forager?source=paizo-pathfinder-player-core:
  name: Yiyecek Arayıcısı
  description: >
    Barınmak için Hayatta Kalma becerisini kullanırken başarıdan daha kötü bir sonuç zarlarsanız, başarı elde edersiniz. Başarı durumunda kendiniz ve ilave dört yaratık için asgari geçim sağlayabilirsiniz; kritik başarı durumunda ise iki katı kadar ilave yaratığın bakımını üstlenebilirsiniz. Bu yaratık sayısının yarısına konforlu bir yaşam sağlamayı da seçebilirsiniz.

    Hayatta Kalma becerisinde uzmansanız bir başarıda beslediğiniz ilave yaratık sayısı sekize, ustaysanız 16'ya ve efsaneviyseniz 32'ye yükselir.

  prerequisites:
  - text: "Eğitimli Hayatta Kalma"

omen://feat/forcible-energy?source=paizo-pathfinder-player-core:
  name: Zorlayıcı Enerji
  description: >
    Büyülerinizden çıkan enerjiyi o kadar güçlü kılmak için karmaşık manipülasyonlar gerçekleştirirsiniz ki düşmanlarınız sonrasında bu enerjiye karşı savunmasız kalır. Bir sonraki eyleminiz asit, soğuk, elektrik, ateş veya sonik hasar veren bir Büyü Yapmak ise, hasar alan bir hedef seçerek bir sonraki sıranızın sonuna kadar o hasar türüne karşı 5 zaaf kazanmasını sağlayabilirsiniz. Bir büyü birden fazla enerji hasarı türü veriyorsa hedefin zaaf kazanacağı birini seçersiniz. Bunun seçtiğiniz enerji türüne karşı direnci veya bağışıklığı olan yaratıklar üzerinde hiçbir etkisi yoktur.


omen://feat/forest-passage?source=paizo-pathfinder-player-core:
  name: Orman Geçidi
  description: >
    Sanki bitki örtüsü önünüzde ikiye ayrılıyormuşçasına her zaman bir yol bulabilirsiniz. Çalılar, sarmaşıklar ve fundalıklar gibi bitkiler ve mantarlardan kaynaklanan tüm zorlu zeminleri göz ardı edersiniz.

  prerequisites:
  - text: "yaprak düzeni"

omen://feat/forlorn?source=paizo-pathfinder-player-core:
  name: Kimsesiz
  description: >
    Dostlarınızın yaşlanıp ölmesini izlemek sizi zararlı duygulara karşı koruyan bir hüzünle doldurur. Duygu etkilerine karşı kurtarışlara +1 durumsal bonusu kazanırsınız. Bir duygu etkisine karşı kurtarışında başarı zarlarsanız, bunun yerine kritik başarı elde edersiniz.


omen://feat/form-control?source=paizo-pathfinder-player-core:
  name: Form Kontrolü
  description: >
    Ekstra özen ve çaba göstererek daha uzun bir süre boyunca farklı bir biçime bürünebilirsiniz. Bir sonraki eyleminiz ehlileşmemiş form yapmak ise büyünün derecesi normalden 2 derece daha düşüktür (en az 1. derece), ancak en fazla 1 saat veya belirtilen süre boyunca (hangisi daha uzunsa) dönüşmüş kalabilirsiniz. Ehlileşmemiş form büyüsünü normal şekilde yine de Sonlandırabilirsiniz.

  prerequisites:
  - text: "Ehlileşmemiş Form"

omen://feat/form-retention?source=paizo-pathfinder-player-core:
  name: Form Koruma
  description: >
    Değişime uygun şekilde hazırlandığınız sürece zihninizi ve bedeninizi çokbiçimlilik büyüsünü daha uzun süre tolere edecek şekilde eğittiniz. 1 dakika süren ve bir savaş formu sağlayan bir çokbiçimlilik büyüsü hazırlarken büyüyü normalden 2 derece daha yüksek bir yuvada hazırlayabilirsiniz. Bu bir büyüyü yükseltmenin normal faydalarını sağlamaz, ancak büyü 10 dakikaya kadar sürer. Örneğin, Form Koruma ile 4. derece bir yuvada hayvan formu hazırladıysanız 10 dakikaya kadar süren 2. derece bir Hayvan Formu yaparsınız. Büyü Sonlandırılabiliyorsa bu durum değişmez.


omen://feat/fortissimo-composition?source=paizo-pathfinder-player-core:
  name: Fortissimo Bestesi
  description: >
    Marşlarınız ilham perinizin gücüyle desteklenerek daha gür ve daha etkili hale gelir. Fortissimo Bestesi büyübiçim odak büyüsünü öğrenirsiniz.

  prerequisites:
  - text: "maestro ilham perisi"

omen://feat/fortunate-relief?source=paizo-pathfinder-player-core:
  name: Uğurlu Rahatlama
  description: >
    Tanrınız dertleri ve durumları ortadan kaldırma girişimlerinizi destekler. Bir etkiyi etkisizleştirmeye çalışan bir şifa büyüsü yaptığınızda, etkisizleştirme testini iki kez zarlayabilir ve yüksek olan değeri alabilirsiniz.


omen://feat/furious-focus?source=paizo-pathfinder-player-core:
  name: Öfkeli Odak
  description: >
    Öfkeyle savururken bile dengenizi korumayı öğrendiniz. İki elle kullandığınız bir yakın dövüş silahıyla Gaddar Savuruş yaptığınızda, çoklu saldırı cezanıza iki yerine tek bir saldırı olarak sayılır.

  prerequisites:
  - text: "Gaddar Savuruş"

omen://feat/gang-up?source=paizo-pathfinder-player-core:
  name: Çullanma
  description: >
    Siz ve müttefikleriniz bir rakibi uyum içinde hırpalarsınız. Bir düşman hem sizin hem de bir müttefikinizin erişim alanı içindeyse onu kıskaca alabilirsiniz; siz ve müttefikinizin karşıt taraflarda olması gerekmez. Bu durum siz kadar müttefiklerinize de fayda sağlar, ancak yalnızca birbirleriyle değil sizinle birlikte kıstırıyorlarsa geçerlidir. Kıskaca almanın diğer gereksinimleri yine de karşılanmalıdır.


omen://feat/garland-spell?source=paizo-pathfinder-player-core:
  name: Çelenk Büyüsü
  description: >
    Bir sonraki eyleminiz mantar veya bitki özelliğine sahip bir Büyü Yapmak ise, büyünün menzili içinde bir yayılım alanında bitkilerden bir çelenk biter. Bitkiler, tercihinize göre dikenlerle veya zehirli sarmaşıklarla kaplı zorlu arazi ve tehlikeli arazidir. Bu karelerden birine giren veya sırasını bu karelerden birinde bitiren herhangi bir yaratık 2d6 hasar alır (dikenler için (ternary(gte(@actor.level,20),4,ternary(gte(@actor.level,16),3,2)))d6[piercing]|options:area-damage hasar veya sarmaşıklar için (ternary(gte(@actor.level,20),4,ternary(gte(@actor.level,16),3,2)))d6[poison]|options:area-damage hasar). Bir yaratık bu hasarı sıra başına yalnızca bir kez alabilir. Siz ve yoldaşınız bu hasara karşı bağışıksınızdır.
    Bitkiler 1 dakika veya hangisi önce gelirse başka bir Çelenk Büyüsü yapana kadar varlığını korur.
    Hasar 16. seviyede 3d6'ya ve 20. seviyede 4d6'ya yükselir.
  prerequisites:
  - text: "yaprak düzeni"

omen://feat/general-training?source=paizo-pathfinder-player-core:
  name: Genel Eğitim
  description: >
    Uyum sağlama yeteneğiniz, bir dizi faydalı kabiliyetteki ustalığınızda kendini gösterir. 1. seviye bir genel hüner kazanırsınız. Hünerin önkoşullarını karşılamalısınız; ancak bu hüneri karakter oluşturma sırasında seçerseniz hangi önkoşulları karşıladığınızı belirlemek için hüneri sürecin daha sonraki bir aşamasında seçebilirsiniz.


omen://feat/glad-hand?source=paizo-pathfinder-player-core:
  name: Güler Yüzlü Tanışma
  description: >
    İlk izlenimler sizin en güçlü yanınızdır. Gündelik veya sosyal bir durumda biriyle karşılaştığınızda, 1 dakika boyunca sohbet etmeye gerek kalmadan o yaratık üzerinde İyi İzlenim Bırakmak için derhal bir Diplomasi testi deneyebilirsiniz. Başarısız olursanız, başarısızlık veya kritik başarısızlık sonucunu kabul etmek yerine 1 dakikalık bir sohbete girişebilir ve bu sürenin sonunda yeni bir test deneyebilirsiniz.

  prerequisites:
  - text: "Uzman Diplomasi"

omen://feat/gnome-obsession?source=paizo-pathfinder-player-core:
  name: Gnom Saplantısı
  description: >
    Uçarı bir doğanız olabilir, ancak bir konu ilginizi çektiğinde ona balıklama dalarsınız. Seçtiğiniz Bilgi için Ek İlim hünerini ve Özgüven hünerini kazanırsınız. Gnom takıntıları çabuk gelip geçebildiğinden, Gnom Saplantısı hünerini 1 günlük ara zamanda farklı bir Bilgi alt kategorisine yeniden eğitebilirsiniz.


omen://feat/gnome-weapon-familiarity?source=paizo-pathfinder-player-core:
  name: Gnom Silah Aşinalığı
  description: >
    Kıvrımlı ve tuhaf şekillere sahip bıçaklar gibi halkınıza bağlı sıra dışı silahları tercih edersiniz. Kukrilere ve gnom niteliğine sahip tüm sıra dışı silahlara erişim kazanırsınız. Gnom niteliğine sahip silahların yanı sıra kılıçlı kargı ve kukri konusunda aşinalığınız vardır; yetkinlik açısından bunlardan askeri silah olanları basit silah, ileri düzey silah olanları ise askeri silah sayarsınız.

    5. seviyede, bu silahlardan biriyle kritik vuruş yaptığınızda onun kritik uzmanlaşma etkisini elde edersiniz.


omen://feat/goblin-lore?source=paizo-pathfinder-player-core:
  name: Goblin İlimi
  description: >
    Goblin topluluğunuzdan beceriler ve hikâyeler kaptınız. Doğa ve Gizlilik becerilerinde eğitimli yetkinlik derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak eğitimli hale gelecekseniz (örneğin geçmişinizden veya sınıfınızdan ötürü), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz.

    Ayrıca Goblin İlimi için Ek İlim genel hünerini kazanırsınız.


omen://feat/goblin-scuttle?source=paizo-pathfinder-player-core:
  name: Goblin Koşturması
  description: >
    Konumunuzu ayarlamak için müttefikinizin hareketinden yararlanırsınız. Adım atarsınız.


omen://feat/goblin-song?source=paizo-pathfinder-player-core:
  name: Goblin Şarkısı
  description: >
    Sinir bozucu goblin şarkıları söyleyerek saçma ve tekrarlayan sözlerle düşmanlarınızın dikkatini dağıtırsınız. 30 fit içindeki tek bir düşmanın İrade ZD'sine karşı bir performance|defense:will testi deneyin. Bu, şarkı söylemek için yapılan bir Gösteri testinin tüm olağan özelliklerine ve kısıtlamalarına sahiptir.
    Gösteri becerisinde uzman yetkinliğe sahipseniz menzil içindeki iki hedefe kadar, usta yetkinliğe sahipseniz dört hedefe kadar ve efsanevi yetkinliğe sahipseniz sekiz hedefe kadar etkileyebilirsiniz.

omen://feat/goblin-weapon-familiarity?source=paizo-pathfinder-player-core:
  name: Goblin Silah Aşinalığı
  description: >
    Başkaları onları hor görebilir, ancak siz halkınızın silahlarının keskin oldukları kadar etkili olduğunu da bilirsiniz. Goblin niteliğine sahip tüm sıra dışı silahlara erişim kazanırsınız. Goblin niteliğine sahip silahlara aşinalığınız vardır; yetkinlik açısından bunlardan askeri silah olanları basit silah, ileri düzey silah olanları ise askeri silah sayarsınız.

    5. seviyede, bu silahlardan biriyle kritik vuruş yaptığınızda onun kritik uzmanlaşma etkisini elde edersiniz.


omen://feat/graceful-poise?source=paizo-pathfinder-player-core:
  name: Zarif Duruş
  description: >
    Doğru konumlanmayla ikincil el silahınız bir akrebin iğnesi gibi vurabilir. Bu duruştayken, Çift Darbe ile ikinci Vuruşunuzu çevik bir silahla yaparsanız Çift Darbe çoklu saldırı cezanızı hesaplarken tek bir saldırı sayılır.

  prerequisites:
  - text: "Çift Darbe"

omen://feat/grasping-reach?source=paizo-pathfinder-player-core:
  name: Kavrayıcı Menzil
  description: >
    Kollarınızı desteklemek ve erişim mesafenizi uzatmak için bir sarmaşık veya dokunaç yumağı uzatabilirsiniz. İki el gerektiren, erişim niteliği olmayan ve en az 1d6 hasar veren bir yakın dövüş silahı kuşandığınızda, bir Etkileşime Gir eylemi kullanarak standart iki elle tutuş ile uzatılmış iki elle kavrayış arasında geçiş yapabilirsiniz. Uzatılmış kavrayışınızda kuşanılan silahlar 10 fitlik erişim kazanır. Bu kavrayış standart bir tutuşa göre daha az dengeli ve güçlüdür, bu da silahın hasar zarını 1 basamak düşürür.


omen://feat/greater-distracting-shot?source=paizo-pathfinder-player-core:
  name: Gelişmiş Dikkat Dağıtıcı Atış
  description: >
    Tek bir mermi bile düşmanınızın dengesini bozabilir ve daha güçlü saldırılar onu daha uzun süre şaşkına çevirir. Av peşine düştüğünüz hedefinize menzilli bir silahla vurursanız hedef bir sonraki sıranızın başına kadar Gafil kalır. Hedefinize kritik vuruş yaparsanız veya aynı sırada menzilli bir silahla iki kez vurursanız hedef bunun yerine bir sonraki sıranızın sonuna kadar gafil kalır.

  prerequisites:
  - text: "Dikkat Dağıtıcı Atış"

omen://feat/greater-lesson?source=paizo-pathfinder-player-core:
  name: Gelişmiş Ders
  description: >
    Haminiz size daha büyük bilgi bahşeder. Gelişmiş veya temel bir ders seçersiniz. Bu dersle ilişkili nazarı kazanırsınız ve tanıdığınız ilgili büyüyü öğrenir.


omen://feat/grimspawn?source=paizo-pathfinder-player-core:
  name: Kasvettohumu
  description: >
    Soyunuz, Abaddon'daki iğrenç yuvalarında ruhları yiyip bitiren korkunç ölüm biçimlerinin tezahürlerinden biri olan bir daemona kadar uzanır. Sonuç olarak kendi yaşam gücünüzün son kırıntılarına inatla tutunursunuz. İnatçı genel hünerini kazanırsınız.


omen://feat/group-aid?source=paizo-pathfinder-player-core:
  name: Grup Yardımı
  description: >
    Yetiştirilme tarzınız takım çalışmasını vurgulamıştır ve müttefiklerinize yardım etmek sizin için doğaldır. Saldırı niteliği taşımayan bir beceri testinde bir müttefike Yardım Ettikten sonra, o turda aynı amaçla aynı beceri testini deneyen diğer tüm müttefiklere de Yardım Edebilirsiniz. Bunu bir reaksiyon yerine serbest eylem olarak yaparsınız.

    Yardım etmek için yaptığınız hazırlık diğer müttefikler için de geçerli olmalıdır ve her müttefike yalnızca bir kez Yardım Edebilirsiniz. Örneğin bir duvara tırmanmak için Atletizm testinde bir müttefike Yardım Etmek üzere onu yukarı kaldırdıysanız aynı turda duvara tırmanmaya çalışan diğer müttefiklere de destek sağlamak için aynı duruşu koruyabilirsiniz.


omen://feat/group-coercion?source=paizo-pathfinder-player-core:
  name: Grup Tehditle Zorlama
  description: >
    İnsanları tek başlarına kıstırmadığınızda bile etkili bir şekilde baskı altına alabilirsiniz. Tehditle Zorladığınızda, Gözdağı testi sonucunuzu bir yerine en fazla beş hedefin İrade ZD'si ile karşılaştırabilirsiniz.

    Her hedef için farklı bir başarı derecesi elde etmek mümkündür. Tek bir eylemde Tehditle Zorlayabileceğiniz hedef sayısı uzmansanız 10'a, ustaysanız 25'e ve efsaneviyseniz 50'ye çıkar.

  prerequisites:
  - text: "Eğitimli Gözdağı"

omen://feat/group-impression?source=paizo-pathfinder-player-core:
  name: Grup İzlenimi
  description: >
    İyi İzlenim Bıraktığınızda, Diplomasi testi sonucunuzu sohbet ettiğiniz en fazla 10 hedefin İrade ZD'si ile ceza almadan karşılaştırabilirsiniz. Hedef sayısı uzmansanız 20'ye, ustaysanız 50'ye ve efsaneviyseniz 100'e çıkar.

  prerequisites:
  - text: "Eğitimli Diplomasi"

omen://feat/grown-of-oak?source=paizo-pathfinder-player-core:
  name: Meşeden Büyüme
  description: >
    Teninizin kadim bir ağacın odunsu dayanıklılığına bürünmesini ve tanıdığınızın de buna uymasını sağlayabilirsiniz. Yapabileceğiniz en yüksek büyü derecesinden bir derece daha düşük bir büyü derecesiyle Meşe Dayanıklılığı büyüsünü isteğe bağlı olarak bir doğa özgü büyüsü olarak yapabilirsiniz. Bu büyü sizi ve 30 fit yakınınızdaysa leshy tanıdığını hedefler.

  prerequisites:
  - text: "yaprak düzeni"

omen://feat/guardians-deflection-fighter?source=paizo-pathfinder-player-core:
  name: Muhafızın Saptırması (Savaşçı)
  description: >
    Müttefikinize yönelik saldırıyı saptırmak için silahınızı kullanarak tetikleyici saldırıya karşı onun Savunma Değerine +2 durumsal bonusu sağlarsınız. Bu, tetikleyici kritik vuruşu bir vuruşa veya tetikleyici vuruşu bir ıskalamaya dönüştürür.


omen://feat/guiding-finish?source=paizo-pathfinder-player-core:
  name: Yönlendirici Bitiş
  description: >
    Silahınızı bir kaldıraç gibi kullanarak rakibinizi tam istediğiniz yere gitmeye zorlarsınız. Tek elle kullanılan bir yakın dövüş silahıyla bir Vuruş Yapın. Vuruş isabet ederse hedefi en fazla 10 fit Yerinden Oynatabilirsiniz. Bu hareket sırasında hedefi kendi alanınızdan geçirebilirsiniz. Vuruşunuz aşağıdaki başarısızlık etkisini kazanır.


omen://feat/guiding-luck?source=paizo-pathfinder-player-core:
  name: Yol Gösterici Şans
  description: >
    Şansınız doğru tarafa bakmanız ve darbelerinizi şaşmadan yönlendirmeniz için size rehberlik eder. Buçukluk Şansı hünerini günde iki kez kullanabilirsiniz: biri normal tetikleyicisine karşılık, diğeri ise normal tetikleyici yerine bir Dikkat testinde veya saldırı zarında başarısız olduğunuzda.

  prerequisites:
  - text: "Buçukluk Şansı"

omen://feat/guiding-riposte?source=paizo-pathfinder-player-core:
  name: Yönlendirici Karşı Darbe
  description: >
    Ağırlığınızı kaydırarak ve silahınızı açılı tutarak rakibinizi daha elverişli bir konuma yönlendirirsiniz. Saldırmak için Düello Karşı Darbesi kullandığınızda ve isabet ettirdiğinizde, en fazla 10 fit Yerinden Oynatabilirsiniz.

  prerequisites:
  - text: "Düello Karşı Darbesi"

omen://feat/hag-claws?source=paizo-pathfinder-player-core:
  name: Kocakarı Pençeleri
  description: >
    Reşit olduğunuzda tırnaklarınız uzayıp keskinleşti. 1d4 kesme hasarı veren silahsız bir pençe saldırısı kazanırsınız. Pençeleriniz boğuşma grubundadır ve çevik, incelik ve silahsız niteliklerine sahiptir.


omen://feat/hag-magic?source=paizo-pathfinder-player-core:
  name: Kocakarı Büyüsü
  description: >
    Mirasınız sayesinde bir kocakarının büyüsünü kopyalayabilirsiniz. Bir kocakarı meclisinin erişebildiği büyülerden (annenizin türündeki bir kocakarı tarafından meclise kazandırılan büyüler dahil) 4. derece veya daha düşük bir yaygın büyü seçersiniz. Bu büyüyü günde bir kez 4. derece bir okült özgü büyü olarak yapabilirsiniz.

    Tüm meclislerin erişebildiği büyüler Fâl, Büyüle, Duruişiti, Durugörü, Düş Mesajı ve Yanılsama Kılık büyüleridir. En belirgin kocakarı türlerinin sağladığı uygun büyüler şunlardır:
    Guguk Kocakarısı: Kâbus, Büyü Gazabı
    Demir Kocakarı: Toprağa Bağla, Büyü Gazabı
    Deniz Kocakarısı: İnsansı Form, Denizcinin Laneti, Su Üstünde Yürü
    Tatlı Kocakarı: Büyüle, Tatlı Sözler, Dışlanmışın Laneti


omen://feat/hags-sight?source=paizo-pathfinder-player-core:
  name: Kocakarı Görüşü
  description: >
    Kocakarı anneniz tarafından bahşedilen doğaüstü yetenekleri, özellikle de görüşünüzü geliştirdiniz. Karanlıkta görme kazanırsınız.


omen://feat/halfling-lore?source=paizo-pathfinder-player-core:
  name: Buçukluk İlimi
  description: >
    Dengenizi nasıl koruyacağınızı ve güvenli olan gölgelere nasıl sığınacağınızı vazife bilinciyle öğrendiniz; bunlar nesiller boyu aktarılan buçukluk geleneğinin önemli becerileridir. Akrobasi ve Gizlilik becerilerinde eğitimli yetkinlik derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak eğitimli hale gelecekseniz (örneğin geçmişinizden veya sınıfınızdan ötürü), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz.

    Ayrıca Buçukluk İlimi için Ek İlim genel hünerini kazanırsınız.


omen://feat/halfling-luck?source=paizo-pathfinder-player-core:
  name: Buçukluk Şansı
  description: >
    Gamsız doğanız, talihsizlik sanki sizden kaçınıyormuş gibi hissettirir ve bir dereceye kadar bu doğru bile olabilir. Tetikleyici testi yeniden zarlayabilirsiniz, ancak daha kötü olsa bile yeni sonucu kullanmalısınız.


omen://feat/halfling-weapon-familiarity?source=paizo-pathfinder-player-core:
  name: Buçukluk Silah Aşinalığı
  description: >
    Geleneksel buçukluk silahlarını tercih edersiniz, bu yüzden onları daha etkili kullanmayı öğrendiniz. Buçukluk niteliğine sahip tüm sıra dışı silahlara erişim kazanırsınız. Buçukluk niteliğine sahip silahların yanı sıra sapan ve kısa kılıç konusunda aşinalığınız vardır; yetkinlik açısından bunlardan askeri silah olanları basit silah, ileri düzey silah olanları ise askeri silah sayarsınız.

    5. seviyede, bu silahlardan biriyle kritik vuruş yaptığınızda onun kritik uzmanlaşma etkisini elde edersiniz.


omen://feat/halo?source=paizo-pathfinder-player-core:
  name: Hale
  description: >
    İlahi bir Işık kantripinin etkileriyle ışık saçan bir ışık ve iyilik haleniz vardır. Kantrip, seviyenizin yukarı yuvarlanmış yarısına eşit bir büyü derecesine yükseltilir. Haleyi bastırmak veya yeniden oluşturmak için Sürdürebilirsiniz.


omen://feat/hardy-traveler?source=paizo-pathfinder-player-core:
  name: Dayanıklı Gezgin
  description: >
    Yanınızda dostlarınız veya kalbinizde umut varken çok uzak bir yolculuk ya da çok ağır bir yük yoktur. Azami ve yüklü Hacim sınırlarınızı 1 artırırsınız. Ayrıca kara yolculuğu sırasında Hızınıza +10 fitlik bir durumsal bonusu kazanırsınız.


omen://feat/harming-hands?source=paizo-pathfinder-player-core:
  name: Zararlı Eller
  description: >
    Boşluk enerjinizin yakıcı gücü büyür. Zarar Ver yaptığınızda d8 yerine d10 zarlarsınız.

  prerequisites:
  - text: "zararlı pınar"

omen://feat/harmlessly-cute?source=paizo-pathfinder-player-core:
  name: Zararsız Sevimli
  description: >
    Boyutunuz ve tavrınız, başkalarını hiçbir zarar vermeyeceğinize ikna etmenizi kolaylaştırır. Utanmaz Rica beceri hünerini kazanırsınız. Ayrıca inisiyatif için Aldatma zarladığınızda inisiyatif testlerine +1 durumsal bonusu kazanırsınız.


omen://feat/harmonize?source=paizo-pathfinder-player-core:
  name: Ahenkleştir
  description: >
    Tipik olarak aynı anda birden fazla şekilde icra ederek, sesinizi ikiye katlamak için özel vokal teknikleri kullanarak veya şarkınızı ya da konuşmanızı kopyalayan okült büyü yaratarak birden fazla besteyi aynı anda icra edebilirsiniz. Bir sonraki eyleminiz bir beste yapmak ise bu ahenkli bir beste haline gelir. Normal bir bestenin aksine, ahenkli bir beste başka bir beste yaparsanız sona ermez ve ahenkli olanla aynı sırada başka bir beste yapabilirsiniz. Başka bir ahenkli beste yapmak yürürlükteki mevcut ahenkli bestenizi sonlandırır.

  prerequisites:
  - text: "maestro ilham perisi"

omen://feat/haughty-obstinacy?source=paizo-pathfinder-player-core:
  name: Kibirli İnatçılık
  description: >
    Güçlü egonuz başkalarının size emir vermesini zorlaştırır. Eylemlerinizi doğrudan kontrol etmeye çalışan zihinsel bir etkiye karşı kurtarışında bir başarı zarlarsanız, bunun yerine kritik başarı elde edersiniz. Bir yaratık Gözdağı kullanarak sizi Tehdit Etmek için bir testte başarısızlık zarlarsa, bunun yerine kritik başarısızlık elde eder (böylece 1 hafta boyunca sizi tekrar Tehdit Etmeyi deneyemez).


omen://feat/hazard-finder?source=paizo-pathfinder-player-core:
  name: Tehlike Bulucu
  description: >
    Tehlikeleri sezme konusunda sezgisel bir yeteneğiniz vardır. Tuzakları ve tehlikeleri bulmak için yapılan Dikkat testlerine, onların saldırılarına karşı SD'ye ve etkilerine karşı kurtarışlara +1 durumsal bonusu kazanırsınız. Normalde Arama yapmanızı gerektirecek tehlikeleri Arama yapmıyor olsanız bile bulabilirsiniz.


omen://feat/head-stomp?source=paizo-pathfinder-player-core:
  name: Kafaya Basma
  description: >
    Yüzüstü duran bir hedefe silahsız yakın dövüş Vuruşu yapın. İsabet ederse bir sonraki sıranızın sonuna kadar hedef Zihni Bulanmış 1 (veya kritik vuruşta Zihni Bulanmış 2) ve Gafil kalır.


omen://feat/healing-hands?source=paizo-pathfinder-player-core:
  name: Şifalı Eller
  description: >
    Yaşam enerjiniz daha da canlı ve onarıcıdır. İyileştir yaptığınızda d8 yerine d10 zarlarsınız.

  prerequisites:
  - text: "şifalı pınar"

omen://feat/healing-transformation?source=paizo-pathfinder-player-core:
  name: Şifalı Dönüşüm
  description: >
    Yaraları kapatmak ve sakatlıkları onarmak için şekil değiştirme büyüsünden yararlanabilirsiniz. Bir sonraki eyleminiz yalnızca bir yaratığı hedefleyen ve kantrip olmayan bir çokbiçimlilik büyüsü yapmak ise çokbiçimlilik büyünüz o yaratığa büyü derecesi başına 1d6 Can Puanı da kazandırır. Bu bir şifa etkisidir.


omen://feat/hefty-hauler?source=paizo-pathfinder-player-core:
  name: Güçlü Hamal
  description: >
    Bedeninizin ima ettiğinden daha fazlasını taşıyabilirsiniz. Azami ve yüklü Hacim sınırlarınızı 2 artırırsınız.

  prerequisites:
  - text: "Eğitimli Atletizm"

omen://feat/hellspawn?source=paizo-pathfinder-player-core:
  name: Cehennemtohumu
  description: >
    Soyunuz Cehennem'in düzenbaz entrikacıları olan şeytanlara dayanır. Yalanları ve çarpık sözleri fark etmede, onları kurmakta olduğunuz kadar yeteneklisinizdir. Aldatma ve Hukuk İlimi becerilerinde eğitimli olursunuz. Aldatma becerisinde zaten eğitimliyseniz (örneğin geçmişinizden veya sınıfınızdan ötürü), bunun yerine seçtiğiniz bir beceride eğitimli hale gelirsiniz. Ayrıca Bana Yalan Söyle beceri hünerini kazanırsınız.


omen://feat/heroic-presence?source=paizo-pathfinder-player-core:
  name: Kahramanca Heybet
  description: >
    Kahramanların kanı damarlarınızda akar ve müttefiklerinize derinlere inip yeni bir kararlılık seviyesi bulmaları için ilham verirsiniz. 30 fit içindeki en fazla 10 gönüllü yaratığa 6. derece Şevkli İnanç büyüsünün etkilerini bahşedersiniz; ancak o hedefe normalde iğrenç bulacağı bir emir verirseniz etki hedef üzerinde otomatik olarak sona erer. Bu eylem müttefiklerinize nasıl ilham verdiğinize bağlı olarak işitsel veya görsel niteliğe sahiptir.


omen://feat/heroic-recovery?source=paizo-pathfinder-player-core:
  name: Kahramanca İyileşme
  description: >
    Şifanızın tazeleyici gücü alıcıya dinçlik verir. Kullandığınız bir sonraki eylem tek bir yaşayan yaratığı hedef alarak İyileştir yapmak ise ve hedef büyüden Can Puanı geri kazanırsa, hedef bir sonraki sırasının sonuna kadar üç bonus da kazanır: Hızına +5 fit statü bonusu, saldırı zarlarına +1 statü bonusu ve hasar zarlarına +1 statü bonusu. Ek olarak hedef Yüzüstü durumdaysa, reaksiyonları tetiklemeyen bir serbest eylem olarak derhal Ayağa Kalkabilir.

  prerequisites:
  - text: "şifalı pınar"

omen://feat/hex-focus?source=paizo-pathfinder-player-core:
  name: Nazar Odaku
  description: >
    Haminizin öğretileri daha derin bir odaklanmaya ulaşmanızı sağladı. Her Yeniden Odaklandığınızda, odak havuzunuzu tamamen doldurursunuz.


omen://feat/hex-master?source=paizo-pathfinder-player-core:
  name: Nazar Ustası
  description: >
    Haminizle olan bağı o kadar eksiksiz somutlaştırırsınız ki nazarlarınızı hızlı birbiri ardına yapabilirsiniz. Artık her sıra yalnızca tek bir nazar yapmakla sınırlı değilsiniz. Ek olarak, bir nazarı sürdürmek için Kıkırdama yaptığınızda, süresi sürdürülen olan tüm aktif nazarlarınız için Sürdürme etkilerini kazanırsınız.


omen://feat/hidden-paragon?source=paizo-pathfinder-player-core:
  name: Gizli Timsal
  description: >
    Gözden kaybolduğunuzda tamamen yok olursunuz. Düşmanca bir eylem kullansanız bile 1 dakika boyunca Görünmez olursunuz. Açığa Çıkaran Işık, Görünmeyeni Gör veya benzeri etkiler bile sizi açığa çıkaramaz; ancak yaratıklar normal şekilde yerinizi tespit etmek için yine de Tara eylemini kullanabilir.

  prerequisites:
  - text: "Efsanevi Gizlilik"

omen://feat/hierophants-power?source=paizo-pathfinder-player-core:
  name: Hiyerofantın Gücü
  description: >
    Kendinizi doğal dünyayla iç içe geçirdiniz ve onun tüm gücü içinizden akıp geçer. İlave bir 10. derece büyü slotu kazanırsınız.


omen://feat/hobnobber?source=paizo-pathfinder-player-core:
  name: Ayaküstü Sohbetçi
  description: >
    Sohbet yoluyla bilgi edinme konusunda yeteneklisinizdir. Bilgi Topla keşif faaliyeti normalin yarısı kadar sürer (genellikle süreyi 1 saate indirir). Diplomasi becerisinde ustaysanız ve Bilgi Toplamak için kritik başarısızlık zarlarsanız, bunun yerine başarısızlık elde edersiniz. Yine de Bilgi Topla ile öğrendiğiniz bir söylentinin doğru olduğunun garantisi yoktur.

  prerequisites:
  - text: "Eğitimli Diplomasi"

omen://feat/hold-mark?source=paizo-pathfinder-player-core:
  name: Hisar İzi
  description: >
    Topluluğunuzun maharetinin nişanıyla güçlendirilmiş yaralar veya dövmeler taşırsınız. Bu hüneri seçtiğinizde aşağıdaki tablodan seçeneklerden birini belirlersiniz. Listelenen beceride eğitimli olursunuz ve listelenen gelenekten gelen büyülere karşı kurtarışlara +1 statü bonusu kazanırsınız. Seçilen amblem veya benzer bir konsept şeklinde büyük bir dağlama veya dövme kazanırsınız (örneğin Yanan Güneş bir meşale, güneş, volkan veya başka bir ateşli sembol olabilirken, Boş El bir yumruk veya pençe olabilir).

    Hisar İzi Amblemi | Beceri | Gelenek
    Yanan Güneş | Diplomasi | Mistik
    Ölüm Başı | Hayatta Kalma | Doğa
    Kirletilmiş Ceset | Din | İlahi
    Boş El | Gözdağı | Okült


omen://feat/homeward-bound?source=paizo-pathfinder-player-core:
  name: Yuvaya Dönüş
  description: >
    Sizinle İlk Dünya arasındaki bağ bedeninizde çoğu gnomdakinden daha güçlü yankılanır ve Evren ile İlk Dünya arasındaki eşiği aşmanıza olanak tanır. Doğa özgü büyü olarak Düzlemlerarası Işınlanma kazanırsınız. Bunu haftada iki kez yapabilirsiniz. Bu büyü yalnızca İlk Dünya ile Evren arasında gidip gelmek için kullanılabilir. Bedeninizin doğal rezonansı sayesinde büyü için bir odak noktası görevi görebilirsiniz ve özel olarak uyumlanmış bir düzlemsel anahtara ihtiyaç duymazsınız.


omen://feat/house-of-imaginary-walls?source=paizo-pathfinder-player-core:
  name: Hayali Duvarlar Evi
  description: >
    Başkalarının gerçek olduğuna inandığı hayali bir bariyer dikersiniz. Hayali Duvarlar Evi beste kantripini öğrenirsiniz.


omen://feat/hunted-shot?source=paizo-pathfinder-player-core:
  name: Av Atışı
  description: >
    Avladığınız hedefe iki hızlı atış yaparsınız. Gerekli silahla av peşine düştüğünüz hedefinize iki Vuruş Yapın. Her ikisi de aynı yaratığa isabet ederse dirençler ve zaaflar açısından hasarlarını birleştirin. Çoklu saldırı cezanızı her bir Vuruşa normal şekilde uygulayın.


omen://feat/hunters-aim?source=paizo-pathfinder-player-core:
  name: Avcının Nişanı
  description: >
    Nişan almaya odaklandığınızda saldırınız özellikle isabetli hale gelir. Av peşine düştüğünüz hedefinize menzilli bir silahla Vuruş Yapın. Bu Vuruşta saldırı zarına +2 durumsal bonusu kazanırsınız ve avınızın Gizlenmiş durumunu ile tüm zayıf siperlerini göz ardı edersiniz.


omen://feat/hymn-of-healing?source=paizo-pathfinder-player-core:
  name: Şifa İlahisi
  description: >
    Müziğinizi müttefiklerinizin yaralanmalardan kurtulmasına yardımcı olan zengin melodilerle dolduran Şifa İlahisi beste büyüsünü öğrenirsiniz.


omen://feat/illusion-sense?source=paizo-pathfinder-player-core:
  name: İllüzyon Sezisi
  description: >
    Atalarınız günlerini illüzyonlarla örtülü ve kucaklanmış olarak geçirdiler; sonuç olarak illüzyon büyüsünü hissetmek sizin için ikinci bir doğadır. İllüzyonlara karşı hem Dikkat testlerine hem de İrade kurtarışlarına +1 durumsal bonusu kazanırsınız.

    İnanılmayabilecek bir illüzyonun 10 fit yakınına geldiğinizde, illüzyonla Etkileşime Girmek için bir eylem harcamamış olsanız bile GM ona inanmamanız için sizin adınıza gizli bir test zarlar.


omen://feat/impaling-briars?source=paizo-pathfinder-player-core:
  name: Saplanan Çalılar
  description: >
    Bir alanı yıkıcı çalılarla doldurabilirsiniz. Saplanan Çalılar düzen büyüsünü kazanırsınız.

  prerequisites:
  - text: "yaprak düzeni"

omen://feat/impeccable-crafting?source=paizo-pathfinder-player-core:
  name: Kusursuz Zanaat
  prerequisites:
  - text: "Usta Zanaat"
  - text: "Uzmanlık Zanaatı"

omen://feat/implausible-infiltration?source=paizo-pathfinder-player-core:
  name: Akılalmaz Sızma
  description: >
    Küçük kusurları bulur ve bir şekilde kendinizi bunlardan geçirirsiniz, muhtemelen doğrudan duvarın veya zeminin içinden geçersiniz. Duvar veya zemin ahşap, sıva veya taştan başka bir şeyden yapılmışsa; 10 fitten daha kalınsa veya ince bir metal tabakası bile içeriyorsa hareket girişiminiz başarısız olur. Tırmanma Hızınız varsa bu yeteneği bir tavanın içinden geçmeyi denemek için kullanabilirsiniz.

  prerequisites:
  - text: "Efsanevi Akrobasi"
  - text: "Hızlı Sıyrılma"

omen://feat/implausible-purchase-rogue?source=paizo-pathfinder-player-core:
  name: Akılalmaz Tedarik (Düzenbaz)
  description: >
    Eşya satın aldıktan sonra daha önce kullanmış olsanız bile Öngörülü Plancı hünerini kullanabilirsiniz ve eşyayı çekmek için 2 eylemlik bir faaliyet yerine tek bir eylem olarak Etkileşime Girebilirsiniz. Ek olarak, günde beş kez Öngörülü Plancı'yı seviyenizden 6 seviyeye kadar daha düşük yaygın bir sarf malzemesini çekip çıkarmak için kullanabilirsiniz.

  prerequisites:
  - text: "Öngörülü Satın Alım"

omen://feat/impossible-flurry?source=paizo-pathfinder-player-core:
  name: İmkânsız Yaylım
  description: >
    İmkânsız bir hızda saldırmak için hassasiyetten vazgeçersiniz. Gerekli silahların her biriyle üçer yakın dövüş Vuruşu yapın. Her bir silahla yapacağınız ilk saldırı, sanki bu sıra zaten bir vuruş yapmışsınız gibi çoklu saldırı cezası alır. Kalan tüm Vuruşlar azami çoklu saldırı cezasını alır.


omen://feat/impossible-polymath?source=paizo-pathfinder-player-core:
  name: İmkânsız Hezarfen
  description: >
    Ezoterik formülleriniz o kadar sıra dışıdır ki diğer ozanların anlamadığı farklı geleneklerden büyüleri denemenize olanak tanır. Arkana becerisinde eğitimli olduğunuz sürece Ezoterik Hezarfen'den kitabınıza mistik büyüler ekleyebilirsiniz; Doğa becerisinde eğitimli olduğunuz sürece kitabınıza doğa büyüleri ekleyebilirsiniz; ve Din becerisinde eğitimli olduğunuz sürece kitabınıza ilahi büyüler ekleyebilirsiniz.

    Kitabınızdaki diğer büyüleriniz gibi, Ezoterik Hezarfen kullanarak her gün başka bir gelenekten gelen bu büyülerden birini repertuarınıza okült bir büyü olarak ekleyebilirsiniz; ancak Eklektik Hezarfen'e sahip olsanız bile tekrar hazırlık yaptığınızda başka bir gelenekten gelen hiçbir büyüyü elinizde tutamazsınız.

  prerequisites:
  - text: "Eğitimli Arkana, Doğa veya Din"
  - text: "Ezoterik Hezarfen"

omen://feat/impossible-striker?source=paizo-pathfinder-player-core:
  name: İmkânsız Vurucu
  description: >
    Rakibiniz gelen her darbeyi görebilse bile hiçbir şey sinsi bir vuruş yapmanızı engelleyemez. Kurnaz Vurucu hasarını vermek yerine, hedef Gafil olmasa bile hedefe tam sinsi saldırı hasarınızı verebilirsiniz.

  prerequisites:
  - text: "Kurnaz Vurucu"

omen://feat/impossible-volley?source=paizo-pathfinder-player-core:
  name: İmkânsız Salvo
  description: >
    Bir alandaki tüm düşmanlara yaylım ateşi açarsınız. Silahınızın salvo menzilinde veya ötesinde odaklanmış bir patlama içindeki her düşmana karşı –2 ceza ile bir Vuruş Yapın. Tüm hedefler için hasarı yalnızca bir kez zarlayın.

    Her saldırı çoklu saldırı cezanıza dahil edilir, ancak tüm saldırılarınızı yapana kadar cezanızı artırmayın.


omen://feat/impressive-performance?source=paizo-pathfinder-player-core:
  name: Etkileyici Performans
  description: >
    Performanslarınız hayranlık uyandırır ve size hayranlar kazandırır. Diplomasi yerine Gösteri kullanarak İyi İzlenim Bırakabilirsiniz. Bir seyirci kitlesi önünde en az 10 dakika performans sergilerseniz tüm performans boyunca orada bulunan seyircilerden en fazla 10 kişiyi hedefleyerek normal ceza almadan İyi İzlenim Bırakabilirsiniz. Hedef sayısı 1 saatlik performans için 20'ye, 2 saatlik performans için 50'ye çıkar.

  prerequisites:
  - text: "Eğitimli Gösteri"

omen://feat/improved-dueling-riposte?source=paizo-pathfinder-player-core:
  name: Geliştirilmiş Düello Karşı Darbesi
  description: >
    Silahınız fırıl fırıl döner ve fırlar; en ufak bir açık veya zayıflık anı belirdiğinde düşmanlara darbe indirir. Düello Savuşturması'ndan faydalanmıyor olsanız bile Düello Karşı Darbesi kullanabilirsiniz (yine de tek bir tek elli silah kuşanmış olmalı ve başka hiçbir şey tutmamalısınız). Her bir sıranızın başında, yalnızca bir Düello Karşı Darbesi yapmak için kullanabileceğiniz ilave bir reaksiyon kazanırsınız.

  prerequisites:
  - text: "Düello Karşı Darbesi"

omen://feat/improved-poison-weapon?source=paizo-pathfinder-player-core:
  name: Geliştirilmiş Zehirli Silah
  description: "Zehirleri zararlı etkilerini en üst düzeye çıkaracak şekillerde uygularsınız. Silahı Zehirle ile basit bir zehir uyguladığınızda, zehir 1d4 zehir hasarı yerine 2d4[poison] hasar verir. Silahı Zehirle ile uyguladığınız bir zehri kritik başarısız olan bir saldırı zarında boşa harcamazsınız."
  prerequisites:
  - text: "Silahı Zehirle"

omen://feat/improved-swift-banishment?source=paizo-pathfinder-player-core:
  name: Geliştirilmiş Hızlı Sürgün
  description: >
    Yaratıkları silahınızla kolayca sürgün edersiniz. Sürgün hazırlanmamış olsa bile 5. derece veya daha yüksek bir büyü slotunuz kaldığı sürece Hızlı Sürgün kullanabilirsiniz. 5. derece veya daha yüksek hazırlanmış bir büyüyü feda etmelisiniz ve yarattığınız sürgün etkisi o büyünün derecesine yükseltilir. Hedef sanki sürgün için fazladan bedel ödemişsiniz gibi kurtarışına –2 durumsal cezası alır.

  prerequisites:
  - text: "Hızlı Sürgün"

omen://feat/improved-twin-riposte-fighter?source=paizo-pathfinder-player-core:
  name: Geliştirilmiş İkiz Karşı Darbe (Savaşçı)
  description: >
    Silahlarınız bir girdap gibi dönerek düşmanlarınızı engeller ve ısırır. İkiz Savuşturma'dan faydalanmıyor olsanız bile İkiz Karşı Darbe kullanabilirsiniz. Her bir sıranızın başında, yalnızca bir İkiz Karşı Darbe yapmak için kullanabileceğiniz ilave bir reaksiyon kazanırsınız.

  prerequisites:
  - text: "İkiz Karşı Darbe"

omen://feat/improved-twin-riposte-ranger?source=paizo-pathfinder-player-core:
  name: Geliştirilmiş İkiz Karşı Darbe (Korucu)
  description: >
    Her bir sıranızın başında, yalnızca bir İkiz Karşı Darbe gerçekleştirmek için kullanabileceğiniz ilave bir reaksiyon kazanırsınız. İkiz Savuşturma'dan faydalanmıyor olsanız bile İkiz Karşı Darbe kullanabilirsiniz (yine de her bir elinizde birer tane olmak üzere iki yakın dövüş silahı kuşanıyor olmalısınız).

  prerequisites:
  - text: "İkiz Karşı Darbe"

omen://feat/in-tune?source=paizo-pathfinder-player-core:
  name: Uyum İçinde
  description: >
    Performanstaki büyük hünerinizi bir başkasına uyumlar, sanki herkes yapabilirmiş gibi ona hünerinizden küçük bir pay bahşedersiniz. Bir sonraki eyleminiz yayılım alanına sahip bir beste büyüsü yapmak ise bu alan sizden değil, 60 fit içinde seçeceğiniz gönüllü bir müttefikten yayılır.

    Yönlendirilmiş Dinleyici hünerine sahipseniz bu koninin bunun yerine müttefikten çıkmasını sağlayabilirsiniz.

  prerequisites:
  - text: "maestro ilham perisi"

omen://feat/incredible-aim?source=paizo-pathfinder-player-core:
  name: İnanılmaz Nişan
  description: >
    Odaklanmak için bir an ayırarak saldırınızın hedefe tam oturmasını sağlarsınız. Menzilli bir silahla Vuruş Yapın. Bu Vuruşta saldırı zarına +2 durumsal bonusu kazanırsınız ve hedefin Gizlenmiş durumunu göz ardı edersiniz.


omen://feat/incredible-companion-druid?source=paizo-pathfinder-player-core:
  name: İnanılmaz Yoldaş (Druid)
  description: >
    Yoldaş Hayvanınız büyümeye ve gelişmeye devam eder. Kıvrak veya vahşi bir yoldaş hayvanına dönüşür ve türe göre belirlenen ilave kabiliyetler kazanır.

  prerequisites:
  - text: "Yetişkin Yoldaş Hayvan"

omen://feat/incredible-companion-ranger?source=paizo-pathfinder-player-core:
  name: İnanılmaz Yoldaş (Korucu)
  description: >
    Yoldaş Hayvanınız büyümeye ve gelişmeye devam eder. Kıvrak veya vahşi bir yoldaş hayvanına dönüşür (sizin seçiminiz) ve yoldaşın türüne göre belirlenen ilave kabiliyetler kazanır.

  prerequisites:
  - text: "Yetişkin Yoldaş Hayvan"

omen://feat/incredible-familiar?source=paizo-pathfinder-player-core:
  name: İnanılmaz Ruhdaş Hayvan
  description: >
    Thaumaturge: Her bir büyü geleneğinin en iyi kısımlarını alarak, ruhdaş hayvanınıza diğer ruhdaş hayvanlardan daha da fazla yetenek bahşetmenin bir yolunu buldunuz.
    Witch: Ruhdaş Hayvanınız diğer ruhdaş hayvanlardan daha da fazla büyüyle aşılanmıştır.
    Her gün dört yerine altı ruhdaş hayvan veya usta yeteneği seçebilirsiniz.

  prerequisites:
  - text: "Gelişmiş Ruhdaş Hayvan"

omen://feat/incredible-ferocity?source=paizo-pathfinder-player-core:
  name: İnanılmaz Vahşet
  description: >
    Ölümün kıyısından dönülen bir sıyrıktan sonra kendinizi toparlamak için zaman verildiğinde vahşetinizi yeniden toplayabilir ve ilave bitirici darbelere dayanabilirsiniz. Ork Vahşeti hünerini günde bir kez yerine saatte bir sıklıkla kullanabilirsiniz.

  prerequisites:
  - text: "Ork Vahşeti"

omen://feat/incredible-improvisation?source=paizo-pathfinder-player-core:
  name: İnanılmaz Doğaçlama
  description: >
    Bir deha kıvılcımı, deneyimsizliğinize rağmen bir beceride size büyük bir avantaj sağlar. Tetikleyici beceri testine +4 durumsal bonusu kazanırsınız.

  prerequisites:
  - text: "Becerikli Doğaçlamacı"

omen://feat/incredible-initiative?source=paizo-pathfinder-player-core:
  name: İnanılmaz İnisiyatif
  description: >
    Başkalarının yapabileceğinden daha hızlı tepki verirsiniz. İnisiyatif zarlarına +2 durumsal bonusu kazanırsınız.


omen://feat/incredible-investiture?source=paizo-pathfinder-player-core:
  name: İnanılmaz Donanım
  description: >
    Daha fazla sihirli eşyayı donanma konusunda inanılmaz bir yeteneğiniz vardır. Donanımlı eşya sınırınızı 10'dan 12'ye çıkarırsınız.

  prerequisites:
  - text: "Karizma +3"

omen://feat/incredible-ricochet?source=paizo-pathfinder-player-core:
  name: İnanılmaz Sekme
  description: >
    İlk atışınız rakibinizin konumunu belirledikten sonra engellerden seken ve şaşmadan vuran bir diğer atışı yönlendirirsiniz. Bu sıra daha önce saldırdığınız bir yaratığa karşı menzilli bir silahla Vuruş Yapın. Hedefin Gizlenmiş durumunu ve tüm siperleri göz ardı edersiniz.

  prerequisites:
  - text: "İnanılmaz Nişan"

omen://feat/infinite-possibilities?source=paizo-pathfinder-player-core:
  name: Sonsuz İhtimaller
  description: >
    Zihninizde aynı anda birçok farklı ihtimal olarak var olan bir büyü slotu hazırlayabilirsiniz. Günlük hazırlıklarınız sırasında bir kez, bir büyü slotunu bir büyü hazırlamak için kullanmak yerine bu sonsuz potansiyeli tutmak için kullanabilirsiniz. Bu büyü slotunu büyü kitabınızdan belirlediğiniz yuvadan en az 2 derece daha düşük olan herhangi bir büyüyü yapmak için kullanabilirsiniz; büyü her bakımdan 2 derece daha düşük bir büyü gibi işlev görür. Büyüyü yapana kadar o yuvada özel olarak hazırlanmış hiçbir büyünüz yoktur.


omen://feat/initiate-warden?source=paizo-pathfinder-player-core:
  name: Çömez Muhafız
  description: >
    Özelleşmiş bir doğa büyüsü türü uygulayan ve muhafız olarak bilinen korucu tarikatlarından biriyle eğitim aldınız. Bu başlangıç muhafız büyülerinden birini (veya erişiminiz olan başka birini) seçerek kazanırsınız:
    Yerçekimi Silahı
    Yoldaşı İyileştir
    Büyülü Post


omen://feat/insect-shape?source=paizo-pathfinder-player-core:
  name: Böcek Formu
  description: >
    Yaşama dair kavrayışınız genişleyerek daha geniş bir yaratık yelpazesini taklit etmenize olanak tanır. Böcek Formu içindeki şekilleri Ehlileşmemiş Form listenize eklersiniz. Haşere formunda listelenen uçmayan böcek şekillerine çokbiçimlenmek için ehlileşmemiş form her kullandığınızda, süre 10 dakika yerine 24 saattir.

  prerequisites:
  - text: "Ehlileşmemiş Form"

omen://feat/inspirational-focus?source=paizo-pathfinder-player-core:
  name: İlham Verici Odak
  description: >
    İlham perinizle olan bağınız size sıra dışı bir odaklanma bahşetti. Her Yeniden Odaklandığınızda, odak havuzunuzu tamamen doldurursunuz.


omen://feat/inspire-imitation?source=paizo-pathfinder-player-core:
  name: Örnek Oluş
  description: >
    Eylemleriniz müttefiklerinize büyük başarılar için ilham verir. Bir beceri testinde kritik başarı elde ettiğinizde, aynı beceriyi kullanan bir müttefike yardım etmeye çalışırken bunu hazırlamak için bir eylem harcamamış olsanız bile otomatik olarak Yardım Etme reaksiyonunu kullanmaya hak kazanırsınız.


omen://feat/inspired-stratagem?source=paizo-pathfinder-player-core:
  name: İlham Veren Strateji
  description: >
    Günlük hazırlıklarınız sırasında günün maceraları için en fazla beş müttefikle birlikte hileleri gözden geçirebilirsiniz. Daha sonra İlham Veren Strateji reaksiyonunu kullanarak planlarınız konusunda onlara hızlıca tavsiyede bulunabilirsiniz.


omen://feat/instant-opening?source=paizo-pathfinder-player-core:
  name: Anlık Açık
  description: >
    Seçilmiş birkaç söz veya kaba bir jestle rakibinizin dikkatini dağıtırsınız. 30 fit içinde bir hedef seçin. Bir sonraki sıranızın sonuna kadar saldırılarınıza karşı Gafil kalır. Dikkati nasıl dağıttığınızı tarif edişinize bağlı olarak bu eylem işitsel veya görsel nitelik kazanır.


omen://feat/instinctive-obfuscation?source=paizo-pathfinder-player-core:
  name: İçgüdüsel Gizlenme
  description: >
    İçinizdeki büyü tehditlere karşı doğal bir tepki olarak kendini gösterir. Kısa bir an için alanınızda illüzyondan bir kopyanız belirir. Tetikleyici saldırgan bir düz test zarlamalıdır; başarı durumunda saldırı normal şekilde sizi hedefler; başarısız olursa saldırı kopyayı hedefler ve onu yok eder. Bu eylemin geleneği gnom soy seçeneklerinizin geleneğiyle eşleşir.

  prerequisites:
  - text: "gnom mirasından veya gnom soy hünerinden kazanılmış en az bir mistik ya da okült özgü büyü"

omen://feat/instinctive-support?source=paizo-pathfinder-player-core:
  name: İçgüdüsel Destek
  description: >
    Yoldaş Hayvanınızı desteklediğinizde, yoldaşınız da karşılığında sizi destekler. Büyünüz gerçekleştikten sonra, sanki ona Komut Vermişsiniz gibi yoldaşınız o sıra için eylemlerini kazanır ve bu eylemlerden biri Destek olmalıdır. Yoldaş halihazırda başka eylemler kullandıysa, normalde olduğu gibi sizi Destekleyemez.

  prerequisites:
  - text: "Yoldaş Hayvan"

omen://feat/intimidating-glare?source=paizo-pathfinder-player-core:
  name: Korkutucu Bakış
  description: >
    Yalnızca bir bakışla Gözdağı Verebilirsiniz. Bunu yaptığınızda, Gözdağı Ver eylemi işitsel niteliği kaybedip görsel nitelik kazanır ve yaratık dilinizi anlamıyorsa ceza almazsınız.

  prerequisites:
  - text: "Eğitimli Gözdağı"

omen://feat/intimidating-prowess?source=paizo-pathfinder-player-core:
  name: Korkutucu Maharet
  description: >
    Tehditle Zorladığınızda veya Gözdağı Verdiğinizde hedefi fiziksel olarak yıldırabileceğiniz durumlarda, Gözdağı testinize +1 durumsal bonusu kazanırsınız ve ortak bir dili paylaşmama cezasını göz ardı edersiniz. Kuvvet niteleyiciniz +5 veya daha yüksekse ve Gözdağı becerisinde ustaysanız bu bonus +2'ye çıkar.

  prerequisites:
  - text: "Kuvvet +3"
  - text: "Uzman Gözdağı"

omen://feat/intimidating-strike?source=paizo-pathfinder-player-core:
  name: Korkutucu Vuruş
  description: >
    Darbeniz yaratıkları yalnızca yaralamakla kalmaz, aynı zamanda onların özgüvenini de yerle bir eder. Yakın dövüş Vuruşu yapın. Vurur ve hasar verirseniz hedef Korkmuş 1 olur (veya kritik vuruşta Korkmuş 2).


omen://feat/inventor?source=paizo-pathfinder-player-core:
  name: Mucit
  description: >
    Zanaat konusunda bir dehasınız; eşyaların nasıl yapıldığını kolayca belirleyebilir ve yeni icatlar ortaya koyabilirsiniz. Bilmediğiniz yaygın bir formülü icat etmek için ara zaman harcayabilirsiniz. Bu süreç tıpkı Zanaat faaliyeti gibi işler: formülün Fiyatının yarısını peşin öder, bir Zanaat testi dener ve başarı durumunda ya aradaki farkı ödeyerek formülü tamamlarsınız ya da Fiyatı düşürmek için daha uzun süre çalışırsınız. Aradaki fark, fazladan zamanı bir eşya yaratmak yerine araştırma, tasarım ve geliştirme süreçlerinde harcamanızdır. Tamamlandığında, icat ettiğiniz yeni formülü formül defterinize eklersiniz.

    GM genellikle artırılmış bir ZD ile sıra dışı veya nadir formülleri icat etmenize izin verebilir. Simyasal formüller icat etmek için Simyasal Zanaat hünerine, büyülü formüller icat etmek içinse Büyülü Zanaat hünerine ihtiyacınız vardır.

  prerequisites:
  - text: "Uzman Zanaat"

omen://feat/inviolable?source=paizo-pathfinder-player-core:
  name: Dokunulmaz
  description: "İlahınız size zarar veren yaratıkları cezalandırır. Bir saldırıyla size vuran yaratıklar bunu her yaptıklarında 3d6[spirit] hasar alır. Mübarek veya şerli özelliğe sahipseniz, bunu bu hasara uygulayabilirsiniz."

omen://feat/invoke-disaster?source=paizo-pathfinder-player-core:
  name: Felaketi Çağır
  description: >
    Doğanın gazabını düşmanlarınızın üzerine çağırabilirsiniz. Fırtına Lordu düzen büyüsünü kazanırsınız.

  prerequisites:
  - text: "Rüzgâr Çağıran"

omen://feat/iron-fists?source=paizo-pathfinder-player-core:
  name: Demir Yumruklar
  description: >
    Yumruklarınız savaşla dövülmüş, doğal olarak sert olan deriniz ve yoğun kemikleriniz çatışmalarla daha da pekişmiştir. Yumruk silahsız saldırılarınız artık ölümcül olmayan niteliğine sahip değildir ve itme silah niteliğini kazanır.


omen://feat/irrepressible-halfling?source=paizo-pathfinder-player-core:
  name: Bastırılamaz (Buçukluk)
  description: >
    Korkularınız ve duygularınızla oynama girişimlerini kolayca savuşturabilirsiniz. Bir duygu etkisine karşı kurtarışında başarı zarladığınızda, bunun yerine kritik başarı elde edersiniz. Mirasınız cesur buçukluk ise, bir duygu etkisine karşı kurtarışında kritik başarısızlık zarladığınızda bunun yerine başarısızlık elde edersiniz.


omen://feat/irresistible-magic?source=paizo-pathfinder-player-core:
  name: Karşı Konulamaz Büyü
  description: >
    Ejderhaların, öte dünyalı varlıkların ve belirli diğer güçlü yaratıkların büyüye karşı sahip olduğu doğuştan savunmaları aşmanın yollarını incelediniz. Büyüye karşı kurtarışlarına statü bonusu olan herhangi bir yaratık, büyülerinize karşı bu bonusu 1 azaltır.


omen://feat/junk-tinker?source=paizo-pathfinder-player-core:
  name: Hurda Tamircisi
  description: >
    Bükülmüş veya paslanmış hurdadan bile kullanışlı aletler yapabilirsiniz. Zanaat becerisini Zanaat Yapmak için kullanırken, hurdalardan silahlar ve zırhlar da dahil olmak üzere 0. seviye eşyalar yapabilirsiniz. Bu, Fiyatı olağan miktarın dörtte birine düşürür ancak her zaman kalitesiz bir eşyayla sonuçlanır. Kalitesiz eşyalar normalde bir ceza verir, ancak yaptığınız kalitesiz eşyaları kullanırken bu cezayı almazsınız (yaptığınız kalitesiz zırhın daha kötü test cezası da sizin için geçerli olmaz).

    Herhangi bir eşyayı Zanaat Ederken paradan tasarruf etmek için hurda da dahil edebilirsiniz. Bu, maliyeti düşürmek için 1 gün fazladan çalışmışsınız gibi eşyada bir indirim sağlar, ancak eşyanın bariz şekilde hurdadan yapıldığı görülür. GM'nin takdirine bağlı olarak bu durum alıcının zevkine göre eşyanın yeniden satış değerini etkileyebilir.


omen://feat/keen-magical-detection?source=paizo-pathfinder-player-core:
  name: Keskin Büyü Tespiti
  description: >
    Büyülü tehlikeleri sezersiniz. Büyü Tespit Et keşif faaliyetini kullanırken, en az bir rakibinizin üzerinde büyülü bir etki veya sihirli eşya bulunduğu ve Büyü Tespit Et menzilinizde olduğu sürece inisiyatifi iki kez zarlayabilir ve daha iyi olan sonucu kullanabilirsiniz.


omen://feat/kip-up?source=paizo-pathfinder-player-core:
  name: Sıçrayıp Kalkma
  description: >
    Ayağa kalkarsınız. Bu hareket reaksiyonları tetiklemez.

  prerequisites:
  - text: "Usta Akrobasi"

omen://feat/kneecap?source=paizo-pathfinder-player-core:
  name: Diz Kapağı Vuruşu
  description: >
    Erişiminiz içindeki bir düşmanın dizine, kaval kemiğine veya diğer savunmasız anatomisine cezalandırıcı bir darbe indirirsiniz. Yakın dövüş silahı veya yakın dövüş silahsız saldırısıyla yakın dövüş Vuruşu yapın. Bu saldırı hasar vermez. İsabet halinde hedef Hızına –10 fitlik statü cezası alır (veya kritik vuruşta –15 fitlik statü cezası). Ceza 1 tur sürer. Bu ceza yalnızca hedefin kara Hızı varsa ve kara Hızını kullanmak için bacaklara ya da hedeflenebilir diğer uzuvlara bağımlıysa uygulanır. Hıza uygulanan tüm cezalarda olduğu gibi bu durum bir yaratığın Hızını 5 fitin altına düşüremez.


omen://feat/knowledge-is-power-wizard?source=paizo-pathfinder-player-core:
  name: Bilgi Güçtür (Wizard)
  description: >
    Bir yaratık hakkındaki akademik bilginiz, onları alt etmek için büyünüzü ustaca değiştirmenize olanak tanır. Bir yaratık hakkında Bilgi Hatırla testinde kritik başarı elde ettiğinizde, ona karşı yapacağınız bir sonraki saldırıya veya savunması gereken yapacağınız bir sonraki büyüye karşı yaratığın SD ve kurtarışlarına –1 durumsal cezası almasını sağlamak için bilginizi devreye sokabilirsiniz. Yaratık size saldırdığında veya etkilerinden birine karşı kurtarış denemenize neden olduğunda bir sonraki sefer saldırısına veya ZD'sine aynı cezayı alır.

    Bu bilgiyi müttefiklerinizle paylaşırsanız onlar da faydalanır. Kullanılmazsa bonuslar 1 dakika sonra sona erer.


omen://feat/lasting-armament?source=paizo-pathfinder-player-core:
  name: Kalıcı Teçhizat
  description: >
    Bir silaha keramet bahşettiğinizde uzun bir süre kerametli olarak kalır. Teçhizata Keramet Bahşet'in süresi 1 saate çıkar, ancak Teçhizata Keramet Bahşet'i başka bir silah üzerinde kullanırsanız yine de sona erer.

  prerequisites:
  - text: "Teçhizata Keramet Bahşet"

omen://feat/lasting-coercion?source=paizo-pathfinder-player-core:
  name: Kalıcı Tehditle Zorlama
  description: >
    Birini başarılı bir şekilde Tehditle Zorladığınızda, boyun eğdikleri azami süre (yine GM tarafından belirlenmek üzere) bir haftaya çıkar. Efsaneviyseniz azami süre bir aya çıkar.

  prerequisites:
  - text: "Uzman Gözdağı"

omen://feat/lawbringer?source=paizo-pathfinder-player-core:
  name: Yasa Getiren
  description: >
    Soyunuzu Cennet'in yedi katlı dağının muhafızları, faniler arasında yasa ve erdemin besleyicileri olan arkonlara dayandırırsınız. Duygu etkilerine karşı kurtarışlara +1 durumsal bonusu kazanırsınız ve bir duygu etkisine karşı kurtarışta başarı zarlarsanız bunun yerine kritik başarı elde edersiniz.


omen://feat/leave-an-opening?source=paizo-pathfinder-player-core:
  name: Açık Bırak
  description: >
    Yeterince sert vurduğunuzda müttefikinizin de aksiyona dahil olabilmesi için bir açık bırakırsınız. Gafil bir rakibe yakın dövüş saldırısıyla kritik vuruş yapıp hasar verdiğinizde, hedef, düşman sanki bir manipülasyon eylemi kullanmışçasına bu reaksiyona sahip seçtiğiniz bir müttefikten bir Reaktif Vuruş reaksiyonunu tetikler.


omen://feat/legendary-codebreaker?source=paizo-pathfinder-player-core:
  name: Efsanevi Şifre Çözücü
  description: >
    Diller ve kodlar konusundaki beceriniz o kadar büyüktür ki bir metne yalnızca hızlıca göz atarak bilgileri deşifre edebilirsiniz. Normal hızda okurken Sosyoloji kullanarak Yazı Çözümleyebilirsiniz. Yavaşlar ve normalde gereken sürenin tamamını harcayıp bir başarı zarlarsanız, kritik başarı elde edersiniz; normal süreyi harcarken kritik başarı elde ederseniz belgeyi neredeyse kelimesi kelimesine anlarsınız.

  prerequisites:
  - text: "Efsanevi Sosyoloji"

omen://feat/legendary-linguist?source=paizo-pathfinder-player-core:
  name: Efsanevi Dilbilimci
  description: >
    Diller konusunda o kadar yeteneklisinizdir ki anında bir kırma dil oluşturabilirsiniz. Basitleştirilmiş terimler kullanan ve temel kavramları aktaran yeni bir kırma dil oluşturarak dili olan herhangi bir yaratıkla—bilmediğiniz bir dil olsa bile—her zaman konuşabilirsiniz. Bunu yapmak için öncelikle yaratığın en azından hangi iletişim ortamını kullandığını (konuşma, işaret dili vb.) anlamalısınız.

  prerequisites:
  - text: "Efsanevi Sosyoloji"
  - text: "Çokdilli"

omen://feat/legendary-medic?source=paizo-pathfinder-player-core:
  name: Efsanevi Sıhhiyeci
  description: >
    Mucizevi sonuçlar veren tıbbi atılımlar veya teknikler keşfettiniz. Her bir hedef için günde bir kez, o hedefi tedavi etmek üzere 1 saat harcayabilir ve bir hastalığı ya da Kör, Sağır, Lanetlenmiş veya Takatsiz durumunu ortadan kaldırmak için bir Tıp testi deneyebilirsiniz. Hastalığın ya da durumu yaratan büyünün veya etkinin ZD'sini kullanın. Etkinin kaynağı bir kutsal emanet ise, 20. seviyenin üzerindeyse veya benzer şekilde güçlüyse ZD'yi 10 artırın.

  prerequisites:
  - text: "Efsanevi Tıp"

omen://feat/legendary-monster-hunter?source=paizo-pathfinder-player-core:
  name: Efsanevi Canavar Avcısı
  description: >
    Canavarlar hakkındaki bilginiz o kadar inanılmazdır ki avınızdaki bariz kusurları açığa çıkarır. Canavar Avcısı'ndan aldığınız bonus (ve varsa Canavar Muhafızı'ndan gelen bonus) sizin ve bundan faydalanan tüm müttefikleriniz için +1'den +2'ye çıkar.

  prerequisites:
  - text: "Efsanevi Doğa"
  - text: "Usta Canavar Avcısı"

omen://feat/legendary-negotiation?source=paizo-pathfinder-player-core:
  name: Efsanevi Müzakereci
  description: >
    Aleyhte durumlarda inanılmaz hızlı müzakere edebilirsiniz. İyi İzlenim Bırakmayı dener ve ardından rakibinizden mevcut faaliyetini durdurmasını ve müzakerelere girişmesini Ricada Bulunursunuz. Diplomasi testinize –5 ceza alırsınız. Genellikle bu testin ZD'si yaratığın İrade ZD'sidir; ancak GM'niz duruma göre bunu değiştirebilir. Bazı yaratıklar kişisel arzularına bakılmaksızın duramayabilir ve uzlaşmayı kabul edenler bile nihayetinde argümanlarınızı yetersiz bulup şiddete geri dönebilir.

  prerequisites:
  - text: "Efsanevi Diplomasi"

omen://feat/legendary-performer?source=paizo-pathfinder-player-core:
  name: Efsanevi İcracı
  description: >
    Şöhretiniz tüm diyarlara yayıldı. Sosyoloji becerisinde listelenen herhangi bir yetkinliğe sahip yaratıklar sizi duymuştur ve itibarınıza ve yaratığın mizacına bağlı olarak size karşı tavırları genellikle normalden bir basamak daha iyidir. Örneğin, zalim ve talepkâr davranışlarınızla tanınıyorsanız, yaratıklar size dostça yaklaşmak yerine sizden gözü korkabilir. Gösteri ile Gelir Elde Ettiğinizde, seyirciler sizi görmeye akın ettiğinden konumunuzun izin vereceğinden daha yüksek seviyeli kitleleri çekersiniz. Örneğin hükümdarlar ve melekler performansınızı dinlemek için ormandaki küçük kulenize seyahat edebilir. Tipik olarak bu durum mevcut kitleleri sizin seviyenize veya iki seviye yukarısına çıkarır (hangisi daha yüksekse).

  prerequisites:
  - text: "Efsanevi Gösteri"
  - text: "Virtüöz İcracı"

omen://feat/legendary-professional?source=paizo-pathfinder-player-core:
  name: Efsanevi Meslek Erbabı
  description: >
    Şöhretiniz tüm diyarlara yayıldı (örneğin Harp İlimi beceriniz varsa efsanevi bir general veya taktisyen olabilirsiniz). Bu durum Bilgi ile Gelir Elde Ettiğinizde daha yüksek seviyeli işler kazanmanız haricinde Efsanevi İcracı gibi işler.

  prerequisites:
  - text: "Efsanevi Bilgi (Lore)"

omen://feat/legendary-shot?source=paizo-pathfinder-player-core:
  name: Efsanevi Atış
  description: >
    Av peşine düştüğünüz hedefinize odaklanarak açıları, hava direncini ve menzilli saldırınızı etkileyecek her değişkeni algılarsınız. Menzilli silahınızda usta yetkinliğiniz varsa av peşine düştüğünüz hedefinize saldırırken en fazla beş menzil aralığı kadar uzaktan saldırma cezasını göz ardı edebilirsiniz.

  prerequisites:
  - text: "usta avcı"
  - text: "Efsanevi Dikkat"
  - text: "Uzak Atış"

omen://feat/legendary-sneak?source=paizo-pathfinder-player-core:
  name: Efsanevi Gizlenme
  description: >
    Saklanacak hiçbir yer olmadığında bile, görülmeyi seçmediğiniz sürece her zaman sinsi bir şekilde ilerlersiniz. Siper olmadan veya Gizlenmiş olmadan bile Gizlenebilir ve Sessizce İlerleyebilirsiniz. Fark Edilmekten Kaçınmak dışında bir keşif taktiği uyguladığınızda, aksini seçmediğiniz sürece Fark Edilmekten Kaçınmanın faydalarını da kazanırsınız.

  prerequisites:
  - text: "Efsanevi Gizlilik"
  - text: "Hızlı Sinsi"

omen://feat/legendary-survivalist?source=paizo-pathfinder-player-core:
  name: Efsanevi Hayatta Kalan
  description: >
    Yiyecek veya su olmadan süresiz olarak hayatta kalabilir; şiddetli, aşırı ve inanılmaz soğuğa ve sıcağa bunlardan hasar almadan dayanabilirsiniz.

  prerequisites:
  - text: "Efsanevi Hayatta Kalma"

omen://feat/legendary-thief?source=paizo-pathfinder-player-core:
  name: Efsanevi Düzenbaz
  description: >
    Çalma kabiliyetiniz inanca meydan okur. Aktif olarak kuşanılmış veya çıkarılması son derece dikkat çekici ya da zaman alıcı bir şeyi (giyilen ayakkabılar veya zırh gibi) Çalmayı deneyebilirsiniz. Bunu yavaş ve dikkatli bir şekilde, en az 1 dakika harcayarak yapmalısınız (zırh gibi çıkarılması normalde zaman alan eşyalar için belirgin şekilde daha uzun). Bu süre boyunca karanlığın siperi veya kalabalık bir insan topluluğu gibi Gizlenmiş kalmanın bir yoluna sahip olmalısınız. Başarsanız bile tam plaka zırh gibi son derece göze çarpan bir eşyaysa, çaldıktan sonra çevredekiler onun yokluğunu çabucak fark edecektir.

  prerequisites:
  - text: "Efsanevi Hırsızlık"
  - text: "Yankesici"

omen://feat/lengthy-diversion?source=paizo-pathfinder-player-core:
  name: Uzun Dikkat Dağıtma
  description: >
    Dikkat Dağıt eyleminde kritik başarı elde ettiğinizde sıranızın bitiminden sonra da Belirsiz kalmaya devam edersiniz. Bu etki GM tarafından belirlenen şekilde dikkat dağıtmaya ve duruma bağlı bir süre boyunca sürer (en az ilave 1 tur).

  prerequisites:
  - text: "Eğitimli Aldatma"

omen://feat/leshy-familiar-secrets?source=paizo-pathfinder-player-core:
  name: Leshy Ruhdaş Hayvan Sırları
  description: >
    Yaprak düzeninin sırları, ruhdaş hayvanınızın leshy formundan yararlanmasını sağlar. Her gün aşağıdaki leshy ruhdaş hayvan yeteneklerinden biri olması gereken ilave bir ruhdaş hayvan yeteneği seçebilirsiniz. Bu hünerden aynı anda birden fazla yetenek seçemezsiniz.
    • Kavrayıcı Dokunaçlar: Tanıdığınız sarmaşıklar veya benzer dokunaçlar uzatarak erişimini 15 fite çıkarabilir.
    • Havayı Temizle: Tanıdığınız havayı geri dönüştürerek mühürlü bir oda veya boyutlararası bir alan gibi bayat havalı alanlarda Orta boy bir yaratık için yeterli oksijen sağlar. GM'nin takdirine bağlı olarak leshy'den yayılan alan içindeki yaratıklar solunan zehir etkilerine, koku alma etkilerine veya nefes almaya dayalı diğer etkilere (örneğin zehirli bulut) karşı kurtarışlarına +2 durumsal bonusu kazanır.
    • Yemyeşil Patlama: Ruhdaş Hayvanınız öldüğünde, en yüksek derecedeki büyü slotunuzdan 1 derece daha düşüğe yükseltilmiş İyileştir büyüsünün 3 eylemli versiyonunu yapmak için ilkel enerjisini serbest bırakır. İyileştir büyüsü bitkilere geri kazandırdığı Can Puanına büyünün derecesinin iki katına eşit bir statü bonusu kazanır. Bu ruhdaş hayvan yeteneğini seçebilmek için büyü slotlarını kullanarak 2. derece büyüleri yapabiliyor olmalısınız.

  prerequisites:
  - text: "yaprak düzeni"

omen://feat/leshy-familiar?source=paizo-pathfinder-player-core:
  name: Leshy Ruhdaş Hayvan
  description: >
    Büyü yapmanızda size yardımcı olacak bir leshy yoldaşı yaratarak bir bitki bedenine küçük bir doğa ruhu çağırırsınız. Bitki veya mantar ruhdaş hayvan yeteneğinden seçtiğiniz birine sahip bir ruhdaş hayvan kazanırsınız; bu durum olağan ruhdaş hayvan yetenekleri sınırınızdan (genellikle 2) sayılmaz. Çağırdığınız ruhun bitki bedeniyle olan bağı tamamen bağımsız leshy'lerden daha zayıftır, bu yüzden diğer ruhdaş hayvanlar gibi Minik boyuttadır.

  prerequisites:
  - text: "yaprak düzeni"

omen://feat/leshy-glide?source=paizo-pathfinder-player-core:
  name: Leshy Süzülüşü
  description: >
    Kendi yapraklarınızı kullanarak inişinizi kontrol edebilirsiniz. Havada 5 fit aşağı ve 25 fite kadar ileriye doğru yavaşça yere süzülürsünüz. Her turda süzülmek için en az 1 eylem harcadığınız ve henüz yere ulaşmadığınız sürece sıranızın sonunda havada kalırsınız.

  prerequisites:
  - text: "yaprak leshy'si mirası veya Kedi Düşüşü beceri hüneri"

omen://feat/leshy-lore?source=paizo-pathfinder-player-core:
  name: Leshy İrfanı
  description: >
    Halkınızın kültürel geleneklerini ve doğuştan gelen güçlerini derinlemesine anlarsınız. Doğa ve Gizlilik becerilerinde eğitimli yetkinlik derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak eğitimli hale gelecekseniz (örneğin geçmişinizden veya sınıfınızdan ötürü), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz.

    Ayrıca Leshy İrfanı için Ek İlim genel hünerini kazanırsınız.


omen://feat/leshy-superstition?source=paizo-pathfinder-player-core:
  name: Leshy Batıl İnancı
  description: >
    Nesnelerde barınan ruhları fark eder, hangilerinin iyi şans getirdiğini ve hangilerinin uğursuz olduğunu öğrenirsiniz. Şanslı bir nesnenin gücüne odaklanarak tetikleyici etkiye karşı kurtarışınıza +1 durumsal bonusu kazanırsınız.


omen://feat/ley-line-conduit?source=paizo-pathfinder-player-core:
  name: Ley Hattı Kanalı
  description: >
    Dünyanın ley hatlarından büyü çekebilirsiniz. Bir sonraki eyleminiz süresi olmayan 5. derece veya daha düşük bir Büyü Yapmak ise hazırladığınız büyüyü yaparken harcamazsınız.


omen://feat/lie-to-me?source=paizo-pathfinder-player-core:
  name: Bana Yalan Söyle
  description: >
    Sizi kandırmaya çalışan herkesi tuzağa düşürmek için Aldatma becerisini kullanabilirsiniz. Size Yalan Söylemeye çalışan biriyle sohbete girebiliyorsanız, başarıp başaramadıklarını belirlemek için Dikkat ZD'nizden daha yüksekse Aldatma ZD'nizi kullanın. Bu durum birinin uzun bir konuşma sırasında Yalan Söylemeye çalışması gibi karşılıklı bir diyaloğa sahip olmadığınız anlarda geçerli değildir.

  prerequisites:
  - text: "Eğitimli Aldatma"

omen://feat/life-leap?source=paizo-pathfinder-player-core:
  name: Yaşam Sıçrayışı
  description: >
    Canlı bir yaratığın kapladığı alandan bir anda geçer, renkli ışıkların canlı bir gösterisi eşliğinde kendiliğinden onun karşı tarafında belirirsiniz. Mevcut konumunuzdan aynı canlı yaratığa hâlâ bitişik olan, ancak yaratığın alanının karşı tarafında veya köşesinde bulunan başka bir konuma hareket edersiniz. Bir konumun geçerli olup olmadığını belirlemek için kıskaca alma ile aynı kuralları kullanın: iki alanın merkezinden geçen bir çizgi, yaratığın alanının karşı taraflarından veya köşelerinden geçmelidir.

    Yaratığın yaşam gücünün içinden geçerek seçilen konumda belirirsiniz; bu hareket harekete dayalı reaksiyonları tetiklemez. Hedefinizi görebilmelisiniz ve Hızınızın izin vereceğinden daha uzağa hareket edemezsiniz.


omen://feat/light-step?source=paizo-pathfinder-player-core:
  name: Hafif Adım
  description: >
    Zorlu zeminler sizi rahatsız etmez. Depar attığınızda veya Adım attığınızda zorlu zemini göz ardı edebilirsiniz.


omen://feat/lightning-swap?source=paizo-pathfinder-player-core:
  name: Yıldırım Değişimi
  description: >
    Örnek: Özellikle birden fazla silah ikonunu kuşanıyorsanız, dövüş stilleri ve bunlar için gereken teçhizat arasında hızlıca geçiş yapma alıştırması yaptınız. Ellerinizdeki istediğiniz sayıda eşyayı kaldırmak için Etkileşime Girer, ardından en fazla iki silah veya bir kalkan ile bir silah çekersiniz.
    Savaşçı: Dövüş stilleri ve bunlar için gereken teçhizat arasında hızlıca geçiş yapma alıştırması yaptınız. Ellerinizdeki istediğiniz sayıda eşyayı kaldırmak için Etkileşime Girer, ardından en fazla iki silah veya bir kalkan ile bir silah çekersiniz.


omen://feat/lingering-composition?source=paizo-pathfinder-player-core:
  name: Kalıcı Beste
  description: >
    Bir süsleme ekleyerek bestelerinizin daha uzun sürmesini sağlarsınız. Kalıcı Beste odak büyüsünü öğrenirsiniz.

  prerequisites:
  - text: "maestro ilham perisi"

omen://feat/linked-focus?source=paizo-pathfinder-player-core:
  name: Bağlantılı Odak
  description: >
    Bağlı eşyanızı okul büyülerinize güç veren enerji kuyusuna bağladınız. Mistik okulunuzun müfredat büyülerinden birini yapmak için Bağlı Eşyayı Boşalttığınızda günde bir kez 1 Odak Puanı da geri kazanırsınız.

  prerequisites:
  - text: "mistik bağ"
  - text: "müfredat büyüleri"

omen://feat/loremasters-etude?source=paizo-pathfinder-player-core:
  name: İlim Ustası Etüdü
  description: >
    Hatırlamayı kolaylaştıracak şekilde anıların kilidini büyüyle açarsınız. İlim Ustası Etüdü beste büyüsünü öğrenirsiniz.

  prerequisites:
  - text: "muamma ilham perisi"

omen://feat/loud-singer?source=paizo-pathfinder-player-core:
  name: Gür Sesli Şarkıcı
  description: >
    Perdede kalmak, doğru nefes kontrolü ve sözleri hatırlamak, iyi bir şarkıcının asıl ölçütü olan ses yüksekliğinden daha az önemlidir! Goblin Şarkınızın menzili 60 fite çıkar ve onu kullandığınızda fazladan bir düşmanı daha hedefleyebilirsiniz.

  prerequisites:
  - text: "Goblin Şarkısı"

omen://feat/lucky-keepsake?source=paizo-pathfinder-player-core:
  name: Uğurlu Yadigar
  description: >
    Size şans getiren bir yadigârınız vardır. Yalnızca Leshy Batıl İnancı kullandığınızda değil, her zaman büyülere ve büyülü etkilere karşı kurtarışlarına +1 durumsal bonusu kazanırsınız. Yadigârı kaybederseniz, genellikle bir haftalık bir süre içinde yeni bir yadigâr belirleyene kadar bu bonusu kaybedersiniz.

  prerequisites:
  - text: "Leshy Batıl İnancı"

omen://feat/lunge?source=paizo-pathfinder-player-core:
  name: Hamle
  description: >
    Erişim mesafenizin sınırındaki bir düşmana saldırırsınız. Yakın dövüş silahıyla bir Vuruş Yapın; bu Vuruş için erişiminizi 5 fit artırın. Silah silahsızlandırma, itme veya çelme niteliğine sahipse, bir Vuruş yerine ilgili eylemi kullanabilirsiniz.


omen://feat/lunging-stance?source=paizo-pathfinder-player-core:
  name: Hamle Duruşu
  description: >
    Vücudunuz saldırmak için yay gibi gerilmişken uzaktaki düşmanlara hamle yapabilirsiniz. Bu duruştayken, erişiminizin dışında olan ancak bir Hamle ile sahip olacağınız erişim mesafesindeki bir yaratığa karşı Reaktif Vuruş kullanabilirsiniz. Bunu yaparsanız Vuruş ile menzilinizi 5 fit artırırsınız.

  prerequisites:
  - text: "Hamle"
  - text: "Reaktif Vuruş"

omen://feat/magic-hands?source=paizo-pathfinder-player-core:
  name: Büyülü Eller
  description: >
    İlahınızın kutsaması şifa kabiliyetinizi yücelterek büyülü şifayı dünyevi olanla bütünleştirir. Yaraları Tedavi Etmek için bir Tıp testinde başarılı olduğunuzda, şifa için d8 yerine d10 zarlayabilir ve şifaya seviyenize eşit bir statü bonusu ekleyebilirsiniz.

  prerequisites:
  - text: "Şifalı Eller"

omen://feat/magic-rider?source=paizo-pathfinder-player-core:
  name: Büyü Yolcusu
  description: >
    Halkınız uzak geçmişte uzak dünyalar arasında seyahat etmek için güçlü büyüler kullanmıştı ve bu büyünün kalıntıları bu tür bir ulaşımı sizin için daha kolay hale getirir. Birden fazla kişiyi taşıyan bir ışınlanma büyüsünün hedefi olduğunuzda, büyücü tarafından seçilmek üzere normal sınırın ötesinde ilave bir kişiyi etkileyebilir. Ayrıca bir Işınlan büyüsünün hedefi olduğunuzda, katedilen mesafeye bakılmaksızın siz ve diğer hedefler hedefin en fazla 1 mil uzağına varırsınız.


omen://feat/magic-sense?source=paizo-pathfinder-player-core:
  name: Büyü Sezisi
  description: >
    Yakınınızdaki ortam büyüsüne karşı kelimenin tam anlamıyla altıncı bir duyunuz vardır. Büyü auralarının varlığını sanki her zaman 1. derece bir Büyü Tespit Et büyüsü kullanıyormuş gibi hissedebilirsiniz. Bu yalnızca görüş alanınızdaki büyüyü tespit eder. Tara eylemini kullandığınızda, gördüğünüz şeyler üzerinde 3. derece bir Büyü Tespit Et büyüsünün faydalarını kazanırsınız (Tarama eyleminin normal faydalarına ek olarak). Sıranızın başında veya sonunda serbest bir eylemle bu duyuyu açıp kapatabilirsiniz.


omen://feat/magical-crafting?source=paizo-pathfinder-player-core:
  name: Büyülü Zanaat
  description: >
    Bazılarının başka gereksinimleri olsa da sihirli eşyalar Zanaat Edebilirsiniz. Bu hüneri seçtiğinizde 2. seviye veya daha düşük dört yaygın sihirli eşyanın formüllerini kazanırsınız.

  prerequisites:
  - text: "Uzman Zanaat"

omen://feat/magical-shorthand?source=paizo-pathfinder-player-core:
  name: Büyülü Stenografi
  description: >
    Büyü öğrenmek size kolay gelir. Bir Büyü Öğrenmede başarılı olduğunuzda, büyünün derecesine bakılmaksızın 10 dakika sürer. Testte başarı elde edecekseniz bunun yerine kritik başarı elde edersiniz. Başarısız olursanız bir hafta sonra veya bir seviye atladıktan sonra (hangisi önceyse) tekrar deneyebilirsiniz.

    Yeni büyüleri öğrenmek ve kaydetmek için ara zamanı kullanabilirsiniz. Bu durum geleneğin ilişkili becerisiyle Gelir Elde Et eylemini kullanıyormuşsunuz gibi işler; ancak para kazanmak yerine öğrenmeniz için uygun olan bir büyü seçersiniz ve onu öğrenmede indirim elde edersiniz; kazandığınız gelir maliyetine eşit veya maliyetini aşıyorsa büyüyü ücretsiz öğrenirsiniz.

  prerequisites:
  - text: "Uzman Arkana, Doğa, Okültizm veya Din"

omen://feat/major-lesson?source=paizo-pathfinder-player-core:
  name: Büyük Ders
  description: >
    Haminiz size daha da büyük sırlar bahşeder. Büyük, gelişmiş veya temel bir ders seçersiniz. Bu dersle ilişkili nazarı kazanırsınız ve tanıdığınız ilgili büyüyü öğrenir.


omen://feat/maker-of-miracles?source=paizo-pathfinder-player-core:
  name: Mucize Ustası
  description: >
    Gerçek anlamda ilahi bir gücün kanalısınızdır. İlave bir 10. derece büyü slotu kazanırsınız.

  prerequisites:
  - text: "mucizevi büyü"

omen://feat/manifold-edge?source=paizo-pathfinder-player-core:
  name: Çok Katlı Avantaj
  description: >
    Mümkün olan her avantajdan yararlanmayı öğrendiniz. Av Peşine Düştüğünüzde, 1. seviyede seçtiğiniz avantaj yerine farklı bir avcının avantajı faydası kazanabilirsiniz. Bunu yaparsanız Usta Avcı'dan gelen ek faydayı kazanamazsınız.

  prerequisites:
  - text: "avcının avantajı"
  - text: "usta avcı"

omen://feat/march-the-mines?source=paizo-pathfinder-player-core:
  name: Madenlerde Yürüyüş
  description: >
    Toprağın içinden yürür ve yanınızda bir müttefike rehberlik edersiniz. Bu faaliyeti kullandığınızda 15 fitlik bir kazma Hızı kazanırsınız (daha yüksek bir Hızınız yoksa), ardından iki kez Depar atar veya iki kez Kazarsınız. Hareketinizin başlangıcında size bitişik olan gönüllü bir müttefiki sizinle birlikte hareket etmesi için seçebilirsiniz. Bu müttefik hareketini sizin bir kare arkanızda tamamlar.


omen://feat/martial-experience?source=paizo-pathfinder-player-core:
  name: Askeri Deneyim
  description: >
    Çok çeşitli silahlar kullanan çok çeşitli düşmanlarla kılıç tokuşturdunuz ve neredeyse hepsiyle dövüşmenin temellerini öğrendiniz. Yetkin olmadığınız bir silahı kullanırken seviyenizi yetkinlik bonusunuz olarak sayın.

    11. seviyede tüm silahlarda eğitimli hale gelirsiniz.


omen://feat/martial-performance?source=paizo-pathfinder-player-core:
  name: Askeri Performans
  description: >
    İlham periniz size çoğu ozandan daha geniş bir silah çeşitliliğini nasıl kullanacağınızı öğretti ve performansınızı zahmetsizce savaş araçlarına dönüştürmeniz için sizi güçlendirdi. Aktif bir Cesaret Marşı beste kantripiniz olduğunda ve bir Vuruş ile bir düşmana hasar verdiğinizde, büyünün süresi 1 tur uzar. Tek bir büyü yapmayı bu şekilde yalnızca bir kez uzatabilirsiniz.

    Toplanma Marşı veya Kuvvet Şarkısı beste kantriplerini kazanırsanız, bu faydayı o kantriplere de uygulayabilirsiniz.

  prerequisites:
  - text: "cenkçi ilham perisi"

omen://feat/martyr?source=paizo-pathfinder-player-core:
  name: Fedaî
  description: >
    Kendinize zarar vermek anlamına gelse bile müttefiklerinizi desteklemek için aşırı uçlara gidersiniz. Bir sonraki eyleminiz tek bir müttefike Can Puanı kazandırmak için Zarar Ver veya İyileştir yapmak ise büyünün yanı sıra kendi yaşam enerjinizi de kanalize edebilirsiniz. Büyünün her derecesi başına hiçbir şekilde azaltılamayacak veya hafifletilemeyecek 1d8 Can Puanı kaybedersiniz ve müttefikiniz eşit miktarda Can Puanı geri kazanır.

  prerequisites:
  - text: "ilahi pınar"

omen://feat/master-monster-hunter?source=paizo-pathfinder-player-core:
  name: Usta Canavar Avcısı
  description: >
    Dünyanın tüm yaratıkları hakkında neredeyse ansiklopedik bir bilgiye sahipsiniz. Herhangi bir yaratığı tanımlamak üzere Bilgi Hatırlamak için Doğa becerisini kullanabilirsiniz. Ek olarak, kritik başarının yanı sıra bir başarıda da Canavar Avcısı'nın (ve varsa Canavar Muhafızı'nın) faydalarını kazanırsınız.

  prerequisites:
  - text: "Usta Doğa"
  - text: "Canavar Avcısı"

omen://feat/master-of-many-styles?source=paizo-pathfinder-player-core:
  name: Birçok Tarzın Ustası
  description: >
    Dövüşteki ustalığınızı her zaman en iyi taktikleri benimsemek için kullanarak duruşlar arasında akıcı bir şekilde geçiş yaparsınız. Duruş niteliğine sahip bir eylem kullanırsınız.

  prerequisites:
  - text: "Açılış Duruşu (Savaşçı)"
  - text: "Refleksif Duruş (Keşiş)"

omen://feat/masterful-companion?source=paizo-pathfinder-player-core:
  name: Usta Yoldaş
  description: >
    Yoldaş Hayvanınız inanılmaz avcılık becerilerinizi paylaşarak ortak avınızı kolaylıkla alt etmesini sağlar. Av Peşine Düştüğünüzde, yoldaş hayvanınız yalnızca orijinal avcının avantajı faydanızı almak yerine, avcınızın avantajı ile ilişkili Usta Avcı faydasını kazanır.

  prerequisites:
  - text: "usta avcı"
  - text: "Yoldaş Hayvan"

omen://feat/masterful-warden?source=paizo-pathfinder-player-core:
  name: Usta Muhafız
  description: >
    Muhafız büyüsündeki ustalığınız artar. Usta muhafız büyülerinden seçtiğiniz bir muhafız büyüsünü kazanırsınız:
    Efemeral İz Sürüş
    Kolcunun Çalılığı

  prerequisites:
  - text: "Çömez Muhafız"

omen://feat/mature-animal-companion-druid?source=paizo-pathfinder-player-core:
  name: Yetişkin Yoldaş Hayvan (Druid)
  description: >
    Yoldaş Hayvanınız maceralarınız boyunca büyüyüp yetişkin bir yoldaş hayvan haline gelmiş ve ek kabiliyetler kazanmıştır.

    Yoldaş Hayvanınız daha büyük bir bağımsızlığa sahiptir. Bir karşılaşma sırasında, Hayvana Emret eylemini kullanmasanız bile yoldaş hayvanınız o turda sıranız geldiğinde bir Vuruş Yapmak veya Depar atmak (ya da o Hıza sahipse Kazmak, Tırmanmak, Uçmak veya Yüzmek) için yine de 1 eylem kullanabilir. Bunu sıranız boyunca herhangi bir noktada, o sırada bir eylem gerçekleştirmiyor olduğunuz sürece yapabilir. Bunu yaparsa o turda alacağı tüm eylemler bundan ibarettir; ona daha sonra Komut Veremezsiniz.

  prerequisites:
  - text: "Yoldaş Hayvan"

omen://feat/mature-animal-companion-ranger?source=paizo-pathfinder-player-core:
  name: Yetişkin Yoldaş Hayvan (Korucu)
  description: >
    Yoldaş Hayvanınız yetişkin bir yoldaş hayvan haline gelir ve ilave kabiliyetler kazanır.

    Yoldaş Hayvanınız daha büyük bir bağımsızlığa sahiptir. Bir karşılaşma sırasında, Hayvana Emret eylemini kullanmasanız bile yoldaş hayvanınız o turda sıranız geldiğinde bir Vuruş Yapmak veya Depar atmak (ya da o Hıza sahipse Kazmak, Tırmanmak, Uçmak veya Yüzmek) için yine de 1 eylem kullanabilir. Bunu sıranız boyunca herhangi bir noktada, o sırada bir eylem gerçekleştirmiyor olduğunuz sürece yapabilir. Bunu yaparsa o turda alacağı tüm eylemler bundan ibarettir; ona daha sonra Komut Veremezsiniz.

  prerequisites:
  - text: "Yoldaş Hayvan"

omen://feat/melodious-spell?source=paizo-pathfinder-player-core:
  name: Melodik Büyü
  description: >
    Büyü yapmanızı ustalıkla bir performansın içine dokursunuz. Kullandığınız bir sonraki eylem bir Büyü Yapmak ise büyü kurnaz niteliğini kazanır; bu da parıldayan rünleri, büyü kıvılcımlarını ve büyü yaptığınızı normalde ele veren diğer tezahürleri gizler. Bu nitelik büyünün etkilerini değil, yalnızca büyü yapma eylemlerini ve tezahürlerini gizler; dolayısıyla bir gözlemci sizden bir ışının fırladığını veya aniden yok olduğunuzu yine de görebilir.

    Melodik Büyü kullanmanın bir parçası olarak Dikkat Dağıt, Gözdağı Ver, Gösteri Yap veya Ricada Bulun eylemlerinden birini gerçekleştirmeyi seçebilirsiniz. Bunu yaparsanız yaptığınız büyünün kurnaz niteliğini kazanabilmesi için işitsel, duygu, sonik veya görsel niteliğe sahip olması gerekir.


omen://feat/methodical-debilitations?source=paizo-pathfinder-player-core:
  name: Metodik Güçten Düşürmeler
  description: >
    Bir düşmanın taktiksel avantajlarını azaltmak veya ortadan kaldırmak için güçten düşürmelerinizi stratejik olarak tasarlarsınız. Güçten Düşürücü Vuruş kullandığınızda seçebileceğiniz listeye aşağıdaki güçten düşürmeleri eklersiniz.
    • Güçten Düşürme: Hedef kıskaca alamaz veya müttefiklerinin kıstırmasına katkıda bulunamaz.
    • Güçten Düşürme: Hedef Kalkan Kaldırmaktan, zayıf siperden veya standart siperden SD'ye durumsal bonusu kazanmaz; yalnızca üstün siperden veya Siper Almekten SD'ye +2 durumsal bonusu kazanır.

  prerequisites:
  - text: "dahi planlayıcı tezgâhı"
  - text: "Güçten Düşürücü Vuruş"

omen://feat/miraculous-possibility?source=paizo-pathfinder-player-core:
  name: Mucizevi İhtimal
  description: >
    İlahınız küçük mucizeler gerçekleştirmeniz için sizi güçlendirerek görevlerinizin değişken ihtiyaçlarına kolayca uyum sağlamanıza olanak tanır. Günlük hazırlıklarınız sırasında bir kez, bir büyü slotunu bir büyü hazırlamak için kullanmak yerine saf ilahi potansiyeli tutmak için kullanabilirsiniz. Bu büyü slotunu ilahi büyü listesinden bildiğiniz ve belirlediğiniz yuvadan en az 2 derece daha düşük olan herhangi bir büyüyü yapmak için kullanabilirsiniz. Büyü her bakımdan 2 derece daha düşük bir büyü gibi işlev görür. Büyüyü yapana kadar o yuvada özel olarak hazırlanmış hiçbir büyünüz yoktur.


omen://feat/mirror-shield?source=paizo-pathfinder-player-core:
  name: Ayna Kalkan
  description: >
    Büyüyü yapan kişiye geri yansıtırsınız. Menzilli bir silahla en yüksek yetkinliğinizi kullanarak saldırgana karşı menzilli bir vuruş yapın. Büyü yapabiliyorsanız bunun yerine bir büyü saldırısı zarı atmayı seçebilirsiniz. Başarılı olursanız rakibiniz kendi büyüsü için başarılı bir büyü saldırısı zarının etkilerini alır (veya saldırı zarınız kritik bir başarıysa kritik başarının etkilerini alır).


omen://feat/mist-child?source=paizo-pathfinder-player-core:
  name: Sis Çocuğu
  description: >
    Doğaüstü bir incelikle ortama karışırsınız. Belirsiz veya Gizlenmiş olduğunuzda, sizi hedef almak için gereken düz testin ZD'sini Belirsizseniz 6'ya, Gizlenmişseniz 12'ye çıkarın.


omen://feat/mobile-shot-stance?source=paizo-pathfinder-player-core:
  name: Hareketli Atış Duruşu
  description: >
    Atışlarınız çevik ve ölümcül hale gelir. Bu duruştayken, menzilli Vuruşlarınız Reaktif Vuruş'yı veya menzilli bir saldırıyla tetiklenen diğer reaksiyonları tetiklemez.


omen://feat/mobility?source=paizo-pathfinder-player-core:
  name: Hareketlilik
  description: >
    Açık vermeden hareket edersiniz. Depar attığınızda ve Hızınızın yarısı veya daha azı kadar hareket ettiğinizde bu hareket reaksiyonları tetiklemez. İlgili hareket türüne sahipseniz Depar atmak yerine Tırmanırken, Uçarken veya Yüzerken Hareketlilik hünerini kullanabilirsiniz.


omen://feat/monster-crafting?source=paizo-pathfinder-player-core:
  name: Canavar Parçası Zanaatı
  description: >
    Zanaatkârlığa yardımcı olması için canavarların parçalarını kullanabilirsiniz. Eşyaların Zanaat Edilmesine yardımcı olmak için bir canavarın bedenini kullanabilir, bunu yaparken Zanaat faaliyeti için Zanaat yerine Hayatta Kalma becerisini kullanabilirsiniz. Canavarın bedeninin parçaları değerliyse bunları eşyanın hammadde maliyetine doğru da harcayabilirsiniz. (Canavarın kaydı bedeninden değerli materyaller listelemiyorsa belirlemeyi GM yapar.)

    Eşya üzerinde fazladan günler geçirirseniz kendi seviyeniz yerine canavarın seviyesini kullanarak Fiyatı düşürün. Belirli eşyalar Zanaat gereksinimlerinde belirli yaratıkları zorunlu kılabilir.

  prerequisites:
  - text: "Usta Hayatta Kalma"

omen://feat/monster-hunter?source=paizo-pathfinder-player-core:
  name: Canavar Avcısı
  description: >
    Avınızı hızla değerlendirir ve bildiklerinizi uygularsınız. Av Peşine Düşmek için kullanılan eylemin bir parçası olarak avınız hakkında Bilgi Hatırlamak için bir test deneyebilirsiniz. Bilgi Hatırla ile av peşine düştüğünüz hedefinizi tanımlamada kritik başarı elde ettiğinizde, diğer faydaların yanı sıra yaratığın savunmasındaki bir zayıflığı fark edersiniz. O ava karşı bir sonraki saldırı zarınıza +1 durumsal bonusu kazanırsınız ve bunu söylediğiniz herhangi bir müttefik de aynı faydayı elde eder. Canavar Avcısı'ndan gelen bonusları belirli bir yaratığa karşı günde yalnızca bir kez verebilirsiniz.


omen://feat/monster-warden?source=paizo-pathfinder-player-core:
  name: Canavar Muhafızı
  description: >
    Avınıza karşı nasıl savunma yapacağınızı anlarsınız. Canavar Avcısı'ndan bonuslar verdiğinizde, bundan yararlanan her yaratık yaratık onlara bir sonraki saldırışında SD'lerine veya o yaratıktan gelen bir etkiye karşı bir sonraki kurtarışlarına (hangisi önce gelirse) +2 durumsal bonusu kazanır.

  prerequisites:
  - text: "Canavar Avcısı"

omen://feat/monstrosity-shape?source=paizo-pathfinder-player-core:
  name: Ucube Formu
  description: >
    Güçlü ve büyülü bir yaratığa dönüşebilirsiniz. Ucube Formu altında listelenen mağara solucanı ve deniz yılanı biçimlerini Ehlileşmemiş Form listenize ekleyin. Süzülen Form hünerine sahipseniz anka kuşu biçimini de ehlileşmemiş form listenize ekleyin.

  prerequisites:
  - text: "Ehlileşmemiş Form"

omen://feat/monstrous-peacemaker?source=paizo-pathfinder-player-core:
  name: Canavarsı Barışçı
  description: >
    İkili insan ve ork doğanız size benzersiz bir bakış açısı kazandırarak insanlar ile insanların canavar olarak gördüğü dünyadaki birçok zeki yaratık arasındaki uçurumu kapatmanıza olanak tanır. İnsansı olmayan zeki yaratıklara ve insan toplumunda dışlanan insansılara karşı (GM'nin takdirine bağlı olarak, ancak genellikle en azından devler, goblinler, koboldlar ve orklar dahil) Diplomasi testlerine +1 durumsal bonusu kazanırsınız. Bu tür yaratıkların Niyetini Sezmek için yapılan Dikkat testlerinde de bu bonusu kazanırsınız.


omen://feat/mountain-strategy?source=paizo-pathfinder-player-core:
  name: Dağ Stratejisi
  description: >
    Cücelerin ortak düşmanlarla savaşma konusunda uzun bir geçmişi vardır ve bu düşmanlarla daha iyi yüzleşmek için kadim taktiklerde ustalaştınız. Dev, goblin, hryngar veya ork niteliğine sahip yaratıklara karşı silahlar ve silahsız saldırılarla verilen hasara +1 durumsal bonusu kazanırsınız. Saldırınız birden fazla silah hasar zarı veriyorsa (1. seviyeden yüksek seviyelerde yaygın olduğu gibi), bonus silah zarlarının veya silahsız saldırı zarlarının sayısına eşittir.

    Ek olarak herhangi bir yaratık size karşı bir saldırıda kritik başarı elde edip hasar verirse listelenen niteliklerden birine sahip olup olmadığına bakılmaksızın o yaratığa karşı hasar bonusunuzu 1 dakika boyunca kazanırsınız.


omen://feat/mountains-stoutness?source=paizo-pathfinder-player-core:
  name: Dağın Sağlamlığı
  description: >
    Dayanıklılığınız çoğu kişiden daha fazla darbeye dayanmanızı sağlar. Azami Can Puanınızı seviyeniz kadar artırın. Ölmekte 1 durumuna sahip olduğunuzda toparlanma testlerinizin ZD'si 10 + ölmekte değeriniz yerine 9 + ölmekte değerinize eşittir.

    Metanet hünerine de sahipseniz ondan ve bu hünerden kazanılan Can Puanları kümülatiftir ve toparlanma testlerinizin ZD'si 6 + ölmekte değerinize eşittir.


omen://feat/mug?source=paizo-pathfinder-player-core:
  name: Gasp
  description: >
    Hızlı bir vuruş yapar ve bu sırada düşmanınızı soyarsınız. Bitişik bir düşmana yakın dövüş Vuruşu yapın. Vurur ve sinsi saldırı hasarı verirseniz hedef savaşta olsa bile hedeften Çalmayı da deneyebilirsiniz.


omen://feat/multifarious-muse?source=paizo-pathfinder-player-core:
  name: Çok Yönlü İlham Perisi
  description: >
    İlham periniz tek bir etiket altına girmez. Kendinizinkinden farklı bir ilham perisi türü seçin. Bu ilham perisini gerektiren 1. seviye bir hüner kazanırsınız ve ilham periniz artık o türde de bir ilham perisidir; bu da diğer ilham perisini önkoşul olarak alan hünerleri seçmenize olanak tanır. Seçtiğiniz ilham perisinin diğer etkilerinden hiçbirini kazanmazsınız.


omen://feat/multilingual?source=paizo-pathfinder-player-core:
  name: Çokdilli
  description: >
    Yeni dilleri kolayca öğrenirsiniz. Yaygın dillerden, sıra dışı dillerden ve erişiminiz olan diğer dillerden seçilen iki yeni dil öğrenirsiniz. Sosyoloji becerisinde ustaysanız veya usta olursanız ilave bir dil, efsaneviyseniz veya efsanevi olursanız bir dil daha öğrenirsiniz.

  prerequisites:
  - text: "Eğitimli Sosyoloji"

omen://feat/multishot-stance?source=paizo-pathfinder-player-core:
  name: Çoklu Atış Duruşu
  description: >
    Hızlı ve isabetli bir şekilde ateş edebilmek için kendinizi sabit bir konuma kilitlersiniz. Bu duruştayken Çifte Atış cezanız –1'e düşer. Konumunuzdan hareket ederseniz bu duruş sona erer.

  prerequisites:
  - text: "Çifte Atış"

omen://feat/multitalented?source=paizo-pathfinder-player-core:
  name: Çok Yetenekli
  description: >
    Odağınızı birden fazla sınıf arasında kolaylıkla bölmeyi öğrendiniz. Mevcut arketipinizden daha fazla hüner alana kadar normalde başka bir adanmışlık hüneri alamayacak olsanız bile 2. seviye bir çoklu sınıf adanmışlık hüneri kazanırsınız.

    Aiuvarin çok yönlü mirasına sahipseniz hünerin nitelik niteleyicisi önkoşullarını karşılamanız gerekmez.


omen://feat/murksight?source=paizo-pathfinder-player-core:
  name: Pusgörüşü
  description: >
    Görüşünüz büyülü olmayan sis, pus, yağmur ve karı delip geçer. Büyülü olmayan yağışlardan kaynaklanan menzilli saldırılara veya Dikkat testlerine durumsal cezası almazsınız ve hedeflenen saldırılarınız yalnızca bu tür etkilerle Gizlenmiş olan bir hedefe karşı başarılı olmak için düz bir test gerektirmez.


omen://feat/musetouched?source=paizo-pathfinder-player-core:
  name: İlham Dokunuşlu
  description: >
    Kanınız, Elysium'un vahşi diyarından gelen özgürlüğün yaşayan timsalleri olan azataların özgürleştirici gücüyle yankılanır. Kurtul eylemine +1 durumsal bonusu kazanırsınız. Kurtulmak için yapılan bir testte kritik başarısızlık zarlarsanız bunun yerine başarısızlık elde edersiniz; başarı zarlarsanız kritik başarı elde edersiniz.


omen://feat/natural-ambition?source=paizo-pathfinder-player-core:
  name: Doğal Hırs
  description: >
    Hırslı olacak ve her zaman yıldızlara uzanacak şekilde yetiştirildiniz; bu da seçtiğiniz alanda hızla ilerlemenizi sağladı. Sınıfınız için 1. seviye bir sınıf hüneri kazanırsınız. Önkoşulları karşılamalısınız; ancak hangi önkoşulları karşıladığınızı belirlemek için karakter oluşturma sürecinin daha sonraki bir aşamasında hüneri seçebilirsiniz.


omen://feat/natural-medicine?source=paizo-pathfinder-player-core:
  name: Doğal Tıp
  description: >
    Müttefiklerinizi iyileştirmek için doğal tedaviler uygulayabilirsiniz. Daha yüksek Doğa yetkinliğinin daha zor testleri denemenize izin vermesi dahil olmak üzere Yaraları Tedavi Etmek için Tıp yerine Doğa becerisini kullanabilirsiniz. Yaraları Tedavi Et dışındaki beceri kullanımları veya hüner önkoşulları için Tıbbın yerini almaz.

    Vahşi doğadaysanız taze malzemelere daha kolay erişiminiz olabilir ve bu durum GM'nin takdirine bağlı olarak Doğa kullanarak Yaraları Tedavi Etme testinize +2 durumsal bonusu kazanmanızı sağlayabilir.

  prerequisites:
  - text: "Eğitimli Doğa"

omen://feat/natural-skill?source=paizo-pathfinder-player-core:
  name: Doğal Beceri
  description: >
    Ustalığınız çok çeşitli becerileri öğrenmenize olanak tanır. Seçtiğiniz iki beceride eğitimli yetkinlik derecesi kazanırsınız.


omen://feat/nephilim-eyes?source=paizo-pathfinder-player-core:
  name: Nephilim Gözleri
  description: >
    Gözleriniz çoğu düzlemdışı varlığın sahip olduğuna benzer bir görsel keskinlikle karanlığın içini görebilir. Karanlıkta görme kazanırsınız.

  prerequisites:
  - text: "alacakaranlık görüşü"

omen://feat/nephilim-lore?source=paizo-pathfinder-player-core:
  name: Nephilim İlimi
  description: >
    Çoklu Evren'in sırlarını bilirsiniz. Diplomasi veya Gözdağı becerilerinden birinde ve Din becerisinde eğitimli yetkinlik derecesi kazanırsınız. Bu becerilerden birinde otomatik olarak eğitimli hale gelecekseniz (örneğin geçmişinizden veya sınıfınızdan ötürü), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz.

    Ayrıca soyunuzu dayandırdığınız bir düzlemin Bilgi alt kategorisi için Ek İlim genel hünerini kazanırsınız.


omen://feat/nephilim-resistance?source=paizo-pathfinder-player-core:
  name: Nephilim Direnci
  description: >
    Düzlemdışı selefleriniz gibi enerjiye direnirsiniz. Aşağıdaki enerji hasarı türlerinden birini seçin: asit, soğuk, elektrik, ateş veya sonik. O hasar türüne karşı direnç 5 kazanırsınız.

    Hasar türü tipik olarak soyunuzla ilişkili bir düzlemdışı varlıkla eşleşir. Örneğin bir Meleksoyu soğuğa karşı direnç seçebilirken, bir Cehennemtohumu ateşe karşı direnç seçebilir.


omen://feat/nimble-crawl?source=paizo-pathfinder-player-core:
  name: Kıvrak Sürünme
  description: >
    İnanılmaz derecede hızlı Sürünebilirsiniz; 5 fit yerine Hızınızın yarısına kadar hareket edersiniz. Akrobasi becerisinde ustaysanız tam Hızınızla Sürünebilirsiniz ve efsaneviyseniz Yüzüstüyken Gafil kalmazsınız.

  prerequisites:
  - text: "Uzman Akrobasi"

omen://feat/nimble-dodge?source=paizo-pathfinder-player-core:
  name: Kıvrak Kaçınma
  description: >
    Ustalıkla yolun dışına kaçınarak tetikleyici saldırıya karşı SD'nize +2 durumsal bonusu kazanırsınız.


omen://feat/nimble-elf?source=paizo-pathfinder-player-core:
  name: Kıvrak Elf
  description: >
    Kaslarınız sıkı bir şekilde bilenmiştir. Hızınız 5 fit artar.


omen://feat/nimble-hooves?source=paizo-pathfinder-player-core:
  name: Kıvrak Toynaklar
  description: >
    Toynaklara, ayak bileği kanatlarına veya hareketinizi hızlandıran başka bir özelliğe sahipsiniz. Hızınız 5 fit artar.


omen://feat/nimble-roll?source=paizo-pathfinder-player-core:
  name: Kıvrak Yuvarlanma
  description: >
    Yakın tehlikeden kaçmak için kendinizi bir yuvarlanışa bırakırsınız. Orijinal tetikleyicisine ek olarak bir Refleks kurtarışı denemeden önce de Kıvrak Kaçınma kullanabilirsiniz. Bunu yaparsanız durumsal bonusu tetikleyici etkiye karşı Refleks kurtarışınıza uygulanır.

    Kıvrak Kaçınma kullandığınızda ve tetikleyici saldırı başarısız veya kritik başarısız olduğunda ya da kurtarışında başarılı veya kritik başarılı olduğunuzda, reaksiyonun bir parçası olarak en fazla 10 fit Depar da atabilirsiniz. Bunu yaparsanız reaksiyon hareket niteliğini kazanır. İlgili hareket türüne sahipseniz Depar atmak yerine Uçarken veya Yüzerken Kıvrak Yuvarlanma kullanabilirsiniz.

  prerequisites:
  - text: "Kıvrak Kaçınma"

omen://feat/nimble-strike?source=paizo-pathfinder-player-core:
  name: Kıvrak Vuruş
  description: >
    Bir rakibin saldırısında bir açık bulacak kadar kurnazsınız. Kıvrak Kaçınma reaksiyonunuzu kullandığınızda, tetikleyici yaratığa karşı yakın dövüş Vuruşu yapabilirsiniz. Bu Vuruş çoklu saldırı cezanıza sayılmaz ve çoklu saldırı cezanız bu Vuruşa uygulanmaz. Kıvrak Yuvarlanma hünerini kullanırsanız bu Vuruşu yuvarlanışınız sırasında herhangi bir noktada yapabilirsiniz.


omen://feat/no-cause-for-alarm?source=paizo-pathfinder-player-core:
  name: Telaşa Mahal Yok
  description: >
    Paniği azaltmaya çalışırsınız. Etrafınızdaki yayılım alanı içinde Korkmuş olan yaratıkların İrade ZD'si ile karşılaştırarak bir Diplomasi testi deneyin. Bunların her biri 1 saat boyunca geçici olarak bağışık hale gelir.

  prerequisites:
  - text: "Eğitimli Diplomasi"

omen://feat/nonlethal-spell?source=paizo-pathfinder-player-core:
  name: Ölümcül Olmayan Büyü
  description: >
    Saldırgan büyüleri daha az ölümcül olacak şekilde değiştirebilirsiniz. Bir sonraki eyleminiz hasar veren ve ölüm ya da boşluk niteliği taşımayan bir Büyü Yapmak ise o büyü ölümcül olmayan niteliğini kazanır.


omen://feat/occult-resistance?source=paizo-pathfinder-player-core:
  name: Okült Direnç
  description: >
    Okült uygulamalar üzerine yaptığınız çalışmalar, onlara karşı en iyi nasıl savunma yapacağınızı size göstermiştir. Okült etkilere karşı yapılan tüm kurtarışlarına +1 durumsal bonusu kazanırsınız.

  prerequisites:
  - text: "Uzman Okültizm"

omen://feat/oddity-identification?source=paizo-pathfinder-player-core:
  name: Tuhaflık Teşhisi
  description: >
    Büyülü bir etkinin farkına vardığınızda veya bir büyünün yapıldığını gördüğünüzde, zihinleri büküp bükmediğini (zihinsel niteliğiyle), talihe karşı mücadele edip etmediğini (uğur veya uğursuzluk niteliğiyle) veya sırları açığa çıkarıp çıkarmadığını (tespit, kehanet, ifşa veya durugörü nitelikleriyle) derhal belirleyebilirsiniz. GM'nin takdirine bağlı olarak benzer etkiler de bu kategorilere girebilir. Bu etkiler hakkında daha fazla bilgi edinmek için Büyüyü Teşhis Ettiğinizde veya Bilgi Hatırladığınızda, ceza almadan her zaman Okültizm becerisini kullanabilir ve +2 durumsal bonusu kazanırsınız.

  prerequisites:
  - text: "Eğitimli Okültizm"

omen://feat/ode-to-ouroboros?source=paizo-pathfinder-player-core:
  name: Ouroboros Kasidesi
  description: >
    Müttefiklerinizi ölümden geçici olarak esirgemenizi sağlayan Ouroboros Kasidesi beste büyüsünü öğrenirsiniz.


omen://feat/opening-stance?source=paizo-pathfinder-player-core:
  name: Açılış Duruşu
  description: >
    Tehlikenin ilk işaretinde, genellikle tehlikeyi bilinçli olarak fark etmeden önce bile yalnızca bir düşünceyle duruşa geçersiniz. Duruş niteliğine sahip bir eylem kullanın.


omen://feat/opportune-backstab?source=paizo-pathfinder-player-core:
  name: Fırsatçı Arkadan Vuruş
  description: >
    Düşmanınız müttefikiniz tarafından vurulduğunda bu dikkat dağınıklığından yararlanırsınız. Tetikleyici yaratığa karşı bir Vuruş Yapın.


omen://feat/orc-ferocity?source=paizo-pathfinder-player-core:
  name: Ork Vahşeti
  description: >
    Savaşta vahşilik kanınızda akar ve ne kadar korkunç olursa olsun yaralarınız yüzünden yere düşmeyi reddedersiniz. Nakavt olmaktan kaçınarak 1 Can Puanında kalırsınız ve Yaralı durumunuz 1 artar.


omen://feat/orc-lore?source=paizo-pathfinder-player-core:
  name: Ork İlimi
  description: >
    Hisar büyükleri halkınızın tarihlerini öğretti, büyük atletik başarıların hikâyelerini anlattı ve atalarınızın katlandığı zorlukları paylaştı; böylece bu bilgeliği gelecek nesillere aktarabilirsiniz. Atletizm ve Hayatta Kalma becerilerinde eğitimli hale gelirsiniz. Bu becerilerden birinde otomatik olarak eğitimli olacaksanız (örneğin geçmişinizden veya sınıfınızdan ötürü), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz.

    Ayrıca Ork İlimi için Ek İlim genel hünerini kazanırsınız.


omen://feat/orc-sight?source=paizo-pathfinder-player-core:
  name: Ork Görüşü
  description: >
    Ork kanınız atalarınızın keskin görüşünü size bahşeder. Karanlıkta görme kazanarak tıpkı parlak ışıkta olduğu gibi karanlıkta ve loş ışıkta da iyi görebilmenizi sağlar. Ancak karanlıkta yalnızca siyah beyaz görürsünüz.

  prerequisites:
  - text: "alacakaranlık görüşü"

omen://feat/orc-superstition?source=paizo-pathfinder-player-core:
  name: Ork Batıl İnancı
  description: >
    Ork kültürel batıl inançlarından türetilen tekniklere güvenerek kendinizi büyüye karşı savunursunuz. Tetikleyici büyüye veya büyülü etkiye karşı kurtarışınıza +1 durumsal bonusu kazanırsınız.


omen://feat/orc-weapon-familiarity?source=paizo-pathfinder-player-core:
  name: Ork Silah Aşinalığı
  description: >
    Çatışmada ork atalarınız için geleneksel olan vahşi silahları tercih edersiniz. Ork niteliğine sahip tüm sıra dışı silahlara erişim kazanırsınız. Ork niteliğine sahip silahların yanı sıra falyon ve büyük balta konusunda aşinalığınız vardır; yetkinlik açısından bunlardan askeri silah olanları basit silah, ileri düzey silah olanları ise askeri silah sayarsınız.

    5. seviyede, bu silahlardan biriyle kritik vuruş yaptığınızda onun kritik uzmanlaşma etkisini elde edersiniz.


omen://feat/order-explorer?source=paizo-pathfinder-player-core:
  name: Düzen Kâşifi
  description: >
    Başka bir druid düzeninin sırlarını öğrendiniz, bu düzenin gerektirdiği kabul ayinlerini geçtiniz ve sırlarına erişim kazandınız. Kendinizinkinden farklı bir düzen seçin. Bu düzeni önkoşul olarak listeleyen 1. seviye bir hüner kazanırsınız ve artık hüner önkoşullarını karşılama amacıyla o düzenin bir üyesi sayılırsınız. Yeni düzeninize aykırı eylemlerde bulunursanız o düzeni gerektiren tüm hünerleri ve yetenekleri kaybedersiniz ancak diğer druid hünerlerinizi ve yeteneklerinizi korursunuz. Seçtiğiniz düzenin diğer faydalarından hiçbirini kazanmazsınız.


omen://feat/order-magic?source=paizo-pathfinder-player-core:
  name: Düzen Büyüsü
  description: >
    Yeni bir düzenin öğretilerini daha derinlemesine inceleyerek imrenilen bir düzen büyüsüne erişim kazandınız. Düzen Kâşifi ile seçtiğiniz bir düzeni seçin. O düzenden başlangıç düzen büyüsünü kazanırsınız.

  prerequisites:
  - text: "Düzen Kâşifi"

omen://feat/otherworldly-acumen?source=paizo-pathfinder-player-core:
  name: Öte Dünyalı Sezgi
  description: >
    Sahip olduğunuz mistik büyü güç ve karmaşıklık açısından büyür. Daha önce başka bir elf soy hünerinden edindiğiniz doğuştan bir büyüyle aynı gelenekten 2. derece yaygın bir büyü seçin (örneğin Öte Dünyalı Büyü hüneriniz varsa mistik listeden). Bu büyüyü, büyüyü seçtiğiniz listeyle aynı geleneği kullanarak günde bir kez özgü büyü olarak yapabilirsiniz.

    Büyünüz uyarlanabilirdir. 1 günlük ara zaman harcayarak seçtiğiniz büyüyü aynı gelenekten farklı bir 2. derece yaygın büyüyle değiştirebilirsiniz.

  prerequisites:
  - text: "elf soy hünerinden kazanılmış en az bir özgü büyü"

omen://feat/otherworldly-magic?source=paizo-pathfinder-player-core:
  name: Öte Dünyalı Büyü
  description: >
    Büyü konusunda resmi bir eğitim almamış olsanız bile elf büyünüz basit bir mistik büyü olarak kendini gösterir. Mistik büyü listesinden bir kantrip seçin. Bu kantripi istediğiniz zaman bir mistik özgü büyü olarak yapabilirsiniz. Bir kantrip, seviyenizin yukarı yuvarlanmış yarısına eşit bir büyü derecesine yükseltilir.


omen://feat/overextending-feint?source=paizo-pathfinder-player-core:
  name: Fazla Açılan Yanıltma
  description: >
    Bir düşmanı aşırı açılmaya kışkırtırsınız. Başarılı bir Yanıltmada, Yanılttığınızda meydana gelecek diğer etkiler yerine aşağıdaki başarı ve kritik başarı etkilerini kullanabilirsiniz.

  prerequisites:
  - text: "Eğitimli Aldatma"

omen://feat/overwhelming-blow?source=paizo-pathfinder-player-core:
  name: Ezici Darbe
  description: >
    Ağırlığınızı sizi gafil bırakan güçlü bir saldırıya verirsiniz. Yakın dövüş Vuruşu yapın. Bu, çoklu saldırı cezanızı hesaplarken üç saldırı sayılır. Bu Vuruş isabet ederse bir kritik vuruş elde edersiniz. Bir kritik vuruş zarlarsanız silahınız veya silahsız saldırınız ölümcül d12 niteliğini de kazanır (bu, halihazırda sahip olduğu herhangi bir ölümcül niteliğin yerini alır). İsabet ettirseniz de ettirmeseniz de Sersemlemiş 1 olursunuz ve bir sonraki sıranızın başına kadar Gafil kalırsınız.


omen://feat/overwhelming-energy?source=paizo-pathfinder-player-core:
  name: Ezici Enerji
  description: >
    Druid: Karmaşık bir jestle düşmanların dirençlerini aşmak için büyünüzün ilkel gücüne başvurursunuz.
    Sorcerer: Düşmanın savunmalarını yarıp geçmek için büyülerinizi değiştirirsiniz.
    Wizard: Büyünüzü düşmanınızın savunmalarını yarıp geçecek şekilde aşırı yüklerken elinizin etrafında çok sayıda rün çemberi döner.
    Kullandığınız bir sonraki eylem bir Büyü Yapmak ise büyü, hedefin asit, soğuk, elektrik, ateş veya sonik hasarına karşı direncini seviyenize eşit bir miktarda göz ardı eder. Bu, Ateş Duvarı tarafından yaratılan duvar gibi büyünün devam eden bir etkisinin neden olduğu hasar ve süren hasar da dahil olmak üzere büyünün verdiği tüm hasara uygulanır. Bir yaratığın bağışıklıkları bundan etkilenmez.


omen://feat/panic-the-dead?source=paizo-pathfinder-player-core:
  name: Ölüleri Paniklet
  description: >
    Yaşam enerjisi hortlaklara dehşet saçar. Hortlaklara hasar vermek için bir İyileştir büyüsü kullandığınızda kurtarışında başarısız olan herhangi bir hortlak ayrıca Korkmuş 1 olur. Kritik başarısız olduysa yaratık bir sonraki sıranızın başına kadar Kaçan durumunu da kazanır. Akılsız hortlaklar akılsız olmalarından ötürü bu etkiye karşı bağışık değildir.


omen://feat/paragons-guard?source=paizo-pathfinder-player-core:
  name: Timsal Siperi
  description: >
    Duruşunuzu ayarlamak için bir anınız olduğunda, kalkanınız hiç düşünmeden daima hazır olur. Bu duruştayken, sanki Kalkan Kaldır eylemini kullanmışsınız gibi kalkanınızı sürekli kaldırmış olursunuz.


omen://feat/parting-shot?source=paizo-pathfinder-player-core:
  name: Ayrılık Atışı
  description: >
    Geriye sıçrar ve rakibinizi hazırlıksız yakalayan hızlı bir atış yaparsınız. Adım atar ve ardından gerekli silahla menzilli bir Vuruş Yaparsınız. Hedefiniz saldırıya karşı Gafil kalır.


omen://feat/patrons-claim?source=paizo-pathfinder-player-core:
  name: Haminin Talebi
  description: >
    Haminiz bir düşmanın gücünü kendisi için talep etmek üzere tanıdığınız aracılığıyla kısmen tezahür eder. Tanıdığınız Haminin Talebi faaliyetini kazanır.


omen://feat/patrons-presence?source=paizo-pathfinder-player-core:
  name: Haminin Varlığı
  description: >
    Haminiz dikkatini tanıdığınız aracılığıyla yönlendirebilir ve onun yalnızca varlığı bile diğer varlıkların dikkatini dağıtmak ve büyülerini söndürmek için zihinlerinde meşum bir ağırlık haline gelir. Tanıdığınız Haminin Varlığı faaliyetini kazanır.


omen://feat/patrons-truth?source=paizo-pathfinder-player-core:
  name: Haminin Hakikati
  description: >
    Haminizin büyüsünün en büyük sırlarında ustalaştınız ve kimliği hâlâ bir sır olarak kalsa bile haminiz hakkında temel bir gerçeği öğrendiniz. İlave bir 10. derece büyü slotu kazanırsınız.

  prerequisites:
  - text: "haminin armağanı"

omen://feat/peerless-warden?source=paizo-pathfinder-player-core:
  name: Emsalsiz Muhafız
  description: >
    Doğa büyüsündeki ustalığınız size muhafız büyüsünün en büyük sırlarına erişim sağladı. Emsalsiz muhafız büyülerinden seçtiğiniz bir muhafız büyüsünü kazanırsınız:
    Avcının Görüşü
    Arazi Değişimi

  prerequisites:
  - text: "Çömez Muhafız"

omen://feat/penetrating-shot?source=paizo-pathfinder-player-core:
  name: Delip Geçen Atış
  description: >
    Avınızı vurmak için aradaki yaratığı delip geçecek şekilde ateş edersiniz. Av peşine düştüğünüz hedefinize zayıf siper sağlayan bir hedef seçin. Seçilen hedefe ve av peşine düştüğünüz hedefinize karşı gerekli silahla tek bir menzilli Vuruş Yapın. Bu saldırı seçilen hedefin avınıza sağladığı zayıf siperi göz ardı eder. Hasarı yalnızca bir kez zarlayın ve vurduğunuz her yaratığa uygulayın. Delip Geçen Atış çoklu saldırı cezanız için iki saldırı sayılır.


omen://feat/perfect-distraction?source=paizo-pathfinder-player-core:
  name: Kusursuz Dikkat Dağıtma
  description: >
    Sinsi bir şekilde uzaklaşırken düşmanlarınızı yanıltmak için akıllıca taktikler kullanırsınız. Arkada bir yem bırakarak Sessizce İlerlersiniz. Yem Yanılt büyüsü gibi işlev görür; ancak Görünmez olmazsınız, sadece Konumu Saptanmamış olursunuz. Süre boyunca Gizlenmiş olup olmadığınıza bakılmaksızın, büyüde olduğu gibi yeminizi hareket ettirmek için konsantre olmaya devam edebilirsiniz. Kusursuz Dikkat Dağıtma hünerini kullandıktan sonra tekrar kullanabilmeniz için başka bir yem hazırlamak üzere 10 dakika harcamanız gerekir.

  prerequisites:
  - text: "Efsanevi Aldatma"

omen://feat/perfect-encore?source=paizo-pathfinder-player-core:
  name: Kusursuz Bis
  description: >
    Bir başka inanılmaz eser daha geliştirirsiniz. İlave bir 10. derece büyü slotu kazanırsınız.

  prerequisites:
  - text: "başyapıt"

omen://feat/perfect-form-control?source=paizo-pathfinder-player-core:
  name: Kusursuz Form Kontrolü
  description: >
    Büyü ve kas hafızası sayesinde alternatif şekillerinizde süresiz olarak kalabilirsiniz. Form Kontrolü kullandığınızda Ehlileşmemiş Form süresi 1 saat sürmek yerine sınırsızdır (yine de Sonlandırabilirsiniz).

  prerequisites:
  - text: "Form Kontrolü"
  - text: "Kuvvet +4"

omen://feat/perfect-shot?source=paizo-pathfinder-player-core:
  name: Kusursuz Atış
  description: >
    Çatışmanın hareketlerini inanılmaz bir yoğunluk ve hassasiyetle izledikten sonra azami acıyı vermek için mükemmel anda avınıza ateş edersiniz. Av peşine düştüğünüz hedefinize karşı gerekli silahla menzilli bir Vuruş Yapın. Vurursanız Vuruş azami hasar verir. Vuruştan sonra sıranız sona erer.


omen://feat/pervasive-superstition?source=paizo-pathfinder-player-core:
  name: Yaygın Batıl İnanç
  description: >
    Kendinizi batıl inançlara kaptırır ve büyünün etkilerini üzerinizden atmak için kadim ork zihinsel egzersizlerini uygularsınız. Her zaman büyülere ve büyülü etkilere karşı kurtarışlarına +1 durumsal bonusu kazanırsınız.

  prerequisites:
  - text: "Ork Batıl İnancı"

omen://feat/pet?source=paizo-pathfinder-player-core:
  name: Evcil Hayvan
  description: >
    Bir evcil hayvanınız vardır: kedi, kuş veya kemirgen gibi seçtiğiniz bir türde Minik bir hayvan. Uşak niteliğine sahiptir; bu da ona emretmek için Hayvana Emret eylemini kullanırsanız sıranız sırasında 2 eylem kazandığı anlamına gelir; bu durum Hayvana Emret eyleminin olağan etkilerinin yerini alır ve bir Doğa testi denemeniz gerekmez. Bir evcil hayvan Kurtul veya Zorlayarak Aç haricinde saldırı eylemleri gerçekleştiremez.

    Seviye: Evcil hayvanınızın seviyesi sizinkine eşittir.
    Niteleyiciler ve SD: Durumsal veya statü bonusları ya da cezaları uygulanmadan önce evcil hayvanınızın kurtarış niteleyicileri ve SD'si sizinkine eşittir. Dikkat, Akrobasi ve Gizlilik için niteleyicisi olarak 3 + seviyenizi, diğer beceri testleri için niteleyicisi olarak yalnızca seviyenizi kullanır. Kendi nitelik niteleyicilerine sahip değildir ya da bunları kullanmaz ve asla eşya bonuslarından yararlanamaz.
    Can Puanı: Evcil hayvanınızın seviye başına 5 Can Puanı vardır.
    Duyular: Evcil hayvanınız alacakaranlık görüşüne sahiptir ve evcil hayvan yeteneklerinden ilave duyular kazanabilir.
    Hız: Evcil hayvanınızın Hızı 25 fittir. Bunun yerine hava yerine suda nefes alan, suda yaşayan niteliğine sahip olan, kara Hızı bulunmayan ve yüzme Hızı 25 fit olan bir sucul evcil hayvana sahip olmayı seçebilirsiniz.
    Evcil Hayvan Yetenekleri: Evcil hayvanınızı edindiğinizde aşağıdaki yeteneklerden ikisini seçin. Evcil hayvanınız doğal olarak bu yeteneklerden birine sahip bir hayvansa (örneğin bir baykuşun uçma Hızı vardır), bu yeteneği seçmelisiniz. Evcil hayvanınız doğal olarak azamiden daha fazla evcil hayvan yeteneğine sahip bir hayvan olamaz. Bazı durumlarda GM seçebileceğiniz evcil hayvan yeteneklerine bazı ruhdaş hayvan yetenekleri ekleyebilir.
    • Amfibi: Hem havada hem de suda nefes almasına izin veren amfibi niteliğini kazanır ve her biri en yüksek kara Hızına veya yüzme Hızına eşit olmak üzere hem kara Hızına hem de yüzme Hızına sahip olur.
    • Kazıcı: Minik delikler kazmasına izin veren 5 fitlik bir kazma Hızı kazanır.
    • Tırmanıcı: 25 fitlik bir tırmanma Hızı kazanır.
    • Karanlıkta Görme: Karanlıkta görme kazanır.
    • Ekolokasyon: Evcil hayvanınız 20 fit içinde işitmeyi hassas bir duyu olarak kullanabilir.
    • Hızlı Hareket: Evcil hayvanın Hızlarından birini 25 fitten 40 fite çıkarın.
    • Uçucu: 25 fitlik bir uçma Hızı kazanır.
    • El Becerisi: Manipülasyon eylemleri gerçekleştirmek için uzuvlarından en fazla ikisini sanki elleriymiş gibi kullanabilir.
    • Koku Alma: Evcil hayvanınız 30 fit içinde kokuyu yaklaşık bir duyu olarak kullanabilir.
    • Dayanıklı: Evcil hayvanınızın azami CP'si seviye başına 2 artar.


omen://feat/pickpocket?source=paizo-pathfinder-player-core:
  name: Yankesici
  description: >
    Cep gibi sıkı korunan bir şeyi –5 ceza almadan Çalabilir veya Eşya Aşırabilirsiniz. Giyilen ayakkabılar veya zırh ya da aktif olarak kuşanılan nesneler gibi çıkarılması son derece dikkat çekici veya zaman alıcı olacak nesneleri çalamazsınız. Hırsızlık becerisinde ustaysanız çatışmada olan veya başka şekilde tetikte olan bir yaratıktan Çalmayı deneyebilirsiniz. Bunu yaparken Çalma işlemi 1 eylem yerine 2 eylem gerektirir ve –5 ceza alırsınız.

  prerequisites:
  - text: "Eğitimli Hırsızlık"

omen://feat/pied-piping?source=paizo-pathfinder-player-core:
  name: Kavalla Ayartma
  description: >
    Zayıf iradeli bireylerin eylemlerini kontrol etmenizi sağlayan Kavalla Ayartma beste büyüsünü öğrenirsiniz.


omen://feat/pitborn?source=paizo-pathfinder-player-core:
  name: Çukurdoğumlu
  description: >
    Kanınız Dış Yarıklar'ın kokuşmuş derinliklerinden gelen günahın yaşayan bir tezahürü olan bir iblisin işaretini taşır. İblis gücü damarlarınızda atar ve ister perdeli parmaklara sahip olup suda gelişin, ister daha büyük düşmanlarla güreşebilen büyük ellere sahip olun, ister başka bir tezahür olsun her çukurdoğumlu için farklı bir şekilde kendini gösterir. Atletizm becerisinde eğitimli olursunuz. Atletizm becerisinde zaten eğitimliyseniz (örneğin geçmişinizden veya sınıfınızdan ötürü), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz.

    Ayrıca habis kanınızın tezahürünü yansıtacak şekilde önkoşulu eğitimli Atletizm olan herhangi bir yaygın 1. seviye beceri hünerini kazanırsınız.


omen://feat/planar-survival?source=paizo-pathfinder-player-core:
  name: Düzlemsel Hayatta Kalma
  description: >
    Normalde ihtiyaç duyduğunuz kaynakların veya doğal fenomenlerin bulunmadığı düzlemlerde bile farklı düzlemlerde Hayatta Kalma becerisini kullanarak Barınabilirsiniz. Örneğin düzlem normalde sizi besleyebilecek yiyeceklerden yoksun olsa bile ceza almadan yiyecek arayabilirsiniz. Barınma testinizdeki bir başarı, düzlemin size ve Barın ile desteklediğiniz diğer kişilere verdiği hasarı da engeller. Bu yalnızca daha küçük tehlikelere değil, düzlemin genel koşullarının verdiği hasara uygulanır.

  prerequisites:
  - text: "Usta Hayatta Kalma"

omen://feat/plant-empathy?source=paizo-pathfinder-player-core:
  name: Bitki Empatisi
  description: >
    Bitki örtüsüyle aranızda onlarla ilkel düzeyde iletişim kurmanızı sağlayan bir bağ vardır. Bitkilere ve mantarlara sorular sorabilir, onlardan cevaplar alabilir ve onlarla Diplomasi becerisini kullanabilirsiniz.


omen://feat/plant-evidence?source=paizo-pathfinder-player-core:
  name: Delil Yerleştir
  description: "Tuttuğunuz hafif veya ihmal edilebilir Yüke sahip tek bir eşyayı, Dikkat ZD'sine karşı bir thievery|defense:perception testinde başarılı olarak bir kimsenin üzerine o fark etmeden koyabilirsiniz. Kabadayı düzenine sahipseniz, bir hedefi başarıyla İttiğinizde bunu serbest bir eylem olarak yapabilirsiniz."
  prerequisites:
  - text: "Yankesici"

omen://feat/plant-shape?source=paizo-pathfinder-player-core:
  name: Bitki Formu
  description: >
    Bir bitki yaratığının biçimini alabilirsiniz. Ehlileşmemiş forma sahip değilseniz en yüksek derecedeki druid büyü slotunuzla aynı dereceye yükseltilmiş olarak günde bir kez Bitki Formu yapabilirsiniz.

    Ehlileşmemiş Form hünerine sahipseniz Bitki Formu'nda listelenen biçimleri Ehlileşmemiş Form listenize ekleyin ve ehlileşmemiş form kullanarak başka bir biçime her çokbiçimlendiğinizde zehre karşı direnç 5 kazanırsınız.

  prerequisites:
  - text: "yaprak düzeni veya Ehlileşmemiş Form"

omen://feat/point-blank-stance?source=paizo-pathfinder-player-core:
  name: Sıfır Mesafe Duruşu
  description: >
    Yakın mesafedeki düşmanlara ok atarken maksimum nüfuz ve isabet sağlayan bir duruşa geçersiniz. Gönüllü Menzil (Volley) özelliğine sahip yayları kullanırken yakın mesafe cezasını yok sayarsınız ve yayın menzil aralığı içindeki hedeflere karşı hasar zarlarına +2 durumsal bonusu kazanırsınız.

  requirements: Sıranızda 1 eylem harcarsınız ve bir yay kullanıyorsunuzdur.

omen://feat/poison-resistance?source=paizo-pathfinder-player-core:
  name: Zehir Direnci
  description: >
    Simyacı: Toksik reaktiflere defalarca maruz kalmak bedeninizi her türlü zehre karşı güçlendirmiştir.
    Druid: Doğal dünyaya olan yatkınlığınız sizi onun bazı tehlikelerine karşı korur.
    Seviyenizin yarısına eşit zehir direnci kazanırsınız ve zehirlere karşı kurtarışlarına +1 statü bonusu elde edersiniz.


omen://feat/poison-weapon?source=paizo-pathfinder-player-core:
  name: Silahı Zehirle
  description: >
    Gerekli silaha bir temas zehri veya yara zehri uygularsınız; boş bir eliniz varsa bu eylemin bir parçası olarak bir zehir çekmek için Etkileşebilirsiniz. Bu zehir bu hüner sayesinde yaratabileceğiniz basit yara zehirlerinden biri ya da edindiğiniz başka bir temas veya yara zehri olabilir.


omen://feat/positioning-assault?source=paizo-pathfinder-player-core:
  name: Yerinden Oynatan Taarruz
  description: >
    Cezalandırıcı darbelerle rakibinizi konuma zorlarsınız. Gerekli silahla bir Vuruş Yapın. İsabet ederseniz hedefi 5 fit Yerinden Oynatırsınız.


omen://feat/powerful-leap?source=paizo-pathfinder-player-core:
  name: Güçlü Sıçrayış
  description: >
    Yüksek Atlama yapmadan dikey bir Sıçrama ile 5 fit yukarı zıplayabilirsiniz. Ayrıca Yüksek Atlama veya Uzun Atlama'nın bir parçası da dahil olmak üzere Sıçradığınızda yatay mesafeyi 5 fit artırırsınız.

  prerequisites:
  - text: "Uzman Atletizm"

omen://feat/powerful-shove?source=paizo-pathfinder-player-core:
  name: Güçlü İtiş
  description: >
    Saldırınızla daha büyük düşmanları itebilirsiniz. Sizden iki boyuta kadar daha büyük bir yaratığa karşı Saldırgan Engelleme veya Kaba İtiş kullanabilirsiniz.

    Bir kalkan, gönderli silah veya gürzün kritik uzmanlaşma etkisiyle İttiğiniz veya geri savurduğunuz bir yaratık bir nesneye çarpacağı için hareket etmeyi durdurmak zorunda kaldığında Kuvvet niteleyicinize eşit hasar alır (en az 1).

  prerequisites:
  - text: "Saldırgan Engelleme veya Kaba İtiş"

omen://feat/powerful-sneak?source=paizo-pathfinder-player-core:
  name: Güçlü Sinsi
  description: >
    Düşmanlarınızın açıklarından yararlanmayı öğrendiniz. Sinsi saldırı hasarınız hedefin zayıf nokta hasarına karşı sahip olduğu tüm bağışıklık veya dirençleri göz ardı eder. Ek olarak Sessizce İlerlediğinizde, bu eylemin sonunda tarafından sezilmediğiniz bir yaratık belirleyebilirsiniz. Bir sonraki sıranızın bitiminden önce o yaratığa karşı yapacağınız bir sonraki saldırıda, attığınız 3'ten küçük herhangi bir sinsi saldırı zarı bunun yerine 3 sayılır. Yaratığa karşı yapacağınız bir sonraki saldırı sinsi saldırı hasarı vermezse bunun hiçbir faydası olmaz ve yeni bir yaratık belirlerseniz önceki yaratık üzerindeki faydayı kaybedersiniz.


omen://feat/prairie-rider?source=paizo-pathfinder-player-core:
  name: Bozkır Binicisi
  description: >
    Klanınızın tüylü midillilerine ve binek köpeklerine binerek büyüdünüz. Doğa becerisinde eğitimli hale gelirsiniz. Doğa becerisinde otomatik olarak eğitimli olacaksanız (örneğin geçmişinizden veya sınıfınızdan ötürü), bunun yerine seçtiğiniz bir beceride eğitimli olursunuz. Hedef midilli veya binek köpeği gibi geleneksel bir buçukluk bineğiyse Hayvana Emret eylemine +1 durumsal bonusu da kazanırsınız.


omen://feat/precise-debilitations?source=paizo-pathfinder-player-core:
  name: Hassas Güçten Düşürmeler
  description: >
    Büyük bir hassasiyetle saldırırsınız. Güçten Düşürücü Vuruş kullandığınızda seçebileceğiniz listeye aşağıdaki güçten düşürmeleri eklersiniz.
    • Güçten Düşürme: Hedef saldırılarınızdan ilave 2d6 zayıf nokta hasarı alır.
    • Güçten Düşürme: Hedef Gafil hale gelir.

  prerequisites:
  - text: "yankesici tezgâhı"
  - text: "Güçten Düşürücü Vuruş"

omen://feat/predictable?source=paizo-pathfinder-player-core:
  name: "Tahmin Edilebilir!"
  description: >
    Bir rakibi gözlemleyerek bir sonraki hamlesini sezebilir ve buna karşı koymaya veya direnmeye hazırlanabilirsiniz. Bir hedef seçin ve düşmanın Aldatma ZD'sine veya düşmanın seviyesinin zorlu ZD'sine (hangisi daha yüksekse) karşı Niyetini Tartmak için bir Dikkat testi deneyin.


omen://feat/predictive-purchase-rogue?source=paizo-pathfinder-player-core:
  name: Öngörülü Tedarik (Düzenbaz)
  description: >
    Bir şekilde durum için tam gereken şeye sahip olmayı başarırsınız. Öngörülü Plancı ve Öngörülü Sarf Malzemesi hünerlerini kazanırsınız. Öngörülü Plancı'yı kullanırken, bunu yapmak için 1 dakika harcamak yerine eşyayı sırt çantanızdan (veya benzer bir kaptan) 2 eylemlik bir faaliyet olarak çekebilirsiniz.


omen://feat/premonition-of-avoidance?source=paizo-pathfinder-player-core:
  name: Kaçınma Önsezisi
  description: >
    İlahınız size bir anlık öngörü bahşeder. Tetikleyici kurtarışına +2 durumsal bonusu kazanırsınız.


omen://feat/premonition-of-clarity?source=paizo-pathfinder-player-core:
  name: Berraklık Önsezisi
  description: >
    İlahınız sizi zihinsel saldırılara karşı çelikleştirmek için bir inanç görüsü gönderir. Tetikleyici kurtarışını +2 durumsal bonusuyla yeniden zarlayın. Daha kötü olsa bile ikinci sonucu kullanmalısınız.


omen://feat/preparation?source=paizo-pathfinder-player-core:
  name: Hazırlık
  description: >
    Olasılıkları hesaplayarak savaş alanını incelersiniz. Bir sonraki sıranızın başlangıcından önce herhangi bir hırsız reaksiyonu için kullanabileceğiniz ilave bir reaksiyon kazanırsınız.


omen://feat/prescient-consumable?source=paizo-pathfinder-player-core:
  name: Öngörülü Sarf Malzemesi
  description: >
    Hangi sarf malzemelerine önceden ihtiyaç duyabileceğinizi öngörebilirsiniz. Öngörülü Plancı hünerini kullanırken, bir macera teçhizatı yerine sırt çantanızdan bir sarf malzemesi temin edebilirsiniz. Sarf malzemesi yine de seviyenizin yarısından daha yüksek olmayan bir seviyede yaygın olmalı ve Hacmi onu taşımanın sizi yüklü kılmayacağı kadar düşük olmalıdır.

  prerequisites:
  - text: "Öngörülü Plancı"

omen://feat/prescient-planner?source=paizo-pathfinder-player-core:
  name: Öngörülü Plancı
  description: >
    Maliyet: seçilen eşyanın Fiyatı
    Düzenli olarak karmaşık planlar ve acil durum senaryoları oluşturur, bunları gerçekleştirmek için kaynaklarınızı kullanırsınız. Sırt çantanızı çıkarmak için 1 dakika harcar, ardından daha önce satın aldığınızı beyan etmediğiniz bir eşyayı dikkatlice çıkarırsınız; eşyaya ihtiyaç duyacağınızı sezmiş ve onu en son fırsatta satın almışsınızdır. Eşya bir macera teçhizatı parçası olmalı ve silah, zırh, simyasal eşya, sihirli eşya veya başka bir hazine olamaz. Seviyenizin yarısından daha yüksek olmayan bir seviyede yaygın olmalı ve Hacmi onu taşımanın sizi yüklü kılmayacağı kadar düşük olmalıdır.


omen://feat/primal-aegis?source=paizo-pathfinder-player-core:
  name: Doğal Aegis
  description: >
    Kendinizi kalın bir koruyucu doğa enerjisi alanı ile çevrelersiniz. Siz ve 30 fit yakınınızdaki müttefikleriniz asit, soğuk, elektrik, ateş, yaşam ve boşluk hasarına karşı Bilgelik niteleyicinize eşit direnç kazanırsınız.


omen://feat/primal-focus?source=paizo-pathfinder-player-core:
  name: Doğa Odaku
  description: >
    Doğayla olan bağınız özellikle güçlüdür ve doğanın ruhları etrafınızda toplanarak odağınızı tazelemenize yardımcı olur. Her Yeniden Odaklandığınızda, odak havuzunuzu tamamen doldurursunuz.


omen://feat/primal-howl?source=paizo-pathfinder-player-core:
  name: İlkel Uluma
  description: >
    Yoldaşınız doğa büyünüzle bezenmiş bir uluma salıverebilir. Halihazırda bildiği gelişmiş manevralara ek olarak İlkel Uluma gelişmiş manevrasını kazanır.

  prerequisites:
  - text: "İnanılmaz Yoldaş"

omen://feat/primal-summons?source=paizo-pathfinder-player-core:
  name: Doğa Çağrısı
  description: >
    Bir müttefik çağırdığınızda onu hava, toprak, ateş veya suyun elementsel gücüyle güçlendirebilirsiniz. Doğa Çağrısı düzen büyüsünü kazanırsınız.

  prerequisites:
  - text: "Vahşi Doğanın Çağrısı"

omen://feat/pristine-weapon?source=paizo-pathfinder-player-core:
  name: Kusursuz Silah
  description: "Yeşil silahınız büyülü yaratıkların dirençlerini yarıp geçebilir. Silah soğuk demir ve gümüş muamelesi görür. Soğuk demire veya gümüşe zaafı olan bir yaratığa kritik vuruş yaparsanız, silahınızın içindeki doğa enerjileri hedefin doğal iyileşmesini yavaşlatırken hedef 1d6[bleed] hasar alır."
  prerequisites:
  - text: "Yeşil Silah"

omen://feat/project-persona?source=paizo-pathfinder-player-core:
  name: Persona Yansıtma
  description: >
    Başkalarının zırhlarını hayal güçlerine bir kanal görevi görecek şekilde işlediği yerlerde, canlı zihniniz ve cesur kişiliğiniz sönük zırhınızın üzerine daha uygun bir persona yansıtmanıza olanak tanır. Zırhınızın şeklini ve görünümünü hayal ettiğiniz sıradan veya kaliteli giysiler gibi görünecek şekilde değiştirirsiniz. Zırhın istatistikleri değişmez. Bu etki bilinciniz açık kaldığı ve zırhı giydiğiniz sürece sürer. Bir yaratık zırhınızı Arayarak veya ona dokunarak illüzyona inanmayabilir. ZD İrade ZD'nize eşittir.


omen://feat/quick-climb?source=paizo-pathfinder-player-core:
  name: Hızlı Tırmanma
  description: >
    Tırmanırken başarı durumunda 5 fit daha, kritik başarı durumunda ise 10 fit daha fazla hareket edersiniz (Hızınıza kadar). Atletizm becerisinde efsaneviyseniz Hızınıza eşit bir tırmanma Hızı kazanırsınız.

  prerequisites:
  - text: "Usta Atletizm"

omen://feat/quick-coercion?source=paizo-pathfinder-player-core:
  name: Hızlı Tehditle Zorlama
  description: >
    Sadece birkaç seçme imayla başkalarını yıldırabilirsiniz. Bir yaratığı 1 dakika yerine 1 turluk bir sohbetten sonra Tehditle Zorlayabilirsiniz. Yine de çatışmanın ortasında veya bir sohbete girmeden bir yaratığı Tehditle Zorlayamazsınız.

  prerequisites:
  - text: "Eğitimli Gözdağı"

omen://feat/quick-disguise?source=paizo-pathfinder-player-core:
  name: Hızlı Kılık Değiştirme
  description: >
    Olağan sürenin onda birinde (genellikle 1 dakika) bir kılık hazırlayabilirsiniz. Aldatma becerisinde ustaysanız 3 eylemlik bir faaliyet olarak tam bir kılık yaratabilir ve Kılığına Bürünebilirsiniz. Efsaneviyseniz bu tek bir eylem sürer.

  prerequisites:
  - text: "Uzman Aldatma"

omen://feat/quick-draw?source=paizo-pathfinder-player-core:
  name: Hızlı Çekiş
  description: >
    Silahınızı çeker ve aynı hareketle saldırırsınız. Bir silah çekmek için Etkileşime Girer, ardından o silahla bir Vuruş Yaparsınız.


omen://feat/quick-identification?source=paizo-pathfinder-player-core:
  name: Hızlı Teşhis
  description: >
    Büyüyü hızlıca teşhis edebilirsiniz. Bir eşyanın, devam eden bir etkinin veya bir konumun özelliklerini belirlemek için Büyüyü Teşhis Et faaliyetini kullanırken 10 dakika yerine yalnızca 1 dakika harcarsınız. Ustaysanız 3 eylemlik bir faaliyet sürer; efsaneviyseniz 1 eylem sürer.

  prerequisites:
  - text: "Eğitimli Arkana, Doğa, Okültizm veya Din"

omen://feat/quick-jump?source=paizo-pathfinder-player-core:
  name: Hızlı Zıplama
  description: >
    Yüksek Atlama ve Uzun Atlama faaliyetlerini 2 eylem yerine tek bir eylem olarak kullanabilirsiniz. Bunu yaparsanız başlangıçtaki Deparı gerçekleştirmezsiniz (10 fit Depar atmazsanız da başarısız sayılmazsınız).

  prerequisites:
  - text: "Eğitimli Atletizm"

omen://feat/quick-recognition?source=paizo-pathfinder-player-core:
  name: Hızlı Tanıma
  description: >
    Büyüleri hızla tanırsınız. Turda bir kez, usta olduğunuz bir beceriyi kullanarak serbest bir eylem olarak Büyüyü Tanıyabilirsiniz.

  prerequisites:
  - text: "Usta Arkana, Doğa, Okültizm veya Din"
  - text: "Büyüyü Tanı"

omen://feat/quick-repair?source=paizo-pathfinder-player-core:
  name: Hızlı Onarım
  description: >
    Sizin için Tamir Et faaliyeti keşif niteliğini kaybeder ve 10 dakika yerine 1 dakika sürer. Zanaat becerisinde ustaysanız 3 eylem sürer. Efsaneviyseniz 1 eylem sürer.

  prerequisites:
  - text: "Eğitimli Zanaat"

omen://feat/quick-reversal?source=paizo-pathfinder-player-core:
  name: Hızlı Tersyüz
  description: >
    Hızlı bir ters dönüşle düşmanlarınızın kıskaca almasını onların aleyhine çevirirsiniz. Kıskaca alan düşmanlardan birine karşı yakın dövüş Vuruşu yapın ve aynı silahla veya silahsız saldırıyla sizi kıstıran farklı bir düşmana karşı ikinci bir Vuruş Yapın. Bu ikinci Vuruş ilk saldırının çoklu saldırı cezasına sahiptir ve çoklu saldırı cezanıza sayılmaz.


omen://feat/quick-shield-block?source=paizo-pathfinder-player-core:
  name: Hızlı Kalkanla Engelleme
  description: >
    Kalkanınızı neredeyse hiç düşünmeden yerine getirebilirsiniz. Her bir sıranızın başında, yalnızca Kalkanla Engelleme yapmak için kullanabileceğiniz ilave bir reaksiyon kazanırsınız.

  prerequisites:
  - text: "kalkanla engelleme"

omen://feat/quick-squeeze?source=paizo-pathfinder-player-core:
  name: Hızlı Sıyrılma
  description: >
    Tur başına 5 fit (kritik başarıda 10 fit) Dar Yerden Geçersiniz. Akrobasi becerisinde efsaneviyseniz tam Hızınızla Dar Yerden Geçersiniz.

  prerequisites:
  - text: "Eğitimli Akrobasi"

omen://feat/quick-swim?source=paizo-pathfinder-player-core:
  name: Hızlı Yüzme
  description: >
    Başarıda 5 fit daha uzağa, kritik başarıda ise en fazla Hızınıza kadar 10 fit daha uzağa Yüzersiniz. Atletizm becerisinde efsaneviyseniz Hızınıza eşit bir yüzme Hızı kazanırsınız.

  prerequisites:
  - text: "Usta Atletizm"

omen://feat/quick-unlock?source=paizo-pathfinder-player-core:
  name: Hızlı Kilit Açma
  description: >
    2 eylem yerine 1 eylem kullanarak Kilit Açabilirsiniz.

  prerequisites:
  - text: "Usta Hırsızlık"

omen://feat/quickened-casting?source=paizo-pathfinder-player-core:
  name: Hızlandırılmış Büyü Yapma
  description: >
    Ozan: Bir sonraki eyleminiz bir ozan kantripi veya sahip olduğunuz en yüksek derecedeki ozan büyü slotundan en az 2 derece daha düşük bir ozan büyüsü yapmak ise büyü yapma eylemlerinin sayısını 1 azaltın (en az 1 eylem).
    Witch: Büyü yapmanızı hızlandırırsınız. Bir sonraki eyleminiz bir Witch kantripi veya sahip olduğunuz en yüksek derecedeki Witch büyü slotundan en az 2 derece daha düşük bir Witch büyüsü yapmak ise büyü yapma eylemlerinin sayısını 1 azaltın (en az 1 eylem).
    Wizard: Zihninizi zorlayarak büyünüzün formüllerini elinizden geldiğince sıkıştırır, bu da daha kısa ama çok daha karmaşık bir tekerlemeyle sonuçlanır. Bir sonraki eyleminiz bir Wizard kantripi veya sahip olduğunuz en yüksek derecedeki Wizard büyü slotundan en az 2 derece daha düşük bir Wizard büyüsü yapmak ise büyü yapma eylemlerinin sayısını 1 azaltın (en az 1 eylem).
    Diğerleri: Bir sonraki eyleminiz bir sınıf kantripi veya sahip olduğunuz en yüksek seviyedeki sınıf büyü slotundan en az 2 seviye daha düşük bir sınıf büyüsü yapmak ise büyü yapma eylemlerinin sayısını 1 azaltın (en az 1 eylem).


omen://feat/quiet-allies?source=paizo-pathfinder-player-core:
  name: Sessiz Müttefikler
  description: >
    Bir grupla birlikte hareket etme konusunda yeteneklisinizdir. Fark Edilmekten Kaçınırken müttefikleriniz Uzmanı Takip Ettiğinde, siz ve bu müttefikleriniz ayrı ayrı zarlamak yerine en düşük niteleyiciyi kullanarak tek bir Gizlilik testi zarlayabilirsiniz. Bu durum inisiyatif zarları için geçerli değildir.

  prerequisites:
  - text: "Uzman Gizlilik"

omen://feat/raise-menhir?source=paizo-pathfinder-player-core:
  name: Menhir Dikme
  description: >
    Yerden dikili taş veya koruyucu ağaç gibi bir druidik anıt yükselterek diğer büyü türlerini engelleyen güçlü bir doğa muhafazası yaratırsınız. Anıt 30 fit içindeki zeminde boş bir karede belirir ve o kareyi zorlu zemin haline getirir. Mistik, ilahi veya okült geleneklerinden birini seçin; anıtın 15 fit yakınındaki tüm yaratıklar bu niteliğe sahip etkilere karşı kurtarışlarına +2 statü bonusu kazanır. Anıt toprağa geri ufalanmadan veya yok olup solmadan önce 1 tur sürer, ancak anıtı 1 dakikaya kadar Sürdürebilirsiniz.


omen://feat/raise-symbol?source=paizo-pathfinder-player-core:
  name: Simge Kaldır
  description: >
    Dini sembolünüzü vurgulu bir şekilde sunarsınız. Bir sonraki sıranızın başına kadar kurtarışlarına +2 durumsal bonusu kazanırsınız. Kaldırılmış durumdayken bir yaşam veya boşluk etkisine karşı kurtarışında başarı zarlarsanız bunun yerine kritik başarı elde edersiniz. Kaldırdığınız dini sembol Teçhizatı Mühürle ile olduğu gibi bir kalkan ise bu eylemi kullandığınızda Kalkan Kaldır etkilerini, Kalkan Kaldırdığınızda ise bu eylemin etkilerini kazanırsınız.


omen://feat/rallying-anthem?source=paizo-pathfinder-player-core:
  name: Toplanma Marşı
  description: >
    Sizi ve müttefiklerinizi koruyan Toplanma Marşı beste kantripini öğrenirsiniz.


omen://feat/rampaging-ferocity?source=paizo-pathfinder-player-core:
  name: Gözü Dönmüş Vahşet
  description: >
    Ölümü savuştururken bile gaddarca hamle yaparsınız. Tek bir yakın dövüş Vuruşu yapın. Bu Vuruş bir düşmanı 0 Can Puanına düşürürse Ork Vahşeti'nin bu etkinleştirilmesi onun kullanım sıklığına sayılmaz.

  prerequisites:
  - text: "Ork Vahşeti"

omen://feat/rapid-mantel?source=paizo-pathfinder-player-core:
  name: Hızlı Tırmanış
  description: >
    Kendinizi çıkıntılara kolayca çekersiniz. Kenara Tutunduğunuzda kendinizi o yüzeye çekip ayağa kalkabilirsiniz. Kenara Tutunmak için bir Refleks kurtarış yerine Atletizm kullanabilirsiniz. Bir kenarın tepesinin 5 fit altına kadar Tırmanır veya Sıçrarsanız, o eylemin bir parçası olarak kendinizi yüzeye çekip ayağa kalkabilirsiniz.

  prerequisites:
  - text: "Uzman Atletizm"

omen://feat/rapid-response?source=paizo-pathfinder-player-core:
  name: Hızlı Müdahale
  description: >
    Gereken yardımı ulaştırmak için tehlike anlarında hızlı ve verimli çalışırsınız. Tetikleyici müttefike doğru Depar atarsınız. Bu hareket sırasında Hızınıza +10 fitlik bir durumsal bonusu kazanırsınız.


omen://feat/razzle-dazzle?source=paizo-pathfinder-player-core:
  name: Göz Kamaştırma
  description: >
    Bıçağınızın yansımasını silah haline getirerek veya büyülü gösterilerin parlaklığını alışılmadık yüksekliklere çıkararak ışığı manipüle etmek için hatırı sayılır zaman harcadınız. Hedefe verdiğiniz Kör veya Gözü Kamaşmış durumunun süresini 1 tur uzatırsınız.


omen://feat/reach-spell?source=paizo-pathfinder-player-core:
  name: Menzilli Büyü
  description: >
    Büyülerinizin menzilini uzatabilirsiniz. Kullandığınız bir sonraki eylem menzili olan bir Büyü Yapmak ise o büyünün menzilini 30 fit artırın. Büyü menzillerini artırmada standart olduğu gibi, büyünün normalde dokunma menzili varsa menzilini 30 fite uzatırsınız.


omen://feat/reactive-distraction?source=paizo-pathfinder-player-core:
  name: Reaktif Dikkat Dağıtma
  description: >
    Düşmanınızı engellemek için yeminizle reaktif bir şekilde yer değiştirirsiniz. Sessizce İlerle hareketinizi Gizlenmişken veya siper ya da üstün siper olan bir konumda sonlandırdığınız sürece gözlemlenmiş olsanız bile Kusursuz Dikkat Dağıtma kullanırsınız. Saldırı veya etki sizin yerinize yeminizi hedefler. Bir alan etkisi durumunda, Sessizce İlerlemeniz sizi alanın dışına çıkarmazsa hem siz hem de yem etki tarafından hedeflenir.

  prerequisites:
  - text: "Efsanevi Aldatma"
  - text: "Kusursuz Dikkat Dağıtma"

omen://feat/reactive-interference?source=paizo-pathfinder-player-core:
  name: Reaktif Müdahale
  description: >
    Komutan: Kendi taktiksel uzmanlığınız, düşman tepkilerini hızla tespit etmenizi ve engellemenizi sağlar. Tetikleyen yaratığın seviyesi sizinkine eşit veya sizinkinden düşükse, tetikleyen reaksiyonu engellersiniz. Tetikleyen yaratığın seviyesi sizinkinden yüksekse, onun SD'sine karşı bir saldırı zarı atın. Başarı durumunda, reaksiyonu engellersiniz.
    Düzenbaz: Bir kolu yakalayarak, silahınızı savurarak veya başka bir engel yaratarak bir düşmanın tepkisini refleks olarak boşa çıkarırsınız. Tetikleyen yaratığın seviyesi sizinkine eşit veya sizinkinden düşükse, tetikleyen reaksiyonu engellersiniz. Tetikleyen yaratığın seviyesi sizinkinden yüksekse, onun SD'sine karşı bir saldırı zarı atmalısınız. Başarı durumunda, reaksiyonu engellersiniz.

omen://feat/reactive-pursuit?source=paizo-pathfinder-player-core:
  name: Reaktif Takip
  description: Geri çekilen bir düşmanla aynı tempoyu korursunuz. Depar atarsınız, ancak hareketinizi tetikleyen düşmana bitişik olarak sonlandırmalısınız. Bu hareketiniz tetikleyen düşmandan reaksiyon tetiklemez. İlgili hareket türüne sahipseniz, Depar yerine Toprağı Kazmak, Tırmanmak, Uçmak veya Yüzmek için Reaktif Takip kullanabilirsiniz.

omen://feat/reactive-shield?source=paizo-pathfinder-player-core:
  name: Reaktif Kalkan
  description: Tam darbe alacağınız anda kalkanınızı yerine oturtarak son saniyede darbeden kaçınabilirsiniz. Derhal Kalkan Kaldır eylemini kullanır ve kalkanınızın SD bonusunu kazanırsınız. Kalkandan gelen durumsal bonusu, tetikleyen saldırının sonucunu belirlerken SD'nize uygulanır.

omen://feat/reactive-transformation?source=paizo-pathfinder-player-core:
  name: Reaktif Dönüşüm
  description: >
    Tehlike anında refleks olarak dönüşürsünüz. Tetikleyiciye bağlı olarak sahip olduğunuz önkoşul hünerlerinden birinin sağladığı bir forma dönüşmek üzere Ehlileşmemiş Form yaparsınız. Formunuzun dirençleri ve zaafları tetikleyen hasara karşı uygulanır.
    Etki: Uçan Form içinden bir form seçin.
    Etki: Tetikleyen hasara direnen Ejderha Formu içinden bir kadim ejderha formu seçin.
    Etki: Elementel Form içinden bir ateş elementi formu seçin.
    Etki: Bitki Formu içinden bir form seçin.
  prerequisites:
  - text: "Ehlileşmemiş Form"
  - text: "Ejderha Formu, Elementel Form, Bitki Formu veya Süzülen Form"

omen://feat/read-lips?source=paizo-pathfinder-player-core:
  name: Dudak Oku
  description: Yakınınızda net bir şekilde görebildiğiniz kişilerin dudaklarını okuyabilirsiniz. Okunan dil bildiğiniz bir dil olmalıdır. Boş vaktiniz olduğunda bunu otomatik olarak yapabilirsiniz. Karşılaşma modundayken veya daha zor bir dudak okuma eylemi denerken, dudak hareketlerine odaklandığınız her tur boyunca Hayran Kalmış ve Gafil kalırsınız ve birinin dudaklarını başarıyla okumak için bir Sosyoloji testinde (GM tarafından belirlenen bir ZD) başarılı olmalısınız.
  prerequisites:
  - text: "Sosyoloji becerisinde eğitimli"

omen://feat/rebounding-smite?source=paizo-pathfinder-player-core:
  name: Seken Darbe
  description: Darbenizden gelen enerji bir anlığına varlığını sürdürerek onu yeni bir hedefe aktarmanıza olanak tanır. Vuruşunuzun hedefi dışındaki bir yaratığı hedef alarak, harcadığınız Zarar Ver veya İyileştir büyüsünün 1 eylemli versiyonunu yapın.
  prerequisites:
  - text: "Kanal Darbesi"

omen://feat/rebounding-toss?source=paizo-pathfinder-player-core:
  name: Seken Fırlatma
  description: Bir düşmana saldırmak için silahınızı bir diğerinden sektirirsiniz. Fırlatılan bir silahla menzilli bir Vuruş Yapın. Bu Vuruş isabet ederse, silah ilk hedefin 10 fit yakınındaki bir düşmana doğru seker. Bu ikinci hedefe karşı ek bir Vuruş Yapın. Her iki saldırı da çoklu saldırı cezanıza dahil edilir, ancak ceza her iki saldırıyı da yapana kadar artmaz.

omen://feat/reckless-abandon?source=paizo-pathfinder-player-core:
  name: Gözü Karalık
  description: >
    Şüpheli kararlarla dolu bir ömre rağmen, kendi eylemlerinizin sonuçlarından kaçınmanızı sağlayan tekinsiz bir şansınız varmışçasına hayatta kalmayı başardınız. Sıranızın geri kalanında, zararlı bir etkiye karşı yapılan bir kurtarışında başarısızlık veya kritik başarısızlık atarsanız, bunun yerine bir başarı elde edersiniz. Ayrıca, bu sıra bir düşmandan veya tehlikeden hasar alacak olursanız, mümkün olan en düşük hasarı alırsınız.
    Bu faydalar yalnızca Ateş Duvarı içinden koşmak gibi, Gözü Karalık hünerini etkinleştirdiğiniz sıranız sırasında tamamen meydana gelen zararlı etkilere uygulanır. Sıranızdan önce uygulanan süren hasar ve durumlar normal şekilde devam eder ve sıranız sona erer ermez sizi hâlâ tehdit eden tüm tehlikelerin tüm sonuçlarına maruz kalırsınız.

omen://feat/recognize-spell?source=paizo-pathfinder-player-core:
  name: Büyüyü Tanı
  description: Büyünün geleneği için uygun beceride eğitimliyseniz ve bu büyü 2. derece veya daha düşük yaygın bir büyüyse, onu otomatik olarak tanımlarsınız (yine de kritik bir başarı elde etmek için zar atarsınız, ancak başarıdan daha kötü bir sonuç elde edemezsiniz). Otomatik olarak tanımladığınız en yüksek büyü derecesi, uzmansanız 4'e, ustaysanız 6'ya ve efsaneviyseniz 10'a yükselir. GM, yapılan büyünün geleneğine karşılık gelen gizli bir Arkana, Doğa, Okültizm veya Din testi atar. Beceride eğitimli değilseniz, başarısızlıktan daha iyi bir sonuç elde edemezsiniz.
  prerequisites:
  - text: "Arkana, Doğa, Okültizm veya Din becerisinde eğitimli"

omen://feat/reconstruct-the-scene?source=paizo-pathfinder-player-core:
  name: Olay Yerini Canlandır
  description: Son bir gün içinde orada meydana gelen olaylar hakkında bir fikir edinmek için küçük bir konumu (tek bir oda gibi) inceleyerek 1 dakika harcarsınız. Bu, alanda dolaşmayı ve ayak izlerini, dökülen içecekleri veya kanı ve benzerlerini incelemeyi içerir. Orada gerçekleşen önemli olaylara dair belirsiz bir zihinsel izlenim edinirsiniz. Bu size genel olaylar ve bunların zaman çerçevesi de dahil olmak üzere geçmişe dair ipuçları ve ayrıntılar verir, ancak kusursuz bir kayıt değildir. Kişinin orada olduğundan önceden haberdar değilseniz, bu durum söz konusu olaylara kimlerin karıştığını belirlemek için de yeterli değildir. GM tarafından belirlendiği üzere, bir cinayet için kullanılan akılda kalıcı bir silah veya birinin geçerken giydiği pelerin türü gibi önemli ipuçları olarak hizmet edebilecek görünüşte küçük çeşitli ayrıntıları da yakalarsınız.

omen://feat/reflect-spell?source=paizo-pathfinder-player-core:
  name: Büyüyü Yansıt
  description: Hedeflenen yaratıkları veya bir alanı etkileyen bir büyüyü etkisizleştirmek için Büyü Bozumu'nu başarıyla kullandığınızda, bu büyünün etkisini yapana geri çevirebilirsiniz. Yansıtıldığında, bir alan büyüsü olsa veya normalde birden fazla yaratığı etkileyecek olsa bile, büyü yalnızca orijinal yapanı etkiler. Orijinal yapan normal şekilde bir kurtarış deneyebilir ve yansıtılan büyüye karşı diğer savunmaları kullanabilir.
  prerequisites:
  - text: "Büyü Bozumu"

omen://feat/reflexive-courage?source=paizo-pathfinder-player-core:
  name: Refleksif Cesaret
  description: Vahşi bir silah çağrısı haykırarak bir düşmana saldırmak için kendinize ilham verirsiniz. Tetikleyen yaratığa karşı yakın dövüş Vuruşu yapın. Vuruş kritik bir isabetse ve tetikleyici bir manipülasyon eylemi idiyse, eylem engellenir.
  prerequisites:
  - text: "Cenkçi ilham perisi"

omen://feat/reflexive-shield?source=paizo-pathfinder-player-core:
  name: Refleksif Kalkan
  description: Patlamaları ve benzerlerini savuşturmak için kalkanınızı kullanabilirsiniz. Kalkanınızı Kaldırdığınızda, Refleks kurtarışlarına kalkanınızın durumsal bonusunu kazanırsınız.

omen://feat/regrowth?source=paizo-pathfinder-player-core:
  name: Yeniden Büyüme
  description: Yaşamsal özünüz üzerindeki hâkimiyetiniz, sizin veya bir müttefikinizin ağır yaralardan kurtulmasını sağlar. Günde bir kez 7. derece kadim özgü büyü olarak Rejenerasyon yapabilirsiniz.

omen://feat/remediate?source=paizo-pathfinder-player-core:
  name: Islah Et
  description: Bir sonraki eyleminiz 3 eylemli bir İyileştir veya Zarar Ver büyüsü yapmak için ilahi pınarınızı kullanmaksa, karşıt güçleri dengelemek için artık enerjiden yararlanabilirsiniz. Normal etkilerine ek olarak, büyünün alanındaki bir ilahi etkiyi etkisizleştirmeyi denemek için iyileştir veya zarar ver büyünüzü kullanırsınız.

omen://feat/replenishment-of-war?source=paizo-pathfinder-player-core:
  name: Savaş İkmali
  description: Düşmanlarınıza saldırmak ilahınızdan övgü ve koruma çeker. İlahınızın gözde silahını kullanarak bir Vuruş ile bir yaratığa hasar verdiğinizde, seviyenizin yarısına eşit veya Vuruş bir kritik vuruşsa seviyenize eşit sayıda geçici Can Puanı kazanırsınız. Bu geçici Can Puanları bir sonraki sıranızın başına kadar sürer.
  prerequisites:
  - text: "ilahınızın gözde silahında uzman"

omen://feat/reprepare-spell?source=paizo-pathfinder-player-core:
  name: Büyüyü Yeniden Hazırla
  description: >
    Büyü slotlarınızdan bazılarını defalarca nasıl yeniden kullanacağınızı keşfettiniz. Bugün yapmış olduğunuz bir büyüyü hazırlamak için 10 dakika harcayabilir ve o büyü slotuna yeniden erişim kazanabilirsiniz. Büyü 4. derece veya daha düşük olmalı ve bir süreye sahip olmamalıdır. Aynı gün içinde daha önce yeniden hazırlamış olsanız bile bir büyüyü bu şekilde yeniden hazırlayabilirsiniz.
    Büyü İkamesi mistik tezine sahipseniz, yeni büyünün bir süresi olmadığı sürece, harcanan bir slotta bunun yerine farklı bir büyü hazırlayabilirsiniz. Bu slot üzerinde büyü ikamesini tekrar kullanabilirsiniz, ancak bir sonraki günlük hazırlıklarınızı yapana kadar o slotta yalnızca süresi olmayan büyüleri hazırlamakla sınırlı kalırsınız.

omen://feat/resounding-bravery?source=paizo-pathfinder-player-core:
  name: Çınlayan Cesaret
  description: Korkularınız bile dövüş ruhunuz için yakıt görevi görür. Bir düşmanın yeteneğine karşı İrade kurtarışında kritik bir başarı elde ettiğinizde, 1 dakika boyunca kurtarışlarına +1 statü bonusu ve seviyenizin yarısına eşit sayıda geçici Can Puanı kazanırsınız. Bir korku etkisine karşı kritik bir başarı elde ederseniz bu faydalar ikiye katlanır.
  prerequisites:
  - text: "Cesaret"

omen://feat/resounding-finale?source=paizo-pathfinder-player-core:
  name: Çınlayan Final
  description: Performansınızı ani ve dramatik bir sonla bitirerek diğer sesleri bastırırsınız. Beste büyünüz derhal sona erer ve büyünün etkilerinden yararlanan tüm müttefikler, tetikleyen hasara karşı beste büyüsünün derecesinin iki katına eşit ses direnci kazanır.
  prerequisites:
  - text: "Maestro ilham perisi"

omen://feat/restorative-channel?source=paizo-pathfinder-player-core:
  name: Onarıcı Kanal
  description: "İlahi zarafetle durumları ortadan kaldırabilirsiniz. Şifa pınarınızdan gelen ekstra slotlarınızda hazırladığınız bir İyileştir büyüsünü feda ederek bunun yerine şu büyülerden birini yapabilirsiniz: İlleti Temizle, Berrak Zihin, Sağlam Beden veya Sağlam Basış. Büyü, feda ettiğiniz büyüyle aynı dereceye yükseltilir."
  prerequisites:
  - text: "şifa pınarı"

omen://feat/restorative-strike?source=paizo-pathfinder-player-core:
  name: Onarıcı Vuruş
  description: >
    Terazinin her iki tarafını dengeler, bir düşmana saldırırken kendinizi yenilersiniz. Büyüyü normal şekilde harcayarak, kendinizi iyileştirmek için 1 eylemli bir zarar ver veya iyileştir büyüsü yapın. Bu şekilde yapıldığında manipülasyon özelliğini kaybeder. Ardından yakın dövüş Vuruşu yapın. Bu Vuruşu ilahınızın gözde silahıyla yaparsanız, saldırı zarına +1 statü bonusu kazanırsınız.
    Vuruş isabet ederse, büyüden aynı miktarda iyileşmesi için istekli ikinci bir yaratığı hedefleyebilirsiniz. Bu yaratık, vurduğunuz düşmana bitişik olması koşuluyla büyünün menzili dışında olabilir.

omen://feat/resurrectionist?source=paizo-pathfinder-player-core:
  name: Dirilişçi
  description: Ölümün eşiğinden geri getirdiğiniz bir yaratığın serpilmesini ve iyileşmeye devam etmesini sağlayabilirsiniz. Ölmekte olan bir yaratığa Can Puanı geri kazandırdığınızda veya ölü bir yaratığı hayata döndürüp ona Can Puanı kazandırdığınızda, o yaratığa 1 dakika boyunca hızlı iyileşme 5 bahşedersiniz. Bu hızlı iyileşme, yaratık Bilinçsiz duruma düşürülürse sona erer.

omen://feat/revealing-stab?source=paizo-pathfinder-player-core:
  name: Açığa Çıkaran Saplama
  description: >
    Delici silahınızı fark edilemeyen bir düşmana saplayarak yerini müttefiklerinize açığa çıkarırsınız. Delici bir yakın dövüş silahıyla Vuruş Yapın. Hedef Belirsizse, onu hedeflemek için bir düz test denemeniz gerekmez ve Gizliyse, onu hedeflemek için gereken düz testin ZD'si 5'tir. İsabet edip hasar verirseniz, saldırdığınız silahı hedefe saplayarak (eğer maddeselse) mevcut konumunu açığa çıkarabilirsiniz. Silahı Serbest Bırakırsınız ve hedefte saplanmış olarak kalır. Hedef gizlenmişse, onu hedeflemek için düz test gerekmez; hedef gizliyse, onu hedeflemek için düz test ZD'si 5 olur ve yaratık fark edilmemiş hale gelemez. Bu avantajlar yalnızca silahınızın hedefe saplandığını görebilen gözlemciler için geçerlidir. Hedef Görünmez ise, silah hedefe saplandığı sürece görünür kalır.
    Bu fayda, silah yaratıktan çıkarılana kadar sürer. Bitişik bir yaratık veya hedefin kendisi iki Etkileşime Gir eylemiyle silahı çıkarabilir.

omen://feat/reverberate?source=paizo-pathfinder-player-core:
  name: Yankılat
  description: Ses hasarını kaynağına geri sektirmek için etrafınızdaki akustiği manipüle edebilirsiniz. Yaratığın İrade ZD'sine veya bir tehlikenin Dayanıklılık ZD'sine karşı bir Gösteri testi deneyin. Hasar bir büyüden geldiyse ve daha düşükse yaratığın büyü ZD'sini kullanın.

omen://feat/ricochet-feint?source=paizo-pathfinder-player-core:
  name: Sekmeli Yanıltma
  description: Sekme Duruşu'ndayken, dikkatini dağıtmak için fırlatılan bir silahı bir düşmandan sektirebilirsiniz. Yalnızca yakın dövüş erişiminizdeki yaratıklara değil, kuşandığınız fırlatılan bir silahın ilk menzil kademesi içindeki bir yaratığa karşı bir Yanıltma deneyebilirsiniz.
  prerequisites:
  - text: "Sekme Duruşu"

omen://feat/ricochet-stance-fighter?source=paizo-pathfinder-player-core:
  name: Sekme Duruşu (Savaşçı)
  description: Fırlattığınız silahları size doğru geri sektirmek için bir duruş benimsersiniz. Bu duruştayken, ezici veya kesici hasar vermek için menzilli bir Vuruşun parçası olarak kullandığınız herhangi bir fırlatılan silah derhal elinize geri döner ve bunları ek Vuruşlar için kullanmanızı sağlar. Silahın listelenen menzil kademesi içinde olmalı ve silahı yakalamak için bir eliniz boşta bulunmalıdır. Fırlatılan bir silahla listelenen menzil kademesinin dışında menzilli bir Vuruş Yaparsanız, silah bunun yerine listelenen menzil kademesine eşit fit mesafede size doğru uçar ve ardından yere düşer.

omen://feat/ricochet-stance-rogue?source=paizo-pathfinder-player-core:
  name: Sekme Duruşu (Düzenbaz)
  description: Fırlattığınız silahları size doğru geri sektirmek için bir duruş benimsersiniz. Bu duruştayken, ezici veya kesici hasar vermek için menzilli bir Vuruşun parçası olarak kullandığınız herhangi bir fırlatılan silah derhal elinize geri döner ve bunları ek Vuruşlar için kullanmanızı sağlar. Silahın listelenen menzil kademesi içinde olmalı ve silahı yakalamak için bir eliniz boşta bulunmalıdır. Fırlatılan bir silahla listelenen menzil kademesinin dışında menzilli bir Vuruş Yaparsanız, silah bunun yerine listelenen menzil kademesine eşit fit mesafede size doğru uçar ve ardından yere düşer.

omen://feat/ride?source=paizo-pathfinder-player-core:
  name: Binicilik
  description: Binili olduğunuz bir Hayvana Emrederek hareket eylemi (örneğin Depar) yaptırdığınızda, bir test denemek zorunda kalmak yerine otomatik olarak başarılı olursunuz. Binili olduğunuz herhangi bir hayvan, bir uşak gibi sizin sıranızda eylem yapar. Bir karşılaşmanın ortasında bir hayvana Binerseniz, bir sonraki sırasını atlar ve ardından sonraki sıranızda eylem yapar.

omen://feat/rites-of-convocation?source=paizo-pathfinder-player-core:
  name: Toplanma Ayinleri
  description: Haminiz size yardım etmeleri için başka yaratıkları çağırma gücü bahşeder. Büyü geleneğinizin büyü listesinde görünen bir çağırma büyüsü seçin (Hayvan Çağır, Yapı Çağır vb.). Witch büyü slotlarınızdan birinde hazırladığınız bir büyüyü, aynı dereceye yükseltilmiş olarak seçtiğiniz büyüyle değiştirmek için tanıdığınızla iletişim halinde 10 dakika harcayabilirsiniz. Değiştirdiğiniz büyü en azından çağırma büyüsünün asgari büyü derecesinde olmalıdır.

omen://feat/rites-of-transfiguration?source=paizo-pathfinder-player-core:
  name: Başkalaşım Ayinleri
  description: Haminizin gücünü, diğer yaratıkları onların davranışlarına veya sizin heveslerinize daha uygun biçimlere dönüştürmek için uyarlayabilirsiniz. Lanetli Başkalaşım geleneğinizin büyü listesinde olmasa bile tanıdığınız Lanetli Başkalaşım öğrenir. Tanıdığınızla iletişim halinde 10 dakika harcayarak, Witch büyü slotlarınızdan birinde hazırladığınız 6. derece veya daha yüksek bir büyüyü aynı derecedeki bir Lanetli Başkalaşım büyüsüyle değiştirebilirsiniz.

omen://feat/ritual-researcher?source=paizo-pathfinder-player-core:
  name: Ritüel Araştırmacısı
  description: Ritüeller sanatı üzerine yapılan dikkatli araştırmalar, bunları icra etmede sizi daha iyi hale getirdi. Bir ritüel yapmanın parçası olarak denediğiniz tüm birincil ve ikincil testlere +2 durumsal bonusu kazanırsınız.
  prerequisites:
  - text: "Muamma ilham perisi"
  - text: "Okültizm becerisinde uzman"

omen://feat/ritual-reversion?source=paizo-pathfinder-player-core:
  name: Ritüel Geri Dönüşü
  description: Duyularınızı köreltmeden geçici olarak daha az göze çarpan bir forma dönebilirsiniz. Ruhunuz bedeninize katılmadan hemen önceki görünümünüze geri dönerek, size en çok benzeyen bitki veya mantar türünün sıradan bir örneğinin formunu alırsınız. Bu, boyutunuzun Küçük kalması haricinde Bitkilerle Bir büyüsünün etkilerine sahiptir.

omen://feat/robust-recovery?source=paizo-pathfinder-player-core:
  name: Dirençli İyileşme
  description: Hastalık ve zehirden kurtulmaya yardımcı olmak için halk tıbbını öğrendiniz ve bunu özenle kullanmak sizi özellikle dirençli kıldı. Bir Hastalığı veya Zehri Tedavi Ettiğinizde ya da bir başkası üzerinizde bu eylemlerden birini kullandığında, başarı durumunda verilen durumsal bonusunu +4'e yükseltin ve hastanın kurtarış sonucu bir başarıysa, hasta kritik başarı elde eder.
  prerequisites:
  - text: "Tıp becerisinde uzman"

omen://feat/rock-runner?source=paizo-pathfinder-player-core:
  name: Kaya Koşucusu
  description: Taşla olan doğuştan bağınız, engebeli yüzeylerde hareket etmede sizi mahir kılar. Taş kaynaklı zorlu araziyi (moloz veya çakıl gibi) ve taş ile topraktan yapılmış engebeli zemini görmezden gelebilirsiniz. Ayrıca, taş veya topraktan yapılmış dar yüzeylerde veya engebeli zeminde Denge Kurmak için Akrobasi becerisini kullandığınızda Gafil kalmazsınız ve bu Akrobasi testlerinden birinde başarı attığınızda bunun yerine kritik başarı elde edersiniz.

omen://feat/rough-rider?source=paizo-pathfinder-player-core:
  name: Yaman Binici
  description: >
    Geleneksel goblin bineklerine binmede özellikle iyisinizdir. Önkoşulları karşılamasanız bile Binicilik hünerini kazanırsınız. Bir goblin köpeği veya kurt binek üzerinde Hayvana Emretmek için yapılan Doğa testlerine +1 durumsal bonusu kazanırsınız.
    Yoldaş Hayvanı olarak bir kurt kazanırsanız, binek özel yeteneğini kazanır (ve binek özel yeteneğine sahip bir yoldaş hayvan bahşeden bir yetenek kazanırsanız, bir kurt seçebilirsiniz).

omen://feat/sabotage?source=paizo-pathfinder-player-core:
  name: Sabotaj
  description: "Başkalarının teçhizatına sinsice hasar verirsiniz. Erişiminiz içindeki bir yaratığın kuşandığı veya taşıdığı tek bir eşya seçin. Eşya sabotaj edebileceğiniz hareketli parçalara sahip olmalıdır (kısa yay sabote edilebilir, ancak uzun kılıç sabote edilemez). Yaratığın Refleks ZD'sine karşı bir thievery|defense:reflex testi deneyin. Sabotajın verdiği hasar eşyayı Kırılma Eşiğinin altına düşüremez."

omen://feat/sacred-ground?source=paizo-pathfinder-player-core:
  name: Kutsal Zemin
  description: Merkezi siz olan bir patlama alanına ilahınızın diyarının hafif bir gölgesini çağırmak için 1 dakika boyunca aralıksız dua edersiniz. 10 dakika sürer ve 10 dakikanın tamamı boyunca alanda kalan bir yaratık, seviyenize eşit Can Puanı geri kazanır. Bir şifa pınarınız varsa, bu aktivite iyileştirme ve canlılık özelliklerine sahip olur ve yaşayan yaratıkları iyileştirir. Bir zarar pınarınız varsa, bu aktivite iyileştirme ve boşluk özelliklerine sahip olur ve hortlak yaratıkları (veya boşluk iyileşmesine sahip diğer yaratıkları) iyileştirir. Çok Yönlü Pınar'a sahip rahipler birini veya her ikisini de seçebilir. Hiçbir durumda yaratıklara hasar veremez.
  prerequisites:
  - text: "zarar pınarı veya şifa pınarı"

omen://feat/sanctify-armament?source=paizo-pathfinder-player-core:
  name: Teçhizata Keramet Bahşet
  description: >
    Bir silaha dokunur ve onu ilahınızla uyumlu hale getirirsiniz. 1 tur boyunca o silah mübarek veya şerli özelliğinizi kazanır. Ayrıca karşıt özelliğe sahip yaratıklara fazladan 2d6 ruh hasarı verir. Örneğin, mübarekseniz silah şerli yaratıklara fazladan 2d6 ruh hasarı verir.
    Teçhizata Keramet Bahşet'i tekrar kullanırsanız, önceki kullanımı sona erer.
  prerequisites:
  - text: "mübarek veya şerli özellik"

omen://feat/sap-life?source=paizo-pathfinder-player-core:
  name: Canı Em
  description: Yaşam gücünü düşmanlarınızdan çekip çıkarırsınız. Bir Zarar Ver büyüsü yapıp en az bir yaşayan yaratığa hasar verdiğinizde, zarar ver büyünüzün büyü derecesine eşit Can Puanı geri kazanırsınız. Yaşayan bir yaratık değilseniz, bu hünerden hiçbir fayda elde edemezsiniz.

omen://feat/sapping-symbol?source=paizo-pathfinder-player-core:
  name: Kuvvet Emen Simge
  description: "Kutsal simgeniz kutsal enerjiyle parlayarak saldıranın kuvvetini zayıflığa çevirir. Tetikleyen yaratığın İrade ZD'sine karşı bir religion|defense:will testi deneyin. Sonuç ne olursa olsun yaratık 1 dakika boyunca geçici olarak bağışık olur."
  prerequisites:
  - text: "Simge Kaldır"

omen://feat/savage-critical?source=paizo-pathfinder-player-core:
  name: Vahşi Kritik
  description: Açtığınız yaralar pek ağırdır. Efsanevi yetkinliğe sahip olduğunuz bir silah veya silahsız saldırı ile Vuruş Yaptığınızda, zarda 19 atarsanız ve bu sonuç bir başarı teşkil ediyorsa kritik başarı elde edersiniz. Sonuç bir başarısızlık olacaksa bunun 19 üzerinde hiçbir etkisi yoktur.

omen://feat/scar-thick-skin?source=paizo-pathfinder-player-core:
  name: Yaralarla Kalınlaşmış Deri
  description: "Görkemli, dillerden düşmeyen yara izleri vücudunuzun büyük kısmını kaplar ve korur; sizi daha önce atlattıklarınızdan daha zayıf herhangi bir yaraya direnen etten bir zırhla kuşatır. Süren kanama hasarını sonlandırmak için gereken düz testlerde ZD'niz 15'ten 10'a veya özellikle uygun yardım aldıktan sonra 10'dan a'ya düşürülür."

omen://feat/scare-to-death?source=paizo-pathfinder-player-core:
  name: Korkudan Öldür
  description: "Düşmanları ölebilecekleri kadar korkutabilirsiniz. 30 fit içinde hissettiğiniz veya gözlemlediğiniz ve sizi hissedebilen veya gözlemleyebilen canlı bir yaratığın İrade ZD'sine karşı bir intimidation|defense:will testi deneyin. Hedef sizi duyamıyorsa veya konuştuğunuz dili anlamıyorsa –4 durumsal ceza alırsınız. Yaratık 1 dakika boyunca geçici olarak bağışık olur."
  prerequisites:
  - text: "Gözdağı becerisinde efsanevi"

omen://feat/schooled-in-secrets?source=paizo-pathfinder-player-core:
  name: Sırların Tedrisatından Geçmiş
  description: >
    Gizem tarikatlarının ve diğer gizli cemiyetlerin üyelerinin diğer üyelere bağlılıklarını beyan etmek için kullandıkları işaret ve sembolleri fark edersiniz. Bu tür gruplar hakkında Bilgi Toplamak için Diplomasi yerine ve bu grupların bir üyesinin Kılığına Girmek için Aldatma yerine Okültizm kullanabilirsiniz.
    Gizli bir tarikata, locaya, mezhebe veya benzer bir örgüte üyeyseniz, varlıklarını sizden özellikle gizlemeye çalışmadıkları sürece grubunuzun üyelerini otomatik olarak tanırsınız. Siz konumunuzu özellikle gizlemediğiniz sürece onlar da konumunuzu tanır.
  prerequisites:
  - text: "Okültizm becerisinde eğitimli"

omen://feat/scintillating-spell?source=paizo-pathfinder-player-core:
  name: Işıldayan Büyü
  description: Büyüleriniz ışık ve rengin göz kamaştırıcı bir gösterisine dönüşür. Bir sonraki eyleminiz karanlık özelliğine sahip olmayan, süresi bulunmayan ve yaratıkların Refleks kurtarış yapmasını gerektiren bir Büyü Yapmaksa, büyü diğer etkilerine ek olarak ışıldayan ışıklar saçarak patlar. Büyüye karşı Refleks kurtarışında başarısız olan her yaratık 1 tur boyunca Gözü Kamaşmış olur ve kritik başarısız olanlar ise 1 tur boyunca Kör olur.

omen://feat/scion-of-many-planes?source=paizo-pathfinder-player-core:
  name: Birçok Düzlemin Evladı
  description: "Soyunuzun uzun ve karmaşık geçmişi, gücünüzü diğer nefilimlerin çoğundan daha fazla düzlemsel kaynaktan çekebilmenizde kendini gösterir. Henüz sahip olmadığınız bir nephilim kalıtsal hüneri seçin; 1. seviyede bir kalıtsal hüner almış olsanız bile o hüneri ve tüm faydalarını kazanırsınız."

omen://feat/scoundrels-surprise?source=paizo-pathfinder-player-core:
  name: Alçağın Sürprizi
  description: Doğru anda kılığınızı çıkarıp atar ve hedefinizi şaşırtırsınız. Bir kılık değiştirme kiti kullanarak bir başkasının Kılığına Girdikten sonra, dramatik bir jestle kılığınızı çıkarabilirsiniz. Önceden kılığınızın ardındakini göremeyen tüm yaratıklar, sıranızın bitiminden önce yapacağınız bir sonraki saldırıya karşı Gafil kalır.

omen://feat/scouts-warning?source=paizo-pathfinder-player-core:
  name: İzcinin Uyarısı
  description: Müttefiklerinizi tehlikeye karşı görsel veya işitsel olarak uyararak her birine inisiyatif zarlarına +1 durumsal bonusu veya Öncülük Et keşif aktivitesini kullanıyorsanız +2 durumsal bonusu kazandırırsınız. El kol hareketleri yapmanıza veya seslenmenize bağlı olarak bu eylem sırasıyla görsel veya işitsel özelliğini kazanır.

omen://feat/scroll-adept?source=paizo-pathfinder-player-core:
  name: Parşömen Uzmanı
  description: >
    Günlük hazırlıklarınız sırasında büyü kitabınızdaki mistik büyüleri içeren iki geçici parşömen yaratabilirsiniz. Her parşömen farklı bir büyü derecesinde olmalı ve her iki büyü derecesi de en yüksek derecedeki büyünüzden 2 veya daha fazla derece düşük olmalıdır. Bu şekilde yarattığınız tüm parşömenler bir sonraki günlük hazırlıklarınızı yaptığınızda büyüsel olmayan hale gelir. Geçici bir parşömenin satılması durumunda hiçbir değeri yoktur. Bir parşömen için normal olduğu üzere, bunlar Hafif Hacimli tüketilebilir eşyalardır ve eşyayı bir elinde tutan biri, büyü listesinde yer alıyorsa büyü saldırı modifiyerini ve büyü ZD'sini kullanarak ondan Büyü Yapabilir.
    Büyü ZD'sinde usta yetkinliğe sahipseniz günlük hazırlıklarınız sırasında üç geçici parşömen yaratabilirsiniz ve efsanevi yetkinliğe sahipseniz dört geçici parşömen yaratabilirsiniz.
  prerequisites:
  - text: "Zanaat becerisinde uzman"

omen://feat/seasoned?source=paizo-pathfinder-player-core:
  name: Güngörmüş
  description: Pek çok yiyecek ve içecek türünün hazırlanmasında ustalaştınız. Simyasal Zanaat hünerine sahipseniz iksirler ve Büyülü Zanaat hünerine sahipseniz iksirler de dahil olmak üzere yiyecek ve içecek İmal Etmek için yapılan testlere +1 durumsal bonusu kazanırsınız. Önkoşul becerilerden birinde ustaysanız, bu bonus +2'ye yükselir.
  prerequisites:
  - text: "Alkol İlmi, Aşçılık İlmi veya Zanaat becerisinde eğitimli"

omen://feat/second-sting?source=paizo-pathfinder-player-core:
  name: İkinci İğne
  description: "Avınızın hareketlerini okur ve bunları fırsatlara dönüştürürsünüz; böylece bir silahla yapılan başarısızlıklar diğeriyle sıyırma darbelerine zemin hazırlar. Avlanan avınıza karşı gerekli silahlardan biriyle yakın dövüş Vuruşu yapın. Vuruş aşağıdaki başarısızlık etkisini kazanır."

omen://feat/second-thoughts?source=paizo-pathfinder-player-core:
  name: Tereddüt
  description: Hedefiniz büyüsel aldatmacalarınıza karşı dirençli çıktığında, bunları bir başkası üzerinde tekrar deneyebilirsiniz. Tetikleyen Büyüyü ek bir büyü slotu harcamadan, farklı bir yaratığı hedef alarak ikinci kez Yapabilirsiniz. Bunu yalnızca bir sonraki sıranızın sonuna kadar yapabilirsiniz ve büyünün ikinci kez yapılmasından sonra üzerinde Tereddüt kullanamazsınız.

omen://feat/secondary-detonation-array?source=paizo-pathfinder-player-core:
  name: İkincil İnfilak Dizilimi
  description: "Büyünüzün enerjisinin bir kısmını kararsız bir rünik dizilime yönlendirirsiniz. Bir sonraki eyleminiz hasar veren, süresi olmayan ve bir alanı etkileyen bir Büyü Yapmak ise, o alan içinde bir patlama hâlinde parlayan büyülü bir çember belirir. Bir sonraki sıranızın başında çember patlar ve büyü ZD'nize karşı temel bir Refleks kurtarışıyla çember içindeki tüm yaratıklara büyünün derecesi başına 1d6[force] hasar verir. Büyü farklı bir hasar türü verdiyse çember bunun yerine o hasar türünü verir (veya büyü birden fazla hasar türü verebiliyorsa seçtiğiniz bir türü)."

omen://feat/seedpod?source=paizo-pathfinder-player-core:
  name: Tohum Kozası
  description: Bedeniniz neredeyse sonsuz bir sert tohum kozası kaynağı üretir. Menzil kademesi 30 fit olan ve 1d4 ezici hasar veren bir tohum kozası menzilli silahsız saldırısı kazanırsınız. Kritik bir isabette tohum kozası patlayarak hedefin Hızına bir sonraki sıranızın başına kadar –10 fit durumsal cezası veren bir bitki örtüsü yumağı saçar. Tohum kozaları kritik uzmanlaşma etkileri eklemez.

omen://feat/selective-energy?source=paizo-pathfinder-player-core:
  name: Seçici Enerji
  description: İlahi gücü çağırırken bazı düşmanların faydalanmasını veya bazı müttefiklerin zarar görmesini engelleyebilirsiniz. Zarar Ver veya İyileştir büyüsünün alanı olan bir versiyonunu yaptığınızda, alandaki en fazla 5 yaratığı belirleyebilirsiniz. Bu yaratıklar büyü tarafından hedeflenmez.

omen://feat/sense-allies?source=paizo-pathfinder-player-core:
  name: Müttefikleri Hisset
  description: Birbirine sıkı sıkıya bağlı bir toplulukta yetişen pek çok insan gibi, başkalarının varlığına her zaman güçlü bir şekilde uyum sağlamışsınızdır. Farkında olduğunuz ve 60 fit içinde sizden normalde Konumu Saptanmamış olacak istekli müttefikler, bunun yerine sizden Gizli kalır. Sizden gizli olan 60 fit içindeki istekli müttefikleri hedeflemeniz için gereken düz test 11 yerine 'dir.

omen://feat/sense-the-unseen?source=paizo-pathfinder-player-core:
  name: Görünmeyeni Hisset
  description: Düşmanları ararken dakika hareketleri veya havanın cildinizdeki hareketleri gibi en ufak ipuçlarını bile yakalayabilirsiniz. Tetikleyen testte başarısız olsanız bile, Arama yaptığınız alandaki Fark Edilmemiş tüm yaratıkları otomatik olarak sezer ve onları sizin için yalnızca Gizli hale getirirsiniz.

omen://feat/shadow-hunter?source=paizo-pathfinder-player-core:
  name: Gölge Avcısı
  description: Çevrenize o kadar iyi uyum sağlarsınız ki başkaları sizi araziden ayırt etmekte güçlük çeker. Doğal arazideyken, eğer tercih ederseniz, avlanan avınız hariç tüm düşmanlardan her zaman Gizlenmiş sayılırsınız.
  prerequisites:
  - text: "Kamuflaj"

omen://feat/shadow-of-the-wilds?source=paizo-pathfinder-player-core:
  name: Yabanın Gölgesi
  description: Yabani bölgelerden geçişinizin fark edilmesi güçtür. Kentsel bir ortamda olmadığınız sürece, keşif modunda farklı bir aktivite seçmiş olsanız bile her zaman İzleri Örtüyor sayılırsınız.

omen://feat/shadow-self?source=paizo-pathfinder-player-core:
  name: Gölge Benlik
  description: Düşmanlarınızın dikkatinden sıyrılır ve başka bir yerdeymiş gibi görünürsünüz. 1 dakika boyunca veya bir düşmanca eylem yapana kadar (hangisi önce gelirse) Görünmez olursunuz. 10 fit yakınınızda bir konum seçin. Görünmezliğiniz sona erene kadar sizi bulmaya çalışan herkese o konumda belirsizmiş gibi görünürsünüz. Arayan kişi orada olmadığınıza dair net bir kanıt elde ederse, artık orada gizlendiğinizi düşünmez ama gerçek konumunuzu da keşfedemez.
  prerequisites:
  - text: "Gizlilik becerisinde efsanevi"

omen://feat/shameless-request?source=paizo-pathfinder-player-core:
  name: Yüzsüzce İstek
  description: Katıksız cüretkarlık ve cazibenizi kullanarak isteklerinizin sonuçlarını veya aşırılığını önemsiz gibi gösterebilirsiniz. Bir İstekte Bulunduğunuzda, aşırı bir istekte bulunmaktan kaynaklanan ZD artışlarını 2 azaltırsınız ve İsteğiniz için kritik başarısızlık atarsanız bunun yerine başarısızlık elde edersiniz. Bu durum, bir İstekte Bulunarak hedefinizin size karşı tutumunu asla düşüremeyeceğiniz anlamına gelse de, size karşı olumlu bir tutuma sahip olsalar bile eninde sonunda isteklerden bıkar ve yorulurlar.
  prerequisites:
  - text: "Diplomasi becerisinde usta"

omen://feat/shared-assault?source=paizo-pathfinder-player-core:
  name: Ortak Taarruz
  description: Savaşın zaferinde zaferi başka bir müttefikinizle paylaşabilirsiniz. Cesur Taarruz için seçtiğiniz müttefik o eylemin bahşettiği Vuruşta kritik başarı elde ettiğinde, Cesaret Marşı beste büyünüzden etkilenen başka bir müttefik derhal bir reaksiyon kullanarak yakın dövüş Vuruşu yapabilir. İkinci müttefik de kritik başarı elde etse bile bu etki üçüncü bir müttefike devam etmez.
  prerequisites:
  - text: "Cesur Taarruz"

omen://feat/shared-avoidance?source=paizo-pathfinder-player-core:
  name: Ortak Kaçınma
  description: Tehlike önsezilerinizi müttefiklerinize yansıtabilirsiniz. Kaçınma Önsezisi kullandığınızda, 20 fit yakınınızda bulunan ve aynı tehlikeye karşı aynı kurtarışını atan müttefikler de kurtarışlarına +2 durumsal bonusu kazanır.
  prerequisites:
  - text: "Kaçınma Önsezisi"

omen://feat/shared-clarity?source=paizo-pathfinder-player-core:
  name: Ortak Berraklık
  description: Berraklık önsezilerinizi müttefiklerinize yansıtabilirsiniz. Berraklık Önsezisi kullandığınızda, 15 fit yakınınızda bulunan ve aynı zihinsel etkiye karşı aynı kurtarışında başarısız olan müttefikler de reaksiyonlarını harcayarak başarısız kurtarışını +2 durumsal bonusu ile yeniden atabilirler.
  prerequisites:
  - text: "Berraklık Önsezisi"

omen://feat/shared-prey?source=paizo-pathfinder-player-core:
  name: Ortak Av
  description: İkili olarak avlanırken siz ve müttefikiniz avınızı birlikte hedef alırsınız. Avı Avla kullanıp yalnızca bir av seçtiğinizde, bu faydaları kendiniz kazanmanın yanı sıra Avı Avla faydalarınızı ve avcının avantajını bir müttefike de bahşedebilirsiniz. Müttefik, siz Avı Avla'yı tekrar kullanana kadar bu faydaları korur.
  prerequisites:
  - text: "Çifte Av"
  - text: "Muhafızın Lütfu"

omen://feat/shared-replenishment?source=paizo-pathfinder-player-core:
  name: Ortak İkmal
  description: "İlahınız savaşçı eylemlerinizi kutsadığında, bu lütfu müttefiklerinize genişletebilirsiniz. Savaş İkmali'nden gelen geçici Can Puanlarını kendiniz kazanmak yerine 10 fit yakınınızdaki bir müttefike bahşedebilirsiniz. Bu geçici Can Puanlarını her seferinde farklı bir müttefike bahşedebilirsiniz; bu da tek bir sırada bunları birden fazla yaratığa bahşedebileceğiniz anlamına gelir."
  prerequisites:
  - text: "Savaş İkmali"

omen://feat/shatter-defenses?source=paizo-pathfinder-player-core:
  name: Savunmaları Kır
  description: Vuruşunuz düşmanınızın korkusundan faydalanır. Korkmuş bir yaratığa karşı yakın dövüş Vuruşu yapın. İsabet eder ve hasar verirseniz hedef, korkmuş durumu sona erene kadar Gafil kalır. Bu Vuruş ile hasar verdiğinizde hedef zaten size karşı gafil idiyse, bir sonraki sıranızın başına kadar korkmuş değerini 1'in altına düşüremez.

omen://feat/shield-block?source=paizo-pathfinder-player-core:
  name: Kalkanla Engelleme
  description: >
    Gelen darbeyi savuşturmak için kalkanınızı hızla araya sokarsınız. Kalkanınız, Sertlik (Hardness) değeri kadar hasar almanızı engeller. Siz ve kalkanınız kalan hasarı ayrı ayrı alırsınız; bu durum kalkanın Kırılma Eşiğine (Broken Threshold) ulaşmasına veya parçalanmasına neden olabilir.

  trigger: Kalkanınızı kaldırmışken bir saldırıdan fiziksel hasar (ezici, delici veya kesici) almak üzeresinizdir.

omen://feat/shield-of-faith?source=paizo-pathfinder-player-core:
  name: İman Kalkanı
  description: Alan büyülerinizden arta kalan enerji savunmanızı pekiştirir. Bir alan büyüsü yapmak için bir Odak Puanı harcadığınızda, bir sonraki sıranızın başına kadar SD'nize +1 statü bonusu kazanırsınız.
  prerequisites:
  - text: "Alan Çömezi"

omen://feat/shield-warden?source=paizo-pathfinder-player-core:
  name: Kalkan Muhafızı
  description: Kalkanınız kalkık durumdayken, bitişiğinizdeki bir müttefike karşı bir vuruş yapıldığında Kalkanla Engelleme reaksiyonunuzu kullanabilirsiniz. Bunu yaparsanız kalkan, Kalkanla Engelleme için normal kuralları izleyerek sizin hasar almanızı önlemek yerine o müttefikin hasar almasını önler.
  prerequisites:
  - text: "Kalkanla Engelleme"

omen://feat/shielded-stride?source=paizo-pathfinder-player-core:
  name: Kalkanlı Depar
  description: Kalkanınız yukarıdayken düşmanlarınızın darbeleri size dokunamaz. Kalkanınızı kaldırdığınızda, hareketinizle tetiklenen reaksiyonları (Reaktif Vuruşlar gibi) tetiklemeden Hızınızın yarısı kadar hareket etmek üzere Depar atabilirsiniz. İlgili hareket türüne sahipseniz Depar atmak yerine Uçarken veya Yüzerken Kalkanlı Depar kullanabilirsiniz.

omen://feat/shove-down?source=paizo-pathfinder-player-core:
  name: İterek Düşürme
  description: Hareket ettirdiğiniz düşmanları devirmek için ağırlığınızı kullanırsınız. Hedef artık erişiminizde olmasa bile hedefe Çelme Takmayı denersiniz.
  prerequisites:
  - text: "Atletizm becerisinde eğitimli"

omen://feat/side-by-side-druid?source=paizo-pathfinder-player-core:
  name: Yan Yana (Druid)
  description: Siz ve yoldaş hayvanınız peş peşe savaşarak düşmanlarınızın dikkatini dağıtır ve dengelerini bozarsınız. Siz ve yoldaş hayvanınız aynı düşmana bitişik olduğunuzda, gerçek konumlarınıza bakılmaksızın her ikiniz de o düşmanı birbirinizle kuşatmış sayılırsınız.
  prerequisites:
  - text: "Yoldaş Hayvan"

omen://feat/side-by-side-ranger?source=paizo-pathfinder-player-core:
  name: Yan Yana (Korucu)
  description: Siz ve yoldaş hayvanınız peş peşe savaşırsınız. Siz ve yoldaş hayvanınız aynı düşmana bitişik olduğunuzda, gerçek konumlarınıza bakılmaksızın her ikiniz de o düşmanı birbirinizle kuşatmış sayılırsınız.
  prerequisites:
  - text: "bir yoldaş hayvan"

omen://feat/sidestep?source=paizo-pathfinder-player-core:
  name: Yana Adım
  description: Ustaca bir kenara çekilir ve bir saldırıyı nazikçe başka yöne yönlendirirsiniz. Tetikleyen saldırıyı, bitişiğinizde bulunan ve saldırının erişimi veya azami menzili içinde olan seçtiğiniz bir yaratığa yönlendirirsiniz. Saldırgan, Vuruşun saldırı zarını yeni hedefe karşı yeniden atar.

omen://feat/sign-language?source=paizo-pathfinder-player-core:
  name: İşaret Dili
  description: >
    Bildiğiniz dillerle ilişkili işaret dillerini öğrenerek işaret diliyle anlaşabilir ve işaretleri anlayabilirsiniz. İşaret dilleri daha karmaşık kavramları aktarmak için tipik olarak iki eli de gerektirir ve işitsel olmaktan ziyade görseldir.
    Bir hedefi önermek için bir düşmanı işaret etmek gibi temel hareketlerin aksine, gereken dikkat seviyesi nedeniyle savaş sırasında işaret dilini anlamak zordur. Gürültülü bir ortamda konuşmanın zor olması gibi, görüşün az olduğu alanlarda da işaret dilini kullanmak zordur.
  prerequisites:
  - text: "Sosyoloji becerisinde eğitimli"

omen://feat/siphon-power?source=paizo-pathfinder-player-core:
  name: Gücü Em
  description: Haminizin tanıdığınız içinde ikamet eden büyü rezervinden yararlanırsınız. Sıranız sırasında, tanıdığınızın bildiği ve haminiz veya dersleriniz tarafından bahşedilen bir büyüyü, bunun için bir büyü slotu harcamadan (hatta onu hazırlamamış olsanız bile) yapabilirsiniz. Büyü, en yüksek derecedeki Witch büyü slotunuzdan en az 1 derece düşük olmalıdır.

omen://feat/skill-mastery?source=paizo-pathfinder-player-core:
  name: Beceri Ustalığı
  description: >
    Düzenbaz: Becerilerinizden birindeki yetkinlik derecenizi uzmandan ustaya ve bir diğer becerinizdeki yetkinliği eğitimliden uzmana yükseltin. Seçtiğiniz becerilerden biriyle ilişkili bir beceri hüneri kazanırsınız; tüm önkoşullarını karşılamalısınız.
    Müfettiş: Becerilerinizden birindeki yetkinlik derecenizi uzmandan ustaya ve bir diğer becerinizdeki yetkinliği eğitimliden uzmana yükseltin. Seçtiğiniz becerilerden biriyle ilişkili bir beceri hüneri kazanırsınız.
  prerequisites:
  - text: "Düzenbaz Yolu veya Müfettiş Yolu"
  - text: "en az bir beceride eğitimli ve en az bir beceride uzman"

omen://feat/skill-training?source=paizo-pathfinder-player-core:
  name: Beceri Eğitimi
  description: Seçtiğiniz beceride eğitimli hale gelirsiniz.
  prerequisites:
  - text: "Zekâ +1"

omen://feat/skillful-tail?source=paizo-pathfinder-player-core:
  name: Becerikli Kuyruk
  description: >
    Cinsoylu: Bir kuyrukla doğdunuz ve pratik yaparak onunla kilitli olmayan bir kapıyı açmak gibi basit Etkileşime Gir eylemlerini nasıl gerçekleştireceğinizi öğrendiniz. Kuyruğunuz parmak veya kayda değer el becerisi gerektiren eylemleri gerçekleştiremez; buna başarmak için bir test gerektiren herhangi bir eylem de dahildir ve onu eşyaları tutmak için kullanamazsınız.
    Nefilim: Her zaman bir kuyruğunuz vardı ancak pratik yaparak onu ruh halinizi belli etmekten daha fazlası için kullanmayı öğrendiniz. Kuyruğunuzla kilitli olmayan bir kapıyı açmak gibi basit Etkileşime Gir eylemleri gerçekleştirebilirsiniz. Kuyruğunuz parmak veya kayda değer el becerisi gerektiren eylemleri gerçekleştiremez; buna başarmak için bir test gerektiren herhangi bir eylem de dahildir ve onu eşyaları tutmak için kullanamazsınız.

omen://feat/skirmish-strike?source=paizo-pathfinder-player-core:
  name: Çarpışma Vuruşu
  description: Ayaklarınız ve silahınız uyum içinde hareket eder. Ya Adım atıp ardından Vuruş Yapın ya da Vuruş Yapıp ardından Adım atın.

omen://feat/skittering-scuttle?source=paizo-pathfinder-player-core:
  name: Kıpır Kıpır Koşturma
  description: Müttefiklerin yanında manevra yaparken daha uzağa ve daha hızlı koşturabilirsiniz. Goblin Koşturması kullandığınızda, Adım atmak yerine Hızınızın yarısına kadar Depar atabilirsiniz.
  prerequisites:
  - text: "Goblin Koşturması"

omen://feat/slag-may?source=paizo-pathfinder-player-core:
  name: Cüruf Mayi
  description: Anneniz fiziksel gücüyle tanınan bir demir kocakarıydı ve bir menekşe veya çelik grisi gözünüz var. Vücudunuzdan doğal olarak büyüyen soğuk demirden yapılmış kalın, sağlam pençeleriniz vardır. 1d6 kesici hasar veren bir pençe silahsız saldırısı kazanırsınız. Pençeleriniz boğuşma grubundadır, silahsız ve kavrama özelliklerine sahiptir ve soğuk demirdir.

omen://feat/slam-down?source=paizo-pathfinder-player-core:
  name: Yere Çalma
  description: Bir düşmanın dengesini bozmak için bir vuruş yapar, ardından onu yere sermek için derhal bir savurmayla devam edersiniz. Yakın dövüş Vuruşu yapın. İsabet eder ve hasar verirse, vurduğunuz yaratığa Çelme Takmak için bir Atletizm testi deneyebilirsiniz. İki elli bir yakın dövüş silahı kuşanıyorsanız, Çelme Tak eyleminin bir elinizin boşta olması gereksinimini görmezden gelebilirsiniz. Her iki saldırı da çoklu saldırı cezanıza dahil edilir, ancak ceza her ikisini de yapana kadar artmaz.
  requirements: Sıranızda 2 eylem harcarsınız.
  prerequisites:
  - text: "Atletizm becerisinde eğitimli"

omen://feat/sleek-reposition?source=paizo-pathfinder-player-core:
  name: Kıvrak Yerinden Oynatma
  description: >
    Rakibiniz önceki saldırınızın etkisinden henüz kurtulurken, onu istediğiniz gibi hareket ettirmek için zırhına, kıyafetine veya etine takılırsınız. İnce veya gönderli bir silahla yakın dövüş Vuruşu yapın. Boyutunuzda veya daha küçük bir hedefe isabet ederseniz, Yerinden Oynat eylemiyle aynı faydalarla (Vuruşunuz kritik bir vuruşsa kritik başarı etkisi dahil) onu otomatik olarak Yerinden Oynatabilirsiniz. Menzilli bir silah kullandıysanız, bu Yerinden Oynatma için silahın menzilini kullanın. Gönderli bir silah kuşanıyorsanız, Yerinden Oynat eyleminin bir elinizin boşta olması gereksinimini görmezden gelebilirsiniz.
    Bu Vuruş aşağıdaki başarısızlık etkisine sahiptir.

omen://feat/slip-sideways?source=paizo-pathfinder-player-core:
  name: Yana Kayış
  description: Pek çok fiend gibi, kendinizi güvenli bir yere ışınlamak için doğaüstü bir yeteneğe sahipsiniz. Günde bir kez, 5. derece ilahi özgü büyü olarak Yer Değiştir yapabilirsiniz.
  prerequisites:
  - text: "Kasvettohumu, Çukurdoğumlu veya Cehennemtohumu ya da Fiend'ler veya Maelstrom ile ilişkili başka bir kalıtsal hüner"

omen://feat/slippery-secrets?source=paizo-pathfinder-player-core:
  name: Ele Avuca Sığmaz Sırlar
  description: Gerçek doğanızı veya niyetlerinizi ortaya çıkarma girişimlerinden sıyrılır ve kaçınırsınız. Bir büyü veya büyüsel etki zihninizi okumaya, yalan söyleyip söylemediğinizi tespit etmeye veya kimliğinizi ortaya çıkarmaya çalıştığında, büyünün veya etkinin ZD'sine karşı bir Aldatma testi deneyebilirsiniz. Başarılı olursanız etki hiçbir şey açığa çıkarmaz.
  prerequisites:
  - text: "Aldatma becerisinde usta"

omen://feat/sly-disarm?source=paizo-pathfinder-player-core:
  name: Kurnazca Silahsızlandırma
  description: Kaba kuvvet yerine el çabukluğuyla bir yaratığı Silahsızlandırabilirsiniz. Silahsızlandırma denediğinizde Atletizm yerine Hırsızlık kullanabilirsiniz. Silahsızlandırma denemek için Hırsızlık kullandığınızda ve başarılı olduğunuzda hedef, sıranızın sonundan önce yapacağınız bir sonraki saldırıya karşı Gafil kalır.

omen://feat/sly-striker?source=paizo-pathfinder-player-core:
  name: Kurnaz Vurucu
  description: >
    Vuruşlarınız Gafil olmayan yaratıklara karşı bile daha fazla hasar verir. Gafil olmayan bir yaratığa karşı bir Vuruşta başarılı veya kritik başarılı olduğunuzda fazladan 1d6 zayıf nokta hasarı da verirsiniz. Bu yalnızca sinsi saldırı hasarı verebileceğiniz bir silah veya silahsız saldırı kullanıyorsanız geçerlidir.
    14. seviyede, gafil yaratıklara normalde 3d6 veya daha fazla sinsi saldırı hasarı verecekseniz, gafil olmayan yaratıklara 2d6 zayıf nokta hasarı verirsiniz.
  prerequisites:
  - text: "sinsi saldırı"

omen://feat/smash-from-the-air?source=paizo-pathfinder-player-core:
  name: Havada Parçala
  description: Uzmanlığınız büyüleri savuşturmanıza olanak tanır. Menzilli büyü saldırılarına karşı Havada Kes kullanabilirsiniz.
  prerequisites:
  - text: "Havada Kes"

omen://feat/snagging-strike?source=paizo-pathfinder-player-core:
  name: Kancalayan Vuruş
  description: Bir saldırıyı hızlı kavrama hareketleriyle birleştirerek bir düşmanın erişiminizde kaldığı sürece dengesini bozarsınız. Bir elinizi boşta tutarak bir Vuruş Yapın. Bu Vuruş isabet ederse hedef, bir sonraki sıranızın başına kadar veya elinizin erişiminde olmadığı ana kadar (hangisi önce gelirse) Gafil kalır.

omen://feat/snap-shot?source=paizo-pathfinder-player-core:
  name: Şipşak Atış
  description: "Bir yaratık yakın mesafedeyken menzilli silahlarla reaksiyon verebilirsiniz. Normalde yakın dövüş silahı ile Vuruş Yapmanıza izin veren bir reaksiyonu bunun yerine menzilli silah ile Vuruş Yapmak için kullanabilirsiniz. Bitişik bir hedefe Vuruş Yapıyor olmalısınız. Reaksiyonun tetikleyicisi için gerekliyse menzilli silahınızı sanki 5 fit erişime sahipmiş gibi değerlendirirsiniz. Reaksiyonun belirli bir tür silah kuşanmak gibi başka gereksinimleri varsa, Şipşak Atış bunları görmezden gelmenize izin vermez; yalnızca yakın dövüş silahı Vuruşunu menzilli silah Vuruşuyla değiştirmenize izin verir."

omen://feat/sneak-adept?source=paizo-pathfinder-player-core:
  name: Sinsi Uzman
  description: Sizi fark etmek neredeyse imkansızdır. Gizlice İlerle eyleminde başarısızlık attığınızda bunun yerine başarı elde edersiniz. Yine de kritik başarısızlık yaşayabilirsiniz.
  prerequisites:
  - text: "Gizlilik becerisinde usta"

omen://feat/snowdrift-spell?source=paizo-pathfinder-player-core:
  name: Kar Kürtüğü Büyüsü
  description: Büyünüzün uluyan rüzgârı ve yağışı kalın kara dönüşür. Bir sonraki eyleminiz hava, su veya soğuk özelliğine sahip olan ve ateş özelliğine sahip olmayan bir Büyü Yapmaksa, yerdeki büyüden etkilenen bir yaratık seçin. Yaratığın altındaki veya bitişiğindeki yerdeki her kare bilek boyu karla dolar. Bu kareler bir sonraki sıranızın başına kadar zorlu arazidir. Bir yaratık bir kar karesini temizlemek için Etkileşime Gir eylemi yapabilir ve bir karedeki kar o karenin bir ateş etkisine maruz kalması durumunda erir.
  prerequisites:
  - text: "Fırtına Düzeni"

omen://feat/soaring-shape?source=paizo-pathfinder-player-core:
  name: Süzülen Form
  description: Kanatlar sizi aşağıdaki zeminin prangalarından kurtarır. Uçan Form'daki yarasa ve kuş formlarını Ehlileşmemiş Form listenize ekleyin. Böcek Formu hünerine sahipseniz yaban arısı formunu da ehlileşmemiş form listenize eklersiniz. Vahşi Form hünerine sahipseniz pterozor formunu da ehlileşmemiş form listenize eklersiniz. Ehlileşmemiş formu belirli bir Akrobasi modifiyeri bahşeden bir forma bürünmek için her kullandığınızda, Akrobasi testlerine +1 statü bonusu kazanırsınız.
  prerequisites:
  - text: "Ehlileşmemiş Form"

omen://feat/solar-rejuvenation?source=paizo-pathfinder-player-core:
  name: Güneşle Gençleşme
  description: >
    Ghoran - Güneşin sıcaklığı ve ışığı size hayat verir. Gün boyunca 10 dakika açık havada dinlenirseniz, Dayanıklılık modifiyeriniz × seviyenizin yarısına eşit Can Puanı geri kazanırsınız. Bu faydayı Yaraları Tedavi Et'ten gelen herhangi bir iyileşmeye ek olarak kazanırsınız.
    Leshy - Gün boyunca 10 dakika açık havada dinlenirseniz, Dayanıklılık modifiyeriniz × seviyenizin yarısına eşit Can Puanı geri kazanırsınız. Bu faydayı Yaraları Tedavi Et'ten gelen herhangi bir iyileşmeye ek olarak kazanırsınız. Bitki beslenmesi fotosenteze dayanmayan leshy'ler benzer şekilde uygun bir ortam gerektirir. Örneğin mantar leshy'leri karanlık, nemli ortamlara ve çürüyen bitki maddesi yığınına ihtiyaç duyar.

omen://feat/song-of-marching?source=paizo-pathfinder-player-core:
  name: Yürüyüş Şarkısı
  description: Sizin ve müttefiklerinizin zorlanmadan engin mesafeler kat etmenizi sağlayan Yürüyüş Şarkısı beste kantripini öğrenirsiniz.

omen://feat/song-of-strength?source=paizo-pathfinder-player-core:
  name: Kuvvet Şarkısı
  description: Performanslarınız fiziksel görevlerde yardımcı olmak için müttefiklerinize güç aşılar. Kuvvet Şarkısı beste kantripini öğrenirsiniz.
  prerequisites:
  - text: "Cenkçi ilham perisi"

omen://feat/soothing-ballad?source=paizo-pathfinder-player-core:
  name: Yatıştırıcı Balad
  description: Performansınızın gücüyle müttefiklerinizin yaralarını yatıştırırsınız. Yatıştırıcı Balad beste büyüsünü öğrenirsiniz.

omen://feat/soulsight-bard?source=paizo-pathfinder-player-core:
  name: Ruhgörüşü (Ozan)
  description: >
    İlham periniz duyularınızı öte dünyaya açtı. 60 fit menzilli belirsiz bir duyu olarak ruh sezgisi kazanırsınız. Ruh sezgisi; yaşayan yaratıklar, zihinsiz olmayan çoğu hortlak ve musallatlar dahil olmak üzere belirtilen menzil içindeki yaratıkların ruhlarını sezmenizi sağlar. İşitme duyunuzda ve diğer belirsiz duyularınızda olduğu gibi, Konumu Saptanmamış bir yaratığın yerini tespit etmek için yine de Arama yapmanız gerekir.
    Ruh sezgisi fiziksel bedenleri değil ruhani özü tespit ettiğinden, Suret Yansıt gibi büyülerle yansıtılan veya başka türlü ruhsuz nesneleri ele geçiren ruhları tespit edebilir. Ruhsuz bedenleri, yapıları veya nesneleri tespit edemez ve çoğu duyu gibi katı nesnelerin içinden geçemez.

omen://feat/sow-spell?source=paizo-pathfinder-player-core:
  name: Büyü Ek
  description: "Büyünüzü katlayıp bir tohuma dönüştürürsünüz. Bir sonraki eyleminiz 1 eylem veya 2 eylem kullanarak bir Büyü Yapmak ise, büyü bunun yerine bitişikteki bir kareye ekilir. Büyüye ilişkin tüm kararları büyüyü yaptığınız anda vermelisiniz. Sonraki 10 dakika içinde, ekilen büyünün alanına veya bitişiğindeki bir kareye bir yaratık girdiğinde tetiklenen bir reaksiyon olarak ekilen büyünüzü filizlendirip büyünün etkilerini üretmesi için yönlendirebilirsiniz. Aynı anda yalnızca bir ekilmiş büyüye sahip olabilirsiniz ve büyüyü 10 dakika içinde tetiklemezseniz dağılır ve büyü kaybolur. Bir yaratık büyü ZD'nize karşı başarılı bir perception|against:spell testiyle ekilen büyüyü fark edebilir."

omen://feat/speak-with-kindred?source=paizo-pathfinder-player-core:
  name: Soydaşla Konuş
  description: "Fizyolojinizi paylaşan yaratıklarla bir bağınız vardır. Bitkilere ve mantarlara sorular sorabilir, onlardan cevaplar alabilir ve onlarla Diplomasi becerisini kullanabilirsiniz. Kendi türünüzden bitkiler veya mantarlarla yapılan Diplomasi testlerine +2 durumsal bonusu kazanırsınız. Genel olarak mantar leshy'leri mantarlar ve funguslarla; su kabağı leshy'leri kabaklar, kavunlar ve benzeri meyve veren bitkilerle; yaprak leshy'leri yaprak döken ağaçlarla; ve sarmaşık leshy'leri sarmaşıklar ve tırmanan bitkilerle bu bonusu alır."

omen://feat/specialized-companion-druid?source=paizo-pathfinder-player-core:
  name: Uzmanlaşmış Yoldaş (Druid)
  description: Yoldaş Hayvanınız güç ve kabiliyet açısından büyümeye devam eder. Seçtiğiniz bir uzmanlığı kazanır
  prerequisites:
  - text: "İnanılmaz Yoldaş"

omen://feat/specialized-companion-ranger?source=paizo-pathfinder-player-core:
  name: Uzmanlaşmış Yoldaş (Korucu)
  description: Yoldaş Hayvanınız güç ve kabiliyet açısından büyümeye devam eder ve artık uzmanlaşacak kadar kurnazdır. Yoldaş Hayvanınız seçtiğiniz bir uzmanlığı kazanır.
  prerequisites:
  - text: "İnanılmaz Yoldaş"

omen://feat/specialty-crafting?source=paizo-pathfinder-player-core:
  name: Uzmanlık Zanaatı
  description: >
    Eğitiminiz belirli bir tür eşyayı İmal Etmeye odaklandı. Aşağıda listelenen uzmanlıklardan birini seçin; o türdeki eşyaları İmal Etmek için yapılan Zanaat testlerine +1 durumsal bonusu kazanırsınız. Zanaat konusunda ustaysanız, bu bonus +2'ye yükselir. Uzmanlığın geçerli olup olmadığı belirsizse GM karar verir. Bazı uzmanlıklar yalnızca kısmen geçerli olabilir. Örneğin, bir sabah yıldızı yapıyorsanız ve ahşap işçiliği uzmanlığınız varsa eşya hem demircilik hem de ahşap işçiliği gerektirdiğinden GM size bonusunuzun yarısını verebilir.
    Uygulanabilir Eşyalar
    Simya*
    İksirler gibi simyasal eşyalar
    Sanat
    Mücevher dahil güzel sanatlar
    Demircilik
    Metal zırh dahil dayanıklı metal eşyalar
    Kitapçılık
    Kitaplar ve kâğıt
    Camcılık
    Züccaciye ve pencereler dahil cam
    Dericilik
    Deri zırh dahil deri eşyalar
    Çömlekçilik
    Seramik eşyalar
    Gemi Yapımı
    Gemiler ve tekneler
    Taş Duvarcılık
    Taş eşyalar ve yapılar
    Terzilik
    Giyim
    Dokumacılık
    Tekstil, sepetler ve kilimler
    Ahşap İşçiliği
    Ahşap eşyalar ve yapılar
    * Simyasal eşyaları İmal Etmek için Simyasal Zanaat beceri hünerine sahip olmalısınız.
  prerequisites:
  - text: "Zanaat becerisinde eğitimli"

omen://feat/spell-combination?source=paizo-pathfinder-player-core:
  name: Büyü Kombinasyonu
  description: >
    Büyüleri birleştirerek tek bir büyü yapmayla birden fazla etki üretebilirsiniz. 2. ve 1. derece hariç, yapabileceğiniz her büyü derecesinden bir slot büyü kombinasyonu slotuna dönüşür (bu kantripler için geçerli değildir). Büyülerinizi hazırlarken, bir kombinasyon slotunu iki büyünün birleşimiyle doldurabilirsiniz. Kombinasyondaki her büyü, slotun derecesinin 2 veya daha fazla büyü derecesi altında olmalı ve her ikisi de yalnızca tek bir yaratığı veya nesneyi hedeflemeli ya da yalnızca tek bir yaratığı veya nesneyi hedefleme seçeneğine sahip olmalıdır. Kombinasyondaki her büyü aynı zamanda bir etkiye sahip olup olmadığını belirlemek için aynı yola sahip olmalıdır; her iki büyü de menzilli bir büyü saldırısı gerektirmeli, aynı türde kurtarış gerektirmeli veya hedefi otomatik olarak etkilemelidir.
    Kombine bir büyü yaptığınızda, bileşen büyüler normalde birden fazlasını etkilese bile yalnızca tek bir hedefi etkiler. Kombinasyondaki herhangi bir büyünün başka kısıtlamaları varsa (yalnızca yaşayan yaratıkları hedeflemek gibi), tüm kısıtlamalara uymalısınız. Kombine büyü, bileşen büyülerin menzillerinden daha kısa olanını kullanır. Kombine bir büyüyü tek bir büyüymüş gibi çözümleyin, ancak her iki bileşen büyünün de etkilerini uygulayın. Örneğin, büyünün hedefi kombine bir büyüye karşı kurtarışında başarılı olduysa her büyünün başarı etkisini uygular ve kritik başarısız olduysa her iki büyünün kritik başarısızlık etkisini uygular.

omen://feat/spell-devourer?source=paizo-pathfinder-player-core:
  name: Büyü Yutan
  description: Büyüye sadece direnmekle kalmaz, onu yutarsınız. Bir büyüye veya büyüsel etkiye karşı bir kurtarışında ne zaman başarılı olursanız, büyünün derecesinin iki katına eşit veya büyüsel etki bir büyü değilse seviyesine eşit geçici Can Puanı kazanırsınız. Bu geçici Can Puanları bir sonraki sıranızın sonuna kadar sürer.
  prerequisites:
  - text: "Yaygın Batıl İnanç"

omen://feat/spell-mastery?source=paizo-pathfinder-player-core:
  name: Büyü Ustalığı
  description: "Bir avuç büyüde o derece ustalaştınız ki onları önceden hazırlamamış olsanız bile yapabilirsiniz. Büyü kitabınızda bulunan 9. derece veya daha düşük herhangi dört büyü seçin; seçtiğiniz her büyü farklı bir derecede olmalıdır. Bu büyüler günlük hazırlıklarınızı yaptığınızda otomatik olarak hazırlanır ve her büyü için ekstra bir büyü slotu kazanırsınız. 1 haftalık duraklama süresini büyü kitabınızı inceleyerek ve ustalaştığınız büyüleri yeniden eğiterek harcayarak farklı bir büyü kombinasyonu seçebilirsiniz."

omen://feat/spell-protection-array?source=paizo-pathfinder-player-core:
  name: Büyü Koruma Dizilimi
  description: Düşmanların büyüsünü zayıflatan mistik rünlerden oluşan bir çember çizersiniz. 30 fit içinde bir patlama alanında parıldayan bir büyü çemberi yaratırsınız. Çemberdeki yaratıklar büyüye karşı kurtarışlarına +1 statü bonusu kazanır. Çember bir sonraki sıranızın sonuna kadar sürer ve onu azami 1 dakika süreye kadar Sürdürebilirsiniz.

omen://feat/spell-tinker?source=paizo-pathfinder-player-core:
  name: Büyü Ayarlayıcı
  description: >
    Kendinize büyü yaparken yaptığınız seçimleri değiştirmeyi öğrendiniz. Yalnızca kendinize çeşitli etki seçenekleri sunan bir büyü yaptıktan sonra (örneğin enerjiye diren veya çeşitli potansiyel formlar sunan bir polimorf büyüsü gibi), Büyüyü Yaparken yaptığınız seçimi değiştirebilirsiniz (örneğin enerjiye diren için farklı bir hasar türü seçmek gibi).
    Büyünün faydaları zaten tüketilmişse veya geçiş yaptıktan sonra ilk seçimin etkileri herhangi bir şekilde devam edecekse (örneğin seçeneklerden biri zaten kullandığınız tüketilebilir bir eşya yaratmak idiyse veya sizi iyileştirmek idiyse) ya da hüner kantripin sunduğundan daha güçlü bir etki yaratacaksa bu hüneri kullanamazsınız. Büyü Ayarlayıcı'nın neye uygulanabileceği konusunda nihai hakem GM'dir.

omen://feat/spellbook-prodigy?source=paizo-pathfinder-player-core:
  name: Büyü Kitabı Dehası
  description: Büyü kitabınıza eklemek üzere büyü öğrenme konusunda özellikle mahirsinizdir. Önkoşullarını karşılamanıza gerek kalmadan Büyülü Stenografi beceri hünerini kazanırsınız. Ayrıca, Bir Büyü Öğrenmek için yaptığınız testte kritik bir başarısızlık attığınızda bunun yerine başarısızlık elde edersiniz.
  prerequisites:
  - text: "Arkana becerisinde eğitimli"

omen://feat/spellshape-channel?source=paizo-pathfinder-player-core:
  name: Büyü Biçimlendirme Kanalı
  description: Yaşamsal özün doğasına dair ilahi vahiylerin derinlemesine anlaşılması, yaşam ve ölüm enerjisini serbestçe manipüle etmenizi sağlar. Normalde 1 eylem alan ve Zarar Ver veya İyileştir büyüsüne uygulanabilen, gerçekleştirebileceğiniz bir büyü biçimlendirme eylemini kullanın. Bu şekilde kullanırsanız etkileri yalnızca bir zarar ver veya iyileştir büyüsüne uygulanır.

omen://feat/spirit-familiar-witch?source=paizo-pathfinder-player-core:
  name: Ruhsal Ruhdaş Hayvan (Witch)
  description: Tanıdığınız saf ruh haline gelmek için bedenini feda edebilir. Tanıdığınız Ruhu Bırak aktivitesini kazanır.
  prerequisites:
  - text: "ilahi veya okült hami"

omen://feat/split-hex?source=paizo-pathfinder-player-core:
  name: Bölünmüş Nazar Büyüsü
  description: Tek bir hedefi olan saldırgan bir nazar büyüsünü ikinci bir hedefe de yönlendirmek için yaptığınız büyüden bir miktar güç çekersiniz. Bir sonraki kullandığınız eylem tek bir hedefi olan zararlı bir nazar büyüsü yapmak için Büyü Yapmak ise derecesini 2 azaltın (yapabileceğiniz azami büyü derecesinden 2 derece daha düşük yapın). Bunu yaparsanız, o nazar büyüsünün etkilemesi için ikinci bir hedef seçebilirsiniz.

omen://feat/split-slot?source=paizo-pathfinder-player-core:
  name: Bölünmüş Yuva
  description: "Bir slotta iki büyü hazırlayabilir, böylece büyüyü yaparken seçme özgürlüğüne sahip olursunuz. Gün için büyülerinizi hazırlarken, yapabileceğiniz en yüksek derecedeki büyüden en az 1 derece düşük bir büyü slotu seçebilir ve o slotta iki büyü hazırlayabilirsiniz. O slottan bir Büyü Yaptığınızda hangi büyüyü yapacağınızı seçin. Seçiminizi yaptıktan sonra, kullanılmayan büyü sanki hiç hazırlamamışsınız gibi dağılır; örneğin Bağlı Eşyayı Boşalt ile kullanım için uygun olmaz."

omen://feat/spring-from-the-shadows?source=paizo-pathfinder-player-core:
  name: Gölgelerden Fırla
  description: "Gizlendiğiniz yerden sıçrar ve hedefinize saldırırsınız. Hızınıza kadar Depar atarsınız, ancak hareketinizi kendisinden Gizli veya Fark Edilmemiş olduğunuz bir düşmanın yanında sonlandırmalısınız. Ardından o düşmana Vuruş Yaparsınız; Vuruş Yapana kadar o yaratıktan gizli veya fark edilmemiş olarak kalırsınız. İlgili hareket türüne sahipseniz Depar atmak yerine Toprağı Kazarken, Tırmanırken, Uçarken veya Yüzerken Gölgelerden Fırla kullanabilirsiniz."

omen://feat/stay-down?source=paizo-pathfinder-player-core:
  name: "Yat Aşağı!"
  description: "Düşmanlarınızı yerde tutmanın yollarına sahipsinizdir. Tetikleyen düşmanın Dayanıklılık ZD'sine karşı bir athletics|defense:fortitude testi deneyin. Başarı durumunda eylem kesintiye uğrar ve yaratığın yüzüstü kalmasına neden olur. Kritik başarı durumunda yaratık bir sonraki sırasına kadar Ayağa da Kalkamaz."
  prerequisites:
  - text: "Atletizm becerisinde usta"

omen://feat/steady-balance?source=paizo-pathfinder-player-core:
  name: Sağlam Denge
  description: Olumsuz koşullarda bile dengenizi kolayca koruyabilirsiniz. Denge Kur eylemini kullanarak her başarı attığınızda bunun yerine kritik başarı elde edersiniz. Dar yüzeylerde ve engebeli zeminde Denge Kurmaya çalışırken Gafil kalmazsınız.
  prerequisites:
  - text: "Akrobasi becerisinde eğitimli"

omen://feat/steady-spellcasting?source=paizo-pathfinder-player-core:
  name: İstikrarlı Büyücülük
  description: Tekniğinize güvenerek büyülerinizi kolayca kaybetmezsiniz. Bir reaksiyon büyü yapma eyleminizi bozacak olursa bir düz test deneyin. Başarılı olursanız eyleminiz bozulmaz.

omen://feat/stealthy-companion?source=paizo-pathfinder-player-core:
  name: Sinsi Yoldaş
  description: Yoldaş Hayvanınızı çevresine uyum sağlayacak şekilde eğittiniz. Yoldaş Hayvanınız Kamuflaj hünerinin faydasını kazanır. Yoldaşınız uzmanlaşmış bir pusucu ise Gizlilik yetkinlik derecesi ustaya (zaten usta ise efsaneviye) yükselir.
  prerequisites:
  - text: "Yoldaş Hayvan"
  - text: "Kamuflaj"

omen://feat/step-lively?source=paizo-pathfinder-player-core:
  name: Kıvrak Adım
  description: Daha büyük yaratıkların ağır adımlarından kaçınma konusunda uzmansınız. Düşmana bitişik başka bir alana Adım atarsınız.

omen://feat/stitched-familiar?source=paizo-pathfinder-player-core:
  name: Dikişli Ruhdaş Hayvan
  description: Tanıdığınız maddi formundan sıyrılarak canlanmış bir büyü kütlesine dönüşebilir. Tanıdığınız Dikiş Darbesi aktivitesini kazanır.
  prerequisites:
  - text: "mistik veya doğa hamisi"

omen://feat/stone-bones?source=paizo-pathfinder-player-core:
  name: Taş Kemikler
  description: Ele avuca sığmaz doğanız en ağır yaraları bile savuşturmanıza yardımcı olabilir. Bir düz test deneyin. Başarılı olursanız saldırı normal bir isabete dönüşür.

omen://feat/stonegate?source=paizo-pathfinder-player-core:
  name: Taşkapı
  description: Topraktan engeller artık ilerlemenizi engelleyemez. Günde bir kez yapabileceğiniz 7. derece ilahi özgü büyü olarak Büyülü Geçit kazanırsınız. Ancak büyünün aksine bu yetenek yalnızca toprak veya taştan engeller arasından geçitler açmak için kullanılabilir.
  prerequisites:
  - text: "Taşyürüyen"

omen://feat/stonemasons-eye?source=paizo-pathfinder-player-core:
  name: Taş Ustası Gözü
  description: >
    Olağandışı taş işçiliğini fark etmek için yapılan Dikkat testlerine de +2 durumsal bonusu kazanırsınız. Bu bonus taştan yapılmış veya taşın içine Gizlenmiş mekanik tuzakları keşfetmeye yönelik testler için geçerlidir.
    Tarama eylemini kullanmıyor veya araştırma yapmıyorsanız, GM olağandışı taş işçiliğini yine de fark etmeniz için otomatik olarak gizli bir test atar. Bu test normal durumsal bonusunuzu kazanmaz.

omen://feat/stonewalker?source=paizo-pathfinder-player-core:
  name: Taşyürüyen
  description: >
    Taşa karşı derin bir hürmet ve bağınız vardır. Günde bir kez 3. derece ilahi özgü büyü olarak Taşla Bir yapabilirsiniz.
    Taş Ustası Gözü hünerine sahipseniz, Dikkat becerisinde efsanevi yetkinlik gerektiren olağandışı taş işçiliğini ve taş işçiliği tuzaklarını bulmayı deneyebilirsiniz. Hem Taş Ustası Gözü'ne hem de Dikkat becerisinde efsanevi yetkinliğe sahipseniz, GM olağandışı taş işçiliğini fark etmeniz için gizli bir test attığında Taş Ustası Gözü'nden gelen bonusunuzu korursunuz.

omen://feat/stonewall?source=paizo-pathfinder-player-core:
  name: Taş Duvar
  description: Taşın kuvveti sizi öyle güçlü bir şekilde alt eder ki sağlam bedeninizin yerini alır. Mevcut sıranın sonuna kadar Taşlaşmış hale gelirsiniz. Tetikleyen etkiden veya taşı etkileyemeyecek başka herhangi bir kötü etkiden hiçbir hasar almazsınız.

omen://feat/storm-born?source=paizo-pathfinder-player-core:
  name: Fırtınadoğan
  description: Doğanın serbest kalan gücünden zevk alarak elementlerin ortasında kendinizi evinizde hissedersiniz. Hava koşullarından kaynaklanan menzilli büyü saldırılarına veya Dikkat testlerine durumsal cezası almazsınız ve hedeflenen büyülerin hava koşulları (sis gibi) nedeniyle Gizlenmiş bir hedefe karşı başarılı olması için düz test gerekmez.
  prerequisites:
  - text: "Fırtına Düzeni"

omen://feat/storm-retribution?source=paizo-pathfinder-player-core:
  name: Fırtına Kısası
  description: "Size zarar veren bir yaratığa doğru fırtınalı bir öfke patlaması yönelterek misilleme yaparsınız. Tetikleyen rakibe Fırtına Kabarması yapar ve o yaratığı itersiniz; Refleks kurtarışında başarısız olursa sizden 5 fit uzağa, kritik başarısız olursa 10 fit uzağa hareket ettirirsiniz. Bu hareket zorunlu harekettir."
  prerequisites:
  - text: "Fırtına Düzeni"
  - text: "Fırtına Kabarması düzen büyüsü"

omen://feat/streetwise?source=paizo-pathfinder-player-core:
  name: Sokak Görmüş
  description: Sokaklardaki yaşamı bilir ve yerel yerleşiminizin nabzını tutarsınız. Bilgi Toplamak için Diplomasi modifiyeriniz yerine Sosyoloji modifiyerinizi kullanabilirsiniz. Düzenli olarak uğradığınız herhangi bir yerleşimde, Bilgi Toplamak için Diplomasi ile keşfedebileceğiniz türden bilgileri öğrenmek üzere Sosyoloji ile Bilgi Hatırla eylemini kullanabilirsiniz. ZD genellikle önemli ölçüde daha yüksektir, ancak bilgiyi toplamak için zaman harcamadan öğrenirsiniz. Bilgiyi hatırlamada başarısız olursanız daha sonra normal şekilde Bilgi Toplamayı deneyebilirsiniz.
  prerequisites:
  - text: "Sosyoloji becerisinde eğitimli"

omen://feat/strong-arm?source=paizo-pathfinder-player-core:
  name: Güçlü Kol
  description: Fırlatılan bir silahla Vuruş Yaptığınızda, silahın menzil kademesi 10 fit artar.

omen://feat/stubborn-persistence?source=paizo-pathfinder-player-core:
  name: İnatçı Sebat
  description: İnsanlar başkalarını yere sermeye hazır bırakacak en çetin imtihanlarda bile sebat etme yetenekleriyle ünlüdür. Yorgun düşeceğiniz zaman bir düz test deneyin. Başarı durumunda yorgun düşmezsiniz. Yorgun durumunun dinlenme eksikliği gibi ele almadığınız altta yatan bir nedeni varsa, düz testte başarısız olana veya altta yatan nedeni ele alana kadar GM tarafından belirlenen bir aralıkta testi tekrar denemelisiniz.

omen://feat/student-of-the-canon?source=paizo-pathfinder-player-core:
  name: Külliyat Talebesi
  description: Pek çok inancı, haklarında doğru olma ihtimali düşük olan fikirleri fark edecek kadar araştırdınız. Dini nitelikteki Yazıyı Çözmek veya inançların ilkeleri hakkında Bilgi Hatırlamak için yapılan bir Din testinde kritik bir başarısızlık atarsanız bunun yerine bir başarısızlık elde edersiniz. Kendi inancınızın ilkeleri hakkında Bilgi Hatırlamaya çalışırken başarısızlık atarsanız bunun yerine başarı elde edersiniz ve başarı atarsanız bunun yerine kritik başarı elde edersiniz.
  prerequisites:
  - text: "Din becerisinde eğitimli"

omen://feat/studious-capacity?source=paizo-pathfinder-player-core:
  name: İlim Kapasitesi
  description: Okült büyü üzerine devam eden çalışmalarınız büyü kapasitenizi artırarak imkansız göründüğünde bile büyü yapmanıza olanak tanır. Uygun büyü derecesindeki büyü slotlarınız tükendikten sonra bile her gün bir büyü yapabilirsiniz, ancak bu yeteneği en yüksek büyü derecenizdeki bir büyüyü yapmak için kullanamazsınız.
  prerequisites:
  - text: "Muamma ilham perisi"
  - text: "Okültizm becerisinde efsanevi"

omen://feat/subtle-theft?source=paizo-pathfinder-player-core:
  name: Gizlice Hırsızlık
  description: Başarıyla bir şey Çaldığınızda gözlemciler (çaldığınız yaratık dışındaki yaratıklar), hırsızlığınızı tespit etmek için Dikkat ZD'lerine –2 durumsal cezası alırlar. Ek olarak, önce Aldatma kullanarak Dikkat Dağıtırsanız, tek bir Eşyayı Avuçla veya Çal eylemi yapmak Fark Edilmemiş durumunuzu sona erdirmez.
  prerequisites:
  - text: "Hırsızlık becerisinde eğitimli"

omen://feat/sudden-charge?source=paizo-pathfinder-player-core:
  name: Deparlı Saldırı
  description: >
    Hızlı bir deparla düşmanınıza doğru atılır ve darbenizi indirirsiniz. İki kez Depar atarsınız. Eğer hareketinizi en az bir düşmanın yakın dövüş menzilinde tamamlarsanız, o düşmana karşı yakın dövüş Vuruşu yapabilirsiniz. Karşılık gelen hareket türüne sahipseniz Depar yerine Kazma, Tırmanma, Uçma veya Yüzme hızınızı da kullanabilirsiniz.


omen://feat/sudden-leap?source=paizo-pathfinder-player-core:
  name: Ani Sıçrayış
  description: >
    Barbar: Sıçrayışınızın ortasındayken bir düşmana savurursunuz.
    Savaşçı: Etkileyici bir sıçrama yapar ve süzülürken savurursunuz.
    Bir Sıçra, Yüksek Atlama veya Uzun Atlama yapın ve sıçrayışınız sırasında herhangi bir noktada bir yakın dövüş Vuruşu deneyin. Vuruşun hemen ardından havadaysanız, sıçrayışınızın azami mesafesine ulaşmamış olsanız bile yere düşersiniz. Düştüğünüz mesafe sıçrayışınızın yüksekliğinden fazla değilse hasar almazsınız ve dik olarak yere inersiniz.
    Ani Sıçrayış sırasında Yüksek Atlama veya Uzun Atlama denerken, atlama mesafesini Uzun Atlama kurallarını kullanarak belirleyin ve azami mesafenizi Hızınızın iki katı olarak değiştirin.

omen://feat/summon-nephilim-kin?source=paizo-pathfinder-player-core:
  name: Nephilim Soydaşı Çağır
  description: "Dış Düzlemlerle ilahi bir müttefik çağırmanıza olanak tanıyan bir bağınız vardır. Summon Celestial, Summon Fiend veya soyunuza uygun düzlem dışı bir yaratığı çağırabilen başka bir 5. derece büyü seçin. Günde bir kez seçilen büyüyü 5. derece ilahi özgü büyü olarak yapabilirsiniz; ancak çağrılan yaratık meleksoylu iseniz melek özelliğine sahip bir yaratık gibi kendi soyunuzla aynı kategoriden olmalıdır."
  prerequisites:
  - text: "herhangi bir nephilim kalıtsal hüneri"

omen://feat/superior-bond?source=paizo-pathfinder-player-core:
  name: Üstün Bağ
  description: Bağlı eşyanızdan yararlandığınızda, daha sonra kullanmak üzere içinde bir miktar enerji bırakabilirsiniz. Bağlı Eşyayı Boşalt'ı günde bir kez daha kullanabilirsiniz, ancak bunu yalnızca en yüksek kademedeki Wizard büyü slotunuzdan 2 veya daha fazla kademe düşük bir büyü yapmak için yapabilirsiniz.
  prerequisites:
  - text: "Mistik Bağ"

omen://feat/supernatural-charm?source=paizo-pathfinder-player-core:
  name: Doğaüstü Cazibe
  description: Kanınızdaki elf büyüsü, daha çekici veya cezbedici hale gelmek için kullanabileceğiniz bir güç olarak tezahür eder. Günde bir kez 1. derece Büyüle'yi mistik özgü büyü olarak yapabilirsiniz.

omen://feat/sure-feet?source=paizo-pathfinder-player-core:
  name: Sağlam Ayaklar
  description: İster dengenizi korurken ister tırmanırken ayaklarınız kolayca basacak yer bulur. Denge Kurmak için yapılan bir Akrobasi testinde veya Tırmanmak için yapılan bir Atletizm testinde bir başarı atarsanız, bunun yerine kritik başarı elde edersiniz. Denge Kurmaya veya Tırmanmaya çalışırken Gafil kalmazsınız.

omen://feat/surging-focus?source=paizo-pathfinder-player-core:
  name: Coşan Odak
  description: Görebildiğiniz bir müttefik savaşta düştüğünde, haklı öfkenizin kabarması el değmemiş ilahi güç rezervlerinden yararlanmanızı sağlar. Anında 1 Odak Puanı geri kazanırsınız.

omen://feat/survey-wildlife?source=paizo-pathfinder-player-core:
  name: Yaban Hayatını İncele
  description: Yakındaki yaratıkların varlığını belirlemek için vahşi doğadaki ayrıntıları inceleyebilirsiniz. Yuvalara, dışkılara ve bitki örtüsündeki izlere dayanarak yakında hangi yaratıkların olduğunu bulmak için etrafınızdaki alanı inceleyerek 10 dakika harcayabilirsiniz. İzlerin ne kadar belirgin olduğuna bağlı olarak GM tarafından belirlenen bir ZD'ye karşı bir Hayatta Kalma testi deneyin. Başarı durumunda, yalnızca bu işaretlerden yaratıklar hakkında daha fazla şey öğrenmek için –2 ceza ile bir Bilgi Hatırla testi deneyebilirsiniz. Hayatta Kalma konusunda ustaysanız bu cezayı almazsınız.
  prerequisites:
  - text: "Hayatta Kalma becerisinde eğitimli"

omen://feat/swift-banishment?source=paizo-pathfinder-player-core:
  name: Hızlı Sürgün
  description: Darbenizin gücü kurbanınızı kendi ana düzlemine geri gönderir. Hazırladığınız bir sürgün büyüsünü harcayarak, büyüyü yapmanıza gerek kalmadan kritik vuruş yaptığınız yaratığı etkilersiniz. Yaratık büyüye karşı normal şekilde direnmeyi deneyebilir.

omen://feat/swift-elusion?source=paizo-pathfinder-player-core:
  name: Hızlı Sıyrılma
  description: "Düşmanın Refleks ZD'sine karşı bir acrobatics|defense:reflex testi deneyin. Başarılı olursanız, ya düşmana bitişik farklı bir alana Depar atın ya da düşmanı size bitişik farklı bir alana hareket ettirin."
  prerequisites:
  - text: "Akrobasi becerisinde efsanevi"

omen://feat/swift-sneak?source=paizo-pathfinder-player-core:
  name: Hızlı Sinsi
  description: Gizlice İlerlediğinizde tam Hızınızla hareket edebilirsiniz. İlgili hareket türüne sahipseniz Depar atmak yerine Toprağı Kazarken, Tırmanırken, Uçarken veya Yüzerken Hızlı Sinsi kullanabilirsiniz.
  prerequisites:
  - text: "Gizlilik becerisinde usta"

omen://feat/swift-tracker?source=paizo-pathfinder-player-core:
  name: Hızlı İz Sürücü
  description: >
    Keskin gözleriniz hareket ederken bile geçiş izlerini yakalar. İz Sürerken tam Hızınızla hareket edebilirsiniz. Hayatta Kalma konusunda usta yetkinliğiniz varsa İz Sürerken her saat yeni bir Hayatta Kalma testi denemeniz gerekmez. Hayatta Kalma konusunda efsanevi yetkinliğiniz varsa İz Sürerken başka bir keşif aktivitesi kullanabilirsiniz.
    Avlanan avınızın izini sürerken inisiyatif için Hayatta Kalma atarsanız, karşılaşmanın ilk sırasına başladığınızda serbest bir eylem olarak avlanan avınıza doğru Depar atabilirsiniz.
  prerequisites:
  - text: "Hayatta Kalma becerisinde uzman"
  - text: "Deneyimli İz Sürücü"

omen://feat/swipe-souvenir?source=paizo-pathfinder-player-core:
  name: Hatıra Aşır
  description: Bir düşmanın pençesinden kurtulduğunuzda, onlara ait bir şeyi de yanınıza alırsınız. Bir yaratık tarafından kavranmış veya bağlanmış durumdan Kaçmayı denersiniz. Başarılı olursanız yaratık savaşta olsa bile o yaratıktan Çalmayı da deneyebilirsiniz.

omen://feat/swipe?source=paizo-pathfinder-player-core:
  name: Geniş Savuruş
  description: >
    Geniş, kavisli bir savuruş yaparsınız. Tek bir yakın dövüş Vuruşu yapın ve saldırı zarı sonucunu her biri yakın dövüş erişiminizde ve birbirine bitişik olması gereken en fazla iki düşmanın SD'si ile karşılaştırın. Hasarı yalnızca bir kez atın ve vurduğunuz her yaratığa uygulayın. Bir Geniş Savuruş çoklu saldırı cezanız için iki saldırı sayılır.
    Geniş savuruş özelliğine sahip bir silah kullanıyorsanız bu modifiyer tüm Geniş Savuruş saldırılarınıza uygulanır.

omen://feat/sympathetic-strike?source=paizo-pathfinder-player-core:
  name: Sempati Vuruşu
  description: >
    Haminizin büyüsünü Witch teçhizatlarınızdan birinde toplayarak onların rünler, ışık veya haminizin bir başka simgesiyle parlamasını sağlarsınız.
    Witch teçhizatlarınızdan biriyle silahsız bir Vuruş Yapın. İsabet ederseniz hedefle sempatik bir bağ kurarak haminizin onları etkilemesini kolaylaştırırsınız. Bir sonraki sıranızın başlangıcına kadar hedef, nazar büyülerinize karşı kurtarışlarına –1 durumsal cezası veya tetikleyen Vuruş kritik bir vuruşsa –2 ceza alır.
  prerequisites:
  - text: "Witch Teçhizatı"

omen://feat/symphony-of-the-muse?source=paizo-pathfinder-player-core:
  name: İlham Perisi Senfonisi
  description: "Sayısız performansı çok çeşitli etkilere sahip bir solo senfonide bir araya getirmeyi öğrendiniz. Artık her sıra tek bir beste ile veya bir seferde tek bir beste ile sınırlı değilsiniz; yeni bir beste kullandığınızda önceki tüm bestelerin etkileri kalan süreleri boyunca devam eder."
  prerequisites:
  - text: "Ahenkleştir"

omen://feat/symphony-of-the-unfettered-heart?source=paizo-pathfinder-player-core:
  name: Prangasız Yürek Senfonisi
  description: Bir müttefiki aciz bırakan durumlara karşı korumanızı sağlayan Prangasız Yürek Senfonisi beste büyüsünü öğrenirsiniz.

omen://feat/tactical-debilitations?source=paizo-pathfinder-player-core:
  name: Taktiksel Güçten Düşürmeler
  description: "Düşmanlarınıza karşı taktiksel avantajlar sağlayan yeni güçten düşürmeler öğrenirsiniz. Güçten Düşürücü Vuruş kullandığınızda seçebileceğiniz listeye aşağıdaki güçten düşürmeleri ekleyin. • Güçten Düşürme: Hedef reaksiyonları kullanamaz. • Güçten Düşürme: Hedef kuşatamaz veya müttefiklerinin kuşatmasına katkıda bulunamaz."
  prerequisites:
  - text: "Düzenbaz tezgâhı"
  - text: "Güçten Düşürücü Vuruş"

omen://feat/tactical-entry?source=paizo-pathfinder-player-core:
  name: Taktiksel Giriş
  description: Depar atarsınız. Bu hareket hiçbir reaksiyon tetiklemez.
  prerequisites:
  - text: "Gizlilik becerisinde usta"

omen://feat/tactical-reflexes?source=paizo-pathfinder-player-core:
  name: Taktiksel Refleksler
  description: Size açık veren düşmanları cezalandırmada özellikle hızlısınızdır. Eylemlerinizi geri kazandığınız her sıranızın başında, yalnızca Reaktif Vuruş Yapmak için kullanılabilecek ek bir reaksiyon kazanırsınız.

omen://feat/telluric-power?source=paizo-pathfinder-player-core:
  name: Tellürik Güç
  description: Düşmanlarınızı hırpalamak için ayaklarınızın altındaki topraktan güç çekersiniz. Sizinle aynı toprak veya taş yüzey üzerinde duran bir hedefe karşı yakın dövüş Vuruşu yaparken, silah hasar zarı sayısına eşit miktarda hasar zarına durumsal bonusu kazanırsınız.

omen://feat/terrain-expertise?source=paizo-pathfinder-player-core:
  name: Arazi Uzmanlığı
  description: "Belli bir arazi türünde yol alma deneyiminiz, bunu yaparken size sonsuz bir güven verir. Bu hüneri seçtiğinizde belirlenen şu arazi türlerinden birinde yapılan Hayatta Kalma testlerine +1 durumsal bonusu kazanırsınız: sucul, arktik, çöl, orman, dağ, ova, gökyüzü, bataklık veya yeraltı."
  prerequisites:
  - text: "Hayatta Kalma becerisinde eğitimli"

omen://feat/terrain-master?source=paizo-pathfinder-player-core:
  name: Arazi Ustası
  description: Herhangi bir doğal arazide çevrenize uyum sağlayabilirsiniz. Mevcut arazinizi gözde araziniz yapmak ve mevcut gözde arazinizin yerini geçici olarak almak için o arazide pratik yaparak 1 saat harcayabilirsiniz. Yeni gözde arazinin dışında tam bir gün geçirirseniz gözde araziniz Gözde Arazi hünerini aldığınızdaki orijinal seçiminize geri döner.
  prerequisites:
  - text: "Hayatta Kalma becerisinde usta"
  - text: "Gözde Arazi"

omen://feat/terrain-stalker?source=paizo-pathfinder-player-core:
  name: Arazi Pusucusu
  description: >
    Şu listeden bir tür zorlu arazi seçin: moloz, kar veya çalılık. Bu tür arazide tüm müttefik olmayanlardan Konumu Saptanmamış durumdayken, 5 fitten fazla hareket etmediğiniz ve hareketiniz sırasında bir düşmanın 10 fit yakınına girmediğiniz sürece bir Gizlilik testi denemeksizin Gizlice İlerleyebilirsiniz.
    Keşif sırasında bu durum aynı zamanda diğer yaratıklar aktif olarak Arama yapmadığı veya tetikte olmadığı sürece Fark Edilmekten Kaçınırken 15 fit yakınına otomatik olarak yaklaşmanızı sağlar.
  prerequisites:
  - text: "Gizlilik becerisinde eğitimli"

omen://feat/terrified-retreat?source=paizo-pathfinder-player-core:
  name: Dehşet İçinde Geri Çekilme
  description: Gözdağı Ver eyleminde kritik başarı elde ettiğinizde, hedefin seviyesi sizinkinden düşükse hedef 1 tur boyunca Kaçan durumuna düşer.
  prerequisites:
  - text: "Gözdağı becerisinde usta"

omen://feat/the-harder-they-fall?source=paizo-pathfinder-player-core:
  name: Düşüşü Sert Olur
  description: Düşmanlarınıza çelme taktığınızda acı verici bir şekilde düşmelerini sağlarsınız. Gafil bir düşmana başarıyla Çelme Taktığınızda hedefiniz 1d6 ezici hasar alır. Kritik bir başarıda hedef 1d6 ezici hasara ek olarak sinsi saldırı hasarınızı alır.

omen://feat/thorned-seedpod?source=paizo-pathfinder-player-core:
  name: Dikenli Tohum Kozası
  description: Tohum kozalarınız devirici bir darbe indirdiğinde feci dikenli sarmaşıklara dönüşerek patlar. Bir tohum kozası Vuruşunda kritik başarı elde ettiğinizde, sarmaşıklar bükülüp düşmanınızı deşerek 1d4 süren delici hasar verir.
  prerequisites:
  - text: "Tohum Kozası"

omen://feat/thunderclap-spell?source=paizo-pathfinder-player-core:
  name: Gök Gürültüsü Büyüsü
  description: Şimşeğiniz havayı yararak gürleyen bir şok dalgası oluşturur. Bir sonraki eyleminiz elektrik özelliğine sahip olan veya elektrik hasarı veren, süresi bulunmayan ve yaratıkların bir kurtarış yapmasını gerektiren bir Büyü Yapmaksa, büyünün şimşeğinin gücü diğer etkilerine ek olarak bir gök gürültüsü patlaması yaratır. Büyüye karşı Refleks kurtarışında başarısız olan her yaratık 1 tur boyunca Sağır olur ve kritik başarısız olanlar da Yüzüstü devrilir.
  prerequisites:
  - text: "Fırtına Düzeni"

omen://feat/timeless-nature?source=paizo-pathfinder-player-core:
  name: Zamansız Doğa
  description: Sizi besleyen kadim büyü sayesinde yaşlanmanız durur. Taşan kadim enerji size hastalıklara ve kadim büyüye karşı kurtarışlarında +2 statü bonusu verir.

omen://feat/titan-slinger?source=paizo-pathfinder-player-core:
  name: Titan Sapancısı
  description: Sapanınızı devasa yaratıkları devirmek için nasıl kullanacağınızı öğrendiniz. Büyük veya daha büyük bir yaratığa karşı sapan grubundan bir silahla yapılan bir saldırıda isabet ettiğinizde, silah hasar zarının boyutunu bir derece artırın.

omen://feat/titan-wrestler?source=paizo-pathfinder-player-core:
  name: Titan Güreşçisi
  description: Sizden iki boyuta kadar daha büyük yaratıkları veya Atletizm konusunda efsaneviyseniz sizden üç boyuta kadar daha büyük yaratıkları Silahsızlandırmayı, Kavramayı, Yerinden Oynatmayı, İtmeyi veya Çelme Takmayı deneyebilirsiniz.
  prerequisites:
  - text: "Atletizm becerisinde eğitimli"

omen://feat/to-the-ends-of-the-earth?source=paizo-pathfinder-player-core:
  name: Dünyanın Öbür Ucuna Kadar
  description: Avınızı izleme yeteneğiniz açıklamaların ötesine geçmiş olup avınızın hareketlerini takip etmenize ve konumunu kolaylıkla tahmin etmenize olanak tanır. 100 fit içindeki bir yaratık üzerinde Avı Avla kullandığınızda o yaratığın hareketlerini takip edebilir ve avınız olarak kaldığı sürece ne kadar uzaklaşırsa uzaklaşsın tam konumunu bilebilirsiniz. Avınızın konumunu ışınlanma veya düzlemsel yolculuk boyunca takip etmek için Doğa konusunda efsanevi olmalısınız. Doğa konusunda efsaneviyseniz bu hüner tespit ve kadim özelliklerini kazanır.
  prerequisites:
  - text: "Hayatta Kalma becerisinde efsanevi"

omen://feat/toppling-dance?source=paizo-pathfinder-player-core:
  name: Deviren Dans
  description: Ayaklar Altında Dans'ı kullanarak bir yaratığın alanını paylaşırken yakın dövüş silahlarınız ve silahsız saldırılarınız çelme özelliğini kazanır, ancak yalnızca alanını paylaştığınız yaratığa karşı. Müttefikiniz olmasa bile Büyük veya daha büyük Yüzüstü bir yaratıkla aynı alanda bulunabilirsiniz.
  prerequisites:
  - text: "Ayaklar Altında Dans"

omen://feat/toughness?source=paizo-pathfinder-player-core:
  name: Metanet
  description: Vücudunuz boyun eğmeden önce çoğundan daha fazla darbeye dayanabilir. Azami Can Puanınızı seviyeniz kadar artırın. İyileşme testlerinin ZD'sini 1 azaltırsınız.

omen://feat/train-animal?source=paizo-pathfinder-player-core:
  name: Hayvan Eğit
  description: Bir hayvana belirli bir eylemi yapmayı öğretmek için zaman harcarsınız. Ya hayvanın zaten nasıl yapılacağını bildiği temel bir eylemi seçebilir (tipik olarak Hayvana Emret eyleminde listelenenler) ya da hayvana yeni bir temel eylem öğretmeyi deneyebilirsiniz. Gerekli herhangi bir testin ZD'sini ve eğitimin alacağı süreyi (genellikle en az bir hafta) GM belirler. Bir hayvana eleştirel düşünmeyi kullanan bir numara öğretmek genellikle imkansızdır. Doğa konusunda uzman, usta veya efsaneviyseniz, GM'in takdirine bağlı olarak daha sıra dışı yaratıkları eğitebilirsiniz.
  prerequisites:
  - text: "Doğa becerisinde eğitimli"

omen://feat/trap-finder?source=paizo-pathfinder-player-core:
  name: Tuzak Bulucu
  description: Tuzakların tehlikeleri ve varlığı konusunda sizi uyaran sezgisel bir duyunuz vardır. Tuzakları bulmak için yapılan Dikkat testlerine, tuzakların yaptığı saldırılara karşı SD'ye ve tuzaklara karşı kurtarışlarına +1 durumsal bonusu kazanırsınız. Arama yapmıyor olsanız bile, normalde Arama yapmanızı gerektiren tuzakları bulmak için bir test hakkı elde edersiniz. Tuzağı bulmak için gereken diğer gereksinimleri yine de karşılamanız gerekir. Hırsızlık konusunda usta yetkinlik derecesi gerektiren tuzakları etkisiz hale getirebilirsiniz. Hırsızlık konusunda usta yetkinliğiniz varsa bunun yerine efsanevi yetkinlik derecesi gerektiren tuzakları etkisiz hale getirebilirsiniz ve tuzaklara karşı durumsal bonuslarınız +2'ye yükselir.

omen://feat/tree-climber-elf?source=paizo-pathfinder-player-core:
  name: Ağaç Tırmanıcısı (Elf)
  description: Hayatınızın büyük kısmını ağaç tepelerinde geçirdiniz ve onlara hızlı ve güvenli bir şekilde tırmanma konusunda uzmanlaştınız. 10 fit Tırmanma Hızı kazanırsınız.

omen://feat/trick-magic-item?source=paizo-pathfinder-player-core:
  name: Büyülü Eşyayı Kandır
  description: >
    Normalde kullanamayacağınız büyülü bir eşyayı kandırıp geçici olarak etkinleştirmek amacıyla incelersiniz. Örneğin bu, bir savaşçının bir asadan büyü yapmasına veya bir Wizard'ın bir parşömen kullanarak mistik listede olmayan bir büyüyü yapmasına izin verebilir. Eşyayı etkinleştirmenin ne yaptığını bilmelisiniz, aksi takdirde onu kandırmayı deneyemezsiniz.
    Eşyadan bir büyü yapmaya çalışıyorsanız, eşyanın büyü geleneğiyle eşleşen veya büyüyü listesinde bulunduran bir gelenekle eşleşen beceriyi kullanarak bir test deneyin. İlgili beceriler mistik için arkana, doğa için doğa, okült için okültizm, ilahi için din veya gelenek özelliği taşımayıp büyülü özelliğe sahip bir eşya için bu dördünden herhangi biridir. GM, eşyanın seviyesine göre ZD'yi belirler (eşyaya veya duruma bağlı olarak muhtemelen ayarlanır).
    Bir büyü saldırı modifiyeri veya büyü ZD'si gerektiren büyülü bir eşyayı etkinleştirirseniz ve ilgili istatistikte yetkinliğiniz yoksa yetkinlik bonusunuz olarak seviyenizi ve Zekâ, Bilgelik veya Karizma modifiyerlerinizden en yükseğini kullanın. Eşyanın geleneğine uygun beceride ustaysanız bunun yerine eğitimli yetkinlik bonusunu; efsaneviyseniz bunun yerine uzman yetkinlik bonusunu kullanırsınız.
  prerequisites:
  - text: "Arkana, Doğa, Okültizm veya Din becerisinde eğitimli"

omen://feat/triple-shot?source=paizo-pathfinder-player-core:
  name: Üçlü Atış
  description: Daha büyük bir kontrolle birden fazla atışı hızla yapabilirsiniz. Çifte Atış kullandığınızda, saldırıları aynı hedefe karşı yapabilirsiniz. İki yerine üç menzilli Vuruş Yapmak için Çifte Atış'a ek bir eylem ekleyebilirsiniz. Bunu yaparsanız ceza –4 olur. Tüm saldırılar çoklu saldırı cezanıza dahil edilir, ancak ceza hepsini yapana kadar artmaz.
  prerequisites:
  - text: "Çifte Atış"

omen://feat/triple-threat?source=paizo-pathfinder-player-core:
  name: Üçlü Tehdit
  description: Avlanırken dikkatinizi üç yöne bölebilirsiniz. Avı Avla kullandığınızda üç yaratığı av olarak belirleyebilir, iki yaratığı av olarak belirleyip etkiyi bir müttefikle paylaşabilir (Ortak Av gibi) veya bir yaratığı av olarak belirleyip etkiyi iki müttefikle paylaşabilirsiniz.
  prerequisites:
  - text: "Ortak Av"

omen://feat/triple-time?source=paizo-pathfinder-player-core:
  name: Üç Zamanlı Ritim
  description: Sizi ve müttefiklerinizi bir tur boyunca hızlandıran Üç Zamanlı Ritim beste kantripini öğrenirsiniz.

omen://feat/triumphant-inspiration?source=paizo-pathfinder-player-core:
  name: Zafer İlhamı
  description: Zafer dolu bir haykırışla müttefiklerinize ilham verirsiniz. Normalde yapılması tek bir eylem alan bildiğiniz bir beste kantripini yaparsınız.
  prerequisites:
  - text: "Cenkçi ilham perisi"

omen://feat/true-hypercognition?source=paizo-pathfinder-player-core:
  name: Gerçek Hiperbiliş
  description: Zihniniz inanılmaz bir hızla çalışır. Anında en fazla beş Bilgi Hatırla eylemi kullanırsınız. Normalde Bilgi Hatırladığınızda tetiklenecek herhangi bir özel yeteneğiniz veya serbest eyleminiz varsa, bunları bu eylemler için kullanamazsınız.
  prerequisites:
  - text: "Muamma ilham perisi"

omen://feat/true-shapeshifter?source=paizo-pathfinder-player-core:
  name: Gerçek Şekil Değiştiren
  description: Formun sınırlarını aşarsınız. Günde bir kez, hazırlamamış olsanız bile bir kayjuya dönüşmek üzere Tabiat Mücessemi yapabilirsiniz. Bitki Formu'na sahipseniz bunun yerine yeşil adama dönüşmeyi seçebilirsiniz. Ayrıca Gerçek Şekil Değiştirme aktivitesini kazanırsınız.
  prerequisites:
  - text: "Ejderha Formu"
  - text: "Ehlileşmemiş Form"

omen://feat/tumble-behind-rogue?source=paizo-pathfinder-player-core:
  name: Arkaya Sıyrılıp Geç (Düzenbaz)
  description: Düşmanınızın altından ve arkasından takla atarak hızlı hareketinizle onları gafil avlarsınız. Sıyrılıp Geç eylemini başarıyla gerçekleştirdiğinizde, alanından geçtiğiniz düşman sıranızın bitiminden önce yapacağınız bir sonraki saldırıya karşı Gafil kalır.

omen://feat/tusks-orc?source=paizo-pathfinder-player-core:
  name: Azı Dişleri (Ork)
  description: Eti kemikten ayırmak için mükemmel olan özellikle uzun ve sivri azı dişleriniz vardır. 1d6 delici hasar veren bir azı dişleri silahsız saldırısı kazanırsınız. Azı dişleriniz boğuşma grubundadır ve incelikli ile silahsız özelliklerine sahiptir.

omen://feat/twin-distraction?source=paizo-pathfinder-player-core:
  name: İkiz Dikkat Dağıtma
  description: "İki silahla hareketleriniz öylesine hızlı ve şaşırtıcıdır ki rakibinizin aklını karıştırır. İkiz Yanıltma kullanırken her iki Vuruşunuz da hedeflenen bir yaratığa hasar verirse, hedef sınıf ZD'nize karşı bir will|against:rogue kurtarışta başarılı olmak zorundadır; aksi takdirde bir sonraki sıranızın sonuna kadar Zihni Bulanmış 1 olur."
  prerequisites:
  - text: "İkiz Yanıltma"

omen://feat/twin-feint?source=paizo-pathfinder-player-core:
  name: İkiz Yanıltma
  description: Bir silahla yapılan saldırıyı, farklı bir açıdan gelen ikinci bir saldırıdan düşmanınızın dikkatini dağıtmak için kullanırsınız. Her ikisi de aynı hedefe karşı olmak üzere, iki yakın dövüş silahınızın her biriyle birer Vuruş Yapın. Hedef ikinci saldırıya karşı otomatik olarak Gafil kalır. Çoklu saldırı cezanızı Vuruşlara normal şekilde uygulayın.

omen://feat/twin-parry?source=paizo-pathfinder-player-core:
  name: İkiz Savuşturma
  description: Saldırıları savuşturmak için iki silahınızı kullanırsınız. Bir sonraki sıranızın başına kadar SD'nize +1 durumsal bonusu veya silahlardan birinde savuşturma özelliği varsa +2 durumsal bonusu kazanırsınız. Bu hünerin gereksinimini artık karşılamıyorsanız bu durumsal bonusunu kaybedersiniz.

omen://feat/twin-riposte?source=paizo-pathfinder-player-core:
  name: İkiz Karşı Darbe
  description: Bir silahla yapılan zekice bir savuşturma, rakibinizi diğer silahla yapılacak bir saldırıya açık bırakır. Tetikleyen rakibe karşı bir yakın dövüş Vuruşu veya Silahsızlandır eylemi yapın.

omen://feat/twin-takedown?source=paizo-pathfinder-player-core:
  name: İkiz Yere Serme
  description: Avlanan avınıza silahlarınızın her biriyle hızla saldırır, potansiyel olarak hasarlarını tek bir yıkıcı saldırıda birleştirirsiniz. Gerekli silahların her biriyle birer tane olmak üzere avlanan avınıza karşı iki Vuruş Yapın. Her ikisi de aynı avlanan ava isabet ederse dirençleri ve zaafları amacıyla hasarlarını birleştirin. Çoklu saldırı cezanızı her Vuruşa normal şekilde uygulayın.

omen://feat/twinned-defense-fighter?source=paizo-pathfinder-player-core:
  name: İkiz Savunma (Savaşçı)
  description: Size karşı yapılan saldırılara müdahale etmek için ikincil elinizdeki silahı kullanmaya her zaman hazırsınızdır. Bu duruştayken sürekli olarak İkiz Savuşturma eyleminin faydalarını kazanırsınız.
  prerequisites:
  - text: "İkiz Savuşturma"

omen://feat/twist-the-knife?source=paizo-pathfinder-player-core:
  name: Bıçağı Çevir
  description: Rakibinizi zayıf bir noktasından bıçakladıktan sonra yarayı deşersiniz. Hedefe sinsi saldırı hasar zarı sayınıza eşit süren kanama hasarı verirsiniz.

omen://feat/two-weapon-flurry?source=paizo-pathfinder-player-core:
  name: Çift Silah Yaylımı
  description: Önceki saldırınızın ivmesini kullanarak ani bir çılgınlıkla her iki silahınızla da saldırırsınız. Her silahla birer kez olmak üzere iki kez Vuruş Yapın.

omen://feat/ultimate-flexibility?source=paizo-pathfinder-player-core:
  name: Nihai Esneklik
  description: >
    Deneyiminiz sizi tetikte tutar, anında karmaşık stratejiler benimsemenize ve en tehlikeli zorluklarla yüzleşmenize yardımcı olur. Muharebe esnekliği kullanarak bir savaşçı hüneri kazandığınızda iki yerine üç savaşçı hüneri kazanırsınız. İlk hüner hâlâ 8. seviye veya daha düşük olmalıyken, ikinci hüner 14. seviyeye ve üçüncü hüner 18. seviyeye kadar olabilir.
    İkinci veya üçüncü hünerlerin önkoşullarını karşılamak için birinci hüneri ve üçüncü hünerin önkoşullarını karşılamak için ikinci hüneri kullanabilirsiniz. Her üç hünerin de diğer önkoşullarını normal şekilde karşılamalısınız.
    Buna ek olarak eğitim için 1 saat harcayarak savaş alanının zorluklarına uyum sağlayabilirsiniz. Bunu yaparsanız günlük hazırlıklarınızı yapmışsınız gibi muharebe esnekliği ile seçilen hünerleri yeniden seçebilirsiniz. Kararlılık gibi daha önce kullanmış olduğunuz sınırlı kullanımlı yetenekleri takas edemezsiniz.
  prerequisites:
  - text: "geliştirilmiş esneklik"

omen://feat/ultimate-polymath?source=paizo-pathfinder-player-core:
  name: Nihai Hezarfen
  description: Tüm büyülerinizi esnek bir şekilde yapabilir ve göz kamaştırıcı bir dizi olası seçenek sunabilirsiniz. Repertuvarınızdaki tüm büyüler sizin için imza büyülerdir.
  prerequisites:
  - text: "Hezarfen ilham perisi"

omen://feat/ultimate-skirmisher?source=paizo-pathfinder-player-core:
  name: Nihai Akıncı
  description: Vahşi doğada yol alma konusunda o kadar yeteneklisinizdir ki hareketiniz araziden tamamen etkilenmez. Tüm zorlu arazi, daha büyük zorlu arazi ve tehlikeli arazi etkilerini görmezden gelirsiniz ve siz istemediğiniz sürece bir alana girilerek tetiklenen tuzakları ve tehlikeleri (tuzak telleri ve baskı plakaları gibi) tetiklemezsiniz.
  prerequisites:
  - text: "engellenemez yolculuk"

omen://feat/unbalancing-blow?source=paizo-pathfinder-player-core:
  name: Denge Bozan Darbe
  description: Vuruşları birbirine örerek düşmanlarınızın dengesini bozarsınız. Vuruşunuz ne zaman kritik bir isabet olup hasar verirse hedef, bir sonraki sıranızın sonuna kadar saldırılarınıza karşı Gafil kalır.
  prerequisites:
  - text: "yankesici tezgâhı"

omen://feat/unburdened-iron?source=paizo-pathfinder-player-core:
  name: Yüksüz Demir
  description: >
    Kadim savaşları sırasında atalarınız tarafından ilk kez geliştirilen teknikleri öğrendiniz ve bu da heybetli zırh takımlarını rahatça giymenize olanak tanır. Giydiğiniz herhangi bir zırhtan Hızınıza gelen azalmayı görmezden gelin.
    Ek olarak, başka bir nedenden dolayı (örneğin Aşırı Yüklü durumundan veya bir büyüden) Hızınıza bir ceza aldığınız her seferde cezadan 5 fit düşün. Örneğin, aşırı yüklü durumu normalde Hıza –10 fit ceza verir, ancak bu hüner onu –5 fit cezaya indirir. Hızınız birden fazla ceza alıyorsa azaltmak için yalnızca bir ceza seçin.

omen://feat/unconventional-weaponry?source=paizo-pathfinder-player-core:
  name: Sıra Dışı Silahlar
  description: >
    Potansiyel olarak başka bir soydan veya kültürden belirli bir silaha aşinalık kazandınız. Bir soya karşılık gelen bir özelliğe sahip olan (cüce, goblin veya ork gibi) ya da başka bir kültürde yaygın olan sıra dışı basit veya askeri bir silah seçin. O silaha erişim kazanırsınız ve yetkinlik amacıyla onu basit bir silah olarak değerlendirirsiniz.
    Tüm askeri silahlarda eğitimliyseniz bunun yerine bir soyun özelliğine sahip veya başka bir kültürde yaygın olan sıra dışı bir gelişmiş silah seçebilirsiniz. O silaha erişim kazanırsınız ve o silaha aşinalığınız olur. Yetkinlik amacıyla onu askeri bir silah olarak değerlendirirsiniz.

omen://feat/undaunted?source=paizo-pathfinder-player-core:
  name: Yılmayan
  description: Ruhunuz uzun varlığı boyunca pek çok zorluğa göğüs germiştir. Duygu etkilerine karşı kurtarışlarına +1 durumsal bonusu kazanırsınız. Bir duygu etkisine karşı kurtarışında başarı atarsanız bunun yerine kritik başarı elde edersiniz.

omen://feat/underhanded-assault?source=paizo-pathfinder-player-core:
  name: Hileli Taarruz
  description: Bir müttefikinizin sağladığı dikkat dağınıklığından yararlanırsınız. Müttefiklerinizden birine bitişik bir düşmana doğru Gizlice İlerlersiniz. Şu anda sizi gözlemliyor olsa bile sanki Gizli durumdaymışsınız gibi Gizlice İlerlediğiniz düşmana karşı zar atabilirsiniz. Gizlilik testinize –2 ceza alırsınız. Seçilen düşmana karşı Gizlilik testiniz başarılı olursa Gizlice İlerlemenizin sonunda o düşmana karşı bir yakın dövüş Vuruşu yapabilirsiniz.
  prerequisites:
  - text: "Gizlilik becerisinde eğitimli"

omen://feat/underwater-marauder?source=paizo-pathfinder-player-core:
  name: Sualtı Çapulcusu
  description: Su altında savaşmayı öğrendiniz. Su içindeyken Gafil kalmazsınız ve su içinde ezici veya kesici bir yakın dövüş silahı kullanmaktan kaynaklanan olağan cezaları almazsınız.
  prerequisites:
  - text: "Atletizm becerisinde eğitimli"

omen://feat/undying-ferocity?source=paizo-pathfinder-player-core:
  name: Ölüm Tanımaz Vahşet
  description: Ölümün sizi almasına meydan okuyup böyle bir girişimin kesinlikle başarısız olacağına söz vererek doğaüstü bir dinçlikle ölümün pençelerine direnirsiniz. Ork Vahşeti kullandığınızda seviyenize eşit geçici Can Puanı kazanırsınız.
  prerequisites:
  - text: "Ork Vahşeti"

omen://feat/unfettered-halfling?source=paizo-pathfinder-player-core:
  name: Prangasız Buçukluk
  description: Ya sözleşmeli köleliğe zorlandınız ya da bir hapishanede zincire vuruldunuz, ancak o zamandan beri kaçtınız ve bir daha asla yakalanmamak için eğitim aldınız. Kaçmak için yapılan bir testte veya üzerinize Kavranmış, Hareketsiz Kılınmış veya Bağlanmış durumu dayatacak bir etkiye karşı kurtarışında ne zaman bir başarı atarsanız bunun yerine bir kritik başarı elde edersiniz. Bir yaratık sizi Kavramak için yaptığı bir testte ne zaman başarısızlık atarsa bunun yerine kritik başarısızlık elde eder.

omen://feat/unhampered-passage?source=paizo-pathfinder-player-core:
  name: Engelsiz Geçiş
  description: Başkalarının sizi kısıtlamasına izin vermezsiniz. Günde bir kez kendi üzerinize kadim özgü büyü olarak Serbest Hareket yapabilirsiniz.

omen://feat/unified-theory?source=paizo-pathfinder-player-core:
  name: Birleşik Teori
  description: Dört büyü geleneğinin ve büyüsel özlerin ortak temellerini anlar ve hepsini mistik bir mercekten kavramanıza olanak tanırsınız. Büyü geleneğine bağlı olarak Doğa, Okültizm veya Din testi gerektiren bir beceri eylemi veya beceri hüneri kullandığınız her seferde bunun yerine Arkana kullanabilirsiniz. Diğer büyüler üzerinde Arkana kullanmaktan dolayı normalde bir ceza alacak veya daha yüksek bir ZD ile karşılaşacak olsaydınız (Büyüyü Tanımla kullanırken olduğu gibi), artık bunu yapmazsınız.
  prerequisites:
  - text: "Arkana becerisinde efsanevi"

omen://feat/universal-longevity?source=paizo-pathfinder-player-core:
  name: Evrensel Ömür
  description: "Uzun yaşamınız boyunca öğrendiğiniz tüm becerileri takip etme yeteneğinizi mükemmelleştirdiniz; böylece neredeyse hiçbir zaman bir beceride gerçekten eğitimsiz kalmazsınız. Yaşam deneyimlerinizi gözden geçirerek Soy Uzun Ömürlülüğü ile seçtiğiniz beceriyi (ve eğer o hünere sahipseniz Uzman Uzun Ömürlülüğü ile seçtiğiniz beceriyi) değiştirirsiniz."
  prerequisites:
  - text: "Soy Uzun Ömürlülüğü"

omen://feat/unmistakable-lore?source=paizo-pathfinder-player-core:
  name: Yanılgısız İlim
  description: Uzmanlık alanlarınız hakkındaki bilgileri asla yanlış almazsınız. Eğitimli olduğunuz herhangi bir İlim alt kategorisini kullanarak Bilgi Hatırladığınızda, kritik başarısızlık atarsanız bunun yerine başarısızlık elde edersiniz. Bir İlim alt kategorisinde ustaysanız, kritik başarıda normalden daha fazla bilgi veya bağlam kazanırsınız.
  prerequisites:
  - text: "İlim becerisinde uzman"

omen://feat/untamed-form?source=paizo-pathfinder-player-core:
  name: Ehlileşmemiş Form
  description: Her türlü zorluğun üstesinden gelmek için her zaman değişip uyum sağlayarak vahşi doğayla bir olursunuz. Druid hünerleriyle genişletebileceğiniz çeşitli formlara dönüşmenizi sağlayan Ehlileşmemiş Form düzen büyüsünü kazanırsınız.
  prerequisites:
  - text: "ehlileşmemiş düzen"

omen://feat/untrained-improvisation?source=paizo-pathfinder-player-core:
  name: Eğitimsiz Doğaçlama
  description: Boyunuzu aşan durumların üstesinden nasıl gelineceğini öğrendiniz. Eğitimsiz beceri testlerine yetkinlik bonusunuz seviyeniz –2'ye eşittir. Bu 5. seviyede seviyeniz –1'e ve 7. seviyede tam seviyenize yükselir. Bu becerinin eğitimli eylemlerini kullanmanıza izin vermez.

omen://feat/unusual-composition?source=paizo-pathfinder-player-core:
  name: Sıra Dışı Beste
  description: Bir bestenin duygu ve gücünü diğer ortamlara aktarabilirsiniz. Bir sonraki eyleminiz işitsel veya görsel bir beste büyüsü yapmaksa, yalnızca niteliklerin belirttiği duyularla değil titreşim sezgisi gibi özel duyular da dahil olmak üzere herhangi bir duyu ile ona tanık olabilen yaratıkları etkilemesini sağlayabilirsiniz. Seçtiğiniz herhangi bir duyuyu hariç tutmayı seçebilirsiniz.
  prerequisites:
  - text: "Hezarfen ilham perisi"

omen://feat/unusual-treatment?source=paizo-pathfinder-player-core:
  name: Sıra Dışı Tedavi
  description: Tıbbi eğitiminiz daha az belirgin durumlara kadar uzanır. Yaraları Tedavi Etmek için ZD 20 testine karşı başarılı olduğunuzda hastadaki bir Hantal, Halsiz veya Zihni Bulanmış durumunun değerini de 1 azaltabilirsiniz. Aynı anda birden fazla yaratığı tedavi edebiliyorsanız bu avantajı kazanması için yalnızca birini seçin. Bir yaratık Sıra Dışı Tedavi'den günde yalnızca bir kez yararlanabilir. Durum bir illetten kaynaklanıyorsa illet o aşamada kaldığı sürece durum azaltılsa da illet iyileştirilmez. Tıp konusunda ustaysanız ZD 30 testinde başarılı olmanız durumunda kaldırabileceğiniz durumlar listesine Takatsiz durumunu da eklersiniz. Tıp konusunda efsaneviyseniz seçilen durumu 1 yerine 2 azaltırsınız.
  prerequisites:
  - text: "Tıp becerisinde uzman"

omen://feat/unwavering-mien?source=paizo-pathfinder-player-core:
  name: Sarsılmaz Tavır
  description: >
    Mistik kontrolünüz ve meditasyonlarınız bilinciniz üzerindeki dış etkilere direnmenizi sağlar. En az 2 tur süren zihinsel bir etkiden ne zaman etkilenirseniz süreyi 1 tur azaltabilirsiniz.
    Hâlâ doğal uykuya ihtiyaç duyarsınız, ancak uykuya dalmanıza neden olacak etkilere karşı kurtarışlarınızı bir derece daha iyi olarak değerlendirirsiniz. Bu yalnızca uyku etkilerine karşı korur, diğer Bilinçsiz kalma biçimlerine karşı korumaz.

omen://feat/uplifting-overture?source=paizo-pathfinder-player-core:
  name: Canlandırıcı Uvertür
  description: Performansınızın ilham verici doğasıyla müttefiklerinizin becerilerine yardımcı olan Canlandırıcı Uvertür beste kantripini öğrenirsiniz.
  prerequisites:
  - text: "Maestro ilham perisi"

omen://feat/uplifting-winds?source=paizo-pathfinder-player-core:
  name: Yükselten Rüzgârlar
  description: Rüzgârlar sizi havada tutmaya heveslidir. Uçarken hava veya elektrik özelliklerine sahip bir Büyü Yaptığınızda uçma Hızınıza +10 statü bonusu kazanırsınız ve derhal Hızınızın yarısına kadar Uçabilirsiniz.
  prerequisites:
  - text: "Fırtına Düzeni"

omen://feat/vandal?source=paizo-pathfinder-player-core:
  name: Vandal
  description: >
    Bir şeyleri kırma ve parçalama konusunda bir yeteneğiniz vardır. Onları tekrar bir araya getirmek sıkıcı kısımdır, bu yüzden büyük ölçüde bununla uğraşmazsınız. Hırsızlık konusunda eğitimli hale gelirsiniz. Hırsızlık konusunda (örneğin geçmişinizden veya sınıfınızdan) otomatik olarak eğitimli hale gelecekseniz bunun yerine seçtiğiniz bir beceride eğitimli hale gelirsiniz.
    Ek olarak, bir tuzağa veya sahipsiz bir nesneye karşı bir Vuruş ile her vuruşunuzda nesnenin Sertliğinin ilk 5 puanını görmezden gelirsiniz.

omen://feat/verdant-metamorphosis?source=paizo-pathfinder-player-core:
  name: Yeşil Başkalaşım
  description: Bitki özelliğini kazanıp yeni formunuza uygun olmayan özellikleri (tipik olarak insansı) kaybederek kendinizin bir bitki versiyonuna dönüştünüz. Ayrıca Yeşil Dinlenme eylemini kazanırsınız.
  prerequisites:
  - text: "Yaprak Düzeni"

omen://feat/verdant-weapon?source=paizo-pathfinder-player-core:
  name: Yeşil Silah
  description: >
    Ahşap bir asaya, sarmaşık kırbacına veya başka bir silaha dönüşebilen bir tohum yetiştirirsiniz. Kadim enerjiyi bir tohuma odaklayarak 10 dakika harcar ve eğitimli olduğunuz, mekanik parçaları veya metal bileşenleri olmayan 0. seviye tek bir silahın potansiyelini ona aşılarsınız. Aşılanmış tohumu tutarken bir Etkileşime Gir eylemi kullanarak derhal o silaha dönüşmesini sağlayabilirsiniz; ikinci bir Etkileşime Gir eylemi onu tohum formuna geri döndürür. Yeşil silah normal şekilde rünlerle işlenebilir veya tılsımlarla donatılabilir; bunlar silah tohum formundayken bastırılır.
    Aynı anda yalnızca bir yeşil tohuma sahip olabilirsiniz. İkincisini hazırlarsanız ilk yeşil tohumunuz derhal sıradan bir tohuma dönüşür; önceki tohumdaki tüm rünler hiçbir masraf olmadan yeni tohuma aktarılır, ancak uygulanamayan rünler bastırılır.

omen://feat/versatile-font?source=paizo-pathfinder-player-core:
  name: Çok Yönlü Pınar
  description: İlahınızın veçhelerini keşfettikçe iyileştirme veya zarar verme üzerindeki kısıtlamaların ötesine geçersiniz. Zarar pınarından veya şifa pınarından kazanılan büyü slotlarında Zarar Ver ya da İyileştir hazırlayabilirsiniz.
  prerequisites:
  - text: "zarar pınarı veya şifa pınarı"
  - text: "rahiplerin her iki pınara da sahip olmasına izin veren ilah"

omen://feat/versatile-performance?source=paizo-pathfinder-player-core:
  name: Çok Yönlü Performans
  description: >
    Sıradan sosyal beceriler yerine performanslarınızın ihtişamına güvenebilirsiniz. İzlenim Bırakmak için Diplomasi yerine ve Gözdağı Vermek için Gözdağı yerine Gösteri kullanabilirsiniz. Ayrıca Kılığına Girmek için Aldatma yerine oyunculuk Gösterisi kullanabilirsiniz.
    Buna ek olarak, Aldatma, Diplomasi veya Gözdağı'nda belirli bir yetkinlik derecesi gerektiren beceri hünerlerinin önkoşullarını karşılamak için Gösteri'deki yetkinlik derecenizi kullanabilirsiniz.
  prerequisites:
  - text: "Hezarfen ilham perisi"

omen://feat/versatile-signature?source=paizo-pathfinder-player-core:
  name: Çok Yönlü İmza
  description: Çoğu ozan belirli imza performansları ve büyüleriyle tanınırken siz mevcut repertuvarınızı sürekli olarak ince ayarlarsınız. Günlük hazırlıklarınızı yaptığınızda imza büyülerinizden birini repertuvarınızdan o derecedeki farklı bir büyüyle değiştirebilirsiniz.
  prerequisites:
  - text: "Hezarfen ilham perisi"

omen://feat/very-sneaky?source=paizo-pathfinder-player-core:
  name: Çok Sinsi
  description: >
    Daha uzun boylu kimseler ayaklarının dibindeki gölgelere nadiren dikkat eder ve siz de bundan sonuna kadar yararlanırsınız. Gizlice İlerle eylemini yaptığınızda Hızınıza kadar olmak üzere 5 fit daha uzağa hareket edebilirsiniz.
    Ek olarak, Gizlice İlerle eylemlerini kullanmaya devam ettiğiniz ve Gizlilik testinizde başarılı olduğunuz sürece, sıranızın sonunda siper veya daha büyük sipere sahip olduğunuz ya da belirsiz olduğunuz müddetçe Gizlice İlerle eyleminin sonunda siper veya daha büyük sipere sahip değilseniz ve Belirsiz durumda bulunmuyorsanız gözlemlenmiş hale gelmezsiniz.

omen://feat/very-very-sneaky?source=paizo-pathfinder-player-core:
  name: Çok, Çok Sinsi
  description: Gizlice İlerle eylemini kullandığınızda Hızınıza kadar hareket edebilirsiniz ve Saklanmak ya da Gizlice İlerlemek için artık siper veya daha büyük sipere sahip olmanız ya da Gizlenmiş olmanız gerekmez.
  prerequisites:
  - text: "Çok Sinsi"

omen://feat/vicious-debilitations?source=paizo-pathfinder-player-core:
  name: Gaddar Güçten Düşürmeler
  description: "Dağıttığınız güçten düşürmeler düşmanlarınızı ciddi şekilde sakatlar. Güçten Düşürücü Vuruş kullandığınızda seçebileceğiniz listeye aşağıdaki güçten düşürmeleri ekleyin. • Güçten Düşürme: Hedef ezici, delici veya kesici hasar seçiminizden birine karşı 5 zaaf kazanır. • Güçten Düşürme: Hedef Hantal 1 olur."
  prerequisites:
  - text: "zorba tezgâhı"
  - text: "Güçten Düşürücü Vuruş"

omen://feat/vicious-swing?source=paizo-pathfinder-player-core:
  name: Gaddar Savuruş
  description: Düşmanınızı hırpalayan ancak sizi biraz dengesiz bırakan özellikle güçlü bir saldırı başlatırsınız. Yakın dövüş Vuruşu yapın. Bu çoklu saldırı cezanızı hesaplarken iki saldırı sayılır. Bu Vuruş isabet ederse fazladan bir zar silah hasarı verirsiniz. En az 10. seviyedeyseniz bunu iki ekstra zara ve en az 18. seviyedeyseniz üç ekstra zara çıkarın.

omen://feat/vigorous-anthem?source=paizo-pathfinder-player-core:
  name: Dinamik Marş
  description: Saldırmaları için ilham verirken müttefiklerinize büyüsel bir dinçlik aşılarsınız. Bir sonraki eyleminiz Cesaret Marşı beste kantripini yapmaksa siz ve etkilenen tüm müttefikler 1 dakika süren 3 + Karizma modifiyerinize eşit geçici CP kazanırsınız.

omen://feat/virtuosic-performer?source=paizo-pathfinder-player-core:
  name: Virtüöz İcracı
  description: >
    Tek bir performans türünde olağanüstü yeteneğiniz vardır. Belli bir tür performans icra ederken +1 durumsal bonusu kazanırsınız. Gösteri konusunda ustaysanız bu bonus +2'ye yükselir. Aşağıdaki uzmanlıklardan birini seçin ve bu türdeki Gösteri testlerini denerken bonusu uygulayın. Uzmanlığın uygulanıp uygulanmayacağı belirsizse GM karar verir.
    Örnekler
    Oyunculuk
    Dram, pandomim, kuklacılık
    Komedi
    Soytarılık, fıkra anlatma, taşlama
    Dans
    Bale, huara, jig, makru
    Klavyeliler
    Klavsen, org, piyano
    Hitabet
    Destan, kaside, şiir, hikâye anlatımı
    Vurmalılar
    Çanlar, davul, gong, ksilofon
    Şarkıcılık
    Balad, ilahi, melodi, kafiye
    Yaylılar
    Keman, arp, ud, viyol
    Nefesliler
    Gayda, flüt, blokflüt, trompet
  prerequisites:
  - text: "Gösteri becerisinde eğitimli"

omen://feat/vivacious-conduit?source=paizo-pathfinder-player-core:
  name: Hayat Dolu Kanal
  description: "İlk Dünya ile olan bağınız büyüdü ve onun yaşamsal enerjisi hızla içinize akar. 10 dakika dinlenirseniz Dayanıklılık modifiyeriniz × seviyenizin yarısına eşit Can Puanı geri kazanırsınız. Bu bir iyileştirme canlılık etkisidir ve Yaraları Tedavi Et'ten aldığınız her türlü iyileşme ile birikimlidir."

omen://feat/void-siphon?source=paizo-pathfinder-player-core:
  name: Boşluk Emici
  description: Boşluğun ham enerjisi yaşayanların özünü tüketir. Yaptığınız bir Zarar Ver büyüsüne karşı kurtarışında kritik başarısız olan herhangi bir yaşayan yaratık Takatsiz 1 olur.

omen://feat/wall-jump?source=paizo-pathfinder-player-core:
  name: Duvar Sıçrayışı
  description: >
    Kendinizi bir duvardan fırlatmak için bir zıplamanın ivmesini kullanabilirsiniz. Bir sıçrayışın sonunda (ister Yüksek Atlama, Uzun Atlama veya Sıçra gerçekleştirin) bir duvara bitişikseniz bir sonraki eyleminiz başka bir sıçrayış olduğu sürece düşmezsiniz. Önceki sıçrayışınız size ivme kazandırarak Yüksek Atlama veya Uzun Atlama'yı tek bir eylem olarak kullanmanıza olanak tanır, ancak aktivitenin bir parçası olarak Depar atamazsınız.
    Duvar Sıçrayışı'nı bir sırada yalnızca bir kez kullanabilirsiniz; meğerki Atletizm konusunda efsanevi olasınız; bu durumda o sırada art arda yapabileceğiniz sıçrama eylemleri kadar kullanabilirsiniz.
  prerequisites:
  - text: "Atletizm becerisinde usta"

omen://feat/wandering-oasis?source=paizo-pathfinder-player-core:
  name: Gezgin Vaha
  description: Yatıştırıcı bir enerjiyle çevrilisinizdir. Siz ve 60 fit yakınınızdaki müttefikler şiddetli çevresel sıcak ve soğuktan korunursunuz. Hayatta Kalma konusunda efsaneviyseniz siz ve bu müttefikler aşırı çevresel sıcak ve soğuktan da korunursunuz.
  prerequisites:
  - text: "Hayatta Kalma becerisinde usta"

omen://feat/ward-medic?source=paizo-pathfinder-player-core:
  name: Koğuş Hekimi
  description: Büyük tıbbi koğuşlarda çalışarak aynı anda birkaç hastayı tedavi ettiniz ve tüm ihtiyaçlarıyla ilgilendiniz. Hastalığı Tedavi Et veya Yaraları Tedavi Et kullandığınızda en fazla iki hedefi tedavi edebilirsiniz. Tıp konusunda ustaysanız en fazla dört hedefi ve efsaneviyseniz en fazla sekiz hedefi tedavi edebilirsiniz.
  prerequisites:
  - text: "Tıp becerisinde uzman"

omen://feat/wardens-boon?source=paizo-pathfinder-player-core:
  name: Muhafızın Lütfu
  description: Avlanan avınızda bulunan zaafları belirterek Avı Avla'da listelenen faydaları ve avcının avantajınızı bir sonraki sıralarının sonuna kadar bir müttefike bahşedersiniz. Seslenmenize veya el kol hareketleri yapmanıza bağlı olarak bu eylem işitsel veya görsel özelliğini kazanır.

omen://feat/wardens-focus?source=paizo-pathfinder-player-core:
  name: Muhafız Odaku
  description: "Çevrenizle olan bağınız derinleşir ve genişler; odaklandıkça doğanın kadim gücünü daha fazla çekmenize olanak tanır. Yeniden Odaklandığınızda 1 yerine tüm Odak Puanlarınızı geri kazanırsınız."
  prerequisites:
  - text: "muhafız büyüleri"

omen://feat/wardens-guidance?source=paizo-pathfinder-player-core:
  name: Muhafızın Rehberliği
  description: Bir dizi dikkatli kelime veya jestle avınızın konumunu müttefiklerinize aktarırsınız. Avlanan avınız sizin tarafınızdan gözlemlendiği sürece onu Arama yaparken başarısızlık ve kritik başarısızlık atan tüm müttefikleriniz bunun yerine başarı elde eder. Müttefiklerinizin bu faydayı kazanabilmesi için sizi görebilmesi veya duyabilmesi gerekir. Müttefiklerinizin bu faydayı elde edebilmesi için seslenebilmeli veya görünür jestler yapabilmelisiniz.

omen://feat/wardens-reload?source=paizo-pathfinder-player-core:
  name: Muhafızın Dolduruşu
  description: Büyü ve tatar yayı gibi silahlardaki ustalığınız her ikisini de aynı kolaylıkla kullanmanızı sağlar. Şu anda kuşandığınız bir silahı yeniden doldurmak için Etkileşime Gir eylemi yapın.

omen://feat/wardens-step?source=paizo-pathfinder-player-core:
  name: Muhafızın Adımı
  description: Müttefiklerinize vahşi doğada sessizce hareket etmeleri için rehberlik edebilirsiniz. Doğal arazide keşif sırasında Fark Edilmekten Kaçındığınızda, müttefiklerinizden dilediğiniz kadarını o keşif sırasında sanki bu aktiviteyi kullanıyorlarmış gibi faydaları kazanmaları için belirleyebilirsiniz. Bu onların adına hiçbir eylem gerektirmez.
  prerequisites:
  - text: "Gizlilik becerisinde usta"

omen://feat/warpriests-armor?source=paizo-pathfinder-player-core:
  name: Savaş Rahibinin Zırhı
  description: Eğitiminiz sürekli daha ağır zırhlara uyum sağlamanıza yardımcı oldu. Ağır zırhta eğitimli hale gelirsiniz. Orta zırhta uzman veya daha yüksek yetkinlik bahşeden bir sınıf özelliği kazandığınız her seferde ağır zırhta da o yetkinliği kazanırsınız. Giydiğiniz 2 Hacim veya daha yüksek zırhları 1 Hacim daha hafifmiş gibi değerlendirirsiniz (en az 1 Hacim olmak üzere).
  prerequisites:
  - text: "Savaş Rahibi öğretisi"

omen://feat/wary-disarmament?source=paizo-pathfinder-player-core:
  name: İhtiyatlı Silahsızlandırma
  description: "Bir cihazı veya tuzağı etkisiz hale getirirken devreye sokar ya da tetiklerseniz cihaza veya tuzağa karşı SD'nize veya kurtarışınıza +2 durumsal bonusu kazanırsınız. Bu yalnızca başarısız girişiminizin tetiklediği saldırılar veya etkiler için geçerlidir; karmaşık bir tuzaktan gelen ek saldırılar gibi daha sonraki saldırılar için geçerli değildir."
  prerequisites:
  - text: "Hırsızlık becerisinde uzman"

omen://feat/watch-your-back?source=paizo-pathfinder-player-core:
  name: Arkanı Kolla
  description: "Hedifi tehdit eder, korkularını körükler ve dikkatini çekersiniz. 30 fit içindeki bir hedefin İrade ZD'sine karşı bir intimidation|defense:will testi deneyin. Başarılı olursanız 1 dakika boyunca o hedef size karşı yapılan Dikkat testlerine +2 statü bonusu kazanır, ancak korku etkilerine karşı İrade kurtarışlarına –2 statü cezası alır."
  prerequisites:
  - text: "Gözdağı becerisinde eğitimli"

omen://feat/watchful-halfling?source=paizo-pathfinder-player-core:
  name: Uyanık Buçukluk
  description: >
    Etrafınızdaki insanlara çok dikkat eder, olağan dışı davrandıklarını daha kolay fark etmenizi sağlarsınız. Büyülenmiş veya ele geçirilmiş karakterleri fark etmek için Niyetini Tart temel eylemini kullanırken yapılan Dikkat testlerine +2 durumsal bonusu kazanırsınız. Büyülenmiş veya ele geçirilmiş bir karakter üzerinde aktif olarak Niyetini Tart kullanmıyorsanız GM büyüyü veya ele geçirilmeyi yine de potansiyel olarak fark etmeniz için normal durumsal bonusunuz olmadan gizli bir test atar.
    Beceri testleri için kullanmanın yanı sıra başka bir yaratığın büyüyü veya ele geçirilmeyi aşmaya yönelik kurtarışına veya diğer testine bir bonus bahşetmek için Yardım Et temel eylemini kullanabilirsiniz. Yardım Et için normal olduğu üzere yaratığı etkiye karşı savaşmaya teşvik etmek için sıranızda bir eylem kullanarak hazırlanmanız gerekir.

omen://feat/weapon-proficiency?source=paizo-pathfinder-player-core:
  name: Silah Yetkinliği
  description: Tüm askeri silahlarda eğitimli hale gelirsiniz. Tüm askeri silahlarda zaten eğitimli idiyseniz seçtiğiniz bir gelişmiş silahta eğitimli hale gelirsiniz. En az 11. seviyedeyseniz bu silahlarda uzman da olursunuz.

omen://feat/weapon-supremacy?source=paizo-pathfinder-player-core:
  name: Silah Üstünlüğü
  description: Silahlardaki beceriniz gerçekliğin kurallarını bükerek normalde büyüsel yardım gerektirecek bir hızla sürekli saldırmanıza olanak tanır. Kalıcı olarak Hızlandırılmış olursunuz. Fazladan eyleminizi yalnızca Vuruş Yapmak için kullanabilirsiniz.

omen://feat/well-versed?source=paizo-pathfinder-player-core:
  name: Görgülü
  description: Kendinize ait olmayan icra etkilerine karşı dirençlisinizdir. İşitsel, illüzyon, dilsel, sonik veya görsel özelliklere sahip etkilere karşı kurtarışlarına +1 durumsal bonusu kazanırsınız.

omen://feat/widen-spell?source=paizo-pathfinder-player-core:
  name: Büyüyü Genişlet
  description: Büyünüzün enerjisini manipüle ederek yayılmasını ve daha geniş bir alanı etkilemesini sağlarsınız. Bir sonraki kullandığınız eylem patlama, koni veya hat alanına sahip olan ve süresi bulunmayan bir Büyü Yapmak ise o büyünün alanını artırın. Normalde en az 10 fit yarıçapa sahip bir patlamanın yarıçapına 5 fit ekleyin (daha küçük yarıçaplı bir patlama etkilenmez). Normalde 15 fit uzunluğunda veya daha küçük olan bir koni veya hattın uzunluğuna 5 fit ve daha büyük bir koni veya hattın uzunluğuna 10 fit ekleyin.

omen://feat/wind-caller?source=paizo-pathfinder-player-core:
  name: Rüzgâr Çağıran
  description: Rüzgârları size yardım etmeye çağırır, sizi havada taşımasını ve en güçlü karşı rüzgârlardan bile geçmenizi sağlamasını buyurursunuz. Fırtına Uçuşu düzen büyüsünü kazanırsınız.
  prerequisites:
  - text: "Fırtına Düzeni"

omen://feat/witchs-armaments?source=paizo-pathfinder-player-core:
  name: Witch Teçhizatı
  description: "Haminizin gücü asla savunmasız kalmamanızı sağlamak için vücudunuzu değiştirir. Aşağıdaki silahsız saldırılardan birini kazanırsınız. • Doğaüstü Tırnaklar: Tırnaklarınız doğaüstü biçimde uzun ve keskindir. 1d6 kesici hasar veren, boğuşma grubunda olan ve çevik ile silahsız özelliklerine sahip bir tırnak silahsız saldırısı kazanırsınız. • Demir Dişler: Çenenizin bir tıkırtısıyla dişleriniz uzun metalik sivri uçlara dönüşür. 1d8 delici hasar veren ve boğuşma grubunda olan bir çene silahsız saldırısı kazanırsınız. • Yaşayan Saç: Saçınızı, kaşlarınızı, sakalınızı veya bıyığınızı anında birkaç fite kadar uzatıp kısaltabilir ve bir silah olarak kullanmak üzere saçınızı manipüle edebilirsiniz; ancak kontrolünüz daha hünerli görevler için yeterince hassas değildir. 1d4 ezici hasar veren, boğuşma grubunda olan ve çevik, silahsızlandırma, incelikli, çelme ve silahsız özelliklerine sahip bir saç silahsız saldırısı kazanırsınız."

omen://feat/witchs-bottle?source=paizo-pathfinder-player-core:
  name: Witch Şişesi
  description: >
    Bir yaratığı hedef alan nazar büyülerinizden birinin gücünü içeren özel bir iksir hazırlamak için 10 dakika ve 1 Odak Puanı harcarsınız. Bu iksiri tüketen yaratık o nazar büyüsü tarafından hedeflenir. Nazar büyüsünün sürdürülen bir süresi varsa ve Kıkırdama'ya sahipseniz şişeyi mühürlemeden hemen önce şişeye kıkırdama yapabilirsiniz. Bunu yaparsanız nazar büyüsünün süresi, nazar büyüsü yapıldıktan sonraki turda kıkırdama yapmışsınız gibi uzatılır (tipik olarak bu süreyi 1 tur uzatır). İksir açıldığında kıkırdayan kahkahanız duyulur.
    Bu şekilde yarattığınız herhangi bir iksir bir sonraki günlük hazırlıklarınızı yaptığınızda gücünü kaybeder. İksir sizin zilyetliğinizdeyken konsantrasyon özelliğine sahip tek bir eylem kullanarak onu etkisiz hale getirebilirsiniz. İksir tüketilene veya büyüsünü kaybedene kadar iksiri yaratmak için harcadığınız Odak Puanını (veya kıkırdama yapmak için harcadığınız Odak Puanını) geri kazanamazsınız.
  prerequisites:
  - text: "Kazan"

omen://feat/witchs-broom?source=paizo-pathfinder-player-core:
  name: Witch Süpürgesi
  description: >
    Bir süpürge gece gökyüzünde uçmak için ihtiyaç duyduğunuz tek binektir. Günlük hazırlıklarınız sırasında tek bir süpürgeyi, asayı, gönderli silahı veya benzer şekildeki nesneyi özel bitkiler ve yağlardan yapılmış uçma merhemiyle meshedebilirsiniz. Bir sonraki günlük hazırlıklarınıza kadar büyülü özelliğini kazanır ve onu en az 1 elinizle tutarken üzerine binebilirsiniz. 20 fit uçma Hızıyla hareket eder. Süpürge 20 Hacimden daha fazlasıyla yüklendiğinde Hızına –10 fit ceza alır ve 30 Hacimden fazlasını taşırsa yere çakılır. Süpürge sizden başka kimse tarafından kontrol edilemez. Bir silahı veya elde tutulan başka bir eşyayı meshederseniz süpürgeye binip aynı anda onu kuşanarak kullanamazsınız.
    O eşyanın formülüne sahipmişsiniz gibi süpürgenizi Uçan Süpürge olarak İmal Edebilirsiniz. Zaten uçan bir süpürge olan bir eşyayı meshederseniz süpürge Hızına +10 fit statü bonusu kazanır ve herkes için mi yoksa yalnızca sizin için mi çalışacağını seçebilirsiniz.

omen://feat/witchs-charge?source=paizo-pathfinder-player-core:
  name: Witch'in Himayesi
  description: Başka bir yaratıkla büyüsel bir bağ kurarak o yaratığın durumunun farkında olmanızı sağlar ve büyü yapma için bir kanal yaratırsınız. Günlük hazırlıklarınız sırasında istekli bir yaratığı himayeniz olarak belirleyebilirsiniz. Himayenizin sizden olan yönünü, mesafesini ve onu etkileyen tüm durumları her zaman bilirsiniz. Ek olarak, temas menzilli büyüleri 30 fit menzilden himayenize yapabilirsiniz. Bu etkiler bir sonraki günlük hazırlıklarınıza kadar devam eder.

omen://feat/witchs-communion?source=paizo-pathfinder-player-core:
  name: Witch İletişimi
  description: Birden fazla himaye üzerinde nöbet tutabilirsiniz. Hazırlıklarınız sırasında her gün yalnızca bir yerine Zekâ modifiyerinize eşit sayıda himaye belirleyebilirsiniz.
  prerequisites:
  - text: "Witch'in Himayesi"

omen://feat/witchs-hut?source=paizo-pathfinder-player-core:
  name: Witch Kulübesi
  description: >
    Eviniz emirlerinize uyan canlanmış bir yapıdır. 1 gün süren bir ayin gerçekleştirerek Devasa boyuta kadar bir kulübeden, küçük bir evden, üzeri örtülü bir vagondan, çadırdan veya benzer bir yapıdan canlanmış bir nesne yaratırsınız.
    Kulübe sizin SD'nizi, kurtarış modifiyerlerinizi ve Dikkat modifiyerinizi kullanır ve 150 CP ile Sertlik 10'a sahiptir. Yapı zırhı yeteneğine sahiptir; yani Can Puanı'nın yarısından azına düştüğünde veya kritik bir vuruşla hasar gördüğü anda tamir edilene kadar SD'si 4 azalır.
    Kulübe saldıramaz veya beceri testleri deneyemez. Kulübeye işitsel ve konsantrasyon özelliklerine sahip tek bir eylem olarak bir emir verebilirsiniz; kendisini yeniden yapılandırdığı 1 turun ardından kulübe siz ona farklı bir emir verene kadar o emri yerine getirir. • Gözetle: Kulübe Dikkat modifiyerinizi kullanarak 120 fit içindeki izinsiz girenleri kollar ve herhangi birini tespit ederse çığlık atar. • Saklan: Kulübe kendi türünden normal, sıradan bir nesne gibi görünür. Bu 10. derece bir illüzyon etkisidir. • Sıçra: Kulübe kendi etrafında döner veya havaya sıçrar, ardından kendisini ve içindeki tüm yaratıkları taşıyarak 10. derece Işınlan yapar. • Kilitle: Bir çarpma sesiyle kulübenin her girişi bir kilitle büyüsüyle mühürlenir. Girişlerinin kilidini açmak için bu emri tekrar verebilirsiniz. • Hareket Et: Kulübe gerekirse devasa kuş veya kemik bacaklar çıkararak 60 fit Hız kazanır ve ona verdiğiniz "beni takip et" veya "şu yöne hareket et" gibi son derece temel bir hareket emrini takip eder. Karadan seyahat için tamamen uygun olmakla birlikte kulübenin geniş hareketleri ve tepki süresindeki 1 turluk gecikme, bir muharebe karşılaşmasında veya saniyelerin ve kesin konumların önemli olduğu diğer durumlarda öngörülebilir şekilde yönlendirmek için fazla belirsizdir.
    Aynı anda yalnızca bir Witch kulübesine sahip olabilirsiniz. Yeni bir kulübeyi canlandırırsanız önceki kulübeniz derhal orijinal, sıradan formuna geri döner. Ölürseniz kulübe ona verdiğiniz son emri süresiz olarak yerine getirmeye devam eder.

omen://feat/youre-next?source=paizo-pathfinder-player-core:
  name: Sıradaki Sensin
  description: >
    Düzenbaz: Bir düşmanı alt ettikten sonra bir diğerini tehdit edersiniz. +2 durumsal bonusu ile 60 fit içindeki bir yaratığa Gözdağı Vermeyi deneyin. Gözdağı konusunda efsanevi yetkinliğe sahipseniz bunu aynı tetikleyiciyle serbest bir eylem olarak kullanabilirsiniz.
    Kabadayı: Bir düşmanı alt ettikten sonra bir diğerine sıradakinin kendisi olacağına söz verirsiniz. Görebildiğiniz ve sizi görebilen tek bir yaratığa Gözdağı Vermek için +2 durumsal bonusu ile bir Gözdağı testi deneyin. Gözdağı konusunda efsaneviyseniz bunu aynı tetikleyiciyle serbest bir eylem olarak kullanabilirsiniz.
  prerequisites:
  - text: "Gözdağı becerisinde eğitimli"

omen://feat/zealous-rush?source=paizo-pathfinder-player-core:
  name: Şevkli Hücum
  description: Hareket halindeyken kendinizi kutsarsınız. 10 fite kadar Depar atın. Büyü 2 veya daha fazla eylem aldıysa bunun yerine tam Hızınıza kadar Depar atabilirsiniz.
