# tr overrides: spell

omen://spell/acid-grip?source=paizo-pathfinder-player-core:
  name: Asit Kıskacı
  description: "Uçucu, pençeli bir el hedefi kavrar ve onu büyülü asitle yakar. Hedef, Refleks kurtarışa bağlı olarak 2d8 asit hasarı artı floor(spell rank/2)d6[persistent,acid] hasar alır. Bu büyüden süren hasar alan bir yaratık Hareket Hızlarına –10 fitlik statü cezası alır. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarım hasar alır, süren hasar almaz ve pençe onu seçtiğiniz bir yönde 5 fite kadar hareket ettirir. Başarısızlık Yaratık tam hasar ve süren hasar alır ve pençe onu seçtiğiniz bir yönde 10 fite kadar hareket ettirir. Kritik Başarısızlık Yaratık iki kat hasar ve tam süren hasar alır ve pençe onu seçtiğiniz bir yönde 20 fite kadar hareket ettirir. Güçlendirilmiş (+2) İlk hasar 2d8 artar ve süren asit hasarı 1d6 artar."

omen://spell/aerial-form?source=paizo-pathfinder-player-core:
  name: Uçan Form
  description: "Doğal güçler üzerindeki ustalığınızı kullanarak bedeninizi Orta boy uçan bir hayvan savaş formuna dönüştürürsünüz. Bu Büyüyü Yaptığınızda, listelenen bir savaş formu seçin. Belirli bir hayvan türüne (örneğin kuş için baykuş veya kartal) karar verebilirsiniz, ancak bunun formun Boyutuna veya istatistiklerine bir etkisi yoktur. Bu formdayken hayvan özelliğini kazanırsınız. Büyüyü Sonlandırabilirsiniz. Hangi savaş formunu seçerseniz seçin aşağıdaki istatistikleri ve yetenekleri kazanırsınız: SD = 18 + seviyeniz. Zırhınızın test cezasını ve Hareket Hızı düşüşünü yok sayın. 5 geçici Can Puanı. Loş ışıkta görüş. Seçtiğiniz savaş formuna özgü ve Vuruş Yapabileceğiniz yegâne saldırılar olan bir veya daha fazla silahsız yakın dövüş saldırısı. Bunlarda eğitimlisinizdir. Saldırı değiştiriciniz +16 ve hasar bonusunuz +5'tir. Bu saldırılar Çeviklik tabanlıdır (örneğin Sakar durumu açısından). Çeviklik tabanlı silahsız saldırılar için saldırı değiştiriciniz daha yüksekse, onun yerine onu kullanabilirsiniz. Kendi değiştiriciniz daha yüksek olmadıkça +16 Akrobasi değiştiricisi. Ayrıca seçtiğiniz forma bağlı olarak belirli yetenekler kazanırsınız: Yarasa Hareket Hızı 20 fit, uçma Hareket Hızı 30 fit; keskin ekolokasyon 40 fit; Yakın Dövüş dişler, Hasar 2d8 delici; Yakın Dövüş kanat (çevik), Hasar 2d6 ezici. Kuş Hareket Hızı 10 fit, uçma Hareket Hızı 50 fit; Yakın Dövüş gaga, Hasar 2d8 delici; Yakın Dövüş pençe (çevik), Hasar 1d10 kesici. Pterozor Hareket Hızı 10 fit, uçma Hareket Hızı 40 fit; belirsiz koku alma 30 fit; Yakın Dövüş gaga, Hasar 3d6 delici. Eşek Arısı Hareket Hızı 20 fit, uçma Hareket Hızı 40 fit; Yakın Dövüş iğne, Hasar 1d8 delici artı 1d6 sürekli zehir. Güçlendirilmiş (5.) Savaş formunuz Büyük boyuttadır ve uçma Hareket Hızınız +10 fitlik bir statü bonusu kazanır. Büyümek için yeterli alana sahip olmalısınız, aksi takdirde büyü boşa gider. Bunun yerine 10 geçici CP, +18 saldırı değiştiricisi, +8 hasar bonusu ve +20 Akrobasi kazanırsınız. Güçlendirilmiş (6.) Savaş formunuz Devasa boyuttadır, uçma Hareket Hızınız +15 fitlik bir statü bonusu kazanır ve saldırılarınız 10 fitlik bir erişime sahip olur. Büyümek için yeterli alana sahip olmalısınız, aksi takdirde büyü boşa gider. Bunun yerine SD = 21 + seviyeniz, 15 geçici CP, +21 saldırı değiştiricisi, +4 hasar bonusu ile iki kat hasar zarı (süren hasar dâhil) ve +23 Akrobasi kazanırsınız."

omen://spell/agile-feet?source=paizo-pathfinder-player-core:
  name: Çevik Adımlar
  description: "Tanrınızın lütufları ayaklarınızı daha hızlı, hareketlerinizi daha akıcı kılar. Hareket Hızınıza +5 fitlik bir statü bonusu kazanırsınız ve zorlu araziyi yok sayarsınız. Çevik adımları yapmanın bir parçası olarak Depar atabilir, Adım atabilir veya Sıyrılıp Geçebilirsiniz; uygun Hareket Hızına sahipseniz bunların yerine Kazabilir, Tırmanabilir, Uçabilir veya Yüzebilirsiniz."

omen://spell/air-bubble?source=paizo-pathfinder-player-core:
  name: Hava Kabarcığı
  description: >
    Tetikleyici Menzil içindeki bir yaratık nefes alamayacağı bir ortama girer.

    Hedefin başının etrafında saf havadan bir kabarcık belirir ve normal şekilde nefes almasını sağlar. Hedef normal şekilde nefes alabileceği bir ortama geri döndüğü anda etki sona erer.

omen://spell/alarm?source=paizo-pathfinder-player-core:
  name: Alarm
  description: "Yaratıklar izniniz olmadan girdiğinde sizi uyarması için bir alanı koruma altına alırsınız. Alarm büyüsünü yaptığınızda bir parola belirleyin. Küçük veya daha büyük cismani bir yaratık parolayı söylemeden büyünün alanına girdiğinde, alarm seçiminize göre zihinsel bir uyarı (bu durumda büyü zihinsel özelliğini kazanır) ya da bir el çanı sesi ve şiddetinde duyulabilir bir alarm gönderir (bu durumda büyü işitsel özelliğini kazanır). Her iki seçenek de sizi otomatik olarak uyandırır; el çanı ise alandaki her yaratığın uyanmak için bir test denemesine izin verir. Alarma karşı tetikte olan bir yaratık, alana girerken büyünün ZD'sine karşı bir Gizlilik testinde başarılı olmalı veya büyüyü tetiklemelidir. Güçlendirilmiş (3.) Hangi tür yaratıkların alarm büyüsünü çalacağını belirleyen bir tetikleyici tanımlayabilirsiniz."

omen://spell/allegro?source=paizo-pathfinder-player-core:
  name: Allegro
  description: Hızlı bir performans sergileyerek müttefikinizi hızlandırırsınız. Müttefik Hızlandırılmış durumuna geçer ve ilave eylemi Vuruş Yap, Depar veya Adım için kullanabilir.

omen://spell/animal-feature?source=paizo-pathfinder-player-core:
  name: Hayvani Nitelik
  description: "Bedeninizi tamamen dönüştürmeden, Büyüyü her Yaptığınızda aşağıdaki listeden seçeceğiniz hayvani bir nitelik kazanırsınız. Kedi Gözleri Loş ışıkta görüş kazanırsınız. Pençeler 1d6 kesici hasar veren; çevik, incelikli ve silahsız özelliklerine sahip bir pençe saldırısı kazanırsınız. Çeneler 1d8 delici hasar veren ve silahsız özelliğine sahip bir çene saldırısı kazanırsınız. Güçlendirilmiş (4.) Listeye aşağıdaki seçenekleri ekleyin. Balık Kuyruğu Kara Hareket Hızınıza eşit bir yüzme Hareket Hızı kazanırsınız. Baykuş Gözleri Karanlıkta görüş kazanırsınız. Kanatlar Kara Hareket Hareket Hızınıza eşit bir uçma Hareket Hızı kazanırsınız."

omen://spell/animal-form?source=paizo-pathfinder-player-core:
  name: Hayvan Formu
  description: "Doğal enerjiyi çağırarak kendinizi Orta boy bir hayvan savaş formuna dönüştürürsünüz. Bu Büyüyü Yaptığınızda, listelenen bir savaş formu seçin. Belirli bir hayvan türüne (örneğin kedi için aslan veya kar leoparı) karar verebilirsiniz, ancak bunun formun Boyutuna veya istatistiklerine bir etkisi yoktur. Bu formdayken hayvan özelliğini kazanırsınız. Büyüyü Sonlandırabilirsiniz. Hangi hayvanı seçerseniz seçin aşağıdaki istatistikleri ve yetenekleri kazanırsınız: SD = 16 + seviyeniz. Zırhınızın test cezasını ve Hareket Hızı düşüşünü yok sayın. 5 geçici Can Puanı. Loş ışıkta görüş ve 30 fit belirsiz koku alma. Savaş formunuza özgü ve Vuruş Yapabileceğiniz yegâne saldırılar olan bir veya daha fazla silahsız yakın dövüş saldırısı. Bunlarda eğitimlisinizdir. Saldırı değiştiriciniz +9 ve hasar bonusunuz +1'dir. Bu saldırılar Kuvvet tabanlıdır (örneğin Halsiz durumu açısından). Silahsız saldırı bonusunuz daha yüksekse, onun yerine onu kullanabilirsiniz. Kendi değiştiriciniz daha yüksek olmadıkça +9 Atletizm değiştiricisi. Ayrıca seçtiğiniz hayvan türüne bağlı olarak belirli yetenekler kazanırsınız: Maymun Hareket Hızı 25 fit, tırmanma Hareket Hızı 20 fit; Yakın Dövüş yumruk, Hasar 2d6 ezici. Ayı Hareket Hızı 30 fit; Yakın Dövüş çeneler, Hasar 2d8 delici; Yakın Dövüş pençe (çevik), Hasar 1d8 kesici. Boğa Hareket Hızı 30 fit; Yakın Dövüş boynuz, Hasar 2d8 delici. Köpekgil Hareket Hızı 40 fit; Yakın Dövüş çeneler, Hasar 2d8 delici. Kedi Hareket Hızı 40 fit; Yakın Dövüş çeneler, Hasar 2d6 delici; Yakın Dövüş pençe (çevik), Hasar 1d10 kesici. Yengeç Hareket Hızı 25 fit, yüzme Hareket Hızı 15 fit; Yakın Dövüş büyük kıskaç, Hasar 2d8 delici; Yakın Dövüş küçük kıskaç (çevik), Hasar 2d4 delici. Timsah Hareket Hızı 25 fit, yüzme Hareket Hızı 30 fit; Yakın Dövüş çeneler, Hasar 2d8 delici; Yakın Dövüş kuyruk (çevik), Hasar 1d8 ezici; dönüşüm boyunca nefesinizi tutabilirsiniz. Geyik Hareket Hızı 50 fit; Yakın Dövüş boynuz, Hasar 2d6 delici. Kurbağa Hareket Hızı 25 fit, yüzme Hareket Hızı 25 fit; Yakın Dövüş çeneler, Hasar 2d6 ezici; Yakın Dövüş dil (erişim 15 fit), Hasar 2d4 ezici. Katil Balina yüzme Hareket Hızı 35 fit; Yakın Dövüş çeneler, Hasar 2d8 delici; dönüşüm boyunca nefesinizi tutabilirsiniz. Fok Hareket Hızı 20 fit, yüzme Hareket Hızı 30 fit; Yakın Dövüş çeneler (kavrama), Hasar 2d6 delici; dönüşüm boyunca nefesinizi tutabilirsiniz. Köpekbalığı yüzme Hareket Hızı 35 fit; Yakın Dövüş çeneler, Hasar 2d8 delici; su altında nefes alabilir ancak havada nefes alamazsınız. Yılan Hareket Hızı 20 fit, tırmanma Hareket Hızı 20 fit, yüzme Hareket Hızı 20 fit; Yakın Dövüş dişler, Hasar 2d4 delici artı 1d6 zehir. Güçlendirilmiş (3.) Bunun yerine 10 geçici CP, SD = 17 + seviyeniz, saldırı değiştiricisi +14, hasar bonusu +5 ve Atletizm +14 kazanırsınız. Güçlendirilmiş (4.) Savaş formunuz Büyük boyuttadır ve saldırılarınız 10 fitlik bir erişime sahip olur. Büyümek için yeterli alana sahip olmalısınız, aksi takdirde büyü boşa gider. Bunun yerine 15 geçici CP, SD = 18 + seviyeniz, saldırı değiştiricisi +16, hasar bonusu +9 ve Atletizm +16 kazanırsınız. Güçlendirilmiş (5.) Savaş formunuz Devasa boyuttadır ve saldırılarınız 15 fitlik bir erişime sahip olur. Büyümek için yeterli alana sahip olmalısınız, aksi takdirde büyü boşa gider. Bunun yerine 20 geçici CP, SD = 18 + seviyeniz, saldırı değiştiricisi +18, hasar bonusu +7 ile iki kat hasar zarı sayısı ve Atletizm +20 kazanırsınız."

omen://spell/animal-messenger?source=paizo-pathfinder-player-core:
  name: Hayvan Ulak
  description: "Yiyecek ikram edersiniz ve menzil içindeki sıradan Mini boy bir hayvan onu yemek için yaklaşır. Hayvanın zihnine iyi bildiğiniz belirgin bir yerin veya simgesel yapının görüntüsünü, yönünü ve mesafesini kazırsınız. Ayrıca hayvana hafif Yüke kadar küçük bir nesne veya not iliştirebilirsiniz. Hayvan hedefe ulaşmak için elinden geleni yapar; oraya vardığında yakında bekler ve düşmanca olmayan yaratıkların yaklaşarak iliştirilen nesneyi almasına izin verir. Büyü, mesaj teslim edildikten sonra veya 24 saat sonra (hangisi önce gelirse) sona erer. Menzil içinde Mini boy vahşi hayvan yoksa büyü boşa gider."

omen://spell/animate-object?source=paizo-pathfinder-player-core:
  name: Nesneyi Canlandır
  description: "Hedefi, Yaratık Yaratma Ritüelleri tablosunun izin verdiği seviyeye kadar ve nesneye karşılık gelen türde bir canlandırılmış nesneye dönüştürürsünüz (böylece bir süpürge canlandırılmış süpürgeye dönüşür). Kritik Başarı Hedef, uygun türde bir canlandırılmış nesneye dönüşür. Sizden en az 4 seviye daha düşükse, onu bir hizmetkâr yapabilirsiniz. Bu ona hizmetkâr özelliğini verir; yani ona emir verdiğinizde 2 eylem kullanabilir ve ona emir vermek işitsel ile konsantrasyon özelliklerine sahip tek bir eylemdir. Kontrolünüz altında en fazla dört hizmetkâr bulunabilir. Eğer bir hizmetkâr hâline gelmezse, ona basit bir emir verebilirsiniz. Sonraki emirlerinizi yok sayarak bu hedefin peşinden tek bir amaçla gider. Başarı Kritik başarıdaki gibi; ancak hizmetkârınız hâline gelmeyen canlandırılmış bir nesne emrinizi yerine getirmek yerine olduğu yerde kalır ve kendisine saldıran, kendisini çalmaya veya hareket ettirmeye çalışan herkese saldırır. Başarısızlık Canlandırılmış nesneyi yaratmada başarısız olursunuz. Kritik Başarısızlık Canlandırılmış nesneyi yaratırsınız, ancak çılgına döner ve sizi yok etmeye çalışır. Yaratık Yaratma Ritüelleri Yaratık Seviyesi Gereken Büyü Derecesi Maliyet -1 veya 0 2 15 gp 1 2 60 gp 2 3 105 gp 3 3 180 gp 4 4 300 gp 5 4 480 gp 6 5 750 gp 7 5 1.080 gp 8 6 1.500 gp 9 6 2.100 gp 10 7 3.000 gp 11 7 4.200 gp 12 8 6.000 gp 13 8 9.000 gp 14 9 13.500 gp 15 9 19.500 gp 16 10 30.000 gp 17 10 45.000 gp"

omen://spell/ant-haul?source=paizo-pathfinder-player-core:
  name: Karınca Taşıması
  description: Hedefin kas-iskelet sistemini daha fazla ağırlık taşıyacak şekilde güçlendirirsiniz. Hedef, Aşırı Yüklü duruma gelmeden önce normalden 3 Yük daha fazla ve en fazla 6 Yük fazlasına kadar taşıyabilir.

omen://spell/appearance-of-wealth?source=paizo-pathfinder-player-core:
  name: Zenginlik Görünümü
  description: "Büyünün alanını dolduran muazzam bir zenginliğe dair kısa bir sanrı yaratırsınız. Alanın 20 fiti içindeki maddi zenginlikle baştan çıkarılabilecek her yaratık bir İrade kurtarış denemelidir. Alana giren bir yaratık yanılsamaya otomatik olarak inanmaz; yanılsamaya inanmamak, büyünün dayattığı herhangi bir Kendini Kaptırmış durumunu sona erdirir. Büyüyü Sürdürdüğünüz sürece, diğer yaratıklar hazineye diğer yanılsamalara tepki verdikleri gibi tepki verirler, ancak Kendini Kaptırmış olma riski altında değildirler. Kritik Başarı Yaratık yanılsamaya inanmaz ve ondan etkilenmez. Başarı Yaratık, bir sonraki sırasındaki ilk eylemini tamamlayana kadar zenginliğe Kendini Kaptırmış olur. Başarısızlık Yaratık yanılsamaya Kendini Kaptırmış olur."

omen://spell/aqueous-orb?source=paizo-pathfinder-player-core:
  name: Su Küresi
  description: "Menzil içinde, yerde ya da bir sıvının yüzeyindeki boş bir alanda 10 fit çapında bir su küresi oluşur. Bu Büyüyü Yaptığınızda ve her Sürdürdüğünüzde küreyi yuvarlayabilir, zemin ya da bir sıvının yüzeyi boyunca 10 fite kadar hareket ettirebilirsiniz. Küre, suyun akışını durdurmayacak yaratıkların veya engellerin alanlarından geçebilir. Boyutundaki veya daha küçük, içinden geçtiği büyüsel olmayan ateşleri söndürür ve içinden geçtiği büyülü ateşleri etkisizleştirmeyi dener. Belirli bir ateşi etkisizleştirmede başarısız olursa, büyünün süresi boyunca o ateşi etkisizleştiremez. Küre, içinden geçtiği Büyük veya daha küçük yaratıkları içine çekebilir ve alanına sığacak kadar yaratığı içinde tutabilir. Küreyi bir yaratığın alanına birden fazla kez yuvarlasanız bile aynı yaratığı sıra başına yalnızca bir kez içine çekmeyi deneyebilir. Kürenin alanından geçmeye çalıştığı herhangi bir Büyük veya daha küçük yaratık bir Refleks kurtarışı deneyebilir. Başarı Yaratık ya kürenin geçmesine izin verebilir (kendi alanında kalarak veya kürenin yolundan çıkıp yaratığın seçtiği bir alana hareket ederek) ya da kürenin hareketinin sonuna kadar kürenin önünde itilmesine razı olabilir. Başarısızlık Yaratık kürenin içine çekilir. Küreyle birlikte hareket eder ve nefesini tutmalı ya da boğulmaya başlamalıdır (suda nefes alamıyorsa). İçine çekilmiş Orta veya daha küçük bir yaratık ve o yaratığı etkilemeye çalışan herkes su altı savaşlarının normal kurallarına tabidir. İçine çekilmiş Büyük bir yaratık genellikle parçaları sudan dışarı taşacak kadar büyüktür ve sudan dışarı uzanabilir. Yaratık başarılı bir athletics|traits:action:swim|dc:10 testiyle Yüzerek ya da büyü ZD'nize karşı Kurtularak serbest kalabilir. Serbest kalan bir yaratık kürenin alanından çıkar ve anında nefes alabilir. Kritik Başarısızlık Başarısızlıktaki gibidir, ancak yaratık serbest kalmak için Yüzemez."

omen://spell/arctic-rift?source=paizo-pathfinder-player-core:
  name: Kutup Yarığı
  description: "Havada pürüzlü bir çatlak açılarak sıcaklığı çekip alırken 12d8 soğuk hasarı verir. Yarık boyunca uzanan her yaratık bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarı hasar alır. Başarısızlık Yaratık tam hasar alır ve bir sonraki sıranızın başlangıcına kadar Yavaşlatılmış 1 olur. Kritik Başarısızlık Yaratık iki kat hasar alır, bir buz tabakası tarafından Hareketsiz Kılınmış duruma gelir ve hareketsiz kılındığı sürece yavaşlatılmış 1 olur. Buz; 60 Can Puanına, 5 Sertliğe, soğuk hasarına bağışıklığa ve ateşe karşı 10 zayıflığa sahip bir nesnedir. Nesne bağışıklıklarına sahiptir ve hedef Kurtulursa yok olur. Güçlendirilmiş (+1) Hasar 1d8 artar ve buzun Can Puanı 5 artar."

omen://spell/artistic-flourish?source=paizo-pathfinder-player-core:
  name: Sanatsal Çeşni
  description: "Hedefi, yaratıcı vizyonunuza daha yakın bir forma dönüştürürsünüz. Açıkça aynı eşyadır, ancak seçtiğiniz estetik detaylara sahiptir. Hedef, yeni niteliğiyle güzel ve etkileyici bir parçadır; ancak etki bariz biçimde büyülü ve geçicidir, bu nedenle parasal değeri değişmez. Zanaat konusunda uzmansanız, eşya bir silahsa saldırı zarlarına veya bir beceri aletiyse beceri testlerine +1 eşya bonusu sağlar. Bu Büyüyü Yaptığınızda önceki büyü yapmalar sona erer. Güçlendirilmiş (7.) Zanaat konusunda ustaysanız, eşya +2 eşya bonusu sağlar. Güçlendirilmiş (10.) Zanaat konusunda efsaneviyseniz, eşya +3 eşya bonusu sağlar."

omen://spell/athletic-rush?source=paizo-pathfinder-player-core:
  name: Atletik Atılım
  description: Bedeniniz fiziksel güç ve beceriyle dolar. Hareket Hızınıza +10 fitlik bir statü bonusu ve Atletizm testlerine +2 statü bonusu kazanırsınız. Bu Büyüyü Yapmanın bir parçası olarak Depar, Sıçrama, Tırmanma veya Yüzme eylemini kullanabilirsiniz. Büyünün bonusları bu eylem sırasında geçerlidir.

omen://spell/atone?source=paizo-pathfinder-player-core:
  name: Keffaret
  description: "Gerçekten tövbekâr olan bir yaratığın, tipik olarak tanrınız için yasak olan eylemler gibi kabahatlerinin keffaretini ödemesine yardımcı olmaya çalışırsınız. Yaratık gerçekten tövbekâr değilse, sonuç her zaman kritik bir başarısızlıktır. Bu ritüel, hedef bir druid ise Doğa, diğer tüm durumlarda Din becerisini kullanır. Kritik Başarı Yaratık kabahatleri için bağışlanma kazanır ve tanrınız nezdindeki itibarını yeniden elde etmesini sağlar. Kaybettiği tüm yetenekleri geri kazanır. Keffaret tamamlanmadan önce yaratık, kabahatlerine uygun olarak tanrınız tarafından seçilen özel bir görevi veya başka bir işi yerine getirmelidir. Boş zamanda tamamlanırsa bu görev en az 1 ay sürmelidir. 1 ay boyunca hedef, tanrınız için yasak olacak bir eylemi gerçekleştirmeden hemen önce ilahi sezgi alır. Başarı Kritik başarıdaki gibi, ancak yaratık sonraki eylemlerine ilişkin özel bir sezgi kazanmaz. Başarısızlık Yaratık bağışlanma kazanamaz; tefekküre ve kabahatlerini telafi etmeye devam etmelidir. Aynı kabahatler için gelecekteki herhangi bir keffaret ritüeli yarı yarıya daha az maliyetlidir ve birincil ile ikincil testlere +4 durumsal bonus kazanır. Kritik Başarısızlık Yaratık tanrınızı gücendirir ve kalıcı olarak inançtan aforoz edilir. Yaratık, daha doğrudan bir müdahale olmaksızın dininize yeniden katılamaz. Güçlendirilmiş (+1) Maksimum hedef seviyesini 2 ve temel maliyeti 20 gp artırın."

omen://spell/augury?source=paizo-pathfinder-player-core:
  name: Fâl
  description: "Geleceğe dair belirsiz bir bakış elde edersiniz. Bu büyüyü yaparken belirli bir hareket tarzının sonuçlarını sorun. Büyü geleceğe dair 30 dakikaya kadarki sonuçları öngörebilir ve GM'nin şu sonuçlar arasındaki en iyi tahminini ortaya çıkarabilir: iyi, kötü, karışık (sonuçlar iyi ve kötünün bir karışımı olacaktır) ve hiçbir şey (özellikle iyi veya kötü sonuçlar olmayacaktır). GM gizli bir flat|dc:6|showDC:all|traits:secret zarlar. Başarısızlıkta sonuç her zaman \"hiçbir şey\"dir. Bu da \"hiçbir şey\" sonucunun doğru olup olmadığını anlamayı imkânsız kılar. Bir kimse ek bir büyü yapma sırasında ilk fâl yapmasıyla aynı konuyu sorarsa GM ilk büyü yapmadaki gizli zar sonucunu kullanır. Ancak koşullar değişirse farklı bir sonuç almak mümkündür."

omen://spell/avatar?source=paizo-pathfinder-player-core:
  name: Avatar
  description: "Tanrınızın bir avatarına dönüşerek Devasa bir savaş formuna bürünürsünüz. Bu savaş formunda ellere sahipsinizdir ve manipülasyon eylemleri yapabilirsiniz. Bu büyüyü Sonlandırabilirsiniz. Hangi tanrının savaş formuna bürünürseniz bürünün aşağıdaki istatistikleri ve yetenekleri kazanırsınız: SD = 25 + seviyeniz. Zırhınızın test cezasını ve Hareket Hızı düşüşünü yok sayın. 30 geçici Can Puanı. Karanlıkta görüş. Tanrınızın savaş formuna özgü ve Vuruş Yapabileceğiniz yegâne saldırılar olan bir veya daha fazla saldırı. Bunlarda eğitimlisinizdir. Saldırı değiştiriciniz +33'tür ve listelenen hasarı kullanırsınız. İncelikli özelliğine sahip olmadıkları sürece yakın dövüş saldırıları Kuvvet tabanlıdır (örneğin Halsiz durumu açısından) ve tüm menzilli saldırılar Çeviklik tabanlıdır. Kendi değiştiriciniz daha yüksek olmadıkça +35 Atletizm değiştiricisi. Ayrıca aşağıda tanrınız için listelenen belirli yetenekleri kazanırsınız: Abadar Hareket Hızı 50 fit, kazma Hareket Hızı 30 fit, Hareketsiz Kılınmış durumuna bağışık; Menzilli tatar yayı (menzil artışı 120 fit, doldurma 1), Hasar 6d10+3 delici. Achaekek Hareket Hızı 70 fit, tırmanma Hareket Hızı 50 fit, zorlu araziyi ve büyük zorlu araziyi yok sayar; Yakın Dövüş peygamberdevesi pençesi (çevik, geri savurma, incelikli, erişim 15 fit, çok yönlü D), Hasar 6d8+6 kesici; Menzilli diken yaylımı (menzil 60 fit), Hasar 6d6+3 delici. Asmodeus Hareket Hızı 70 fit, uçma; Yakın Dövüş gürz (erişim 15 fit), Hasar 6d10+6 ezici; Menzilli cehennem ateşi (menzil 120 fit), Hasar 6d6+3 ateş. Calistria Hareket Hızı 30 fit, uçma Hareket Hızı 70 fit; Yakın Dövüş kırbaç (silahsızlandırma, incelikli, ölümcül olmayan, erişim 20 fit), Hasar 6d4+6 kesici; Menzilli tadına varılmış iğne (menzil 60 fit), Hasar 6d6+3 zehir. Cayden Cailean Hareket Hızı 70 fit, uçma, zorlu araziyi ve büyük zorlu araziyi yok sayar; Yakın Dövüş meç (ölümcül 3d8, erişim 15 fit), Hasar 6d6+6 delici; Menzilli bira sıçraması (menzil 120 fit), Hasar 6d6+3 zehir. Desna Hareket Hızı 30 fit, uçma Hareket Hızı 70 fit; Yakın Dövüş yıldızbıçağı (çevik, ölümcül 3d4, incelikli, erişim 15 fit, gümüş, fırlatılan 60 fit), Hasar 6d4+6 delici; Menzilli ay ışını (menzil 120 fit, gümüş), Hasar 6d6+3 ateş. Erastil Hareket Hızı 70 fit, uçma, zorlu araziyi ve büyük zorlu araziyi yok sayar; Menzilli uzun yay (ölümcül 3d8, menzil artışı 150 fit), Hasar 6d8+3 delici. Gorum Hareket Hızı 70 fit, Hareketsiz Kılınmış durumuna bağışık; Yakın Dövüş çift elli kılıç (çok yönlü D, erişim 15 fit), Hasar 6d12+6 kesici. Gozreh kara Hareket Hızı yok, uçma Hareket Hızı 70 fit, yüzme Hareket Hızı 70 fit, zorlu araziyi ve büyük zorlu araziyi yok sayar; Yakın Dövüş dalgalar (erişim 15 fit, itme, fırlatılan 20 fit), Hasar 6d8+6 ezici; Menzilli rüzgâr (çok yönlü elektrik, menzil 120 fit), Hasar 6d6+3 ezici. Iomedae Hareket Hızı 70 fit, uçma; kalkan (15 Sertlik, hasar alamaz); Yakın Dövüş uzun kılıç (çok yönlü D, erişim 15 fit), Hasar 6d8+6 kesici. Irori Hareket Hızı 80 fit, uçma; Yakın Dövüş prangasız vuruş (çevik, çok yönlü D veya K, incelikli, erişim 15 fit), Hasar 6d8+6 ezici; Menzilli rüzgâr vuruşu (menzil 60 fit), Hasar 6d4+6 ezici. Lamashtu Hareket Hızı 30 fit, uçma Hareket Hızı 70 fit; Yakın Dövüş pala (kuvvetli, erişim 15 fit), Hasar 6d10+6 kesici; Menzilli Lamashtu suları (menzil 120 fit), Hasar 6d6+3 zehir. Nethys Hareket Hızı 70 fit, uçma; Menzilli ham büyü (menzil 120 fit; çok yönlü soğuk, elektrik veya ateş), Hasar 6d6 güç. Norgorber Hareket Hızı 70 fit, uçma, zorlu araziyi ve büyük zorlu araziyi yok sayar; Yakın Dövüş kısa kılıç (çevik, incelikli, çok yönlü K, erişim 15 fit), Hasar 6d6+6 delici; Menzilli kara parmak fırlatması (menzil 120 fit), Hasar 6d6+3 zehir. Pharasma Hareket Hızı 70 fit, uçma; Yakın Dövüş hançer (çevik, incelikli, erişim 15 fit, fırlatılan 40 fit), Hasar 6d6+6 kesici; Menzilli sarmal patlama (menzil 120 fit, yalnızca hortlaklara hasar verir), Hasar 6d8+3 dirim. Rovagug Hareket Hızı 50 fit, kazma Hareket Hızı 30 fit, Hareketsiz Kılınmış durumuna bağışık; Yakın Dövüş çeneler (erişim 15 fit), Hasar 6d12+6 delici; Yakın Dövüş bacak (çevik, çok yönlü D, erişim 15 fit), Hasar 6d8+6 ezici. Sarenrae Hareket Hızı 30 fit, uçma Hareket Hızı 70 fit; Yakın Dövüş pala (kuvvetli, ölümcül olmayan, erişim 15 fit), Hasar 6d6+6 kesici; Menzilli ezeli alev (ölümcül olmayan, menzil 120 fit), Hasar 6d6+3 ateş. Shelyn Hareket Hızı 70 fit, uçma, zorlu araziyi ve büyük zorlu araziyi yok sayar; Yakın Dövüş kargı (ölümcül 3d8, ölümcül olmayan, erişim 20 fit), Hasar 6d8+6 kesici; Menzilli içsel güzellik melodisi (ölümcül olmayan, menzil 120 fit), Hasar 6d6+3 sonik. Torag Hareket Hızı 50 fit, kazma Hareket Hızı 30 fit, Hareketsiz Kılınmış durumuna bağışık; kalkan (15 Sertlik, hasar alamaz); Yakın Dövüş savaş çekici (erişim 15 fit, itme), Hasar 6d8+6 ezici. Urgathoa Hareket Hızı 70 fit, uçma; Yakın Dövüş tırpan (ölümcül 3d10, çelme, erişim 15 fit), Hasar 6d10+6 kesici; Menzilli solgun veba (menzil 120 fit), Hasar 6d6+3 hiçlik. Zon-Kuthon Hareket Hızı 70 fit, uçma, zorlu araziyi ve büyük zorlu araziyi yok sayar; Yakın Dövüş dikenli zincir (silahsızlandırma, çelme, erişim 15 fit), Hasar 6d8+6 kesici; Menzilli gece yarısı acısı (zihinsel, ölümcül olmayan, menzil 120 fit), Hasar 6d6+3 zihinsel."

omen://spell/awaken-animal?source=paizo-pathfinder-player-core:
  name: Hayvanı Uyandır
  description: Hedefe zekâ bahşederek onu bir canavara dönüştürürsünüz. Önceden bir yoldaş hayvan veya hizmetkâr idiyse, artık bu şekilde hizmet edemez. Kritik Başarı Hedefin Zekâ, Bilgelik ve Karizma değiştiricilerinin her biri daha düşükse +2'ye yükselir ve kendisini uyandırdığınız için size yardımcı olur. Başarı Hedefin Zekâ, Bilgelik ve Karizma değiştiricileri daha düşükse +0'a yükselir ve kendisini uyandırdığınız için size dostça davranır. Başarısızlık Hedefi uyandırmada başarısız olursunuz. Kritik Başarısızlık Hedefi kazara size karşı katıksız bir hayvani nefretle uyandırırsınız. Hedefin Zekâ, Bilgelik ve Karizma değiştiricileri daha düşükse -2'ye yükselir. Size düşman olur ve sizi yok etmeye çalışır. Yaratık Yaratma Ritüelleri Yaratık Seviyesi Gereken Büyü Derecesi Maliyet -1 veya 0 2 15 gp 1 2 60 gp 2 3 105 gp 3 3 180 gp 4 4 300 gp 5 4 480 gp 6 5 750 gp 7 5 1.080 gp 8 6 1.500 gp 9 6 2.100 gp 10 7 3.000 gp 11 7 4.200 gp 12 8 6.000 gp 13 8 9.000 gp 14 9 13.500 gp 15 9 19.500 gp 16 10 30.000 gp 17 10 45.000 gp

omen://spell/bane?source=paizo-pathfinder-player-core:
  name: Lanetle
  description: "Düşmanlarınızın zihnini şüpheyle doldurursunuz. Alandaki düşmanlar bir İrade kurtarışında başarılı olmalıdır; aksi takdirde alanda bulundukları sürece saldırı zarlarına –1 statü cezası alırlar. Sonraki turlarda tur başına bir kez, yayılımın yarıçapını 10 fit artırmak ve alanda henüz etkilenmemiş düşmanları başka bir kurtarış denemeye zorlamak için büyüyü Sürdürebilirsiniz. Lanetle, Kutsa büyüsünü etkisizleştirebilir."

omen://spell/banishment?source=paizo-pathfinder-player-core:
  name: Sürgün
  description: Hedefi kendi ana düzlemine geri gönderirsiniz. Hedef bir İrade kurtarışı denemelidir. Bu Büyüyü Yaparken fazladan bir eylem harcayabilir ve yaratığa kurtarışta –2 durumsal ceza vermek için büyüye bir maliyet ekleyebilirsiniz. Bu maliyet, yaratık için yasak olan özel olarak toplanmış bir nesne olmalıdır. Bu büyü, yaptığınızda kendi ana düzleminizde değilseniz başarısız olur. Kritik Başarı Hedef sürgün edilmeye direnir ve Sersemlemiş 1 olursunuz. Başarı Hedef sürgün edilmeye direnir. Başarısızlık Hedef sürgün edilir. Kritik Başarısızlık Hedef sürgün edilir ve 1 hafta boyunca hiçbir yolla sürüldüğü düzleme geri dönemez. Güçlendirilmiş (9.) 10 adede kadar yaratığı hedefleyebilirsiniz. Fazladan maliyet, kendisi için yasak olan hedefleri etkiler.

omen://spell/bind-undead?source=paizo-pathfinder-player-core:
  name: Hortlak Bağla
  description: Bir güç kelamıyla hedefin kontrolünü ele geçirirsiniz. Hizmetkâr özelliğini kazanır. Siz veya bir müttefikiniz hedefe karşı herhangi bir düşmanca eylem kullanırsa büyü sona erer.

omen://spell/binding-circle?source=paizo-pathfinder-player-core:
  name: Bağlama Çemberi
  description: "Seviyesi bağlama çemberi ritüelinin derecesinin iki katından yüksek olmayan düzlemlerarası bir yaratığı çağırır ve genellikle bir ödeme karşılığında sizin için bir görevi yerine getirmesi amacıyla onunla pazarlık yapmaya çalışırsınız. Düzlemlerarası yaratığı çemberinizin içinde var eder ve onunla bir anlaşma müzakere edersiniz. Hiç pazarlık yapmak istemeyen bir yaratık, kendi ana düzleminde kalmak için bir İrade kurtarışı deneyebilir. Çoğu düzlemlerarası yaratık, ölümlülerin kaprislerine hizmet etmekten daha iyi işleri olduğunu düşünür ve özellikle göreviniz büyük riskler taşıyorsa önemli bir hediye talep eder. İblisler ve benzeri kötü niyetli düzlemlerarası yaratıklar, yol boyunca Evren'i kasıp kavurmalarına veya dünyaya kötülük saçmalarına izin verdiği sürece daha düşük bir bedelle pazarlığı kabul etmeye daha yatkındır. Parasal fiyatlar genellikle kısa ve basit bir görev için yaratığın seviyesinde tüketilebilir bir eşyanın maliyetinden, yaratığı yanınızda savaşmaya ikna etmek için yaratığın seviyesinde veya daha yüksek kalıcı bir sihirli eşyaya kadar değişir. Ancak bazı düzlemlerarası yaratıklar, belirtilmemiş daha sonraki bir iyiliği yerine getirmek üzere size bir Emir büyüsü yapma izni veya cehennemi bir sözleşmeyle ruhunuzun mülkiyetini elde etme gibi paradan farklı ödemeler isteyebilir. Düzlemlerarası yaratığın pazarlık sırasında saldırmasını veya çemberden ayrılmasını engelleyen bir koruma çemberi oluşturmak için ilave bir ikincil büyücü ekleyebilirsiniz. Bu, Zanaat becerisini kullanır ve ikincil bir testle aynı ZD'ye sahiptir. Düzlemlerarası yaratığa karşı düşmanca bir eylem kullanırsanız veya koruma çemberi kırılırsa bu koruma sona erer. Kritik Başarı Düzlemlerarası yaratığı çağırırsınız ve tam bir güne kadar evine dönmesini engelleyebilirsiniz; bu da onu süre boyunca korumaların içinde bırakmakla tehdit ederek potansiyel olarak daha iyi bir anlaşma müzakere etmenize olanak tanır. Başarı Düzlemlerarası yaratığı çağırırsınız ve talebinizi kısaca belirtmelisiniz, ardından yaratık istediği zaman evine dönebilir. Başarısızlık Düzlemlerarası yaratığı çağırmada başarısız olursunuz. Kritik Başarısızlık Korumalarınızla bağlanmamış aşağılık ve korkunç bir şey çağırırsınız ve hemen sizi yok etmeye çalışır."

omen://spell/bit-of-luck?source=paizo-pathfinder-player-core:
  name: Ufak Şans
  description: Bir yaratığı felaketten korumak için şans terazisini hafifçe eğersiniz. Hedef bir kurtarış deneyeceği zaman, iki kez zar atabilir ve daha iyi olan sonucu kullanabilir. Bunu bir kez yaptığında büyü sona erer. Ufak şans büyüsünü tekrar yaparsanız, yaptığınız ve hâlen yürürlükte olan önceki ufak şans sona erer. Bir yaratık ufak şans ile hedeflendikten sonra, 24 saat boyunca geçici olarak bağışık olur.

omen://spell/blazing-bolt?source=paizo-pathfinder-player-core:
  name: Alevli Ok
  description: "Bir ısı ve alev ışını ateşlersiniz. Tek bir yaratığa karşı bir büyü saldırı zarı atın. İsabet hâlinde hedef 2d6 ateş hasarı alır ve kritik vuruşta hedef iki kat hasar alır. Büyüyü Yaparken kullandığınız her ilave eylem için, farklı bir hedefe ilave bir ışın ateşleyebilirsiniz; 3 eylem karşılığında üç farklı hedefi hedefleyen en fazla üç ışına ulaşabilirsiniz. Bu saldırıların her biri çoklu saldırı cezanızı artırır; ancak çoklu saldırı cezanızı alevli ok için tüm büyü saldırı zarlarını atana kadar artırmazsınız. Büyüyü Yaparken 2 veya daha fazla eylem harcarsanız, isabet hâlinde hasar 4d6 ateş hasarına yükselir ve kritik vuruşta yine iki kat hasar verir. Güçlendirilmiş (+1) Her hedefe verilen hasar 1 eylemli versiyon için 1d6, 2 eylemli ve 3 eylemli versiyonlar için ise 2d6 artar."

omen://spell/bless?source=paizo-pathfinder-player-core:
  name: Kutsa
  description: Ötelerden gelen lütuflar yoldaşlarınızın isabetli vurmasına yardımcı olur. Siz ve müttefikleriniz yayılma alanı içindeyken saldırı zarlarına +1 statü bonusu kazanırsınız. Sonraki turlarda tur başına bir kez, yayılımın yarıçapını 10 fit artırmak için büyüyü Sürdürebilirsiniz. Kutsa, Lanetle büyüsünü etkisizleştirebilir.

omen://spell/blessed-boundary?source=paizo-pathfinder-player-core:
  name: Kutsanmış Sınır
  description: Devasa, koruyucu bir küre içinde dönen yüzlerce ilahi güç tezahürü belirir. Bunlar tipik olarak sivri parçalar gibi görünür, ancak genellikle büyücünün tanrısına uygun bir görünüm alır. Kürenin içi boştur ve tezahürler dış kenarda 2 inç derinliğinde bir kabuk oluşturur. Büyüyü yaparken patlamayı 5 fitlik artışlarla daha küçük yapmayı seçebilirsiniz. Kabuk siper sağlar ve katı araziyi etkilemeden onunla kesişebilir. Kabuk, küre yaratıldığında kabukla kesişen veya kabuğun içinden geçmeye çalışan her yaratığa 7d8 güç hasarı verir. Yaratık ayrıca sırasının sonunda da hasar alır, ancak yalnızca o sıra kabuktan henüz hasar almadıysa. Etkiler bir yaratığın Refleks kurtarışı ile belirlenir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarı hasar alır. Başarısızlık Yaratık tam hasar alır, seçtiğiniz yönde 10 fite kadar itilir ve hareketini sonlandırır. Kritik Başarısızlık Yaratık iki kat hasar alır, seçtiğiniz yönde 20 fite kadar itilir ve hareketini sonlandırır. Güçlendirilmiş (+1) Hasar 1d8 artar.

omen://spell/blight?source=paizo-pathfinder-player-core:
  name: Kurutma
  description: >
    Alan Merkezinde sizin bulunduğunuz 1/2 mil yarıçaplı daire

    Alandaki bitkileri büküp köreltir ve solmalarına neden olursunuz. Çöken bitki örtüsünden kaynaklanan diğer tehlikelerin yanı sıra bu durum çiftliklerin ürün verimini düşürür. Bu ritüeli bitki büyümesinden etkilenen bir alanda yaparsanız, kurutma olağan etkisini üretmek yerine bitki büyümesini etkisizleştirmeye çalışır.

    Kritik Başarı Alandaki ürün verimini tamamen mahvedin veya 1 mil yarıçapa kadar bir alanda verimi yarı yarıya düşürün.

    Başarı Alandaki ürün verimini yarı yarıya düşürün.

    Başarısızlık Ritüelin hiçbir etkisi olmaz.

    Kritik Başarısızlık Alandaki bitki örtüsü GM tarafından belirlenen ancak genellikle gerçek arzularınıza olabildiğince çelişen beklenmedik bir şekilde değişir (örneğin onları kurutmayı tercih ettiğinizde ekinleri zenginleştirmek gibi).

omen://spell/blindness?source=paizo-pathfinder-player-core:
  name: Körlük
  description: Hedefi kör edersiniz. Etki hedefin Dayanıklılık kurtarışı ile belirlenir. Hedef ardından 1 dakika boyunca geçici olarak bağışık olur. Kritik Başarı Hedef etkilenmez. Başarı Hedef, bir sonraki turu başlayana kadar Kör olur. Başarısızlık Hedef 1 dakika boyunca Kör olur. Kritik Başarısızlık Hedef kalıcı olarak Kör olur.

omen://spell/blood-vendetta?source=paizo-pathfinder-player-core:
  name: Kan Davası
  description: >
    Gereksinimler Kanayabiliyorsunuzdur. Tetikleyici Bir yaratık size delici, kesici veya süren kanama hasarı verir.

    Hedefi lanetler, kanınızı dökme cüretini gösterdiği için onu cezalandırırsınız. Hedef 2d6 süren kanama hasarı alır ve bir İrade kurtarışı denemelidir.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef süren kanama hasarının yarısını alır.

    Başarısızlık Hedef tam süren kanama hasarı alır. Kanama durana kadar hedefin delici ve kesici hasara karşı 1 zayıflığı vardır.

    Kritik Başarısızlık Başarısızlıktaki gibi, ancak hedef iki kat süren kanama hasarı alır.

    Güçlendirilmiş (+2) Süren kanama hasarı 2d6 artar.
  requirements: Kanayabiliyorsunuzdur.

omen://spell/blood-ward?source=paizo-pathfinder-player-core:
  name: Kan Muhafazası
  description: "Haminizin koruyucu kalkanı bir hedefi zarardan korumak için iner. Şu yaratık özelliklerinden birini belirleyin: garabet, hayvan, canavar, celestial, yapay varlık, ejderha, elementel, peri, fiend, mantar, monitor, balçık, bitki veya hortlak. Hedef, bu özelliğe sahip yaratıklara karşı kurtarışlara ve SD'sine +1 statü bonusu kazanır. Güçlendirilmiş (5.) Statü bonusu +2'ye yükselir."

omen://spell/blur?source=paizo-pathfinder-player-core:
  name: Bulanıklık
  description: Hedefin formu bulanık görünür. Belirsiz durumuna gelir. Bu etkinin doğası hedefin konumunu hâlâ bariz bıraktığından, hedef bu belirsizliği Saklanmak veya Sessizce İlerlemek için kullanamaz.

omen://spell/breath-of-life?source=paizo-pathfinder-player-core:
  name: Hayat Nefesi
  description: >
    Tetikleyici Menzil içindeki canlı bir yaratık ölecektir.

    Lütfunuz bir yaratığı ölüm anında canlandırır. Hedefin ölmesini önler ve hedefe 5d8 Can Puanı kazandırırsınız. Tetikleyici etki bir ölüm etkisi veya Ayrıştırma gibi geride hiçbir kalıntı bırakmayan bir etkiyse hayat nefesini kullanamazsınız.

    Güçlendirilmiş (+2) İyileşme 1d8 artar.

omen://spell/breathe-fire?source=paizo-pathfinder-player-core:
  name: Ateş Püskürt
  description: Ağzınızdan bir alev fışkırır. Temel bir Refleks kurtarışı ile alandaki yaratıklara 2d6 ateş hasarı verirsiniz. Güçlendirilmiş (+1) Hasar 2d6 artar.

omen://spell/cackle?source=paizo-pathfinder-player-core:
  name: Kıkırdama
  description: Hızlı bir kahkaha patlamasıyla yarattığınız büyülü bir etkiyi uzatırsınız. Bir büyüyü Sürdürürsünüz.

omen://spell/call-spirit?source=paizo-pathfinder-player-core:
  name: Ruh Çağır
  description: "Ölümden sonraki yaşama uzanan tülü yırtar ve bir ruhu ebedi istirahatgâhından çağırırsınız. Ruhu adıyla çağırmalı ve bir eşya, bir giysi veya cesedinden bir parça gibi ruhla bir bağ sağlamalısınız. Çağrınıza kulak vermek istemeyen bir ruh bundan kaçınmak için bir İrade kurtarışı deneyebilir; kritik başarıda hilebaz bir ruh çağırmak istediğiniz ruhun Kimliğine Bürünür. Ruhla yaşarken tanışmadıysanız İrade kurtarışının ZD'si 2 daha düşüktür. Her iki durumda da ruh, çağırmak istediğiniz yaratığın tül gibi hafif bir formu olarak belirir. Sürenin her dakikasında ruha bir soru sorabilirsiniz. İstediği gibi cevap verebilir veya cevap vermeyi tamamen reddedebilir. Ruh ölümden sonraki yaşamda değilse (örneğin bir hortlaksa), kritik başarısızlıklar dışındaki tüm sonuçlar başarısızlık etkisini kullanır. Kritik Başarı Ruh son derece işbirlikçidir ve sizi aldatmak için güçlü nedenleri olsa bile Aldatma testlerine -2 durumsal ceza alır. Başarı Ruhu çağırırsınız. Başarısızlık Bir ruh çağırmada başarısız olursunuz. Kritik Başarısızlık Bir veya daha fazla kötü ruh belirir ve saldırır."

omen://spell/calm?source=paizo-pathfinder-player-core:
  name: Sakinleştir
  description: "Alandaki yaratıkları zorla sakinleştirerek onları şiddetsiz bir duruma yatıştırırsınız; her yaratık bir İrade kurtarışı denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Sakinleştirici dürtüler, yaratığın saldırı zarlarına -1 statü cezası yükler. Başarısızlık Yaratığı etkileyecek herhangi bir duygu etkisi bastırılır ve yaratık düşmanca eylemler kullanamaz. Hedef başka bir yaratıktan düşmanlık görürse, sakinleştirme etkisinden çıkmış olur. Kritik Başarısızlık Başarısızlıktaki gibi, ancak düşmanlık etkiyi sonlandırmaz."

omen://spell/canticle-of-everlasting-grief?source=paizo-pathfinder-player-core:
  name: Ebedi Keder İlahisi
  description: Saf kederden damıtılmış, yalnızca hedefin duyabileceği ve değer verdiği her şeyin kaçınılmaz kaybını aktaran bir melodi yaratırsınız. Hedef, İrade kurtarışına bağlı olarak 10d6 zihinsel hasar alır. Bu büyüyle lanetlenen bir yaratık, başarı derecesinde belirtilen süre boyunca durumsal veya statü bonuslarından yararlanamaz. Kritik Başarı Hedef etkilenmez. Başarı Hedef yarı hasar alır, Korkmuş 1 olur ve 1 tur boyunca lanetlenir. Başarısızlık Hedef tam hasar alır, Korkmuş 3 olur ve 1 hafta boyunca lanetlenir. Kritik Başarısızlık Hedef iki kat hasar alır, Korkmuş 4 olur ve sınırsız süreyle lanetlenir. Lanet kaldığı sürece, hedefin müttefikleri de yaratığın 15 fiti içindeyken lanetten etkilenir.

omen://spell/captivating-adoration?source=paizo-pathfinder-player-core:
  name: Büyüleyici Hayranlık
  description: Son derece büyüleyici hâle gelirsiniz ve yaratıklar alanda kaldıkları sürece sizinle dikkatleri dağılır. Seçtiğiniz herhangi bir yaratığı etkilerden hariç tutabilirsiniz. Bu Büyüyü Yaptığınızda aurada bir yaratık varsa veya bir yaratık alana ilk kez girdiğinde, bir İrade kurtarış denemelidir. Bir yaratık ayrılır ve tekrar girerse, orijinal kurtarışın sonuçlarını kullanır. Kritik Başarı Yaratık etkilenmez ve 1 saat boyunca geçici olarak bağışık olur. Başarı Yaratık bir sonraki eylemi boyunca size Kendini Kaptırmış olur, ardından 1 saat boyunca geçici olarak bağışık kalır. Başarısızlık Yaratık size Kendini Kaptırmış olur. Kritik Başarısızlık Yaratık size Kendini Kaptırmış olur ve size karşı tutumu bir basamak iyileşir. Güçlendirilmiş (+1) Yayılımın boyutunu 15 fit artırın.

omen://spell/cataclysm?source=paizo-pathfinder-player-core:
  name: Katastrof
  description: Dünyanın sonunu getiren katastrofların hayal bile edilemez gücünü çağırır, her katastroftan küçük bir parça koparır ve bunları korkunç derecede güçlü tek bir saldırıda birleştirirsiniz. Alandaki tüm yaratıkların üzerine aşağıdaki etkiler çöker. Katastrofun hasarını belirleme amacıyla alandaki yaratıkların dirençlerini 10 daha düşükmüş gibi değerlendirin. Her yaratık, beş hasar türünün tümü için geçerli olan tek bir temel Refleks kurtarışı dener. Eti eriten asit yağmuru 3d10 asit hasarı verir. Kükreyen bir deprem yerdeki yaratıkları sarsar ve hırpalar, 3d10 ezici hasar verir. Dondurucu bir rüzgâr patlaması 3d10 soğuk hasarı verir. İnanılmaz bir yıldırım alanı kırbaçlar, 3d10 elektrik hasarı verir. Çırpınan rüzgârlar gökyüzünü çalkalar, alanda uçan yaratıklara 3d10 ezici hasar verir. Anlık bir tsunami alandaki yaratıkları süpürür, su özelliğine sahip 3d10 ezici hasar verir (alanda yüzen yaratıklar için ikiye katlanır). Muazzam bir orman yangını ani bir cehennemde alevlenir, 3d10 ateş hasarı verir.

omen://spell/caustic-blast?source=paizo-pathfinder-player-core:
  name: Kostik Patlama
  description: "Hemen infilak eden ve yakındaki yaratıklara sıçrayan büyük bir asit damlası fırlatırsınız. Alandaki yaratıklar temel bir Refleks kurtarışıyla 1d8 asit hasarı alır; kritik başarısızlıkta yaratık ayrıca (1+floor((spell rank -1)/2))[persistent,acid] hasar alır. Güçlendirilmiş (+2) İlk hasar 1d8 artar ve kritik başarısızlıktaki süren hasar 1 artar."

omen://spell/chain-lightning?source=paizo-pathfinder-player-core:
  name: Zincirleme Şimşek
  description: Hedefe güçlü bir yıldırım oku fırlatarak 8d12 elektrik hasarı verirsiniz. Hedef temel bir Refleks kurtarışı denemelidir. Elektrik, ilk hedefin 30 fiti içindeki başka bir yaratığa yayılır, o hedefin 30 fiti içindeki başka bir yaratığa atlar ve bu şekilde devam eder. Zinciri herhangi bir noktada sonlandırabilirsiniz. Aynı yaratığı birden fazla kez hedefleyemezsiniz ve tüm hedeflere etki hattınız olmalıdır. Hasar zarını yalnızca bir kez atın ve her hedefe uygulayın (kurtarış sonucuna göre uygun şekilde yarıya indirin veya ikiye katlayın). Hedeflerden herhangi biri kurtarışta kritik başarı elde ederse zincir sona erer. Güçlendirilmiş (+1) Hasar 1d12 artar.

omen://spell/charm?source=paizo-pathfinder-player-core:
  name: Büyüle
  description: "Hedefe göre sözleriniz bal gibidir ve çehreniz rüya gibi bir pusla kaplanmış gibi görünür. Siz veya müttefikleriniz yakın zamanda onu tehdit ettiyse veya ona karşı düşmanca eylemler kullandıysa +4 durumsal bonus ile bir İrade kurtarışı denemelidir. Büyüyü Sonlandırabilirsiniz. Hedefe karşı düşmanca eylemler kullanırsanız büyü sona erer. Büyü sona erdiğinde, sizinle olan dostluğu veya onu yapmaya ikna ettiğiniz eylemler beklentileriyle çelişmediği sürece hedef büyülendiğini mutlaka fark etmez; bu da hedefi sıradan yollarla dostunuz olmaya devam etmesi için ikna edebileceğiniz anlamına gelir. Kritik Başarı Hedef etkilenmez ve onu büyülemeye çalıştığınızın farkındadır. Başarı Hedef etkilenmez ancak büyüyü tanımlamadığı sürece büyünüzün büyüleme yerine zararsız bir şey olduğunu düşünür. Başarısızlık Hedefin size karşı tutumu Dostça olur. Zaten Dostça idiyse Yardımsever olur. Size karşı düşmanca eylemler kullanamaz. Kritik Başarısızlık Hedefin size karşı tutumu Yardımsever olur ve size karşı düşmanca eylemler kullanamaz. Güçlendirilmiş (4.) Süre, bir sonraki günlük hazırlıklarınızı yapacağınız zamana kadar sürer. Güçlendirilmiş (8.) Süre, bir sonraki günlük hazırlıklarınızı yapacağınız zamana kadar sürer ve 10 adede kadar yaratığı hedefleyebilirsiniz."

omen://spell/charming-push?source=paizo-pathfinder-player-core:
  name: Cazibeli İtiş
  description: Öfkesini saptırmak için hedefin zihnini itersiniz. Hedef bir İrade kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedef, size karşı saldırı zarlarına ve hasar zarlarına –1 durumsal ceza alır. Başarısızlık Hedef size karşı düşmanca eylemler kullanamaz. Kritik Başarısızlık Hedef Sersemlemiş 1 olur ve size karşı düşmanca eylemler kullanamaz.

omen://spell/charming-touch?source=paizo-pathfinder-player-core:
  name: Cazibeli Dokunuş
  description: Hedefinize çekim aşılayarak size karşı daha dostça davranmasını sağlarsınız. Hedef bir İrade kurtarışı dener. Siz veya müttefikleriniz yakın zamanda onu tehdit ettiyse veya ona düşmanca davrandıysa bu kurtarışa +4 durumsal bonus kazanır. Kritik Başarı Hedef etkilenmez ve onu büyülemeye çalıştığınızın farkındadır. Başarı Hedef etkilenmez ancak büyüyü tanımlamadığı sürece büyünüzün cazibeli dokunuş yerine zararsız bir şey olduğunu düşünür. Başarısızlık Hedefin size karşı tutumu Dostça olur. Zaten Dostça idiyse Yardımsever olur. Size karşı düşmanca eylemler kullanamaz. Hedefe karşı düşmanca bir eylem kullanırsanız büyü sona erer. Büyüyü Sonlandırabilirsiniz. Büyü sona erdikten sonra, sizinle olan dostluğu veya onu yapmaya ikna ettiğiniz eylemler beklentileriyle çelişmediği sürece hedef büyülendiğini mutlaka fark etmez. Onu büyülediğinizi fark etmezse, sıradan yollarla dostunuz olmaya devam etmesi için onu potansiyel olarak ikna edebilirsiniz. Kritik Başarısızlık Başarısızlıktaki gibi, ancak hedef yardımseverdir.

omen://spell/chilling-darkness?source=paizo-pathfinder-player-core:
  name: Dondurucu Karanlık
  description: Şerli enerjiyle bezenmiş son derece soğuk bir karanlık ışını ateşlersiniz. Menzilli bir büyü saldırısı yapın. Işın 5d6 soğuk hasarı verir. Hedef mübarek özelliğine sahipse, fazladan 5d6 ruh hasarı verirsiniz. Kritik Başarı Hedef iki kat hasar alır. Başarı Hedef tam hasar alır. Işın büyülü bir ışık alanından geçerse veya büyülü ışıktan etkilenen bir yaratığı hedeflerse, dondurucu karanlık ışığı etkisizleştirmeye çalışır. Işının bir ışık alanından geçip geçmediğini belirlemeniz gerekiyorsa, kendiniz ile büyünün hedefi arasına bir hat çizin. Güçlendirilmiş (+1) Soğuk hasarı 2d6 artar ve mübarek yaratıklara karşı ruh hasarı 2d6 artar.

omen://spell/clairaudience?source=paizo-pathfinder-player-core:
  name: Duruişiti
  description: Menzil içindeki bir konumda (görüş hattınızın veya etki hattınızın dışında olsa bile) Görünmez, süzülen bir kulak yaratırsınız. Hareket edemez, ancak kulağın bulunduğu yerden sanki normal işitsel duyularınızı kullanıyormuşsunuz gibi duyabilirsiniz.

omen://spell/clairvoyance?source=paizo-pathfinder-player-core:
  name: Durugörü
  description: Menzil içindeki bir konumda (görüş hattınızın veya etki hattınızın dışında olsa bile) Görünmez, süzülen bir göz yaratırsınız. Göz hareket edemez, ancak normal görsel duyularınızı kullanıyormuşsunuz gibi o noktadan her yöne görebilirsiniz.

omen://spell/cleanse-affliction?source=paizo-pathfinder-player-core:
  name: İlleti Temizle
  description: Nazik onarıcı büyü, toksinlerin ve daha karmaşık illetlerin etkilerini geriletir. Hedef üzerindeki lanet, hastalık veya zehir gibi bir illeti seçin. Birinci aşamayı geçtiyse, aşamayı bir azaltın. Bu azaltma belirli bir illet vakasına yalnızca bir kez uygulanabilir ve vaka tamamen iyileştiğinde sona erer. Azaltma tekrar gerçekleşemese de bu büyünün güçlendirilmiş versiyonları her büyü yapmada etkisizleştirmeyi dener. Güçlendirilmiş (3.) Hastalık veya zehir ise illeti etkisizleştirmeyi deneyin. Güçlendirilmiş (4.) Lanet, hastalık veya zehir ise illeti etkisizleştirmeyi deneyin.

omen://spell/cleanse-cuisine?source=paizo-pathfinder-player-core:
  name: Sofrayı Arındır
  description: Alandaki tüm yiyecek ve içecekleri lezzetli ziyafetlere dönüştürür, suyu şaraba veya başka güzel bir içeceğe çevirir ya da yemeğin tadını ve malzemelerini zenginleştirerek onu gurme bir ziyafet hâline getirirsiniz. Ayrıca yiyeceklerden tüm toksinleri ve bulaşmaları temizlemeyi de seçebilirsiniz. Bu büyü gelecekteki bulaşmaları, doğal çürümeyi veya bozulmayı engellemez ve yiyecekleri daha besleyici kılmaz. Güçlendirilmiş (+2) Alana, geri kalanıyla bitişik olması gereken bir fit küp daha ekleyin.

omen://spell/clear-mind?source=paizo-pathfinder-player-core:
  name: Berrak Zihin
  description: "Hedefin zihninden zihinsel kirlenmeyi söküp atarsınız. Hedefe şu durumlardan birini dayatan seçtiğiniz bir etkiyi etkisizleştirmeyi deneyin: Kaçan, Korkmuş ve Zihni Bulanmış. Etkiyi etkisizleştirmede başarısız olduysanız ancak etkisizleştirme derecesi 2 daha düşük olsaydı başaracak idiyseniz, bunun yerine etkiyi bir sonraki sıranızın başlangıcına kadar bastırın. Etki bastırılmışken süresi işlemez. Bu büyü lanetlerin, hastalıkların veya hedefin doğal bir durumunun parçası olan durumları etkisizleştiremez veya bastıramaz. Güçlendirilmiş (4.) Durumlar listesine Aklı Bulanmış, Kontrol Edilen ve Yavaşlatılmış durumlarını ekleyin. Güçlendirilmiş (6.) 4. derecedeki gibi, artı Lanetlenmiş durumunu ekleyin. Güçlendirilmiş (8.) 4. derecedeki gibi, artı lanetlenmiş ve Sersemlemiş durumlarını ekleyin."

omen://spell/clinging-ice?source=paizo-pathfinder-player-core:
  name: Yapışkan Buz
  description: Dondurucu sulusepken ve yoğun kar yağışı hedefin ayaklarında ve bacaklarında toplanarak 1d4 soğuk hasarı ve Refleks kurtarışına bağlı diğer etkileri verir. Kritik Başarı Hedef etkilenmez. Başarı Hedef yarı hasar alır. Başarısızlık Hedef tam hasar alır ve büyü sona erene kadar Hızlarına –5 fitlik bir durumsal ceza alır. Kritik Başarısızlık Hedef iki kat hasar alır ve büyü sona erene kadar Hareket Hızlarına –10 fitlik bir durumsal ceza alır. Güçlendirilmiş (+1) Hasar 1d4 artar.

omen://spell/cloak-of-shadow?source=paizo-pathfinder-player-core:
  name: Gölge Pelerini
  description: "Hedefi görülmesini zorlaştıran dönen gölgelerden bir örtüyle sararsınız. Pelerin, 20 fitlik bir yayılım içindeki parlak ışığı loş ışığa düşürür. Bu büyülü bir karanlık formudur ve bu nedenle büyülü olmayan ışığın üstesinden gelebilir veya büyülü ışığı etkisizleştirmeye çalışabilir. Hedef Saklanmak için gölgelerden kazanılan Belirsiz durumunu kullanabilir; ancak dikkatli yaratıklar hareket eden gölge aurasını yine de takip edebilir, bu da hedefin tamamen Konumu Saptanmamış hâle gelmesini zorlaştırır. Hedef pelerini çıkarmak ve arkasında bir yem olarak bırakmak için bir Etkileşime Gir eylemi kullanabilir; pelerin orada kalarak büyünün süresinin geri kalanı boyunca ışığı azaltır. Pelerin asıl hedef tarafından çıkarıldıktan sonra birisi onu alırsa, pelerin buharlaşır ve büyü sona erer."

omen://spell/collective-memories?source=paizo-pathfinder-player-core:
  name: Kolektif Bellek
  description: "Bir konu hakkında diğer ölümlülerin anılarına, bilgilerine, efsanelerine, hikâyelerine ve ilimlerine erişirsiniz. Konu önemli bir kişi, yer veya nesne olmalıdır. Konu mevcutsa, birincil beceri testinizin başarı derecesini bir basamak artırın. Ritüeli denemeden önce konu hakkında yalnızca belirsiz bilgilere sahipseniz, birincil beceri testinizin başarı derecesini bir basamak düşürün. Az veya hiç temel bilgi olmadan konunun mevcut olması durumunda bu değiştiriciler birbirini götürür. Kritik Başarı Ritüel sona erdikten sonraki 1 saat boyunca, çoğunlukla tutarlı olan anıları ayıklar; yanlış hatırlanan bilgiler veya abartılı hikâyeler yerine daha doğru ya da faydalı bilgilere ağırlık verirsiniz. Başarı Ritüel sona erdikten sonraki 1 saat boyunca, daha ileri araştırmalar için faydalı ancak genellikle eksik veya muğlak kalan bilgiler öğrenirsiniz. Ölümlü hafızasının ve hikâyelerinin doğası gereği, birden fazla çelişkili versiyon öğrenmeniz muhtemeldir. Başarısızlık Hiçbir faydalı efsane öğrenemezsiniz. Kritik Başarısızlık Zihniniz elinizin altındaki engin bilgi yığını karşısında afallar. Nefes almak ve uyumak gibi temel ihtiyaçları yerine getirmek dışında 1 hafta boyunca şimdiki zamanda hiçbir şeyi algılayamaz veya tepki veremezsiniz. Ancak iyileştiğinizde, sanki 1 hafta boyunca yeniden eğitim almış gibi, eriştiğiniz bir konunun bilgisine dayanan bir İlim becerisine becerilerinizden birini yeniden eğitebilirsiniz."

omen://spell/command?source=paizo-pathfinder-player-core:
  name: Emret
  description: Göz ardı edilmesi zor bir emir haykırırsınız. Hedefe size yaklaşmasını, kaçmasını (Kaçan durumuna sahipmiş gibi), elinde tuttuğu şeyi bırakmasını, Yüzüstü yere yatmasını veya olduğu yerde durmasını emredebilirsiniz. Emrinize itaat edene kadar Erteleyemez veya herhangi bir reaksiyon alamaz. Etkiler hedefin İrade kurtarışına bağlıdır. Başarı Yaratık etkilenmez. Başarısızlık Yaratık bir sonraki sırasındaki ilk eylem için, emrettiğiniz şeyi yapmak üzere tek bir eylem kullanmalıdır. Kritik Başarısızlık Hedef bir sonraki sırasındaki tüm eylemlerini emrinize uymak için kullanmalıdır. Güçlendirilmiş (5.) 10 adede kadar yaratığı hedefleyebilirsiniz.

omen://spell/commanding-lash?source=paizo-pathfinder-player-core:
  name: Emir Kırbacı
  description: Daha fazla acı tehdidiyle, yakın zamanda zarar verdiğiniz bir yaratığı mecbur bırakırsınız. Hedefe Emret büyüsünün etkileriyle bir emir verirsiniz. Hedef Korkmuş, Zihni Bulanmış ise veya süren hasar alıyorsa, kurtarışa –2 durumsal ceza alır. Sonuca bakılmaksızın, hedef ardından 1 saat boyunca geçici olarak bağışık olur.
  requirements: En son eyleminiz bir hedefe hasar vermiş olmalıdır.

omen://spell/commune?source=paizo-pathfinder-player-core:
  name: İstişare
  description: "Soruları yanıtlaması için bilinmeyen, güçlü bir varlığı çağırırsınız. Varlık, birincil test için kullanılan beceriye bağlı olarak değişir. Doğa 3 mil yarıçap içindeki hayvanlar, canavarlar, periler, mantarlar, bitkiler, topografya ve doğal kaynaklar hakkında bilgi sahibi olan doğanın doğal ruhları. Okültizm Unutulmuş bilgiler, düzlemler, karanlık sırlar ve diğer ezoterik konular hakkında bilgi sahibi olan elementaller, unutulmuş ruhlar ve gözlemciler gibi düzlemsel ve diğer gizemli varlıklar. Din Hizmet ettikleri tanrılar ve tanrının ilgili etki alanı hakkında bilgi sahibi olan semaviler ve iblisler gibi ilahi varlıklar; varsa bunlar tipik olarak tanrınızın bir hizmetkârıdır. \"Evet\" veya \"Hayır\" ile yanıtlanabilecek yedi adede kadar soru sorabilirsiniz. Varlık \"Evet\", \"Hayır\", \"Muhtemelen\" ve \"Bilinmiyor\" gibi tek kelimelik yanıtlar verir; ancak yanıtları her zaman kendi ajandasını yansıtır ve aldatıcı olabilir. Kritik Başarı Çıkarlarınızla güçlü bir şekilde örtüşen daha güçlü bir varlıkla, muhtemelen bizzat tanrınızla temas kurarsınız. Varlık sizi aldatmaya çalışmaz, ancak yine de yanıtları bilmeyebilir. Netlik sağlamak önemli olduğunda varlık, sorularınızı \"Derhal ayrılırsanız\" veya \"Bu bir zamanlar doğruydu\" gibi beş kelimeye kadar yanıtlar. Başarı Sorularınızı sorabilir ve yanıtlar alabilirsiniz. Başarısızlık Uygun bir varlıkla temas kuramazsınız. Kritik Başarısızlık Kozmosun muazzamlığına maruz kalırsınız ve 1 hafta boyunca Zihni Bulanmış 4 olursunuz (hiçbir yolla giderilemez)."

omen://spell/community-restoration?source=paizo-pathfinder-player-core:
  name: Topluluk Yenilenmesi
  description: >
    Tetikleyici Bir Wizard büyü slotundan bir Büyü Yaparsınız ve büyü, bir veya daha fazla gönüllü müttefiki onlara zarar vermeden etkiler.

    Büyünüzü müttefiklerinizi desteklemek için kullandığınızda, paylaşılan güç hepinizi canlandırır. Tetikleyici büyünün derecesi başına 2 geçici Can Puanı kazanırsınız ve tetikleyici büyüden etkilenen müttefikler arasında seçtiğiniz şekilde bölünmüş eşit sayıda geçici Can Puanı bahşedebilirsiniz. Bu geçici Can Puanları 1 dakika sürer.

omen://spell/competitive-edge?source=paizo-pathfinder-player-core:
  name: Rekabetçi Üstünlük
  description: Rekabetçiliğiniz sizi rakiplere karşı kendinizi kanıtlamaya iter. Saldırı zarlarına ve beceri testlerine +1 statü bonusu kazanırsınız. 20 fit içindeki bir düşman bir saldırı zarında veya beceri testinde kritik başarı elde ederse, statü bonusunuz 1 tur boyunca saldırı zarları veya o belirli beceri testi için (düşman hangisinde kritik başarı elde ettiyse) +3'e yükselir. Güçlendirilmiş (7.) Temel bonusu +2'ye ve bir düşman kritik başarı elde ettikten sonraki artırılmış bonusu +4'e çıkarın.

omen://spell/confusion?source=paizo-pathfinder-player-core:
  name: Zihin Bulanıklığı
  description: Garip dürtülerle hedefinizin aklını bulandırarak rastgele davranmasına neden olursunuz. Etkiler hedefin İrade kurtarışı ile belirlenir. Büyüyü Sonlandırabilirsiniz. Kritik Başarı Hedef etkilenmez. Başarı Hedef anlaşılmaz bir şekilde geveler ve Sersemlemiş 1 olur. Başarısızlık Hedef 1 dakika boyunca Aklı Bulanmış olur. Zihin bulanıklığını sona erdirmek için sıralarının her birinin sonunda yeni bir kurtarış deneyebilir. Kritik Başarısızlık Hedef 1 dakika boyunca Aklı Bulanmış olur ve erken sona erdirmek için kurtarış yapamaz. Güçlendirilmiş (8.) 10 adede kadar yaratığı hedefleyebilirsiniz.

omen://spell/consecrate?source=paizo-pathfinder-player-core:
  name: Mübarek Kıl
  description: >
    Alan Tanrınızın hareketsiz bir sunağı, mabedi veya sabit donanımı etrafında 40 fit yarıçaplı patlama İkincil Büyücüler 2, dininizin inananları olmalıdır

    Övgüler söyleyip mübarek bir alan yaratarak bir mekânı tanrınıza adarsınız. Alandayken, tanrınızın inananları saldırı zarlarına, beceri testlerine, kurtarışlara ve Dikkat testlerine +1 statü bonusu kazanır; tanrınız için yasak olan yaratıklar (Pharasma veya Sarenrae için hortlaklar gibi) ise bu zarlara -1 statü cezası alır. Tanrınızın ilahi kerameti mübarek veya şerli arasında seçim yapmanıza izin veriyorsa, adanmış mekânı da mübarek ya da şerli yapmayı seçebilirsiniz. Tanrının kutsamasının mübarek veya şerli olması gerekiyorsa mekânı bu kerametle eşleştirmeniz gerekir. Tanrınızın inananları tarafından alan içinde yapılan Vuruşlar, varsa mekânın keramet etiketini kazanır.

    Kritik Başarı Adama başarılı olur ve ya 1 yerine 10 yıl sürer ya da iki kat yarıçapa sahip bir alanı kapsar. Bazen tanrınızın lütfuyla bu, kalıcı olarak adanmış bir alan veya tüm bir katedrali kapsayan etki gibi daha da muhteşem bir etki üretebilir.

    Başarı Adama başarılı olur.

    Başarısızlık Adama başarısız olur.

    Kritik Başarısızlık Adama feci bir şekilde başarısız olur ve bir hoşnutsuzluk işareti gönderen tanrınızı öfkelendirir. En az 1 yıl boyunca alanı kutsama girişimleri başarısız olur.

    Güçlendirilmiş (7.) Adanmış alan ayrıca düzlemsel mühür büyüsünün etkilerini kazanır, ancak etki tanrınızın inananlarının ışınlanmasını etkisizleştirmeye çalışmaz. Maliyet 200 gp × büyü derecesine yükselir.

omen://spell/contingency?source=paizo-pathfinder-player-core:
  name: İhtiyat Büyüsü
  description: >
    Daha sonra tetiklenecek bir büyü hazırlarsınız. İhtiyat büyüsünü yaparken, büyü yapma süresi en fazla 3 eylem olan 4. derece veya daha düşük bir başka büyüyü de yaparsınız. Bu eşlikçi büyü sizi etkileyebilecek bir büyü olmalıdır. Enerjiye diren gibi büyüler için bir hasar türü seçmek de dahil olmak üzere, büyüye dair tüm kararları ihtiyat büyüsünü yaparken vermelisiniz. Büyüyü yaparken, Hazırlan eyleminin tetikleyicisiyle aynı kısıtlamaları kullanarak büyünün ne zaman yapılacağını belirleyen bir tetikleyici seçin. İhtiyat büyüsü yapıldıktan sonra, bu tetikleyici gerçekleştiğinde eşlikçi büyünün bir reaksiyon olarak devreye girmesini sağlayabilirsiniz. Daha fazla yaratığı etkileyebilecek olsa bile yalnızca sizi etkiler. GM tarafından belirlendiği üzere karmaşık koşullar tanımlarsanız, tetikleyici başarısız olabilir. Tekrar ihtiyat büyüsü yaparsanız, yeni yapış eskisinin yerine geçer.

    Güçlendirilmiş (8.) 5. derece veya daha düşük bir büyü seçebilirsiniz.

    Güçlendirilmiş (9.) 6. derece veya daha düşük bir büyü seçebilirsiniz.

    Güçlendirilmiş (10.) 7. derece veya daha düşük bir büyü seçebilirsiniz.

omen://spell/control-water?source=paizo-pathfinder-player-core:
  name: Suyu Kontrol Et
  description: Alan 50 fit uzunluğunda, 50 fit genişliğinde İradenizi suya dayatarak, seçilen alandaki su seviyesini 10 fit yükseltebilir veya alçaltabilirsiniz. Su özelliğine sahip olan ve Büyüyü Yaptığınızda alanda bulunan yaratıklar, Yavaşlat büyüsünün etkilerine tabi olarak bir Dayanıklılık kurtarışı denemelidir.

omen://spell/control-weather?source=paizo-pathfinder-player-core:
  name: Havayı Kontrol Et
  description: >
    Alan merkezinde sizin bulunduğunuz 2 mil yarıçaplı çember Havayı değiştirerek mevsime uygun biçimde sakin ve normal kılarsınız ya da mevsime bağlı olarak en fazla iki etki seçersiniz. İlkbahar çiseleme, sıcaklık, kasırga, sulusepken, gök gürültülü fırtına, hortum Yaz çiseleme, sağanak, aşırı sıcak, dolu, sıcaklık Sonbahar soğuk hava, sis, ılık sıcaklık, sulusepken Kış tipi, ılık soğuk, aşırı soğuk, çözülme Bir hortumun tam izleyeceği yol veya şimşek çarpmalarının hedefleri gibi tezahürleri tam olarak kontrol edemezsiniz.

    Kritik Başarı Havayı istediğiniz gibi değiştirirsiniz ve daha geniş bir alanı (5 mil yarıçaplı bir çembere kadar) ya da daha uzun bir süreyi (16d12'ye kadar herhangi bir sayıda ilave d12 saat) etkileyebilirsiniz.

    Başarı Havayı istediğiniz gibi değiştirirsiniz.

    Başarısızlık Havayı istediğiniz gibi değiştirmeyi başaramazsınız.

    Kritik Başarısızlık Hava, GM tarafından belirlenen ancak genellikle gerçek arzularınızla olabildiğince çelişen beklenmedik bir şekilde değişir (örneğin, güzel bir hava tercih ettiğinizde korkunç bir fırtına patlak verir).

    Güçlendirilmiş (9.) Aşırı soğuk ve bir kasırga gibi mevsim dışı hava durumları ve çelişkili hava etkileri yaratabilirsiniz. Havayı farklı bir mevsim için sakin ve normal kılabilir ya da herhangi bir mevsimin listesinden hava etkileri seçebilirsiniz.

omen://spell/cornucopia?source=paizo-pathfinder-player-core:
  name: Bereket Boynuzu
  description: >
    Sarmaşıklar ellerinizde örgü bir boynuza dönüşür ve içinden tek bir meyve, kuruyemiş veya benzeri küçük bir ürün dökülür. Bir Etkileşime Gir eylemiyle ürünü yiyen bir yaratık 1d6+4 CP geri kazanır. Bereket boynuzu ve tüketilmemiş tüm meyve parçaları sürenin sonunda solarak yok olur.

    Güçlendirilmiş (+1) Bereket boynuzu fazladan bir yiyecek üretir. Bir yaratık tek bir Etkileşime Gir eylemiyle aynı büyüden dilediği miktarda yiyecek tüketebilir. Bereket boynuzundan altı parça ürün yemek, tipik bir insan için doyurucu bir öğün kadar besin sağlar.

omen://spell/counter-performance?source=paizo-pathfinder-player-core:
  name: Karşı Performans
  description: >
    Tetikleyici: Siz veya 60 fit içerisindeki bir müttefikiniz, işitsel veya görsel bir etkiye karşı bir kurtarış yaptığında.

    Performansınız sizi ve müttefiklerinizi korur. Bildiğiniz bir türde Performans testi yapın; tetikleyici işitsel ise bu işitsel bir performans, görsel bir tetikleyici içinse görsel bir performans olmalıdır ve bu eylem o performans türünün özelliklerini kazanır. Siz ve alandaki müttefikleriniz, Performans testiniz ile kurtarış arasındaki daha iyi sonucu kullanabilirsiniz.

omen://spell/courageous-anthem?source=paizo-pathfinder-player-core:
  name: Cesaret Marşı
  description: Cesaret verici sözler veya ezgilerle kendinize ve müttefiklerinize ilham verirsiniz. Siz ve alandaki tüm müttefikleriniz saldırı zarlarına, hasar zarlarına ve korku etkilerine karşı kurtarışlara +1 statü bonusu kazanırsınız.

omen://spell/cozy-cabin?source=paizo-pathfinder-player-core:
  name: Sıcak Kulübe
  description: "Her bir kenarı 20 fit ve yüksekliği 10 fit olan bir kulübe biçimlendirirsiniz. Bu kulübe yapı özelliğine ve yapılar oluşturan büyülü eşyalarla aynı kısıtlamalara sahiptir. Kulübenin duvarları basit ve ahşaptır, küçük kare cam pencereleri ve bir ahşap kapısı vardır. Kendi kilidi yoktur, ancak kilit takılabilecek bir sürgüsü bulunur. İçeride üç portatif karyola, bir oturak ve büyülü bir ateş barındıran küçük bir şömine yer alır. İç mekân, bir Sürdür eylemi kullanarak dilediğiniz zaman yakıp söndürebileceğiniz küçük bir büyülü ışıkla aydınlatılır. Kulübenin içindeki iklim konforludur ve içerideki yaratıkların çoğu zorlu hava koşullarına dayanmasını sağlar; ancak akıl almaz sıcak veya soğuk, güçlü fırtınalar ve kasırga gücünde veya daha büyük rüzgârlar kulübeyi yok eder. Diğer yaratıklar kulübeye zarar vermeden serbestçe girip çıkabilir, ancak kulübeden çıkarsanız büyü sona erer. Büyüyü Sonlandırabilirsiniz."

omen://spell/create-food?source=paizo-pathfinder-player-core:
  name: Yiyecek Yarat
  description: >
    Orta boy altı yaratığı bir gün boyunca doyurmaya yetecek yiyecek yaratırsınız. Bu yiyecek yavan ve çekicilikten uzaktır, ancak besleyicidir. 1 gün sonra, kimse yiyeceği yememişse çürür ve yenmez hale gelir. Çoğu Küçük yaratık, Orta boy bir yaratığın dörtte biri kadar (çoğu Minik yaratık için on altıda biri kadar), çoğu Büyük yaratık ise 10 katı kadar yer (İri yaratıklar için 100 katı vb.).

    Güçlendirilmiş (4.) 12 Orta boy yaratığı besleyebilirsiniz.

    Güçlendirilmiş (6.) 50 Orta boy yaratığı besleyebilirsiniz.

    Güçlendirilmiş (8.) 200 Orta boy yaratığı besleyebilirsiniz.

omen://spell/create-undead?source=paizo-pathfinder-player-core:
  name: Hortlak Yarat
  description: >
    Hedefi, Yaratık Yaratma Ritüelleri tablosunda izin verilen seviyeye kadar bir hortlak yaratığa dönüştürürsünüz. Bu ritüelin belirli bir hortlak türüne özel birçok versiyonu vardır (tüm zombiler için bir ritüel, iskeletler için bir ritüel, gulyabaniler için bir ritüel vb.) ve nadir hortlaklar yaratan ritüeller de nadirdir. Liçler gibi bazı hortlak biçimleri kendi benzersiz yöntemleriyle oluşur ve hortlak yarat ritüelinin bir versiyonuyla yaratılamaz.

    Kritik Başarı Hedef uygun türde bir hortlak yaratığa dönüşür. Sizden en az 4 seviye düşükse onu bir minyon yapabilirsiniz. Bu ona minyon özelliği kazandırır; yani siz ona emrettiğinizde 2 eylem kullanabilir ve ona emretmek işitsel ve odaklanma özelliklerine sahip tek bir eylemdir. Kontrolünüz altında en fazla dört minyon bulundurabilirsiniz. Eğer zekiyse ve minyonunuz olmazsa, yine de korkunç ve kötü bir yaratık olmasına rağmen, onu uyandırdığınız için size yardımcı olur. Zeki değilse ve minyonunuz olmazsa ona basit bir emir verebilirsiniz. Sonraki emirlerinizi görmezden gelerek tek bir amaçla bu hedefin peşinden gider.

    Başarı Kritik başarıdaki gibidir; ancak minyonunuz olmayan zeki bir hortlak size yalnızca dostane davranır ve minyonunuz olmayan zekasız bir hortlak, ona saldırmadığınız sürece sizi rahat bırakır. Emrinizi yerine getirmek yerine bölgeyi yağmalar.

    Başarısızlık Hortlağı yaratamazsınız.

    Kritik Başarısızlık Hortlağı yaratırsınız, ancak iğrenç ölüm büyünüz tarafından işkence gören ruhu size karşı nefretten başka bir şey hissetmez. Sizi yok etmeye çalışır.

    Yaratık Yaratma Ritüelleri Yaratık Seviyesi Gereken Büyü Derecesi Maliyet -1 veya 0 2 15 gp 1 2 60 gp 2 3 105 gp 3 3 180 gp 4 4 300 gp 5 4 480 gp 6 5 750 gp 7 5 1.080 gp 8 6 1.500 gp 9 6 2.100 gp 10 7 3.000 gp 11 7 4.200 gp 12 8 6.000 gp 13 8 9.000 gp 14 9 13.500 gp 15 9 19.500 gp 16 10 30.000 gp 17 10 45.000 gp

omen://spell/create-water?source=paizo-pathfinder-player-core:
  name: Su Yarat
  description: Ellerinizi çanak gibi açtığınızda, içlerinden su akmaya başlar. 2 galon su yaratırsınız. Kimse içmezse, 1 gün sonra buharlaşır.

omen://spell/creation?source=paizo-pathfinder-player-core:
  name: Yaratım
  description: >
    Büyülü enerjiden geçici bir nesne var edersiniz. Toprak veya bitki kökenli maddelerden (ahşap, kâğıt, tuğla veya taş gibi) oluşmalı ve 5 fit küp veya daha küçük olmalıdır. Karmaşık bir işçiliğe veya karmaşık hareketli parçalara dayanamaz, asla bir maliyeti veya benzerini karşılamaz ve değerli malzemelerden ya da yaygın olmayan veya daha yüksek nadirlikteki malzemelerden yapılamaz. Belirgin şekilde geçici olarak yaratılmıştır ve bu nedenle satılamaz veya gerçek bir eşya olarak yutturulamaz. Büyü, yaratılan eşya için uygun özelliği (genellikle toprak, bitki veya ahşap) kazanır.

    Güçlendirilmiş (5.) Eşya metaldir ve feldispat veya kuvars gibi yaygın mineralleri içerebilir. Büyü, metal bir nesne yaratmak için kullanılırsa metal özelliği kazanır.

omen://spell/creative-splash?source=paizo-pathfinder-player-core:
  name: Yaratıcı Sıçrama
  description: Kişisel yaratıcı uzmanlığınızı yansıtan bir boya veya renkli yanılsama seli alanın üzerine çöker. Yanılsamanın rengini belirlemek için 1d4 atın. Alandaki her yaratık bir İrade kurtarışı denemeli veya renk için tabloda listelenen etkiyi almalıdır. 1d4 Renk Başarısızlık Kritik Başarısızlık 1 Beyaz 1 tur boyunca Gözü Kamaşmış 1 dakika boyunca Gözü Kamaşmış 2 Kırmızı 1 tur boyunca Halsiz 1 1 tur boyunca Halsiz 2 3 Sarı Korkmuş 1 Korkmuş 2 4 Mavi 1 tur boyunca Sakar 1 1 tur boyunca Sakar 2

omen://spell/crisis-of-faith?source=paizo-pathfinder-player-core:
  name: İnanç Bunalımı
  description: >
    Hedefin inancına saldırarak, yaratığı 6d6 zihinsel hasar veya ilahi büyüler yapabiliyorsa 6d8 zihinsel hasar veren şüphe ve zihinsel çalkantıyla doldurursunuz. Etkiler İrade kurtarışına göre belirlenir. Birçok ilah için, bu büyüyü önemli bir neden olmaksızın kendi ilahınızın bir takipçisine yapmak anathema sayılır.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef yarı hasar alır.

    Başarısızlık Hedef tam hasar alır; hedef ilahi büyüler yapabiliyorsa, 1 tur boyunca Zihni Bulanmış 1 olur.

    Kritik Başarısızlık Hedef iki kat hasar alır, 1 tur boyunca Zihni Bulanmış 1 olur ve 1 tur boyunca ilahi büyüleri yapamaz.

    Güçlendirilmiş (+1) Hasar 2d6 artar (veya hedef bir ilahi büyücüyse 2d8 artar).

omen://spell/cry-of-destruction?source=paizo-pathfinder-player-core:
  name: Yıkım Çığlığı
  description: >
    Sesiniz gürleyerek önünüzdeki her şeyi ezer geçer. Alandaki her yaratık ve sahipsiz nesne 1d8 sonik hasar alır. Bu tur bir Vuruş veya büyüyle bir düşmana zaten hasar verdiyseniz, bu büyünün hasar zarlarını d12'ye yükseltin.

    Güçlendirilmiş (+1) Hasar 1d8 artar.

omen://spell/curse-of-death?source=paizo-pathfinder-player-core:
  name: Ölüm Laneti
  description: "Haminiz elini hedefinizin kalbine dolar. Hedef bir Dayanıklılık kurtarış denemelidir. Sonuca bakılmaksızın hedef 1 gün boyunca tüm ölüm lanetlerine karşı geçici olarak bağışık olur. Kritik Başarı Hedef etkilenmez. Başarı Hedef 1. aşamada ölüm lanetine yakalanır ve lanetin aşaması 1. aşamanın ötesine geçemez. Başarısızlık Hedef 1. aşamada ölüm lanetine yakalanır. Kritik Başarısızlık Hedef 2. aşamada ölüm lanetine yakalanır Ölüm Laneti (lanet, ölüm, boşluk) Bu lanet büyü sona erdiğinde sona erer Aşama 1 (max(4,(spell rank)-1))d6[void] hasar ve Yorgun (1 tur) Aşama 2 (max(8,spell rank+3))d6[void] hasar ve yorgun (1 tur) Aşama 3 (max(12,spell rank+7))d6[void] hasar ve yorgun (1 tur) Aşama 4 ölüm Güçlendirilmiş (+1) Bir başarıda ve lanetin ilk üç aşaması boyunca alınan boşluk hasarını 1d6 artırın."

omen://spell/cursed-metamorphosis?source=paizo-pathfinder-player-core:
  name: Lanetli Başkalaşım
  description: >
    Hedef yaratığı, Dayanıklılık kurtarışına bağlı etkilerle, bölgeye uygun zararsız bir hayvana dönüştürürsünüz.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedefin bedeni zararsız hayvanın küçük niteliklerini kazanır. Kısmen dönüştükçe içi altüst olur ve Midesi Bulanmış 1 durumuna düşmesine neden olur. Midesi bulanmış durumundan kurtulduğunda nitelikleri normale döner.

    Başarısızlık Hedef 1 dakika boyunca dönüşür ancak zihnini korur. Turundaki tüm eylemlerini orijinal formuna odaklanarak harcarsa, etkiyi derhal sonlandırmak için bir İrade kurtarışı deneyebilir.

    Kritik Başarısızlık Hedef, sınırsız bir süre boyunca bedenen ve zihnen seçilen zararsız hayvana dönüştürülür.

omen://spell/darkened-sight?source=paizo-pathfinder-player-core:
  name: Karartılmış Görüş
  description: Bir yaratığın görüşünü karanlıkla doldurursunuz. Üstün karanlıkgörüş kazanarak büyülü karanlıkta bile görmesini sağlarsınız.

omen://spell/darkness?source=paizo-pathfinder-player-core:
  name: Karanlık
  description: >
    Işığın alana girmesini veya alanın içinde yayılmasını engelleyen bir karanlık örtüsü yaratırsınız. Işık alana giremez ve meşale ya da fener gibi büyü kaynaklı olmayan hiçbir ışık kaynağı, ışık yarıçapı karanlığın ötesine uzansa bile alanın içindeyken ışık yaymaz. Bu aynı zamanda karanlık büyünüzün derecesindeki veya daha düşük derecedeki büyülü ışığı da bastırır. Işık geçemediği için alandaki yaratıklar dışarıyı göremez. Dışarıdan bakıldığında saf bir karanlık küresi olarak görünür.

    Güçlendirilmiş (4.) Karanlıkgörüşe sahip yaratıklar bile (ancak üstün karanlıkgörüşü olanlar değil) karanlığın içini güçlükle görebilir. Karanlığın içinden görülen hedefleri Belirsiz olarak kabul ederler.

omen://spell/darkvision?source=paizo-pathfinder-player-core:
  name: Karanlıkgörüş
  description: >
    Karanlık alanlarda kendinize doğaüstü bir görüş bahşedersiniz. Karanlıkgörüş kazanırsınız.

    Güçlendirilmiş (3.) Büyünün menzili dokunuş olur ve 1 gönüllü yaratığı hedefler.

    Güçlendirilmiş (5.) Büyünün menzili dokunuş olur ve 1 gönüllü yaratığı hedefler. Süresi bir sonraki günlük hazırlıklarınızı yapana kadardır.

omen://spell/daze?source=paizo-pathfinder-player-core:
  name: Sersemlet
  description: >
    Hedefin zihnine girerek onu zihinsel bir sarsıntıyla sersemletirsiniz. Sarsıntı, temel bir İrade kurtarışıyla 1d6 zihinsel hasar verir. Hedef kurtarışta kritik başarısızlık yaşarsa, aynı zamanda Sersemlemiş 1 olur.

    Güçlendirilmiş (+2) Hasar 1d6 artar.

omen://spell/dazzling-flash?source=paizo-pathfinder-player-core:
  name: Göz Kamaştıran Parıltı
  description: >
    Dini sembolünüzü kaldırır ve kör edici bir ışık parıltısı yaratırsınız. Alandaki her yaratık bir Dayanıklılık kurtarışı denemelidir.

    Kritik Başarı Yaratık etkilenmez.

    Başarı Yaratık 1 tur boyunca Gözü Kamaşmış olur.

    Başarısızlık Yaratık 1 tur boyunca Kör ve 1 dakika boyunca Gözü Kamaşmış olur. Yaratık, Kör durumunu sonlandırmak için gözlerini ovuşturarak bir Etkileşime Gir eylemi harcayabilir.

    Kritik Başarısızlık Yaratık 1 tur boyunca Kör ve 1 saat boyunca Gözü Kamaşmış olur.

    Güçlendirilmiş (3.) Alan 30 fitlik bir koniye genişler.

omen://spell/deafness?source=paizo-pathfinder-player-core:
  name: Sağırlık
  description: >
    Hedef işitme duyusunu kaybeder; bir Dayanıklılık kurtarışı denemelidir. Hedef ardından 1 dakika boyunca geçici olarak bağışık olur.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef 1 tur boyunca Sağır olur.

    Başarısızlık Hedef 10 dakika boyunca Sağır olur.

    Kritik Başarısızlık Hedef kalıcı olarak Sağır olur.

omen://spell/deaths-call?source=paizo-pathfinder-player-core:
  name: Ölümün Çağrısı
  description: >
    Tetikleyici: Sizden 20 fit mesafedeki canlı bir yaratık öldüğünde veya sizden 20 fit mesafedeki bir hortlak yaratık yok edildiğinde.

    Bir başkasının bu dünyadan göçüşünü görmek sizi canlandırır. Tetikleyici yaratığın seviyesine büyücülük nitelik niteleyicinizin eklenmesine eşit geçici Can Puanı kazanırsınız. Tetikleyici yaratık bir hortlak ise kazandığınız geçici Can Puanı miktarını ikiye katlayın. Bunlar büyünün süresi boyunca devam eder ve tüm geçici Can Puanları daha önce tükenirse büyü sona erer.

omen://spell/deceivers-cloak?source=paizo-pathfinder-player-core:
  name: Düzenbazın Pelerini
  description: >
    Haminiz üzerinize bir yanılsama pelerini örterek sizinle kabaca benzer boy ve kiloda, aynı vücut şekline sahip başka bir yaratık gibi görünmenizi sağlar. Bu, 3. derece Yanılsama Kılık büyüsünün etkilerine sahiptir.

    Güçlendirilmiş (6.) Tamamen farklı bir vücut şekline sahip olsa bile, aynı boyuttaki herhangi bir yaratık gibi görünebilirsiniz.

omen://spell/delusional-pride?source=paizo-pathfinder-player-core:
  name: Kibir Yanılsaması
  description: >
    Hedefi aşırı özgüvenli hale getirerek başarısızlığı dış etkenlere bağlamasına yol açarsınız. Hedef, büyünün süresini belirlemek için bir İrade kurtarışı dener ve kurtarışın sonucuna bakılmaksızın 24 saat boyunca geçici olarak bağışık olur.

    Kritik Başarı Hedef etkilenmez.

    Başarı Süre 1 turdur. Hedef bir saldırı zarında veya beceri testinde başarısız olursa, sırasının sonuna kadar (veya zar sırasının dışında atılmışsa bir sonraki sırasının sonuna kadar) saldırı zarlarına ve beceri testlerine -1 statü cezası alır. Bu cezayı alırken yaratık ikinci kez başarısız olursa, ceza -2'ye yükselir.

    Başarısızlık Başarıdaki gibidir, ancak süre 10 dakikadır.

    Kritik Başarısızlık Başarıdaki gibidir, ancak süre 24 saattir.

omen://spell/desiccate?source=paizo-pathfinder-player-core:
  name: Kurut
  description: >
    Hedeflerin bedenlerindeki nemi çekerek 10d10 boşluk hasarı verirsiniz. Sudan oluşan yaratıklar (su elementalleri gibi) ve bitki yaratıkları, kurtarışların sonucundan bir derece daha kötü olan sonucu kullanırlar. Bedenleri kayda değer bir nem barındırmayan yaratıklar (toprak elementalleri gibi) kurut büyüsüne bağışıktır.

    Güçlendirilmiş (+1) Hasar 1d10 artar.

omen://spell/destructive-aura?source=paizo-pathfinder-player-core:
  name: Yıkıcı Aura
  description: >
    İlahi yıkımın girdap gibi dönen kumları sizi sararak dokundukları herkesin savunmasını zayıflatır. Kendinizin ve alandaki yaratıkların dirençlerini 2 azaltın.

    Güçlendirilmiş (+2) Dirençleri ilave 2 azaltın.

omen://spell/detect-magic?source=paizo-pathfinder-player-core:
  name: Büyü Tespit Et
  description: >
    Büyünün varlığını algılayan bir titreşim gönderirsiniz. Büyünün varlığı veya yokluğu dışında hiçbir bilgi alamazsınız. Kendinizin ve müttefiklerinizin büyülü eşyaları ve süregelen büyüleri gibi tam olarak farkında olduğunuz büyüleri görmezden gelmeyi seçebilirsiniz. İllüzyon büyüsünü yalnızca bu büyünün etkisi büyü tespit et büyünüzün derecesinden daha düşük bir dereceye sahipse tespit edebilirsiniz. Ancak yanılsama aurasına sahip olan ancak görünüşte aldatıcı olmayan eşyalar (görünmezlik iksiri gibi) genellikle normal şekilde tespit edilir.

    Güçlendirilmiş (3.) Büyünün tespit ettiği en güçlü büyülü etkinin derecesini veya seviyesini, GM tarafından belirlendiği üzere öğrenirsiniz.

    Güçlendirilmiş (4.) 3. derecedeki gibidir, ancak aynı zamanda en yüksek derecedeki büyünün kaynağını tam olarak belirlersiniz. Kesin olmayan bir duyuda olduğu gibi tam konumu öğrenemezsiniz, ancak kaynağı 5 fitlik bir küpe kadar daraltabilirsiniz (daha büyükse en yakın küpe).

omen://spell/detect-poison?source=paizo-pathfinder-player-core:
  name: Zehir Tespit Et
  description: >
    Bir yaratığın zehirli olup olmadığını veya bir nesnenin zehir olup olmadığını ya da zehirlenip zehirlenmediğini tespit edersiniz. Hedefin birden fazla şekilde zehirli olup olmadığını anlamaz, zehrin türünü veya türlerini de öğrenemezsiniz. Kurşun ve alkol gibi belirli maddeler zehirdir ve bu nedenle diğer zehirleri gizler.

    Güçlendirilmiş (2.) Zehirlerin sayısını ve türlerini öğrenirsiniz.

omen://spell/detect-scrying?source=paizo-pathfinder-player-core:
  name: Gözetleme Tespit Et
  description: >
    İz auralarını okuyarak alandaki gözetleme etkilerinin varlığını tespit edersiniz. Gözetleme tespit et büyüsü bir gözetleme etkisinden daha yüksek derecedeyse, gözetleyen yaratığı anlık olarak görür, yaklaşık mesafesini ve yönünü öğrenirsiniz.

    Güçlendirilmiş (6.) Süre bir sonraki günlük hazırlıklarınızı yapana kadardır.

omen://spell/detonate-magic?source=paizo-pathfinder-player-core:
  name: Büyü Patlat
  description: Hedefin içindeki büyünün yıkıcı bir patlamayla dağılmasına neden olursunuz. Hedefi etkisiz kılmayı denersiniz. Deneme başarılı olursa, büyülü kuvvet patlaması temel bir Refleks kurtarışıyla 8d6 kuvvet hasarı verir. Bir eşyanın büyüsünü başarıyla etkisiz kılarsanız, eşya 1 hafta boyunca devre dışı kalır (veya kritik başarıda yok edilir) ve patlama eşyadan 5 fitlik bir yayılım olur. Bir büyüyü başarıyla etkisiz kılarsanız, etki sona erer ve patlama ya büyünün alanındaki tüm yaratıkları ya da büyünün hedefini ve onun etrafındaki 5 fitlik yayılımdaki tüm yaratıkları etkiler.

omen://spell/dinosaur-form?source=paizo-pathfinder-player-core:
  name: Dinozor Formu
  description: >
    Doğanın ilkel güçlerini kanalize ederek Büyük bir hayvan savaş formuna, özellikle de güçlü ve dehşet verici bir dinozora dönüşürsünüz. Bu Büyüyü Yaptığınızda listelenen savaş formlarından birini seçin. Belirli hayvan türüne karar verebilirsiniz, ancak bunun formun Boyutu veya istatistikleri üzerinde hiçbir etkisi yoktur. Bu formdayken hayvan ve dinozor özelliklerini kazanırsınız. Büyüyü Sonlandırabilirsiniz. Hangi savaş formunu seçerseniz seçin aşağıdaki istatistikleri ve yetenekleri kazanırsınız: SD = 18 + seviyeniz. Zırhınızın kontrol cezasını ve Hareket Hızı düşüşünü yok sayın. 15 geçici Can Puanı. Loşgörüş ve 30 fit kesin olmayan koku. Seçtiğiniz savaş formuna özgü olan ve Vuruş Yapabileceğiniz yegâne saldırılar olan bir veya daha fazla silahsız yakın dövüş saldırısı. Bunlarda eğitimlisinizdir. Saldırı niteleyiciniz +16, hasar bonusunuz +9'dur. Bu saldırılar Kuvvet tabanlıdır (örneğin Halsiz durumu açısından). Silahsız saldırı niteleyiciniz daha yüksekse bunun yerine onu kullanabilirsiniz. Kendi niteleyiciniz daha yüksek olmadığı sürece Atletizm niteleyicisi +18. Ayrıca seçtiğiniz forma bağlı olarak belirli yetenekler kazanırsınız: Ankilozor Hareket Hızı 25 fit; Yakın Dövüş 1 kuyruk (savurma, erişim 10 fit), Hasar 2d6 ezici; Yakın Dövüş 1 ayak, Hasar 2d6 ezici. Brontozor Hareket Hızı 25 fit; Yakın Dövüş 1 kuyruk (erişim 15 fit), Hasar 2d6 ezici; Yakın Dövüş 1 ayak, Hasar 2d8 ezici. Daynonikus Hareket Hızı 40 fit; Yakın Dövüş 1 pençe (çevik), Hasar 2d4 delici artı 1 sürekli kanama; Yakın Dövüş 1 çene, Hasar 1d10 delici. Stegozor Hareket Hızı 30 fit; Yakın Dövüş 1 kuyruk (erişim 10 fit), Hasar 2d8 delici. Triseratops Hareket Hızı 30 fit; Yakın Dövüş 1 boynuz, Hasar 2d8 delici, kritik vuruşta artı 1d6 sürekli kanama; Yakın Dövüş 1 ayak, Hasar 2d6 ezici. Tiranozor Hareket Hızı 30 fit; Yakın Dövüş 1 çene (ölümcül d12, erişim 10 fit), Hasar 1d12 delici; Yakın Dövüş 1 kuyruk (erişim 10 fit), Hasar 1d10 ezici.

    Güçlendirilmiş (5.) Savaş formunuz İri boyuttadır ve saldırılarınız 15 fit erişime sahiptir (veya 15 fit erişimle başlamışlarsa 20 fit erişim). Bunun yerine 20 geçici CP, +18 saldırı niteleyicisi, +6 hasar bonusu, iki kat hasar zarı ve Atletizm +21 kazanırsınız.

    Güçlendirilmiş (7.) Savaş formunuz Devasa boyuttadır ve saldırılarınız 20 fit erişime sahiptir (veya 15 fit erişimle başlamışlarsa 25 fit erişim). Bunun yerine SD = 21 + seviyeniz, 25 geçici CP, +25 saldırı niteleyicisi, +15 hasar bonusu, iki kat hasar zarı ve Atletizm +25 kazanırsınız.

omen://spell/dirge-of-doom?source=paizo-pathfinder-player-core:
  name: Kıyamet Ağıtı
  description: Alandaki düşmanlar Korkmuş 1 olur. Alanda kaldıkları sürece korkmuş değerlerini 1'in altına indiremezler.

omen://spell/disappearance?source=paizo-pathfinder-player-core:
  name: Kayboluş
  description: Bir yaratığı başkalarının duyularından gizlersiniz. Hedef Görünmez olur, ancak bu yalnızca görme duyusuyla sınırlı değildir. Kayboluş büyüsünün bahşettiği görünmezlik, bir gözlemcinin sahip olabileceği tüm kesin duyular için geçerlidir. Bir yaratığın çeşitli duyuları kullanarak Araştır eylemiyle hedefi bulması, dağılmış toza bakması, ses tayfındaki boşlukları dinlemesi veya başka bir şekilde tespit edilemeyen bir yaratığın varlığını keşfetmenin başka bir yolunu bulması hâlâ mümkündür.

omen://spell/discern-secrets?source=paizo-pathfinder-player-core:
  name: Sırları Sez
  description: >
    Haminiz birkaç sır fısıldamayı lütfeder. Hedef serbest bir eylem olarak Bilgi Hatırla, Tara veya Niyetini Tart eylemini gerçekleştirebilir. Büyüyü Sürdürdüğünüz sürece hedef, zar için kullanılan istatistiğe (bir beceri veya Dikkat) +1 statü bonusu kazanır. Hedef 1 dakika boyunca sırları sez büyüsüne geçici olarak bağışık olur.

    Güçlendirilmiş (5.) Bir yerine iki yaratığı hedefleyebilirsiniz.

omen://spell/disguise-magic?source=paizo-pathfinder-player-core:
  name: Büyü Gizle
  description: >
    Bir eşyanın veya büyünün büyülü aurasının büyü tespit et gibi etkilere nasıl göründüğünü değiştirirsiniz. Auraları tamamen gizleyebilir, bir eşyanın daha düşük seviyeli yaygın bir eşya olarak görünmesini sağlayabilir veya bir büyünün aynı veya daha düşük dereceli yaygın bir büyü olarak algılanmasını sağlayabilirsiniz. Büyüyü Sonlandırabilirsiniz. Büyü gizle büyüsünden daha yüksek derecede Büyü Tespit Et veya Aura Oku kullanan bir büyücü, büyünün geleneğine uyan beceriyi (mistik için Arkana, ilahi için Din, okült için Okültizm veya doğa için Doğa) kullanarak yanılsamaya inanmamayı deneyebilir. Aynı büyücünün sonraki denemeleri, inanmamaya yönelik ilk testle aynı sonucu alır.

    Güçlendirilmiş (2.) Bu Büyüyü bir yaratığa yaparak üzerindeki tüm eşyaları ve büyü etkilerini gizleyebilirsiniz.

omen://spell/disintegrate?source=paizo-pathfinder-player-core:
  name: Kül Et
  description: >
    Hedefinize doğru siyah bir izleyici ok uçar ve temas anında güçlü bir yıkıcı ışına dönüşür. Hedefe karşı bir büyü saldırısı yapın. Bir nesneye veya kuvvet yapısına (kuvvet duvarı gibi) vurursanız, bir yadigar veya benzer güçte olmadığı sürece kurtarış olmaksızın yok edilir. Tek bir büyü yapış en fazla 10 fitlik bir madde küpünü yok edebilir. Bir yaratığa vurursanız, temel bir Dayanıklılık kurtarışıyla 12d10 hasar alır (hasar türü yoktur). Kritik vuruş yaparsanız hedef, Dayanıklılık kurtarışının sonucundan bir derece daha kötü bir sonuç alır. CP'si 0'a düşen bir yaratık ince bir toza dönüşür; teçhizatı kalır.

    Güçlendirilmiş (+1) Hasar 2d10 artar.

omen://spell/dispel-magic?source=paizo-pathfinder-player-core:
  name: Büyü Boz
  description: Bir büyünün veya etkinin ardındaki büyüyü çözersiniz. Hedefe karşı bir etkisiz kılma testi deneyin. Büyülü bir eşyayı başarıyla etkisiz kılarsanız, eşya 10 dakika boyunca kendi türünde sıradan bir eşya haline gelir. Bu durum eşyanın büyü dışı özelliklerini değiştirmez. Hedef bir yadigar veya benzer bir eşyaysa otomatik olarak başarısız olursunuz.

omen://spell/dispelling-globe?source=paizo-pathfinder-player-core:
  name: Büyübozan Küre
  description: "Çevrenizde, alanı veya hedefleri kürenin içine giren küre dışındaki herhangi bir büyüyü, sanki küre gerçek büyü derecesinden 1 derece daha düşük bir Büyü Boz büyüsüymüş gibi etkisiz kılmaya çalışan hareketsiz bir küre yaratırsınız. Etkisiz kılma denemesi başarılı olursa, büyünün yalnızca küreye girecek olan kısmını engeller (dolayısıyla büyünün küre dışında da hedefleri varsa veya alanının bir kısmı kürenin ötesindeyse, bu hedefler veya bu alan normal şekilde etkilenir). Küreyi, kenarları hiçbir yaratığın veya nesnenin içinden geçmeyecek şekilde kesintisiz açık bir alanda oluşturmalısınız; aksi takdirde büyü heba olur (büyü yapıldıktan sonra yaratıklar küreye girebilse de)."

omen://spell/disperse-into-air?source=paizo-pathfinder-player-core:
  name: Havaya Dağıl
  description: >
    Tetikleyici: Bir düşmandan veya tehlikeden hasar aldığınızda.

    Tetikleyici hasarı aldıktan sonra havaya dönüşürsünüz. Mevcut turun sonuna kadar saldırıya uğrayamaz veya hedeflenemezsiniz, yer kaplamazsınız, eylemde bulunamazsınız ve sahip olduğunuz auralar veya yayılımlar bastırılır. Turun sonunda, dağıldığınız yerin 15 fit mesafesinde kaplayabileceğiniz herhangi bir alanda yeniden biçimlenirsiniz. Dağılmış durumdayken süreleri dolmadığı sürece sahip olduğunuz auralar veya yayılımlar geri gelir.

omen://spell/divine-decree?source=paizo-pathfinder-player-core:
  name: İlahi Ferman
  description: "İnancınızdan güçlü bir litani, ideallerinize karşı çıkanlara zarar veren bir buyruk haykırırsınız. Alandaki düşmanlarınıza 7d10 ruh hasarı verirsiniz; her düşman bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarım hasar alır. Başarısızlık Yaratık tam hasar alır ve 1 dakika boyunca Halsiz 2 olur. Kritik Başarısızlık Yaratık iki kat hasar alır ve 1 dakika boyunca halsiz 2 olur. Kendi ana düzleminizdeyseniz ve yaratık değilse, yaratık kendi ana düzlemine geri gönderilir. 10. seviye veya daha düşük bir yaratık ayrıca bir will|options:inflicts:paralyzed kurtarışında başarılı olmalıdır, aksi takdirde 1 dakika boyunca Felçli olur; kritik başarısız olursa ölür (bu bir ölüm etkisidir). Güçlendirilmiş (+1) Hasar 1d10 artar ve bir kritik başarısızlıkta ikinci bir kurtarış denemesi gereken yaratıkların seviyesi 2 artar."

omen://spell/divine-immolation?source=paizo-pathfinder-player-core:
  name: İlahi Alev
  description: "İlahi alevler alan içindeki yaratıkları kasıp kavurur. Yaratıklar 6d6 ateş hasarı ve (spell rank -3)d6[persistent,fire] hasar alır. Alevlerin içindeki ilahi güç ruhu da yakar kavurur; yaratık için daha zararlı olacaksa (GM tarafından belirlendiği üzere) ilahi alevden ateş hasarı yerine ruh hasarı alır. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarım hasar alır ve süren hasar almaz. Başarısızlık Yaratık tam hasar ve süren hasar alır. Kritik Başarısızlık Yaratık iki kat hasar ve iki kat süren hasar alır. Güçlendirilmiş (+1) Hasar 1d6 artar ve süren hasar 1d6 artar."

omen://spell/divine-inspiration?source=paizo-pathfinder-player-core:
  name: İlahi İlham
  description: Bir hedefi ruhani enerjiyle doldurarak büyüsünü tazelersiniz. Büyü hazırlıyorsa, bugün daha önce yaptığı 6. derece veya daha düşük bir büyüyü geri kazanır ve bu büyüyü tekrar yapabilir. Spontane bir büyücüyse, 6. derece veya daha düşük büyü slotlarından birini geri kazanır. Bir odak havuzu varsa, sanki Yeniden Odaklanmış gibi Odak Puanlarını geri kazanır.

omen://spell/divine-lance?source=paizo-pathfinder-player-core:
  name: İlahi Mızrak
  description: >
    İlahi bir enerji ışını salarsınız. Hedefin SD'sine karşı menzilli bir büyü saldırısı yapın. Vuruş halinde hedef 2d4 ruh hasarı alır (kritik vuruşta iki kat hasar).

    Güçlendirilmiş (+1) Hasar 1d4 artar.

omen://spell/divine-wrath?source=paizo-pathfinder-player-core:
  name: İlahi Gazap
  description: >
    İlahiyatın öfkesini düşmanlarınıza yönlendirirsiniz. Alandaki düşmanlara, Dayanıklılık kurtarışlarına bağlı olarak 4d10 ruh hasarı verirsiniz.

    Kritik Başarı Yaratık etkilenmez.

    Başarı Yaratık yarı hasar alır.

    Başarısızlık Yaratık tam hasar alır ve Midesi Bulanmış 1 olur.

    Kritik Başarısızlık Yaratık tam hasar alır ve Midesi Bulanmış 2 olur; midesi bulanmış haldeyken aynı zamanda Yavaşlatılmış 1 olur.

    Güçlendirilmiş (+1) Hasar 1d10 artar.

omen://spell/dizzying-colors?source=paizo-pathfinder-player-core:
  name: Baş Döndürücü Renkler
  description: >
    İrade kurtarışlarına bağlı olarak yaratıkları alt eden dönen bir renk cümbüşü salarsınız.

    Kritik Başarı Yaratık etkilenmez.

    Başarı Yaratık 1 tur boyunca Gözü Kamaşmış olur.

    Başarısızlık Yaratık Sersemlemiş 1, 1 tur boyunca Kör ve 1 dakika boyunca Gözü Kamaşmış olur.

    Kritik Başarısızlık Yaratık 1 tur boyunca Sersemlemiş ve 1 dakika boyunca Kör olur.

omen://spell/dominate?source=paizo-pathfinder-player-core:
  name: Hükmet
  description: >
    Hedefin kontrolünü ele geçirerek onu emirlerinize uymaya zorlarsınız. Açıkça kendine zarar verici bir emir verirseniz hedef, siz yeni bir emir verene kadar eylemde bulunmaz. Etki İrade kurtarışına bağlıdır.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef emirlerinize karşı koyarken Sersemlemiş 1 olur.

    Başarısızlık Hedefi kontrol edersiniz. Kontrol Altında durumunu kazanır, ancak her sırasının sonunda bir İrade kurtarışı deneyebilir. Başarı halinde büyü sona erer.

    Kritik Başarısızlık Başarısızlıktaki gibidir; ancak hedefe yalnızca müttefiklerini öldürmek gibi doğasına aykırı yeni bir emir verirseniz yeni bir kurtarış hakkı elde eder.

    Güçlendirilmiş (10.) Süre sınırsızdır.

omen://spell/downpour?source=paizo-pathfinder-player-core:
  name: Sağanak
  description: >
    Büyülü olmayan alevleri söndüren sağanak bir yağmur çağırırsınız. Alandaki yaratıklar Belirsiz olur ve 10 ateş direnci kazanır. Alanın dışındaki yaratıklar, alanın içindekilere göre Belirsiz sayılır. Suya karşı zaafı olan bir yaratık turunu alanda tamamlarsa, sağanak onun zaafını tetikler.

    Güçlendirilmiş (+1) Ateş direnci 2 artar.

omen://spell/dragon-form?source=paizo-pathfinder-player-core:
  name: Ejderha Formu
  description: >
    Güçlü büyüye başvurarak Büyük bir ejderha savaş formu kazanırsınız. Bu Büyüyü Yaptığınızda yaygın bir ejderha türünü veya GM'nizin erişim izni verdiği başka bir türü seçin. Bu formdayken ejderha özelliğini kazanırsınız. Bu savaş formunda elleriniz vardır ve manipüle eylemlerini gerçekleştirebilirsiniz. Büyüyü Sonlandırabilirsiniz. Hangi savaş formunu seçerseniz seçin aşağıdaki istatistikleri ve yetenekleri kazanırsınız: SD = 18 + seviyeniz. Zırhınızın kontrol cezasını ve Hareket Hızı düşüşünü yok sayın. 10 geçici Can Puanı. Hareket Hızı 40 fit, uçma Hareket Hızı 100 fit. Seçilen ejderhanın sahip olduğu aşağıdaki Hareket Hızlarından herhangi birini listelenen miktarda kazanırsınız: kazma Hareket Hızı 20 fit, tırmanma Hareket Hızı 40 fit, yüzme Hareket Hızı 60 fit. Ejderha Nefesinizin hasar türüne karşı 10 direnç (aşağıya bakın). Karanlıkgörüş ve 60 fit kesin olmayan koku. Vuruş Yapabileceğiniz yegâne saldırılar olan aşağıdaki silahsız yakın dövüş saldırıları. Bunlarda eğitimlisinizdir. Saldırı niteleyiciniz +22, hasar bonusunuz +6'dır. Bu saldırılar Kuvvet tabanlıdır (örneğin halsiz durumu açısından). Silahsız saldırı niteleyiciniz daha yüksekse bunun yerine onu kullanabilirsiniz. Bu saldırılar hakkında daha fazlası için aşağıya bakın. Yakın Dövüş 1 çene, Hasar 2d12 delici artı Ejderha Nefesinizle aynı hasar türünde 2d6 hasar (aşağıya bakın); Yakın Dövüş 1 pençe (çevik), Hasar 3d10 kesici; Yakın Dövüş 1 kuyruk (erişim 10 fit), Hasar 3d10 ezici. Kendi niteleyiciniz daha yüksek olmadığı sürece Atletizm niteleyicisi +23. Ejderha Nefesi 2 Bir alana ölümcül büyülü enerji üflersiniz; büyü ZD'nize karşı temel bir kurtarışla alandaki her yaratığa 10d6 hasar verirsiniz. Biçim, hasar türü ve kurtarış türü, seçtiğiniz ejderhanın nefesiyle eşleşir. Seçilen ejderhanın nefesi birden fazla hasar türü verebiliyorsa, ejderha formu büyüsünü yaptığınızda birini seçin. Biçim 30 fitlik bir koni veya 100 fitlik bir hattır. Bir kez etkinleştirildiğinde, Ejderha Nefesi 1d4 tur boyunca tekrar kullanılamaz. Ejderha Nefesi, ejderhanın türüyle eşleşen gelenek özelliğine ve varsa verdiği hasar türüyle eşleşen hasar özelliğine sahiptir. Gelenek Direnci Ejderhanın büyü geleneği, ejderha formu büyünüzünkiyle eşleşiyorsa listelenen yeteneği kazanırsınız. Mistik büyüye karşı 5 direnç; ilahi ruh, canlılık ve boşluğa karşı 10 direnç; okült zihinsel hasara karşı 10 direnç; doğa fiziksel hasara karşı 5 direnç. Ejderha Gelenek Hareket Hızları Ejderha Nefesi Kurtarış Adamantin Doğa Kazma Ezici konisi Refleks Baraj Mistik — Kuvvet konisi Refleks Bataklık Doğa Yüzme Asit konisi Refleks Tuzlu Su Doğa Yüzme Ezici hattı Refleks Köz Doğa — Ateş konisi Refleks Bulut Doğa — Elektrik konisi Refleks Komplocu Okült Tırmanma Zehir konisi Dayanıklılık Mercan Doğa Yüzme Ezici hattı Refleks Kristal Doğa — Delici konisi Refleks Neşe İlahi — Ruh konisi Refleks Yeis Okült — Sonik konisi İrade Diabolic İlahi — Ateş konisi Refleks Göksel İlahi — Ruh konisi Refleks İnfazcı İlahi — Sonik konisi Refleks Orman Doğa — Delici konisi Refleks Talih Mistik — Kuvvet konisi Refleks Boynuzlu Doğa Yüzme Zehir konisi Dayanıklılık Magma Doğa Kazma Ateş konisi Refleks Serap Mistik Tırmanma Zihinsel konisi İrade Alaycı Okült — Ezici konisi Refleks Yemin İlahi — Ruh konisi İrade Alamet Okült — Zihinsel konisi İrade Evre Mistik — Kuvvet konisi Refleks Ağıt İlahi Yüzme Ruh hattı İrade Diriliş İlahi — Boşluk konisi Dayanıklılık Kırağı Doğa Yüzme Soğuk konisi Refleks Rün Mistik — Ateş konisi Refleks Bilge Okült — Zihinsel konisi İrade Deniz Mistik Yüzme Ezici konisi Refleks Gökyüzü İlahi — Elektrik konisi Refleks Hükümran Okült — Zihinsel konisi İrade Fırtınatacı Doğa — Elektrik hattı Refleks Zaman Mistik — Kuvvet konisi İrade Gölgeli Okült — Boşluk konisi Refleks Yeraltı Mistik Kazma Ateş konisi Refleks Vezir Okült Yüzme Ateş konisi Refleks Vorpal Mistik — Boşluk konisi İrade Feryat Mistik — Sonik konisi Dayanıklılık Fısıltı Okült — Zihinsel konisi İrade Dilek Mistik Tırmanma Zihinsel konisi İrade

    Güçlendirilmiş (8.) Savaş formunuz İri boyuttadır, uçma Hareket Hızınıza +20 fitlik statü bonusu kazanırsınız ve saldırılarınız 10 fit erişime sahiptir (veya daha önce 10 fit erişime sahiplerse 15 fit erişim). Bunun yerine SD = 21 + seviyeniz, 15 geçici CP, +28 saldırı niteleyicisi, +12 hasar bonusu ve Atletizm +28 kazanırsınız. Ejderha Nefesiniz ilave 4d6 hasar verir.

omen://spell/dream-message?source=paizo-pathfinder-player-core:
  name: Düş Mesajı
  description: >
    Hedefinizin düşüne bir mesaj gönderirsiniz. Mesaj tek yönlüdür ve en fazla 1 dakikalık konuşmadan (yaklaşık 150 kelime) oluşur. Hedef uyuyorsa mesajı anında alır. Uyuklamıyorsa, bir sonraki uyuyuşunda alır. Mesajı alır almaz büyü sona erer ve mesajın iletildiğini anlarsınız.

    Güçlendirilmiş (4.) İsmen bildiğiniz ve şahsen tanıştığınız en fazla 10 yaratığı hedefleyebilirsiniz. Hepsine aynı mesajı göndermelisiniz; büyü her bir yaratık için ayrı ayrı sona erer.

omen://spell/dreamers-call?source=paizo-pathfinder-player-core:
  name: Düştekinin Çağrısı
  description: >
    Hedefin rüyalarındaki imgelerden canlı, yanıltıcı bir gündüz düşü yaratırsınız. Gündüz düşü menzil içindeki boş bir alanda belirir ve hedefi ona doğru çekmeye çalışırsınız.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedefin dikkati dağılır. Gündüz düşü tarafından Kendini Kaptırmış olur.

    Başarısızlık Hedef gündüz düşüyle büyülenir ve Büyüyü Yaptıktan sonraki ilk eylemi olarak seçtiğiniz bir eylem rotasını izler: gündüz düşüne yaklaşmak, ondan kaçmak (Kaçan durumu gibi), bir adak olarak elinde tuttuğu şeyi Bırakmak veya biat ederek Yüzüstü Yere Kapanmak.

    Kritik Başarısızlık Başarısızlıktaki gibidir; ancak hedef büyünün süresi boyunca mümkün olduğunca çok eylemle bu eylem rotasını izler ve başka hiçbir şey yapmaz.

omen://spell/dreaming-potential?source=paizo-pathfinder-player-core:
  name: Düşsel Potansiyel
  description: "Hedefi, düş dünyasının durmaksızın değişen fonunda kendi potansiyelinin sonsuz olasılıklarını keşfedebileceği berrak bir rüyaya çekersiniz. Kesintisiz tam 8 saat uyursa, uyandığında bir günlük ara zaman yeniden eğitimini harcamış sayılır; ancak rüyada erişemeyeceği bir eğitmen veya uzmanlık bilgisi gerektiren herhangi bir yeniden eğitim için düşsel potansiyel büyüsünü kullanamaz."

omen://spell/duplicate-foe?source=paizo-pathfinder-player-core:
  name: Düşmanı Kopyala
  description: >
    Sizin adınıza savaşması için bir düşmanın geçici bir kopyasını yaratırsınız. Hedef, büyüyü bozmak için bir Dayanıklılık kurtarışı deneyebilir. Kopya, hedefe bitişik boş bir alanda belirir ve hedefin saldırı niteleyicisine, SD'sine, kurtarış niteleyicilerine, Dikkat ve beceri niteleyicilerine sahiptir; ancak yalnızca 70 Can Puanı vardır ve bağışıklıklar, dirençler ve zaaflar de dahil olmak üzere hedefin özel yeteneklerinden yoksundur. Silah kudret rünleri dışında hiçbir büyülü eşyaya sahip değildir. Kopya minyon özelliğini kazanır ve yalnızca Depar atabilir ve Vuruş Yapabilir. Vuruşları hedefin normal hasarını verir ancak özel yetenekleri olmadığı için ilave etkiler uygulamaz. Kopyanın Can Puanı 0'a düşerse büyü otomatik olarak sona erer. Kopya düşmanlarınıza tüm gücüyle saldırır. Ona ek talimatlar vermeyi de deneyebilirsiniz; büyüyü Sürdürdüğünüzde eyleminizin bir parçası olarak Minyona Emret de yapabilirsiniz, ancak kopyanın emrinize uyup uymayacağını GM belirler. Kopya kararsızdır; bu yüzden eylemlerini gerçekleştirdikten sonra her tur 4d6 Can Puanı kaybeder. Yaşayan bir yaratık değildir ve kaybettiği Can Puanlarını hiçbir şekilde geri kazanamaz.

    Kritik Başarı Bir kopya yaratamazsınız.

    Başarı Kopyanın Vuruşları yarı hasar verir ve süre en fazla 2 tura düşer.

    Başarısızlık Kopya tarif edildiği gibi işler.

    Güçlendirilmiş (+1) Hedefleyebileceğiniz yaratığın seviyesi 2 artar. Kopyanın 10 CP fazlası olur.

omen://spell/earthbind?source=paizo-pathfinder-player-core:
  name: Toprağa Bağla
  description: >
    Toprağın ağırlığını kullanarak bir hedefin uçuşunu, Dayanıklılık kurtarışına bağlı etkilerle engellersiniz. Yaratık yere güvenli bir şekilde ulaşırsa düşme hasarı almaz.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef güvenli bir şekilde 120 fite kadar düşer.

    Başarısızlık Hedef güvenli bir şekilde 120 fite kadar düşer. Yere çarparsa 1 tur boyunca Uçamaz, havada süzülemez veya başka bir şekilde yerden ayrılamaz.

    Kritik Başarısızlık Hedef güvenli bir şekilde 120 fite kadar düşer. Yere çarparsa 1 dakika boyunca Uçamaz, havada süzülemez veya başka bir şekilde yerden ayrılamaz.

omen://spell/earthquake?source=paizo-pathfinder-player-core:
  name: Deprem
  description: "Yeri sarsar, yaratıkları yarıklara devirir ve yapıları çökertirsiniz. GM belirli alanlarda ilave etkiler ekleyebilir. Uçurumlar çökerek yaratıkların düşmesine neden olabilir veya yüzeyinin altında yarıklar açılarak bir göl boşalabilir ve geride bir bataklık kumu bırakabilir. Sarsılan Zemin Zemin zorlu arazidir ve üzerindeki yaratıklar saldırı zarlarına, SD'ye ve beceri testlerine -2 durumsal ceza alır. Yarıklar Zemindeki her yaratık, dengesini korumak ve altında açılan 40 fit derinliğindeki yarıklara düşmekten kaçınmak için sırasının başında bir Refleks kurtarışı denemelidir. Yarıklar kalıcıdır ve kenarlarına Tırmanmak için başarılı athletics|dc:15|traits:action:climb gerekir. Çökme Yapılar ve tavanlar çökebilir. GM her biri için düz bir zar atar (sağlam bir yapı için flat|dc:16, ortalama bir yapı ve çoğu doğal oluşum için flat|dc:14, çürük bir yapı için flat|dc:9; hepsi GM'nin uygun gördüğü şekilde daha yüksek veya daha düşük ayarlanabilir). Bir çökme, temel bir Refleks kurtarışıyla yakalanan her bir yaratığa 11d6 ezici hasar verir. Bir yaratık kritik başarı elde etmedikçe Yüzüstü yere serilir ve kritik başarısızlıkta bir yarığa düşer. Güçlendirilmiş (10.) Bir yerleşimi yerle bir edebilecek muazzam bir deprem yaratırsınız. Menzil yarım mile ve alan çeyrek millik bir patlamaya yükselir."

omen://spell/earthworks?source=paizo-pathfinder-player-core:
  name: Toprak Siperler
  description: >
    Toprağın dalgalanmasıyla yerden küçük engeller yükseltirsiniz. Alandaki zemin zorlu arazi haline gelir. Büyünün alanı yapmak için 1 eylem harcadıysanız bir patlama, 2 eylem harcadıysanız bir patlama veya 3 eylem harcadıysanız bir patlamadır. Bir yaratık, kendisine bitişik 5 fitlik bir kareden engelleri temizlemek için Etkileşime girebilir.

    Güçlendirilmiş (4.) Engelleri havada süzülecek şekilde çekerek büyünün uçan yaratıklar için zorlu arazi olarak işlemesini sağlarsınız.

omen://spell/eclipse-burst?source=paizo-pathfinder-player-core:
  name: Tutulma Patlaması
  description: >
    Alanda dondurucu karanlıktan bir küre patlayarak alandaki yaratıklara 8d10 soğuk hasarı, yaşayan yaratıklara ise ilave 8d4 boşluk hasarı verir. Alandaki her yaratık bir Refleks kurtarışı denemelidir. Küre, büyülü bir ışık alanıyla örtüşürse veya büyülü ışıktan etkilenen bir yaratığı etkilerse tutulma patlaması, ışık etkisini etkisiz kılmaya çalışır.

    Kritik Başarı Yaratık etkilenmez.

    Başarı Yaratık yarı hasar alır.

    Başarısızlık Yaratık tam hasar alır.

    Kritik Başarısızlık Yaratık iki kat hasar alır ve sınırsız süre boyunca karanlık nedeniyle Kör olur.

    Güçlendirilmiş (+1) Soğuk hasarı 1d10 artar ve yaşayanlara karşı boşluk hasarı 1d4 artar.

omen://spell/electric-arc?source=paizo-pathfinder-player-core:
  name: Elektrik Arkı
  description: >
    Bir hedeften diğerine bir şimşek arkı sıçrar. Her hedef temel bir Refleks kurtarışıyla 2d4 elektrik hasarı alır.

    Güçlendirilmiş (+1) Hasar 1d4 artar.

omen://spell/elemental-betrayal?source=paizo-pathfinder-player-core:
  name: Elementel İhanet
  description: >
    Haminiz elementler üzerindeki üstün hakimiyetini kullanarak onları düşmanınızı baltalamaları için güçlendirir. Bu Büyüyü Yaptığınızda hava, toprak, metal, ateş, su veya ahşap seçin. Hedef bu özelliğe karşı 2 zaaf kazanır.

    Güçlendirilmiş (+2) Zaafı 1 artırın.

omen://spell/elemental-form?source=paizo-pathfinder-player-core:
  name: Elementel Form
  description: >
    Düzlemlerin gücüne başvurarak Orta boy bir elementel savaş formuna dönüşürsünüz. Bu Büyüyü Yaptığınızda listelenen bir element seçin. Bu formdayken ilgili özelliği ve elementel özelliğini kazanırsınız. Bu savaş formunda elleriniz vardır ve manipüle eylemlerini gerçekleştirebilirsiniz. Büyüyü Sonlandırabilirsiniz. Hangi savaş formunu seçerseniz seçin aşağıdaki istatistikleri ve yetenekleri kazanırsınız: SD = 19 + seviyeniz. Zırhınızın kontrol cezasını ve Hareket Hızı düşüşünü yok sayın. 10 geçici Can Puanı. Karanlıkgörüş. Seçtiğiniz savaş formuna özgü olan ve Vuruş Yapabileceğiniz yegâne saldırılar olan bir veya daha fazla silahsız yakın dövüş saldırısı. Bunlarda eğitimlisinizdir. Saldırı niteleyiciniz +18, hasar bonusunuz +9'dur. Bunlar Çeviklik tabanlıdır (hava, ateş veya metal) ya da Kuvvet tabanlıdır (toprak, su veya ahşap). Karşılık gelen silahsız saldırı niteleyiciniz daha yüksekse bunun yerine onu kullanabilirsiniz. Akrobasi (hava, ateş veya metal) ya da Atletizm (toprak, su veya ahşap) niteleyicisi +20; kendi niteleyiciniz daha yüksekse bu değişikliği yok sayın. Ayrıca seçtiğiniz elementel türüne bağlı olarak belirli yetenekler kazanırsınız: Hava uçuş 80 fit, hareket reaksiyonları tetiklemez; Yakın Dövüş 1 rüzgâr, Hasar 1d4 ezici. Toprak Hareket Hızı 20 fit, kazma 20 fit; Yakın Dövüş 1 kaya, Hasar 2d10 ezici. Ateş Hareket Hızı 50 fit; ateş direnci 10, soğuğa karşı 5 zaaf ve suya karşı 5 zaaf; Yakın Dövüş 1 dokunaç, Hasar 1d8 ateş artı 1d4 sürekli ateş. Metal Hareket Hızı 40 fit, uçuş 20 fit; Yakın Dövüş 1 bıçak (çok yönlü delici), Hasar 1d8 kesici artı 1d4 elektrik. Su Hareket Hızı 20 fit, yüzme 60 fit; ateş direnci 5; Yakın Dövüş 1 dalga, Hasar 1d12 ezici ve başarılı bir İtme etkisiyle hedefi 5 fit itmek için bir vuruşun hemen ardından bir eylem harcayabilirsiniz. Ahşap Hareket Hızı 20 fit, tırmanma 30 fit; Yakın Dövüş 1 dal, Hasar 2d10 ezici.

    Güçlendirilmiş (6.) Savaş formunuz Büyük boyuttadır ve saldırılarınız 10 fit erişime sahiptir. Genişlemek için alana sahip olmalısınız, aksi takdirde büyü heba olur. Bunun yerine SD = 22 + seviyeniz, 15 geçici CP, +23 saldırı niteleyicisi, +13 hasar bonusu ve Akrobasi veya Atletizm +23 kazanırsınız.

    Güçlendirilmiş (7.) Savaş formunuz İri boyuttadır ve saldırılarınız 15 fit erişime sahiptir. Genişlemek için alana sahip olmalısınız, aksi takdirde büyü heba olur. Bunun yerine SD = 22 + seviyeniz, 20 geçici CP, +25 saldırı niteleyicisi, +11 hasar bonusu, iki kat hasar zarı (süren hasar dahil) ve Akrobasi veya Atletizm +25 kazanırsınız.

omen://spell/embed-message?source=paizo-pathfinder-player-core:
  name: Mesaj Göm
  description: >
    Bir tetikleyici ve en fazla 25 kelime uzunluğunda bir mesaj belirlersiniz. Belirtilen tetikleyici hedefin 30 fit yakınında gerçekleştiğinde, mesajınızın yanılsama metni bedensiz bir ses eşliğinde hedefin etrafında döner. Metin ve konuşma için bildiğiniz bir dili seçebilir ve sesin nasıl çıkacağını belirleyebilirsiniz. Mesaj tamamlandığında büyü sona erer.

    Güçlendirilmiş (4.) Mesajı vurgulamak için koku, görsel efekt veya fiziksel bir his gibi basit bir duyusal bileşen ekleyebilirsiniz. Bu ekleme belirgin şekilde yanılsamadır, mesajın bir parçasıdır ve yalnızca mesaj okunurken sürer.

    Güçlendirilmiş (6.) 4. derecedeki gibidir, ancak büyü sona ermeden önce mesajı kaç kez tekrarlayacağını seçebilirsiniz; tekrarlama sayısında bir sınır yoktur.

omen://spell/enduring-might?source=paizo-pathfinder-player-core:
  name: Baki Kudret
  description: >
    Tetikleyici: Bir saldırı veya etki size hasar vereceğinde.

    Kendi kudretiniz ilahi güçle harmanlanarak sizi zarardan korur. Tetikleyici saldırı veya etkiden gelen tüm hasara karşı 8 artı Kuvvet niteleyicinize eşit direnç kazanırsınız.

    Güçlendirilmiş (+1) Direnç 2 artar.

omen://spell/energy-absorption?source=paizo-pathfinder-player-core:
  name: Enerji Soğurma
  description: >
    Tetikleyici: Bir etki size asit, soğuk, elektrik veya ateş hasarı vereceğinde.

    Bombaların, kuşatma makinelerinin ve büyülü topçuların verdiği hasarı hafifletmeye alışıksınızdır. Tetikleyici etkiden kaynaklanan asit, soğuk, elektrik veya ateş hasarı tercihinize karşı 15 direnç kazanırsınız. Direnç yalnızca tetikleyici etkinin ilk hasarına uygulanır.

    Güçlendirilmiş (+1) Direnç 5 artar.

omen://spell/energy-aegis?source=paizo-pathfinder-player-core:
  name: Enerji Kalkanı
  description: >
    Hedefi güçlü, uzun ömürlü bir enerji bariyeriyle korursunuz. Hedef asit, soğuk, elektrik, ateş, kuvvet, sonik, canlılık ve boşluk hasarına karşı 5 direnç kazanır.

    Güçlendirilmiş (9.) Dirençler 10'a yükselir.

omen://spell/enfeeble?source=paizo-pathfinder-player-core:
  name: Halsiz Düşür
  description: >
    Dayanıklılık kurtarışına bağlı olarak hedefin gücünü tüketirsiniz.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef bir sonraki sıranızın başlangıcına kadar Halsiz 1 olur.

    Başarısızlık Hedef 1 dakika boyunca Halsiz 2 olur.

    Kritik Başarısızlık Hedef 1 dakika boyunca Halsiz 3 olur.

omen://spell/enlarge-companion?source=paizo-pathfinder-player-core:
  name: Yoldaşı Büyüt
  description: >
    Yoldaş Hayvanınız çok daha büyür, savaşta düşmanlarına tepeden bakar. Yoldaş Hayvanınız Büyük boyuta ulaşarak 2. derece Büyüt büyüsünün etkilerini kazanır.

    Güçlendirilmiş (4.) Yoldaş Hayvanınız bunun yerine İri boyuta ulaşarak 4. derece büyüt büyüsünün faydalarını kazanır.

omen://spell/enlarge?source=paizo-pathfinder-player-core:
  name: Büyüt
  description: >
    Büyülü güçle desteklenen hedef Büyük boyuta ulaşır. Ekipmanı da onunla birlikte büyür ancak çıkarılırsa doğal boyutuna döner. Yaratık Sakar 1 olur. Erişimi 5 fit artar (veya Minik olarak başladıysa 10 fit) ve yakın dövüş Vuruşlarındaki hasar zarlarına +2 statü bonusu kazanır. Bu büyünün Büyük veya daha büyük bir yaratık üzerinde hiçbir etkisi yoktur.

    Güçlendirilmiş (4.) Yaratık bunun yerine İri boyuta büyür. Yakın dövüş hasarına statü bonusu +4 olur ve yaratığın erişimi 10 fit artar (veya yaratık Minik olarak başladıysa 15 fit). Büyünün İri veya daha büyük bir yaratık üzerinde hiçbir etkisi yoktur.

    Güçlendirilmiş (6.) Bu büyünün 2. derece veya 4. derece versiyonunu seçin ve etkilerini en fazla 10 gönüllü yaratığa uygulayın.

omen://spell/entangling-flora?source=paizo-pathfinder-player-core:
  name: Dolaşık Bitkiler
  description: Bitkiler ve mantarlar hızla fışkırır veya büyüyerek yaratıkları sarar. Alandaki tüm yüzeyler zorlu arazidir. Bir yaratık alanda turuna başladığı her tur bir Refleks kurtarışı denemelidir. Başarısızlıkta, alandan ayrılana kadar Hareket Hızlarına -10 fitlik bir durumsal ceza alır ve kritik başarısızlıkta 1 tur boyunca Hareketsiz Kılınır. Yaratıklar bu etkileri kaldırmak için Kurtulmayı deneyebilir.

omen://spell/enthrall?source=paizo-pathfinder-player-core:
  name: Büyüle ve Bağla
  description: >
    Sözleriniz hedeflerinizi büyüler. Büyüyü yaparken ve süre boyunca kesintisiz konuşur veya şarkı söylersiniz. Konuşmanızı veya şarkınızı fark eden hedefler tüm dikkatlerini verebilir; her hedef bir İrade kurtarışı denemelidir. Hedef karşıt bir dine, soy geçmişine veya siyasi eğilime sahipse ya da söylediğiniz şeylere katılması muhtemel değilse, GM bir durumsal bonus (en fazla +4) verebilir. Menzile giren her yaratık, büyüyü Sürdürdüğünüzde bir kurtarış denemelidir. Konuşuyorsanız büyüle ve bağla dilsel özelliğini kazanır.

    Kritik Başarı Hedef etkilenmez ve büyü kullanmaya çalıştığınızı fark eder.

    Başarı Hedefin dikkat etmesi gerekmez ancak büyü kullanmaya çalıştığınızı fark etmez (başkalarının büyülendiğini fark edebilir).

    Başarısızlık Hedef size Kendini Kaptırmış olur. Katılmadığı eylemlere veya sözlere tanık olursa başka bir İrade kurtarışı deneyebilir. Başarılı olursa artık kendini kaptırmış sayılmaz ve 1 saat boyunca geçici olarak bağışık olur. Hedef düşmanca bir eyleme maruz kalırsa veya başka bir yaratık ona karşı bir Diplomasi veya Gözdağı testinde başarılı olursa büyülenme derhal sona erer.

    Kritik Başarısızlık Başarısızlıktaki gibidir; ancak hedef sizinle aynı fikirde olmasa bile büyülenmeyi sona erdirmek için bir kurtarış deneyemez.

omen://spell/environmental-endurance?source=paizo-pathfinder-player-core:
  name: Çevresel Dayanıklılık
  description: >
    Hedefi tehlikeli sıcaklıklara karşı korursunuz. Şiddetli soğuk veya şiddetli sıcak seçin. Hedef seçtiğiniz sıcaklıktan korunur (ancak aşırı soğuk veya aşırı sıcaktan korunmaz).

    Güçlendirilmiş (3.) Hedef şiddetli soğuk ve şiddetli sıcaktan korunur.

    Güçlendirilmiş (5.) Hedef şiddetli soğuk, şiddetli sıcak, aşırı soğuk ve aşırı sıcaktan korunur.

omen://spell/ephemeral-tracking?source=paizo-pathfinder-player-core:
  name: Efemeral İz Sürüş
  description: "Havadaki ve sudaki akıntılara bakabilir ve karada olduğu gibi takip edebileceğiniz izler görebilirsiniz. Son bir saat içinde yakından geçmiş tüm yaratıkların havadaki veya sudaki \"izlerini\" fark ederek hem havada hem de suda İz Sürmek için Hayatta Kalma'yı kullanabilirsiniz. Bu şekilde İz Sürmek daha zordur: Havada veya suda İz Sürme ZD'si her zaman en az 30'dur veya yağış ya da rüzgârdan (havada) veya güçlü gelgit ya da akıntılardan (suda) sonra daha yüksektir. Bu büyüye karşı İzleri Örtmek mümkündür, ancak yaratıklar bunu yapmaları gerektiğini fark etmeyebilirler."

omen://spell/eradicate-undeath?source=paizo-pathfinder-player-core:
  name: Hortlaklığı Yok Et
  description: >
    Yaşam enerjisinin devasa bir seli hortlakların parçalanmasına neden olur. Alandaki her hortlak yaratık 4d12 canlılık hasarı alır.

    Güçlendirilmiş (+1) Hasar 1d12 artar.

omen://spell/everlight?source=paizo-pathfinder-player-core:
  name: Sönmeyen Işık
  description: Dokunduğunuz değerli taş parıldayarak 20 fitlik bir yarıçapta seçtiğiniz bir renkte parlak ışık (ve sonraki 20 fit boyunca loş ışık) yayar. Değerli taş kırılırsa büyü derhal sona erer.

omen://spell/evil-eye?source=paizo-pathfinder-player-core:
  name: Kem Göz
  description: Haminizin hıncı, meşum ve haset dolu bir bakışla tezahür eder. Hedef bir İrade kurtarışında başarısız olursa Midesi Bulanmış 1 olur (kritik başarısızlıkta midesi bulanmış 2). Büyü aktif olduğu ve siz hedefi görebildiğiniz sürece bu durum değeri 1'in altına indirilemez.

omen://spell/execute?source=paizo-pathfinder-player-core:
  name: İnfaz Et
  description: >
    Bir yaratığı işaret eder ve her şeyin sonunu çağırırsınız. Hedef, temel bir Dayanıklılık kurtarışıyla 70 boşluk hasarı alır. Hedef bir hortlaksa veya başka bir şekilde boşlukla iyileşmeye sahipse, büyü ölüm ve boşluk özelliklerini kaybedip canlılık özelliğini kazanır ve hedef temel bir Dayanıklılık kurtarışıyla 70 canlılık hasarı alır.

    Güçlendirilmiş (+1) Hasar 10 artar.

omen://spell/fabricated-truth?source=paizo-pathfinder-player-core:
  name: Uydurma Hakikat
  description: >
    Hedeflerin inanmasını istediğiniz tek bir ifade seçin. Bu gerçek dar kapsamlı ("tepemizde bir ejderha daireler çiziyor ve beni öldürmek istiyor" gibi), geniş kapsamlı ("tüm insansılar kılık değiştirmiş ucube yaratıklardır" gibi) veya kavramsal ("daha nazik bir hayat yaşamazsam ölümden sonra cezalandırılacağım" gibi) olabilir. Hedeflerin deneyimleri bu "hakikate" nasıl tepki vereceklerini ve davranışlarının nasıl değişeceğini şekillendirir. İfade algıladıkları şeyleri değiştiriyorsa bu değişikliği ani bir aydınlanma olarak kabul ederler. Büyünün etkisi hedeflerin İrade kurtarışlarına bağlıdır. Bir hedef uydurma hakikat büyüsünden zaten etkilenmişse, büyünüz bunu etkisiz kılmaya çalışır. Etkisiz kılma testi başarısız olursa hedefin kurtarışın sonucu bir başarıdan daha kötü olamaz.

    Kritik Başarı Hedef ifadeye inanmaz ve onu kandırmaya çalıştığınızı bilir.

    Başarı Hedef ifadeye inanmaz veya onu kandırmaya çalıştığınızı fark etmez.

    Başarısızlık Hedef 1 hafta boyunca ifadeye inanır.

    Kritik Başarısızlık Hedef sınırsız süre boyunca ifadeye inanır.

omen://spell/face-in-the-crowd?source=paizo-pathfinder-player-core:
  name: Kalabalıktaki Yüz
  description: >
    Kabaca benzer yaratıklardan oluşan bir kalabalığın içindeyken görünüşünüz sıradan ve belirsiz hale gelir. Kalabalık arasında kimliğinizi gizlemek için Yapmacıklık ve Gizlilik testlerine +2 statü bonusu kazanırsınız ve kalabalığın neden olduğu zorlu araziyi yok sayarsınız. Bu, Yapmacıklık becerisinin Taklit Et kullanımı için bir kılık oluşturmak sayılır ve eğitimsiz olsanız bile seviyenizi eklersiniz.

    Güçlendirilmiş (3.) Büyü 10 fitlik bir menzil kazanır ve en fazla 10 yaratığı hedefleyebilir.

omen://spell/falling-stars?source=paizo-pathfinder-player-core:
  name: Kayan Yıldızlar
  description: >
    Alan 4 adet 40 fitlik patlama Göklere uzanır ve yere çarptığında patlayan bir dizi kayan yıldız çağırırsınız. Kayan yıldızların hava patlamaları (sonik), asteroitler (ateş), kuyruklu yıldızlar (soğuk) veya plazma (elektrik) olmasını seçin. Büyü, seçtiğiniz kayan yıldız türünün özelliğini kazanır. Dört yıldızın merkezi 10 fitlik patlamaları örtüşemez. Her kayan yıldız patlamadan önce etki alanının merkezindeki patlamada bulunan her yaratığa 6d10 ezici hasar verir; ardından patlayarak patlamasındaki her yaratığa seçtiğiniz türde 14d6 enerji hasarı verir. Alanlardan herhangi birinde bulunan bir yaratık, kaç tane örtüşen patlamaya yakalanırsa yakalansın büyüye karşı tek bir temel Refleks kurtarışı dener ve her hasar türünü yalnızca bir kez alabilir.

    Güçlendirilmiş (+1) Ezici hasar 1d10 artar ve enerji hasarı 2d6 artar.

omen://spell/false-vision?source=paizo-pathfinder-player-core:
  name: Sahte Görü
  description: "Bir alanı gözetlemeye yönelik tüm girişimleri kandıran sahte bir görüntü yaratırsınız. Herhangi bir gözetleme büyüsü alanda gerçekte ne olduğunu görmek yerine alanda dilediğiniz şeyi görür, duyar, koklar ve başka şekillerde tespit eder. Büyüyü her tur Sürdürerek karmaşık bir sahneyi canlandırmak da dahil olmak üzere yanılsamayı dilediğiniz gibi değiştirebilirsiniz. Gözetleme büyüsü sahte görü büyüsünden daha yüksek bir derecedeyse gözetleyen kişi yanılsamaya inanmamak için bir Dikkat testi deneyebilir; başarılı olsa bile alanda gerçekte ne olduğunu öğrenemez."

omen://spell/false-vitality?source=paizo-pathfinder-player-core:
  name: Sahte Canlılık
  description: >
    Bedeninizi genellikle hortlakları manipüle etmek için kullanılan enerjilerle takviye edersiniz. 10 geçici Can Puanı kazanırsınız.

    Güçlendirilmiş (+1) Geçici Can Puanı 3 artar.

omen://spell/fatal-aria?source=paizo-pathfinder-player-core:
  name: Can Alıcı Arya
  description: "O kadar mükemmel bir müzik icra edersiniz ki hedef neşeden veya kederden ölebilir. Bir kez hedeflendiğinde yaratık 1 dakika boyunca geçici olarak bağışık olur. Büyünün etkisi hedefin seviyesine ve mevcut Can Puanına bağlıdır. 16. veya Daha Düşük Hedef anında ölür. 17. Hedefin 50 Can Puanı veya daha azı varsa anında ölür; aksi takdirde Can Puanı 0'a düşer ve Ölmekte 1 durumuna gelir. 18. veya Daha Yüksek Hedef 50[untyped] hasar alır. Bu onu 0 Can Puanına düşürürse anında ölür."

omen://spell/fear?source=paizo-pathfinder-player-core:
  name: Korku
  description: >
    Hedefe korku aşılarsınız; hedef bir İrade kurtarışı denemelidir.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef Korkmuş 1 olur.

    Başarısızlık Hedef Korkmuş 2 olur.

    Kritik Başarısızlık Hedef Korkmuş 3 olur ve 1 tur boyunca Kaçan durumuna düşer.

    Güçlendirilmiş (3.) En fazla beş yaratığı hedefleyebilirsiniz.

omen://spell/feet-to-fins?source=paizo-pathfinder-player-core:
  name: Ayaktan Yüzgece
  description: >
    Hedefin ayakları yüzgeçlere dönüşerek sudaki hareket kabiliyetini artırır ancak karada azaltır. Hedef normal kara Hareket Hızına eşit bir yüzme Hareket Hızı kazanır, ancak kara Hareket Hızı 5 fit olur.

    Güçlendirilmiş (6.) Büyü bir sonraki günlük hazırlıklarınıza kadar sürer.

omen://spell/field-of-life?source=paizo-pathfinder-player-core:
  name: Yaşam Sahası
  description: >
    Yaşam enerjisinden bir saha alanı doldurarak sıcaklık yayar ve içindekileri tazeler. Alanda turuna başlayan her canlı yaratık 1d8 Can Puanı geri kazanır ve alanda turuna başlayan her hortlak yaratık 1d8 canlılık hasarı alır.

    Güçlendirilmiş (8.) İyileşme ve hasar 1d10'a yükselir.

    Güçlendirilmiş (9.) İyileşme ve hasar 1d12'ye yükselir.

omen://spell/fiery-body?source=paizo-pathfinder-player-core:
  name: Alevli Beden
  description: "Yaşayan bir aleve dönüşürsünüz; bu size ateş bağışıklığı, zayıf nokta hasarına karşı 10 direnç, soğuğa ve suya karşı 5 zaaf kazandırır. Size dokunan veya silahsız bir saldırı ya da erişim özelliği olmayan yakın dövüş silahıyla size hasar veren herhangi bir yaratık 3d6[fire] hasar alır. Silahsız saldırılarınız fazladan 1d4 ateş hasarı verir ve ateş büyüleriniz fazladan bir zar ateş hasarı verir (büyünün kullandığı aynı hasar zarından). Özgü büyü olarak Tutuştur yapabilirsiniz; büyü yapma 2 eylemden 1 eyleme indirgenir. Ateş formundayken 40 fitlik uçma Hareket Hızına sahip olursunuz ve nefes almanız gerekmez. Güçlendirilmiş (9.) Size dokunan yaratıklar 3d6 yerine 4d6[fire] hasar alır, silahsız saldırılarınız 2d4 ilave ateş hasarı verir ve 60 fitlik bir uçma Hareket Hızına sahip olursunuz."

omen://spell/figment?source=paizo-pathfinder-player-core:
  name: Hayal Kırıntısı
  description: Basit bir yanılsama ses veya görüntü yaratırsınız. Ses büyüye işitsel özelliğini ekler ve anlaşılır kelimeler veya karmaşık müzik içeremez. Görüntü görsel özelliğini ekler, 5 fitlik bir küpten daha büyük olamaz ve 15 fit mesafeden bakıldığında belirgin şekilde kaba ve ayrıntısızdır. Büyüyü Yaptığınızda veya Sürdürdüğünüzde yanılsamayla Dikkat Dağıtmayı deneyebilir ve Aldatma testinize +2 durumsal bonus kazanırsınız. Bu deneme bir yaratığa karşı başarısız olursa, o yaratık hayal kırıntısına inanmaz.

omen://spell/fire-ray?source=paizo-pathfinder-player-core:
  name: Ateş Işını
  description: "Alev alev yanan bir ateş kuşağı havada kavis çizerek rakibinizi ve üzerinde durduğu zemini ateşe verir. Hedefin SD'sine karşı bir büyü saldırı zarı atın. Işın bir isabette 2d6 ateş hasarı verir (veya kritik isabette iki kat hasar). Kritik başarısızlık dışındaki herhangi bir sonuçta hedefin alanındaki zemin alev alır ve karelerden birinde turunu bitiren her yaratığa (spell rank)d6[fire] hasar verir. Güçlendirilmiş (+1) Işının ilk hasarı 2d6 artar ve yanan alanın verdiği ateş hasarı 1d6 artar."

omen://spell/fire-shield?source=paizo-pathfinder-player-core:
  name: Ateş Kalkanı
  description: >
    Ateşten oluşan süzülen bir kalkan yaratırsınız. Kalkan varlığını sürdürdüğü sürece yaydığı ısı size soğuk direnci 5 verir ve sizi hafif ve şiddetli çevresel soğuğa karşı bağışık kılar. Ateş kalkanıyla normal bir kalkan gibi Kalkan Kaldırarak SD'nize +1 durumsal bonus kazanabilirsiniz. Sertliği 10 olan, ateşe bağışık olan ve 40 CP'ye sahip olan (Kırılma Eşiği yoktur) ateş kalkanıyla Kalkan Siperi reaksiyonunu kullanabilirsiniz; Sertliği su özelliğine sahip etkilere karşı yarıya iner. Silahsız bir saldırı olan veya bitişikteki bir saldırgan tarafından yapılan bir yakın dövüş saldırısına karşı Kalkan Siperi yaparsanız, saldırgan 2d6 ateş hasarı alır.

    Güçlendirilmiş (+2) Soğuk direnci 5 artar, CP 10 artar ve ateş hasarı 1d6 artar.

omen://spell/fireball?source=paizo-pathfinder-player-core:
  name: Ateş Topu
  description: >
    Belirlediğiniz bir noktada kükreyen bir ateş patlaması infilak ederek 6d6 ateş hasarı verir.

    Güçlendirilmiş (+1) Hasar 2d6 artar.

omen://spell/flame-barrier?source=paizo-pathfinder-player-core:
  name: Alev Bariyeri
  description: >
    Tetikleyici: Bir etki size veya menzildeki bir müttefikinize ateş hasarı vereceğinde.

    Gelen alevleri hızla saptırırsınız. Hedef, tetikleyici etkiye karşı ateş direnci 15 kazanır.

    Güçlendirilmiş (+2) Direnç 5 artar.

omen://spell/fleet-step?source=paizo-pathfinder-player-core:
  name: Seri Adım
  description: Hareket Hızınıza +30 fitlik statü bonusu kazanırsınız.

omen://spell/flicker?source=paizo-pathfinder-player-core:
  name: Pırpır
  description: >
    Mevcut düzleminiz ile bir başkası arasında hızla titreşirsiniz. Kuvvet hariç tüm hasarlara karşı direnç 5 kazanırsınız. Her sıranızın sonunda, GM tarafından belirlendiği üzere rastgele bir yöne otomatik olarak 10 fit ışınlanırsınız. Bu şekilde ışınlanmak için büyüyü Sürdürebilirsiniz.

    Güçlendirilmiş (+2) Direnç 3 artar.

omen://spell/floating-flame?source=paizo-pathfinder-player-core:
  name: Süzülen Alev
  description: >
    Yakıtsız yanan ve emirlerinizle hareket eden bir ateş yaratırsınız. Alev, belirdiği karedeki her yaratığa temel bir Refleks kurtarışıyla 3d6 ateş hasarı verir. Bu büyüyü Sürdürdüğünüzde alevi 10 fite kadar havaya kaldırabilirsiniz. Ardından uçuşu sırasında herhangi bir noktada alanını paylaştığı her yaratığa hasar verir. Bu aynı hasarı ve kurtarışı kullanır ve her Sürdürdüğünüzde hasarı bir kez atarsınız. Belirli bir yaratık süzülen alevden sıra başına yalnızca bir kez hasar alabilir.

    Güçlendirilmiş (+1) Hasar 1d6 artar.

omen://spell/fly?source=paizo-pathfinder-player-core:
  name: Uçuş
  description: >
    Hedef gökyüzünde süzülebilir, Hareket Hızına veya 20 fite (hangisi daha yüksekse) eşit bir uçma Hareket Hızı kazanır.

    Güçlendirilmiş (7.) Süre 1 saate uzar.

omen://spell/forbidding-ward?source=paizo-pathfinder-player-core:
  name: Men Eden Muhafaza
  description: >
    Bir müttefikinizi hedef düşmanın saldırılarına ve düşmanca büyülerini karşı korursunuz. Hedef müttefik hedef düşmanın saldırılarına, büyülerine ve diğer etkilerine karşı Savunma Değerine ve kurtarışlara +1 statü bonusu kazanır.

    Güçlendirilmiş (6.) Statü bonusu +2'ye yükselir.

omen://spell/force-barrage?source=paizo-pathfinder-player-core:
  name: Güç Barajı
  description: >
    Gördüğünüz bir yaratığa doğru katılaşmış büyüden bir şarapnel ateşlersiniz. Otomatik olarak isabet eder ve 1d4+1 kuvvet hasarı verir. Büyüyü Yaparken kullandığınız her ek eylem için attığınız şarapnel sayısını bir artırırsınız; 3 eylem karşılığında en fazla üç şarapnel fırlatabilirsiniz. Her şarapnelin hedefini ayrı ayrı seçersiniz. Aynı hedefe birden fazla şarapnel fırlatırsanız, hasara bonusları veya cezaları, dirençleri, zaafları ve benzerlerini uygulamadan önce hasarı birleştirin.

    Güçlendirilmiş (+2) Harcadığınız her eylemle fazladan bir şarapnel ateşlersiniz.

omen://spell/force-bolt?source=paizo-pathfinder-player-core:
  name: Güç Oku
  description: >
    Savaş büyüsünün en yaygın ve güvenilir biçimlerinden biri olan ok şeklinde bir kuvvet oku fırlatırsınız. Otomatik olarak vurur ve hedefe 1d4+1 kuvvet hasarı verir.

    Güçlendirilmiş (+2) Hasar 1d4+1 artar.

omen://spell/foresight?source=paizo-pathfinder-player-core:
  name: Öngörü
  description: "Büyünün hedefinin başına gelebilecek tehlikelere karşı sizi uyaran altıncı bir his kazanırsınız. Hedef olarak kendinizden başka bir yaratık seçerseniz, hedefi tehlikeden haberdar edebileceğiniz psişik bir bağ kurarsınız. Bu bağ zihinsel bir etkidir. Bu büyünün işlemenizi gerektirdiği bilgi miktarı nedeniyle aynı anda birden fazla öngörü büyüsünü etkin kılamazsınız. Tekrar öngörü yapmak önceki öngörüyü sona erdirir. Öngörü etkinken hedef inisiyatif zarlarına +2 statü bonusu kazanır ve Konumu Saptanmamış yaratıklara karşı ya da kıstırıldığında Gafil kalmaz. Buna ek olarak aşağıdaki reaksiyonu kazanırsınız: Öngörü"

omen://spell/fortify-summoning?source=paizo-pathfinder-player-core:
  name: Çağrıyı Güçlendir
  description: Yanınıza bir yaratık çağırdığınızda, büyünüz onun bedenini dönüştürerek yırtıcılığını artırır ve direncini pekiştirir. Hedef, çağrılma süresi boyunca (1 dakikaya kadar) tüm testlerine ve ZD'lerine (SD'si dahil) +1 statü bonusu kazanır.

omen://spell/fortissimo-composition?source=paizo-pathfinder-player-core:
  name: Fortissimo Bestesi
  description: "Cesur marş, toparlanma marşı veya kuvvet şarkısı bestenizle sağladığınız faydaları büyük ölçüde artırmak için ilham perinize çağrıda bulunursunuz. Bir sonraki eyleminiz bu bestelerden birini yapmak ise bir performance|against:will testi deneyin. ZD genellikle bestenin hedeflerinin en yüksek İrade ZD'sidir; ancak GM koşullara bağlı olarak farklı bir ZD belirleyebilir. Bestenizin etkisi testinizin sonucuna bağlıdır. Kritik Başarı Bestenizden gelen statü bonusu +3'e yükselir. Başarı Bestenizden gelen statü bonusu +2'ye yükselir. Başarısızlık Besteniz yalnızca normal +1 bonusunu sağlar, ancak bu büyüyü yapmak için Odak Puanını harcamazsınız."

omen://spell/freeze-time?source=paizo-pathfinder-player-core:
  name: Zamanı Dondur
  description: "Kendiniz dışındaki her şey için zamanı geçici olarak durdurur ve başkalarına hiç zaman geçmemiş gibi görünen bir anda birkaç eylem kullanmanıza olanak tanırsınız. Zamanı dondur büyüsünü yaptıktan hemen sonra her biri en fazla 3 eylemden oluşan 3 set halinde en fazla 9 eylem kullanabilirsiniz. Her eylem setinden sonra yalnızca sizin için, özellikle sizi hedef alan veya etkileyen etkiler için ve duraklama sırasında yarattığınız etkiler için 1 tur geçer. Diğer tüm yaratıklar ve nesneler saldırılarınıza karşı dokunulmazdır ve onları hiçbir şeyle hedefleyemez veya etkileyemezsiniz. Eylemlerinizi bitirdiğinizde dünyanın geri kalanı için zaman yeniden akmaya başlar. Zamanı dondur büyüsünün süresini aşan bir süreye sahip bir etki yarattıysanız (Ateş Duvarı gibi), diğerlerini derhal yeniden etkiler; ancak Büyüyü ilk Yaptığınızda meydana gelen etkilerden hiçbirine sahip olmaz."

omen://spell/frostbite?source=paizo-pathfinder-player-core:
  name: Soğuk Isırığı
  description: >
    Hedefinizin etrafında dondurucu bir soğuk küresi birikerek bedenini dondurur. Hedef temel bir Dayanıklılık kurtarışıyla 2d4 soğuk hasarı alır. Kritik bir başarısızlıkta hedef bir sonraki sıranızın başlangıcına kadar ezici hasara karşı zaaf 1 kazanır.

    Güçlendirilmiş (+1) Hasar 1d4 artar ve kritik başarısızlıktaki zaaf 1 artar.

omen://spell/gate?source=paizo-pathfinder-player-core:
  name: Geçit
  description: Başka bir düzleme giden bir yarık açarak yaratıkların her iki yönde de geçebileceği bir portal yaratırsınız. Bu portal dikey ve daireseldir, yarıçapı 40 fittir. Portal, hem varış noktasının düzlemdeki konumu hem de varış noktasının neye benzediği hakkında net bir fikriniz olması koşuluyla hedef düzlemde seçtiğiniz bir konumda belirir. Bir ilahın veya benzer derecede güçlü bir varlığın alemine ya da o alemden dışarıya bir geçit açmaya çalışırsanız, o varlık geçidin oluşmasını engelleyebilir.

omen://spell/geas?source=paizo-pathfinder-player-core:
  name: Geas
  description: >
    Gönüllü bir hedefe büyülü bir kural dayatarak onu belirli bir eylemi gerçekleştirmeye veya bundan kaçınmaya zorlarsınız. Bir eylemi gerçekleştirmeye yönelik bir geas genellikle koşulludur; örneğin "Konaklayacak bir yer arayan yabancılara her zaman konukseverlik göster." Belirli bir eylemi gerçekleştirmeye yönelik koşulsuz bir geas hedefin yalnızca o eylemi gerçekleştirmesini gerektirmez, ancak görevi tüm eğlenceli uğraşların üzerinde tutmalıdır. Bir eylemi gerçekleştirmekten kaçınmaya yönelik en yaygın geas, bir sözleşmeyi ihlal etmekten kaçınma şartıdır. Bu durumlarda ikincil büyücü genellikle sözleşmenin ifadesinin ritüelin büyüsüyle doğru bir şekilde uyumlandığından emin olma görevini üstlenir. Hedef gönüllü olduğu için geas hedefin kabul ettiği süre boyunca geçerli olabilir. Hedef geas'ı yerine getiremezse Midesi Bulanmış 1 olur ve geas'a uyması engellendiği birbirini izleyen her gün için midesi bulanmış durumu 1 artar (en fazla midesi bulanmış 4). Tekrar geas'a uyduğunda midesi bulanmış durumu derhal sona erer; midesi bulanmış durumunu başka hiçbir yolla kaldıramaz. Gönüllü bir hedeften geas'ın etkilerini yalnızca Dilek ritüeli gibi güçlü bir büyü kaldırabilir.

    Kritik Başarı Geas başarılı olur ve hedef, doğrudan geas'ı destekleyen beceri testlerine +1 statü bonusu alır (GM'nin takdirine bağlı olarak).

    Başarı Geas başarılı olur.

    Başarısızlık Geas başarısız olur.

    Kritik Başarısızlık Geas başarısız olur ve hedefe yerleştirmeye çalıştığınız geas'tan siz etkilenirsiniz. İsteksiz bir hedef sayılırsınız, bu nedenle geas bir İlleti Temizle büyüsüyle etkisiz kılınabilir.

    Güçlendirilmiş (5.) Geas'ı isteksiz bir yaratık üzerinde kullanabilirsiniz; etkiyi geçersiz kılmak için bir İrade kurtarışı deneyebilir. Hedef bu İrade kurtarışında başarısız olursa geas 1 haftaya kadar sürer. İsteksiz bir yaratık üzerindeki geas'ı, dilek ritüeli gibi güçlü büyülerin yanı sıra bir illeti temizle büyüsü de etkisiz kılabilir. Zeki bir isteksiz yaratık, uymasını engelleyen durumlar tasarlayarak geas'ı alt edebilir, ancak bu durumda Midesi Bulanmış olur (yukarıda açıklandığı gibi).

    Güçlendirilmiş (7.) 5. derecedeki gibidir, ancak isteksiz bir yaratık üzerinde geas 1 yıla kadar sürer.

    Güçlendirilmiş (9.) 5. derecedeki gibidir, ancak istekli bir yaratık üzerinde seçtiğiniz bir süre boyunca (hatta sınırsız) sürer.

omen://spell/gecko-grip?source=paizo-pathfinder-player-core:
  name: Gekko Tutunuşu
  description: >
    Yaratığın ellerinde ve ayaklarında neredeyse her yüzeye tutunmayı sağlayan minik yapışkan kıllar filizlenir. Hedef, Hareket Hızına eşit bir tırmanma Hareket Hızı kazanır.

    Güçlendirilmiş (5.) Süre 1 saate uzar.

omen://spell/gentle-landing?source=paizo-pathfinder-player-core:
  name: Yumuşak İniş
  description: >
    Tetikleyici: Menzildeki bir yaratık düşmektedir.

    Düşüşü durdurmak için büyülü bir yukarı hava akımı yükseltirsiniz. Hedefin düşüşü tur başına 60 fite yavaşlar ve büyünün süresi boyunca gerçekleşen düşüş kısmı, düşme hasarı hesaplanırken sayılmaz. Büyü etkinken hedef yere ulaşırsa düşüşten hasar almaz. Hedef yere iner inmez büyü sona erer.

omen://spell/ghostly-carrier?source=paizo-pathfinder-player-core:
  name: Hayalet Taşıyıcı
  description: Seçtiğiniz bir biçimde Minik, yarı cismani bir figür yaratırsınız. Süre boyunca yakınınızda süzülür. Menzili dokunuş olan bir Büyü Yaptığınızda taşıyıcının menzil içinde hareket etmesini, büyüyü oradaki bir yaratığa iletmesini ve size geri dönmesini sağlayabilirsiniz. Taşıyıcının bir büyü saldırı zarı atması gerekiyorsa normal bonuslarınızı kullanır. Taşıyıcı sizin SD'nize ve kurtarışlarıza sahiptir, ancak herhangi bir hasar aldığında yok olur.

omen://spell/ghostly-weapon?source=paizo-pathfinder-player-core:
  name: Hayalet Silah
  description: "Hedef silah yarı saydam ve hayaletsi hale gelir; maddi ve cisimsiz yaratıkları ve nesneleri etkileyebilir. Hayalet Dokunuşu özellik rününün etkilerini kazanır; yani zaten büyülü değilse büyülü hale gelir, cisimsiz yaratıklara karşı özellikle etkilidir ve cismani veya cisimsiz bir yaratık tarafından kullanılabilir."

omen://spell/glimpse-the-truth?source=paizo-pathfinder-player-core:
  name: Hakikate Bakış
  description: >
    İlahi içgörü, gerçeği büyüyle gizleme girişimlerinden sıyrılarak şeyleri oldukları gibi görmenizi sağlar. GM, en azından kısmen alanın içinde olan her illüzyona karşı gizli bir etkisiz kılma testi yapar. Yanılsamayı etkisiz kılmak yerine ardını görürsünüz (örneğin Yanılsama Kılık büyüsüne karşı test başarılı olursa yaratığın gerçek formunu görürsünüz ancak yanılsama kılık sona ermez). Büyünün süresi boyunca auraya her yeni yanılsama girdiğinde GM o yanılsama için gizli bir etkisiz kılma testi dener.

    Güçlendirilmiş (7.) Yalnızca kendinizin değil, yayılım menzilindeki herkesin başarılı olduğunuz yanılsamaların ardını görmesini sağlayabilirsiniz.

omen://spell/goblin-pox?source=paizo-pathfinder-player-core:
  name: Goblin Çiçeği
  description: >
    Dokunuşunuz hedefi rahatsız edici alerjik bir döküntü olan goblin çiçeğine maruz bırakır. Hedef bir Dayanıklılık kurtarışı denemelidir. Goblin Çiçeği (hastalık) Seviye 1; Goblin özelliğine sahip yaratıklar ve goblin köpekleri bağışıktır Aşama 1 Midesi Bulanmış 1 (1 tur) Aşama 2 Midesi Bulanmış 1 ve Yavaşlatılmış 1 (1 tur) Aşama 3 Midesi Bulanmış 1 ve yaratık Midesi Bulanmış değerini 1'in altına indiremez (1 gün)

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef Midesi Bulanmış 1 olur.

    Başarısızlık Hedef aşama 1'de goblin çiçeğine yakalanır.

    Kritik Başarısızlık Hedef aşama 2'de goblin çiçeğine yakalanır.

omen://spell/gouging-claw?source=paizo-pathfinder-player-core:
  name: Oyan Pençe
  description: >
    Uzuvunuzu geçici olarak pençeli bir uzva dönüştürürsünüz. Hedefinizin SD'sine karşı bir yakın dövüş büyü saldırısı yapın. Vurursanız tercihinize göre 2d6 kesici hasar veya 2d6 delici hasar, artı 2 süren kanama hasarı verirsiniz. Kritik başarıda iki kat hasar ve iki kat kanama hasarı verirsiniz.

    Güçlendirilmiş (+1) Hasar 1d6 artar ve süren kanama hasarı 1 artar.

omen://spell/gravity-weapon?source=paizo-pathfinder-player-core:
  name: Yerçekimi Silahı
  description: Yerçekimi kuvvetini biriktirir ve darbelerinize yönlendirerek hem kılıç hem de yayla daha güçlü saldırılar yaparsınız. Her turdaki ilk silah Vuruşunuzda silah hasar zarlarının sayısının iki katına eşit bir hasar statü bonusu kazanırsınız.

omen://spell/grease?source=paizo-pathfinder-player-core:
  name: Yağ
  description: >
    Bir alan veya hedef seçerek yağ var edersiniz. Alan [birbirine bitişik 4 adet 5 fitlik kare] Alandaki tüm katı zemin yağla kaplanır. Yağlı yüzeyde duran her yaratık, büyü ZD'nize karşı bir Refleks kurtarışında veya bir Akrobasi testinde başarılı olmalı, aksi takdirde Yerde durumuna düşmelidir. Büyünün süresi boyunca yağlı yüzeye hareket etmek için bir eylem kullanan yaratıklar, Dengede Kalmak için bir Refleks kurtarışı veya bir Akrobasi testi denemelidir. Adım atan veya Sürünen bir yaratığın bir test veya kurtarış denemesi gerekmez. Hedef [Bulk'ı 1 veya daha az olan 1 nesne] Büyüyü sahipsiz bir nesneye Yaparsanız, nesneyi almaya çalışan herkes bunu yapmak için büyü ZD'nize karşı bir Akrobasi testinde veya Refleks kurtarışında başarılı olmalıdır. Sahipli bir nesneyi hedeflerseniz, nesneye sahip olan yaratık bir Akrobasi testi veya Refleks kurtarışı denemelidir. Başarısızlık durumunda, nesneyi tutan veya kullanan kişi o nesneyi kullanmayı içeren tüm testlere –2 durumsal ceza alır; kritik başarısızlık durumunda nesneyi elinden bırakır. Nesne, GM'in seçeceği bitişik bir kareye düşer. Bu Büyüyü giyilen bir nesneye Yaparsanız, kullanıcı kendisini kavramaya yönelik girişimlere karşı Dayanıklılık kurtarışlarına +2 durumsal bonus kazanır.

omen://spell/grim-tendrils?source=paizo-pathfinder-player-core:
  name: Uğursuz Dokunaçlar
  description: "Karanlık dokunaçlar parmak uçlarınızdan kıvrılarak havada hızla ilerler. Hat üzerindeki canlı yaratıklara 2d4 boşluk hasarı ve (spell rank)[bleed] hasar verirsiniz. Hat üzerindeki her canlı yaratık bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık boşluk hasarının yarısını alır ve süren kanama hasarı almaz. Başarısızlık Yaratık tam hasar alır. Kritik Başarısızlık Yaratık iki kat boşluk hasarı ve iki kat süren kanama hasarı alır. Güçlendirilmiş (+1) Boşluk hasarı 2d4 artar ve süren kanama hasarı 1 artar."

omen://spell/guidance?source=paizo-pathfinder-player-core:
  name: Rehberlik
  description: Doğaüstü varlıkların rehberliğini dileyerek hedefe sürenin bitiminden önce deneyeceği bir saldırı zarına, Dikkat testine, kurtarışa veya beceri testine +1 statü bonusu bahşedersiniz. Hedef zarı atmadan önce bonusu hangi zarda kullanacağını seçer. Hedef bonusu kullanırsa büyü sona erer. Her iki durumda da hedef ardından 1 saat boyunca geçici olarak bağışık olur.

omen://spell/gust-of-wind?source=paizo-pathfinder-player-core:
  name: Rüzgâr Esintisi
  description: >
    Avucunuzdan şiddetli bir rüzgâr çıkarak Büyüyü Yaptığınız noktadan hattın karşı ucuna doğru eser. Rüzgâr küçük büyü dışı ateşleri söndürür, sis ve pusu dağıtır, Hafif Bulk veya daha düşük nesneleri savurur ve daha büyük nesneleri iter. Alandaki Büyük veya daha küçük yaratıklar bir Dayanıklılık kurtarışı denemelidir. Daha sonra rüzgârın içine giren Büyük veya daha küçük yaratıklar alana girdiklerinde kurtarışı denemelidir.

    Kritik Başarı Yaratık etkilenmez.

    Başarı Yaratık rüzgâra karşı hareket edemez.

    Başarısızlık Yaratık Yüzüstü yere serilir. Uçuyorsa bunun yerine kritik başarısızlığın etkilerini alır.

    Kritik Başarısızlık Yaratık rüzgâr yönünde 30 fit itilir, yüzüstü yere serilir ve 2d6 ezici hasar alır.

omen://spell/hallucination?source=paizo-pathfinder-player-core:
  name: Halüsinasyon
  description: >
    Hedef sürekli olarak bir şeyi başka bir şey olarak algılar, orada olan bir şeyi algılayamaz veya orada olmayan bir şeyi algılar; ancak bu durum inançlarını değiştirmez. Bu etkilerden hangisinin geçerli olacağını siz seçersiniz ve halüsinasyonun ayrıntılarını siz belirlersiniz. Örneğin hedefin tüm elfleri insan olarak görmesini, kardeşinin varlığını algılayamamasını, üzerinde olmadığı halde sevgili şans tılsımını üzerinde görmesini veya kasabanın merkezinde bir kule görmesini sağlayabilirsiniz. Hedef aşağıdaki etkilerle bir ilk İrade kurtarışı deneyebilir. Ayrıca halüsinasyona her Tara eylemini yaptıklarında veya doğrudan etkileşime girdiklerinde halüsinasyona inanmamak için bir İrade kurtarışı kazanırlar. Örneğin hedef bir elfle her etkileşime girdiğinde, kardeşine kazara çarptığında, tılsımını kontrol etmeye çalıştığında veya kuleyi incelediğinde halüsinasyona inanmamayı deneyebilir. Hedef GM tarafından belirlenen durumlarda büyük bir durumsal bonusla inanmamayı deneyebilir; örneğin var olmayan kuleye tırmanmaya çalışması gibi.

    Kritik Başarı Yaratık etkilenmez.

    Başarı Yaratık inanmayana kadar seçtiğiniz şeyi algılar, ancak halüsinasyonun ne olduğunu bilir.

    Başarısızlık Yaratık inanmayana kadar seçtiğiniz şeyi algılar.

    Kritik Başarısızlık Yaratık inanmayana kadar seçtiğiniz şeyi algılar ve yanlış duyularına güvenir, inanmamaya yönelik kurtarışlara -4 durumsal ceza alır.

    Güçlendirilmiş (6.) En fazla 10 yaratığı hedeflemeyi veya büyünün süresini bir sonraki günlük hazırlıklarınıza kadar olarak değiştirmeyi seçin.

    Güçlendirilmiş (8.) Dilediğiniz sayıda yaratığı hedeflemeyi veya büyünün süresini sınırsız olarak değiştirmeyi seçin.

omen://spell/hand-of-the-apprentice?source=paizo-pathfinder-player-core:
  name: Çırağın Eli
  description: "Silahınızı havaya kaldırmak ve fırlatmak için büyünün en temel derslerinden birinden yararlanırsınız. Eğitimli olduğunuz elde tutulan bir yakın dövüş silahını hedefe fırlatarak bir büyü saldırı zarı atarsınız. Başarıda yakın dövüş Vuruşuyla vurmuş gibi silahın hasarını verirsiniz; ancak hasara Kuvvet niteleyiciniz yerine büyücülük nitelik niteleyicinizi eklersiniz. Kritik başarıda iki kat hasar verirsiniz ve silahın kritik uzmanlaşma etkisini eklersiniz. Sonuç ne olursa olsun silah size geri uçar ve elinize döner."

omen://spell/harm?source=paizo-pathfinder-player-core:
  name: Zarar Ver
  description: >
    Canlılara zarar vermek veya hortlakları iyileştirmek için boşluk enerjisini kanalize edersiniz. Hedef canlı bir yaratıksa ona 1d8 boşluk hasarı verirsiniz ve temel bir Dayanıklılık kurtarışı kazanır. Hedef gönüllü bir hortlak yaratıksa bu miktarda Can Puanını yenilersiniz. Bu Büyüyü Yaparken harcadığınız eylem sayısı hedeflerini, menzilini, alanını ve diğer parametrelerini belirler. 1 Büyünün menzili dokunuştur. 2 (odaklanma) Büyünün menzili 30 fittir. Bir hortlağı iyileştiriyorsanız yenilenen Can Puanını 8 artırın. 3 (odaklanma) Boşluk enerjisini bir yayılım halinde dağıtırsınız. Bu alandaki tüm canlı ve hortlak yaratıkları hedefler.

    Güçlendirilmiş (+1) İyileşme veya hasar miktarı 1d8 artar ve 2 eylemli versiyondaki ekstra iyileşme 8 artar.

omen://spell/haste?source=paizo-pathfinder-player-core:
  name: Hızlandır
  description: >
    Büyü hedefi daha hızlı hareket etmesi için güçlendirir. Hızlandırılmış durumunu kazanır ve her tur fazladan eylemi yalnızca Vuruş Yap ve Depar eylemleri için kullanabilir.

    Güçlendirilmiş (7.) En fazla 6 yaratığı hedefleyebilirsiniz.

omen://spell/heal-animal?source=paizo-pathfinder-player-core:
  name: Hayvanı İyileştir
  description: >
    Bir hayvanın yaralarını sararak hedefin 1d8 Can Puanını yenilersiniz. Bu Büyüyü Yapmak için harcanan eylem sayısı etkisini belirler. 1 Büyünün menzili dokunuştur. 2 (odaklanma) Büyünün menzili 30 fittir ve hedefin ilave 8 Can Puanını yeniler.

    Güçlendirilmiş (+1) İyileşme miktarı 1d8 artar ve 2 eylemli versiyondaki ek iyileşme 8 artar.

omen://spell/heal-companion?source=paizo-pathfinder-player-core:
  name: Yoldaşı İyileştir
  description: >
    Yoldaş Hayvanınızın yaralarını sararsınız. Yoldaş Hayvanınızın 1d10 Can Puanını yenilersiniz. Bu Büyüyü Yapmak için harcadığınız eylem sayısı menzili ve diğer parametreleri belirler. 1 (manipüle) Büyünün menzili dokunuştur. 2 (odaklanma, manipüle) Büyünün menzili 30 fittir ve hedefin ilave 8 Can Puanını yeniler.

    Güçlendirilmiş (+1) İyileşme miktarı 1d10 artar ve 2 eylemli versiyondaki ek iyileşme 8 artar.

omen://spell/heal?source=paizo-pathfinder-player-core:
  name: İyileştir
  description: >
    Canlıları iyileştirmek veya hortlaklara zarar vermek için canlılık enerjisini kanalize edersiniz. Hedef gönüllü canlı bir yaratıksa 1d8 Can Puanını yenilersiniz. Hedef bir hortlaksa ona bu miktarda canlılık hasarı verirsiniz ve temel bir Dayanıklılık kurtarışı kazanır. Bu Büyüyü Yaparken harcadığınız eylem sayısı hedeflerini, menzilini, alanını ve diğer parametrelerini belirler. 1 Büyünün menzili dokunuştur. 2 (odaklanma) Büyünün menzili 30 fittir. Canlı bir yaratığı iyileştiriyorsanız yenilenen Can Puanını 8 artırın. 3 (odaklanma) Canlılık enerjisini bir yayılım halinde dağıtırsınız. Bu patlamadaki tüm canlı ve hortlak yaratıkları hedefler.

    Güçlendirilmiş (+1) İyileşme veya hasar miktarı 1d8 artar ve 2 eylemli versiyondaki ekstra iyileşme 8 artar.

omen://spell/healers-blessing?source=paizo-pathfinder-player-core:
  name: Şifacının Kutsaması
  description: >
    Sözleriniz bir yaratığı canlılık enerjisiyle gelişmiş bir bağla kutsar. Hedef iyileştirici bir canlılık büyüsünden Can Puanı geri kazandığında ilave 2 Can Puanı geri kazanır. Hedef şifacının kutsamasından yalnızca belirli bir iyileştirme büyüsünden ilk kez CP kazandığında fazladan Can Puanı kazanır; bu nedenle yaratığı bir süre boyunca tekrar tekrar iyileştiren bir büyü, yalnızca ilk iyileştirmede ilave Can Puanı yeniler.

    Güçlendirilmiş (+1) İlave iyileşme 2 CP artar.

omen://spell/heroism?source=paizo-pathfinder-player-core:
  name: Kahramanlık
  description: >
    Hedefin içindeki kahramanlığı açığa çıkararak ona saldırı zarlarına, Dikkat testlerine, kurtarışlara ve beceri testlerine +1 statü bonusu kazandırırsınız.

    Güçlendirilmiş (6.) Statü bonusu +2'ye yükselir.

    Güçlendirilmiş (9.) Statü bonusu +3'ye yükselir.

omen://spell/holy-light?source=paizo-pathfinder-player-core:
  name: Mübarek Işık
  description: >
    Mübarek enerjiyle bezenmiş alev saçan bir ışık huzmesi parlarsınız. Menzilli bir büyü saldırısı yapın. Işın 5d6 ateş hasarı verir. Hedef şerli özelliğine sahipse fazladan 5d6 ruh hasarı verirsiniz.

    Kritik Başarı Hedef iki kat hasar alır.

    Başarı Hedef tam hasar alır. Işık büyülü bir karanlık alanından geçerse veya büyülü karanlıktan etkilenen bir yaratığı hedeflerse mübarek ışık karanlığı etkisiz kılmaya çalışır. Işığın bir karanlık alanından geçip geçmediğini belirlemeniz gerekiyorsa kendinizle büyünün hedefi arasına bir çizgi çekin.

    Güçlendirilmiş (+1) Ateş hasarı 2d6 artar ve şerli yaratıklara karşı ruh hasarı 2d6 artar.

omen://spell/honeyed-words?source=paizo-pathfinder-player-core:
  name: Tatlı Sözler
  description: Yalanlar dudaklarınızdan ipek gibi dökülür. Yalan Söylemek için Aldatma testlerine ve doğruyu söyleyip söylemediğinizi anlamaya yönelik Dikkat testlerine karşı +4 statü bonusu kazanırsınız ve eğitimsiz olsanız bile seviyenizi eklersiniz. Yalanlarınızın akla yatkın olmaması bir durumsal cezasına veya bir ZD artışına yol açarsa bu cezayı yarıya indirin veya artışı yarıya indirin.

omen://spell/house-of-imaginary-walls?source=paizo-pathfinder-player-core:
  name: Hayali Duvarlar Evi
  description: Bitişiğinizde ve erişiminiz dahilinde Görünmez 10 fit x 10 fitlik bir duvar pandomimi yaparsınız. Duvar ona inanmayanlar dışındaki yaratıklar için, hatta cisimsiz yaratıklar için bile katıdır. Siz ve müttefikleriniz katı olarak görmeye devam etmek için (örneğin üzerine tırmanmak için) duvarın varlığına gönüllü olarak inanabilirsiniz. Yanılsamaya inanmayan bir yaratık 1 dakika boyunca hayali duvarlar evinize karşı geçici olarak bağışık olur. Duvar görsel performansınızı görmeyen yaratıkları engellemez, nesneleri de engellemez. Duvarın SD'si 10'dur, Sertliği büyünün derecesinin iki katına eşittir ve CP'si büyünün derecesinin dört katına eşittir.

omen://spell/howling-blizzard?source=paizo-pathfinder-player-core:
  name: Uğultulu Tipi
  description: >
    Dondurucu rüzgârlar ellerinizden uzanarak büyük bir kuvvetle sizden uzağa doğru iter. Bu Büyüyü 2 eylemle Yaparsanız 60 fitlik bir koni alanına sahiptir; bu Büyüyü 3 eylemle Yaparsanız 500 fit menzile ve 30 fitlik bir patlama alanına sahiptir. Alandaki her yaratık temel bir Refleks kurtarışıyla 10d6 soğuk hasarı alır. Kar yığınları ve buzlu fırtınalar bir sonraki sıranızın başlangıcına kadar alanı doldurarak alanı zorlu arazi haline getirir.

    Güçlendirilmiş (+1) Hasar 2d6 artar.

omen://spell/humanoid-form?source=paizo-pathfinder-player-core:
  name: İnsansı Form
  description: >
    Görünümünüzü cüce, elf, goblin, buçukluk, insan veya ork gibi Küçük veya Orta boy bir insansıya dönüştürürsünüz. Bu formdayken diğer özelliklerinize ek olarak insansı özelliğini ve yaratığın türüyle ilgili herhangi bir özelliği (goblin veya insan gibi) kazanırsınız. Bu dönüşüm boyutunuzu küçültürse erişiminizi de buna göre azaltır (genellikle 5 fite). Bu dönüşüm istatistiklerinizi hiçbir şekilde değiştirmez ve büründüğünüz insansı formun özel yeteneklerini kazanmazsınız. Yine de yeni formunuza uyacak şekilde boyutu değişen (gerekirse) teçhizatınızı giyebilir ve kullanabilirsiniz. Eşyalar üzerinizden ayrılırsa normal boyutlarına dönerler. İnsansı form seçilen soyun genel bir üyesi gibi görünmek için yapılan Aldatma testlerine +4 statü bonusu kazandırır ve eğitimsiz olsanız bile seviyenizi eklersiniz, ancak kendinizi belirli bir kişi gibi gösteremezsiniz. Bir bireyi Taklit Etmek istiyorsanız yine de bir kılık oluşturmanız gerekir; ancak GM Aldatma testinizin ZD'sini belirlerken soy farkını hesaba katmaz. Bu büyüyü Sonlandırabilirsiniz.

    Güçlendirilmiş (3.) Büründüğünüz form bu yeteneğe sahipse karanlıkgörüş veya loşgörüş kazanırsınız.

    Güçlendirilmiş (5.) Büyük bir insansı görünümüne bürünebilirsiniz. Bu boyutunuzu artırırsa Büyüt büyüsünün etkilerini kazanırsınız.

omen://spell/hunters-luck?source=paizo-pathfinder-player-core:
  name: Avcının Şansı
  description: >
    Tetikleyici: Bir yaratık hakkında Bilgi Hatırlamak için bir test denemek üzeresiniz, ancak henüz zar atmadınız.

    Düşmanlarınız hakkındaki ayrıntıları hatırlamak için doğaüstü bir yeteneğe sahipsinizdir. Tetikleyici testi iki kez atın ve daha iyi sonucu kullanın.

omen://spell/hunters-vision?source=paizo-pathfinder-player-core:
  name: Avcının Görüşü
  description: "Hedefiniz yalnızca sizin ve izinizi sürenlerin görebileceği büyülü bir aurayla parıldar. Hedefiniz aydınlatma ya da Belirsiz veya Görünmez durumları nedeniyle normalde görünmeyecek olsa bile siz ve Avını Avla avantajlarınızı paylaşan diğer kişiler tarafından görülebilir; ancak opak nesnelerden gelen siper yine de görüşünüzü engeller. Belirsiz durumu nedeniyle hedefe karşı yapılan düz testi yok sayarsınız ve hedef karanlık ya da Görünmez olması nedeniyle sizden otomatik olarak Gizlenmiş kalmaz."

omen://spell/hurtling-stone?source=paizo-pathfinder-player-core:
  name: Fırlayan Taş
  description: >
    Büyülü bir taş var eder ve nişanınıza ilahi rehberlikle taşı fırlatırsınız. Taş hedefin SD'sine karşı yapacağınız büyü saldırı zarına bağlı olarak 2d6 ezici hasar verir.

    Kritik Başarı Hedef iki kat hasar alır ve onu 10 fite kadar itebilirsiniz.

    Başarı Hedef tam hasar alır ve onu 5 fite kadar itebilirsiniz.

    Güçlendirilmiş (+1) Taşın hasarı 1d6 artar.

omen://spell/hydraulic-push?source=paizo-pathfinder-player-core:
  name: Hidrolik İtiş
  description: >
    Hedefi ezen ve geri püskürten güçlü bir basınçlı su patlaması çağırırsınız. Menzilli bir büyü saldırı zarı atın.

    Kritik Başarı Hedef 6d6 ezici hasar alır ve 10 fit geri püskürtülür.

    Başarı Hedef 3d6 ezici hasar alır ve 5 fit geri püskürtülür.

    Güçlendirilmiş (+1) Ezici hasar 2d6 artar.

omen://spell/hydraulic-torrent?source=paizo-pathfinder-player-core:
  name: Hidrolik Sel
  description: >
    Dönen bir su seli düz bir hat boyunca belirerek yolundaki yaratıkları ve sahipsiz nesneleri hırpalar ve muhtemelen sizden uzağa iter. Sel 8d6 ezici hasar verir. Alandaki her yaratık temel bir Dayanıklılık kurtarışı denemelidir; sahipsiz nesneler otomatik olarak başarısız olur. Başarısız olan yaratıklar ve nesneler ayrıca 5 fit geri püskürtülür (kritik başarısızlıkta 10 fit).

    Güçlendirilmiş (+1) Hasar 2d6 artar.

omen://spell/hymn-of-healing?source=paizo-pathfinder-player-core:
  name: Şifa İlahisi
  description: >
    Görkemli şarkınız yaraları sarar ve zarara karşı geçici bir soluklanma sağlar. Hedef hızlı iyileşme 2 kazanır. Büyüyü Yaptığınızda ve her tur Büyüyü ilk Sürdürdüğünüzde, hedef 1 tur süren 2 geçici Can Puanı kazanır.

    Güçlendirilmiş (+1) Hızlı iyileşme ve geçici Can Puanı her biri 2 artar.

omen://spell/hypercognition?source=paizo-pathfinder-player-core:
  name: İleri Kavrayış
  description: Mevcut durumunuzla ilgili bilgileri hızla kataloglar ve harmanlarsınız. Bu Büyüyü Yapmanın bir parçası olarak anında en fazla 6 Bilgi Hatırla eylemi kullanabilirsiniz. Bu eylemler için Bilgi Hatırladığınızda tetiklenen hiçbir özel yeteneği, reaksiyonu veya serbest eylemi kullanamazsınız.

omen://spell/hypnotize?source=paizo-pathfinder-player-core:
  name: Hipnoz Et
  description: >
    Havada asılı duran büyüleyici desenler ve renklerden bir bulut yaratırsınız. Yaratıklar bulutun içindeyken Gözü Kamaşmış olur. Buna ek olarak bir yaratık büyüyü yaptığınızda bulutun içindeyse, buluta girdiğinde, sırasını bulutun içinde tamamladığında ya da bulut üzerinde Tara veya Etkileşime Gir eylemi kullanırsa bir İrade kurtarış denemelidir. Halihazırda hipnoz et ile Kendini Kaptırmış bir yaratık yeni kurtarış denemez.

    Başarı Hedef etkilenmez.

    Başarısızlık Hedef buluta kendini kaptırır.

    Kritik Başarısızlık Hedef buluta kendini kaptırır. Kendini Kaptırmış kaldığı sürece reaksiyonları kullanamaz.

omen://spell/ignite-ambition?source=paizo-pathfinder-player-core:
  name: Hırsı Körükle
  description: >
    Tetikleyici: Siz veya menzildeki bir müttefikiniz bir yaratığı bir şey yapmaya ikna etmek için zihinsel bir etki kullanmaya kalkıştığında (Tehditle Zorla, Talep Et veya Telkin büyüsü gibi).

    Hedefin hırsını güçlendirir, müttefiklerine karşı kırgınlığını artırır ve bağlılıklarını değişime daha açık hale getirirsiniz. Hedef bir İrade kurtarışı denemelidir.

    Kritik Başarı Hedef etkilenmez ve tepkisini büyüyle etkilemeye çalıştığınızı fark eder.

    Başarı Hedef tetikleyici etkiye karşı savunmalarına -1 statü cezası alır. Hedef kendi hırslarını ilerletmeye teşvik ediliyorsa bu ceza -2 olur. Hedef üzerine Büyüyü Yaptığınızı fark etmez.

    Başarısızlık Başarıdaki gibidir, ancak hedef kendi hırslarını ilerletmeye teşvik ediliyorsa ceza -4 olur.

    Kritik Başarısızlık Başarıdaki gibidir, ancak yaratık kendi hırslarını ilerleten bir telkini otomatik olarak yerine getirir.

omen://spell/ignition?source=paizo-pathfinder-player-core:
  name: Tutuşturma
  description: >
    Parmaklarınızı şıklatır ve tütmeye başlayan bir hedefi işaret edersiniz. Hedefin SD'sine karşı bir büyü saldırı zarı atın; vuruş halinde 2d4 ateş hasarı verirsiniz. Hedef yakın dövüş erişiminiz içindeyse menzilli büyü saldırısı yerine alevle yakın dövüş büyü saldırısı yapmayı seçebilirsiniz; bu büyünün tüm hasar zarlarını d6'ya yükseltir.

    Kritik Başarı Hedef iki kat hasar ve 1d4 süren ateş hasarı alır.

    Başarı Hedef tam hasar alır.

    Güçlendirilmiş (+1) Başlangıç hasarı 1d4 artar ve kritik vuruştaki süren ateş hasarı 1d4 artar. Dereceli Süren Ateş Hasarı Dereceli Süren Ateş Hasarı (Yakın Dövüş)

omen://spell/ill-omen?source=paizo-pathfinder-player-core:
  name: Kötü Alamet
  description: >
    Hedefe talihsizlik çarparak dengesini bozar. Hedef bir İrade kurtarışı denemelidir.

    Başarı Hedef etkilenmez.

    Başarısızlık Süre boyunca hedefin bir saldırı zarı veya beceri testi denediği ilk seferde iki kez zar atmalı ve daha kötü sonucu kullanmalıdır.

    Kritik Başarısızlık Süre boyunca hedefin bir saldırı zarı veya beceri testi denediği her seferde iki kez zar atmalı ve daha kötü sonucu kullanmalıdır.

omen://spell/illusory-creature?source=paizo-pathfinder-player-core:
  name: Yanılsama Yaratık
  description: "Büyük veya daha küçük bir yaratığın yanılsama bir görüntüsünü yaratırsınız. Uygun sesleri, kokuları üretir ve dokunulduğunda inandırıcı hissettirir. Siz ve görüntü birbirinizden 500 fitten daha fazla uzaklaşırsanız büyü sona erer. Görüntü konuşamaz, ancak eylemlerinizi yaratık aracılığıyla konuşmak için kullanabilirsiniz; büyü sesinizi uygun şekilde gizler. GM tarafından belirlendiği üzere yaratığı taklit etmek için bir Aldatma veya Gösteri testi denemeniz gerekebilir. Bu, özellikle belirli bir kişiyi taklit etmeye çalışıyorsanız ve o kişinin tanıdığı biriyle etkileşime giriyorsanız geçerlidir. Çatışmada illüzyon her tur 2 eylem kullanabilir ve bunu siz büyüyü Sürdürdüğünüzde harcar. Saldırı zarları için büyü saldırı bonusunuzu, SD'si için büyü ZD'nizi kullanır. Kurtarış bonusları büyü ZD'niz – 10'a eşittir. Diğer yaratıkları kıstırabilecek kadar cismanidir. Görüntü bir saldırıdan isabet alırsa veya bir kurtarışta başarısız olursa büyü sona erer. İllüzyon, hedefin illüzyonun saldırılarının gerçek olduğuna inanmasını sağlayarak hasara yol açabilir, ancak aksi takdirde fiziksel dünyayı doğrudan etkileyemez. Yanılsama yaratık bir Vuruş ile isabet ettirirse hedef 3d4[mental] hasar alır. İllüzyonun Vuruşları ölümcül değildir. Hasar canavarın görüntüsüne karşılık gelmiyorsa—örneğin yanılsama Büyük bir ejderha yalnızca 5 hasar veriyorsa—GM hedefin büyüye inanmamak için anında bir Dikkat testi denemesine izin verebilir. Hedef geçerli olduğunu düşündüğü takdirde, GM'nin takdirine bağlı olarak ilgili tüm dirençler ve zaaflar uygulanır. Örneğin illüzyon bir savaş çekici kullanıyor ve ezici hasara dirençli bir yaratığa saldırıyorsa yaratık daha az zihinsel hasar alır. Bununla birlikte yanılsama hasarı yenilenmeyi devre dışı bırakmaz veya belirli bir hasar türü gerektiren diğer etkileri tetiklemez. GM illüzyonun verdiği yanılsama hasarı takip etmelidir. Görüntüye dokunan veya onu incelemek için Tara eylemini kullanan herhangi bir yaratık illüzyonunuza inanmamayı deneyebilir. Bir yaratık illüzyona inanmadığında, ondan aldığı hasarın yarısını toparlar (varsa) ve ondan başka hasar almaz. Güçlendirilmiş (+1) Görüntünün Vuruşlarının hasarı 1d4 artar ve yaratabileceğiniz maksimum yaratık boyutu bir basamak artar (en fazla Devasa)."

omen://spell/illusory-disguise?source=paizo-pathfinder-player-core:
  name: Yanılsama Kılık
  description: >
    Hedefin aynı vücut şekline ve kabaca benzer boy (6 inç dahilinde) ve kiloya (50 pound dahilinde) sahip başka bir yaratık gibi görünmesini sağlayan bir yanılsama yaratırsınız. Kılık genellikle kimliklerini gizlemek için yeterince iyidir, ancak belirli bir bireyi taklit etmek için uygun değildir. Büyü görünümlerini ve seslerini değiştirir ancak tavırlarını değiştirmez. Kıyafetlerinin ve üzerlerindeki eşyaların görünümünü değiştirebilirsiniz; örneğin zırhının elbise gibi görünmesini sağlayabilirsiniz. Elde tutulan eşyalar etkilenmez ve yaratıktan çıkarılan herhangi bir giyilen eşya gerçek görünümüne döner. Yanılsama kılık yapmak Aldatma'nın Taklit Et kullanımı için bir kılık hazırlamak sayılır; hedefin benzemeyen bir yaratık kılığına girmesinden dolayı alabileceği herhangi bir durumsal cezasını yok sayar, başkalarının kılığı fark etmesini engellemek için yapılan Aldatma testlerine +4 statü bonusu verir ve hedefin eğitimsiz olsa bile bu tür Aldatma testlerine seviyesini eklemesini sağlar. Bu büyüyü Sonlandırabilirsiniz.

    Güçlendirilmiş (3.) Hedef aynı boyuttaki herhangi bir yaratık gibi, hatta belirli bir birey olarak görünebilir. Görünüşünü taklit etmek için bir bireyi görmüş olmalı ve sesini taklit etmek için sesini duymuş olmalısınız.

    Güçlendirilmiş (4.) En fazla 10 gönüllü yaratığı hedefleyebilirsiniz. Birden fazla yaratığı hedeflerseniz her hedef için farklı bir kılık seçebilirsiniz, ancak hiçbiri belirli bir kişiyi taklit edemez. Her bir kılığı ayrı ayrı veya hepsini birden Sonlandırabilirsiniz.

    Güçlendirilmiş (7.) 4. derecedeki gibidir, ancak belirli bireyleri taklit eden kılıklar seçebilirsiniz. Görünüşünü taklit etmek için bir bireyi görmüş olmalı ve sesini taklit etmek için sesini duymuş olmalısınız.

omen://spell/illusory-object?source=paizo-pathfinder-player-core:
  name: Yanılsama Nesne
  description: >
    Sabit bir nesnenin yanılsama görsel görüntüsünü yaratırsınız. Görüntünün tamamı büyünün alanına sığmalıdır. Nesne doğal olarak hareket ediyor gibi görünür, ancak ses çıkarmaz veya koku üretmez. Örneğin suyun yanılsama bir şelaleden aktığı görülür ancak sessizdir. Görüntüye dokunan veya onu incelemek için Tara eylemini kullanan herhangi bir yaratık yanılsamanıza inanmamayı deneyebilir.

    Güçlendirilmiş (2.) Görüntünüz uygun sesler çıkarır, normal kokular üretir ve dokunulduğunda gerçek hissettirir. Büyü işitsel ve koku özelliklerini kazanır. Süre 1 saate uzar.

    Güçlendirilmiş (5.) 2. derece versiyonundaki gibidir, ancak süre sınırsızdır.

omen://spell/illusory-scene?source=paizo-pathfinder-player-core:
  name: Yanılsama Sahne
  description: >
    Hepsi büyünün alanı içinde olması gereken çeşitli boyutlarda en fazla 10 ayrı yaratık veya nesne içeren hayali bir sahne hazırlarsınız. Bu unsurlar uygun sesler ve kokular üretir ve dokunulduğunda gerçek hissettirir. Yanılsama bir sahnenin unsurları konuşma yeteneğinden yoksundur. Yanılsama Yaratık büyüsünün aksine sahnenizdeki yaratıklar savaş yeteneklerinden ve istatistiklerinden yoksundur. Sahneniz etrafındaki çevredeki değişiklikleri içermez, ancak sahnenizi bir Serap büyüsünün yanılsama ortamı içine yerleştirebilirsiniz. Sahneyi yarattığınızda statik olmasını veya bir programı takip etmesini seçebilirsiniz. Statik bir sahne sabit olsa da temel doğal hareketi içerir. Örneğin yanılsama bir kâğıt parçasına esen rüzgâr onu hışırdatır. Bir program 1 dakikaya kadar sürebilir ve bittiğinde tekrarlanır. Örneğin birbirleriyle savaşan iki ork sahnesi yaratabilirsiniz ve dövüş her tekrarda aynı şekilde devam eder. Bir döngü yaratırsanız iki savaşçı sahnenin başında ve sonunda aynı yerde biter, ancak programı döngünün nerede bitip nerede başladığını anlamak zor olacak şekilde pürüzsüzleştirebilirsiniz. Sahneyi birkaç dakikadan uzun süre gözlemleyen herkes neredeyse her zaman döngüye girdiğini fark eder. Yanılsamayı yarattıktan sonra programı değiştiremezsiniz. Görüntünün herhangi bir parçasına dokunan veya onu incelemek için Tara eylemini kullanan herhangi bir yaratık yanılsamanıza inanmamayı deneyebilir. Yanılsamanın bir kısmıyla etkileşime girerlerse yalnızca o kısma inanmazlar. Tüm sahneye ancak kritik bir başarıda inanmazlar.

    Güçlendirilmiş (6.) Sahnenizdeki yaratıklar veya nesneler konuşabilir. Programınızı oluştururken her aktör için belirli replikleri söylemelisiniz. Büyü sesinizi her aktör için kılık değiştirir.

    Güçlendirilmiş (8.) 6. derece versiyonundaki gibidir ve süre sınırsızdır.

omen://spell/impaling-briars?source=paizo-pathfinder-player-core:
  name: Saplanan Çalılar
  description: "Alandaki zemin düşmanlarınıza saldıran ve onları engelleyen tehlikeli bir çalı kümesine dönüşür. Büyüyü Yaptığınızda ve sonraki turlarda her tur onu ilk Sürdürdüğünüzde alanda meydana gelmesi için aşağıdaki etkilerden birini seçin. Tuzağa Düşür Çalılar düşmanlarınızın etrafını sararak onları yerinde tutmaya çalışır. Alandaki (veya alanın en fazla 20 fit üzerinde uçan) bir düşman bir Refleks kurtarışı denemelidir. Başarısızlıkta 1 tur boyunca tüm Hareket Hareket Hızlarına -10 fitlik bir durumsal ceza alır ve kritik başarısızlıkta Kurtulmadığı sürece 1 tur boyunca Hareketsiz Kılınır. Engelle Çalılar kıvrılıp bükülerek tüm alanı zorlu arazi haline getirir. Duvar Alanda 1 tur süren bir Diken Duvarı belirir. Duvar zorlu arazi yerine üstün zorlu arazidir. Buna ek olarak tur başına bir kez odaklanma ve manipüle özelliklerine sahip tek bir eylem kullanarak alandaki (veya alanın 20 fit yukarısına kadar uçan) gördüğünüz herhangi bir hedefi çalıların saplamasını sağlayabilirsiniz. Bir büyü saldırı zarı atın. Başarıda hedef 10d6 delici hasar alır ve 1 tur boyunca tüm Hareket Hareket Hızlarına -10 fitlik bir durumsal ceza alır; kritik başarıda hedef Kurtulmadığı sürece 1 tur boyunca Hareketsiz Kılınır."

omen://spell/impaling-spike?source=paizo-pathfinder-player-core:
  name: Saplanan Diken
  description: >
    Hedef yaratığın altındaki topraktan fırlayan ve potansiyel olarak onu saplayan bir diken var edersiniz. Diken soğuk demirden yapılmıştır ve 8d6 delici hasar verir. Hedef bir Refleks kurtarışı denemelidir.

    Kritik Başarı Hedef dikenden kaçar ve etkilenmez.

    Başarı Hedef dikenden darbe alır ve yarı hasar alır.

    Başarısızlık Hedef bacağından veya hayati olmayan başka bir vücut parçasından saplanır. Yaratık tam hasar alır ve katı zeminde duruyorsa Hareketsiz Kılınır. Kurtulmayı deneyebilir (ZD büyü ZD'nizdir). Saplanmış kaldığı sürece her sırasının sonunda sahip olduğu soğuk demir zaafından hasar alır.

    Kritik Başarısızlık Başarısızlıktaki gibidir, ancak yaratık hayati bir organından veya kütle merkezinden saplanır, iki kat hasar alır ve saplanmış kaldığı sürece Gafil kalır.

    Güçlendirilmiş (+1) Hasar 2d6 artar.

omen://spell/implosion?source=paizo-pathfinder-player-core:
  name: İçe Patlama
  description: >
    Hedefi kendi içine çökmesini sağlayarak ezer ve 75 hasar verirsiniz. Büyüyü her tur ilk Sürdürdüğünüzde aynı etkiye tabi olacak yeni bir hedef seçmelisiniz; aynı yaratık bu büyünün tek bir yapılışıyla asla birden fazla kez hedeflenemez. Ayrıca içe patlama ile sıra başına birden fazla yaratığı etkileyemezsiniz. Cisimsiz, gaz halinde, sıvı halinde veya katı bir formdan yoksun bir yaratığı hedefleyemezsiniz.

    Güçlendirilmiş (+1) Hasar 10 artar.

omen://spell/indestructibility?source=paizo-pathfinder-player-core:
  name: Yıkılmazlık
  description: Kendinizi neden ve sonuç ilişkisinden koparırsınız. Büyünün süresi boyunca yadigarlar, ilahi güç ve benzer derecede güçlü kaynakların neden olduğu etkiler hariç size zarar verebilecek her türlü etkiye veya hasara karşı bağışık olursunuz. Sizi etkilemesine izin vermeye istekli olduğunuz herhangi bir şeyden seçici olarak etkilenmenize izin verebilirsiniz.

omen://spell/infuse-vitality?source=paizo-pathfinder-player-core:
  name: Canlılık Aşıla
  description: >
    Saldırıları canlılık enerjisiyle güçlendirirsiniz. Hedef sayısı bu büyüyü yapmak için harcadığınız eylem sayısına eşittir. Her hedefin silahsız ve silah Vuruşları fazladan 1d4 canlılık hasarı verir. (Bu hasar tipik olarak yalnızca hortlaklara hasar verir). Mübarek özelliğine sahipseniz bu özelliği bu büyüye ve büyüden etkilenen Vuruşlara ekleyebilirsiniz.

    Güçlendirilmiş (3.) Hasar 2d4 hasara yükselir.

    Güçlendirilmiş (5.) Hasar 3d4 hasara yükselir.

omen://spell/insect-form?source=paizo-pathfinder-player-core:
  name: Böcek Formu
  description: >
    Basit bir böcek hayal eder ve Orta boy bir hayvan savaş formuna dönüşürsünüz. Bu Büyüyü Yaptığınızda listelenen bir savaş formu seçin. Belirli hayvan türüne karar verebilirsiniz (örneğin kınkanatlı için bir uğur böceği veya bok böceği), ancak bunun formun Boyutu veya istatistikleri üzerinde hiçbir etkisi yoktur. Bu formdayken hayvan özelliğini kazanırsınız. Bu büyüyü Sonlandırabilirsiniz. Hangi savaş formunu seçerseniz seçin aşağıdaki istatistikleri ve yetenekleri kazanırsınız: SD = 18 + seviyeniz. Zırhınızın kontrol cezasını ve Hareket Hızı düşüşünü yok sayın. 10 geçici Can Puanı. Loşgörüş. Seçtiğiniz savaş formuna özgü olan ve Vuruş Yapabileceğiniz yegâne saldırılar olan bir veya daha fazla saldırı. Bunlarda eğitimlisinizdir. Saldırı niteleyiciniz +13, hasar bonusunuz +2'dir. Bu saldırılar Kuvvet tabanlıdır (Halsiz durumu açısından). Silahsız saldırı niteleyiciniz daha yüksekse bunun yerine onu kullanabilirsiniz. Kendi niteleyiciniz daha yüksek olmadığı sürece Atletizm niteleyicisi +13. Ayrıca seçtiğiniz forma bağlı olarak belirli yetenekler kazanırsınız: Karınca Hareket Hızı 30 fit, tırmanma Hareket Hızı 30 fit; Yakın Dövüş 1 kıskaç, Hasar 2d6 ezici. Kınkanatlı Hareket Hızı 25 fit; Yakın Dövüş 1 kıskaç, Hasar 2d10 ezici. Çiyan Hareket Hızı 25 fit, tırmanma Hareket Hızı 25 fit; karanlıkgörüş; Yakın Dövüş 1 kıskaç, Hasar 1d8 delici artı 1d4 sürekli zehir. Peygamberdevesi Hareket Hızı 40 fit; kesin olmayan koku 30 fit; Yakın Dövüş 1 ön bacak, Hasar 2d8 delici. Akrep Hareket Hızı 40 fit; karanlıkgörüş, kesin olmayan titreşimsezisi 60 fit; Yakın Dövüş 1 iğne, Hasar 1d8 delici artı 1d4 sürekli zehir; Yakın Dövüş 1 kıskaç (çevik), Hasar 1d6 ezici. Örümcek Hareket Hızı 25 fit, tırmanma Hareket Hızı 25 fit; karanlıkgörüş; Yakın Dövüş 1 zehir dişi, Hasar 1d6 delici artı 1d4 sürekli zehir; Menzilli 1 ağ (menzil artışı 20 fit), Hasar Hedefi 1 tur boyunca veya Kurtulana kadar Hareketsiz Kılar.

    Güçlendirilmiş (4.) Savaş formunuz Büyük boyuttadır ve saldırılarınız 10 fit erişime sahiptir. Bunun yerine 15 geçici CP, saldırı niteleyicisi +16, hasar bonusu +6 ve Atletizm +16 kazanırsınız.

    Güçlendirilmiş (5.) Savaş formunuz İri boyuttadır ve saldırılarınız 15 fit erişime sahiptir. Bunun yerine 20 geçici CP, saldırı niteleyicisi +18, hasar bonusu +2 ve iki kat hasar zarı (süren hasar dahil) ve Atletizm +20 kazanırsınız.

omen://spell/interdisciplinary-incantation?source=paizo-pathfinder-player-core:
  name: Disiplinlerarası Efsun
  description: >
    Tetikleyici: 30 fit mesafedeki bir yaratık bir mistik büyü yaptığında.

    Başka bir Wizard'ın büyüsünün közlerini toplar, büyüyü kısa bir süre için de olsa kendiniz taklit edecek kadar formüllerini ve efsunlarını ayrıştırmak için birleşik büyü anlayışınızı kullanırsınız. Bir sonraki sıranızın sonuna kadar aynı derecede bir Wizard büyü slotu harcayarak tetikleyici Büyüyü Yapabilirsiniz. O Wizard'ın büyüleri 24 saat boyunca disiplinlerarası efsununuzu tekrar tetikleyemez.

omen://spell/interplanar-teleport?source=paizo-pathfinder-player-core:
  name: Düzlemlerarası Işınlanma
  description: >
    Gereksinimler: Varış düzlemi için odak olarak kullanılan bir düzlemsel anahtara sahip olmalısınız.

    Siz ve müttefikleriniz varoluş düzlemleri arasındaki engelleri aşarsınız. Hedefler Ateş Düzlemi, Yeraltı Dünyası veya Dış Yarıklar gibi başka bir düzleme geçer. Varış düzleminin var olduğunu bilmeli ve o düzlemden bir malzemeden yapılmış büyülü bir düzlemsel anahtarı büyü için odak olarak kullanmalısınız. Çoğu önde gelen düzlemin düzlemsel anahtarları tıpkı düzlemlerarası ışınlanma büyüsü gibi yaygın olmasa da daha gizemli düzlemler ve yarı düzlemler genellikle nadir ve hatta muhtemelen benzersiz düzlemsel anahtarlara sahiptir. Büyü oldukça belirsizdir ve hedeflerden birinin (seçtiğiniz) o düzleme en son seyahat ettiği son konumdan 1d20×25 mil uzakta belirirsiniz. Tüm hedefler için belirli bir düzleme ilk seyahat ise düzlemde rastgele bir konumda belirirsiniz. Düzlemlerarası ışınlanma bir dönüş yolu sağlamaz; ancak hafifletici nedenler olmadığı sürece düzlemlerarası ışınlanmayı tekrar yapmak önceki düzleminize dönmenizi sağlar.

omen://spell/invisibility-cloak?source=paizo-pathfinder-player-core:
  name: Görünmezlik Pelerini
  description: >
    2. derece Görünmezlik büyüsüyle aynı kısıtlamalarla Görünmez olursunuz.

    Güçlendirilmiş (6.) Süre 10 dakikaya uzar.

    Güçlendirilmiş (8.) Süre 1 saate uzar.

omen://spell/invisibility?source=paizo-pathfinder-player-core:
  name: Görünmezlik
  description: >
    Yanılsamalar hedefin etrafındaki ışığı bükerek onu Görünmez kılar. Bu onu tüm yaratıklar için Konumu Saptanmamış yapar, ancak yaratıklar hedefi bulmayı deneyebilir ve onu kendileri için Gizlenmiş hâle getirebilirler. Hedef düşmanca bir eylem kullanırsa büyü o düşmanca eylem tamamlandıktan sonra sona erer.

    Güçlendirilmiş (4.) Büyü 1 dakika sürer, ancak hedef düşmanca bir eylem kullansa bile sona ermez.

omen://spell/invoke-spirits?source=paizo-pathfinder-player-core:
  name: Ruhları Çağır
  description: >
    Ölülerin hırpani hayaletleri yaşayanları avlamak için yükselir. Alandaki her yaşayan yaratığa temel bir İrade kurtarışıyla 2d4 zihinsel hasar ve 2d4 boşluk hasarı verirler. Ayrıca kurtarışta kritik başarısızlık yaşayan yaratıklar Korkmuş 2 olur ve 1 tur boyunca Kaçan durumuna düşer. Sonraki turlarda büyüyü her tur ilk Sürdürdüğünüzde alanı büyünün menzili içinde 30 fite kadar hareket ettirebilirsiniz. Yeni alandaki yaşayan yaratıklar yukarıdakiyle aynı etkilerle kurtarışlar denemelidir; ancak kritik başarısızlık kaçmalarına neden olmaz.

    Güçlendirilmiş (+2) Zihinsel hasar ve boşluk hasarı her biri 1d4 artar.

omen://spell/item-facade?source=paizo-pathfinder-player-core:
  name: Eşya Kamuflajı
  description: >
    Hedef nesnenin fiziksel olarak çok daha iyi veya daha kötü durumda görünmesini ve hissettirmesini sağlarsınız. Bu büyüyü yaptığınızda nesneyi köhne mi yoksa kusursuz mu göstermek istediğinize karar verin. Köhne gösterilen bir eşya Kırık ve döküntü görünür. Daha iyi gösterilen sağlam bir eşya yepyeni ve son derece cilalı veya bakımlı görünür. Kırık bir eşya sağlam ve işlevsel görünür. Yok Edilmiş eşyalar bu büyüden etkilenemez. Eşyayla Etkileşime giren bir yaratık yanılsamaya inanmamayı deneyebilir.

    Güçlendirilmiş (2.) Süre 24 saattir.

    Güçlendirilmiş (3.) Süre sınırsızdır.

omen://spell/jump?source=paizo-pathfinder-player-core:
  name: Zıpla
  description: >
    Bacaklarınız yükseğe ve uzağa sıçramaya hazır şekilde güçle dolar. Yere temas etmeden herhangi bir yöne 30 fit atlarsınız. Sizden 30 fit mesafedeki katı bir zemin alanına inmelisiniz, aksi takdirde bir sonraki eyleminizi kullandıktan sonra düşersiniz.

    Güçlendirilmiş (3.) Menzil dokunuş olur, hedef dokunulan 1 yaratık olarak değişir ve süre 1 dakika olur; hedefin Sıçra eylemini her gerçekleştirdiğinde açıklandığı gibi zıplamasına olanak tanır.

omen://spell/knock?source=paizo-pathfinder-player-core:
  name: Kilit Aç
  description: Hedefin açılmasını kolaylaştırırsınız. Kilit aç hedef kapıyı, kilidi veya kabı Atletizm ya da Hırsızlık testiyle açmaya çalışan her yaratığa +4 statü bonusu verir. Kilit aç yapmanın bir parçası olarak hedefi açmak için bir Hırsızlık testi deneyebilirsiniz ve eğitimsiz olsanız bile seviyenizi eklersiniz. Kilit aç Kilitle büyüsünü etkisiz kılar.

omen://spell/know-the-enemy?source=paizo-pathfinder-player-core:
  name: Düşmanı Tanı
  description: >
    Tetikleyici: İnisiyatif zarı atıp bir yaratığı görebildiğinizde, bir yaratığa karşı saldırı zarında başarılı olduğunuzda veya bir yaratık büyülerinizden birine karşı kurtarışta başarısız olduğunda.

    Kendinize hızla yararlı bilgileri hatırlatırsınız. Tetikleyici yaratığın yeteneklerini belirlemek için uygun beceri testini atarak bir Bilgi Hatırla eylemi kullanın. Testinizi iki kez atabilir ve daha iyi sonucu kullanabilirsiniz.

omen://spell/know-the-way?source=paizo-pathfinder-player-core:
  name: Yolu Bil
  description: >
    Zihninizin gözünde kendinizi büyüyle yeniden yönlendirirsiniz. Hangi yönün kuzey olduğunu hemen öğrenirsiniz (mevcut konumunuzda mevcutsa) ve son 24 saat içinde bulunduğunuz bir konumu seçerek hangi yönde olduğunu öğrenebilirsiniz.

    Güçlendirilmiş (3.) Son bir hafta içinde bulunduğunuz bir konumu seçebilirsiniz.

    Güçlendirilmiş (7.) Orada ne kadar zaman önce bulunmuş olursanız olun bir konumu seçebilirsiniz.

omen://spell/laughing-fit?source=paizo-pathfinder-player-core:
  name: Gülme Krizi
  description: >
    Hedef kontrol edilemeyen bir kahkaha krizine tutulur. Bir İrade kurtarışı denemelidir.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef kontrol edilemeyen kahkahalarla boğuşur. Reaksiyonları kullanamaz.

    Başarısızlık Hedef Yavaşlatılmış 1 olur ve reaksiyonları kullanamaz.

    Kritik Başarısızlık Hedef Yüzüstü yere yığılır ve 1 tur boyunca eylemleri veya reaksiyonları kullanamaz. Ardından başarısızlığın etkilerini alır.

omen://spell/levitate?source=paizo-pathfinder-player-core:
  name: Havada Süzül
  description: Yerçekimine meydan okur ve hedefi yerden 5 fit havaya kaldırırsınız. Hedefi 10 fit yukarı veya aşağı hareket ettirmek için büyüyü Sürdürebilirsiniz. Havada süzül büyüsüyle havada yüzen bir yaratık saldırı zarlarına -2 durumsal ceza alır. Yüzen bir yaratık kendini dengelemek ve sırasının geri kalanında bu cezayı geçersiz kılmak için bir Etkileşime Gir eylemi harcayabilir. Hedef sabit bir nesneye veya uygun stabiliteye sahip bir araziye bitişikse tırmanarak (yüzey bir duvar gibi dikeyse) veya emekleyerek (yüzey bir tavan gibi yataysa) yüzey boyunca hareket edebilir. GM hangi yüzeylerin tırmanılabileceğini veya emeklenebileceğini belirler.

omen://spell/life-boost?source=paizo-pathfinder-player-core:
  name: Yaşam Desteği
  description: >
    Haminizden gelen yaşam gücü hedefe dolarak haminizin iradesini biraz daha yerine getirmeye devam edebilmelerini sağlar. Hedef hızlı iyileşme 2 kazanır.

    Güçlendirilmiş (+1) Hızlı iyileşme 2 artar.

omen://spell/light?source=paizo-pathfinder-player-core:
  name: Işık
  description: >
    Seçtiğiniz bir renkte 20 fitlik bir yarıçapta parlak ışık (ve sonraki 20 fit boyunca loş ışık) yayan bir ışık küresi yaratırsınız. Işığı gönüllü bir yaratıkla aynı alanda yaratırsanız ışığı yaratığa iliştirebilir, hareket ettikçe o yaratığın yakınında süzülmesini sağlayabilirsiniz. Işığı 60 fite kadar hareket ettirmek için büyüyü Sürdürebilirsiniz; bu hareketin bir parçası olarak onu bir yaratığa iliştirebilir veya yaratıktan ayırabilirsiniz. Büyüyü Sonlandırabilirsiniz. Zaten dört ışık büyünüz etkinken Büyüyü Yaparsanız sona erdirmek için mevcut büyülerden birini seçmelisiniz.

    Güçlendirilmiş (4.) Küre 60 fitlik bir yarıçapta parlak ışık (ve sonraki 60 fit boyunca loş ışık) yayar.

omen://spell/lightning-bolt?source=paizo-pathfinder-player-core:
  name: Şimşek Oku
  description: >
    Elinizden dışarı doğru bir şimşek oku çarparak 4d12 elektrik hasarı verir.

    Güçlendirilmiş (+1) Hasar 1d12 artar.

omen://spell/liminal-doorway?source=paizo-pathfinder-player-core:
  name: Eşik Kapısı
  description: "Bozulmamış bir yüzeye tebeşirle bir kapı çizersiniz; bu kapı boyutlararası bir alana açılır. Çizimi gerçek bir kapı olarak gören herhangi bir yaratık kapı koluna dokunmak ve içeri girmek için Etkileşime girebilir. Kapının ardındaki çarpık, tebeşirle çizilmiş oda genişlik, derinlik ve yükseklik olarak 20 fittir. Alan süssüz ve boştur, tebeşir çizgileri duvarların köşelerini gösterir. Çizim ovalanarak silinirse, altındaki yüzey kırılırsa veya bir yaratık alana kapasitesini aşacak şekilde girmeye çalışırsa alan çökmeye başlar. Alan tüm yaratıklar dışarı dönene kadar her tur rastgele bir yaratığı fırlatarak en yakın açık zemine bırakır."

omen://spell/lingering-composition?source=paizo-pathfinder-player-core:
  name: Kalıcı Beste
  description: >
    Bestenizin faydalarını uzatmak için ona gösterişli bir dokunuş eklersiniz. Bir sonraki eyleminiz süresi 1 tur olan bir beste kantripi yapmaksa bir Gösteri testi deneyin. ZD genellikle bestenizin en yüksek seviyeli hedefine eşit seviyedeki standart zorluk ZD'sidir; ancak GM koşullara bağlı olarak farklı bir ZD belirleyebilir. Etki, testinizin sonucuna bağlıdır.

    Kritik Başarı Beste 4 tur sürer.

    Başarı Beste 3 tur sürer.

    Başarısızlık Beste 1 tur sürer, ancak bu büyüyü yapmak için harcadığınız Odak Puanı'nı harcamazsınız.

omen://spell/localized-quake?source=paizo-pathfinder-player-core:
  name: Yerel Sarsıntı
  description: >
    Yeri sarsarak yakındaki yaratıkları devirirsiniz. Büyüyü yaptığınızda büyü alanının 15 fitlik bir yayılım mı yoksa 15 fitlik bir koni mi olacağını seçin. Alanda sağlam zemin üzerinde duran her yaratık temel bir Refleks kurtarışla 4d6 ezici hasar alır. Kurtarışta başarısız olan yaratık ayrıca Yüzüstü yere düşer.

    Güçlendirilmiş (+1) Hasarı 2d6 artırın.

omen://spell/locate?source=paizo-pathfinder-player-core:
  name: Konum Bul
  description: >
    Hedefe giden yönü (örneğin "annemin kılıcı" gibi belirli bir nesne seçtiyseniz) veya en yakın hedefin yönünü (örneğin "kılıçlar" gibi bir nesne türü seçtiyseniz) öğrenirsiniz. Hedef belirli bir nesneyse onu kendi duyularınızla doğrudan gözlemlemiş olmalısınız. Bir nesne türüyse yine de bu nesne türünün zihninizde doğru bir imgesine sahip olmanız gerekir. Sizinle hedef arasında kurşun veya akan su varsa bu büyü nesnenin konumunu belirleyemez. Bu durum, en yakın nesne kurşun veya akan suyun arkasındaysa daha uzaktaki bir nesne türünü bulabileceğiniz anlamına gelir.

    Güçlendirilmiş (5.) Bir nesne yerine belirli bir yaratığı veya soyu hedef alabilirsiniz; ancak hedeflemek istediğiniz yaratık veya soyla tanışmış ya da onu yakından görmüş olmalısınız.

omen://spell/lock?source=paizo-pathfinder-player-core:
  name: Kilitle
  description: >
    Hedefin mandal mekanizması, görünmez büyüsel muhafazalar tarafından sıkıca tutularak şakırtıyla kapanır. Bir hedefi büyüyle kilitlediğinizde, onu açmak için gereken Atletizm ve Hırsızlık ZD'sini büyü ZD'nize ya da +4 statü bonusu eklenmiş temel kilit ZD'sine eşitlersiniz (hangisi daha yüksekse). Bu büyüden etkilenen bir kilidi daha önce açmış olan herhangi bir anahtar veya kombinasyon büyü süresince kilidi açmaz; ancak anahtar veya kombinasyon kapıyı açma testlerine +4 durumsal bonus sağlar. Hedef açılırsa büyü sona erer. Hedefin ilave bir şekilde sürgülenmediği veya kilitlenmediği varsayılırsa hedefe dokunduğunuz bir Etkileşime Gir eylemiyle kilidini açıp onu açabilirsiniz. Bu, büyüyü sona erdirmez. Bu büyüyü istediğiniz zaman ve herhangi bir mesafeden Sonlandırabilirsiniz.

    Güçlendirilmiş (2.) Süre sınırsızdır, ancak ilave maliyet olarak 6 gp değerinde değerli metal harcamanız gerekir.

omen://spell/loremasters-etude?source=paizo-pathfinder-player-core:
  name: İlim Ustası Etüdü
  description: >
    Tetikleyici: Menzil içindeki siz veya bir müttefikiniz Bilgi Hatırla için bir beceri testi dener.

    İlham perinizin derin gizemlerine başvurarak hedefe daha iyi düşünme ve bilgileri hatırlama kabiliyeti kazandırırsınız. Tetikleyici Bilgi Hatırla beceri testini iki kez atın ve daha yüksek olan sonucu kullanın.

omen://spell/lucky-break?source=paizo-pathfinder-player-core:
  name: Şans Anı
  description: >
    Tetikleyici: Bir kurtarışta başarısız olursunuz, ancak kritik başarısız olmazsınız.

    Kurtarışı tekrar atın ve daha iyi olan sonucu kullanın. Ardından 10 dakika boyunca geçici olarak bağışık olursunuz.

omen://spell/mad-monkeys?source=paizo-pathfinder-player-core:
  name: Çılgın Maymunlar
  description: >
    Büyüsel maymun ruhları üst üste yığılıp tırmanarak alanı doldurur. Maymunlar büyüsel ruhlar olduğu için onlara saldırılamaz veya zarar verilemez. Maymunların üzerine Sakinleştir veya benzeri bir etki yapmak onları uysallaştırarak çılgın maymunlar süresince yaramazlık yapmayı bırakmalarına neden olur. Büyüyü Yaptığınızda maymunlarınızın ne tür bir yaramazlık yapacağını seçin. Büyüyü Yaptığınızda ve her tur Büyüyü Sürdürdüğünüz ilk seferde bu yaramazlık için listelenen etkiyi üretirler. Her tur Büyüyü Sürdürdüğünüz ilk seferde maymunların alanını 5 fit hareket ettirebilirsiniz.

    Bariz Hırsızlık Maymunlar alandaki bir yaratıktan herhangi bir eşyayı Çalmayı dener. Maymunların Hırsızlık bonusu olarak büyü ZD'niz – 10'u kullanın. Bu girişimleri ustalıktan ziyade dikkat dağıtmaya dayandığından, kurban maymunların hangi eşyayı almaya çalıştığını ve alınıp alınmadığını bilir. Maymunlardan çalınan bir eşyayı almak (büyü yapıcı için bile) büyü ZD'nizi kullanarak onu onlardan Çalmayı veya onları Silahsızlandırmayı gerektirir. Büyü sona erdiğinde çalınan eşyalar büyü alanında seçtiğiniz herhangi bir karede yere düşer.

    Şamatalı Gürültü Maymunlar yüksek sesle çığlık atarak büyü alanındaki yaratıkları potansiyel olarak sağır eder. Büyü alanındaki her yaratık bir Dayanıklılık kurtarışı denemelidir.

    Kritik Başarı Yaratık etkilenmez ve 10 dakika boyunca geçici olarak bağışık olur.

    Başarı Yaratık etkilenmez.

    Başarısızlık Yaratık 1 tur boyunca Sağır olur.

    Kritik Başarısızlık Yaratık 1 dakika boyunca Sağır olur.

    Çalkantılı Cimnastik Maymunlar büyü alanındaki yaratıkların her yerine zıplayıp tırmanarak karmaşık hareketlere müdahale eder. Büyü alanındaki her yaratık bir Refleks kurtarışı denemelidir.

    Kritik Başarı Yaratık etkilenmez ve 10 dakika boyunca geçici olarak bağışık olur.

    Başarı Yaratık etkilenmez.

    Başarısızlık 1 tur boyunca yaratık ne zaman bir manipülasyon eylemi denese bir testte başarılı olmalıdır. Bu testte başarısız olursa yaratık o eylemi kaybeder.

    Kritik Başarısızlık Başarısızlık gibi, ancak maymunlar yaratığa inatla yapışır ve yaratık büyü alanından ayrılsa bile etki büyü sona erene kadar devam eder.

omen://spell/magic-hide?source=paizo-pathfinder-player-core:
  name: Büyülü Post
  description: Yoldaş Hayvanınız daha kalın bir deri, keçeleşmiş kürk veya daha sert bir kabuk geliştirerek Savunma Değeri'ne +1 statü bonusu kazanır.

omen://spell/magic-passage?source=paizo-pathfinder-player-core:
  name: Büyülü Geçit
  description: >
    Seçilen alandaki duvarın içinden görünür bir tünel açarak alanı boşlukla değiştirirsiniz. Duvar 10 fitten daha kalınsa tünel 10 fit derinlikte sona erer. Duvardaki küçük bir metal tabaka bile bu büyünün işlemesini engeller. Bu büyü yapının bütünlüğünü bozmaz. Büyü sona erdiğinde tünelin içindeki herkes en yakın çıkışa fırlatılır.

    Güçlendirilmiş (7.) Tünel 20 fit derinliğe kadar olabilir. Tünelin varlığına rağmen tünelinizin girişini içeren duvar alanları (Hakikatgörüşü veya benzeri bir etkiyle bakılmadığı sürece) tamamen normal görünür. Tünelin girişi sert bir duvar işlevi görür; ancak bir parola veya tetikleyici belirleyerek yaratıkların serbestçe girmesine izin verebilirsiniz.

omen://spell/magics-vessel?source=paizo-pathfinder-player-core:
  name: Büyünün Kabı
  description: Bir yaratık saf büyü enerjisi için ilahi bir kaba dönüşür. Hedef kurtarışlara +1 statü bonusu kazanır. Büyü slotlarınızdan her Büyü Yaptığınızda bu büyüyü otomatik olarak Sürdürürsünüz ve hedefine bir sonraki sıranızın başlangıcına kadar büyülerden gelen hasara karşı büyünün derecesine eşit direnç kazandırırsınız.

omen://spell/malicious-shadow?source=paizo-pathfinder-player-core:
  name: Kötücül Gölge
  description: >
    Haminiz hedefin gölgesini boğan eller, tehlikeli bir silah, taciz edici runlar veya benzeri ölümcül bir forma büründürür. Gölge hedefle birlikte hareket eder ve her zaman erişim mesafesinde kalır. Büyüyü Yaptığınızda ve her Sürdürdüğünüzde gölge hedefe Vuruş Yapar. Gölgenin Vuruşları 2d10 hasar veren yakın dövüş büyü saldırılarıdır. Büyüyü Yaptığınızda hasar türünü (ezici, delici veya kesici) siz seçersiniz. Gölge sizin çoklu saldırı cezanızı kullanır ve ona katkıda bulunur. Gölge yer kaplamaz, kıstırma sağlamaz veya bir yaratığın sahip olacağı başka niteliklere sahip değildir. Gölge, Vuruşu dışında hiçbir saldırı yapamaz. Hedef gölge düşürmeyi bırakırsa (genellikle tamamen karanlığa veya aydınlığa geçtiğinde) gölge kaybolur. Kötücül gölge büyüsünü yaptığınızda hedefin gölgesini başka bir etki kontrol ediyorsa kötücül gölgenin süresi boyunca gölgenin kontrolünü geçici olarak ele geçirmek için o etkiyi etkisiz kılmayı deneyebilirsiniz.

    Güçlendirilmiş (+2) Vuruş hasarı 1d10 artar.

omen://spell/malignant-sustenance?source=paizo-pathfinder-player-core:
  name: Habis Besin
  description: >
    Bir hortlak yaratığa boşluk enerjisinden bir tohum yerleştirerek onun doğaüstü zindeliğini geri kazandırırsınız. Hedef hızlı iyileşme 7 kazanır.

    Güçlendirilmiş (+1) Hızlı iyileşme 2 artar.

omen://spell/manifestation?source=paizo-pathfinder-player-core:
  name: Tezahür
  description: Büyünün temellerindeki sırları örerek onları neredeyse sınırsız potansiyele sahip bir güce dönüştürürsünüz. Tezahür büyüsünü yaptığınız gelenekten 9. derece veya daha düşük bir büyüyü ya da herhangi bir gelenekten 7. derece veya daha düşük bir büyüyü taklit edersiniz. Normalde yalnızca yaygın olan veya erişiminiz olan büyüleri seçebilseniz de GM daha geniş seçeneklere izin verebilir.

omen://spell/mariners-curse?source=paizo-pathfinder-player-core:
  name: Denizcinin Laneti
  description: >
    Hedefi çalkantılı, acımasız denizin lanetine uğratırsınız. Hedef bir İrade kurtarışı denemelidir.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef Midesi Bulanmış 1 olur. Midesi bulanmış durumunu 0'a düşürmek laneti sona erdirir.

    Başarısızlık Hedef Midesi Bulanmış 1 olur ve lanet kaldığı sürece midesi bulanmış durumunu 1'in altına düşüremez. Lanet 4. derece İlleti Temizle veya benzeri büyüyle kaldırılabilir. Hedef midesi bulanmış durumdayken kıyıdan en az bir mil uzakta su üzerindeyse ayrıca Yavaşlatılmış 1 olur.

    Kritik Başarısızlık Başarısızlık gibi, ancak hedef Midesi Bulanmış 2 olur.

omen://spell/marvelous-mount?source=paizo-pathfinder-player-core:
  name: Muhteşem Binek
  description: >
    Hedefe binek olarak hizmet etmesi için Büyük boyutlu fantastik bir yaratık çağırırsınız. Binek hedefin hizmetkârıdır, Hareket Hızı 40 fittir ve hedefi üzerindeki tüm eşyalarıyla birlikte taşıyabilir. Başka hiçbir yaratığı taşıyamaz. Binek hedefin Savunma Değeri'ni ve kurtarışları kullanır; ancak tek seferde 10'dan fazla hasar alırsa yok olur ve büyü sona erer.

    Güçlendirilmiş (3.) Binek su üzerinde yürüyebilir, ancak sırasını katı zeminde bitirmelidir, aksi takdirde batar.

    Güçlendirilmiş (4.) Bineğin Hareket Hızı 60 fittir ve su üzerinde yürüyebilir.

    Güçlendirilmiş (5.) Bineğin Hareket Hızı 60 fittir ve su üzerinde yürüyebilir. Ayrıca 60 fitlik bir uçma Hareket Hızına sahiptir, ancak sırasını bir yüzey üzerinde bitirmelidir, aksi takdirde düşer.

    Güçlendirilmiş (6.) Bineğin kara Hareket Hızı ve uçma Hareket Hızı 80 fittir.

omen://spell/mask-of-terror?source=paizo-pathfinder-player-core:
  name: Dehşet Maskesi
  description: >
    Hedef korkunç ve dehşet verici bir yaratık gibi görünür. Bu etki her gözlemciye özgüdür; bu nedenle hedefi izleyen bir insan kanlı dişlere sahip bir iblis görebilirken hedefi izleyen bir iblis parıldayan meleksi bir çehre görebilir. Herhangi bir yaratık hedefe karşı düşmanca bir eylem denediğinde bir İrade kurtarışı denemelidir. Ardından bir sonraki sırasının sonuna kadar geçici olarak bağışık olur.

    Başarı Yaratık etkilenmez.

    Başarısızlık Yaratık eylemini kullanmadan önce Korkmuş 2 olur.

    Kritik Başarısızlık Yaratık Korkmuş 2 olur, eylemi başarısız olur ve boşa gider.

    Güçlendirilmiş (8.) En fazla 5 yaratığı hedef alabilirsiniz. Bir yaratık birden fazla hedefi aynı anda etkileyen düşmanca bir eylem veya reaksiyon kullanırsa dehşet maskesine karşı yalnızca bir kurtarış denemesi gerekir.

omen://spell/massacre?source=paizo-pathfinder-player-core:
  name: Katliam
  description: "Yolundaki herkesin yaşam gücünü söndürmek için bir ölüm dalgası salarsınız. Hat üzerindeki 17. seviye veya daha düşük her canlı yaratık bir Dayanıklılık kurtarışı denemelidir. Katliamdan gelen hasar bir yaratığı 0 Can Puanına düşürürse o yaratık anında ölür. Katliam tek bir yaratığı bile öldürmezse, boşluk enerjisi açgözlülükle geriye size doğru döner; hat üzerindeki her canlı yaratığa (17. seviyenin üzerindekiler dahil) ilave 30[void] hasar ve size 30 boşluk hasarı verir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık 9d6 boşluk hasarı alır. Başarısızlık Yaratık (ternary(gte(spell rank,10),115,100))[void] hasar alır. Kritik Başarısızlık Yaratık ölür. Güçlendirilmiş (10.) Büyü 19. seviyeye kadar olan canlı yaratıkları etkileyebilir. Bir başarıda hasarı 10d6'ya ve bir başarısızlıkta 115'e yükseltin."

omen://spell/mending?source=paizo-pathfinder-player-core:
  name: Tamir
  description: >
    Hedef eşyayı onarırsınız. Hedefe büyü derecesi başına 5 Can Puanı yenilersiniz; bu onarım eşyayı Kırılma Eşiği'nin üzerine çıkarırsa Kırık durumunu ortadan kaldırabilir. Kayıp parçaları yerine koyamazsınız veya tamamen yok edilmiş bir nesneyi onaramazsınız.

    Güçlendirilmiş (2.) 1 veya daha az Yüke sahip büyüsel olmayan bir nesneyi hedef alabilirsiniz.

    Güçlendirilmiş (3.) 2 veya daha az Yüke sahip büyüsel olmayan bir nesneyi ya da 1 veya daha az Yüke sahip büyüsel bir nesneyi hedef alabilirsiniz.

omen://spell/message?source=paizo-pathfinder-player-core:
  name: Mesaj
  description: >
    Kelimeleri sessizce fısıldarsınız, ancak ağzınızdan çıkmak yerine doğrudan hedefin kulaklarına iletilirler. Başkaları kelimelerinizi normalde fısıldadığınızdan daha iyi duyamazken, hedef kelimelerinizi sanki yanınızda duruyormuş gibi duyabilir. Hedef bir reaksiyon olarak ya da dilerse bir sonraki sırasında serbest eylem olarak kısa bir yanıt verebilir; ancak bunu yapabilmek için sizi görebilmeli ve menzil içinde olmalıdır. Yanıt verirse yanıtı tıpkı asıl mesaj gibi doğrudan kulağınıza iletilir.

    Güçlendirilmiş (3.) Büyünün menzili 500 fite çıkar.

omen://spell/metamorphosis?source=paizo-pathfinder-player-core:
  name: Başkalaşım
  description: Dönüşüm büyüsündeki ustalığınızı kullanarak formları formların içinde gizlersiniz. Büyü repertuvarınızdaki bir polimorf büyüsüyle seçebileceğiniz veya hazırlayabileceğiniz 8. derece veya daha düşük herhangi bir forma dönüşürsünüz (bildiğiniz büyülerin 8. derece veya daha düşük güçlendirilmiş versiyonları dâhil). Formun normalde sağladığı miktar yerine 40 geçici Can Puanı kazanırsınız. Bu başkalaşım sırasında henüz kullanmadığınız yeni bir forma girmek için büyüyü Sürdürebilirsiniz. Bu, bu büyüden gelen geçici Can Puanınızı tazeler.

omen://spell/migration?source=paizo-pathfinder-player-core:
  name: Göç
  description: "Hedefler hareketlerine ve çevrelerine en uygun hayvan formlarına doğal bir şekilde bürünür. Her hedef 40 fitlik kara, kazma, tırmanma, uçma ve yüzme Hareket Hızı kazanır ve belirli bir hareket ve çevre için en uygun Minik veya Küçük boyutlu bir hayvana dönüşebilir. Ayrıca GM'in takdirine bağlı olarak yerel yaban hayatında yaygın olan diğer bağışıklıkların yanı sıra hafif, şiddetli ve aşırı soğuk ve sıcağa karşı bağışıklık kazanır. Keşif modunda bir hedef saatte 20 millik bir seyahat Hareket Hızıyla çok daha hızlı hareket edebilir. Bir hedef hayvan formundayken Vuruş Yapamaz, büyü yapamaz veya manipülasyon eylemlerinin çoğunu kullanamaz; ancak büyüyü Sürdürerek normal formuna geri dönebilir. Hayvan formuna geri dönmek için büyüyü tekrar Sürdürebilir."

omen://spell/mind-probe?source=paizo-pathfinder-player-core:
  name: Zihin Sondası
  description: >
    Düşüncelerinizi bir yaratığın zihnine yönlendirerek bilgi ararsınız. Hedef bir İrade kurtarışıyla sizi savuşturmadığı sürece hedefin anılarına ve bilgisine erişirsiniz.

    Başarı Hedef etkilenmez.

    Başarısızlık Büyünün süresi boyunca her tur, farklı bir soru sormak ve cevabı ortaya çıkarmak için büyüyü Sürdürebilirsiniz. Her soru için hedef büyü ZD'nize karşı bir Aldatma testi deneyebilir; hedef başarılı olursa cevabı öğrenemezsiniz ve kritik başarıda hedef size doğru olduğuna inandığınız yanlış bir cevap verir. Hedefe belirli bir soruyu bir kez sorduktan sonra zihin sondasının ayrı bir yapılışıyla bile olsa aynı soruyu tekrar sormak aynı sonucu doğurur.

    Kritik Başarısızlık Başarısızlık gibi ve hedef sorularınıza karşı Aldatma testlerine –4 durumsal ceza alır.

omen://spell/mind-reading?source=paizo-pathfinder-player-core:
  name: Zihin Okuma
  description: >
    Üstünkörü bir zihinsel dokunuşla hedefin zihnini okumaya çalışırsınız. Hedef bir İrade kurtarışı denemelidir. Ardından hedef 1 saat boyunca sizin zihin okumanıza karşı geçici olarak bağışık olur.

    Kritik Başarı Büyüyü Yaptığınızda hedef sizden belirsiz yüzeysel düşünceler algılar.

    Başarı Hedefin Zekâ bonusunun sizinkinden yüksek mi, eşit mi yoksa düşük mü olduğunu öğrenirsiniz.

    Başarısızlık Büyüyü Yaptığınızda hedeften belirsiz yüzeysel düşünceler algılarsınız ve Zekâsının sizinkinden yüksek mi, eşit mi yoksa düşük mü olduğunu öğrenirsiniz.

    Kritik Başarısızlık Başarısızlık gibi ve büyünün süresi boyunca hedefin yüzeysel düşüncelerini tekrar tespit etmek için büyüyü Sürdürebilirsiniz. Hedef ek kurtarış yapamaz.

omen://spell/mindlink?source=paizo-pathfinder-player-core:
  name: Zihin Bağı
  description: Zihninizi hedefin zihnine bağlar ve normalde 10 dakikada iletilebilecek miktardaki bilgiyi o hedefe zihinsel olarak bir anda aktarırsınız.

omen://spell/mirage?source=paizo-pathfinder-player-core:
  name: Serap
  description: >
    Doğal arazinin farklı türde bir arazi gibi görünmesine, ses çıkarmasına, hissedilmesine ve kokmasına neden olan bir yanılsama yaratırsınız. Bu, alandaki hiçbir yapıyı veya yaratığı gizlemez. Yanılsamaya dokunan veya onu incelemek için Tara eylemini kullanan herhangi bir yaratık, yanılsamanıza inanmamayı deneyebilir.

    Güçlendirilmiş (5.) Görüntünüz yapıları da gizleyebilir veya hayali yapılar yaratabilir (ancak yine de yaratıkları gizlemez).

omen://spell/mislead?source=paizo-pathfinder-player-core:
  name: Yanılt
  description: "Kendinizi Görünmez yapar ve kendinizin yanılsamadan bir kopyasını yaratırsınız. Büyüyü Sürdürdüğünüzde kopyanızın o tur izlemesi için zihinsel olarak bir hareket tarzı belirleyebilirsiniz. Kopyanız çevredeki hiçbir şeyi fiilen etkileyemese de sanki tam eylem sayınıza sahipmiş gibi davranır. Hem kopya hem de görünmezliğiniz büyünün süresi boyunca devam eder. Düşmanca bir eylem gerçekleştirmek, tıpkı 4. derece Görünmezlik büyüsünde olduğu gibi, yanılt büyüsünün görünmezliğini sona erdirmez. Kopyanın bir yanılsama olduğunu anlayan bir yaratık sizin görünmez olduğunuzu mutlaka bilmez; görünmez formunuzu görebilen biri de kopyanızın bir yanılsama olduğunu mutlaka bilmez. Bir Büyü Yaparsanız, saldırırsanız veya başka bir şekilde başka bir yaratıkla etkileşime girerseniz bu eylemin bir parçası olarak gözlemcilerin Dikkat ZD'lerine karşı kopyanızın o eylemi kullandığına onları ikna etmek için bir Aldatma testi deneyebilirsiniz. Bu, kopyanızın bir yanılsama olduğunun farkında olan hiç kimseyi kandırmaz ve saldırının kopyadan gelmiş olamayacağı bariz olduğunda da işe yaramaz. Örneğin bir ışın ateşlediyseniz kopya uygun şekilde konumlandırıldığı sürece onun kopyadan geldiği izlenimini verebilirsiniz; ancak bir kılıçla saldırdıysanız ve kopyanız hedeften odanın diğer ucundaysa Aldatma testiniz otomatik olarak başarısız olur."

omen://spell/mist?source=paizo-pathfinder-player-core:
  name: Sis
  description: Bir sis bulutu çağırırsınız. Sis içindeki tüm yaratıklar Belirsiz olur ve sisin dışındaki tüm yaratıklar da sisin içindeki yaratıklara karşı belirsiz olur. Bulutu Sonlandırabilirsiniz.

omen://spell/moment-of-renewal?source=paizo-pathfinder-player-core:
  name: Yenilenme Anı
  description: "Hedefler bir günlük iyileşmeyi bir anda yaşarlar. 24 saat sonra geçecek olan tüm zararlı etkiler sona erer; ancak bu durum hedefleri etkileyen aktif büyülerin süresini kısaltmaz. Hedefler 24 saat dinlenmiş gibi Can Puanı kazanır ve durumlardan kurtulurlar; ancak günlük hazırlıklarını yeniden yapmazlar ve iyileşme dışındaki dinlenme avantajlarını elde etmezler. Hedefler ardından 1 gün boyunca geçici olarak bağışık olurlar."

omen://spell/monstrosity-form?source=paizo-pathfinder-player-core:
  name: Canavarlık Formu
  description: >
    Efsanevi bir canavarın şekline dönüşerek Devasa bir savaş formuna bürünürsünüz. Genişlemek için yeterli alana sahip olmalısınız, aksi takdirde büyü kaybolur. Bu büyüyü yaptığınızda anka kuşu, mağara solucanı veya deniz yılanı seçeneklerinden birini belirleyin. Bu formdayken canavar özelliğini (anka kuşu için) veya hayvan özelliğini (mağara solucanı ya da deniz yılanı için) kazanırsınız. Büyüyü Sonlandırabilirsiniz. Hangi savaş formunu seçerseniz seçin şu istatistikleri ve yetenekleri kazanırsınız: SD = 20 + seviyeniz. Zırhınızın test cezasını ve Hareket Hızı azaltmasını yok sayın. 20 geçici Can Puanı. Karanlıkgörüşü. Seçtiğiniz savaş formuna özgü bir veya daha fazla silahsız yakın dövüş saldırısı; bunlar Vuruş Yapabileceğiniz yegâne saldırılardır. Bunlarda eğitimlisinizdir. Saldırı bonusunuz +28'dir ve listelenen hasarı kullanırsınız. Bu saldırılar Kuvvet temellidir (örneğin Halsiz durumu açısından). Silahsız saldırı bonusunuz daha yüksekse onun yerine bunu kullanabilirsiniz. Kendi bonusunuz daha yüksek olmadığı sürece +30 Atletizm bonusu. Ayrıca seçtiğiniz canavar türüne göre belirli yetenekler kazanırsınız: Mağara Solucanı Hareket Hızı 40 fit, kazma 30 fit, yüzme 20 fit; Yakın Dövüş 1 çene (erişim 10 fit), Hasar 2d12+20 delici; Yakın Dövüş 1 iğne (çevik, erişim 10 fit), Hasar 2d8+15 delici artı 2d6 sürekli zehir; Yakın Dövüş 1 gövde (erişim 10 fit) Hasar 2d8+20 ezici; Amansız Her sıranızın sonunda Felçli, Yavaşlatılmış ve Sersemlemiş durumlardan otomatik olarak toparlanırsınız. Ayrıca Hareketsiz Kılınmaya karşı bağışık olursunuz ve zorlu arazi ile büyük zorlu araziyi yok sayarsınız. Anka Kuşu Hareket Hızı 30 fit, uçma 90 fit; Yakın Dövüş 1 gaga (erişim 15 fit), Hasar 2d6+12 delici artı 2d4 ateş ve 2d4 sürekli ateş; Yakın Dövüş 1 pençe (çevik, erişim 15 fit), Hasar 2d8+12 kesici; Alev Örtüsü (aura, ateş, doğa) 20 fit. Sizden dışarıya yayılan bir ateş aurası kazanırsınız. Aura içine giren veya turunu burada bitiren bir yaratık 2d6 ateş hasarı alır. Bir yaratık bu hasarı sıra başına yalnızca bir kez alabilir. Bu aurayı bir Sürdürme eylemiyle etkinleştirebilir veya devre dışı bırakabilirsiniz. Deniz Yılanı Hareket Hızı 20 fit, yüzme 90 fit; Yakın Dövüş 1 çene (erişim 15 fit), Hasar 2d12+20 delici; Yakın Dövüş 1 kuyruk (erişim 25 fit), Hasar 2d8+20 ezici; Diken Taraması 2 (hareket) Dikenlerinizi uzatır ve Yüzer ya da Depar atarsınız. Hareketiniz sırasında herhangi bir noktada bitişiğinde olduğunuz her yaratık 4d8+10 kesici hasar alır (büyü ZD'nize karşı temel Refleks).

    Güçlendirilmiş (9.) Bunun yerine SD = 22 + seviyeniz, 25 geçici CP, saldırı bonusu +31, hasarı bir hasar zarı artırın ve Atletizm +33 kazanırsınız.

omen://spell/moon-frenzy?source=paizo-pathfinder-player-core:
  name: Ay Cinneti
  description: >
    Yabani bir görünüm hedefleri etkisi altına alarak onları güç ve vahşetle doldurur. Hedefler 5 geçici Can Puanı, Hareket Hızlarına +10 fitlik statü bonusu ve gümüşe karşı 5 zaaf kazanır. Ayrıca silahsız saldırı olan yırtıcı dişler ve pençeler çıkarırlar. Dişler 2d8 delici hasar verir; pençeler 2d6 kesici hasar verir ve çevik ile incelik özelliklerine sahiptir. Hedefler bu saldırılarda en yüksek silah veya silahsız saldırı yetkinliklerini kullanır ve eğer silah uzmanlığına veya büyük silah uzmanlığına sahiplerse bu hasarı da eklerler. Bu silahsız saldırılardan biriyle yapılan kritik vuruşta vurulan yaratık 1d4 süren kanama hasarı alır. Hedefler, Ara hariç, öfke özelliğine de sahip olmadıkça konsantrasyon eylemlerini kullanamazlar. Bir yaratık öfke özelliğine sahip tek bir eylem kullanarak büyü ZD'nize karşı bir İrade kurtarışı deneyerek büyünün kendi üzerindeki etkisini sona erdirmeyi deneyebilir; başarı durumunda büyünün kendi üzerindeki etkisini sona erdirir. Bir hedef dolunay ışığındaysa ve Orta veya daha küçük boyuttaysa ayrıca bir boy büyür. Bu, Orta veya Minik bir yaratığın erişim mesafesini 5 fit artırır.

    Güçlendirilmiş (6.) Geçici Can Puanı 10'a, gümüş zayıflığı 10'a ve saldırıların verdiği hasar üç zara çıkar.

    Güçlendirilmiş (10.) Geçici Can Puanı 20'ye, gümüş zayıflığı 20'ye ve saldırıların verdiği hasar dört zara çıkar.

omen://spell/moonbeam?source=paizo-pathfinder-player-core:
  name: Ay Işını
  description: >
    Bir ay ışığı huzmesi parlaklığı yayarsınız. Bir büyü saldırı zarı atın. Işık huzmesi 2d6 ateş hasarı verir. Bu hasar zaaflar, dirençler ve benzeri durumlar açısından gümüş hasarı sayılır.

    Kritik Başarı Huzme iki kat hasar verir ve hedef 1 dakika boyunca Gözü Kamaşmış olur.

    Başarı Huzme tam hasar verir ve hedef 1 tur boyunca Gözü Kamaşmış olur.

    Güçlendirilmiş (+1) Işının hasarı 1d6 artar.

omen://spell/mountain-resilience?source=paizo-pathfinder-player-core:
  name: Dağ Dayanıklılığı
  description: >
    Hedefin derisi bir dağ yamacının taşı gibi sertleşir. Adamantin hariç fiziksel hasara karşı 5 direnç kazanır. Hedef ezici, delici veya kesici bir saldırıyla her vurulduğunda dağ dayanıklılığının süresi 1 dakika azalır.

    Güçlendirilmiş (6.) Direnç 10'a çıkar.

    Güçlendirilmiş (8.) Direnç 15'e çıkar.

    Güçlendirilmiş (10.) Direnç 20'ye çıkar.

omen://spell/mystic-armor?source=paizo-pathfinder-player-core:
  name: Mistik Zırh
  description: >
    Kendinizi parıldayan büyü enerjisiyle koruma altına alarak Savunma Değeri'ne +1 eşya bonusu ve en fazla +5 Çeviklik bonusu kazanırsınız. Mistik zırh kuşanmışken Savunma Değeri'nizi hesaplamak için zırhsız yetkinliğinizi kullanırsınız.

    Güçlendirilmiş (4.) Kurtarışlara +1 eşya bonusu kazanırsınız.

    Güçlendirilmiş (6.) Savunma Değeri'ne eşya bonusu +2'ye çıkar ve kurtarışlara +1 eşya bonusu kazanırsınız.

    Güçlendirilmiş (8.) Savunma Değeri'ne eşya bonusu +2'ye çıkar ve kurtarışlara +2 eşya bonusu kazanırsınız.

    Güçlendirilmiş (10.) Savunma Değeri'ne eşya bonusu +3'e çıkar ve kurtarışlara +3 eşya bonusu kazanırsınız.

omen://spell/mystic-beacon?source=paizo-pathfinder-player-core:
  name: Mistik Fener
  description: Hedefin bir sonraki sıranızın başlangıcından önce yapacağı bir sonraki hasar verici veya iyileştirici büyü, sanki gerçek derecesinden 1 derece daha yükseğe güçlendirilmiş gibi hasar verir veya Can Puanı yeniler. Bu durum devam eden etkilere değil, yalnızca büyü yapıldığındaki ilk iyileşme veya hasara uygulanır. Büyü bunun dışında gerçek derecesinde işlev görür. Hedef büyüyü yaptığında mistik fener sona erer.

omen://spell/nature-incarnate?source=paizo-pathfinder-player-core:
  name: Tabiat Mücessemi
  description: "Dünyanın ilkel gücü içinizden akar. Tabiatın bir tecellisine dönüşürsünüz: ya bir yeşil adama ya da bir kaijuya. Savaş formunuz yeşil adam için Orta veya kaiju için Devasadır (30 fit x 30 fit alan). Bu formdayken bitki özelliğini (yeşil adam için) veya canavar özelliğini (kaiju için) kazanırsınız. Büyüyü Sonlandırabilirsiniz. Hangi savaş formunu seçerseniz seçin aşağıdaki istatistikleri ve yetenekleri kazanırsınız: SD = 25 + seviyeniz. Zırhınızın test cezasını ve Hareket Hızı azaltmasını yok sayın. 30 geçici Can Puanı. Karanlıkgörüşü. Seçtiğiniz savaş formuna özgü bir veya daha fazla saldırı; bunlar Vuruş Yapabileceğiniz yegâne saldırılardır. Bunlarda eğitimlisinizdir. Saldırı bonusunuz +34'tür ve listelenen hasarı kullanırsınız. Bu saldırılar Kuvvet temellidir (örneğin Halsiz durumu açısından). Silahsız saldırı bonusunuz daha yüksekse onun yerine bunu kullanabilirsiniz. Kendi bonusunuz daha yüksek olmadığı sürece +36 Atletizm bonusu. Seçtiğiniz tecelliye göre belirli yetenekler kazanırsınız: Yeşil Adam Hareket Hızı 40 fit, tırmanma 40 fit; Yakın Dövüş 1 sarmaşıklar (erişim 30 fit, çok yönlü D), Hasar 6d8+12 ezici; Menzilli 1 dikenler (menzil 100 fit), Hasar 6d6+6 delici; Yeşil Okşama (aura, doğa) 60 fit. Bitkiler dışındaki düşmanlar büyü ZD'nize karşı bir fortitude|against:spell testinde başarılı olmalıdır, aksi takdirde 1 tur boyunca Sakar 1 olurlar (kritik başarısızlıkta Sakar 2). Kaiju Hareket Hızı 50 fit; fiziksel hasara karşı 5 direnç; Yakın Dövüş 1 çeneler (erişim 30 fit), Hasar 6d10+10 delici; Yakın Dövüş 1 pençeler (çevik, erişim 30 fit), Hasar 6d8+8 kesici; Yakın Dövüş 1 ayak (çevik, erişim 15 fit), Hasar 6d6+10 ezici; Durdurulamaz Hareketsiz Kılınmaya karşı bağışıksınızdır ve zorlu arazi ile büyük zorlu araziyi yok sayarsınız; Çiğneme 3 Hareket Hızınızın iki katına kadar hareket eder ve İri veya daha küçük yaratıkların alanlarından geçerek alanına girdiğiniz her yaratığı çiğnersiniz. Çiğnenen bir yaratık büyü ZD'nize karşı bir reflex|against:spell|basic kurtarışıyla ayak hasarı alır."

omen://spell/natures-bounty?source=paizo-pathfinder-player-core:
  name: Doğanın Cömertliği
  description: >
    Açık avucunuzda seçtiğiniz avuç içi büyüklüğünde çiğ bir meyve veya sebze belirir. Bir yaratık bir Etkileşime Gir eylemiyle yiyeceği tüketerek 3d10+12 Can Puanı geri kazanabilir ve bir öğün yemek yemiş gibi beslenebilir. Yenmezse yiyecek 1 dakika sonra toza dönüşür.

    Güçlendirilmiş (+1) Yenilenen Can Puanı 6 artar.
  requirements: Bir eliniz boştadır.

omen://spell/natures-pathway?source=paizo-pathfinder-player-core:
  name: Doğanın Patikası
  description: >
    İçine sığabileceğiniz kadar büyük bir gövdeye sahip canlı bir ağacın içine adım atar ve 5 mil içindeki yine yeterince büyük gövdeye sahip herhangi bir ağaca anında ışınlanırsınız. İlk ağaca girdiğinizde menzil içindeki diğer yeterince büyük ağaçların kaba konumlarını anında öğrenirsiniz ve dilerseniz başlangıçtaki ağaçtan çıkabilirsiniz. Yanınızda boyutlararası mekânlar taşıyamazsınız; bunu yapmaya çalışırsanız büyü başarısız olur.

    Güçlendirilmiş (6.) Çıktığınız ağaç 50 mile kadar uzakta olabilir.

    Güçlendirilmiş (8.) Çıktığınız ağaç 500 mile kadar uzakta olabilir.

    Güçlendirilmiş (9.) Çıktığınız ağaç aynı gezegendeki herhangi bir yerde olabilir.

omen://spell/needle-of-vengeance?source=paizo-pathfinder-player-core:
  name: İntikam İğnesi
  description: >
    Hedef düşman, haminizin özel değer verdiği bir yaratığa saldırmaya her çalıştığında uzun, tırtıklı bir iğne onun psişesine batar. Kendinizin veya müttefiklerinizden birinin adını verin. Hedef, adı geçen yaratığa karşı düşmanca bir eylem kullandığı her seferde temel bir İrade kurtarışıyla 2 zihinsel hasar alır.

    Güçlendirilmiş (+1) Hasarı 2 artırın.

omen://spell/never-mind?source=paizo-pathfinder-player-core:
  name: Zihni Sıfırla
  description: >
    Hedefin zihinsel melekelerini ciddi şekilde azaltırsınız. Hedef bir İrade kurtarışı denemelidir. Bu lanetin etkileri yalnızca lanetleri hedef alan etkilerle kaldırılabilir.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef 1 tur boyunca Zihni Bulanmış 2 olur.

    Başarısızlık Hedef sınırsız bir süre boyunca Zihni Bulanmış 4 olur.

    Kritik Başarısızlık Hedefin zekâsı kalıcı olarak bir hayvanınkinin altına düşer ve Karizma, Zekâ ile Bilgelik bonuslarını –5 sayar. Tüm büyü yapma kabiliyeti de dâhil olmak üzere zihinsel meleke gerektiren tüm sınıf yeteneklerini kaybeder. Hedef bir oyuncu karakteri (OK) ise GM'in kontrolünde bir OYK hâline gelir.

omen://spell/nightmare?source=paizo-pathfinder-player-core:
  name: Kâbus
  description: >
    Hedefinize rahatsız edici kâbuslar gönderirsiniz. Hedef bir sonraki uyuyuşunda bir İrade kurtarışı denemelidir. Hedefi yalnızca ismen tanıyorsanız ve onunla hiç karşılaşmadıysanız hedef İrade kurtarışına +4 durumsal bonus kazanır.

    Kritik Başarı Hedef hiçbir olumsuz etki yaşamaz ve 1 hafta boyunca geçici olarak bağışık olur.

    Başarı Hedef kâbusları yaşar ancak hoş olmayan anılar dışında hiçbir olumsuz etki yaşamaz.

    Başarısızlık Hedef kâbusları yaşar ve Yorgun olarak uyanır.

    Kritik Başarısızlık Hedef kâbusları yaşar, Yorgun olarak uyanır ve artık Yorgun olmayana kadar İçi Çekilmiş 2 olur.

omen://spell/noise-blast?source=paizo-pathfinder-player-core:
  name: Ses Patlaması
  description: >
    Kulak tırmalayıcı bir ses patlayarak 2d10 sonik hasar verir. Her yaratık bir Dayanıklılık kurtarışı denemelidir.

    Kritik Başarı Yaratık etkilenmez.

    Başarı Yaratık yarı hasar alır.

    Başarısızlık Yaratık tam hasar alır ve 1 tur boyunca Sağır olur.

    Kritik Başarısızlık Yaratık iki kat hasar alır, 1 dakika boyunca sağır olur ve Sersemlemiş 1 olur.

    Güçlendirilmiş (+1) Hasar 1d10 artar.

omen://spell/nudge-fate?source=paizo-pathfinder-player-core:
  name: Kaderi Dürt
  description: Haminizin çıkrığının en ufak bir dönüşü bile kaderi değiştirmeye yeter. Hedef bir saldırı zarında, beceri testinde veya kurtarışta başarısız olduğunda ve +1 statü bonusu kritik bir başarısızlığı başarısızlığa ya da başarısızlığı bir başarıya dönüştüreceğinde hedefin testine geriye dönük olarak +1 statü bonusu vererek sonucu uygun şekilde değiştirirsiniz. Büyü ardından sona erer. Bu büyünün önceki bir yapılışı hâlâ yürürlükteyken kaderi dürt büyüsünü yaparsanız önceki etki sona erer.

omen://spell/oaken-resilience?source=paizo-pathfinder-player-core:
  name: Meşe Dayanıklılığı
  description: >
    Hedefin derisi ağaç kabuğu veya odun kıvamında sertleşir. Hedef ezici ve delici hasara karşı 2 direnç ve ateşe karşı 3 zaaf kazanır. Hedef ateş hasarı aldıktan sonra hasarın alınmasıyla tetiklenen bir serbest eylem olarak büyüyü Sonlandırabilir; bunu yapmak hedefin aldığı ateş hasarını azaltmaz.

    Güçlendirilmiş (+2) Dirençler 2 artar ve zaaf 3 artar.

omen://spell/ode-to-ouroboros?source=paizo-pathfinder-player-core:
  name: Ouroboros Kasidesi
  description: >
    Tetikleyici: Bir yaratığın ölmekte durumu öleceği değere ulaşmak üzeredir.

    Kasideniz ölümü savuşturur. Hedefin ölmekte durumu öldüğü değerin 1 altında kalır. Bu durum Kül Et ve ölüm etkileri gibi hedefin ölmekte durumunu artırmadan onu öldüren etkilerden kaynaklanan ölümü engellemeye yaramaz.

omen://spell/one-with-plants?source=paizo-pathfinder-player-core:
  name: Bitkilerle Bir
  description: >
    Ya bir bitkiye dönüşebilir ya da bitki maddesiyle kaynaşabilirsiniz. Dönüşmüş durumdayken hareket edemez veya bitkinin dışındaki hiçbir şeyi etkileyemezsiniz; ancak bitkinin ötesinde bir etki hattı gerektirmedikleri sürece büyü yapabilirsiniz. Bu büyüyü Sonlandırabilirsiniz.

    Bitkilerle Kaynaş Büyünün süresi 10 dakikadır. Büyüyü yaparken sizi ve eşyalarınızı içine alacak kadar hacme sahip bir bitkiye dokunmalısınız, aksi takdirde büyü kesintiye uğrar. Kaynaşmış durumdayken bitkinin dışında olup bitenleri duyabilir ama göremezsiniz. Siz içindeyken bitki hasar alırsa bitkiden dışarı atılırsınız ve 10d6 hasar alırsınız. Büyülü geçit büyüsü hasar vermeden sizi dışarı atar. Bitkinin dışına çıkarsanız büyü sona erer.

    Bir Bitkiye Dönüş Büyünün süresi 8 saattir. Büyük bir bitkiye (tipik olarak bir ağaca) dönüşürsünüz. Dikkat testleri gerçek doğanızı açığa çıkarmaz; ancak büyü ZD'nize karşı başarılı bir Doğa veya Hayatta Kalma testi bölgeye garip bir şekilde yeni gelmiş bir bitki gibi göründüğünüzü açığa çıkarır. Bu formdayken normal duyularınızı kullanarak çevrenizdeki her şeyi gözlemleyebilirsiniz. Bir bitki olarak Savunma Değeri'niz 20'dir ve sizi yalnızca statü bonusları, statü cezaları, durumsal bonuslar ve durumsal cezalar etkiler. Refleks kurtarışlarında attığınız tüm başarılar ve kritik başarılar başarısızlık sayılır.

omen://spell/one-with-stone?source=paizo-pathfinder-player-core:
  name: Taşla Bir
  description: >
    Ya bir taşa dönüşebilir ya da taşla kaynaşabilirsiniz. Dönüşmüş durumdayken hareket edemez veya taşın dışındaki hiçbir şeyi etkileyemezsiniz; ancak taşın ötesinde bir etki hattı gerektirmedikleri sürece büyü yapabilirsiniz. Bu büyüyü Sonlandırabilirsiniz.

    Taşla Kaynaş Büyünün süresi 10 dakikadır. Büyüyü yaparken sizi ve eşyalarınızı içine alacak kadar hacme sahip bir taşa dokunmalısınız, aksi takdirde büyü kesintiye uğrar. Kaynaşmış durumdayken taşın dışında olup bitenleri duyabilir ama göremezsiniz. Siz içindeyken taş hasar alırsa taştan dışarı atılırsınız ve 10d6 hasar alırsınız. Büyülü geçit büyüsü hasar vermeden sizi dışarı atar. Taşın dışına çıkarsanız büyü sona erer.

    Bir Taşa Dönüş Büyünün süresi 8 saattir. Büyük bir taşa dönüşürsünüz. Dikkat testleri gerçek doğanızı açığa çıkarmaz; ancak büyü ZD'nize karşı başarılı bir Doğa veya Hayatta Kalma testi bölgeye garip bir şekilde yeni gelmiş bir taş gibi göründüğünüzü açığa çıkarır. Bu formdayken normal duyularınızı kullanarak çevrenizdeki her şeyi gözlemleyebilirsiniz. Bir taş olarak Savunma Değeri'niz 23'tür ve sizi yalnızca statü bonusları, statü cezaları, durumsal bonuslar ve durumsal cezalar etkiler. Refleks kurtarışlarında attığınız tüm başarılar ve kritik başarılar başarısızlık sayılır.

omen://spell/outcasts-curse?source=paizo-pathfinder-player-core:
  name: Dışlanmışın Laneti
  description: >
    Hedefi varlığını rahatsız edici ve itici kılan bir lanete uğratırsınız. Hedef bir İrade kurtarışı denemelidir.

    Kritik Başarı Hedef etkilenmez.

    Başarı 10 dakika boyunca hedef Aldatma, Diplomasi, Gözdağı veya Gösteri testi denediği her seferde iki kez zar atmalı ve daha kötü sonucu kullanmalıdır; ayrıca karşılaştığı yaratıklar ona karşı bir basamak daha kötü başlangıç tutumuna sahip olur (örneğin Kayıtsız yerine Mesafeli).

    Başarısızlık Başarı gibi, ancak etki kalıcıdır.

    Kritik Başarısızlık Başarısızlık gibi ve hedefin karşılaştığı yaratıklar ona karşı iki basamak daha kötü başlangıç tutumuna sahip olur.

omen://spell/overstuff?source=paizo-pathfinder-player-core:
  name: Tıka Basa Doyur
  description: >
    Hedef muazzam miktarda yiyecek ve içecekle dolar. Tam bir öğünlük besin alır ve bir Dayanıklılık kurtarışı denemelidir. Bu büyüden dolayı midesi bulanan bir hedef, artık midesi bulanmayana kadar Hareket Hızına –10 fitlik statü cezası alır.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef Midesi Bulanmış 1 olur; ancak durumu sona erdirmek için bir eylem harcarsa otomatik olarak başarılı olur.

    Başarısızlık Hedef Midesi Bulanmış 1 olur.

    Kritik Başarısızlık Hedef Midesi Bulanmış 2 olur.

omen://spell/overwhelming-presence?source=paizo-pathfinder-player-core:
  name: Ezici Heybet
  description: >
    Kendinizi doğaüstü bir ihtişamla çevreleyerek seçtiğiniz bir görünüm, nişanlar ve ikonografiyle bir tanrı veya benzer derecede görkemli bir varlık gibi görünürsünüz. Hedefler bir İrade kurtarışı denemelidir. Sonuç ne olursa olsun hedef ardından 1 dakika boyunca geçici olarak bağışık olur.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef size iki kez hürmet sunmalıdır. Hürmet sunmak, hedefin (eğilirken) hareket özelliğine ya da (ellerinde bir hediye sunarken) manipülasyon özelliğine sahip tek bir eylem harcamasını gerektirir. Mümkünse her turlarında en az bir kez hürmet sunmalıdırlar. Etkilendiği sürece hedef size Kendini Kaptırmış olur ve size karşı düşmanca eylemler kullanamaz.

    Başarısızlık Başarı gibi, ancak hedef toplamda altı kez hürmet sunmalıdır.

    Kritik Başarısızlık Başarısızlık gibi, ancak hedef tüm eylemlerini hürmet sunarak harcamalıdır ve hürmet tamamen sunulana kadar başka eylem gerçekleştiremez.

omen://spell/paralyze?source=paizo-pathfinder-player-core:
  name: Felç Et
  description: >
    Hedefin motor dürtülerini zihninden çıkmadan önce engelleyerek onu yerinde dondurmakla tehdit edersiniz. Hedef bir İrade kurtarışı denemelidir.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef Sersemlemiş 1 olur.

    Başarısızlık Hedef 1 tur boyunca Felçli olur.

    Kritik Başarısızlık Hedef 4 tur boyunca Felçli olur. Sıralarının her birinin sonunda kalan süreyi 1 tur azaltmak ya da kritik bir başarıda tamamen sona erdirmek için yeni bir İrade kurtarışı deneyebilir.

    Güçlendirilmiş (7.) En fazla 10 yaratığı hedef alabilirsiniz.

omen://spell/paranoia?source=paizo-pathfinder-player-core:
  name: Paranoya
  description: >
    Hedefin diğer tüm yaratıkları korkunç tehditler olarak görmesini sağlarsınız. Hedef çevresindeki tüm yaratıklara karşı yoğun bir paranoyaya kapılır ve bir İrade kurtarışı denemelidir.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef gördüğü herkesin potansiyel bir tehdit olduğuna inanır. Daha önce müttefik olanlar dâhil, zaten düşmanca olmadığı tüm yaratıklara karşı Hoşnutsuz olur. Kimseye müttefik muamelesi yapmaz. Büyü 1 tur sonra sona erer.

    Başarısızlık Başarı gibi, ancak etki 1 dakika sürer.

    Kritik Başarısızlık Başarısızlık gibi, ancak hedef gördüğü herkesin can düşmanı olduğuna inanır. GM tarafından belirlendiği üzere daha önce müttefiki olup olmadığına bakılmaksızın reaksiyonlarını ve serbest eylemlerini herkese karşı kullanır. Bunun dışında normalde davrandığı kadar rasyonel hareket eder ve muhtemelen kendisini rahat bırakanlar yerine aktif olarak kendisine saldıran veya engelleyen yaratıklara saldırmayı tercih eder.

    Güçlendirilmiş (6.) En fazla 5 yaratığı hedef alabilirsiniz.

omen://spell/patrons-puppet?source=paizo-pathfinder-player-core:
  name: Haminin Kuklası
  description: >
    Tetikleyici: Turunuz başlar.

    Dile getirmediğiniz yakarışınız üzerine haminiz geçici olarak tanıdığınızın kontrolünü üstlenir. Tanıdığınıza Emrederek bu tur normal eylemlerini gerçekleştirmesini sağlarsınız. Emriniz işitsel veya konsantrasyon özelliklerine sahip değildir; haminiz temsilcisini doğrudan hareket ettirir.

omen://spell/peaceful-bubble?source=paizo-pathfinder-player-core:
  name: Huzur Baloncuğu
  description: "Süzülen, yanardöner runlardan oluşan mat bir kabuk alanı kaplayarak bir baloncuk oluşturur. İnfilak alanını 10 fitlik artışlarla daha küçük yapmayı seçebilirsiniz. Runlar hareketi engellemez; ancak baloncuğun içindekiler dışındakileri, dışındakiler de içindekileri algılayamaz. Tespit ve gözetleme etkileri de aynı şekilde engellenir. Baloncuk içinde uyuyan yaratıklar büyülerle gönderilen rüyalara karşı bağışıktır. 8 saat uyuyanlar Lanetlenmiş durumlarını 1 yerine 2 azaltırlar."

omen://spell/peaceful-rest?source=paizo-pathfinder-player-core:
  name: Huzurlu İstirahat
  description: >
    Hedeflenen ceset çürümez ve bir hortlağa dönüştürülemez. Ceset belirli bir süre içinde ölmüş olmasını gerektiren bir büyüye maruz kalırsa (örneğin Ölü Uyandır), huzurlu istirahat süresini o süreden saymayın. Bu büyü ayrıca sıradan böceklerin ve haşerelerin (kurtçuklar gibi) bedeni tüketmesini engeller.

    Güçlendirilmiş (5.) Büyünün süresi sınırsızdır; ancak büyüyü yapmak bir eylem daha fazla sürer ve bir maliyet gerektirir (6 gp değerinde mumyalama sıvısı).

omen://spell/perfected-body?source=paizo-pathfinder-player-core:
  name: Yetkin Beden
  description: >
    Tetikleyici: Başkalaşım, zehir veya polimorf özelliğine sahip ya da sizi Sakar, Lanetlenmiş, Halsiz, Taşlaşmış veya Midesi Bulanmış kılacak bir etkiye karşı kurtarışta başarısız veya kritik başarısız olursunuz.

    Bedeninizin yetkinliği sizi çoğu kimseden biraz daha sağlıklı tutar. Kritik başarısızlık attıysanız başarısızlık veya başarısızlık attıysanız başarı elde edersiniz.

omen://spell/perfected-mind?source=paizo-pathfinder-player-core:
  name: Yetkin Zihin
  description: Zihninizdeki tüm dikkat dağıtıcı unsurları temizlemek için yetkinlik üzerine tefekküre dalarsınız. Şu anda sizi etkileyen ve İrade kurtarışı gerektirmiş olan bir zihinsel etkiye karşı yeni bir İrade kurtarışı deneyin. Yeni kurtarış ilk atıştan daha kötü bir sonuç vermedikçe (bu durumda hiçbir şey olmaz) zihinsel etkinin neticesini belirlemek için bu yeni kurtarışın sonucunu kullanın. Yetkin zihni belirli bir etkiye karşı yalnızca bir kez kullanabilirsiniz.

omen://spell/personal-blizzard?source=paizo-pathfinder-player-core:
  name: Kişisel Tipi
  description: >
    Haminizin nefesi hedefinizi takip eden görüş engelleyici, aşındırıcı bir buz tipisine dönüşür. Hedef bir Dayanıklılık kurtarışı dener.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef 1d6 soğuk hasarı alır ve büyü sona erer.

    Başarısızlık Hedef 1d6 soğuk hasarı ve 1d6 süren soğuk hasarı alır. Süren hasar büyü sona erdiğinde otomatik olarak sona erer. Hedef diğer yaratıklara karşı Belirsiz olur ve diğer yaratıklar da ona karşı belirsiz olur.

    Kritik Başarısızlık Başarısızlık gibi, ancak hem soğuk hasarı hem de süren soğuk hasarı 2d6'dır.

    Güçlendirilmiş (+1) Soğuk hasarı ve süren soğuk hasarı 1 artar (kritik başarısızlıkta 2 artar).

omen://spell/pest-form?source=paizo-pathfinder-player-core:
  name: Haşere Formu
  description: >
    Kedi, böcek, kertenkele veya sıçan gibi Minik boyutlu bir hayvanın savaş formuna dönüşürsünüz. Belirli hayvan türünü belirleyebilirsiniz (örneğin sıçan veya peygamberdevesi); ancak bunun formun Boyutu veya istatistikleri üzerinde bir etkisi yoktur. Bu formdayken hayvan özelliğini kazanırsınız ve Vuruş Yapamazsınız. Büyüyü Sonlandırabilirsiniz. Şu istatistikleri ve yetenekleri kazanırsınız: SD = 15 + seviyeniz. Zırhınızın test cezasını ve Hareket Hızı azaltmasını yok sayın. Hareket Hızı 20 fit. Fiziksel hasara karşı 5 zaaf. (Bu formdayken fiziksel hasar alırsanız fazladan 5 hasar alırsınız.) Loşgörüşü ve 30 fit kusurlu koku alma. Kendi bonusunuz daha yüksek olmadığı sürece +10 Akrobasi ve Gizlilik bonusu; Atletizm bonusu -4.

    Güçlendirilmiş (4.) Kuş gibi uçan bir yaratığa dönüşebilirsiniz, bu da size 20 fitlik bir uçma Hareket Hızı kazandırır.

omen://spell/pet-cache?source=paizo-pathfinder-player-core:
  name: Ruhdaş Hayvan Zulası
  description: Pelerinizi açar veya ellerinizle bir boşluk yaratarak hedefi yalnızca temel konforuna yetecek büyüklükteki bir cep boyutuna çekersiniz. Bu boyutlararası mekâna başka hiçbir yaratık giremez ve hedef eşyaları yalnızca kendi türündeki bir yaratık tarafından giyilmek üzere tasarlanmışsa beraberinde getirebilir. Mekân hedefi süre boyunca hayatta tutmaya yetecek kadar havaya, yiyeceğe ve suya sahiptir. Büyüyü Sonlandırabilirsiniz. Ayrıca ölürseniz veya boyutlararası bir mekâna girerseniz büyü sona erer. Büyü sona erdiğinde hedef (girmiş olabileceğiniz herhangi bir boyutlararası mekânın dışındaki) en yakın boş alanda yeniden belirir.

omen://spell/petrify?source=paizo-pathfinder-player-core:
  name: Taşlaştır
  description: >
    Hedefin bedeni yavaşça taş bir heykele dönüşür. Hedef bir Dayanıklılık kurtarışı denemelidir.

    Kritik Başarı Hedef etkilenmez.

    Başarı Bedeninde taş oluşmaya başladıkça hedef 1 tur boyunca Yavaşlatılmış 1 olur.

    Başarısızlık Hedef Yavaşlatılmış 1 olur ve sıralarının her birinin sonunda bir Dayanıklılık kurtarışı denemelidir; bu devam eden kurtarış tesirsiz kılma özelliğine sahiptir. Başarısız bir kurtarışta vücuduna yayılan taş oluşumlarıyla birlikte yavaşlatılmış durumu 1 artar (veya kritik başarısızlıkta 2 artar). Başarılı bir kurtarış yavaşlatılmış durumunu 1 azaltır. Bir yaratık taşlaştır büyüsünden kaynaklanan yavaşlatılmış durumu nedeniyle tamamen eylem yapamaz hâle geldiğinde, büyü gri bir ışık parıltısıyla sona erer ve hedef bir heykele dönüşerek kalıcı olarak Taşlaşmış kalır. Yavaşlatılmış durumu ortadan kaldırılırsa da büyü sona erer ve bu da taşın zararsızca parçalanıp dökülmesine neden olur.

    Kritik Başarısızlık Başarısızlık gibi, ancak hedef başlangıçta Yavaşlatılmış 2 olur.

omen://spell/phantasmagoria?source=paizo-pathfinder-player-core:
  name: Fantazmagorya
  description: "Hedeflerin zihinlerini birbiriyle çarpışan sayısız rüya ve hayat gibi sonsuz imgelerle doldurursunuz. Hücum eden bilgi akışı, İrade kurtarışına bağlı olarak her hedefe 16d6[mental] hasar verir. Kritik Başarı Hedef etkilenmez. Başarı Hedef yarım hasar alır ve bir sonraki sıranızın başlangıcına kadar reaksiyon kullanamaz. Başarısızlık Hedef tam hasar alır ve bir sonraki sıranızın başlangıcına kadar Aklı Bulanmış olur. Kritik Başarısızlık Hedef iki kat hasar alır ve 1 dakika boyunca aklı bulanmış olur."

omen://spell/phantasmal-calamity?source=paizo-pathfinder-player-core:
  name: Hayali Felaket
  description: >
    Kıyametvari bir yıkım görüsü alandaki her yaratığın zihnini doldurur. Görü 11d6 zihinsel hasar verir (temel İrade kurtarışı). Kritik bir başarısızlıkta yaratık ayrıca bir Refleks kurtarışında başarılı olmalıdır, aksi takdirde kapana kısıldığına inanır (bir yarıkta sıkışıp kalmış, denizde sürükleniyor veya görüsüyle uyumlu başka bir kader). İkinci kurtarışta başarısız olursa ayrıca 1 dakika boyunca Sersemlemiş olur. Sıralarının her birinin sonunda yeni bir İrade kurtarışı deneyebilir ve başarı durumunda yanılsamaya inanmayarak sersemlemiş durumdan toparlanır.

    Güçlendirilmiş (+1) Hasar 2d6 artar.

omen://spell/phantasmal-minion?source=paizo-pathfinder-player-core:
  name: Hayali Hizmetkâr
  description: "Bir Hayali Hizmetkâr çağırırsınız. Hizmetkâr kabaca insansı biçimindedir. Görünmez olmasını veya uçucu bir görünüme sahip olmasını seçebilirsiniz; ancak gerçek bir yaratık değil, belirgin bir büyü etkisidir."

omen://spell/phantom-pain?source=paizo-pathfinder-player-core:
  name: Fantom Acısı
  description: "Yanılsama bir acı hedefi kıvrandırarak 2d4 zihinsel hasar ve (spell rank)d4[persistent,mental] hasar verir. Hedef bir İrade kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedef ilk hasarın tamamını alır ancak süren hasar almaz ve büyü derhal sona erer. Başarısızlık Hedef tam ilk hasarı ve süren hasarı alır ve hedef Midesi Bulanmış 1 olur. Hedef Midesi Bulanmış durumundan kurtulursa süren hasar sona erer ve büyü biter. Kritik Başarısızlık Başarısızlıktaki gibidir, ancak hedef Midesi Bulanmış 2 olur. Güçlendirilmiş (+1) Hasar 2d4 ve süren hasar 1d4 artar."

omen://spell/phase-familiar?source=paizo-pathfinder-player-core:
  name: Faz Tanıdığı
  description: >
    Tetikleyici: Tanıdığınız hasar almak üzeredir.

    Haminiz tanıdığınıza anlık olarak esire geri çağırarak onu katı, fiziksel formundan hayaletsi bir versiyonuna dönüştürür. Tetikleyici hasara karşı tanıdığınız tüm hasarlara karşı 5 direnç kazanır ve zayıf nokta hasarına karşı bağışık olur.

    Güçlendirilmiş (+1) Direnci 2 artırın.

omen://spell/pied-piping?source=paizo-pathfinder-player-core:
  name: Kavalla Ayartma
  description: >
    Gösteriniz dinleyicileri büyüleyerek onları sizi takip etmeye zorlar. Yayılım alanı içindeki her yaratık Büyüyü Yaptığınızda veya alana ilk girdiğinde bir İrade kurtarışı denemelidir; ardından 1 gün boyunca geçici olarak bağışık olurlar. Sıra başına bir kez yayılımın yarıçapını 5 fit artırmak için besteyi Sürdürebilirsiniz. Büyüyü Sonlandırabilirsiniz.

    Kritik Başarı Yaratık etkilenmez.

    Başarı Yaratık size Kendini Kaptırmış olur.

    Başarısızlık Yaratık size Kendini Kaptırmış olur ve tüm eylemlerini size doğru hareket etmek ve gösterinize övgüler yağdırmak için kullanır. Etkilenen yaratığa karşı düşmanca bir eylem kullanılırsa bu etki sona erer.

    Kritik Başarısızlık Hedef hizmetkâr özelliğini kazanır ve sizin tarafınızdan kontrol edilir. Etkilenen yaratığa karşı düşmanca bir eylem kullanılırsa veya yaratığı kendisine zarar verecek herhangi bir eylem kullanmaya yönlendirirseniz bu etki sona erer.

omen://spell/pinpoint?source=paizo-pathfinder-player-core:
  name: Nokta Tespiti
  description: Hedefin tam konumunun (bina, topluluk ve ülke dâhil) ve varoluş düzleminin adını öğrenirsiniz. Bir yaratığı yalnızca onu bizzat gördüyseniz, önemli eşyalarından birine sahipseniz veya bir saç lülesi gibi bedeninden bir parçaya sahipseniz hedef alabilirsiniz. Bir nesneyi hedef almak için ona dokunmuş olmalı veya bir parçasına sahip olmalısınız. Nokta tespiti, normalde onu engelleme şansına sahip olsalar bile bu büyüden daha düşük derecedeki tespite karşı korumaları otomatik olarak aşar.

omen://spell/planar-displacement?source=paizo-pathfinder-player-core:
  name: Düzlemsel Yer Değişimi
  description: >
    Bir ritüel çemberi çizersiniz ve ritüel tamamlandığında alandaki tüm yaratıkları farklı bir varoluş düzlemine geçirirsiniz. Birincil test için kullandığınız beceri hedeflenen varış yeri hakkında Bilgi Hatırla testi yapmak için kullanılabilecek bir beceri olmalıdır; örneğin Ateş Düzlemi için Büyübilim ya da Doğa, Astral Düzlem için Okültizm gibi. Bir ikincil büyü yapıcı çıkış noktasında sizinle olmak yerine varış yerinin tam noktasında bulunabilir. Hedefteki bir ikincil büyü yapıcı testinde başarılı olursa ve siz bir başarı atarsanız ritüel bunun yerine kritik bir başarı olur.

    Kritik Başarı Hedeflenen düzleme hedeflerden birinin (sizin seçiminizle) o düzleme son seyahat ettiğinde bulunduğu son noktada varırsınız. Belirli bir düzleme seyahat tüm hedefler için ilk kez gerçekleşiyorsa düzlemde rastgele bir noktada belirlersiniz. Çember 1 dakika boyunca aktif kalır; bu süre boyunca ritüelin naklettiği herhangi bir yaratık konsantrasyon özelliğine sahip tek bir eylemle başlangıç noktasına geri dönebilir.

    Başarı Kritik başarı gibi, ancak varış noktanızdan 1d10×25 mil uzakta varırsınız.

    Başarısızlık Denemeniz başarısız olur.

    Kritik Başarısızlık Ritüel başarısız olur ve GM yanlış bir düzleme mi seyahat ettiğinizi yoksa 1 hafta boyunca düzlemsel seyahatten men mi edildiğinizi belirler.
  requirements: Odak olarak kullanılan, hedef düzleme ait bir düzlem anahtarı

omen://spell/planar-palace?source=paizo-pathfinder-player-core:
  name: Düzlemsel Saray
  description: "Tek bir girişi olan ferah bir konuttan oluşan boyutlararası bir yarıdüzlem meydana getirirsiniz. Giriş Büyüyü Yaptığınız düzleme bağlanır ve büyünün menzili içindeki herhangi bir yerde 5 fit genişliğinde ve 10 fit yüksekliğinde soluk, parıldayan dikey bir dikdörtgen olarak belirir. Büyüyü Yaptığınızda kimlerin girebileceğini belirlersiniz. İçeri girdikten sonra girişi kapatıp onu Görünmez kılabilirsiniz. Siz ve belirlediğiniz yaratıklar kapıyı dilediğiniz zaman yeniden açabilirsiniz. İçeride yarıdüzlem görkemli bir fuaye ve çok sayıda lüks odaya sahip bir malikâne gibi görünür. Malikâne 40 fit genişliğinde, 40 fit derinliğinde ve 30 fit yüksekliğinde bir alana sığması koşuluyla Büyüyü Yaptığınızda hayal ettiğiniz herhangi bir kat planına sahip olabilir. Malikânenin girişi kapalıyken malikâneye girmek için kullanılabilen Düzlemlerarası Işınlanma hariç dışarıdan gelen etkiler içeri nüfuz edemez ve içeriden gelenler de dışarı çıkamaz. Gözetleme büyüsü ve benzeri etkileri yalnızca düzlemleri aşma kabiliyetine sahiplerse dışarıyı gözlemlemek için kullanabilirsiniz. Malikâne içindeki herkese 24 kişiye kadar hizmetkâr personeli hizmet eder. Bunlar Hayali Hizmetkâr büyüsünün yarattığı hizmetkâra benzer; ancak görünürdürler ve görünüşlerini büyü yaparken belirlersiniz. Malikâne 150 kişiye dokuz çeşitten oluşan bir ziyafet sunmaya yetecek kadar yiyecekle donatılmıştır."

omen://spell/planar-seal?source=paizo-pathfinder-player-core:
  name: Düzlemsel Mühür
  description: "Boyutlararası mekânlara erişim sağlayan eşyalar dâhil, alana giriş veya çıkış yapan ışınlanma etkilerini ve düzlemsel seyahati etkisiz kılmaya çalışan görünür bir büyüsel bariyer yaratırsınız. Düzlemsel mühür alana bir yaratık çağırma yönündeki her türlü girişimi etkisiz kılmaya çalışır; ancak çağırma sona erdiğinde yaratığın ayrılmasını engellemez."

omen://spell/planar-servitor?source=paizo-pathfinder-player-core:
  name: Düzlemsel Hizmetkâr
  description: >
    Bir tanrıya (veya diğer ilahi güce) başvurarak tanrınızın seçtiği, seviyesi ritüelin büyü derecesinin iki katından fazla olmayan ilahi bir hizmetkâr şeklinde yardım talep edersiniz. İkincil büyü yapıcılar ne tür bir yardıma neden ihtiyacınız olduğunu açıklar; görev tanrıya inanılmaz derecede uygunsa GM ikincil Diplomasi testine durumsal bonus verebilir veya testin otomatik olarak kritik başarı olduğuna hükmedebilir. Ritüeli geçerli bir sebep olmaksızın kullanırsanız sonuç otomatik olarak kritik bir başarısızlıktır. Ritüel başarılı olursa görevin süresi ve tehlikesi gibi faktörlere bağlı olarak hizmetkâra bir ödeme teklif etmelisiniz. Ödeme her zaman en az yaratığın seviyesindeki tek kullanımlık bir eşya kadar tutar ve bir yaratığı yanınızda savaşmaya ikna etmek için genellikle yaratığın seviyesindeki kalıcı bir büyüsel eşya kadar tutar. Sunduğunuz adaklar tanrının kişisel beğenileriyle uyumlu olmalıdır. Alternatif olarak aynı seviye kısıtlamasıyla tanrının diyarında yaşayan ve şahsen tanıdığınız bir varlığın adını verebilirsiniz. Böyle bir yaratık ödeme olarak kişisel olarak istediği bir şeyi talep edebilir.

    Kritik Başarı Tanrı bir hizmetkâr gönderir ve hizmetkârın ödemesi normalin yalnızca yarısı kadar tutar. İsmen belirli bir hizmetkâr istediyseniz hizmetkâr meşgul olmadığı sürece tanrının o hizmetkârı göndermesi muhtemeldir.

    Başarı Tanrınız bir hizmetkâr gönderir.

    Başarısızlık Tanrınız bir hizmetkâr göndermez.

    Kritik Başarısızlık Tanrı gücenir ve tanrınızın doğasına bağlı olarak bir hoşnutsuzluk işareti, hatta belki de sizi azarlamak veya size saldırmak üzere bir hizmetkâr gönderir. Bir tanrı kefaret ödeyene kadar katılan takipçilerinin ilahi güçlerini ellerinden almayı da seçebilir.

omen://spell/planar-tether?source=paizo-pathfinder-player-core:
  name: Düzlemsel Bağ
  description: >
    Hedefi mevcut düzlemine dikersiniz. Hedef düzlemsel bağdan etkilendiği sürece büyü hedefi hareket ettirecek herhangi bir ışınlanma etkisini veya onu farklı bir düzleme nakledecek herhangi bir etkiyi etkisiz kılmaya çalışır. Düzlemsel bağın süresi hedefin İrade kurtarışıyla belirlenir.

    Kritik Başarı Hedef etkilenmez.

    Başarı Etkinin süresi 1 dakikadır.

    Başarısızlık Etkinin süresi 10 dakikadır.

    Kritik Başarısızlık Etkinin süresi 1 saattir.

omen://spell/plant-form?source=paizo-pathfinder-player-core:
  name: Bitki Formu
  description: >
    Yeşeren yaratıklardan ilham alarak Büyük boyutlu bir bitki savaş formuna dönüşürsünüz. Bu Büyüyü Yaptığınızda listelenen savaş formlarından birini seçin. Dönüşmek için benzer belirli bir bitkiyi ikame edebilirsiniz (örneğin sinekkapan yerine ibrik otu); ancak bunun formun Boyutu veya istatistikleri üzerinde bir etkisi yoktur. Bu formdayken bitki özelliğini kazanırsınız. Büyüyü Sonlandırabilirsiniz. Hangi savaş formunu seçerseniz seçin şu istatistikleri ve yetenekleri kazanırsınız: SD = 19 + seviyeniz. Zırhınızın test cezasını ve Hareket Hızı azaltmasını yok sayın. 12 geçici Can Puanı. Zehre karşı 10 direnç. Loşgörüşü. Seçtiğiniz savaş formuna özgü bir veya daha fazla silahsız yakın dövüş saldırısı; bunlar Vuruş Yapabileceğiniz yegâne saldırılardır. Bunlarda eğitimlisinizdir. Saldırı bonusunuz +17'dir ve hasar bonusunuz +11'dir. Bu saldırılar Kuvvet temellidir (örneğin Halsiz durumu açısından). Silahsız saldırı bonusunuz daha yüksekse onun yerine bunu kullanabilirsiniz. Kendi bonusunuz daha yüksek olmadığı sürece +19 Atletizm bonusu. Ayrıca seçtiğiniz bitki türüne göre belirli yetenekler kazanırsınız: Ağaçsı Hareket Hızı 30 fit; Yakın Dövüş 1 dal (erişim 15 fit), Hasar 2d10 ezici; Yakın Dövüş 1 ayak, Hasar 2d8 ezici; Bu formda konuşabilirsiniz. Sinekkapan Hareket Hızı 15 fit; Asite karşı 10 direnç; Yakın Dövüş 1 yaprak (erişim 10 fit), Hasar 2d8 delici ve bir vuruştan sonra hedefi Kavramak için bir eylem harcayabilirsiniz.

    Güçlendirilmiş (6.) Savaş formunuz Devasadır ve saldırılarınızın erişim mesafesi 5 fit artar. Bunun yerine SD = 22 + seviyeniz, 24 geçici CP, saldırı bonusu +21, hasar bonusu +16 ve Atletizm +22 kazanırsınız.

omen://spell/plant-growth?source=paizo-pathfinder-player-core:
  name: Bitki Gelişimi
  description: >
    Alan: Merkezinde sizin olduğunuz 1/2 mil yarıçaplı çember

    Alandaki bitkilerin daha sağlıklı ve daha verimli olmasını sağlarsınız. Sağlıklı bitkilerin diğer faydalarının yanı sıra bu durum başarınıza bağlı olarak çiftliklerdeki mahsul verimini artırır. Kurutma büyüsünün alanında yaparsanız bitki gelişimi olağan etkisini üretmek yerine kurutma büyüsünü etkisiz kılmaya çalışır.

    Kritik Başarı Alandaki mahsul verimini iki katına çıkarın veya alanı 1 mil yarıçapa genişletin.

    Başarı Alandaki mahsul verimini üçte bir oranında artırın.

    Başarısızlık Ritüelin hiçbir etkisi olmaz.

    Kritik Başarısızlık Alandaki bitki örtüsü GM tarafından belirlenen ancak genellikle gerçek arzularınıza olabildiğince tezat teşkil edecek beklenmedik bir şekilde değişir (örneğin onları zenginleştirmek isterken ekinlerin kuruması gibi).

omen://spell/possession?source=paizo-pathfinder-player-core:
  name: Ele Geçirme
  description: >
    Zihninizi ve ruhunuzu hedefin bedenine göndererek kontrolü ele geçirmeye çalışırsınız. Hedef bir İrade kurtarışı denemelidir. Hedef üzerinde daha az kontrol uygulamak isterseniz hedefin daha lehine olan herhangi bir başarı derecesinin etkilerini kullanmayı seçebilirsiniz. Bir hedefi ele geçirmiş durumdayken kendi bedeniniz Bilinçsizdir ve normal şekilde uyanamaz. Ele geçirilen hedefin yaptığı her şeyi hissedebilirsiniz. Bu büyüyü Sonlandırabilirsiniz. Ele geçirilen beden ölürse büyü sona erer ve büyü ZD'nize karşı bir Dayanıklılık kurtarışında başarılı olmalısınız, aksi takdirde 1 saat (kritik başarısızlıkta 24 saat) boyunca Felçli olursunuz. Büyü bir karşılaşma sırasında sona ererse ele geçirilen yaratığın inisiyatifinden hemen önce hareket edersiniz.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedefi ele geçirirsiniz ancak onu kontrol edemezsiniz. Büyü sürdüğü müddetçe bedende yalnızca yolculuk edersiniz.

    Başarısızlık Hedefi ele geçirir ve kısmi kontrolünü sağlarsınız. Artık ayrı bir turunuz olmaz; bunun yerine hedefi kontrol edebilirsiniz. Hedefin sıralarının her birinin başında hedef başka bir İrade kurtarışı dener. Başarısız olursa o sıra sizin tarafınızdan Kontrol Edilir; başarılı olursa kendi eylemlerini seçer; kritik başarılı olursa sizi dışarı atar ve büyü sona erer.

    Kritik Başarısızlık Hedefi tamamen ele geçirirsiniz ve onu bir kukla gibi manipüle ederken o yalnızca izleyebilir. Hedef sizin tarafınızdan kontrol edilir.

    Güçlendirilmiş (9.) Süre 10 dakikadır ve yaratığın bedenine fiziksel olarak girebilirsiniz, böylece büyü sürdüğü müddetçe fiziksel bedeniniz korunur.

omen://spell/precious-metals?source=paizo-pathfinder-player-core:
  name: Değerli Metaller
  description: >
    Tanrınız adi metalleri kutsayarak onları değerli maddelere dönüştürür. Hedefteki metal normal metalinden soğuk demir, bakır, altın, demir, gümüş veya çeliğe dönüşür. Büyünün derecesi 8. veya daha yüksekse seçeneklere adamantin ve şafakgümüşü de eklenir. Bir nesneyi bakır, altın veya gümüşe dönüştürürseniz Sertliği 1'e düşer. Aksi takdirde Sertliği daha düşükse 10'a yükseltilir. Bu şekilde dönüştürülen bir eşya yeni maddesine göre hasar verir. Örneğin soğuk demire dönüştürülmüş çelik bir kılıç, soğuk demire karşı zayıflığı olan bir yaratığa fazladan hasar verir. GM'in takdirine bağlı olarak yeni maddenin diğer etkilerine de sahip olabilir. Bu değişim belirgin biçimde büyüsel ve geçicidir, bu nedenle eşyanın parasal değeri değişmez; bakır sikkeleri altına dönüştürüp bir şey satın almak için kullanamazsınız.

    Güçlendirilmiş (+1) Nesnenin Sertliğini artırırsanız yeni Sertlik 2 daha yüksek olur.

omen://spell/prestidigitation?source=paizo-pathfinder-player-core:
  name: Hokkabazlık
  description: >
    En basit büyü emirlerinizi yerine getirir. Büyüyü Sürdürdüğünüz müddetçe basit büyüsel etkiler gerçekleştirebilirsiniz. Büyüyü her Sürdürdüğünüzde şu dört seçenekten birini seçebilirsiniz.

    Pişir Canlı olmayan 1 libre malzemeyi soğutun, ısıtın veya tatlandırın.

    Kaldır Sahipsiz ve hafif ya da daha az Yüke sahip bir nesneyi yerden 1 fit yavaşça kaldırın.

    Yap Pıhtılaşmış büyü maddesinden yapılmış, ihmal edilebilir Yükte geçici bir nesne yaratın. Nesne kaba ve yapay görünür, son derece kırılgandır; bir alet, silah ya da bir büyünün odağı veya maliyeti olarak kullanılamaz.

    Düzelt Hafif ya da daha az Yüke sahip bir nesneyi renklendirin, temizleyin veya kirletin. 10 tur konsantrasyonla 1 Yüklük bir nesneyi, Yük başına 1 dakika harcayarak daha büyük bir nesneyi etkileyebilirsiniz.

    Hokkabazlık hasar veremez veya olumsuz durumlara yol açamaz. Bir nesnede meydana gelen herhangi bir gerçek değişiklik (yukarıda belirtilenlerin ötesinde) yalnızca siz büyüyü Sürdürdüğünüz sürece devam eder.

omen://spell/primal-call?source=paizo-pathfinder-player-core:
  name: İlksel Çağrı
  description: Bir peri halkası oluşturmanız ve 100 mil içerisinden bir hayvan, canavar, peri, mantar veya bitki çağırmanız haricinde Düzlemsel Hizmetkâr gibi işlev görür.

omen://spell/primal-summons?source=paizo-pathfinder-player-core:
  name: Doğa Çağrısı
  description: >
    Çağrılan bir yaratığı elementlerin gücüyle güçlendirirsiniz. Bir sonraki eyleminiz Hayvan Çağır veya Bitki veya Mantar Çağır büyülerinden birini yapmaksa hava, toprak, ateş, metal, su veya tahta seçeneklerinden birini seçin; çağırdığınız yaratık buna karşılık gelen yetenekleri kazanır.

    Hava Yaratık 60 fitlik bir uçma Hareket Hızı kazanır.

    Toprak Yaratık 20 fitlik bir kazma Hareket Hızı kazanır, kara Hareket Hızını 10 fit azaltır (en az 5 fit) ve fiziksel hasara karşı 5 direnç kazanır.

    Ateş Yaratığın Vuruşları fazladan 1d6 ateş hasarı verir ve ateşe karşı 10 direnç ile soğuk ve suya karşı 5 zaaf kazanır.

    Metal Yaratığın Vuruşları fazladan 1d6 elektrik hasarı verir ve elektriğe karşı 5 direnç kazanır.

    Su Yaratık 60 fitlik bir yüzme Hareket Hızı kazanır, yakın dövüş saldırısından sonra bir İtme denemek için 1 eylem harcayabilir (çoklu saldırı cezasını yok sayarak) ve ateşe karşı 5 direnç kazanır.

    Tahta Yaratık 30 fitlik bir tırmanma Hareket Hızı ile ezici ve delici hasara karşı 2 direnç kazanır.

omen://spell/project-image?source=paizo-pathfinder-player-core:
  name: Suret Yansıt
  description: >
    Kendinizin yanılsamadan bir görüntüsünü yansıtırsınız. Görüntünün menzili içinde kalmalısınız ve herhangi bir anda görüntüyü göremezseniz büyü sona erer. Alanı yayılım olan bir büyü dışında bir Büyü Yaptığınız her seferde büyü etkisinin kendinizden veya görüntüden kaynaklanmasını sağlayabilirsiniz. Görüntü bir yanılsama olduğu için büyülerden yararlanamaz; ancak büyünün görsel tezahürleri belirir. Görüntü sizinle aynı Savunma Değeri'ne ve kurtarışlara sahiptir. Bir saldırıyla vurulursa veya bir kurtarışta başarısız olursa büyü sona erer.

    Güçlendirilmiş (+2) Büyüyü Sürdürebileceğiniz azami süre 10 dakikaya çıkar.

omen://spell/protection?source=paizo-pathfinder-player-core:
  name: Koruma
  description: >
    Bir yaratığı zarara karşı koruma altına alırsınız. Hedef Savunma Değeri'ne ve kurtarışlara +1 statü bonusu kazanır.

    Güçlendirilmiş (3.) Faydaların hedefin etrafındaki bir yayılma alanında bulunan tüm müttefiklerinizi de etkilemesini seçebilirsiniz.

omen://spell/protective-wards?source=paizo-pathfinder-player-core:
  name: Koruyucu Muhafazalar
  description: Müttefiklerinizi koruyan bir glif halkasını genişletirsiniz. Siz ve alandaki tüm müttefikler Savunma Değeri'ne +1 statü bonusu kazanırsınız. Büyüyü her Sürdürdüğünüzde yayılımın yarıçapı en fazla 30 fit olmak üzere 5 fit artar.

omen://spell/protectors-sacrifice?source=paizo-pathfinder-player-core:
  name: Koruyucunun Fedakârlığı
  description: >
    Tetikleyici: 30 fit içindeki bir müttefik hasar alır.

    Onun yerine acı çekerek müttefikinizi korursunuz. Tetikleyici müttefikin alacağı hasarı 3 azaltın. Bu hasarı kendinize yönlendirirsiniz; ancak bağışıklıklarınız, zaaflarınız, dirençleriniz vb. geçerli olmaz. Müttefikinize hasar veren şeyin hiçbir durumuna veya diğer etkilerine (örneğin zehirli bir ısırıktan gelen zehir) maruz kalmazsınız. Tetikleyici hasarın tamamını kendinize yönlendirseniz bile müttefikiniz bu etkilere yine de maruz kalır.

    Güçlendirilmiş (+1) Yönlendirdiğiniz hasar 3 artar.

omen://spell/protectors-sphere?source=paizo-pathfinder-player-core:
  name: Koruyucunun Küresi
  description: >
    Sizden koruyucu bir aura yayılarak sizi ve müttefiklerinizi güvenceye alır. Tüm hasarlara karşı 3 direnç kazanırsınız. Müttefikleriniz de alanda bulundukları sürece bu direnci kazanırlar.

    Güçlendirilmiş (+1) Direnç 1 artar.

omen://spell/pulse-of-civilization?source=paizo-pathfinder-player-core:
  name: Uygarlığın Nabzı
  description: >
    Menzil içindeki tüm yerleşimlerin ruhuna nüfuz edersiniz. Yerleşimlerin isimlerini öğrenirsiniz. Bu yerleşimler hakkında Bilgi Hatırla veya bu yerleşimlerde veya yerleşimler hakkında Bilgi Topla için yapılan tüm İlim testlerinde +2 statü bonusu kazanırsınız ve eğitimsiz olsanız bile seviyenizi yetkinlik bonusunuz olarak kullanırsınız. Büyüyü Yaptığınızda yerleşimlerden biri hakkında onun İlim becerisini (örneğin Absalom İlimi) kullanarak bu bonustan faydalanacak şekilde anında Bilgi Hatırlayabilirsiniz. Uygarlığın nabzı büyüsünü tekrar yaparsanız önceki yapılışı sona erer.

    Güçlendirilmiş (5.) Menzil 100 mildir.

    Güçlendirilmiş (7.) Menzil 500 mildir ve bonus +3'tür.

omen://spell/pummeling-rubble?source=paizo-pathfinder-player-core:
  name: Dövücü Moloz
  description: >
    Önünüzdeki havada ağır kayalardan oluşan bir yayılım uçar. Moloz alandaki her yaratığa 2d4 ezici hasar verir. Her yaratık bir Refleks kurtarışı denemelidir.

    Kritik Başarı Yaratık etkilenmez.

    Başarı Yaratık yarı hasar alır.

    Başarısızlık Yaratık tam hasar alır ve sizden 5 fit uzağa itilir.

    Kritik Başarısızlık Yaratık iki kat hasar alır ve sizden 10 fit uzağa itilir.

    Güçlendirilmiş (+1) Hasarı 2d4 artırın.

omen://spell/punishing-winds?source=paizo-pathfinder-player-core:
  name: Cezalandırıcı Rüzgârlar
  description: >
    Alan (devamı): 30 fit yarıçaplı, 100 fit yüksekliğinde silindir

    Şiddetli rüzgârlar ve güçlü bir aşağı yönlü hava akımı alanı doldurarak bir siklon oluşturur. Alandaki tüm uçan yaratıklar 40 fit alçalır. Alanın tamamı Uçan yaratıklar için büyük zorlu arazi, yerdeki veya Tırmanan yaratıklar için zorlu arazidir. Turunu alan içinde Uçarak bitiren herhangi bir yaratık 20 fit alçalır. Bu büyünün rüzgârları tarafından bir yüzeye itilen herhangi bir yaratık sanki düşmüş gibi ezici hasar alır. Silindirin dış dikey kenarlarındaki kareler yaratıkların çıkmasını engeller. Bu kareler büyük zorlu arazidir ve aradan geçmeye çalışan bir yaratık geçebilmek için büyü ZD'nize karşı bir Atletizm testinde veya Uçuşta Manevra için Akrobasi testinde başarılı olmalıdır. Başarısız olan yaratık mevcut eylemini sonlandırır ancak tekrar deneyebilir.

omen://spell/pushing-gust?source=paizo-pathfinder-player-core:
  name: İtici Rüzgâr
  description: >
    Havayı iterek hedefi güçlü bir rüzgâr dalgasıyla sarsarsınız; hedef bir Dayanıklılık kurtarışı denemelidir.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef sizden 5 fit uzağa itilir.

    Başarısızlık Hedef sizden 10 fit uzağa itilir.

    Kritik Başarısızlık Hedef sizden 10 fit uzağa itilir ve Yüzüstü devrilir.

omen://spell/quandary?source=paizo-pathfinder-player-core:
  name: Çıkmaz
  description: >
    Hedefi gizemli bir kökene sahip düzlemdışı bir bulmaca odasına naklederek oraya kilitlersiniz. Hedef her tur bir kez tek bir eylem olarak bulmacayı çözmek için büyü ZD'nize karşı bir Okültizm testi, Dikkat testi veya Hırsızlık testi deneyebilir. Düzlemlerarası Işınlanma gibi düzlemleri de aşamadıkları sürece ışınlanma etkileri hedefi bulmaca odasının dışına taşıyamaz. Büyü sona erdiğinde hedef sürüldüğünde işgal ettiği alana veya orijinal alan artık doluysa en yakın alana geri döner.

    Kritik Başarı Hedef bulmacayı çözer ve kaçar.

    Başarı Hedef çözüme giden doğru yoldadır. Zaten doğru yoldaysa bulmacayı çözer ve kaçar.

    Başarısızlık Hedef çözüme doğru hiçbir ilerleme kaydedemez.

    Kritik Başarısızlık Hedef hiçbir ilerleme kaydedemez ve eğer doğru yoldaysa artık doğru yolda değildir.

omen://spell/raise-dead?source=paizo-pathfinder-player-core:
  name: Ölü Uyandır
  description: >
    Yaratığın bedeninin mevcut ve nispeten sağlam olmasını gerektirecek şekilde ölü yaratığın ruhunu çağırmaya çalışırsınız. Yaratık son 3 gün içinde ölmüş olmalıdır. Pharasma yaratığın vaktinin geldiğine karar vermişse (GM'in takdirine bağlı olarak) veya yaratık hayata dönmek istemiyorsa bu büyü otomatik olarak başarısız olur; ancak büyü yapımında maliyet tüketilmez. Büyü başarılı olursa yaratık 1 Can Puanı ile, hiçbir büyü hazırlanmamış veya büyü slotu mevcut olmadan, hiçbir havuzunda puan veya başka günlük kaynaklar olmadan ve eski bedenindeki uzun vadeli zayıflıklar hâlâ devam ederek hayata döner. Boneyard'da geçirilen süre hedefi geçici olarak içi çekilmiş bırakarak onu 1 hafta boyunca Sakar 2, İçi Çekilmiş 2 ve Halsiz 2 yapar; bu durumlar hafta geçene kadar hiçbir şekilde kaldırılamaz veya azaltılamaz. Yaratık ayrıca öbür dünyada geçirdiği zaman nedeniyle hafif bir kişilik değişimi, saçta beyaz bir tutam veya garip yeni bir doğum lekesi gibi kalıcı olarak değişir.

    Güçlendirilmiş (7.) Hedefin azami seviyesi 15'e çıkar. Maliyet hedefin seviyesi (en az 1) × 400 gp'ye yükselir.

    Güçlendirilmiş (8.) Hedefin azami seviyesi 17'ye çıkar. Maliyet hedefin seviyesi (en az 1) × 800 gp'ye yükselir.

    Güçlendirilmiş (9.) Hedefin azami seviyesi 19'a çıkar. Maliyet hedefin seviyesi (en az 1) × 1.600 gp'ye yükselir.

    Güçlendirilmiş (10.) Hedefin azami seviyesi 21'e çıkar. Maliyet hedefin seviyesi (en az 1) × 3.200 gp'ye yükselir.

omen://spell/rallying-anthem?source=paizo-pathfinder-player-core:
  name: Toplanma Marşı
  description: Şarkınız müttefikleri kendilerini daha etkili bir şekilde korumaya teşvik eder. Siz ve alandaki tüm müttefikler Savunma Değeri'ne ve kurtarışlara +1 statü bonusunun yanı sıra fiziksel hasara karşı büyünün derecesinin yarısına eşit direnç kazanırsınız.

omen://spell/rangers-bramble?source=paizo-pathfinder-player-core:
  name: Kolcunun Çalılığı
  description: "Alandaki bitkilerin Dolaşık Bitki Örtüsü etkileriyle düşmanlarınızı sarmasını sağlarsınız. Kurtarışta kritik başarısız olan bir yaratık, Hareketsiz Kılınmaya ek olarak (max(0,spell rank -1))d4[bleed] hasar alır. Çalılığınızdan Kurtulmak kanama hasarını sona erdirmez. Güçlendirilmiş (+1) Kritik başarısızlıktaki kanama hasarı 1d4 artar."

omen://spell/read-aura?source=paizo-pathfinder-player-core:
  name: Aura Oku
  description: >
    Hedef nesneye odaklanarak zihninizi büyüsel auraları algılamaya açarsınız. Büyü yapımı tamamlandığında o eşyanın büyülü olup olmadığını bilirsiniz. Siz veya aura hakkında tavsiyede bulunduğunuz herhangi biri o eşya üzerinde Büyüyü Tanı için +2 durumsal bonus kazanır. Nesne hayaliyse bunu yalnızca etkinin derecesi aura oku büyünüzün derecesinden düşükse tespit edersiniz.

    Güçlendirilmiş (3.) En fazla 10 nesneyi hedef alabilirsiniz.

    Güçlendirilmiş (6.) İstediğiniz sayıda nesneyi hedef alabilirsiniz.

omen://spell/read-fate?source=paizo-pathfinder-player-core:
  name: Kader Oku
  description: "Kısa vadede hedefin kaderi hakkında daha fazla bilgi edinmeye çalışırsınız; bu çoğu sıradan yaratık için genellikle sonraki bir gün içinde, aktif olarak maceraya atılan biri gibi çok sayıda hızlı deneyim yaşaması muhtemel biri içinse sonraki bir saat veya daha kısa süre içindedir. Bu zaman diliminde yaratığın kaderiyle bağlantılı tek bir esrarengiz kelime öğrenirsiniz. Kader fazlasıyla anlaşılmazdır ve bu kelimenin mutlaka lafzıyla anlaşılması gerekmez, dolayısıyla anlamı genellikle ancak sonradan açıklık kazanır. GM gizli bir flat|dc:6|traits:secret atar. Yaratığın kaderi çok belirsizse veya başarısız bir düz zarda büyü \"sonuçsuz\" kelimesini verir. Her iki durumda da yaratık ardından 24 saat boyunca geçici olarak bağışık olur."

omen://spell/read-omens?source=paizo-pathfinder-player-core:
  name: Kehanet Oku
  description: Geleceğe göz atarsınız. 1 hafta içinde girişmeyi planladığınız belirli bir hedef veya faaliyeti ya da 1 hafta içinde gerçekleşmesini beklediğiniz bir olayı seçin. Seçilen olayda yardımcı olabilecek, genellikle bir tekerleme veya alamet biçiminde gizemli bir ipucu ya da tavsiye öğrenirsiniz.

omen://spell/rebuke-death?source=paizo-pathfinder-player-core:
  name: Ölümü Azarla
  description: >
    Yaratıkları ölümün pençesinden çekip alarak tipik bir ölümden dönmenin yıpratıcılığı olmaksızın onları iyileştirirsiniz. Bu Büyüyü Yaparken 1 ila 3 eylem harcayabilirsiniz ve harcanan eylemlere eşit sayıda yaratığı hedef alabilirsiniz. Her hedef 3d6 Can Puanı geri kazanır. Hedef Ölmekte durumuna sahip idiyse bu iyileşme nedeniyle Ölmekte durumundan geri dönmek onun Yaralı durumunu artırmaz.

    Güçlendirilmiş (+1) İyileşmeyi 1d6 artırın.

omen://spell/regenerate?source=paizo-pathfinder-player-core:
  name: Rejenerasyon
  description: >
    Yaşamsal enerji aşılaması bir yaratığa sürekli iyileşme sağlar. Hedef sıralarının her birinin başında ona 15 Can Puanı yenileyen rejenerasyon 15'i geçici olarak kazanır. Rejenerasyona sahipken hedef Can Puanı hasarı almaktan ölemez ve Ölmekte durumu onu öldürecek bir değere yükselemez (bu durum çoğu yaratığın ölmekte durumunu ölmekte 3'te durdurur); ancak Yaralı değeri 4 veya daha yüksek olursa yaraları tedavi edilene kadar Bilinçsiz kalır. Hedef asit veya ateş hasarı alırsa rejenerasyonu bir sonraki sırasının sonrasına kadar devre dışı kalır. Yaratık rejenerasyondan her Can Puanı kazandığında ayrıca hasar görmüş veya harap olmuş bir organını (varsa) yeniden büyütür. Büyünün süresi boyunca yaratık kopmuş uzuvları koptuğu yere tutmak için bir Etkileşime Gir eylemi harcayarak onları yeniden tutturabilir.

    Güçlendirilmiş (9.) Rejenerasyon 20'ye çıkar.

omen://spell/remake?source=paizo-pathfinder-player-core:
  name: Yeniden İmal Et
  description: "Nesne yok edilmiş olsa bile onu yoktan tamamen yeniden yaratırsınız. Bunu yapmak için nesneyi zihninizde canlandırabilmelisiniz. Ek olarak materyal bileşeni ne kadar küçük veya önemsiz olursa olsun eşyadan geriye kalan bir kalıntı olmalıdır (Kül Et büyüsünden geriye kalan bir toz zerresi bile yeterlidir). Hayal gücünüz aşırı tahmine dayandıysa; nesne 5 fitlik bir küpe sığmayacak kadar büyükse; nesne hâlâ varlığını sürdürüyor ve siz sadece bunun farkında değilseniz; veya nesne bir yadigar ise, 20'nin üzerinde bir seviyeye ya da benzer muazzam bir büyü gücüne sahipse büyü başarısız olur. Eşya kusursuz durumda yeniden bir araya gelir. Zihinsel imgeniz hasarlı veya yıpranmış bir nesneye ait olsa bile yenisi bu mükemmelleştirilmiş formdadır. Nesne büyülüyse bu büyü genellikle onun sürekli büyüsel özelliklerini geri yükler; ancak yükler veya tek kullanımlık haklar gibi geçici özellikleri geri yüklemez. Günlük kullanımlara veya yüklere sahip bir eşya yeniden yapıldığında tüm kullanımları tükenmiş olur, ancak bundan sonra onları normal şekilde yeniler."

omen://spell/repulsion?source=paizo-pathfinder-player-core:
  name: İtme Halesi
  description: >
    Yaratıkların size yaklaşmasını engelleyen bir aura tezahür ettirirsiniz. Büyüyü yaparken alanı 40 fite kadar dilediğiniz yarıçapta ayarlayabilirsiniz. Büyüyü Yaptığınızda alanın içinde olan veya büyü yürürlükteyken alana giren bir yaratık bir İrade kurtarışı denemelidir. Bir yaratık kurtarışı denedikten sonra itme halesinin o yapılışı için aynı sonucu kullanır. Bir yaratığın hareketine yönelik kısıtlamalar yalnızca gönüllü olarak size doğru hareket ettiğinde geçerlidir. Örneğin bir yaratığa yaklaşırsanız onun uzaklaşması gerekmez.

    Kritik Başarı Yaratığın hareketi kısıtlanmaz.

    Başarı Yaratık size yaklaşırken alandaki her kareyi zorlu arazi sayar.

    Başarısızlık Yaratık alan içinde size daha fazla yaklaşamaz.

omen://spell/resist-energy?source=paizo-pathfinder-player-core:
  name: Enerji Direnci
  description: >
    Element enerjisinden bir kalkan, bir yaratığı bir enerji hasarı türüne karşı korur. Asit, soğuk, elektrik, ateş veya sonik hasarı seçin. Hedef ve donanımı seçtiğiniz hasar türüne karşı 5 direnç kazanır.

    Güçlendirilmiş (4.) Direnç 10'a çıkar ve en fazla iki yaratığı hedef alabilirsiniz.

    Güçlendirilmiş (7.) Direnç 15'e çıkar ve en fazla beş yaratığı hedef alabilirsiniz.

omen://spell/restorative-moment?source=paizo-pathfinder-player-core:
  name: İyileşme Anı
  description: Haminiz hedefin etrafında zamanın ipliklerini dokuyarak ona bir günün geçişinin bazı faydalarını sunar. Hedef sahip olduğu herhangi bir Lanetlenmiş ve İçi Çekilmiş durumunun değerini 1 azaltır ve evre uzunluğu 1 gün veya daha az olan her bir illetine karşı derhal bir kurtarış deneyebilir. Hedef ardından 1 gün boyunca geçici olarak bağışık olur.

omen://spell/resurrect?source=paizo-pathfinder-player-core:
  name: Dirilt
  description: >
    Hedefin ruhunu çağırmaya ve onu bedenine döndürmeye çalışırsınız. Bu durum hedefin bedeninin mevcut ve nispeten sağlam olmasını gerektirir. Hedef son bir yıl içinde ölmüş olmalıdır. Pharasma hedefin vaktinin geldiğine karar vermişse veya hedef geri dönmek istemiyorsa bu ritüel otomatik olarak başarısız olur; ancak bunu başarılı Din testinden sonra fark edersiniz ve maliyeti ödemeden ritüeli sonlandırabilirsiniz.

    Kritik Başarı Hedefi diriltirsiniz. Tam Can Puanı ile, öldüklerinde sahip oldukları aynı hazırlanmış büyüler ve havuzlarındaki puanlarla, eski bedenlerinin uzun süreli zayıflıklarını hâlâ çekerek hayata dönerler. Hedef dirilme sırasında tanrısının kendilerine ilham veren bir temsilcisiyle karşılaşır ve bu durum onlara 1 hafta boyunca saldırı zarlarına, Dikkate, kurtarışlara ve beceri testlerine +1 statü bonusu kazandırır. Hedef ayrıca öbür dünyada geçirdiği zaman nedeniyle hafif bir kişilik değişimi, saçta beyaz bir tutam veya garip yeni bir doğum lekesi edinmek gibi bir şekilde kalıcı olarak değişir.

    Başarı Kritik başarı gibi; ancak hedef 1 Can Puanı ile, hazırlanmış büyüleri veya herhangi bir havuzunda puanı olmadan ve eski bedenin uzun vadeli zayıflıklarından hâlâ etkilenerek hayata döner. Karakterin Boneyard'da geçirdiği zaman onlara ilham vermek yerine onları geçici olarak içi çekilmiş bırakmıştır. Hedef 1 hafta boyunca Sakar 1, İçi Çekilmiş 1 ve Halsiz 1 olur; bu durumlar hafta geçene kadar hiçbir şekilde kaldırılamaz veya azaltılamaz.

    Başarısızlık Denemeniz başarısız olur.

    Kritik Başarısızlık Korkunç bir şeyler ters gider; bedeni kötücül bir ruh ele geçirir, beden özel bir tür hortlağa dönüşür veya hedefin başına daha da kötü bir kader gelir.

    Güçlendirilmiş (6.) 12. seviyeye kadar bir hedefi diriltebilirsiniz ve temel maliyet 125 gp'dir.

    Güçlendirilmiş (7.) Dirilt ritüelini bedenin yalnızca küçük bir parçasıyla bile kullanabilirsiniz; ritüel bir başarıda veya kritik başarıda yeni bir beden yaratır. Hedef son on yıl içinde ölmüş olmalıdır. Ritüel her biri en az hedefin seviyesinin yarısı seviyede olması gereken dört ikincil büyü yapıcı gerektirir. Hedef 14. seviyeye kadar olabilir ve temel maliyet 200 gp'dir.

    Güçlendirilmiş (8.) 7. derece gibi; ancak hedef 16. seviyeye kadar olabilir ve temel maliyet 300 gp'dir.

    Güçlendirilmiş (9.) Hedefin adını bildiğiniz ve herhangi bir zamanda bedeninin bir parçasına dokunmuş olduğunuz sürece dirilt ritüelini beden olmadan bile kullanabilirsiniz. Hedef son yüzyıl içinde ölmüş olmalıdır ve bir başarıda olumsuz durumları kazanmaz. Ritüel her biri en az hedefin seviyesinin yarısı seviyede olması gereken sekiz ikincil büyü yapıcı gerektirir. Hedef 18. seviyeye kadar olabilir ve temel maliyet 600 gp'dir.

    Güçlendirilmiş (10.) 9. derece gibi; ancak hedefin ne kadar süre önce öldüğü fark etmez. Ritüel her biri en az hedefin seviyesinin yarısı seviyede olması gereken 16 ikincil büyü yapıcı gerektirir. Hedef 20. seviyeye kadar olabilir ve ritüelin temel maliyeti 1.000 gp'dir.

omen://spell/retributive-pain?source=paizo-pathfinder-player-core:
  name: Cezalandırıcı Acı
  description: >
    Tetikleyici: Menzil içindeki bir yaratık size hasar verir.

    İntikam duygusuyla acınızı size eziyet edene yansıtırsınız. Hedef tetikleyici hasarın yarısına eşit zihinsel hasar alır.

omen://spell/retrocognition?source=paizo-pathfinder-player-core:
  name: Geçmişi Görme
  description: >
    Zihninizi zihinsel yankılara açarak mevcut konumunuzda meydana gelmiş geçmiş olaylardan izlenimler edinirsiniz. Geçmişi görme sürenin ilk dakikası boyunca son bir gün içinde meydana gelen olaylardan psişik izlenimleri, sonraki dakikada bir önceki günün izlenimlerini vb. açığa çıkarır. Bu yankılar bir görü gibi canlanmaz; bunun yerine geçmişe dair gizemli ipuçları ve ayrıntılar sağlayan duygu ve metafor izlenimlerini ortaya koyar. Bir izlenim aracılığıyla travmatik veya çalkantılı bir olaya tanık olursanız olayın ciddiyetine bağlı olarak en az 30 ve muhtemelen 50'ye kadar varan bir ZD ile bir İrade kurtarışında başarılı olmadığınız sürece büyü sona erer. GM bir olayın travmatik olup olmadığını belirler ve ZD'yi seçer.

    Güçlendirilmiş (8.) Önceki gün yerine konsantre olduğunuz her dakika için bir önceki yıl boyunca meydana gelen olayların izlenimlerini edinirsiniz; ancak ayrıntılar azalır ve en önemli olaylar dışındaki tüm izlenimleri ayırt etmeyi zorlaştırır.

    Güçlendirilmiş (9.) Önceki gün yerine konsantre olduğunuz her dakika için bir önceki yüzyıl boyunca meydana gelen olayların izlenimlerini edinirsiniz; ancak ayrıntılar azalır ve en önemli olaylar dışındaki tüm izlenimleri ayırt etmeyi neredeyse imkânsız kılar.

omen://spell/revealing-light?source=paizo-pathfinder-player-core:
  name: Açığa Çıkaran Işık
  description: >
    Büyüsel bir ışık dalgası alanı kaplar. Renkli, ısısız alevler veya parıldayan zerrecikler gibi ışığın görünümünü siz seçersiniz. Açığa çıkaran ışıktan etkilenen bir yaratık Gözü Kamaşmış olur. Yaratık Görünmez idiyse bunun yerine Belirsiz olur. Yaratık başka bir nedenden ötürü zaten belirsiz idiyse artık belirsiz değildir.

    Kritik Başarı Hedef etkilenmez.

    Başarı Işık yaratığı 2 tur boyunca etkiler.

    Başarısızlık Işık yaratığı 1 dakika boyunca etkiler.

    Kritik Başarısızlık Işık yaratığı 10 dakika boyunca etkiler.

omen://spell/revival?source=paizo-pathfinder-player-core:
  name: Canlandırma
  description: İyileştirici enerjinin infilakı yaşayan yaratıkları yatıştırır ve yakın zamanda katledilenleri geçici olarak diriltir. Yaşayan tüm hedefler 10d8+40 Can Puanı geri kazanır. Buna ek olarak dilediğiniz sayıda ölü hedefi Ölü Uyandır ile aynı etkiler ve sınırlamalarla geçici olarak hayata döndürürsünüz. Diriltilen yaratıklar yaşayan yaratıklara verdiğiniz Can Puanına eşit miktarda geçici Can Puanına sahip olurlar, ancak normal Can Puanına sahip olmazlar. Diriltilen yaratıklar Can Puanı yenileyemez veya başka yollarla geçici Can Puanı kazanamazlar ve canlandırmanın süresi sona erdiğinde tüm geçici Can Puanlarını kaybedip ölürler. Canlandırma, Kül Et veya bir ölüm etkisiyle öldürülen yaratıkları diriltemez. Hortlaklar üzerinde hiçbir etkisi yoktur.

omen://spell/rewrite-memory?source=paizo-pathfinder-player-core:
  name: Belleği Yeniden Yaz
  description: >
    Bir anıyı silerek, bir anının netliğini artırarak, bir anıyı değiştirerek veya sahte bir anı ekleyerek hedefin anılarını değiştirirsiniz. Hedef büyüye direnmek için bir İrade kurtarışı deneyebilir.

    Kritik Başarı Hedef etkilenmez ve onun anısını değiştirmeye çalıştığınızı fark eder.

    Başarı Hedef etkilenmez ancak büyüyü tanımlamadığı sürece büyünüzün belleği yeniden yaz yerine zararsız bir şey olduğunu düşünür.

    Başarısızlık Büyü süresinin ilk 5 dakikası boyunca her tur bir kez bir anıyı değiştirmek için büyüyü Sürdürebilirsiniz. Bunu yaptığınızda en fazla 5 kesintisiz dakikalık anıya kadar değiştirmek üzere 6 saniyeye kadar anıyı hayal edersiniz. Değiştirdiğiniz anılar büyü aktif olduğu müddetçe değişmiş olarak kalır. 5 dakika dolmadan önce hedef menzil dışına çıkarsa başka anıları değiştiremezsiniz.

    Güçlendirilmiş (6.) 50 kelime veya daha kısa bir şekilde ayrıntılandırılan belirli bir konudaki tüm anıları bastırmak için Büyüyü istekli bir hedef üzerinde Yapabilirsiniz. Bu etki kalıcıdır ve bu boşlukları belirsiz bir pus ile kapatır.

omen://spell/ring-of-truth?source=paizo-pathfinder-player-core:
  name: Hakikat Çemberi
  description: >
    Yalanların açığa çıkarıldığı bir alan belirlersiniz. Alandaki yaratıklar ayrıca Aldatma testlerine –2 statü cezası alırlar. Alandaki bir yaratık her doğru ifade söylediğinde alanda hafif bir çan sesi duyulur. Yaratıklar büyünün farkındadır; bu nedenle normalde yalanla yanıtlayacakları soruları yanıtlamaktan kaçınabilirler veya hakikatin sınırları içinde kaldıkları sürece kaçamak cevaplar verebilirler. Büyü yapıldığında bir yaratık alandaysa veya sonradan alana girerse o yaratık bir İrade kurtarışı dener. Alandan çıkıp tekrar girerse bu ilk kurtarışın sonuçlarını kullanır.

    Kritik Başarı Hedef o kadar ikna edicidir ki yalan söylese bile çan çalar.

    Başarı Hedef yalan söyler ve tüm hedeflere karşı Aldatma testinde başarılı olursa çan yine de çalar.

    Başarısızlık Çan onların aldatmacasını doğru bir şekilde anlar ve yalan söylerlerse asla çalmaz.

omen://spell/rune-of-observation?source=paizo-pathfinder-player-core:
  name: Gözlem Rünü
  description: "Havaya göz şeklinde görünmez bir rün çizerek Durugörü büyüsündeki gibi bir algılayıcı yaratırsınız. Yaratıldığında bu göz görüş hattınızda olmalıdır. Büyünün süresi her bittiğinde süreyi bir saat daha uzatmak için serbest eylem olarak 1 Odak Puanı harcayabilirsiniz; ancak normal olduğu üzere bir sonraki günlük hazırlıklarınız sırasında derhal sona erer."

omen://spell/rune-trap?source=paizo-pathfinder-player-core:
  name: Rün Tuzağı
  description: >
    Düşmanca bir büyüyü bir rüne bağlayarak büyüsel bir tuzak yaratırsınız. Bu ritüeli gerçekleştirmenin bir parçası olarak rün içinde depolamak üzere bir Büyü de Yaparsınız. Depolanan büyü yapmak için 3 veya daha az eylem gerektirmeli, düşmanca bir etkiye sahip olmalı ve bir yaratığı hedef almalı ya da bir alana sahip olmalıdır. Rün için bir parola, bir tetikleyici veya her ikisini birden belirleyebilirsiniz. Parolayı söylemeyen veya tetikleyiciyle eşleşen, hedef muhafazayı hareket ettiren, açan ya da ona dokunan veya hedef alana giren herhangi bir yaratık rünü etkinleştirerek içindeki zararlı büyüyü serbest bırakır. Bir büyü rün içine depolandığında rün o büyünün tüm özelliklerini kazanır. Depolanan büyü bir veya daha fazla yaratığı hedef alıyorsa rünü tetikleyen yaratığı hedefler. Bir alana sahipse bu alan rünü tetikleyen yaratığın üzerinde merkezlenir. Rün büyüsel bir tuzaktır; onu fark etmek için gereken Dikkat testi ve onu devre dışı bırakmak için gereken Hırsızlık testi için büyü ZD'nizi kullanır; her iki test de deneyen yaratığın başarılı olabilmesi için eğitimli olmasını gerektirir. Bu ritüelle yarattığınız rünü görebildiğiniz sürece Sonlandırabilirsiniz.

    Kritik Başarı Rünü fark etme ve devre dışı bırakma ZD'sine +2 durumsal bonus kazandıran özellikle etkili bir rün yaratırsınız.

    Başarı Rünü başarıyla yaratırsınız.

    Başarısızlık Rünü yaratmakta başarısız olursunuz.

    Kritik Başarısızlık Rün geri teper; size, ikincil büyü yapıcıya ve ritüel alanının 10 fiti içindeki tüm yaratıklara rünün büyüsünün derecesi başına 4d6 kuvvet hasarı verir.

omen://spell/runic-body?source=paizo-pathfinder-player-core:
  name: Rünik Beden
  description: >
    Hedefin bedeninde parıldayan rünler belirir. Tüm silahsız saldırıları +1 hasar zarı rününe sahip silahsız saldırı hâline gelir; saldırı zarlarına +1 eşya bonusu kazanır ve hasar zarlarının sayısı ikiye çıkar.

    Güçlendirilmiş (6.) Silahsız saldırılar +2 büyük hasar zarı rünü olur.

    Güçlendirilmiş (9.) Silahsız saldırılar +3 yüce hasar zarı rünü olur.

omen://spell/runic-weapon?source=paizo-pathfinder-player-core:
  name: Rünik Silah
  description: >
    Silahın boylu boyunca geçici rünler kazınırken silah büyüyle parıldar. Hedef +1 hasar zarı rününe sahip bir silaha dönüşür; saldırı zarlarına +1 eşya bonusu kazanır ve silah hasar zarlarının sayısı ikiye çıkar.

    Güçlendirilmiş (6.) Silah +2 büyük hasar zarı rünü olur.

    Güçlendirilmiş (9.) Silah +3 yüce hasar zarı rünü olur.

omen://spell/safe-passage?source=paizo-pathfinder-player-core:
  name: Güvenli Geçiş
  description: >
    Alan: 10 fit genişliğinde, 10 fit yüksekliğinde, 60 fit uzunluğunda arazi kesiti

    Alandan geçişi kısa bir süreliğine güvenli hâle getirirsiniz. Alandan geçen herkes çevresel hasar, tehlikeli arazi ve alandaki tehlikeler dâhil olmak üzere arazinin ve çevrenin zararlı etkilerine karşı aşağıdaki faydaları kazanır. Büyü bu tür etkilere karşı Savunma Değeri'ne ve kurtarışlara +2 statü bonusu ve bu tür etkilerden gelen tüm hasarlara karşı 5 direnç sağlar. Ayrıca büyü derme çatma bir köprü veya dengesiz bir tavan gibi alanda çökmeye meyilli olan herhangi bir şeyin kendi türündeki normal bir yapıyı çökertecek aşırı bir zorlanma haricinde çökmesini engeller. Güvenli geçiş yalnızca zarara karşı korur, zahmetlere karşı korumaz; zorlu araziyi azaltmaz, yağıştan kaynaklanan Belirsiz durumunu ortadan kaldırmaz veya benzeri durumları engellemez; büyünün alanındaki yaratıklara karşı da koruma sağlamaz.

    Güçlendirilmiş (5.) Sağlanan direnç 10'a çıkar ve alan 120 fit uzunluğunda olabilir.

    Güçlendirilmiş (8.) Sağlanan direnç 15'e çıkar ve alan 500 fit uzunluğunda olabilir.

omen://spell/safeguard-secret?source=paizo-pathfinder-player-core:
  name: Sırrı Muhafaza Et
  description: "Bir sırrın meraklı casuslardan uzakta güvende kalmasını sağlarsınız. Hedeflerden en azından bazılarının bildiği, örneğin \"çalınan hazinenin yeri\" veya \"lonca binasına giriş parolası\" gibi tek bir bilgi parçası seçin. Büyü seçtiğiniz bilgi parçasını bilen kişilere bu bilgiyi gizlemek için yapılan beceri testlerine (genellikle Aldatma testleri), bu bilgiyi özellikle onlardan elde etmeye çalışan büyülere karşı ve onları bunu açıklamaya zorlayacak etkilere karşı kurtarışlara +4 statü bonusu sağlar. Bu Büyüyü tekrar Yaparsanız yapmış olduğunuz önceki sırrı muhafaza et büyüsü sona erer."

omen://spell/sanctuary?source=paizo-pathfinder-player-core:
  name: Mabut Sığınağı
  description: >
    Bir yaratığı saldırıları caydıran koruyucu enerjiyle muhafaza altına alırsınız. Hedefe saldırmaya çalışan yaratıklar her seferinde bir İrade kurtarışı denemelidir. Hedef düşmanca bir eylem kullanırsa büyü sona erer.

    Kritik Başarı Mabut sığınağı sona erer.

    Başarı Yaratık bu tur hedefe karşı saldırısını ve diğer tüm saldırılarını deneyebilir.

    Başarısızlık Yaratık hedefe saldıramaz ve eylemi boşa harcar. Bu tur hedefe karşı başka saldırı denemesinde bulunamaz.

    Kritik Başarısızlık Yaratık eylemi boşa harcar ve mabut sığınağının kalan süresi boyunca hedefe saldırmayı deneyemez.

omen://spell/savor-the-sting?source=paizo-pathfinder-player-core:
  name: Acının Tadını Çıkar
  description: "Hedefe acı verir ve onun ızdırabından keyif alırsınız. Bu 1d4 zihinsel hasar ve (spell rank)d4[persistent,mental] hasar verir; hedef bir İrade kurtarışı denemelidir. Hedef bu büyüden süren hasar aldığı sürece hedefe karşı yapılan saldırı zarlarına ve beceri testlerine +1 statü bonusu kazanırsınız. Kritik Başarı Hedef etkilenmez. Başarı Hedef yarım hasar alır ve süren hasar almaz. Başarısızlık Hedef tam ilk hasarı ve süren hasarı alır. Kritik Başarısızlık Hedef iki kat ilk hasar ve süren hasar alır. Güçlendirilmiş (+1) İlk hasar 1d4 artar ve süren hasar 1d4 artar."

omen://spell/scholarly-recollection?source=paizo-pathfinder-player-core:
  name: Âlimin Hatırlayışı
  description: >
    Tetikleyici: Tara için bir Dikkat testi denersiniz veya eğitimli olduğunuz bir beceriyle Bilgi Hatırla için bir beceri testi denersiniz.

    Düşüncelerinizi toplarken kısa bir dua ederek doğru yöne sevk edilme lütfuna erersiniz. GM tetikleyici testi iki kez atar ve daha iyi olan sonucu kullanır.

omen://spell/scouting-eye?source=paizo-pathfinder-player-core:
  name: Gözcü Gözü
  description: "500 fit içinde görebildiğiniz bir konumda 1 inç çapında Görünmez, süzülen bir göz yaratırsınız. Normal görsel duyularınızla her yöne bakar ve gördüklerini sürekli olarak size iletir. Her tur büyüyü ilk Sürdürdüğünüzde gözü yalnızca önündeki şeyleri görecek şekilde 30 fite kadar hareket ettirebilir veya çevresindeki her yöndeki her şeyi görecek şekilde 10 fite kadar hareket ettirebilirsiniz. Gözün sizden ne kadar uzaklaşabileceğinin bir sınırı yoktur; ancak siz ve göz aynı varoluş düzleminde bulunmaktan çıkarsanız büyü derhal sona erer. Göz aracılığıyla Dikkat testleri denemek isterseniz göz üzerinden Tara eylemleri deneyebilirsiniz. Göze verilen herhangi bir hasar onu yok eder ve büyüyü sona erdirir."

omen://spell/scramble-body?source=paizo-pathfinder-player-core:
  name: Bedeni Altüst Et
  description: >
    Büyünüz yaratığın biyolojisini altüst ederek mide bulantısı, ateş ve diğer hoş olmayan durumlara yol açar.

    Başarı Hedef etkilenmez.

    Başarısızlık Hedef Midesi Bulanmış 1 olur.

    Kritik Başarısızlık Hedef Midesi Bulanmış 2 ve midesi bulandığı sürece Yavaşlatılmış 1 olur.

omen://spell/scrying?source=paizo-pathfinder-player-core:
  name: Gözetleme
  description: >
    Seçtiğiniz bir yaratığı büyüyle gözetlersiniz. Aldığınız görüntünün daha az kesin olması ve ışınlanma ile benzeri büyüler için yetersiz olması haricinde gözetleme Durugörü gibi çalışır. 500 fit içindeki sabit bir konumda bir göz yaratmak yerine hedefin hemen üzerinde beliren bir göz yaratırsınız. Bir hedefi ismen ya da eşyalarından birine veya bedeninden bir parçaya dokunarak seçebilirsiniz. Hedifle bizzat tanışmadıysanız gözetlemenin ZD'si 2 daha düşüktür; hedefin kimliğinden habersizseniz (örneğin bir suç mahallinde bilinmeyen bir yaratığın dişini bulduğunuz için) ZD bunun yerine 10 daha düşüktür. Gözetlemenin etkisi hedefin İrade kurtarışına bağlıdır.

    Kritik Başarı Büyü başarısız olur ve hedef 1 hafta boyunca geçici olarak bağışık olur. Hedef ayrıca size dair kısa bir anlık görüntü yakalar ve sizden olan yaklaşık mesafesini ve yönünü öğrenir.

    Başarı Büyü başarısız olur ve hedef 1 gün boyunca geçici olarak bağışık olur.

    Başarısızlık Büyü başarılı olur.

    Kritik Başarısızlık Büyü başarılı olur ve hedef hareket ederse göz hedefi takip ederek tur başına 60 fite kadar ilerler.

omen://spell/see-the-unseen?source=paizo-pathfinder-player-core:
  name: Görünmeyeni Gör
  description: >
    Bakışınız yanılsamaları delip geçer ve Görünmez yaratıkları ve ruhları bulur. Görünmez yaratıkları sanki görünmez değillermiş gibi görebilirsiniz; ancak hatları bulanıktır, bu da onları Belirsiz ve teşhis edilmesi zor kılar. Hayaletler gibi cisimsiz yaratıkları da bir nesnenin yüzeyinin 10 fiti içerisinden o nesnenin içine geçmişken o nesnelerin arasından görünen bulanık şekiller olarak görebilirsiniz. Daha ince ipuçları ayrıca yanılsamalara inanmamak için yaptığınız testlere +2 statü bonusu sağlar.

    Güçlendirilmiş (5.) Bu büyünün süresi 8 saattir.

omen://spell/seize-soul?source=paizo-pathfinder-player-core:
  name: Ruh Yakala
  description: "Ruh öbür dünyaya geçmeden önce hedefin ruhunu eşyanın içine hapsedersiniz. Ruhu barındırmak için kullanılan eşya uygun değerde olduğu sürece herhangi bir şey olabilir. Eşyanın Savunma Değeri 16'dır ve normal Sertlik ile Can Puanına sahiptir. Bir eşyayı yok etmek (yalnızca kırmak değil) veya ruh yakalama büyüsünü etkisiz kılmak ruhu öbür dünyaya serbest bırakır. Ruh eşyanın içindeyken hedef Dilek ritüeli gibi güçlü büyüler dâhil hiçbir yolla hayata döndürülemez. Eşya yok edilirse veya eşya üzerindeki ruh yakalama etkisiz kılınırsa ruh serbest kalır. Bir eşya birden fazla ruh barındıramaz ve böyle bir girişim büyüyü boşa harcar. Ayrıca içine ruh hapsedilmiş bir eşyayı ruh yakalamanın ikinci bir yapılışıyla hedef alabilirsiniz; bu eşyayı yok eder ve seçiminize bağlı olarak ya ruhu serbest bırakır ya da farklı bir eşyaya nakleder. Hedef bir yadigar ise veya hapsedilen ruh 19. seviye ya da daha yüksek bir yaratığa aitse bu başarısız olur."

omen://spell/sending?source=paizo-pathfinder-player-core:
  name: Haber Gönder
  description: Yaratığa 25 kelime veya daha kısa zihinsel bir mesaj gönderirsiniz ve o da 25 kelime veya daha kısa kendi mesajıyla derhal yanıt verebilir.

omen://spell/shadow-blast?source=paizo-pathfinder-player-core:
  name: Gölge Patlaması
  description: "Alan değişir Savunma reflex|basic|options:area-effect veya will|basic|options:area-effect (hedefin tercihi) Yeraltı Dünyası'nın gölge maddesini bir patlama şeklinde biçimlendirirsiniz. (spell rank+1)d8[acid]|options:area-damage, (spell rank+1)d8[bludgeoning]|options:area-damage, (spell rank+1)d8[cold]|options:area-damage, (spell rank+1)d8[electricity]|options:area-damage, (spell rank+1)d8[fire]|options:area-damage, (spell rank+1)d8[force]|options:area-damage, (spell rank+1)d8[piercing]|options:area-damage, (spell rank+1)d8[slashing]|options:area-damage, (spell rank+1)d8[sonic]|options:area-damage veya (spell rank+1)d8[spirit]|options:area-damage hasar seçin ve bir koni, 120 fit içinde bir yayılma veya bir hat seçin. Patlama alandaki her bir yaratığa seçtiğiniz türde 6d8 hasar verir. Güçlendirilmiş (+1) Hasar 1d8 artar."

omen://spell/shape-stone?source=paizo-pathfinder-player-core:
  name: Taşa Şekil Ver
  description: >
    Taşı seçtiğiniz kaba bir şekle sokarsınız. Şekillendirme süreci karmaşık parçalar, ince detaylar, hareketli parçalar veya benzerlerini üretmek için fazla kabataslaktır. Taşı yeniden şekillendirdiğinizde taşın üzerinde duran tüm yaratıklar bir Refleks kurtarışı veya Akrobasi testi denemelidir.

    Başarı Yaratık etkilenmez.

    Başarısızlık Yaratık taşın üzerinde Yüzüstü yere düşer.

    Kritik Başarısızlık Yaratık (uygunsa) taştan düşer ve yere Yüzüstü kapaklanır.

omen://spell/shape-wood?source=paizo-pathfinder-player-core:
  name: Ahşaba Şekil Ver
  description: Ahşabı seçtiğiniz kaba bir şekle sokarsınız. Şekillendirme gücü karmaşık parçalar, ince detaylar, hareketli parçalar veya benzerlerini üretmek için fazla kabataslaktır. Bu büyüyü şekillendirdiğiniz ahşap nesnenin değerini artırmak için kullanamazsınız.

omen://spell/share-life?source=paizo-pathfinder-player-core:
  name: Yaşam Paylaş
  description: "Hedefin yaşam özü ile kendinizinki arasında geçici bir bağ kurarsınız. Hedef Can Puanı hasarı veren tüm etkilerden yarı hasar alır ve hasarın geri kalanını siz alırsınız. Bu bağ aracılığıyla hasar aldığınızda o hasara sahip olduğunuz hiçbir direnci, zayıflığı veya diğer yetenekleri uygulamazsınız; sadece o miktarda hasar alırsınız. Hedef sizden 30 fitten daha fazla uzaklaşırsa büyü sona erer. Siz veya hedef 0 Can Puanına düşürülürseniz bu büyüden gelen hasar çözümlenir ve ardından büyü sona erer."

omen://spell/shared-nightmare?source=paizo-pathfinder-player-core:
  name: Paylaşılan Kâbus
  description: >
    Hedefle zihinleri birleştirerek üzüntü verici görüler takas edersiniz. Hedefin İrade kurtarışına bağlı olarak biriniz Aklı Bulanmış olur.

    Kritik Başarı 1 tur boyunca Aklı Bulanmış olursunuz.

    Başarı Bir sonraki sıranızın başında ilk eyleminizi Aklı Bulanmış durumunda harcar, ardından normal hareket edersiniz.

    Başarısızlık Hedef her sırasının ilk eylemini Aklı Bulanmış olarak harcar. Süre 1 dakikadır.

    Kritik Başarısızlık Hedef Aklı Bulanmış olur. Süre 1 dakikadır.

omen://spell/shatter?source=paizo-pathfinder-player-core:
  name: Parçala
  description: >
    Yüksek frekanslı sonik bir saldırı yakındaki bir nesneyi parçalar. Nesneye 2d10 sonik hasar verirsiniz; nesnenin Sertliği 4 veya daha düşükse Sertliğini yok sayarsınız.

    Güçlendirilmiş (+1) Hasar 1d10 artar ve büyünün yok saydığı Sertlik 2 artar.

omen://spell/shield?source=paizo-pathfinder-player-core:
  name: Kalkan
  description: >
    Kuvvetten büyüsel bir kalkan kaldırırsınız. Bu, Kalkan Kaldır eylemini kullanmak sayılır ve bir sonraki sıranızın başlangıcına kadar Savunma Değeri'nize +1 durumsal bonus verir; ancak kullanmak için bir el gerektirmez. Büyü yürürlükteyken büyüsel kalkanınızla Kalkanla Engelleme reaksiyonunu kullanabilirsiniz. Kalkan Sertlik 5'e sahiptir. Fiziksel hasar vermese bile herhangi bir büyüden veya büyüsel etkiden gelen hasarı azaltmak için büyünün reaksiyonunu kullanabilirsiniz. Kalkanla Engelleme'yi kullandıktan sonra büyü sona erer ve 10 dakika boyunca büyüyü tekrar yapamazsınız.

    Güçlendirilmiş (+2) Kalkanın Sertliği 5 artar.

omen://spell/shifting-form?source=paizo-pathfinder-player-core:
  name: Biçim Değiştiren Form
  description: Bedeninizi ana daha iyi uyacak şekilde değiştirirsiniz. Seçtiğiniz aşağıdaki yeteneklerden birini kazanırsınız. Bu büyüyü Sonlandırabilirsiniz. Hareket Hızınıza 20 fitlik statü bonusu kazanırsınız. Hareket Hızınızın yarısına eşit bir tırmanma veya yüzme Hareket Hızı kazanırsınız. Karanlıkgörüşü kazanırsınız. Bir çift pençe kazanırsınız. Bunlar 1d8 kesici hasar veren çevik, incelikli silahsız saldırılardır. 60 fit koku alma (kusurlu) kazanırsınız.

omen://spell/shrink?source=paizo-pathfinder-player-core:
  name: Küçült
  description: >
    Bir yaratığı küçültmek için uzamı bükersiniz. Hedef Minik boyuta küçülür. Ekipmanı da onunla birlikte küçülür, ancak çıkarılırsa orijinal boyutuna geri döner. Yaratığın erişim mesafesi 0 fite değişir. Bu büyünün Minik bir yaratık üzerinde hiçbir etkisi yoktur.

    Güçlendirilmiş (6.) Büyü en fazla 10 yaratığı hedef alabilir.

omen://spell/shroud-of-night?source=paizo-pathfinder-player-core:
  name: Gece Örtüsü
  description: >
    Haminiz hedefin gözlerini karanlıkla örter. Bu büyüyü istekli bir müttefik üzerinde yaparsanız (örneğin ışık körlüğü olan biri), müttefik zar atmadan hangi sonucu alacağını seçebilir.

    Başarı Hedef etkilenmez.

    Başarısızlık Hedef kasvetli bir karanlığa bürünür. Parlak ışığı loş ışık sayar ve büyük karanlıkgörüşüne sahip olmadığı sürece tüm yaratıklar ona karşı Belirsiz olur.

omen://spell/sigil?source=paizo-pathfinder-player-core:
  name: Mühür İmi
  description: >
    Hedeflenen yaratık veya nesnenin üzerine yaklaşık 1 inç kare boyutundaki benzersiz büyüsel mührünüzü zararsızca yerleştirirsiniz. İşaret görünür veya görünmez olabilir ve hedefe dokunmak için bir Etkileşime Gir eylemi kullanarak onu bir durumdan diğerine dönüştürebilirsiniz. İşaret 5 dakikalık bir çalışmayla ovularak veya kazınarak çıkarılabilir. Bir yaratığın üzerindeyse bir hafta içinde doğal olarak silinir. İşaretin silinmesinden önceki süre güçlendirilmiş derecenize bağlı olarak artar.

    Güçlendirilmiş (3.) Mühür bunun yerine 1 ay sonra silinir.

    Güçlendirilmiş (5.) Mühür bunun yerine 1 yıl sonra silinir.

    Güçlendirilmiş (7.) Mühür asla silinmez.

omen://spell/silence?source=paizo-pathfinder-player-core:
  name: Sessizlik
  description: >
    Hedef hiçbir ses çıkarmaz; bu da yaratıkların onu yalnızca işitme duyusunu kullanarak fark etmesini engeller. Hedef sonik saldırılar kullanamaz ve işitsel özelliğe sahip eylemleri de kullanamaz. Bu durum göze çarpmayan büyüler haricinde, büyü yapımında kullanılan büyüsel sözler nedeniyle hedefi büyü yapmaktan alıkoyar.

    Güçlendirilmiş (4.) Büyü dokunulan yaratığın etrafındaki 10 fitlik yayılım alanında bir aura yaratarak içindeki veya içinden geçen tüm sesleri susturur. Aura içindeyken yaratıklar hedefle aynı etkilere maruz kalır. Etkinin konumuna bağlı olarak bir yaratık kendisine ulaşan ses eksikliğini fark edebilir (örneğin bir partiden gelen gürültünün kesilmesi gibi).

omen://spell/sleep?source=paizo-pathfinder-player-core:
  name: Uyku
  description: >
    Alandaki her yaratık uykulu hâle gelir, hatta belki de uykuya dalar. Bu büyü nedeniyle Bilinçsiz duruma düşen bir yaratık Yüzüstü yere düşmez veya elinde tuttuklarını bırakmaz. Bu büyü başarılı bir Dikkat testi nedeniyle yaratıkların uyanmasını engellemez, bu da çatışmadaki faydasını sınırlar.

    Kritik Başarı Yaratık etkilenmez.

    Başarı Yaratık 1 tur boyunca Dikkat testlerine –1 statü cezası alır.

    Başarısızlık Yaratık bilincini kaybeder. 1 dakika sonra hâlâ bilinçsizse otomatik olarak uyanır.

    Kritik Başarısızlık Yaratık bilincini kaybeder. 1 saat sonra hâlâ bilinçsizse otomatik olarak uyanır.

    Güçlendirilmiş (4.) Yaratıklar başarısızlıkta 1 tur, kritik başarısızlıkta ise 1 dakika boyunca bilincini kaybeder. Yüzüstü yere düşerler ve tuttuklarını bırakırlar; uyanmak için Dikkat testleri deneyemezler. Süre sona erdiğinde yaratık otomatik olarak uyanmak yerine normal şekilde uyur.

omen://spell/slither?source=paizo-pathfinder-player-core:
  name: Kıvrılma
  description: >
    Gölgeden yapılma bir yılan kütlesi alandaki yaratıkları yakalamak için yükselir. Büyüyü Yaptığınızda alandaki her yaratık ısıran bir yılandan 3d6 delici hasar ve 1d6 süren zehir hasarı alır; Refleks kurtarışına bağlı olarak kavranır veya bağlanır. Turunu alanda bitiren bir yaratık yılanlar tarafından zaten kavranmış veya bağlanmış olsa bile bu kurtarışı denemelidir. Büyüyü Sonlandırabilirsiniz.

    Başarı Yaratık etkilenmez.

    Başarısızlık Yaratık tam hasar alır ve bir yılan tarafından Kavranır. Yılanların Kurtulma ZD'si büyü ZD'nize eşittir. Bir yaratık yaratığı serbest bırakmak için yılana saldırabilir. Bir yılanın Savunma Değeri büyü ZD'nize eşittir ve tek seferde 12 veya daha fazla hasar alırsa yok edilir. Büyü sürdüğü müddetçe yeni yılanlar sürekli olarak yeniden büyür; bu nedenle yılanları yok etmek kıvrılma büyüsünün daha fazla yaratık yakalamasını engellemez.

    Kritik Başarısızlık Başarısızlık gibi, ancak yaratık iki kat hasar alır ve bir yılan tarafından Bağlanır.

    Güçlendirilmiş (+2) Süren zehir hasarı 1d6 artar ve yılanın Can Puanı 6 artar.

omen://spell/slow?source=paizo-pathfinder-player-core:
  name: Yavaşlat
  description: >
    Hedefin etrafındaki zaman akışını genişleterek eylemlerini yavaşlatırsınız.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef 1 tur boyunca Yavaşlatılmış 1 olur.

    Başarısızlık Hedef 1 dakika boyunca Yavaşlatılmış 1 olur.

    Kritik Başarısızlık Hedef 1 dakika boyunca Yavaşlatılmış 2 olur.

    Güçlendirilmiş (6.) En fazla 10 yaratığı hedef alabilirsiniz.

omen://spell/song-of-marching?source=paizo-pathfinder-player-core:
  name: Yürüyüş Şarkısı
  description: >
    Müttefikleri hareket hâlinde tutan tempolu bir gösteri sergilersiniz. Siz ve alandaki müttefikleriniz diğer keşif aktivitelerinize ek olarak büyünün süresi boyunca Acele Edebilirsiniz (keşif aktiviteniz bu büyüyü Sürdürmektir). Siz ve müttefikleriniz ardından 1 gün boyunca geçici olarak bağışık olursunuz. Bu şarkıyı icra ederken bir karşılaşmaya girerseniz inisiyatif zarı için Gösteri bonusunuzu kullanabilirsiniz. Siz ve etkilenen müttefikleriniz ayrıca o inisiyatif zarına +1 statü bonusu alırsınız.

    Güçlendirilmiş (6.) Büyüyü 2 saate kadar Sürdürebilirsiniz.

    Güçlendirilmiş (9.) Büyüyü 4 saate kadar Sürdürebilirsiniz.

omen://spell/song-of-strength?source=paizo-pathfinder-player-core:
  name: Kuvvet Şarkısı
  description: Müttefiklerinizin fiziksel kuvvetini içten bir teşvikle pekiştirirsiniz. Siz ve müttefikleriniz Atletizm testlerine ve Silahsızlandır, Yerinden Oynat, İt ve Çelme Tak gibi Atletizm beceri eylemlerine karşı ZD'lerine +1 statü bonusu kazanırsınız.

omen://spell/soothe?source=paizo-pathfinder-player-core:
  name: Yatıştır
  description: >
    Hedefin zihnini lütuflandırarak zihinsel savunmalarını güçlendirir ve yaralarını sararsınız. Büyüyü Yaptığınızda hedef 1d10+4 Can Puanı geri kazanır ve süre boyunca zihinsel etkilere karşı kurtarışlara +2 statü bonusu elde eder.

    Güçlendirilmiş (+1) İyileşme miktarı 1d10+4 artar.

omen://spell/soothing-ballad?source=paizo-pathfinder-player-core:
  name: Yatıştırıcı Balad
  description: >
    Müttefiklerinizi yatıştırmak için ilham perinize başvurursunuz. Aşağıdaki üç etkiden birini seçin: Büyü hedefler üzerindeki korku etkilerini etkisiz kılmaya çalışır. Büyü hedeflere felç uygulayan etkileri etkisiz kılmaya çalışır. Büyü hedeflere 7d8 Can Puanı yeniler.

    Güçlendirilmiş (+1) İyileştirme için kullanıldığında yatıştırıcı balad 1d8 daha fazla Can Puanı yeniler.

omen://spell/soothing-mist?source=paizo-pathfinder-player-core:
  name: Yatıştırıcı Sis
  description: "Bir yaratığı saran büyülü bir sis çağırırsınız. Sis, hedef canlı bir yaratığa 2d8 Can Puanı yeniler ve onu etkileyen sürekli asit, kanama, ateş, zehir veya boşluk hasarı kaynaklarından birini sona erdirir. Yaratık birden fazla kaynaktan süren hasar alıyorsa hangisinin kaldırılacağını siz seçersiniz. Hortlak bir hedefe karşı 2d8 canlılık hasarı verirsiniz (temel Dayanıklılık kurtarışı); kurtarışta başarısız olursa ayrıca (spell rank)[persistent,vitality] hasar alır. Güçlendirilmiş (+1) İyileşme miktarı (veya bir hortlak hedefe verilen hasar) 1d8 artar ve hortlak bir yaratığa verilen süren canlılık hasarı 1 artar."

omen://spell/soothing-words?source=paizo-pathfinder-player-core:
  name: Yatıştırıcı Sözler
  description: >
    Sakin ve dengeli bir tonla yatıştırıcı sözler fısıldayarak hedefi sakinleştirmeye çalışırsınız. Hedef İrade kurtarışlara +1 statü bonusu kazanır. Bu bonus duygu etkilerine karşı +2'ye çıkar. Buna ek olarak bu Büyüyü Yaptığınızda hedef üzerindeki bir duygu etkisini etkisiz kılmayı deneyebilirsiniz.

    Güçlendirilmiş (5.) Kurtarışlara verilen bonus +2'ye veya duygu etkilerine karşı +3'e çıkar.

omen://spell/sound-body?source=paizo-pathfinder-player-core:
  name: Sağlam Beden
  description: >
    Hedefin bedenini iyileştirmek için şifalı bir enerji dalgası gönderirsiniz. Hedefe şu durumlardan birini uygulayan, seçtiğiniz bir etkiyi etkisiz kılmayı deneyin: Kör, Gözü Kamaşmış, Sağır, Halsiz veya Midesi Bulanmış. Etkiyi etkisiz kılamadıysanız ancak etkisiz kılma derecesi 2 daha düşük olsaydı etkisiz kılacak idiyseniz bunun yerine etkiyi bir sonraki sıranızın başlangıcına kadar baskılayın. Etki baskılandığı sürece süresi işlemez. Bu büyü lanetleri, hastalıkları veya hedefin normal durumunun bir parçası olan durumları etkisiz kılamaz veya baskılayamaz.

    Güçlendirilmiş (4.) Durumlar listesine İçi Çekilmiş ve Yavaşlatılmış durumlarını ekleyin.

    Güçlendirilmiş (6.) 4. derece gibi; ayrıca Taşlaşmış durumunu ekleyin.

    Güçlendirilmiş (8.) 4. derece gibi; ayrıca taşlaşmış ve Sersemlemiş durumlarını ekleyin.

omen://spell/speak-with-animals?source=paizo-pathfinder-player-core:
  name: Hayvanlarla Konuş
  description: Hayvanlara soru sorabilir, onlardan cevap alabilir ve hayvanlarla Diplomasi becerisini kullanabilirsiniz. Büyü onları normalden daha dost canlısı yapmaz. Kurnaz hayvanların kısa ve kaçamak cevaplar vermesi muhtemelken daha az zeki olanlar genellikle anlamsız yorumlar yaparlar.

omen://spell/speak-with-plants?source=paizo-pathfinder-player-core:
  name: Bitkilerle Konuş
  description: >
    Bitki ve mantarlara soru sorabilir ve onlardan yanıt alabilirsiniz; ancak büyü onları normalden daha dost canlısı veya daha zeki yapmaz. Çoğu normal bitki ve mantar çevrelerindeki dünyaya dair kendine özgü bir bakış açısına sahiptir, bu nedenle yaratıklar hakkındaki ayrıntıları tanımazlar veya yakın çevrelerinin ötesindeki dünya hakkında hiçbir şey bilmezler. Kurnaz bitki veya mantar canavarlarının kısa ve kaçamak cevaplar vermesi muhtemelken daha az zeki olanlar genellikle anlamsız yorumlar yaparlar.

    Güçlendirilmiş (4.) Süre 8 saattir.

omen://spell/speak-with-stones?source=paizo-pathfinder-player-core:
  name: Taşlarla Konuş
  description: >
    Doğal veya işlenmiş taşa soru sorabilir ve ondan yanıt alabilirsiniz. Taş zeki olmasa da taşın türüyle ve işlenmiş taş için taşın parçası olduğu yapının türüyle renklenmiş bir kişiliğe sahip olan taşın doğal ruhlarıyla konuşursunuz. Bir taşın bakış açısı, algısı ve bilgisi ona bir insanınkinden yeterince farklı bir dünya görüşü kazandırır; böylece aynı ayrıntıları önemli görmez. Taşlar çoğunlukla geçmişte kendilerine dokunan yaratıklar ve altlarında ya da arkalarında neyin gizlendiği hakkındaki soruları yanıtlayabilir.

    Güçlendirilmiş (6.) Süre 8 saattir.

omen://spell/spellwrack?source=paizo-pathfinder-player-core:
  name: Büyü Gazabı
  description: "Hedefin üzerindeki büyülerin zararlı dalgalar hâlinde enerjilerini saçmasına neden olursunuz. Hedef bir İrade kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedef süresi olan bir büyüden her etkilendiğinde 2d12[persistent,force] hasar alır. Büyü gazabından süren güç hasarı aldığı her defasında, onu etkileyen büyülerin kalan süresini 1 tur azaltır. Hedefin süren hasardan toparlanmasına yalnızca büyü ZD'nize karşı başarılı bir arkana testi yardımcı olabilir; lanet ve süren hasar 1 dakika sonra sona erer. Başarısızlık Başarıdaki gibidir, ancak lanet ve süren hasar kendiliğinden sona ermez. Kritik Başarısızlık Başarısızlıktaki gibidir, ancak süren güç hasarı 4d12[persistent,force] olur."

omen://spell/spider-sting?source=paizo-pathfinder-player-core:
  name: Örümcek İğnesi
  description: "Bir örümceğin zehirli iğnesini büyülü biçimde kopyalarsınız. Dokunulan yaratığa 1d4 delici hasar verir ve ona örümcek zehri bulaştırırsınız. Hedef bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedef 1d4[poison] hasar alır. Başarısızlık Hedef 1. aşamada örümcek zehrine yakalanır. Kritik Başarısızlık Hedef 2. aşamada örümcek zehrine yakalanır. Örümcek Zehri (zehir) Seviye 1 Maksimum Süre 4 tur Aşama 1 1d4 zehir hasarı ve Halsiz 1 (1 tur) Aşama 2 1d4 zehir hasarı ve Halsiz 2 (1 tur)"

omen://spell/spiral-of-horrors?source=paizo-pathfinder-player-core:
  name: Dehşet Sarmalı
  description: Gölgeler ve ruhlar etrafınızda uluyup dönerek buna tanık olan herkesin yüreğine korku salan bir gösteri sergiler. Alandaki düşmanlar Korkmuş 1 olur ve büyünün süresi boyunca korkmuş değerlerini 1'in altına düşüremezler.

omen://spell/spirit-blast?source=paizo-pathfinder-player-core:
  name: Ruh Patlaması
  description: >
    Esir enerjisini yoğunlaştırarak bir yaratığın ruhuna saldırır, temel bir Dayanıklılık kurtarışıyla 16d6 ruh hasarı verirsiniz.

    Güçlendirilmiş (+1) Hasar 2d6 artar.

omen://spell/spirit-link?source=paizo-pathfinder-player-core:
  name: Ruh Bağı
  description: >
    Başka bir yaratıkla ruhani bir bağ kurarak onun acısını üstlenirsiniz. Bu Büyüyü Yaptığınızda ve turlarınızın her birinin başında, hedef maksimum Can Puanının altındaysa 2 Can Puanı (veya daha düşükse mevcut ve maksimum Can Puanı arasındaki farkı) geri kazanır. Hedefin kazandığı kadar Can Puanı kaybedersiniz. Bu ruhani bir aktarımdır; dolayısıyla hedefin geri kazandığı Can Puanını artıracak veya kaybettiğiniz Can Puanını azaltacak hiçbir etki uygulanmaz. Bu aktarım ayrıca sizin veya hedefin sahip olduğu geçici Can Puanını da yok sayar. Bu etki canlılık veya boşluk enerjisi içermediğinden ruh bağı siz veya hedef hortlak olsa bile çalışır. Süre devam ettiği müddetçe rejenerasyon veya hızlı iyileşmeden hiçbir fayda elde edemezsiniz. Bu büyüyü Sonlandırabilirsiniz ve 0 Can Puanına düşerseniz ruh bağı otomatik olarak sona erer.

    Güçlendirilmiş (+1) Her seferinde aktarılan Can Puanı miktarı 2 artar.

omen://spell/spiritual-armament?source=paizo-pathfinder-player-core:
  name: Ruhani Teçhizat
  description: >
    Kullandığınız veya üzerinizde taşıdığınız bir silahın hayaletsi, büyüsel bir yankısını yaratıp onu fırlatırsınız. Hedefin Savunma Değeri'ne karşı bir büyü saldırı zarı deneyin; vuruşta 2d8 hasar (veya kritik vuruşta iki kat hasar) verir. Hasar türü seçilen silahla (veya çok yönlü bir silah için onun türlerinden herhangi biriyle) aynıdır. Bu durum yaratık için daha zararlı olacaksa (GM tarafından belirlendiği üzere) saldırı bunun yerine ruh hasarı verir. Bu saldırı çoklu saldırı cezanızı kullanır ve ona katkıda bulunur. Saldırıdan sonra silah yanınıza geri döner. Büyüyü kutsarsanız saldırılar da kutsanır. Büyüyü her Sürdürdüğünüzde 120 fit içindeki herhangi bir yaratığa karşı saldırıyı tekrarlayabilirsiniz.

    Güçlendirilmiş (+2) Hasar 1d8 artar.

omen://spell/spiritual-guardian?source=paizo-pathfinder-player-core:
  name: Ruhani Muhafız
  description: "Menzil içindeki boş bir alanda büyülü güçten oluşan Orta boy bir muhafız belirir. Ruhani muhafız yarı saydamdır ve kullandığınız veya üzerinizde taşıdığınız bir silahın hayaletimsi bir yankısını kuşanır. Bir tanrınız varsa muhafız, tanrınızın nedimelerinden veya hizmetkârlarından birinin formuna bürünür. Büyüyü kutsarsanız muhafızın saldırıları da kutsanır. Yaratıklar muhafızın alanından geçebilir ancak hareketlerini bu alanda sonlandıramazlar. Siz ve müttefikleriniz muhafızla kıskaca alabilirsiniz. Muhafızın, hiçbir yolla geri kazanamayacağı ve yalnızca bir yaratığı korurken kaybedebileceği (aşağıya bakınız) 50 Can Puanı dışında bir yaratığın normalde sahip olacağı başka hiçbir niteliği yoktur. Büyüyü Yaptığınızda ve onu her Sürdürdüğünüzde, muhafızın sizden 120 fit içindeki herhangi bir boş alana hareket etmesini ve saldırmasını ya da korumasını sağlayabilirsiniz. Saldırı Muhafız bitişikteki bir yaratığa karşı bir yakın dövüş büyü saldırısı yapar; isabet hâlinde 3d8 hasar verir (veya kritik vuruşta iki kat hasar). Hasar türü seçilen silahla aynıdır (veya çok yönlü bir silah için türlerinden herhangi biri). Bu yaratık için daha zararlı olacaksa (GM tarafından belirlendiği üzere) saldırı bunun yerine ruh hasarı verir. Bu saldırı çoklu saldırı cezanızı kullanır ve buna katkıda bulunur. Koru Muhafız seçtiğiniz bir yaratığı korur. Seçilen yaratık her hasar alacağında ve muhafız ona bitişik olduğunda, muhafız müttefik yerine ilk 10 hasarı kendi alır. Bu koruma, muhafıza saldırmasını veya farklı bir yaratığı korumasını emredene kadar ya da muhafız yok edilene kadar sürer. Güçlendirilmiş (+2) Muhafızın hasarı 1d8 artar ve Can Puanı 20 artar."

omen://spell/stabilize?source=paizo-pathfinder-player-core:
  name: Durumunu Sabitle
  description: Yaşam enerjisi ölümün kapısını kapatır. Hedef, 0 Can Puanında Bilinçsiz kalmaya devam etse de Ölmekte durumunu kaybeder.

omen://spell/status?source=paizo-pathfinder-player-core:
  name: Durum
  description: Siz ve hedef aynı varoluş düzleminde olduğunuz ve ikiniz de hayatta kaldığınız sürece, onun mevcut durumunun farkında olmaya devam edersiniz. Hedefin size olan yönünü, mesafesini ve onu etkileyen her türlü durumu bilirsiniz. Güçlendirilmiş (4.) Büyünün menzili 30 fite çıkar ve 10 adede kadar yaratığı hedefleyebilirsiniz.

omen://spell/stoke-the-heart?source=paizo-pathfinder-player-core:
  name: Yüreği Körükle
  description: Haminiz bir yaratığı şevkle doldurarak darbelerini güçlendirir. Hedef hasar zarlarına +2 statü bonusu kazanır. Güçlendirilmiş (+2) Hasara olan statü bonusu 1 artar.

omen://spell/storm-lord?source=paizo-pathfinder-player-core:
  name: Fırtına Lordu
  description: >
    Gereksinimler Açık alandasınızdır ve yerin üzerindesinizdir.

    Üstünüzdeki gökyüzü birkaç dakika içinde kararır, şimşek çakmalarıyla bölünen uğursuz bulutlarla çalkalanır. Büyüyü Yaptığınızda ve sonraki turlarda her tur büyüyü ilk kez Sürdürdüğünüzde, alanda meydana gelmesi için aşağıdaki etkilerden birini seçin.

    Sakin İlave bir etki yok.

    Sis Yoğun bir sis içeri girerek alanı Sis büyüsünün etkileriyle gizler.

    Yağmur Gökyüzünden sağanak yağmur yağarak sıradan alevleri söndürür. Alandaki yaratıklar Akrobasi ve Dikkat testlerine -2 durumsal ceza alır.

    Rüzgâr Güçlü rüzgârlar alanı her yönden savurur. Menzilli saldırılar -4 durumsal ceza alır ve alan uçan yaratıklar için zorlu arazidir.

    Ayrıca tur başına bir kez, görebildiğiniz menzil içindeki herhangi bir hedefe çarpan bir yıldırım oku indirmek için konsantrasyon ve manipülasyon özelliklerine sahip tek bir eylem kullanabilirsiniz. Hedefe 10d6 elektrik hasarı verirsiniz; temel bir Refleks kurtarışı denemelidir. Başarısızlık durumunda 1 tur boyunca ayrıca Sağır olur.
  requirements: Açık alandasınızdır ve yerin üzerindesinizdir.

omen://spell/stormwind-flight?source=paizo-pathfinder-player-core:
  name: Fırtına Uçuşu
  description: Güçlü rüzgârlar sizi havada süzülürcesine taşır ve Hareket Hızınıza eşit bir uçma Hareket Hızı kazandırır. Bu büyünün süresi dolduğunda hâlâ uçuyorsanız, Yumuşak İniş büyüsündeki gibi yere doğru süzülürsünüz. Güçlendirilmiş (6.) Fırtına uçuşunu kullanarak uçtuğunuzda, rüzgârdan kaynaklanan zorlu araziyi yok sayarsınız.

omen://spell/stupefy?source=paizo-pathfinder-player-core:
  name: Zihnini Bulandır
  description: Hedefin İrade kurtarışına bağlı olarak zihnini köreltirsiniz. Kritik Başarı Hedef etkilenmez. Başarı Hedef bir sonraki sıranızın başlangıcına kadar Zihni Bulanmış 1 olur. Başarısızlık Hedef 1 dakika boyunca Zihni Bulanmış 2 olur. Kritik Başarısızlık Hedef 1 dakika boyunca Zihni Bulanmış 3 olur.

omen://spell/subconscious-suggestion?source=paizo-pathfinder-player-core:
  name: Bilinçaltı Telkini
  description: "Belirttiğiniz bir tetikleyici gerçekleştiğinde izlemesi için hedefin zihninin derinliklerine bilinçaltı bir telkin yerleştirirsiniz. Hedefe bir eylem rotası telkin edersiniz. Yönergeniz, hedefe mantıklı bir eylem rotası gibi görünecek şekilde ifade edilmelidir; kendine zarar verici veya bariz biçimde hedefin kendi çıkarlarına aykırı olamaz. Hedef bir İrade kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez ve onu kontrol etmeye çalıştığınızı bilir. Başarı Hedef etkilenmez ve ona büyü yapmadığınızı, normal şekilde konuştuğunuzu düşünür. Başarısızlık Telkin, bir sonraki hazırlık yapışınıza kadar hedefin bilinçaltında kalır. Tetikleyici bundan önce gerçekleşirse hedef derhal telkininizi uygular. Etki 1 dakikalık bir süreye sahiptir ya da hedef sonlu bir telkini tamamlayana veya telkin kendine zarar verici hâle gelene ya da bariz diğer olumsuz etkilere yol açana kadar sürer. Kritik Başarısızlık Başarısızlıktaki gibi, ancak süre 1 saattir. Güçlendirilmiş (9.) 10 adede kadar yaratığı hedefleyebilirsiniz."

omen://spell/sudden-shift?source=paizo-pathfinder-player-core:
  name: Ani Pozisyon Değişimi
  description: >
    Tetikleyici Bir düşman yakın dövüş saldırısıyla sizi ıskalar.

    Tehlikeli bir noktadan hızla uzaklaşır ve kendinizi gizlersiniz. Adım atarsınız ve Belirsiz olursunuz.

omen://spell/suggestion?source=paizo-pathfinder-player-core:
  name: Telkin
  description: "Tatlı sözlerinize yaratıkların direnmesi zordur. Hedefe bir eylem rotası telkin edersiniz; bu, hedefe mantıklı bir eylem rotası gibi görünecek şekilde ifade edilmeli, kendine zarar verici veya açıkça hedefin kendi çıkarlarına aykırı olmamalıdır. Hedef bir İrade kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez ve onu kontrol etmeye çalıştığınızı bilir. Başarı Hedef etkilenmez. Başarısızlık Hedef derhal telkininizi uygular. Büyü 1 dakikalık bir süreye sahiptir ya da hedef sonlu bir telkini tamamlayana veya telkin kendine zarar verici hâle gelene ya da bariz diğer olumsuz etkilere yol açana kadar sürer. Kritik Başarısızlık Başarısızlıktaki gibi, ancak temel süre 1 saattir. Güçlendirilmiş (8.) 10 adede kadar yaratığı hedefleyebilirsiniz."

omen://spell/summon-animal?source=paizo-pathfinder-player-core:
  name: Hayvan Çağır
  description: Sizin için savaşması üzere hayvan özelliğine sahip ve seviyesi -1 olan bir yaratık çağırırsınız. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/summon-celestial?source=paizo-pathfinder-player-core:
  name: Semavi Çağır
  description: Sizin için savaşması üzere semavi özelliğine sahip ve seviyesi 5 veya daha düşük olan bir yaratık çağırırsınız. GM, belirli durumlarda çağırabileceğiniz semavilerin belirli türlerini tanrınızın kısıtladığına hükmedebilir. Örneğin Calistria, inananlarının eon çağırmasına genellikle izin vermez. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/summon-construct?source=paizo-pathfinder-player-core:
  name: Yapay Varlık Çağır
  description: Sizin için savaşması üzere yapay varlık özelliğine sahip ve seviyesi -1 olan bir yaratık çağırırsınız. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/summon-dragon?source=paizo-pathfinder-player-core:
  name: Ejderha Çağır
  description: Sizin için savaşması üzere ejderha özelliğine sahip ve seviyesi 5 veya daha düşük olan bir yaratık çağırırsınız. Ejderha büyüsel bir gelenek özelliğine (mistik, ilahi, okült veya doğa) sahipse, onu yalnızca ejderha çağır büyüsünü yapmak için o geleneği kullanıyorsanız çağırabilirsiniz. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/summon-elemental?source=paizo-pathfinder-player-core:
  name: Elementel Çağır
  description: Sizin için savaşması üzere elementel özelliğine sahip ve seviyesi 1 veya daha düşük olan bir yaratık çağırırsınız. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/summon-entity?source=paizo-pathfinder-player-core:
  name: Varlık Çağır
  description: Sizin için savaşması üzere garabet özelliğine sahip ve seviyesi 5 veya daha düşük olan bir yaratık çağırırsınız. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/summon-fey?source=paizo-pathfinder-player-core:
  name: Peri Çağır
  description: Sizin için savaşması üzere peri özelliğine sahip ve seviyesi -1 olan bir yaratık çağırırsınız. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/summon-fiend?source=paizo-pathfinder-player-core:
  name: Fiend Çağır
  description: Sizin için savaşması üzere fiend özelliğine sahip ve seviyesi 5 veya daha düşük olan bir yaratık çağırırsınız. GM, belirli durumlarda çağırabileceğiniz fiend'lerin belirli türlerini tanrınızın kısıtladığına hükmedebilir. Örneğin başşeytanlar, inananlarının şeytan çağırmasına genellikle izin verir ancak diğer fiend'leri çağırmasına izin vermez. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/summon-giant?source=paizo-pathfinder-player-core:
  name: Dev Çağır
  description: Sizin için savaşması üzere dev özelliğine sahip ve seviyesi 5 veya daha düşük olan bir yaratık çağırırsınız. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/summon-instrument?source=paizo-pathfinder-player-core:
  name: Enstrüman Çağır
  description: Avucunuzda elde taşınabilir bir müzik aleti cisimleştirirsiniz. Enstrüman kendi türü için tipiktir, ancak yalnızca sizin için çalar. Büyü sona erdiğinde yok olur. Enstrüman çağır büyüsünü tekrar yaparsanız, daha önce çağırdığınız enstrüman kaybolur. Güçlendirilmiş (5.) Enstrüman bunun yerine virtüöz düzeyinde elde taşınabilir bir enstrümandır.

omen://spell/summon-monitor?source=paizo-pathfinder-player-core:
  name: Gözlemci Çağır
  description: Sizin için savaşması üzere gözlemci özelliğine sahip ve seviyesi 5 veya daha düşük olan bir yaratık çağırırsınız. GM, belirli durumlarda çağırabileceğiniz gözlemcilerin belirli türlerini tanrınızın kısıtladığına hükmedebilir. Örneğin Urgathoa, inananlarının psikopomp çağırmasına genellikle izin vermez. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/summon-plant-or-fungus?source=paizo-pathfinder-player-core:
  name: Bitki veya Mantar Çağır
  description: Sizin için savaşması üzere bitki veya mantar özelliğine sahip ve seviyesi -1 olan bir yaratık çağırırsınız. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/summon-undead?source=paizo-pathfinder-player-core:
  name: Hortlak Çağır
  description: Sizin için savaşması üzere hortlak özelliğine sahip ve seviyesi -1 olan bir yaratık çağırırsınız. Güçlendirilmiş Çağırma özelliğinde listelendiği gibidir.

omen://spell/sunburst?source=paizo-pathfinder-player-core:
  name: Güneş Patlaması
  description: "Alanda kavurucu güneş ışığından güçlü bir küre patlayarak alandaki tüm yaratıklara 8d10 ateş hasarı ve hortlak yaratıklara ilave (spell rank+1)d10[vitality] hasar verir. Alandaki her yaratık bir Refleks kurtarışı denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarım hasar alır. Başarısızlık Yaratık tam hasar alır. Kritik Başarısızlık Yaratık tam hasar alır ve kalıcı olarak Kör olur. Küre büyülü bir karanlık alanıyla örtüşürse, güneş patlaması karanlık etkisini etkisizleştirmeyi dener. Güçlendirilmiş (+1) Ateş hasarı 1d10 artar ve hortlaklara karşı canlılık hasarı 1d10 artar."

omen://spell/sure-footing?source=paizo-pathfinder-player-core:
  name: Sağlam Basış
  description: "Hedefin uzuvlarını hareket kabiliyetini engelleyen rahatsızlıklardan kurtarırsınız. Hedefe şu durumlardan birini dayatan seçtiğiniz bir etkiyi etkisizleştirmeyi deneyin: Sakar, Kavranmış veya Felçli. Etkiyi etkisizleştiremediyseniz ancak etkisizleştirme derecesi 2 daha düşük olsaydı başaracak idiyseniz, bunun yerine etkiyi bir sonraki sıranızın başlangıcına kadar bastırın. Etki bastırılmışken süresi işlemez. Bu büyü lanetleri, hastalıkları veya hedefin normal durumunun parçası olan durumları etkisizleştiremez ya da bastıramaz. Güçlendirilmiş (4.) Durumlar listesine Hareketsiz Kılınmış, Yavaşlatılmış ve Bağlanmış durumlarını ekleyin. Güçlendirilmiş (6.) 4. derecedeki gibi, artı Taşlaşmış durumunu ekleyin. Güçlendirilmiş (8.) 4. derecedeki gibi, artı taşlaşmış ve Sersemlemiş durumlarını ekleyin."

omen://spell/sure-strike?source=paizo-pathfinder-player-core:
  name: Kesin Saldırı
  description: Sıranızın sonundan önce bir saldırı zarı atacağınız bir sonraki seferde, zarı iki kez atın ve daha iyi olan sonucu kullanın. Saldırı, saldırı zarına gelen durumsal cezalarını ve hedefin Belirsiz veya Gizlenmiş olmasından kaynaklanan gerekli her türlü yalın testi yok sayar. Ardından 10 dakika boyunca kesin saldırı büyüsüne geçici olarak bağışık olursunuz.

omen://spell/sweet-dream?source=paizo-pathfinder-player-core:
  name: Tatlı Düş
  description: "Yatıştırıcı sözlerinizle hedefi büyüleyici bir rüyaya daldırırsınız. Büyüyü Yaptığınızda, hedef henüz öyle değilse Bilinçsiz hâle gelir. Bilinçsizken seçtiğiniz bir rüyayı deneyimler; ancak istediği zaman uyanabilecek kadar lüsiddir. 1 dakikalık uyku geçmeden önce uyanırsa büyü sona erer. Sezgi Düşü Zekâ tabanlı beceri testlerine +1 statü bonusu Cazibe Düşü Karizma tabanlı beceri testlerine +1 statü bonusu Seyahat Düşü Hareket Hızına +5 fitlik statü bonusu Bu Büyüyü tekrar Yaparsanız, daha önce yaptığınız tatlı düş büyüsü sona erer. Güçlendirilmiş (4.) Sezgi veya cazibe düşü için bonus +2'dir. Güçlendirilmiş (7.) Sezgi veya cazibe düşü için bonus +3'tür."

omen://spell/symphony-of-the-unfettered-heart?source=paizo-pathfinder-player-core:
  name: Prangasız Yürek Senfonisi
  description: "Senfoniniz dinleyicileri dünyevi kaygılarından arındırır. Hedefe şu durumlardan birini uygulayan bir etkiyi etkisizleştirmek için bir Gösteri testi deneyin: Kavranmış, Hareketsiz Kılınmış, Felçli, Bağlanmış, Yavaşlatılmış veya Sersemlemiş. Başarısız olursanız, hedef üzerindeki aynı etkiyi 1 gün boyunca hedefleyemezsiniz. Etkisizleştirme ZD'sini belirlemek için durumun kaynağını kullanın (örneğin kavranmış için Kurtulma ZD'si). Güçlendirilmiş (9.) Dört adede kadar yaratığı hedefleyebilirsiniz."

omen://spell/synaptic-pulse?source=paizo-pathfinder-player-core:
  name: Sinaptik Titreşim
  description: Alandaki tüm düşmanların zihinlerine nüfuz eden titreşimli bir zihinsel patlama yayarsınız. Alandaki her düşman bir İrade kurtarışı denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık Sersemlemiş 1 olur. Başarısızlık Yaratık Sersemlemiş 2 olur. Kritik Başarısızlık Yaratık 1 tur boyunca Sersemlemiş olur.

omen://spell/tailwind?source=paizo-pathfinder-player-core:
  name: Pupa Rüzgârı
  description: Arkanızdaki rüzgâr sizi yeni ufuklar bulmaya iter. Hareket Hızınıza +10 fitlik bir statü bonusu kazanırsınız. Güçlendirilmiş (2.) Süre 8 saate çıkar.

omen://spell/take-its-course?source=paizo-pathfinder-player-core:
  name: Akışına Bırak
  description: "Biri aşırıya kaçtığında, onu illetin en kötü aşamasının ötesine hızlandırabilir veya sefaletini yoğunlaştırabilirsiniz. Bu büyü hedefi etkileyen bir hastalık illetini, bir zehir illetini veya süren zehir hasarını ilerletmeye çalışır. Hedef bunlardan birden fazlasından etkileniyorsa, farkında olduklarınız arasından seçim yapabilirsiniz; aksi takdirde GM rastgele seçer. Gönülsüz bir hedef, akışına bırak büyüsünü geçersiz kılmak için bir İrade kurtarışı deneyebilir. Bu büyünün etkisi, bir illeti mi yoksa süren zehir hasarını mı sonlandırmaya çalıştığınıza ve hedefin iyileşmesine yardımcı olmaya mı yoksa köstek olmaya mı çalıştığınıza bağlıdır. İllet Hedef derhal illete karşı bir sonraki kurtarışı dener. Yaratığın illete karşı kurtarışa seçiminize göre +2 statü bonusu veya -2 statü cezası verebilirsiniz. Sürekli Zehir Bu Büyüyü Yaptığınızda hedefin süren zehir hasarını hemen almasını sağlayabilirsiniz (bir sonraki sırasının sonunda almasına ek olarak). Bunu yapsanız da yapmasanız da hedef, süren zehir hasarına karşı fazladan bir yalın test dener. Bu yalın testin ZD'sini normal ZD yerine 5 veya 20 olarak belirleyebilirsiniz. Güçlendirilmiş (7.) Hedefin uygun illetlerinden ve süren zehir hasarlarından istediğiniz kadarını ilerletmeyi deneyebilirsiniz."

omen://spell/talking-corpse?source=paizo-pathfinder-player-core:
  name: Konuşan Ceset
  description: "Hedef cesede bir yaşam benzeri hâl bahşedersiniz; ceset bunu kendisine yöneltilen üç sorunun yanıtlarını söylemek için kullanır. Bu büyü merhumun ruhunu geri çağırmak yerine fiziksel bedenin gizil anılarını çağırdığından, büyünün çalışması için cesedin çoğunlukla sağlam olması gerekir. Ceset ne kadar çok hasar almışsa, yanıtları o kadar hatalı veya parça pinçik olur ve konuşabilmesi için kesinlikle bir boğaza ve ağza sahip olmalıdır. Son bir hafta içinde cesede daha önce bu büyüyü yapmış biri varsa, büyü otomatik olarak başarısız olur. Ceset, ölüm anındaki orijinal yaratığın istatistiklerini kullanarak soruları yanıtlamaya direnmek için aşağıdaki etkilerle bir İrade kurtarışı deneyebilir. Kritik Başarı Hedef yalan söyleyebilir veya sorularınızı yanıtlamayı reddedebilir; ayrıca hedefin ruhu 24 saat boyunca size musallat olarak sizi rahatsız eder ve bu süre boyunca hiç dinlenememenize neden olur. Başarı Hedef yanlış bilgi verebilir veya sorularınızı yanıtlamayı reddedebilir. Başarısızlık Hedef doğru yanıt vermelidir, ancak yanıtları kısa, üstü kapalı ve tekrarlayıcı olabilir. Yine de sizi yanıltabilir veya büyünün süresi tüm sorularınızı soramadan önce tükensin diye oyalanmaya çalışabilir. Kritik Başarısızlık Başarısızlıktaki gibi, ancak hedefin yanıtları yine üstü kapalı olsa da daha doğrudan ve daha az tekrarlayıcıdır. Sizi aldatmak veya yanıltmak için yapılan Aldatma testlerine -2 statü cezası alır."

omen://spell/tangle-vine?source=paizo-pathfinder-player-core:
  name: Sarmaşık Kırbacı
  description: Havadan bir sarmaşık belirir, elinizden fırlayarak hedefe dolanır. Hedefe karşı bir büyü saldırı zarı deneyin. Kritik Başarı Hedef Hareketsiz Kılınmış durumunu kazanır ve 1 tur boyunca Hareket Hızlarına –10 fitlik bir durumsal ceza alır. Cezayı ve hareketsiz kılınmış durumunu gidermek için büyü ZD'nize karşı Kurtulmayı deneyebilir. Başarı Hedef 1 tur boyunca Hareket Hızlarına –10 fitlik bir durumsal ceza alır. Cezayı gidermek için büyü ZD'nize karşı Kurtulmayı deneyebilir. Başarısızlık Hedef etkilenmez. Güçlendirilmiş (2.) Etkiler 2 tur sürer. Güçlendirilmiş (4.) Etkiler 1 dakika sürer.

omen://spell/tangling-creepers?source=paizo-pathfinder-player-core:
  name: Dolanıcı Sürünücüler
  description: "Her yüzeyden yoğun, seğiren sarmaşıklar fışkırır ve alandaki her su birikintisini doldurur. Karada hareket eden veya sarmaşıkların içinde Tırmanan ya da Yüzen herhangi bir yaratık, alandayken Hareket Hızlarına –10 fitlik bir durumsal ceza alır. Tur başına bir kez, sarmaşık genişliğindeki herhangi bir kareden bir sarmaşığın fırlamasını sağlamak için büyüyü Sürdürebilirsiniz. Bu sarmaşık 15 fitlik bir erişime sahiptir. Hedefe karşı bir yakın dövüş büyü saldırı zarı atın; başarı hâlinde sarmaşık hedefi sarmaşıkların içine çeker ve 1 tur boyunca ya da yaratık Kurtulana kadar (büyü ZD'nize karşı) Hareketsiz Kılınmış hâle getirir (hangisi önce gelirse)."

omen://spell/telekinetic-hand?source=paizo-pathfinder-player-core:
  name: Telekinetik El
  description: Hedef nesneyi kavrayan ve onu herhangi bir yönde 20 fite kadar yavaşça havaya kaldıran görünmez veya hayaletsi, süzülen büyülü bir el yaratırsınız. Büyüyü Sürdürdüğünüzde, nesneyi ilave bir 20 fit hareket ettirebilirsiniz. Büyü sona erdiğinde nesne havadaysa düşer. Güçlendirilmiş (3.) Yükü 1 veya daha az olan sahipsiz bir nesneyi hedefleyebilirsiniz. Güçlendirilmiş (5.) Menzil 60 fite çıkar ve Yükü 1 veya daha az olan sahipsiz bir nesneyi hedefleyebilirsiniz. Güçlendirilmiş (7.) Menzil 60 fite çıkar ve Yükü 2 veya daha az olan sahipsiz bir nesneyi hedefleyebilirsiniz.

omen://spell/telekinetic-haul?source=paizo-pathfinder-player-core:
  name: Telekinetik Çekiş
  description: Hedefi 20 fite kadar hareket ettirir, potansiyel olarak havada asılı tutarsınız. Büyüyü Sürdürdüğünüzde bunu tekrar yapabilir veya telekinetik odağınızı menzil içindeki farklı bir uygun hedefe kaydırarak bunun yerine onu hareket ettirebilirsiniz.

omen://spell/telekinetic-maneuver?source=paizo-pathfinder-player-core:
  name: Telekinetik Manevra
  description: Telekinetik güç patlamasıyla bir düşmanı veya taşıdığı bir şeyi hareket ettirirsiniz. Bir Atletizm testi yerine bir büyü saldırı zarı kullanarak hedefi Silahsızlandırmayı, İtmeyi, Yerinden Oynatmayı veya Çelme Takmayı deneyebilirsiniz.

omen://spell/telekinetic-projectile?source=paizo-pathfinder-player-core:
  name: Telekinetik Mermi
  description: Menzil içinde bulunan ve 1 Yük veya daha az olan boşta, sahipsiz bir nesneyi hedefe fırlatırsınız. Hedefe karşı bir büyü saldırı zarı atın. İsabet ettirirseniz, fırlattığınız nesneye uygun şekilde 2d6 ezici, delici veya kesici hasar verirsiniz. Fırlatılan nesnenin hiçbir özel niteliği veya büyülü özelliği saldırıyı ya da hasarı etkilemez. Kritik Başarı İki kat hasar verirsiniz. Başarı Tam hasar verirsiniz. Güçlendirilmiş (+1) Hasar 1d6 artar.

omen://spell/telepathy?source=paizo-pathfinder-player-core:
  name: Telepati
  description: "30 fit içindeki yaratıklarla telepatik olarak iletişim kurabilirsiniz. Bir yaratıkla iletişim kurarak bir bağlantı kurduğunuzda, iletişim iki yönlüdür. Yalnızca sizinle ortak bir dili paylaşan yaratıklarla iletişim kurabilirsiniz. Güçlendirilmiş (6.) Bir dili paylaşmasanız bile paylaşılan zihinsel imgeleri kullanarak yaratıklarla telepatik olarak iletişim kurabilirsiniz; telepati dilsel özelliğini kaybeder."

omen://spell/teleport?source=paizo-pathfinder-player-core:
  name: Işınlan
  description: "Başlangıç konumunuza göre konumu ve görünümü (veya diğer tanımlayıcı özellikleri) ile konumu kesin olarak tanımlayabildiğiniz sürece, siz ve hedefler anında menzil içindeki herhangi bir konuma taşınırsınız. Konumun görünümüne dair hatalı bilgi genellikle büyünün başarısız olmasına yol açar; ancak bunun yerine istenmeyen bir konuma ışınlanmaya veya GM tarafından belirlenen başka olağandışı bir aksiliğe yol açabilir. Işınlanma büyük mesafelerde hassas değildir. Hedefler, kat edilen toplam mesafenin kabaca yüzde 1'ine eşit bir mesafede, GM tarafından belirlenen bir yönde hedeflenen varış noktasından uzakta belirir. Kısa yolculuklar için bu hassasiyet eksikliği önemsizdir, ancak uzun mesafeler için bu 1 mile kadar çıkabilir. Güçlendirilmiş (7.) Siz ve diğer hedefler 1.000 mil içindeki herhangi bir konuma seyahat edebilirsiniz. Güçlendirilmiş (8.) Siz ve diğer hedefler aynı gezegendeki herhangi bir konuma seyahat edebilirsiniz. 1.000 milden fazla seyahat ederseniz, hedeften yalnızca 10 mil uzakta varırsınız. Güçlendirilmiş (9.) Siz ve diğer hedefler aynı güneş sistemi içindeki başka bir gezegendeki herhangi bir konuma seyahat edebilirsiniz. Konumun yeri ve görünümü hakkında doğru bilgiye sahip olduğunuz varsayıldığında, yeni gezegene hedeften 100 mil sapmayla varırsınız. Güçlendirilmiş (10.) 9. derece versiyondaki gibi, ancak siz ve diğer hedefler aynı galaksi içindeki herhangi bir gezegene seyahat edebilirsiniz."

omen://spell/tempest-surge?source=paizo-pathfinder-player-core:
  name: Fırtına Kabarması
  description: Şiddetli rüzgârların, çalkantılı bulutların ve çatırdıyan şimşeklerin girdap gibi dönen fırtınasıyla bir düşmanı kuşatırsınız. Fırtına, temel bir Refleks kurtarışı ile hedefe 1d12 elektrik hasarı verir. Başarısızlık durumunda hedef ayrıca 1 tur boyunca Sakar 2 olur. Güçlendirilmiş (+1) Başlangıç hasarı 1d12 artar.

omen://spell/tempt-fate?source=paizo-pathfinder-player-core:
  name: Kaderi Sına
  description: >
    Tetikleyici Siz veya menzil içindeki bir müttefik bir kurtarış dener.

    Kaderin güçlerini bükerek bir anı korkunç veya olaysız kılarsınız; ortası yoktur. Hedef, tetikleyici kurtarışa +1 statü bonusu kazanır. Kurtarışın sonucu başarı ise, kritik başarıya dönüşür. Başarısızlık ise, kritik başarısızlığa dönüşür ve bu kritik başarısızlık, genellikle kritik başarısızlığı azaltan yeteneklerle azaltılamaz. Tetikleyici yeteneğin hem kritik başarı hem de kritik başarısızlık koşulu yoksa kaderi sına başarısız olur, ancak bu Büyüyü Yapmak için Odak Puanı harcamazsınız.

    Güçlendirilmiş (8.) Kurtarıştaki bonus +2'dir.

omen://spell/terrain-transposition?source=paizo-pathfinder-player-core:
  name: Arazi Değişimi
  description: "Mevcut konumunuzu mistik bir şekilde başka bir konumla değiştirirsiniz. Bir yaban ortamındayken, kendinizi ve tuttuğunuz eşyaları menzil içinde görebildiğiniz boş bir alana taşırsınız. Tercih Edilen Araziye sahipseniz ve hem başlangıç hem de bitiş konumunuz tercih edilen arazinizdeyse menzil 180 fite çıkar. Bir yoldaş hayvanınız varsa ve size bitişikse, onu da yanınızda bitişik açık bir alana taşıyabilirsiniz; ancak bu büyü yanınızda boyutlararası bir kapta bile olsa başka herhangi bir yaratık getirecek olursa büyü boşa gider."

omen://spell/thunderstrike?source=paizo-pathfinder-player-core:
  name: Yıldırım Çarpması
  description: Gök gürültüsüyle patlayan bir yıldırım dalı indirerek temel bir Refleks kurtarışı ile hedefe 1d12 elektrik hasarı ve 1d4 sonik hasar verirsiniz. Metal zırh giyen veya metalden yapılmış bir hedef, kurtarışa –1 durumsal ceza alır ve büyüden hasar görürse 1 tur boyunca Sakar 1 olur. Güçlendirilmiş (+1) Hasar 1d12 elektrik ve 1d4 sonik artar.

omen://spell/tidal-surge?source=paizo-pathfinder-player-core:
  name: Gelgit Dalgası
  description: Hedefi bir su kütlesinde veya karada hareket ettirmek için muazzam bir dalga çağırırsınız. Hedefi zemin boyunca herhangi bir yönde 10 fite kadar veya bir su kütlesi içinde 20 fite kadar hareket ettirirsiniz. Gönülsüz bir hedef bir Dayanıklılık kurtarışı deneyebilir ve başarılı olursa hareket ettirilmekten kaçınır.

omen://spell/touch-of-obedience?source=paizo-pathfinder-player-core:
  name: İtaat Dokunuşu
  description: Buyurgan dokunuşunuz hedefin iradesini aşındırarak kontrol edilmesini kolaylaştırır. Hedef bir İrade kurtarışı dener. Sonuca bakılmaksızın ardından 1 saat boyunca geçici olarak bağışık olur. Kritik Başarı Hedef etkilenmez. Başarı Hedef bir sonraki sıranızın sonuna kadar Zihni Bulanmış 1 olur. Başarısızlık Hedef bir sonraki sıranızın sonuna kadar Zihni Bulanmış 2 olur. Kritik Başarısızlık Hedef 1 dakika boyunca Zihni Bulanmış 2 olur ve diz çökmeye zorlanarak Yüzüstü duruma gelir.

omen://spell/touch-of-the-moon?source=paizo-pathfinder-player-core:
  name: Ay Dokunuşu
  description: Hedefe dokunduğunuzda, alnında yumuşak ay ışığıyla parıldayan bir ay sembolü belirir. Hedef 20 fitlik bir yarıçapta loş ışıkla parlar. Ayrıca yeni ayla başlayıp her sırasının sonunda bir sonraki evreye geçen ayın bir evresine dayalı bir fayda elde eder. Yeni Ay Hedef hiçbir fayda elde etmez. Hilal Hedef saldırı zarlarına +1 statü bonusu ve hasar zarlarına +4 statü bonusu kazanır. Dolunay Hedef saldırı zarlarına, SD'ye ve kurtarışlara +1 statü bonusu, hasara ise +4 statü bonusu kazanır. Küçülen Ay Hedef SD'ye ve kurtarışlara +1 statü bonusu kazanır. Bu evreden sonra yeni aya geri dönün.

omen://spell/touch-of-undeath?source=paizo-pathfinder-player-core:
  name: Hortlaklık Dokunuşu
  description: Hedefin yaşam gücüne hortlaklıkla saldırarak 1d6 hiçlik hasarı verirsiniz. Hedef bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedef yarı hasar alır. Başarısızlık Hedef tam hasar alır ve dirim etkileri onu 1 tur boyunca normalin yalnızca yarısı kadar iyileştirir. Kritik Başarısızlık Hedef iki kat hasar alır ve dirim etkileri onu 1 dakika boyunca normalin yalnızca yarısı kadar iyileştirir. Güçlendirilmiş (+1) Hasar 1d6 artar.

omen://spell/toxic-cloud?source=paizo-pathfinder-player-core:
  name: Zehirli Bulut
  description: "Zehirli bir sis çağırırsınız. Bu, Sis büyüsü gibi işlev görür; ancak alan her tur sizden 10 fit uzağa hareket eder. Büyünün alanında turuna başlayan her nefes alan yaratığa 6d8 zehir hasarı verirsiniz. Büyüyü Sonlandırabilirsiniz. Güçlendirilmiş (+1) Hasar 1d8 artar."

omen://spell/translate?source=paizo-pathfinder-player-core:
  name: Çeviri
  description: "Hedef, büyüyü yaptığınızda duyduğu veya okuduğu tek bir dilin anlamını kavrayabilir. Bu durum şifreleri, metaforlarla örülü dili ve benzerlerini anlamasını sağlamaz (GM takdirine bağlıdır). Hedef birden fazla dil duyabiliyorsa ve bunun farkındaysa, hangi dili anlayacağını seçebilir; aksi takdirde dillerden birini rastgele seçin. Güçlendirilmiş (3.) Hedef dili konuşabilir de. Güçlendirilmiş (4.) 10 adede kadar yaratığı hedefleyebilirsiniz ve hedefler dili konuşabilir de."

omen://spell/translocate?source=paizo-pathfinder-player-core:
  name: Yer Değiştir
  description: Kendinizi ve giydiğiniz ile tuttuğunuz tüm eşyaları mevcut alanınızdan menzil içinde görebildiğiniz boş bir alana anında taşırsınız. Bu durum yanınızda başka bir yaratık getirecek olursa—onu boyutlararası bir kapta taşıyor olsanız bile—büyü boşa gider. Güçlendirilmiş (5.) Menzil 1 mile çıkar. Geçmişte orada bulunmuş olmanız ve size göre konumunu ile mesafesini bilmeniz koşuluyla, varış noktanızı görebilmeniz gerekmez. Ardından 1 saat boyunca geçici olarak bağışık olursunuz.

omen://spell/travelers-transit?source=paizo-pathfinder-player-core:
  name: Gezgin Geçişi
  description: Kaslarınıza güç katarak kolaylıkla yüzmenizi veya duvarlara tırmanmanızı sağlarsınız. Bu Büyüyü Yaptığınızda, bir tırmanma Hareket Hızı ya da bir yüzme Hareket Hızı kazanırsınız. Bu Hız, kara Hareket Hızınıza eşittir. Güçlendirilmiş (5.) Bir uçma Hareket Hızı kazanmayı seçebilirsiniz.

omen://spell/tree-of-seasons?source=paizo-pathfinder-player-core:
  name: Mevsimler Ağacı
  description: "Yerdeki boş bir alanda anında Küçük bir ağacın filizlenmesini sağlarsınız. Ağaçta, her biri dört mevsimden farklı birinin büyüsüyle dolu dört tohum kozası yetişir. Bir yaratık kozalardan birini koparmak için Etkileşime Girebilir ve ardından aynı eylemin parçası olarak onu 30 fite kadar fırlatabilir veya bunu daha sonra ayrı bir Etkileşime Gir eylemiyle yapabilir. Fırlatıldığında koza bir patlama hâlinde patlayarak büyü ZD'nize karşı temel bir Refleks kurtarışıyla 6d6 hasar verir. Hasar türü kozanın mevsimine bağlıdır: ilkbahar için elektrik, yaz için ateş, sonbahar için zehir veya kış için soğuk. Büyü sona erdiğinde ağaç solar ve geriye kalan tüm kozalar çürüyerek ardında büyüsel olmayan tohumlar bırakır. (spell rank)d6[cold] (spell rank)d6[electricity] (spell rank)d6[fire] (spell rank)d6[poison] Güçlendirilmiş (+1) Patlamanın hasarı 1d6 artar."

omen://spell/tricksters-twin?source=paizo-pathfinder-player-core:
  name: Hilebazın İkizi
  description: Yalnızca tek bir yerde olmakla nadiren yetinirsiniz. Hedefin görebildiği, hedeften 100 fit içindeki bir konum seçin. Orada yalnızca hedefin görebileceği ve tüm eylemlerinizi taklit eden bir yanılsamanızı yaratırsınız. Hedef bir İrade kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedef belirlenen konumda olduğunuza inanır ve gerçek konumunuzda sizi göremez. Yanılsamanın konumunda mantıklı olmayan bir eylem kullandığınızda veya hedef yanılsamaya saldırdığında, dokunduğunda, Taradığında ya da başka bir şekilde etkileşime girdiğinde yanılsamaya otomatik olarak inanmaz. Hedefe karşı düşmanca bir eylem kullanırsanız büyü sona erer. Başarısızlık Başarıdaki gibi, ancak listelenen olaylardan biri gerçekleştiğinde hedefin yanılsamaya inanmamak için bir İrade kurtarışında başarılı olması gerekir. Kritik Başarısızlık Başarıdaki gibi, ancak listelenen olaylardan biri gerçekleştiğinde hedefin inanmamak için bir İrade kurtarışında kritik başarı elde etmesi gerekir.

omen://spell/triple-time?source=paizo-pathfinder-player-core:
  name: Üç Zamanlı Ritim
  description: Müziğiniz hızlı bir tempo belirler. Siz ve alandaki tüm müttefikler 1 tur boyunca tüm Hareket Hızlarına +10 fitlik bir statü bonusu kazanırsınız.

omen://spell/true-target?source=paizo-pathfinder-player-core:
  name: Gerçek Hedef
  description: Düşmanınızın zarardan kaçınabileceği tüm yolları anlamak için sonraki birkaç saniyenin olası geleceklerine dalar, ardından bu geleceğin bir görüsünü etrafınızdakilere yansıtırsınız. Bir yaratık belirleyin. Gerçek hedefin süresi boyunca her hedefin o yaratığa karşı ilk kez saldırı zarı attığında, saldıran iki kez zar atar ve daha iyi olan sonucu kullanır. Saldıran ayrıca saldırı zarına gelen durumsal cezalarını ve belirlenen yaratığın Belirsiz veya Gizlenmiş olmasından kaynaklanan gerekli her türlü yalın testi yok sayar.

omen://spell/truesight?source=paizo-pathfinder-player-core:
  name: Hakikatgörüşü
  description: "60 fit içindeki şeyleri gerçekte oldukları gibi görürsünüz. GM, alandaki herhangi bir yanılsama, başkalaşım veya şekil değiştirme etkisine karşı gizli bir etkisizleştirme testi atar; ancak bu yalnızca sizin onun ardını görüp görmediğinizi belirleme amacı taşır (örneğin şekil değiştirme büyüsüne karşı test başarılı olursa yaratığın gerçek formunu görürsünüz, ancak şekil değiştirme büyüsünü sonlandırmazsınız)."

omen://spell/truespeech?source=paizo-pathfinder-player-core:
  name: Hakikatdili
  description: Hedef dilden bağımsız olarak tüm sözcükleri anlayabilir ve diğer yaratıkların dillerini de konuşabilir. Karışık bir yaratık grubundayken, hedef her konuştuğunda bir yaratık seçebilir ve hedefin bunun hangi dil olduğunu bilmese bile o yaratığın anladığı bir dilde konuşabilir. Güçlendirilmiş (7.) Süre 8 saattir.

omen://spell/umbral-journey?source=paizo-pathfinder-player-core:
  name: Gölgeler Yolculuğu
  description: "Yolculuklarınızı hızlandırmak için onun çarpık doğasını kullanarak kısmen Yeraltı Dünyası'na geçersiniz. Her saat başı, normalde 3 günde kat edeceğiniz mesafeyi kabaca kat edersiniz. İşaret noktaları somut olmaktan ziyade belirsiz ve semboliktir; büyüyü Sonlandırdığınızda veya süresi dolduğunda amaçladığınız varış noktanızın bir mili içinde kalırsınız."

omen://spell/uncontrollable-dance?source=paizo-pathfinder-player-core:
  name: Zapt Edilemez Dans
  description: Hedef karşı konulamaz bir dans etme dürtüsüne kapılır. Büyünün süresi boyunca hedef Gafil kalır ve reaksiyon kullanamaz. Etkilendiği sürece yaratık, Hareket Hızının yarısına kadar hareket etmek için Depar eylemini kullanmak dışında dans etmek hariç hareket eylemlerini kullanamaz. Kritik Başarı Hedef etkilenmez. Başarı Büyünün süresi 3 turdur ve hedef her turda dans ederek en az 1 eylem harcamalıdır. Başarısızlık Büyünün süresi 1 dakikadır ve hedef her turda dans ederek en az 2 eylem harcamalıdır. Kritik Başarısızlık Büyünün süresi 1 dakikadır ve hedef her turda tüm eylemlerini dans ederek harcamalıdır.

omen://spell/unfathomable-song?source=paizo-pathfinder-player-core:
  name: Akıl Almaz Şarkı
  description: Garip ve doğal olmayan bir şarkının uçucu notaları havayı doldurarak zihni ele geçirir. Büyüyü yaptığınızda ve her tur bu Büyüyü ilk kez Sürdürdüğünüzde her hedef bir İrade kurtarışı denemelidir. Bir yaratığın her tur şarkıya karşı yalnızca bir kurtarış denemesi gerekir ve Büyüyü Sürdürdüğünüzde aynı hedefleri korumanız gerekir. Kritik Başarı Hedef etkilenmez, sonraki turlarda etkilenemez ve 1 dakika boyunca geçici olarak bağışık olur. Başarı Hedef bu tur etkilenmez, ancak sonraki turlarda etkilenebilir. Başarısızlık Aşağıdaki tabloda 1d4 atın. Kritik Başarısızlık Aşağıdaki tabloda 1d4+1 atın. Sonuç Etki 1 Hedef Korkmuş 2 olur 2 Hedef 1 tur boyunca Aklı Bulanmış olur 3 Hedef 1 tur boyunca Zihni Bulanmış 4 olur 4 Hedef 1 tur boyunca Kör olur 5 Hedef 1 tur boyunca Sersemlemiş ve sınırsız süreyle Zihni Bulanmış 1 olur

omen://spell/unfettered-movement?source=paizo-pathfinder-player-core:
  name: Serbest Hareket
  description: Bir yaratığı engelleyecek veya hareketini yavaşlatacak etkileri savuşturursunuz. Bu büyünün etkisi altındayken hedef, Hızına durumsal ceza verecek etkileri yok sayar. Kendisini Hareketsiz Kılınmış, Kavranmış veya Bağlanmış hâle getiren bir etkiden Kurtulmayı denediğinde, etki büyüsel ve serbest hareket büyüsünden daha yüksek bir derecede olmadığı sürece otomatik olarak başarılı olur.

omen://spell/unfettered-pack?source=paizo-pathfinder-player-core:
  name: Serbest Sürü
  description: Yanınızda seyahat edenleri çevresel engellerden kurtarırsınız. Hedefler bitki örtüsünden, molozlardan, rüzgârlardan veya çevrenin diğer özelliklerinden kaynaklanan Hız durumsal cezalarını almaz ve bu tür çevresel özelliklerden kaynaklanan zorlu araziyi yok sayar. Güçlendirilmiş (9.) Hedefler ayrıca çevresel özelliklerden kaynaklanan büyük zorlu araziyi de yok sayar.

omen://spell/unimpeded-stride?source=paizo-pathfinder-player-core:
  name: Engelsiz Adım
  description: İlahi inayet hiçbir şeyin sizi tutsak edememesini veya geride tutamamasını sağlar. Etki engelsiz adım büyünüzden daha yüksek bir derecede olmadığı sürece, sizi Hareketsiz Kılınmış veya Kavranmış duruma getiren her büyülü etkiden derhal kurtulursunuz. Ardından Depar atarsınız. Bu hareket sırasında zorlu araziyi ve Hızınıza gelen her türlü koşul veya statü cezasını yok sayarsınız.

omen://spell/unity?source=paizo-pathfinder-player-core:
  name: Birlik
  description: >
    Tetikleyici Siz ve menzil içindeki 1 veya daha fazla müttefik, kurtarışa izin veren bir büyü veya yetenek tarafından hedeflenir.

    Birleşik bir savunma kurarsınız. Her müttefik, tetikleyici büyüye karşı kendi kurtarış değiştiricisi yerine sizinkini kullanabilir. Her müttefik hangi değiştiriciyi kullanacağına bireysel olarak karar verir.

omen://spell/unrelenting-observation?source=paizo-pathfinder-player-core:
  name: Amansız Gözlem
  description: "Bu büyü kehanete dayalı kusursuz bir görüş bahşederek birkaç gönüllü hedefin tek bir yaratığın veya nesnenin kesin hareketlerini ya da konumunu takip etmesini sağlar. Alanda izlenecek bir hedef yaratık veya nesne seçin. Büyünün algılayıcısı hâline gelir. Alanda seçtiğiniz beş adede kadar gönüllü yaratık, bu yaratık veya nesne görüş alanlarının dışındayken onun hayaletsi bir görüntüsünü görebilir. Yaratığı veya nesneyi kusursuz bir şekilde algılayabilirler, bu da Belirsiz ya da Görünmez durumunu yok saymalarını sağlar; ancak fiziksel engeller yine de siper sağlar. Takip eden yaratıklar, görüşlerini engelleyen kurşun veya akan su dışındaki tüm engellerin ardından izlenen yaratığı veya nesneyi görebilir. Mesafe fark etmez; ancak yaratık veya nesne o kadar uzağa hareket edebilir ki algılanamayacak kadar küçülebilir. Takip eden yaratıklar hedefin etrafındaki çevreyi görmezler; ancak bir yaratığın giydiği veya tuttuğu tüm donanımları görürler ve nesneleri üzerinden çıkarıp çıkarmadığını anlayabilirler. İzlenecek hedef gönüllüyse süre 1 saattir. Gönülsüz bir yaratığı izlemeye çalışırsanız, hedef bir İrade kurtarışı denemelidir. Kritik Başarı Yaratık veya nesne etkilenmez. Başarı Açıklandığı gibi ve süre 1 dakikadır. Başarısızlık Açıklandığı gibi ve süre 1 saattir."

omen://spell/untamed-form?source=paizo-pathfinder-player-core:
  name: Ehlileşmemiş Form
  description: "Kendi içinizdeki farklı bir parçaya uzanır ve onu serbest bırakarak bedeninizi başka bir forma dönüştürürsünüz. Zararlı Formu büyüsünde listelenen ve 10 dakika süren herhangi bir forma bürünebilirsiniz. Diğer tüm ehlileşmemiş form şekilleri 1 dakika sürer. Druid hünerleriyle ehlileşmemiş form listenize daha fazla şekil ekleyebilirsiniz; hüneriniz size belirli bir biçim değiştirme büyüsündeki şekillerin bir kısmını veya tamamını bahşedebilir. Bir büyü tarafından bahşedilen bir şekle dönüştüğünüzde, ehlileşmemiş formun derecesine güçlendirilmiş büyünün bir versiyonundan seçtiğiniz şeklin tüm etkilerini kazanırsınız. Ehlileşmemiş form, biçim değiştirme eğitiminizi çoğu biçim değiştirme büyüsünden daha kolay kullanmanızı sağlar. Biçim değiştirmişken formun varsayılan saldırı değiştiricisi yerine kendi saldırı değiştiricinizi kullanmayı seçtiğinizde, saldırı zarlarınıza +2 statü bonusu kazanırsınız. Güçlendirilmiş (2.) Hayvan Formu büyüsünde listelenen şekillere dönüşebilirsiniz."

omen://spell/untamed-shift?source=paizo-pathfinder-player-core:
  name: Ehlileşmemiş Dönüşüm
  description: "Bedeninizin yalnızca bir kısmını dönüştürürsünüz. Sahip olduğunuz ehlileşmemiş düzen hüneriyle eşleşen herhangi bir etkiyi seçin. Ehlileşmemiş Form Elleriniz inanılmaz derecede keskin pençelere dönüşür. Ehlileşmemiş pençeler bir silahsız saldırıdır; çevik ve incelikli özelliklerine sahiptir ve 1d6 kesici hasar verir. Bu büyüyle dönüştürülmüşken ellerinizle eşyaları tutmaya ve kullanmaya devam edebilirsiniz; ancak onunla saldırmak için bir elinizin boşta olması gerekir. Böcek Şekli Ağzınız ölümcül çenelere dönüşür. Ehlileşmemiş çeneler 1d8 delici hasar veren bir silahsız saldırıdır. Elementel Şekil Bedeninizi kısmen elementel maddeden oluşacak şekilde değiştirirsiniz; bu da size kritik vuruşlara ve zayıf nokta hasarına karşı direnç 5 kazandırır. Bitki Şekli Kollarınız uzun sarmaşıklara dönüşerek erişiminizi 10 fite çıkarır (veya erişimli bir silahla 15 fite). Süzülen Şekil Bu fayda için ehlileşmemiş dönüşümü 2 eylem kullanarak yapmalısınız. Sırtınızdan kanatlar çıkararak 30 fitlik bir uçma Hareket Hızı kazanırsınız. Güçlendirilmiş (6.) Listeden iki adede kadar etki seçebilirsiniz. Ehlileşmemiş pençeler korkunç, yırtık yaralar bırakarak isabet hâlinde ayrıca 2d6 süren kanama hasarı verir ve ehlileşmemiş çeneler zehirlidir, isabet hâlinde ayrıca 2d6 süren zehir hasarı verir. Güçlendirilmiş (10.) Listeden üç adede kadar etki seçebilirsiniz. Ehlileşmemiş pençeler isabet hâlinde 4d6 süren kanama hasarı verir ve ehlileşmemiş çeneler isabet hâlinde 4d6 süren zehir hasarı verir."

omen://spell/uplifting-overture?source=paizo-pathfinder-player-core:
  name: Canlandırıcı Uvertür
  description: Performansınız müttefiklere her şeyi başarabileceklermiş gibi hissettirir. Bu, seçtiğiniz bir beceri testinde müttefikinize Yardım Etmeye hazırlanmış sayılır. Daha sonra Yardım Et reaksiyonunu kullandığınızda, normal beceri testi yerine Gösteri atabilirsiniz ve bir başarısızlık atarsanız bunun yerine bir başarı elde edersiniz. Gösteri konusunda efsaneviyseniz, otomatik olarak kritik başarı elde edersiniz. Müttefikinizi cesaretlendirme eylemi beceri testine müdahale edecekse (sessizce Gizlice İlerlemek veya bir kılığı sürdürmek için yapılan bir test gibi) GM bu yeteneği kullanamayacağınıza hükmedebilir.

omen://spell/vampiric-exsanguination?source=paizo-pathfinder-player-core:
  name: Vampirik Kan Emme
  description: "Uzanmış kollarınız aracılığıyla diğer yaratıkların kanını ve yaşam gücünü çekersiniz. Temel bir Dayanıklılık kurtarışı ile alandaki canlı yaratıklara 12d6 hiçlik hasarı verirsiniz. Tek bir yaratığın bu büyüden aldığı hasarın yarısına eşit geçici Can Puanı kazanırsınız; bu geçici Can Puanlarını en çok hasar alan yaratığı kullanarak hesaplayın. Kalan geçici Can Puanlarını 1 dakika sonra kaybedersiniz. Güçlendirilmiş (+1) Hasar 2d6 artar."

omen://spell/vampiric-feast?source=paizo-pathfinder-player-core:
  name: Vampirik Ziyafet
  description: Dokunuşunuz kendinizi güçlendirmek için hedefin yaşam kanını emer. Hedefe 6d6 hiçlik hasarı verirsiniz. Hedefin aldığı hiçlik hasarının (dirençler ve benzerleri uygulandıktan sonra) yarısına eşit geçici Can Puanı kazanırsınız. Kalan geçici Can Puanlarını 1 dakika sonra kaybedersiniz. Güçlendirilmiş (+1) Hasar 2d6 artar.

omen://spell/vanishing-tracks?source=paizo-pathfinder-player-core:
  name: Kaybolan İzler
  description: Arkanızda bıraktığınız izleri gizlersiniz. Sizi İzini Sürmek için yapılan testlerin ZD'si +4 statü bonusu kazanır veya büyü ZD'nize eşit olur (hangisi daha yüksek bir ZD verirse). Güçlendirilmiş (2.) Süre 8 saate çıkar. Güçlendirilmiş (4.) Süre 8 saate çıkar. Büyünün menzili 20 fittir ve 10 adede kadar yaratığı hedefler.

omen://spell/vapor-form?source=paizo-pathfinder-player-core:
  name: Buhar Formu
  description: "Hedef buharımsı bir duruma dönüşür. Bu durumda hedef şekilsizdir. SD'ye gelen her türlü eşya bonusunu ve zırhtan gelen diğer tüm etkileri ile bonusları kaybeder; zırhsız savunma için uzmanlık değiştiricisini kullanır. Fiziksel hasara karşı direnç 8 kazanır ve zayıf nokta hasarına bağışıktır. Büyü yapamaz, eşyaları etkinleştiremez veya saldırı ya da manipülasyon özelliğine sahip eylemleri kullanamaz. 10 fitlik bir uçma Hareket Hızı kazanır ve minik çatlaklardan süzülebilir. Hedef büyüyü Sonlandırabilir."

omen://spell/veil-of-confidence?source=paizo-pathfinder-player-core:
  name: Özgüven Örtüsü
  description: Kendinizi bir özgüven örtüsüyle sararsınız. Mevcut Korkmuş durumunuzu 1 azaltırsınız ve süre boyunca ne zaman Korkmuş olacak olursanız, miktarı 1 azaltırsınız. Korkuya karşı bir kurtarışta kritik başarısızlık elde ederseniz, özgüven örtüsü bu etkiden kaynaklanan korkmuş değerinizi azaltır ve ardından sona erer.

omen://spell/veil-of-dreams?source=paizo-pathfinder-player-core:
  name: Düşler Tülü
  description: Haminiz hedefi uykulu bir hâle çekerek hayallere dalmasına ve halsizleşmesine neden olur. Hedef bir İrade kurtarışı denemelidir. Kritik Başarı Hedef etkilenmez. Başarı Hedef Dikkat testlerine, saldırı zarlarına ve İrade kurtarışlarına -1 statü cezası alır. Uyku etkilerine karşı İrade kurtarışlarında bu ceza -2'ye yükselir. Başarısızlık Başarıdaki gibi ve hedefin konsantrasyon eylemi kullandığı her seferde başarılı olması gerekir, aksi takdirde eylem bozulur.

omen://spell/veil-of-privacy?source=paizo-pathfinder-player-core:
  name: Mahremiyet Örtüsü
  description: Hedefin büyü yoluyla tespit edilmesini zorlaştıran koruyucu sihirler dikersiniz. Mahremiyet örtüsü, bu amaçla kantripleri 1. derece büyüler sayarak süre boyunca hedefe veya hedefin teçhizatına karşı kullanılan tüm tespit, ifşa ve kehanet etkilerini etkisizleştirmeyi dener. Bir alanı veya birden fazla hedefi hedefleyen bir büyüyü başarıyla etkisizleştirmek, yalnızca mahremiyet örtüsünün hedefi için etkileri geçersiz kılar.

omen://spell/ventriloquism?source=paizo-pathfinder-player-core:
  name: Vantrilokluk
  description: Ne zaman konuşsanız veya sesle başka bir ses çıkarsanız, sesinizin 60 fit içindeki başka bir yerden kaynaklanıyormuş gibi görünmesini sağlayabilir ve siz ses çıkarırken bu görünür konumu serbestçe değiştirebilirsiniz. Sesi duyan herhangi bir yaratık yanılsamanıza inanmamayı deneyebilir. Güçlendirilmiş (2.) Büyünün süresi 1 saate çıkar ve ayrıca sesinizin tonunu, niteliğini ve diğer yönlerini değiştirebilirsiniz. Bir yaratık yanılsamanıza inanmamayı denemeden önce, aktif olarak bir Dikkat testi denemeli veya sesle etkileşime girmek için eylemler kullanmalıdır.

omen://spell/vibrant-pattern?source=paizo-pathfinder-player-core:
  name: Canlı Örüntü
  description: Şiddetle titreşen bir ışık örüntüsü yaratırsınız. Yaratıklar örüntünün içindeyken Gözü Kamaşmış olur. Ayrıca bir yaratık, büyüyü yaptığınızda örüntünün içindeyse, örüntüye girdiğinde, sırasını örüntünün içinde tamamladığında veya örüntü üzerinde bir Tara ya da Etkileşime Gir eylemi kullandığında bir İrade kurtarış denemelidir. Halihazırda örüntü tarafından Kör edilmiş bir yaratığın yeni kurtarışlar denemesi gerekmez. Başarı Yaratık etkilenmez. Başarısızlık Yaratık örüntü tarafından Kör edilir. Örüntüden çıkarsa, en fazla 1 dakikalık bir süreye kadar sıralarının her birinin sonunda Kör durumundan kurtulmak için yeni bir kurtarış deneyebilir. Kritik Başarısızlık Yaratık 1 dakika boyunca Kör olur.

omen://spell/vibrant-thorns?source=paizo-pathfinder-player-core:
  name: Canlı Dikenler
  description: "Vücudunuzda yaşam büyüsüyle beslenen çalı gibi bir diken tabakası biter. Size yakın dövüş saldırısıyla vuran bitişikteki yaratıklar ve silahsız saldırılarla size vuran yaratıklar, bunu her yaptıklarında (spell rank)[piercing] hasar alır. Ne zaman bir canlılık büyüsü yapsanız, dikenlerin hasarı bir sonraki sıranızın başına kadar (spell rank)d6[piercing] hasara yükselir. Güçlendirilmiş (+1) Hasar 1 veya bir canlılık büyüsü yaptıktan sonra 1d6 artar."

omen://spell/vision-of-death?source=paizo-pathfinder-player-core:
  name: Ölüm Görüsü
  description: Hedefi kendi ölümünün bir görüsünü görmeye zorlarsınız. Bir İrade kurtarışı ile 8d6 zihinsel hasar alır. Hedef bu büyüyle 0 CP'ye düşürülürse, görüsü gerçeğe dönüşür ve onu anında öldürür. Kritik Başarı Hedef etkilenmez. Başarı Hedef yarı hasar alır ve Korkmuş 1 olur. Başarısızlık Hedef tam hasar alır ve Korkmuş 2 olur. Kritik Başarısızlık Hedef iki kat hasar alır, Korkmuş 4 olur ve korktuğu sürece Kaçan durumundadır. Güçlendirilmiş (+1) Hasar 2d6 artar.

omen://spell/vital-beacon?source=paizo-pathfinder-player-core:
  name: Yaşam Feneri
  description: "Canlılık sizden dışarı doğru yayılır ve başkalarının yakararak iyileşme almasına olanak tanır. Tur başına bir kez siz veya bir müttefikiniz, Can Puanı yenilemek için yakarıp ellerini üzerinize koymak amacıyla bir Etkileşime Gir eylemi kullanabilir. Fener birini her iyileştirdiğinde gücü azalır. İlk yaratığa (spell rank)d10[healing,vitality] Can Puanı, ikinciye (spell rank)d8[healing,vitality] Can Puanı, üçüncüye (spell rank)d6[healing,vitality] Can Puanı ve dördüncüye (spell rank)d4[healing,vitality] Can Puanı kazandırır; ardından büyü sona erer. Aynı anda yalnızca bir aktif yaşam fenerine sahip olabilirsiniz. Güçlendirilmiş (+1) Fener her iyileştirdiğinde, o basamak için diğerleriyle aynı zar boyutunu kullanarak fazladan bir zar Can Puanı yeniler."

omen://spell/vitality-lash?source=paizo-pathfinder-player-core:
  name: Canlılık Kırbacı
  description: Yaratılış Ocağı'ndan gelen enerjiyle hedefin yozlaşmış özünü yerle bir edersiniz. Temel bir Dayanıklılık kurtarışı ile 2d6 dirim hasarı verirsiniz. Yaratık kurtarışta kritik başarısızlık elde ederse, bir sonraki sıranızın başlangıcına kadar ayrıca Halsiz 1 olur. Güçlendirilmiş (+1) Hasar 1d6 artar.

omen://spell/void-warp?source=paizo-pathfinder-player-core:
  name: Boşluk Bükümü
  description: Yaşam gücüne zarar vermek için Hiçlik'i çağırırsınız. Hedef temel bir Dayanıklılık kurtarışı ile 2d4 hiçlik hasarı alır. Kritik başarısızlıkta hedef bir sonraki sıranızın başlangıcına kadar ayrıca Halsiz 1 olur. Güçlendirilmiş (+1) Hasar 1d4 artar.

omen://spell/volcanic-eruption?source=paizo-pathfinder-player-core:
  name: Volkanik Patlama
  description: "Alan 5 fit yarıçaplı, 80 fit yüksekliğinde silindir Zemin açılır ve dikey bir silindir hâlinde havaya yüksek bir lav sütunu püskürterek alandaki yaratıklara 14d6 ateş hasarı verir. Lav hızla soğur ve alandaki yaratıkları hapseder. Kayaya hapsolmuş bir yaratık Sakar 1 olur ve Hareket Hızlarına –10 fitlik statü cezası alır. Uçan bir yaratık için tüm normal arazi zorlu arazidir ve bu yaratıklar hapsedildikleri anda hemen 20 fit alçalır, ancak bu düşüşten hasar almazlar. Kayaya hapsolmuş bir yaratık etkiyi sonlandırmak için büyü ZD'nize karşı Kurtulmayı deneyebilir. Aksi takdirde yaratık toplam 50 hasar alana kadar hapsolmuş kalır ve bu da onu kayadan kurtarır. Buna ek olarak alandaki yaratıklar ve lav sütununun 5 fit yakınındakiler, kurtarışların sonuçlarına bakılmaksızın yoğun ısıdan otomatik olarak (spell rank -4)d6[fire] hasar alır. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık yarım hasar alır. Başarısızlık Yaratık tam hasar alır ve hapsolur. Kritik Başarısızlık Yaratık iki kat hasar alır ve hapsolur. Güçlendirilmiş (+1) Alandaki hasar 2d6 artar ve yoğun ısıdan gelen hasar 1d6 artar."

omen://spell/wails-of-the-damned?source=paizo-pathfinder-player-core:
  name: Lanetlilerin Feryadı
  description: Lanetli ruhların ağıdını haykırırsınız. Alandaki her canlı düşman 8d10 hiçlik hasarı alır ve bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Yaratık etkilenmez. Başarı Yaratık tam hasar alır. Başarısızlık Yaratık tam hasar alır ve İçi Çekilmiş 1d4 olur. Kritik Başarısızlık Yaratık iki kat hasar alır ve İçi Çekilmiş 4 olur.

omen://spell/waking-nightmare?source=paizo-pathfinder-player-core:
  name: Uyanık Kâbus
  description: Yaratığın zihnini dehşet verici bir görüyle doldurursunuz. Hedef bir İrade kurtarışı denemelidir. Bu büyüyle korkutulan bir yaratık, bir Vuruş ile her vurulduğunda 1 ilave zihinsel hasar alır. Kritik Başarı Hedef etkilenmez. Başarı Hedef Korkmuş 1 olur. Başarısızlık Hedef Korkmuş 2 olur. Uyuyorsa uyanır ve 1 tur boyunca Felçli olur. Kritik Başarısızlık Başarısızlıktaki gibi, ancak Korkmuş 3 olur. Güçlendirilmiş (+1) Zihinsel hasar 1 artar.

omen://spell/wall-of-fire?source=paizo-pathfinder-player-core:
  name: Ateş Duvarı
  description: "İçinden geçen yaratıkları yakan alevli bir duvar örersiniz. 60 fite kadar uzunlukta ve 10 fit yükseklikte düz bir hat üzerinde 5 fit kalınlığında bir alev duvarı ya da aynı yükseklikte 5 fit kalınlığında, 10 fit yarıçaplı bir alev halkası yaratırsınız. Duvar her iki formda da dikey olarak durur; dilerseniz duvar daha kısa bir uzunlukta veya yükseklikte olabilir. Duvarın her iki tarafındaki her şey, karşı taraftaki yaratıklardan Belirsiz durumdadır. Duvarı geçen veya sırasının başında duvarın alanını işgal eden herhangi bir yaratık 4d6 ateş hasarı alır. Güçlendirilmiş (+1) Ateş hasarı 1d6 artar."

omen://spell/wall-of-force?source=paizo-pathfinder-player-core:
  name: Güç Duvarı
  description: "50 fite kadar uzunlukta ve 20 fite kadar yükseklikte saf büyüsel güçten oluşan Görünmez bir duvar oluşturursunuz. Duvarın fark edilebilir bir kalınlığı yoktur. Kenarlarının hiçbir yaratığın veya nesnenin içinden geçmemesi için duvarı kesintisiz açık bir alanda yaratmalısınız, aksi takdirde büyü boşa gider. Duvar SD 10'a, Sertlik 30'a ve 60 Can Puanına sahiptir; kritik vuruşlara ve zayıf nokta hasarına karşı bağışıktır. Duvar fiziksel etkilerin içinden geçmesini engeller ve güçten yapıldığı için cismani olmayan ile ruhani yaratıkları da engeller. Işınlanma etkileri ve görsel etkiler (duvar görünmez olduğundan) engelden geçebilir. Güç duvarı kendi derecesinde veya daha düşük etkisizleştirme etkilerine karşı bağışıktır, ancak duvar herhangi bir derecedeki bir Ayrıştırma büyüsü tarafından otomatik olarak yok edilir. Güçlendirilmiş (+2) Duvarın Can Puanı 20 artar."

omen://spell/wall-of-ice?source=paizo-pathfinder-player-core:
  name: Buz Duvarı
  description: "Görüşü engelleyen ve parçalandığında düşmanları donduran bir buz bariyeri yontarsınız. 60 fite kadar uzunlukta ve 10 fit yükseklikte düz bir hat üzerinde 1 fit kalınlığında bir buz duvarı (duvarın dikey olması gerekmez ancak her iki taraftan katı bir yüzeye sabitlenmelidir) ya da 1 fit kalınlığında, 10 fit yarıçaplı bir buz yarım küresi yaratırsınız. Duvarı oluşturan buz opaktır. Dilerseniz duvar daha küçük bir uzunlukta, yükseklikte veya yarıçapta olabilir. Kenarlarının hiçbir yaratığın veya nesnenin içinden geçmemesi için duvarı kesintisiz açık bir alanda yaratmalısınız, aksi takdirde büyü boşa gider. Duvarın 10 fit × 10 fitlik her bölümü SD 10'a, Sertlik 10'a ve 40 Can Puanına sahiptir; kritik vuruşlara, soğuk hasarına ve zayıf nokta hasarına bağışıktır. Bir bölümün ayrıca ateşe karşı zaaf 15'i vardır; duvarın ateşle yok edilen bir bölümü eriyerek suya ve buhara dönüşür. Ateş dışındaki yollarla yok edilen bir bölüm, ardında zorlu arazi olan ve içinden geçen herhangi bir yaratığa 2d6 soğuk hasarı veren dondurucu bir buz kütlesi bırakır. Güçlendirilmiş (+2) Duvarın her bölümünün Can Puanı 10 artar ve yok edilmiş bir bölümden geçen yaratıklara verilen soğuk hasarı 1d6 artar."

omen://spell/wall-of-stone?source=paizo-pathfinder-player-core:
  name: Taş Duvar
  description: "Som taştan bir duvar şekillendirirsiniz. 120 fite kadar uzunlukta ve 20 fit yükseklikte 1 inç kalınlığında bir taş duvar yaratırsınız. Duvarın her 5 fitini kareler arasındaki sınıra yerleştirerek duvarın yolunu şekillendirebilirsiniz. Duvarın dikey olarak durması gerekmez, bu nedenle onu örneğin bir köprü veya merdiven seti oluşturmak için kullanabilirsiniz. Kenarlarının hiçbir yaratığın veya nesnenin içinden geçmemesi için duvarı kesintisiz açık bir alanda çağırmalısınız, aksi takdirde büyü boşa gider. Duvarın 10 fit × 10 fitlik her bölümü SD 10'a, Sertlik 14'e ve 50 Can Puanına sahiptir; kritik vuruşlara ve zayıf nokta hasarına bağışıktır. Duvarın yok edilen bir bölümünden geçilebilir, ancak ondan oluşan moloz zorlu arazidir. Güçlendirilmiş (+2) Duvarın her bölümünün Can Puanı 15 artar."

omen://spell/wall-of-thorns?source=paizo-pathfinder-player-core:
  name: Diken Duvarı
  description: "Yerden dikenli çalılardan bir duvar büyütürsünüz. 60 fite kadar uzunlukta ve 10 fit yükseklikte düz bir hat üzerinde 5 fit kalınlığında bir çalı ve diken duvarı yaratırsınız. Kenarlarının hiçbir yaratığın veya nesnenin içinden geçmemesi için duvarı kesintisiz açık bir alanda yaratmalısınız, aksi takdirde büyü boşa gider. Duvar dikey olarak durur. Dilerseniz duvar daha kısa bir uzunlukta veya yükseklikte olabilir. Duvarın her iki tarafındaki her şey karşı taraftaki yaratıklardan sipere sahiptir ve duvarın kareleri zorlu arazidir. Bir yaratığın duvarın karelerinden en az birine girmek için kullandığı her hareket eylemi için o yaratık 3d4 delici hasar alır. Duvarın 10 fit × 10 fitlik her bölümü SD 10'a, Sertlik 10'a ve 20 Can Puanına sahiptir. Kritik vuruşlara ve zayıf nokta hasarına bağışıktır. Yok edilen bir bölümden serbestçe geçilebilir. Güçlendirilmiş (+1) Duvarın her bölümünün Can Puanı 5 artar ve delici hasar 1d4 artar."

omen://spell/wall-of-wind?source=paizo-pathfinder-player-core:
  name: Rüzgâr Duvarı
  description: İçinden hareket eden her şeyi engelleyen sert rüzgârlardan bir bariyer yaratırsınız. Girdap gibi dönen rüzgârların duvarı 5 fit kalınlığında, 60 fit uzunluğunda ve 30 fit yüksekliğindedir. Duvar dikey olarak durur, ancak yolunu şekillendirebilirsiniz. Rüzgâr duvarı havayı bükse de görüşü engellemez. Duvar aşağıdaki etkilere sahiptir. Oklar, cıvalar, sapan mermileri ve benzer boyuttaki diğer nesneler gibi fiziksel menzilli saldırılardan gelen mühimmatlar duvardan geçemez. Cirit gibi daha büyük menzilli silahlarla yapılan saldırılar, yolları duvardan geçiyorsa saldırı zarlarına -2 durumsal ceza alır. Fiziksel nesneler yaratmayan masif menzilli silahlar ve büyü etkileri duvardan ceza almadan geçer. Duvar, içinden karadan geçmeye çalışan yaratıklar için zorlu arazidir. Buhar Formundaki yaratıklar dâhil gazlar duvardan geçemez. Bir hareket eylemi kullanarak duvardan uçmaya çalışan bir yaratık bir Dayanıklılık kurtarışı denemelidir. Kritik Başarı Yaratık bu tur duvardan normal şekilde geçebilir. Başarı Uçan yaratık bu tur duvardan geçebilir, ancak duvar zorlu arazidir. Başarısızlık Duvar uçan yaratığın hareketini durdurur ve mevcut eyleminden kalan herhangi bir hareket boşa gider. Kritik Başarısızlık Başarısızlıktaki gibi ve yaratık duvardan 10 fit uzağa itilir.

omen://spell/warp-mind?source=paizo-pathfinder-player-core:
  name: Zihin Bükümü
  description: Bir yaratığın zihinsel melekelerini ve duyusal algılarını altüst edersiniz. Hedef bir İrade kurtarış denemelidir. Bu kurtarışın sonucuna bakılmaksızın hedef ardından 10 dakika boyunca geçici olarak bağışık olur. Zihin bükümünün etkileri anında gerçekleşir, bu nedenle Büyüyü Boz ve büyüleri etkisizleştiren diğer etkiler bunları etkisizleştiremez. Ancak Dilek ritüelleri ve büyüsel olmayan etkileri giderebilen yetenekler etkileri yine de etkisizleştirebilir. Kritik Başarı Hedef etkilenmez. Başarı Hedef bir sonraki sırasındaki ilk eylemi Aklı Bulanmış durumuyla harcar. Başarısızlık Hedef 1 dakika boyunca Aklı Bulanmış olur. Kritik Başarısızlık Hedef kalıcı olarak Aklı Bulanmış olur.

omen://spell/water-breathing?source=paizo-pathfinder-player-core:
  name: Sualtı Solunumu
  description: Hedefler su altında nefes alabilir. Güçlendirilmiş (3.) Süre 8 saate çıkar. Güçlendirilmiş (4.) Süre bir sonraki günlük hazırlıklarınıza kadar çıkar.

omen://spell/water-walk?source=paizo-pathfinder-player-core:
  name: Su Üstünde Yürü
  description: Hedef batmadan suyun ve diğer sıvıların yüzeyinde yürüyebilir. Dilerse suyun altına girebilir, ancak bu durumda normal şekilde Yüzmelidir. Bu büyü su altında nefes alma yeteneği bahşetmez. Güçlendirilmiş (4.) Büyünün menzili 30 fite çıkar, süre 1 saate çıkar ve 10 adede kadar yaratığı hedefleyebilirsiniz.

omen://spell/wave-of-despair?source=paizo-pathfinder-player-core:
  name: Çaresizlik Dalgası
  description: "Alandaki yaratıklara çaresizlik aşılarsınız. Her yaratık için etkiler İrade kurtarışı ile belirlenir. Kritik Başarı Yaratık etkilenmez. Başarı 1 tur boyunca yaratık reaksiyon kullanamaz ve sırasının başında başka bir kurtarış denemelidir; başarısızlık durumunda kontrolsüzce hıçkıra hıçkıra ağlarken o sıra için Yavaşlatılmış 1 olur. Başarısızlık Başarıdaki gibi, ancak süre 1 dakikadır. Kritik Başarısızlık Başarısızlıktaki gibi ve yaratık 1 dakika boyunca otomatik olarak yavaşlatılmış 1 olur. Güçlendirilmiş (7.) Alan 60 fitlik bir koniye çıkar."

omen://spell/weapon-storm?source=paizo-pathfinder-player-core:
  name: Silah Fırtınası
  description: >
    Alan 30 fitlik koni veya 10 fitlik yayılım

    Tuttuğunuz bir silahı savurursunuz ve silah büyülü bir şekilde çoğalarak bir koni veya yayılım içindeki tüm yaratıklara hamle yapan kopyalara ayrılır. Bu kasırga, alandaki yaratıklara dört zar hasar verir. Bu hasar, silahla aynı türe sahiptir ve aynı zar boyutunu kullanır. Zar boyutunu silahla saldırıyormuşsunuz gibi belirleyin; örneğin iki elle kullanılan bir silahı iki elinizle birden tutuyorsanız, onun iki elle kullanım hasar zarını kullanırsınız.

    Kritik Başarı Yaratık etkilenmez.

    Başarı Hedef yarı hasar alır.

    Başarısızlık Hedef tam hasar alır.

    Kritik Başarısızlık Hedef iki kat hasar alır ve silahın kritik uzmanlaşma etkisine maruz kalır.

    Güçlendirilmiş (+1) Bir hasar zarı daha ekleyin.

omen://spell/weapon-surge?source=paizo-pathfinder-player-core:
  name: Silah Taşması
  description: >
    Silahınızı havaya kaldırarak ilahi enerjiyle doldurursunuz. Bir sonraki sıranızın başlangıcından önce bu silahla yapacağınız bir sonraki Vuruşunuzda, saldırı zarına +1 statü bonusu kazanırsınız, silah ilave 1d6 ruh hasarı verir ve Vuruş kerametli etiketini kazanır. Silah taşması, bu Vuruşu tamamladığınızda veya silah elinizden çıktığında sona erer.

    Güçlendirilmiş (5.) Vuruş ilave 2d6 ruh hasarı verir.

    Güçlendirilmiş (9.) Vuruş ilave 3d6 ruh hasarı verir.

omen://spell/whispering-quiet?source=paizo-pathfinder-player-core:
  name: Fısıltılı Sükûnet
  description: "Bir alandaki sesi bastırarak kimsenin değerli sırları ifşa etmesine izin vermezsiniz. Bu durum alandakilerin konuşmasını veya Büyü Yapmasını engellemez; ancak 5 fitten daha uzaktaki hiçbir yaratık, büyü ZD'nize karşı bir Dikkat testinde başarılı olmadan onların sesini duyamaz; bu da iletişimin yanı sıra işitsel veya dilsel etkilere müdahale edebilir. Alanda oluşturulan diğer sesler, sonik özelliğine sahip bir etki tarafından oluşturulmadığı sürece benzer bir ses düzeyine boğulur."

omen://spell/wilding-word?source=paizo-pathfinder-player-core:
  name: Yabanın Sözü
  description: >
    Haminizin ihtişamı—veya hoşnutsuzluğu—boğazınızdan bir hırıltı olarak dökülür ve diğer yaratıkların size zarar verme konusunda çekimser kalmasına yol açar. Hedef bir İrade kurtarışı denemelidir; yaratık bir hayvan, mantar veya bitkiyse, kurtarışa –1 durumsal ceza alır.

    Kritik Başarı Hedef etkilenmez.

    Başarı Hedef size zarar verecek bir saldırı zarı veya beceri testi denediğinde, zarına -2 statü cezası alır.

    Başarısızlık Başarıdaki gibi, ancak hedef size her hasar verdiğinde ayrıca Midesi Bulanmış 1 olur.

    Kritik Başarısızlık Başarısızlıktaki gibi, ancak midesi bulanmış değeri 2'dir.

omen://spell/wish?source=paizo-pathfinder-player-core:
  name: Dilek
  description: >
    Hedefin en büyük arzusunu gerçekleştirmek için gerçekliğin dokusunu bizzat örersiniz. Hedef, dileğini ritüelin başında ve sonunda yüksek bir sesle dile getirir. Hedefin dileği, muazzam zenginlikler ya da belirli bir büyünün veya ritüelin yapılması gibi daha basit dileklerden, koca bir krallığın yok edilmesi ya da tanrılığa yükselme gibi daha büyük dileklere kadar her şey olabilir. GM bir dileğin tanrıların veya diğer güçlü yaratıkların dikkatini çektiğine karar verebilir; bu da ritüele müdahale edilmesine veya dileğin geri alınması girişimlerine yol açabilir. Ritüelin gücü gerçekliği öylesine bir dereceye kadar değiştirir ki tanrılar bile dileği doğrudan tamamen geri alamaz; ancak örneğin yeni edinilen zenginlikleri ellerinden almaları için hizmetkârlar göndererek dileğe tepki verebilirler.

    Kritik Başarı Dilek hiçbir karmaşa veya sakınca olmaksızın gerçekleşir.

    Başarı Dilek gerçekleşir, ancak iyi bilinen bir suçludan zenginlik alınması, yaralı bir krallığın savaşa sürüklenmesi veya rakip tanrıların öfkelendirilmesi gibi istenmeyen sonuçlar ya da yan etkilerle birlikte.

    Başarısızlık Dilek başarısız olur ve hiçbir sonuç vermez. GM bunun yerine dileğin kısmen gerçekleşmesini sağlayabilir, ancak öylesine düşük bir derecede ki hedef sonsuza kadar tatminsiz kalır.

    Kritik Başarısızlık Dilek yozlaşır ve acımasız bir biçimde gerçekleşir. Sonuçların tamamını GM belirler, ancak netice genellikle doğası gereği ironiktir; örneğin zenginliklerle dolu bir yer altı mahzeninde kısılıp kalmak, yok edilirken o krallığa ışınlanmak veya erişilemez bir yarı düzlemde tanrılığa ulaşmak gibi.

omen://spell/word-of-freedom?source=paizo-pathfinder-player-core:
  name: Özgürlük Kelamı
  description: "Bir yaratığı serbest bırakan özgürleştirici bir güç kelamı söylersiniz. Seçtiğiniz şu durumlardan birini bastırırsınız: Aklı Bulanmış, Korkmuş, Kavranmış, Felçli veya Bağlanmış. Hedef seçilen durumdan etkilenmez; eğer Kavranmış veya Bağlanmış durumunu bastırırsanız, Büyüyü Yaptığınızda hedef kavramadan veya bağdan otomatik olarak kurtulur. Duruma yol açan etkiyi ortadan kaldırmazsanız, büyü sona erdikten sonra durum geri döner. Örneğin bir büyü hedefin 1 dakika boyunca Aklı Bulanmış olmasına neden oluyorsa, özgürlük kelamı hedefin bir tur boyunca normal davranmasını sağlar, ancak sonrasında Aklı Bulanmış durumu geri döner."

omen://spell/word-of-truth?source=paizo-pathfinder-player-core:
  name: Hakikat Kelamı
  description: "Doğru olduğuna inandığınız ve kelimeleri çarpıtma, eksik bırakma gibi yollarla aldatma girişimlerinden uzak bir beyanda bulunursunuz. Beyan 25 kelime veya daha az olmalıdır. Tanrınızın bir sembolü başınızın üzerinde parıldar ve büyünün süresi boyunca kalır; sizi gören ve konuştuğunuzu duyan herkes, söylediğiniz şeyin doğru olduğuna inandığınızı bilir. Bu dürüstlük güvencesi, sembol varlığını sürdürdüğü sürece Diplomasi testlerinize +2 statü bonusu kazandırır. Büyüyü Sonlandırabilirsiniz ve tamamen doğru olduğuna inanmadığınız bir şey söylerseniz, büyü beyanınızı tamamlamadan önce sona erer."

omen://spell/wrathful-storm?source=paizo-pathfinder-player-core:
  name: Gazap Fırtınası
  description: "Alanın üzerindeki havada devasa bir fırtına bulutu oluşarak yağmur ve şiddetli rüzgâr yayar. Rüzgâr, fiziksel menzilli saldırılara –4 durumsal ceza uygular. Alandaki hava, uçan yaratıklar için büyük zorlu arazidir. Bu Büyüyü Yaptığınızda ve sonraki turlarda her turda onu ilk kez Sürdürdüğünüzde aşağıdaki fırtına etkilerinden birini seçebilirsiniz. Art arda iki kez aynı etkiyi seçemezsiniz. Tipi Şiddetli kar fırtınası, kurtarış olmaksızın fırtınanın içindeki veya altındaki her yaratığa 4d8[cold] hasar verir. Bulutun içindeki veya altındaki her şey şiddetli kar fırtınası nedeniyle Belirsizdir ve her zemin zorlu arazidir. Dolu Fırtınanın içindeki veya altındaki her yaratık temel bir Dayanıklılık kurtarışıyla 4d10[bludgeoning] hasar alır. Şimşek Fırtınanın içinde veya altında şimşek çarpması için en fazla 10 yaratık seçin. Her biri temel bir Refleks kurtarışıyla 7d6[electricity] hasar alır. Hortum Bulutun içinde veya altında 30 fit yarıçapında kabaca silindirik bir hortum belirir. Hortumun içindeki her yaratık 40 fit yukarı fırlatılır. Güçlendirilmiş (10.) Menzil 2.000 fite çıkar ve bulut 1.000 fitlik bir patlamadır."

omen://spell/zeal-for-battle?source=paizo-pathfinder-player-core:
  name: Savaş Şevki
  description: >
    Tetikleyici Siz ve en az 1 müttefik inisiyatif atmak üzeresinizdir.

    Kendiniz ve bir müttefikiniz içindeki haklı öfkeyi körüklersiniz. Siz ve hedef müttefik birer d20 atarsınız ve her iki inisiyatif zarınız için de daha yüksek olan sonucu kullanırsınız. Her biriniz sonuçlarınızı belirlemek için yine kendi Dikkat bonusunuzu veya diğer istatistiğinizi kullanırsınız.

omen://spell/zealous-conviction?source=paizo-pathfinder-player-core:
  name: Şevkli İnanç
  description: >
    Hedeflerinizin rasyonel zihinlerini aşarak onlara sarsılmaz bir inanç ve şevk aşılarsınız. İnançları kendi bedenlerinden ve zihinlerinden gelen sinyalleri bastırırken, hedeflerin her biri 12 geçici Can Puanı ve zihinsel etkilere karşı İrade kurtarışlarına +2 statü bonusu kazanır. Bir hedefe bir şey yapmasını söylerseniz, isteğinize uymak zorundadır; ancak görevi normalde iğrenç veya kabul edilemez buluyorsa, bilişsel uyumsuzluk nedeniyle her tur sırasının sonunda bir İrade kurtarışı deneyebilir. Başarı hâlinde, kendi üzerindeki büyü etkilerini tamamen sonlandırır.

    Güçlendirilmiş (9.) Geçici Can Puanı 18'e çıkar ve İrade kurtarışlarına olan statü bonusu +3'e yükselir.
