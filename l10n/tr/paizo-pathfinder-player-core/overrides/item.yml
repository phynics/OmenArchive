# tr overrides: item

omen://item/adventurers-pack?source=paizo-pathfinder-player-core:
  name: Maceracı Çantası
  description: >
    Bu eşya, bir maceracı için başlangıç kiti olup keşif ve hayatta kalma için temel eşyaları içerir. Yük değeri paketin tamamı içindir, ancak gerektiğinde münferit eşyaların açıklamalarına bakın.
    Paket şu eşyaları içerir: bir sırt çantası, bir uyku tulumu, 10 parça tebeşir, çakmaktaşı ve çelik, 50 fitlik halat, 2 haftalık kumanya, sabun, 5 meşale ve bir matara.

omen://item/alchemists-lab-expanded?source=paizo-pathfinder-player-core:
  name: Simyacı Laboratuvarı (Genişletilmiş)
  description: >
    Dinlenme süresinde simyasal eşyalar Zanaat etmek için bir simyacı laboratuvarına ihtiyacınız vardır.
    Genişletilmiş bir simyacı laboratuvarı, simyasal eşyalar yaratmak için yapılan Zanaatkârlık testlerine +1 eşya bonusu verir.

omen://item/alchemists-lab?source=paizo-pathfinder-player-core:
  name: Simyacı Laboratuvarı
  description: Dinlenme süresinde simyasal eşyalar Zanaat etmek için bir simyacı laboratuvarına ihtiyacınız vardır.

omen://item/alchemists-toolkit?source=paizo-pathfinder-player-core:
  name: Simyacı Alet Takımı
  description: Tüpler ve kimyasallardan oluşan bu taşınabilir koleksiyon, basit simyasal görevler için kullanılabilir. Simyacı alet takımınızı kuşanıyorsanız, onu kullanan eylemin bir parçası olarak çekip yerine koyabilirsiniz.

omen://item/arbalest?source=paizo-pathfinder-player-core:
  name: Arbalest
  description: "Bu büyük ve iyi yapılmış tatar yayı, etkili bir şekilde kullanmak için biraz eğitim gerektirir; ancak hızını, gücünü ve isabetini en üst düzeye çıkaran son teknoloji bir ateşleme mekanizmasıyla monte edilmiştir."

omen://item/arrows?source=paizo-pathfinder-player-core:
  name: Oklar
  description: Bu mermiler yayların mühimmatıdır. Bir okun gövdesi ahşaptan yapılmıştır. Uçuş sırasında bir ucundaki yeleklerle dengelenir ve diğer ucunda metal bir baş taşır.

omen://item/artisans-toolkit-sterling?source=paizo-pathfinder-player-core:
  name: Zanaatkâr Alet Takımı (Som)
  description: >
    Zanaatkârlık becerisiyle ham maddelerden eşyalar yaratmak için bu aletlere ihtiyacınız vardır. Som zanaatkâr aletleri teste +1 eşya bonusu verir.
    OYK tarafından belirlendiği üzere, farklı işler için farklı takımlar gerekir; örneğin bir demircinin alet takımı bir marangozunkinden farklıdır. Zanaatkâr alet takımınızı kuşanıyorsanız, onu kullanan eylemin bir parçası olarak çekip yerine koyabilirsiniz.

omen://item/artisans-toolkit?source=paizo-pathfinder-player-core:
  name: Zanaatkâr Alet Takımı
  description: "Zanaatkârlık becerisiyle ham maddelerden eşyalar yaratmak için bu aletlere ihtiyacınız vardır. OYK tarafından belirlendiği üzere, farklı işler için farklı takımlar gerekir; örneğin bir demircinin alet takımı bir marangozunkinden farklıdır. Zanaatkâr alet takımınızı kuşanıyorsanız, onu kullanan eylemin bir parçası olarak çekip yerine koyabilirsiniz."

omen://item/backpack?source=paizo-pathfinder-player-core:
  name: Sırt Çantası
  description: Bir sırt çantası en fazla 4 Yük kadar eşya taşır ve bu eşyaların ilk 2 Yükü, Yük limitlerinize dahil edilmez. Çantayı sırtınıza takmak yerine elinizde taşıyor veya istifliyorsanız, Yükü ihmal edilebilir yerine hafif sayılır.

omen://item/basic-crafters-book?source=paizo-pathfinder-player-core:
  name: Temel Zanaat Kitabı
  description: Bu kitap, Pathfinder Player Core Bölüm 6'daki 0. seviye yaygın eşyaları Zanaat etmek için gerekli formülleri içerir.

omen://item/bastard-sword?source=paizo-pathfinder-player-core:
  name: Melez Kılıç
  description: Bazen bir buçuk elli kılıç olarak da adlandırılan bu geniş namlulu kılıç, tek elle tutulabilmesi veya ekstra kesme gücü sağlamak için iki elle kullanılabilmesi için daha uzun bir kabzaya sahiptir.

omen://item/battle-axe?source=paizo-pathfinder-player-core:
  name: Savaş Baltası
  description: Bu baltalar, aletten ziyade açıkça silah olarak tasarlanmıştır. Genellikle daha hafiftirler, metal şeritler veya cıvatalarla güçlendirilmiş bir sapa ve ahşap yerine uzuvları kesmek için ideal kılan daha keskin bir namluya sahiptirler.

omen://item/bedroll?source=paizo-pathfinder-player-core:
  name: Uyku Tulumu
  description: Rulo haline getirilmiş bir yatak.

omen://item/blowgun-darts?source=paizo-pathfinder-player-core:
  name: Üfleme Borusu İğneleri
  description: Bu ince ve hafif iğneler genellikle sert ahşaptan yapılır ve tüy ya da kürk yelekleriyle dengelenir. Genellikle zehir iletmek için kullanılabilsinler diye içleri boştur.

omen://item/blowgun?source=paizo-pathfinder-player-core:
  name: Üfleme Borusu
  description: Bu uzun, dar boru, yalnızca kuvvetle verilen bir nefesin gücünü kullanarak üfleme borusu iğnelerini fırlatmak için kullanılır.

omen://item/bo-staff?source=paizo-pathfinder-player-core:
  name: Bo Asası
  description: Bu sağlam ancak ince asa, uçlara doğru incelir ve iyi dengelenmiştir. Hem saldırı hem de savunma silahı olarak tasarlanmıştır.

omen://item/bola?source=paizo-pathfinder-player-core:
  name: Bola
  description: Bu fırlatma silahı, düşmanları dolaştırmak için kullanılabilen uzun kordonların ucuna bağlanmış ağırlıklardan oluşur.

omen://item/bolts?source=paizo-pathfinder-player-core:
  name: Tatar Yayı Okları
  description: Geleneksel oklardan daha kısa ancak benzer yapıda olan kundak okları, tatar yayları tarafından kullanılan mühimmattır.

omen://item/brass-ear?source=paizo-pathfinder-player-core:
  name: Pirinç Kulak
  description: "Pirinç kulak, bir ucu kulak kanalına rahatça oturacak kadar dar olan kısa, genişleyen bir borudur. Bir kapıdan, pencereden, ince duvardan veya benzeri bir engelden dinlemek için pirinç kulak kullanıldığında, engel diğer taraftaki sesleri duymak için yapacağınız Dikkat testinizin ZD'sini normalde artıracaksa, ZD normalin yalnızca yarısı kadar artar. Genel olarak işitme duyunuzu geliştirmek için uygun değildir; bu rol bir işitme cihazı tarafından daha iyi yerine getirilir."

omen://item/breastplate?source=paizo-pathfinder-player-core:
  name: Göğüslük
  description: Göğüslük olarak adlandırılsa da, bu zırh türü gövdeyi, göğsü, boynu ve bazen kalçaları ve alt bacakları koruyan birkaç levha veya Yarım Levha zırh parçasından oluşur. Stratejik olarak levha zırhın korumasının bir kısmını sağlarken daha fazla esneklik ve hız sunar.

omen://item/buckler?source=paizo-pathfinder-player-core:
  name: Küçük Kalkan
  description: >
    Bu çok küçük kalkan, düellocuların ve hızlı, hafif zırhlı savaşçıların favorisidir. Genellikle çelikten yapılır ve ön kolunuza kayışla bağlanır. O eliniz boş olduğu veya o elinizde silah olmayan hafif bir nesne tuttuğunuz sürece küçük kalkanınızla Kalkan Kaldırabilirsiniz.
    Sertlik
    CP
    KK
    3
    6
    3

omen://item/caltrops?source=paizo-pathfinder-player-core:
  name: Tuzak Dikenleri
  description: "Bu dört uçlu metal çiviler bir yaratığın ayaklarına zarar verebilir. Bitişiğinizdeki boş bir kareye bir Etkileşime Gir eylemiyle tuzak dikenleri saçabilirsiniz. O kareye giren ilk yaratık bir acrobatics|dc:14|name:Avoid Caltrops|showDC:all testinde başarılı olmalıdır; aksi takdirde 1d4[piercing] hasar ve 1 süren kanama hasarı alır. Tuzak dikenlerinden süren kanama hasarı alan bir yaratık Hızına –5 fitlik ceza alır. Tuzak dikenlerini söküp çıkarmak için bir Etkileşime Gir eylemi harcamak kanamayı durdurma ZD'sini düşürür. Bir yaratık tuzak dikenlerinden hasar aldığında, kareye giren diğer yaratıkların güvende olacağı kadar çivi bozulur. Dağıtılan tuzak dikenleri, hiçbir yaratık onlardan hasar almadıysa toplanıp yeniden kullanılabilir. Aksi takdirde kurtarılamayacak kadar fazlası bozulmuştur."

omen://item/candle?source=paizo-pathfinder-player-core:
  name: Mum
  description: Yanan bir mum 8 saat boyunca 10 fitlik bir yarıçapta loş ışık saçar.

omen://item/cane?source=paizo-pathfinder-player-core:
  name: Baston
  description: Baston, bir kancanın ucu gibi kavisli bir kabzaya sahip düz bir bastondur. Basit tasarımı dengeye yardımcı olur ve etkilenen karşı bacaktaki yükü hafifletmeye sadece biraz yardımcı olur. Baston genellikle 2 ila 3 fit uzunluğundadır, ancak gerektiğinde uzatılabilir veya kısaltılabilir.

omen://item/chain-10-feet?source=paizo-pathfinder-player-core:
  name: Zincir (10 Fit)
  description: 10 fit zincir.

omen://item/chain-mail?source=paizo-pathfinder-player-core:
  name: Zincir Zırh
  description: "Bir zincir zırh takımı, koruyucu bir örgü halinde birbirine bağlanmış küçük metal halkalardan oluşan birkaç zırh parçasından meydana gelir. Genellikle bir zincir gömlek, tayt, bir çift kol koruması ve bir başlık içerir; bunlar topluca vücudun çoğunu korur."

omen://item/chain-shirt?source=paizo-pathfinder-player-core:
  name: Zincir Gömlek
  description: Bazen hauberk olarak da adlandırılan bu giysi, zincir zırhla aynı metal halkalardan yapılmış uzun bir gömlektir. Ancak zincir zırhtan çok daha hafiftir ve yalnızca giyen kişinin gövdesini, üst kollarını ve üst bacaklarını korur.

omen://item/chair-storage?source=paizo-pathfinder-player-core:
  name: Sandalye Bölmesi
  description: Sandalye bölmesi satın alınabilir ve herhangi bir tekerlekli sandalyeye uygulanabilir. Bu, tıpkı bir sırt çantası gibi, sandalye içinde saklandığında eşyaların ağırlığının Yük miktarını azaltır. Sandalyenize yerleştirilen ilk 2 Yüklük eşya, Yük limitinize dahil edilmez. Hem sandalye bölmesini hem de bir sırt çantasını aynı anda kullanırsanız, tıpkı aynı anda birden fazla sırt çantası veya benzeri eşya kullandığınızda olduğu gibi limitinize karşı toplamda yalnızca 2 Yük sayılmaz.

omen://item/chalk?source=paizo-pathfinder-player-core:
  name: Tebeşir

omen://item/chest?source=paizo-pathfinder-player-core:
  name: Sandık
  description: Ahşap bir sandık 8 Yüke kadar eşya alabilir.

omen://item/clan-dagger?source=paizo-pathfinder-player-core:
  name: Klan Hançeri
  description: Bu geniş hançer cüceler tarafından bir silah, alet ve klanın bir simgesi olarak taşınır. Bir klan hançerini kaybetmek veya teslim etmek zorunda kalmak çoğu cüce için bir utanç işareti olarak kabul edilir.

omen://item/climbing-kit-extreme?source=paizo-pathfinder-player-core:
  name: Tırmanma Kiti (Ekstrem)
  description: >
    Bu çanta 50 fitlik ip, makaralar, bir düzine piton, bir çekiç, bir tırmanma kancası ve bir takım krampon içerir. Tırmanma kitleri, Tırmandığınız duvara kendinizi bağlamanıza olanak tanır; normalin yarısı hızda hareket edersiniz (en az 5 fit), ancak düşmeyi önlemek için kritik başarısız olduğunuz her an bir deneme yapmanıza izin verir.
    Ekstrem bir tırmanma kiti kullanırken Tırmanmak için yapılan Atletizm testlerine +1 eşya bonusu kazanırsınız. Tek bir kitte yalnızca bir tırmanıcı için yeterli malzeme bulunur; her tırmanıcının kendi kitine ihtiyacı vardır. Tırmanma kitinizi üzerinizde taşıyorsanız, bir Tırmanma eyleminin parçası olarak ona erişebilirsiniz.

omen://item/climbing-kit?source=paizo-pathfinder-player-core:
  name: Tırmanma Kiti
  description: "Bu çanta 50 fitlik ip, makaralar, bir düzine piton, bir çekiç, bir tırmanma kancası ve bir takım krampon içerir. Tırmanma kitleri, Tırmandığınız duvara kendinizi bağlamanıza olanak tanır; normalin yarısı hızda hareket edersiniz (en az 5 fit), ancak düşmeyi önlemek için kritik başarısız olduğunuz her an bir deneme yapmanıza izin verir. Tek bir kitte yalnızca bir tırmanıcı için yeterli malzeme bulunur; her tırmanıcının kendi kitine ihtiyacı vardır. Tırmanma kitinizi üzerinizde taşıyorsanız, bir Tırmanma eyleminin parçası olarak ona erişebilirsiniz."

omen://item/clothing-cold-weather?source=paizo-pathfinder-player-core:
  name: Giysi (Soğuk Hava)

omen://item/clothing-fine?source=paizo-pathfinder-player-core:
  name: Giysi (Seçkin)
  description: Bir soylu veya kraliyet mensubuna layık seçkin giysiler, pahalı kumaşlar, değerli metaller ve karmaşık desenlerle yapılır.

omen://item/clothing-high-fashion-fine?source=paizo-pathfinder-player-core:
  name: Giysi (Yüksek Moda Seçkin)
  description: Bir soylu veya kraliyet mensubuna layık seçkin giysiler, pahalı kumaşlar, değerli metaller ve karmaşık desenlerle yapılır. Yüksek moda seçkin giysiler giyerken soylular veya diğer üst sınıf halk üzerinde İzlenim Bırakmak için yapılan testlere +1 eşya bonusu kazanırsınız.

omen://item/clothing-ordinary?source=paizo-pathfinder-player-core:
  name: Giysi (Sıradan)
  description: Sıradan giysiler, köylü kıyafeti, keşiş cübbesi veya iş elbiseleri gibi temel terzilikle işlevseldir.

omen://item/club?source=paizo-pathfinder-player-core:
  name: Sopa
  description: Bu, bir düşmanı dövmek için şekillendirilmiş veya amaca uygun hale getirilmiş sağlam bir tahta parçasıdır. Sopalar ince işlenmiş dövüş sanatı eserleri olabileceği gibi, bir ağaç dalı veya tahta parçası kadar basit de olabilir.

omen://item/compass-lensatic?source=paizo-pathfinder-player-core:
  name: Pusula (Mercekli)
  description: >
    Düzgün manyetik alanlara sahip bir konumda olmanız koşuluyla, bir pusula Yönü Hissetmenize veya yolunuzu bulmanıza yardımcı olur. Pusula olmadan, bu testlere -2 eşya cezası alırsınız (kalitesiz bir eşya kullanmaya benzer şekilde).
    Mercekli bir pusula bu testlere +1 eşya bonusu verir.

omen://item/compass?source=paizo-pathfinder-player-core:
  name: Pusula
  description: Düzgün manyetik alanlara sahip bir konumda olmanız koşuluyla, bir pusula Yönü Hissetmenize veya yolunuzu bulmanıza yardımcı olur. Pusula olmadan, bu testlere -2 eşya cezası alırsınız (kalitesiz bir eşya kullanmaya benzer şekilde).

omen://item/composite-longbow?source=paizo-pathfinder-player-core:
  name: Kompozit Uzun Yay
  description: Bu mermili silah, çekiş gücünü ve mermisinin kuvvetini artırmak için boynuz, ahşap ve sinirin birbirine lamine edilmesiyle yapılmıştır. Tüm uzun yaylar gibi, büyük boyutu da yayın menzilini ve gücünü artırır. Ateşlemek için iki elinizi de kullanmalısınız ve binek üzerindeyken kullanılamaz. Erastil'in tercih edilen silahı gibi bir yetenek özellikle uzun yayla sınırlandırıldığında, aksi belirtilmedikçe kompozit uzun yaylar için de geçerlidir.

omen://item/composite-shortbow?source=paizo-pathfinder-player-core:
  name: Kompozit Kısa Yay
  description: Bu kısa yay, çekiş gücünü ve mermisinin kuvvetini artırmak için boynuz, ahşap ve sinirin birbirine lamine edilmesiyle yapılmıştır. Kompakt boyutu ve gücü, onu atlı okçuların favorisi yapar. Bir yetenek özellikle kısa yayla sınırlandırıldığında, aksi belirtilmedikçe kompozit kısa yaylar için de geçerlidir.

omen://item/concealed-sheath?source=paizo-pathfinder-player-core:
  name: Gizli Kın
  description: >
    Bu deri kın, hafif Yüke kadar bir eşyayı alacak kadar geniştir ve tipik olarak hançerler, asalar, hırsız aletleri ve benzeri nesneler için kullanılır.
    İçindeki eşyayı gizlemek veya saklamak için yapılan Gizlilik testlerine ve ZD'lerine +1 eşya bonusu kazanmak için onu bir çizmenin içine, bir kolçak veya kolun altına ya da göze çarpmayan başka konumlara tutturabilirsiniz.

omen://item/cookware?source=paizo-pathfinder-player-core:
  name: Pişirme Takımı

omen://item/copper-pieces?source=paizo-pathfinder-player-core:
  name: Bakır Paralar

omen://item/corrective-lenses?source=paizo-pathfinder-player-core:
  name: Düzeltici Mercekler
  description: Bir düzeltici mercek seti, gözlük veya gözlerin üzerine takılan özel koruyucu gözlükler şeklinde olabilir. Düzeltici merceklerinizi bir Etkileşime Gir eylemi olarak takabilir veya çıkarabilirsiniz.

omen://item/crossbow?source=paizo-pathfinder-player-core:
  name: Tatar Yayı
  description: Bu menzilli silah, kundak adı verilen kulplu bir gövdeye monte edilmiş yay benzeri bir düzeneğe sahiptir. Kundakta, gerginliği serbest bırakan ve bir kundak okunu fırlatan bir tetik mekanizmasına bağlı, kirişi yerinde kilitleyen bir mekanizma bulunur.

omen://item/crowbar-levered?source=paizo-pathfinder-player-core:
  name: Levye (Kaldıraçlı)
  description: >
    Kolay bir tutuşu olmayan bir nesneyi Zorla Açarken, levye gerekli kaldıracı elde etmeyi kolaylaştırır. Levye olmadan, bir şeyi kanırtarak açmak Zorla Açmak için yapılan Atletizm testine -2 eşya cezası alır.
    Kaldıraçlı bir levye, kanırtılarak açılabilecek herhangi bir şeyi Zorla Açmak için yapılan Atletizm testlerine +1 eşya bonusu verir.

omen://item/crowbar?source=paizo-pathfinder-player-core:
  name: Levye
  description: Kolay bir tutuşu olmayan bir nesneyi Zorla Açarken, levye gerekli kaldıracı elde etmeyi kolaylaştırır. Levye olmadan, bir şeyi kanırtarak açmak Zorla Açmak için yapılan Atletizm testine -2 eşya cezası alır.

omen://item/crutch?source=paizo-pathfinder-player-core:
  name: Koltuk Değneği
  description: Koltuk değnekleri, yürürken ne kadar desteğe ihtiyacınız olduğuna bağlı olarak tek veya çift halinde gelir. Koltuk değneği koltuk altınıza oturur ve onunla hareket etmek için elinizi ve kolunuzun salınımını kullanırsınız.

omen://item/dagger?source=paizo-pathfinder-player-core:
  name: Hançer
  description: Bu küçük namlulu silah tek elle tutulur ve yakın dövüşte bir yaratığı bıçaklamak için kullanılır. Fırlatılabilir de.

omen://item/dart?source=paizo-pathfinder-player-core:
  name: Dart
  description: Bu fırlatma silahı bir oktan daha büyük ancak bir ciritten daha kısadır. Tipik olarak metal bir uçla sonlanan kısa bir ahşap gövdeye sahiptir ve bazen tüyler veya kürklerle dengelenir.

omen://item/detectives-kit?source=paizo-pathfinder-player-core:
  name: Dedektif Kiti
  description: Bu deri çanta boş tüpler, bir cımbız, küçük keten bezler, mesafeleri ölçmek için pirinç kumpaslar ve düğümlü bir ip, birkaç parça tebeşir, bir kalem ve not tutmak için boş bir not defteri içerir. Bir dedektif kitinin her bileşeni üstün kalitededir ve bu nedenle dedektif kiti bir suç mahallini, ipucunu veya benzeri ayrıntıları araştırmak için yapılan testlere +1 eşya bonusu ekler. Diğer alet takımları gibi, dedektif kiti de kiti kuşanmışsanız bir el, aksi takdirde iki el gerektirir.

omen://item/disguise-kit-elite-cosmetics?source=paizo-pathfinder-player-core:
  name: Kılık Değiştirme Kiti (Seçkin Kozmetik)
  description: Bu küçük ahşap kutu kozmetik malzemeleri, takma sakal-bıyık, yapıştırıcı ve birkaç basit peruk içerir. Aldatma becerisini kullanarak birinin Kılığına Girmek amacıyla bir kılık hazırlamak için genellikle bir kılık değiştirme kitine ihtiyacınız vardır. Seçkin bir kılık değiştirme kiti ilgili testlere +1 eşya bonusu ekler. Çok sayıda kılık hazırladıysanız, kozmetik stoğunuzu kılık değiştirme kitinizin türüne uygun yedek kozmetiklerle yenileyebilirsiniz.

omen://item/disguise-kit-elite?source=paizo-pathfinder-player-core:
  name: Kılık Değiştirme Kiti (Seçkin)
  description: Bu küçük ahşap kutu kozmetik malzemeleri, takma sakal-bıyık, yapıştırıcı ve birkaç basit peruk içerir. Aldatma becerisini kullanarak birinin Kılığına Girmek amacıyla bir kılık hazırlamak için genellikle bir kılık değiştirme kitine ihtiyacınız vardır. Seçkin bir kılık değiştirme kiti ilgili testlere +1 eşya bonusu ekler. Çok sayıda kılık hazırladıysanız, kozmetik stoğunuzu kılık değiştirme kitinizin türüne uygun yedek kozmetiklerle yenileyebilirsiniz. Kuşanılmış bir kılık değiştirme kitini, onu kullanan eylemin bir parçası olarak çekip yerine koyabilirsiniz.

omen://item/disguise-kit-replacement-cosmetics?source=paizo-pathfinder-player-core:
  name: Kılık Değiştirme Kiti (Yedek Kozmetik)
  description: Bu küçük ahşap kutu kozmetik malzemeleri, takma sakal-bıyık, yapıştırıcı ve birkaç basit peruk içerir. Aldatma becerisini kullanarak birinin Kılığına Girmek amacıyla bir kılık hazırlamak için genellikle bir kılık değiştirme kitine ihtiyacınız vardır. Çok sayıda kılık hazırladıysanız, kozmetik stoğunuzu kılık değiştirme kitinizin türüne uygun yedek kozmetiklerle yenileyebilirsiniz.

omen://item/disguise-kit?source=paizo-pathfinder-player-core:
  name: Kılık Değiştirme Kiti
  description: Bu küçük ahşap kutu kozmetik malzemeleri, takma sakal-bıyık, yapıştırıcı ve birkaç basit peruk içerir. Aldatma becerisini kullanarak birinin Kılığına Girmek amacıyla bir kılık hazırlamak için genellikle bir kılık değiştirme kitine ihtiyacınız vardır. Çok sayıda kılık hazırladıysanız, kozmetik stoğunuzu kılık değiştirme kitinizin türüne uygun yedek kozmetiklerle yenileyebilirsiniz. Kuşanılmış bir kılık değiştirme kitini, onu kullanan eylemin bir parçası olarak çekip yerine koyabilirsiniz.

omen://item/dogslicer?source=paizo-pathfinder-player-core:
  name: Köpekbiçen
  description: Bu kısa, kavisli ve kaba derme çatma namlunun ağırlığını azaltmak için üzerinde genellikle delikler açılmıştır. Goblinlerin gözde silahıdır.

omen://item/dueling-cape?source=paizo-pathfinder-player-core:
  name: Düello Pelerini
  description: >
    Giydiğiniz düello pelerinini bir Etkileşime Gir eylemi ile omzunuzdan çekip kolunuza sarabilirsiniz. Düello pelerinini bu şekilde kullanırken pelerin o kolu ve eli kaplar ve o elinizde başka hiçbir şey tutamazsınız.
    Bunu yaparken bir eylem harcayarak onu koruyucu bir konumda tutabilir, bir sonraki sıranızın başlangıcına kadar Savunma Değerinize ve Sahte Hareket yapmak için yapılan Aldatma testlerine +1 durumsal bonus kazanırsınız.

omen://item/dwarven-war-axe?source=paizo-pathfinder-player-core:
  name: Cüce Savaş Baltası
  description: Cücelerin bu gözde silahı, kalın bir sapa monte edilmiş büyük ve süslü bir başa sahiptir. Bu güçlü balta tek elle veya iki elle kullanılabilir.

omen://item/elven-curve-blade?source=paizo-pathfinder-player-core:
  name: Elf Eğri Kılıcı
  description: Esasen palanın daha uzun bir versiyonu olan bu geleneksel elf silahı, akrabasından daha ince bir namluya sahiptir.

omen://item/explorers-clothing?source=paizo-pathfinder-player-core:
  name: Kâşif Giysisi
  description: Zırh giymeyen maceracılar dayanıklı giysilerle seyahat ederler. Zırh olmamasına ve zırhsız savunma ustalığınızı kullanmasına rağmen, yine de bir Çev Sınırına sahiptir ve potansiyel rünleri işlendiğinde Savunma Değerine bir eşya bonusu verebilir.

omen://item/falchion?source=paizo-pathfinder-player-core:
  name: Falyon
  description: Bu silah kavisli namlulu palanın daha ağır, iki elli bir versiyonudur. Namlunun ucuna doğru ağırlık verilmiş olup güçlü bir kesme silahıdır.

omen://item/filchers-fork?source=paizo-pathfinder-player-core:
  name: Yankesici Çatalı
  description: Bu buçukluk silahı uzun, iki uçlu bir çatala benzer ve hem silah hem de yemek pişirme aleti olarak kullanılır.

omen://item/fishing-tackle-professional?source=paizo-pathfinder-player-core:
  name: Balık Takımı (Profesyonel)
  description: Bu kit katlanabilir bir olta, oltalar, misina, yemler ve bir balık ağı içerir. Profesyonel balık takımı balık tutma testlerine +1 eşya bonusu verir.

omen://item/fishing-tackle?source=paizo-pathfinder-player-core:
  name: Balık Takımı
  description: Bu kit katlanabilir bir olta, oltalar, misina, yemler ve bir balık ağı içerir.

omen://item/flail?source=paizo-pathfinder-player-core:
  name: Zincirli Gürz
  description: Bu silah bir zincir, ip veya deri kayışla dikenli bir topa veya silindire tutturulmuş ahşap bir saptan oluşur.

omen://item/flint-and-steel?source=paizo-pathfinder-player-core:
  name: Çakmaktaşı ve Çelik
  description: "Kıvılcım yakalamak için zamanınız varsa, çakmaktaşı ve çelik ateş yakmada kullanışlıdır; ancak bunları kullanmak genellikle bir karşılaşma sırasında pratik olamayacak kadar zaman alıcıdır. İdeal koşullarda bile bir alev yakmak için çakmaktaşı ve çelik kullanmak en az 3 eylem ve genellikle çok daha uzun süre gerektirir."

omen://item/formula-book-blank?source=paizo-pathfinder-player-core:
  name: Formül Kitabı (Boş)
  description: "Bir formül kitabı, Pathfinder Player Core'daki yaygın ekipman dışındaki eşyaları yapmak için gerekli formülleri barındırır; simyacı sınıfındaki karakterler genellikle ücretsiz bir tane edinir. Her formül kitabı 100 farklı eşyaya kadar formül tutabilir. Formüller parşömen kâğıtlarında, tabletlerde ve neredeyse diğer her türlü ortamda da bulunabilir; başvurmak için elinizin altında tutabildiğiniz sürece bunları belirli bir kitaba kopyalamanıza gerek yoktur."

omen://item/full-plate?source=paizo-pathfinder-player-core:
  name: Tam Levha Zırh
  description: "Levha zırh, neredeyse tüm vücudu çelikten bir kabuk içine alan birbirine geçmiş plakalardan oluşur. Masraflı ve ağırdır ve giyen kişi düzgün giyinmek için genellikle yardıma ihtiyaç duyar; ancak zırhın sağlayabileceği en iyi savunmalardan bazılarını sunar. Bu zırh takımı, Dolgulu Zırhtan bir içlik ve bir çift zırh eldiveni ile birlikte gelir."

omen://item/gauntlet?source=paizo-pathfinder-player-core:
  name: Zırh Eldiveni
  description: "Bu metal eldivenlerden bir çift tam levha, yarım levha ve şeritli zırhla birlikte gelir; ayrıca ayrı olarak satın alınabilir ve diğer zırh türleriyle birlikte giyilebilir. Yalnızca ellerinizi korumakla kalmaz, aynı zamanda ellerinizi ölümcül silahlara dönüştürür."

omen://item/glaive?source=paizo-pathfinder-player-core:
  name: Glayv
  description: Bu gönderli silah, 7 fitlik bir sırığın ucunda tek kenarlı uzun bir namludan oluşur. Uzaktan ölümcül kesikler indirmede son derece etkilidir.

omen://item/gnome-flickmace?source=paizo-pathfinder-player-core:
  name: Gnom Fırlatma Topuzu
  description: Bir gürzden ziyade bir zincirli gürz olan bu silah, ucunda bir gülle bulunan bir zincir parçasına tutturulmuş kısa bir sapa sahiptir. Gülle, bileğin bir hareketiyle erişim mesafesine fırlatılır ve bu hareketin ivmesi, vuruştan sonra gülleyi kullanan kişiye geri getirir.

omen://item/gnome-hooked-hammer?source=paizo-pathfinder-player-core:
  name: Gnom Kancalı Çekici
  description: Bu gnom aleti ve silahı, bir ucunda bir çekiç ve diğer ucunda kavisli bir kazma barındırır. O kadar tuhaf ve hantal bir silahtır ki, diğerleri gnomların bunu kullandıkları için biraz dengesiz olduğunu düşünür.

omen://item/gold-pieces?source=paizo-pathfinder-player-core:
  name: Altın Paralar

omen://item/grappling-hook?source=paizo-pathfinder-player-core:
  name: Tırmanma Kancası
  description: Tırmanmayı kolaylaştırmak için ucuna ip bağlı bir tırmanma kancası fırlatabilirsiniz. Bir tırmanma kancasını sabitlemek için hedefe bağlı olan bir ZD'ye (tipik olarak en az ZD 20) karşı basit silah ustalığınızı kullanarak menzilli bir saldırı zarı atın. Bu saldırı gizli özelliğine sahiptir. Başarı durumunda kancanız sağlam bir tutuş elde eder, ancak kritik başarısızlıkta kanca tutacakmış gibi görünür ancak yolun yarısındayken düşer.

omen://item/greataxe?source=paizo-pathfinder-player-core:
  name: Büyük Balta
  description: "Bu büyük savaş baltası yalnızca tek elle kullanılamayacak kadar ağırdır. Birçok büyük balta iki namlu barındırır ve doğrama güçlerinin kuvvetini artırmak için genellikle alt kısmında bir kanca bulunan \"sakallı\" yapıdadır."

omen://item/greatclub?source=paizo-pathfinder-player-core:
  name: Tokaç
  description: Pek çok tokaç ince işlemeli olsa da, bazıları sağlam bir ağaç dalından biraz daha fazlasıdır. Bu devasa sopalar yalnızca tek elle kullanılamayacak kadar ağırdır.

omen://item/greatpick?source=paizo-pathfinder-player-core:
  name: Büyük Kazma
  description: Bu kazma, normal bir kazmadan daha uzun bir sapa ve daha geniş bir başa sahiptir. Tek elle kullanılamayacak kadar ağırdır.

omen://item/greatsword?source=paizo-pathfinder-player-core:
  name: Büyük Kılıç
  description: Bu devasa iki elli kılıç, neredeyse onu kullanan kişi kadar uzundur. Alt namlusu, yakın mesafeli dövüşlerde ekstra kaldıraç sağlamak amacıyla kavranabilmesi için genellikle biraz köreltilmiştir.

omen://item/guisarme?source=paizo-pathfinder-player-core:
  name: Gizarm
  description: "Bu gönderli silah, namlunun kör tarafından çıkıntı yapan bir kancaya sahip uzun, genellikle tek taraflı kavisli bir namlu taşır; bu da kullanan kişinin uzaktaki rakipleri çelmelemesine olanak tanır. Sapı genellikle 8 fit uzunluğundadır."

omen://item/halberd?source=paizo-pathfinder-player-core:
  name: Kargı
  description: Bu gönderli silah nispeten kısa, 5 fitlik bir sırığa sahiptir. İşlev gören ucu, balta namlusu takılmış uzun bir sivri uçtur.

omen://item/half-plate?source=paizo-pathfinder-player-core:
  name: Yarım Levha Zırh
  description: Yarım levha, kollar ve bacaklar için daha hafif veya daha seyrek çelik levha korumasıyla birlikte tam levha zırhta kullanılan üst gövde plakalarının çoğundan oluşur. Bu, daha fazla esneklik ve hız ile birlikte tam levha zırhın sağladığı korumanın bir kısmını sunar. Bu zırh takımı, Dolgulu Zırhtan bir içlik ve bir çift zırh eldiveni ile birlikte gelir.

omen://item/halfling-sling-staff?source=paizo-pathfinder-player-core:
  name: Buçukluk Sapan Asası
  description: Bu asa, bir sapanı saran Y şeklinde bir çatalla sonlanır. Asanın uzunluğu, sapandan taş veya mermi fırlatmak için iki elle kullanıldığında mükemmel bir kaldıraç gücü sağlar.

omen://item/hammer?source=paizo-pathfinder-player-core:
  name: Çekiç

omen://item/hand-crossbow?source=paizo-pathfinder-player-core:
  name: El Tatar Yayı
  description: Hırsızlar veya kaba saba tipler tarafından bazen sokak yayı olarak adlandırılan bu küçük tatar yayı, bazen hedefe zehir iletmek için kullanılan küçük kundak okları fırlatır. Tek elle ateşlenebilecek kadar küçüktür, ancak doldurmak için yine de iki el gerekir.

omen://item/hatchet?source=paizo-pathfinder-player-core:
  name: Nacak
  description: Bu küçük balta yakın dövüşte kullanılabilir veya fırlatılabilir.

omen://item/healers-toolkit-expanded?source=paizo-pathfinder-player-core:
  name: Şifacı Alet Takımı (Genişletilmiş)
  description: "Bandajlar, şifalı otlar ve dikiş aletlerinden oluşan bu kit; İlk Yardım Uygulamak, Hastalık Tedavi Etmek, Zehir Tedavi Etmek veya Yaraları Tedavi Etmek için yapılan Tababet testlerinde gereklidir. Genişletilmiş şifacı alet takımları bu tür testlere +1 eşya bonusu sağlar. Şifacı alet takımınızı kuşanıyorsanız, aletlerini kullanan eylemin bir parçası olarak çekip yerine koyabilirsiniz."

omen://item/healers-toolkit?source=paizo-pathfinder-player-core:
  name: Şifacı Alet Takımı
  description: "Bandajlar, şifalı otlar ve dikiş aletlerinden oluşan bu kit; İlk Yardım Uygulamak, Hastalık Tedavi Etmek, Zehir Tedavi Etmek veya Yaraları Tedavi Etmek için yapılan Tababet testlerinde gereklidir. Şifacı alet takımınızı kuşanıyorsanız, aletlerini kullanan eylemin bir parçası olarak çekip yerine koyabilirsiniz."

omen://item/hearing-aid?source=paizo-pathfinder-player-core:
  name: İşitme Cihazı
  description: Bir işitme cihazı kulağın içine takılır ve oyma ahşaptan, şekillendirilmiş metalden ve hatta küçük saat mekanizmalı parçalardan yapılır. Cihazın şekli işitme güçlüğü çekenlere yardımcı olur ve işitme kaybınıza bağlı olarak bir veya iki tane takabilirsiniz. İşitme cihazlarınızı bir Etkileşime Gir eylemi olarak takabilir veya çıkarabilirsiniz.

omen://item/heavy-barding-large?source=paizo-pathfinder-player-core:
  name: Ağır Koşum Zırhı (Büyük)

omen://item/heavy-barding-small-or-medium?source=paizo-pathfinder-player-core:
  name: Ağır Koşum Zırhı (Küçük veya Orta)

omen://item/heavy-crossbow?source=paizo-pathfinder-player-core:
  name: Ağır Tatar Yayı
  description: Bu büyük tatar yayını kurmak normal bir tatar yayına göre daha zordur ve daha cüsselidir, ancak daha büyük bir darbe indirir.

omen://item/hide-armor?source=paizo-pathfinder-player-core:
  name: Post Zırh
  description: "Kürkler, sağlam post ve bazen kalıplanmış kaynatılmış derinin bir karışımı olan bu zırh, deri katmanları sayesinde koruma sağlar; ancak hantallığı giyen kişiyi yavaşlatır ve hareket kabiliyetini azaltır."

omen://item/horsechopper?source=paizo-pathfinder-player-core:
  name: Atbiçen
  description: Atlarla savaşmak için goblinler tarafından yaratılan bu silah, esasen büyük bir kancaya sahip bir namluyla sonlanan uzun bir saptır.

omen://item/hourglass?source=paizo-pathfinder-player-core:
  name: Kum Saati

omen://item/javelin?source=paizo-pathfinder-player-core:
  name: Cirit
  description: Bu ince mızrak fırlatılmak için iyi dengelenmiştir ancak yakın dövüş kullanımı için tasarlanmamıştır.

omen://item/kama?source=paizo-pathfinder-player-core:
  name: Kama
  description: Bir orağa benzeyen ve bazı bölgelerde tahıl biçmek için kullanılan kamada kısa, hafif kavisli bir namlu ve ahşap bir sap bulunur.

omen://item/katana?source=paizo-pathfinder-player-core:
  name: Katana
  description: Katana, son derece keskin namlusuyla bilinen kavisli, tek kenarlı bir kılıçtır.

omen://item/katar?source=paizo-pathfinder-player-core:
  name: Katar
  description: Yumruk hançeri olarak da bilinen katarlar, namlunun eklem yerlerinden dışarı fırlamasına olanak tanıyan H şeklindeki el kabzasıyla karakterize edilir.

omen://item/khakkhara?source=paizo-pathfinder-player-core:
  name: Khakkhara
  description: "Bu asanın tepesinde sivri uçlu metal bir daire bulunur ve bu daireden, asa hareket ettirildikçe gürültülü bir şekilde şıngırdayıp çınlayan birkaç küçük halka sarkar; bu sayede yürürken varlığınızı duyurabilir ve vahşi hayvanları korkutup kaçırabilirsiniz."

omen://item/kukri?source=paizo-pathfinder-player-core:
  name: Kukri
  description: Bu bir fit uzunluğundaki bıçağın namlusu içe doğru kıvrılır ve kabzasında balçak bulunmaz.

omen://item/ladder-10-foot?source=paizo-pathfinder-player-core:
  name: Merdiven (10 Fit)

omen://item/lance?source=paizo-pathfinder-player-core:
  name: Süvari Mızrağı
  description: Bu mızrak benzeri silah, binek üzerindeki bir yaratık tarafından büyük miktarda hasar vermek için kullanılır.

omen://item/lantern-bulls-eye?source=paizo-pathfinder-player-core:
  name: Fener (Mercekli)
  description: Bir fener parlak ışık saçar ve 6 saat boyunca çalışması için 1 pint yağa ihtiyaç duyar. Mercekli bir fener, ışığını 60 fitlik bir koni şeklinde yayar (ve sonraki 60 fitte loş ışık saçar).

omen://item/lantern-hooded?source=paizo-pathfinder-player-core:
  name: Fener (Kukuletalı)
  description: Bir fener parlak ışık saçar ve 6 saat boyunca çalışması için 1 pint yağa ihtiyaç duyar. Kukuletalı bir fener, 30 fitlik bir yarıçapta ışık saçar (ve sonraki 30 fitte loş ışık saçar) ve ışığı engellemek için kapatabileceğiniz kepenklerle donatılmıştır. Kepenkleri kapatmak veya açmak bir Etkileşime Gir eylemi gerektirir.

omen://item/leather-armor?source=paizo-pathfinder-player-core:
  name: Deri Zırh
  description: Esnek ve kalıplanmış kaynatılmış derinin bir karışımı olan bu tür bir zırh takımı, maksimum esneklikle birlikte bir miktar koruma sağlar.

omen://item/light-barding?source=paizo-pathfinder-player-core:
  name: Hafif Koşum Zırhı

omen://item/light-hammer?source=paizo-pathfinder-player-core:
  name: Hafif Çekiç
  description: Savaş çekicinin bu daha küçük versiyonu, metal bir başla sonlanan ahşap veya metal bir sapa sahiptir. Daha ağır akrabasının aksine fırlatılabilecek kadar hafiftir.

omen://item/light-mace?source=paizo-pathfinder-player-core:
  name: Hafif Gürz
  description: "Hafif bir gürz, yoğun bir metal başla sonlanan kısa bir ahşap veya metal sapa sahiptir. Bir sopaya çok benzer şekilde kullanılır, ağır ezici darbeler indirir; ancak başın metal sırtlarından veya dikenlerinden elde edilen ekstra güce sahiptir."

omen://item/light-pick?source=paizo-pathfinder-player-core:
  name: Hafif Kazma
  description: Hafif bir kazma, kayaları parçalamaktan ziyade zırhı ve eti delmek için işlenmiş bir kazma başıyla sonlanan ahşap bir sapa sahip, modifiye edilmiş bir madencilik aletidir.

omen://item/lock-average?source=paizo-pathfinder-player-core:
  name: Kilit (Ortalama)
  description: "Ortalama bir kilidi açmak dört başarılı thievery|dc:25|traits:action:pick-a-lock|immutable:true testi gerektirir."

omen://item/lock-good?source=paizo-pathfinder-player-core:
  name: Kilit (İyi)
  description: "İyi bir kilidi açmak beş başarılı thievery|dc:30|traits:action:pick-a-lock|immutable:true testi gerektirir."

omen://item/lock-poor?source=paizo-pathfinder-player-core:
  name: Kilit (Düşük)
  description: "Düşük bir kilidi açmak iki başarılı thievery|dc:15|traits:action:pick-a-lock|immutable:true testi gerektirir."

omen://item/lock-simple?source=paizo-pathfinder-player-core:
  name: Kilit (Basit)
  description: "Basit bir kilidi açmak üç başarılı thievery|dc:20|traits:action:pick-a-lock|immutable:true testi gerektirir."

omen://item/lock-superior?source=paizo-pathfinder-player-core:
  name: Kilit (Üstün)
  description: "Üstün bir kilidi açmak altı başarılı thievery|dc:40|traits:action:pick-a-lock|immutable:true testi gerektirir."

omen://item/longbow?source=paizo-pathfinder-player-core:
  name: Uzun Yay
  description: Genellikle tek bir karaağaç, ceviz veya porsuk ağacından yapılan bu 5 fit boyundaki yay, güçlü bir çekişe sahiptir ve okları büyük bir kuvvetle ve aşırı mesafelere fırlatmada mükemmeldir. Uzun yayı ateşlemek için iki elinizi de kullanmalısınız ve binek üzerindeyken kullanılamaz.

omen://item/longspear?source=paizo-pathfinder-player-core:
  name: Uzun Mızrak
  description: "Bazen kargı olarak da adlandırılan bu çok uzun mızrak, fırlatmaktan ziyade tamamen saplamak içindir. Kalabalık kontrolü ve hücum eden düşmanlara karşı savunma için birçok asker ve şehir muhafızı tarafından kullanılır; iki elle tutulmalıdır."

omen://item/longsword?source=paizo-pathfinder-player-core:
  name: Uzun Kılıç
  description: Kuşanma kılıcı olarak da bilinen uzun kılıçlar, tek kenarlı veya çift kenarlı kılıçlar olabilir. Namluları ağırdır ve boyları 3 ila 4 fit arasındadır.

omen://item/mace?source=paizo-pathfinder-player-core:
  name: Gürz
  description: Sağlam bir sapı ve ağır bir metal başı olan gürz güçlüdür ve kullanan kişinin güçlü darbeler indirmesine ve zırhı ezmesine olanak tanır.

omen://item/magical-hearing-aid?source=paizo-pathfinder-player-core:
  name: Büyülü İşitme Cihazı
  description: Bu kavisli işitme cihazları üstten kancalanıp kulağınızın arkasına oturur ve kulak açıklığına oturan bir alıcıya sahiptir. Cihazın dış kısmı ses dalgalarını algılar ve büyü kullanarak bunları alıcıdan kulağınıza iletir. İşitme kaybınıza bağlı olarak bir veya iki tane takabilir ve bir Etkileşime Gir eylemi kullanarak işitme cihazlarınızı açıp kapatabilirsiniz.

omen://item/magnifying-glass?source=paizo-pathfinder-player-core:
  name: Büyüteç
  description: Bu kaliteli el merceği, belgelerin, kumaşların ve benzerlerinin ince ayrıntılarını fark etmek için yapılan Dikkat testlerine +1 eşya bonusu verir.

omen://item/main-gauche?source=paizo-pathfinder-player-core:
  name: Sol El Hançeri
  description: Bu savuşturma hançeri, kullanan kişinin elini korumak için sağlam bir balçağa sahiptir.

omen://item/manacles-average?source=paizo-pathfinder-player-core:
  name: Kelepçe (Ortalama)
  description: "Gönüllü olan veya başka şekilde insafınıza kalmış birini, yaratığın boyutuna ve kaç kelepçe taktığınıza bağlı olarak 10-30 saniye süren bir keşif aktivitesi olarak kelepçeleyebilirsiniz. Bacakları bağlanmış iki bacaklı bir yaratık, Hızlarına –15 fitlik durumsal ceza alır ve bilekleri bağlanmış iki elli bir yaratık, yönlendirme eylemi kullandığı her an bir flat|dc:5|showDC:all testinde başarılı olmak zorundadır; aksi takdirde o eylem başarısız olur. Kelepçelerin elleri ne kadar sıkı kısıtladığına bağlı olarak bu ZD daha yüksek olabilir. Sabit bir nesneye bağlanmış bir yaratık hareketsiz kılınır. Daha fazla veya daha az uzvu olan yaratıklar için kelepçelerin ne gibi bir etkisi olacağını (varsa) GM belirler. Bir yaratığı ortalama kelepçelerden kurtarmak dört başarılı thievery|dc:27|showDC:all|traits:action:pick-a-lock testi gerektirir."

omen://item/manacles-good?source=paizo-pathfinder-player-core:
  name: Kelepçe (İyi)
  description: "Gönüllü olan veya başka şekilde insafınıza kalmış birini, yaratığın boyutuna ve kaç kelepçe taktığınıza bağlı olarak 10-30 saniye süren bir keşif aktivitesi olarak kelepçeleyebilirsiniz. Bacakları bağlanmış iki bacaklı bir yaratık, Hızlarına –15 fitlik durumsal ceza alır ve bilekleri bağlanmış iki elli bir yaratık, yönlendirme eylemi kullandığı her an bir flat|dc:5|showDC:all testinde başarılı olmak zorundadır; aksi takdirde o eylem başarısız olur. Kelepçelerin elleri ne kadar sıkı kısıtladığına bağlı olarak bu ZD daha yüksek olabilir. Sabit bir nesneye bağlanmış bir yaratık hareketsiz kılınır. Daha fazla veya daha az uzvu olan yaratıklar için kelepçelerin ne gibi bir etkisi olacağını (varsa) GM belirler. Bir yaratığı iyi kelepçelerden kurtarmak beş başarılı thievery|dc:32|showDC:all|traits:action:pick-a-lock testi gerektirir."

omen://item/manacles-poor?source=paizo-pathfinder-player-core:
  name: Kelepçe (Düşük)
  description: "Gönüllü olan veya başka şekilde insafınıza kalmış birini, yaratığın boyutuna ve kaç kelepçe taktığınıza bağlı olarak 10-30 saniye süren bir keşif aktivitesi olarak kelepçeleyebilirsiniz. Bacakları bağlanmış iki bacaklı bir yaratık, Hızlarına –15 fitlik durumsal ceza alır ve bilekleri bağlanmış iki elli bir yaratık, yönlendirme eylemi kullandığı her an bir flat|dc:5|showDC:all testinde başarılı olmak zorundadır; aksi takdirde o eylem başarısız olur. Kelepçelerin elleri ne kadar sıkı kısıtladığına bağlı olarak bu ZD daha yüksek olabilir. Sabit bir nesneye bağlanmış bir yaratık hareketsiz kılınır. Daha fazla veya daha az uzvu olan yaratıklar için kelepçelerin ne gibi bir etkisi olacağını (varsa) GM belirler. Bir yaratığı düşük kelepçelerden kurtarmak iki başarılı thievery|dc:17|showDC:all|traits:action:pick-a-lock testi gerektirir."

omen://item/manacles-simple?source=paizo-pathfinder-player-core:
  name: Kelepçe (Basit)
  description: "Gönüllü olan veya başka şekilde insafınıza kalmış birini, yaratığın boyutuna ve kaç kelepçe taktığınıza bağlı olarak 10-30 saniye süren bir keşif aktivitesi olarak kelepçeleyebilirsiniz. Bacakları bağlanmış iki bacaklı bir yaratık, Hızlarına –15 fitlik durumsal ceza alır ve bilekleri bağlanmış iki elli bir yaratık, yönlendirme eylemi kullandığı her an bir flat|dc:5|showDC:all testinde başarılı olmak zorundadır; aksi takdirde o eylem başarısız olur. Kelepçelerin elleri ne kadar sıkı kısıtladığına bağlı olarak bu ZD daha yüksek olabilir. Sabit bir nesneye bağlanmış bir yaratık hareketsiz kılınır. Daha fazla veya daha az uzvu olan yaratıklar için kelepçelerin ne gibi bir etkisi olacağını (varsa) GM belirler. Bir yaratığı basit kelepçelerden kurtarmak üç başarılı thievery|dc:22|showDC:all|traits:action:pick-a-lock testi gerektirir."

omen://item/manacles-superior?source=paizo-pathfinder-player-core:
  name: Kelepçe (Üstün)
  description: "Gönüllü olan veya başka şekilde insafınıza kalmış birini, yaratığın boyutuna ve kaç kelepçe taktığınıza bağlı olarak 10-30 saniye süren bir keşif aktivitesi olarak kelepçeleyebilirsiniz. Bacakları bağlanmış iki bacaklı bir yaratık, Hızlarına –15 fitlik durumsal ceza alır ve bilekleri bağlanmış iki elli bir yaratık, yönlendirme eylemi kullandığı her an bir flat|dc:5|showDC:all testinde başarılı olmak zorundadır; aksi takdirde o eylem başarısız olur. Kelepçelerin elleri ne kadar sıkı kısıtladığına bağlı olarak bu ZD daha yüksek olabilir. Sabit bir nesneye bağlanmış bir yaratık hareketsiz kılınır. Daha fazla veya daha az uzvu olan yaratıklar için kelepçelerin ne gibi bir etkisi olacağını (varsa) GM belirler. Bir yaratığı üstün kelepçelerden kurtarmak altı başarılı thievery|dc:42|showDC:all|traits:action:pick-a-lock testi gerektirir."

omen://item/maul?source=paizo-pathfinder-player-core:
  name: Balyoz
  description: Balyozlar, iki elle sallanması gereken devasa savaş çekiçleridir.

omen://item/merchants-scale?source=paizo-pathfinder-player-core:
  name: Tüccar Terazisi

omen://item/mirror?source=paizo-pathfinder-player-core:
  name: Ayna

omen://item/morningstar?source=paizo-pathfinder-player-core:
  name: Sabahyıldızı
  description: Bu silah, dikenlerle bezeli metal bir topla sonlanan kısa bir sapa sahiptir.

omen://item/mug?source=paizo-pathfinder-player-core:
  name: Kupa

omen://item/musical-instrument-handheld?source=paizo-pathfinder-player-core:
  name: Müzik Aleti (Elde Taşınan)
  description: Elde taşınan aletler arasında gaydalar, küçük bir çan seti, küçük davullar, kemanlar ve viyoller, flütler ve blokflütler, küçük arplar, lavtalar, trompetler ve benzer boyuttaki aletler bulunur. OYK, özellikle büyük bir el aletinin (tuba gibi) daha büyük bir Yüke sahip olduğuna hükmedebilir. Büyük davullar, tam bir çan seti ve klavyeli enstrümanlar gibi ağır aletler daha az taşınabilirdir ve çalınırken genellikle sabit durmaları gerekir.

omen://item/musical-instrument-heavy?source=paizo-pathfinder-player-core:
  name: Müzik Aleti (Ağır)
  description: Elde taşınan aletler arasında gaydalar, küçük bir çan seti, küçük davullar, kemanlar ve viyoller, flütler ve blokflütler, küçük arplar, lavtalar, trompetler ve benzer boyuttaki aletler bulunur. OYK, özellikle büyük bir el aletinin (tuba gibi) daha büyük bir Yüke sahip olduğuna hükmedebilir. Büyük davullar, tam bir çan seti ve klavyeli enstrümanlar gibi ağır aletler daha az taşınabilirdir ve çalınırken genellikle sabit durmaları gerekir.

omen://item/musical-instrument-virtuoso-handheld?source=paizo-pathfinder-player-core:
  name: Müzik Aleti (Usta İşi Elde Taşınan)
  description: >
    Elde taşınan aletler arasında gaydalar, küçük bir çan seti, küçük davullar, kemanlar ve viyoller, flütler ve blokflütler, küçük arplar, lavtalar, trompetler ve benzer boyuttaki aletler bulunur. OYK, özellikle büyük bir el aletinin (tuba gibi) daha büyük bir Yüke sahip olduğuna hükmedebilir. Büyük davullar, tam bir çan seti ve klavyeli enstrümanlar gibi ağır aletler daha az taşınabilirdir ve çalınırken genellikle sabit durmaları gerekir.
    Usta işi bir enstrüman daha ince bir şekilde yapılmıştır ve bu enstrüman kullanılarak yapılan İcra testlerine +1 eşya bonusu verir.

omen://item/musical-instrument-virtuoso-heavy?source=paizo-pathfinder-player-core:
  name: Müzik Aleti (Usta İşi Ağır)
  description: >
    Elde taşınan aletler arasında gaydalar, küçük bir çan seti, küçük davullar, kemanlar ve viyoller, flütler ve blokflütler, küçük arplar, lavtalar, trompetler ve benzer boyuttaki aletler bulunur. OYK, özellikle büyük bir el aletinin (tuba gibi) daha büyük bir Yüke sahip olduğuna hükmedebilir. Büyük davullar, tam bir çan seti ve klavyeli enstrümanlar gibi ağır aletler daha az taşınabilirdir ve çalınırken genellikle sabit durmaları gerekir.
    Usta işi bir enstrüman daha ince bir şekilde yapılmıştır ve bu enstrüman kullanılarak yapılan İcra testlerine +1 eşya bonusu verir.

omen://item/net?source=paizo-pathfinder-player-core:
  name: Ağ
  description: >
    Ağı tek başına ya da bir ipe bağlı olarak kullanabilirsiniz. Bir ipe bağlandığında, ağı (yalnızca bitişiğinizdeki yaratıklar yerine) 10 fite kadar uzaktaki Orta veya daha küçük boyuttaki bir yaratığı Kavramak için kullanabilirsiniz. Hedef 10 fit içinde kaldığı ve siz ağı tutmaya devam ettiğiniz sürece hedef üzerindeki tutuşunuzu korumak için Kavramaya devam edebilirsiniz. Kavranan yaratık, siz onunla bitişik olmadığınız sürece Kurtulmak için +2 durumsal bonus kazanır ve ağı tamamen Zorlayarak Açmak için bir athletics|dc:16|traits:action:force-open testi deneyebilir. Hedef artık kavranmadığında, iki el gerektiren odaklanma özellikli bir Etkileşime Gir eylemiyle yeniden katlanana kadar ağ hantal kalır; yeniden katlanmadan kullanılırsa ağ ile yapılan Kavrama testleri -2 ceza alır.
    Ağ bağlı olmadığında, 20 fit içindeki Orta veya daha küçük boyuttaki bir yaratığa karşı basit silah yetkinliğinizi kullanarak menzilli bir saldırı zarı deneyebilirsiniz. İsabet durumunda, hedef Kurtulana kadar Savunmasız kalır ve Hızlarına -10 fitlik durumsal ceza alır; kritik isabette ise Kurtulana kadar ayrıca hareketsiz kılınır. Kurtulma ZD'si 16'dır (Kurtul). Hedefe bitişik bir yaratık, ağı çıkarmak için Etkileşime Girebilir.

omen://item/nunchaku?source=paizo-pathfinder-player-core:
  name: Nunçaku
  description: Nunçaku, kısa bir ip veya zincirle birbirine bağlanmış iki ahşap veya metal çubuktan yapılmıştır.

omen://item/oil-1-pint?source=paizo-pathfinder-player-core:
  name: Yağ (1 Pint)
  description: "Yağı fenerlere yakıt sağlamak için kullanabilirsiniz, ancak bir pint yağı ateşe verip fırlatabilirsiniz de. Önce yağı hazırlamak için bir Etkileşime Gir eylemi harcamalı, ardından menzilli bir saldırı olarak başka bir eylemle onu fırlatmalısınız. İsabet ettirirseniz, yaratığın üzerine veya hedeflediğiniz 5 fitlik tek bir kareye sıçrar. Yağın isabet ettiğinde başarıyla tutuşması için bir flat|dc:10 testinde başarılı olmalısınız. Yağ tutuşursa hedef 1d6[fire] hasar alır."

omen://item/orc-knuckle-dagger?source=paizo-pathfinder-player-core:
  name: Ork Muşta Hançeri
  description: Ork tasarımına sahip bu sağlam metal namlu, her iki ucundan fırlayan namlulara veya bazen katar gibi tek bir namluya sahip yatay bir sepet kabzaya sahiptir.

omen://item/orc-necksplitter?source=paizo-pathfinder-player-core:
  name: Ork Boyunbiçeni
  description: Bu tek namlulu sakallı balta, kemiği tendondan ve kıkırdaktan ayırmak için mükemmel olan tırtıklı bir namluya sahiptir.

omen://item/padded-armor?source=paizo-pathfinder-player-core:
  name: Dolgulu Zırh
  description: "Bu zırh basitçe ağır, kapitone bir kumaş katmanıdır; ancak çok ucuz olduğu için bazen kullanılır. Dolgulu zırhın hasar görmesi ve yok edilmesi diğer zırh türlerine göre daha kolaydır. Ağır zırhlar, Fiyatına dahil bir dolgulu zırh içliği ile birlikte gelir; ancak ağır zırhın altına giyildiğinde konfor özelliğini kaybeder. Ağır zırhınız yok edildiğinde veya tam ağır zırhı giymediğiniz zamanlarda uyumak için yalnızca bu dolgulu zırh içliğini giyebilirsiniz. Bu, büyülü zırhı bağdaşık tutmanıza ve ilişkili ağır zırhtaki rünlerin gücünden yararlanmanıza olanak tanır, ancak dolgulu içlik olmadan başka hiç kimse ağır zırhınızı giyemez."

omen://item/parrying-scabbard?source=paizo-pathfinder-player-core:
  name: Savuşturma Kını
  description: "Bu güçlendirilmiş kını, tuttuğu silahı çekmek için kullandığınız aynı Etkileşime Gir eylemi sırasında çekebilir, bir elinizde silahı ve diğer elinizde kını kullanabilirsiniz. Bir savuşturma kını, tıpkı savuşturma özelliğine sahip bir silah gibi savunmanız için kullanılabilir: onu savunma amaçlı konumlandırmak için bir eylem harcayabilir, bir sonraki sıranızın başlangıcına kadar Savunma Değerinize +1 durumsal bonus kazanabilirsiniz. Savuşturma kınları, tek elle kullanılabilen her türlü kılıç için mevcuttur."

omen://item/periscope?source=paizo-pathfinder-player-core:
  name: Periskop
  description: Bu, her iki ucunda birer tane olmak üzere iki açılı aynaya sahip 2 fit uzunluğunda bir borudur. Aynalar doğru hizalandığında siper arkasında kalarak engellerin etrafına bakabilirsiniz. Bu, köşelerin etrafındaki yaratıkları hedeflemek için yeterli bir etki hattı sağlamaz.

omen://item/pick?source=paizo-pathfinder-player-core:
  name: Kazma
  description: Yalnızca dövüş için tasarlanmış bir kazma, yıkıcı darbeler indirmek için sağlam bir ahşap sapa ve ağır, sivri bir başa sahiptir.

omen://item/piton?source=paizo-pathfinder-player-core:
  name: Piton
  description: "Bu küçük kazıklar, tırmanmayı kolaylaştırmak için sabitleme noktaları olarak kullanılabilir. Bir pitonu çakmak için onu bir elinizde tutmalı ve diğer elinizdeki çekici kullanarak içeri çakmalısınız. Çakılan pitona bir ip bağlayabilirsiniz; böylece Tırmanırken bir kritik başarısızlık yaşarsanız yere kadar düşmezsiniz."

omen://item/platinum-pieces?source=paizo-pathfinder-player-core:
  name: Platin Paralar

omen://item/primal-symbol?source=paizo-pathfinder-player-core:
  name: Doğa Sembolü
  description: Doğa büyücüleri, özellikle druidler, doğayla olan bağlarını sembolize etmek için genellikle örülü bitkilerden halkalar, hayvan parçalarından yapılmış kolyeler veya bir druid tarikatı ya da doğa felsefesiyle ilgili diğer semboller gibi doğal malzemelerden süsler takarlar.

omen://item/prosthesis?source=paizo-pathfinder-player-core:
  name: Protez
  description: >
    Bir protez, eksik veya hasarlı bir uzvun yerini alır. Tipik protezler arasında yapay ayaklar, gözler, eller ve uzuvlar bulunur; ancak herhangi bir vücut parçasının yerine temel bir protez tasarlanabilir. Protez alanındaki gelişmeler, en temel protezlerin bile eksik bir uzuv için tam işlevsellik sağlayabileceği anlamına gelir.
    Bir protezde onu vücudunuza bağlı tutan bir dizi kemer veya kelepçe bulunur. Bir protezi bir Etkileşime Gir eylemi olarak takabilir veya çıkarabilirsiniz.

omen://item/ranseur?source=paizo-pathfinder-player-core:
  name: Ranseur
  description: Bu gönderli silah, diğer ikisinden daha uzun bir orta uca sahip uzun bir üç dişli mızraktır.

omen://item/rapier?source=paizo-pathfinder-player-core:
  name: Rapiyer
  description: Rapiyer, sepet kabzaya sahip uzun ve ince bir delici namludur. Birçok kişi tarafından bir düello silahı olarak el üstünde tutulur.

omen://item/rations?source=paizo-pathfinder-player-core:
  name: Kumanya

omen://item/religious-symbol-silver?source=paizo-pathfinder-player-core:
  name: Dini Sembol (Gümüş)
  description: Bu ahşap veya gümüş parçasının üzerine bir ilahı temsil eden bir tasvir işlenmiştir. Rahipler gibi bazı ilahi büyücüler, belirli yetenekleri kullanmak ve bazı büyüleri yapmak için ilahlarının bir dini sembolünü kullanabilirler. Bir dini sembol bir zincir veya iğne üzerinde vücuda takılabilir ya da elde tutulabilir.

omen://item/religious-symbol-wooden?source=paizo-pathfinder-player-core:
  name: Dini Sembol (Ahşap)
  description: Bu ahşap veya gümüş parçasının üzerine bir ilahı temsil eden bir tasvir işlenmiştir. Rahipler gibi bazı ilahi büyücüler, belirli yetenekleri kullanmak ve bazı büyüleri yapmak için ilahlarının bir dini sembolünü kullanabilirler. Bir dini sembol bir zincir veya iğne üzerinde vücuda takılabilir ya da elde tutulabilir.

omen://item/religious-text?source=paizo-pathfinder-player-core:
  name: Dini Metin
  description: Bu el yazması, belirli bir dinin kutsal yazılarını içerir. Rahipler gibi bazı ilahi büyücüler, belirli yetenekleri kullanmak için bir dini metin kullanabilirler. Bir dini metni kullanmak için tek elde tutulmalıdır.

omen://item/repair-toolkit-superb?source=paizo-pathfinder-player-core:
  name: Tamir Alet Takımı (Harika)
  description: Bir tamir kiti seyahat ederken basit onarımlar yapmanıza olanak tanır. Taşınabilir bir örs, kıskaçlar, ağaç işleme aletleri, bir bileme taşı ve deri ile ahşabı korumak için yağlar içerir. Zanaatkârlık becerisini kullanarak eşyaları Tamir Etmek için bir tamir kiti kullanabilirsiniz. Harika bir tamir takımı teste +1 eşya bonusu verir. Kuşanılmış bir tamir alet takımını, onu kullanan eylemin bir parçası olarak çekip yerine koyabilirsiniz.

omen://item/repair-toolkit?source=paizo-pathfinder-player-core:
  name: Tamir Alet Takımı
  description: Bir tamir kiti seyahat ederken basit onarımlar yapmanıza olanak tanır. Taşınabilir bir örs, kıskaçlar, ağaç işleme aletleri, bir bileme taşı ve deri ile ahşabı korumak için yağlar içerir. Zanaatkârlık becerisini kullanarak eşyaları Tamir Etmek için bir tamir kiti kullanabilirsiniz. Kuşanılmış bir tamir alet takımını, onu kullanan eylemin bir parçası olarak çekip yerine koyabilirsiniz.

omen://item/rope?source=paizo-pathfinder-player-core:
  name: Halat
  description: 50 fitlik halat.

omen://item/sack?source=paizo-pathfinder-player-core:
  name: Çuval
  description: Bir çuval 8 Yüke kadar eşya alabilir. 2 Yük veya daha azını içeren bir çuval, genellikle bir kemere sokularak vücutta taşınabilir. Bir çuvalı tek elle taşıyabilirsiniz, ancak eşyaları içine ve dışına aktarmak için iki elinizi de kullanmalısınız.

omen://item/saddlebags?source=paizo-pathfinder-player-core:
  name: Heybe
  description: Heybeler bir çift halinde gelir. Her biri 3 Yüke kadar eşya tutabilir ve her birindeki ilk 1 Yüklük eşya bineğinizin Yük limitine dahil edilmez. Belirtilen Yük değeri bir binek tarafından giyilen heybeler içindir. Heybeleri taşıyor veya istifliyorsanız, hafif Yük yerine 1 Yük sayılırlar.

omen://item/sai?source=paizo-pathfinder-player-core:
  name: Sai
  description: Bu delici hançer, bir düşmanın silahını tuzağa düşürmek için kullanılabilen bir çift uçla çevrelenmiş metal bir sivri uçtur.

omen://item/sap?source=paizo-pathfinder-player-core:
  name: Deri Cop
  description: "Bir deri cop yoğun bir çekirdeğin etrafında yumuşak bir sargıya sahiptir; genellikle kurşun bir çubuğun etrafındaki deri bir kılıftır. Silahın amacı kan akıtmaktan ziyade kurbanını bayıltmak olduğundan, darbenin kuvvetini dağıtmak için baş kısmı kabzasından daha geniştir."

omen://item/sawtooth-saber?source=paizo-pathfinder-player-core:
  name: Testerediş Kılıç
  description: Kızıl Peygamberdevesi suikastçılarının alametifarikası olan bu kavisli namlu, adından da anlaşılacağı gibi testere gibi tırtıklıdır.

omen://item/scale-mail?source=paizo-pathfinder-player-core:
  name: Pullu Zırh
  description: Pullu zırh, gövdeyi, kolları ve bacakları koruyan uzun bir gömlek şeklinde genellikle güçlendirilmiş deri bir astar üzerine dikilmiş birçok metal puldan oluşur.

omen://item/scholarly-journal-compendium?source=paizo-pathfinder-player-core:
  name: Akademik Dergi Külliyatı
  description: "Akademik dergiler sıra dışıdır. Her akademik dergi, vampirler ya da tek bir kasabanın veya şehrin bir mahallesinin tarihi gibi çok spesifik bir konu üzerine bir fasiküldür. Konu hakkında Bilgi Hatırlamak için bir beceri testine kalkışmadan önce akademik bir dergiye başvurarak 1 dakika harcarsanız, teste +1 eşya bonusu kazanırsınız. Bir dergi külliyatı tek bir derginin beş katı fiyata mal olur ve kullanmak için iki el gerekir; her külliyat birkaç dergi içerir ve tüm hortlaklar ya da bütün bir şehir gibi daha geniş bir konuda bonusunu sağlar. OYK herhangi bir konumda hangi akademik dergilerin mevcut olduğunu belirler."

omen://item/scholarly-journal?source=paizo-pathfinder-player-core:
  name: Akademik Dergi
  description: "Akademik dergiler sıra dışıdır. Her akademik dergi, vampirler ya da tek bir kasabanın veya şehrin bir mahallesinin tarihi gibi çok spesifik bir konu üzerine bir fasiküldür. Konu hakkında Bilgi Hatırlamak için bir beceri testine kalkışmadan önce akademik bir dergiye başvurarak 1 dakika harcarsanız, teste +1 eşya bonusu kazanırsınız. Bir dergi külliyatı tek bir derginin beş katı fiyata mal olur ve kullanmak için iki el gerekir; her külliyat birkaç dergi içerir ve tüm hortlaklar ya da bütün bir şehir gibi daha geniş bir konuda bonusunu sağlar. OYK herhangi bir konumda hangi akademik dergilerin mevcut olduğunu belirler."

omen://item/scimitar?source=paizo-pathfinder-player-core:
  name: Pala
  description: Bu tek elli kavisli namlu bir tarafında keskindir.

omen://item/scythe?source=paizo-pathfinder-player-core:
  name: Tırpan
  description: Uzun tahılları ve tahıl başaklarını biçmek için kullanılan bir tarım aletinden türetilen bu silah, çıkıntılı saplara sahip uzun ahşap bir sırığa ve dik açıyla yerleştirilmiş kavisli bir namluya sahiptir.

omen://item/shield-boss?source=paizo-pathfinder-player-core:
  name: Kalkan Göbeği
  description: Genellikle bir kalkanın merkezine tutturulmuş yuvarlak, dışbükey veya konik kalın bir metal parçası olan kalkan göbeği, kalkan vuruşunun ezici hasarını artırır.

omen://item/shield-spikes?source=paizo-pathfinder-player-core:
  name: Kalkan Dikenleri
  description: Bu metal dikenler, kalkan vuruşuyla delici hasar vermek için kalkanın savunma tarafına stratejik olarak yerleştirilmiştir.

omen://item/shortbow?source=paizo-pathfinder-player-core:
  name: Kısa Yay
  description: Bu daha küçük yay tek bir tahta parçasından yapılmıştır ve akıncılar ile süvariler tarafından tercih edilir.

omen://item/shortsword?source=paizo-pathfinder-player-core:
  name: Kısa Kılıç
  description: Bu namlular çeşitli şekil ve stillerde gelir, ancak genellikle 2 fit uzunluğundadır.

omen://item/shuriken?source=paizo-pathfinder-player-core:
  name: Şuriken
  description: "Bu \"fırlatma yıldızı\", bileğin bir hareketiyle fırlatılmak üzere tasarlanmış keskin kenarlı küçük, yassı bir metal parçasıdır."

omen://item/sickle?source=paizo-pathfinder-player-core:
  name: Orak
  description: Aslen tahıl hasadı için kullanılan bir tarım aleti olan bu tek elli silah, bazen her iki tarafı da keskinleştirilmiş kavisli bir namluyla sonlanan kısa ahşap bir sapa sahiptir.

omen://item/signal-whistle?source=paizo-pathfinder-player-core:
  name: İşaret Düdüğü
  description: Çalındığında, bir işaret düdüğü açık arazide yarım mil öteye kadar net bir şekilde duyulabilir.

omen://item/silver-pieces?source=paizo-pathfinder-player-core:
  name: Gümüş Paralar

omen://item/sling-bullets?source=paizo-pathfinder-player-core:
  name: Sapan Mermileri
  description: Bunlar sapanlarda mühimmat olarak kullanılmak üzere tasarlanmış, genellikle demir veya kurşun olan küçük metal bilyelerdir.

omen://item/sling?source=paizo-pathfinder-player-core:
  name: Sapan
  description: Bir çift kayışa tutturulmuş deri bir yuvanın biraz daha fazlası olan bir sapan, pürüzsüz taşları veya sapan mermilerini uzaktan fırlatmak için kullanılabilir.

omen://item/soap?source=paizo-pathfinder-player-core:
  name: Sabun
  description: Kalıp sabun.

omen://item/spear?source=paizo-pathfinder-player-core:
  name: Mızrak
  description: Metal bir sivri uçla sonlanan uzun metal bir gövdeye sahip olan mızrak, yakın dövüş silahı olarak tek elle kullanılabilir ve fırlatılabilir.

omen://item/spellbook-blank?source=paizo-pathfinder-player-core:
  name: Büyü Kitabı (Boş)
  description: "Bir büyü kitabı, çeşitli büyüleri öğrenmek ve hazırlamak için gerekli yazılı bilgileri barındırır; bu Wizard'lar için bir zorunluluktur (genellikle ücretsiz bir tane edinirler) ve ek büyüler öğrenmek isteyen diğer Büyücüler için kullanışlı bir lükstür. Her büyü kitabı 100 büyüye kadar barındırabilir. Listelenen Fiyat boş bir büyü kitabı içindir."

omen://item/spiked-chain?source=paizo-pathfinder-player-core:
  name: Dikenli Zincir
  description: Bu 4 fit uzunluğundaki zincir parçası kancalarla kaplıdır ve bir veya iki ucunda sivri uçlara sahiptir. Bazılarında el tutamağı olarak kullanılan metal halkalar bulunur.

omen://item/spiked-gauntlet?source=paizo-pathfinder-player-core:
  name: Dikenli Zırh Eldiveni
  description: Standart bir zırh eldiveniyle aynı savunma işlevini sağlayan bu versiyon, eklem yerlerinden çıkıntı yapan bir grup sivri uca sahiptir.

omen://item/spined-shield?source=paizo-pathfinder-player-core:
  name: Dikenli Kalkan
  description: >
    Bu çelik kalkanın (Sertlik 6, CP 24, KK 12) yüzeyinden beş pürüzlü diken çıkıntı yapar. Dikenler +1 hasar zarı rünlü kalkan dikenleridir.
    Bu kalkanla Kalkan Engelleme reaksiyonunu kullandığınızda dikenler hasarı kalkanın kendisinden önce alır. Kalkan hasar alacağında (Sertlik uygulandıktan sonra), her 6 hasar başına bir diken koparak hasarı 6 azaltır. Kalkan kalan hasarı alır. Diken kalmadığında kalkan normal şekilde hasar alır.
    Tüm dikenler bittiğinde, dikenler ertesi gün yenilenene kadar onlarla saldırma yeteneğinizi kaybedersiniz.
    Etkinleştir A Etkileşime Gir
    Etki: Kalkanın dikenlerinden birini bir hedefe fırlatırsınız. Fırlatılan bir diken, dikenlerin istatistiklerini kullanır ancak 120 fitlik bir menzil derecesine sahip askeri menzilli bir silahtır.

omen://item/splint-mail?source=paizo-pathfinder-player-core:
  name: Şeritli Zırh
  description: Bu zırh türü, genellikle giyen kişinin gövdesinde, üst kollarında ve bacaklarında bulunan esnek, birbirine kenetlenen metal plakalarla güçlendirilmiş zincir zırhtır. Bu zırh takımı, Dolgulu Zırhtan bir içlik ve bir çift zırh eldiveni ile birlikte gelir.

omen://item/spyglass-fine?source=paizo-pathfinder-player-core:
  name: Dürbün (Seçkin)
  description: Tipik bir dürbün normalden sekiz kat daha uzağı görmenizi sağlar. Seçkin bir dürbün uzaktaki ayrıntıları fark etmek için yapılan Dikkat testlerine +1 eşya bonusu ekler.

omen://item/spyglass?source=paizo-pathfinder-player-core:
  name: Dürbün
  description: Tipik bir dürbün normalden sekiz kat daha uzağı görmenizi sağlar.

omen://item/staff?source=paizo-pathfinder-player-core:
  name: Asa
  description: Bu uzun tahta parçası yürümede yardımcı olabilir ve kudretli bir darbe indirebilir.

omen://item/starknife?source=paizo-pathfinder-player-core:
  name: Yıldızbıçak
  description: Merkezi bir metal halkadan, bir pusula gülündeki yönler gibi incelen dört metal namlu uzanır. Yıldızbıçağı merkezinden kavrayan kullanıcı, onu bir yakın dövüş silahı olarak kullanabilir. Kısa mesafelere de fırlatılabilir.

omen://item/steel-shield?source=paizo-pathfinder-player-core:
  name: Çelik Kalkan
  description: >
    Tıpkı ahşap kalkanlar gibi, çelik kalkanlar da çeşitli şekil ve boyutlarda gelir. Ahşap kalkanlardan daha pahalı olmalarına rağmen çok daha dayanıklıdırlar.
    Sertlik
    CP
    KK
    5
    20
    10

omen://item/studded-leather-armor?source=paizo-pathfinder-player-core:
  name: Perçinli Deri Zırh
  description: Bu deri zırh, deri zırhın esnekliğinin çoğunu daha sağlam korumayla sağlayacak şekilde metal perçinler ve bazen küçük metal plakalarla güçlendirilmiştir.

omen://item/survey-map-atlas?source=paizo-pathfinder-player-core:
  name: Keşif Haritası (Atlas)
  description: >
    Haritalar sıra dışıdır. Bulabileceğiniz çoğu harita basit ve işlevseldir. Bir keşif haritası tek bir konumu mükemmel ayrıntılarla detaylandırır.
    Bu haritalardan biri, testlerin haritada ayrıntıları verilen konumla ilgili olması koşuluyla Hayatta Kalma testlerine ve Bilgi Hatırlamak için yapılan tüm beceri testlerine +1 eşya bonusu verir.
    Haritalar bazen genellikle benzer konularda aynı kalitede bir dizi harita içeren atlaslar halinde gelir. Bir atlas tek bir haritanın beş katı fiyata mal olur ve kullanmak için iki el gerekir.
    OYK herhangi bir konumda hangi haritaların mevcut olduğunu belirler.

omen://item/survey-map?source=paizo-pathfinder-player-core:
  name: Keşif Haritası
  description: Haritalar sıra dışıdır. Bulabileceğiniz çoğu harita basit ve işlevseldir. Bir keşif haritası tek bir konumu mükemmel ayrıntılarla detaylandırır. Bu haritalardan biri, testlerin haritada ayrıntıları verilen konumla ilgili olması koşuluyla Hayatta Kalma testlerine ve Bilgi Hatırlamak için yapılan tüm beceri testlerine +1 eşya bonusu verir. OYK herhangi bir konumda hangi haritaların mevcut olduğunu belirler.

omen://item/sword-cane?source=paizo-pathfinder-player-core:
  name: Kılıçlı Baston
  description: "Bu ince, rapiyer benzeri kılıç, bir kın işlevi gören ahşap veya metal bir bastonun içinde gizlenmiştir; bu da onu denetimlerden veya yüksek sosyete etkinliklerine gizlice sokulması kolay, göze çarpmayan bir silah yapar. Kılıçlı baston kınındayken tipik olarak 4 fit uzunluğundadır ve kabzası genellikle ahşap veya metal bir süsle kapatılmıştır."

omen://item/tack?source=paizo-pathfinder-player-core:
  name: Koşum Takımı
  description: "Koşum takımı; eyer, gem ve dizgin ile gerekiyorsa üzengiler de dahil olmak üzere bir binek hayvanını donatmak için gereken tüm teçhizatı içerir. Özellikle büyük veya tuhaf şekilli hayvanlar özel eyerler gerektirebilir. Bunlar OYK tarafından belirlendiği üzere daha pahalı veya bulunması zor olabilir. Verilen Yük değeri bir yaratık tarafından giyilen koşum takımı içindir. Taşınırsa Yük 2'ye yükselir."

omen://item/temple-sword?source=paizo-pathfinder-player-core:
  name: Tapınak Kılıcı
  description: Bu ağır namlu, dini mekânların muhafızları tarafından tercih edilir. Orak ve kılıcın bir karışımı gibi görünen kendine özgü, hilal şeklinde bir namluya sahiptir. Silaha çanlar veya diğer mübarek süslerin takılabilmesi için namluda veya kabza topuzunda genellikle delikler açılmıştır.

omen://item/ten-foot-pole?source=paizo-pathfinder-player-core:
  name: On Fitlik Sırık
  description: Bu uzun sırığı kullanırken, 10 fit uzaklığa kadar bir kareyi aramak için Ara eylemini kullanabilirsiniz. Sırık bir silah olarak kullanılabilecek kadar sağlam değildir.

omen://item/tent-four-person?source=paizo-pathfinder-player-core:
  name: Çadır (Dört Kişilik)

omen://item/tent-pavilion?source=paizo-pathfinder-player-core:
  name: Çadır (Otağ)

omen://item/tent-pup?source=paizo-pathfinder-player-core:
  name: Çadır (Küçük)

omen://item/thieves-toolkit-infiltrator-picks?source=paizo-pathfinder-player-core:
  name: Hırsız Alet Takımı (Sızma Maymuncukları)
  description: Bunlar Hırsız Alet Takımı (Sızmacı) için yedek maymuncuklardır.

omen://item/thieves-toolkit-infiltrator?source=paizo-pathfinder-player-core:
  name: Hırsız Alet Takımı (Sızmacı)
  description: >
    Hırsızlık becerisini kullanarak Kilit Açmak veya (bazı türlerdeki) Düzenekleri Etkisiz Hale Getirmek için bir hırsız alet takımına ihtiyacınız vardır. Sızmacı bir hırsız alet takımı Kilit Açma ve Düzenekleri Etkisiz Hale Getirme testlerine +1 eşya bonusu ekler.
    Hırsız alet takımınız kırılırsa maymuncukları aletlerinize uygun Yedek Maymuncuklarla değiştirerek tamir edebilirsiniz; bu Tamir Et eylemini kullanmayı gerektirmez. Hırsız alet takımınızı kuşanıyorsanız, onu kullanan eylemin bir parçası olarak çekip yerine koyabilirsiniz.

omen://item/thieves-toolkit-replacement-picks?source=paizo-pathfinder-player-core:
  name: Hırsız Alet Takımı (Yedek Maymuncuklar)
  description: Bunlar bir Hırsız Alet Takımı için yedek maymuncuklardır.

omen://item/thieves-toolkit?source=paizo-pathfinder-player-core:
  name: Hırsız Alet Takımı
  description: >
    Hırsızlık becerisini kullanarak Kilit Açmak veya (bazı türlerdeki) Düzenekleri Etkisiz Hale Getirmek için bir hırsız alet takımına ihtiyacınız vardır.
    Hırsız alet takımınız kırılırsa maymuncukları alet takımınıza uygun Yedek Maymuncuklarla değiştirerek tamir edebilirsiniz; bu Tamir Et eylemini kullanmayı gerektirmez. Hırsız alet takımınızı kuşanıyorsanız, onu kullanan eylemin bir parçası olarak çekip yerine koyabilirsiniz.

omen://item/tiger-fork?source=paizo-pathfinder-player-core:
  name: Kaplan Çatalı
  description: >
    Kaplan çatalı, silahsızlandır ve kavra özelliklerine sahip +1 üç dişli bir mızraktır. Ölümcül canavarları savuşturmak ve dövüş sırasında rakipleri tuzağa düşürmek için kullanılabilen geniş, dışa açılan uçlara sahiptir. Kaplan çatalıyla başka bir yaratığı Kavramış durumdayken, zorunlu hareket etkilerine karşı kurtarışlara +1 durumsal bonus kazanırsınız.
    Etkinleştir—Çatal Tutuşu 1 (manipulate)
    Etki: Yaratığı Kavramayı denemek için kaplan çatalını etkinleştirebilirsiniz. Bu deneme, gereken Vuruş ile aynı çoklu saldırı cezasını kullanır.

omen://item/tool-long?source=paizo-pathfinder-player-core:
  name: Alet (Uzun)
  description: "Bu girdi, belirli bir macera amacı olmayan temel el aletleri için genel bir başlıktır. Bir çapa, kürek veya balyoz uzun bir alettir; el matkabı, buz kancası veya mala ise kısa bir alettir. Bir alet genellikle 1d6 hasar veren derme çatma bir silah olarak kullanılabilir. OYK uygun olan hasar türünü belirler veya gerekirse hasarı ayarlar."

omen://item/tool-short?source=paizo-pathfinder-player-core:
  name: Alet (Kısa)
  description: "Bu girdi, belirli bir macera amacı olmayan temel el aletleri için genel bir başlıktır. Bir çapa, kürek veya balyoz uzun bir alettir; el matkabı, buz kancası veya mala ise kısa bir alettir. Bir alet genellikle 1d4 hasar veren derme çatma bir silah olarak kullanılabilir. OYK uygun olan hasar türünü belirler veya gerekirse hasarı ayarlar."

omen://item/torch?source=paizo-pathfinder-player-core:
  name: Meşale
  description: Bir meşale 1 saat boyunca 20 fitlik bir yarıçapta parlak ışık (ve sonraki 20 fitte loş ışık) saçar. 1d4 ezici hasar artı 1 ateş hasarı veren derme çatma bir silah olarak kullanılabilir.

omen://item/tower-shield?source=paizo-pathfinder-player-core:
  name: Kule Kalkanı
  description: >
    Bu devasa kalkanlar neredeyse tüm vücuda siper sağlamak için kullanılabilir. Boyutları nedeniyle tipik olarak metalle güçlendirilmiş ahşaptan yapılırlar. Siper Al eylemini kullanıyorsanız Savunma Değeri +4'e yükselir.
    Sertlik
    CP
    KK
    5
    20
    10

omen://item/travelers-chair?source=paizo-pathfinder-player-core:
  name: Gezgin Sandalyesi
  description: "Gezgin sandalyesi, sık maceralar ve seyahatler için özel olarak tasarlanmıştır. Tasarım, mükemmel konfor ve destek sağlamak için şık ve modaya uygundur. Gezgin sandalyesi birbirine geçen ahşap parçalardan, saat mekanizmasından veya diğer cihazlardan yapılmış; sandalyenin ek bir zorluk olmadan merdivenlerden yukarı veya aşağı inmesine (tıpkı diğer karakterler için olduğu gibi merdivenlerden yukarı çıkmak yine de zorlu arazidir) ve merdivenler ile engebeli zemin gibi diğer yaygın macera arazilerinde ek bir zorluk olmadan hareket etmesine olanak tanıyan küçük mekanizmalara sahiptir."

omen://item/trident?source=paizo-pathfinder-player-core:
  name: Üç Dişli Mızrak
  description: Bu üç uçlu, mızrak benzeri silah tipik olarak 4 fitlik bir sırığa sahiptir. Bir mızrak gibi tek elle kullanılabilir veya fırlatılabilir.

omen://item/wakizashi?source=paizo-pathfinder-player-core:
  name: Vakizaşi
  description: Bu kısa namlulu, tek kenarlı kılıç, tipik olarak Katana'nın yanında bir çiftin parçası olarak taşınır.

omen://item/war-flail?source=paizo-pathfinder-player-core:
  name: Savaş Dövgeni
  description: Bu büyük flail, bazen dikenlerle kakılmış daha kısa, sağlam bir ahşap veya metal parçasına bağlı uzun bir sapa sahiptir.

omen://item/warhammer?source=paizo-pathfinder-player-core:
  name: Savaş Çekici
  description: Bu silah, büyük ve ağır bir metal başla sonlanan ahşap bir sapa sahiptir. Çekicin başı tek taraflı veya çift taraflı olabilir, ancak her zaman güçlü ezici darbeler indirme yeteneğine sahiptir.

omen://item/waterskin?source=paizo-pathfinder-player-core:
  name: Matara
  description: Dolu olduğunda, bir matara Küçük veya Orta boyuttaki bir yaratık için yaklaşık 1 günlük su içerir.

omen://item/wheelchair?source=paizo-pathfinder-player-core:
  name: Tekerlekli Sandalye
  description: Yaygın bir tekerlekli sandalye günlük kullanım için idealdir ancak ağır fiziksel aktiviteler için tasarlanmamıştır. Bu tekerlekli sandalyeler maceracı olmayanlar arasında en yaygın olanıdır. Tekerlekli sandalyeler, boy veya vücut tipine bakılmaksızın her insana uyacak çeşitli boyutlarda gelir.

omen://item/whip?source=paizo-pathfinder-player-core:
  name: Kırbaç
  description: Genellikle örgülü olan bu uzun ve kalın deri şerit, genellikle belirgin bir şaklama sesi eşliğinde uzaktan acı verici ancak ölümcül olmayan bir kesik darbesi indirir.

omen://item/wooden-shield?source=paizo-pathfinder-player-core:
  name: Ahşap Kalkan
  description: >
    Çeşitli şekil ve boyutlarda olmalarına rağmen, ahşap kalkanların sunduğu koruma malzemelerinin sağlamlığından gelir. Ahşap kalkanlar çelik kalkanlara göre daha ucuz olsa da daha kolay kırılırlar.
    Sertlik
    CP
    KK
    3
    12
    6

omen://item/writing-set-extra-ink-and-paper?source=paizo-pathfinder-player-core:
  name: Yazı Takımı (Ekstra Mürekkep ve Kâğıt)
  description: Yazı takımınızı yeniden doldurmak için ekstra mürekkep ve kâğıt.

omen://item/writing-set?source=paizo-pathfinder-player-core:
  name: Yazı Takımı
  description: Bir yazı takımı kullanarak yazışmalar kaleme alabilir ve parşömenler yazabilirsiniz. Bir set çeşitli kâğıt ve parşömenler de dahil olmak üzere kırtasiye malzemelerinin yanı sıra mürekkep, bir tüy kalem veya mürekkepli kalem, mühür mumu ve basit bir mühür içerir. Çok fazla yazı yazdıysanız, kitinizi ekstra mürekkep ve kâğıtla yeniden doldurabilirsiniz.
