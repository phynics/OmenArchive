# tr overrides: background

omen://background/acolyte?source=paizo-pathfinder-player-core:
  name: Akolit
  description: >
    İlk günlerinizi dini bir manastır veya tekkede geçirdiniz. Dininizin mesajını yaymak için dünyaya açılmış veya inancınızın öğretilerini geride bırakmış olabilirsiniz; ancak derinlerde bir yerde, öğrendiğiniz dersleri her zaman içinizde taşıyacaksınız.
    İki nitelik artışı seçin. Biri Zekâ veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Din becerisinde ve Yazmanlık İlimi becerisinde eğitimlisiniz. Külliyat Talebesi beceri hünerini kazanırsınız.

omen://background/acrobat?source=paizo-pathfinder-player-core:
  name: Akrobat
  description: >
    Bir sirkte ya da sokaklarda, akrobatlık yaparak ekmeğinizi kazandınız. Para bittiğinde maceracılığa yönelmiş ya da sadece hünerlerinizi daha iyi bir amaç uğruna kullanmaya karar vermiş olabilirsiniz.
    İki nitelik artışı seçin. Biri Kuvvet veya Çeviklik olmalı ve diğeri serbest nitelik artışıdır.
    Akrobasi becerisinde ve Sirk İlimi becerisinde eğitimlisiniz. Sağlam Denge beceri hünerini kazanırsınız.

omen://background/animal-whisperer?source=paizo-pathfinder-player-core:
  name: Hayvan Fısıldayıcısı
  description: >
    Hayvanlarla aranızda her zaman bir bağ hissettiniz ve onları eğitmeyi öğrenmek sizin için küçük bir adımdan ibaretti. Seyahat ettikçe sürekli farklı yaratıklarla karşılaşırsınız ve yol boyunca onlarla dostluk kurarsınız.
    İki nitelik artışı seçin. Biri Bilgelik veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Doğa becerisinde ve sevdiğiniz hayvanların yaşadığı bir araziyle ilişkili bir İlim becerisinde (Ova İlimi veya Bataklık İlimi gibi) eğitimlisiniz. Hayvan Eğit beceri hünerini kazanırsınız.

omen://background/artisan?source=paizo-pathfinder-player-core:
  name: Zanaatkâr
  description: >
    Bir çırak olarak belirli bir inşaat veya üretim alanında pratik yaparak uzmanlaşmış bir beceri geliştirdiniz. Körük başında sayısız saatler döken bir demirci çırağı, her türden giysiyi diken genç bir terzi ya da gemilerin gövdesini şekillendiren bir tekne ustası olmuş olabilirsiniz.
    İki nitelik artışı seçin. Biri Kuvvet veya Zekâ olmalı ve diğeri serbest nitelik artışıdır.

omen://background/artist?source=paizo-pathfinder-player-core:
  name: Sanatçı
  description: >
    Hangi biçimi alırsa alsın sanatınız sizin en büyük tutkunuzdur. Maceracılık ilham bulmanıza yardımcı olabilir veya dünyaca ünlü bir sanatçı olana kadar sadece hayatta kalmanın bir yolu olabilir.
    İki nitelik artışı seçin. Biri Çeviklik veya Karizma olmalı ve diğeri serbest nitelik artışıdır.

omen://background/bandit?source=paizo-pathfinder-player-core:
  name: Haydut
  description: >
    Geçmişinizde yollardaki yolcuları soyup kıt kanaat geçindiğiniz kırsal haydutluk önemli bir yer tutar. Soygunlarınız ister yerel bir soylu tarafından onaylanmış olsun ister kendi başınıza yapmış olun, nihayetinde kendinizi maceracı hayatının içinde buldunuz.
    İki nitelik artışı seçin. Biri Çeviklik veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Gözdağı becerisinde ve çalıştığınız araziyle ilişkili bir İlim becerisinde (Çöl İlimi veya Ova İlimi gibi) eğitimlisiniz. Grup Tehdidi beceri hünerini kazanırsınız.

omen://background/barkeep?source=paizo-pathfinder-player-core:
  name: Meyhaneci
  description: >
    Beş uzmanlığınız vardır: fıçı kaldırmak, içmek, kupa parlatmak, içmek ve içmek. Bir barda çalıştınız; burada içkiyi nasıl kaldıracağınızı ve taşkın bir şekilde sosyalleşmeyi öğrendiniz.
    İki nitelik artışı seçin. Biri Dayanıklılık veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Diplomasi becerisinde ve Alkol İlimi becerisinde eğitimlisiniz. Ayaküstü Sohbetçi beceri hünerini kazanırsınız.

omen://background/barrister?source=paizo-pathfinder-player-core:
  name: Dava Vekili
  description: >
    Hukuk el kitapları yığınları, katı hocalar ve mahkeme salonlarındaki deneyimler sizi hukuki konularda eğitti. Mahkemede iddia veya savunma makamını üstlenebilirsiniz ve yerel yasaları ne zaman alelacele bilmeniz gerekeceğini asla kestiremeyeceğinizden, onları yakından takip etme eğilimindesinizdir.
    İki nitelik artışı seçin. Biri Zekâ veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Diplomasi becerisinde ve Hukuk İlimi becerisinde eğitimlisiniz. Grup İzlenimi beceri hünerini kazanırsınız.

omen://background/bounty-hunter?source=paizo-pathfinder-player-core:
  name: Ödül Avcısı
  description: >
    Kanun kaçaklarını yakalayıp getirmek ceplerinizi dolduruyordu. Belki sokakları daha güvenli hale getirmek için suçluları adalete teslim etmeye yönelik fedakâr bir amacınız vardı, belki de para yeterli bir motivasyondu. Suçluları avlama teknikleriniz bir maceracının hayatına kolayca uyarlanabilir.
    İki nitelik artışı seçin. Biri Kuvvet veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Hayatta Kalma becerisinde ve Hukuk İlimi becerisinde eğitimlisiniz. Deneyimli İz Sürücü beceri hünerini kazanırsınız.

omen://background/charlatan?source=paizo-pathfinder-player-core:
  name: Şarlatan
  description: >
    Bir kasabada sahte kehanetler ve yılan yağı pazarlayıp diğerinde varlıklı bir mirasçıyı baştan çıkarmak için sürgündeki bir asilzade gibi davranarak diyar diyar gezdiniz. Maceracı olmak bir sonraki büyük vurgununuz ya da yeteneklerinizi daha yüce bir dava için kullanma girişiminiz olabilir. Belki de bir kahraman taklidi yaptıktan sonra bizzat o maskeye dönüştüğünüzü fark ettiğiniz için her ikisinden de bir parça taşır.
    İki nitelik artışı seçin. Biri Zekâ veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Aldatma becerisinde ve Yeraltı Dünyası İlimi becerisinde eğitimlisiniz. Sevimli Yalancı beceri hünerini kazanırsınız.

omen://background/cook?source=paizo-pathfinder-player-core:
  name: Aşçı
  description: >
    Bir meyhane veya başka bir lokantanın mutfaklarında büyüdünüz ve orada parlayarak olağanüstü bir aşçı oldunuz. Fırıncılık, yemek pişirme, arada biraz da içki mayalama derken vaktinizin çoğunu gözlerden uzak geçirdiniz. Kendi gözlerinizle dünyayı görmek için dışarı çıkmanızın zamanı geldi de geçiyor.
    İki nitelik artışı seçin. Biri Dayanıklılık veya Zekâ olmalı ve diğeri serbest nitelik artışıdır.
    Hayatta Kalma becerisinde ve Yemek Pişirme İlimi becerisinde eğitimlisiniz. Güngörmüş beceri hünerini kazanırsınız.

omen://background/criminal?source=paizo-pathfinder-player-core:
  name: Suçlu
  description: >
    Vicdansız bir başına buyruk olarak veya bir yeraltı örgütünün üyesi olarak suç dolu bir hayat yaşadınız. Kefaret aramak, kanundan kaçmak veya sadece daha büyük ve daha iyi ganimetlere ulaşmak için maceracı olmuş olabilirsiniz.
    İki nitelik artışı seçin. Biri Çeviklik veya Zekâ olmalı ve diğeri serbest nitelik artışıdır.
    Gizlilik becerisinde ve Yeraltı Dünyası İlimi becerisinde eğitimlisiniz. Deneyimli Kaçakçı beceri hünerini kazanırsınız.

omen://background/cultist?source=paizo-pathfinder-player-core:
  name: Tarikatçı
  description: >
    Güçlü bir hasat elde etmek için yapılan kutsal dansları ya da karanlık güçlere yakaran meşum ritüelleri içeren bir tarikatın üyesiydiniz (veya hâlâ öylesiniz). Tarikatınızın amaçlarını ilerletmek, dünyanın daha yüce gizemlerine vâkıf olmak ya da nahoş uygulamalardan ve katı kurallardan kaçmak için maceracılığa atılmış olabilirsiniz.
    İki nitelik artışı seçin. Biri Zekâ veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Okültizm becerisinde ve ilahınız veya tarikatınızla ilişkili bir İlim becerisinde eğitimlisiniz. Sırların Tedrisatından Geçmiş beceri hünerini kazanırsınız.

omen://background/detective?source=paizo-pathfinder-player-core:
  name: Dedektif
  description: >
    Bir polis müfettişi olarak suçları çözdünüz veya zengin müşteriler için özel dedektif olarak işler aldınız. Bir sonraki büyük gizeminizin bir parçası olarak maceracı olmuş olabilirsiniz; ancak büyük olasılıkla bu, önceki bir vakanın sonuçları veya artçı etkileri yüzündendir.
    İki nitelik artışı seçin. Biri Zekâ veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Sosyoloji becerisinde ve Yeraltı Dünyası İlimi becerisinde eğitimlisiniz. Sokak Görmüş beceri hünerini kazanırsınız.

omen://background/emissary?source=paizo-pathfinder-player-core:
  name: Elçi
  description: >
    Bir diplomat veya ulak olarak uzak diyarlara seyahat ettiniz. Yeni insanlarla iletişim kurmak ve ittifaklar kurmak sizin asıl işiniz ve sermayenizdi.
    İki nitelik artışı seçin. Biri Zekâ veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Sosyoloji becerisinde ve sık sık ziyaret ettiğiniz bir şehirle ilişkili bir İlim becerisinde eğitimlisiniz. Çokdilli beceri hünerini kazanırsınız.

omen://background/entertainer?source=paizo-pathfinder-player-core:
  name: Eğlendirici
  description: >
    Sanat eğitimi veya katıksız inatçı pratikler sayesinde kalabalıkları eğlendirmeyi öğrendiniz. Bir oyuncu, dansçı, müzisyen, sokak sihirbazı veya başka herhangi bir tür gösterici olmuş olabilirsiniz.
    İki nitelik artışı seçin. Biri Çeviklik veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Gösteri becerisinde ve Tiyatro İlimi becerisinde eğitimlisiniz. Büyüleyici Performans beceri hünerini kazanırsınız.

omen://background/farmhand?source=paizo-pathfinder-player-core:
  name: Çiftlik İşçisi
  description: >
    Güçlü bir sırt ve mevsimsel döngülere dair kavrayışınızla toprağı sürdünüz ve ekinleri yetiştirdiniz. Çiftliğiniz istilacılar tarafından yerle bir edilmiş olabilir, sizi toprağa bağlayan ailenizi kaybetmiş olabilirsiniz ya da sadece bu angaryadan bıkmış olabilirsiniz; ancak bir noktada maceracı oldunuz.
    İki nitelik artışı seçin. Biri Dayanıklılık veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Atletizm becerisinde ve Çiftçilik İlimi becerisinde eğitimlisiniz. Atletizm ile Özgüven beceri hünerini kazanırsınız.

omen://background/field-medic?source=paizo-pathfinder-player-core:
  name: Sahra Sıhhiyecisi
  description: >
    Savaşın kaotik hengamesinde, muharebe kayıplarına müdahale ederken hızla değişen koşullara uyum sağlamayı öğrendiniz. Askerleri, muhafızları veya diğer muharipleri tedavi ettiniz ve savaş lojistiği hakkında hatırı sayılır bilgi edindiniz.
    İki nitelik artışı seçin. Biri Dayanıklılık veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Tıp becerisinde ve Harp İlimi becerisinde eğitimlisiniz. Muharebe Tıbbı beceri hünerini kazanırsınız.

omen://background/fortune-teller?source=paizo-pathfinder-player-core:
  name: Falcı
  description: >
    Sıradan insanların geleceği kestirmek için kullandığı birçok geleneksel yöntemi öğrendiğinizden, kaderin iplikleri sizin için açıktır. Bu becerileri topluluğunuza rehberlik etmek için veya sadece para kazanmak amacıyla kullanmış olabilirsiniz. Ancak bu uygulamalara en ufak bir bakış bile sizi evrenin okült gizemlerine bağlar.
    İki nitelik artışı seçin. Biri Zekâ veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Okültizm becerisinde ve Falcılık İlimi becerisinde eğitimlisiniz. Tuhaflık Teşhisi beceri hünerini kazanırsınız.

omen://background/gambler?source=paizo-pathfinder-player-core:
  name: Kumarbaz
  description: >
    Kazanmanın heyecanı sizi şans oyunlarına çekti. Bu, maceracılığın gerçek risklerinin yanında sönük kalan kârlı bir yan iş olabilirdi ya da kumar yüzünden zor günlere düşmüş ve bu sarmaldan kurtulmanın bir yolu olarak maceracılığın peşine düşmüş olabilirsiniz.
    İki nitelik artışı seçin. Biri Çeviklik veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Aldatma becerisinde ve Oyunlar İlimi becerisinde eğitimlisiniz. Bana Yalan Söyle beceri hünerini kazanırsınız.

omen://background/gladiator?source=paizo-pathfinder-player-core:
  name: Gladyatör
  description: >
    Arenanın kanlı oyunları size dövüş sanatını öğretti. Gerçek bir şöhrete kavuşmadan önce dünyayı keşfetmek için arenadan ayrıldınız—ya da kaçtınız. Hem kan dökme hem de kalabalığın dikkatini çekme konusundaki beceriniz yeni bir maceracı hayatında karşılığını verir.
    İki nitelik artışı seçin. Biri Kuvvet veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Gösteri becerisinde ve Gladyatörlük İlimi becerisinde eğitimlisiniz. Etkileyici Performans beceri hünerini kazanırsınız.

omen://background/guard?source=paizo-pathfinder-player-core:
  name: Muhafız
  description: >
    İster vatanseverlikten ister para ihtiyacından olsun, muhafızlık yaptınız. Her iki durumda da laf anlamaz bir şüpheliyi nasıl konuşturacağınızı bilirsiniz. Muhafızlıktan nasıl ayrılmış olursanız olun, maceracılığı becerilerinizi daha geniş bir sahnede kullanmanın bir yolu olarak görebilirsiniz.
    İki nitelik artışı seçin. Biri Kuvvet veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Gözdağı becerisinde ve Hukuk İlimi ya da Harp İlimi becerisinde eğitimlisiniz. Hızlı Tehdit beceri hünerini kazanırsınız.

omen://background/herbalist?source=paizo-pathfinder-player-core:
  name: Aktar
  description: >
    Resmi eğitim almış bir eczacı veya halk tıbbının kırsal bir uygulayıcısı olarak çeşitli şifalı bitkilerin iyileştirici özelliklerini öğrendiniz. Her türlü ortamda doğru doğal şifaları toplamakta ve bunları uygun şekilde hazırlamakta ustasınızdır.
    İki nitelik artışı seçin. Biri Dayanıklılık veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Doğa becerisinde ve Aktarlık İlimi becerisinde eğitimlisiniz. Doğal Tıp beceri hünerini kazanırsınız.

omen://background/hermit?source=paizo-pathfinder-player-core:
  name: Münzevi
  description: >
    Mağara, ücra bir vaha veya tenha bir konak gibi izole bir yerde yalnız bir hayat sürdünüz. Maceracılık yalnızlıktan hoş bir kurtuluş veya istenmeyen bir değişiklik olabilir; ancak her iki durumda da muhtemelen hâlâ yontulmamış birisinizdir.
    İki nitelik artışı seçin. Biri Dayanıklılık veya Zekâ olmalı ve diğeri serbest nitelik artışıdır.
    Doğa veya Okültizm becerisinin yanı sıra münzevi olarak yaşadığınız araziyle ilişkili bir İlim becerisinde (Mağara İlimi veya Çöl İlimi gibi) eğitimlisiniz. Şüpheli Bilgi beceri hünerini kazanırsınız.

omen://background/hunter?source=paizo-pathfinder-player-core:
  name: Avcı
  description: >
    Yaban hayatındaki hayvanları ve diğer yaratıkları gizlice takip edip avladınız. Hayvanların derisini yüzmek, etlerini toplamak ve onları pişirmek de eğitiminizin bir parçasıydı; bunların tümü macera sırasında size faydalı kaynaklar sağlayabilir.
    İki nitelik artışı seçin. Biri Çeviklik veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Hayatta Kalma becerisinde ve Dericilik İlimi becerisinde eğitimlisiniz. Yaban Hayatını İncele beceri hünerini kazanırsınız.

omen://background/laborer?source=paizo-pathfinder-player-core:
  name: İşçi
  description: >
    Yıllarınızı ağır fiziksel işler yaparak geçirdiniz. Zorlu bir hayattı ama bir şekilde hayatta kaldınız. Dünyada yolunuzu bulmanın daha kolay bir yolu olarak maceracılığı benimsemiş olabilirsiniz ya da başkasının emri altında maceraya atılıyor olabilirsiniz.
    İki nitelik artışı seçin. Biri Kuvvet veya Dayanıklılık olmalı ve diğeri serbest nitelik artışıdır.
    Atletizm becerisinde ve İşçilik İlimi becerisinde eğitimlisiniz. Güçlü Hamal beceri hünerini kazanırsınız.

omen://background/martial-disciple?source=paizo-pathfinder-player-core:
  name: Dövüş Sanatı Öğrencisi
  description: >
    Büyük bir savaşçı olmak için kendinizi yoğun antrenmanlara ve disiplinli çalışmalara adadınız. Katıldığınız okul gelenekçi bir manastır, seçkin bir askeri akademi ya da prestijli bir paralı asker örgütünün yerel şubesi olabilir.
    İki nitelik artışı seçin. Biri Kuvvet veya Çeviklik olmalı ve diğeri serbest nitelik artışıdır.
    Akrobasi veya Atletizm becerileri arasından seçtiğiniz birinde eğitimlisiniz. Akrobasi'yi seçtiyseniz Kedi Düşüşü, Atletizm'i seçtiyseniz Hızlı Zıplama beceri hünerini kazanırsınız. Ayrıca Harp İlimi becerisinde de eğitimlisiniz.

omen://background/merchant?source=paizo-pathfinder-player-core:
  name: Tüccar
  description: >
    Tozlu bir dükkânda, pazar tezgâhında veya tüccar kervanında parayla ve ticaret mallarıyla takas yaptınız. Edindiğiniz beceriler, iyi bir zırh takımının ölümünüzü engelleyebileceği macera hayatında da geçerlidir.
    İki nitelik artışı seçin. Biri Zekâ veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Diplomasi becerisinde ve Ticaret İlimi becerisinde eğitimlisiniz. Kelepir Avcısı beceri hünerini kazanırsınız.

omen://background/miner?source=paizo-pathfinder-player-core:
  name: Madenci
  description: >
    Yerin ışıksız derinliklerinden değerli madenleri söküp çıkararak hayatınızı kazandınız. Maceracılık bu bel büken emeğe kıyasla kârlı veya göz alıcı görünmüş olabilir—ve eğer yeraltına geri dönmeniz gerekirse, bu kez bir madenci kazması yerine gerçek bir silahla donanmış olarak gitmeyi planlıyorsunuzdur.
    İki nitelik artışı seçin. Biri Kuvvet veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Hayatta Kalma becerisinde ve Madencilik İlimi becerisinde eğitimlisiniz. Yeraltı arazisi ile Arazi Uzmanlığı beceri hünerini kazanırsınız.

omen://background/noble?source=paizo-pathfinder-player-core:
  name: Soylu
  description: >
    Sıradan halka göre bir soylunun hayatı pastoral bir lüksten ibaret görünür; ancak bir soylu ya da hevesli seçkin sınıfın bir üyesi olarak büyüdüğünüzden gerçeği bilirsiniz: bir soylunun payı yükümlülükler ve entrikalardır. Maceraya atılarak vazifelerinizden kaçmak veya konumunuzu yükseltmek istiyor olun, ipekleri ve tantanayı bir maceracının hayatıyla değiştirdiniz.
    İki nitelik artışı seçin. Biri Zekâ veya Karizma olmalı ve diğeri serbest nitelik artışıdır.
    Sosyoloji becerisinde ve Soybilim İlimi ya da Hanedan Armaları İlimi becerisinde eğitimlisiniz. Saray Nezaketi beceri hünerini kazanırsınız.

omen://background/nomad?source=paizo-pathfinder-player-core:
  name: Göçebe
  description: >
    Diyar diyar dolaşarak yolda ve bilinmeyen topraklarda hayatta kalmak, az erzakla ve hatta daha az konforla idare etmek için temel taktikleri öğrendiniz. Bir maceracı olarak hâlâ seyahat ediyorsunuz, üstelik çoğu zaman daha da tehlikeli yerlere.
    İki nitelik artışı seçin. Biri Dayanıklılık veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Hayatta Kalma becerisinde ve seyahat ettiğiniz bir araziyle ilişkili bir İlim becerisinde (Çöl İlimi veya Bataklık İlimi gibi) eğitimlisiniz. Hayatta Kalma ile Özgüven beceri hünerini kazanırsınız.

omen://background/prisoner?source=paizo-pathfinder-player-core:
  name: Mahkûm
  description: >
    (Suçlu olsanız da olmasanız da) suçlardan ötürü hapsedildiniz veya cezalandırıldınız. Artık cezanız bittiğine ya da kaçtığınıza göre, maceracı hayatınızın getirdiği yeni özgürlüğün tadını sonuna kadar çıkarıyorsunuz.
    İki nitelik artışı seçin. Biri Kuvvet veya Dayanıklılık olmalı ve diğeri serbest nitelik artışıdır.
    Gizlilik becerisinde ve Yeraltı Dünyası İlimi becerisinde eğitimlisiniz. Deneyimli Kaçakçı beceri hünerini kazanırsınız.

omen://background/sailor?source=paizo-pathfinder-player-core:
  name: Denizci
  description: >
    Denizin çağrısını genç yaşta duydunuz. Belki bir tüccar gemisine yazıldınız, donanmaya katıldınız, hatta belki de korsanlar ve haydutlardan oluşan bir mürettebata karıştınız.
    İki nitelik artışı seçin. Biri Kuvvet veya Çeviklik olmalı ve diğeri serbest nitelik artışıdır.
    Atletizm becerisinde ve Denizcilik İlimi becerisinde eğitimlisiniz. Sualtı Çapulcusu beceri hünerini kazanırsınız.

omen://background/scholar?source=paizo-pathfinder-player-core:
  name: Akademisyen
  description: >
    Öğrenmeye yatkınlığınız vardı ve öğrenebileceğiniz her şeyi öğrenmek için kendinizi dış dünyadan soyutladınız. Kitaplarınızda pek çok harikulade yer ve şey hakkında okudunuz, daima bir gün gerçeklerini görmeyi hayal ettiniz. Nihayetinde bu merak, çalışmalarınızı bırakıp bir maceracı olmanıza yol açtı.
    İki nitelik artışı seçin. Biri Zekâ veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Arkana, Doğa, Okültizm veya Din becerileri arasından seçtiğiniz birinde eğitimlisiniz ve seçtiğiniz beceride Özgüven beceri hünerini kazanırsınız. Ayrıca Akademi İlimi becerisinde de eğitimlisiniz.

omen://background/scout?source=paizo-pathfinder-player-core:
  name: İzci
  description: >
    Patikalar bulup yolculara rehberlik ederken yaban hayatını eviniz bildiniz. Gezginlik tutkunuz sizi macera hayatına çağırmış olabilir ya da belki de askerler için izcilik yaptınız ve savaşı sevdiğinizi fark ettiniz.
    İki nitelik artışı seçin. Biri Çeviklik veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Hayatta Kalma becerisinde ve izcilik yaptığınız bir araziyle ilişkili bir İlim becerisinde (Orman İlimi veya Mağara İlimi gibi) eğitimlisiniz. Yiyecek Arayıcısı beceri hünerini kazanırsınız.

omen://background/street-urchin?source=paizo-pathfinder-player-core:
  name: Sokak Çocuğu
  description: >
    Büyük bir şehrin sokaklarında yankesicilik yaparak kıt kanaat geçindiniz, bir sonraki yemeğinizi nerede bulacağınızı asla bilemediniz. Bazıları şan ve şöhret için maceraya atılırken, siz hayatta kalmak için bunu yapıyorsunuz.
    İki nitelik artışı seçin. Biri Çeviklik veya Dayanıklılık olmalı ve diğeri serbest nitelik artışıdır.
    Hırsızlık becerisinde ve sokak çocuğu olarak yaşadığınız şehir için bir İlim becerisinde (Absalom İlimi veya Magnimar İlimi gibi) eğitimlisiniz. Yankesici beceri hünerini kazanırsınız.

omen://background/teacher?source=paizo-pathfinder-player-core:
  name: Öğretmen
  description: >
    İnanılmaz derecede bilgili, hünerlisiniz ve belki de çocuklara ve yetişkinlere dünyayı ve harikalarını öğretmek için özel eğitim aldınız. Kitaplardan derslere kadar bilginizi herkese aktarmaya kendinizi adadınız. Yine de her şey bir kitaptan öğretilemez veya öğrenilemez; bu yüzden konuları daha doğrudan öğrenmek ve bu bilgeliği öğrencilerinize geri getirmek için maceracı oldunuz.
    İki nitelik artışı seçin. Biri Zekâ veya Bilgelik olmalı ve diğeri serbest nitelik artışıdır.
    Gösteri veya Sosyoloji becerileri arasından seçtiğiniz birinde ve Akademi İlimi becerisinde eğitimlisiniz. Deneyimli Meslek Erbabı beceri hünerini kazanırsınız.

omen://background/tinker?source=paizo-pathfinder-player-core:
  name: Tamirci
  description: >
    Her türlü küçük icadı yaratmak, sorun çözme arzunuzu tatmin eder. Mühendislik becerileriniz bilhassa yaratıcı bir yöne kaymıştır ve bundan sonra ne icat edeceğinizi kimse bilemez. Muazzam bir potansiyele sahip dâhiyane bir aygıt da olabilir, patlayabilir de.
    İki nitelik artışı seçin. Biri Çeviklik veya Zekâ olmalı ve diğeri serbest nitelik artışıdır.

omen://background/warrior?source=paizo-pathfinder-player-core:
  name: Muharip
  description: >
    Gençlik günlerinizde bir paralı asker, göçebe bir halkı savunan bir savaşçı veya bir milis ya da ordunun üyesi olarak savaşa atıldınız. Bu güçlerin nizamlı yapısından kopmak istemiş olabilirsiniz ya da her zaman şimdiki gibi bağımsız bir muharip olmuş olabilirsiniz.
    İki nitelik artışı seçin. Biri Kuvvet veya Dayanıklılık olmalı ve diğeri serbest nitelik artışıdır.
    Gözdağı becerisinde ve Harp İlimi becerisinde eğitimlisiniz. Korkutucu Bakış beceri hünerini kazanırsınız.
