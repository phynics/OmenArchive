# tr overrides: class

omen://class/bard/bard?source=paizo-pathfinder-player-core:
  name: Ozan
  description: >
    Sanatın ustası, gizli sırların bilgini ve büyüleyici bir ikna edicisiniz. Güçlü performanslar kullanarak zihinleri etkiler ve ruhları kahramanlığın yeni mertebelerine yükseltirsiniz. Güçlerinizi karizmatik bir lider olmak için kullanabilir veya belki de bir danışman, manipülatör, bilgin, düzenbaz ya da virtüöz olabilirsiniz. Çok yönlülüğünüz bazılarının sizi ayartıcı bir hayta ve her işten anlayan biri olarak görmesine yol açsa da hiçbirinde usta olmadığınızı düşünerek sizi hafife almak tehlikelidir.
    Ozan

omen://class/bard/features/bard-spellcasting?source=paizo-pathfinder-player-core:
  name: Ozan Büyücülüğü
  description: >
    Ezoterik bilgiden büyü çekersiniz. Bir büyücüsünüz ve Büyü Yap aktivitesini kullanarak okült geleneğin büyülerini yapabilirsiniz.
    Bir ozan olarak büyü yaptığınızda tekerlemeleriniz müzikal riffler veya zekice nükteler olabilir, jestleriniz dans ve dramatik pandomim içerebilir ve büyü yapmanıza bir müzik aleti çalarak eşlik edebilirsiniz.
    Her gün en fazla iki adet 1. derece büyü yapabilirsiniz. Büyüleri yapabilmek için onları bilmeniz gerekir ve bunları büyü repertuarı sınıf özelliği aracılığıyla öğrenirsiniz. Her gün yapabileceğiniz büyü sayısına büyü slotlarınız denir.
    Bir ozan olarak seviye atladıkça günlük büyü sayınız ve yapabileceğiniz en yüksek büyü derecesi artar.
    Bazı büyüleriniz ne kadar etkili olduklarını görmek için bir büyü saldırısı denemenizi gerektirir veya düşmanlarınızın büyü ZD'nize karşı zar atmasını sağlar (genellikle bir kurtarış deneyerek). Ana niteliğiniz Karizma olduğundan, büyü saldırı modifiyerleriniz ve büyü ZD'leriniz Karizma bonusunuzu kullanır.
    Büyüleri Güçlendirme
    2. derece ve daha yüksek büyü slotları kazandığınızda, bu slotları daha düşük derecedeki büyülerin daha güçlü versiyonlarıyla doldurabilirsiniz. Bu durum büyünün derecesini artırarak onu büyü slotuna uyacak şekilde güçlendirir. Bir büyüyü o derecede güçlendirebilmek için büyü repertuarınızda o derecede bulunması gerekir. Birçok büyü belirli derecelere güçlendirildiğinde özel geliştirmeler kazanır. İmza büyüleri sınıf özelliği belirli büyüleri serbestçe güçlendirmenize olanak tanır.
    Kantripler
    Büyülerinizin bazıları kantriplerdir. Kantrip, büyü slotu kullanmayan özel bir büyü türüdür. Bir kantripi günde istediğiniz kadar, dilediğinizce yapabilirsiniz. Bir kantrip otomatik olarak seviyenizin yukarı yuvarlanmış yarısına güçlendirilir—bu genellikle sahip olduğunuz en yüksek ozan büyü slotu derecesine eşittir. Örneğin 1. seviye bir ozan olarak kantripleriniz 1. derece büyülerdir ve 5. seviye bir ozan olarak kantripleriniz 3. derece büyülerdir.

omen://class/bard/features/bard-weapon-expertise?source=paizo-pathfinder-player-core:
  name: Ozan Silah Uzmanlığı
  description: Ozan silahlarıyla tamamen yetkin hâle geldiniz. Askeri silahlar, basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir. Bestelerinizden biri etkinken bu silahlardan birini veya silahsız bir saldırıyı kullanarak yapılan bir saldırı zarında kritik başarı elde ettiğinizde, o silah veya silahsız saldırı için kritik uzmanlaşma etkisini uygularsınız.

omen://class/bard/features/composition-spells?source=paizo-pathfinder-player-core:
  name: Marş Büyüleri
  description: >
    Beste adı verilen benzersiz etkiler yaratmak için performanslarınıza büyü aşılayabilirsiniz. Besteler, yaparken sıklıkla Gösteri becerisini kullanmanızı gerektiren özel bir büyü türüdür. Beste büyüleri bir odak büyüsü türüdür. Bir odak büyüsü yapmak 1 Odak Puanı harcar ve 1 Odak Puanlık bir odak havuzuyla başlarsınız. Günlük hazırlıklarınız sırasında odak havuzunuzu doldurursunuz ve gösteri yapmak, yeni bir beste yazmak ya da ilham perinizle başka bir şekilde meşgul olmak için Odak Yenileme eylemini kullanarak 10 dakika harcayarak 1 Odak Puanı geri kazanabilirsiniz.
    Odak büyüleri tıpkı kantripler gibi otomatik olarak seviyenizin yukarı yuvarlanmış yarısına güçlendirilir. Odak büyüleri büyü slotu gerektirmez ve onları büyü slotları kullanarak yapamazsınız. Hünerler almak size daha fazla odak büyüsü kazandırabilir ve odak havuzunuzun boyutunu artırabilir; ancak odak havuzunuz asla 3 Odak Puanından fazlasını tutamaz. İşitsel ve görsel etkilere karşı koruma sağlayan Karşı Performans beste büyüsünü öğrenirsiniz.
    Beste Kantripleri
    Beste kantripleri Odak Puanı harcamayan özel beste büyüleridir, böylece onları dilediğiniz sıklıkta kullanabilirsiniz. Beste kantripleri, ozan büyücülüğüyle seçtiğiniz kantriplere ilavedir. Diğer kantriplerin aksine, yeniden eğitim yoluyla ilgili hüneri değiştirmediğiniz sürece ozan hünerlerinden kazanılan beste kantriplerini sonraki bir seviyede değiştiremezsiniz.
    Müttefiklerinizin saldırılarını, hasarını ve korkuya karşı savunmasını artıran Cesaret Marşı beste kantripini öğrenirsiniz.

omen://class/bard/features/expert-spellcaster?source=paizo-pathfinder-player-core:
  name: Uzman Büyücü
  description: >
    Animist: Ruhların büyüsü içinizden serbestçe akar. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.

    Ozan: Büyüsel teknikleriniz güçlenir. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz uzmanlığa yükselir.

    Druid: Doğa güçlerine olan hakimiyetiniz derinleşerek büyülerinizi güçlendirir. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.

    Magus: Büyüye dair temel kavrayışınız gelişerek büyülerinize karşı koymayı zorlaştırır. Büyü saldırı modifiyeriniz ve büyü ZD'niz için yetkinlik dereceleriniz uzmanlığa yükselir.

    Kâhin: İlahi gücünüzün karmaşıklığı zamanla daha da berraklaşır. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz uzmanlığa yükselir.

    Psychic: İçsel muhakeme size kendinize dair daha derin bir bilgi ve bununla birlikte psişik güç kazandırır. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.

    Sorcerer: Doğal büyünüz emirlerinize kolayca ve güçlü bir şekilde karşılık verir. Soy geleneğinizin büyüleri için büyü saldırı modifiyeri ve büyü ZD'si yetkinlik dereceleriniz uzmanlığa yükselir.

    Summoner: Eidolonunuzla olan bağınız derinleştikçe büyülerin gücü de artar. Büyü saldırı modifiyeri ve büyü ZD'si istatistikleri için yetkinlik dereceleriniz uzmanlığa yükselir.

    Witch: Haminizin size bahşettiği gücü daha iyi kontrol etmeyi öğrenirsiniz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.

    Wizard: Mistik ilimlerdeki kapsamlı pratik yeteneklerinizi geliştirir. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.

omen://class/bard/features/fortitude-expertise?source=paizo-pathfinder-player-core:
  name: Dayanıklılık Uzmanlığı
  description: >
    Animist: Ruhani enerji bedeninizi takviye ederek sizi daha dirençli kılar. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

    Ozan, Komutan, Müfettiş, Kabadayı: Maceralarınızda bünyeniz dayanıklı hâle geldi. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

    Druid: Maceralar bünyenizi daha dayanıklı hâle getirdi. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

    Psychic: Zihniniz, bedeninizi bilinçaltındaki zihinsel benlik imajınıza bağlı tutar. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/bard/features/greater-performers-heart?source=paizo-pathfinder-player-core:
  name: Gelişmiş İcracı Yüreği
  description: Sağlığınızı katıksız irade ve yaşam sevinciyle korumayı öğrendiniz. Dayanıklılık kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir Dayanıklılık kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/bard/features/legendary-spellcaster?source=paizo-pathfinder-player-core:
  name: Efsanevi Büyücü
  description: >
    Animist: Öte alemlerin büyü enerjileri için neredeyse kusursuz bir kanal hâline gelirsiniz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.

    Ozan: Büyüye olan hâkimiyetiniz efsanelere konu olacak düzeydedir. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz efsaneviye yükselir.

    Druid: Doğanın büyüsüyle benzersiz bir uyum geliştirirsiniz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.

    Kâhin: İlahi gücü çok az kişinin boy ölçüşebileceği bir seviyede dizginleyebilirsiniz. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz efsaneviye yükselir.

    Psychic: Eğitiminiz zirveye ulaştığında yalnızca kendi zihninizi değil, tüm psişik gücün kaynağı olan kolektif bilinçdışını da anlarsınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.

    Sorcerer: Büyücülük konusunda olağanüstü bir yetenek sergilersiniz. Soy geleneğinizin büyüleri için büyü saldırı modifiyeri ve büyü ZD'si yetkinlik dereceleriniz efsaneviye yükselir.

    Witch: Haminizin sağladığı büyüye olan hâkimiyetinizi kusursuzlaştırırsınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.

    Wizard: Hem mistik teoriyi hem de pratik büyü ustalığını harmanlayan yetkin bir büyücüsünüz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.

omen://class/bard/features/light-armor-expertise?source=paizo-pathfinder-player-core:
  name: Hafif Zırh Uzmanlığı
  description: Hafif zırh giyerken veya zırhsızken nasıl sıyrılacağınızı öğrendiniz. Hafif zırh ve zırhsız savunma için yetkinlik dereceleriniz uzmanlığa yükselir.

omen://class/bard/features/magnum-opus?source=paizo-pathfinder-player-core:
  name: Başyapıt
  description: Kendinizi okült büyünün nihai ezoterik sırlarıyla uyumlu hâle getirdiniz. Tek bir 10. derece büyü slotu kazanırsınız ve ozan büyücülüğünü kullanarak bu slota bir büyü hazırlayabilirsiniz. Seviye atladıkça daha fazla 10. derece büyü kazanmazsınız, ancak ikinci bir slot kazanmak için Kusursuz Bis hünerini alabilirsiniz.

omen://class/bard/features/master-spellcaster?source=paizo-pathfinder-player-core:
  name: Usta Büyücü
  description: >
    Animist: Bağ kurduğunuz tecellilerle olan yakınlığınız büyünüzün kudretini daha da artırır. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Ozan: Büyünün ipliklerini bir arpın telleri gibi çalarsınız. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.

    Druid: Doğa büyüsü emirlerinize cevap verir. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Magus: Büyülerinizi ustaca bir hünerle güçlendirirsiniz. Büyü saldırı modifiyeriniz ve büyü ZD'niz için yetkinlik dereceleriniz ustalığa yükselir.

    Kâhin: Gizeminizin içindeki derin ve karmaşık ilahi gücü layıkıyla anlarsınız. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.

    Psychic: Kendi zihninizin en derin köşelerine erişim kazanırsınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Sorcerer: Kanınızdaki büyü üzerinde ustalık kazanırsınız. Soy geleneğinizin büyüleri için büyü saldırı modifiyeri ve büyü ZD'si yetkinlik dereceleriniz ustalığa yükselir.

    Summoner: Eidolonunuzla olan bağınız, ilişkili büyüler üzerinde size ustalık kazandıracak kadar güçlüdür. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.

    Witch: Haminizin büyüsü üzerinde ustalık kazanırsınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Wizard: Kusursuz bir büyücülük yeteneğine hükmedersiniz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

omen://class/bard/features/muses?source=paizo-pathfinder-player-core:
  name: İlham Perileri
  description: >
    Bir ozan olarak 1. seviyede bir ilham perisi seçersiniz. Bu ilham perisi sizi büyük işlere yönlendirir ve tanıdığınız biri, doğaüstü bir yaratık, bir konum, bir tanrı, bir felsefe ya da büyüleyici bir gizem olabilir. Aldığınız ilhamın türüne bağlı olarak, 1. seviye ilham periniz size belirli bir 1. seviye ozan hüneri kazandırır ve repertuarınıza bir büyü ekler.
    Buna ek olarak her bir ilham perisi, sonraki birçok ozan hünerinin kapısını açar. Tek bir ilham türü ilham perinizi temsil etmeye yetmiyorsa Çok Yönlü İlham Perisi hünerini değerlendirin. • Muamma • Maestro • Hezarfen • Cenkçi • Zoofoni

omen://class/bard/features/perception-mastery?source=paizo-pathfinder-player-core:
  name: Dikkat Ustalığı
  description: >
    Barbar İçgüdünüz duyularınızın her birini daha da keskinleştirir. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Ozan, Silahşör, Düzenbaz Keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Komutan Bir senaryoyu her yönüyle görebilme yeteneği geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Timsal Maceralarınız boyunca, koruduklarınıza göz kulak olmak ve canavarlara ile diğer tehditlere karşı tetikte olmak için keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Müfettiş, Kabadayı, Thaumaturge Maceralarınız boyunca keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Korucu Son derece gelişmiş bir keskinliğe ve ayrıntılara dikkate sahipsiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.

omen://class/bard/features/performers-heart?source=paizo-pathfinder-player-core:
  name: İcracı Yüreği
  description: Kendinizi güvende ve sağlam tutmayı, tehlikeli durumlardan kaçınmayı ve performanslarınız için en üst formda kalmayı öğrendiniz. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir. Bir Dayanıklılık kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/bard/features/reflex-expertise?source=paizo-pathfinder-player-core:
  name: Refleks Uzmanlığı
  description: >
    Tehlikelerden sıyrılma konusunda bir ustalık geliştirdiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.
    Muhafız En ağır zırhların içindeyken bile geniş çaplı etkilere karşı kendinizi hazırlayabilirsiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/bard/features/signature-spells?source=paizo-pathfinder-player-core:
  name: İmza Büyüleri
  description: "Bazı büyülerinizi daha esnek bir şekilde yapmayı öğrendiniz. Erişebildiğiniz her büyü derecesi için o dereceden bir büyüyü imza büyüsü olarak seçin. İmza büyülerinin güçlendirilmiş versiyonlarını ayrı ayrı öğrenmeniz gerekmez; bunun yerine bu büyüleri serbestçe güçlendirebilirsiniz. Bir imza büyüsünü minimum derecesinden daha yüksek bir derecede öğrendiyseniz, o büyüleri ayrı ayrı öğrenmeden tüm alt derece versiyonlarını da yapabilirsiniz. Bir imza büyüsünü değiştirirseniz, önceki büyüyü öğrendiğiniz büyü derecesinde yeni bir imza büyüsü seçebilirsiniz. Ayrıca herhangi bir büyüyü değiştirmeden bir imza büyüsünü o derecedeki farklı bir büyüyle değiştirmek için özel olarak yeniden eğitim yapabilirsiniz; bu, normal bir büyünün yeniden eğitilmesi kadar zaman alır."

omen://class/bard/features/spell-repertoire?source=paizo-pathfinder-player-core:
  name: Büyü Repertuarı
  description: >
    Ozan Yapabileceğiniz büyülerin koleksiyonuna büyü repertuarınız denir. 1. seviyede kendi seçtiğiniz iki adet 1. derece okült büyü ve kendi seçtiğiniz beş adet okült kantrip öğrenirsiniz. Bunları okült listesindeki yaygın büyülerden veya erişiminiz olan diğer okült büyülerden seçersiniz. Büyü repertuarınızdaki herhangi bir büyüyü, uygun büyü derecesindeki bir büyü slotunu kullanarak yapabilirsiniz.
    Seviye atladıkça bu büyü repertuarına eklemeler yaparsınız. Her büyü slotu kazandığınızda (bkz. Günlük Ozan Büyüleri tablosu), büyü repertuarınıza aynı derecede bir büyü eklersiniz. 2. seviyede başka bir 1. derece büyü seçersiniz; 3. seviyede iki adet 2. derece büyü seçersiniz ve bu şekilde devam eder. Büyü eklerken hâlihazırda sahip olduğunuz bir büyünün daha yüksek derecedeki bir versiyonunu ekleyebilir, böylece o büyünün güçlendirilmiş bir versiyonunu yapabilirsiniz.
    Aynı oranda kazansanız da büyü slotlarınız ve büyü repertuarınızdaki büyüler ayrıdır. Bir hüner veya başka bir yetenek büyü repertuarınıza bir büyü eklerse bu size fazladan bir büyü slotu vermez, bunun tersi de geçerlidir.
    Repertuarınızdaki Büyüleri Değiştirme
    Repertuarınızda yeni büyüler kazandıkça, daha önce öğrendiğiniz bazı büyüleri değiştirmek isteyebilirsiniz. Her seviye atladığınızda ve yeni büyüler öğrendiğinizde, eski büyülerinizden birini aynı derecedeki farklı bir büyüyle değiştirebilirsiniz. Bu büyü bir kantrip olabilir. Büyüleri boş zaman sırasında yeniden eğitim yaparak da değiştirebilirsiniz.
    Kâhin Yapabileceğiniz büyülerin koleksiyonuna büyü repertuarınız denir. 1. seviyede kendi seçtiğiniz iki adet 1. derece ilahi büyü ve kendi seçtiğiniz beş adet ilahi kantrip öğrenirsiniz. Bunları ilahi listedeki yaygın büyülerden veya erişiminiz olan diğer ilahi büyülerden seçersiniz. Büyü repertuarınızdaki herhangi bir büyüyü, uygun büyü derecesindeki bir büyü slotunu kullanarak yapabilirsiniz.
    Seviye atladıkça bu büyü repertuarına eklemeler yaparsınız. Her büyü slotu kazandığınızda (bkz. Günlük Kâhin Büyüleri tablosu), büyü repertuarınıza aynı derecede bir büyü eklersiniz. 2. seviyede başka bir 1. derece büyü seçersiniz; 3. seviyede iki adet 2. derece büyü seçersiniz ve bu şekilde devam eder. Büyü eklerken hâlihazırda sahip olduğunuz bir büyünün daha yüksek derecedeki bir versiyonunu ekleyebilir, böylece o büyünün güçlendirilmiş bir versiyonunu yapabilirsiniz.
    Büyü slotlarınız ve büyü repertuarınızdaki büyüler ayrıdır. Bir hüner veya başka bir yetenek büyü repertuarınıza bir büyü eklerse bu size fazladan bir büyü slotu vermez, bunun tersi de geçerlidir.
    Repertuarınızdaki Büyüleri Değiştirme
    Repertuarınızda yeni büyüler kazandıkça, daha önce öğrendiğiniz bazı büyüleri değiştirmek isteyebilirsiniz. Her seviye atladığınızda ve yeni büyüler öğrendiğinizde, eski büyülerinizden birini aynı derecedeki farklı bir büyüyle değiştirebilirsiniz. Bu büyü bir kantrip olabilir. Büyüleri boş zaman sırasında yeniden eğitim yaparak da değiştirebilirsiniz.
    Psychic Yapabileceğiniz büyülerin koleksiyonuna büyü repertuarınız denir. 1. seviyede kendi seçtiğiniz bir adet 1. derece okült büyü ve kendi seçtiğiniz üç adet okült kantrip öğrenirsiniz. Bunları okült listesindeki yaygın büyülerden veya erişiminiz olan diğer okült büyülerden seçersiniz. Büyü repertuarınızdaki herhangi bir büyüyü, uygun büyü derecesindeki bir büyü slotunu kullanarak yapabilirsiniz. Bilinçli zihin tercihiniz ayrıca repertuarınıza ilave büyüler kazandırır; bu, bilinçli zihninizde listelenen ve psi kantripleri olarak yaptığınız ek bir 1. derece büyü ve iki kantrip ile başlar.
    Seviye atladıkça bu büyü repertuarına eklemeler yaparsınız. Her büyü slotu kazandığınızda (bkz. Tablo 2), büyü repertuarınıza aynı derecede bir büyü eklersiniz. 2. seviyede başka bir 1. derece büyü seçersiniz; 3. seviyede bir adet 2. derece büyü seçersiniz ve bu şekilde devam eder. Büyü eklerken hâlihazırda sahip olduğunuz bir büyünün daha yüksek derecedeki bir versiyonunu ekleyebilir, böylece o büyünün güçlendirilmiş bir versiyonunu yapabilirsiniz. Bilinçli zihniniz ayrıca daha yüksek derecelerde büyüler kazandıkça repertuarınıza ilave büyüler ekler.
    Aynı oranda kazansanız da büyü slotlarınız ve büyü repertuarınızdaki büyüler ayrıdır. Bir hüner veya başka bir yetenek—bilinçli zihninizden kazandığınız büyüler gibi—büyü repertuarınıza bir büyü eklerse bu size fazladan bir büyü slotu vermez, bunun tersi de geçerlidir.
    Repertuarınızdaki Büyüleri Değiştirme
    Repertuarınızda yeni büyüler kazandıkça, daha önce öğrendiğiniz bazı büyüleri değiştirmek isteyebilirsiniz. Her seviye atladığınızda ve yeni büyüler öğrendiğinizde, eski büyülerinizden birini aynı derecedeki farklı bir büyüyle değiştirebilirsiniz. Bu büyü bir kantrip olabilir. Büyüleri boş zaman sırasında yeniden eğitim yaparak da değiştirebilirsiniz.
    Sorcerer Yapabileceğiniz büyülerin koleksiyonuna büyü repertuarınız denir. 1. seviyede kendi seçtiğiniz iki adet 1. derece büyü ve kendi seçtiğiniz dört adet kantripin yanı sıra soyunuzdan fazladan bir büyü ve kantrip öğrenirsiniz. Bunları soyunuza karşılık gelen geleneğin yaygın büyülerinden veya o gelenekten erişiminiz olan diğer büyülerden seçersiniz. Büyü repertuarınızdaki herhangi bir büyüyü, uygun büyü derecesindeki bir büyü slotunu kullanarak yapabilirsiniz.
    Seviye atladıkça bu büyü repertuarına eklemeler yaparsınız. Her büyü slotu kazandığınızda (yukarıdaki Günlük Sorcerer Büyüleri tablosuna bakın), büyü repertuarınıza aynı derecede bir büyü eklersiniz. Yeni bir büyü derecesi kazandığınızda, ilk yeni büyünüz her zaman soyunuzda listelenen o derecenin Sorcerer armağanı büyüsüdür; ancak diğer büyüleri seçebilirsiniz. 2. seviyede başka bir 1. derece büyü seçersiniz; 3. seviyede soyunuzdan yeni bir büyü ve diğer iki adet 2. derece büyü kazanırsınız ve bu şekilde devam eder. Büyü eklerken hâlihazırda bildiğiniz bir büyünün daha yüksek derecedeki bir versiyonunu seçebilir, böylece o büyünün güçlendirilmiş bir versiyonunu yapabilirsiniz.
    Aynı oranda kazansanız da büyü slotlarınız ve büyü repertuarınızdaki büyüler ayrıdır. Bir hüner veya başka bir yetenek büyü repertuarınıza bir büyü eklerse bu size başka bir büyü slotu kazandırmaz veya bunun tersi geçerlidir.
    Repertuarınızdaki Büyüleri Değiştirme
    Büyü repertuarınızda yeni büyüler kazandıkça, daha önce öğrendiğiniz bazı büyüleri değiştirmek isteyebilirsiniz. Her seviye atladığınızda ve yeni büyüler öğrendiğinizde, eski büyülerinizden birini aynı derecedeki farklı bir büyüyle değiştirebilirsiniz. Bu büyü bir kantrip olabilir, ancak soy büyülerini değiştiremezsiniz. Büyüleri boş zaman sırasında yeniden eğitim yaparak da değiştirebilirsiniz.
    Summoner Yapabileceğiniz büyülerin koleksiyonuna büyü repertuarınız denir. 1. seviyede kendi seçtiğiniz iki adet 1. derece büyü ve kendi seçtiğiniz beş adet kantrip öğrenirsiniz. Bunları eidolonunuza karşılık gelen geleneğin yaygın büyülerinden veya o gelenekten erişiminiz olan diğer büyülerden seçersiniz. Büyü repertuarınızdaki herhangi bir büyüyü, uygun büyü derecesindeki bir büyü slotunu kullanarak yapabilirsiniz. Büyü slotlarınız ve büyü repertuarınızdaki büyüler ayrıdır. Bir hüner veya başka bir yetenek büyü repertuarınıza bir büyü eklerse bu size başka bir büyü slotu kazandırmaz, ve bunun tersi de geçerlidir.
    Seviye atladıkça bu büyü repertuarına eklemeler yaparsınız. Her büyü slotu kazandığınızda (bkz. Tablo 2–4: Günlük Summoner Büyüleri), büyü repertuarınıza aynı derecede bir büyü eklersiniz. 2. seviyede başka bir 1. derece büyü seçersiniz. 3. seviyede repertuarınıza ilk 2. derece büyüyü eklersiniz. 4. seviyede ikincisini kazanırsınız ve büyü repertuarınız maksimum boyutu olan beş büyüye ulaşır.
    5. seviyede repertuarınıza iki adet 3. derece büyü eklemenin yanı sıra en düşük derecedeki büyü slotlarınızı kaybedersiniz. Bir derece büyü slotu kaybettiğinizde, repertuarınızdaki iki büyüyü de kaybedersiniz. Bunlar hâlihazırda bildiğiniz büyülerden veya öğrendiğiniz yeni büyülerin arasından olabilir. Büyü slotlarınızı değiştirmediğiniz seviyelerde, aşağıda açıklandığı gibi birden fazla büyüyü değiştirebilirsiniz.
    Repertuarınızdaki Büyüleri Değiştirme
    Repertuarınızda yeni büyüler kazandıkça, daha önce öğrendiğiniz bazı büyüleri değiştirmek isteyebilirsiniz. Her seviye atladığınızda ve yeni büyüler öğrendiğinizde, eski büyülerinizden birini aynı derecedeki farklı bir büyüyle değiştirebilirsiniz. Eğer daha düşük derecedeki slot setini kaybettiğiniz bir dereceyse, ikisini herhangi bir sırayla değiştirebilirsiniz. Bunun yerine bir kantripi de değiştirebilirsiniz. Büyüleri boş zaman sırasında yeniden eğitim yaparak da değiştirebilirsiniz.
    6. seviyede ve sonrasındaki her çift seviyede, yapabileceğiniz bir derecedeki farklı büyüler için büyülerinizi dilediğiniz sayıda değiştirebilirsiniz. Bunu yaptığınızda kullanamayacağınız slotlarla kalmamak için en düşük derecedeki büyü slotlarınızla yapabileceğiniz en az bir büyüyü muhafaza etmelisiniz. Örneğin 6. seviyede en az bir adet 2. derece büyüyü muhafaza etmeniz gerekir; ancak diğer tüm büyüleriniz 3. derece olabilir.

omen://class/bard/muses/enigma?source=paizo-pathfinder-player-core:
  name: Muamma
  description: >
    İlham periniz bir gizemdir; sizi yaşamın ve çoklu evrenin gizli sırlarını açığa çıkarmaya yönlendirir. Bu ilham perileri tam olarak kavrayamadığınız kişiler, sembolizmle derinlemesine katmanlanmış metinler ya da bir ömrün emeğini vurgulayan duygusal paradokslar olabilir. İlham periniz öte dünyaya ait bir yaratıksa gizemli bir eon ya da okült bir ejderha olabilir; bir tanrıysa Irori veya Nethys olabilir. Bir muamma ilham perisinden esinlenen sanat esrarengiz, tekinsiz ya da spekülasyon ve komplo yüklü olabilir. Muamma ilham perisine sahip bir ozan olarak, ilham ve okült desteğin yanı sıra bilgi sağlayarak müttefiklerinizi desteklersiniz.
    İlham Perisi Hüneri Ozan İlimi
    İlham Perisi Büyüsü Kesin Saldırı

omen://class/bard/muses/maestro?source=paizo-pathfinder-player-core:
  name: Maestro
  description: >
    İlham periniz sanatsal hünerin daha büyük doruklarına ulaşmanız için size sürekli ilham verir. Birçok ozan için bir öğretmen veya rakip bu rolü üstlenir; ancak bazıları hedeflerini daha yükseğe koyar ve geçmişin büyük bestecilerini geride bırakmaya ya da tamamen yeni bir yol açmaya çalışır. İlham periniz doğaüstü bir yaratıksa koro meleği veya lyrakien azata gibi performans sergilemeyi seven biri olabilir; bir tanrıysa Shelyn olabilir. Bir maestro ilham perisinden esinlenen sanat hassas ve yaratıcıdır, biçimci bir başarıdır.
    Maestro ilham perisine sahip bir ozan olarak müttefikleriniz için bir ilham kaynağısınızdır ve müzikal ile hitabet yeteneklerinize güvenirsiniz.
    İlham Perisi Hüneri Kalıcı Beste
    İlham Perisi Büyüsü Yatıştır

omen://class/bard/muses/polymath?source=paizo-pathfinder-player-core:
  name: Hezarfen
  description: >
    İlham periniz her işten anlayan, beceriler ve uğraşlar arasında mekik dokuyan biridir. Bazı ozanlar sürekli yeni ilham perilerinden etkilenir ya da ilhamlarını ister gerçek bir kişiye dayansın ister tamamen felsefi olsun idealleştirilmiş bir varlıktan alır. İlham periniz tek bir yaratıksa peri gibi eklektik bir varlık ya da uzun bir ömür boyunca çok şey öğrenmiş biri olabilir; bir tanrıysa Desna veya Calistria olabilir. Bir hezarfen ilham perisinden esinlenen sanat kıpır kıpırdır; her beste yeni teknikler ve sürekli gelişen bir tarz sergiler.
    Hezarfen ilham perisine sahip bir ozan olarak geniş bir konu yelpazesine ilgi duyarsınız ancak bunlardan herhangi birine nadiren kendinizi adarsınız ve nadiren karar kılarsınız—her şeyi denemek istersiniz.
    İlham Perisi Hüneri Çok Yönlü Performans
    İlham Perisi Büyüsü Hayali Hizmetkâr

omen://class/bard/muses/warrior?source=paizo-pathfinder-player-core:
  name: Cenkçi
  description: >
    Savaş alanı sizin sahneniz, çeliğin şakırtısı ise şarkınızdır. İlham periniz ister çatışmadan zevk alsın ister onun gerekliliğine boyun eğsin sayısız muharebe görmüştür. Münferit bir asker ya da general size ilham verebilir; ancak özellikle köklü bir geçmişe sahip bir savaş alanı ya da silah da ilham kaynağı olabilir. İlham periniz bir yaratıksa arkon ya da iblis askeri gibi öte dünyadan bir asker olabilir. Bir tanrıysa Gorum olabilir. Bir cenkçi ilham perisinden esinlenen sanat muzaffer ve gürültülüdür, sıklıkla destansı muharebeleri ayrıntılandırır.
    Cenkçi ilham perisine sahip bir ozan olarak performansın yanı sıra savaş için de talim yaparsınız ve müttefiklerinizi çatışmanın tehlikelerine hazırlarsınız. Hatta onlarla birlikte olayların en yoğun olduğu yere bile dalabilirsiniz.
    İlham Perisi Hüneri Askeri Performans
    İlham Perisi Büyüsü Korku

omen://class/cleric/cleric?source=paizo-pathfinder-player-core:
  name: Rahip
  description: >
    İlahlar dünyadaki iradelerini sayısız şekilde ortaya koyar ve siz onların en sadık hizmetkârlarından birisiniz. İlahi büyüyle kutsanmış olarak inancınızın gücü için bir kap vazifesi görür, müttefiklerinizi iyileştirir ve düşmanlarınıza gazap saçarsınız. Duygusuz bir semavi varlığa veya kana susamış bir iblis lorduna tapabilirsiniz; ancak hangi tanrının önünde eğilirseniz eğilin inancınız tamdır.
    Rahip

omen://class/cleric/doctrine-features/fifth-doctrine-cloistered-cleric?source=paizo-pathfinder-player-core:
