  description: Büyü saldırı modifiyeri ve büyü ZD'si istatistikleri için yetkinlik dereceleriniz ustalığa yükselir.

omen://class/cleric/doctrine-features/fifth-doctrine-warpriest?source=paizo-pathfinder-player-core:
  name: Beşinci Öğreti (Savaş Rahibi)
  description: Dayanıklılık kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir Dayanıklılık kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/cleric/doctrine-features/final-doctrine-cloistered-cleric?source=paizo-pathfinder-player-core:
