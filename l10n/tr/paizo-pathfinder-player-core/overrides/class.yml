  description: "İlahınızın lütufkar silahında, askeri silahlarda, basit silahlarda ve silahsız saldırılarda uzman yetkinlik kazanırsınız. İlahınızın lütufkar silahını kullanarak yapılan bir saldırı zarında kritik başarı elde ettiğinizde, silahın kritik uzmanlaşma etkisini uygularsınız; sınıf ZD'niz yerine büyü ZD'nizi kullanabilirsiniz."

omen://class/cleric/doctrines/cloistered-cleric?source=paizo-pathfinder-player-core:
  name: Manastır Rahibi
  description: >
    İlahi büyüye ve ilahınızın alanlarıyla olan bağınıza odaklanan cübbeli bir rahipsiniz.
    Birinci Öğreti (1.): Alan Çömezi rahip hünerini kazanırsınız.
    İkinci Öğreti (3.): Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.
    Üçüncü Öğreti (7.): Büyü saldırı modifiyeri ve büyü ZD'si istatistikleri için yetkinlik dereceleriniz uzmanlığa yükselir.
    Dördüncü Öğreti (11.): İlahınızın lütufkar silahında, basit silahlarda ve silahsız saldırılarda uzman yetkinlik kazanırsınız. İlahınızın lütufkar silahını kullanarak yapılan bir saldırı zarında kritik başarı elde ettiğinizde silahın kritik uzmanlaşma etkisini uygularsınız; sınıf ZD'niz yerine büyü ZD'nizi kullanabilirsiniz.
    Beşinci Öğreti (15.): Büyü saldırı modifiyeri ve büyü ZD'si istatistikleri için yetkinlik dereceleriniz ustalığa yükselir.
    Nihai Öğreti (19.): Büyü saldırı modifiyeri ve büyü ZD'si istatistikleri için yetkinlik dereceleriniz efsaneviye yükselir.

omen://class/cleric/doctrines/warpriest?source=paizo-pathfinder-player-core:
  name: Savaş Rahibi
  description: >
    Kilisenizin daha kavgacı öğretisinde talim görerek hem büyülere hem de muharebeye odaklandınız.
    Birinci Öğreti (1.): Hafif ve orta zırhta eğitimlisinizdir ve Dayanıklılık kurtarışlarında uzman yetkinliğe sahip olursunuz. Bir kalkanla hasarı azaltmaya yarayan bir reaksiyon olan Kalkanla Engelleme genel hünerini kazanırsınız. İlahınızın lütufkar silahı basit bir silah veya silahsız bir saldırı ise Ölümcül Sadelik rahip hünerini kazanırsınız. 13. seviyede, İlahi Savunma sınıf özelliğini kazandığınızda hafif ve orta zırhta da uzman yetkinlik kazanırsınız.
    İkinci Öğreti (3.): Askeri silahlarda eğitimli olursunuz.
    Üçüncü Öğreti (7.): İlahınızın lütufkar silahında, askeri silahlarda, basit silahlarda ve silahsız saldırılarda uzman yetkinlik kazanırsınız. İlahınızın lütufkar silahını kullanarak yapılan bir saldırı zarında kritik başarı elde ettiğinizde silahın kritik uzmanlaşma etkisini uygularsınız; sınıf ZD'niz yerine büyü ZD'nizi kullanabilirsiniz.
    Dördüncü Öğreti (11.): Büyü saldırı modifiyeri ve büyü ZD'si istatistikleri için yetkinlik dereceleriniz uzmanlığa yükselir.
    Beşinci Öğreti (15.): Dayanıklılık kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir Dayanıklılık kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.
    Nihai Öğreti (19.): İlahınızın lütufkar silahında, büyü saldırı modifiyerinde ve büyü ZD'sinde usta yetkinlik kazanırsınız.

omen://class/cleric/features/anathema-cleric?source=paizo-pathfinder-player-core:
  name: Yasak (Rahip)
  description: >
    İlahınızın yönelimine veya ideallerine temelde karşıt olan eylemler inancınız için yasaktır. İlahınız için yasak olan büyüleri öğrenmek veya yapmak, eylemlerde bulunmak ve eşyaları kullanmak sizi ilahınızın lütfundan mahrum bırakır.
    Kötü özelliğine sahip büyüleri yapmak iyi ilahlar için neredeyse her zaman yasaktır ve iyi büyüleri yapmak da aynı şekilde kötü ilahlar için yasaktır; benzer biçimde kaotik büyüleri yapmak yasal ilahlar için, yasal büyüleri yapmak da kaotik ilahlar için yasaktır. Nötr bir ilaha tapan nötr bir rahip bu şekilde sınırlandırılmaz; ancak belirli bir yönelime sahip büyüleri veya yetenekleri sıklıkla kullanırsa yönelimi zamanla değişebilir. Benzer biçimde inancınızın ilkelerine veya amaçlarına aykırı büyüler yapmak ilahınızla olan bağınızı zedeleyebilir. Örneğin hortlak yaratmak için bir büyü yapmak ölüm tanrıçası Pharasma için yasak olacaktır. Sınırda kalan durumlar için hangi eylemlerin yasak olduğunu siz ve GM'niz belirlersiniz.
    İlahınız için yasak olan yeterli sayıda eylem gerçekleştirirseniz veya yöneliminiz ilahınızın izin vermediği bir yöne değişirse, ilahınızla olan bağınızdan gelen büyü yeteneklerini kaybedersiniz. Kaybettiğiniz sınıf özellikleri GM tarafından belirlenir, ancak bunlar muhtemelen ilahi pınarınızı ve tüm ilahi büyücülüğünüzü içerir. Bu yetenekler ancak bir Keffaret ritüeli gerçekleştirerek tövbenizi gösterdiğiniz takdirde geri kazanılabilir.

omen://class/cleric/features/cleric-spellcasting?source=paizo-pathfinder-player-core:
  name: Rahip Büyücülüğü
  description: >
    İlahınız size ilahi büyüleri yapma gücü bahşeder. Bir büyücüsünüz ve Büyü Yap aktivitesini kullanarak ilahi geleneğin büyülerini yapabilirsiniz. Bir rahip olarak ilahileriniz genellikle ilahınızı ve onun güçlü hizmetkârlarını isim veya unvanlarıyla çağırırken jestlerinizi kutsal semboller veya ilahınızın diğer temsilleri takip eder.
    1. seviyede her sabah ilahi büyü listesindeki yaygın büyülerden veya erişim kazanıp Büyü Öğren aracılığıyla öğrendiğiniz diğer ilahi büyülerden iki adet 1. derece büyü ve beş adet kantrip hazırlayabilirsiniz. Hazırlanan büyüler, siz onları yapana veya büyülerinizi tekrar hazırlayana kadar kullanılabilir kalır. Her gün hazırlayabileceğiniz büyü sayısına büyü slotlarınız denir.
    Bir rahip olarak seviyeniz arttıkça yukarıdaki Günlük Rahip Büyüleri tablosunda gösterildiği gibi her gün hazırlayabileceğiniz büyü sayısı ve yapabileceğiniz en yüksek büyü derecesi de artar.
    Bazı büyüleriniz ne kadar etkili olduklarını görmek için bir büyü saldırısı denemenizi veya düşmanlarınızın büyü ZD'nize karşı zar atmasını (genellikle bir kurtarış deneyerek) gerektirir. Ana niteliğiniz Bilgelik olduğundan, büyü saldırı modifiyeriniz ve büyü ZD'niz Bilgelik bonusunuzu kullanır.
    Büyüleri Güçlendirme
    2. derece ve daha yüksek büyü slotları kazandığınızda, bu slotları daha düşük derecedeki büyülerin daha güçlü versiyonlarıyla doldurabilirsiniz. Bu durum büyünün derecesini artırarak onu büyü slotuna uyacak şekilde güçlendirir. Birçok büyü belirli derecelere güçlendirildiğinde özel geliştirmeler kazanır.
    Kantripler
    Büyülerinizin bazıları kantriplerdir. Kantrip, büyü slotu kullanmayan özel bir büyü türüdür. Bir kantripi günde istediğiniz kadar, dilediğinizce yapabilirsiniz. Bir kantrip daima otomatik olarak seviyenizin yukarı yuvarlanmış yarısına güçlendirilir—bu genellikle sahip olduğunuz en yüksek rahip büyü slotu derecesine eşittir. Örneğin 1. seviye bir rahip olarak kantripleriniz 1. derece büyülerdir ve 5. seviye bir rahip olarak kantripleriniz 3. derece büyülerdir.

omen://class/cleric/features/deity-cleric?source=paizo-pathfinder-player-core:
  name: İlah (Rahip)
  description: >
    Bir rahip olarak diğer her şeyin üzerinde hürmet ettiğiniz bir ilahın ölümlü hizmetkârısınızdır. İlahınız size bir beceride ve ilahın lütufkar silahında eğitimli yetkinlik derecesi kazandırır. Lütufkar silah yaygın değilse o silaha da erişim kazanırsınız.
    İlahınız ayrıca büyü listenize büyüler ekler. Bir rahip olarak o derecenin büyülerini hazırlayabildiğinizde bunları tıpkı ilahi büyü listesindeki herhangi bir büyü gibi hazırlayabilirsiniz. Normalde ilahi listede yer almayan bu büyülerin herhangi birini bu şekilde hazırlarsanız yine de ilahi büyü sayılır.
    Kutsama
    İlahınıza bağlı olarak onun kutsaması sizi kutsal veya kutsalsız kılabilir. Bu durum size düzlemlerin ruhları üzerindeki mücadelenin bir tarafına bağlanmanızı sağlayan ve diğer yeteneklerde atıfta bulunulabilen kutsal veya kutsalsız özelliğini verir. İlahınıza göre kutsal veya kutsalsız "olabiliyorsanız" bu seçimi siz yaparsınız; kutsal veya kutsalsız "olmanız gerekiyorsa" bu özelliği otomatik olarak kazanırsınız. Karşıt özelliği herhangi bir şekilde kazanırsanız, bir keffaret ritüelini tamamlayana kadar önceki özelliği kaybedersiniz.
    Yasak
    İlahınızın ideallerine temelde karşıt olan eylemler inancınız için yasaktır. İlahınız için yasak olan büyüleri öğrenmek veya yapmak, eylemlerde bulunmak ve eşyaları kullanmak sizi ilahınızın lütfundan mahrum bırakır.
    Kutsalsız özelliğine sahip büyüleri yapmak, kutsalsız kutsamaya izin vermeyen ilahlar için neredeyse her zaman yasaktır; kutsal büyüleri yapmak da kutsal kutsamaya izin vermeyenler için aynı şekilde yasaktır. Benzer şekilde inancınızın ilkelerine veya amaçlarına aykırı büyüler yapmak ilahınızla olan bağınızı zedeleyebilir. Örneğin hortlak yaratmak için bir büyü yapmak ölüm tanrıçası Pharasma için yasak olacaktır. Yasak olan birçok eylem hiçbir ilahın resmi listesinde yer almaz. Sınırda kalan durumlar için hangi eylemlerin yasak olduğunu siz ve GM'niz belirlersiniz.
    İlahınız için yasak olan yeterli sayıda eylem gerçekleştirirseniz, ilahınızla olan bağınızdan gelen büyü yeteneklerini kaybedersiniz. Kaybettiğiniz sınıf özellikleri GM tarafından belirlenir, ancak bunlar muhtemelen ilahi pınarınızı ve tüm rahip büyücülüğünüzü içerir. Bu yetenekler ancak bir keffaret ritüeli gerçekleştirerek tövbe ettiğiniz takdirde geri kazanılabilir.

omen://class/cleric/features/divine-defense?source=paizo-pathfinder-player-core:
  name: İlahi Savunma
  description: Eğitiminiz ve ilahınız sizi zarardan korur. Zırhsız savunma için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/cleric/features/divine-font?source=paizo-pathfinder-player-core:
  name: İlahi Pınar
  description: >
    İlahınızın bereketi sayesinde canlılık adı verilen yaşam gücünü veya onun karşıt gücü olan boşluğu kanalize eden ek büyüler kazanırsınız. Her gün büyülerinizi hazırlarken ilahınıza bağlı olarak ilave İyileştir veya Zarar Ver büyüleri hazırlayabilirsiniz. İlahınızın sağladığı ilahi pınar büyüsü ilahınızın İlahi Pınar girdisinde listelenmiştir; her ikisi de listelenmişse iyileştir veya zarar ver arasında seçim yapabilirsiniz. Seçiminizi yaptıktan sonra ilahi bir müdahale olmaksızın tercihinizi değiştiremezsiniz.
    Şifa Pınarı: En yüksek rahip büyü slotu derecenizde her gün 4 ilave büyü slotu kazanırsınız. Bu slotlarda yalnızca iyileştir büyüleri hazırlayabilirsiniz. 5. seviyede ilave slot sayısı 5'e yükselir ve 15. seviyede toplam ilave slot sayısı 6'ya yükselir.
    Zarar Pınarı: En yüksek rahip büyü slotu derecenizde her gün 4 ilave büyü slotu kazanırsınız. Bu slotlarda yalnızca zarar ver büyüleri hazırlayabilirsiniz. 5. seviyede ilave slot sayısı 5'e yükselir ve 15. seviyede toplam ilave slot sayısı 6'ya yükselir.

omen://class/cleric/features/doctrine?source=paizo-pathfinder-player-core:
  name: Öğreti
  description: "Aynı ilahın takipçileri arasında bile yaklaşımlar farklılık gösterir. 1. seviyede manastır rahibi veya savaş rahibini seçer ve onun ilk öğretisinin faydalarını kazanırsınız. 3. seviyede ve sonrasındaki her dört seviyede öğretinizden başka bir fayda kazanırsınız. • Manastır Rahibi • Savaş Rahibi"

omen://class/cleric/features/fifth-doctrine?source=paizo-pathfinder-player-core:
  name: Beşinci Öğreti
  description: "Öğretinizin beşinci faydasını kazanırsınız: • Manastır Rahibi • Savaş Rahibi"

omen://class/cleric/features/final-doctrine?source=paizo-pathfinder-player-core:
  name: Nihai Öğreti
  description: "Öğretinizin nihai faydasını kazanırsınız: • Manastır Rahibi • Savaş Rahibi"

omen://class/cleric/features/first-doctrine?source=paizo-pathfinder-player-core:
  name: Birinci Öğreti
  description: "Öğretinizin ilk faydasını kazanırsınız: • Manastır Rahibi • Savaş Rahibi"

omen://class/cleric/features/fourth-doctrine?source=paizo-pathfinder-player-core:
  name: Dördüncü Öğreti
  description: "Öğretinizin dördüncü faydasını kazanırsınız: • Manastır Rahibi • Savaş Rahibi"

omen://class/cleric/features/miraculous-spell?source=paizo-pathfinder-player-core:
  name: Mucizevi Büyü
  description: İlahınız tarafından yüceltilirsiniz ve gerçekten inanılmaz büyüler kazanırsınız. Tek bir 10. derece büyü slotu kazanırsınız ve rahip büyücülüğünü kullanarak bu slota bir büyü hazırlayabilirsiniz. Diğer büyü slotlarından farklı olarak 10. derece slotları, size daha fazla büyü slotu kazandıran veya büyü slotu harcamadan büyü yapmanıza olanak tanıyan yeteneklerle kullanamazsınız. Seviye atladıkça daha fazla 10. derece büyü kazanmazsınız, ancak ikinci bir slot kazanmak için Mucize Ustası hünerini alabilirsiniz.

omen://class/cleric/features/perception-expertise?source=paizo-pathfinder-player-core:
  name: Dikkat Uzmanlığı
  description: Çevrenizdeki tehditlere karşı tetikte kalırsınız. Dikkat için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/cleric/features/reflex-expertise?source=paizo-pathfinder-player-core:
  name: Refleks Uzmanlığı
  description: >
    Tehlikelerden sıyrılma konusunda bir ustalık geliştirdiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.
    Muhafız En ağır zırhların içindeyken bile geniş çaplı etkilere karşı kendinizi hazırlayabilirsiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/cleric/features/resolute-faith?source=paizo-pathfinder-player-core:
  name: Sarsılmaz İnanç
  description: İnanç, sinsi düşüncelere karşı bir siper sağlar. İrade kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir İrade kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/cleric/features/second-doctrine?source=paizo-pathfinder-player-core:
  name: İkinci Öğreti
  description: "Öğretinizin ikinci faydasını kazanırsınız: • Manastır Rahibi • Savaş Rahibi"

omen://class/cleric/features/third-doctrine?source=paizo-pathfinder-player-core:
  name: Üçüncü Öğreti
  description: "Öğretinizin üçüncü faydasını kazanırsınız: • Manastır Rahibi • Savaş Rahibi"

omen://class/druid/druid?source=paizo-pathfinder-player-core:
  name: Druid
  description: >
    Doğanın gücüne karşı koymak imkânsızdır. En sağlam kaleyi dakikalar içinde harabeye çevirebilir, en heybetli eserleri bile enkaza dönüştürebilir, küle çevirebilir, bir kar çığının altına gömebilir veya dalgaların altında boğabilir. Ona saygı duyanlara sonsuz bir bereket ve nefes kesici bir ihtişam—onu hafife alanlara ise ızdırap dolu bir ölüm bahşedebilir. Siz doğanın çağrısını duyanlardan birisiniz. Onun gücünün heybeti karşısında huşu içinde durur ve kendinizi onun hizmetine adarsınız.
    Druid

omen://class/druid/features/anathema-druid?source=paizo-pathfinder-player-core:
  name: Yasak (Druid)
  description: >
    Doğal düzenin koruyucuları olarak druidler doğaya yönelik hakaretleri yasak sayar. Bu eylemleri mükerrer şekilde gerçekleştirirseniz, druid büyücülüğünüz ve düzeninizin faydaları da dâhil olmak üzere druid sınıfından gelen büyüsel yeteneklerinizi kaybedersiniz. Bu yetenekler ancak bir Keffaret ritüeli ile tövbenizi gösterdiğiniz takdirde geri kazanılabilir. Aşağıdaki eylemler tüm druidler için yasaktır.
    Yasak doğal yerleri yağmalamak, rahat yaşamak için ihtiyaç duyduğunuzdan daha fazla doğal kaynak tüketmek, Yaban Şarkısı'nı druid olmayanlara öğretmek.
    Druidik düzen seçiminiz, düzenin girdisinde ayrıntılandırıldığı üzere ek yasaklar ekler.

omen://class/druid/features/druid-spellcasting?source=paizo-pathfinder-player-core:
  name: Druid Büyücülüğü
  description: >
    Vahşi dünyanın gücü içinizden akar. Bir büyücüsünüz ve Büyü Yap aktivitesini kullanarak doğa geleneğinin büyülerini yapabilirsiniz. Bir druid olarak büyü tekerlemeleriniz etrafınızdaki çevreye yakarışlar veya kadim yeminlerin anılması olabilir; jestleriniz büyünüzü yönlendirirken elleriniz söğütler gibi sallanabilir veya pençe benzeri şekiller alabilir. 1. seviyede her sabah doğa büyü listesindeki yaygın büyülerden veya erişim kazanıp Büyü Öğren aracılığıyla öğrendiğiniz diğer doğa büyülerinden iki adet 1. derece büyü ve beş kantrip hazırlayabilirsiniz. Hazırlanan büyüler siz onları yapana veya büyülerinizi tekrar hazırlayana kadar kullanılabilir kalır. Her gün hazırlayabileceğiniz büyü sayısına büyü slotlarınız denir.
    Bir druid olarak seviyeniz arttıkça Günlük Druid Büyüleri tablosunda gösterildiği gibi her gün hazırlayabileceğiniz büyü sayısı ve yapabileceğiniz en yüksek büyü derecesi de artar.
    Bazı büyüleriniz ne kadar etkili olduklarını görmek için bir büyü saldırısı denemenizi veya düşmanlarınızın büyü ZD'nize karşı zar atmasını (genellikle bir kurtarış deneyerek) gerektirir. Ana niteliğiniz Bilgelik olduğundan büyü saldırı modifiyeriniz ve büyü ZD'niz Bilgelik bonusunuzu kullanır.
    Büyüleri Güçlendirme
    2. derece ve daha yüksek büyü slotları kazandığınızda, bu slotları daha düşük derecedeki büyülerin daha güçlü versiyonlarıyla doldurabilirsiniz. Bu durum büyünün derecesini artırarak onu büyü slotuna uyacak şekilde güçlendirir. Birçok büyü belirli derecelere güçlendirildiğinde özel geliştirmeler kazanır.
    Kantripler
    Büyülerinizin bazıları kantriplerdir. Kantrip, büyü slotu kullanmayan özel bir büyü türüdür. Bir kantripi günde istediğiniz kadar, dilediğinizce yapabilirsiniz. Bir kantrip daima otomatik olarak seviyenizin yukarı yuvarlanmış yarısına güçlendirilir—bu genellikle sahip olduğunuz en yüksek druid büyü slotu derecesine eşittir. Örneğin 1. seviye bir druid olarak kantripleriniz 1. derece büyülerdir ve 5. seviye bir druidin kantripleri 3. derecedir.

omen://class/druid/features/druid-weapon-expertise?source=paizo-pathfinder-player-core:
  name: Druid Silah Uzmanlığı
  description: Zanaatınızın silahlarına tamamen aşina hâle geldiniz. Tüm basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

omen://class/druid/features/druidic-order?source=paizo-pathfinder-player-core:
  name: Druidik Düzen
  description: >
    Bir druid olduğunuzda size bir sınıf hüneri, bir düzen büyüsü (aşağıya bakın) ve düzeninize bağlı eğitimli ek bir beceri kazandıran bir druidik düzene katılırsınız. Her zaman başlangıçtaki düzeninizin bir üyesi kalacak olsanız da bir druidin doğal dünyayı daha iyi anlamak amacıyla diğer düzenlerle çalışmayı talep etmesi duyulmamış bir şey değildir ve oyuncu karakteri druidler farklı düzenlerin güçlerini harmanlamaya en yatkın olanlar arasındadır.
    Düzen büyüleri bir odak büyüsü türüdür. Bir odak büyüsü yapmak 1 Odak Puanı harcar ve 1 Odak Puanlık bir odak havuzuyla başlarsınız. Günlük hazırlıklarınız sırasında odak havuzunuzu doldurursunuz ve yerel doğa ruhlarıyla iletişim kurmak ya da düzeninize yakışır bir şekilde yaban hayatıyla ilgilenmek için Odak Yenileme eylemini kullanarak 10 dakika harcayarak 1 Odak Puanı geri kazanabilirsiniz.
    Odak büyüleri tıpkı kantripler gibi otomatik olarak seviyenizin yukarı yuvarlanmış yarısına güçlendirilir. Odak büyüleri büyü slotu gerektirmez ve onları büyü slotları kullanarak yapamazsınız. Belirli hünerler size daha fazla odak büyüsü kazandırır. Odak havuzunuzun tutabileceği maksimum Odak Puanı sahip olduğunuz odak büyülerinin sayısına eşittir, ancak asla 3 puandan fazla olamaz.
    Düzen Becerisi Listelenen beceride eğitimli olursunuz. O beceride hâlihazırda eğitimliyseniz kendi seçeceğiniz farklı bir beceride eğitimli olursunuz.
    Druid Hüneri Bu 1. seviye druid hünerini kazanırsınız.
    Düzen Büyüsü 1. seviyede listelenen düzen büyüsünü otomatik olarak kazanırsınız.
    Yasak Bu yasağı tüm druidler için geçerli olan yasaklara ekleyin.
    Hayvan Düzeni
    Alev Düzeni
    Yaprak Düzeni
    Taş Düzeni
    Fırtına Düzeni
    Ehlileşmemiş Düzen
    Dalga Düzeni

omen://class/druid/features/expert-spellcaster?source=paizo-pathfinder-player-core:
  name: Uzman Büyücü
  description: >
    Animist: Ruhların büyüsü içinizden serbestçe akar. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.
    Ozan: Büyüsel teknikleriniz güçlenir. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz uzmanlığa yükselir.
    Druid: Doğa güçlerine olan hakimiyetiniz derinleşerek büyülerinizi güçlendirir. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.
    Magus: Büyüye dair temel kavrayışınız gelişerek büyülerinize karşı koymayı zorlaştırır. Büyü saldırı modifiyeriniz ve büyü ZD'niz için yetkinlik dereceleriniz uzmanlığa yükselir.
    Kâhin: İlahi gücünüzün karmaşıklığı zamanla daha da berraklaşır. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz uzmanlığa yükselir.
    Psychic: İçsel muhakeme size kendinize dair daha derin bir bilgi ve bununla birlikte psişik güç kazandırır. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.
    Sorcerer: Doğal büyünüz emirlerinize kolayca ve güçlü bir şekilde karşılık verir. Soy geleneğinizin büyüleri için büyü saldırı modifiyeri ve büyü ZD'si yetkinlik dereceleriniz uzmanlığa yükselir.
    Summoner: Eidolonunuzla olan bağınız derinleştikçe büyülerin gücü de artar. Büyü saldırı modifiyeri ve büyü ZD'si istatistikleri için yetkinlik dereceleriniz uzmanlığa yükselir.
    Witch: Haminizin size bahşettiği gücü daha iyi kontrol etmeyi öğrenirsiniz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.
    Wizard: Mistik ilimlerdeki kapsamlı pratik yeteneklerinizi geliştirir. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.

omen://class/druid/features/fortitude-expertise?source=paizo-pathfinder-player-core:
  name: Dayanıklılık Uzmanlığı
  description: >
    Animist Ruhani enerji bedeninizi takviye ederek sizi daha dirençli kılar. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.
    Ozan, Komutan, Müfettiş, Kabadayı Maceralarınızda bünyeniz dayanıklı hâle geldi. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.
    Druid Maceralar bünyenizi daha dayanıklı hâle getirdi. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.
    Psychic Zihniniz, bedeninizi bilinçaltındaki zihinsel benlik imajınıza bağlı tutar. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/druid/features/legendary-spellcaster?source=paizo-pathfinder-player-core:
  name: Efsanevi Büyücü
  description: >
    Animist: Öte alemlerin büyü enerjileri için neredeyse kusursuz bir kanal hâline gelirsiniz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.
    Ozan: Büyüye olan hâkimiyetiniz efsanelere konu olacak düzeydedir. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz efsaneviye yükselir.
    Druid: Doğanın büyüsüyle benzersiz bir uyum geliştirirsiniz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.
    Kâhin: İlahi gücü çok az kişinin boy ölçüşebileceği bir seviyede dizginleyebilirsiniz. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz efsaneviye yükselir.
    Psychic: Eğitiminiz zirveye ulaştığında yalnızca kendi zihninizi değil, tüm psişik gücün kaynağı olan kolektif bilinçdışını da anlarsınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.
    Sorcerer: Büyücülük konusunda olağanüstü bir yetenek sergilersiniz. Soy geleneğinizin büyüleri için büyü saldırı modifiyeri ve büyü ZD'si yetkinlik dereceleriniz efsaneviye yükselir.
    Witch: Haminizin sağladığı büyüye olan hâkimiyetinizi kusursuzlaştırırsınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.
    Wizard: Hem mistik teoriyi hem de pratik büyü ustalığını harmanlayan yetkin bir büyücüsünüz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.

omen://class/druid/features/master-spellcaster?source=paizo-pathfinder-player-core:
  name: Usta Büyücü
  description: >
    Animist: Bağ kurduğunuz hayaletlerle olan yakınlığınız büyünüzün kudretini daha da artırdı. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.
    Ozan: Büyünün ipliklerini bir arpın telleri gibi çalarsınız. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.
    Druid: Doğa büyüsü emrinize itaat eder. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.
    Magus: Büyülerinizi ustalık derecesindeki hünerinizle tahkim edersiniz. Büyü saldırı modifiyeriniz ve büyü ZD'niz için yetkinlik dereceleriniz ustalığa yükselir.
    Kâhin: Gizeminizin içindeki derin ve karmaşık ilahi gücü tam anlamıyla kavrarsınız. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.
    Psychic: Kendi zihninizin en derin köşelerine erişim kazandınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.
    Sorcerer: Kanınızdaki büyü üzerinde ustalık kazandınız. Soyunuzun geleneğindeki büyüler için büyü saldırı modifiyeri ve büyü ZD'si yetkinlik dereceleriniz ustalığa yükselir.
    Summoner: Eidolonunuzla olan bağınız, ilişkili büyüler üzerinde ustalık kazanmanızı sağlayacak kadar güçlüdür. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.
    Witch: Haminizin büyüsü üzerinde ustalık kazandınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.
    Wizard: Üstün bir büyücülük kabiliyetine hükmedersiniz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.


omen://class/druid/features/medium-armor-expertise?source=paizo-pathfinder-player-core:
  name: Orta Zırh Uzmanlığı
  description: >
    Saldırılara karşı kendinizi daha iyi savunmayı öğrendiniz. Hafif zırh, orta zırh ve zırhsız savunma için yetkinlik dereceleriniz uzmanlığa yükselir.
    Mucit Orta veya ağır zırh icadınız varsa, zırh icadınızla kritik uzmanlaşma etkisine erişim kazanırsınız.


omen://class/druid/features/perception-expertise?source=paizo-pathfinder-player-core:
  name: Dikkat Uzmanlığı
  description: Çevrenizdeki tehditlere karşı daima tetikte kalırsınız. Dikkat için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/druid/features/primal-hierophant?source=paizo-pathfinder-player-core:
  name: Doğa Hiyerofantı
  description: Doğa büyüsünün en kudretli güçlerine hükmedersiniz ve gerçekten inanılmaz güçte bir büyü yapabilirsiniz. Tek bir 10. derece büyü slotu kazanırsınız ve druid büyücülüğünü kullanarak bu slota bir büyü hazırlayabilirsiniz. Diğer büyü slotlarından farklı olarak 10. derece slotları, size daha fazla büyü slotu kazandıran veya büyü slotu harcamadan büyü yapmanıza olanak tanıyan yeteneklerle kullanamazsınız. Seviye atladıkça daha fazla 10. derece büyü kazanmazsınız, ancak ikinci bir slot kazanmak için Hiyerofantın Gücü hünerini alabilirsiniz.

omen://class/druid/features/reflex-expertise?source=paizo-pathfinder-player-core:
  name: Refleks Uzmanlığı
  description: >
    Tehlikelerden sıyrılma konusunda bir maharet geliştirdiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.
    Muhafız En ağır zırhların içindeyken bile geniş alana yayılan etkilere karşı kendinizi hazırlayabilirsiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.


omen://class/druid/features/shield-block?source=paizo-pathfinder-player-core:
  name: Kalkanla Engelleme
  description: Bir kalkanla hasarı azaltmanıza olanak tanıyan bir reaksiyon olan Kalkanla Engelleme genel hünerini kazanırsınız.

omen://class/druid/features/voice-of-nature?source=paizo-pathfinder-player-core:
  name: Doğanın Sesi
  description: Kendi seçeceğiniz Hayvan Empatisi veya Bitki Empatisi druid hünerini kazanırsınız.

omen://class/druid/features/weapon-expertise?source=paizo-pathfinder-player-core:
  name: Silah Uzmanlığı
  description: >
    Şampiyon, Timsal, Müfettiş, Magus, Rün Ustası: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Druid, Kinetikçi: Savaş becerinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir.

    Muhafız: Bazen en iyi savunma iyi bir taarruzdur. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Necromancer, Kâhin: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Psychic: Eğitim, muhtemelen okült büyünüzle de pekiştirilerek silah tekniğinizi geliştirdi. Basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir.

    Sorcerer: Savaş becerinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Kabadayı: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir. Uzman yetkinliğe sahip olduğunuz tüm silahların kritik uzmanlaşma etkilerine erişim kazanırsınız.

    Thaumaturge: Silahlarınızın en etkili şekilde çalışma sırlarını öğrendiniz. Silahsız saldırılar, basit silahlar ve askeri silahlar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Witch, Wizard: Katıksız deneyim sayesinde silahlarınızla olan tekniğinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.


omen://class/druid/features/wild-willpower?source=paizo-pathfinder-player-core:
  name: Yabani İrade Gücü
  description: Yabani iradeniz, tıpkı en ulu canavarınki gibi ehlileştirilemez. İrade kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir İrade kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/druid/features/wildsong?source=paizo-pathfinder-player-core:
  name: Yaban Şarkısı
  description: "Soyunuz aracılığıyla bildiğiniz tüm dillere ek olarak yalnızca druid düzenleri içinde bilinen gizli bir dil olan Yaban Şarkısı'nı bilirsiniz. Yaban Şarkısı, konuşulan bir dilden ziyade hayvan çağrılarına benzeyen melodik ve tonlamalı bir dildir; alfabesi ise bir deniz kabuğunun odacıklarının dizilişi, bir kar tanesinin kristalleri ya da bir eğrelti otunun yaprakları gibi fraktallar ve spiraller içerir. Yaban Şarkısı'nı druid olmayanlara öğretmek yasaktır."

omen://class/druid/orders/animal?source=paizo-pathfinder-player-core:
  name: Hayvan Düzeni
  description: >
    Canavarlarla güçlü bir bağınız vardır; onları her zaman kendi halkınızdan daha iyi anladığınızı (ve onların da sizi daha iyi anladığını) hissedersiniz. Yanınızdaki güçlü bir yoldaş hayvanyla doğanın hayvanlarının yanında yer alırsınız.
    Düzen Becerisi Atletizm
    Druid Hüneri Yoldaş Hayvan
    Düzen Büyüsü Hayvanı İyileştir
    Yasak Hayvanlara karşı nedensiz yere zalimlik etmek veya hayvanları gereksiz yere öldürmek. (Bu durum kendinizi hayvanlara karşı savunmanızı veya yiyecek için onları eziyetsizce öldürmenizi engellemez).


omen://class/druid/orders/leaf?source=paizo-pathfinder-player-core:
  name: Yaprak Düzeni
  description: >
    Doğanın cömertliğine hürmet eder, yaban hayatı için hem bir bahçıvan hem de bir muhafız görevi üstlenirsiniz. Yanınızdaki leshy tanıdığınızla felaketlerin veya tedbirsiz genişlemenin ardından alanların yeniden büyümesine yardımcı olur ve bitki örtüsünü onu istismar etmek isteyenlere karşı çevirirsiniz.
    Düzen Becerisi Diplomasi
    Druid Hüneri Leshy Ruhdaş Hayvan
    Düzen Büyüsü Bereket Boynuzu
    Yasak Bitkilere veya mantarlara karşı nedensiz yere zalimlik etmek veya onları gereksiz yere öldürmek. (Bu durum kendinizi savunmanızı veya hayatta kalmak için onları hasat etmenizi engellemez.)


omen://class/druid/orders/storm?source=paizo-pathfinder-player-core:
  name: Fırtına Düzeni
  description: >
    İster bir fırtına altında doğmuş olun ister berrak mavi bir gökyüzünden düşen bir yıldırımdan sağ kurtulmuş olun, artık kalbinizde fırtınanın öfkesini taşır; gök gürültüsünü korkunç bir yıkıcı etkiye yönlendirir ve rüzgârların üzerinde havada süzülürsünüz.
    Düzen Becerisi Akrobasi
    Druid Hüneri Fırtınadoğan
    Düzen Büyüsü Fırtına Kabarması
    Yasak Havayı kirletmek, büyük hava kirliliğine veya iklim değişikliklerine neden olanların cezasız kalmasına izin vermek. (Bu durum yalnızca potansiyel çevre zararına karşı harekete geçmenizi veya açıkça üstün bir düşmana karşı kendinizi feda etmenizi zorunlu kılmaz.)


omen://class/druid/orders/untamed?source=paizo-pathfinder-player-core:
  name: Ehlileşmemiş Düzen
  description: >
    Doğal dünyanın kontrol edilemez çağrısı bedeninizde dolaşır. Vahşi bir hayvan tarafından büyütülmüş olabilirsiniz veya bir şehirde büyüdükten sonra şehirlerin yapaylığını reddetmiş olabilirsiniz. Artık doğa büyüsü size ehlileşmemiş bir yaratığın formuna bürünme yeteneği bahşeder.
    Düzen Becerisi Gözdağı
    Druid Hüneri Ehlileşmemiş Form
    Düzen Büyüsü Ehlileşmemiş Dönüşüm
    Yasak Medeniyetin ayartmalarıyla tamamen evcilleşmek. (Bu durum işlenmiş malları satın alıp kullanmanızı veya bir macera için bir şehirde kalmanızı engellemez; ancak bu kolaylıklara asla bel bağlayamaz veya böyle bir yeri asla kalıcı eviniz olarak göremezsiniz.)


omen://class/fighter/features/armor-expertise?source=paizo-pathfinder-player-core:
  name: Zırh Uzmanlığı
  description: Zırh içinde o kadar çok zaman geçirdiniz ki onun korumasından en iyi şekilde nasıl yararlanacağınızı bilirsiniz. Hafif, orta ve ağır zırhın yanı sıra zırhsız savunma için yetkinlik dereceleriniz uzmanlığa yükselir. Orta ve ağır zırhın zırh uzmanlaşma etkilerini kazanırsınız.

omen://class/fighter/features/armor-mastery?source=paizo-pathfinder-player-core:
  name: Zırh Ustalığı
  description: >
    Barbar Eğitimiz ve öfkeniz zırhınızla olan bağınızı derinleştirir. Hafif zırh, orta zırh ve zırhsız savunma için yetkinlik dereceleriniz ustalığa yükselir.
    Şampiyon, Komutan Zırhtaki hüneriniz gelişerek daha fazla darbeden sakınmanıza yardımcı olur. Hafif, orta ve ağır zırhın yanı sıra zırhsız savunma için de yetkinlik dereceleriniz ustalığa yükselir.
    Savaşçı Zırhtaki hüneriniz daha da gelişir. Hafif, orta ve ağır zırhın yanı sıra zırhsız savunma için de yetkinlik dereceleriniz ustalığa yükselir.


omen://class/fighter/features/battle-hardened?source=paizo-pathfinder-player-core:
  name: Savaşta Pişmiş
  description: Muharebedeki deneyiminiz hem büyüye hem de toksinlere karşı korunmanıza yardımcı olur. Dayanıklılık kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir Dayanıklılık kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/fighter/features/battlefield-surveyor?source=paizo-pathfinder-player-core:
  name: Muharebe Alanı Gözlemcisi
  description: İster bir düşman ordusunu gözlemleyin ister yalnızca nöbet tutun, düşmanlarınızı gözetleme konusunda üstünsünüzdür. Dikkat için yetkinlik dereceniz ustalığa yükselir. Ek olarak inisiyatif için yapılan Dikkat testlerine +2 durumsal bonus kazanarak muharebe sırasında daha hızlı reaksiyon verirsiniz.

omen://class/fighter/features/bravery?source=paizo-pathfinder-player-core:
  name: Cesaret
  description: Sayısız düşmanla ve savaşın kargaşasıyla yüzleştikten sonra, korku karşısında dimdik durmayı öğrendiniz. İrade kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir. Bir korku etkisine karşı İrade kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz. Ek olarak Korkmuş durumunu her kazandığınızda değerini 1 azaltırsınız.

omen://class/fighter/features/combat-flexibility?source=paizo-pathfinder-player-core:
  name: Muharebe Esnekliği
  description: Taktiklerinizi farklı durumlara uyacak şekilde hazırlayabilirsiniz. Günlük hazırlıklarınızı yaptığınızda, ön koşullarını karşıladığınız ve henüz sahip olmadığınız 8. veya daha düşük seviyeli bir savaşçı hüneri kazanırsınız. Bu hüneri bir sonraki günlük hazırlıklarınıza kadar kullanabilirsiniz.

omen://class/fighter/features/fighter-expertise?source=paizo-pathfinder-player-core:
  name: Savaşçı Uzmanlığı
  description: Uygulamalı teknikleriniz sizi daha da dişli hâle getirdi. Savaşçı sınıf ZD'niz için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/fighter/features/fighter-weapon-mastery?source=paizo-pathfinder-player-core:
  name: Savaşçı Silah Ustalığı
  description: Tercih ettiğiniz silahlarla talim yaparak, yeni muharebe teknikleri öğrenip geliştirerek geçirilen saatler, sizi seçtiğiniz silahlarla özellikle etkili kıldı. Bir silah grubu seçin. O gruptaki basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceniz ustalığa, o gruptaki gelişmiş silahlar için uzmanlığa yükselir. Usta yetkinliğe sahip olduğunuz tüm silahların ve silahsız saldırıların kritik uzmanlaşma etkilerine erişim kazanırsınız.

omen://class/fighter/features/greater-weapon-specialization?source=paizo-pathfinder-player-core:
  name: Gelişmiş Silah Uzmanlaşması
  description: "Silah uzmanlaşmasından gelen hasarınız; uzman olduğunuz silahlar ve silahsız saldırılarla 4'e, ustaysanız 6'ya ve efsaneviyseniz 8'e yükselir."

omen://class/fighter/features/improved-flexibility?source=paizo-pathfinder-player-core:
  name: Geliştirilmiş Esneklik
  description: Kapsamlı deneyiminiz size her günün zorluklarına uyum sağlama konusunda daha da büyük bir yetenek kazandırır. Muharebe esnekliğini kullandığınızda bir yerine iki savaşçı hüneri kazanabilirsiniz. İlk hüner yine 8. veya daha düşük seviyeli olmalı iken, ikinci hüner 14. seviyeye kadar olabilir ve ikinci hünerin ön koşullarını karşılamak için ilk hüneri kullanabilirsiniz. Hünerlerin tüm ön koşullarını karşılamanız gerekir.

omen://class/fighter/features/reactive-strike?source=paizo-pathfinder-player-core:
  name: Reaktif Vuruş
  description: Zaaflara karşı daima tetikte olarak savunmalarında açık bırakan düşmanlara hızla saldırabilirsiniz. Reaktif Vuruş reaksiyonunu kazanırsınız.

omen://class/fighter/features/shield-block?source=paizo-pathfinder-player-core:
  name: Kalkanla Engelleme
  description: Bir kalkanla hasarı azaltmanıza olanak tanıyan bir reaksiyon olan Kalkanla Engelleme genel hünerini kazanırsınız.

omen://class/fighter/features/tempered-reflexes?source=paizo-pathfinder-player-core:
  name: Çelikleşmiş Refleksler
  description: Talimli refleksler felaket boyutundaki patlamalar karşısında bile güvende kalmanızı sağlar. Refleks kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir Refleks kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/fighter/features/versatile-legend?source=paizo-pathfinder-player-core:
  name: Çok Yönlü Efsane
  description: Herhangi bir silahla neredeyse eşsizsinizdir. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz efsaneviye, gelişmiş silahlar için yetkinlik dereceniz ustalığa yükselir. Savaşçı sınıf ZD'niz için yetkinlik dereceniz ustalığa yükselir.

omen://class/fighter/features/weapon-legend?source=paizo-pathfinder-player-core:
  name: Silah Efsanesi
  description: >
    Tüm teçhizatlar için geçerli olan savaş tekniklerini öğrendiniz ve favori silahlarınızla eşsiz bir hüner geliştirdiniz. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir. Gelişmiş silahlar için yetkinlik dereceniz uzmanlığa yükselir.
    Bir silah grubu seçebilir ve o silah grubundaki tüm basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik derecelerinizi efsaneviye, o silah grubundaki tüm gelişmiş silahlar için ise ustalığa yükseltebilirsiniz.


omen://class/fighter/fighter?source=paizo-pathfinder-player-core:
  name: Savaşçı
  description: >
    Onur, açgözlülük, sadakat veya yalnızca muharebenin heyecanı için savaşırken; silahların ve dövüş tekniklerinin tartışmasız bir ustasısınız. Düşmanlarınız savunmalarını düşürecek kadar aptallık ettiğinde, eylemlerinizi açılış hamleleri, bitirici vuruşlar ve karşı saldırılardan oluşan akıllıca kombinasyonlarla birleştirirsiniz. İster bir şövalye, paralı asker, keskin nişancı veya kılıç ustası olun; askeri beceriyi bir sanat formuna dönüştürdünüz ve düşmanlarınıza yıkıcı kritik saldırılar indirirsiniz.
    Savaşçı


omen://class/ranger/features/greater-natural-reflexes?source=paizo-pathfinder-player-core:
  name: Gelişmiş Doğal Refleksler
  description: Bir kedinin bile kıskanacağı reflekslerle patlamalardan sakınırsınız. Refleks kurtarışlar için yetkinlik dereceniz efsaneviye yükselir. Bir Refleks kurtarışında kritik başarısızlık elde ettiğinizde, bunun yerine başarısızlık elde edersiniz. Hasar veren bir etkiye karşı Refleks kurtarışında başarısız olduğunuzda aldığınız hasarı yarıya indirirsiniz.

omen://class/ranger/features/greater-weapon-specialization?source=paizo-pathfinder-player-core:
  name: Gelişmiş Silah Uzmanlaşması
  description: "Silah uzmanlaşmasından gelen hasarınız; uzman olduğunuz silahlar ve silahsız saldırılarla 4'e, ustaysanız 6'ya ve efsaneviyseniz 8'e yükselir."

omen://class/ranger/features/hunt-prey?source=paizo-pathfinder-player-core:
  name: Avı İşaretle
  description: Dikkatinizi tek bir düşmana odakladığınızda takibinizde durdurulamaz hâle gelirsiniz. Avı İşaretle eylemini kazanırsınız.

omen://class/ranger/features/hunters-edge?source=paizo-pathfinder-player-core:
  name: Avcının Avantajı
  description: "Eğitiminizin odağına bağlı olarak Avı İşaretle kullandığınızda ekstra bir fayda kazanan yetenekli bir avcı ve iz sürücü olmak için talim yaptınız. Bir avcının avantajı seçin. • Yaylım • Alt Etme • Hassasiyet"

omen://class/ranger/features/martial-weapon-mastery?source=paizo-pathfinder-player-core:
  name: Askeri Silah Ustalığı
  description: Silahlarınızı tamamen anlarsınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.

omen://class/ranger/features/masterful-hunter-flurry?source=paizo-pathfinder-player-core:
  name: Usta Avcı (Yaylım)
  description: >
    Usta Avcı Yükseltmesi
    17. Seviye
    Bir dizi hassas vuruş yapmak için silah ustalığınızı maharetli hedeflemeyle harmanlayabilirsiniz.
    Silahınızla usta yetkinliğe sahipseniz, işaretli avınıza yönelik saldırılarda çoklu saldırı cezanız sıranın ikinci saldırısında -2 (çevik bir silahla -1) ve sıranın üçüncü ve sonraki saldırılarında -4 (çevik bir silahla -2) olur.


omen://class/ranger/features/masterful-hunter-outwit?source=paizo-pathfinder-player-core:
  name: Usta Avcı (Alt Etme)
  description: >
    Usta Avcı Yükseltmesi
    17. Seviye
    Becerilerdeki ustalığınız avınızı alt etmenizi sağlar. Aldatma, Gözdağı, Gizlilik veya avınız hakkında Bilgi Hatırlamak için kullandığınız beceride usta yetkinliğe sahipseniz, o beceriyle ava karşı olan durumsal bonusu +2'den +4'e yükseltin.
    Zırhınızla usta yetkinliğe sahipseniz, ava karşı ZK'ye olan durumsal bonusunu +1'den +2'ye yükseltin.
    Otomasyon Notları: Bilgi hatırlama bonusu yalnızca arkana, zanaatkârlık, doğa, okültizm, din ve sosyoloji için ayarlanmıştır. ZK bonusu kuşandığınız zırhın yetkinliğine değil, zırhsız yetkinliğinize dayanmaktadır.


omen://class/ranger/features/masterful-hunter-precision?source=paizo-pathfinder-player-core:
  name: Usta Avcı (Hassasiyet)
  description: >
    Usta Avcı Yükseltmesi
    17. Seviye
    Silah ustalığınız avınızın hayati noktalarına birden çok kez vurmanızı sağlar.
    Bir turda işaretli avınızı ikinci kez vurduğunuzda ayrıca 1d8 zayıf nokta hasarı verirsiniz.
    19. seviyede işaretli avınıza bir turdaki ikinci vuruşunuz 2d8 zayıf nokta hasarı ve bir turdaki üçüncü vuruşunuz 1d8 zayıf nokta hasarı verir.


omen://class/ranger/features/masterful-hunter?source=paizo-pathfinder-player-core:
  name: Usta Avcı
  description: >
    Bir avcı olarak yeteneklerinizi inanılmaz seviyelere ulaştırdınız. Korucu sınıf ZD'niz için yetkinlik dereceniz ustalığa yükselir. Muhafız büyülerinize sahipseniz, büyü saldırıları ve büyü ZD'leri için yetkinlik dereceniz ustalığa yükselir. Usta yetkinliğe sahip olduğunuz menzilli bir silah kullanırken, işaretli avınıza silahın ikinci ve üçüncü menzil dereceleri içinde saldırıyorsanız cezayı yok sayabilirsiniz.
    Dikkate usta yetkinliğiniz varsa avınızı Aradığınızda Dikkat testlerine +4 durumsal bonus kazanırsınız; Hayatta Kalmaya usta yetkinliğiniz varsa avınızı İzlediğinizde Hayatta Kalma testlerine +4 durumsal bonus kazanırsınız. Ayrıca avcınızın avantajına bağlı olarak ek bir fayda kazanırsınız.
    Yaylım: Bir dizi hassas vuruş yapmak için silah ustalığınızı maharetli hedeflemeyle harmanlayabilirsiniz. Silahınızla usta yetkinliğe sahipseniz, işaretli avınıza yönelik saldırılarda çoklu saldırı cezanız sıranın ikinci saldırısında –2 (çevik bir silahla –1) ve sıranın üçüncü ve sonraki saldırılarında –4 (çevik bir silahla –2) olur.
    Alt Etme: Becerilerdeki ustalığınız avınızı alt etmenizi sağlar. Aldatma, Gözdağı, Gizlilik veya avınız hakkında Bilgi Hatırlamak için kullandığınız beceride usta yetkinliğe sahipseniz, o beceriyle ava karşı olan durumsal bonusu +2'den +4'e yükseltin. Zırhınızla usta yetkinliğe sahipseniz ava karşı ZK'ye olan durumsal bonusunu +1'den +2'ye yükseltin.
    Hassasiyet: Silah ustalığınız avınızın hayati noktalarına birden çok kez vurmanızı sağlar. Bir turda işaretli avınızı ikinci kez vurduğunuzda ayrıca 1d8 zayıf nokta hasarı verirsiniz. 19. seviyede işaretli avınıza bir turdaki ikinci vuruşunuz 2d8 zayıf nokta hasarı ve bir turdaki üçüncü vuruşunuz 1d8 zayıf nokta hasarı verir.


omen://class/ranger/features/medium-armor-expertise?source=paizo-pathfinder-player-core:
  name: Orta Zırh Uzmanlığı
  description: >
    Saldırılara karşı kendinizi daha iyi savunmayı öğrendiniz. Hafif zırh, orta zırh ve zırhsız savunma için yetkinlik dereceleriniz uzmanlığa yükselir.
    Mucit Orta veya ağır zırh icadınız varsa, zırh icadınızla kritik uzmanlaşma etkisine erişim kazanırsınız.


omen://class/ranger/features/medium-armor-mastery?source=paizo-pathfinder-player-core:
  name: Orta Zırh Ustalığı
  description: Hafif ve orta zırhtaki hüneriniz gelişerek darbelerden sakınma yeteneğinizi artırır. Hafif ve orta zırhın yanı sıra zırhsız savunma için yetkinlik dereceleriniz ustalığa yükselir.

omen://class/ranger/features/natural-reflexes?source=paizo-pathfinder-player-core:
  name: Doğal Refleksler
  description: Düşen ağaçlardan ve şiddetli dolulardan kaçarak reflekslerinizi bilediniz. Refleks kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir Refleks kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/ranger/features/natures-edge?source=paizo-pathfinder-player-core:
  name: Doğanın Avantajı
  description: Düşmanlarınız elverişsiz arazideyken onların savunmalarındaki zayıf noktaları her zaman bulursunuz. Düşmanlar zorlu arazideyken size karşı Savunmasızdır.

omen://class/ranger/features/perception-legend?source=paizo-pathfinder-player-core:
  name: Dikkat Efsanesi
  description: Neredeyse algılanamaz olanı fark edersiniz. Dikkat için yetkinlik dereceniz efsaneviye yükselir.

omen://class/ranger/features/perception-mastery?source=paizo-pathfinder-player-core:
  name: Dikkat Ustalığı
  description: >
    Barbar İçgüdünüz duyularınızın her birini daha da keskinleştirir. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Ozan, Silahşor, Düzenbaz Keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Komutan Bir senaryoyu her yönden görebilme yeteneği geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Timsal Maceralarınız boyunca himayenizdekileri daha iyi gözetmek; canavarlara ve diğer tehditlere göz kulak olmak için keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Müfettiş, Kabadayı, Thaumaturge Maceralarınız boyunca keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Korucu Son derece gelişmiş bir keskinliğe ve ayrıntılara dikkate sahipsinizdir. Dikkat için yetkinlik dereceniz ustalığa yükselir.


omen://class/ranger/features/ranger-expertise?source=paizo-pathfinder-player-core:
  name: Korucu Uzmanlığı
  description: Kurnazlığınızı ve becerinizi geliştiren teknikler kazandınız. Korucu ZD'niz için yetkinlik dereceniz uzmanlığa yükselir. Muhafız büyülerinize sahipseniz, büyü saldırıları ve büyü ZD'leri için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/ranger/features/ranger-weapon-expertise?source=paizo-pathfinder-player-core:
  name: Korucu Silah Uzmanlığı
  description: Silahlarınızdan her türlü avantajı sağlarsınız. Askeri silahlar, basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir. İşaretli avınıza saldırırken bu tür tüm silahların ve silahsız saldırıların kritik uzmanlaşma etkilerine erişim kazanırsınız.

omen://class/ranger/features/second-skin?source=paizo-pathfinder-player-core:
  name: İkinci Deri
  description: Zırhınız sizin için adeta ikinci bir deri hâline geldi. Hafif zırh, orta zırh ve zırhsız savunma için yetkinlik dereceleriniz ustalığa yükselir. Hafif veya orta zırh giyerken, sizi Yorgun bırakan yetersiz bir dinlenme yerine normal şekilde dinlenebilirsiniz.

omen://class/ranger/features/swift-prey?source=paizo-pathfinder-player-core:
  name: Seri Av
  description: Avınızı bir bakışta tartarsınız. Sıranızın ilk eylemi olması koşuluyla Avı İşaretle'yi serbest bir eylem olarak kullanabilirsiniz.

omen://class/ranger/features/trackless-journey?source=paizo-pathfinder-player-core:
  name: İz Bırakmayan Yolculuk
  description: Doğal arazilerde ilerlerken izinizi sürmek zordur. Bu tür arazilerde Hızınızın yarısıyla hareket etmeden İzleri Ört eyleminin faydalarını her zaman kazanırsınız.

omen://class/ranger/features/unimpeded-journey?source=paizo-pathfinder-player-core:
  name: Engellenemez Yolculuk
  description: İster devrilmiş kayalar ister birbirine dolanmış çalılıklar olsun engellerin arasından hızla ilerlersiniz. Zorlu arazinin etkilerini yok sayabilirsiniz. Zorlu araziyi yok saymanın olağan kuralı uyarınca bu durum büyük zorlu arazinin engellerine de zorlu arazi muamelesi yapmanızı sağlar.

omen://class/ranger/features/warden-spells?source=paizo-pathfinder-player-core:
  name: Muhafız Büyüleri
  description: >
    Çevrenizdeki dünyayla olan ilişkiniz fizikselden büyüsele uzanır. Belirli hünerler size bir odak büyüsü türü olan muhafız büyüleri kazandırır. Bir odak büyüsü yapmak 1 Odak Puanı (FP) harcar. İlk muhafız büyünüzü kazandığınızda 1 FP'lik bir odak havuzu da kazanırsınız. Günlük hazırlıklarınız sırasında odak havuzunuzu doldurursunuz ve doğayla iletişim kurmak için Odak Yenileme eylemini kullanarak 10 dakika harcayarak 1 FP geri kazanırsınız.
    Muhafız büyüleri doğa büyüleridir. Bir muhafız büyüsünü ilk kazandığınızda büyü saldırılarında ve büyü ZD'lerinde eğitimli olursunuz. Büyü yapma niteliğiniz Bilgeliktir.
    Odak büyüleri otomatik olarak seviyenizin yukarı yuvarlanmış yarısına güçlendirilir. Hünerler almak size daha fazla odak büyüsü kazandırabilir ve odak havuzunuzun boyutunu artırabilir; ancak odak havuzunuz asla 3 FP'den fazlasını tutamaz. Odak büyüleri için tüm kurallar burada yer almaktadır.


omen://class/ranger/features/wardens-endurance?source=paizo-pathfinder-player-core:
  name: Muhafız Dayanıklılığı
  description: Bir bozayı yakalamasını ya da bir zehrin zararlı etkilerini aynı kolaylıkla silkip atarsınız. Dayanıklılık kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir Dayanıklılık kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/ranger/features/weapon-mastery?source=paizo-pathfinder-player-core:
  name: Silah Ustalığı
  description: >
    Barbar Öfkeniz kuşandığınız silahlarla sizi daha da etkili kılar. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.
    Komutan Silahlarınız konusunda kapsamlı tatbikatlar yaptınız. Silahsız saldırılar, basit silahlar ve askeri silahlar için yetkinlik dereceleriniz ustalığa yükselir.
    Muhafız Savaş alanındaki saatler süren deneyiminiz size daha büyük bir hüner kazandırır. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.
    Magus, Rün Ustası, Thaumaturge Silahlarınızı tamamen anlarsınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.


omen://class/ranger/features/will-expertise?source=paizo-pathfinder-player-core:
  name: İrade Uzmanlığı
  description: Zihinsel savunmalarınız güçlenir. İrade kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/ranger/hunters-edge/flurry?source=paizo-pathfinder-player-core:
  name: Yaylım
  description: Avınıza yıkıcı bir saldırı yaylımı salmak için talim yaptınız. İşaretli avınıza yönelik saldırılarda çoklu saldırı cezanız, sıranın ikinci saldırısında -5 yerine –3 (çevik bir saldırıyla –2) ve sıranın üçüncü veya sonraki saldırısında -10 yerine –6 (çevik bir saldırıyla –4) olur.

omen://class/ranger/hunters-edge/outwit?source=paizo-pathfinder-player-core:
  name: Alt Etme
  description: Avınızı alt etme konusunda yeteneklisinizdir. Avınızın saldırılarına karşı ZK'ye +1 durumsal bonus ve Aldatma testlerine, Gözdağı testlerine, Gizlilik testlerine ve av hakkında Bilgi Hatırlamak için yapılan tüm testlere +2 durumsal bonus kazanırsınız.

omen://class/ranger/hunters-edge/precision?source=paizo-pathfinder-player-core:
  name: Hassasiyet
  description: Avınızın zayıf noktalarını hedef almak için talim yaptınız. Bir turda işaretli avınızı ilk vurduğunuzda, ayrıca 1d8 ilave zayıf nokta hasarı verirsiniz. (Zayıf nokta hasarı hâlihazırda verdiğiniz hasarı aynı türü kullanarak artırır, ancak hayati organları veya zayıf noktaları olmayan yaratıklara karşı etkisizdir.) 11. seviyede fazladan hasar 2d8 zayıf nokta hasarına ve 19. seviyede fazladan hasar 3d8 zayıf nokta hasarına yükselir.

omen://class/ranger/ranger?source=paizo-pathfinder-player-core:
  name: Korucu
  description: >
    Bazı korucular medeniyetin ruhu yıprattığına, ancak yine de vahşi yaratıklardan korunması gerektiğine inanır. Diğerleri ise doğanın, onun güzelliğini ehlileştirmek ve hazinelerini yağmalamak isteyen açgözlülerden korunması gerektiğini söyler. Bu amaçlardan birini veya her ikisini birden savunabilirsiniz. Medeniyetin sınırlarında kol gezen ya da yaban hayatını keşfe çıkan bir öncü, iz sürücü ya da kaçak veya canavar avcısı olabilirsiniz. Doğadan nasıl geçineceğinizi bilirsiniz; hem fırsat hedeflerini hem de gözde düşmanları tespit etme ve alt etme konusunda hünerlisinizdir.
    Korucu


omen://class/rogue/features/agile-mind?source=paizo-pathfinder-player-core:
  name: Çevik Zihin
  description: Zihin değiştiren etkileri savuşturmak için zihinsel oyunlar oynar ve bilişsel numaralara başvurursunuz. İrade kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir İrade kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/rogue/features/debilitating-strike?source=paizo-pathfinder-player-core:
  name: Güçten Düşürücü Vuruş
  description: Bir açıktan yararlanırken düşmanınızı hem engeller hem de ona zarar verirsiniz. Güçten Düşürücü Vuruş serbest eylemini kazanırsınız.

omen://class/rogue/features/deny-advantage?source=paizo-pathfinder-player-core:
  name: Avantajı Engelle
  description: Açıklardan yararlanan biri olarak, kendiniz böyle boşluklar bırakmamaya özen gösterirsiniz. Sizin seviyenizde veya daha düşük seviyedeki Gizli, Konumu Saptanmamış veya sizi kıstıran yaratıklara ya da baskın saldırısı kullanan sizin seviyenizde veya daha düşük seviyedeki yaratıklara karşı Savunmasız kalmazsınız. Ancak bu yaratıklar müttefiklerinin sizi kıstırmasına yine de yardımcı olabilir.

omen://class/rogue/features/double-debilitation?source=paizo-pathfinder-player-core:
  name: Çifte Güçten Düşürme
  description: "Fırsatçı saldırılarınız özellikle zararlıdır. Güçten Düşürücü Vuruş kullandığınızda aynı anda iki güçten düşürme uygulayabilirsiniz; birini kaldırmak her ikisini de kaldırır."

omen://class/rogue/features/evasive-reflexes?source=paizo-pathfinder-player-core:
  name: Sakınma Refleksleri
  description: Patlamalardan, ejderha nefeslerinden ve daha kötülerinden kaçınmak için hızla hareket etmeyi öğrendiniz. Refleks kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir Refleks kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/rogue/features/greater-rogue-reflexes?source=paizo-pathfinder-player-core:
  name: Gelişmiş Düzenbaz Refleksleri
  description: Tehlikeden çok az kişinin boy ölçüşebileceği bir derecede sıyrılırsınız. Refleks kurtarışlar için yetkinlik dereceniz efsaneviye yükselir. Bir Refleks kurtarışında kritik başarısızlık elde ettiğinizde, bunun yerine başarısızlık elde edersiniz. Hasar veren bir etkiye karşı Refleks kurtarışında başarısızlık elde ettiğinizde yarım hasar alırsınız.

omen://class/rogue/features/greater-weapon-specialization?source=paizo-pathfinder-player-core:
  name: Gelişmiş Silah Uzmanlaşması
  description: "Silah uzmanlaşmasından gelen hasarınız; uzman olduğunuz silahlar ve silahsız saldırılarla 4'e, ustaysanız 6'ya ve efsaneviyseniz 8'e yükselir."

omen://class/rogue/features/light-armor-expertise?source=paizo-pathfinder-player-core:
  name: Hafif Zırh Uzmanlığı
  description: Hafif zırh giyerken veya zırhsızken nasıl sakınacağınızı öğrendiniz. Hafif zırh ve zırhsız savunma için yetkinlik dereceleriniz uzmanlığa yükselir.

omen://class/rogue/features/light-armor-mastery?source=paizo-pathfinder-player-core:
  name: Hafif Zırh Ustalığı
  description: Hafif zırhtaki hüneriniz gelişerek darbelerden sakınma yeteneğinizi artırır. Hafif zırh ve zırhsız savunma için yetkinlik dereceleriniz ustalığa yükselir.

omen://class/rogue/features/master-strike?source=paizo-pathfinder-player-core:
  name: Usta Vuruşu
  description: Tedbirsiz bir düşmanı tek bir darbeyle etkisiz hâle getirebilirsiniz. Düzenbaz sınıf ZD'niz için yetkinlik dereceniz ustalığa yükselir. Usta Vuruşu serbest eylemini kazanırsınız.

omen://class/rogue/features/master-tricks?source=paizo-pathfinder-player-core:
  name: Usta Numaraları
  description: Bir hırsızın dövüş hamlelerinde ustalaştınız. Tüm basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz ustalığa yükselir.

omen://class/rogue/features/perception-legend?source=paizo-pathfinder-player-core:
  name: Dikkat Efsanesi
  description: Neredeyse algılanamaz olanı fark edersiniz. Dikkat için yetkinlik dereceniz efsaneviye yükselir.

omen://class/rogue/features/perception-mastery?source=paizo-pathfinder-player-core:
  name: Dikkat Ustalığı
  description: >
    Barbar İçgüdünüz duyularınızın her birini daha da keskinleştirir. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Ozan, Silahşor, Düzenbaz Keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Komutan Bir senaryoyu her yönden görebilme yeteneği geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Timsal Maceralarınız boyunca himayenizdekileri daha iyi gözetmek; canavarlara ve diğer tehditlere göz kulak olmak için keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Müfettiş, Kabadayı, Thaumaturge Maceralarınız boyunca keskin bir farkındalık ve ayrıntılara dikkat geliştirdiniz. Dikkat için yetkinlik dereceniz ustalığa yükselir.
    Korucu Son derece gelişmiş bir keskinliğe ve ayrıntılara dikkate sahipsinizdir. Dikkat için yetkinlik dereceniz ustalığa yükselir.


omen://class/rogue/features/rogue-expertise?source=paizo-pathfinder-player-core:
  name: Düzenbaz Uzmanlığı
  description: Tekniklerinize direnmek artık daha zordur. Düzenbaz sınıf ZD'niz için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/rogue/features/rogue-resilience?source=paizo-pathfinder-player-core:
  name: Düzenbaz Direnci
  description: Fiziğiniz inanılmaz derecede dayanıklıdır. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir. Bir Dayanıklılık kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/rogue/features/rogue-skill-advancement?source=paizo-pathfinder-player-core:
  name: Düzenbaz Beceri İlerlemesi
  description: "Bir hırsız, her karakterin kazandığı beceri hünerleri ve beceri artışlarının ötesinde; 1, 3, 5, 7, 9, 11, 13, 15, 17 ve 19. seviyelerde fazladan bir beceri hüneri ve 2, 4, 6, 8, 10, 12, 14, 16, 18 ve 20. seviyelerde fazladan bir beceri artışı kazanır."

omen://class/rogue/features/rogues-racket?source=paizo-pathfinder-player-core:
  name: Düzenbaz Tezgâhı
  description: >
    Düzenbaz çevrelerinde itibarınızı inşa ederken, bir işe yönelik tekniklerinizi ve yaklaşımınızı geliştirmeye başladınız. Aşağıdaki listeden bir hırsız tezgâhı seçin.
    Tekinsiz Düzenbaz
    Dahi Planlayıcı
    Zorba
    Düzenbaz
    Yankesici


omen://class/rogue/features/sneak-attack?source=paizo-pathfinder-player-core:
  name: Sinsi Saldırı
  description: >
    Düşmanınız kendini düzgün bir şekilde savunamadığında fazladan hasar vermek için bu durumdan yararlanırsınız. Savunmasız durumundaki bir yaratığa çevik veya incelikli bir yakın dövüş silahıyla, çevik veya incelikli bir silahsız saldırıyla, menzilli bir silah saldırısıyla ya da menzilli bir silahsız saldırıyla Vurursanız, fazladan 1d6 zayıf nokta hasarı verirsiniz. Fırlatılan bir yakın dövüş silahıyla yapılan menzilli bir vuruş için o silahın da çevik veya incelikli olması gerekir.
    Seviyeniz arttıkça sinsi saldırınızın hasar zarlarının sayısı da artar. 5, 11 ve 17. seviyelerde zar sayısını birer artırın.


omen://class/rogue/features/surprise-attack?source=paizo-pathfinder-player-core:
  name: Baskın Saldırısı
  description: Muharebeye düşmanların reaksiyon verebileceğinden daha hızlı dalarsınız. Muharebenin ilk turunda, inisiyatif için Aldatma veya Gizlilik zarı atarsanız, henüz eylemde bulunmamış yaratıklar size karşı Savunmasızdır.

omen://class/rogue/features/weapon-tricks?source=paizo-pathfinder-player-core:
  name: Silah Numaraları
  description: Basit silahlarda, askeri silahlarda ve silahsız saldırılarda uzman yetkinlik kazanırsınız. Çevik veya incelikli bir silah ya da çevik veya incelikli bir silahsız saldırı kullanırken Savunmasız bir yaratığa karşı yapılan bir saldırı zarında kritik başarı elde ettiğinizde, o silah veya silahsız saldırı için kritik uzmanlaşma etkisini uygularsınız.

omen://class/rogue/rackets/mastermind?source=paizo-pathfinder-player-core:
  name: Dahi Planlayıcı
  description: >
    Başkalarının üç adım sonrasını planlayabildiği yerde 10 adım sonrasını planlayarak karmaşık planlar oluşturmak için zekânıza güvenirsiniz. Hırslı bir dedektif, güçlü bir hanedanın hizmetinde bir casus ustası veya hevesli bir suç baronu ya da bilgi simsarı olabilirsiniz.
    Bilgi Hatırlama kullanarak bir yaratığı başarıyla teşhis ederseniz, o yaratık bir sonraki sıranızın başına kadar saldırılarınıza karşı Savunmasızdır; kritik başarı elde ederseniz, 1 dakika boyunca saldırılarınıza karşı savunmasızdır.
    Sosyoloji becerisinde ve kendi seçeceğiniz şu becerilerden birinde eğitimlisinizdir: Arkana, Doğa, Okültizm veya Din. Ana niteliğiniz olarak Zekâyı seçebilirsiniz.


omen://class/rogue/rackets/ruffian?source=paizo-pathfinder-player-core:
  name: Zorba
  description: >
    Doğrudan yaklaşımı tercih edersiniz: zorbalık veya tehdit. Organize suç örgütleri için bir fedai, bir haydut ya da ailenizin gücünün tehditleriyle başkalarına zorbalık eden bir soylu olabilirsiniz.
    İşi bitirmek için elinizdeki her aracı kullanırsınız. Yalnızca sinsi saldırı sınıf özelliğinde listelenen silahlarla değil, herhangi bir silahla sinsi saldırı hasarı verebilirsiniz. Bu fayda hasar zarı d8'den büyük olan basit bir silaha veya hasar zarı d6'dan büyük olan askeri ya da gelişmiş bir silaha uygulanmaz. (Önce hasar zarı boyutunu değiştiren tüm yetenekleri uygulayın.) Hedef size karşı Savunmasız ise bu silahlarla yaptığınız kritik vuruşlar silahın kritik uzmanlaşma faydasını kazanır.
    Gözdağı becerisinde ve orta zırhta eğitimlisinizdir. Ana niteliğiniz olarak Kuvveti seçebilirsiniz. Hafif zırh uzmanlığı kazandığınızda orta zırhta da uzman yetkinlik kazanırsınız; hafif zırh ustalığı kazandığınızda orta zırhta da usta yetkinlik kazanırsınız.


omen://class/rogue/rackets/scoundrel?source=paizo-pathfinder-player-core:
  name: Düzenbaz
  description: >
    Tehlikelerden kaçınmak ve çetrefilli durumlardan kurtulmak için hızlı konuşma, dalkavukluk ve tatlı dili kullanırsınız. Bir üçkâğıtçı veya dolandırıcı olabileceğiniz gibi, becerilerinizi avukatlık veya diplomatlık gibi belirli saygın mesleklerde de kullanabilirsiniz.
    Başarıyla Yanıltıcı Hamle Yaptığınızda, hedef bir sonraki sıranızın sonuna kadar yakın dövüş saldırılarınıza karşı Savunmasızdır. Kritik bir başarıda hedef yalnızca sizinkilere değil, bir sonraki sıranızın sonuna kadar tüm yakın dövüş saldırılarına karşı savunmasızdır.
    Çevik veya incelikli bir yakın dövüş silahı kuşanmışken Yanıltıcı Hamle Yaparsanız, Yanıltıcı Hamlenin hemen ardından serbest bir eylem olarak Adım atabilirsiniz. Aldatma ve Diplomasi becerilerinde eğitimlisinizdir. Ana niteliğiniz olarak Karizmayı seçebilirsiniz.


omen://class/rogue/rackets/thief?source=paizo-pathfinder-player-core:
  name: Yankesici
  description: >
    Başka birine ait bir şeyi almanın heyecanını hiçbir şey geçemez. Sokaklarda çalışan bir yankesici, pencerelerden süzülen bir kedi hırsızı, hatta müşterilerinizin kasalarını açıkları tespit etmek için test eden bir danışman olabilirsiniz.
    Bir kavga patlak verdiğinde çevik ve hafif silahları tercih eder, en çok acıtan yere vurursunuz. İncelikli bir yakın dövüş silahı veya incelikli bir silahsız yakın dövüş saldırısıyla saldırdığınızda, hasar zarlarına Kuvvet modifiyeriniz yerine Çeviklik modifiyerinizi ekleyebilirsiniz.
    Hırsızlık becerisinde eğitimlisinizdir.


omen://class/rogue/rogue?source=paizo-pathfinder-player-core:
  name: Düzenbaz
  description: >
    Becerikli ve fırsatçısınızdır. Keskin zekânızı ve hızlı reaksiyonlarınızı kullanarak rakiplerinizin hatalı adımlarından yararlanır ve en çok acıtan yere vurursunuz. Heyecan arayarak ve yeteneklerinizi sınayarak tehlikeli bir oyun oynarsınız; önünüze çıkan yasalara da muhtemelen pek aldırış etmezsiniz. Her hırsızın yolu benzersiz ve tehlikelerle dolu olsa da hepinizin paylaştığı ortak nokta, becerilerinizin genişliği ve derinliğidir.
    Düzenbaz


omen://class/witch/basic-lessons/dreams?source=paizo-pathfinder-player-core:
  name: Düşler Dersi
  description: Düşler Tülü nazarını kazanırsınız ve tanıdığınız Uyku büyüsünü öğrenir.

omen://class/witch/basic-lessons/elements?source=paizo-pathfinder-player-core:
  name: Elementler Dersi
  description: Elementel İhanet nazarını kazanırsınız. Tanıdığınız kendi seçeceğiniz Ateş Püskürt, Hava Kabarcığı, Hidrolik İtiş veya Dövücü Moloz büyüsünü öğrenir.

omen://class/witch/basic-lessons/life?source=paizo-pathfinder-player-core:
  name: Yaşam Dersi
  description: Yaşam Desteği nazarını kazanırsınız ve tanıdığınız Ruh Bağı büyüsünü öğrenir.

omen://class/witch/basic-lessons/protection?source=paizo-pathfinder-player-core:
  name: Koruma Dersi
  description: "Kan Muhafazası nazarını kazanırsınız; tanıdığınız Mistik Zırh büyüsünü öğrenir."

omen://class/witch/basic-lessons/vengeance?source=paizo-pathfinder-player-core:
  name: İntikam Dersi
  description: İntikam İğnesi nazarını kazanırsınız ve tanıdığınız Fantom Acısı büyüsünü öğrenir.

omen://class/witch/features/defensive-robes?source=paizo-pathfinder-player-core:
  name: Savunma Cübbeleri
  description: Çevrenizdeki büyünün akışı saldırılardan kaçınma yeteneğinizi artırır. Zırhsız savunma için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/witch/features/expert-spellcaster?source=paizo-pathfinder-player-core:
  name: Uzman Büyücü
  description: >
    Animist: Ruhların büyüsü içinizden özgürce akar. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.

    Ozan: Büyüsel teknikleriniz güçlenir. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz uzmanlığa yükselir.

    Druid: Doğa güçlerine olan hâkimiyetiniz derinleşerek büyülerinizi güçlendirir. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.

    Magus: Büyüye dair temel kavrayışınız gelişerek büyülerinize direnilmesini zorlaştırır. Büyü saldırı modifiyeriniz ve büyü ZD'niz için yetkinlik dereceleriniz uzmanlığa yükselir.

    Kâhin: İlahi gücünüzün karmaşıklığı zamanla daha netleşti. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz uzmanlığa yükselir.

    Psychic: Kendi üzerine düşünme, kendinize dair daha büyük bir bilgi ve bununla birlikte psişik güç getirdi. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.

    Sorcerer: Özgü büyünüz emrinize kolayca ve güçlü bir şekilde yanıt verir. Soyunuzun geleneğindeki büyüler için büyü saldırı modifiyeri ve büyü ZD'si yetkinlik dereceleriniz uzmanlığa yükselir.

    Summoner: Eidolonunuzla olan bağınız derinleştikçe, büyülerin gücü de artar. Büyü saldırı modifiyeri ve büyü ZD'si istatistikleri için yetkinlik dereceleriniz uzmanlığa yükselir.

    Witch: Haminizin size bahşettiği gücü daha iyi kontrol etmeyi öğrendiniz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.

    Wizard: Arkana üzerine yapılan uzun süreli pratik yeteneklerinizi geliştirdi. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.


omen://class/witch/features/hex-spells?source=paizo-pathfinder-player-core:
  name: Nazar Büyüleri
  description: >
    Haminizin gözde bir temsilcisi olarak, daha doğrudan bir büyü müdahalesi için onun gücüne başvurabilirsiniz. Nazar; doğrudan kullandığınız bir yetenekten ziyade haminiz tarafından şekillendirilen ve tanıdığınız aracılığıyla size gönderilen bir büyüdür. Haminiz onun çıkarlarını gözetmenizi bekler ve mükerrer yardım taleplerini hoş karşılamaz; bu nedenle her sırada yalnızca bir nazar kullanabilirsiniz ve o sırada ikinci bir nazar kullanma girişimleri başarısız olur ve harcanan eylemler boşa gider.
    Nazar büyüleri bir odak büyüsü türüdür. Bir odak büyüsü yapmak 1 Odak Puanı harcar ve 1 Odak Puanlık bir odak havuzuyla başlarsınız. Günlük hazırlıklarınız sırasında odak havuzunuzu doldurursunuz ve tanıdığınızla iletişim kurmak için Odak Yenileme eylemini kullanarak 10 dakika harcayarak 1 Odak Puanı geri kazanabilirsiniz.
    Odak büyüleri tıpkı kantripler gibi otomatik olarak seviyenizin yukarı yuvarlanmış yarısına güçlendirilir. Odak büyüleri büyü slotu gerektirmez ve onları büyü slotları kullanarak yapamazsınız. Belirli hünerler size daha fazla odak büyüsü kazandırır. Odak havuzunuzun tutabileceği maksimum Odak Puanı sahip olduğunuz odak büyülerinin sayısına eşittir, ancak asla 3 puandan fazla olamaz.
    Sırasıyla tanıdığınıza komut vermenize veya onu zarardan korumanıza olanak tanıyan Haminin Kuklası nazarı veya Faz Tanıdığı nazarı seçeneklerinden birini öğrenirsiniz. Diğer nazarların çoğunu Witch derslerinden öğrenirsiniz.
    Nazar Kantripleri
    Nazar kantripleri Odak Puanı harcamayan özel nazarlardır, böylece her sırada yine de yalnızca tek bir nazar kullanabilmenize rağmen onları dilediğiniz sıklıkta yapabilirsiniz. Nazar kantripleri, Witch büyücülüğüyle seçtiğiniz kantriplere ilavedir ve hazırladığınız kantriplerin kotasına dahil edilmez.
    Hami tercihinize göre belirlenen bir nazar kantripi kazanırsınız.


omen://class/witch/features/legendary-spellcaster?source=paizo-pathfinder-player-core:
  name: Efsanevi Büyücü
  description: >
    Animist: Öte alemlerin büyüsel enerjileri için neredeyse kusursuz bir kanalsınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.

    Ozan: Büyüye olan hükmünüz dillere destandır. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz efsaneviye yükselir.

    Druid: Doğanın büyüsüyle benzersiz bir uyum geliştirdiniz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.

    Kâhin: İlahi gücü çok az kişinin boy ölçüşebileceği bir düzeyde dizginleyebilirsiniz. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz efsaneviye yükselir.

    Psychic: Eğitiminiz zirveye ulaştığında, yalnızca kendi zihninizi değil, tüm psişik gücün kaynaklandığı kolektif bilinçdışını da anlarsınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.

    Sorcerer: Büyücülük konusunda olağanüstü bir yetenek sergilersiniz. Soyunuzun geleneğindeki büyüler için büyü saldırı modifiyeri ve büyü ZD'si yetkinlik dereceleriniz efsaneviye yükselir.

    Witch: Haminizin sağladığı büyüye olan hâkimiyetinizi kusursuzlaştırdınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.

    Wizard: Hem arkana teorisini hem de pratik büyü zanaatını harmanlayan yetkin bir büyücüsünüz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.


omen://class/witch/features/magical-fortitude?source=paizo-pathfinder-player-core:
  name: Büyülü Beden
  description: >
    Kâhin, Sorcerer, Wizard: Büyüsel güç vücudunuzun direncini artırdı. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

    Witch: Haminizin gücü fiziksel direncinizi artırır. Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.


omen://class/witch/features/master-spellcaster?source=paizo-pathfinder-player-core:
  name: Usta Büyücü
  description: >
    Animist: Bağ kurduğunuz hayaletlerle olan yakınlığınız büyünüzün kudretini daha da artırdı. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Ozan: Büyünün ipliklerini bir arpın telleri gibi çalarsınız. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.

    Druid: Doğa büyüsü emrinize itaat eder. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Magus: Büyülerinizi ustalık derecesindeki hünerinizle tahkim edersiniz. Büyü saldırı modifiyeriniz ve büyü ZD'niz için yetkinlik dereceleriniz ustalığa yükselir.

    Kâhin: Gizeminizin içindeki derin ve karmaşık ilahi gücü tam anlamıyla kavrarsınız. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.

    Psychic: Kendi zihninizin en derin köşelerine erişim kazandınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Sorcerer: Kanınızdaki büyü üzerinde ustalık kazandınız. Soyunuzun geleneğindeki büyüler için büyü saldırı modifiyeri ve büyü ZD'si yetkinlik dereceleriniz ustalığa yükselir.

    Summoner: Eidolonunuzla olan bağınız, ilişkili büyüler üzerinde ustalık kazanmanızı sağlayacak kadar güçlüdür. Büyü saldırı modifiyerleri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.

    Witch: Haminizin büyüsü üzerinde ustalık kazandınız. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Wizard: Üstün bir büyücülük kabiliyetine hükmedersiniz. Büyü saldırı modifiyeri ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.


omen://class/witch/features/patron-theme?source=paizo-pathfinder-player-core:
  name: Hami Teması
  description: >
    Haminiz sizinle ilk temas kurduğunda genellikle kendisinden anlık görüntüler veya belirli tezahürlerden fazlasını nadiren açıklar—tanıdığınız kendini göstermeden önce ormanın gölgelerinden bakan gözler görebilir veya donmuş tundrada yankılanan kelimesiz bir ses duyabilirsiniz. Haminizin gerçek kimliği güçlü bir kocakarı, bir peri lordu, bir tanrı veya yarı tanrı, bir başiblis ya da benzer şekilde güçlü bir varlık veya belki de birlikte çalışan bu türden birden fazla figür olabilir; ancak bu kimlik haminizin derslerinden daha fazlasını öğrendikçe keşfetmeye çalışacağınız bir şeydir. Bazı hamiler çok yönlüdür, farklı kılıklarda görünür ve farklı cadılara farklı güçler bahşeder. Bazı durumlarda bir Witch haminin kimliğini bilebilir ancak başka bir yönü belirsizliğe bürünmüş olabilir; haminin adını bilebilir ama amacını bilemeyebilir veya haminin kimliğini bilse bile bunu asla başkalarına açıklayamamak üzere lanetlenmiş olabilir.
    Haminizin teması şunları belirler:

    Büyü Listesi: Bu büyü geleneğini ve büyü listesini kullanırsınız.

    Hami Becerisi: Haminizin büyü geleneğiyle ilişkili beceride eğitimli olursunuz.

    Başlangıç Dersi: Bu haminizin size öğrettiği ilk derstir ve haminize özgüdür.

    Ruhdaş Hayvan Yeteneği: Ruhdaş Hayvanınızın iki bonus yeteneğinden biri, haminizin silinmez etkisinin bir işareti olarak her zaman burada listelenen yetenektir. Bu fayda bir nazarı Yaptığınızda veya Sürdürdüğünüzde tur başına yalnızca bir kez gerçekleşebilir; bunun nazarı Yapmanın veya Sürdürmenin etkilerinden önce mi yoksa sonra mı gerçekleşeceğini seçebilirsiniz.


omen://class/witch/features/patron?source=paizo-pathfinder-player-core:
  name: Hami
  description: >
    Büyü yapma gücüyle doğmadınız; tapınmaya, çalışmaya veya mistik sırları açığa çıkarmaya adanmış yıllar da geçirmediniz. Büyünüz bunun yerine güçlü bir varlık tarafından size armağan edilmiştir; sizi bu şekilde güçlendirerek varlığın dünyadaki ajandasını her ne olursa olsun ilerleteceğinizi bilen biri tarafından. Bu varlık genellikle gizemli ve mesafelidir; kimliğini ve motivasyonlarını pek az açıklar. İradesini size kelimelerden ziyade alametler, düşler veya benzeri incelikler gibi soyut işaretlerle bildirir.
    Haminiz sizinle doğrudan etkileşime geçmek yerine bir ruhdaş hayvan aracılığıyla çalışır—size öğreten, haminizin büyüsü için bir kanal görevi gören ve belki de haminizin muğlak amaçlarını ilerlettiğinizden emin olmak için gözünü üzerinizden ayırmayan mistik bir yaratık.
    1. seviyede büyü geleneğinizi belirleyen ve size o büyü geleneğinin becerisini, ilk Witch dersinizi ve benzersiz bir ruhdaş hayvan yeteneğini kazandıran haminizi seçin.


omen://class/witch/features/patrons-gift?source=paizo-pathfinder-player-core:
  name: Haminin Armağanı
  description: Haminiz size inanılmaz büyü eserlerine hükmetme gücü bahşeder. Tek bir 10. derece büyü slotu kazanırsınız ve Witch büyücülüğünü kullanarak bu slota bir büyü hazırlayabilirsiniz. Diğer büyü slotlarından farklı olarak 10. derece slotları, size daha fazla büyü slotu kazandıran veya büyü slotu harcamadan büyü yapmanıza olanak tanıyan yeteneklerle kullanamazsınız. Seviye atladıkça daha fazla 10. derece büyü kazanmazsınız, ancak ikinci bir slot kazanmak için Haminin Hakikati hünerini alabilirsiniz.

omen://class/witch/features/perception-expertise?source=paizo-pathfinder-player-core:
  name: Dikkat Uzmanlığı
  description: Çevrenizdeki tehditlere karşı daima tetikte kalırsınız. Dikkat için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/witch/features/reflex-expertise?source=paizo-pathfinder-player-core:
  name: Refleks Uzmanlığı
  description: >
    Tehlikelerden sıyrılma konusunda bir maharet geliştirdiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.
    Muhafız En ağır zırhların içindeyken bile geniş alana yayılan etkilere karşı kendinizi hazırlayabilirsiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.


omen://class/witch/features/weapon-expertise?source=paizo-pathfinder-player-core:
  name: Silah Uzmanlığı
  description: >
    Şampiyon, Timsal, Müfettiş, Magus, Rün Ustası: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Druid, Kinetikçi: Savaş becerinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir.

    Muhafız: Bazen en iyi savunma iyi bir taarruzdur. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Necromancer, Kâhin: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Psychic: Eğitim, muhtemelen okült büyünüzle de pekiştirilerek silah tekniğinizi geliştirdi. Basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir.

    Sorcerer: Savaş becerinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Kabadayı: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir. Uzman yetkinliğe sahip olduğunuz tüm silahların kritik uzmanlaşma etkilerine erişim kazanırsınız.

    Thaumaturge: Silahlarınızın en etkili şekilde çalışma sırlarını öğrendiniz. Silahsız saldırılar, basit silahlar ve askeri silahlar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Witch, Wizard: Katıksız deneyim sayesinde silahlarınızla olan tekniğinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.


omen://class/witch/features/will-of-the-pupil?source=paizo-pathfinder-player-core:
  name: Çömezin İradesi
  description: Tanıdığınızla iletişim kurmak zihinsel dayanıklılığınızı çelikleştirdi. İrade kurtarışlar için yetkinlik dereceniz ustalığa yükselir. Bir İrade kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/witch/features/witch-lessons?source=paizo-pathfinder-player-core:
  name: Witch Dersleri
  description: >
    Bir Witch'in hamisinden aldığı bilgi Temel Ders gibi hünerler seçilerek öğrenilebilen dersler şeklinde gelir. Her ders size bir nazar kazandırır ve tanıdığınıza yeni bir büyü öğreterek bunu Witch büyücülüğünüzü kullanarak hazırlayabileceğiniz büyülere ekler. Geleneğinizin büyü listesinde olmasa bile bu büyüyü kazanırsınız.

    TEMEL DERSLER

    Bir hüner veya başka bir etki size temel bir ders kazandırdığında bu dersler arasından seçim yapabilirsiniz.

    Düşler Dersi Düşler Tülü nazarını kazanırsınız ve tanıdığınız Uyku büyüsünü öğrenir.

    Elementler Dersi Elementel İhanet nazarını kazanırsınız. Tanıdığınız kendi seçeceğiniz Ateş Püskürt, Hava Kabarcığı, Hidrolik İtiş veya Dövücü Moloz büyüsünü öğrenir.

    Yaşam Dersi Yaşam Desteği nazarını kazanırsınız ve tanıdığınız Ruh Bağı büyüsünü öğrenir.

    Koruma Dersi Kan Muhafazası nazarını kazanırsınız; tanıdığınız Mistik Zırh büyüsünü öğrenir.

    İntikam Dersi İntikam İğnesi nazarını kazanırsınız ve tanıdığınız Fantom Acısı büyüsünü öğrenir. • Yaygın Olmayan

    Felaket Dersi: Tökezleten Lanet nazarını kazanırsınız ve tanıdığınız Kötü Alamet büyüsünü öğrenir.

    GELİŞMİŞ DERSLER

    Bir hüner veya başka bir etki size gelişmiş bir ders kazandırdığında bu dersler arasından seçim yapabilirsiniz.

    Muziplik Dersi Düzenbazın Pelerini nazarını kazanırsınız ve tanıdığınız Çılgın Maymunlar büyüsünü öğrenir.

    Gölge Dersi Kötücül Gölge nazarını kazanırsınız ve tanıdığınız Dondurucu Karanlık büyüsünü öğrenir.

    Kar Dersi Kişisel Tipi nazarını kazanırsınız ve tanıdığınız Rüzgâr Duvarı büyüsünü öğrenir.

    Lütuflar Dersi Lütfa Karşılık nazarını kazanırsınız ve tanıdığınız Tehdit Zihni büyüsünü öğrenir.

    Çürüme Dersi Yaşayan her şey eninde sonunda çürüyerek mantarları ve böcekleri besler. Mikolojik İllet nazarını kazanırsınız ve tanıdığınız Böcek Formu büyüsünü öğrenir.

    Sürü Dersi Birçoğu tek bir vücut olarak çalıştığında güç akar. Koruyucu Kanatlar nazarını kazanırsınız ve tanıdığınız Havada Süzül büyüsünü öğrenir.

    Köpekbalığı Dersi Bu ölümcül okyanus yırtıcısının yollarını öğrenin. Sudaki Kan nazarını kazanırsınız ve tanıdığınız Ayaktan Yüzgece büyüsünü öğrenir.

    BÜYÜK DERSLER

    Bir hüner veya başka bir etki size büyük bir ders kazandırdığında bu dersler arasından seçim yapabilirsiniz.

    Pazarlıklar Dersi Közlerin Üzerinde nazarını kazanırsınız ve tanıdığınız Bilinçaltı Telkini büyüsünü öğrenir.

    Ölüm Dersi Ölüm Laneti nazarını kazanırsınız ve tanıdığınız Ölü Uyandır büyüsünü öğrenir.

    Yenilenme Dersi İyileşme Anı nazarını kazanırsınız ve tanıdığınız Yaşam Sahası büyüsünü öğrenir. • Nadir

    Buzlar Kraliçesi Dersi Buzul Kalbi nazarını kazanırsınız ve tanıdığınız Buz Duvarı büyüsünü öğrenir.


omen://class/witch/features/witch-spellcasting?source=paizo-pathfinder-player-core:
  name: Witch Büyücülüğü
  description: >
    Haminiz, tanıdığınızı bir kanal olarak kullanarak size büyü yapma gücü sağlar. Siz bir büyücüsünüz ve Büyü Yap etkinliğini kullanarak haminizin geleneğine ait büyüleri yapabilirsiniz. Bir Witch olarak büyü yaptığınızda efsunlarınız kafiyeli olabilir, jestleriniz tekinsiz bir işaret parmağı kadar basit veya karmaşık bir halk işareti kadar girift olabilir ve haminizin büyüsü kabardıkça tanıdığınız sözlerinizi veya hareketlerinizi hafifçe yankılayabilir.

    1. seviyede, her sabah tanıdığınızın bildiği büyüler arasından iki adede kadar 1. derece büyü ve beş kantrip hazırlayabilirsiniz. Hazırlanan büyüler, siz onları yapana veya büyülerinizi tekrar hazırlayana kadar kullanılabilir kalır. Her gün hazırlayabileceğiniz büyü sayısına büyü slotlarınız denir. Bir Witch olarak seviyeniz arttıkça, Günlük Witch Büyüleri tablosunda gösterildiği gibi, her gün hazırlayabileceğiniz büyü sayısı ve yapabileceğiniz en yüksek büyü derecesi de artar.
    Bazı büyüleriniz ne kadar etkili olduklarını görmek için bir büyü saldırısı denemenizi gerektirir veya düşmanlarınızın büyü ZD'nize karşı zar atmasını sağlar (tipik olarak bir kurtarış deneyerek). Ana niteliğiniz Zekâ olduğundan, büyü saldırı değiştiriciniz ve büyü ZD'niz Zekâ değiştiricinizi kullanır.

    Büyüleri Güçlendirme

    2. derece ve daha yüksek büyü slotları elde ettiğinizde, bu slotları daha alt derecedeki büyülerin daha güçlü versiyonlarıyla doldurabilirsiniz. Bu işlem büyünün derecesini artırarak onu büyü slotuyla eşleşecek şekilde güçlendirir. Pek çok büyü, belirli derecelere güçlendirildiğinde özel iyileştirmelere sahiptir.

    Kantripler

    Büyülerinizin bazıları kantriplerdir. Kantrip, büyü slotu kullanmayan özel bir büyü türüdür. Günde istediğiniz sayıda, dilediğiniz an bir kantrip yapabilirsiniz. Bir kantrip her zaman otomatik olarak yukarı yuvarlanmış seviyenizin yarısına güçlendirilir; bu genellikle sahip olduğunuz en yüksek Witch büyü slotu derecesine eşittir. Örneğin 1. seviye bir Witch olarak kantripleriniz 1. derece büyülerdir ve 5. seviye bir Witch olarak kantripleriniz 3. derece büyülerdir.

omen://class/witch/greater-lessons/mischief?source=paizo-pathfinder-player-core:
  name: Hınzırlık Dersi
  description: Düzenbazın Pelerini nazarını kazanırsınız ve tanıdığınız Çılgın Maymunlar büyüsünü öğrenir.

omen://class/witch/greater-lessons/shadow?source=paizo-pathfinder-player-core:
  name: Gölge Dersi
  description: Kötücül Gölge nazarını kazanırsınız ve tanıdığınız Dondurucu Karanlık büyüsünü öğrenir.

omen://class/witch/greater-lessons/snow?source=paizo-pathfinder-player-core:
  name: Kar Dersi
  description: Kişisel Tipi nazarını kazanırsınız ve tanıdığınız Rüzgâr Duvarı büyüsünü öğrenir.

omen://class/witch/major-lessons/death?source=paizo-pathfinder-player-core:
  name: Ölüm Dersi
  description: Ölüm Laneti nazarını kazanırsınız ve tanıdığınız Ölü Uyandır büyüsünü öğrenir.

omen://class/witch/major-lessons/renewal?source=paizo-pathfinder-player-core:
  name: Yenilenme Dersi
  description: İyileşme Anı nazarını kazanırsınız ve tanıdığınız Yaşam Sahası büyüsünü öğrenir.

omen://class/witch/patrons/faiths-flamekeeper?source=paizo-pathfinder-player-core:
  name: İnancın Ateş Muhafızı
  description: >
    Haminiz, irade gücünüzün tükenmeye yaklaştığı bir anda sizinle iletişime geçti. Güven veren varlığı bir kor parçasını yeniden alevlendiren nefes ve çıra gibiydi; büyüsü size yola devam etme ve başkalarını davanıza çekme gücü verdi. Haminiz muhtemelen gizlice hareket eden melek veya eon gibi ilahi bir varlıktır; ancak sizi bilinmeyen amaçlar için kullanan daha meşum bir varlık olma olasılığı da vardır.
    Büyü Listesi: ilahi

    Hami Becerisi: Din

    Şevkin Kavrayışı Dersi: Haminiz size ister ilham vermek ister yönlendirmek için kullanılsın, hiçbir şeyin kalbi inanç gibi kavrayamayacağını öğretti. Yüreği Körükle temel nazar büyüsünü kazanırsınız ve tanıdığınız Emret büyüsünü öğrenir.

    Yenilenmiş Ruh Tanıdığı: Tanıdığınız hoş bir şekilde ılık ve yumuşaktır, sadece varlığıyla bile endişeleri silip süpürüyor gibidir. Bir nazarı Yaptığınızda veya Sürdürdüğünüzde, tanıdığınızın 15 fit yakınındaki bir gönüllü yaratık, sonraki sıranızın başlangıcına kadar süren, 2 + seviyenizin yarısına eşit Geçici Can Puanı kazanır.

omen://class/witch/patrons/familiar-witch?source=paizo-pathfinder-player-core:
  name: Ruhdaş Hayvan (Witch)
  description: >
    Haminiz size büyü öğreten ve büyülerinizi kolaylaştıran mistik bir yaratık olan bir ruhdaş hayvan göndermiştir. Bu ruhdaş hayvan, ruhdaş hayvanlara ilişkin kurallara uyar; ancak siz ve haminiz arasında doğrudan bir kanal olduğundan tipik ruhdaş hayvanlardan daha güçlüdür. Ruhdaş Hayvanınız iki ek ruhdaş hayvan yeteneği kazanır: bunlardan biri haminize dayalı benzersiz bir yetenektir ve her zaman seçilir, diğeri ise normalde olduğu gibi her gün seçilebilen ek bir ruhdaş hayvan yeteneğidir. Ruhdaş Hayvanınız 6., 12. ve 18. seviyelerde birer ekstra yetenek daha kazanır.
    Büyüler: Tanıdığınız, haminizin size bahşettiği büyülerin kaynağı ve deposudur; Witch büyücülüğünüzü kullanarak her gün büyülerinizi hazırlamak için tanıdığınızla iletişim kurmalısınız. Tanıdığınız 10 temel büyü, beş adet 1. derece büyü ve haminizin ilk dersiyle belirlenen bir ek büyü bilerek başlar. Bu büyüleri, haminiz tarafından belirlenen geleneğin yaygın büyüleri arasından veya o geleneğin erişim kazandığınız diğer büyüleri arasından seçersiniz. Her seviye atladığınızda haminiz, tanıdığınıza büyü slotlarına sahip olduğunuz herhangi bir dereceden, geleneğinizin yaygın büyüleri veya erişim kazandığınız diğerleri arasından seçilen iki yeni büyü öğretir. Hünerler de tanıdığınıza ek büyüler kazandırabilir.

    Büyü Öğrenme: Ruhdaş Hayvanınız haminizden bağımsız olarak yeni büyüler öğrenebilir. Geleneğinizin büyü listesindeki herhangi bir büyüyü, o büyünün yazılı versiyonunu 1 saat boyunca fiziksel olarak tüketerek öğrenebilir. Bu, o büyünün bir parşömeni olabilir veya Büyü Öğren keşif etkinliğini kullanarak yazılı bir versiyon hazırlayabilirsiniz. Siz ve ruhdaş hayvanınız, başka bir Witch'in tanıdığından ruhdaş hayvanınıza bir büyü öğretmek için Büyü Öğren etkinliğini kullanabilirsiniz. Her iki ruhdaş hayvan de etkinliğin tamamı boyunca mevcut olmalı, büyü sizin büyü geleneğinizin büyü listesinde bulunmalı ve bu etkinlik için gereken olağan bedeli (tipik olarak diğer tanıdığın hamisine bir adak şeklinde) ödemelisiniz. Başka bir Witch'in tanıdığından büyü hazırlayamazsınız.

    Ölümsüzlük: Ruhdaş Hayvanınız ölürse, sonraki günlük hazırlıklarınız sırasında haminiz onun yerine yenisini verir. Yeni ruhdaş hayvan eski ruhdaş hayvanınızın bir kopyası, reenkarnasyonu veya tamamen yeni bir varlık olabilir; ancak her halükarda eski ruhdaş hayvanınızın bildiği büyülerin aynısını bilir. Ruhdaş Hayvanınızın ölümü, önceden hazırlamış olduğunuz hiçbir büyüyü etkilemez.

omen://class/witch/patrons/inscribed-one?source=paizo-pathfinder-player-core:
  name: Kazınmış Olan
  description: >
    Karşılaştığınız anda haminizin dudaklarından hiçbir söz dökülmedi; bunun yerine teninde sözcükler ve glifler dans ederken, gözlerinin derinliklerinde semboller ve sayılar yüzüyor, iradelerini bir sözcük ve bilgelik seliyle ortaya koyuyordu. Haminiz güçlü bir başbüyücü veya bir halef arayan terk edilmiş eserlerinden biri olabilir.
    Büyü Listesi mistik
    Hami Becerisi Mistik İlim
    Glifin Üstünlüğü Dersi Haminiz, yazılı sözcüğün göründüğünden çok daha fazlasını başarabileceğini öğretir. Sırları Sez nazarını kazanırsınız ve tanıdığınız Runik Silah büyüsünü öğrenir.
    Akan Yazı Tanıdığı Tanıdığınız, bilinmeyen bir dildeki harflere benzeyen, anlaşılmaktan kaçsa bile dikkat çeken bir desenle kaplıdır. Bir nazarı Yaptığınızda veya Sürdürdüğünüzde, harfler hızla değişmeye başlayarak dikkat dağıtır. Sonraki sıranızın başlangıcına kadar tanıdığınız, sanki saldırabiliyormuş ve 5 fitlik bir erişim mesafesine sahipmiş gibi sizin ve müttefikleriniz için kıstırma sağlayabilir; bu görsel bir etkidir.

omen://class/witch/patrons/resentment?source=paizo-pathfinder-player-core:
  name: Hınç
  description: >
    Haminizle karşılaştığınız anda ondan tek bir duygu yayıldı, bir ateşin sıcaklığı kadar somuttu: İster küçük halk için haklı bir adalet getirmek olsun, ister güçlülerin yenildiğini görme yönündeki adi bir arzu olsun, göze batan her başın ezildiğini ve sivrilen her çivinin çakıldığını görme isteği. Haminiz muhtemelen kendi türünün üst kademelerinden uzaktır; meclisinden kovulmuş bir Witch karısı, yarı-ilahi bir varlık veya alt kademe bir iblis gibi. Bu durum, amaçlarına ulaşması için geriye yalnızca daha sinsi ve zayıf araçlar bırakır: lanetler, nazarlar ve siz.
    Büyü Listesi okült
    Hami Becerisi Okültizm
    Kuvvetin Geçiciliği Dersi Haminiz size gücün inşa edilmekten çok daha kolay alınabileceğini öğretti. Kem Göz temel nazar büyüsünü kazanırsınız ve tanıdığınız Halsiz Düşür büyüsünü öğrenir.
    Süren Sefalet Tanıdığı Tanıdığınız siz dışındaki tüm yaratıklara düşmanca görünür, çok yaklaşırlarsa onlara tıslar. Bir nazarı Yaptığınızda veya Sürdürdüğünüzde, tanıdığınız 15 fit yakınındaki bir yaratığı lanetleyerek onu etkileyen herhangi bir olumsuz durumun süresini 1 tur uzatabilir. Bu bir lanet etkisidir. Bu yalnızca belirli bir süreye sahip durumları uzatır ("1 tur" veya "sonraki sıranızın sonuna kadar" gibi) ve durumların başka yollarla giderilmesini engellemez.

omen://class/witch/patrons/silence-in-snow?source=paizo-pathfinder-player-core:
  name: Kardaki Sessizlik
  description: >
    Kış gündönümünün derinliklerinde veya dünyanın ucundaki donmuş bir zirvede, haminizin ortaya çıkışını dondurucu bir soğuk haber verdi. Haminiz bir kış Witch karısı, buz yaisi veya başka bir soğuk ruhu olabilir; ancak bir şey buz gibi açıktır: Güçleri asla hafife alınmamalıdır.
    Büyü Listesi doğa
    Hami Becerisi Doğa
    Kışın Ayazı Dersi Haminiz sizi ayaz ve kara maruz bırakarak kışın gücünü bizzat öğretti. Yapışkan Buz temel nazar büyüsünü öğrenirsiniz ve tanıdığınız Rüzgâr Esintisi büyüsünü öğrenir.
    Dondurucu Kırağı Tanıdığı Tanıdığınız dokunulduğunda soğuktur, nefesi her zaman görünür. Bir nazarı Yaptığınızda veya Sürdürdüğünüzde, tanıdığınızın alanındaki bir kare merkezli bir patlama şeklinde buz oluşmasına neden olabilirsiniz. Bu kareler, sonraki sıranızın başlangıcına kadar zorlu arazidir.

omen://class/witch/patrons/spinner-of-threads?source=paizo-pathfinder-player-core:
  name: İpliklerin Eğiricisi
  description: >
    Zamanın ve kaderin dokumasını çözüp yeniden eğirirken, haminizle henüz gerçekleşmemiş bir karşılaşmanın anısında veya çoktan geçmiş bir şeyin önsezisinde buluştunuz. Haminiz bir norn muydu? Pharasma, Alseta veya Örümcek Büyükanne gibi bir ilahın elçisi miydi? Hatta zaman çizelgesinin üç veya daha fazla noktasında görünen tek bir birey olabilir miydi: aynı varlığın birden fazla versiyonu, tek bir anda birleşen paralel iplikler?
    Büyü Listesi okült
    Hami Becerisi Okültizm
    Kaderin Cilveleri Dersi Haminizin sert dersi, kaderin kimseyi esirgemediği, herkes için sırayla yükselip alçaldığıdır. Kaderi Dürt temel nazar büyüsünü kazanırsınız ve tanıdığınız Kesin Saldırı büyüsünü öğrenir.
    Dengeli Şans Tanıdığı Tanıdığınızın vücudunda, bakış açısına göre bir uğur tılsımına veya kötü bir alamete benzeyen bir leke vardır. Bir nazarı Yaptığınızda veya Sürdürdüğünüzde, tanıdığınızın 15 fit yakınındaki bir yaratık, sonraki sıranızın başlangıcına kadar SD'sine sizin seçiminize göre ya +1 statü bonusu ya da –1 statü cezası alır.

omen://class/witch/patrons/starless-shadow?source=paizo-pathfinder-player-core:
  name: Yıldızsız Gölge
  description: >
    Haminiz sizinle ilk kez tekinsiz saatte iletişime geçti; zihniniz henüz uyanık dünyadan kaçamamışken bedeniniz uykunun felciyle yatıyordu. Haminiz Yeraltı Dünyası'nın bir yaratığı veya alacakaranlığın çoktan unutulmuş bir ruhu olabilir; onlara dair hatırladığınız tek şey, size karanlıktan güç sunan, ay ışığından ürpertici gözlerdir.
    Büyü Listesi okült
    Hami Becerisi Okültizm
    Gecenin Dehşetleri Dersi Haminiz size karanlığın, görülmemesi en iyisi olan her türlü şeyi gizleyebileceğini öğretti. Gece Örtüsü temel nazar büyüsünü kazanırsınız ve tanıdığınız Korku büyüsünü öğrenir.
    Kol Gezen Gece Tanıdığı Tanıdığınızın kürkü veya tüyleri koyu renklidir ve ışık onda kayboluyor gibi görünür. Bir nazarı Yaptığınızda veya Sürdürdüğünüzde, tanıdığınız kendisinin Belirsiz, Gizlenmiş veya konumu saptanmamış olduğu bir düşmana bitişikse, o düşman Korkmuş 1 olur.

omen://class/witch/patrons/wilding-steward?source=paizo-pathfinder-player-core:
  name: Yaban Kâhyası
  description: >
    Haminiz önünüzde belirdiğinde, vahşi doğanın zarafeti ve yırtıcılığıyla hareket ediyordu; sesi ağaçların gıcırtısı ve el değmemiş toprağa vuran toynak sesiydi. Bir drayad kraliçesi veya ilksel bir canavar olabilirdi, ancak tüm doğa sanki savunulacak onlara ait bir yer gibiydi.
    Büyü Listesi doğa
    Hami Becerisi Doğa
    Yabanın Dili Dersi Haminiz size sözsüz konuşmanın karmaşıklıklarını öğreterek hayvanları ve bitkileri etkilemenizi ve kendinize çağırmanızı sağladı. Yabanın Sözü temel nazar büyüsünü kazanırsınız ve tanıdığınız sizin tercihinize göre Hayvan Çağır veya Bitki veya Mantar Çağır büyüsünü öğrenir.
    Keskin Duyular Tanıdığı Tanıdığınızın parıldayan gözleri, seğiren kulakları veya bir canavarın güçlü duyularına dair başka işaretleri vardır. Bir nazarı Yaptığınızda veya Sürdürdüğünüzde, tanıdığınız sonraki sıranızın başlangıcına kadar 60 fit menzilli belirsiz koku alma, titreşim duyusu veya dalga duyusundan seçtiğiniz birini kazanır ve serbest eylem olarak derhal İşaret Edebilir.

omen://class/witch/witch?source=paizo-pathfinder-player-core:
  name: Witch
  description: >
    Çalışma veya adanmışlık yoluyla değil, sizin bile tamamen anlamadığınız öte dünyalı bir haminin aracısı olarak güçlü bir büyüye hükmedersiniz. Bu varlık gizli bir ilah, güçlü bir peri, kadim bir ruh veya başka herhangi bir kudretli doğaüstü varlık olabilir; ancak doğası muhtemelen başkaları için olduğu kadar sizin için de bir gizemdir. Özel bir ruhdaş hayvan aracılığıyla haminiz, uygun gördüğünüz şekilde kullanmanız için size çok yönlü büyüler ve güçlü nazarlar bahşeder; ancak sadece haminizin daha büyük planına hizmet edip etmediğinizden asla emin olamazsınız.

omen://class/wizard/features/arcane-bond?source=paizo-pathfinder-player-core:
  name: Mistik Bağ
  description: "Büyü gücünüzün bir kısmını bağlı bir eşyaya yerleştirirsiniz. Her gün büyülerinizi hazırlarken sahip olduğunuz tek bir eşyayı bağlı eşyanız olarak belirleyebilirsiniz. Bu tipik olarak asa, yüzük veya değnek gibi büyücülükle ilişkili bir eşyadır; ancak bir silah veya başka bir eşya belirlemekte özgürsünüz. Bağlı Eşyayı Boşalt serbest eylemini kazanırsınız."

omen://class/wizard/features/arcane-school?source=paizo-pathfinder-player-core:
  name: Mistik Okul
  description: >
    Çoğu Wizard büyü bilgilerini Arcanamirium veya Magaambya gibi resmi bir eğitim kurumundan edinir. 1. seviyede, size büyülü yetenekler bahşeden mistik okulunuzu seçersiniz.
    Gittiğiniz okulda öğretilen müfredattan ek büyüler ve büyü slotları kazanırsınız. Bazı Wizard'lar, bağımsız çalışarak ve pek çok metin ile eğitmenden bilgi edinerek yeni bir okul oluşturmaya çalışan birleşik büyü teorisi okulunu takip eder. Bu yaklaşıma sahip bir Wizard resmi eğitimin odaklanmasından yoksun olsa da, daha büyük bir esnekliğe sahiptir.

omen://class/wizard/features/arcane-thesis?source=paizo-pathfinder-player-core:
  name: Mistik Tez
  description: >
    Yetkin bir Wizard olmak için yaptığınız çalışmalar sırasında, benzersiz büyülü araştırmalardan oluşan bir tez ürettiniz. Tez araştırmanızın konusuna bağlı olarak özel bir fayda kazanırsınız. Bu kitapta sunulan mistik tez konuları aşağıdadır; kendi teziniz muhtemelen "Büyü İnterpolasyonu Yöntemleri ve Büyünün Yapı Taşlarına Dair Yeni Bir Anlayışın Doğuşu Üzerine" gibi çok daha uzun ve daha teknik bir başlığa sahiptir.
    • Deneysel Büyübiçim
    • Geliştirilmiş Ruhdaş Hayvan Uyumu
    • Büyü Harmanlama
    • Büyü Değiştirme
    • Asa Odağı

omen://class/wizard/features/archwizards-spellcraft?source=paizo-pathfinder-player-core:
  name: Başsihirbazın Büyü Hüneri
  description: "En kudretli mistik büyüye hükmedersiniz ve gerçekten inanılmaz bir güce sahip bir büyü yapabilirsiniz. Tek bir 10. derece büyü slotu kazanırsınız ve Wizard büyücülüğünüzü kullanarak bu slotta bir büyü hazırlayabilirsiniz. Diğer büyü slotlarının aksine, 10. derece slotları size daha fazla büyü slotu veren veya büyü slotu harcamadan büyü yapmanızı sağlayan yeteneklerle kullanamazsınız. Seviye atladıkça daha fazla 10. derece büyü kazanmazsınız; ancak ikinci bir slot kazanmak için Başsihirbazın Kudreti hünerini alabilirsiniz."

omen://class/wizard/features/defensive-robes?source=paizo-pathfinder-player-core:
  name: Savunma Cübbeleri
  description: Etrafınızdaki büyü akışı saldırılardan kaçınma yeteneğinizi artırır. Zırhsız savunmadaki yetkinlik dereceniz uzmanlığa yükselir.

omen://class/wizard/features/expert-spellcaster?source=paizo-pathfinder-player-core:
  name: Uzman Büyücü
  description: >
    Animist: Ruhların büyüsü içinizden özgürce akar. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.
    Ozan: Büyülü teknikleriniz daha da güçlenir. Büyü saldırı değiştiricileri ve büyü ZD'leri için yetkinlik dereceleriniz uzmanlığa yükselir.
    Druid: Doğa güçlerine olan hâkimiyetiniz derinleşerek büyülerinizi güçlendirir. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.
    Magus: Kantrip anlayışınız gelişerek büyülerinize direnilmesini zorlaştırır. Büyü saldırı değiştiriciniz ve büyü ZD'niz için yetkinlik dereceleriniz uzmanlığa yükselir.
    Kâhin: İlahi gücünüzün giriftliği zamanla daha net hâle gelir. Büyü saldırı değiştiricileri ve büyü ZD'leri için yetkinlik dereceleriniz uzmanlığa yükselir.
    Psychic: Kendinize dönüp bakmak size kendiniz hakkında daha fazla bilgi ve bununla birlikte psişik güç kazandırdı. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.
    Sorcerer: Özgü büyünüz, emirlerinize kolayca ve güçlü bir şekilde yanıt verir. Soyunuzun geleneğine ait büyüler için büyü saldırı değiştiricisi ve büyü ZD'si yetkinlik dereceleriniz uzmanlığa yükselir.
    Summoner: Eidolon'unuzla olan bağınız derinleştikçe büyülerin gücü artar. Büyü saldırı değiştiricisi ve büyü ZD'si istatistikleri için yetkinlik dereceleriniz uzmanlığa yükselir.
    Witch: Haminizin size bahşettiği gücü daha iyi kontrol etmeyi öğrendiniz. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.
    Wizard: Mistiğin uzun süreli pratiği yeteneklerinizi geliştirdi. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz uzmanlığa yükselir.

omen://class/wizard/features/legendary-spellcaster?source=paizo-pathfinder-player-core:
  name: Efsanevi Büyücü
  description: >
    Animist: Öte diyarların büyülü enerjileri için neredeyse kusursuz bir kanalsınız. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.
    Ozan: Büyüye olan hâkimiyetiniz efsanelere konu olacak türdendir. Büyü saldırı değiştiricileri ve büyü ZD'leri için yetkinlik dereceleriniz efsaneviye yükselir.
    Druid: Doğanın büyüsüyle eşsiz bir uyum geliştirdiniz. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.
    Kâhin: İlahi gücü pek az kişinin boy ölçüşebileceği bir seviyede dizginleyebilirsiniz. Büyü saldırı değiştiricileri ve büyü ZD'leri için yetkinlik dereceleriniz efsaneviye yükselir.
    Psychic: Eğitiminiz zirveye ulaştığında, yalnızca kendi zihninizi değil, tüm psişik gücün kaynaklandığı kolektif bilinçdışını da anlarsınız. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.
    Sorcerer: Büyücülük konusunda muazzam bir yetenek sergilersiniz. Soyunuzun geleneğine ait büyüler için büyü saldırı değiştiricisi ve büyü ZD'si yetkinlik dereceleriniz efsaneviye yükselir.
    Witch: Haminizin sağladığı büyüye olan hâkimiyetinizi kusursuzlaştırdınız. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.
    Wizard: Hem mistik teoriyi hem de pratik büyü hünerini harmanlayan mükemmel bir büyücüsünüz. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz efsaneviye yükselir.

omen://class/wizard/features/magical-fortitude?source=paizo-pathfinder-player-core:
  name: Büyülü Beden
  description: >
    Kâhin, Sorcerer, Wizard: Büyülü güç bedeninizin dayanıklılığını artırdı. Dayanıklılık kurtarışları için yetkinlik dereceniz uzmanlığa yükselir.

    Witch: Haminizin gücü fiziksel dayanıklılığınızı pekiştirir. Dayanıklılık kurtarışları için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/wizard/features/master-spellcaster?source=paizo-pathfinder-player-core:
  name: Usta Büyücü
  description: >
    Animist: Bağlandığınız hayaletlerle olan yakınlığınız, büyünüzün tesirini daha da artırdı. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Ozan: Büyünün ipliklerini bir arpin telleri gibi çalarsınız. Büyü saldırı değiştiricileri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.

    Druid: Doğa büyüsü emirlerinize yanıt verir. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Magus: Büyülerinizi ustaca bir hünerle güçlendirirsiniz. Büyü saldırı değiştiriciniz ve büyü ZD'niz için yetkinlik dereceleriniz ustalığa yükselir.

    Kâhin: Gizeminizin içindeki derin ve karmaşık ilahi gücü gerçekten anlarsınız. Büyü saldırı değiştiricileri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.

    Psychic: Kendi zihninizin en derin köşelerine erişim kazandınız. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Sorcerer: Kanınızdaki büyü üzerinde ustalık kazandınız. Soyunuzun geleneğine ait büyüler için büyü saldırı değiştiricisi ve büyü ZD'si yetkinlik dereceleriniz ustalığa yükselir.

    Summoner: Eidolon'unuzla olan bağınız, ilişkili büyüler üzerinde ustalık kazanmanızı sağlayacak kadar güçlüdür. Büyü saldırı değiştiricileri ve büyü ZD'leri için yetkinlik dereceleriniz ustalığa yükselir.

    Witch: Haminizin büyüsü üzerinde ustalık kazandınız. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

    Wizard: Üstün bir büyücülük yeteneğine hükmedersiniz. Büyü saldırı değiştiricisi ve büyü ZD'si için yetkinlik dereceleriniz ustalığa yükselir.

omen://class/wizard/features/perception-expertise?source=paizo-pathfinder-player-core:
  name: Dikkat Uzmanlığı
  description: Çevrenizdeki tehditlere karşı tetikte kalırsınız. Dikkat için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/wizard/features/prodigious-will?source=paizo-pathfinder-player-core:
  name: Muazzam İrade
  description: Zihniniz kurcalanamayacak kadar karmaşık ve gelişmiştir. İrade kurtarışları için yetkinlik dereceniz ustalığa yükselir. Bir İrade kurtarışında başarı elde ettiğinizde, bunun yerine kritik başarı elde edersiniz.

omen://class/wizard/features/reflex-expertise?source=paizo-pathfinder-player-core:
  name: Refleks Uzmanlığı
  description: >
    Tehlikelerden sıyrılma konusunda bir ustalık geliştirdiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.
    Muhafız: En ağır zırhların içindeyken bile geniş çaplı etkilere karşı kendinizi hazırlayabilirsiniz. Refleks kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

omen://class/wizard/features/weapon-expertise?source=paizo-pathfinder-player-core:
  name: Silah Uzmanlığı
  description: >
    Şampiyon, Timsal, Müfettiş, Magus, Rün Ustası: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Druid, Kinetikçi: Savaş becerinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir.

    Muhafız: Bazen en iyi savunma iyi bir taarruzdur. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Necromancer, Kâhin: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Psychic: Eğitim, muhtemelen okült büyünüzle de pekiştirilerek silah tekniğinizi geliştirdi. Basit silahlar ve silahsız saldırılar için yetkinlik dereceniz uzmanlığa yükselir.

    Sorcerer: Savaş becerinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Kabadayı: Kendinizi silahlarınızın inceliklerini öğrenmeye adadınız. Basit silahlar, askeri silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir. Uzman yetkinliğe sahip olduğunuz tüm silahların kritik uzmanlaşma etkilerine erişim kazanırsınız.

    Thaumaturge: Silahlarınızın en etkili şekilde çalışma sırlarını öğrendiniz. Silahsız saldırılar, basit silahlar ve askeri silahlar için yetkinlik dereceleriniz uzmanlığa yükselir.

    Witch, Wizard: Katıksız deneyim sayesinde silahlarınızla olan tekniğinizi geliştirdiniz. Basit silahlar ve silahsız saldırılar için yetkinlik dereceleriniz uzmanlığa yükselir.

omen://class/wizard/features/wizard-spellcasting?source=paizo-pathfinder-player-core:
  name: Wizard Büyücülüğü
  description: >
    Kendini adamış çalışma ve pratik sayesinde, mistik büyüyü şekillendirerek akademik bir titizlikle büyüler inşa edebilirsiniz. Siz bir büyücüsünüz ve Büyü Yap etkinliğini kullanarak mistik geleneğin büyülerini yapabilirsiniz. Bir Wizard olarak büyü yaptığınızda, efsunlarınız muhtemelen tam olarak hangi güçleri çağırdığınızı ve onları nasıl şekillendireceğinizi belirler; jestleriniz büyünüzü hassas bir şekilde biçimlendirip yönlendirirken mistik rün çemberleri parıldayarak canlanır.

    1. seviyede, her sabah büyü kitabınızdaki büyülerden (aşağıya bakınız) iki adede kadar 1. derece büyü ve beş kantrip, ayrıca mistik okulunuzdan yapabileceğiniz her dereceden fazladan bir müfredat kantripi ve fazladan bir müfredat büyüsü hazırlayabilirsiniz. Hazırlanan büyüler, siz onları yapana veya büyülerinizi tekrar hazırlayana kadar kullanılabilir kalır. Hazırlayabileceğiniz büyü sayısına büyü slotlarınız denir.

    Bir Wizard olarak seviyeniz arttıkça, Günlük Wizard Büyüleri tablosunda gösterildiği gibi, her gün hazırlayabileceğiniz büyü sayısı ve yapabileceğiniz en yüksek büyü derecesi de artar.

    Bazı büyüleriniz ne kadar etkili olduklarını görmek için bir büyü saldırısı denemenizi gerektirir veya düşmanlarınızın büyü ZD'nize karşı zar atmasını sağlar (tipik olarak bir kurtarış deneyerek). Ana niteliğiniz Zekâ olduğundan, büyü saldırı değiştiriciniz ve büyü ZD'niz Zekâ değiştiricinizi kullanır. Bu istatistiklerin hesaplanmasına ilişkin ayrıntılar sayfa 403'te yer almaktadır.

    Büyüleri Güçlendirme

    2. derece ve daha yüksek büyü slotları elde ettiğinizde, bu slotları daha alt derecedeki büyülerin daha güçlü versiyonlarıyla doldurabilirsiniz. Bu işlem büyünün derecesini artırarak onu büyü slotuyla eşleşecek şekilde güçlendirir. Pek çok büyü, belirli derecelere güçlendirildiğinde özel iyileştirmelere sahiptir.

    Kantripler

    Büyülerinizin bazıları kantriplerdir. Kantrip, büyü slotu kullanmayan özel bir büyü türüdür. Günde istediğiniz sayıda, dilediğiniz an bir kantrip yapabilirsiniz. Bir kantrip her zaman otomatik olarak yukarı yuvarlanmış seviyenizin yarısına güçlendirilir; bu genellikle sahip olduğunuz en yüksek Wizard büyü slotu derecesine eşittir. Örneğin 1. seviye bir Wizard olarak kantripleriniz 1. derece büyülerdir ve 5. seviye bir Wizard olarak kantripleriniz 3. derece büyülerdir.

    Büyü Kitabı

    Her mistik büyünün, kişiselleştirilmiş büyü kitabınıza kaydettiğiniz yazılı bir versiyonu vardır. Büyülerinizi hazırlamak için her gün çalışmanız gereken ve ücretsiz olarak aldığınız, 10 sp veya daha az değerde bir büyü kitabıyla başlarsınız. Büyü kitabınızın biçimi ve adı size bağlıdır. Küflü, deri ciltli bir cilt veya pirinç bir halkaya bağlı ince metal disklerden oluşan bir derleme olabilir; adı Sessiz Gölgeler Kitabı gibi ezoterik veya Jalmeri Elementel Teorisinin İleri Düzey Piromantik Uygulamaları gibi daha akademik bir şey olabilir.

    Büyü kitabı sizin seçeceğiniz 10 mistik kantrip ve beş adet 1. derece mistik büyü içerir. Bunları mistik büyü listesindeki yaygın büyüler arasından veya erişim kazandığınız diğer mistik büyüler arasından seçersiniz. Ayrıca mistik okulunuzun müfredatından iki adet 1. derece büyü eklersiniz (o okulda açıklandığı gibi, birleşik büyü teorisi okulu durumu hariç).

    Her seviye atladığınızda büyü kitabınıza, büyü slotlarına sahip olduğunuz herhangi bir büyü derecesinden, geleneğinizin yaygın büyüleri veya erişim kazandığınız diğerleri arasından seçilen iki mistik büyü eklersiniz. Büyü Öğren etkinliğiyle de büyü kitabınıza büyüler ekleyebilirsiniz. Yeni bir dereceden büyü slotları kazandığınızda, okulunuzun müfredatından da fazladan bir büyü eklersiniz (birleşik büyü teorisi okulu olmadığı sürece).

omen://class/wizard/features/wizard-weapon-expertise?source=paizo-pathfinder-player-core:
  name: Wizard Silah Uzmanlığı
  description: Büyü ve eğitimin birleşimi sayesinde, Wizard silahlarını daha etkili bir şekilde kullanmayı öğrendiniz. Sopa, tatar yayı, hançer, ağır tatar yayı, asa ve silahsız saldırılarda uzman yetkinlik kazanırsınız.

omen://class/wizard/schools/ars-grammatica?source=paizo-pathfinder-player-core:
  name: Ars Grammatica Okulu
  description: >
    Rünler ve muhafazalar, sayılar ve harfler... Bütün büyülerin temelini oluştururlar ve temel güçleri inceleyen bir Wizard için mantıklı bir çalışma konusu hâline gelirler. Belki Pathfinder Cemiyeti'nin Büyüler Okulu'nda veya benzer bir kurumda eğitim aldınız; ancak ister başkalarını zorlamak için sözlerinize büyü katıyor olun, ister atölyenizin etrafına muhafazalar yerleştiriyor ya da bir rakibin büyülerinin yapısını temelinden sarsıyor olun, bu gösterişsiz okulun zarif bir güç taşıdığını bilirsiniz.
    Müfredat • kantripler: Mesaj, Mühür İmi • 1.: Emret, Büyü Gizle, Runik Beden, Runik Silah • 2.: Büyü Boz, Çeviri • 3.: Büyüle ve Bağla, Mahremiyet Örtüsü • 4.: Büyübozan Küre, Telkin • 5.: Haber Gönder, Hakikatdili • 6.: İtme Halesi, Büyü Gazabı • 7.: İhtiyat Büyüsü, Düzlemsel Mühür • 8.: Çıkmaz, Amansız Gözlem • 9.: Büyü Patlat
    Okul Büyüleri başlangıç: Koruyucu Muhafazalar; ileri: Gözlem Runu

omen://class/wizard/schools/battle-magic?source=paizo-pathfinder-player-core:
  name: Savaş Büyüsü Okulu
  description: >
    Büyü güçtür ve gücü savaş sanatı için kullanacak olanlar her zaman vardır. Belki de savaşın eşiğindeki bir ulusun ordusunda eğitim gördünüz: belki Cheliax ve Andoran, ya da Geb ve Nex. Hem askerleri hem de orduları yerle bir edebilecek dönen enerjileri çağırırken, yaygın taktiksel karmaşıklıklar için mistik karşı önlemleri veya savaş alanında muharipleri hayatta tutan kalkanları ve savunmaları ihmal etmediğinizden emin olursunuz.
    Müfredat • kantripler: Kalkan, Telekinetik Mermi • 1.: Ateş Püskürt, Güç Barajı, Mistik Zırh • 2.: Sis, Enerji Direnci • 3.: Toprağa Bağla, Ateş Topu • 4.: Ateş Duvarı, Silah Fırtınası • 5.: Uğultulu Tipi, Saplanan Diken • 6.: Zincirleme Şimşek, Kül Et • 7.: Enerji Kalkanı, Gerçek Hedef • 8.: Kutup Yarığı, Kurut • 9.: Kayan Yıldızlar
    Okul Büyüleri başlangıç: Güç Oku; ileri: Enerji Soğurma

omen://class/wizard/schools/boundary?source=paizo-pathfinder-player-core:
  name: Sınır Okulu
  description: >
    Büyünüzü fiziksel dünya kadar sıradan bir şeyi etkilemek için neden kullanasınız ki? İster Katapesh'teki Boyutsal Çalışmalar Koleji'nde ister tekinsiz Ustalav'daki bir yer altı okulunda eğitim görmüş olun, büyünüzü Evren'in ötesindeki güçlere yönelttiniz; ruhları ve gölgeleri çağırdınız, boyutları ve düzlemleri manipüle ettiniz ve fanilere göre olmayan yerlerde adım attınız.
    Müfredat • kantripler: Telekinetik El, Boşluk Bükümü • 1.: Uğursuz Dokunaçlar, Hayali Hizmetkâr, Hortlak Çağır • 2.: Karanlık, Görünmeyeni Gör • 3.: Hortlak Bağla, Hayalet Silah • 4.: Pırpır, Yer Değiştir • 5.: Sürgün, Ruhları Çağır • 6.: Işınlan, Vampirik Kan Emme • 7.: Tutulma Patlaması, Düzlemlerarası Işınlanma • 8.: Çıkmaz, Amansız Gözlem • 9.: Katliam
    Okul Büyüleri başlangıç: Çağrıyı Güçlendir; ileri: Dehşet Sarmalı

omen://class/wizard/schools/civic-wizardry?source=paizo-pathfinder-player-core:
  name: Kentsel Büyücülük Okulu
  description: >
    İster Manaket'in Occularium'unda ister Uygulamalı Büyü Akademisi'nde eğitim almış olun, mistik çalışmaların meyvelerinin (tıpkı diğer tüm alanlar gibi) nihayetinde sıradan vatandaşa yardım etmesi gerektiğini öğrendiniz. İnşaatın, kayıp insanları ve eşyaları bulmanın, binalar ve hendekler arasında hızla hareket etmenin mütevazı sanatını öğrendiniz; yine de bu aynı sanatlar yıkıma dönüştürülebilir ve köprüler inşa etmek için canlandırdığınız yapay varlıklar onları aynı kolaylıkla yerle bir edebilir.
    Müfredat • kantripler: Hokkabazlık, Aura Oku • 1.: Hidrolik İtiş, Dövücü Moloz, Yapay Varlık Çağır • 2.: Açığa Çıkaran Işık, Su Üstünde Yürü • 3.: Sıcak Kulübe, Güvenli Geçiş • 4.: Yaratım, Serbest Hareket • 5.: Suyu Kontrol Et, Taş Duvar • 6.: Kül Et, Güç Duvarı • 7.: Düzlemsel Saray, Geçmişi Görme • 8.: Deprem, Nokta Tespiti • 9.: Öngörü
    Okul Büyüleri başlangıç: Toprak Siperler; ileri: Topluluk Yenilenmesi

omen://class/wizard/schools/mentalism?source=paizo-pathfinder-player-core:
  name: Mentalizm Okulu
  description: >
    Bir âlim olarak sağlam bir zihnin önemini çok iyi bilirsiniz. Bu nedenle, Uzakgören Kulesi veya Kâhinlerin Taşı gibi, daha zayıf zihinleri hayaller ve yanılsamalarla ya da aşılanmış hisler ve hatıralarla sersemletme sanatlarını öğreten bir okula gittiniz.
    Müfredat • kantripler: Sersemlet, Hayal Kırıntısı • 1.: Baş Döndürücü Renkler, Uyku, Kesin Saldırı • 2.: Yanılsama Yaratık, Zihnini Bulandır • 3.: Düş Mesajı, Zihin Okuma • 4.: Kâbus, Ölüm Görüsü • 5.: Halüsinasyon, Yanılsama Sahne • 6.: Zihni Sıfırla, Hayali Felaket • 7.: Suret Yansıt, Zihin Bükümü • 8.: Kayboluş, Zapt Edilemez Dans • 9.: Fantazmagorya
    Okul Büyüleri başlangıç: Cazibeli İtiş; ileri: Görünmezlik Pelerini

omen://class/wizard/schools/protean-form?source=paizo-pathfinder-player-core:
  name: Değişken Form Okulu
  description: >
    İşe yabancı olanlar Wizard'ları genellikle bedenden ziyade çalışmalarına odaklanmış zihinsel varlıklar olarak düşünür; oysa sizin büyü okulunuz ikisi arasındaki ilişkiyi öğretmiştir. İster Kintargo'nun Kaymaktaşı Akademisi gibi köklü bir kurumda ister Nex'in Beden Demirhaneleri gibi daha meşum bir yerde öğrenilmiş olsun, büyünüz canlı maddenin bir süreliğine başka bir şekle ikna edilme yollarına odaklanır; bir tohumu bir sarmaşığa, bir insanı bir canavara veya zararsız bir mikrobu ölümcül bir toksine dönüştürmenize olanak tanır.
    Müfredat • kantripler: Oyan Pençe, Sarmaşık Kırbacı • 1.: Zıpla, Haşere Formu, Örümcek İğnesi • 2.: Büyüt, İnsansı Form • 3.: Ayaktan Yüzgece, Vampirik Ziyafet • 4.: Dağ Dayanıklılığı, Buhar Formu • 5.: Elementel Form, Zehirli Bulut • 6.: Lanetli Başkalaşım, Taşlaştır • 7.: Düşmanı Kopyala, Alevli Beden • 8.: Kurut, Canavarlık Formu • 9.: Başkalaşım
    Okul Büyüleri başlangıç: Bedeni Altüst Et; ileri: Biçim Değiştiren Form

omen://class/wizard/schools/unified-magical-theory?source=paizo-pathfinder-player-core:
  name: Birleşik Büyü Teorisi Okulu
  description: >
    Büyünün herhangi bir tek okulun veya akademinin öğretileriyle düzgün bir şekilde ifade edilebileceği fikrinden kaçınır, bunun yerine bireysel çalışmanızı her büyü okulunun en iyi yönlerini almaya yönlendirirsiniz. Bunu yaparak her okulun kesişim noktasında yatan gerçekleri bulacak ve mistik büyünün ideal doğasına daha da yaklaşacaksınız. Bir gün tüm büyüyü ayrıntılarıyla anlatan o tek zarif teoriyi (belki de sizin adınızı taşıyan bir teoriyi?) ortaya çıkaracaksınız; ancak o zamana kadar çalışmalarınız devam ediyor.
    Müfredat Yok Belirli bir müfredatınız yoktur, bu nedenle müfredat büyüleri de olmaz ve bunları özellikle etkileyen yeteneklerden faydalanamazsınız. Bunun yerine fazladan bir 1. seviye Wizard sınıf hüneri kazanırsınız ve çeşitli çalışmalarınızı temsil etmek üzere büyü kitabınıza kendi seçtiğiniz bir adet 1. derece büyü eklersiniz.
    Büyünün bizzat kendi doğasına yönelik çalışmalarınız onu daha verimli kullanmanızı sağlamıştır: Bağlı Eşyayı Boşalt eylemini günde yalnızca bir kez kullanmak yerine, yapabileceğiniz her büyü derecesi için günde bir kez kullanabilir, her seferinde o dereceden bir büyüyü geri çağırabilirsiniz.
    Okul Büyüleri başlangıç: Çırağın Eli; ileri: Disiplinlerarası Efsun

omen://class/wizard/theses/experimental-spellshaping?source=paizo-pathfinder-player-core:
  name: Deneysel Büyübiçim
  description: >
    Teziniz, büyübiçimin büyülü uygulamasının, büyü yaparken değişkenleri ve parametreleri değiştirerek (tıpkı kendi büyülerini kendileri bulmak zorunda kalan çok eski zamanların Wizard'larını taklit ederek) daha verimli bir şekilde gerçekleştirilebileceğini öne sürer. Bu, çeşitli büyübiçim etkilerine verimli bir şekilde erişmenizi sağlar.
    Kendi seçtiğiniz bir adet 1. seviye büyübiçim Wizard hüneri kazanırsınız. 4. seviyeden itibaren günlük hazırlıklarınız sırasında, seviye gereksinimi seviyenizin yarısından fazla olmayan ve bir sonraki günlük hazırlıklarınıza kadar kullanabileceğiniz, kendi seçtiğiniz bir büyübiçim Wizard hüneri kazanabilirsiniz.

omen://class/wizard/theses/improved-familiar-attunement?source=paizo-pathfinder-player-core:
  name: Geliştirilmiş Ruhdaş Hayvan Uyumu
  description: >
    Bir Wizard ile tanıdığını birbirine bağlayan büyüye ince ayar yapmanın, çoğu Wizard'ın şu anda kullandığı güvenli ancak sıradan bağa kıyasla mistik bağı geliştirebileceğini ve daha büyük sonuçlar verebileceğini uzun zamandır savunuyorsunuz. Ruhdaş Hayvanınızla böyle bir bağ kurarak çoğu Wizard'dan daha fazla avantaj elde ettiniz. Ruhdaş Hayvan Wizard hünerini kazanırsınız. Ruhdaş Hayvanınız ekstra bir yetenek kazanır ve 6., 12. ve 18. seviyelere ulaştığınızda ek bir ekstra yetenek daha kazanır.
    Tanıdığınızla olan bağlantınız mistik bağ sınıf özelliğinizi değiştirir; böylece büyü enerjinizi sahip olduğunuz bir eşya yerine tanıdığınızda depolarsınız; ayrıca Bağlı Eşyayı Boşalt yerine Tanıdığı Boşalt serbest eylemini kazanırsınız. Tanıdığı Boşalt, bir yeteneğin Bağlı Eşyayı Boşalt eylemini kullanmanıza izin verdiği her an kullanılabilir ve bir eşya yerine tanıdığınızdan büyü çekmeniz dışında tamamen aynı şekilde işler.

omen://class/wizard/theses/spell-blending?source=paizo-pathfinder-player-core:
  name: Büyü Harmanlama
  description: >
    Büyü slotlarının, tüm büyücülüğe güç veren alttaki enerjinin bir kısaltması olduğunu teorileştirdiniz ve büyü slotlarının hiyerarşisiyle oynayarak daha güçlü büyüleri beslemek için onları birleştirmenin bir yolunu buldunuz.
    Günlük hazırlıklarınız sırasında, aynı büyü derecesindeki iki büyü slotunu, takas edilen büyü slotlarından 2 büyü derecesine kadar daha yüksek bir bonus büyü slotu ile takas edebilirsiniz. Sahip olduğunuz uygun büyü slotlarından dilediğiniz kadarını takas edebilirsiniz. Bonus büyü slotları normalde yapabileceğiniz bir büyü derecesinde olmalı ve her bir bonus büyü slotu farklı bir büyü derecesinde bulunmalıdır. Ayrıca herhangi bir büyü slotunu iki ek kantrip ile takas edebilirsiniz; ancak bu şekilde ek kantripler için aynı anda birden fazla büyü slotu takas edemezsiniz.

omen://class/wizard/theses/spell-substitution?source=paizo-pathfinder-player-core:
  name: Büyü Değiştirme
  description: >
    Büyülerin bir kez hazırlandıktan sonra bir sonraki günlük hazırlıklarınıza kadar değiştirilemeyeceği gerçeğini kabul etmiyorsunuz ve başlangıçta hazırladığınız büyülerin yerine yeni büyüler koymanıza izin veren bir kısayol keşfettiniz.
    Hazırladığınız büyü slotlarından birini boşaltmak ve yerine büyü kitabınızdan farklı bir büyü hazırlamak için 10 dakika harcayabilirsiniz. Böyle bir takas sırasında kesintiye uğrarsanız, orijinal büyü hazır kalmaya devam eder ve hâlâ yapılabilir. Büyüyü değiştirmeyi daha sonra tekrar deneyebilirsiniz; ancak süreci baştan başlatmanız gerekir.

omen://class/wizard/theses/staff-nexus?source=paizo-pathfinder-player-core:
  name: Asa Odağı
  description: >
    Teziniz, çalışmaların ilk günlerinden itibaren asaların erken ve yoğun bir şekilde benimsenmesinin büyücü ile asa arasında simbiyotik bir bağ kurabileceğini ve birlikte olağanüstü büyüler yaratmalarını sağlayabileceğini savunur. Kendi yaptığınız derme çatma bir asayla böyle bir bağ kurdunuz ve karşılaştığınız herhangi bir asayı daha büyük bir güçle doldurmaya hazırsınız.
    Oyuna kendi icadınız olan derme çatma bir asayla başlarsınız. Büyülü özelliğine sahiptir ve her ikisi de büyü kitabınızdan olmak üzere bir kantrip ve bir adet 1. derece büyü içerir. Günlük hazırlıklarınız sırasında asaya o büyünün derecesine eşit sayıda ve 24 saat sonra kaybolan yükler vermek için bir büyü harcayabilirsiniz. Asayı tutarken içerdiği Büyüleri Yapabilirsiniz. 1. derece büyü 1 yük tüketir ancak kantrip yük gerektirmez. Asanız yok edilirse 1 saat içinde yeni bir tane oluşturabilirsiniz; ancak yükü olmaz.
    Günlük hazırlıklarınız sırasında derme çatma asanızı mülkiyetinizdeki başka bir asayla birleştirebilir ve seçilen iki büyüyü ona ekleyebilirsiniz. Bu asa, hazırlanmasından ve büyü harcanmasından yük kazanır.
    8. seviyede, herhangi bir asayı hazırlarken bir yerine iki büyü harcayabilir ve harcanan büyülerin toplam derecesine eşit ek yükler ekleyebilirsiniz. 16. seviyede, asaya yük eklemek için toplamda üçe kadar büyü harcayabilir ve her üç büyünün toplam derecesine eşit ek yükler ekleyebilirsiniz.

omen://class/wizard/wizard?source=paizo-pathfinder-player-core:
  name: Wizard
  description: >
    Evrenin sırlarının ebedi bir öğrencisisiniz; güçlü büyüler yapmak için büyüdeki ustalığınızı kullanırsınız. Büyüye bir bilim gibi yaklaşır, mistik büyüyü keşfetmek ve anlamak için pratik büyü hünerine dair en son metinleri kadim ciltlerle karşılaştırırsınız. Yine de büyü teorisi uçsuzdur ve hepsini incelemenizin bir yolu yoktur. Çoğu Wizard resmi eğitim yoluyla öğrenir ve müfredatları belirli bir yöntemi belirler; ancak özellikle azimli araştırmacılar bazen kendi teorilerini bir araya getirir.
