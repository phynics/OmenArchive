  description: Büyü saldırı modifiyeri ve büyü ZD'si istatistikleri için yetkinlik dereceleriniz efsaneviye yükselir.

omen://class/cleric/doctrine-features/final-doctrine-warpriest?source=paizo-pathfinder-player-core:
  name: Nihai Öğreti (Savaş Rahibi)
  description: İlahınızın lütufkar silahında, büyü saldırı modifiyerinde ve büyü ZD'sinde usta yetkinlik kazanırsınız.

omen://class/cleric/doctrine-features/first-doctrine-cloistered-cleric?source=paizo-pathfinder-player-core:
  name: Birinci Öğreti (Manastır Rahibi)
  description: Alan Çömezi rahip hünerini kazanırsınız.

omen://class/cleric/doctrine-features/first-doctrine-warpriest?source=paizo-pathfinder-player-core:
  name: Birinci Öğreti (Savaş Rahibi)
  description: Hafif ve orta zırhta eğitimlisinizdir ve Dayanıklılık kurtarışlarında uzman yetkinliğe sahip olursunuz. Bir kalkanla hasarı azaltmaya yarayan bir reaksiyon olan Kalkanla Engelleme genel hünerini kazanırsınız. İlahınızın lütufkar silahı basit bir silah veya silahsız bir saldırı ise Ölümcül Sadelik rahip hünerini kazanırsınız. 13. seviyede, İlahi Savunma sınıf özelliğini kazandığınızda hafif ve orta zırhta da uzman yetkinlik kazanırsınız.

omen://class/cleric/doctrine-features/fourth-doctrine-cloistered-cleric?source=paizo-pathfinder-player-core:
  name: Dördüncü Öğreti (Manastır Rahibi)
  description: "İlahınızın lütufkar silahında, basit silahlarda ve silahsız saldırılarda uzman yetkinlik kazanırsınız. İlahınızın lütufkar silahını kullanarak yapılan bir saldırı zarında kritik başarı elde ettiğinizde, silahın kritik uzmanlaşma etkisini uygularsınız; sınıf ZD'niz yerine büyü ZD'nizi kullanabilirsiniz."

omen://class/cleric/doctrine-features/fourth-doctrine-warpriest?source=paizo-pathfinder-player-core:
  name: Dördüncü Öğreti (Savaş Rahibi)
  description: Büyü saldırı modifiyeri ve büyü ZD'si istatistikleri için yetkinlik dereceleriniz uzmanlığa yükselir.

omen://class/cleric/doctrine-features/second-doctrine-cloistered-cleric?source=paizo-pathfinder-player-core:
  name: İkinci Öğreti (Manastır Rahibi)
  description: Dayanıklılık kurtarışlar için yetkinlik dereceniz uzmanlığa yükselir.

