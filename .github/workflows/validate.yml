name: Validate Archive

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    # Apple platforms only; Swift 6.4 / Xcode 27 is the toolchain floor. The tooling comes from the
    # main branch of the private monorepo, which holds OmenArchiveKit and OmenCore.
    runs-on: macos-26

    steps:
      - name: Select Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode"
          swift --version
      - name: Check out OmenArchive
        uses: actions/checkout@v4
        with:
          path: OmenArchive
      - name: Check out the tooling
        uses: actions/checkout@v4
        with:
          repository: phynics/omen-monorepo
          ref: main
          path: monorepo
          token: ${{ secrets.OMEN_CI_READ_TOKEN }}
      - name: Check out the pinned pf2e corpus revision
        uses: actions/checkout@v4
        with:
          repository: foundryvtt/pf2e
          ref: 4cbdaa37d6c33e9519561bae2c59a23e0288cbce
          path: pf2e
      - name: Run OmenArchiveKit tests against this archive
        working-directory: monorepo/OmenArchiveKit
        env:
          OMEN_ARCHIVE_ROOT: ${{ github.workspace }}/OmenArchive
        run: swift test
      - name: Validate the complete archive with the omen-archive CLI
        working-directory: monorepo/OmenArchiveKit
        run: swift run omen-archive validate "${{ github.workspace }}/OmenArchive"
