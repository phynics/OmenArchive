name: Validate Archive

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out OmenArchive
        uses: actions/checkout@v4
        with:
          path: OmenArchive
      - name: Check out OmenArchiveKit
        uses: actions/checkout@v4
        with:
          repository: phynics/OmenArchiveKit
          ref: main
          path: OmenArchiveKit
      - name: Check out OmenCore
        uses: actions/checkout@v4
        with:
          repository: phynics/OmenCore
          ref: main
          path: OmenCore
          token: ${{ secrets.OMEN_CI_READ_TOKEN || github.token }}
      - name: Check out ADUtilities
        uses: actions/checkout@v4
        with:
          repository: phynics/ADUtilities
          ref: main
          path: ADUtilities
      - name: Check out the pinned pf2e corpus revision
        uses: actions/checkout@v4
        with:
          repository: foundryvtt/pf2e
          ref: 4cbdaa37d6c33e9519561bae2c59a23e0288cbce
          path: pf2e
      - name: Install Swift 6
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Run OmenArchiveKit tests against this archive
        working-directory: OmenArchiveKit
        env:
          OMEN_ARCHIVE_ROOT: ${{ github.workspace }}/OmenArchive
        run: swift test
      - name: Validate the complete archive with the omen-archive CLI
        working-directory: OmenArchiveKit
        run: swift run omen-archive validate "${{ github.workspace }}/OmenArchive"
      - name: Run Ruby data tests
        working-directory: OmenArchive
        run: |
          ruby test/player_core_corpus_test.rb
          ruby test/player_core_spell_import_test.rb
