name: Validate Archive

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    # Apple platforms only; Swift 6.4 / Xcode 27 is the toolchain floor (ADR 0004 in the
    # workspace repo). The tooling is checked out at the commits in
    # .github/workspace.lock.json, which tools/workspace-lock.sh writes (ticket 0084).
    runs-on: macos-26

    steps:
      - name: Select Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner. Installed:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode"
          swift --version
      - name: Check out OmenArchive
        uses: actions/checkout@v4
        with:
          path: OmenArchive
      - name: Read the workspace lock
        id: lock
        run: |
          lock=OmenArchive/.github/workspace.lock.json
          for name in OmenArchiveKit OmenCore ADUtilities; do
            rev=$(sed -n "s/.*\"$name\".*\"rev\": \"\([0-9a-f]*\)\".*/\1/p" "$lock")
            test -n "$rev" || { echo "::error::$name is missing from $lock"; exit 1; }
            echo "$name=$rev" >> "$GITHUB_OUTPUT"
          done
      - name: Check out OmenArchiveKit
        uses: actions/checkout@v4
        with:
          repository: phynics/OmenArchiveKit
          ref: ${{ steps.lock.outputs.OmenArchiveKit }}
          path: OmenArchiveKit
      - name: Check out OmenCore
        uses: actions/checkout@v4
        with:
          repository: phynics/OmenCore
          ref: ${{ steps.lock.outputs.OmenCore }}
          path: OmenCore
          token: ${{ secrets.OMEN_CI_READ_TOKEN || github.token }}
      - name: Check out ADUtilities
        uses: actions/checkout@v4
        with:
          repository: phynics/ADUtilities
          ref: ${{ steps.lock.outputs.ADUtilities }}
          path: ADUtilities
      - name: Check out the pinned pf2e corpus revision
        uses: actions/checkout@v4
        with:
          repository: foundryvtt/pf2e
          ref: 4cbdaa37d6c33e9519561bae2c59a23e0288cbce
          path: pf2e
      - name: Run OmenArchiveKit tests against this archive
        working-directory: OmenArchiveKit
        env:
          OMEN_ARCHIVE_ROOT: ${{ github.workspace }}/OmenArchive
        run: swift test
      - name: Validate the complete archive with the omen-archive CLI
        working-directory: OmenArchiveKit
        run: swift run omen-archive validate "${{ github.workspace }}/OmenArchive"
