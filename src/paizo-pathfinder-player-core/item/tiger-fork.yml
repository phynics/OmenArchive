description: 'The tiger fork is a +1 trident with the disarm and grapple traits. It
  has wide, flaring prongs that can be used to fend off deadly beasts and entrap opponents
  during combat. While you have another creature Grabbed with the tiger fork, you
  gain a +1 circumstance bonus to saves against forced movement effects.

  Activate—Fork Grip 1 (manipulate)

  Effect You can activate the tiger fork to attempt to Grapple the creature. This
  attempt uses the same multiple attack penalty as the required Strike.'
