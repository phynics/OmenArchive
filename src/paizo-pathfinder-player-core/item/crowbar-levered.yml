---
description: 'When Forcing Open an object that doesn''t have an easy grip, a crowbar
  makes it easier to gain the necessary leverage. Without a crowbar, prying something
  open takes a -2 item penalty to the Athletics check to Force Open.

  A levered crowbar grants you a +1 item bonus to Athletics checks to Force Open anything
  that can be pried open.'
