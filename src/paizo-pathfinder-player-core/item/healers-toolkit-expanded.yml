description: This kit of bandages, herbs, and suturing tools is necessary for Medicine
  checks to Administer First Aid, Treat Disease, Treat Poison, or Treat Wounds. Expanded
  healer's toolkits provide a +1 item bonus to such checks. If you wear your healer's
  toolkit, you can draw and replace its tools as part of the action that uses them.
