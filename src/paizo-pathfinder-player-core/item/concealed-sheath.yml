  and is typically used for daggers, wands, thieves'' tools, and similar objects.

  You can affix it to the inside of a boot, under a bracer or sleeve, or in other
  inconspicuous locations to gain a +1 item bonus to Stealth checks and DCs to hide
  or conceal the item within.'
