---
name: high jump
traits:
- move
count: two_actions
description: You Stride, then attempt a DC 30 [Athletics](omen://action/high-jump?source=paizo-pathfinder-player-core)
  check to jump vertically. If you didn't Stride at least 10 feet, you automatically
  fail. This DC might be increased or decreased due to the situation, as determined
  by the GM.
criticalSuccess: You [Leap](omen://action/leap?source=paizo-pathfinder-player-core)
  up to 8 feet vertically and 10 feet horizontally.
success: You Leap up to 5 feet vertically and 5 feet horizontally.
failure: You Leap normally.
criticalFailure: You fall [Prone](omen://condition/prone?source=paizo-pathfinder-player-core)
  in your space.
