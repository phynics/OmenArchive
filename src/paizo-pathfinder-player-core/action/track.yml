criticalFailure: You lose the trail and can't try again for 24 hours.
description: "You follow tracks, moving at up to half your travel Speed, using the
  Travel Speed rules. After a successful check to Track, you can continue following
  the tracks at half your Speed without attempting additional checks for up to 1 hour.\nIn
  some cases, you might Track in an encounter. In this case, Track is a single action
  and doesn't have the exploration trait, but you might need to roll more often because
  you're in a tense situation. The GM determines how often you must attempt this check.\nYou
  attempt your Survival check when you start Tracking, once every hour you continue
  tracking, and any time something significant changes in the trail. The GM determines
  the DCs for such checks, depending on the freshness of the trail, the weather, and
  the type of ground.\nSample Track Tasks\n\t•\tUntrained the path of a large army
  following a road\n\t•\tTrained relatively fresh tracks of a rampaging bear through
  the plains\n\t•\tExpert a nimble panther's tracks through a jungle, tracks obscured
  by rainfall\n\t•\tMaster tracks obscured by winter snow, tracks of a mouse or smaller
  creature, tracks left on surfaces that can't hold prints like bare rock\n\t•\tLegendary
  old tracks through a windy desert's sands, tracks obscured by a major blizzard or
  hurricane"
failure: You lose the trail but can try again after a 1-hour delay.
name: track
source:
