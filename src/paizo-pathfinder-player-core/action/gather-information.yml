---
name: gather information
traits:
- exploration
- secret
description: "You canvass local markets, taverns, and gathering places in an attempt
  to learn about a specific individual or topic. The GM determines the DC of the Diplomacy
  check and the amount of time it takes (typically 2 hours, but sometimes more), along
  with any benefit you might be able to gain by spending coin on bribes, drinks, or
  gifts.\nSample Gather Information Tasks\n\t•\tUntrained talk of the town\n\t•\tTrained
  common rumor\n\t•\tExpert obscure rumor, poorly guarded secret\n\t•\tMaster well-guarded
  or esoteric information\n\t•\tLegendary information known only to an incredibly
  select few, or only to extraordinary beings"
success: You collect information about the individual or topic. The GM determines
  the specifics.
criticalFailure: You collect incorrect information about the individual or topic.
