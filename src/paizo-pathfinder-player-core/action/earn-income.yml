name: earn income
traits:
- downtime
description: "You can use a skill to earn money during downtime. You must be trained
  in the skill to do so. This takes time to set up, and your income depends on your
  proficiency rank and how lucrative a task you can find. Because this process requires
  a significant amount of time and involves tracking things outside the progress of
  adventures, it won't come up in every campaign. The most typical ways to earn income,
  detailed further in this section are:\n\t•\tCrafting goods for the market (Crafting)\n\t•\tPracticing
  a Trade (Lore)\n\t•\tStaging a Performance (Performance)\nIn some cases, the GM
  might let you use a different skill to Earn Income through specialized work. Usually,
  this is scholarly work, such as using Religion in a monastery to study old texts—but
  giving sermons at a church would still fall under Performance instead of Religion.
  You also might be able to use physical skills to make money, such as using Acrobatics
  to perform feats in a circus or Thievery to pick pockets. If you're using a skill
  other than Crafting, Lore, or Performance, the DC tends to be significantly higher.\nEarn
  Income\nDowntime\nYou use one of your skills to make money during downtime. The
  GM assigns a task level representing the most lucrative job available. You can search
  for lower-level tasks, with the GM determining whether you find any. Sometimes you
  can attempt to find better work than the initial offerings, though this takes time
  and requires using the Diplomacy skill to Gather Information, doing some research,
  or socializing.\nWhen you take on a job, the GM secretly sets the DC of your skill
  check. After your first day of work, you roll to determine your earnings. You gain
  an amount of income based on your result, the task's level, and your proficiency
  rank (as listed on the Income Earned table).\nYou can continue working at the task
  on subsequent days without needing to roll again. For each day you spend after the
  first, you earn the same amount as the first day, up until the task's completion.
  The GM determines how long you can work at the task. Most tasks last a week or two,
  though some can take months or even years.\nTable 4-2: Income Earned\nTask Level\nFailure\nTrained\nExpert\nMaster\nLegendary\n0\n1
