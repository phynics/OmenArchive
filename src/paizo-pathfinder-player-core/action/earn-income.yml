  Earn Income Tasks\nThese examples use Alcohol Lore to work in a bar or Legal Lore
  to perform legal work.\n\t•\tTrained bartend, do legal research\n\t•\tExpert curate
  drink selection, present minor court cases\n\t•\tMaster run a large brewery, present
  important court cases\n\t•\tLegendary run an international brewing franchise, present
  a case in Hell's courts\nCrafting Goods for the Market [Crafting]\nUsing Crafting,
  you can work at producing common items for the market. It's usually easy to find
  work making basic items whose level is 1 or 2 below your settlement's level.\nHigher-level
  tasks represent special commissions, which might require you to Craft a specific
  item using the Craft downtime activity and sell it to a buyer at full Price. These
  opportunities don't occur as often and might have special requirements—or serious
  consequences if you disappoint a prominent client.\nPracticing a Trade [Lore]\nYou
  apply the practical benefits of one of your Lore specialties during downtime by
  practicing your trade. This is most effective for Lore specialties such as business,
  law, or sailing, where there's high demand for workers. The GM might increase the
  DC or determine only low-level tasks are available if you're attempting to use an
  obscure Lore skill to earn income. You might also need specialized tools to accept
  a job, like mining tools to work in a mine or a merchant's scale to buy and sell
  valuables in a market.\nStaging a Performance [Performance]\nYou perform for an
  audience to make money. The available audiences determine the level of your task,
  since more discerning audiences are harder to impress but provide a bigger payout.
  The GM determines the task level based on the audiences available. Performing for
  a typical audience of commoners on the street is a level 0 task, but a performance
  for a group of artisans with more refined tastes might be a 2nd- or 3rd-level task,
  and ones for merchants, nobility, and royalty are increasingly higher level.\nYour
  degree of success determines whether you moved your audience and whether you were
  rewarded with applause or rotten fruit.\nEnding or Interrupting Tasks\nWhen a task
  you're doing is complete, or if you stop in the middle of one, you normally have
  to find a new task if you want to keep Earning Income. For instance, if you quit
  your job working at the docks, you'll need to find another place of employment instead
  of picking up where you left off. This usually takes 1 day or more of downtime looking
  for leads on new jobs.\nHowever, you might pause a task due to an adventure or event
  that wouldn't prevent you from returning to the old job later. The GM might decide
  that you can pick up where you left off, assuming the task hasn't been completed
  by others in your absence. Whether you roll a new skill check when you resume is
  also up to the GM. Generally speaking, if you had a good initial roll and want to
  keep it, you can, but if you had a bad initial roll, you can't try for a better
  one by pausing to do something else. If your statistics changed during the break—usually
  because you leveled up while adventuring—you can attempt a new check."
criticalSuccess: You do outstanding work. Gain the amount of currency listed for the
  task level + 1 and your proficiency rank.
success: You do competent work. Gain the amount of currency listed for the task level
  and your proficiency rank.
failure: You do shoddy work and get paid the bare minimum for your time. Gain the
  amount of currency listed in the failure column for the task level. The GM will
  likely reduce how long you can continue at the task.
criticalFailure: You earn nothing for your work and are fired immediately. You can't
  continue at the task. Your reputation suffers, potentially making it difficult for
  you to find rewarding jobs in that community in the future.
