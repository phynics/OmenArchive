---
name: sneak
traits:
- move
- secret
count: one_action
description: 'You attempt to move to another place while becoming or staying undetected.
  Stride up to half your Speed. \(You can use Sneak while Burrowing, Climbing, Flying,
  or Swimming instead of Striding if you have the corresponding movement type; you
  must move at half that Speed.\)

  At the end of your movement, the GM rolls your [Sneak](omen://action/sneak?source=paizo-pathfinder-player-core)
  check in secret and compares the result to the Perception DC of each creature you
  were [Hidden](omen://condition/hidden?source=paizo-pathfinder-player-core) from
  or [Undetected](omen://condition/undetected?source=paizo-pathfinder-player-core)
  by at the start of your movement. If you have cover or greater cover from the creature
  throughout your Stride, you gain the +2 circumstance bonus from cover \(or +4 from
  greater cover\) to your Stealth check. Because you''re moving, the bonus increase
  from Taking Cover doesn''t apply. You don''t get to roll against a creature if,
  at the end of your movement, you neither are [Concealed](omen://condition/concealed?source=paizo-pathfinder-player-core)
  from it nor have cover or greater cover against it. You automatically become observed
  by such a creature.

  You become observed as soon as you do anything other than Hide, Sneak, or Step.
  If you attempt to Strike a creature, the creature remains [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core)
  against that attack, and you then become observed. If you do anything else, you
  become observed just before you act unless the GM determines otherwise. The GM might
  allow you to perform a particularly unobtrusive action without being noticed, possibly
  requiring another Stealth check. If you speak or make a deliberate loud noise, you
  become hidden instead of undetected.

  If a creature uses [Seek](omen://action/seek?source=paizo-pathfinder-player-core)
  and you become hidden to it as a result, you must Sneak if you want to become undetected
  by that creature again.'
success: You're undetected by the creature during your movement and remain undetected
  by the creature at the end of it.
failure: A telltale sound or other sign gives your position away, though you still
  remain unseen. You're hidden from the creature throughout your movement and remain
  so.
criticalFailure: You're spotted\! You're observed by the creature throughout your
  movement and remain so. If you're [Invisible](omen://condition/invisible?source=paizo-pathfinder-player-core)
  and were hidden from the creature, instead of being observed you're hidden throughout
  your movement and remain so.
