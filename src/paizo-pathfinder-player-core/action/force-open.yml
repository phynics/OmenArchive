---
name: force open
traits:
- attack
count: one_action
description: "Using your body, a lever, or some other tool, you attempt to forcefully
  open a door, window, container or heavy gate. With a high enough result, you can
  even smash through walls. Without a crowbar, prying something open takes a –2 item
  penalty to the Athletics check to Force Open.\nSample Force Open Tasks\n\t•\tUntrained
  fabric, flimsy glass\n\t•\tTrained ice, sturdy glass\n\t•\tExpert flimsy wooden
  door, wooden portcullis\n\t•\tMaster sturdy wooden door, iron portcullis, metal
  bar\n\t•\tLegendary stone or iron door"
criticalSuccess: You open the door, window, container, or gate and can avoid damaging
  it in the process.
success: You break the door, window, container, or gate open, and it gains the broken
  condition. If it's especially sturdy, the GM might have it take damage but not be
  broken.
criticalFailure: Your attempt jams the door, window, container, or gate shut, imposing
  a –2 circumstance penalty on future attempts to Force it Open.
