---
name: foresight
traits: []
count: reaction
trigger: The target of [Foresight](omen://spell/foresight?source=paizo-pathfinder-player-core)
  defends against a hostile creature or other danger.
description: Effect If the hostile creature or danger forces the target to roll dice
  \(a saving throw, for example\), the target rolls twice and uses the higher result,
  and this spell gains the fortune trait. But if the hostile creature or danger is
  rolling against the target \(an attack roll or skill check, for example\), that
  hostile creature or danger rolls twice and uses the lower result, and this spell
  gains the misfortune trait.
mechanicsScope: encounter
