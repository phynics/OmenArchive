count: one_action
description: 'You huddle behind cover or greater cover or deeper into concealment
  to become [Hidden](omen://condition/hidden?source=paizo-pathfinder-player-core),
  rather than [Observed](omen://condition/observed?source=paizo-pathfinder-player-core).
  The GM rolls your [Stealth](omen://action/hide?source=paizo-pathfinder-player-core)
  check in secret and compares the result to the Perception DC of each creature you''re
  observed by but that you have cover or greater cover against or are [Concealed](omen://condition/concealed?source=paizo-pathfinder-player-core)
  from. You get a +2 circumstance bonus to your check if you have standard cover \(or
  +4 from greater cover\).

  If you successfully become hidden to a creature but then cease to have cover or
  greater cover against it or be concealed from it, you become observed again. You
  cease being hidden if you do anything except Hide, [Sneak](omen://action/sneak?source=paizo-pathfinder-player-core),
  or [Step](omen://action/step?source=paizo-pathfinder-player-core). If you attempt
  to Strike a creature, the creature remains off-guard against that attack, and you
  then become observed. If you do anything else, you become observed just before you
  act unless the GM determines otherwise. The GM might allow you to perform a particularly
  unobtrusive action without being noticed, possibly requiring another Stealth check.

  If a creature uses [Seek](omen://action/seek?source=paizo-pathfinder-player-core)
  to make you observed by it, you must successfully Hide to become hidden from it
  again.'
success: If the creature could see you, you're now [Hidden](omen://condition/hidden?source=paizo-pathfinder-player-core)
  from it instead of observed. If you were hidden from or [Undetected](omen://condition/undetected?source=paizo-pathfinder-player-core)
  by the creature, you retain that condition.
