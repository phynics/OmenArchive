---
name: hide
traits:
- secret
count: one_action
description: 'You huddle behind cover or greater cover or deeper into concealment
  to become Hidden, rather than Observed. The GM rolls your Stealth check in secret
  and compares the result to the Perception DC of each creature you''re observed by
  but that you have cover or greater cover against or are Concealed from. You get
  a +2 circumstance bonus to your check if you have standard cover (or +4 from greater
  cover).

  If you successfully become hidden to a creature but then cease to have cover or
  greater cover against it or be concealed from it, you become observed again. You
  cease being hidden if you do anything except Hide, Sneak, or Step. If you attempt
  to Strike a creature, the creature remains off-guard against that attack, and you
  then become observed. If you do anything else, you become observed just before you
  act unless the GM determines otherwise. The GM might allow you to perform a particularly
  unobtrusive action without being noticed, possibly requiring another Stealth check.

  If a creature uses Seek to make you observed by it, you must successfully Hide to
  become hidden from it again.'
success: If the creature could see you, you're now Hidden from it instead of Observed.
  If you were hidden from or Undetected by the creature, you retain that condition.
