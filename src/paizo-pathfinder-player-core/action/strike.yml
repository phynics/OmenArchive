---
name: strike
traits:
- attack
count: one_action
description: You attack with a weapon you're wielding or with an unarmed attack, targeting
  one creature within your reach (for a melee attack) or within range (for a ranged
  attack). Roll an attack roll using the attack modifier for the weapon or unarmed
  attack you're using, and compare the result to the target creature's AC to determine
  the effect.
criticalSuccess: You make a damage roll according to the weapon or unarmed attack
  and deal double damage.
success: You make a damage roll according to the weapon or unarmed attack and deal
  damage.
