---
name: treat poison
traits:
- manipulate
count: one_action
requirements: You're wearing or holding a Healer's Toolkit
description: You treat a patient to prevent the spread of poison. Attempt a Medicine
  check against the poison's DC. After you attempt to Treat a Poison for a creature,
  you can't try again until after the next time that creature attempts a save against
  the poison.
criticalSuccess: You grant the creature a +4 circumstance bonus to its next saving
  throw against the poison.
success: You grant the creature a +2 circumstance bonus to its next saving throw against
  the poison.
criticalFailure: Your efforts cause the creature to take a -2 circumstance penalty
  to its next save against the poison.
