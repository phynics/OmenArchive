description: Effect Your animal companion screeches and howls, empowered with natural
  magic. All creatures in a cone take \(your level ÷ 2 rounded down\)d6 sonic damage
  for every 2 levels your companion has, with a basic Fortitude save against your
  spell DC. Creatures that fail become [Frightened 1](omen://condition/frightened?source=paizo-pathfinder-player-core),
  and creatures that critically fail become [Frightened 2](omen://condition/frightened?source=paizo-pathfinder-player-core).
  The fright is an emotion, fear, and mental effect.
