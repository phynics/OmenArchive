---
description: If you're an arcane spellcaster who prepares from a spellbook, you can
  attempt to prepare a spell from someone else's spellbook. The GM sets the DC for
  the check based on the spell's rank and rarity; it's typically a bit easier than
  Learning the Spell.
failure: You fail to prepare the spell, but the spell slot remains available for you
  to prepare a different spell. You can't try to prepare this spell until the next
  time you prepare spells.
name: borrow an arcane spell
source:
  book: Pathfinder Player Core
  publisher: paizo
success: You prepare the borrowed spell as part of your normal spell preparation.
traits:
- concentrate
- exploration
