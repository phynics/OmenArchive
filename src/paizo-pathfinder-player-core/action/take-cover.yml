---
name: take cover
traits: []
count: one_action
requirements: You are benefiting from standard cover, are near a feature that allows
  you to take cover, or are [Prone](omen://condition/prone?source=paizo-pathfinder-player-core).
description: You press yourself against a wall or duck behind an obstacle to take
  better advantage of cover. If you would have standard cover, you instead gain greater
  cover, which provides a +4 circumstance bonus to AC; to Reflex saves against area
  effects; and to Stealth checks to [Hide](omen://action/hide?source=paizo-pathfinder-player-core),
  [Sneak](omen://action/sneak?source=paizo-pathfinder-player-core), or otherwise avoid
  detection. Otherwise, you gain standard cover \(a +2 circumstance bonus instead\).
  If you're prone, you gain greater cover against ranged attacks. Take Cover lasts
  until you move from your current space, use an attack action, become [Unconscious](omen://condition/unconscious?source=paizo-pathfinder-player-core),
  or end it as a free action.
