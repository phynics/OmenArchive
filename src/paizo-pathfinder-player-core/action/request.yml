  attitude toward you. The GM sets the DC of the Diplomacy check based on the difficulty
  of the request. Some requests are unsavory or impossible, and even a helpful NPC
  would never agree to them.
failure: The target refuses the request, though they might propose an alternative
  that is less extreme.
