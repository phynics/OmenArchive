---
name: shove
traits:
- attack
count: one_action
requirements: You have at least one hand free. The target can't be more than one size
  larger than you.
description: You push a creature away from you. Attempt an Athletics check against
  your target's Fortitude DC.
criticalSuccess: You push your target up to 10 feet away from you. You can Stride
  after it, but you must move the same distance and in the same direction.
success: You push your target back 5 feet. You can Stride after it, but you must move
  the same distance and in the same direction.
criticalFailure: You lose your balance, fall, and land Prone.
