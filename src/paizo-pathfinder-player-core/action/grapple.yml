count: one_action
criticalFailure: If you already had the target grabbed or restrained, it breaks free.
  Your target can either grab you, as if it succeeded at using the Grapple action
  against you, or force you to fall and land Prone.
criticalSuccess: Your target is restrained until the end of your next turn unless
  you move or your target Escapes.
description: You attempt to grab a creature or object with your free hand. Attempt
  an Athletics check against the target's Fortitude DC. You can grapple a target you
  already have Grabbed or Restrained without having a hand free.
failure: You fail to grab your target. If you already had the target grabbed or restrained
  using a Grapple, those conditions on the target end.
name: grapple
requirements: You have at least one free hand and your target is no more than one
  size larger than you.
source:
