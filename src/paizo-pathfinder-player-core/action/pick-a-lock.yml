---
name: pick a lock
traits:
- manipulate
count: two_actions
requirements: You're holding or wearing a [Thieves' Toolkit](omen://item/thieves-toolkit?source=paizo-pathfinder-player-core).
description: Opening a lock without a key is very similar to [Disabling a Device](omen://action/disable-a-device?source=paizo-pathfinder-player-core),
  but the DC of the check is determined by the complexity and construction of the
  lock you are attempting to pick. Locks of higher quality might require multiple
  successes to unlock. If you lack the proper tools, the GM might let you use improvised
  picks, which are treated as a shoddy toolkit.
criticalSuccess: You unlock the lock, or you achieve two successes toward opening
  a lock that requires more than one success. You leave no trace of your tampering.
success: You open the lock, or you achieve one success toward opening a lock that
  requires more than one success. You leave behind damage that indicates the lock
  was picked on close scrutiny.
criticalFailure: You break your toolkit and leave behind obvious damage. Fixing a
  broken toolkit requires using Crafting to [Repair](omen://action/repair?source=paizo-pathfinder-player-core)
  it or else swapping in [replacement picks](omen://item/thieves-toolkit-replacement-picks?source=paizo-pathfinder-player-core)
  \(costing 3 sp, or 3 gp for an [infiltrator thieves' toolkit](omen://item/thieves-toolkit-infiltrator-picks?source=paizo-pathfinder-player-core)\).
