---
name: create a diversion
traits:
- mental
count: one_action
description: 'With a [gesture](omen://action/create-a-diversion?source=paizo-pathfinder-player-core),
  a [trick](omen://action/create-a-diversion?source=paizo-pathfinder-player-core),
  or some [distracting words](omen://action/create-a-diversion?source=paizo-pathfinder-player-core),
  you can create a diversion that draws creatures'' attention elsewhere. If you use
  a gesture or trick, this action gains the manipulate trait. If you use distracting
  words, it gains the auditory and linguistic traits.

  Attempt a single Deception check and compare it to the Perception DCs of the creatures
  whose attention you''re trying to divert. Whether or not you succeed, creatures
  you attempt to divert gain a +4 circumstance bonus to their Perception DCs against
  your attempts to Create a Diversion for 1 minute.'
success: You become [Hidden](omen://condition/hidden?source=paizo-pathfinder-player-core)
  to each creature whose Perception DC is less than or equal to your result. \(The
  hidden condition allows you to [Sneak](omen://action/sneak?source=paizo-pathfinder-player-core)
  away.\) This lasts until the end of your turn or until you do anything except Step
  or use the Stealth skill to Hide or Sneak. If you Strike a creature, the creature
  remains [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core)
  against that attack, and you then become observed. If you do anything else, you
  become observed just before you act unless the GM determines otherwise.
failure: You don't divert the attention of any creatures whose Perception DC exceeds
  your result, and those creatures are aware you were trying to trick them.
