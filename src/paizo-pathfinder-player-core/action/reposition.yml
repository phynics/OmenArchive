---
name: reposition
traits:
- attack
count: one_action
requirements: You either have at least one hand free, or you're grabbing or restraining
  the target. The target can't be more than one size larger than you.
description: You muscle a creature or object around. Attempt an Athletics check against
  the target's Fortitude DC.
criticalSuccess: You move the creature up to 10 feet. It must remain within your reach
  during this movement, and you can't move it into or through obstacles.
success: You move the target up to 5 feet. It must remain within your reach during
  this movement, and you can't move it into or through obstacles.
criticalFailure: The target can move you up to 5 feet as though it successfully Repositioned
  you.
