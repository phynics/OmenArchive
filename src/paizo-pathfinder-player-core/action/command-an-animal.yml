---
name: command an animal
traits:
- auditory
- concentrate
count: one_action
description: 'You issue an order to an animal. Attempt a [Nature](omen://action/command-an-animal?source=paizo-pathfinder-player-core)
  check against the animal''s Will DC. The GM might adjust the DC if the animal has
  a good attitude toward you, you suggest a course of action it was predisposed toward,
  or you offer it a treat.

  You automatically fail if the animal is hostile or unfriendly to you. If the animal
  is helpful to you, increase your degree of success by one step. You might be able
  to Command an Animal more easily with a feat like [Ride](omen://feat/ride?source=paizo-pathfinder-player-core).

  Most animals know the [Drop Prone](omen://action/drop-prone?source=paizo-pathfinder-player-core),
  [Leap](omen://action/leap?source=paizo-pathfinder-player-core), [Seek](omen://action/seek?source=paizo-pathfinder-player-core),
  [Stand](omen://action/stand?source=paizo-pathfinder-player-core), [Stride](omen://action/stride?source=paizo-pathfinder-player-core),
  and [Strike](omen://action/strike?source=paizo-pathfinder-player-core) basic actions.
  If an animal knows an activity, such as a horse''s Gallop, you can Command the Animal
  to perform the activity, but you must spend as many actions on Command an Animal
  as the activity''s number of actions. You can also spend multiple actions to Command
  the Animal to perform that number of basic actions on its next turn; for instance,
  you could spend 3 actions to Command an Animal to Stride three times or to Stride
  twice and then make a Strike.'
success: The animal does as you command on its next turn.
failure: The animal is hesitant or resistant, and it does nothing.
criticalFailure: The animal misbehaves or misunderstands, and it takes some other
  action determined by the GM.
