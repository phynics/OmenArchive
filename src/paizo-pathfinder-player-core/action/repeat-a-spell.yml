---
name: repeat a spell
traits:
- concentrate
- exploration
description: You repeatedly cast the same spell while moving at half speed. Typically,
  this spell is a cantrip that you want to have in effect in the event a combat breaks
  out, and it must be one you can cast in 2 actions or fewer. Repeating a spell that
  requires making complex decisions, such as [Figment](omen://spell/figment?source=paizo-pathfinder-player-core),
  can make you [Fatigued](omen://condition/fatigued?source=paizo-pathfinder-player-core),
  as determined by the GM.
