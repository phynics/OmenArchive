---
name: learn a spell
traits:
- concentrate
- exploration
requirements: You have a spellcasting class feature, and the spell you want to learn
  is on your magical tradition's spell list.
description: "Magical Traditions and Skills\nEach magical tradition has a corresponding
  skill, as shown on the table below. You must have the trained proficiency rank in
  a skill to use it to Identify Magic or Learn a Spell. Something without a specific
  tradition, such as an item with the magical trait, can be identified using any of
  these skills.\nMagical Tradition\nCorresponding Skill\nArcane\nArcana\nDivine\nReligion\nOccult\nOccultism\nPrimal\nNature\nYou
  can gain access to a new spell of your tradition from someone who knows that spell
  or from magical writing like a spellbook or scroll. If you can cast spells of multiple
  traditions, you can Learn a Spell of any of those traditions, but you must use the
  corresponding skill to do so. For example, if you were a cleric with the bard multiclass
  archetype, you couldn't use Religion to add an occult spell to your bardic spell
  repertoire.\nTo learn the spell, you must do the following:\n\t•\tSpend 1 hour per
  spell rank, during which you must remain in conversation with a person who knows
  the spell or have the magical writing in your possession.\n\t•\tHave materials with
  the Price indicated in the Learning a Spell table.\n\t•\tAttempt a skill check for
  the skill corresponding to your tradition \\(DC determined by the GM, often close
  to the DC on the Learning a Spell Table\\). Uncommon or rare spells have higher
  DCs; full guidelines for the GM appear on page 52 of GM Core."
criticalSuccess: You expend half the materials and learn the spell.
success: You expend the materials and learn the spell.
failure: You fail to learn the spell but can try again after you gain a level. The
  materials aren't expended.
criticalFailure: As failure, except you expend half the materials.
learning:
  hoursPerRank: 1
  ranks:
    1: {price: 2, dc: 15}
