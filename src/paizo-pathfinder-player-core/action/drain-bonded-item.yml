---
name: drain bonded item
traits:
- arcane
- wizard
count: free_action
frequency: once per day
requirements: Your bonded item is on your person.
description: You expend the magical power stored in your bonded item. During the current
  turn, you can cast one spell you prepared today and already cast, without spending
  a spell slot. You must still Cast the Spell and meet the spell's other requirements.
