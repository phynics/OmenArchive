---
name: stitching strike
traits: []
count: two_actions
frequency: once per 10 minutes
description: Effect Your familiar unravels into magical fibers that encompass an enemy
  within 30 feet and deal 6d6, plus 2d6 per 2 levels above 8 \(rounded up\) slashing
  damage, with a basic Reflex save against your spell DC. On a failure, the target
  is also [Immobilized](omen://condition/immobilized?source=paizo-pathfinder-player-core)
  for 1 round or until it [Escapes](omen://action/escape?source=paizo-pathfinder-player-core)
  against your spell DC. Your familiar then re-forms in its original square. At 9th
  level, and every 2 levels thereafter, the attack deals an additional 2d6 damage.
