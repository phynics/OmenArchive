---
name: identify alchemy
traits:
- concentrate
- exploration
- secret
requirements: You're holding or wearing an Alchemist's Toolkit.
description: You can identify the nature of an alchemical item with 10 minutes of
  testing using alchemist's toolkit. If your attempt is interrupted in any way, you
  must start over.
success: You identify the item and the means of activating it.
failure: You fail to identify the item but can try again.
criticalFailure: You misidentify the item as another item of the GM's choice.
