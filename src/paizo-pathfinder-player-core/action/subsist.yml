criticalFailure: You attract trouble, eat something you shouldn't, or otherwise worsen
  your situation. You take a –2 circumstance penalty to checks to Subsist for 1 week.
  You don't find any food at all; if you don't have any stored up, you're in danger
  of starving or dying of thirst if you continue failing.
criticalSuccess: You either provide a subsistence living for yourself and one additional
  creature, or you improve your own food and shelter, granting yourself a comfortable
  living.
description: "You try to provide food and shelter for yourself, and possibly others
  as well, with a standard of living. This typically uses Society if you're in a settlement
  or Survival if you're in the wild. The GM determines the DC based on the nature
  of the place where you're trying to Subsist. You might need a minimum proficiency
  rank to Subsist in particularly strange environments. Unlike most downtime activities,
  you can Subsist after 8 hours or less of exploration, but if you do, you take a
  –5 penalty.\nSample Subsist Tasks\n\t•\tUntrained a lush forest with calm weather
  or a large city with plentiful resources\n\t•\tTrained typical hillside or village\n\t•\tExpert
  typical mountains or insular hamlet\n\t•\tMaster typical desert or city under siege\n\t•\tLegendary
  barren wasteland or city of undead\nEffect: Adverse Subsist Situation"
failure: You're exposed to the elements and don't get enough food, becoming Fatigued
  until you attain sufficient food and shelter.
name: subsist
source:
  book: Pathfinder Player Core
  publisher: paizo
success: You find enough food and shelter with basic protection from the elements
  to provide you a subsistence living.
