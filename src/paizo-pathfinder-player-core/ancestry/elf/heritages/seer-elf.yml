---
name: seer elf
ancestry: elf
rarity: common
description: 'You have an inborn ability to detect and understand magical phenomena.
  You can cast the [Detect Magic](omen://spell/detect-magic) cantrip as an arcane
  innate spell at will. A cantrip is heightened to a spell rank equal to half your
  level rounded up.

  In addition, you gain a +1 circumstance bonus to checks to [Identify Magic](omen://action/identify-magic)
  and to [Decipher Writing](omen://action/decipher-writing) of a magical nature. These
  skill actions typically use the Arcana, Nature, Occultism, or Religion skill.'
mechanicsScope: mixed
rules:
- key: skills-circumstance-bonus-identify-magic-or-decipher
  effect: core/add-modifier@2
  inputs:
    target: skills
    amount: 1
    type: circumstance
    when: Identify Magic or Decipher Writing
