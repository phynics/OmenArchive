---
name: ancient elf
ancestry: elf
rarity: common
description: In your long life, you've dabbled in many paths and many styles. A typical
  ancient elf is at least 100 years old, though you might be younger at the GM's discretion.
  Choose a class other than your own. You gain the multiclass dedication feat for
  that class, even though you don't meet its level prerequisite. You must still meet
  its other prerequisites to gain the feat.
mechanicsScope: builder
rules:
- key: choice-heritage-feat
  choice:
    name: $.heritage.feat
    label: Heritage Feat
    type: core/feat-id
    records:
      filter:
        all:
        - {type: feat}
        - {trait: dedication}
        - {trait: systemTrait-multiclassDedication}
- key: chosen-feat
  effect: core/add-feat@3
  inputs:
    feat: {choice: $.heritage.feat}
