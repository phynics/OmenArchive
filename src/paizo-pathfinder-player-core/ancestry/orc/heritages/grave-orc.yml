---
name: grave orc
ancestry: orc
rarity: common
description: You were exposed to powerful necromantic energies that should have killed
  you—but you survived. Your skin is cold, clammy, and gray. You gain resistance to
  void damage equal to half your level (minimum 1). You also gain a +1 circumstance
  bonus to saving throws against effects with the death or void trait.
mechanicsScope: builder
rules:
- key: add-resistance-1
  effect: core/add-resistance@2
  inputs:
    type: void
    value: \[[(max 1 (divide $.level 2))]]
    exceptions: ''
- key: add-roll-modifier-1
  effect: core/add-roll-modifier@2
  inputs:
    target:
      description:
      - anyNonPerceptionSavingThrow: {}
    description: 'Grave Orc: +1 circumstance bonus to saving throws (in some situations).'
    numeric: {literal: {amount: 1, applicability: {description: in some situations,
          kind: situational}, type: circumstance}}
