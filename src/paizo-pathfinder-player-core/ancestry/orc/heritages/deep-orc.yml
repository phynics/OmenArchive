---
name: deep orc
ancestry: orc
rarity: common
description: Your calloused hands and red eyes speak to a life spent in the deep darkness
  of mountain caverns, where you learned to battle on rocky cliffs and survive with
  minimal resources. You gain the [Terrain Expertise](omen://feat/terrain-expertise)
  skill feat for underground terrain and the [Combat Climber](omen://feat/combat-climber)
  skill feat.
mechanicsScope: builder
rules:
- key: terrain-expertise-underground-feat
  effect: core/add-feat@3
  inputs:
    feat: '@feat.terrain-expertise'
    with:
      $.feats.terrain-expertise.terrain: {type: core/terrain, value: underground}
- key: combat-climber-feat
  effect: core/add-feat@3
  inputs:
    feat: '@feat.combat-climber'
