---
name: deep orc
ancestry: orc
rarity: common
description: Your calloused hands and red eyes speak to a life spent in the deep darkness
  of mountain caverns, where you learned to battle on rocky cliffs and survive with
  minimal resources. You gain the Terrain Expertise skill feat for underground terrain
  and the Combat Climber skill feat.
mechanicsScope: builder
rules:
- key: add-feat-1
  effect: core/add-feat@2
  inputs:
    featId: '@feat.terrain-expertise'
    with: {$.feat.terrain-expertise.terrains: {kind: fixed, value: {payload: underground,
          revision: 1, typeID: me.atkn.omen.pf2e.playercore/value/terrain}}}
- key: add-feat-2
  effect: core/add-feat@2
  inputs:
    featId: '@feat.combat-climber'
