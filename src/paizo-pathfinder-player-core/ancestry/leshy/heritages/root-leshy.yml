ancestry: leshy
description: Your body is made from hardy roots that attach you firmly to the ground.
  You gain 10 Hit Points from your ancestry instead of 8. You can go without sunlight
  for 2 weeks before you begin to starve. You gain a +2 circumstance bonus to your
  Fortitude or Reflex DC against attempts to Reposition, Shove, or Trip you. This
  bonus also applies to saving throws against spells or effects that attempt to move
  you or knock you Prone.
