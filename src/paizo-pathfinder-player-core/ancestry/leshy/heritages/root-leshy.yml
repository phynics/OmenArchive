---
name: root leshy
ancestry: leshy
rarity: common
hitPoints: 10
description: Your body is made from hardy roots that attach you firmly to the ground.
  You gain 10 Hit Points from your ancestry instead of 8. You can go without sunlight
  for 2 weeks before you begin to starve. You gain a +2 circumstance bonus to your
  Fortitude or Reflex DC against attempts to [Reposition](omen://action/reposition),
  [Shove](omen://action/shove), or [Trip](omen://action/trip) you. This bonus also
  applies to saving throws against spells or effects that attempt to move you or knock
  you [Prone](omen://condition/prone).
mechanicsScope: builder
rules:
- key: fortitude-and-reflex-circumstance-bonus-shove
  effect: core/add-modifier@2
  inputs:
    target: [fortitude, reflex]
    amount: 2
    type: circumstance
    when: Shove or Trip or Reposition
