---
name: rock dwarf
ancestry: dwarf
rarity: common
description: 'Your ancestors lived and worked among the ancient stones of the mountains
  or the depths of the earth. This makes you solid as a rock when you plant your feet.
  You gain a +2 circumstance bonus to your Fortitude or Reflex DC against attempts
  to Reposition, Shove, or Trip you. This bonus also applies to saving throws against
  spells or effects that attempt to force you to move or knock you Prone.

  In addition, if any effect would force you to move 10 feet or more, you are moved
  only half the distance.'
mechanicsScope: builder
rules:
- key: add-roll-modifier-1
  effect: core/add-roll-modifier@2
  inputs:
    target:
      description:
      - savingThrow:
          '_0': fortitude
      - savingThrow:
          '_0': reflex
    description: 'Rock Dwarf: +2 circumstance bonus to Fortitude saves and Reflex
      saves (Shove or Trip or Reposition).'
    numeric: {literal: {amount: 2, applicability: {description: Shove or Trip or Reposition,
          kind: situational}, type: circumstance}}
- key: add-roll-modifier-2
  effect: core/add-roll-modifier@2
  inputs:
    target:
      description:
      - anyNonPerceptionSavingThrow: {}
    description: 'Rock Dwarf: +2 circumstance bonus to saving throws (in some situations).'
    numeric: {literal: {amount: 2, applicability: {description: in some situations,
          kind: situational}, type: circumstance}}
