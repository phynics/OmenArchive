---
name: rock dwarf
ancestry: dwarf
rarity: common
description: 'Your ancestors lived and worked among the ancient stones of the mountains
  or the depths of the earth. This makes you solid as a rock when you plant your feet.
  You gain a +2 circumstance bonus to your Fortitude or Reflex DC against attempts
  to [Reposition](omen://action/reposition), [Shove](omen://action/shove), or [Trip](omen://action/trip)
  you. This bonus also applies to saving throws against spells or effects that attempt
  to force you to move or knock you [Prone](omen://condition/prone).

  In addition, if any effect would force you to move 10 feet or more, you are moved
  only half the distance.'
mechanicsScope: builder
rules:
- key: fortitude-and-reflex-circumstance-bonus-shove
  effect: core/add-modifier@2
  inputs:
    target: [fortitude, reflex]
    amount: 2
    type: circumstance
    when: Shove or Trip or Reposition
- key: saving-throws-circumstance-bonus
  effect: core/add-modifier@2
  inputs:
    target: saving-throws
    amount: 2
    type: circumstance
    when: in some situations
