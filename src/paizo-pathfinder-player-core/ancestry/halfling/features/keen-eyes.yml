name: keen eyes
traits:
- halfling
description: Your eyes are sharp, allowing you to make out small details about [Concealed](omen://condition/concealed)
  or even [Invisible](omen://condition/invisible) creatures that others might miss.
  You gain a +2 circumstance bonus when using the [Seek](omen://action/seek) action
  to find [Hidden](omen://condition/hidden) or [Undetected](omen://condition/undetected)
  creatures within 30 feet of you. When you target an opponent that is concealed from
  you or hidden from you, reduce the DC of the flat check to 3 for a concealed target
  or 9 for a hidden one.
