name: keen eyes
source:
  publisher: paizo
  book: Pathfinder Player Core
traits:
- halfling
action: {}
description: |
  Your eyes are sharp, allowing you to make out small details about Undetected creatures within 30 feet of you. When you target an opponent that is concealed from you or hidden from you, reduce the DC of the flat check to 3 for a concealed target or 9 for a hidden one.