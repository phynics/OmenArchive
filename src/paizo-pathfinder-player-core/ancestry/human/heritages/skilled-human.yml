---
name: skilled human
ancestry: human
rarity: common
description: Your ingenuity allows you to train in a wide variety of skills. You become
  trained in one skill of your choice. At 5th level, you become an expert in the chosen
  skill.
mechanicsScope: builder
rules:
- key: choice-heritage-skill
  choice:
    name: $.heritage.skill
    label: Skill
    type: core/skill
    cases:
    - {key: acrobatics, value: acrobatics}
    - {key: arcana, value: arcana}
    - {key: athletics, value: athletics}
    - {key: crafting, value: crafting}
    - {key: deception, value: deception}
    - {key: diplomacy, value: diplomacy}
    - {key: intimidation, value: intimidation}
    - {key: medicine, value: medicine}
    - {key: nature, value: nature}
    - {key: occultism, value: occultism}
    - {key: performance, value: performance}
    - {key: religion, value: religion}
    - {key: society, value: society}
    - {key: stealth, value: stealth}
    - {key: survival, value: survival}
    - {key: thievery, value: thievery}
- key: add-skill-increase-1
  effect: core/add-skill-increase
  inputs:
    skill: {choice: $.heritage.skill}
    proficiencyCap: 2
- key: add-skill-increase-2
  effect: core/add-skill-increase
  level: 5
  inputs:
    skill: {choice: $.heritage.skill}
    proficiencyCap: 4
