---
name: versatile human
ancestry: human
rarity: common
description: Humanity's versatility and ambition have fueled its ascendance to be
  the most common ancestry in most nations throughout the world. Select a general
  feat of your choice for which you meet the prerequisites (as with your ancestry
  feat, you can select this general feat at any point during character creation).
mechanicsScope: builder
rules:
- key: choice-heritage-feat
  choice:
    name: $.heritage.feat
    label: Heritage Feat
    records:
      filter:
        all:
        - {type: feat}
        - {maxLevel: 1}
        - {trait: systemTrait-general}
      type: core/feat-id
- key: add-feat-1
  effect: core/add-feat@2
  inputs:
    featId: {choice: $.heritage.feat}
