ancestry: goblin
description: Your ancestors have always had a connection to fire and a thicker skin,
  which allows you to resist burning. You gain fire resistance equal to half your
  level (minimum 1). You can also recover from being on fire more easily. Your flat
  check to remove persistent fire damage is DC 10 instead of DC 15, which is reduced
  to flat|dc:5 if another creature uses a particularly appropriate action to help.
