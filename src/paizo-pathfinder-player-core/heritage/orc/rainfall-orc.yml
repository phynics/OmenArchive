  from torrential rainstorms and flash floods. You've learned to move adeptly through
  jungle terrain and resist the various ailments common in humid environs. You gain
  a +2 circumstance bonus to Athletics checks to Climb or Swim and a +1 circumstance
  bonus to saving throws against diseases.
