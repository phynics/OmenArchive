ancestry: gnome
description: The blood of the fey flows through your veins, saturating you with their
  magic and making you truly one of them. You gain the fey trait, in addition to the
  gnome and humanoid traits. Choose one cantrip from the primal spell list. You can
  cast this spell as a primal innate spell at will. A cantrip is heightened to a spell
  rank equal to half your level rounded up. You can change this cantrip to a different
  one from the same list once per day by meditating to realign yourself with the First
  World; this is a 10-minute activity that has the concentrate trait.
