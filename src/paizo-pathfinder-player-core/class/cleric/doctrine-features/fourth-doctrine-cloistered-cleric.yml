---
name: fourth doctrine (cloistered cleric)
level: 11
traits:
- cleric
description: You gain expert proficiency with your deity's favored weapon, simple
  weapons, and unarmed attacks. When you critically succeed at an attack roll using
  your deity's favored weapon, you apply the weapon's critical specialization effect;
  you can use your spell DC in place of your class DC.
mechanicsScope: builder
foundryID: vxOf4LXZcqUG3P7a
rules:
- key: weapon-critical-specialization-note
  effect: core/add-note
  inputs:
    target: attack-rolls
    text: When you critically succeed at an attack roll using your deity's favored
      weapon, you apply the weapon's critical specialization effect.
    when: With your deity's favored weapon
- key: simple-weapons-expert
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {category: simple}
    rank: expert
- key: unarmed-attacks-expert
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {category: unarmed}
    rank: expert
