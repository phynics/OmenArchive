---
name: first doctrine (warpriest)
level: 1
traits:
- cleric
description: You're trained in light and medium armor, and you have expert proficiency
  in Fortitude saves. You gain the [Shield Block](omen://feat/shield-block) general
  feat, a reaction to reduce damage with a shield. If your deity's favored weapon
  is a simple weapon or an unarmed attack, you gain the [Deadly Simplicity](omen://feat/deadly-simplicity)
  cleric feat. At 13th level, if you gain the [Divine Defense](omen://class/cleric/features/divine-defense)
  class feature, you also gain expert proficiency in light and medium armor.
mechanicsScope: builder
foundryID: xxkszluN9icAiTO4
rules:
- key: fortitude-expert
  effect: core/add-saving-throw@2
  inputs:
    savingThrow: fortitude
    rank: expert
- key: light-armor-trained
  effect: core/add-armor-proficiency@3
  inputs:
    armor: {category: light}
    rank: trained
    selfScaling: true
- key: medium-armor-trained
  effect: core/add-armor-proficiency@3
  inputs:
    armor: {category: medium}
    rank: trained
    selfScaling: true
- key: shield-block-feat
  effect: core/add-feat@3
  inputs:
    feat: '@feat.shield-block'
- key: deadly-simplicity-feat
  effect: core/add-feat@3
