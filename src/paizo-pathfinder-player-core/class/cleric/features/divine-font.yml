---
action: {}
description: 'Through your deity''s blessing, you gain additional spells that channel
  either the life force called vitality or its counterforce, the void. When you prepare
  your spells each day, you can prepare additional Heal or Harm spells, depending
  on your deity. The divine font spell your deity provides is listed in the Divine
  Font entry for your deity; if both are listed, you can choose between heal or harm.
  Once you choose, you can''t change your choice short of divine intervention.

  Healing Font: You gain 4 additional spell slots each day at your highest rank of
  cleric spell slots. You can prepare only heal spells in these slots. At 5th level,
  the number of additional slots increases to 5, and at 15th level, the total number
  of additional slots increases to 6.

  Harmful Font: You gain 4 additional spell slots each day at your highest rank of
  cleric spell slots. You can prepare only harm spells in these slots. At 5th level,
  the number of additional slots increases to 5, and at 15th level, the total number
  of additional slots increases to 6.'
