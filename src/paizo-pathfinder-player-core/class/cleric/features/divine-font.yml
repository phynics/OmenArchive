---
name: divine font
level: 1
traits:
- cleric
description: 'Through your deity''s blessing, you gain additional spells that channel
  either the life force called vitality or its counterforce, the void. When you prepare
  your spells each day, you can prepare additional Heal or Harm spells, depending
  on your deity. The divine font spell your deity provides is listed in the Divine
  Font entry for your deity; if both are listed, you can choose between heal or harm.
  Once you choose, you can''t change your choice short of divine intervention.

  Healing Font: You gain 4 additional spell slots each day at your highest rank of
  cleric spell slots. You can prepare only heal spells in these slots. At 5th level,
  the number of additional slots increases to 5, and at 15th level, the total number
  of additional slots increases to 6.

  Harmful Font: You gain 4 additional spell slots each day at your highest rank of
  cleric spell slots. You can prepare only harm spells in these slots. At 5th level,
  the number of additional slots increases to 5, and at 15th level, the total number
  of additional slots increases to 6.'
mechanicsScope: builder
foundryID: gblTFUOgolqFS9v4
rules:
- key: choice-deity-divine-font
  choice:
    name: $.deity.divine-font
    label: Allowed divine fonts
    type: spellcasting/spell-id-list
    cases:
    - {key: heal, value: ['@spell.heal']}
    - {key: harm, value: ['@spell.harm']}
    - {key: both, label: Heal or Harm, value: ['@spell.heal', '@spell.harm']}
- key: configure-source-1
  effect: spellcasting/configure-source
  inputs:
    sourceId: '@class.cleric.features.cleric-spellcasting#spellcasting-source'
    sourceName: Cleric Spellcasting
    castingKind: prepared
    tradition: divine
    attribute: wis
- key: choice-cleric-divine-font
  choice:
    name: $.cleric.divine-font
    label: Divine Font
    optionsFrom: $.deity.divine-font
    type: spellcasting/spell-id
    cases:
    - {label: Heal, value: '@spell.heal'}
    - {label: Harm, value: '@spell.harm'}
- key: grant-spell-1
  effect: spellcasting/grant-spell
  inputs:
    sourceId: '@class.cleric.features.cleric-spellcasting#spellcasting-source'
    spellId: {choice: $.cleric.divine-font}
    rankPolicy: {kind: cantrip}
    castFrequency: {kind: perDay, uses: 4}
- key: grant-spell-2
  effect: spellcasting/grant-spell
  level: 5
  inputs:
    sourceId: '@class.cleric.features.cleric-spellcasting#spellcasting-source'
    spellId: {choice: $.cleric.divine-font}
    rankPolicy: {kind: cantrip}
    castFrequency: {kind: perDay, uses: 1}
- key: grant-spell-3
  effect: spellcasting/grant-spell
  level: 15
  inputs:
    sourceId: '@class.cleric.features.cleric-spellcasting#spellcasting-source'
    spellId: {choice: $.cleric.divine-font}
    rankPolicy: {kind: cantrip}
    castFrequency: {kind: perDay, uses: 1}
