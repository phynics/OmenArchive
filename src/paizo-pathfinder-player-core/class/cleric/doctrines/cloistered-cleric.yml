---
action: {}
description: 'You are a cleric of the cloth, focusing on divine magic and your connection
  to your deity''s domains.

  First Doctrine (1st): You gain the Domain Initiate cleric feat.

  Second Doctrine (3rd): Your proficiency rank for Fortitude saves increases to expert.

  Third Doctrine (7th): Your proficiency ranks for the spell attack modifier and spell
  DC statistics increase to expert.

  Fourth Doctrine (11th): You gain expert proficiency with your deity''s favored weapon,
  simple weapons, and unarmed attacks. When you critically succeed at an attack roll
  using your deity''s favored weapon, you apply the weapon''s critical specialization
  effect; you can use your spell DC in place of your class DC.

  Fifth Doctrine (15th): Your proficiency ranks for the spell attack modifier and
  spell DC statistics increase to master.

  Final Doctrine (19th): Your proficiency ranks for the spell attack modifier and
  spell DC statistics increase to legendary.'
level: 1
mechanicsScope: builder
