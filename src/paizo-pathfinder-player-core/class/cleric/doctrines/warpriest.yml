---
name: warpriest
level: 1
traits:
- cleric
description: 'You have trained in the more militant doctrine of your church, focusing
  on both spells and battle.

  First Doctrine (1st): You''re trained in light and medium armor, and you have expert
  proficiency in Fortitude saves. You gain the Shield Block general feat, a reaction
  to reduce damage with a shield. If your deity''s favored weapon is a simple weapon
  or an unarmed attack, you gain the Deadly Simplicity cleric feat. At 13th level,
  if you gain the Divine Defense class feature, you also gain expert proficiency in
  light and medium armor.

  Second Doctrine (3rd): You''re trained in martial weapons.

  Third Doctrine (7th): You gain expert proficiency with your deity''s favored weapon,
  martial weapons, simple weapons, and unarmed attacks. When you critically succeed
  at an attack roll using your deity''s favored weapon, you apply the weapon''s critical
  specialization effect; you can use your spell DC in place of your class DC.

  Fourth Doctrine (11th): Your proficiency ranks for the spell attack modifier and
  spell DC statistics increase to expert.

  Fifth Doctrine (15th): Your proficiency rank for Fortitude saves increases to master.
  When you roll a success at a Fortitude save, you get a critical success instead.

  Final Doctrine (19th): You gain master proficiency with your deity''s favored weapon,
  spell attack modifier, and spell DC.'
