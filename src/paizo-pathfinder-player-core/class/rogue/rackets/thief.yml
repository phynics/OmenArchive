---
name: thief
level: 1
traits:
- rogue
description: 'Nothing beats the thrill of taking something that belongs to someone
  else. You might be a pickpocket working the streets, a cat burglar sneaking through
  windows, or even a consultant, testing your clients'' vaults for openings.

  When a fight breaks out, you prefer swift, lightweight weapons, and you strike where
  it hurts. When you make a melee Strike with a finesse weapon or finesse unarmed
  attack, you can add your Dexterity modifier to the damage roll instead of your Strength
  modifier.

  You are trained in Thievery.'
mechanicsScope: builder
foundryID: wAh2riuFRzz0edPl
rules:
- key: thievery-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: thievery
    rank: trained
- key: melee-strike-damage-untyped-bonus
  effect: core/add-modifier@2
  inputs:
    target: melee-strike-damage
    amount: (max 0 (subtract $.attributes.dex $.attributes.str))
    type: untyped
    requires: (contains $.strike.traits finesse)
