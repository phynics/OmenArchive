---
name: ruffian
level: 1
traits:
- rogue
description: 'You prefer the direct approach: strong-arming or intimidation. You might
  be an enforcer for organized crime, a highway bandit, or a noble who bullies others
  with threats of your family''s power.

  You use whatever tools you have to get the job done. You can deal sneak attack damage
  with any weapon, not just the weapons listed in the sneak attack class feature.
  This benefit doesn''t apply to a simple weapon with a damage die greater than d8
  or a martial or advanced weapon with a damage die greater than d6. \(Apply any abilities
  that alter the damage die size first.\) Critical hits you make with these weapons
  gain the weapon''s critical specialization benefit if the target is [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core)
  to you.

  You''re trained in Intimidation and medium armor. You can choose Strength as your
  key attribute. When you gain light armor expertise, you also gain expert proficiency
  in medium armor, and when you gain light armor mastery, you also gain master proficiency
  in medium armor.'
mechanicsScope: mixed
foundryID: 3KPZ7svIO6kmmEKH
rules:
- key: key-attribute
  effect: core/extend-class-key-attribute
  inputs:
    attribute: strength
- key: intimidation-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: intimidation
    rank: trained
- key: medium-armor
  effect: core/add-armor-proficiency@3
  inputs:
    armor: {category: medium}
    rank: trained
    selfScaling: true
