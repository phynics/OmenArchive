---
name: weapon tricks
level: 5
traits:
- rogue
description: You gain expert proficiency in simple weapons, martial weapons, and unarmed
  attacks. When you critically succeed at an attack roll against an [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core)
  creature while using an agile or finesse weapon or an agile or finesse unarmed attack,
  you apply the critical specialization effect for that weapon or unarmed attack.
mechanicsScope: mixed
foundryID: v8UNEJR5IDKi8yqa
rules:
- key: add-weapon-critical-specialization-1
  effect: core/add-weapon-critical-specialization
  inputs:
    weaponGroup: any
- key: add-weapon-proficiency-1
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {category: martial}
    rank: expert
- key: add-weapon-proficiency-2
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {category: simple}
    rank: expert
- key: add-weapon-proficiency-3
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {category: unarmed}
    rank: expert
