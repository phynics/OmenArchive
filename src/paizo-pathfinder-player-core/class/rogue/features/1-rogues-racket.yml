                description: 'You use fast-talking, flattery, and a silver tongue
                  to avoid danger and escape tricky situations. You might be a grifter
                  or con artist, or you might use your skills in certain reputable
                  professions, like a barrister or diplomat.

                  When you successfully Feint, the target is Off-Guard against your
                  melee attacks until the end of your next turn. On a critical success,
                  the target is off-guard against all melee attacks until the end
                  of your next turn, not just yours.

                  If you Feint while wielding an agile or finesse melee weapon, you
                  can step immediately after the Feint as a free action. You''re trained
                  in Deception and Diplomacy. You can choose Charisma as your key
