description: 'The battlefield is your stage, the clang of steel, your song. Your muse
  has seen countless battles, whether reveling in combat or resigned to its necessity.
  An individual soldier or general might inspire you, but so might a battlefield or
  weapon with a particularly profound history. If your muse is a creature, it might
  be an otherworldly soldier, such as an archon or devil soldier. If it''s a deity,
  it might be Gorum. Art inspired by a warrior muse is triumphant and strident, often
  detailing epic battles.

  As a bard with a warrior muse, you train for battle in addition to performance,
  and you prepare your allies for the dangers of combat. You might even wade into
  the thick of things with them.

  Muse Feat Martial Performance

  Muse Spell Fear'
