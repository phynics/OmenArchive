description: 'Your muse is a mystery, driving you to uncover the hidden secrets of
  life and the multiverse. These muses can be people you cannot fully grasp, texts
  layered deeply with symbolism, or emotional paradoxes that underline a lifetime''s
  work. If your muse is an otherworldly creature, it might be a mysterious aeon or
  an occult dragon; if a deity, it might be Irori or Nethys. Art inspired by an enigma
  muse could be cryptic, eerie, or laden with speculation and conspiracy. As a bard
  with the enigma muse, you support your allies by providing knowledge alongside inspiration
  and occult support.

  Muse Feat Bardic Lore

  Muse Spell Sure Strike'
