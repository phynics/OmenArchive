---
name: muses
level: 1
traits:
- bard
description: "As a bard, you select one muse at 1st level. This muse leads you to
  great things and might be someone you know, a supernatural creature, location, deity,
  philosophy, or captivating mystery. Depending on the type of inspiration you receive,
  your 1st-level muse grants you a specific 1st-level bard feat and adds a spell to
  your repertoire.\nIn addition to this, each muse opens the door to many later bard
  feats. If one type of inspiration is not enough to represent your muse, consider
  the [Multifarious Muse](omen://feat/multifarious-muse) feat.\n\t•\t[Enigma](omen://class/bard/muses/enigma)\n\t•\t[Maestro](omen://class/bard/muses/maestro)\n\t•\t[Polymath](omen://class/bard/muses/polymath)\n\t•\t[Warrior](omen://class/bard/muses/warrior)\n\t•\tZoophonia"
mechanicsScope: builder
foundryID: AIOBWGOS4nkfH3kW
rules:
- key: muse-list
  effect: core/declare-list
  inputs:
    list: $.bard.muses
    valueType: {records: '@class.bard.muses'}
    label: Bard muses
- key: choice-bard-muse
  choice:
    name: $.bard.muse
    label: Muse
    addTo: $.bard.muses
    type: core/feature-id
    records: {filter: {pathPrefix: '@class.bard.muses'}}
- key: chosen-muse-feature
  effect: core/add-feature@2
  inputs:
    feature: {choice: $.bard.muse}
