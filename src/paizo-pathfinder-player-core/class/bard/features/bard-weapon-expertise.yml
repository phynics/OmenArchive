---
name: bard weapon expertise
level: 11
traits:
- bard
description: You have become thoroughly adept with bardic weapons. Your proficiency
  rank for martial weapons, simple weapons, and unarmed attacks increases to expert.
  When you critically succeed at an attack roll using one of these weapons or an unarmed
  attack while one of your compositions is active, you apply the critical specialization
  effect for that weapon or unarmed attack.
mechanicsScope: mixed
foundryID: 4lp8oG9A3zuqhPBS
rules:
- key: add-weapon-critical-specialization-1
  effect: core/add-weapon-critical-specialization
  inputs:
    weaponGroup: any
- key: add-weapon-proficiency-1
  effect: core/add-weapon-proficiency
  inputs:
    weaponDesignation: {kind: filter, weaponGroup: any, weaponKind: martial}
    proficiencyRank: 4
    selfScaling: false
- key: add-weapon-proficiency-2
  effect: core/add-weapon-proficiency
  inputs:
    weaponDesignation: {kind: filter, weaponGroup: any, weaponKind: simple}
    proficiencyRank: 4
    selfScaling: false
- key: add-weapon-proficiency-3
  effect: core/add-weapon-proficiency
  inputs:
    weaponDesignation: {kind: filter, weaponGroup: any, weaponKind: unarmed}
    proficiencyRank: 4
    selfScaling: false
