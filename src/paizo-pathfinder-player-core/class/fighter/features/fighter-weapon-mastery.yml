---
name: fighter weapon mastery
level: 5
traits:
- fighter
description: Hours spent training with your preferred weapons, learning and developing
  new combat techniques, have made you particularly effective with your weapons of
  choice. Choose one weapon group. Your proficiency rank increases to master with
  the simple weapons, martial weapons, and unarmed attacks in that group, and to expert
  with the advanced weapons in that group. You gain access to the critical specialization
  effects of all weapons and unarmed attacks for which you have master proficiency.
