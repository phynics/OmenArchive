---
name: weapon legend
level: 13
traits:
- fighter
description: 'You''ve learned fighting techniques that apply to all armaments, and
  you''ve developed unparalleled skill with your favorite weapons. Your proficiency
  ranks for simple weapons, martial weapons, and unarmed attacks increase to master.
  Your proficiency rank for advanced weapons increases to expert.

  You can select one weapon group and increase your proficiency ranks to legendary
  for all simple weapons, martial weapons, and unarmed attacks in that weapon group,
  and to master for all advanced weapons in that weapon group.'
mechanicsScope: builder
foundryID: F5VenhIQMDkeGvmV
rules:
- key: advanced-weapons-expert
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {category: advanced}
    rank: expert
- key: martial-weapons-master
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {category: martial}
    rank: master
- key: simple-weapons-master
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {category: simple}
    rank: master
- key: unarmed-attacks-master
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {category: unarmed}
    rank: master
- key: choice-fighter-weapon-legend-group
  level: 13
  choice:
    name: $.fighter.weapon-legend-group
    label: Weapon group
    type: core/weapon-group
    cases:
    - sword
    - brawling
    - flail
    - knife
    - club
    - dart
    - spear
    - axe
    - polearm
    - hammer
    - pick
    - shield
    - bow
- key: chosen-weapon-legend-group-legendary
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {choice: $.fighter.weapon-legend-group}
    rank: legendary
    category: any-non-advanced
- key: chosen-weapon-legend-group-master
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {choice: $.fighter.weapon-legend-group}
    rank: master
