---
name: the inscribed one
level: 1
traits:
- witch
description: 'No words passed your patron''s lips in the moment you met; instead,
  words and glyphs danced across their skin while symbols and numbers swam in the
  depths of their eyes, spelling out their will in a torrent of words and wisdom.
  Your patron might be a powerful archmage, or even one of their abandoned artifacts,
  searching for a successor.

  Spell List arcane

  Patron Skill Arcana

  Lesson of Glyph''s Supremacy Your patron teaches that the written word can accomplish
  so much more than it seems. You gain the [Discern Secrets](omen://spell/discern-secrets?source=paizo-pathfinder-player-core)
  hex and your familiar learns [Runic Weapon](omen://spell/runic-weapon?source=paizo-pathfinder-player-core).

  Familiar of Flowing Script Your familiar is covered in a pattern that looks similar
  to letters in an unknown language, one that seems to draw attention even as it eludes
  understanding. When you Cast or Sustain a hex, the letters begin to rapidly change,
  causing a distraction. Until the start of your next turn, your familiar can provide
  flanking for you and your allies as though it were able to attack and had a reach
  of 5 feet; this is a visual effect.'
grantedSpells:
- grant: focus-cantrip
  spell: omen://spell/discern-secrets?source=paizo-pathfinder-player-core
- grant: known
  spell: omen://spell/runic-weapon?source=paizo-pathfinder-player-core
mechanicsScope: builder
foundryID: FdLx4VODZEYLGOK9
rules:
- key: configure-source-1
  effect: spellcasting/configure-source
  inputs:
    source: witch-focus-spells
    sourceName: Witch Focus Spells
    castingKind: focus
    tradition: arcane
    attribute: intelligence
- key: grant-spell-1
  effect: spellcasting/grant-spell@2
  inputs:
    source: witch-focus-spells
    spell: '@spell.discern-secrets'
    rankPolicy: cantrip
    castFrequency: atWill
- key: add-known-spell-1
  effect: spellcasting/add-known-spell
  inputs:
    source: witch-spellcasting
    spells: ['@spell.runic-weapon']
- key: choice-witch-patron-first-hex
  choice:
    name: $.witch.patron.first-hex
    label: First Hex
    type: spellcasting/spell-id
    records:
      filter:
        any:
        - {id: '@spell.patrons-puppet'}
        - {id: '@spell.phase-familiar'}
- key: grant-focus-spell-1
  effect: spellcasting/grant-focus-spell@2
  inputs:
    source: witch-focus-spells
    spell: {choice: $.witch.patron.first-hex}
- key: configure-source-2
  effect: spellcasting/configure-source
  inputs:
    source: witch-spellcasting
    sourceName: Witch Spellcasting
    castingKind: prepared
    tradition: arcane
    attribute: intelligence
- key: add-skill-increase-1
  effect: core/add-skill-increase@2
  inputs:
    skill: arcana
    rank: trained
