---
name: wilding steward
level: 1
traits:
- witch
description: 'When your patron appeared before you, they moved with the grace and
  ferocity of the wilderness, their voice the creaking of trees and the sound of hoof
  against unspoiled earth. They might have been a dryad queen or a primeval beast,
  but it seemed all of nature was theirs to defend.

  Spell List primal

  Patron Skill Nature

  Lesson of Wild Speech Your patron has taught you the complexities of nonverbal speech,
  letting you influence and call animals and plants to you. You gain the Wilding Word
  hex cantrip and your familiar learns your choice of Summon Animal or Summon Plant
  or Fungus.

  Familiar of Keen Senses Your familiar has glinting eyes, twitching ears, or some
  other sign of a beast''s powerful senses. When you Cast or Sustain a hex, your familiar
  gains your choice of an imprecise scent, tremorsense, or wavesense, with a range
  of 60 feet until the start of your next turn, and it can immediately Point Out as
  a free action.'
grantedSpells:
- grant: focus-cantrip
  spell: omen://spell/wilding-word?source=paizo-pathfinder-player-core
- grant: known-choice
  spell: omen://spell/summon-animal?source=paizo-pathfinder-player-core
- grant: known-choice
  spell: omen://spell/summon-plant-or-fungus?source=paizo-pathfinder-player-core
mechanicsScope: builder
foundryID: e0VhUyjz1clW3sC4
spellcasting:
  source: '@class.witch.features.witch-spellcasting'
  choose:
  - '@spell.summon-animal'
  - '@spell.summon-plant-or-fungus'
