---
name: faith's flamekeeper
level: 1
traits:
- witch
description: 'Your patron contacted you in a moment your willpower was close to sputtering
  out. Their reassuring presence was like breath and kindling bringing an ember back
  aflame, their magic giving you the strength to carry on and bring others to your
  cause. Your patron is likely a divine being like an angel or aeon acting covertly,
  though the possibility exists they might be a more sinister entity, using you to
  unknown ends.

  Spell List divine

  Patron Skill Religion

  Lesson of Fervor''s Grasp Your patron has taught you that nothing can seize the
  heart like faith, whether used to inspire or direct. You gain the Stoke the Heart
  hex cantrip and your familiar learns Command.

  Familiar of Restored Spirit Your familiar is pleasantly warm and soft, seeming to
  wash away worries with its mere presence. When you Cast or Sustain a hex, one willing
  creature within 15 feet of your familiar gains temporary Hit Points equal to 2 +
  half your level, which last until the start of your next turn.'
grantedSpells:
- grant: focus-cantrip
  spell: omen://spell/stoke-the-heart?source=paizo-pathfinder-player-core
- grant: known
  spell: omen://spell/command?source=paizo-pathfinder-player-core
mechanicsScope: builder
foundryID: mFqMSQoNl0NMDklv
