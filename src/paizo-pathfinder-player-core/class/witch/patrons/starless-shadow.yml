---
name: starless shadow
level: 1
traits:
- witch
description: 'Your patron first contacted you at the witching hour, as your body lay
  paralyzed by sleep while your mind had yet to escape the waking world. Your patron
  might be a creature of the Netherworld or a long-forgotten spirit of twilight—all
  you remember of them are haunting eyes of moonlight, offering you power from the
  darkness.

  Spell List occult

  Patron Skill Occultism

  Lesson of Night''s Terrors Your patron taught you that the darkness can hide all
  manner of things best left unseen. You gain the [Shroud of Night](omen://spell/shroud-of-night?source=paizo-pathfinder-player-core)
  hex cantrip, and your familiar learns [Fear](omen://spell/fear?source=paizo-pathfinder-player-core).

  Familiar of Stalking Night Your familiar is dark of fur or feather, and light seems
  to disappear into it. When you Cast or Sustain a hex, and your familiar is adjacent
  to an enemy to which it''s [Concealed](omen://condition/concealed?source=paizo-pathfinder-player-core),
  [Hidden](omen://condition/hidden?source=paizo-pathfinder-player-core), or undetected,
  the enemy becomes [Frightened 1](omen://condition/frightened?source=paizo-pathfinder-player-core).'
grantedSpells:
- grant: focus-cantrip
  spell: omen://spell/shroud-of-night?source=paizo-pathfinder-player-core
- grant: known
  spell: omen://spell/fear?source=paizo-pathfinder-player-core
mechanicsScope: builder
foundryID: r2ZPRAw9c3VGZi8A
rules:
- key: configure-source-1
  effect: spellcasting/configure-source
  inputs:
    source: witch-focus-spells
    sourceName: Witch Focus Spells
    castingKind: focus
    tradition: occult
    attribute: intelligence
- key: grant-spell-1
  effect: spellcasting/grant-spell
  inputs:
    source: witch-focus-spells
    spellId: '@spell.shroud-of-night'
    rankPolicy: cantrip
    castFrequency: atWill
- key: add-known-spell-1
  effect: spellcasting/add-known-spell
  inputs:
    source: witch-spellcasting
    spells: ['@spell.fear']
- key: choice-witch-patron-first-hex
  choice:
    name: $.witch.patron.first-hex
    label: First Hex
    type: spellcasting/spell-id
    records:
      filter:
        any:
        - {id: '@spell.patrons-puppet'}
        - {id: '@spell.phase-familiar'}
- key: grant-focus-spell-1
  effect: spellcasting/grant-focus-spell
  inputs:
    source: witch-focus-spells
    spellId: {choice: $.witch.patron.first-hex}
- key: configure-source-2
  effect: spellcasting/configure-source
  inputs:
    source: witch-spellcasting
    sourceName: Witch Spellcasting
    castingKind: prepared
    tradition: occult
    attribute: intelligence
- key: add-skill-increase-1
  effect: core/add-skill-increase@2
  inputs:
    skill: occultism
    rank: trained
