description: 'You weren''t born with the power to cast spells, nor have you spent
  years dedicated to worship, study, or uncovering mystical secrets. Your magic instead
  has been gifted to you by a potent being, one who knows that by empowering you so,
  you''ll further the being''s agenda in the world, whatever it may be. This entity
  is typically mysterious and distant, revealing little of their identity and motivations.
  They make their will known to you in abstract signs such as omens, dreams, or similar
  subtleties rather than words.

  Rather than interacting with you directly, your patron works through a familiar—a
  mystical creature that teaches you, serves as the conduit for your patron''s magic,
  and maybe even keeps an eye on you to ensure you''re furthering your patron''s nebulous
  ends.

  At 1st level, choose your patron, which determines your spellcasting tradition and
  grants you the skill for that tradition of magic, your first witch''s lesson and
  a unique familiar ability.'
