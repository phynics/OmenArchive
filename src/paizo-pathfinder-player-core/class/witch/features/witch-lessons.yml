  using your witch spellcasting. You gain this spell even if it's not on your tradition's
  spell list.\nBASIC LESSONS\nYou can select from these lessons when a feat or another
  effect grants you a basic lesson.\nLesson of Dreams You gain the [Veil of Dreams](omen://spell/veil-of-dreams?source=paizo-pathfinder-player-core)
  hex, and your familiar learns [Sleep](omen://spell/sleep?source=paizo-pathfinder-player-core).\nLesson
  of the Elements You gain the [Elemental Betrayal](omen://spell/elemental-betrayal?source=paizo-pathfinder-player-core)
  hex. Your familiar learns your choice of [Breathe Fire](omen://spell/breathe-fire?source=paizo-pathfinder-player-core),
  [Air Bubble](omen://spell/air-bubble?source=paizo-pathfinder-player-core), [Hydraulic
  Push](omen://spell/hydraulic-push?source=paizo-pathfinder-player-core), or [Pummeling
  Rubble](omen://spell/pummeling-rubble?source=paizo-pathfinder-player-core).\nLesson
  of Life You gain the [Life Boost](omen://spell/life-boost?source=paizo-pathfinder-player-core)
  hex, and your familiar learns [Spirit Link](omen://spell/spirit-link?source=paizo-pathfinder-player-core).\nLesson
  of Protection You gain the [Blood Ward](omen://spell/blood-ward?source=paizo-pathfinder-player-core)
  hex; your familiar learns [Mystic Armor](omen://spell/mystic-armor?source=paizo-pathfinder-player-core).\nLesson
  of Vengeance You gain the [Needle of Vengeance](omen://spell/needle-of-vengeance?source=paizo-pathfinder-player-core)
  hex, and your familiar learns [Phantom Pain](omen://spell/phantom-pain?source=paizo-pathfinder-player-core).\n\t•\tUncommon\nLesson
  of Calamity: You gain the Stumbling Curse hex, and your familiar learns [Ill Omen](omen://spell/ill-omen?source=paizo-pathfinder-player-core).\nGREATER
  LESSONS\nYou can select from these lessons when a feat or other effect grants you
  a greater lesson.\nLesson of Mischief You gain the [Deceiver's Cloak](omen://spell/deceivers-cloak?source=paizo-pathfinder-player-core)
  hex, and your familiar learns [Mad Monkeys](omen://spell/mad-monkeys?source=paizo-pathfinder-player-core).\nLesson
