description: "A witch's knowledge from their patron comes in the form of lessons,
  which you can learn by selecting feats like Basic Lesson. Each lesson grants you
  a hex and teaches your familiar a new spell, adding it to the spells you can prepare
  using your witch spellcasting. You gain this spell even if it's not on your tradition's
  spell list.\nBASIC LESSONS\nYou can select from these lessons when a feat or another
  effect grants you a basic lesson.\nLesson of Dreams You gain the Veil of Dreams
  hex, and your familiar learns Sleep.\nLesson of the Elements You gain the Elemental
  Betrayal hex. Your familiar learns your choice of Breathe Fire, Air Bubble, Hydraulic
  Push, or Pummeling Rubble.\nLesson of Life You gain the Life Boost hex, and your
  familiar learns Spirit Link.\nLesson of Protection You gain the Blood Ward hex;
  your familiar learns Mystic Armor.\nLesson of Vengeance You gain the Needle of Vengeance
  hex, and your familiar learns Phantom Pain.\n\t•\tUncommon\nLesson of Calamity:
  You gain the Stumbling Curse hex, and your familiar learns Ill Omen.\nGREATER LESSONS\nYou
  can select from these lessons when a feat or other effect grants you a greater lesson.\nLesson
  of Mischief You gain the Deceiver's Cloak hex, and your familiar learns Mad Monkeys.\nLesson
  of Shadow You gain the Malicious Shadow hex, and your familiar learns Chilling Darkness.\nLesson
  of Snow You gain the Personal Blizzard hex, and your familiar learns Wall of Wind.\nLesson
  of Favors You gain the Return the Favor hex, and your familiar learns Mind of Menace.\nLesson
  of Decay All living things eventually decay, feeding fungus and insect. You gain
  the Mycological Malady hex, and your familiar learns Insect Form.\nLesson of the
  Flock Power flows when many work as one. You gain the Sheltering Wings hex, and
  your familiar learns Levitate.\nLesson of the Shark Learn the ways of this deadly
  oceanic predator. You gain the Blood in the Water hex, and your familiar learns
  Feet to Fins.\nMAJOR LESSONS\nYou can select from these lessons when a feat or other
  effect grants you a major lesson.\nLesson of Bargains You gain the Over the Coals
  hex, and your familiar learns Subconscious Suggestion.\nLesson of Death You gain
  the Curse of Death hex, and your familiar learns Raise Dead.\nLesson of Renewal
  You gain the Restorative Moment hex, and your familiar learns Field of Life.\n\t•\tRare\nLesson
  of Frozen Queen You gain the Glacial Heart hex and your familiar learns Wall of
  Ice."
