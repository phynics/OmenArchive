  of the Flock Power flows when many work as one. You gain the Sheltering Wings hex,
  and your familiar learns [Levitate](omen://spell/levitate?source=paizo-pathfinder-player-core).\nLesson
  of the Shark Learn the ways of this deadly oceanic predator. You gain the Blood
  in the Water hex, and your familiar learns [Feet to Fins](omen://spell/feet-to-fins?source=paizo-pathfinder-player-core).\nMAJOR
  LESSONS\nYou can select from these lessons when a feat or other effect grants you
