name: school of ars grammatica
level: 1
traits:
- wizard
description: "Runes and wards, numbers and letters—they underpin all magic, making
  them the logical subject for a wizard who studies fundamental forces. Perhaps you
  studied at the Pathfinder Society's School of Spells or a similar institution, but
  whether you're lacing your words with magic to compel others, casting wards around
  your workshop, or destabilizing the very structure of an opponent's spells, you
  know this unassuming school carries elegant power.\nCurriculum\n\t•\tcantrips: Message,
  Sigil\n\t•\t1st: Command, Disguise Magic, Runic Body, Runic Weapon\n\t•\t2nd: Dispel
  Magic, Translate\n\t•\t3rd: Enthrall, Veil of Privacy\n\t•\t4th: Dispelling Globe,
  Suggestion\n\t•\t5th: Sending, Truespeech\n\t•\t6th: Repulsion, Spellwrack\n\t•\t7th:
  Contingency, Planar Seal\n\t•\t8th: Quandary, Unrelenting Observation\n\t•\t9th:
  Detonate Magic\nSchool Spells initial: Protective Wards; advanced: Rune of Observation"
