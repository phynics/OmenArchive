description: "The uninitiated often think of wizards as cerebral, focused on their
  studies more than the body, yet your school of magic taught of the relationship
  between the two. Your magic, whether learned at a storied institution like Kintargo's
  Alabaster Academy or someplace more sinister, like the Fleshforges of Nex, focuses
  on the ways that living matter can be convinced into another shape for a time, allowing
  you to polymorph a seed into a vine, a human into a beast, or a harmless germ into
  a deadly toxin.\nCurriculum\n\t•\tcantrips: Gouging Claw, Tangle Vine\n\t•\t1st:
  Jump, Pest Form, Spider Sting\n\t•\t2nd: Enlarge, Humanoid Form\n\t•\t3rd: Feet
  to Fins, Vampiric Feast\n\t•\t4th: Mountain Resilience, Vapor Form\n\t•\t5th: Elemental
  Form, Toxic Cloud\n\t•\t6th: Cursed Metamorphosis, Petrify\n\t•\t7th: Duplicate
  Foe, Fiery Body\n\t•\t8th: Desiccate, Monstrosity Form\n\t•\t9th: Metamorphosis\nSchool
  Spells initial: Scramble Body; advanced: Shifting Form"
