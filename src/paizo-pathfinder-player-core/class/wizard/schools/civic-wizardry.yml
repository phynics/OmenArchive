- wizard
description: "Whether you studied in Manaket's Occularium or the Academy of Applied
  Magic, you learned that the fruits of arcane studies—like any other field—should
  ultimately help the common citizen. You've learned the humble art of construction,
  of finding lost people and things, of moving speedily among buildings and moats—yet
  these same arts can be turned to demolition, and the constructs you animate to build
  bridges can just as easily tear them down.\nCurriculum\n\t•\tcantrips: Prestidigitation,
  Read Aura\n\t•\t1st: Hydraulic Push, Pummeling Rubble, Summon Construct\n\t•\t2nd:
  Revealing Light, Water Walk\n\t•\t3rd: Cozy Cabin, Safe Passage\n\t•\t4th: Creation,
  Unfettered Movement\n\t•\t5th: Control Water, Wall of Stone\n\t•\t6th: Disintegrate,
  Wall of Force\n\t•\t7th: Planar Palace, Retrocognition\n\t•\t8th: Earthquake, Pinpoint\n\t•\t9th:
  Foresight\nSchool Spells initial: Earthworks; advanced: Community Restoration"
