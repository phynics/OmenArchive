name: school of battle magic
level: 1
traits:
- wizard
description: "Magic is power, and there are always those who will use power for the
  art of battle. You may have studied in the military of a nation of the brink of
  war—Cheliax and Andoran perhaps, or Geb and Nex. You summon whirling energies that
  can lay waste to both soldiers and armies, while being sure not to neglect arcane
  countermeasures for common tactical complications or the shields and defenses that
  keep combatants alive on the battlefield.\nCurriculum\n\t•\tcantrips: Shield, Telekinetic
  Projectile\n\t•\t1st: Breathe Fire, Force Barrage, Mystic Armor\n\t•\t2nd: Mist,
  Resist Energy\n\t•\t3rd: Earthbind, Fireball\n\t•\t4th: Wall of Fire, Weapon Storm\n\t•\t5th:
  Howling Blizzard, Impaling Spike\n\t•\t6th: Chain Lightning, Disintegrate\n\t•\t7th:
  Energy Aegis, True Target\n\t•\t8th: Arctic Rift, Desiccate\n\t•\t9th: Falling Stars\nSchool
  Spells initial: Force Bolt; advanced: Energy Absorption"
