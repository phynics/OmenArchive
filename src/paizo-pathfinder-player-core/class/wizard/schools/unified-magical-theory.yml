---
name: school of unified magical theory
level: 1
traits:
- wizard
description: 'You eschew the idea that magic can be neatly expressed by the teachings
  of any single school or college, instead directing your self-study to pick up the
  best of every school of magic. In doing so, you''ll find the truths that lie at
  the intersection of each school, coming closer to the ideal nature of arcane magic.
  One day, you''ll uncover that single elegant theory detailing all magic (perhaps
  a theory bearing your name?), but until then, your studies continue.

  No Curriculum You don''t have a set curriculum, and so you don''t have curriculum
  spells and can''t benefit from abilities that specifically affect them. Instead,
  you gain an additional 1st-level wizard class feat, and you add one 1st-rank spell
  of your choice to your spellbook to represent your diverse studies.

  Your studies into the very nature of magic itself have let you use it more efficiently—instead
  of using Drain Bonded Item only once per day, you can use it once per day for each
  rank of spell you can cast, recalling a spell of that rank each time.

  School Spells initial: Hand of the Apprentice; advanced: Interdisciplinary Incantation'
