description: "As a scholar, you know all too well the importance of a sound mind.
  Thus, you attended a school—like the Farseer Tower or the Stone of the Seers—that
  taught the arts of befuddling lesser minds with figments and illusions or implanted
  sensations and memories.\nCurriculum\n\t•\tcantrips: Daze, Figment\n\t•\t1st: Dizzying
  Colors, Sleep, Sure Strike\n\t•\t2nd: Illusory Creature, Stupefy\n\t•\t3rd: Dream
  Message, Mind Reading\n\t•\t4th: Nightmare, Vision of Death\n\t•\t5th: Hallucination,
  Illusory Scene\n\t•\t6th: Never Mind, Phantasmal Calamity\n\t•\t7th: Project Image,
  Warp Mind\n\t•\t8th: Disappearance, Uncontrollable Dance\n\t•\t9th: Phantasmagoria\nSchool
  Spells initial: Charming Push; advanced: Invisibility Cloak"
