name: school of the boundary
level: 1
traits:
- wizard
description: "Why use your magic to affect something as pedestrian as the physical
  world? Whether you studied at the College of Dimensional Studies in Katapesh or
  an underground school in haunted Ustalav, you've turned your magic past the Universe
  to the forces beyond, summoning spirits and shades, manipulating dimensions and
  planes, and treading in a place not meant for mortals.\nCurriculum\n\t•\tcantrips:
  Telekinetic Hand, Void Warp\n\t•\t1st: Grim Tendrils, Phantasmal Minion, Summon
  Undead\n\t•\t2nd: Darkness, See the Unseen\n\t•\t3rd: Bind Undead, Ghostly Weapon\n\t•\t4th:
  Flicker, Translocate\n\t•\t5th: Banishment, Invoke Spirits\n\t•\t6th: Teleport,
  Vampiric Exsanguination\n\t•\t7th: Eclipse Burst, Interplanar Teleport\n\t•\t8th:
  Quandary, Unrelenting Observation\n\t•\t9th: Massacre\nSchool Spells initial: Fortify
  Summoning; advanced: Spiral of Horrors"
