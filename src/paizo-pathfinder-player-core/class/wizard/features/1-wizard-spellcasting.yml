---
action: {}
description: 'Through dedicated study and practice, you can construct spells with
  academic rigor by shaping arcane magic. You are a spellcaster, and you can cast
  spells of the arcane tradition using the Cast a Spell activity. As a wizard, when
  you cast spells, your incantations likely specify exactly what forces you call on
  and how to shape them, and your gestures precisely shape and direct your magic while
  circles of arcane runes flare to life.

  At 1st level, you can prepare up to two 1st-rank spells and five cantrips each morning
  from the spells in your spellbook (see below), as well as one extra curriculum cantrip
  and one extra curriculum spell of each rank you can cast from your arcane school.
  Prepared spells remain available to you until you cast them or until you prepare
  your spells again. The number of spells you can prepare is called your spell slots.

  As you increase in level as a wizard, the number of spells you can prepare each
  day increases, as does the highest rank of spell you can cast, as shown in the Wizard
  Spells per Day table.

  Some of your spells require you to attempt a spell attack to see how effective they
  are, or have your enemies roll against your spell DC (typically by attempting a
  saving throw). Since your key attribute is Intelligence, your spell attack modifier
  and spell DC use your Intelligence modifier. Details on calculating these statistics
  appear on page 403.

  Heightening Spells

  When you get spell slots of 2nd rank and higher, you can fill those slots with stronger
  versions of lower-rank spells. This increases the spell''s rank, heightening it
  to match the spell slot. Many spells have specific improvements when they are heightened
  to certain ranks.

  Cantrips

  Some of your spells are cantrips. A cantrip is a special type of spell that doesn''t
  use spell slots. You can cast a cantrip at will, any number of times per day. A
  cantrip is always automatically heightened to half your level rounded up—this is
  usually equal to the highest rank of wizard spell slot you have. For example, as
  a 1st-level wizard, your cantrips are 1st-rank spells, and as a 5th-level wizard,
  your cantrips are 3rd-rank spells.

  Spellbook

  Every arcane spell has a written version, which you record in your personalized
  book of spells. You start with a spellbook worth 10 sp or less, which you receive
  for free and must study each day to prepare your spells. Your spellbook''s form
  and name are up to you. It might be a musty, leather-bound tome or an assortment
  of thin metal disks connected to a brass ring; its name might be esoteric, like
  The Tome of Silent Shadows or something more academic, like Advanced Pyromantic
  Applications of Jalmeri Elemental Theory.

  The spellbook contains your choice of 10 arcane cantrips and five 1st-rank arcane
  spells. You choose these from the common spells on the arcane spell list or from
  other arcane spells you gain access to. You also add two 1st-rank spells from the
  curriculum of your arcane school (except in the case of the school of unified magical
  theory, as described in that school).

  Each time you gain a level, you add two arcane spells to your spellbook, of any
  spell rank for which you have spell slots, chosen from common spells of your tradition
  or others you gain access to. You can also add spells to your spellbook with the
  Learn a Spell activity. When you gain spell slots of a new rank, you also add an
  additional spell from your school''s curriculum (unless it''s the school of unified
  magical theory).'
level: 1
mechanicsScope: builder
