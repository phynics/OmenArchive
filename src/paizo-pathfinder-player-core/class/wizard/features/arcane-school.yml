---
name: arcane school
level: 1
traits:
- wizard
description: 'Most wizards acquire their knowledge of spells from a formal educational
  institution, such as the Arcanamirium or the Magaambya. At 1st level, you choose
  your arcane school, which grants you magical abilities.

  You gain additional spells and spell slots from the curriculum taught at the school
  you attended. Some wizards follow the school of unified magical theory, which attempts
  to forge a new school by studying independently and drawing information from a multitude
  of texts and tutors. Though a wizard with this approach lacks the focus of formal
  training, they have greater flexibility.'
