---
name: druid spellcasting
level: 1
traits:
- druid
description: 'The power of the wild world flows through you. You are a spellcaster
  and can cast spells of the primal tradition using the Cast a Spell activity. As
  a druid, your spellcasting incantations might be pleas to the environment around
  you or the invocation of ancient vows; your hands might sway like willows or curl
  into clawlike shapes as your gestures direct your magic. At 1st level, you can prepare
  two 1st-rank spells and five cantrips each morning from the common spells on the
  primal spell list, or from other primal spells to which you gain access and learn
  via Learn a Spell. Prepared spells remain available to you until you cast them or
  until you prepare your spells again. The number of spells you can prepare each day
  is called your spell slots.

  As you increase in level as a druid, the number of spells you can prepare each day
  increases, as does the highest rank of spell you can cast, as shown in the Druid
  Spells per Day table.

  Some of your spells require you to attempt a spell attack to see how effective they
  are, or have your enemies roll against your spell DC (typically by attempting a
  saving throw). Since your key attribute is Wisdom, your spell attack modifier and
  spell DC use your Wisdom modifier.

  Heightening Spells

  When you get spell slots of 2nd rank and higher, you can fill those slots with stronger
  versions of lower-rank spells. This increases the spell''s rank, heightening it
  to match the spell slot. Many spells have specific improvements when they are heightened
  to certain ranks.

  Cantrips

  Some of your spells are cantrips. A cantrip is a special type of spell that doesn''t
  use spell slots. You can cast a cantrip at will, any number of times per day. A
  cantrip is always automatically heightened to half your level rounded up—this is
  usually equal to the highest rank of druid spell slot you have. For example, as
  a 1st-level druid, your cantrips are 1st-rank spells, and a 5th-level druid''s are
  3rd rank.'
