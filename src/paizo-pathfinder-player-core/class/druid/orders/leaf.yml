  for the wilderness. With your leshy familiar at your side, you help areas regrow
  after disasters or negligent expansion and turn flora against those who would abuse
  them.

  Order Skill Diplomacy

  Druid Feat Leshy Familiar

  Order Spell Cornucopia

  Anathema Commit wanton cruelty to plants or fungi or kill them unnecessarily. (This
  doesn''t prevent you from defending yourself or harvesting them for survival.)'
