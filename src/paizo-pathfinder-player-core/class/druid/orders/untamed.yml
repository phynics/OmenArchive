name: untamed order
level: 1
traits:
- druid
description: 'The uncontrollable call of the natural world courses through your body.
  You might have been raised by a wild animal, or you might have come to reject the
  artifices of cities after growing up in one. Now, primal magic grants you the ability
  to wear the form of an untamed creature.

  Order Skill Intimidation

  Druid Feat Untamed Form

  Order Spell Untamed Shift

  Anathema Become fully domesticated by the temptations of civilization. (This doesn''t
  prevent you from buying and using processed goods or staying in a city for an adventure,
  but you can never come to rely on these conveniences or truly call such a place
  your permanent home.)'
