---
name: untamed order
level: 1
traits:
- druid
description: 'The uncontrollable call of the natural world courses through your body.
  You might have been raised by a wild animal, or you might have come to reject the
  artifices of cities after growing up in one. Now, primal magic grants you the ability
  to wear the form of an untamed creature.

  Order Skill Intimidation

  Druid Feat [Untamed Form](omen://feat/untamed-form)

  Order Spell [Untamed Shift](omen://spell/untamed-shift)

  Anathema Become fully domesticated by the temptations of civilization. \(This doesn''t
  prevent you from buying and using processed goods or staying in a city for an adventure,
  but you can never come to rely on these conveniences or truly call such a place
  your permanent home.\)'
mechanicsScope: builder
foundryID: v0EjtiwdeMj8ykI0
rules:
- key: druid-focus-spells-source
  effect: spellcasting/configure-source
  inputs:
    source: druid-focus-spells
    sourceName: Druid Focus Spells
    castingKind: focus
    tradition: primal
    attribute: wisdom
- key: untamed-shift-focus-spell
  effect: spellcasting/grant-focus-spell@2
  inputs:
    source: druid-focus-spells
    spell: '@spell.untamed-shift'
- key: intimidation-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: intimidation
    rank: trained
- key: untamed-form-feat
  effect: core/add-feat@3
  inputs:
    feat: '@feat.untamed-form'
