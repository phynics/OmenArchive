---
name: bulk
description: Bulk measures how awkward an item is to carry. An item can have a number
  for its Bulk, light Bulk (L), or negligible Bulk (-). Ten light items count as 1
  Bulk. Add up the Bulk of everything you carry. You become encumbered when the total
  is more than 5 plus your Strength modifier, and you can't carry more than 10 plus
  your Strength modifier. While encumbered, you are clumsy 1 and take a -10-foot penalty
  to all your Speeds.
