---
name: bulk
description: 'Carrying especially heavy or unwieldy items can make it more difficult
  for you to move, as can overloading yourself with too much gear. The Bulk value
  of an item reflects how difficult the item is to handle, representing its size,
  weight, and general awkwardness. If you have a high Strength modifier, you usually
  don’t need to worry about Bulk unless you’re carrying numerous substantial items.


  Your character''s maximum Bulk determines how much weight they can comfortably carry.
  If they''re carrying a total amount of Bulk that exceeds 5 plus their Strength modifier,
  they are encumbered. A character can''t carry a total amount of Bulk that exceeds
  10 plus their Strength modifier. The Bulk your character is carrying equals the
  sum of all of their items; keep in mind that 10 light items make up 1 Bulk.


  While you''re encumbered, you''re clumsy 1 and take a 10-foot penalty to all your
  Speeds. As with all penalties to your Speed, this can''t reduce your Speed below
  5 feet.'
attribution: {page: 269}
