---
name: cover
description: Cover is the protection a creature gets from an obstacle between it and
  an attacker. Lesser cover gives a +1 circumstance bonus to AC. Standard cover gives
  a +2 circumstance bonus to AC and to Reflex saves against area effects, and to Stealth
  checks to Hide, Sneak or otherwise avoid detection. Greater cover gives a +4 circumstance
  bonus to the same. A creature behind standard cover can Take Cover to get greater
  cover against ranged attacks and area effects.
