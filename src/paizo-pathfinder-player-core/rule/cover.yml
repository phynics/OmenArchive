name: cover
description: 'When you''re behind an obstacle that could block weapons, guard you
  against explosions, and make you harder to detect, you''re behind cover. Standard
  cover gives you a +2 circumstance bonus to AC, to Reflex saves against area effects,
  and to Stealth checks to Hide, Sneak, or otherwise avoid detection. You can increase
  this to greater cover using the Take Cover basic action, increasing the circumstance
  bonus to +4. If cover is especially light, typically when it''s provided by a creature,
  you have lesser cover, which grants a +1 circumstance bonus to AC. A creature with
  standard cover or greater cover can attempt to use Stealth to Hide, but lesser cover
  isn''t sufficient.


  Lesser cover: +1 to AC; you can''t Hide behind it.

  Standard cover: +2 to AC, Reflex saves and Stealth; you can Hide.

  Greater cover: +4 to AC, Reflex saves and Stealth; you can Hide.


  Cover is relative, so you might simultaneously have cover against one creature and
  not another. Cover applies only if your path to the target is partially blocked.
  If a creature is entirely behind a wall or the like, you don''t have line of effect
  and typically can''t target it at all.


  Usually, the GM can quickly decide whether your target has cover. If you''re uncertain
  or need to be more precise, draw a line from the center of your space to the center
  of the target''s space. If that line passes through any terrain or object that would
  block the effect, the target has standard cover (or greater cover if the obstruction
  is extreme or the target has Taken Cover). If the line passes through a creature
  instead, the target has lesser cover. When measuring cover against an area effect,
  draw the line from the effect''s point of origin to the center of the creature''s
  space. See the diagram for examples.'
