---
name: counteracting
description: 'Some effects try to counteract spells, afflictions, conditions, or other
  effects. Counteract checks compare the power of two forces and determine which defeats
  the other. Successfully counteracting an effect disrupts it, preventing it from
  having any effect, unless noted otherwise.


  When attempting a counteract check, add the relevant skill modifier or other appropriate
  modifier to your check against the target''s DC. If you''re counteracting an affliction,
  the DC is in the affliction''s stat block. If it''s a spell, use the caster''s DC.
  The GM can also calculate a DC based on the target effect''s level. For spells,
  the counteract check modifier is your spellcasting attribute modifier plus your
  spellcasting proficiency bonus, plus any bonuses and penalties that specifically
  apply to counteract checks.


  What you can counteract depends on the check result and the target''s counteract
  rank. If an effect is a spell, its rank is the counteract rank. Otherwise, halve
  its level and round up to determine its counteract rank (minimum counteract rank
  0). If an effect''s level is unclear and it came from a creature, halve and round
  up the creature''s level.


  Critical Success Counteract the target if its counteract rank is no more than 3
  higher than your effect''s counteract rank.

  Success Counteract the target if its counteract rank is no more than 1 higher than
  your effect''s counteract rank.

  Failure Counteract the target if its counteract rank is lower than your effect''s
  counteract rank.

  Critical Failure You fail to counteract the target.


  Counteract Table

  This table provides a reference for what an effect can counteract based on its rank
  and the check result. The first number in each column is the counteract rank at
  which you can counteract an effect based on your degree of success. The numbers
  in parentheses are the typical level range corresponding to that rank.

  Counteract rank 0: failure —, success 1 (1 to 2), critical success 3 (5 to 6).

  Counteract rank 1: failure 0 (–1 to 0), success 2 (3 to 4), critical success 4 (7
  to 8).

  Counteract rank 2: failure 1 (1 to 2), success 3 (5 to 6), critical success 5 (9
  to 10).

  Counteract rank 3: failure 2 (3 to 4), success 4 (7 to 8), critical success 6 (11
  to 12).

  Counteract rank 4: failure 3 (5 to 6), success 5 (9 to 10), critical success 7 (13
  to 14).

  Counteract rank 5: failure 4 (7 to 8), success 6 (11 to 12), critical success 8
  (15 to 16).

  Counteract rank 6: failure 5 (9 to 10), success 7 (13 to 14), critical success 9
  (17 to 18).

  Counteract rank 7: failure 6 (11 to 12), success 8 (15 to 16), critical success
  10 (19 to 20).

  Counteract rank 8: failure 7 (13 to 14), success 9 (17 to 18), critical success
  11 (21 to 22).

  Counteract rank 9: failure 8 (15 to 16), success 10 (19 to 20), critical success
  12 (23 to 24).

  Counteract rank 10: failure 9 (17 to 18), success 11 (21 to 22), critical success
  13 (25 to 26).'
