---
name: counteracting
description: Some abilities try to end the effect of another ability, spell or condition.
  To counteract, compare the result of the counteract check to the level or rank of
  the effect you want to counteract. A counteract check uses the proficiency and modifier
  of the ability that counteracts. The counteract level is double the rank for a spell,
  or the level of the source otherwise. On a critical success, you counteract the
  effect if its level is no more than 3 higher than your counteract level. On a success,
  if its level is no more than 1 higher. On a failure, if its level is lower. On a
  critical failure, you do not counteract it.
