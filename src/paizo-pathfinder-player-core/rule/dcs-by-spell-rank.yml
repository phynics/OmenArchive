---
name: dcs by spell rank
description: 'When a spell calls for a DC that isn''t set by a caster, use the DC
  for the rank of the spell: rank 1, DC 15; rank 2, DC 18; rank 3, DC 20; rank 4,
  DC 23; rank 5, DC 26; rank 6, DC 28; rank 7, DC 31; rank 8, DC 34; rank 9, DC 36;
  rank 10, DC 40. These are the usual DCs for a task that needs a spell of that rank
  to attempt, such as identifying or counteracting its effect.'
