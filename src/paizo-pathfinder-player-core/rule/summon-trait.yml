---
name: summon trait
description: A spell or ability with the summon trait calls a creature to fight alongside
  you. The summoned creature appears in an unoccupied space within the spell's range,
  is your ally, and has the minion and summoned traits. As a minion, it acts only
  when you spend an action to command it, and then it gets 2 actions. It remains until
  the duration ends or it is reduced to 0 Hit Points.
