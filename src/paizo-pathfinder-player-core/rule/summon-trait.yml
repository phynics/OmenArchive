---
name: summon trait
description: 'Spells with the summon trait can conjure creatures, typically ones with
  a particular trait. Such creatures can be found in Monster Core and similar books.
  Unless noted otherwise, the creature must be common, it gains the summoned trait,
  and it must appear in an unoccupied space in range large enough to contain it. The
  highest level of creature the spell can summon depends on the rank of the spell,
  as listed below. The spell can still summon a creature of a lower level if you so
  choose. These rules apply only to spells that have the summon trait; other spells
  that call or conjure items or beings but that don''t have the trait, like summon
  instrument, work as explained in the spell.


  1st rank: maximum creature level -1.

  2nd rank: maximum creature level 1.

  3rd rank: maximum creature level 2.

  4th rank: maximum creature level 3.

  5th rank: maximum creature level 5.

  6th rank: maximum creature level 7.

  7th rank: maximum creature level 9.

  8th rank: maximum creature level 11.

  9th rank: maximum creature level 13.

  10th rank: maximum creature level 15.'
attribution: {page: 360}
