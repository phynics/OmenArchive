---
name: degrees of success
description: 'Many checks have four possible results, called degrees of success: critical
  success, success, failure and critical failure. Compare the result of a check to
  its DC. If the result meets or beats the DC, it is a success. If the result is 10
  or more above the DC, the degree of success improves by one step. If the result
  is below the DC, it is a failure. If it is 10 or more below the DC, the degree of
  success worsens by one step. A natural 20 improves the degree of success by one
  step, and a natural 1 worsens it by one step, after that comparison. An effect that
  changes a degree of success by one step moves it one place along critical failure,
  failure, success, critical success, and never past either end.'
