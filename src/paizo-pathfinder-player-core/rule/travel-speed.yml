---
name: travel speed
description: Travel Speed is the distance a creature covers when it moves at a steady
  pace over a long time. A creature that moves at a Speed of 10 feet travels about
  1 mile per hour, or 8 miles in a day of 8 hours, and every additional 5 feet of
  Speed adds half a mile per hour. A creature with a Speed of 20 feet travels 2 miles
  per hour, one with 25 feet 2 1/2 miles per hour, and one with 30 feet 3 miles per
  hour, or 24 miles in 8 hours. Difficult terrain halves a creature's Travel Speed,
  and greater difficult terrain reduces it to a third.
