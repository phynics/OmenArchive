---
name: travel speed
description: 'Depending on how the GM tracks movement, you move in feet or miles based
  on your character’s Speed with the relevant movement type. Typical rates are on
  the table below.


  Speed 10 feet: 100 feet per minute, 1 mile per hour, 8 miles per day.

  Speed 15 feet: 150 feet per minute, 1-1/2 miles per hour, 12 miles per day.

  Speed 20 feet: 200 feet per minute, 2 miles per hour, 16 miles per day.

  Speed 25 feet: 250 feet per minute, 2-1/2 miles per hour, 20 miles per day.

  Speed 30 feet: 300 feet per minute, 3 miles per hour, 24 miles per day.

  Speed 35 feet: 350 feet per minute, 3-1/2 miles per hour, 28 miles per day.

  Speed 40 feet: 400 feet per minute, 4 miles per hour, 32 miles per day.

  Speed 50 feet: 500 feet per minute, 5 miles per hour, 40 miles per day.

  Speed 60 feet: 600 feet per minute, 6 miles per hour, 48 miles per day.


  The rates in the table assume traveling over flat and clear terrain at a determined
  pace, but one that’s not exhausting. Moving through difficult terrain halves the
  listed movement rate. Greater difficult terrain reduces the distance traveled to
  one-third the listed amount. If the travel requires a skill check to accomplish,
  such as mountain climbing or swimming, the GM might call for a check once per hour
  using the result and the table above to determine your progress.'
attribution: {page: 438}
