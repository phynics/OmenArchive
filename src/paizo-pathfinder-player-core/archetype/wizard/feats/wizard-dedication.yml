---
name: wizard dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
- multiclass
prerequisites:
- text: Intelligence +2
  hasAttributeModifier: {attribute: intelligence, modifier: 2}
- text: not a member of the wizard class
  anyOf:
  - hasClassWithName: alchemist
  - hasClassWithName: barbarian
  - hasClassWithName: bard
  - hasClassWithName: champion
  - hasClassWithName: cleric
  - hasClassWithName: druid
  - hasClassWithName: fighter
  - hasClassWithName: investigator
  - hasClassWithName: monk
  - hasClassWithName: oracle
  - hasClassWithName: ranger
  - hasClassWithName: rogue
  - hasClassWithName: sorcerer
  - hasClassWithName: swashbuckler
  - hasClassWithName: witch
description: You cast spells like a wizard, gaining a spellbook with four common arcane
  cantrips of your choice. You gain the [Cast a Spell](omen://action/cast-a-spell)
  activity. You can prepare two cantrips each day from your spellbook. You're trained
  in the spell attack modifier and spell DC statistics. Your key spellcasting attribute
  for wizard archetype spells is Intelligence, and they are arcane wizard spells.
  You become trained in Arcana; if you were already trained in Arcana, you instead
  become trained in a skill of your choice. Select a school; you don't gain any abilities
  from your choice of school, but qualify for feats as a member.
mechanicsScope: builder
foundryID: oQ6EZRFXbHWCx08C
rules:
- key: archetype-source
  effect: spellcasting/configure-source
  inputs:
    source: wizard-archetype-spells
    sourceName: Wizard Archetype Spells
    castingKind: prepared
    tradition: arcane
    attribute: intelligence
- key: archetype-spellcasting-trained
  effect: spellcasting/increase-spell-proficiency@2
  inputs:
    rank: trained
- key: archetype-cantrip-slots
  effect: spellcasting/grant-slot
  inputs:
    source: wizard-archetype-spells
    spellRank: 0
    count: 2
- key: archetype-cantrips
  effect: spellcasting/allow-known-spells
  inputs:
    source: wizard-archetype-spells
    count: 4
    pick: cantrip
    filter:
      all:
      - {type: spell}
      - {spell.tradition: arcane}
      - {rarity: common}
- key: choice-wizard-school
  choice:
    name: $.wizard.school
    label: School
    type: core/feature-id
    records: {filter: {pathPrefix: '@class.wizard.schools'}}
- key: arcana-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: arcana
    rank: trained
