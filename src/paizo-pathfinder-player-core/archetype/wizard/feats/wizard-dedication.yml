action: {}
description: 'You cast spells like a wizard, gaining a spellbook with four common
  arcane cantrips of your choice. You gain the Cast a Spell activity. You can prepare
  two cantrips each day from your spellbook. You''re trained in the spell attack modifier
  and spell DC statistics. Your key spellcasting attribute for wizard archetype spells
  is Intelligence, and they are arcane wizard spells. You become trained in Arcana;
  if you were already trained in Arcana, you instead become trained in a skill of
  your choice. Select a school; you don''t gain any abilities from your choice of
  school, but qualify for feats as a member.

  Wizard'
