---
name: basic wizard spellcasting
level: 4
rarity: common
type: archetype
traits:
- archetype
prerequisites:
- text: Wizard Dedication
  has: '@archetype.wizard.feats.wizard-dedication'
description: You gain the Basic Spellcasting Feat benefits. Each time you gain a spell
  slot of a new rank from the wizard archetype, add two common spells of that rank
  to your spellbook.
mechanicsScope: builder
foundryID: SHUfHzElHZPXJFiP
rules:
- key: slot-4-1
  effect: spellcasting/grant-slot
  level: 4
  inputs:
    source: wizard-archetype-spells
    spellRank: 1
    count: 1
- key: known-4-spell-1
  effect: spellcasting/allow-known-spells
  level: 4
  inputs:
    source: wizard-archetype-spells
    count: 2
    pick: {rank: 1}
    filter:
      all:
      - {type: spell}
      - {spell.tradition: arcane}
      - {rarity: common}
- key: slot-6-2
  effect: spellcasting/grant-slot
  level: 6
  inputs:
    source: wizard-archetype-spells
    spellRank: 2
    count: 1
- key: known-6-spell-2
  effect: spellcasting/allow-known-spells
  level: 6
  inputs:
    source: wizard-archetype-spells
    count: 2
    pick: {rank: 2}
    filter:
      all:
      - {type: spell}
      - {spell.tradition: arcane}
      - {rarity: common}
- key: slot-8-3
  effect: spellcasting/grant-slot
  level: 8
  inputs:
    source: wizard-archetype-spells
    spellRank: 3
    count: 1
- key: known-8-spell-3
  effect: spellcasting/allow-known-spells
  level: 8
  inputs:
    source: wizard-archetype-spells
    count: 2
    pick: {rank: 3}
    filter:
      all:
      - {type: spell}
      - {spell.tradition: arcane}
      - {rarity: common}
