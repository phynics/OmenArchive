---
name: master wizard spellcasting
level: 18
rarity: common
type: archetype
traits:
- archetype
prerequisites:
- text: Expert Wizard Spellcasting
  has: '@archetype.wizard.feats.expert-wizard-spellcasting'
- text: legendary in Arcana
  hasSkillProficiency: {skill: arcana, rank: legendary}
description: You gain the Master Spellcasting Feat benefits.
mechanicsScope: builder
foundryID: PMckhnGYMyiwUNiL
rules:
- key: archetype-spellcasting-master
  effect: spellcasting/increase-spell-proficiency@2
  level: 18
  inputs:
    rank: master
- key: slot-18-7
  effect: spellcasting/grant-slot
  level: 18
  inputs:
    source: wizard-archetype-spells
    spellRank: 7
    count: 1
- key: known-18-spell-7
  effect: spellcasting/allow-known-spells
  level: 18
  inputs:
    source: wizard-archetype-spells
    count: 2
    pick: {rank: 7}
    filter:
      all:
      - {type: spell}
      - {spell.tradition: arcane}
      - {rarity: common}
- key: slot-20-8
  effect: spellcasting/grant-slot
  level: 20
  inputs:
    source: wizard-archetype-spells
    spellRank: 8
    count: 1
- key: known-20-spell-8
  effect: spellcasting/allow-known-spells
  level: 20
  inputs:
    source: wizard-archetype-spells
    count: 2
    pick: {rank: 8}
    filter:
      all:
      - {type: spell}
      - {spell.tradition: arcane}
      - {rarity: common}
