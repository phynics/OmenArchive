---
name: ranger dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
- multiclass
prerequisites:
- text: Dexterity +2
  hasAttributeModifier: {attribute: dexterity, modifier: 2}
description: You become trained in Survival; if you were already trained in Survival,
  you instead become trained in another skill of your choice. You become trained in
  ranger class DC. If you gain a warden spell through this archetype, you become trained
  in spell attacks and spell DCs. Your spellcasting attribute is Wisdom. You can use
  the [Hunt Prey](omen://action/hunt-prey) action.
mechanicsScope: mixed
unsupportedCategory: benefit
unsupportedReason: What the dedication trains (class DC, spell attack and DC) is modeled.
  The rest of it is not yet.
foundryID: R00qiDE5pBctgtyU
rules:
- key: choice-ranger-class-dc-attribute
  choice:
    name: $.ranger.class-dc-attribute
    label: Ranger class DC attribute
    type: core/attribute
    cases: [strength, dexterity]
- key: dedication-class-dc
  effect: core/add-class-dc@2
  inputs:
    rank: trained
    className: ranger
    keyAttribute: {choice: $.ranger.class-dc-attribute}
- key: dedication-spell-proficiency
  effect: spellcasting/increase-spell-proficiency@2
  inputs:
    rank: trained
