  ranger class DC. If you gain a warden spell through this archetype, you become trained
  in spell attacks and spell DCs. Your spellcasting attribute is Wisdom. You can use
  the [Hunt Prey](omen://action/hunt-prey?source=paizo-pathfinder-player-core) action.

  [Ranger](omen://archetype/ranger?source=paizo-pathfinder-player-core)'
mechanicsScope: mixed
