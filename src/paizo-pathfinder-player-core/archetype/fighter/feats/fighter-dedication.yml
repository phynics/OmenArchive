---
name: fighter dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
- multiclass
prerequisites:
- text: Strength +2
  hasAttributeModifier: {attribute: strength, modifier: 2}
- text: Dexterity +2
  hasAttributeModifier: {attribute: dexterity, modifier: 2}
- text: not a member of the fighter class
  anyOf:
  - hasClassWithName: alchemist
  - hasClassWithName: barbarian
  - hasClassWithName: bard
  - hasClassWithName: champion
  - hasClassWithName: cleric
  - hasClassWithName: druid
  - hasClassWithName: investigator
  - hasClassWithName: monk
  - hasClassWithName: oracle
  - hasClassWithName: ranger
  - hasClassWithName: rogue
  - hasClassWithName: sorcerer
  - hasClassWithName: swashbuckler
  - hasClassWithName: witch
  - hasClassWithName: wizard
description: You become trained in martial weapons. You become trained in your choice
  of Acrobatics or Athletics; if you are already trained in both of these skills,
  you instead become trained in a skill of your choice. You become trained in fighter
  class DC.
mechanicsScope: builder
foundryID: mvNa9KfQooHYEXoA
rules:
- key: choice-fighter-class-dc-attribute
  choice:
    name: $.fighter.class-dc-attribute
    label: Fighter class DC attribute
    type: core/attribute
    cases: [strength, dexterity]
- key: dedication-class-dc
  effect: core/add-class-dc@2
  inputs:
    rank: trained
    className: fighter
    keyAttribute: {choice: $.fighter.class-dc-attribute}
- key: martial-weapons-trained
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {category: martial}
    rank: trained
- key: choice-skill
  level: 2
  choice:
    name: $.feats.fighter-dedication.skill
    label: Skill
    type: core/skill
    cases:
    - {key: acrobatics, value: acrobatics}
    - {key: athletics, value: athletics}
- key: chosen-skill-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: {choice: $.feats.fighter-dedication.skill}
    rank: trained
