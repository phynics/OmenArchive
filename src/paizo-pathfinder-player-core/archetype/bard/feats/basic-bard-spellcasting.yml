---
name: basic bard spellcasting
level: 4
rarity: common
type: archetype
traits:
- archetype
prerequisites:
- text: Bard Dedication
  has: '@archetype.bard.feats.bard-dedication'
description: You gain the Basic Spellcasting Feat benefits. Each time you gain a spell
  slot of a new rank from the bard archetype, add a common occult spell of the appropriate
  rank, or another appropriate occult spell you learned or discovered, to your repertoire.
mechanicsScope: builder
foundryID: NSyzjkDdQU2A75mX
rules:
- key: slot-4-1
  effect: spellcasting/grant-slot
  level: 4
  inputs:
    source: bard-archetype-spells
    spellRank: 1
    count: 1
- key: known-4-spell-1
  effect: spellcasting/allow-known-spells
  level: 4
  inputs:
    source: bard-archetype-spells
    count: 1
    pick: {rank: 1}
    filter:
      all:
      - {type: spell}
      - {spell.tradition: occult}
      - {rarity: common}
