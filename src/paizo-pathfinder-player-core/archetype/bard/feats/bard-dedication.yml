description: You cast spells like a bard and gain the Cast a Spell activity. You gain
  a spell repertoire with two common cantrips from the occult spell list or any other
  occult cantrips you've learned or discovered. You're trained in the spell attack
  modifier and spell DC statistics. Your key spellcasting attribute for bard archetype
  spells is Charisma, and they are occult bard spells. You become trained in Occultism
  and Performance; for each of these skills in which you were already trained, you
  instead become trained in a skill of your choice. Choose a muse as you would if
  you were a bard. You can take that muse's feats, but you don't gain the starting
  feat, spell or any other abilities the choice of muse grants.
