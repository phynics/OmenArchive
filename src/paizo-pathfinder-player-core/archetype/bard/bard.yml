name: "bard"
source:
  publisher: "paizo"
  book: "Pathfinder Player Core"
description: "You are a master of artistry, a scholar of hidden secrets, and a captivating persuader. Using powerful performances, you influence minds and elevate souls to new levels of heroics. You might use your powers to become a charismatic leader, or perhaps you might instead be a counselor, manipulator, scholar, scoundrel, or virtuoso. While your versatility leads some to consider you a beguiling ne'er-do-well and a jack-of-all-trades, it's dangerous to dismiss you as a master of none."
entryFeat: "omen://archetype/bard/feats/bard-dedication?source=paizo-pathfinder-player-core"
