description: 'Traveling far and wide, you picked up basic tactics for surviving on
  the road and in unknown lands, getting by with few supplies and even fewer comforts.
  As an adventurer, you travel still, often into even more dangerous places.

  Choose two attribute boosts. One must be to Constitution or Wisdom, and one is a
  free attribute boost.

  You''re trained in the Survival skill and a Lore skill related to one terrain you
  traveled in (such as Desert Lore or Swamp Lore). You gain the Assurance skill feat
  with Survival.'
