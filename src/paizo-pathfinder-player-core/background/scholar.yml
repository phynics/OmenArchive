---
name: scholar
rarity: common
attributes:
  chooseFrom:
  - intelligence
  - wisdom
  freeBoosts: 1
skillOption:
- arcana
- nature
- occultism
- religion
loreSkill: academia lore
skillFeat: ''
description: 'You have a knack for learning and sequestered yourself from the outside
  world to learn all you could. You read about so many wondrous places and things
  in your books, always dreaming about one day seeing the real things. Eventually,
  that curiosity led you to leave your studies and become an adventurer.

  Choose two attribute boosts. One must be to Intelligence or Wisdom, and one is a
  free attribute boost.

  You''re trained in your choice of the Arcana, Nature, Occultism, or Religion skill,
  and gain the [Assurance](omen://feat/assurance?source=paizo-pathfinder-player-core)
  skill feat in your chosen skill. You''re also trained in the Academia Lore skill.'
mechanicsScope: builder
rules:
- key: add-feat-1
  effect: core/add-feat@2
  inputs:
    featId: '@feat.assurance'
    with:
      $.feat.assurance.skills:
        kind: from
        values:
        - payload:
            kind: arcana
          revision: 1
          typeID: me.atkn.omen.pf2e.playercore/value/skill
        - payload:
            kind: nature
          revision: 1
          typeID: me.atkn.omen.pf2e.playercore/value/skill
        - payload:
            kind: occultism
          revision: 1
          typeID: me.atkn.omen.pf2e.playercore/value/skill
        - payload:
            kind: religion
          revision: 1
          typeID: me.atkn.omen.pf2e.playercore/value/skill
