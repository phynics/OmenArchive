name: scholar
source:
  publisher: paizo
  book: Pathfinder Player Core
description: |
  You have a knack for learning and sequestered yourself from the outside world to learn all you could. You read about so many wondrous places and things in your books, always dreaming about one day seeing the real things. Eventually, that curiosity led you to leave your studies and become an adventurer.
  Choose two attribute boosts. One must be to Intelligence or Wisdom, and one is a free attribute boost.
  You're trained in your choice of the Arcana, Nature, Occultism, or Religion skill, and gain the Assurance skill feat in your chosen skill. You're also trained in the Academia Lore skill.
variants:
  - key: arcana
    attributes:
      freeBoosts: 1
      chooseFrom:
      - intelligence
      - wisdom
    skillOption: arcana
    loreSkill: academia
    skillFeat: assurance(arcana)
  - key: nature
    attributes:
      freeBoosts: 1
      chooseFrom:
      - intelligence
      - wisdom
    skillOption: nature
    loreSkill: academia
    skillFeat: assurance(nature)
  - key: occultism
    attributes:
      freeBoosts: 1
      chooseFrom:
      - intelligence
      - wisdom
    skillOption: occultism
    loreSkill: academia
    skillFeat: assurance(occultism)
  - key: religion
    attributes:
      freeBoosts: 1
      chooseFrom:
      - intelligence
      - wisdom
    skillOption: religion
    loreSkill: academia
    skillFeat: assurance(religion)
