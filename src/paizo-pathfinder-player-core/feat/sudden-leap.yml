description: 'Barbarian You swing at a foe while mid-leap.

  Fighter You make an impressive leap and swing while you soar.

  Make a [Leap](omen://action/leap?source=paizo-pathfinder-player-core), [High Jump](omen://action/high-jump?source=paizo-pathfinder-player-core),
  or [Long Jump](omen://action/long-jump?source=paizo-pathfinder-player-core) and
  attempt one melee Strike at any point during your jump. Immediately after the Strike,
  you fall to the ground if you''re in the air, even if you haven''t reached the maximum
  distance of your jump. If the distance you fall is no more than the height of your
  jump, you take no damage and land upright.

  When attempting a High Jump or Long Jump during a Sudden Leap, determine the jump
  distance using Long Jump''s rules, and change your maximum distance to double your
  Speed.'
specialText: If you have [Felling Strike](omen://feat/felling-strike?source=paizo-pathfinder-player-core),
