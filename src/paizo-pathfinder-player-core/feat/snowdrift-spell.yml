action:
  count: one_action
description: The howling wind and precipitation of your magic turn to thick snow.
  If your next action is to Cast a Spell that has the air, water, or cold trait, and
  that does not have the fire trait, select one creature affected by the spell on
  the ground. Each square on the ground under or adjacent to the creature fills with
  ankle-deep snow. Those squares are difficult terrain until the beginning of your
  next turn. A creature can Interact to clear a square of snow, and the snow in a
  square melts if that square is exposed to a fire effect.
