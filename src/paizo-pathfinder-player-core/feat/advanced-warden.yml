---
name: advanced warden
level: 4
rarity: common
type: class
traits:
- ranger
prerequisites:
- text: Initiate Warden
  hasResourceWithName: initiate warden
repeatPolicy:
  duplicateSelectionRules:
  - lookupName: $.feat.advanced-warden.spell
    valueTypeID: me.atkn.omen.pf2e.playercore-spellcasting/value/spell-id
  instanceLevelGates: []
  maxCount: null
description: 'You unlock more powerful primal spells. You gain your choice of one
  warden spell from the advanced warden spells.

  Animal Feature

  Enlarge Companion

  Hunter''s Luck

  Soothing Mist'
specialText: You can take this feat multiple times, choosing a different advanced
  warden spell each time.
mechanicsScope: builder
foundryID: it2i6OXfGIizokpg
rules:
- key: warden-focus-source
  effect: spellcasting/configure-source
  inputs:
    sourceId: ad075a6c-56ec-5561-ae46-5a8565022188
    sourceName: Ranger Focus Spells
    castingKind: focus
    tradition: primal
    attribute: wis
- key: choice-feat-advanced-warden-spell
  choice:
    name: $.feat.advanced-warden.spell
    label: Warden spell
    records:
      filter:
        all:
        - {type: spell}
        - {spell.category: focus}
        - {trait: classTrait-ranger}
        - {level: 2}
      type: spellcasting/spell-id
- key: grant-warden-spell
  effect: spellcasting/grant-focus-spell
  inputs:
    sourceId: ad075a6c-56ec-5561-ae46-5a8565022188
    spellId: {choice: $.feat.advanced-warden.spell}
- key: warden-spell-proficiency
  effect: spellcasting/increase-spell-proficiency
  prerequisites:
  - hasChoice:
      name: $.feat.advanced-warden.spell
      isSet: true
  inputs:
    proficiency: 2
- key: warden-focus-point
  effect: spellcasting/add-focus-point
  prerequisites:
  - hasChoice:
      name: $.feat.advanced-warden.spell
      isSet: true
