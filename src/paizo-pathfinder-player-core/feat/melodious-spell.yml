action:
  count: one_action
description: 'You subtly weave your spellcasting into a performance. If the next action
  you use is to Cast a Spell, the spell gains the subtle trait, hiding the shining
  runes, sparks of magic, and other manifestations that would usually give away your
  spellcasting. The trait hides only the spell''s spellcasting actions and manifestations,
  not its effects, so an observer might still see a ray streak out from you or see
  you vanish into thin air.

  As part of using Melodious Spell, you can choose to Create a Diversion, Demoralize,
  Perform, or Request. If you do so, the spell you cast must have the auditory, emotion,
  sonic, or visual trait to gain the subtle trait.'
