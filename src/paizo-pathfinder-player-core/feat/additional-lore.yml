    rank: trained
- key: lore-expert
  effect: core/add-skill-increase@2
  level: 3
  inputs:
    skill: {choice: $.feat.additional-lore.lores}
    rank: expert
- key: lore-master
  effect: core/add-skill-increase@2
  level: 7
  inputs:
    skill: {choice: $.feat.additional-lore.lores}
    rank: master
- key: lore-legendary
  effect: core/add-skill-increase@2
  level: 15
  inputs:
    skill: {choice: $.feat.additional-lore.lores}
