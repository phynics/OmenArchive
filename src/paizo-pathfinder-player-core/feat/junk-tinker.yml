action: {}
description: 'You can make useful tools out of even twisted or rusted scraps. When
  using the Crafting skill to Craft, you can make level 0 items, including weapons
  and armor, out of junk. This reduces the Price to one-quarter the usual amount but
  always results in a shoddy item. Shoddy items normally give a penalty, but you don''t
  take this penalty when using shoddy items you made (nor does the worse check penalty
  of shoddy armor you made apply to you).

  You can also incorporate junk to save money while you Craft any item. This grants
  you a discount on the item as if you had spent 1 additional day working to reduce
  the cost, but the item is obviously made of junk. At the GM''s discretion, this
  might affect the item''s resale value depending on the buyer''s tastes.'
