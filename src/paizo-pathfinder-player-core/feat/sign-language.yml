description: 'You learn the sign languages associated with the languages you know,
  allowing you to sign and understand signs. Sign languages typically require both
  hands to convey more complex concepts, and they are visual rather than auditory.

  Sign language is difficult to understand during combat due to the level of attention
  needed, unlike basic gestures like pointing at a foe to suggest a target. Sign language
  is hard to use in areas of low visibility, just like speech is difficult in a noisy
  environment.'
