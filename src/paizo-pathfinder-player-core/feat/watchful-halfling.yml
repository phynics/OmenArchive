  enchantment or possession anyway.

  In addition to using it for skill checks, you can use the [Aid](omen://action/aid?source=paizo-pathfinder-player-core)
  basic action to grant a bonus to another creature''s saving throw or other check
  to overcome enchantment or possession. As usual for Aid, you need to prepare by
  using an action on your turn to encourage the creature to fight against the effect.'
