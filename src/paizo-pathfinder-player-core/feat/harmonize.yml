description: You can perform multiple compositions simultaneously, typically by performing
  in multiple ways at the same time, using special vocal techniques to double your
  voice, or creating occult magic that replicates your song or speech. If your next
  action is to cast a composition, it becomes a harmonized composition. Unlike a normal
  composition, a harmonized composition doesn't end if you cast another composition,
  and you can cast another composition on the same turn as a harmonized one. Casting
  another harmonized composition ends any harmonized composition you already have
  in effect.
