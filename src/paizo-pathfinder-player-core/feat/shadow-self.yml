- text: legendary Stealth
  hasSkillProficiency: {skill: stealth, proficiency: legendary}
action:
  frequency: once per hour
  trigger: You successfully use Stealth to Hide and become Hidden from all your current
    foes, or use Stealth to Sneak and become undetected to all your current foes.
description: You slip from your adversaries' notice and appear to be somewhere else.
  You become Invisible for 1 minute or until you take a hostile action, whichever
  comes first. Choose a location within 10 feet of you. Until your invisibility ends,
  you appear to be hidden in that location to anyone trying to find you. If the searcher
  gets clear evidence that you're not there, they no longer think you're hidden there,
  but they don't discover your actual location.
