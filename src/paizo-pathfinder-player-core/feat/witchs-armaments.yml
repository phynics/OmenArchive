---
name: witch's armaments
level: 1
rarity: common
type: class
traits:
- witch
repeatPolicy:
  maxCount: 3
description: "Your patron's power changes your body to ensure you are never defenseless.
  You gain one of the following unarmed attacks.\n\t•\tEldritch Nails Your nails are
  supernaturally long and sharp. You gain a nails unarmed attack that deals 1d6 slashing
  damage, is in the brawling group, and has the agile and unarmed traits.\n\t•\tIron
  Teeth With a click of your jaw, your teeth transform into long metallic points.
  You gain a jaws unarmed attack that deals 1d8 piercing damage and is in the brawling
  group.\n\t•\tLiving Hair You can instantly grow or shrink your hair, eyebrows, beard,
  or mustache by up to several feet and manipulate your hair for use as a weapon,
  though your control isn't fine enough for more dexterous tasks. You gain a hair
  unarmed attack that deals 1d4 bludgeoning damage; is in the brawling group; and
  has the agile, disarm, finesse, trip, and unarmed traits."
specialText: You can take this feat more than once, gaining a different unarmed attack
  each time.
mechanicsScope: builder
foundryID: XHaxSBOaFMnBbBKt
rules:
- key: unarmed-attack-list
  effect: core/declare-list
  inputs:
    list: $.feats.witchs-armaments.unarmed-attacks
    valueType: core/string
    label: Unarmed Attack
- key: choice-feats-witchs-armaments-unarmed-attack
  choice:
    name: $.feats.witchs-armaments.unarmed-attack
    label: Unarmed Attack
    addTo: $.feats.witchs-armaments.unarmed-attacks
    type: core/string
    cases:
    - key: nails
      value: nails
      effects:
      - key: unarmed-attack-nails
        effect: core/add-to-list
        inputs:
          list: $.strikes.unarmed
          value:
            entry:
              damageDice: {type: core/string, value: 1d6}
              damageType: {type: core/damage-type, value: slashing}
              group: {type: core/weapon-group, value: brawling}
              name: {type: core/string, value: nails}
              traits: {type: core/trait-list, value: [agile, unarmed]}
    - key: teeth
      value: teeth
      effects:
      - key: unarmed-attack-jaws
        effect: core/add-to-list
        inputs:
          list: $.strikes.unarmed
          value:
            entry:
              damageDice: {type: core/string, value: 1d8}
              damageType: {type: core/damage-type, value: piercing}
              group: {type: core/weapon-group, value: brawling}
              name: {type: core/string, value: jaws}
              traits: {type: core/trait-list, value: [unarmed]}
    - key: hair
      value: hair
      effects:
      - key: unarmed-attack-hair
        effect: core/add-to-list
        inputs:
          list: $.strikes.unarmed
          value:
            entry:
              damageDice: {type: core/string, value: 1d4}
              damageType: {type: core/damage-type, value: bludgeoning}
              group: {type: core/weapon-group, value: brawling}
              name: {type: core/string, value: hair}
              traits: {type: core/trait-list, value: [agile, disarm, finesse, trip,
                  unarmed]}
