---
name: sacred ground
level: 4
rarity: common
type: class
traits:
- cleric
- consecration
- divine
- exploration
prerequisites:
- text: harmful font or healing font
  anyOf:
  - hasChoice:
      name: $.cleric.divine-font
      equals: {type: spellcasting/spell-id, value: '@spell.harm'}
  - hasChoice:
      name: $.cleric.divine-font
      equals: {type: spellcasting/spell-id, value: '@spell.heal'}
action:
  frequency: once per 10 minutes
description: You pray continuously for 1 minute to call a subtle shadow of your deity's
  realm over a burst centered on you. It lasts for 10 minutes, and a creature that
  remains in the area for the entire 10 minutes regains Hit Points equal to your level.
  If you have a healing font, this activity has the healing and vitality traits and
  heals living creatures. If you have a harmful font, this activity has the healing
  and void traits and heals undead creatures (or other creatures with void healing).
  Clerics with Versatile Font can choose either or both. It can't damage creatures
  in any case.
mechanicsScope: encounter
foundryID: cnTPUQS7zRiZMUdI
