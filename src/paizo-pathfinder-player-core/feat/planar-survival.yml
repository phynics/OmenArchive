description: You can Subsist using Survival on different planes, even those without
  resources or natural phenomena you normally need. For instance, you can forage for
  food without penalty even if the plane lacks food that could normally sustain you.
  A success on your check to Subsist also prevents damage done by the plane to you
  and anyone else you support with Subsist. This applies only to damage dealt by the
  general conditions of the plane, not smaller hazards.
