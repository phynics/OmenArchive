---
name: trick magic item
level: 1
rarity: common
type: skill
traits:
- general
- manipulate
- skill
prerequisites:
- text: trained in Arcana, Nature, Occultism, or Religion
  anyOf:
  - hasSkillProficiency: {skill: arcana, proficiency: trained}
  - hasSkillProficiency: {skill: nature, proficiency: trained}
  - hasSkillProficiency: {skill: occultism, proficiency: trained}
  - hasSkillProficiency: {skill: religion, proficiency: trained}
action:
  count: one_action
  criticalFailure: You can't use the item, and you can't try to trick it again until
    your next daily preparations.
  failure: You can't use the item or try to trick it again this turn, but you can
    try again on subsequent turns.
  success: For the rest of the current turn, you can spend actions to activate the
    item as if you could normally use it.
description: 'You examine a magic item you normally couldn''t use in an effort to
  fool it and activate it temporarily. For example, this might allow a fighter to
  cast a spell from a wand or allow a wizard to cast a spell that''s not on the arcane
  list using a scroll. You must know what activating the item does, or you can''t
  attempt to trick it.

  Attempt a check using the skill matching the item''s magic tradition, or matching
  a tradition that has the spell on its list, if you''re trying to cast a spell from
  the item. The relevant skills are arcana for arcane, nature for primal, occultism
  for occult, religion for divine, or any of the four for an item that has the magical
  trait and not a tradition trait. The GM determines the DC based on the item''s level
  (possibly adjusted depending on the item or situation).

  If you activate a magic item that requires a spell attack modifier or spell DC and
  you don''t have proficiency in the relevant statistic, use your level as your proficiency
  bonus and the highest of your Intelligence, Wisdom, or Charisma modifiers. If you''re
  a master in the appropriate skill for the item''s tradition, you instead use the
  trained proficiency bonus; if you''re legendary, you instead use the expert proficiency
  bonus.'
mechanicsScope: mixed
foundryID: uR62fVC9FyQAMCO1
