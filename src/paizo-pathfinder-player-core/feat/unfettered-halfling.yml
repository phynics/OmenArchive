description: You were either pressed into indentured servitude or shackled in a prison,
  but you've since escaped and have trained to ensure you'll never be caught again.
  Whenever you roll a success on a check to [Escape](omen://action/escape?source=paizo-pathfinder-player-core)
  or a saving throw against an effect that would impose the [Grabbed](omen://condition/grabbed?source=paizo-pathfinder-player-core),
  [Immobilized](omen://condition/immobilized?source=paizo-pathfinder-player-core),
  or [Restrained](omen://condition/restrained?source=paizo-pathfinder-player-core)
  condition on you, you get a critical success instead. Whenever a creature rolls
  a failure on a check to [Grapple](omen://action/grapple?source=paizo-pathfinder-player-core)
  you, it gets a critical failure instead.
