action: {}
description: 'Your kin have instilled in you an affinity for hard-hitting weapons,
  and you prefer these to more elegant arms. You gain access to all uncommon weapons
  with the dwarf trait. You have familiarity with weapons with the dwarf trait plus
  the battle axe, pick, and warhammer—for the purposes of proficiency, you treat any
  of these that are martial weapons as simple weapons and any that are advanced weapons
  as martial weapons.

  At 5th level, whenever you get a critical hit with one of these weapons, you get
  its critical specialization effect.'
