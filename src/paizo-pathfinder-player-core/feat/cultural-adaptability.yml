---
name: cultural adaptability
level: 5
rarity: common
type: ancestry
traits:
- halfling
description: During your adventures, you've honed your ability to adapt to the culture
  of the predominant ancestry around you. You gain the [Adopted Ancestry](omen://feat/adopted-ancestry?source=paizo-pathfinder-player-core)
  general feat, and you also gain one 1st-level ancestry feat from the ancestry you
  chose for the Adopted Ancestry feat.
mechanicsScope: builder
foundryID: Z56DtGBd3AcZOCeG
rules:
- key: grant-item-1
  effect: core/add-feat@2
  inputs:
    featId: '@feat.adopted-ancestry'
- key: choice-feat-cultural-adaptability-feat
  choice:
    name: $.feat.cultural-adaptability.feat
    label: Ancestry Feat
    prerequisites:
    - $.feat.adopted-ancestry.ancestry
    records:
      filter:
        all:
        - {type: feat}
        - {trait: systemTrait-ancestry}
        - {level: 1}
        - {hasChoiceAncestryTrait: $.feat.adopted-ancestry.ancestry}
      type: core/feat-id
- key: grant-item-2
  effect: core/add-feat@2
  inputs:
    featId: {choice: $.feat.cultural-adaptability.feat}
