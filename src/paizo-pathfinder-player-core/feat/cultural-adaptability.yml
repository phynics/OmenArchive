---
name: cultural adaptability
level: 5
rarity: common
type: ancestry
traits:
- halfling
description: During your adventures, you've honed your ability to adapt to the culture
  of the predominant ancestry around you. You gain the [Adopted Ancestry](omen://feat/adopted-ancestry)
  general feat, and you also gain one 1st-level ancestry feat from the ancestry you
  chose for the Adopted Ancestry feat.
mechanicsScope: builder
foundryID: Z56DtGBd3AcZOCeG
rules:
- key: adopted-ancestry-feat
  effect: core/add-feat@3
  inputs:
    feat: '@feat.adopted-ancestry'
- key: choice-feats-cultural-adaptability-feat
  choice:
    name: $.feats.cultural-adaptability.feat
    label: Ancestry Feat
    prerequisites:
    - $.feats.adopted-ancestry.ancestry
    type: core/feat-id
    records:
      filter:
        all:
        - {type: feat}
        - {trait: systemTrait-ancestry}
        - {level: 1}
        - {hasChoiceAncestryTrait: $.feats.adopted-ancestry.ancestry}
- key: chosen-feat
  effect: core/add-feat@3
  inputs:
    feat: {choice: $.feats.cultural-adaptability.feat}
