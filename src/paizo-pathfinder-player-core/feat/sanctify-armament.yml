---
action:
  count: one_action
description: 'You touch a weapon and bring it into concordance with your deity. For
  1 round, that weapon gains your holy or unholy trait. It also deals an additional
  2d6 spirit damage to creatures of the opposed trait. For example, if you are holy,
  the weapon would deal an extra 2d6 spirit damage to unholy creatures.

  If you use Sanctify Armament again, any previous use of it expires.'
level: 8
mechanicsScope: mixed
name: sanctify armament
prerequisites:
- holy or unholy trait
rarity: common
