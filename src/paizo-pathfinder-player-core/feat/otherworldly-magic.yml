action: {}
description: Your elven magic manifests as a simple arcane spell, even if you aren't
  formally trained in magic. Choose one cantrip from the arcane spell list. You can
  cast this cantrip as an arcane innate spell at will. A cantrip is heightened to
  a spell rank equal to half your level rounded up.
