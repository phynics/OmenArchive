name: folksy patter
level: 1
rarity: common
type: ancestry
traits:
- halfling
description: You are adept at disguising coded messages as folksy idioms. Using slang,
  jokes, halfling loanwords, and the like, you convey a simple message consisting
  of three basic words \(such as "Danger assassin flee" or "Meet me moonrise"\). Your
  intended listener can attempt a DC 20 Perception check to discern the message. This
  DC is reduced by 5 if the listener is a halfling or has Folksy Patter, or by 10
  if both apply \(DC 15 Perception check DC 10 Perception check\). Eavesdroppers can
  also attempt a Perception check against your Deception DC to discern your meaning.
  Any bonuses or penalties to Perception checks to [Sense Motive](omen://action/sense-motive?source=paizo-pathfinder-player-core)
  apply to checks to understand Folksy Patter.
