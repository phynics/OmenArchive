description: Your patron grants you the power to summon other creatures to aid you.
  Choose one summon spell (such as Summon Animal, Summon Construct, and so forth)
  that appears on the spell list of your spellcasting tradition. You can spend 10
  minutes in communion with your familiar to replace one spell you've prepared in
  one of your witch spell slots with the spell you chose, heightened to the same rank.
  The spell you replaced must be of at least the summon spell's minimum spell rank.
