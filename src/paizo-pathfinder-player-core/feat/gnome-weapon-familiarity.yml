description: 'You favor unusual weapons tied to your people, such as blades with curved
  and peculiar shapes. You gain access to kukris and all uncommon weapons with the
  gnome trait. You have familiarity with weapons with the gnome trait plus the glaive
  and kukri—for the purposes of proficiency, you treat any of these that are martial
  weapons as simple weapons and any that are advanced weapons as martial weapons.

  At 5th level, whenever you get a critical hit with one of these weapons, you get
  its critical specialization effect.'
