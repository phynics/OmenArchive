description: 'Your academic knowledge about a creature allows you to subtly alter
  your magic to defeat them. When you critically succeed at a Recall Knowledge check
  about a creature, you can invoke your knowledge to make the creature take a –1 circumstance
  penalty to either AC and saves against the next attack you make against it, or the
  next spell you cast that it needs to defend against. The creature takes the same
  penalty to its attack or DC the next time it attacks against you or causes you to
  attempt a save against one of its effects.

  If you share this information with your allies, they gain the benefits as well.
  If not used, the bonuses end after 1 minute.'
