action:
  count: reaction
  trigger: A creature Casts a Spell that you have prepared
description: When a foe Casts a Spell and you can see its manifestations, you can
  use your magic to disrupt it. You expend a prepared spell to counter the triggering
  creature's casting of that same spell. You lose your spell slot as if you had cast
  the triggering spell. You then attempt to counteract the triggering spell.
