  choice:
    name: $.feats.multitalented.dedication
    label: Multiclass Dedication
    type: core/feat-id
    records:
      filter:
        all:
        - {type: feat}
        - {level: 2}
        - {trait: dedication}
        - {trait: systemTrait-multiclassDedication}
- key: chosen-dedication-feat
