---
name: natural ambition
level: 1
rarity: common
type: ancestry
traits:
- human
description: You were raised to be ambitious and always reach for the stars, leading
  you to progress quickly in your chosen field. You gain a 1st-level class feat for
  your class. You must meet the prerequisites, but you can select the feat later in
  the character creation process in order to determine which prerequisites you meet.
mechanicsScope: builder
foundryID: PodajLVxqYSAqVox
rules:
- key: choice-feat-natural-ambition-feat
  choice:
    name: $.feat.natural-ambition.feat
    label: Class Feat
    records:
      filter:
        all:
        - {type: feat}
        - {level: 1}
        - {trait: systemTrait-class}
        - {sharesClassTrait: true}
        - {excludesIds: ['@feat.animal-companion', '@feat.animal-companion-druid',
            '@feat.bardic-lore', '@feat.fire-lung', '@feat.lingering-composition',
            '@feat.leshy-familiar', '@feat.martial-performance', '@feat.shore-step',
            '@feat.steadying-stone', '@feat.storm-born', '@feat.versatile-performance',
            '@feat.untamed-form']}
      type: core/feat-id
- key: grant-item-1
  effect: core/add-feat@2
  inputs:
    featId: {choice: $.feat.natural-ambition.feat}
