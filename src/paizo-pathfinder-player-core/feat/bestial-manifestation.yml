---
name: bestial manifestation
level: 1
rarity: common
type: ancestry
traits:
- nephilim
description: 'Part of your body has an animalistic influence from a planar creature.
  Your hands end in claws, you have hooves instead of feet, sharp teeth fill your
  mouth, or a tail extends from your spine. You gain your choice of one of the following
  unarmed attacks. The attack is in the brawling group and has the listed damage die
  and traits.

  Claw 1d4 slashing \(agile, finesse, unarmed, versatile piercing\)

  Hoof 1d6 bludgeoning \(finesse, unarmed\)

  Jaws 1d6 piercing \(finesse, unarmed\)

  Tail 1d4 bludgeoning \(agile, finesse, unarmed\)'
specialText: You can select this feat only at 1st level, and you can't retrain into
  or out of this feat, nor can you change the type of attack you gained.
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: The deadly d6 trait and critical specialization effect its attack
  gains with Bestial Brutality, a feat of a book the archive doesn't hold, are not
  applied.
foundryID: eUyZBi8vV5QDxOXD
