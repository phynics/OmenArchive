---
name: hag magic
level: 13
rarity: common
type: ancestry
traits:
- changeling
description: 'Through your heritage, you can replicate a hag''s magic. Choose one
  common spell of 4th rank or lower from those available to a coven, including the
  spells contributed to a coven by a hag of your mother''s type. You can cast this
  spell once per day as a 4th-rank occult innate spell.

  Spells available to all covens are Augury, Charm, Clairaudience, Clairvoyance, Dream
  Message, and Illusory Disguise. The eligible spells granted by the most prominent
  types of hag are:

  Cuckoo Hag Nightmare, Spellwrack

  Iron Hag Earthbind, Spellwrack

  Sea Hag Humanoid Form, Mariner''s Curse, Water Walk

  Sweet Hag Charm, Honeyed Words, Outcast''s Curse'
mechanicsScope: builder
foundryID: t6GBBIwX7hvvxYyV
