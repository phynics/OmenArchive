---
name: hag magic
level: 13
rarity: common
type: ancestry
traits:
- changeling
description: 'Through your heritage, you can replicate a hag''s magic. Choose one
  common spell of 4th rank or lower from those available to a coven, including the
  spells contributed to a coven by a hag of your mother''s type. You can cast this
  spell once per day as a 4th-rank occult innate spell.

  Spells available to all covens are Augury, Charm, Clairaudience, Clairvoyance, Dream
  Message, and Illusory Disguise. The eligible spells granted by the most prominent
  types of hag are:

  Cuckoo Hag Nightmare, Spellwrack

  Iron Hag Earthbind, Spellwrack

  Sea Hag Humanoid Form, Mariner''s Curse, Water Walk

  Sweet Hag Charm, Honeyed Words, Outcast''s Curse'
mechanicsScope: builder
foundryID: t6GBBIwX7hvvxYyV
rules:
- key: choice-feat-hag-magic-spell
  choice:
    name: $.feat.hag-magic.spell
    label: Spell
    records:
      filter:
        all:
        - {type: spell}
        - any:
          - {name: augury}
          - {name: charm}
          - {name: clairaudience}
          - {name: clairvoyance}
          - {name: dream message}
          - {name: illusory disguise}
          - all:
            - {characterHasFeat: brine may}
            - {any: [{name: humanoid form}, {name: water walk}]}
          - all:
            - {characterHasFeat: callow may}
            - {any: [{name: honeyed words}, {name: outcast's curse}]}
          - all:
            - {characterHasFeat: dream may}
            - {any: [{name: nightmare}]}
          - all:
            - {characterHasFeat: veil may}
            - {any: [{name: nightmare}]}
          - all:
            - {characterHasFeat: slag may}
            - {any: [{name: earthbind}]}
          - all:
            - {characterHasFeat: snow may}
            - {any: [{name: solid fog}]}
          - all:
            - {characterHasFeat: virga may}
            - {any: [{name: hydraulic torrent}]}
      type: spellcasting/spell-id
- key: choice-feat-hag-magic-other-spell
  choice:
    name: $.feat.hag-magic.other-spell
    label: Other Coven Spell
    records: {filter: {all: [{type: spell}, {maxLevel: 4}, {rarity: common}]}, type: spellcasting/spell-id}
- key: innate-spell-1
  effect: spellcasting/grant-innate-spell
  inputs:
    sourceId: b6ba6d8f-8f38-5897-886c-4f953d83650c
    sourceName: Hag Magic
    spellId: {choice: $.feat.hag-magic.spell}
    tradition: occult
    attribute: cha
    rankPolicy: {kind: fixed, rank: 4}
    castFrequency: {kind: perDay, uses: 1}
- key: innate-spell-2
  effect: spellcasting/grant-innate-spell
  inputs:
    sourceId: b6ba6d8f-8f38-5897-886c-4f953d83650c
    sourceName: Hag Magic
    spellId: {choice: $.feat.hag-magic.other-spell}
    tradition: occult
    attribute: cha
    rankPolicy: {kind: fixed, rank: 4}
    castFrequency: {kind: perDay, uses: 1}
