action:
  count: two_actions
description: You rush forward, moving enemies aside to reach your foe. You Stride,
  attempting to move through your enemies' spaces. Roll an athletics|defense:fortitude
  check and compare the result to the Fortitude DC of each creature whose space you
  attempt to move through during your Stride, moving through its space on a success
  but ending your movement before entering its space on a failure. You can then Strike,
  regardless of how your Stride ended. You can use Barreling Charge to Burrow, Climb,
  Fly, or Swim instead of Stride if you have the corresponding movement type.
