action: {}
description: Your deity's grace doesn't extend to your sworn enemies. When you cast
  a Harm or Heal spell, you can add your holy or unholy trait to it. If you do, the
  spell deals damage to creatures with the opposing trait, even if it wouldn't normally
  damage them. The spell deals spirit damage when used this way. For example, if you
  are holy, you could add the holy trait to a heal spell and deal spirit damage to
  a fiend that has the unholy trait.
