description: You use a performer's cold reading techniques, aura reading, and other
  tricks to discover your foe's strengths and weaknesses. The GM rolls a secret occultism
  check for you against the Deception or Stealth DC (whichever is higher) of an enemy
  of your choice who is not Concealed from you, Hidden from you, or Undetected by
  you, and who is engaged in combat. The GM might apply a penalty for the distance
  between you and the enemy. The enemy is then temporarily immune to your Combat Reading
  for 1 day.
