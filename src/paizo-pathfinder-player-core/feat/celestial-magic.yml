  Mind, Everlight, Humanoid Form, Revealing Light, Share Life, or Sure Footing. You
  can use each of the chosen spells once per day as 2nd-rank divine innate spells.

  Angelkin typically take clear mind and humanoid form, lawbringers typically have
  everlight and share life, and musetouched typically have revealing light and sure
  footing.'
