---
name: celestial magic
level: 9
rarity: common
type: ancestry
traits:
- nephilim
prerequisites:
- text: Angelkin, Lawbringer, Musetouched, or another lineage feat associated with
    celestials
  unsupported: Unsupported prerequisite for source esKk5XrnlqRayDPG "Angelkin, Lawbringer,
    Musetouched, or another lineage feat associated with celestials".
  diagnostic: true
description: 'You possess celestial magic. Choose two of the following spells: [Clear
  Mind](omen://spell/clear-mind?source=paizo-pathfinder-player-core), [Everlight](omen://spell/everlight?source=paizo-pathfinder-player-core),
  [Humanoid Form](omen://spell/humanoid-form?source=paizo-pathfinder-player-core),
  [Revealing Light](omen://spell/revealing-light?source=paizo-pathfinder-player-core),
  [Share Life](omen://spell/share-life?source=paizo-pathfinder-player-core), or [Sure
  Footing](omen://spell/sure-footing?source=paizo-pathfinder-player-core). You can
  use each of the chosen spells once per day as 2nd-rank divine innate spells.

  Angelkin typically take clear mind and humanoid form, lawbringers typically have
  everlight and share life, and musetouched typically have revealing light and sure
  footing.'
mechanicsScope: builder
foundryID: esKk5XrnlqRayDPG
rules:
- key: choice-feats-celestial-magic-spell-one
  choice:
    name: $.feats.celestial-magic.spell-one
    label: First Spell
    type: spellcasting/spell-id
    records:
      filter:
        all:
        - {type: spell}
        - any:
          - {name: clear mind}
          - {name: sure footing}
          - {name: share life}
          - {name: revealing light}
          - {name: humanoid form}
          - {name: everlight}
- key: choice-feats-celestial-magic-spell-two
  choice:
    name: $.feats.celestial-magic.spell-two
    label: Second Spell
    distinct: $.feats.celestial-magic.spell-one
    type: spellcasting/spell-id
    records:
      filter:
        all:
        - {type: spell}
        - any:
          - {name: clear mind}
          - {name: sure footing}
          - {name: share life}
          - {name: revealing light}
          - {name: humanoid form}
          - {name: everlight}
- key: chosen-one-innate-spell
  effect: spellcasting/grant-innate-spell@2
  inputs:
    source: celestial-magic
    sourceName: Celestial Magic
    spell: {choice: $.feats.celestial-magic.spell-one}
    tradition: divine
    attribute: charisma
    rankPolicy: {fixed: 2}
    castFrequency: {perDay: 1}
- key: chosen-two-innate-spell
  effect: spellcasting/grant-innate-spell@2
  inputs:
    source: celestial-magic
    sourceName: Celestial Magic
    spell: {choice: $.feats.celestial-magic.spell-two}
    tradition: divine
    attribute: charisma
    rankPolicy: {fixed: 2}
    castFrequency: {perDay: 1}
