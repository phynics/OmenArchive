action: {}
description: You can find ways to craft just about anything, despite restrictions.
  As long as you have the appropriate Crafting skill feat (such as Magical Crafting
  for magic items) and meet the item's level and proficiency requirements, you ignore
  just about any other requirement, such as being of a specific ancestry or providing
  spells. If a requirement adds to the item's cost, you must still pay it (including
  castings of spells that themselves have a cost). You can't ignore requirements of
  special items that have exclusive means of access and Crafting, such as artifacts.
  The GM decides whether you can ignore a requirement.
