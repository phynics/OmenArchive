description: 'You can rely on the grandeur of your performances rather than ordinary
  social skills. You can use Performance instead of Diplomacy to [Make An Impression](omen://action/make-an-impression)
  and instead of Intimidation to [Demoralize](omen://action/demoralize). You can also
  use an acting Performance instead of Deception to [Impersonate](omen://action/impersonate).

  In addition, you can use your proficiency rank in Performance to meet the prerequisites
  of skill feats that require a particular proficiency rank in Deception, Diplomacy,
  or Intimidation.'
