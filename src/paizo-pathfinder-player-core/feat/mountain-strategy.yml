description: 'Dwarves have a long history fighting common foes, and you''ve mastered
  the ancient tactics to better face these enemies. You gain a +1 circumstance bonus
  to damage with weapons and unarmed attacks against creatures with the giant, goblin,
  hryngar, or orc trait. If your attack would deal more than one weapon die of damage
  (as is common at higher levels than 1st), the bonus is equal to the number of weapon
  dice or unarmed attack dice.

  In addition, if any creature critically succeeds at an attack against you and deals
  damage to you, you gain your bonus to damage against that creature for 1 minute
  regardless of whether it has one of the listed traits.'
