description: 'You cast spells like a druid. You gain the Cast a Spell activity. You
  can prepare two common cantrips each day from the primal spell list or any other
  primal cantrips you learn or discover. You''re trained in the spell attack modifier
  and spell DC statistics. Your key spellcasting attribute for druid archetype spells
  is Wisdom, and they are primal druid spells. You learn the Wildsong language, and
  you are bound by the druid''s anathema. Choose a druidic order. You become a member
  of that order and are also bound by its specific anathema, allowing you to take
  the order''s feats. You become trained in Nature and your order''s associated skill;
  for each of these skills in which you were already trained, you become trained in
  a skill of your choice. You don''t gain any other abilities from your choice of
  order.

  Druid'
