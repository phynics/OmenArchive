description: 'Others might look upon them with disdain, but you know that the weapons
  of your people are as effective as they are sharp. You gain access to all uncommon
  weapons with the goblin trait. You have familiarity with weapons with the goblin
  trait—for the purposes of proficiency, you treat any of these that are martial weapons
  as simple weapons and any that are advanced weapons as martial weapons.

  At 5th level, whenever you get a critical hit with one of these weapons, you get
  its critical specialization effect.'
