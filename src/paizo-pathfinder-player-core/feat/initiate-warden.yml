---
name: initiate warden
level: 1
rarity: common
type: class
traits:
- ranger
repeatPolicy:
  duplicateSelectionRules:
  - lookupName: $.feat.initiate-warden.spell
    valueTypeID: me.atkn.omen.pf2e.playercore-spellcasting/value/spell-id
  instanceLevelGates: []
  maxCount: null
description: 'You''ve trained with one of the ranger sects known as wardens, who practice
  a specialized type of primal magic. You gain your choice of one warden spell from
  these initial warden spells \(or another you have access to\).

  [Gravity Weapon](omen://spell/gravity-weapon?source=paizo-pathfinder-player-core)

  [Heal Companion](omen://spell/heal-companion?source=paizo-pathfinder-player-core)

  [Magic Hide](omen://spell/magic-hide?source=paizo-pathfinder-player-core)'
specialText: You can take this feat multiple times, choosing a different initial warden
  spell each time.
mechanicsScope: builder
foundryID: iT39wlCEC1aWaSx7
rules:
- key: warden-focus-source
  effect: spellcasting/configure-source
  inputs:
    sourceId: ad075a6c-56ec-5561-ae46-5a8565022188
    sourceName: Ranger Focus Spells
    castingKind: focus
    tradition: primal
    attribute: wis
- key: choice-feat-initiate-warden-spell
  choice:
    name: $.feat.initiate-warden.spell
    label: Warden spell
    records:
      filter:
        all:
        - {type: spell}
        - {spell.category: focus}
        - {trait: classTrait-ranger}
        - {level: 1}
      type: spellcasting/spell-id
- key: grant-warden-spell
  effect: spellcasting/grant-focus-spell
  inputs:
    sourceId: ad075a6c-56ec-5561-ae46-5a8565022188
    spellId: {choice: $.feat.initiate-warden.spell}
- key: warden-spell-proficiency
  effect: spellcasting/increase-spell-proficiency
  prerequisites:
  - hasChoice:
      name: $.feat.initiate-warden.spell
      isSet: true
  inputs:
    proficiency: 2
- key: warden-focus-point
  effect: spellcasting/add-focus-point
  prerequisites:
  - hasChoice:
      name: $.feat.initiate-warden.spell
      isSet: true
