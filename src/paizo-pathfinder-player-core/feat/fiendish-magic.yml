---
name: fiendish magic
level: 9
rarity: common
type: ancestry
traits:
- nephilim
prerequisites:
- text: Grimspawn, Pitborn, Hellspawn, or another lineage feat associated with fiends
  unsupported: Unsupported prerequisite for source UKYO5kiOnCY1hgCD "Grimspawn, Pitborn,
    Hellspawn, or another lineage feat associated with fiends".
  diagnostic: true
description: 'You possess fiendish magic. Choose two of the following spells: [Disguise
  Magic](omen://spell/disguise-magic), [False Vitality](omen://spell/false-vitality),
  [Invisibility](omen://spell/invisibility), [See the Unseen](omen://spell/see-the-unseen),
  [Shatter](omen://spell/shatter), or [Paranoia](omen://spell/paranoia). You can use
  each of the chosen spells once per day as 2nd-rank divine innate spells.

  Grimspawn typically take false vitality and see the unseen, pitborn typically take
  paranoia and shatter, and hellspawn typically take invisibility and disguise magic.'
mechanicsScope: builder
foundryID: UKYO5kiOnCY1hgCD
rules:
- key: choice-feats-fiendish-magic-spell-one
  choice:
    name: $.feats.fiendish-magic.spell-one
    label: First Spell
    type: spellcasting/spell-id
    records:
      filter:
        all:
        - {type: spell}
        - any:
          - {name: paranoia}
          - {name: shatter}
          - {name: disguise magic}
          - {name: see the unseen}
          - {name: false vitality}
          - {name: invisibility}
- key: choice-feats-fiendish-magic-spell-two
  choice:
    name: $.feats.fiendish-magic.spell-two
    label: Second Spell
    distinct: $.feats.fiendish-magic.spell-one
    type: spellcasting/spell-id
    records:
      filter:
        all:
        - {type: spell}
        - any:
          - {name: paranoia}
          - {name: shatter}
          - {name: disguise magic}
          - {name: see the unseen}
          - {name: false vitality}
          - {name: invisibility}
- key: chosen-one-innate-spell
  effect: spellcasting/grant-innate-spell@2
  inputs:
    source: fiendish-magic
    sourceName: Fiendish Magic
    spell: {choice: $.feats.fiendish-magic.spell-one}
    tradition: divine
    attribute: charisma
    rankPolicy: {fixed: 2}
    castFrequency: {perDay: 1}
- key: chosen-two-innate-spell
  effect: spellcasting/grant-innate-spell@2
  inputs:
    source: fiendish-magic
    sourceName: Fiendish Magic
    spell: {choice: $.feats.fiendish-magic.spell-two}
    tradition: divine
    attribute: charisma
    rankPolicy: {fixed: 2}
    castFrequency: {perDay: 1}
