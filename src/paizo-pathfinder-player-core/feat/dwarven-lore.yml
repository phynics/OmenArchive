description: 'You eagerly absorbed the old stories and traditions of your ancestors,
  your gods, and your people, studying subjects and techniques passed down for generation
  upon generation. You gain the trained proficiency rank in Crafting and Religion.
  If you would automatically become trained in one of those skills (from your background
  or class, for example), you instead become trained in a skill of your choice.

  You also gain the Additional Lore general feat for Dwarf Lore.'
