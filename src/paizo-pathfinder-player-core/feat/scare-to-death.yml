description: You can frighten foes so much, they might die. Attempt an Intimidation
  check against the Will DC of a living creature within 30 feet of you that you sense
  or observe and who can sense or observe you. If the target can't hear you or doesn't
  understand the language you are speaking, you take a –4 circumstance penalty. The
  creature is temporarily immune for 1 minute.
