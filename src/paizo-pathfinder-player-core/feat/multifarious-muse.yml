---
name: multifarious muse
level: 2
rarity: common
type: class
traits:
- bard
repeatPolicy:
  duplicateSelectionRules:
  - lookupName: $.feats.multifarious-muse.muse
    valueTypeID: me.atkn.omen.pf2e.playercore/value/feature-id
  maxCount: 3
description: Your muse doesn't fall into a single label. Choose a type of muse other
  than that of your own. You gain a 1st-level feat that requires that muse, and your
  muse is now also a muse of that type, allowing you to take feats with the other
  muse as a prerequisite. You don't gain any of the other effects of the muse you
  chose.
specialText: You can take this feat multiple times. Each time you do, you must choose
  a different type of muse other than that of your own.
mechanicsScope: builder
foundryID: a898miJnjgD93ZsX
rules:
- key: choice-feat-multifarious-muse-muses
  choice:
    name: $.feats.multifarious-muse.muse
    label: Muse
    addTo: $.bard.muses
    type: core/feature-id
    records: {filter: {pathPrefix: '@class.bard.muses'}}
- key: choice-feat-multifarious-muse-feat
  choice:
    name: $.feats.multifarious-muse.feat
    label: Muse feat
    prerequisites:
    - $.feats.multifarious-muse.muse
    type: core/feat-id
    records:
      filter:
        all:
        - {type: feat}
        - {level: 1}
        - {requiresListValue: {list: $.bard.muses, value: {choice: $.feats.multifarious-muse.muse}}}
- key: grant-muse-feat
  effect: core/add-feat@3
  inputs:
    feat: {choice: $.feats.multifarious-muse.feat}
