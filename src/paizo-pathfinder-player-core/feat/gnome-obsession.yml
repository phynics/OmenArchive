---
name: gnome obsession
level: 1
rarity: common
type: ancestry
traits:
- gnome
description: You might have a flighty nature, but when a topic captures your attention,
  you dive into it headfirst. You gain the [Additional Lore](omen://feat/additional-lore?source=paizo-pathfinder-player-core)
  feat and the [Assurance](omen://feat/assurance?source=paizo-pathfinder-player-core)
  feat for the chosen Lore. As gnome obsessions can come and go quickly, you can retrain
  Gnome Obsession to a different Lore subcategory in 1 day of downtime.
mechanicsScope: builder
foundryID: mxhGH4FVYXJwb0BC
rules:
- key: choice-feat-gnome-obsession-lore
  choice:
    name: $.feats.gnome-obsession.lore
    label: Lore
    type: core/skill
    freeText: true
    freeTextKind: lore
- key: add-feat-1
  effect: core/add-feat@3
  inputs:
    feat: '@feat.additional-lore'
    with:
      $.feats.additional-lore.lore: {choice: $.feats.gnome-obsession.lore}
- key: add-feat-2
  effect: core/add-feat@3
  inputs:
    feat: '@feat.assurance'
