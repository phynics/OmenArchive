---
name: ancestral suspicion
level: 5
rarity: common
type: ancestry
traits:
- elf
description: Long-lived elves have seen civilizations rise and fall, often at the
  hands of outside forces. As a result, they have developed a wariness of others who
  might seek to influence or control them. You've been trained to resist such manipulation,
  gaining a +2 circumstance bonus to saving throws against effects that would make
  you [Controlled](omen://condition/controlled?source=paizo-pathfinder-player-core),
  such as [Dominate](omen://spell/dominate?source=paizo-pathfinder-player-core), and
  to Perception checks to [Sense Motive](omen://action/sense-motive?source=paizo-pathfinder-player-core)
  when trying to determine if a creature is under the influence of such an effect.
  When you roll a success on a saving throw against such an effect, you get a critical
  success instead.
mechanicsScope: mixed
foundryID: scNrNhnGTgPIzoj7
rules:
- key: annotation-1
  effect: core/add-modifier
  inputs:
    target: saving-throws
    amount: 2
    type: circumstance
    when: inflicts controlled
- key: annotation-2
  effect: core/add-modifier
  inputs:
    target: perception
    amount: 2
    type: circumstance
    when: Sense Motive; ancestral suspicion
- key: annotation-3
  effect: core/add-note
  inputs:
    target: saving-throws
    text: When you roll a success on a saving throw against an effect that would make
      you controlled, you get a critical success instead.
