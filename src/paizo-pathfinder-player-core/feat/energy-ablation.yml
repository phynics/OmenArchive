action:
  count: one_action
description: As you direct destructive energy at a foe, you can divert some of its
  power into a protective barrier that shields you from harm. If your next action
  is to Cast a Spell that deals at least one type of energy damage (acid, cold, electricity,
  fire, force, sonic, vitality, or void), you gain resistance to an energy damage
  type of your choice equal to the spell's rank. The resistance lasts until the end
  of your next turn. You get the resistance regardless of whether or not your spell
  dealt damage.
