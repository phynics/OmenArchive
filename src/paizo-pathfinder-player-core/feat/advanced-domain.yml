---
name: advanced domain
level: 8
rarity: common
type: class
traits:
- cleric
prerequisites:
- text: Domain Initiate
  hasResourceWithName: domain initiate
repeatPolicy:
  duplicateSelectionRules: []
  instanceLevelGates: []
  maxCount: null
description: Your prayers have unlocked deeper secrets of your deity's domain. You
  gain an advanced domain spell from one of your domains for which you have an initial
  domain spell.
specialText: You can select this feat multiple times. Each time, you must select a
  different advanced domain spell.
mechanicsScope: builder
foundryID: uR44wELN9OlU68cL
rules:
- key: choice-deity-domains
  choice:
    name: $.deity.domains
    label: Deity's domains
    multiple: {min: 1, max: 4}
    records: {filter: {type: domain}, type: core/domain-id}
- key: choice-cleric-advanced-domains
  choice:
    name: $.cleric.advanced-domains
    label: Advanced domain
    optionsFrom: $.cleric.domains
    records: {filter: {type: domain}, type: core/domain-id}
- key: configure-source-1
  effect: spellcasting/configure-source
  inputs:
    sourceId: b7e73ea3-1be8-5215-a0c7-055d23080c56
    sourceName: Cleric Focus Spells
    castingKind: focus
    tradition: divine
    attribute: wis
- key: advanced-domain-spell
  effect: spellcasting/grant-domain-spell
  inputs:
    sourceId: b7e73ea3-1be8-5215-a0c7-055d23080c56
    domain: {choice: $.cleric.advanced-domains}
    advanced: true
