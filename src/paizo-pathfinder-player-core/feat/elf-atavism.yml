description: Your elven blood runs particularly strong, granting you features far
  more elven than those of a typical aiuvarin. You may also have been raised among
  elves, steeped in your elven ancestors' heritage. You gain the benefits of the elf
  heritage of your elven parent or ancestors. You typically can't select a heritage
  that depends on or improves an elven feature you don't have. For example, you couldn't
  take the Ancient Elf heritage unless your non-elf ancestry also has a lifespan measured
  in multiple centuries. In these cases, at the GM's discretion, you might gain a
  different benefit.
