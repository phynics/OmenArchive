action: {}
description: You've learned to exploit your enemies' openings. Your sneak attack damage
  ignores any immunity or resistance the target has to precision damage. In addition,
  when you Sneak, you can designate one creature you're undetected by at the end of
  that action. On the next attack you make against that creature before the end of
  your next turn, any sneak attack die you roll that's less than 3 is a 3 instead.
  This has no benefit if your next attack against the creature doesn't deal sneak
  attack damage, and if you designate a new creature you lose the benefit on any previous
  one.
