---
name: skill mastery
level: 8
rarity: common
type: archetype
traits:
- archetype
prerequisites:
- text: Rogue Dedication or Investigator Dedication
  unsupported: Unsupported prerequisite for source c9rhGmKft1BVT4JO "Rogue Dedication
    or Investigator Dedication".
  diagnostic: true
- text: trained in at least one skill and expert in at least one skill
  allOf:
  - anyOf:
    - hasSkillProficiency: {skill: acrobatics, rank: trained}
    - hasSkillProficiency: {skill: arcana, rank: trained}
    - hasSkillProficiency: {skill: athletics, rank: trained}
    - hasSkillProficiency: {skill: crafting, rank: trained}
    - hasSkillProficiency: {skill: deception, rank: trained}
    - hasSkillProficiency: {skill: diplomacy, rank: trained}
    - hasSkillProficiency: {skill: intimidation, rank: trained}
    - hasSkillProficiency: {skill: medicine, rank: trained}
    - hasSkillProficiency: {skill: nature, rank: trained}
    - hasSkillProficiency: {skill: occultism, rank: trained}
    - hasSkillProficiency: {skill: performance, rank: trained}
    - hasSkillProficiency: {skill: religion, rank: trained}
    - hasSkillProficiency: {skill: society, rank: trained}
    - hasSkillProficiency: {skill: stealth, rank: trained}
    - hasSkillProficiency: {skill: survival, rank: trained}
    - hasSkillProficiency: {skill: thievery, rank: trained}
  - anyOf:
    - hasSkillProficiency: {skill: acrobatics, rank: expert}
    - hasSkillProficiency: {skill: arcana, rank: expert}
    - hasSkillProficiency: {skill: athletics, rank: expert}
    - hasSkillProficiency: {skill: crafting, rank: expert}
    - hasSkillProficiency: {skill: deception, rank: expert}
    - hasSkillProficiency: {skill: diplomacy, rank: expert}
    - hasSkillProficiency: {skill: intimidation, rank: expert}
    - hasSkillProficiency: {skill: medicine, rank: expert}
    - hasSkillProficiency: {skill: nature, rank: expert}
    - hasSkillProficiency: {skill: occultism, rank: expert}
    - hasSkillProficiency: {skill: performance, rank: expert}
    - hasSkillProficiency: {skill: religion, rank: expert}
    - hasSkillProficiency: {skill: society, rank: expert}
    - hasSkillProficiency: {skill: stealth, rank: expert}
    - hasSkillProficiency: {skill: survival, rank: expert}
    - hasSkillProficiency: {skill: thievery, rank: expert}
repeatPolicy:
  maxCount: 5
description: 'Rogue: Increase your proficiency rank in one of your skills from expert
  to master and in another of your skills from trained to expert. You gain a skill
  feat associated with one of the skills you chose; you must meet all its prerequisites.

  Investigator: Increase your proficiency rank in one of your skills from expert to
  master and in another of your skills from trained to expert. You gain a skill feat
  associated with one of the skills you chose.'
specialText: You can select this feat up to five times.
mechanicsScope: mixed
unsupportedCategory: choice
unsupportedReason: 'Rule elements not applied: ChoiceSet, GrantItem.'
foundryID: c9rhGmKft1BVT4JO
