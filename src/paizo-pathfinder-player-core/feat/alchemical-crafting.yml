---
name: alchemical crafting
level: 1
rarity: common
type: skill
traits:
- general
- skill
prerequisites:
- text: trained in Crafting
  hasSkillProficiency: {skill: crafting, rank: trained}
description: You can use the Craft activity to create alchemical items. When you select
  this feat, you immediately add the formulas for four common 1st-level alchemical
  items to your formula book.
mechanicsScope: builder
foundryID: is3Oz9wt11lNq62K
rules:
- key: choice-feats-alchemical-crafting-formulas
  choice:
    name: $.feats.alchemical-crafting.formulas
    label: Alchemical Crafting formulas
    multiple: {min: 4, max: 4}
    type: core/item-id
    records:
      filter:
        all:
        - {type: item}
        - {trait: alchemical}
        - {rarity: common}
        - {level: 1}
- key: learn-choice-feats-alchemical-crafting-formulas
  forEach: $.feats.alchemical-crafting.formulas
  effect: core/add-to-list
  inputs:
    list: $.crafting.formulas
    value: {item: true}
