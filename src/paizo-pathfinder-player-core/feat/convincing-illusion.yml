name: convincing illusion
level: 6
rarity: common
type: class
traits:
- wizard
prerequisites:
- text: expert in Deception
  hasSkillProficiency: {skill: deception, proficiency: expert}
action:
  count: reaction
  requirements: You are within 30 feet of the observer and the illusion.
  trigger: A creature succeeded, but didn't critically succeed, at a Perception check
    or Will save to disbelieve an illusion from a spell that you cast.
description: You use your deceptive skills to make your illusions seem even more real.
  Attempt a deception|defense:perception check against the target's Perception DC.
  If you succeed, the target fails to disbelieve the illusion.
