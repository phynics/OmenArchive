- text: Quick Recognition
  hasResourceWithName: quick recognition
description: You creatively apply your prepared spells to Counterspell a much wider
  variety of your opponents' magic. Instead of being able to counter a foe's spell
  with Counterspell only if you have that same spell prepared, you can use Counterspell
  as long as you have the spell the foe is casting in your spellbook. When you use
  Counterspell in this way, you must still expend a prepared spell; the prepared spell
  you expend must share a trait with the triggering spell other than concentrate,
  manipulate, or its tradition trait. The GM might allow you to instead use a spell
  that has an opposing trait or that otherwise logically would counter the triggering
  spell (such as using a cold or water spell to counter Fireball or using Clear Mind
  to counter a fear spell).
