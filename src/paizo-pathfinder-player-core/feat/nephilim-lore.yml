  rank in either Diplomacy or Intimidation, and Religion. If you would automatically
  become trained in one of those skills (from your background or class, for example),
  you instead become trained in a skill of your choice.

  You also gain the Additional Lore general feat for a Lore subcategory of a plane
  to which you trace your lineage.'
