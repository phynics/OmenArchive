---
name: nephilim lore
level: 1
rarity: common
type: ancestry
traits:
- nephilim
description: 'You know the secrets of the Multiverse. You gain the trained proficiency
  rank in either Diplomacy or Intimidation, and Religion. If you would automatically
  become trained in one of those skills (from your background or class, for example),
  you instead become trained in a skill of your choice.

  You also gain the Additional Lore general feat for a Lore subcategory of a plane
  to which you trace your lineage.'
mechanicsScope: builder
foundryID: sKDCoxMz2yKWLGRJ
rules:
- key: add-skill-increase-1
  effect: core/add-skill-increase
  inputs:
    skill: {kind: religion}
    proficiencyCap: 2
- key: choice-feat-nephilim-lore-skill
  choice:
    name: $.feat.nephilim-lore.skill
    label: Skill
    type: core/skill
    cases:
    - {key: diplomacy, value: {kind: diplomacy}}
    - {key: intimidation, value: {kind: intimidation}}
- key: add-skill-increase-2
  effect: core/add-skill-increase
  inputs:
    skill: {choice: $.feat.nephilim-lore.skill}
    proficiencyCap: 2
- key: add-feat-1
  effect: core/add-feat@2
  inputs:
    featId: '@feat.additional-lore'
