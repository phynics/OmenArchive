description: "You have a pet—a Tiny animal of a type you choose, such as a cat, bird,
  or rodent. It has the minion trait, meaning it gains 2 actions during your turn
  if you use the Command an Animal action to command it; this replaces the usual effects
  of Command an Animal, and you don't need to attempt a Nature check. A pet can't
  make Strikes.\nLevel Your pet's level is equal to yours.\nModifiers and AC Your
  pet's save modifiers and AC are equal to yours before applying circumstance or status
  bonuses or penalties. It uses 3 + your level as its modifier for Perception, Acrobatics,
  and Stealth, and just your level as its modifier for other skill checks. It doesn't
  have or use its own attribute modifiers and can never benefit from item bonuses.\nHit
  Points Your pet has 5 Hit Points per level.\nSenses Your pet has low-light vision
  and can gain additional senses from pet abilities.\nSpeed Your pet has a Speed of
  25 feet. You can choose to instead have an aquatic pet, which breathes in water
  instead of air and has the aquatic trait, no land Speed, and a swim Speed of 25
  feet.\nPet Abilities When you gain your pet, choose two of the following abilities.
  If your pet is an animal that naturally has one of these abilities (for instance,
  an owl has a fly Speed), you must select that ability. Your pet can't be an animal
  that naturally has more pet abilities than the maximum. In some cases, the GM might
  add some familiar abilities to the pet abilities you can choose.\n\t•\tAmphibious
  It gains the amphibious trait, allowing it to breathe in both air and water, and
  has both a land Speed and a swim Speed, each equal to its highest land Speed or
  swim Speed.\n\t•\tBurrower It gains a burrow Speed of 5 feet, allowing it to dig
  Tiny holes.\n\t•\tClimber It gains a climb Speed of 25 feet.\n\t•\tDarkvision It
  gains darkvision.\n\t•\tEcholocation Your pet can use hearing as a precise sense
  within 20 feet.\n\t•\tFast Movement Increase one of the pet's Speeds from 25 feet
  to 40 feet.\n\t•\tFlier It gains a fly Speed of 25 feet.\n\t•\tManual Dexterity
  It can use up to two of its limbs as if they were hands to perform manipulate actions.\n\t•\tScent
  Your pet can use scent as an imprecise sense within 30 feet\n\t•\tTough Your pet's
  max HP increase by 2 per level."
