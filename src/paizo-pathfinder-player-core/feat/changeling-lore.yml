rules:
- key: add-skill-increase-1
  effect: core/add-skill-increase
  inputs:
    skill: {kind: deception}
    proficiencyCap: 2
- key: add-skill-increase-2
  effect: core/add-skill-increase
  inputs:
    skill: {kind: occultism}
    proficiencyCap: 2
- key: add-feat-1
  effect: core/add-feat@2
  inputs:
    featId: '@feat.additional-lore'
