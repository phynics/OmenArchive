description: 'You notice the signs and symbols that members of mystery cults and other
  secret societies use to declare their affiliation to fellow members. You can use
  Occultism in place of Diplomacy to [Gather Information](omen://action/gather-information?source=paizo-pathfinder-player-core)
  about such groups and in place of Deception to [Impersonate](omen://action/impersonate?source=paizo-pathfinder-player-core)
  a member of these groups.

  If you belong to a secret cult, lodge, sect, or similar organization, you automatically
  recognize members of your group unless they are specifically attempting to conceal
  their presence from you. They also recognize your standing unless you are specifically
  concealing it.'
