---
name: masterful warden
level: 6
rarity: common
type: class
traits:
- ranger
prerequisites:
- text: Initiate Warden
  hasResourceWithName: initiate warden
repeatPolicy:
  duplicateSelectionRules:
  - lookupName: $.feat.masterful-warden.spell
    valueTypeID: me.atkn.omen.pf2e.playercore-spellcasting/value/spell-id
  instanceLevelGates: []
  maxCount: null
description: 'Your mastery of warden magic increases. You gain your choice of one
  warden spell from the master warden spells.

  Ephemeral Tracking

  Ranger''s Bramble'
specialText: You can take this feat multiple times, choosing a different master warden
  spell each time.
mechanicsScope: builder
foundryID: BBN5G6epRWXGwZHv
rules:
- key: warden-focus-source
  effect: spellcasting/configure-source
  inputs:
    sourceId: ad075a6c-56ec-5561-ae46-5a8565022188
    sourceName: Ranger Focus Spells
    castingKind: focus
    tradition: primal
    attribute: wis
- key: choice-feat-masterful-warden-spell
  choice:
    name: $.feat.masterful-warden.spell
    label: Warden spell
    records:
      filter:
        all:
        - {type: spell}
        - {spell.category: focus}
        - {trait: classTrait-ranger}
        - {level: 3}
      type: spellcasting/spell-id
- key: grant-warden-spell
  effect: spellcasting/grant-focus-spell
  inputs:
    sourceId: ad075a6c-56ec-5561-ae46-5a8565022188
    spellId: {choice: $.feat.masterful-warden.spell}
- key: warden-spell-proficiency
  effect: spellcasting/increase-spell-proficiency
  prerequisites:
  - hasChoice:
      name: $.feat.masterful-warden.spell
      isSet: true
  inputs:
    proficiency: 2
- key: warden-focus-point
  effect: spellcasting/add-focus-point
  prerequisites:
  - hasChoice:
      name: $.feat.masterful-warden.spell
      isSet: true
