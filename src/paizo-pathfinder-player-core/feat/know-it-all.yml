description: 'Bard - When you succeed at a check to Recall Knowledge, you gain additional
  information or context. When you critically succeed at a check to Recall Knowledge,
  you get additional information or context or can ask an additional follow-up question
  (the GM chooses which).

  Thaumaturge -Having heard every rumor or story in the book, you know that if you''ve
  heard of something in the first place, you''ve probably heard about it at length.
  When you succeed at a check to Recall Knowledge, you gain additional information
  or context about the given topic. When you critically succeed at a check to Recall
  Knowledge, at the GM''s discretion, you might gain even more additional information
  or context than normal.'
