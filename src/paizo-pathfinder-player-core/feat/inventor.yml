action: {}
description: 'You are a genius at Crafting, easily able to determine how things are
  made and create new inventions. You can spend downtime to invent a common formula
  that you don''t know. This works just like the Craft activity: you spend half the
  Price of the formula up front, attempt a Crafting check, and on a success either
  finish the formula by paying the difference or work for longer to decrease the Price.
  The difference is that you spend the additional time in research, design, and development,
  rather than in creating an item. Once it''s complete, you add the new formula you
  invented to your formula book.

  The GM might allow you to invent uncommon or rare formulas, typically with an increased
  DC. You need the Alchemical Crafting feat to invent alchemical formulas and the
  Magical Crafting feat to invent magical formulas.'
level: 2
