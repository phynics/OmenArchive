description: 'Your animal companion has grown up over the course of your adventures,
  becoming a mature animal companion and gaining additional capabilities.

  Your animal companion has greater independence. During an encounter, even if you
  don''t use the Command an Animal action, your animal companion can still use 1 action
  that round on your turn to Stride or Strike. It can do this at any point during
  your turn, as long as you aren''t currently taking an action. If it does, that''s
  all the actions it gets that round—you can''t Command it later.'
