description: You leap from hiding and assail your target. You Stride up to your Speed,
  but you must end your movement next to an enemy you're Hidden from or Undetected
  by. You then Strike that enemy; you remain hidden from or undetected by that creature
  until after you Strike. You can use Spring from the Shadows while Burrowing, Climbing,
  Flying, or Swimming instead of Striding if you have the corresponding movement type.
