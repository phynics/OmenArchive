action: {}
description: 'You can use the parts of monsters to aid in crafting. You can use the
  body of a monster to help Craft items, using Survival instead of Crafting for the
  Craft activity when you do so. If parts of the monster''s body are valuable, you
  can expend them toward the item''s raw material cost as well. (The GM makes the
  determination if the monster''s entry doesn''t list any valuable materials from
  its body.)

  If you spend additional days working on the item, reduce the Price using the monster''s
  level instead of your own. Certain items may require specific creatures in their
  Craft requirement.'
