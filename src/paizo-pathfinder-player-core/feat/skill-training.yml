---
name: skill training
level: 1
rarity: common
type: skill
traits:
- general
- skill
prerequisites:
- text: Intelligence +1
  hasAttributeModifier: {attribute: intelligence, modifier: 1}
repeatPolicy: {}
description: You become trained in the skill of your choice.
specialText: You can select this feat multiple times, choosing a new skill to become
  trained in each time.
mechanicsScope: builder
foundryID: P6icK2DbRoZ3H6kc
rules:
- key: options-skill
  effect: core/declare-list
  inputs:
