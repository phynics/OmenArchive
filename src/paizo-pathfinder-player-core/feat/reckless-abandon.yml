action:
  count: free_action
  frequency: once per day
description: 'Despite a lifetime filled with questionable decisions, you''ve managed
  to survive, as though you have uncanny luck that lets you avoid the consequences
  of your own actions. For the remainder of your turn, if you roll a failure or critical
  failure on a saving throw against a harmful effect, you get a success instead. Further,
  if you would take damage from an enemy or hazard this turn you take the minimum
  possible damage.

  These benefits apply only to harmful effects incurred entirely during your turn
  in which you activate Reckless Abandon, such as running through a Wall of Fire.
  Persistent damage and conditions that were applied prior to your turn proceed normally,
  and as soon as your turn ends you are subject to the full consequences of any dangers
  still threatening you.'
