    type: core/string
    cases:
    - {value: dwarf}
    - {value: elf}
    - {value: gnome}
    - {value: goblin}
    - {value: halfling}
    - {value: human}
    - {value: leshy}
    - {value: orc}
- key: feat-ancestry
  effect: core/add-feat-ancestry
  inputs:
    ancestry: {choice: $.feat.adopted-ancestry.ancestry}
