---
name: earned glory
level: 1
rarity: common
type: ancestry
traits:
- aiuvarin
description: 'Elves often struggle with underestimating aiuvarins, and you are experienced
  at telling stories of your accomplishments to gain their respect. You are trained
  in Performance. If you would automatically become trained in Performance \(from
  your background or class, for example\), you instead become trained in a skill of
  your choice.

  You gain the [Impressive Performance](omen://feat/impressive-performance) feat.
  When you attempt a Performance check to [Make an Impression](omen://action/make-an-impression)
  on an elf, if you roll a critical failure, you get a failure instead.'
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: Its notes on rolls are in its text.
foundryID: nfERPRCITBp970HO
rules:
- key: performance-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: performance
    rank: trained
- key: performance-make-impression-critical-failure-note
  effect: core/add-note
  inputs:
    target: performance
    text: When you roll a critical failure on a Performance check, the result is one
      degree better.
    when: Make An Impression; the target has the elf trait
- key: impressive-performance-feat
  effect: core/add-feat@3
  inputs:
    feat: '@feat.impressive-performance'
