description: 'Elves often struggle with underestimating aiuvarins, and you are experienced
  at telling stories of your accomplishments to gain their respect. You are trained
  in Performance. If you would automatically become trained in Performance \(from
  your background or class, for example\), you instead become trained in a skill of
  your choice.

  You gain the [Impressive Performance](omen://feat/impressive-performance?source=paizo-pathfinder-player-core)
  feat. When you attempt a Performance check to [Make an Impression](omen://action/make-an-impression?source=paizo-pathfinder-player-core)
  on an elf, if you roll a critical failure, you get a failure instead.'
