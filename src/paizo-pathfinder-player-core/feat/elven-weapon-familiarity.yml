name: elven weapon familiarity
level: 1
rarity: common
type: ancestry
traits:
- elf
description: 'You favor bows and other elegant weapons. You gain access to all uncommon
  weapons with the elf trait. You have familiarity with weapons with the elf trait
  plus [Longbows](omen://item/longbow), [Composite Longbows](omen://item/composite-longbow),
  [Rapiers](omen://item/rapier), [Shortbows](omen://item/shortbow), and [Composite
  Shortbows](omen://item/composite-shortbow)—for the purposes of proficiency, you
  treat any of these that are martial weapons as simple weapons and any that are advanced
  weapons as martial weapons.

  At 5th level, whenever you get a critical hit with one of these weapons, you get
  its critical specialization effect.'
