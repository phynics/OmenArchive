description: 'You favor bows and other elegant weapons. You gain access to all uncommon
  weapons with the elf trait. You have familiarity with weapons with the elf trait
  plus Longbows, Composite Longbows, Rapiers, Shortbows, and Composite Shortbows—for
  the purposes of proficiency, you treat any of these that are martial weapons as
  simple weapons and any that are advanced weapons as martial weapons.

  At 5th level, whenever you get a critical hit with one of these weapons, you get
  its critical specialization effect.'
