action: {}
description: You forge a magical link with another creature, granting you awareness
  of that creature's condition and creating a conduit for spellcasting. During your
  daily preparations, you can designate one willing creature as your charge. You are
  always aware of your charge's direction from you, its distance from you, and any
  conditions affecting it. In addition, you can cast spells with a range of touch
  on your charge from a range of 30 feet. These effects persist until your next daily
  preparations.
