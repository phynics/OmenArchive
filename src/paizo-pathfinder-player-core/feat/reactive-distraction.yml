action:
  count: reaction
  requirements: You have Perfect Distraction ready to use.
  trigger: You would be hit by an attack or targeted by an effect, or you are within
    an effect's area.
description: You reactively switch with your decoy to foil your foe. You use Perfect
  Distraction, even if you were observed, as long as you end the movement of your
  Sneak while Concealed or in a location with cover or greater cover. Your decoy is
  targeted by the attack or effect instead of you. In the case of an area effect,
  if your Sneak doesn't move you out of the area, both you and the decoy are targeted
  by the effect.
