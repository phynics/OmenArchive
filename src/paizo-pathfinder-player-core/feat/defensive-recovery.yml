---
name: defensive recovery
level: 12
rarity: common
type: class
traits:
- cleric
- concentrate
- spellshape
prerequisites:
- text: harmful font or healing font
  anyOf:
  - hasChoice:
      name: $.cleric.divine-font
      equals: {type: spellcasting/spell-id, value: '@spell.harm'}
  - hasChoice:
      name: $.cleric.divine-font
      equals: {type: spellcasting/spell-id, value: '@spell.heal'}
action:
  count: one_action
description: Your faith provides temporary protection in addition to healing. If the
  next action you use is to cast Harm or Heal on a single target and the target regains
  Hit Points from the spell, it also gains a +2 status bonus to AC and saving throws
  for 1 round.
mechanicsScope: encounter
