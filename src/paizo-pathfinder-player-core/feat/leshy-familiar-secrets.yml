description: "The leaf order's secrets allow your familiar to take advantage of its
  leshy form. You can select one additional familiar ability each day, which must
  be one of the following leshy familiar abilities. You can't select more than one
  ability from this feat at a time.\n\t•\tGrasping Tendrils Your familiar can extend
  vines or similar tendrils, increasing its reach to 15 feet.\n\t•\tPurify Air Your
  familiar recycles air, providing enough oxygen for a Medium creature in areas with
  stale air, such as a sealed chamber or extradimensional space. Creatures within
  a emanation of the leshy gain a +2 circumstance bonus to their saving throws against
  inhaled poison effects, olfactory effects, or other effects that rely on breathing
  (such as toxic cloud), at the GM's discretion.\n\t•\tVerdant Burst When your familiar
  dies, it releases its primal energy to cast the 3-action version of Heal, heightened
  to a rank 1 lower than your highest-rank spell slot. The heal spell gains a status
  bonus equal to twice the spell's rank to the Hit Points it restores to plants. You
  must be able to cast 2nd-rank spells using spell slots to select this familiar ability."
