---
name: irrepressible (halfling)
level: 9
rarity: common
type: ancestry
traits:
- halfling
description: You are easily able to ward off attempts to play on your fears and emotions.
  When you roll a success on a saving throw against an emotion effect, you get a critical
  success instead. If your heritage is gutsy halfling, when you roll a critical failure
  on a saving throw against an emotion effect, you get a failure instead.
mechanicsScope: mixed
foundryID: cRMUYCnkkE9lSEhh
rules:
- key: saving-throws-emotion-success-note
  effect: core/add-note
  inputs:
    target: saving-throws
    text: When you roll a success on a saving throw, the result is one degree better.
    when: the effect has the emotion trait
- key: saving-throws-emotion-heritage-critical-failure-note
  effect: core/add-note
  inputs:
    target: saving-throws
    text: When you roll a critical failure on a saving throw, the result is one degree
      better.
    when: the effect has the emotion trait; you heritage gutsy halfling
