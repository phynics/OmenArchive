---
name: peerless warden
level: 10
rarity: common
type: class
traits:
- ranger
prerequisites:
- text: Initiate Warden
  hasResourceWithName: initiate warden
repeatPolicy:
  duplicateSelectionRules:
  - lookupName: $.feat.peerless-warden.spell
    valueTypeID: me.atkn.omen.pf2e.playercore-spellcasting/value/spell-id
  instanceLevelGates: []
  maxCount: null
description: 'Your mastery of primal magic has given you access to the greatest secrets
  of warden magic. You gain your choice of one warden spell from the peerless warden
  spells.

  [Hunter''s Vision](omen://spell/hunters-vision?source=paizo-pathfinder-player-core)

  [Terrain Transposition](omen://spell/terrain-transposition?source=paizo-pathfinder-player-core)'
specialText: You can take this feat multiple times, choosing a different peerless
  warden spell each time.
mechanicsScope: builder
foundryID: W7aT1UJOVFkYdQti
rules:
- key: warden-focus-source
  effect: spellcasting/configure-source
  inputs:
    sourceId: ad075a6c-56ec-5561-ae46-5a8565022188
    sourceName: Ranger Focus Spells
    castingKind: focus
    tradition: primal
    attribute: wis
- key: choice-feat-peerless-warden-spell
  choice:
    name: $.feat.peerless-warden.spell
    label: Warden spell
    records:
      filter:
        all:
        - {type: spell}
        - {spell.category: focus}
        - {trait: classTrait-ranger}
        - {level: 5}
      type: spellcasting/spell-id
- key: grant-warden-spell
  effect: spellcasting/grant-focus-spell
  inputs:
    sourceId: ad075a6c-56ec-5561-ae46-5a8565022188
    spellId: {choice: $.feat.peerless-warden.spell}
- key: warden-spell-proficiency
  effect: spellcasting/increase-spell-proficiency
  prerequisites:
  - hasChoice:
      name: $.feat.peerless-warden.spell
      isSet: true
  inputs:
    proficiency: 2
- key: warden-focus-point
  effect: spellcasting/add-focus-point
  prerequisites:
  - hasChoice:
      name: $.feat.peerless-warden.spell
      isSet: true
