description: 'Fighter, Rogue, Investigator Your battle instincts make you more aware
  of [Concealed](omen://condition/concealed) and [Invisible](omen://condition/invisible)
  opponents.

  Ranger Your heightened senses allow you to instinctively detect unseen opponents.

  You don''t need to succeed at a flat check to target concealed creatures. You''re
  not [Off-Guard](omen://condition/off-guard) to creatures that are [Hidden](omen://condition/hidden)
  from you \(unless you''re off-guard to them for reasons other than the hidden condition\),
  and you need only a successful DC 5 Flat check to target a hidden creature.

  While you''re adjacent to an [Undetected](omen://condition/undetected) creature
  of your level or lower, it is instead only hidden from you.'
