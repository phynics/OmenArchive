rules:
- key: saving-throws-status-bonus-poison
  effect: core/add-modifier@2
  inputs:
    target: saving-throws
    amount: 1
    type: status
    when: poison
- key: resistance-poison
  effect: core/add-resistance@3
  inputs:
    type: poison
    value: (floor (divide $.level 2))
