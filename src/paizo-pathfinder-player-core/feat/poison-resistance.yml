---
name: poison resistance
level: 2
rarity: common
type: class
traits:
- alchemist
- druid
description: 'Alchemist Repeated exposure to toxic reagents has fortified your body
  against poisons of all kinds.

  Druid Your affinity for the natural world grants you protection against some of
  its dangers.

  You gain poison resistance equal to half your level, and you gain a +1 status bonus
  to saving throws against poisons.'
mechanicsScope: mixed
