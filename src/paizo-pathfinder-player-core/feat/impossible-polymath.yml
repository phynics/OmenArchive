- text: Esoteric Polymath
  hasResourceWithName: esoteric polymath
description: 'Your esoteric formulas are so unusual that they allow you to dabble
  in magic from diverse traditions that other bards don''t understand. As long as
  you''re trained in Arcana, you can add arcane spells to your book from Esoteric
  Polymath; as long as you''re trained in Nature, you can add primal spells to your
  book; and as long as you are trained in Religion, you can add divine spells to your
  book.

  Like your other spells in your book, you can add one of these spells from another
  tradition to your repertoire as an occult spell each day using Esoteric Polymath,
  but you can''t retain any spells from another tradition when you prepare again,
  even if you have Eclectic Polymath.'
