action: {}
description: 'You''ve dutifully learned how to keep your balance and how to stick
  to the shadows where it''s safe, important skills passed down through generations
  of halfling tradition. You gain the trained proficiency rank in Acrobatics and Stealth.
  If you would automatically become trained in one of those skills (from your background
  or class, for example), you instead become trained in a skill of your choice.

  You also gain the Additional Lore general feat for Halfling Lore.'
