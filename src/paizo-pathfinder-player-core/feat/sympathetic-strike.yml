action:
  frequency: once per round
description: You collect your patron's magic into one of your witch armaments, causing
  them to shine with runes, light, or another signifier of your patron. Make an unarmed
  Strike with one with your witch's armaments. If you hit, you establish a sympathetic
  link with the target, making it easier for your patron to affect them. Until the
  beginning of your next turn, the target takes a –1 circumstance penalty to its saves
  against your hexes, or a –2 penalty if the triggering Strike was a critical hit.
