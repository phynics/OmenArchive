description: You raise a druidic monument, such as a standing stone or warding tree,
  from the ground, creating a powerful primal ward that blocks other types of magic.
  The monument appears in an unoccupied square on the ground within 30 feet, making
  that square difficult terrain. Choose arcane, divine, or occult; all creatures within
  15 feet of the monument gain a +2 status bonus to their saving throws against effects
  with that trait. The monument lasts for 1 round before crumbling back into the earth
  or wilting away into nothingness, but you can Sustain the monument for up to 1 minute.
