description: You can read lips of others nearby who you can clearly see. The language
  read must be one that you know. When you're at your leisure, you can do this automatically.
  In encounter mode or when attempting a more difficult feat of lipreading, you're
  Fascinated and Off-Guard during each round in which you focus on lip movements,
  and you must succeed at a Society check (DC determined by the GM) to successfully
  read someone's lips.
