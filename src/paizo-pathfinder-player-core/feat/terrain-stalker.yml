description: 'Select one type of difficult terrain from the following list: rubble,
  snow, or underbrush. While [Undetected](omen://condition/undetected?source=paizo-pathfinder-player-core)
  by all non-allies in that type of terrain, you can [Sneak](omen://action/sneak?source=paizo-pathfinder-player-core)
  without attempting a Stealth check as long as you move no more than 5 feet and do
  not pass within 10 feet of an enemy during your movement.

  During exploration, this also allows you to automatically approach within 15 feet
  of other creatures while [Avoiding their Notice](omen://action/avoid-notice?source=paizo-pathfinder-player-core),
  as long as they aren''t actively [Searching](omen://action/search?source=paizo-pathfinder-player-core)
  or on guard.'
