description: 'Select one type of difficult terrain from the following list: rubble,
  snow, or underbrush. While Undetected by all non-allies in that type of terrain,
  you can Sneak without attempting a Stealth check as long as you move no more than
  5 feet and do not pass within 10 feet of an enemy during your movement.

  During exploration, this also allows you to automatically approach within 15 feet
  of other creatures while Avoiding their Notice, as long as they aren''t actively
  Searching or on guard.'
