name: hidden
group: detection
description: 'While you''re hidden from a creature, that creature knows the space
  you''re in but can''t tell precisely where you are. You typically become hidden
  by using Stealth to [Hide](omen://action/hide?source=paizo-pathfinder-player-core).
  When [Seeking](omen://action/seek?source=paizo-pathfinder-player-core) a creature
  using only imprecise senses, it remains hidden, rather than [Observed](omen://condition/observed?source=paizo-pathfinder-player-core).
  A creature you''re hidden from is [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core)
  to you, and it must succeed at a DC 11 Flat check when targeting you with an attack,
  spell, or other effect or it fails to affect you. Area effects aren''t subject to
  this flat check.

  A creature might be able to use the seek action to try to observe you.'
