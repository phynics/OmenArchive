---
name: stupefied
valued: true
group: abilities
description: Your thoughts and instincts are clouded. Stupefied always includes a
  value. You take a status penalty equal to this value on Intelligence-, Wisdom-,
  and Charisma-based rolls and DCs, including Will saving throws, spell attack modifiers,
  spell DCs, and skill checks that use these attribute modifiers. Any time you attempt
  to [Cast a Spell](omen://action/cast-a-spell?source=paizo-pathfinder-player-core)
  while stupefied, the spell is disrupted unless you succeed at a Flat check \(DC
  5 + the condition's value\) with a DC equal to 5 + your stupefied value.
