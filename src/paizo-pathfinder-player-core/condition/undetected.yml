---
name: undetected
group: detection
description: 'When you are undetected by a creature, that creature can''t see you
  at all, has no idea what space you occupy, and can''t target you, though you still
  can be affected by abilities that target an area. When you''re undetected by a creature,
  that creature is [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core)
  to you.

  A creature you''re undetected by can guess which square you''re in to try targeting
  you. It must pick a square and attempt an attack. This works like targeting a [Hidden](omen://condition/hidden?source=paizo-pathfinder-player-core)
  creature \(requiring a DC 11 Flat check\), but the flat check and attack roll are
  rolled in secret by the GM, who doesn''t reveal whether the attack missed due to
  failing the flat check, failing the attack roll, or choosing the wrong square. They
  can [Seek](omen://action/seek?source=paizo-pathfinder-player-core) to try to find
  you.'
