name: paralyzed
description: You're frozen in place. You have the [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core)
  condition and can't act except to [Recall Knowledge](omen://action/recall-knowledge?source=paizo-pathfinder-player-core)
  and use actions that require only your mind \(as determined by the GM\). Your senses
  still function, but only in the areas you can perceive without moving, so you can't
  [Seek](omen://action/seek?source=paizo-pathfinder-player-core).
