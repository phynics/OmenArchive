---
name: observed
group: detection
description: Anything in plain view is observed by you. If a creature takes measures
  to avoid detection, such as by using Stealth to [Hide](omen://action/hide), it can
  become [Hidden](omen://condition/hidden) or [Undetected](omen://condition/undetected)
  instead of observed. If you have another precise sense besides sight, you might
  be able to observe a creature or object using that sense instead. You can observe
  a creature with only your precise senses. When [Seeking](omen://action/seek) a creature
  using only imprecise senses, it remains hidden, rather than observed.
