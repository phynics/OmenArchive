name: prone
description: 'You''re lying on the ground. You are [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core)
  and take a –2 circumstance penalty to attack rolls. The only move actions you can
  use while you''re prone are [Crawl](omen://action/crawl?source=paizo-pathfinder-player-core)
  and [Stand](omen://action/stand?source=paizo-pathfinder-player-core). Standing up
  ends the prone condition. You can [Take Cover](omen://action/take-cover?source=paizo-pathfinder-player-core)
  while prone to hunker down and gain greater cover against ranged attacks, even if
  you don''t have an object to get behind, which grants you a +4 circumstance bonus
  to AC against ranged attacks \(but you remain off-guard\).

  If you would be knocked prone while you''re [Climbing](omen://action/climb?source=paizo-pathfinder-player-core)
  or [Flying](omen://action/fly?source=paizo-pathfinder-player-core), you fall. You
  can''t be knocked prone when [Swimming](omen://action/swim?source=paizo-pathfinder-player-core).'
