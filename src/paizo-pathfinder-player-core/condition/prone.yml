name: prone
description: 'You''re lying on the ground. You are [Off-Guard](omen://condition/off-guard)
  and take a –2 circumstance penalty to attack rolls. The only move actions you can
  use while you''re prone are [Crawl](omen://action/crawl) and [Stand](omen://action/stand).
  Standing up ends the prone condition. You can [Take Cover](omen://action/take-cover)
  while prone to hunker down and gain greater cover against ranged attacks, even if
  you don''t have an object to get behind, which grants you a +4 circumstance bonus
  to AC against ranged attacks \(but you remain off-guard\).

  If you would be knocked prone while you''re [Climbing](omen://action/climb) or [Flying](omen://action/fly),
  you fall. You can''t be knocked prone when [Swimming](omen://action/swim).'
