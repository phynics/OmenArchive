---
name: restrained
description: You're tied up and can barely move, or a creature has you pinned. You
  have the [Off-Guard](omen://condition/off-guard) and [Immobilized](omen://condition/immobilized)
  conditions, and you can't use any attack or manipulate actions except to attempt
  to [Escape](omen://action/escape) or [Force Open](omen://action/force-open) your
  bonds. Restrained overrides [Grabbed](omen://condition/grabbed).
