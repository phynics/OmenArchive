---
name: invisible
group: senses
description: You can't be seen. You're [Undetected](omen://condition/undetected?source=paizo-pathfinder-player-core)
  to everyone. Creatures can [Seek](omen://action/seek?source=paizo-pathfinder-player-core)
  to detect you; if a creature succeeds at its Perception check against your Stealth
  DC, you become [Hidden](omen://condition/hidden?source=paizo-pathfinder-player-core)
  to that creature until you [Sneak](omen://action/sneak?source=paizo-pathfinder-player-core)
  to become undetected again. If you become invisible while someone can already see
  you, you start out hidden to them \(instead of undetected\) until you successfully
  Sneak. You can't become [Observed](omen://condition/observed?source=paizo-pathfinder-player-core)
  while invisible except via special abilities or magic.
