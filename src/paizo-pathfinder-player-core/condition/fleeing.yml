---
name: fleeing
description: You're forced to run away due to fear or some other compulsion. On your
  turn, you must spend each of your actions trying to escape the source of the fleeing
  condition as expediently as possible \(such as by using move actions to flee, or
  opening doors barring your escape\). The source is usually the effect or creature
  that gave you the condition, though some effects might define something else as
  the source. You can't [Delay](omen://action/delay?source=paizo-pathfinder-player-core)
  or [Ready](omen://action/ready?source=paizo-pathfinder-player-core) while fleeing.
