---
name: encumbered
description: You are carrying more weight than you can manage. While you're encumbered,
  you're [Clumsy 1](omen://condition/clumsy?source=paizo-pathfinder-player-core) and
  take a 10-foot penalty to all your Speeds. As with all penalties to your Speed,
  this can't reduce your Speed below 5 feet.
