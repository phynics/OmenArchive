  You reach into the skies and call down an array of falling stars that explode upon
  colliding with the ground. Choose for the falling stars to be airbursts (sonic),
  asteroids (fire), comets (cold), or plasma (electricity). The spell gains the trait
  of the falling star type you chose. The four stars'' central 10-foot bursts can''t
  overlap. Each falling star deals 6d10 bludgeoning damage to each creature in the
  burst at the center of its area of effect before exploding, dealing 14d6 energy
  damage of the type you chose to each creature in its burst. A creature in any of
  the areas attempts one basic Reflex save against the spell no matter how many overlapping
  explosions it''s caught in and can take each type of damage only once.


