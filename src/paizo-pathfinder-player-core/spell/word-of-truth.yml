description: You speak a statement you believe to be true and that is free of any
  attempt to deceive through twisting words, omission, and so on. The statement must
  be 25 words or fewer. A symbol of your deity glows above your head and lasts for
  the spell's duration, and anyone who sees you and hears you speak knows that you
  believe what you say is true. This assurance of honesty grants you a +2 status bonus
  to Diplomacy checks as long as the symbol persists. You can Dismiss the spell, and
  if you say something that you don't believe is entirely true, the spell ends before
  you complete your statement.
