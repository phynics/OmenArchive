description: 'Choose a single statement you want the targets to believe. The fact
  could be narrow, such as "a dragon is circling overhead and wants to kill me"; wide-reaching,
  such as "all humanoids are disguised abominations"; or conceptual, such as "if I
  don''t live a kinder life, I''ll be punished in the afterlife." The targets'' experiences
  color how they react to this "truth" and how their behavior changes. If the statement
  changes what they perceive, they treat the change as a sudden revelation. The effect
  of the spell depends on the targets'' Will saves. If a target is already affected
  by fabricated truth, your spell tries to counteract it. If the counteract check
  fails, the outcome of the target''s saving throw can''t be worse than a success.


  Critical Success The target doesn''t believe the statement, and it knows you tried
  to trick it.


  Success The target doesn''t believe the statement or realize you tried to trick
  it.


  Failure The target believes the statement for 1 week.


  Critical Failure The target believes the statement with unlimited duration.'
