description: 'You transport the target into an extraplanar puzzle room of mysterious
  origin, locking them there. Once each turn as a single action, the target can attempt
  an Occultism check, Perception check, or Thievery check against your spell DC to
  solve the puzzle. Teleportation effects can''t carry the target outside the puzzle
  room unless they can also traverse the planes, such as Interplanar Teleport. When
  the spell ends, the target returns to the space it occupied when it was banished,
  or to the nearest space if the original is now filled.


  Critical Success The target solves the puzzle and escapes.


  Success The target is on the right path to the solution. If it was already on the
  right path, it solves the puzzle and escapes.


  Failure The target makes no progress toward a solution.


  Critical Failure The target makes no progress and, if it was on the right path,
  it no longer is.'
