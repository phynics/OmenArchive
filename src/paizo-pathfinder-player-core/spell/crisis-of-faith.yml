  To many deities, casting this spell on a follower of your own deity without significant
  cause is anathema.


  Critical Success The target is unaffected.


  Success The target takes half damage.


  Failure The target takes full damage; if the target can cast divine spells, it''s
  Stupefied 1 for 1 round.


  Critical Failure The target takes double damage, is Stupefied 1 for 1 round, and
