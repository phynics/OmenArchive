description: 'A globe of freezing darkness explodes in the area, dealing 8d10 cold
  damage to creatures in the area, plus an additional 8d4 void damage to living creatures.
  Each creature in the area must attempt a Reflex save.


  If the globe overlaps with an area of magical light or affects a creature affected
  by magical light, eclipse burst attempts to counteract the light effect.


  Critical Success The creature is unaffected.


  Success The creature takes half damage.


  Failure The creature takes full damage.


  Critical Failure The creature takes double damage and becomes Blinded by the darkness
  for an unlimited duration.


  Heightened (+1) The cold damage increases by 1d10 and the void damage against the
