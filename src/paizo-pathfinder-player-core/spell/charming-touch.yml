description: 'You infuse your target with attraction, causing it to act friendlier
  toward you. The target attempts a Will save. It gains a +4 circumstance bonus to
  this save if you or your allies recently threatened or were hostile to it.


  Critical Success The target is unaffected and aware you tried to charm it.


  Success The target is unaffected but thinks your spell was something harmless instead
  of charming touch, unless it identifies the spell.


  Failure The target''s attitude becomes Friendly toward you. If it was Friendly,
  it becomes Helpful. It can''t use hostile actions against you. If you use a hostile
  action against the target, the spell ends. You can Dismiss the spell. After the
  spell ends, the target doesn''t necessarily realize it was charmed unless its friendship
  with you or the actions you convinced it to take clash with its expectations. If
  it doesn''t realize you charmed it, you could potentially convince it to continue
  being your friend via mundane means.


  Critical Failure As failure, but the target is helpful.'
