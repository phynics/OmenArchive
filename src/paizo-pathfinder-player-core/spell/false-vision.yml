description: You create a false image that fools any attempts to scry on an area.
  Any scrying spell sees, hears, smells, and otherwise detects whatever you wish within
  the area, rather than what is actually in the area. You can Sustain the spell each
  round to change the illusion as you desire, including playing out a complex scene.
  If the scrying spell is of a higher rank than false vision, the scryer can attempt
  a Perception check to disbelieve the illusion, though even if they're successful,
  they can't learn what's truly going on in the area.
