description: 'The target makes no sound, preventing creatures from noticing it using
  hearing alone. The target can''t use sonic attacks, nor can it use actions with
  the auditory trait. This prevents it from casting spells due to the magical words
  involved in casting, with the exception of subtle spells.


  Heightened (4th) The spell creates an aura in a 10-foot emanation around the touched
  creature, silencing all sound in or passing through it. While within the aura, creatures
  are subject to the same effects as the target. Depending upon the position of the
  effect, a creature might notice the lack of sound reaching it (blocking off the
  noise coming from a party, for example).'
