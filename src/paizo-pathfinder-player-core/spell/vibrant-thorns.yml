description: |
  Your body sprouts a coat of brambly thorns that thrive on life magic. Adjacent creatures that hit you with a melee attack, as well as creatures that hit you with unarmed attacks, take (spell rank)[piercing] damage each time they do. Anytime you cast a vitality spell, the thorns' damage increases to (spell rank)d6[piercing] until the start of your next turn.
  
  Heightened (+1) The damage increases by 1, or 1d6 after you cast a vitality spell.
