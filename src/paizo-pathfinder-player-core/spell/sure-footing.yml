description: 'You free the target''s limbs from ailments that impede mobility. Attempt
  to counteract an effect of your choice imposing one of these conditions on the target:
  Clumsy, Grabbed, or Paralyzed. If you didn''t counteract the effect, but you would
  have if its counteract rank were 2 lower, instead suppress the effect until the
  beginning of your next turn. The effect''s duration doesn''t elapse while it''s
  suppressed.


  This spell can''t counteract or suppress curses, diseases, or conditions that are
  part of the target''s normal state.


  Heightened (4th) Add Immobilized, Slowed, and Restrained to the list of conditions.


  Heightened (6th) Add Petrified to the list of conditions.


  Heightened (8th) Add Stunned to the list of conditions.'
