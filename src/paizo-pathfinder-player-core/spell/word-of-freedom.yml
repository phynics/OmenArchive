description: 'You utter a liberating word of power that frees a creature. You suppress
  one of the following conditions of your choice: Confused, Frightened, Grabbed, Paralyzed,
  or Restrained. The target isn''t affected by the chosen condition, and if you suppress
  the Grabbed or Restrained condition, the target automatically breaks free from the
  grab or restraint when you Cast the Spell.


  If you don''t remove the effect that provided the condition, the condition returns
  after the spell ends. For example, if a spell was making the target Confused for
  1 minute, word of freedom would let the target act normally for a round, but the
  Confused condition would return afterward.'
