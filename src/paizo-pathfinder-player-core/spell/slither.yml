  area. Each creature in the area when you Cast the Spell takes 3d6[piercing] damage
  and 1d6[persistent,poison] damage from a biting snake, and it''s Grabbed or Restrained
  depending on its Reflex save. A creature that ends its turn in the area must also
  attempt this save, even if it''s already grabbed or restrained by the snakes. You
  can Dismiss the spell.


  Success The creature is unaffected.


  Failure The creature takes full damage and is grabbed by a snake. The snakes'' Escape
  DC is equal to your spell DC. A creature can attack a snake to release the creature.
