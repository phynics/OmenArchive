category: ritual
description: 'Area 1/2-mile-radius circle centered on you


  You cause the plants within the area to be healthier and more fruitful. In addition
  to other benefits of healthy plants, this increases the crop yield for farms, depending
  on your success. If you cast it in the area of a Blight, plant growth attempts to
  counteract the blight instead of producing its usual effect.


  Critical Success Double the crop yield in the area, or increase the area to a 1-mile
  radius.


  Success Increase the crop yield in the area by one-third.


  Failure The ritual has no effect.


  Critical Failure The flora in the area changes in an unanticipated way, determined
  by the GM but generally as contradictory to your true desires as possible (for instance,
  blighting crops when you would prefer to enrich them).'
