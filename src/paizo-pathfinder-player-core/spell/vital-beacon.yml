  Hit Points to the first creature, (spell rank)d8[healing,vitality] Hit Points to
  the second, (spell rank)d6[healing,vitality] Hit Points to the third, and (spell
  rank)d4[healing,vitality] Hit Points to the fourth, after which the spell ends.
  You can have only one vital beacon active at a time.


  Heightened (+1) The beacon restores one additional die of Hit Points each time it
  heals, using the same die size as the others for that step.'
