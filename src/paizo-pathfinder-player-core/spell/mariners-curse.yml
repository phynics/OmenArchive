description: 'You afflict the target with the curse of the roiling, unforgiving sea.
  The target must attempt a Will save.


  Critical Success The target is unaffected.


  Success The target becomes [Sickened 1](omen://condition/sickened). Reducing its
  sickened condition to 0 ends the curse.


  Failure The target becomes sickened 1 and can''t reduce its sickened condition below
  1 while the curse remains. The curse can be lifted by 4th-rank [Cleanse Affliction](omen://spell/cleanse-affliction)
  or similar magic. Whenever the target is sickened and on the water at least a mile
  from shore, it is also [Slowed 1](omen://condition/slowed).


  Critical Failure As failure, but the target becomes [Sickened 2](omen://condition/sickened).'
