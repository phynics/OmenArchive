  would have entered the globe (so if the spell also has targets outside the globe,
  or part of its area is beyond the globe, those targets or that area is affected
  normally).


  You must form the sphere in an unbroken open space, so its edges don''t pass through
  any creatures or objects, or the spell is lost (though creatures can enter the globe
  after the spell is cast).'
