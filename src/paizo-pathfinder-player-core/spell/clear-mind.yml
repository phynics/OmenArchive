  were 2 lower, instead suppress the effect until the beginning of your next turn.
  The effect''s duration doesn''t elapse while it''s suppressed. This spell can''t
  counteract or suppress conditions that are part of curses, diseases, or a natural
  state of the target.


  Heightened \(4th\) Add [Confused](omen://condition/confused), [Controlled](omen://condition/controlled),
  and [Slowed](omen://condition/slowed) to the list of conditions.


  Heightened \(6th\) As 4th rank, plus add [Doomed](omen://condition/doomed).


