  [Stupefied](omen://condition/stupefied?source=paizo-pathfinder-player-core). If
  you failed to counteract the effect but you would have if its counteract rank were
  2 lower, instead suppress the effect until the beginning of your next turn. The
  effect''s duration doesn''t elapse while it''s suppressed. This spell can''t counteract
  or suppress conditions that are part of curses, diseases, or a natural state of
  the target.


