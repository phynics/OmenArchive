description: You mystically transpose your current location with another. While in
  a wilderness environment, you transport yourself and items you're holding to a clear
  space you can see within range. If you have Favored Terrain and both your starting
  and ending position are in your favored terrain, the range increases to 180 feet.
  If you have an animal companion and it is adjacent to you, you can transport it
  along with you to an adjacent open space, but if this spell would bring any other
  creature with you, even in an extradimensional container, the spell is lost.
