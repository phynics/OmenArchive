description: 'You draw a chalk doorway on an unbroken surface, which opens into an
  extradimensional space. Any creature treating the drawing as an actual door can
  Interact to touch the doorknob and pass through. The warped, chalk-drawn room beyond
  the door is 20 feet in width, depth, and height. The space is unadorned and empty,
  with chalk lines indicating the corners of the walls.


  If the drawing is scrubbed away, the underlying surface is broken, or a creature
  attempts to enter the space that would put it over capacity, the space begins to
  collapse. The space ejects one creature at random each round, depositing it on the
  nearest open ground, until all creatures are returned outside.'
