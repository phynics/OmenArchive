description: You shroud a creature from others' senses. The target becomes Invisible,
  but not merely to vision. The invisibility granted by disappearance applies to all
  precise senses an observer might have. It's still possible for a creature to find
  the target by Seeking using various senses, looking for disturbed dust, hearing
  gaps in the sound spectrum, or finding some other way to discover the presence of
  a creature that is otherwise undetectable.
