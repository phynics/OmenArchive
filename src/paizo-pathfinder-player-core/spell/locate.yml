description: 'You learn the direction to the target (if you picked a specific object,
  such as "my mother''s sword") or the nearest target (if you picked a type of object,
  such as "swords"). If the target is a specific object, you must have observed it
  directly with your own senses. If it''s a type of object, you still need to have
  an accurate mental image of the type of object. If there''s lead or running water
  between you and the target, this spell can''t locate the object. This means you
  might find a type of object farther away if the nearest one is behind lead or running
  water.


  Heightened (5th) You can target a specific creature or ancestry instead of an object,
  but you must have met or seen up close the creature or ancestry you want to target.'
