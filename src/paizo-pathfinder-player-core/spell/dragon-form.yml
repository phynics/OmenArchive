description: |
  Calling upon powerful magic, you gain a Large dragon battle form. When you Cast this Spell, choose one type of common dragon or another type to which your GM allows access. While in this form, you gain the dragon trait. You have hands in this battle form and can take manipulate actions. You can Dismiss the spell.
  
  You gain the following statistics and abilities regardless of which battle form you choose:
  
  AC = 18 + your level. Ignore your armor's check penalty and Speed reduction.
  
  10 temporary Hit Points.
  
  Speed 40 feet, fly Speed 100 feet.
  
  Resistance 10 against the damage type of your Dragon Breath (see below).
  
  Darkvision and imprecise scent 60 feet.
  
  One or more unarmed melee attacks specific to the battle form you choose, which are the only attacks you can Strike with. You're trained with them. Your attack modifier is +22, and your damage bonus is +6. These attacks are Strength based (for the purpose of the Enfeebled condition, for example). If your unarmed attack modifier is higher, you can use it instead. See below for more on these attacks.
  
  Athletics modifier of +23, unless your own modifier is higher.
  
  Breath Weapon 2 (varies) The shape, damage, and damage type of your breath weapon depend on your specific dragon form (see below). A creature in the area attempts a basic save against your spell DC. This is a Reflex save unless stated otherwise in the special ability description for your specific dragon form. Once activated, your breath weapon can't be used again for 1d4 rounds. Your breath weapon has the trait corresponding to the type of damage it deals.
  
  You also gain specific abilities based on the type of dragon:
  
  Adamantine
  
  Melee 1 jaws, Damage 2d12 piercing plus 2d6 bludgeoning;
  
  Melee 1 claw (agile), Damage 3d10 slashing;
  
  Melee 1 tail (reach 10 feet), Damage 3d10 bludgeoning;
  
  breath weapon 30-foot cone, (ternary(gte(spell rank,8),14,10))d6[bludgeoning]|options:area-damage
  
  Conspirator
  
  Melee 1 jaws, Damage 2d12 piercing plus 2d6 poison;
  
  Melee 1 claw (agile), Damage 3d10 slashing;
  
  Melee 1 tail (reach 10 feet), Damage 3d10 bludgeoning;
  
  breath weapon 30-foot cone, (ternary(gte(spell rank,8),14,10))d6[poison]|options:area-damage
  
  Diabolic
  
  Melee 1 jaws, Damage 2d12 piercing plus 2d6 fire;
  
  Melee 1 claw (agile), Damage 3d10 slashing;
  
  Melee 1 tail (reach 10 feet), Damage 3d10 bludgeoning;
  
  breath weapon 30-foot cone, (ternary(gte(spell rank,8),14,10))d6[fire]|options:area-damage
  
  Empyreal
  
  Melee 1 jaws, Damage 2d12 piercing plus 2d6 spirit;
  
  Melee 1 claw (agile), Damage 3d10 slashing;
  
  Melee 1 tail (reach 10 feet), Damage 3d10 bludgeoning;
  
  breath weapon 30-foot cone, (ternary(gte(spell rank,8),14,10))d6[spirit]|options:area-damage
  
  Fortune
  
  Melee 1 jaws, Damage 2d12 piercing plus 2d6 force;
  
  Melee 1 claw (agile), Damage 3d10 slashing;
  
  Melee 1 tail (reach 10 feet), Damage 3d10 bludgeoning;
  
  breath weapon 30-foot cone, (ternary(gte(spell rank,8),14,10))d6[force]|options:area-damage
  
  Horned
  
  Melee 1 jaws, Damage 2d12 piercing plus 2d6 poison;
  
  Melee 1 claw (agile), Damage 3d10 slashing;
  
  Melee 1 tail (reach 10 feet), Damage 3d10 bludgeoning;
  
  breath weapon 30-foot cone, (ternary(gte(spell rank,8),14,10))d6[poison]|options:area-damage
  
  Mirage
  
  Melee 1 jaws, Damage 2d12 piercing plus 2d6 mental;
  
  Melee 1 claw (agile), Damage 3d10 slashing;
  
  Melee 1 tail (reach 10 feet), Damage 3d10 bludgeoning;
  
  breath weapon 30-foot cone, (ternary(gte(spell rank,8),14,10))d6[mental]|options:area-damage
  
  Omen
  
  Melee 1 jaws, Damage 2d12 piercing plus 2d6 mental;
  
  Melee 1 claw (agile), Damage 3d10 slashing;
  
  Melee 1 tail (reach 10 feet), Damage 3d10 bludgeoning;
  
  breath weapon 30-foot cone, (ternary(gte(spell rank,8),14,10))d6[mental]|options:area-damage
  
  Tradition Resistance If the dragon's magical tradition matches that of your dragon form spell, you gain the listed ability. Arcane resistance 5 against damage from spells; divine resistance 10 to spirit, vitality, and void; occult resistance 10 to mental; primal resistance 5 to physical damage.
  
  Heightened (8th) Your battle form is Huge, you gain a +20-foot status bonus to your fly Speed, and your attacks have 10-foot reach (or 15-foot reach if they previously had 10-foot reach). You instead gain AC = 21 + your level, 15 temporary HP, an attack modifier of +28, a damage bonus of +12, and Athletics +28. Your Dragon Breath deals an additional 4d6 damage.
