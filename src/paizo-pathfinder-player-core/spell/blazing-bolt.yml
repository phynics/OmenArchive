  ray at a different target, to a maximum of three rays targeting three different
  targets for 3 actions. These attacks each increase your multiple attack penalty,
  but you don''t increase your multiple attack penalty until after you make all the
  spell attack rolls for blazing bolt. If you spend 2 or more actions Casting the
  Spell, the damage increases to 4d6 fire damage on a hit, and it still deals double
  damage on a critical hit.


  Heightened (+1) The damage to each target increases by 1d6 for the 1-action version,
