description: 'You drape the target in a mantle of swirling shadows that make it harder
  to see. The cloak reduces bright light within a 20-foot emanation to dim light.
  This is a form of magical darkness and can therefore overcome non-magical light
  or attempt to counteract magical light.


  The target can use Concealed condition gained from the shadows to Hide, though observant
  creatures can still follow the moving aura of shadow, making it difficult for the
  target to become completely Undetected. The target can use an Interact action to
  remove the cloak and leave it behind as a decoy, where it remains, reducing light
  for the rest of the spell''s duration. If anyone picks up the cloak after it''s
  been removed by the original target, the cloak evaporates and the spell ends.'
