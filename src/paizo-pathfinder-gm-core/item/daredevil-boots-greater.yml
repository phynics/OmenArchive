description: 'These brightly colored, soft-soled boots motivate you to perform risky
  stunts and grant you the agility to succeed. The boots grant you a +3 item bonus
  to Acrobatics checks and a +2 circumstance bonus to checks to [Tumble Through](omen://action/tumble-through?source=paizo-pathfinder-player-core)
  an enemy''s space.

  The boots can grip solid surfaces and help you avoid a fall, allowing you to use
  the [Grab An Edge](omen://action/grab-an-edge?source=paizo-pathfinder-player-core)
  reaction even if your hands aren''t free. You treat falls as 10 feet shorter or,
  if you have the [Cat Fall](omen://feat/cat-fall?source=paizo-pathfinder-player-core)
  feat, treat your proficiency rank in Acrobatics as one degree better to determine
  the benefits of that feat. If you have Cat Fall and are already legendary in Acrobatics,
  you can choose the speed of your fall, from 60 feet per round up to normal falling
  speed.

  Activate—Daredevil Impulse 2 \(concentrate\)

  Effect The boots cast [Unfettered Movement](omen://spell/unfettered-movement?source=paizo-pathfinder-player-core)
  on you.'
