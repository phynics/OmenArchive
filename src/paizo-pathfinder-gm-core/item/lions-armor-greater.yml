description: 'Various parts of this +3 greater resilient half plate are forged into
  the shape of a lion''s head. The golden lion heads grant you a commanding presence
  and seem to actively growl at your enemies, granting you a +3 item bonus to Intimidation.

  The lions on the armor work in tandem with the lion on a lion''s shield. If you
  critically hit with the lion''s shield using Lion Bite, the lions on the armor roar
  in support of the shield, causing the target of the shield''s Strike to become [Frightened
  1](omen://condition/frightened?source=paizo-pathfinder-player-core).

  Activate—Roar of the Pride 2 \(concentrate\)

  Effect The lions on your armor roar, attempting to cow your enemies. Attempt a check
  to [Demoralize](omen://action/demoralize?source=paizo-pathfinder-player-core) each
  enemy within 30 feet of you. On a critical success, the target is also [Fleeing](omen://condition/fleeing?source=paizo-pathfinder-player-core)
  for 1 round.'
