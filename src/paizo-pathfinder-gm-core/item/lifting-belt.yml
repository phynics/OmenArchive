  Activate—Assisted Lift 2 \(manipulate\)

  Effect You lift an object of up to 8 Bulk as though it were weightless. This requires
  two hands, and if the object is locked or otherwise held in place, you can attempt
  to Force it Open using Athletics as part of this activation. The object still has
  its full weight and Bulk for all other purposes-you just ignore that weight. The
