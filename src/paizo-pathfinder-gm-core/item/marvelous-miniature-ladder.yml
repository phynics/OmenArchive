description: 'Activate 1 \(manipulate\)

  Every marvelous miniature is an exceptionally small replica of a real creature or
  object. The miniature is made from wood, pewter, or other simple materials, and
  features a rune etched into the underside of the replica''s base. Marvelous miniatures
  sometimes come packaged together; for example, the camping set features the boat,
  campfire, and horse miniatures. Activating a marvelous miniature causes it to transform
  into another creature or object, which then can be used as normal for that object.
  Each miniature can be activated only once, with most of them permanently becoming
  the item in their description.

  When activated, this miniature transforms permanently into a 20-foot-long wooden
  ladder.'
