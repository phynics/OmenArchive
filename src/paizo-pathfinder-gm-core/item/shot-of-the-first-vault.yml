description: 'Legends claim that some long-forgotten god stole the original bundle
  of shots of the First Vault from Abadar''s repository. Since then, individual pieces
  have turned up throughout the multiverse. When you pick up a shot of the First Vault,
  it immediately reshapes itself to function with any ranged weapon and establishes
  you as its owner until another creature picks it up. As its owner, you can use the
  shot''s single-action activation after shooting it.

  Instead of rolling weapon damage dice, a shot of the First Vault deals 25 damage
  plus any bonuses or additional damage as if 25 were the result of the weapon''s
  damage dice; the damage type matches that normally dealt by the weapon. Upon damaging
  a creature, the shot of the First Vault shatters, and the fragments ricochet to
  hit any other enemies within 30 feet, making attack rolls with the same attack bonus.
  The shattered fragments remain lodged in the creatures they damage; the creatures
  are [Clumsy 2](omen://condition/clumsy?source=paizo-pathfinder-player-core) while
  the fragments remain in place. A total of 3 Interact actions are required to remove
  the fragments from yourself or an adjacent creature; alternatively, a single action
  and a successful DC 30 Medicine check can be used. A critical failure on this Medicine
  check deals 10 persistent bleed damage to the creature with the embedded fragment.

  Activate—Reload Order A \(concentrate\)

  Effect You recall the shot of the First Vault, which automatically reloads itself
  into your weapon. If the shot had fragmented, the fragments violently dislodge themselves,
  dealing 15 persistent bleed damage to each creature in which they were embedded.
  The fragments then unite to re-form the shot of the First Vault, which automatically
  reloads itself into your weapon.

  Activate—Vault Deposit 3 \(manipulate\)

  Effect You line up a perfectly aimed attack directly toward the First Vault. You
  Strike a creature, then the shot of the First Vault attempts to bring your target
  with it as it returns to the First Vault. Unless your attack roll is a critical
  failure, the creature must attempt a DC 45 Reflex save; this effect has the incapacitation
  trait. Regardless, the shot of the First Vault returns to the First Vault.

  Destruction If 10 shots of the First Vault are all fired at the same group of keketar
  or izfiitar proteans within 1 minute of each other, each shot was a hit, and the
  shots are then recalled, the shots collide as they attempt to re-form and crumble
  to dust.'
