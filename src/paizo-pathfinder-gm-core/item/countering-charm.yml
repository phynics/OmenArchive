description: 'This glittering charm is made of a gemstone flawed with a leaden inclusion.
  Spellcasters can cast spells into countering charms that they''ve invested or that
  are invested by a willing creature. The spell''s effect doesn''t occur; the spell''s
  power is instead stored within the charm, replacing any spell previously there.
  The charm can hold only spells cast from spell slots, not cantrips or focus spells.
  While the charm is invested, the creature who has invested it knows what spell is
  stored within and automatically identifies that spell when it''s cast.

  Activate—Counter R \(manipulate\)

  Effect You present the charm and attempt to counteract the triggering spell, using
  the rank of the spell stored in the charm and a counteract modifier of +20. This
  expends the spell held in the charm.'
