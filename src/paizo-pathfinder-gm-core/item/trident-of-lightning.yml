description: 'Activate 2 \(concentrate, manipulate\)

  This item looks like a normal trident carved with Gozren motifs. If thrown without
  being activated, it wobbles in the air and fails to strike true.

  When you Activate the trident, the carvings crackle with electricity. You then hurl
  the trident. It shatters immediately after leaving your hand and unleashes its magic
  as a 4th-rank [Lightning Bolt](omen://spell/lightning-bolt?source=paizo-pathfinder-player-core)
  originating from your space.

  The bolt deals 5d12 electricity damage and has a DC 25 basic Reflex save.'
