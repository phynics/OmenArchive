description: 'Over millennia, these mysterious, intricately cut gemstones have been
  hoarded by mystics and fanatics hoping to discover their secrets. Despite their
  myriad forms and functions, these stones are purportedly all fragments of crystal
  tools used by otherworldly entities to construct the universe in primeval times.

  When you invest one of these precisely shaped crystals, the stone orbits your head
  instead of being worn on your body. You can stow an aeon stone with an Interact
  action, and an orbiting stone can be snatched out of the air with a successful Disarm
  action against you. A stowed or removed stone remains invested, but its effects
  are suppressed until you return it to orbit your head again.

  There are various types of aeon stones, each with a different appearance and magical
  effect. Each aeon stone also gains a resonant power when slotted into a special
  magical item called a wayfinder.

  An Amplifying aeon stone must be activated to provide a benefit. The resonant power
  grants you a +2 item bonus to Arcana, Nature, Occultism, or Religion checks-whichever
  corresponds to the tradition of the last spell you enhanced with this aeon stone.

  Activate—Amplify 1 \(concentrate, spellshape\)

  Effect If your next action is to Cast a Spell, that spell''s rank is 1 higher \(maximum
  10th rank\) for the purposes of counteracting and being counteracted.'
