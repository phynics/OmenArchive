description: 'A floating shield is usually carved with wing motifs. This buckler \(Hardness
  6, HP 24, BT 12\) can protect you on its own.

  Activate—Float A \(manipulate\)

  Effect The shield magically releases itself and floats off your arm into the air
  next to you, granting you its bonus automatically, as if you had Raised the Shield.

  Because you''re not wielding the shield, you can''t use reactions such as Shield
  Block with the shield, but you gain its benefits even when using both of your hands.

  After 1 minute, the shield drops to the ground, ending its floating effect. While
  the shield is adjacent to you, you can Interact to grasp it, ending its floating
  effect early.'
