description: 'This brass censer dangles on a length of chain. Most thuribles of revelation
  are adorned with swirling Empyrean text, though some are iron and feature Diabolic
  or Chthonian text.

  Activate—Burn Incense 2 \(manipulate\)

  Cost incense worth at least 5 gp

  Effect You light the incense inside the censer, and it burns for 1 hour. During
  that time, as long you are holding the thurible, you gain a +2 item bonus to Religion
  checks, and any critical failure you roll when you Decipher Writing of a religious
  nature is a failure instead.

  Once per day, when you activate the thurible, you can increase its revelations.
  During that activation, you can hold the thurible up to your eyes with an Interact
  action to gain the effects of [See the Unseen](omen://spell/see-the-unseen?source=paizo-pathfinder-player-core)
  for 1 round by peering through the smoke.'
