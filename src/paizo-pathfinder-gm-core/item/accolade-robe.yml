description: 'Although not all wizards have gone through formal training, it''s become
  tradition to enchant robes representing the arduous training required and festoon
  them with honors one has earned. Typically, an accolade robe is styled after a single
  wizard school, with appropriate colors and symbols. Wearing these robes grants a
  +2 item bonus to Arcana checks.

  The pockets of the robe tie to an extradimensional space that can hold 1 Bulk of
  items, none of which can have greater than light Bulk. The items must be related
  to spellcasting and academics—spellbooks, scrolls, wands, scholarly journals, and
  other academic supplies the GM allows. These items do not count against your Bulk
  limit. You can Interact to retrieve or stow items normally.

  Activate—Review 1 \(concentrate, manipulate\)

  Effect You retrieve an item of your choice from the robe''s storage, then Recall
  Knowledge.

  Activate—Extra Credit F \(concentrate\)

  Effect You gain 1 Focus Point, which you can spend only to cast a school spell.
  If you don''t spend this Focus Point by the end of this turn, it is lost.'
