description: 'This top has 20 divisions, painted in a chaotic mess of clashing colors.
  When spun, the top quickly settles on a side and generates a strange magical effect
  based on the side that lands face-up.

  Activate—Spin the Top 2 \(concentrate, manipulate\)

  Effect Choose a creature within 60 feet to target and roll a d20 on the table below
  to determine the top''s effect. You make any decisions for a spell cast by the top
  unless otherwise indicated, except that it must target the creature you chose, or
  the creature you chose must be the center of the spell''s area, if it has an area
  but no targets. If the spell''s range is less than 60 feet, increase the range to
  60 feet.

  Any spell DC required is DC 27, and any spell attack roll required is +17. If the
  top casts a spell on you, you don''t get a saving throw or other defense against
  it.

  The top can''t be activated again for 1d4 hours

  Madcap Top Effect

  d20

  Madcap Top Effect

  1

  You spin just like the top. You are [Stunned](omen://condition/stunned?source=paizo-pathfinder-player-core)
  for 1 round and then [Confused](omen://condition/confused?source=paizo-pathfinder-player-core)
  for 1 round.

  2

  [Slow](omen://spell/slow?source=paizo-pathfinder-player-core) affects the target.

  3

  [Shrink](omen://spell/shrink?source=paizo-pathfinder-player-core) affects you for
  1 day.

  4

  A 3rd-rank [Illusory Disguise](omen://spell/illusory-disguise?source=paizo-pathfinder-player-core)
  makes you look like the target.

  5

  A statue of the target, made of chocolate or candy, appears adjacent to you.

  6

  Gravity reverses, sending you and the target 30 feet in the air, immobilized. You
  both fall at the start of your next turn.

  7

  [Mind Reading](omen://spell/mind-reading?source=paizo-pathfinder-player-core) affects
  the target, and the top loudly recites what it discovers.

  8

  [Laughing Fit](omen://spell/laughing-fit?source=paizo-pathfinder-player-core) affects
  the target.

  9

  A fountain erupts from the top, spraying wine for 10 minutes.

  10

  [Translocate](omen://spell/translocate?source=paizo-pathfinder-player-core) affects
  you, but you teleport through Hell.

  11

  [Invisibility](omen://spell/invisibility?source=paizo-pathfinder-player-core) affects
  you.

  12

  Four singing skeletons appear to serenade you and your allies for 1 minute, granting
  a +1 status bonus to attack rolls, Perception checks, saving throws, and skill checks.

  13

  The top flings 1 cp at you.

  14

  [Confusion](omen://spell/confusion?source=paizo-pathfinder-player-core) affects
  the target.

  15

  You and the target change places; this is a teleportation effect.

  16

  [Banishment](omen://spell/banishment?source=paizo-pathfinder-player-core) affects
  the target, or paralyze if the target''s on its home plane.

  17

  Rainbow dye explodes and covers you for 24 hours.

  18

  The top creates a [Toxic Cloud](omen://spell/toxic-cloud?source=paizo-pathfinder-player-core)
  centered on the target.

  19

  A random unattended object within 60 feet of you sprouts animal legs and follows
  you, reverting when the top''s activation recharges.

  20

  Spin again, and the target also spins as though it had activated the top.'
