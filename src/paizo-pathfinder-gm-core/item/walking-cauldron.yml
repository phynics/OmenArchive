description: 'This iron cauldron stands upon sturdy iron crow''s feet. A walking cauldron
  has a land Speed of 25 feet and can be used as a suitable tool to Craft potions,
  oils, or other liquids.

  As a single action, which has the auditory and concentrate traits, you can command
  the cauldron to either follow you or to stand in place. When following you, the
  cauldron does its best to remain within 30 feet of you, but its ungainly movements
  are too imprecise to predictably direct in a combat encounter or other situation
  where seconds and precise locations count. It can carry up to 2 Bulk of ingredients
  for potions or other liquids inside of itself while following you, but if overloaded
  or if you put anything else inside it, it stands in place and refuses to move until
  10 minutes after you remove the excess.'
