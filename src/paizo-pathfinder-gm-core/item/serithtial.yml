description: 'Perception +28; normal vision and hearing within 60 feet

  Communication empathy \(partner only\)

  Skills Iomedae Lore +29, Religion +26, Zon-Kuthon Lore +29

  Int +2, Wis +1, Cha +2

  Will +30

  The legendary blade Serithtial is said to have been forged by Iomedae, goddess of
  honor, justice, and valor. She is an intelligent +4 major striking holy bastard
  sword. Although the sword is made of steel, Serithtial is also treated as cold iron
  and silver, allowing her to deal more damage to certain supernatural creatures.
  She glows as bright as a torch, but you or Serithtial can suppress or resume this
  glow as a single action, which has the concentrate trait. In addition, Strikes with
  Serithtial deal an additional 2d6 damage against creatures that are worshippers
  of Zon-Kuthon. While wielding Serithtial, against effects created by followers of
  Zon-Kuthon you gain the benefit of [Unfettered Movement](omen://spell/unfettered-movement?source=paizo-pathfinder-player-core),
  a +4 status bonus to saves against death and void effects, void resistance 10, and
  suppress the [Doomed](omen://condition/doomed?source=paizo-pathfinder-player-core)
  condition.

  Serithtial was forged as a bastard sword, and she reverts to this shape when no
  one wields her, but she can also detect what sort of blade her current wielder prefers
  and transform into it \(choosing from dagger, shortsword, longsword, scimitar, falchion,
  greatsword, rapier, or bastard sword\) using an action, which she does when first
  held. The wielder can empathically tell Serithtial to transform at any time by using
  a single action, which has the concentrate trait, after which Serithtial uses an
  action to transform.

  Serithtial is willing to work with almost any partner as long as they are dedicated
  to defeating the great wyrm Kazavon and the forces of Zon-Kuthon. If you ignore
  those threats and pursue your own agenda instead, before long Serithtial attempts
  to seize control of your body \(DC 45 Will save to resist her control\), though
  she typically remains in control for only long enough to find a more worthy partner.
  You can attempt a new Will save each day to retake control of your body.

  Activate—Grace of the Inheritor \(concentrate\)

  Effect Serithtial spends the appropriate number of actions and casts a 9th-rank
  [Heal](omen://spell/heal?source=paizo-pathfinder-player-core) or [Ring of Truth](omen://spell/ring-of-truth?source=paizo-pathfinder-player-core)
  spell \(DC 45 for either of the two spells\).

  Destruction If Kazavon or a great wyrm shadow dragon who is a worshipper of Zon-Kuthon
  uses its dragon breath on Serithtial while she is unattended, the sword melts into
  a pool of mundane iron.'
