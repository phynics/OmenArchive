description: 'Activate 2 \(concentrate\)

  This cube of blackened iron is affixed to a weapon with an iron chain. When you
  activate the cube, make a melee Strike. If it hits and deals damage, you can attempt
  an Athletics check to [Trip](omen://action/trip?source=paizo-pathfinder-player-core)
  the creature you hit. If this knocks the target [Prone](omen://condition/prone?source=paizo-pathfinder-player-core),
  the target takes 2d6 bludgeoning damage from the force of the impact. If you''re
  wielding a two-handed melee weapon, you can ignore Trip''s requirement that you
  have a free hand. Both attacks count toward your multiple attack penalty, but the
  penalty doesn''t increase until after you''ve made both of them.

  If you have the [Slam Down](omen://feat/slam-down?source=paizo-pathfinder-player-core)
  feat, ignore the normal size restrictions for the trip and increase the damage dice
  if you knock the target prone to the damage die of your weapon if it''s higher than
  d6.'
