description: 'Appearing to be just a small, flat disk made of twigs, this item can
  grow and shrink. Once formed, this oak staff is carved with twisting patterns along
  its length.

  Activate—Form Staff A \(manipulate\)

  Effect You cause the twigs to rapidly grow or contract, reshaping into a +1 striking
  staff, a +1 striking bo staff, or its disk form. In its disk form, it has negligible
  Bulk and must be held in one hand to be activated. In the other forms, it has the
  same Bulk as a normal weapon of its type. You can switch your grip as part of the
  activation.

  When you expand the item, you can use the force of the expansion to High Jump or
  to try to Force Open a door or the like by wedging the disk into a gap before activation.
