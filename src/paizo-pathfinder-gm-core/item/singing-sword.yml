description: 'Perception +11; precise vision 30 feet, imprecise hearing 30 feet

  Communication speech \(Common and four other common languages\)

  Skills Performance +15

  Int +2, Wis +2, Cha +4

  Will +13 \(+17 against attempts to quiet its singing\)

  A singing sword is a +1 striking longsword imbued with the consciousness of a boisterous
  bard, and therefore constantly sings at all times. A singing sword can''t stop singing
  and in fact communicates in no way other than by singing. A successful Diplomacy
  or Intimidation check against its Will DC can convince it to quiet its singing to
  a whisper for 10 minutes, or 20 minutes on a critical success, though it quickly
  grows displeased at anyone who attempts this repeatedly. The singing sword can spend
  its actions to attack on its own, with the effects of a dancing weapon''s activation,
  except that its attack modifier is +12. Additionally, it can perform the following
  activations; each casts a composition spell and follows all the usual rules for
  compositions.

  Activate—Courageous Anthem A \(concentrate\)

  Effect The singing sword casts [Courageous Anthem](omen://spell/courageous-anthem?source=paizo-pathfinder-player-core).

  Activate—Rallying Anthem A \(concentrate\)

  Effect The singing sword casts [Rallying Anthem](omen://spell/rallying-anthem?source=paizo-pathfinder-player-core).

  Activate—Counter Performance R \(concentrate\)

  Effect The singing sword casts [Counter Performance](omen://spell/counter-performance?source=paizo-pathfinder-player-core).'
