name: bullying press
traits:
- flourish
count: reaction
trigger: You attempt a melee Strike against your opponent, but haven't rolled yet.
requirements: You're in a duel, you're trained in Intimidation, and you rolled an
  Intimidation check for initiative this round.
description: If you hit, your opponent becomes [Frightened 1](omen://condition/frightened?source=paizo-pathfinder-player-core).
  If your opponent is using Perception for initiative when this ability is used, they
  become [Frightened 2](omen://condition/frightened?source=paizo-pathfinder-player-core)
  instead.
mechanicsScope: encounter
