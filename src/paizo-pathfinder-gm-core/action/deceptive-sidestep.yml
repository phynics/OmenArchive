---
name: deceptive sidestep
traits:
- misfortune
count: reaction
trigger: An opponent hits, but does not critically hit you, with a melee Strike.
requirements: You're in a duel, you're trained in Deception, and you rolled a Deception
  check for initiative this round.
description: You draw your enemy in and pull away at the last moment. The triggering
  opponent must roll again and take the second result. If your opponent is using Intimidation
  for initiative when this ability is used, they also take a -2 circumstance penalty
  to the second attack roll.
mechanicsScope: encounter
