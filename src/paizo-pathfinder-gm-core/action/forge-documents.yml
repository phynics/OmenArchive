---
name: forge documents
traits:
- downtime
- secret
description: You prepare forgeries that might serve as convincing props. Attempt a
  hard or very hard Society check.
success: You create convincing forgeries and gain 1 EP you can use only when presenting
  some form of paperwork.
failure: You create unconvincing documents. You gain 1 EP that \(unknown to you\)
  grants no benefit when used.
criticalFailure: As a failure, but a PC who tries to use the Edge Point gets a critical
  failure, even if they use the Edge Point after rolling a failure.
mechanicsScope: encounter
