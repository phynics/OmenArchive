---
name: bribe contact
traits:
- downtime
- secret
requirements: You've successfully Gained a Contact.
description: 'Cost A bribe worth at least one-tenth of the Currency per Additional
  PC listed on Party Treasure by level. Doubling this amount grants a +2 circumstance
  bonus to the check.

  You offer a bribe to your contact to help the heist in some way. Attempt a hard
  or very hard Deception or Diplomacy check.'
success: The contact accepts the bribe and you gain 1 EP.
failure: You believe you successfully Bribed your Contact and gained 1 EP, but in
  fact the contact informs the opposition of the attempted bribery, adding 1 AP to
  the infiltration. The GM can reveal that this Edge Point grants no benefit at any
  point during the infiltration, as befits the story.
criticalFailure: As failure, but adding 2 AP to the infiltration.
mechanicsScope: encounter
