---
name: sense weakness
count: reaction
trigger: You attempt a melee Strike against your opponent, but haven't rolled yet.
requirements: You're in a duel, you're trained in Perception, and you rolled a Perception
  check for initiative this round.
description: You pick a precise moment to attack, giving you an edge. Your opponent
  is [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core) against
  the attack. If your opponent is using Deception for initiative when this ability
  is used, they are instead off-guard until the start of their next turn.
mechanicsScope: encounter
