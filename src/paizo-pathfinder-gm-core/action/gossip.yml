---
name: gossip
traits:
- downtime
- secret
description: You seek out rumors about the infiltration's target. Attempt a normal,
  hard, or very hard Diplomacy check.
criticalSuccess: You gain inside information about the location or group you're trying
  to infiltrate. This grants you a +2 circumstance bonus to future checks you attempt
  for preparation activities for this infiltration. If you share this information,
  those you share it with also gain this bonus.
success: You gain inside information about the place or group you're attempting to
  infiltrate that aids your planning.
failure: You learn nothing.
criticalFailure: You hear a few mistaken rumors and take a -2 circumstance penalty
  to your next check for a preparation activity. Word spreads around that you're asking
  after that group or individual, increasing your Awareness Points by 1.
mechanicsScope: encounter
