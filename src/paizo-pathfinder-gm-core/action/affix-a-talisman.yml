---
name: affix a talisman
traits:
- exploration
- manipulate
requirements: You must use a [Repair Toolkit](omen://item/repair-toolkit?source=paizo-pathfinder-player-core)
description: You spend 10 minutes affixing a talisman to an item, placing the item
  on a stable surface and using the repair toolkit with both hands. You can also use
  this activity to remove a talisman. Attaching more than one talisman to an item
  deactivates all the talismans. They must be removed and re-affixed before they can
  be used again.
mechanicsScope: encounter
