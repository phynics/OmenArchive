---
name: board
traits:
- move
count: one_action
requirements: You are adjacent to a point of entry on the vehicle you are attempting
  to board.
description: You board a vehicle through an open top, a door, a portal, or a hatch;
  if you're already on board, you can instead use this action to disembark into an
  empty space adjacent to the vehicle's point of entry. Using this action while the
  vehicle is in motion is challenging, requiring a successful Acrobatics or Athletics
  check with a DC equal to the vehicle's AC.
mechanicsScope: encounter
