name: dcs by spell rank
description: 'When you''re determining a skill DC based on something that has a level,
  use the table below to set the DC. Find the level of the subject, and assign the
  corresponding DC. Since spells use a 1–10 scale, use the Spell Rank column for them.


  Use these DCs when a PC needs to Identify a Spell or Recall Knowledge about a creature,
  attempts to Earn Income by performing a task of a certain level, and so on. You
  can also use the level-based DCs for obstacles instead of assigning a simple DC.
  For example, you might determine that a wall in a high-level dungeon was constructed
  of smooth metal and is hard to climb. You could simply say only someone with master
  proficiency could climb it and use the simple DC of 30. Or you might decide that
  the 15th-level villain who created the dungeon crafted the wall and use the 15th-level
  DC of 34. Either approach is reasonable!


  Note that PCs who invest in a skill become more likely to succeed at a DC of their
  level as they increase in level, and the listed DCs eventually pose very little
  challenge for them.


  DCs by level: level 0 DC 14, level 1 DC 15, level 2 DC 16, level 3 DC 18, level
  4 DC 19, level 5 DC 20, level 6 DC 22, level 7 DC 23, level 8 DC 24, level 9 DC
  26, level 10 DC 27, level 11 DC 28, level 12 DC 30, level 13 DC 31, level 14 DC
  32, level 15 DC 34, level 16 DC 35, level 17 DC 36, level 18 DC 38, level 19 DC
  39, level 20 DC 40, level 21 DC 42, level 22 DC 44, level 23 DC 46, level 24 DC
  48, level 25 DC 50.


  DCs by spell rank: rank 1 DC 15, rank 2 DC 18, rank 3 DC 20, rank 4 DC 23, rank
  5 DC 26, rank 6 DC 28, rank 7 DC 31, rank 8 DC 34, rank 9 DC 36, rank 10 DC 39.
  If the spell is uncommon or rare, its difficulty should be adjusted accordingly.'
