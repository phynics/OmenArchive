name: victory points
description: 'You''ll often find that your games could use a way to track progress
  toward a goal so that you don''t have to just keep everything in your head. This
  section explains how to build your own subsystems for tracking success via Victory
  Points. Many other subsystems throughout the chapter use these as well, though often
  by a different name.


  Victory Points (or VP) are a powerful tool in your GM arsenal, as they allow you
  to track the PCs'' progress using a subsystem to go beyond the results of a single
  check. Victory Points are versatile; you could track and resolve them within a single
  encounter, or you could collect them over the course of an entire campaign to determine
  the ending of the story.


  It can be fun to rename your Victory Points, to better reflect the subsystem they
  track. The term “Victory Points” is unspecific, so you can create a name for your
  Victory Points that fits the theme of your adventure and helps the players feel
  more like they are taking part in the type of activity your subsystem represents.
  Examples of renamed VPs include Influence Points (page 187), Infiltration Points
  (page 196), Research Points (page 190), and Reputation Points (page 200). The name
  should be representative, and the PCs should understand what it refers to. You can
  leave off the word “Points” if you prefer, though this section often retains it
  while describing how Victory Points can be used.


  There are a few common structures for tracking Victory Points that you might use
  for your new subsystem. You could come up with a structure based off one of the
  subsystems below, or you could create your own completely different structure if
  none of them match the way you’re running your game. The most important thing is
  to consider how the PCs or their opposition gain or lose various forms of Victory
  Points.


  The most common structure is to accumulate Victory Points toward a total, either
  stopping after reaching a success threshold or collecting as many Victory Points
  as possible in a given time frame and then measuring the results against various
  thresholds. The influence subsystem on page 187 is a great example of this structure
  in action: each PC has a certain number of chances to influence various NPCs, and
  after reaching a particular threshold of Victory Points with an NPC, the PCs have
  convinced that NPC.


  In a variation of this structure, the PCs'' adversaries can also accumulate Victory
  Points, giving the PCs a moving target—either to reach the goal before the adversary
  or to have more Victory Points than the adversary at the end of a given time frame.
  This is a great structure for you to use in a situation where the PCs face opposition
  rather than having the PCs accumulate Victory Points while adversaries decrease
  the total, since it''s dynamic and less at risk of resulting in a stalemate.


  You can track a subsystem at a larger scale, like over the course of an adventure
  or campaign, by granting the PCs Victory Points for achieving difficult goals or
  making particular decisions. Such subsystems usually ask the PCs to compare their
  accumulated Victory Points against several ranked tiers that each having varying
  results on the story. Typically these results become more positive for the PCs as
  they acquire more Victory Points, but sometimes succeeding too fully could have
  unintended consequences, like convincing the workers to support a rebellion so thoroughly
  that it riles up a mob. If you''re making your own subsystem, you might not define
  these ranks in full, but just use your best guess at the end.


  Using this method, the PCs start with a certain number of Victory Points, and rather
  than accumulating them, they attempt to avoid losing them. Perhaps the PCs are trying
  to keep dragon eggs from cracking, or are otherwise attempting to minimize damage,
  loss, or danger. This variant is less common, but it’s great at conveying the urgency
  of a situation as the PCs lose points. Sometimes it’s necessary to add that sense
  of tension with this subsystem! Typically, when the PCs lose all their Victory Points,
  a negative event occurs. If they’re on a timer, the final results might be better
  the more points they manage to keep before the time runs out.'
attribution: {page: 184}
