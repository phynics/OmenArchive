---
name: investigator skill advancement
level: 1
traits:
- investigator
description: A investigator gains an extra skill feat at levels 3, 5, 7, 9, 11, 13,
  15, 17, and 19, and an extra skill increase at levels 2, 4, 6, 8, 10, 12, 14, 16,
  18, and 20, beyond the skill feats and skill increases every character gets.
mechanicsScope: builder
