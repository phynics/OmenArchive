---
name: devise a stratagem
level: 1
traits:
- investigator
description: 'You can play out a battle in your head, using brains rather than brawn
  to execute an attack.

  You gain the [Devise a Stratagem](omen://action/devise-a-stratagem) action.'
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: Its change to the character's Strikes is a note on their attack
  or damage rolls; the sheet's numbers don't include it.
foundryID: lgo65ldX7WkXC8Ir
rules:
- key: devise-a-stratagem-action
  effect: core/add-action@2
  inputs:
    action: '@action.devise-a-stratagem'
- key: strike-note-1
  effect: core/add-note
  inputs:
    target: attack-rolls
    text: 'Attack stratagem: if you Strike the chosen creature before the start of
      your next turn, your first Strike against it this round gains the fortune trait
      and uses the d20 you rolled for its attack roll, and you can add your Intelligence
      modifier instead of your Strength or Dexterity modifier. A melee weapon, melee
      unarmed attack or thrown weapon must have the agile or finesse trait to benefit.'
    when: Devise a Stratagem
