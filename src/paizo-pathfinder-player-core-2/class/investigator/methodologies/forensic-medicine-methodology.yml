  insects can provide valuable clues that help reconstruct the scene.

  You''re trained in Medicine and gain the [Forensic Acumen](omen://feat/forensic-acumen)
  and [Battle Medicine](omen://feat/battle-medicine?source=paizo-pathfinder-player-core)
  skill feats. When you use Battle Medicine, on a success the target recovers additional
  Hit Points equal to your level, and the target becomes temporarily immune for only
  1 hour, not 1 day'
