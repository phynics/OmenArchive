---
name: empiricism methodology
level: 1
traits:
- investigator
description: 'Everything comes down to data. Calculating statistics, running numbers,
  and using inductive reasoning allows you to determine the most likely outcome of
  any scenario, and anything out of place draws your keen attention.

  You are trained in one Intelligence-based skill of your choice. You gain the [That''s
  Odd](omen://feat/thats-odd) investigator feat, and you gain the [Expeditious Inspection](omen://action/expeditious-inspection)
  free action.'
mechanicsScope: builder
foundryID: g3mNzNphtVxyR9Xr
rules:
- key: thats-odd-feat
  effect: core/add-feat@3
  inputs:
    feat: '@feat.thats-odd'
- key: expeditious-inspection-action
  effect: core/add-action@2
  inputs:
    action: '@action.expeditious-inspection'
- key: choice-investigator-empiricism-skill
  choice:
    name: $.investigator.empiricism.skill
    label: Intelligence skill
    type: core/skill
    cases:
    - {key: arcana, value: arcana}
    - {key: crafting, value: crafting}
    - {key: occultism, value: occultism}
    - {key: society, value: society}
- key: chosen-skill-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: {choice: $.investigator.empiricism.skill}
    rank: trained
- key: skill-feat-skill
  effect: core/add-to-list
  inputs:
    list: $.investigator.skill-feat-skills
    value: {choice: $.investigator.empiricism.skill}
