  You are trained in one Intelligence-based skill of your choice. You gain the [That''s
  Odd](omen://feat/thats-odd?source=paizo-pathfinder-player-core-2) investigator feat,
  and you gain the [Expeditious Inspection](omen://action/expeditious-inspection?source=paizo-pathfinder-player-core-2)
  free action.'
