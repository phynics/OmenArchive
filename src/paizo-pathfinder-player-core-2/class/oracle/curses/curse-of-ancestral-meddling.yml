description: The ancestral spirits you commune with haunt you and meddle with your
  belongings and actions, either out of a wellintentioned \(but ultimately detrimental\)
  attempt to assist you, as punishment for your audacity in circumventing the traditional
  means of achieving divine power, for their own amusement, or a mixture of the above.
  When you have the [Cursebound](omen://condition/cursebound?source=paizo-pathfinder-player-core-2)
  condition, you are [Clumsy](omen://condition/clumsy?source=paizo-pathfinder-player-core)
  with a value equal to your cursebound value as the spirits of your ancestors temporarily
  possess you and vie for control in your mind, hindering your movements.
