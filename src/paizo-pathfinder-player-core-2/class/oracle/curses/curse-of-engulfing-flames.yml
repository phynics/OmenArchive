description: Fires flare noticeably \(though not dangerously\) in your presence, you
  occasionally smoke slightly, and your body is almost painfully hot to the touch.
  When you have the [Cursebound](omen://condition/cursebound?source=paizo-pathfinder-player-core-2)
  condition, you catch fire, taking persistent fire damage equal to your cursebound
  value, and any immunity or resistance you have to fire is suppressed. The flames
  shed light like a [Torch](omen://item/torch?source=paizo-pathfinder-player-core),
  and if you enter an environment where they could not burn \(such as underwater\),
  you simply seethe with flameless heat. The flames subside when you begin Refocusing
  to assuage your curse or if you fall [Unconscious](omen://condition/unconscious?source=paizo-pathfinder-player-core),
  but they resume if your Refocus activity is interrupted or when you return to consciousness.
