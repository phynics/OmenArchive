description: "Knowledge and information come freely to you. You might use this lore
  to gain power or perhaps to understand the divine mysteries of the multiverse. You
  might have a conduit to the fabled Akashic Record, maintain a subtle telepathic
  connection to the collective subconscious of all living creatures, or follow in
  the footsteps of deities such as Abadar, Irori, Nethys, Irori's scholarly nephew
  Gruhastha, the fey triune goddess of fate Magdh, or the aeon god figure known as
  the Monad.\nGranted Spells\n\t•\tcantrip: [Read Aura](omen://spell/read-aura?source=paizo-pathfinder-player-core)\n\t•\t1st:
  [Mindlink](omen://spell/mindlink?source=paizo-pathfinder-player-core)\n\t•\t3rd:
  [Hypercognition](omen://spell/hypercognition?source=paizo-pathfinder-player-core)\n\t•\t6th:
  [Never Mind](omen://spell/never-mind?source=paizo-pathfinder-player-core)\nRevelation
  Spells\n\t•\tinitial: [Brain Drain](omen://spell/brain-drain?source=paizo-pathfinder-player-core-2)\n\t•\tadvanced:
  [Access Lore](omen://spell/access-lore?source=paizo-pathfinder-player-core-2)\n\t•\tgreater:
  [Dread Secret](omen://spell/dread-secret?source=paizo-pathfinder-player-core-2)\nRelated
  Domains knowledge, magic, secrecy, truth\nMystery Skill Occultism and one Lore skill
  of your choice\nOracle Feat [Whispers of Weakness](omen://feat/whispers-of-weakness?source=paizo-pathfinder-player-core-2)\n[Curse
