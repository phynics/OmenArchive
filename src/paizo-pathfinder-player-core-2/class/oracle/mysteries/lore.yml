---
name: lore
level: 1
traits:
- oracle
description: "Knowledge and information come freely to you. You might use this lore
  to gain power or perhaps to understand the divine mysteries of the multiverse. You
  might have a conduit to the fabled Akashic Record, maintain a subtle telepathic
  connection to the collective subconscious of all living creatures, or follow in
  the footsteps of deities such as Abadar, Irori, Nethys, Irori's scholarly nephew
  Gruhastha, the fey triune goddess of fate Magdh, or the aeon god figure known as
  the Monad.\nGranted Spells\n\t•\tcantrip: Read Aura\n\t•\t1st: Mindlink\n\t•\t3rd:
  Hypercognition\n\t•\t6th: Never Mind\nRevelation Spells\n\t•\tinitial: Brain Drain\n\t•\tadvanced:
  Access Lore\n\t•\tgreater: Dread Secret\nRelated Domains knowledge, magic, secrecy,
  truth\nMystery Skill Occultism and one Lore skill of your choice\nOracle Feat Whispers
  of Weakness\nCurse of Torrential Knowledge"
mechanicsScope: builder
foundryID: tZBb3Kh4nJcNoUFI
