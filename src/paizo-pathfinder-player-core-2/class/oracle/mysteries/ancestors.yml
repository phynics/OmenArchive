---
name: ancestors
level: 1
traits:
- oracle
description: "The voices of generations past speak to you, and you hear their words.
  You might resent the constant interruption, or you might revere the spirits of those
  who came before. Perhaps you hail from a culture with strong ancestral traditions,
  such as the Shoanti Skoan-Quah \\(Skull Clan\\), a traditional dwarven community
  that worships Torag's family pantheon, or a group that reveres Erastil or Pharasma.
  You might commune with powerful psychopomps who shepherd souls to the afterlife,
  with the River of Souls itself, or with those spirits who have become trapped outside
  of the great cycle of spiritual rebirth. You learn from their whispers and the fragments
  of their memories, but opening your mind to their knowledge and experience also
  allows them to meddle in your worldly affairs.\nGranted Spells\n\t•\tcantrip: [Guidance](omen://spell/guidance?source=paizo-pathfinder-player-core)\n\t•\t1st:
  [Ill Omen](omen://spell/ill-omen?source=paizo-pathfinder-player-core)\n\t•\t2nd:
  [Ghostly Carrier](omen://spell/ghostly-carrier?source=paizo-pathfinder-player-core)\n\t•\t5th:
  [Dreaming Potential](omen://spell/dreaming-potential?source=paizo-pathfinder-player-core)\nRevelation
  Spells\n\t•\tinitial: [Ancestral Touch](omen://spell/ancestral-touch?source=paizo-pathfinder-player-core-2)\n\t•\tadvanced:
  [Ancestral Defense](omen://spell/ancestral-defense?source=paizo-pathfinder-player-core-2)\n\t•\tgreater:
  [Ancestral Form](omen://spell/ancestral-form?source=paizo-pathfinder-player-core-2)\nRelated
  Domains death, duty, family, soul\nMystery Skill Society\nOracle Feat [Whispers
  of Weakness](omen://feat/whispers-of-weakness?source=paizo-pathfinder-player-core-2)\n[Curse
  of Ancestral Meddling](omen://class/oracle/curses/curse-of-ancestral-meddling?source=paizo-pathfinder-player-core-2)"
