description: "Your mystery imparts an understanding of death and undeath in all their
  macabre complexity. You might have had a brush with death yourself—maybe even dying
  and returning to life—or carry the touch of undeath in your blood. If you commune
  with deities, you might speak with guardians of death like Pharasma and the psychopomp
  ushers \\(the most powerful among creatures that guide souls through the afterlife\\);
  a bringer of death like the Mantis God Achaekek or the Horseman of the Apocalypse
  Charon; or a herald of undeath such as Urgathoa.\nGranted Spells\n\t•\tcantrip:
  [Void Warp](omen://spell/void-warp?source=paizo-pathfinder-player-core)\n\t•\t1st:
  [Grim Tendrils](omen://spell/grim-tendrils?source=paizo-pathfinder-player-core)\n\t•\t2nd:
  [False Vitality](omen://spell/false-vitality?source=paizo-pathfinder-player-core)\n\t•\t3rd:
  [Ghostly Weapon](omen://spell/ghostly-weapon?source=paizo-pathfinder-player-core)\nRevelation
  Spells\n\t•\tinitial: [Soul Siphon](omen://spell/soul-siphon?source=paizo-pathfinder-player-core-2)\n\t•\tadvanced:
  [Armor of Bones](omen://spell/armor-of-bones?source=paizo-pathfinder-player-core-2)\n\t•\tgreater:
  [Claim Undead](omen://spell/claim-undead?source=paizo-pathfinder-player-core-2)\nRelated
  Domains death, decay, undeath, vigil\nMystery Skill Medicine\nOracle Feat [Nudge
  the Scales](omen://feat/nudge-the-scales?source=paizo-pathfinder-player-core-2)\n[Curse
