description: "Your mystery imparts an understanding of death and undeath in all their
  macabre complexity. You might have had a brush with death yourself—maybe even dying
  and returning to life—or carry the touch of undeath in your blood. If you commune
  with deities, you might speak with guardians of death like Pharasma and the psychopomp
  ushers (the most powerful among creatures that guide souls through the afterlife);
  a bringer of death like the Mantis God Achaekek or the Horseman of the Apocalypse
  Charon; or a herald of undeath such as Urgathoa.\nGranted Spells\n\t•\tcantrip:
  Void Warp\n\t•\t1st: Grim Tendrils\n\t•\t2nd: False Vitality\n\t•\t3rd: Ghostly
  Weapon\nRevelation Spells\n\t•\tinitial: Soul Siphon\n\t•\tadvanced: Armor of Bones\n\t•\tgreater:
  Claim Undead\nRelated Domains death, decay, undeath, vigil\nMystery Skill Medicine\nOracle
  Feat Nudge the Scales\nCurse of the Living Death"
