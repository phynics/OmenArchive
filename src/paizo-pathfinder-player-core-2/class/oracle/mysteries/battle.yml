description: "Warlike forces fill you with physical might and tactical knowledge,
  aiming to have you uphold the glory of combat, fight to improve the world, prepare
  against the necessity of conflict, or endure the inevitability of war. You might
  draw upon deities such as Gorum, Iomedae, Rovagug, the Horseman of War Szuriel,
  the Queen of the Night Eiseth, the Vudrani god Diomazul, and others, or you might
  find power in the unending conflict between the armies of Heaven and Hell, the Elemental
  Planes, the Outer Gods, or even the collective spirits of those who fought in wars
  over the ages.\nGranted Spells\n\t•\tcantrip: Shield\n\t•\t1st: Sure Strike\n\t•\t2nd:
  Telekinetic Maneuver\n\t•\t4th: Weapon Storm\nRevelation Spells\n\t•\tinitial: Weapon
  Trance\n\t•\tadvanced: Battlefield Persistence\n\t•\tgreater: Revel in Retribution\nRelated
  Domains destruction, might, protection, zeal\nMystery Skill Athletics\nOracle Feat
  Oracular Warning\nCurse of the Mortal Warrior"
