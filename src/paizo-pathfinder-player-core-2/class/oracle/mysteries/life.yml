name: life
level: 1
traits:
- oracle
description: "The never-ending flow of life force within living beings is palpable
  to you. You might uphold the sanctity of life, or perhaps you seek to undermine
  it. You might draw power from the collective vitality of the world's living creatures,
  hold some connection to Creation's Forge, or revere a collection of deities including
  Irori, Pharasma, Sarenrae, and the god of medicine Qi Zhong.\nGranted Spells\n\t•\tcantrip:
  [Vitality Lash](omen://spell/vitality-lash?source=paizo-pathfinder-player-core)\n\t•\t1st:
  [Soothe](omen://spell/soothe?source=paizo-pathfinder-player-core)\n\t•\t2nd: [False
  Vitality](omen://spell/false-vitality?source=paizo-pathfinder-player-core)\n\t•\t5th:
  [Grisly Growths](omen://spell/grisly-growths?source=paizo-pathfinder-player-core-2)\nRevelation
  Spells\n\t•\tinitial: [Life Link](omen://spell/life-link?source=paizo-pathfinder-player-core-2)\n\t•\tadvanced:
  [Delay Affliction](omen://spell/delay-affliction?source=paizo-pathfinder-player-core-2)\n\t•\tgreater:
  [Life-Giving Form](omen://spell/life-giving-form?source=paizo-pathfinder-player-core-2)\nRelated
  Domains death, healing, pain, soul\nMystery Skill Medicine\nOracle Feat [Nudge the
  Scales](omen://feat/nudge-the-scales?source=paizo-pathfinder-player-core-2)\n[Curse
  of Outpouring Life](omen://class/oracle/curses/curse-of-outpouring-life?source=paizo-pathfinder-player-core-2)"
