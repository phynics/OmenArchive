---
name: cosmos
level: 1
traits:
- oracle
description: "Celestial bodies great and small exert influence on you, giving you
  sublime cosmic power. Perhaps you see the glittering stars as a divine blessing,
  or perhaps you feel drawn to the infinitely dark spaces between. You might uphold
  deities like Desna, Sarenrae, or the deific lovers Shizuru and Tsukiyo who represent
  the sun and the moon—or you might draw power from dark entities from beyond the
  stars, like certain Outer Gods, or destructive gods of the night like Zon-Kuthon
  or the rat goddess Lao Shu Po.\nGranted Spells\n\t•\tcantrip: [Light](omen://spell/light?source=paizo-pathfinder-player-core)\n\t•\t1st:
  [Dizzying Colors](omen://spell/dizzying-colors?source=paizo-pathfinder-player-core)\n\t•\t2nd:
  [Darkness](omen://spell/darkness?source=paizo-pathfinder-player-core)\n\t•\t5th:
  [Moon Frenzy](omen://spell/moon-frenzy?source=paizo-pathfinder-player-core)\nRevelation
  Spells\n\t•\tinitial: [Spray of Stars](omen://spell/spray-of-stars?source=paizo-pathfinder-player-core-2)\n\t•\tadvanced:
  [Interstellar Void](omen://spell/interstellar-void?source=paizo-pathfinder-player-core-2)\n\t•\tgreater:
  [Moonlight Bridge](omen://spell/moonlight-bridge?source=paizo-pathfinder-player-core-2)\nRelated
  Domains darkness, moon, nothingness, star\nMystery Skill Nature\nOracle Feat [Oracular
  Warning](omen://feat/oracular-warning?source=paizo-pathfinder-player-core-2)\n[Curse
  of the Sky's Call](omen://class/oracle/curses/curse-of-the-skys-call?source=paizo-pathfinder-player-core-2)"
