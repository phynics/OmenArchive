description: "Fire lives at the center of the world, the center of the sun, and the
  center of civilization. You might revere this elemental force, siphon power from
  the Elemental Plane of Fire, or venerate a collection of deities such as Asmodeus,
  Sarenrae, the Tian goddess of disasters and volcanoes Lady Nanbyo, or the elemental
  lord of fire Ymeri.\nGranted Spells\n\t•\tcantrip: Ignition\n\t•\t1st: Breathe Fire\n\t•\t2nd:
  Blazing Bolt\n\t•\t3rd: Fireball\nRevelation Spells\n\t•\tinitial: Incendiary Aura\n\t•\tadvanced:
  Whirling Flames\n\t•\tgreater: Flaming Fusillade\nRelated Domains dust, fire, star,
  sun\nMystery Skill Acrobatics\nOracle Feat Foretell Harm\nCurse of Engulfing Flames"
