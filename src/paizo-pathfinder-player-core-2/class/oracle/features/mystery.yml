name: mystery
level: 1
traits:
- oracle
description: "An oracle wields divine power, but not from a single divine being. This
  power could come from a potent concept or ideal, the attention of multiple divine
  entities whose areas of concern all touch on that subject, or a direct and dangerous
  conduit to raw divine power. This is the oracle's mystery, a source of divine magic
  not beholden to any deity.\nChoose the mystery that empowers your magic. Your mystery
  grants you additional spells, and special focus spells called revelation spells.
  Your mystery also gives you a unique cursebound ability that lets you draw upon
  the divine, as well as dictating the effects of the oracular curse that falls upon
  you when you touch too much of this power.\n\t•\t[Ancestors](omen://class/oracle/mysteries/ancestors?source=paizo-pathfinder-player-core-2)
  Voices of past generations teach and haunt you.\n\t•\tAshes You see all things in
  the world as fleeting and temporary, waiting to be purified into their base essence:
  the ash left behind after a burning fire.\n\t•\t[Battle](omen://class/oracle/mysteries/battle?source=paizo-pathfinder-player-core-2)
  You embody the virtues upheld by heroes of legend.\n\t•\tBlight A spring bud will
  wither, a mighty oak will crash to the forest floor, and a callow youth will grow
  into maturity, then decline into old age.\n\t•\t[Bones](omen://class/oracle/mysteries/bones?source=paizo-pathfinder-player-core-2)
  Death always seems near, and the dead speak to you.\n\t•\t[Cosmos](omen://class/oracle/mysteries/cosmos?source=paizo-pathfinder-player-core-2)
  You draw power from the stars and the spaces between.\n\t•\t[Flames](omen://class/oracle/mysteries/flames?source=paizo-pathfinder-player-core-2)
  You dance with fire and do your best to remain unscorched by it.\n\t•\t[Life](omen://class/oracle/mysteries/life?source=paizo-pathfinder-player-core-2)
  The teeming energies of life flow through you out into the world.\n\t•\t[Lore](omen://class/oracle/mysteries/lore?source=paizo-pathfinder-player-core-2)
  You gain access to unparalleled, overwhelming knowledge.\n\t•\t[Tempest](omen://class/oracle/mysteries/tempest?source=paizo-pathfinder-player-core-2)
  Wind, waves, and storms rage at your beck and call.\n\t•\tTime Whether by accident,
  fate, or purposeful meddling, you exist slightly outside of time.\nReading a Mystery
  Entry\nA mystery entry contains the following information, followed by a description
  of that mystery's curse.\nGranted Spells You automatically add the spells listed
  here to your spell repertoire, as described in Spell Repertoire on page 130. At
  1st level, you gain a cantrip and a 1st-rank spell. You learn the other spells on
  the list as soon as you gain the ability to cast oracle spells of that rank.\nRevelation
  Spells You automatically gain your mystery's initial revelation spell at 1st level
  and can gain more by selecting the Advanced Revelation, Greater Revelation, and
  Diverse Mystery oracle feats. These spells start on page 259.\nRelated Domains These
  are the cleric domains associated with your mystery. You gain domain spells, which
  you can cast as revelation spells, by taking the Domain Acumen and Domain Fluency
  feats. At 11th level, the divine access class feature also gives you additional
  slotted spells based on your domains. The domains and their domain spells appear
  on page 372 of Player Core. Domains marked with an asterisk \\(\\*\\) are found
  in Pathfinder Lost Omens Divine Mysteries.\nMystery Skill You become trained in
  the listed skill. A few mysteries make you trained in more than one skill.\nOracle
  Feat You gain this 1st-level oracle feat. This is a cursebound feat, so using it
  aggravates your oracular curse."
