---
name: deific weapon
level: 1
traits:
- champion
description: You zealously bear your deity's favored weapon. If it's an unarmed attack
  with a d4 damage die or a simple weapon, increase the damage die by one step \(d4
  to d6, d6 to d8, d8 to d10, d10 to d12\). If the weapon is uncommon, you gain access
  to it, and if it's an advanced weapon, you treat it as a martial weapon for the
  purposes of proficiency
mechanicsScope: builder
foundryID: FeBsYn2mHfMVDZvw
rules:
- key: choice-deity-favored-weapon
  choice:
    name: $.deity.favored-weapon
    label: Favored weapon
    additionalCases:
    - {value: fist}
    records: {filter: {all: [{type: item}, {item.kind: weapon}]}, type: core/weapon-reference}
- key: deity-favored-weapon-proficiency
  effect: core/add-chosen-weapon-proficiency
  inputs:
    weapon: {choice: $.deity.favored-weapon}
    proficiencyRank: 2
    selfScaling: true
- key: deity-favored-weapon-die
  effect: core/add-weapon-die-step
  inputs:
    weapon: {choice: $.deity.favored-weapon}
