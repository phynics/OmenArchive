---
name: cause
level: 1
traits:
- champion
description: 'You devote yourself to a specific cause in your deity''s name. Some
  are limited to sanctification, as noted in parentheses. Your cause adds to your
  edicts and anathema and grants you a special reaction called your champion''s reaction,
  which appears after the divider, along with its upgrades if you gain the relentless
  reaction and exalted reaction class features at higher levels.

  Desecration (Unholy): You selfishly corrupt and destroy.

  Grandeur (Holy): You exemplify the glory and splendor of the celestial realms.

  Iniquity (Unholy): You destroy, take advantage, and act with dishonor.

  Justice: You follow laws and mete out just punishment.

  Liberation: You oppose tyranny and fight for freedom.

  Obedience: You enforce hierarchies and order.

  Redemption (Holy): You try to redeem those who commit wicked deeds.'
mechanicsScope: builder
foundryID: D4k8wuq1ncHFCBZz
rules:
- key: choice-champion-cause-holy
  prerequisites:
  - hasChoice:
      name: $.deity.sanctification
      equals: {type: core/string, value: holy}
  choice:
    name: $.champion.cause
    label: Cause
    prerequisites:
    - $.deity.sanctification
    type: core/feature-id
    cases:
    - {key: liberation, value: '@class.champion.causes.liberation'}
    - {key: grandeur, value: '@class.champion.causes.grandeur'}
    - {key: redemption, value: '@class.champion.causes.redemption'}
    - {key: justice, value: '@class.champion.causes.justice'}
    - {key: obedience, value: '@class.champion.causes.obedience'}
- key: choice-champion-cause-unholy
  prerequisites:
  - hasChoice:
      name: $.deity.sanctification
      equals: {type: core/string, value: unholy}
  choice:
    name: $.champion.cause
    label: Cause
    prerequisites:
    - $.deity.sanctification
    type: core/feature-id
    cases:
    - {key: liberation, value: '@class.champion.causes.liberation'}
    - {key: justice, value: '@class.champion.causes.justice'}
    - {key: iniquity, value: '@class.champion.causes.iniquity'}
    - {key: desecration, value: '@class.champion.causes.desecration'}
    - {key: obedience, value: '@class.champion.causes.obedience'}
- key: choice-champion-cause-none
  prerequisites:
  - hasChoice:
      name: $.deity.sanctification
      equals: {type: core/string, value: none}
  choice:
    name: $.champion.cause
    label: Cause
    prerequisites:
    - $.deity.sanctification
    type: core/feature-id
    cases:
    - {key: liberation, value: '@class.champion.causes.liberation'}
    - {key: justice, value: '@class.champion.causes.justice'}
    - {key: obedience, value: '@class.champion.causes.obedience'}
- key: grant-selected-cause
  effect: core/add-feature-by-id
  inputs:
    featureId: {choice: $.champion.cause}
