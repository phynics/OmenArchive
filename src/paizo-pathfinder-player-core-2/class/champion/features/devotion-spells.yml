---
name: devotion spells
level: 1
traits:
- champion
description: 'Your deity''s power grants you special divine spells called devotion
  spells, which are a type of focus spell. Choose either Shields of the Spirit or
  a spell based on your deity''s divine font (Lay on Hands if your deity allows heal,
  Touch of the Void if your deity allows harm).

  It costs 1 Focus Point to cast a focus spell. When you gain your first devotion
  spell, you also gain a focus pool of 1 Focus Point. You refill your focus pool during
  your daily preparations, and you regain 1 Focus Point by spending 10 minutes using
  the Refocus activity to pray to your deity or do service toward their causes.

  Your devotion spells are divine spells. Your spellcasting attribute is Charisma.

  Focus spells are automatically heightened to half your level rounded up. Certain
  feats give you more focus spells. The maximum Focus Points your focus pool can hold
  is equal to the number of focus spells you have, but can never be more than 3 points.'
mechanicsScope: builder
foundryID: Q1VfQZp49hkhY0HY
rules:
- key: choice-deity-divine-font
  choice:
    name: $.deity.divine-font
    label: Allowed divine fonts
    type: spellcasting/spell-id-list
    cases:
    - {key: heal, value: ['@spell.heal?source=paizo-pathfinder-player-core']}
    - {key: harm, value: ['@spell.harm?source=paizo-pathfinder-player-core']}
    - {key: both, label: Heal or Harm, value: ['@spell.heal?source=paizo-pathfinder-player-core',
        '@spell.harm?source=paizo-pathfinder-player-core']}
- key: configure-source-1
  effect: spellcasting/configure-source
  inputs:
    sourceId: 119e72d7-bb0f-5f5d-ac24-abb1d40addea
    sourceName: Champion Focus Spells
    castingKind: focus
    tradition: divine
    attribute: cha
- key: increase-source-proficiency-1
  effect: spellcasting/increase-source-proficiency
  inputs:
    sourceId: 119e72d7-bb0f-5f5d-ac24-abb1d40addea
    proficiency: 2
- key: choice-champion-devotion-spell-heal
  prerequisites:
  - hasChoice:
      name: $.deity.divine-font
      equals: {type: spellcasting/spell-id-list, value: ['@spell.heal?source=paizo-pathfinder-player-core']}
  choice:
    name: $.champion.devotion-spell
    label: Devotion spell
    prerequisites:
    - $.deity.divine-font
    type: spellcasting/spell-id
    cases:
    - {key: shields-of-the-spirit, value: '@spell.shields-of-the-spirit'}
    - {key: lay-on-hands, value: '@spell.lay-on-hands'}
- key: choice-champion-devotion-spell-harm
  prerequisites:
  - hasChoice:
      name: $.deity.divine-font
      equals: {type: spellcasting/spell-id-list, value: ['@spell.harm?source=paizo-pathfinder-player-core']}
  choice:
    name: $.champion.devotion-spell
    label: Devotion spell
    prerequisites:
    - $.deity.divine-font
    type: spellcasting/spell-id
    cases:
    - {key: shields-of-the-spirit, value: '@spell.shields-of-the-spirit'}
    - {key: touch-of-the-void, value: '@spell.touch-of-the-void'}
- key: choice-champion-devotion-spell-both
  prerequisites:
  - hasChoice:
      name: $.deity.divine-font
      equals: {type: spellcasting/spell-id-list, value: ['@spell.heal?source=paizo-pathfinder-player-core',
          '@spell.harm?source=paizo-pathfinder-player-core']}
  choice:
    name: $.champion.devotion-spell
    label: Devotion spell
    prerequisites:
    - $.deity.divine-font
    type: spellcasting/spell-id
    cases:
    - {key: shields-of-the-spirit, value: '@spell.shields-of-the-spirit'}
    - {key: lay-on-hands, value: '@spell.lay-on-hands'}
    - {key: touch-of-the-void, value: '@spell.touch-of-the-void'}
- key: grant-devotion-spell
  effect: spellcasting/grant-spell
  inputs:
    sourceId: 119e72d7-bb0f-5f5d-ac24-abb1d40addea
    spellId: {choice: $.champion.devotion-spell}
    rankPolicy: {kind: cantrip}
    castFrequency: {kind: focus}
- key: devotion-focus-point
  effect: spellcasting/add-focus-point
  prerequisites:
  - hasChoice:
      name: $.champion.devotion-spell
      isSet: true
