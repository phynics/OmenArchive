---
name: devotion spells
level: 1
traits:
- champion
description: 'Your deity''s power grants you special divine spells called devotion
  spells, which are a type of focus spell. Choose either Shields of the Spirit or
  a spell based on your deity''s divine font (Lay on Hands if your deity allows heal,
  Touch of the Void if your deity allows harm).

  It costs 1 Focus Point to cast a focus spell. When you gain your first devotion
  spell, you also gain a focus pool of 1 Focus Point. You refill your focus pool during
  your daily preparations, and you regain 1 Focus Point by spending 10 minutes using
  the Refocus activity to pray to your deity or do service toward their causes.

  Your devotion spells are divine spells. Your spellcasting attribute is Charisma.

  Focus spells are automatically heightened to half your level rounded up. Certain
  feats give you more focus spells. The maximum Focus Points your focus pool can hold
  is equal to the number of focus spells you have, but can never be more than 3 points.'
mechanicsScope: builder
foundryID: Q1VfQZp49hkhY0HY
