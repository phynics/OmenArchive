---
name: blessing of the devoted
level: 3
traits:
- champion
description: 'Your deity blesses your service with a boon. This might come in the
  form of a spirit that visits you and inhabits your items or body, a mysterious divine
  tattoo upon your body, or the like. Choose one of the following blessings, or any
  other to which you have access.

  Blessed Armament: Select one weapon or handwraps of mighty blows. You gain that
  armament''s critical specialization effect, and you grant the armament a property
  rune of your choice from the following list: [Fearsome](omen://item/fearsome?source=paizo-pathfinder-gm-core),
  [Ghost Touch](omen://item/ghost-touch?source=paizo-pathfinder-gm-core), [Returning](omen://item/returning?source=paizo-pathfinder-gm-core),
  [Shifting](omen://item/shifting?source=paizo-pathfinder-gm-core), or [Vitalizing](omen://item/vitalizing?source=paizo-pathfinder-gm-core).
  During your daily preparations, you can change the spirit to inhabit a different
  armament, grant a different rune, or both.

  Blessed Shield: In your hands, a shield gains the minor [Reinforcing](omen://item/reinforcing-rune-minor?source=paizo-pathfinder-gm-core)
  rune. As you go up in level, the shield gains the reinforcing rune of your level
  \(lesser at 7th level, moderate at 10th level, greater at 13th level, major at 16th
  level, and supreme at 19th level\). If your shield already has the appropriate reinforcing
  rune for your level, or if it''s a [Sturdy Shield](omen://item/sturdy-shield-minor?source=paizo-pathfinder-gm-core)
  of the same level as the appropriate reinforcing rune, the shield''s Hardness instead
  increases by 1.

  Blessed Swiftness: You gain a +5-foot status bonus to Speed. If you''re mounted,
  your mount gains the bonus instead. In addition, when the movement of one of your
  allies triggers an enemy''s reaction while the ally is in your champion''s aura,
  the ally gains a +2 status bonus to all defenses against that reaction.'
mechanicsScope: builder
foundryID: ERwuazupczhUSZ73
rules:
- key: choice-champion-blessing
  level: 3
  choice:
    name: $.champion.blessing
    label: Blessing of the Devoted
    type: core/feature-id
    cases:
    - {key: blessed-armament, value: '@class.champion.blessings.blessed-armament'}
    - {key: blessed-shield, value: '@class.champion.blessings.blessed-shield'}
    - {key: blessed-swiftness, value: '@class.champion.blessings.blessed-swiftness'}
- key: grant-selected-blessing
  effect: core/add-feature@2
  level: 3
  inputs:
    feature: {choice: $.champion.blessing}
