---
name: deity (champion)
level: 1
traits:
- champion
description: 'As a champion, you are a warrior in the name of a deity you revere above
  all others. Choose one deity.

  Skill

  You become trained in the divine skill listed for your deity. As normal, if you''re
  already trained in that skill, you become trained in a different skill of your choice.

  Anathema

  Champions care deeply about the edicts and anathema they take from their deity,
  sanctification, and cause. As with any implementation of edicts and anathema in
  the rules, these are a tool for roleplaying between you, the GM, and the other players
  at the table—you''re still playing a nuanced character, not strictly following a
  script.

  Acts fundamentally opposed to your deity''s ideals are anathema to your faith. Learning
  or casting spells, committing acts, and using items that are anathema to your deity
  remove you from your deity''s good graces.

  Similarly, using items, spells, or actions that are anathema to the tenets or goals
  of your faith could interfere with your connection to your deity. For example, assisting
  with a ritual that raises undead would be anathema to Pharasma, the goddess of death.
  Many actions that are anathema don''t appear in any deity''s formal list. For borderline
  cases, you and your GM determine which acts are anathema.

  If you perform enough acts that are anathema to your deity, you lose the magical
  abilities that come from your connection to your deity. The class features that
  you lose are determined by the GM, but they likely include your holy or unholy trait,
  your focus pool, and your blessing of the devoted. These abilities can be regained
  only if you repent by conducting an atone ritual. If your deity doesn''t require
  the specific sanctification you had, your GM might let you retrain your sanctification
  and cause while still following the same deity.

  Sanctification

  Depending on your deity, their sanctification can make you holy or unholy. This
  commits you to one side of a struggle over souls. Whether you become holy, unholy,
  or neither will limit your choice of causes, devotion spells, and feats.

  If you "can be" holy or unholy according to your deity''s sanctification entry,
  you make that choice, and if you "must be" holy or unholy, you gain the trait automatically.
  If the deity lists "none," you can choose only options that don''t require the holy
  or unholy trait. If you are holy or unholy and gain the opposing trait in some way,
  you lose the previous trait until you atone.

  Unholy sanctification for a champion can be extremely disruptive to a typical game
  and should be a player character option only in appropriate adventures or campaigns
  where the group collectively decides to embrace them. Unholy sanctification and
  causes are uncommon options.

  Holy: You gain the holy trait and add that trait to any Strikes you make. You gain
  the edict, "Do not knowingly harm innocents or fail to prevent harm to an innocent
  if your direct intervention could save them" and the anathema "Commit murder." Even
  if your game includes behavior outside the Pathfinder baseline, the acts listed
  there are anathema to you.

  Unholy: You gain the unholy trait and add that trait to any Strikes you make. You
  gain the edict, "Do not put another''s needs before your own or those of your deity"
  and the anathema "Commit an entirely altruistic act, such as giving something away
  in charity" and "Put anyone''s needs before those of your deity." None of these
  prevents you from performing acts others might consider helpful, but these acts
  must be done with the expectation that they ultimately further your own goals or
  those of your deity'
mechanicsScope: builder
foundryID: ehL7mnkqxN5wIkgu
rules:
- key: choice-deity-name
  choice:
    name: $.deity.name
    label: Deity's name
    freeText: core/string
- key: choice-deity-sanctification
  choice:
    name: $.deity.sanctification
    label: Sanctification
    type: core/string
    cases:
    - key: holy
      value: holy
      effects:
      - key: add-holy-trait
        effect: core/add-character-trait
        inputs:
          trait: holy
    - key: unholy
      value: unholy
      effects:
      - key: add-unholy-trait
        effect: core/add-character-trait
        inputs:
          trait: unholy
    - {value: none}
- key: choice-deity-divine-skill
  choice:
    name: $.deity.divine-skill
    label: Divine skill
    type: core/skill
    cases:
    - {key: acrobatics, value: {kind: acrobatics}}
    - {key: arcana, value: {kind: arcana}}
    - {key: athletics, value: {kind: athletics}}
    - {key: crafting, value: {kind: crafting}}
    - {key: deception, value: {kind: deception}}
    - {key: diplomacy, value: {kind: diplomacy}}
    - {key: intimidation, value: {kind: intimidation}}
    - {key: medicine, value: {kind: medicine}}
    - {key: nature, value: {kind: nature}}
    - {key: occultism, value: {kind: occultism}}
    - {key: performance, value: {kind: performance}}
    - {key: religion, value: {kind: religion}}
    - {key: society, value: {kind: society}}
    - {key: stealth, value: {kind: stealth}}
    - {key: survival, value: {kind: survival}}
    - {key: thievery, value: {kind: thievery}}
- key: deity-divine-skill
  effect: core/add-skill-increase
  inputs:
    skill: {choice: $.deity.divine-skill}
    proficiencyCap: 2
- key: choice-deity-edicts
  choice:
    name: $.deity.edicts
    label: Edicts
    optional: true
    freeText: core/string
- key: choice-deity-anathema
  choice:
    name: $.deity.anathema
    label: Anathema
    optional: true
    freeText: core/string
- key: grant-deity-benefits-deific-weapon
  effect: core/add-feature-by-id
  inputs:
    featureId: '@class.champion.deity-benefits.deific-weapon'
- key: grant-deity-benefits-champions-aura
  effect: core/add-feature-by-id
  inputs:
    featureId: '@class.champion.deity-benefits.champions-aura'
