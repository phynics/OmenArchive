---
name: second path to perfection
level: 11
traits:
- monk
description: You've learned to find perfection in every success. Choose a different
  saving throw than the one you chose for your path to perfection. Your proficiency
  rank for the chosen saving throw increases to master. If you roll a success with
  the chosen saving throw, you instead critically succeed.
mechanicsScope: builder
foundryID: y6qnbUc8y0815QNE
rules:
- key: choice-monk-second-path-to-perfection-save
  choice:
    name: $.monk.second-path-to-perfection.save
    label: Saving Throw
    prerequisites:
    - $.monk.path-to-perfection.save
    distinct: $.monk.path-to-perfection.save
    type: core/saving-throw
    cases:
    - key: fortitude
      value: fortitude
      effects:
      - key: raise-fortitude-to-master
        effect: core/add-saving-throw@2
        inputs:
          savingThrow: fortitude
          rank: master
      - key: note-fortitude-success-to-critical-success
        effect: core/add-note
        inputs:
          target: fortitude
          text: When you roll a success on a Fortitude saving throw, you get a critical
            success instead.
    - key: reflex
      value: reflex
      effects:
      - key: raise-reflex-to-master
        effect: core/add-saving-throw@2
        inputs:
          savingThrow: reflex
          rank: master
      - key: note-reflex-success-to-critical-success
        effect: core/add-note
        inputs:
          target: reflex
          text: When you roll a success on a Reflex saving throw, you get a critical
            success instead.
    - key: will
      value: will
      effects:
      - key: raise-will-to-master
        effect: core/add-saving-throw@2
        inputs:
          savingThrow: will
          rank: master
      - key: note-will-success-to-critical-success
        effect: core/add-note
        inputs:
          target: will
          text: When you roll a success on a Will saving throw, you get a critical
            success instead.
