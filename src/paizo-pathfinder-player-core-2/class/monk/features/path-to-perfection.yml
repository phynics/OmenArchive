---
name: path to perfection
level: 7
traits:
- monk
description: You have progressed along your own path to enlightenment. Choose your
  Fortitude, Reflex, or Will saving throw. Your proficiency rank for the chosen saving
  throw increases to master. When you roll a success on the chosen saving throw, you
  get a critical success instead.
mechanicsScope: builder
foundryID: 1K6m6AVmn3r8XZ9d
rules:
- key: choice-monk-path-to-perfection-save
  choice:
    name: $.monk.path-to-perfection.save
    label: Saving Throw
    type: core/saving-throw
    cases:
    - key: fortitude
      value: fortitude
      effects:
      - key: raise-fortitude-to-master
        effect: core/add-saving-throw@2
        inputs:
          savingThrow: fortitude
          rank: master
      - key: note-fortitude-success-to-critical-success
        effect: core/add-note
        inputs:
          target: fortitude
          text: When you roll a success on a Fortitude saving throw, you get a critical
            success instead.
    - key: reflex
      value: reflex
      effects:
      - key: raise-reflex-to-master
        effect: core/add-saving-throw@2
        inputs:
          savingThrow: reflex
          rank: master
      - key: note-reflex-success-to-critical-success
        effect: core/add-note
        inputs:
          target: reflex
          text: When you roll a success on a Reflex saving throw, you get a critical
            success instead.
    - key: will
      value: will
      effects:
      - key: raise-will-to-master
        effect: core/add-saving-throw@2
        inputs:
          savingThrow: will
          rank: master
      - key: note-will-success-to-critical-success
        effect: core/add-note
        inputs:
          target: will
          text: When you roll a success on a Will saving throw, you get a critical
            success instead.
