description: You have made great progress in your personal studies of enlightenment.
  Choose one of the saving throws you selected for path to perfection or second path
  to perfection. Your proficiency rank for the chosen type of save increases to legendary.
  When you roll a critical failure on the chosen type of save, you get a failure instead.
  When you roll a failure on the chosen type of save against an effect that deals
  damage, you take half damage.
