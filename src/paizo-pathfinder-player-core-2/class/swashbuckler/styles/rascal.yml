---
name: rascal
level: 1
traits:
- swashbuckler
description: You aren't afraid to use underhanded tactics to get the edge over your
  opponents. You are trained in Thievery and gain the [Dirty Trick](omen://feat/dirty-trick)
  general feat. When you use Dirty Trick, the action gains the bravado trait.
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: The bravado trait it gives the style's action is not applied yet.
  Its change to the character's Strikes is a note on their attack or damage rolls;
  the sheet's numbers don't include it.
foundryID: XKhg55V7WmpLrvqL
rules:
- key: thievery-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: thievery
    rank: trained
- key: dirty-trick-feat
  effect: core/add-feat@3
  prerequisites:
  - hasClassWithName: swashbuckler
  inputs:
    feat: '@feat.dirty-trick'
- key: skill-feat-skill
  effect: core/add-to-list
  inputs:
    list: $.swashbuckler.skill-feat-skills
    value: {type: core/skill, literal: thievery}
- key: strike-note-1
  effect: core/add-note
  prerequisites:
  - has: '@class.swashbuckler.features.exemplary-finisher'
  inputs:
    target: attack-rolls
    text: If the finisher's Strike hits a foe, the foe takes a –10-foot circumstance
      penalty to its Speed until the start of your next turn.
    when: finisher
