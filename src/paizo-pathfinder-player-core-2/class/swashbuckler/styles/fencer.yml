---
name: fencer
level: 1
traits:
- swashbuckler
description: You move carefully, feinting and creating false openings to lead your
  foes into inopportune attacks. You are trained in Deception. When you [Create a
  Diversion](omen://action/create-a-diversion?source=paizo-pathfinder-player-core)
  or [Feint](omen://action/feint?source=paizo-pathfinder-player-core), the action
  gains the bravado trait.
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: The bravado trait it gives the style's action is not applied yet.
  Its change to the character's Strikes is a note on their attack or damage rolls;
  the sheet's numbers don't include it.
foundryID: Jgid6Ja6Y879COlN
rules:
- key: deception-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: deception
    rank: trained
- key: skill-feat-skill
  effect: core/add-to-list
  inputs:
    list: $.swashbuckler.skill-feat-skills
    value: {type: core/skill, literal: deception}
- key: strike-note-1
  effect: core/add-note
  prerequisites:
  - has: '@class.swashbuckler.features.exemplary-finisher'
  inputs:
    target: attack-rolls
    text: If the finisher's Strike hits a foe, the foe is off-guard until your next
      turn.
    when: finisher
