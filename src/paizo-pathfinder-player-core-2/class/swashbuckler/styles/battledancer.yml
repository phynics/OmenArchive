---
name: battledancer
level: 1
traits:
- swashbuckler
description: To you, a fight is a kind of performance art, and you command your foes'
  attention with mesmerizing motions. You are trained in Performance and gain the
  [Fascinating Performance](omen://feat/fascinating-performance?source=paizo-pathfinder-player-core)
  skill feat. When you [Perform](omen://action/perform?source=paizo-pathfinder-player-core),
  the action gains the bravado trait.
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: The bravado trait it gives the style's action is not applied yet.
  Its change to the character's Strikes is a note on their attack or damage rolls;
  the sheet's numbers don't include it.
foundryID: 5HoEwzLDJGTCZtFa
rules:
- key: performance-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: performance
    rank: trained
- key: fascinating-performance-feat
  effect: core/add-feat@3
  prerequisites:
  - hasClassWithName: swashbuckler
  inputs:
    feat: '@feat.fascinating-performance?source=paizo-pathfinder-player-core'
- key: skill-feat-skill
  effect: core/add-to-list
  inputs:
    list: $.swashbuckler.skill-feat-skills
    value: {type: core/skill, literal: performance}
- key: strike-note-1
  effect: core/add-note
  prerequisites:
  - has: '@class.swashbuckler.features.exemplary-finisher'
  inputs:
    target: attack-rolls
    text: If the finisher's Strike hits a foe, you can Step as a free action immediately
      after the finisher.
    when: finisher
