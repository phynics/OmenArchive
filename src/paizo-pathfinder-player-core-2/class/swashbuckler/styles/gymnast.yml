---
name: gymnast
level: 1
traits:
- swashbuckler
description: You reposition, maneuver, and bewilder your foes with daring feats of
  physical prowess. You are trained in Athletics. When you [Grapple](omen://action/grapple?source=paizo-pathfinder-player-core),
  [Reposition](omen://action/reposition?source=paizo-pathfinder-player-core), [Shove](omen://action/shove?source=paizo-pathfinder-player-core),
  or [Trip](omen://action/trip?source=paizo-pathfinder-player-core), the action gains
  the bravado trait.
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: The bravado trait it gives the style's action is not applied yet.
  Its change to the character's Strikes is a note on their attack or damage rolls;
  the sheet's numbers don't include it.
foundryID: B7RMnrHwQHlezlJT
rules:
- key: athletics-trained
