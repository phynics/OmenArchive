- key: strike-note-1
  effect: core/add-note
  prerequisites:
  - has: '@class.swashbuckler.features.exemplary-finisher'
  inputs:
    target: strike-damage
    text: If the finisher's Strike hits a foe that is grabbed, restrained or prone,
