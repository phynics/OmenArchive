---
name: wit
level: 1
traits:
- swashbuckler
description: You are friendly, clever, and full of humor, always knowing just what
  to say. Your witticisms leave foes unprepared for the skill and speed of your attacks.
  You are trained in Diplomacy and gain the [Bon Mot](omen://feat/bon-mot) skill feat.
  When you use Bon Mot, the action gains the bravado trait
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: The bravado trait it gives the style's action is not applied yet.
  Its change to the character's Strikes is a note on their attack or damage rolls;
  the sheet's numbers don't include it.
foundryID: 4lGhbEjlEoGP4scl
rules:
- key: diplomacy-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: diplomacy
    rank: trained
- key: bon-mot-feat
  effect: core/add-feat@3
  prerequisites:
  - hasClassWithName: swashbuckler
  inputs:
    feat: '@feat.bon-mot'
- key: skill-feat-skill
  effect: core/add-to-list
  inputs:
    list: $.swashbuckler.skill-feat-skills
    value: {type: core/skill, literal: diplomacy}
- key: strike-note-1
  effect: core/add-note
  prerequisites:
  - has: '@class.swashbuckler.features.exemplary-finisher'
  inputs:
    target: attack-rolls
    text: If the finisher's Strike hits a foe, the foe takes a –2 circumstance penalty
      to attack rolls against you until the start of your next turn.
    when: finisher
