---
name: swashbuckler skill advancement
level: 1
traits:
- swashbuckler
description: A swashbuckler gains an extra skill feat at levels 3, 7, and 15, beyond
  the skill feats and skill increases every character gets.
mechanicsScope: builder
rules:
- key: skill-feat-skills
  effect: core/declare-list
  inputs:
    list: $.swashbuckler.skill-feat-skills
    valueType: core/skill
- key: skill-feat-skill-acrobatics
  effect: core/add-to-list
  inputs:
    list: $.swashbuckler.skill-feat-skills
    value: {type: core/skill, literal: acrobatics}
- key: choice-swashbuckler-skill-feat-3
  level: 3
  choice:
    name: $.swashbuckler.skill-feat-3
    label: Skill Feat
    type: core/feat-id
    records:
      filter:
        all:
        - {type: feat}
        - {trait: systemTrait-skill}
        - {maxLevel: 3}
        - {prerequisiteSkill: {in: $.swashbuckler.skill-feat-skills}}
- key: skill-feat-3
  effect: core/add-feat@3
  level: 3
  inputs:
    feat: {choice: $.swashbuckler.skill-feat-3}
- key: choice-swashbuckler-skill-feat-7
  level: 7
  choice:
    name: $.swashbuckler.skill-feat-7
    label: Skill Feat
    type: core/feat-id
    records:
      filter:
        all:
        - {type: feat}
        - {trait: systemTrait-skill}
        - {maxLevel: 7}
        - {prerequisiteSkill: {in: $.swashbuckler.skill-feat-skills}}
- key: skill-feat-7
  effect: core/add-feat@3
  level: 7
  inputs:
    feat: {choice: $.swashbuckler.skill-feat-7}
- key: choice-swashbuckler-skill-feat-15
  level: 15
  choice:
    name: $.swashbuckler.skill-feat-15
    label: Skill Feat
    type: core/feat-id
    records:
      filter:
        all:
        - {type: feat}
        - {trait: systemTrait-skill}
        - {maxLevel: 15}
        - {prerequisiteSkill: {in: $.swashbuckler.skill-feat-skills}}
- key: skill-feat-15
  effect: core/add-feat@3
  level: 15
  inputs:
    feat: {choice: $.swashbuckler.skill-feat-15}
