name: confident finisher
level: 1
traits:
- swashbuckler
description: 'You gain an elegant finishing attack you can make when you have panache.
  The finisher trait is described below. You gain the [Confident Finisher](omen://action/confident-finisher)
  action.

  Finisher Finishers are spectacular finishing moves that use your panache. Finishers
  can be used only with weapons that deal additional damage with precise strike \(agile
  or finesse melee weapons or unarmed attacks, for most swashbucklers\). You can use
  a finisher only if you have panache, and you lose your panache immediately after
  performing a finisher. Once you use a finisher, you can''t use actions that have
  the attack trait for the rest of your turn.

  Some finisher actions also grant an effect on a failure. Effects added on a failure
  don''t apply on a critical failure. If your finisher action succeeds, you can still
  choose to apply the failure effect instead. For example, you might do this when
  an attack deals no damage due to resistance.'
mechanicsScope: builder
