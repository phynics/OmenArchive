---
name: alchemy
level: 1
traits:
- alchemist
description: 'You understand the reactions between all manner of reagents and can
  concoct alchemical items to meet your needs. You can do this using normal reagents
  and the Craft activity, or you can use specially prepared chemicals that allow you
  to craft temporary items quickly and at no cost. Over time, you can create more
  and more alchemical items for free, and since each of them becomes more and more
  powerful, you advance in power dramatically, leaving behind those who don''t understand
  your strange science.

  You gain the [Alchemical Crafting](omen://feat/alchemical-crafting?source=paizo-pathfinder-player-core)
  feat, and you can automatically identify alchemical items that you have the formula
  for.'
