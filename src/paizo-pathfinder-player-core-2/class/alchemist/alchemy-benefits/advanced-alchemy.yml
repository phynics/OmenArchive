---
name: advanced alchemy
level: 1
traits:
- alchemist
description: 'During your daily preparations, you spend some time to create alchemical
  items that can be used over the course of the day.

  You don''t need to attempt a Crafting check to do this, you can use an alchemist''s
  toolkit instead of an alchemist''s lab, and you ignore both the number of days typically
  required to create the items and any alchemical raw materials requirements.

  You can Craft a number of alchemical items up to 4 + your Intelligence modifier.
  Each item must be in your formula book, have an item level equal to or lower than
  your level, and have the consumable trait.

  These items have the infused trait and remain potent for 24 hours or until your
  next daily preparations, whichever comes first.'
mechanicsScope: mixed
