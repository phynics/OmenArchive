  exploration activities.

  Versatile vials are infused items, and are destroyed if not used by the next time
  you make your daily preparations. A vial you create is always the highest type you
  could Craft. See the sidebar for statistics on using a versatile vial as a bomb.
  You can also use vials for [Quick Alchemy](omen://class/alchemist/alchemy-benefits/quick-alchemy?source=paizo-pathfinder-player-core-2)
  and your research field can add to the ways you can use a vial.

  You can store all your versatile vials within your [Alchemist''s Toolkit](omen://item/alchemists-toolkit?source=paizo-pathfinder-player-core),
  with no increase to its Bulk. Though versatile vials are physical objects, they
  can''t be duplicated or preserved in any way.'
