---
name: toxicologist
level: 1
traits:
- alchemist
description: 'You specialize in toxins and venoms of all types.

  Formulas Two common 1st-level alchemical poisons.

  Field Benefit You can Activate an injury poison as a single action, provided you
  apply it to a weapon you''re holding or a piece of ammunition on your person or
  loaded in a weapon you''re holding. This can be an item you''re holding or you can
  Interact to draw an eligible item or make one using Quick Alchemy as part of the
  single action; if you can make more than one item with Quick Alchemy (such as with
  the double brew class feature), you can still Activate only one. In addition, you
  flexibly mix acidic and poisonous alchemical compounds. Your infused items with
  the poison trait can affect creatures immune to poison. A creature takes acid damage
  instead of poison damage from such items if either the creature is immune to poison
  or that would be more detrimental to the creature (as determined by the GM).

  Field Vials Your versatile vials have the poison trait and deal poison damage instead
  of having the acid trait and dealing acid damage (though your field benefit still
  applies). You can apply the contents of a versatile vial to a weapon or piece of
  ammunition as an injury poison. Add the versatile vial''s initial damage to the
  first successful Strike with that weapon or ammunition. The substance becomes inert
  at the end of your current turn.

  Field Discovery (5th) You have handled enough poisons to become inured to their
  effects. You gain poison resistance equal to half your level.

  Advanced Vials (11th) When you damage a creature with a versatile vial you''ve used
  as an injury poison, that creature takes persistent poison damage equal to the vial''s
  splash damage in addition to the initial damage.

  Greater Field Discovery (13th) When a creature fails its initial saving throw against
  an infused injury poison you created, the wound sprays poison onto another creature
  adjacent to it. The attacker who caused the injury chooses which creature, if there''s
  more than one, and can choose to forgo this effect. That creature is exposed to
  the poison. The second creature doesn''t spread the poison further.'
mechanicsScope: mixed
unsupportedReason: The research field's two starting formulas await alchemical formula
  families and learning. Its selected level-5/11/13 benefits remain active.
