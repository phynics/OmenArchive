---
name: mutagenist
level: 1
traits:
- alchemist
description: 'You focus on bizarre mutagenic transformations that sacrifice one aspect
  of a creature''s physical or psychological being in order to strengthen another.

  Formulas Two common 1st-level alchemical mutagens.

  Field Benefit When you use a mutagen, you gain a number of temporary Hit Points
  equal to your Intelligence modifier \(minimum 0\) plus half your level. These temporary
  Hit Points last for 1 minute or until the mutagen''s duration expires, whichever
  comes first. You can''t gain temporary HP from drinking a mutagen again for 1 minute.

  Field Vials You can drink the contents of one your versatile vials to suppress the
  drawback you take from one mutagen currently affecting you for 1 minute. A vial
  used this way loses the acid, bomb, and splash traits and gains the elixir trait.
  If you have more than one drawback due to [Combine Elixirs](omen://feat/combine-elixirs?source=paizo-pathfinder-player-core-2)
  or a similar ability, drinking the vial suppresses one drawback of your choice.

  [Field Discovery](omen://class/alchemist/field-benefits/field-discovery-mutagenist?source=paizo-pathfinder-player-core-2)
  \(5th\) The mutagens flowing through your blood have altered your body chemistry.
  When you roll a Fortitude save while affected by a mutagen and dislike the result,
  you can end the effect of the mutagen to reroll the save. This is a fortune effect.

  [Advanced Vials](omen://class/alchemist/field-benefits/advanced-vials-mutagenist?source=paizo-pathfinder-player-core-2)
  \(11th\) When you drink one of your field vials, you also gain resistance to physical
  damage for the same duration. The resistance is equal to half your level.

  [Greater Field Discovery](omen://class/alchemist/field-benefits/greater-field-discovery-mutagenist?source=paizo-pathfinder-player-core-2)
  \(13th\) If you imbibe another mutagen while you are under the effects of a mutagen,
  you can gain the benefits and the drawbacks of both mutagens at once, despite the
  fact that they both have the polymorph trait and would not normally function together.
  If you come under the effects of any further mutagens while benefiting from two
  mutagens, you lose the benefit of one of the former mutagens of your choice, while
  retaining the drawbacks of all the mutagens. If you are under the effects of two
  mutagens and you come under the effect of a non-mutagen polymorph effect, you lose
  the benefits of the mutagens while retaining the drawbacks of both. Your field vial
  benefit applies to one mutagen of your choice.'
mechanicsScope: builder
foundryID: tvdb1jkjl2bRZjSp
rules:
- key: grant-field-benefits-field-discovery-mutagenist
  effect: core/add-feature-by-id
  level: 5
  inputs:
    featureId: '@class.alchemist.field-benefits.field-discovery-mutagenist'
- key: grant-field-benefits-advanced-vials-mutagenist
  effect: core/add-feature-by-id
  level: 11
  inputs:
    featureId: '@class.alchemist.field-benefits.advanced-vials-mutagenist'
- key: grant-field-benefits-greater-field-discovery-mutagenist
  effect: core/add-feature-by-id
  level: 13
  inputs:
    featureId: '@class.alchemist.field-benefits.greater-field-discovery-mutagenist'
- key: choice-alchemist-formulas-field
  choice:
    name: $.alchemist.formulas.field
    label: Research field formulas
    optional: true
    multiple: {min: 0, max: 2}
    records:
      filter:
        all:
        - {type: item}
        - {trait: alchemical}
        - {rarity: common}
        - {level: 1}
        - {trait: mutagen}
      type: core/item-id
- key: learn-choice-alchemist-formulas-field
  effect: core/add-formulas
  inputs:
    items: {choiceList: $.alchemist.formulas.field}
