name: dragon instinct
level: 1
traits:
- barbarian
description: 'You summon the fury of a mighty dragon and manifest incredible abilities.
  Perhaps your culture reveres draconic majesty, or you gained insights by drinking
  or bathing in dragon''s blood or watching a marauding wyrm burn your village. Select
  a type of dragon from the Dragon Instincts table as your instinct''s dragon type.
  These are the dragons from Monster Core, but your GM might allow you to choose dragons
  from other sources and determine their tradition and dragon breath type.

  Instinct Ability—Draconic Rage When you rage, you can increase the additional damage
  from Rage from 2 to 4 and change its damage type to match that of your instinct''s
  dragon breath instead of the damage type for your weapon or unarmed attack. If you
  do this, your Rage action gains the trait matching your dragon instinct''s tradition,
  as well as the trait matching the damage type where applicable.

  Raging Resistance (9th) You resist piercing damage and the damage type of your instinct''s
  dragon breath.

