name: superstition instinct
level: 1
traits:
- barbarian
description: 'A deep distrust of magic drives you to forgo and counter the metaphysical
  nonsense of spellcasters. Whether you''re a member of a superstitious family or
  culture that distrusts magic, a warrior in constant battle against wizards and witches,
  a survivor of a magical accident that instilled an intense aversion in your mind
  and body, or a scion of a bloodline known for its magic resistance, your rage is
  inimical to magic. This makes you an excellent mage hunter but slow to trust practitioners
  of magical arts.

  Instinct Ability—Superstitious Resilience Your deep superstition means it''s anathema
  for you to learn or Cast a Spell, or to wield or use an item that can be activated
  to Cast a Spell. If you violate this anathema, you lose the instinct''s abilities
  and any feats that list the instinct as a prerequisite until you spend 1 day of
  downtime re-centering yourself, though you keep all your other barbarian abilities.
  While raging, you gain a +2 status bonus to all saves against magic. Increase your
  damage from Rage from 2 to 3, or 4 against creatures you have witnessed Casting
  a Spell within the last hour. When you Rage, you regain Hit Point equal to the temporary
  HP you gained from the Rage action; you then can''t regain HP in this way again
  for 10 minutes. While raging, if you willingly accept the effects of a magic spell
  or effect, you are Frightened 1. You cannot reduce your frightened condition below
  1 as long as you are affected by the spell or effect.

  Raging Resistance (9th) Choose two associated magical traditions: arcane and occult,
  arcane and primal, divine and occult, or divine and primal. The resistance from
  your raging resistance class feature applies against all damage you take from spells
  cast with these two traditions of magic, regardless of the type of damage dealt
  by the spell.'
