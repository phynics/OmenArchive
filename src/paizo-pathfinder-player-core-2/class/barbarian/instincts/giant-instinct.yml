name: giant instinct
level: 1
traits:
- barbarian
description: 'Your rage gives you the raw power and size of a giant. This doesn''t
  necessarily mean you revere giants—you might scoff at them or even aspire to slay
  them\! You could instead seem like a giant to other people due to your exceptional
  strength or larger-than-life emotions and ego.

  Instinct Ability—Titan Mauler You can use a weapon built for a Large creature if
  you are Small or Medium \(both normally and when raging\). If you''re not Small
  or Medium, you can use a weapon built for a creature one size larger than you. You
  start with one such weapon, which you receive for free. It must be a common melee
  or ranged weapon, it must have a Price of 9 gp or less \(not including the Price
  adjustment for being a larger weapon\), and it must be common or you must otherwise
  have access to it. It is your personal weapon and has no value if sold unless you
  later add runes to it, and it has the normal Bulk for a weapon of its size. When
  wielding a larger weapon in combat, increase your additional damage from Rage from
  2 to 6, but you have the [Clumsy 1](omen://condition/clumsy?source=paizo-pathfinder-player-core)
  condition because of the weapon''s unwieldy size. You can''t remove this clumsy
  condition or ignore its penalties by any means while wielding the weapon.

  Raging Resistance \(9th\) You resist bludgeoning damage and your choice of cold,
  electricity, or fire, chosen when you gain raging resistance.'
