name: spirit instinct
level: 1
traits:
- barbarian
description: 'Whether you are emotionally sensitive to the spirits around you; worship
  ancestors or apparitions; or are haunted by the specter of an ancestor, relative,
  friend, or foe, your rage takes the form of a spiritual possession.

  Instinct Ability—Spirit Rage When you rage, you can increase the additional damage
  from Rage from 2 to 3 and change its damage type to spirit, instead of the damage
  type for your weapon or unarmed attack \(choose each time you Rage\). If you choose
  to deal spirit damage, your weapon or unarmed attack gains the effects of the Ghost
  Touch property rune, which makes it more effective against incorporeal creatures,
  and your [Rage](omen://action/rage?source=paizo-pathfinder-player-core-2) action
  gains the divine and spirit traits.

  Raging Resistance \(9th\) You resist void damage, as well as damage dealt by the
  attacks and abilities of undead creatures, regardless of the damage type.'
