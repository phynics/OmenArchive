---
name: greater weapon specialization (barbarian)
level: 15
traits:
- barbarian
description: 'The weapons you''ve mastered become truly fearsome in your hands. Your
  damage from weapon specialization increases to 4 with weapons and unarmed attacks
  in which you''re an expert, 6 if you''re a master, and 8 if you''re legendary.

  You gain a greater benefit from your instinct''s specialization ability. See specific
  instincts for more information.'
mechanicsScope: builder
foundryID: 7JjhxMFo8DMwpGx0
rules:
- key: strike-damage-untyped-bonus
  effect: core/add-modifier@2
  inputs:
    target: strike-damage
    amount: (max 2 (multiply 3 (eq $.strike.rank master)) (multiply 4 (eq $.strike.rank
      legendary)))
    type: untyped
    requires: (gte $.strike.rank expert)
