name: 'bloodline: angelic'
level: 1
traits:
- sorcerer
description: 'One of your forebears hailed from a celestial realm, or your ancestors''
  devotion led to their lineage being blessed.

  Spell List divine

  Bloodline Skills Diplomacy, Religion

  Granted Spells cantrip Light, 1st: Heal, 2nd: Spiritual Armament, 3rd: Holy Light,
  4th: Divine Wrath, 5th: Divine Immolation, 6th: Blessed Boundary, 7th: Divine Decree,
  8th: Moment of Renewal, 9th: Foresight

  Bloodline Spells initial: Angelic Halo, advanced: Angelic Wings, greater: Celestial
  Brand

  Blood Magic—Divine Aura You project a warming aura that protects you or one target,
  granting a +1 status bonus to saving throws for 1 round'
mechanicsScope: builder
foundryID: vhW3glAaEfq2DKrw
