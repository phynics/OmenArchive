name: 'bloodline: imperial'
level: 1
traits:
- sorcerer
description: 'One of your ancestors was a mortal who mastered magic.

  Tradition arcane

  Bloodline Skills Arcana, Society

  Sorcerous Gifts cantrip [Detect Magic](omen://spell/detect-magic?source=paizo-pathfinder-player-core),
  1st: [Force Barrage](omen://spell/force-barrage?source=paizo-pathfinder-player-core),
  2nd: [Dispel Magic](omen://spell/dispel-magic?source=paizo-pathfinder-player-core),
  3rd: [Haste](omen://spell/haste?source=paizo-pathfinder-player-core), 4th: [Translocate](omen://spell/translocate?source=paizo-pathfinder-player-core),
  5th: [Scouting Eye](omen://spell/scouting-eye?source=paizo-pathfinder-player-core),
  6th: [Disintegrate](omen://spell/disintegrate?source=paizo-pathfinder-player-core),
  7th: [Retrocognition](omen://spell/retrocognition?source=paizo-pathfinder-player-core),
  8th: [Quandary](omen://spell/quandary?source=paizo-pathfinder-player-core), 9th:
  [Implosion](omen://spell/implosion?source=paizo-pathfinder-player-core)

  Bloodline Spells initial: [Ancestral Memories](omen://spell/ancestral-memories?source=paizo-pathfinder-player-core-2),
  advanced: [Extend Blood Magic](omen://spell/extend-blood-magic?source=paizo-pathfinder-player-core-2),
  greater: [Arcane Countermeasure](omen://spell/arcane-countermeasure?source=paizo-pathfinder-player-core-2)

  Blood Magic—Imperious Defense Raw magic emanates from every cell in your body, protecting
  you. Until the start of your next turn, you gain your choice of either a +1 status
  bonus to AC or a +1 status bonus to saving throws.'
