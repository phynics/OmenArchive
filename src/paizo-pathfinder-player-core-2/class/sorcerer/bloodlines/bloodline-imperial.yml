---
name: 'bloodline: imperial'
level: 1
traits:
- sorcerer
description: 'One of your ancestors was a mortal who mastered magic.

  Tradition arcane

  Bloodline Skills Arcana, Society

  Sorcerous Gifts cantrip Detect Magic, 1st: Force Barrage, 2nd: Dispel Magic, 3rd:
  Haste, 4th: Translocate, 5th: Scouting Eye, 6th: Disintegrate, 7th: Retrocognition,
  8th: Quandary, 9th: Implosion

  Bloodline Spells initial: Ancestral Memories, advanced: Extend Blood Magic, greater:
  Arcane Countermeasure

  Blood Magic—Imperious Defense Raw magic emanates from every cell in your body, protecting
  you. Until the start of your next turn, you gain your choice of either a +1 status
  bonus to AC or a +1 status bonus to saving throws.'
mechanicsScope: builder
foundryID: ZEtJJ5UOlV5oTWWp
