name: 'bloodline: aberrant'
level: 1
traits:
- sorcerer
description: 'Something ancient and unknowable speaks to you from beyond the stars
  or below the earth.

  Tradition occult

  Bloodline Skills Intimidation, Occultism

  Sorcerous Gifts cantrip: Daze; 1st: Phantom Pain; 2nd: Stupefy; 3rd: Vampiric Feast;
  4th: Confusion; 5th: Slither; 6th: Never Mind; 7th: Warp Mind; 8th: Uncontrollable
  Dance; 9th: Unfathomable Song

  Bloodline Spells initial: Tentacular Limbs; advanced: Aberrant Whispers; greater:
  Unusual Anatomy

  Blood Magic—Eerie Veil An ominous pall spills from your mind. Either one target
  takes a –1 status penalty to Will saving throws for 1 round or you gain a +2 status
  bonus to Will saving throws for 1 round.'
