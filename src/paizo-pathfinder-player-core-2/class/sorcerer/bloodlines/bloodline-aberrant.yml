name: 'bloodline: aberrant'
level: 1
traits:
- sorcerer
description: 'Something ancient and unknowable speaks to you from beyond the stars
  or below the earth.

  Tradition occult

  Bloodline Skills Intimidation, Occultism

  Sorcerous Gifts cantrip: [Daze](omen://spell/daze?source=paizo-pathfinder-player-core);
  1st: [Phantom Pain](omen://spell/phantom-pain?source=paizo-pathfinder-player-core);
  2nd: [Stupefy](omen://spell/stupefy?source=paizo-pathfinder-player-core); 3rd: [Vampiric
  Feast](omen://spell/vampiric-feast?source=paizo-pathfinder-player-core); 4th: [Confusion](omen://spell/confusion?source=paizo-pathfinder-player-core);
  5th: [Slither](omen://spell/slither?source=paizo-pathfinder-player-core); 6th: [Never
  Mind](omen://spell/never-mind?source=paizo-pathfinder-player-core); 7th: [Warp Mind](omen://spell/warp-mind?source=paizo-pathfinder-player-core);
  8th: [Uncontrollable Dance](omen://spell/uncontrollable-dance?source=paizo-pathfinder-player-core);
  9th: [Unfathomable Song](omen://spell/unfathomable-song?source=paizo-pathfinder-player-core)

  Bloodline Spells initial: [Tentacular Limbs](omen://spell/tentacular-limbs?source=paizo-pathfinder-player-core-2);
  advanced: [Aberrant Whispers](omen://spell/aberrant-whispers?source=paizo-pathfinder-player-core-2);
  greater: [Unusual Anatomy](omen://spell/unusual-anatomy?source=paizo-pathfinder-player-core-2)

  Blood Magic—Eerie Veil An ominous pall spills from your mind. Either one target
  takes a –1 status penalty to Will saving throws for 1 round or you gain a +2 status
  bonus to Will saving throws for 1 round.'
mechanicsScope: builder
foundryID: 3qqvnC2U8W26yae7
