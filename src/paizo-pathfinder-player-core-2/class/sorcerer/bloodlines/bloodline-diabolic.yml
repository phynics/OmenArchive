---
name: 'bloodline: diabolic'
level: 1
traits:
- sorcerer
description: 'Devils are evil with a silver tongue, and one of your ancestors dallied
  in darkness or made an infernal pact.

  Spell List divine

  Bloodline Skills Deception, Religion

  Sorcerous Gifts cantrip Ignition, 1st: Charm, 2nd: Floating Flame, 3rd: Enthrall,
  4th: Suggestion, 5th: Wave of Despair, 6th: Truesight, 7th: Divine Decree, 8th:
  Divine Inspiration, 9th: Falling Stars

  Bloodline Spells initial: Diabolic Edict, advanced: Embrace the Pit, greater: Hellfire
  Plume

  Blood Magic—Tongue of Flame Your tongue becomes laced with the fires of Hell, and
  you can either lash out at a foe with it or swallow it to make your lies more palatable.
  Either a target takes 1 fire damage per spell rank (if the spell already deals initial
  fire damage, combine this with the spell''s initial damage before determining weaknesses
  and resistances), or you gain a +2 status bonus to Deception checks for 1 round.'
mechanicsScope: builder
foundryID: o39zQMIdERWtmBSB
