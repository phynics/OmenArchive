---
name: 'bloodline: diabolic'
level: 1
traits:
- sorcerer
description: 'Devils are evil with a silver tongue, and one of your ancestors dallied
  in darkness or made an infernal pact.

  Spell List divine

  Bloodline Skills Deception, Religion

  Sorcerous Gifts cantrip [Ignition](omen://spell/ignition?source=paizo-pathfinder-player-core),
  1st: [Charm](omen://spell/charm?source=paizo-pathfinder-player-core), 2nd: [Floating
  Flame](omen://spell/floating-flame?source=paizo-pathfinder-player-core), 3rd: [Enthrall](omen://spell/enthrall?source=paizo-pathfinder-player-core),
  4th: [Suggestion](omen://spell/suggestion?source=paizo-pathfinder-player-core),
  5th: [Wave of Despair](omen://spell/wave-of-despair?source=paizo-pathfinder-player-core),
  6th: [Truesight](omen://spell/truesight?source=paizo-pathfinder-player-core), 7th:
  [Divine Decree](omen://spell/divine-decree?source=paizo-pathfinder-player-core),
  8th: [Divine Inspiration](omen://spell/divine-inspiration?source=paizo-pathfinder-player-core),
  9th: [Falling Stars](omen://spell/falling-stars?source=paizo-pathfinder-player-core)

  Bloodline Spells initial: [Diabolic Edict](omen://spell/diabolic-edict?source=paizo-pathfinder-player-core-2),
  advanced: [Embrace the Pit](omen://spell/embrace-the-pit?source=paizo-pathfinder-player-core-2),
  greater: [Hellfire Plume](omen://spell/hellfire-plume?source=paizo-pathfinder-player-core-2)

  Blood Magic—Tongue of Flame Your tongue becomes laced with the fires of Hell, and
  you can either lash out at a foe with it or swallow it to make your lies more palatable.
  Either a target takes 1 fire damage per spell rank \(if the spell already deals
  initial fire damage, combine this with the spell''s initial damage before determining
  weaknesses and resistances\), or you gain a +2 status bonus to Deception checks
  for 1 round.'
mechanicsScope: builder
foundryID: o39zQMIdERWtmBSB
