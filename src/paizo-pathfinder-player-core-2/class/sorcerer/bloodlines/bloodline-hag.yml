---
name: 'bloodline: hag'
level: 1
traits:
- sorcerer
description: 'A hag long ago cursed your family, or you are a descendant of a hag
  or changeling, and their magic infests your blood and soul.

  Tradition occult

  Bloodline Skills Deception, Occultism

  Sorcerous Gifts cantrip Daze, 1st: Illusory Disguise, 2nd: Stupefy, 3rd: Blindness,
  4th: Outcast''s Curse, 5th: Mariner''s Curse, 6th: Cursed Metamorphosis, 7th: Warp
  Mind, 8th: Quandary, 9th: Phantasmagoria

  Bloodline Spells initial: Jealous Hex, advanced: Horrific Visage, greater: You''re
  Mine

  Blood Magic—Retributive Spite Malice and acrimony take physical form around you.
  You deal 4 mental damage per spell rank (basic Will save) to the first creature
  that deals damage to you before the end of your next turn; if no creature damages
  you in that time, you consume that spite to gain temporary Hit Points at the beginning
  of your next turn equal to the spell''s rank. These temporary Hit Points last until
  the beginning of your following turn.'
mechanicsScope: builder
foundryID: O0uXZRWMNliDbkxU
