name: 'bloodline: hag'
level: 1
traits:
- sorcerer
description: 'A hag long ago cursed your family, or you are a descendant of a hag
  or changeling, and their magic infests your blood and soul.

  Tradition occult

  Bloodline Skills Deception, Occultism

  Sorcerous Gifts cantrip [Daze](omen://spell/daze?source=paizo-pathfinder-player-core),
  1st: [Illusory Disguise](omen://spell/illusory-disguise?source=paizo-pathfinder-player-core),
  2nd: [Stupefy](omen://spell/stupefy?source=paizo-pathfinder-player-core), 3rd: [Blindness](omen://spell/blindness?source=paizo-pathfinder-player-core),
  4th: [Outcast''s Curse](omen://spell/outcasts-curse?source=paizo-pathfinder-player-core),
  5th: [Mariner''s Curse](omen://spell/mariners-curse?source=paizo-pathfinder-player-core),
  6th: [Cursed Metamorphosis](omen://spell/cursed-metamorphosis?source=paizo-pathfinder-player-core),
  7th: [Warp Mind](omen://spell/warp-mind?source=paizo-pathfinder-player-core), 8th:
  [Quandary](omen://spell/quandary?source=paizo-pathfinder-player-core), 9th: [Phantasmagoria](omen://spell/phantasmagoria?source=paizo-pathfinder-player-core)

  Bloodline Spells initial: [Jealous Hex](omen://spell/jealous-hex?source=paizo-pathfinder-player-core-2),
  advanced: [Horrific Visage](omen://spell/horrific-visage?source=paizo-pathfinder-player-core-2),
  greater: [You''re Mine](omen://spell/youre-mine?source=paizo-pathfinder-player-core-2)

  Blood Magic—Retributive Spite Malice and acrimony take physical form around you.
  You deal 4 mental damage per spell rank \(basic Will save\) to the first creature
  that deals damage to you before the end of your next turn; if no creature damages
  you in that time, you consume that spite to gain temporary Hit Points at the beginning
  of your next turn equal to the spell''s rank. These temporary Hit Points last until
  the beginning of your following turn.'
