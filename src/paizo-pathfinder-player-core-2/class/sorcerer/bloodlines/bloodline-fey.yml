---
name: 'bloodline: fey'
level: 1
traits:
- sorcerer
description: 'Fey whimsy or a tryst in a moonlit grove put the bewitching magic of
  the First World into your family''s bloodline.

  Tradition primal

  Bloodline Skills Deception, Nature

  Sorcerous Gifts cantrip Figment, 1st: Charm, 2nd: Laughing Fit, 3rd: Enthrall, 4th:
  Suggestion, 5th: Hallucination, 6th: Mislead, 7th: Visions of Danger, 8th: Uncontrollable
  Dance, 9th: Metamorphosis

  Bloodline Spells initial: Faerie Dust, advanced: Fey Disappearance, greater: Fey
  Glamour

  Blood Magic—Cloak of Ribbons Colorful fey ribbons dance around you. Either you gain
  a +2 status bonus to Performance checks for 1 round, or you can become Concealed
  for 1 round. Such obvious concealment can''t be used to Hide'
mechanicsScope: builder
foundryID: eW3cfCH7Wpx2vik2
