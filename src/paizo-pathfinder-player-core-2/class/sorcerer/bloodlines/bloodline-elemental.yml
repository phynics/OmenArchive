---
name: 'bloodline: elemental'
level: 1
traits:
- sorcerer
description: "An elemental influence has imbued your blood with primal fury. You are
  granted different sorcerous gift spells and damage type from blood magic depending
  on which element affected your bloodline (see Elemental Influences below).\nTradition
  primal\nBloodline Skills Intimidation, Nature\nSorcerous Gifts cantrip: see Elemental
  Influences below; 1st: see Elemental Influences below; 2nd: Resist Energy; 3rd:
  see Elemental Influences below; 4th: Unfettered Movement; 5th: Elemental Form (elemental
  influence only); 6th :see Elemental Influences below; 7th: Energy Aegis; 8th: Earthquake;
  9th: Wrathful Storm\nBloodline Spells initial: Elemental Toss; advanced: Elemental
  Motion; greater: Elemental Blast\nBlood Magic—Elemental Fury Elemental energy wreathes
  your form and infuses your magic. Either you gain a +2 status bonus to Intimidation
  checks for 1 round, or a target takes 1 damage per spell rank; this damage type
  is listed under your elemental influence. If the spell already deals that type of
  damage, combine it with the spell's initial damage before determining weaknesses
  and resistances.\nElemental Influences\nAt 1st level, choose the type of elemental
  that influenced your bloodline: air, earth, fire, metal, water, or wood. You can't
  change this later. You are granted different spells at certain ranks according to
  this influence.\n\t•\tAir—Sorcerous Gifts cantrip: Gale Blast; 1st: Tailwind; 3rd:
  Wall of Wind; 6th: Chain Lightning; Blood Magic Damage slashing\n\t•\tEarth—Sorcerous
  Gifts cantrip: Scatter Scree; 1st: Pummeling Rubble; 3rd: Earthbind; 6th: Petrify;
  Blood Magic Damage bludgeoning\n\t•\tFire—Sorcerous Gifts cantrip: Ignition, 1st:
  Breathe Fire; 3rd: Fireball; 6th: Tree of Seasons (all pods are summer); Blood Magic
  Damage fire\n\t•\tMetal—Sorcerous Gifts cantrip Electric Arc; 1st: Thunderstrike;
  3rd: Lightning Bolt; 6th: Chain Lightning; Blood Magic Damage piercing\n\t•\tWater—Sorcerous
  Gifts cantrip: Frostbite; 1st: Hydraulic Push; 3rd: Aqueous Orb; 6th: Scintillating
  Safeguard; Blood Magic Damage bludgeoning\n\t•\tWood—Sorcerous Gifts cantrip: Tangle
  Vine; 1st: Cleanse Cuisine; 3rd: Wall of Thorns; 6th: Tangling Creepers; Blood Magic
  Damage bludgeoning"
mechanicsScope: builder
foundryID: RXRnJcG4XSabZ35a
