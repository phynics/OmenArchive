---
name: 'bloodline: elemental'
level: 1
traits:
- sorcerer
description: "An elemental influence has imbued your blood with primal fury. You are
  granted different sorcerous gift spells and damage type from blood magic depending
  on which element affected your bloodline \\(see Elemental Influences below\\).\nTradition
  primal\nBloodline Skills Intimidation, Nature\nSorcerous Gifts cantrip: see Elemental
  Influences below; 1st: see Elemental Influences below; 2nd: [Resist Energy](omen://spell/resist-energy?source=paizo-pathfinder-player-core);
  3rd: see Elemental Influences below; 4th: [Unfettered Movement](omen://spell/unfettered-movement?source=paizo-pathfinder-player-core);
  5th: [Elemental Form](omen://spell/elemental-form?source=paizo-pathfinder-player-core)
  \\(elemental influence only\\); 6th :see Elemental Influences below; 7th: [Energy
  Aegis](omen://spell/energy-aegis?source=paizo-pathfinder-player-core); 8th: [Earthquake](omen://spell/earthquake?source=paizo-pathfinder-player-core);
  9th: [Wrathful Storm](omen://spell/wrathful-storm?source=paizo-pathfinder-player-core)\nBloodline
  Spells initial: [Elemental Toss](omen://spell/elemental-toss?source=paizo-pathfinder-player-core-2);
  advanced: [Elemental Motion](omen://spell/elemental-motion?source=paizo-pathfinder-player-core-2);
  greater: [Elemental Blast](omen://spell/elemental-blast?source=paizo-pathfinder-player-core-2)\nBlood
  Magic—Elemental Fury Elemental energy wreathes your form and infuses your magic.
  Either you gain a +2 status bonus to Intimidation checks for 1 round, or a target
  takes 1 damage per spell rank; this damage type is listed under your elemental influence.
  If the spell already deals that type of damage, combine it with the spell's initial
  damage before determining weaknesses and resistances.\nElemental Influences\nAt
  1st level, choose the type of elemental that influenced your bloodline: air, earth,
  fire, metal, water, or wood. You can't change this later. You are granted different
  spells at certain ranks according to this influence.\n\t•\tAir—Sorcerous Gifts cantrip:
  [Gale Blast](omen://spell/gale-blast?source=paizo-pathfinder-player-core-2); 1st:
  [Tailwind](omen://spell/tailwind?source=paizo-pathfinder-player-core); 3rd: [Wall
  of Wind](omen://spell/wall-of-wind?source=paizo-pathfinder-player-core); 6th: [Chain
  Lightning](omen://spell/chain-lightning?source=paizo-pathfinder-player-core); Blood
  Magic Damage slashing\n\t•\tEarth—Sorcerous Gifts cantrip: [Scatter Scree](omen://spell/scatter-scree?source=paizo-pathfinder-player-core-2);
  1st: [Pummeling Rubble](omen://spell/pummeling-rubble?source=paizo-pathfinder-player-core);
  3rd: [Earthbind](omen://spell/earthbind?source=paizo-pathfinder-player-core); 6th:
  [Petrify](omen://spell/petrify?source=paizo-pathfinder-player-core); Blood Magic
  Damage bludgeoning\n\t•\tFire—Sorcerous Gifts cantrip: [Ignition](omen://spell/ignition?source=paizo-pathfinder-player-core),
  1st: [Breathe Fire](omen://spell/breathe-fire?source=paizo-pathfinder-player-core);
  3rd: [Fireball](omen://spell/fireball?source=paizo-pathfinder-player-core); 6th:
  [Tree of Seasons](omen://spell/tree-of-seasons?source=paizo-pathfinder-player-core)
  \\(all pods are summer\\); Blood Magic Damage fire\n\t•\tMetal—Sorcerous Gifts cantrip
  [Electric Arc](omen://spell/electric-arc?source=paizo-pathfinder-player-core); 1st:
  [Thunderstrike](omen://spell/thunderstrike?source=paizo-pathfinder-player-core);
  3rd: [Lightning Bolt](omen://spell/lightning-bolt?source=paizo-pathfinder-player-core);
  6th: [Chain Lightning](omen://spell/chain-lightning?source=paizo-pathfinder-player-core);
  Blood Magic Damage piercing\n\t•\tWater—Sorcerous Gifts cantrip: [Frostbite](omen://spell/frostbite?source=paizo-pathfinder-player-core);
  1st: [Hydraulic Push](omen://spell/hydraulic-push?source=paizo-pathfinder-player-core);
  3rd: [Aqueous Orb](omen://spell/aqueous-orb?source=paizo-pathfinder-player-core);
  6th: [Scintillating Safeguard](omen://spell/scintillating-safeguard?source=paizo-pathfinder-player-core-2);
  Blood Magic Damage bludgeoning\n\t•\tWood—Sorcerous Gifts cantrip: [Tangle Vine](omen://spell/tangle-vine?source=paizo-pathfinder-player-core);
  1st: [Cleanse Cuisine](omen://spell/cleanse-cuisine?source=paizo-pathfinder-player-core);
  3rd: [Wall of Thorns](omen://spell/wall-of-thorns?source=paizo-pathfinder-player-core);
  6th: [Tangling Creepers](omen://spell/tangling-creepers?source=paizo-pathfinder-player-core);
  Blood Magic Damage bludgeoning"
mechanicsScope: builder
