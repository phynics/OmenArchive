---
name: 'bloodline: draconic'
level: 1
traits:
- sorcerer
description: "The blood of dragons flows through your veins. These beasts are both
  fearsome in combat and skilled at magic.\nTradition variable (see Draconic Exemplars
  below)\nBloodline Skills Intimidation and one other skill (see Draconic Exemplars
  below)\nSorcerous Gifts cantrip: Shield; 1st: Fear; 2nd: see Draconic Exemplars
  below; 3rd: Haste; 4th: Fly; 5th: see Draconic Exemplars below; 6th: Dragon Form
  (dragon must match your draconic exemplar); 7th: Mask of Terror; 8th: see Draconic
  Exemplars below; 9th: Overwhelming Presence\nBloodline Spells initial: Flurry of
  Claws; advanced: Dragon Breath; greater: Dragon Wings\nBlood Magic—Scaly Hide Draconic
  scales grow briefly on you or one target, granting a +1 status bonus to AC for 1
  round.\nDraconic Exemplars\nAt 1st level, choose the tradition related to the dragon
  exemplar who influenced your bloodline. You can't change your dragon exemplar later.
  As noted, this affects both your bloodline's features and your sorcerous gift spells.\n\t•\tArcane—Tradition
  arcane; Bloodline Skill Arcana; Sorcerous Gifts 2nd: Blazing Bolt; 5th: Subconscious
  Suggestion; 8th: Quandary\n\t•\tDivine—Tradition divine; Bloodline Skill Religion;
  Sorcerous Gifts 2nd: Augury; 5th: Divine Immolation; 8th: Divine Inspiration\n\t•\tOccult—Tradition
  occult; Bloodline Skill Occultism; Sorcerous Gifts 2nd: Blood Vendetta; 5th: Slither;
  8th: Unrelenting Observation\n\t•\tPrimal—Tradition primal; Bloodline Skill Nature;
  Sorcerous Gifts 2nd: Shatter; 5th: Howling Blizzard; 8th: Earthquake\nDraconic Sorcerer
  Bloodlines"
mechanicsScope: builder
foundryID: ZHabYxSgYK0XbjhM
