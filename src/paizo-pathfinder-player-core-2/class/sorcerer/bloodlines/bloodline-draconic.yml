---
name: 'bloodline: draconic'
level: 1
traits:
- sorcerer
description: "The blood of dragons flows through your veins. These beasts are both
  fearsome in combat and skilled at magic.\nTradition variable \\(see Draconic Exemplars
  below\\)\nBloodline Skills Intimidation and one other skill \\(see Draconic Exemplars
  below\\)\nSorcerous Gifts cantrip: [Shield](omen://spell/shield?source=paizo-pathfinder-player-core);
  1st: [Fear](omen://spell/fear?source=paizo-pathfinder-player-core); 2nd: see Draconic
  Exemplars below; 3rd: [Haste](omen://spell/haste?source=paizo-pathfinder-player-core);
  4th: [Fly](omen://spell/fly?source=paizo-pathfinder-player-core); 5th: see Draconic
  Exemplars below; 6th: [Dragon Form](omen://spell/dragon-form?source=paizo-pathfinder-player-core)
  \\(dragon must match your draconic exemplar\\); 7th: [Mask of Terror](omen://spell/mask-of-terror?source=paizo-pathfinder-player-core);
  8th: see Draconic Exemplars below; 9th: [Overwhelming Presence](omen://spell/overwhelming-presence?source=paizo-pathfinder-player-core)\nBloodline
  Spells initial: [Flurry of Claws](omen://spell/flurry-of-claws?source=paizo-pathfinder-player-core-2);
  advanced: [Dragon Breath](omen://spell/dragon-breath?source=paizo-pathfinder-player-core-2);
  greater: [Dragon Wings](omen://spell/dragon-wings?source=paizo-pathfinder-player-core-2)\nBlood
  Magic—Scaly Hide Draconic scales grow briefly on you or one target, granting a +1
  status bonus to AC for 1 round.\nDraconic Exemplars\nAt 1st level, choose the tradition
  related to the dragon exemplar who influenced your bloodline. You can't change your
  dragon exemplar later. As noted, this affects both your bloodline's features and
  your sorcerous gift spells.\n\t•\tArcane—Tradition arcane; Bloodline Skill Arcana;
  Sorcerous Gifts 2nd: [Blazing Bolt](omen://spell/blazing-bolt?source=paizo-pathfinder-player-core);
  5th: [Subconscious Suggestion](omen://spell/subconscious-suggestion?source=paizo-pathfinder-player-core);
  8th: [Quandary](omen://spell/quandary?source=paizo-pathfinder-player-core)\n\t•\tDivine—Tradition
  divine; Bloodline Skill Religion; Sorcerous Gifts 2nd: [Augury](omen://spell/augury?source=paizo-pathfinder-player-core);
  5th: [Divine Immolation](omen://spell/divine-immolation?source=paizo-pathfinder-player-core);
  8th: [Divine Inspiration](omen://spell/divine-inspiration?source=paizo-pathfinder-player-core)\n\t•\tOccult—Tradition
  occult; Bloodline Skill Occultism; Sorcerous Gifts 2nd: [Blood Vendetta](omen://spell/blood-vendetta?source=paizo-pathfinder-player-core);
  5th: [Slither](omen://spell/slither?source=paizo-pathfinder-player-core); 8th: [Unrelenting
  Observation](omen://spell/unrelenting-observation?source=paizo-pathfinder-player-core)\n\t•\tPrimal—Tradition
  primal; Bloodline Skill Nature; Sorcerous Gifts 2nd: [Shatter](omen://spell/shatter?source=paizo-pathfinder-player-core);
  5th: [Howling Blizzard](omen://spell/howling-blizzard?source=paizo-pathfinder-player-core);
  8th: [Earthquake](omen://spell/earthquake?source=paizo-pathfinder-player-core)\nDraconic
  Sorcerer Bloodlines"
mechanicsScope: builder
foundryID: ZHabYxSgYK0XbjhM
rules:
- key: choice-sorcerer-bloodline-draconic
  choice:
    name: $.sorcerer.bloodline.draconic
