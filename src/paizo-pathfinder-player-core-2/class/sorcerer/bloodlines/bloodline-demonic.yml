description: 'Demons debase all they touch. One of your ancestors fell victim to their
  corruption, and you''re burdened by that sin.

  Tradition divine

  Bloodline Skills Intimidation, Religion

  Sorcerous Gifts cantrip: [Caustic Blast](omen://spell/caustic-blast?source=paizo-pathfinder-player-core);
  1st: [Fear](omen://spell/fear?source=paizo-pathfinder-player-core); 2nd: [Enlarge](omen://spell/enlarge?source=paizo-pathfinder-player-core);
  3rd: [Slow](omen://spell/slow?source=paizo-pathfinder-player-core); 4th: [Divine
  Wrath](omen://spell/divine-wrath?source=paizo-pathfinder-player-core); 5th: [Blister](omen://spell/blister);
  6th: [Disintegrate](omen://spell/disintegrate?source=paizo-pathfinder-player-core);
  7th: [Divine Decree](omen://spell/divine-decree?source=paizo-pathfinder-player-core);
  8th: [Canticle of Everlasting Grief](omen://spell/canticle-of-everlasting-grief?source=paizo-pathfinder-player-core);
  9th: [Implosion](omen://spell/implosion?source=paizo-pathfinder-player-core)

  Bloodline Spells initial: [Glutton''s Jaws](omen://spell/gluttons-jaws); advanced:
  [Swamp of Sloth](omen://spell/swamp-of-sloth); greater: [Chthonian Wrath](omen://spell/chthonian-wrath)

  Blood Magic—Corruption of Sin You mentally broadcast brief glimpses into the darkest
  desires of the mind. Either a target takes a –1 status penalty to AC for 1 round,
  or you gain a +2 status bonus to Intimidation checks for 1 round.'
