---
name: 'bloodline: demonic'
level: 1
traits:
- sorcerer
description: 'Demons debase all they touch. One of your ancestors fell victim to their
  corruption, and you''re burdened by that sin.

  Tradition divine

  Bloodline Skills Intimidation, Religion

  Sorcerous Gifts cantrip: Caustic Blast; 1st: Fear; 2nd: Enlarge; 3rd: Slow; 4th:
  Divine Wrath; 5th: Blister; 6th: Disintegrate; 7th: Divine Decree; 8th: Canticle
  of Everlasting Grief; 9th: Implosion

  Bloodline Spells initial: Glutton''s Jaws; advanced: Swamp of Sloth; greater: Chthonian
  Wrath

  Blood Magic—Corruption of Sin You mentally broadcast brief glimpses into the darkest
  desires of the mind. Either a target takes a –1 status penalty to AC for 1 round,
  or you gain a +2 status bonus to Intimidation checks for 1 round.'
mechanicsScope: builder
foundryID: w5koctOVrEcpxTIq
