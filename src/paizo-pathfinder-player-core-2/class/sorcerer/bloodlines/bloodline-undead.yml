name: 'bloodline: undead'
level: 1
traits:
- sorcerer
description: 'The touch of undeath runs through your blood. Your family tree might
  contain powerful undead, like a vampire.

  Tradition divine

  Bloodline Skills Intimidation, Religion

  Sorcerous Gifts cantrip [Void Warp](omen://spell/void-warp?source=paizo-pathfinder-player-core),
  1st: [Harm](omen://spell/harm?source=paizo-pathfinder-player-core), 2nd: [See the
  Unseen](omen://spell/see-the-unseen?source=paizo-pathfinder-player-core), 3rd: [Bind
  Undead](omen://spell/bind-undead?source=paizo-pathfinder-player-core), 4th: [Talking
  Corpse](omen://spell/talking-corpse?source=paizo-pathfinder-player-core), 5th: [Invoke
  Spirits](omen://spell/invoke-spirits?source=paizo-pathfinder-player-core), 6th:
  [Vampiric Exsanguination](omen://spell/vampiric-exsanguination?source=paizo-pathfinder-player-core),
  7th: [Execute](omen://spell/execute?source=paizo-pathfinder-player-core), 8th: [Canticle
  of Everlasting Grief](omen://spell/canticle-of-everlasting-grief?source=paizo-pathfinder-player-core),
  9th: [Wails of the Damned](omen://spell/wails-of-the-damned?source=paizo-pathfinder-player-core)

  Bloodline Spells initial: [Undeath''s Blessing](omen://spell/undeaths-blessing),
  advanced: [Drain Life](omen://spell/drain-life), greater: [Grasping Grave](omen://spell/grasping-grave)

  Blood Magic—Stolen Life You can channel the necromantic energy in your blood. Either
  you gain temporary Hit Points equal to the spell''s rank that last until the start
  of your next turn, or a target takes 1 void damage per spell rank \(if the spell
  already deals initial void damage, combine this with the spell''s initial damage
  before determining weaknesses and resistances\).'
