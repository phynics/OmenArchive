name: alter admixture
level: 8
rarity: common
type: class
traits:
- alchemist
- exploration
action:
  requirements: You are holding or wearing an alchemist's toolkit.
description: Sometimes, you need to adapt your alchemical mixtures to new situations.
  In a process that takes 10 minutes, you change an item you created with advanced
  alchemy into a similar item. You can change an alchemical bomb into another type
  of alchemical bomb, an elixir into another type of elixir, or a poison into another
  type of poison. If it's unclear whether two alchemical consumables are similar,
  the GM decides. You must know the formula for the new item, and the new item must
  be of the same or lower item level than the original item. The new item still keeps
  the infused trait, and it remains potent as long as the original item would have.
