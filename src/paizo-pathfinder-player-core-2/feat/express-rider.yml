  hasSkillProficiency: {skill: nature, proficiency: trained}
description: You can encourage your mount to cover ground quickly. When calculating
  your travel Speed for the day while mounted, you can attempt a Nature check to Command
  an Animal to increase your mount's travel Speed. The DC is determined by the GM,
  but is typically based on the mount's level or the difficulty of the environment,
  whichever is harder. On a success, increase your mount's travel Speed by half. This
  has no effect on your mount's movement in encounters. This benefit extends to up
  to six other allies traveling with you, as long as all such allies are also mounted,
  or are quadrupeds with a Speed of at least 30 feet.
