  hasSkillProficiency: {skill: society, proficiency: trained}
description: You are adept at quickly scanning loose papers and carefully discerning
  the contents of sealed letters without damaging the seal. You can attempt Society
  checks to Decipher Writing on a message that is only partially glimpsed, upside
  down or reversed from your perspective, and gain a +1 circumstance bonus to the
  check when doing so. You can also use this feat to decipher sealed letters, adding
  the manipulate trait to your attempt to Decipher Writing. This doesn't prevent witnesses
  from noticing your efforts; you might need to attempt Deception or Stealth checks
  to avoid being noticed. In either use of this feat, the recipient is made aware
  of your efforts on a critical failure (for instance, you might be caught rubbernecking
  or you might disturb the papers in a way their owner notices).
