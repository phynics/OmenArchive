description: Through the lingering influence of your warren's patron, you've sprouted
  a small set of wings. While not suitable for full flight, these weak wings can help
  you jump further with a small flap. When Leaping horizontally, you move an additional
  5 feet. This additional distance isn't cumulative with the increased Leap distance
  from the Powerful Leap feat. In addition, when you attempt a Long Jump, you can
  jump a distance up to 10 feet farther than you normally would based on the result
  of your Athletics check, though you still can't jump farther than your Speed. You
  don't automatically fail your checks to High Jump or Long Jump if you don't Stride
  at least 10 feet first.
