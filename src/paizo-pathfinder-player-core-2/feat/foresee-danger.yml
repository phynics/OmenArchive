action:
  count: reaction
  trigger: A creature targets you with an attack and you can see the attacker.
description: 'You perceive every possible way your foe''s attack could land and attempt
  to avoid them all.

  The triggering attack roll targets your Perception DC instead of your AC. Though
  this allows you to avoid taking penalties to your AC, it doesn''t remove any conditions
  or other effects causing such penalties.

  For example, an enemy with sneak attack would still deal extra damage to you for
  being Off-Guard, even though you wouldn''t take the –2 circumstance penalty when
  defending against the attack.'
