description: "Basic mutagens that affect your mind and thoughts can make you communicate
  telepathically, protect you from being detected, or let you communicate with anyone.
  While you're affected by one of the listed mutagens, you get an additional benefit.\n\t•\t[Cognitive
  Mutagen](omen://item/cognitive-mutagen-lesser?source=paizo-pathfinder-player-core-2)
  You also gain the mutagen's item bonus to Deception, Diplomacy, Intimidation, Medicine,
  Nature, Performance, Religion, and Survival checks. In addition, you can communicate
  telepathically with creatures within 60 feet with whom you share a language. The
  communication is two-way once you establish it, so a creature you contact can also
  communicate with you.\n\t•\t[Serene Mutagen](omen://item/serene-mutagen-lesser?source=paizo-pathfinder-player-core-2)
  Detection, revelation, and scrying effects of 9th rank \\(or 17th level\\) or lower
  detect nothing from you or your possessions and auras. For instance, detect magic
  would still detect other magic in the area, but not any magic on you.\n\t•\t[Silvertongue
  Mutagen](omen://item/silvertongue-mutagen-lesser?source=paizo-pathfinder-player-core-2)
  Ignore circumstance penalties you would take to Deception, Diplomacy, Intimidation,
  and Performance checks. In addition, your words transcend linguistic barriers; everyone
  listening to you speak hears your words as if you were speaking in their own language
  \\(though you don't actually speak that language, nor does this ability allow you
  to understand any additional languages\\)."
specialText: If you can be under the effects of multiple mutagens \(with the [mutagenist
  greater field discovery](omen://class/alchemist/field-benefits/greater-field-discovery-mutagenist?source=paizo-pathfinder-player-core-2),
  for example\), you get all relevant benefits.
