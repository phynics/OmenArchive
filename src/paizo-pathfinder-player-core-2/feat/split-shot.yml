description: 'You fragment a ranged spell. If your next action is to Cast a Spell
  without a duration that requires an attack roll against a single target, you can
  choose a second target within range. You roll a single attack roll and compare the
  result to the AC of both targets.

  This counts as one attack for your multiple attack penalty. To the second target,
  the spell deals half the amount of damage it would normally deal and has no effects
  beyond the spell''s initial damage \(such as imposing conditions or penalties\).'
