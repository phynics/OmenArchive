  must succeed at a Will save against your Intimidation DC or be [Frightened 1](omen://condition/frightened?source=paizo-pathfinder-player-core)
  \([Frightened 2](omen://condition/frightened?source=paizo-pathfinder-player-core)
  on a critical failure\). When a creature frightened by the roar begins its turn
  adjacent to you, it can''t reduce its frightened value below 1 on that turn.

  Your first attack that hits a frightened creature after you roar and before the
  end of your next turn gains a +4 circumstance bonus to damage.

