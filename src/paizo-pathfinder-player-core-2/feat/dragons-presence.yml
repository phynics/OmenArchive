---
name: dragon's presence
level: 1
rarity: common
type: ancestry
traits:
- kobold
prerequisites:
- text: dragonscaled kobold heritage
  has: '@ancestry.kobold.heritages.dragonscaled-kobold'
description: 'As kin to dragonkind, you project unflappable confidence \(that collapses
  catastrophically against the deadliest foes\). When you roll a success on a saving
  throw against a fear effect, you get a critical success instead. When you roll a
  failure against a fear effect, you get a critical failure instead.

  In addition, when you attempt to [Demoralize](omen://action/demoralize?source=paizo-pathfinder-player-core)
  a foe of your level or lower, you gain a +1 circumstance bonus to the Intimidation
  check.'
mechanicsScope: mixed
foundryID: SPyvwsiSghySIEw2
rules:
- key: intimidation-circumstance-bonus-demoralize-s-level
  effect: core/add-modifier@2
  inputs:
    target: intimidation
    amount: 1
    type: circumstance
    when: Demoralize; the target's level at most your level
- key: saving-throws-fear-success-note
  effect: core/add-note
  inputs:
    target: saving-throws
    text: When you roll a success on a saving throw, the result is one degree better.
      When you roll a failure on a saving throw, the result is one degree worse.
    when: the effect has the fear trait
