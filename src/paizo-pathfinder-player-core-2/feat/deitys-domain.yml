---
name: deity's domain
level: 1
rarity: common
type: class
traits:
- champion
description: You embody an aspect of your deity. Choose one of your deity's domains.
  You gain the domain's initial domain spell as a devotion spell.
mechanicsScope: builder
foundryID: FXKIALDXAzEBfj5A
rules:
- key: choice-deity-domains
  choice:
    name: $.deity.domains
    label: Deity's domains
    multiple: {min: 1, max: 4}
    type: core/domain-id
    records: {filter: {type: domain}}
- key: choice-champion-domains
  choice:
    name: $.champion.domains
    label: Domain
    type: core/domain-id
    records: {filter: {type: domain}, from: $.deity.domains}
- key: configure-source-1
  effect: spellcasting/configure-source
  inputs:
    source: champion-focus-spells
    sourceName: Champion Focus Spells
    castingKind: focus
    tradition: divine
    attribute: cha
- key: domain-spell
  effect: spellcasting/grant-domain-spell
  inputs:
    source: champion-focus-spells
    domain: {choice: $.champion.domains}
    advanced: false
