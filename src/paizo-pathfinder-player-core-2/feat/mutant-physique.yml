description: "Basic mutagens that affect your physical form can bring out the beast
  within you, turn you nigh invincible, or make your body more elastic. While you're
  affected by one of the listed mutagens, you get an additional benefit.\n\t•\t[Bestial
  Mutagen](omen://item/bestial-mutagen-lesser?source=paizo-pathfinder-player-core-2)
  You gain the mutagen's item bonus to your Intimidation checks. In addition, you
  increase the damage die size of your claws and jaws by one step, and they gain the
  deadly d10 trait.\n\t•\t[Juggernaut Mutagen](omen://item/juggernaut-mutagen-lesser?source=paizo-pathfinder-player-core-2)
  You gain resistance to all physical damage equal to half your level.\n\t•\t[Quicksilver
  Mutagen](omen://item/quicksilver-mutagen-lesser?source=paizo-pathfinder-player-core-2)
  You can stretch your legs and Step up to 10 feet, and you can squish and compress
  your body, allowing you to make it through tight spaces as if you were one size
  smaller, in addition to any effect from Squeezing."
specialText: If you can be under the effects of multiple mutagens \(with the [mutagenist
