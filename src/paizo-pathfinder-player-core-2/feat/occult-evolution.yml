---
name: occult evolution
level: 4
rarity: common
type: class
traits:
- occult
- sorcerer
prerequisites:
- text: bloodline the grants occult spells
  anyOf:
  - hasChoice:
      name: $.sorcerer.bloodline
      equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-aberrant'}
  - allOf:
    - hasChoice:
        name: $.sorcerer.bloodline
        equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-draconic'}
    - hasChoice:
        name: $.sorcerer.bloodline.draconic
        equals: {type: core/string, value: occult}
  - hasChoice:
      name: $.sorcerer.bloodline
      equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-hag'}
description: Glimpses of the obscure secrets of the universe loan you power. You become
  trained in one skill of your choice. Additionally, once per day, you can spend 1
  minute to choose one mental occult spell you don't know and add it to your spell
  repertoire. You lose this temporary spell the next time you make your daily preparations
  \(though you can use this ability to add it again later\).
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: The mental occult spell it adds to your repertoire once a day is
  in its text.
foundryID: lL2fQJ2oRyBgga8Q
rules:
- key: choice-feats-occult-evolution-skill
  choice:
    name: $.feats.occult-evolution.skill
    label: Skill
    type: core/skill
    cases:
    - {key: acrobatics, value: acrobatics}
    - {key: arcana, value: arcana}
    - {key: athletics, value: athletics}
    - {key: crafting, value: crafting}
    - {key: deception, value: deception}
    - {key: diplomacy, value: diplomacy}
    - {key: intimidation, value: intimidation}
    - {key: medicine, value: medicine}
    - {key: nature, value: nature}
    - {key: occultism, value: occultism}
    - {key: performance, value: performance}
    - {key: religion, value: religion}
    - {key: society, value: society}
    - {key: stealth, value: stealth}
    - {key: survival, value: survival}
    - {key: thievery, value: thievery}
- key: skill-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: {choice: $.feats.occult-evolution.skill}
    rank: trained
