description: 'You have learned special tricks that help you follow individuals without
  them noticing you.

  When you attempt a Stealth check to [Avoid Notice](omen://action/avoid-notice?source=paizo-pathfinder-player-core)
  while following a specific target, the target takes a -2 circumstance penalty to
  their Perception DC. If you have master proficiency in Stealth, the penalty is -3
  or -4 if you''re legendary.

  If you start an encounter with the target while shadowing them, the target takes
  this penalty to their initiative roll and to their Perception DC to determine if
  they notice you, as normal for [Sneak](omen://action/sneak?source=paizo-pathfinder-player-core).'
