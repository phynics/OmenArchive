name: expanded splash
level: 10
rarity: common
type: class
traits:
- alchemist
description: You can throw bombs at just the right trajectory to create especially
  large and powerful explosions. When you throw an alchemical bomb and that bomb has
  the splash trait, you can have the splash damage affect all creatures within 10
  feet of the target instead of 5 feet. If you do, you gain a status bonus to the
  bomb's splash damage equal to your Intelligence modifier. If you have the bomber
  5th-level field discovery, this additional damage applies even if you caused your
  bomb to deal splash damage equal to your Intelligence modifier instead of the normal
  amount, allowing your bombs to deal splash damage equal to double your Intelligence
  modifier.
