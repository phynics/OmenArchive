rules:
- key: annotation-1
  effect: core/add-modifier
  inputs:
    target: saving-throws
    amount: 2
    type: circumstance
    when: the effect has the disease trait
- key: annotation-2
  effect: core/add-note
  inputs:
    target: saving-throws
    text: When you roll a success on a saving throw, the result is one degree better.
    when: the effect has the disease trait
