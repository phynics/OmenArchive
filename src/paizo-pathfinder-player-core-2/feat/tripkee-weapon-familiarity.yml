description: 'You gain access to all uncommon weapons with the tripkee trait. You
  have familiarity with weapons with the tripkee trait plus the blowgun, dart, hatchet,
  scythe, and shortbow—for the purpose of proficiency, you treat any of these that
  are martial weapons as simple weapons and any that are advanced weapons as martial
  weapons.

  At 5th level, whenever you get a critical hit with one of these weapons, you get
  its critical specialization effect.'
