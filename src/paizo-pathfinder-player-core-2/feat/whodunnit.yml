  the GM can answer \"immaterial.\" You can't use Whodunnit? more than once for the
  same lead, even across different days. Your questions must come from the following
  list, applying to the detail that spurred your investigation.\n\t•\tWas this clue
  left by a \\[creature trait\\]? \\(Choose a creature trait such as humanoid, undead,
  or dwarf; this trait must be accurate as of the time the clue was left.\\)\n\t•\tWas
  this clue left within the last hour?\n\t•\tWas this clue left within the last day?\n\t•\tWas
  the creature that left this clue in a heightened emotional state when it left the
  clue?\n\t•\tDid anyone attempt to conceal this clue?"
