description: 'You were raised by your vampiric parent, or you''ve invested substantial
  time and energy researching the secrets of your undead progenitors. You''re trained
  in Religion and Society. If you would automatically become trained in one of those
  skills \(from your background or class, for example\), you instead become trained
  in a skill of your choice.

  You also gain the [Additional Lore](omen://feat/additional-lore?source=paizo-pathfinder-player-core)
  general feat for Vampire Lore.'
