---
name: catfolk lore
level: 1
rarity: common
type: ancestry
traits:
- catfolk
description: 'Growing up among catfolk has taught you the traditional values of freedom,
  stewardship, and quick reactions to trouble. You gain the trained proficiency rank
  in Acrobatics and Survival. If you would automatically become trained in one of
  those skills \(from your background or class, for example\), you instead become
  trained in a skill of your choice.

  You also gain the [Additional Lore](omen://feat/additional-lore?source=paizo-pathfinder-player-core)
  general feat for Catfolk Lore.'
mechanicsScope: builder
foundryID: eqBWab1J5Be24YAl
rules:
- key: acrobatics-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: acrobatics
    rank: trained
- key: survival-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: survival
    rank: trained
- key: trained
  effect: core/add-skill-increase@2
  inputs:
    skill: {lore: catfolk}
    rank: trained
- key: active-effect-like-3-2
  effect: core/add-skill-increase@2
  level: 3
  inputs:
    skill: {lore: catfolk}
    rank: expert
- key: active-effect-like-3-3
