description: 'You have combined two stances into a single stance all your own. When
  you take this feat, choose two stances you know and combine them into a single fused
  stance. Give your new fused stance a unique name. When you enter your fused stance,
  you gain all the effects of both stances, including the requirements and restrictions.

  If the stances both grant special attacks, you gain all those attacks. If a stance
  restricts you to one particular attack \(such as Crane Stance\), you must abide
  by that restriction. If the fused stances have incompatible restrictions, the GM
  determines which apply, or determines you can''t fuse those stances at all.'
