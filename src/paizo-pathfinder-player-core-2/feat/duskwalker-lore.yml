- duskwalker
description: 'You either found another duskwalker who taught you the secrets of your
  kind, or you managed to research your unusual heritage. You gain the trained proficiency
  rank in Medicine and Religion. If you would automatically become trained in one
  of those skills \(from your background or class, for example\), you instead become
  trained in a skill of your choice.

  You also gain the [Additional Lore](omen://feat/additional-lore?source=paizo-pathfinder-player-core)
  general feat for Boneyard Lore.'
