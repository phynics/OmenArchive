description: If you die while under the effect of at least one elixir, the alchemical
  compounds in your bloodstream bring you back to life at the start of your next turn.
  You're affected by an Elixir of Rejuvenation, then a true elixir of life, then your
  choice of a major bestial mutagen, major juggernaut mutagen, or major quicksilver
  mutagen as though you just imbibed it. These automatic reactions don't get any special
  benefits you add when creating or using these items. Because you died, all other
  alchemical compounds in your bloodstream are inert. After being revived, you're
  temporarily immune to Alchemical Rejuvenation for 1d4 hours.
