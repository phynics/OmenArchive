---
name: lab rat
level: 5
rarity: common
type: ancestry
traits:
- ratfolk
description: You've spent more than your share of time in an alchemy lab. You have
  been exposed to a wide variety of alchemical poisons and harmful substances, leaving
  you with an increased tolerance of their effects. You have a +1 circumstance bonus
  to saves against poisons and diseases. If you roll a success on your saving throw
  against a poison or disease, you get a critical success instead.
mechanicsScope: mixed
foundryID: QE8asCPqyrdenll0
rules:
- key: saving-throws-circumstance-bonus-disease-or-poison
  effect: core/add-modifier@2
  inputs:
    target: saving-throws
    amount: 1
    type: circumstance
    when: the effect has the disease trait or the effect has the poison trait
- key: saving-throws-disease-or-poison-success-note
  effect: core/add-note
  inputs:
    target: saving-throws
    text: When you roll a success on a saving throw, the result is one degree better.
    when: the effect has the disease trait or the effect has the poison trait
