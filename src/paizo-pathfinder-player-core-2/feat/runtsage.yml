---
name: runtsage
level: 5
rarity: common
type: ancestry
traits:
- hobgoblin
description: Unlike most of your kind, who dismiss goblins as embarrassments or expendable
  annoyances, you have studied the methodology behind their irresponsible and incomprehensible
  actions. You gain the [Adopted Ancestry](omen://feat/adopted-ancestry?source=paizo-pathfinder-player-core)
  general feat and must select goblin as the feat's chosen ancestry. You also gain
  one 1st-level goblin ancestry feat.
mechanicsScope: builder
foundryID: qUZnrueC2a0zf95N
rules:
- key: adopted-ancestry-goblin-feat
  effect: core/add-feat@3
  inputs:
    feat: '@feat.adopted-ancestry?source=paizo-pathfinder-player-core'
    with:
      $.feats.adopted-ancestry.ancestry: {type: core/string, value: goblin}
- key: choice-feats-runtsage-feat
  choice:
    name: $.feats.runtsage.feat
    label: Ancestry Feat
    type: core/feat-id
    records:
      filter:
        all:
        - {type: feat}
        - {level: 1}
        - {trait: systemTrait-ancestry}
        - {trait: ancestryTrait-goblin}
- key: chosen-feat
  effect: core/add-feat@3
  inputs:
    feat: {choice: $.feats.runtsage.feat}
