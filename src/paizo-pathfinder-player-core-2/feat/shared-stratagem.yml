description: The plans you make include your allies as well as yourself. When you
  hit a creature with an attack on which you substituted your attack roll due to [Devising
  a Stratagem](omen://action/devise-a-stratagem?source=paizo-pathfinder-player-core-2),
  designate one ally. The creature you hit is [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core)
  to that ally on the next attack that ally makes against that creature before the
  start of your next turn.
