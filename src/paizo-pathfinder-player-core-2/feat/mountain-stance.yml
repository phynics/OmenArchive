description: 'You enter the stance of an implacable mountain—a technique created by
  dwarven monks—allowing you to strike with the weight of an avalanche and block blows
  with your garments. The only Strikes you can make are falling stone unarmed attacks.
  These deal 1d8 bludgeoning damage; are in the brawling group; and have the forceful,
  nonlethal, and unarmed traits.

  While in Mountain Stance, you gain a +4 item bonus to AC and a +2 circumstance bonus
  to any defenses against [Reposition](omen://action/reposition?source=paizo-pathfinder-player-core),
  [Shove](omen://action/shove?source=paizo-pathfinder-player-core), [Trip](omen://action/trip?source=paizo-pathfinder-player-core),
  and other forced movement effects. You have a Dexterity modifier cap to your AC
  of +0, meaning you don''t add your Dexterity to your AC, and your Speeds are all
  reduced by 5 feet. The item bonus to AC from Mountain Stance is cumulative with
  armor potency runes on your explorer''s clothing, mystic armor, and bands of force.'
