---
name: advanced bloodline
level: 6
rarity: common
type: class
traits:
- sorcerer
prerequisites:
- text: bloodline spell
  anyOf:
  - hasChoice:
      name: $.sorcerer.bloodline
      equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-aberrant'}
  - hasChoice:
      name: $.sorcerer.bloodline
      equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-angelic'}
  - hasChoice:
      name: $.sorcerer.bloodline
      equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-demonic'}
  - hasChoice:
      name: $.sorcerer.bloodline
      equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-diabolic'}
  - allOf:
    - hasChoice:
        name: $.sorcerer.bloodline
        equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-draconic'}
    - hasChoice:
        name: $.sorcerer.bloodline.draconic
        isSet: true
  - allOf:
    - hasChoice:
        name: $.sorcerer.bloodline
        equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-elemental'}
    - hasChoice:
        name: $.sorcerer.bloodline.elemental
        isSet: true
  - hasChoice:
      name: $.sorcerer.bloodline
      equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-fey'}
  - hasChoice:
      name: $.sorcerer.bloodline
      equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-hag'}
  - hasChoice:
      name: $.sorcerer.bloodline
      equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-imperial'}
  - hasChoice:
      name: $.sorcerer.bloodline
      equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-undead'}
description: You draw more power from your bloodline. You gain the advanced bloodline
  spell associated with your bloodline.
mechanicsScope: builder
foundryID: eZrftEihfuJBldG5
