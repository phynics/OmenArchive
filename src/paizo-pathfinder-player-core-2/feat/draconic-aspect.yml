---
name: draconic aspect
level: 1
rarity: common
type: ancestry
traits:
- dragonblood
description: "You have an obvious draconic feature, such as sharp claws, a snout full
  of sharp teeth, or strong reptilian tail, that you can use offensively. You gain
  your choice of one of the following unarmed attacks. The attack is in the brawling
  group and has the listed damage die and traits.\n\t•\tClaw 1d4 slashing \\(agile,
  finesse, unarmed\\)\n\t•\tJaws 1d6 piercing \\(forceful, unarmed\\)\n\t•\tTail 1d6
  bludgeoning \\(sweep, trip, unarmed\\)"
specialText: You can select this feat only at 1st level, and you can't retrain into
  or out of this feat, nor can you change the type of attack you gained.
mechanicsScope: builder
foundryID: U38YThMudfDihnj1
rules:
- key: choice-feats-draconic-aspect-unarmed-attack
  choice:
    name: $.feats.draconic-aspect.unarmed-attack
    label: Unarmed Attack
    type: core/string
    cases:
    - key: claw
      value: claw
      effects:
      - key: unarmed-attack-claw
        effect: core/add-to-list
        inputs:
          list: $.strikes.unarmed
          value:
            entry:
              damageDice: {type: core/string, value: 1d4}
              damageType: {type: core/damage-type, value: slashing}
              group: {type: core/weapon-group, value: brawling}
              name: {type: core/string, value: claw}
              traits: {type: core/trait-list, value: [agile, finesse, unarmed]}
    - key: jaws
      value: jaws
      effects:
      - key: unarmed-attack-jaws
        effect: core/add-to-list
        inputs:
          list: $.strikes.unarmed
          value:
            entry:
              damageDice: {type: core/string, value: 1d6}
              damageType: {type: core/damage-type, value: piercing}
              group: {type: core/weapon-group, value: brawling}
              name: {type: core/string, value: jaws}
              traits: {type: core/trait-list, value: [forceful, unarmed]}
    - key: tail
      value: tail
      effects:
      - key: unarmed-attack-tail
        effect: core/add-to-list
        inputs:
          list: $.strikes.unarmed
          value:
            entry:
              damageDice: {type: core/string, value: 1d6}
              damageType: {type: core/damage-type, value: bludgeoning}
              group: {type: core/weapon-group, value: brawling}
              name: {type: core/string, value: tail}
              traits: {type: core/trait-list, value: [sweep, trip, unarmed]}
