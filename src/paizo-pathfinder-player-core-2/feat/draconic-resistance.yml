description: 'Draconic magic safeguards you against harm. You gain resistance equal
  to half your level (minimum 1) to the damage type associated with your draconic
  exemplar. Double this resistance against damage of that type dealt to you by dragons.

  If your draconic exemplar is associated with bludgeoning, piercing, or slashing
  damage, instead of gaining resistance to that type you can choose acid, cold, fire,
  electricity, or sonic.'
