---
name: draconic resistance
level: 1
rarity: common
type: ancestry
traits:
- dragonblood
description: 'Draconic magic safeguards you against harm. You gain resistance equal
  to half your level \(minimum 1\) to the damage type associated with your draconic
  exemplar. Double this resistance against damage of that type dealt to you by dragons.

  If your draconic exemplar is associated with bludgeoning, piercing, or slashing
  damage, instead of gaining resistance to that type you can choose acid, cold, fire,
  electricity, or sonic.'
mechanicsScope: mixed
unsupportedCategory: choice
unsupportedReason: 'Its resistance to your draconic exemplar''s own damage type needs
  Dragonblood''s exemplar, which is not offered yet: answer its choice only for an
  exemplar of bludgeoning, piercing or slashing damage.'
foundryID: mI6dFvu28r66SfY0
rules:
- key: choice-feats-draconic-resistance-damage-type
  choice:
    name: $.feats.draconic-resistance.damage-type
    label: Damage Type (for an exemplar of bludgeoning, piercing or slashing damage)
    optional: true
    type: core/string
    cases:
    - key: acid
      value: acid
      effects:
      - key: acid-resistance
        effect: core/add-resistance@3
        inputs:
          type: acid
          value: (max 1 (floor (divide $.level 2)))
      - key: acid-resistance-against-dragons
        effect: core/add-resistance@3
        inputs:
          type: acid
          value: (multiply 2 (max 1 (floor (divide $.level 2))))
          when: against damage dealt by dragons
    - key: cold
      value: cold
      effects:
      - key: cold-resistance
