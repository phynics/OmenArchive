  everything, or 75 feet per minute to check everything before you walk into an area.
  If you do and the GM rolls your secret check to [Seek](omen://action/seek?source=paizo-pathfinder-player-core)
  to notice something, you gain a +2 circumstance bonus to that Perception check and
  if you succeed, you get a critical success instead.
