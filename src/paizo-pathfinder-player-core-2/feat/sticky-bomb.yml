description: You can mix in a sticky additive to an alchemical bomb to make its contents
  adhere and continue to deal damage. A creature hit by a sticky bomb also takes persistent
  damage equal to and of the same type as the bomb's splash damage. Use the splash
  damage amount listed in the bomb's stat block, even if you used an ability to change
  the splash damage dealt. If the bomb already deals persistent damage, combine the
  two amounts.
