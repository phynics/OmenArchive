---
name: kobold lore
level: 1
rarity: common
type: ancestry
traits:
- kobold
description: 'You attentively learned key kobold survival strategies from your elders.
  You gain the trained proficiency rank in Stealth and Thievery. If you would automatically
  become trained in one of those skills \(from your background or class, for example\),
  you instead become trained in a skill of your choice.

  You also gain the [Additional Lore](omen://feat/additional-lore?source=paizo-pathfinder-player-core)
  general feat for Kobold Lore.'
mechanicsScope: builder
foundryID: IElFaS5i10MFYIvq
rules:
- key: stealth-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: stealth
    rank: trained
- key: thievery-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: thievery
    rank: trained
- key: trained
  effect: core/add-skill-increase@2
  inputs:
    skill: {lore: kobold}
    rank: trained
- key: active-effect-like-3-2
  effect: core/add-skill-increase@2
  level: 3
  inputs:
    skill: {lore: kobold}
    rank: expert
- key: active-effect-like-3-3
  effect: core/add-skill-increase@2
  level: 7
  inputs:
    skill: {lore: kobold}
    rank: master
- key: active-effect-like-3-4
  effect: core/add-skill-increase@2
  level: 15
  inputs:
    skill: {lore: kobold}
    rank: legendary
- key: additional-lore-kobold-feat
  effect: core/add-feat@3
  inputs:
