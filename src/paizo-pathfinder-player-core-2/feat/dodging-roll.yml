---
name: dodging roll
level: 12
rarity: common
type: class
traits:
- monk
prerequisites:
- text: master in Acrobatics
  hasSkillProficiency: {skill: acrobatics, rank: master}
action:
  count: reaction
  trigger: You take damage from an area effect that allows a Reflex save.
description: 'You dodge a blow at the last possible moment.

  You Step and gain resistance to all damage equal to your level against the triggering
  effect. If your Step moves you out of the triggering effect''s area, this resistance
  is instead equal to your level plus your Dexterity modifier.'
mechanicsScope: builder
foundryID: nBWoZ311FXFJC8Zl
rules:
- key: resistance-all-damage
  effect: core/add-resistance@3
  inputs:
    type: all-damage
    value: $.level
    when: 'Dodging Roll: in'
- key: resistance-all-damage-2
  effect: core/add-resistance@3
  inputs:
    type: all-damage
    value: (add $.level $.attributes.dex)
    when: 'Dodging Roll: out'
