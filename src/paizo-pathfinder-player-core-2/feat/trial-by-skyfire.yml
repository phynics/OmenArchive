name: trial by skyfire
level: 10
rarity: common
type: class
traits:
- cursebound
- divine
- fire
- oracle
prerequisites:
- text: cosmos or flames mystery
  anyOf:
  - hasChoice:
      name: $.oracle.mystery
      equals: {type: core/feature-id, value: '@class.oracle.mysteries.cosmos'}
  - hasChoice:
      name: $.oracle.mystery
      equals: {type: core/feature-id, value: '@class.oracle.mysteries.flames'}
action:
  count: one_action
description: Your lips murmur as you portend a great disaster, one you hope you survive.
  A rain of blazing bolts begins to fall from the heavens in a emanation, centered
  on you, that deals 2d6 fire damage to all creatures in the emanation at the end
  of each of your turns \(basic Reflex save\); you can't exclude yourself from the
  emanation. The skyfire persists for 1 minute; while you can't Dismiss it, you can
  suppress the effect for 1 round with a Sustain action. The rain of fire is suppressed
  if you fall [Unconscious](omen://condition/unconscious?source=paizo-pathfinder-player-core).
  If you become [Cursebound 3](omen://condition/cursebound?source=paizo-pathfinder-player-core-2)
  or 4 at any point during Trial by Skyfire's duration, the emanation increases to
  15 feet and the damage increases to 4d6 fire.
