---
name: arcane evolution
level: 4
rarity: common
type: class
traits:
- arcane
- sorcerer
prerequisites:
- text: bloodline that grants arcane spells
  anyOf:
  - allOf:
    - hasChoice:
        name: $.sorcerer.bloodline
        equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-draconic'}
    - hasChoice:
        name: $.sorcerer.bloodline.draconic
        equals: {type: core/string, value: arcane}
  - hasChoice:
      name: $.sorcerer.bloodline
      equals: {type: core/feature-id, value: '@class.sorcerer.bloodlines.bloodline-imperial'}
description: 'Your arcane legacy allows you to perceive how magic affects everything.
  You become trained in one skill of your choice.

  Additionally, you can use arcane arts to tinker with your selection of spells. During
  your daily preparations, you can choose one spell in your spell repertoire to be
  a signature spell that day.

  You can use the [Learn a Spell](omen://action/learn-a-spell?source=paizo-pathfinder-player-core)
  activity to add more arcane spells to the list you choose from, but if you prepare
  a spell that isn''t in your repertoire, you temporarily add it to your repertoire
  at the spell rank of your choice instead of making it a signature spell.'
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: Its daily signature spell, and the arcane spells Learn a Spell
  adds to the list you choose it from, are in its text.
foundryID: qxh4evekG28Gt1vj
rules:
- key: choice-feats-arcane-evolution-skill
  choice:
    name: $.feats.arcane-evolution.skill
    label: Skill
    type: core/skill
    cases:
    - {key: acrobatics, value: acrobatics}
    - {key: arcana, value: arcana}
    - {key: athletics, value: athletics}
    - {key: crafting, value: crafting}
    - {key: deception, value: deception}
    - {key: diplomacy, value: diplomacy}
    - {key: intimidation, value: intimidation}
    - {key: medicine, value: medicine}
    - {key: nature, value: nature}
    - {key: occultism, value: occultism}
    - {key: performance, value: performance}
    - {key: religion, value: religion}
    - {key: society, value: society}
    - {key: stealth, value: stealth}
    - {key: survival, value: survival}
    - {key: thievery, value: thievery}
- key: skill-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: {choice: $.feats.arcane-evolution.skill}
    rank: trained
