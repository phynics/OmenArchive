description: 'Your arcane legacy allows you to perceive how magic affects everything.
  You become trained in one skill of your choice.

  Additionally, you can use arcane arts to tinker with your selection of spells. During
  your daily preparations, you can choose one spell in your spell repertoire to be
  a signature spell that day.

  You can use the [Learn a Spell](omen://action/learn-a-spell?source=paizo-pathfinder-player-core)
  activity to add more arcane spells to the list you choose from, but if you prepare
  a spell that isn''t in your repertoire, you temporarily add it to your repertoire
  at the spell rank of your choice instead of making it a signature spell.'
