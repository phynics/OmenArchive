description: 'You lash out confusingly with what seems to be a weak move but instead
  allows you to unleash a dangerous flurry of blows upon your unsuspecting foe.

  When you use Flurry of Blows, you can attempt a check to [Feint](omen://action/feint?source=paizo-pathfinder-player-core)
  as a free action just before the first Strike.

  On a success, instead of making the target [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core)
  against your next attack, they become off-guard against both attacks from the Flurry
  of Blows.'
