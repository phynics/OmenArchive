description: "Your touch soothes the body or mind. You can cast lay on hands targeting
  a living creature using 2 actions instead of 1. If you do, you can attempt to counteract
  one condition of your choice affecting the target. When you select this feat, choose
  one of the following options, which determines the conditions you can choose:\n\t•\tMercy
  of the Body Blinded, Dazzled, Deafened, Enfeebled, Sickened;\n\t•\tMercy of Grace
  Clumsy, Grabbed, Paralyzed;\n\t•\tMercy of the Mind Fleeing, Frightened, Stupefied."
specialText: You can select this feat up to three times. Each time, choose a different
