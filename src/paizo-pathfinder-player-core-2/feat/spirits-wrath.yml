name: spirit's wrath
level: 12
rarity: common
type: class
traits:
- attack
- barbarian
- concentrate
- rage
prerequisites:
- text: spirit instinct
  hasChoice:
    name: $.barbarian.instinct
    equals: {type: core/feature-id, value: '@class.barbarian.instincts.spirit-instinct'}
action:
  count: one_action
description: You call forth an ephemeral spirit, typically the apparition of an ancestor
  or a nature spirit, which takes the form of a wisp. The wisp makes a melee wisp
  rush unarmed attack against an enemy within 120 feet of you. The wisp's attack modifier
  is equal to your proficiency bonus for martial weapons plus your Strength modifier
  plus a +2 item bonus, and it applies the same circumstance and status bonuses and
  penalties that you have. On a hit, the wisp deals spirit damage equal to 4d8 plus
  your Constitution modifier. Don't apply your Rage damage or your weapon specialization
  damage, but circumstance and status bonuses and penalties that would also affect
  the wisp's damage apply. On a critical hit, the wisp deals double damage and the
  target becomes Frightened 1. This attack uses and counts toward your multiple attack
  penalty as if you were the one attacking.
mechanicsScope: mixed
