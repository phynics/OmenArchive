description: 'You can mix an aromatic salve into an elixir with the healing trait
  to soothe physical maladies. In addition to its normal effects, the elixir can be
  imbibed by a creature prevented from doing so (such as a Sickened creature).

  In addition to its other effects, the elixir attempts to counteract an effect imposing
  one of the following conditions of the imbiber''s choice: Clumsy, Enfeebled, Sickened,
  or Stupefied. Use half your level rounded up for the counteract rank and your class
  DC – 10 for the counteract modifier. The imbiber is then temporarily immune to the
  effects of this additive for 10 minutes. The additive can''t counteract curses,
  diseases, or conditions that are part of the creature''s normal state.'
