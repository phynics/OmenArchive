description: 'Your magic explodes. You know the following blood magic effect.

  Blood Magic—Explosion of Power Raw power explodes outward from you. Each creature
  within a emanation takes 1d6 damage per rank of the spell you just cast \(basic
  Reflex save\). The type of damage depends on the tradition of your bloodline. If
  you cast arcane spells, you deal force damage. If you cast divine spells, you deal
  spirit damage. If you cast occult spells, you deal mental damage. If you cast primal
  spells, you deal fire damage.'
