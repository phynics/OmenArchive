---
name: affliction resistance
level: 5
rarity: common
type: ancestry
traits:
- kholo
description: Your diet has strengthened you against diseases and poisons. You gain
  a +1 circumstance bonus to saving throws against diseases and poisons. If you roll
  a success on a saving throw against a disease or poison, you get a critical success
  instead. If you have a different ability that would improve the save in this way
  \(such as the [Battle Hardened](omen://class/fighter/features/battle-hardened?source=paizo-pathfinder-player-core)
  fighter class feature\), if you roll a critical failure on the save you get a failure
  instead.
mechanicsScope: mixed
foundryID: 5oazhjGmSwfPTlh3
rules:
- key: annotation-1
  effect: core/add-note
  inputs:
    target: saving-throws
    text: When you roll a success on a saving throw, the result is one degree better.
    when: the effect has the disease trait or the effect has the poison trait
- key: annotation-2
  effect: core/add-modifier
  inputs:
    target: saving-throws
    amount: 1
    type: circumstance
    when: the effect has the disease trait or the effect has the poison trait
