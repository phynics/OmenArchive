---
name: master qi spells
level: 16
rarity: common
type: class
traits:
- monk
prerequisites:
- text: Qi Spells
  hasResourceWithName: qi spells
repeatPolicy:
  duplicateSelectionRules:
  - lookupName: $.feat.master-qi-spells.spell
    valueTypeID: me.atkn.omen.pf2e.playercore-spellcasting/value/spell-id
description: You have achieved near-total mastery of your qi. You gain [Medusa's Wrath](omen://spell/medusas-wrath?source=paizo-pathfinder-player-core-2),
  [Touch of Death](omen://spell/touch-of-death?source=paizo-pathfinder-player-core-2),
  or another 8th-rank qi spell you have access to.
specialText: You can select this feat more than once, choosing a different spell each
  time.
mechanicsScope: builder
foundryID: DAFF7zJphhDPcAws
rules:
- key: choice-qi-tradition
  choice:
    name: $.qi.tradition
    label: Qi tradition
    type: spellcasting/tradition
    cases: [divine, occult]
- key: qi-focus-source
  effect: spellcasting/configure-source
  inputs:
    source: monk-focus-spells
    sourceName: Monk Focus Spells
    castingKind: focus
    tradition: {choice: $.qi.tradition}
    attribute: wisdom
- key: qi-spell-proficiency
  effect: spellcasting/increase-spell-proficiency@2
  inputs:
    rank: trained
- key: choice-feat-master-qi-spells-spell
  choice:
    name: $.feat.master-qi-spells.spell
    label: Qi spell
    type: spellcasting/spell-id
    records:
      filter:
        all:
        - {type: spell}
        - {spell.category: focus}
        - {trait: classTrait-monk}
        - {level: 8}
- key: grant-qi-spell
  effect: spellcasting/grant-focus-spell@2
  inputs:
    source: monk-focus-spells
    spell: {choice: $.feat.master-qi-spells.spell}
