---
name: scars of steel
level: 4
rarity: common
type: class
traits:
- barbarian
- rage
prerequisites:
- text: Fury Instinct
  hasChoice:
    name: $.barbarian.instinct
    equals: {type: core/feature-id, value: '@class.barbarian.instincts.fury-instinct'}
action:
  count: reaction
  frequency: once per day
  trigger: An opponent critically hits you with an attack that deals physical damage.
description: When you are struck with the mightiest of blows, you can flex your muscles
  to turn aside some of the damage. You gain resistance to the triggering attack equal
  to your Constitution modifier plus half your level.
mechanicsScope: builder
foundryID: j8ycCi7ghTtpRjEW
rules:
- key: resistance-all-damage
  effect: core/add-resistance@3
  inputs:
    type: all-damage
    value: (add (floor (divide $.level 2)) $.attributes.con)
    when: Scars of Steel
