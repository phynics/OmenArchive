---
name: grandmaster qi spells
level: 18
rarity: common
type: class
traits:
- monk
prerequisites:
- text: Qi Spells
  hasResourceWithName: qi spells
repeatPolicy:
  duplicateSelectionRules:
  - lookupName: $.feat.grandmaster-qi-spells.spell
    valueTypeID: me.atkn.omen.pf2e.playercore-spellcasting/value/spell-id
  instanceLevelGates: []
  maxCount: null
description: You have unlocked a qi technique achievable only by those who attain
  complete mastery of both their body and their spirit. You gain Embrace Nothingness,
  Qi Form, or another 9th-rank qi spell you have access to.
specialText: You can select this feat more than once, choosing a different spell each
  time.
mechanicsScope: builder
foundryID: 6GUl9WG7OKvfVQo4
rules:
- key: choice-qi-tradition
  choice:
    name: $.qi.tradition
    label: Qi tradition
    type: spellcasting/tradition
    cases:
    - {value: divine}
    - {value: occult}
- key: qi-focus-source
  effect: spellcasting/configure-source
  inputs:
    sourceId: e2c36678-f83d-5341-8dfc-d600e0a18f71
    sourceName: Monk Focus Spells
    castingKind: focus
    tradition: {choice: $.qi.tradition}
    attribute: wis
- key: qi-spell-proficiency
  effect: spellcasting/increase-proficiency
  inputs:
    tradition: {choice: $.qi.tradition}
    proficiency: 2
- key: choice-feat-grandmaster-qi-spells-spell
  choice:
    name: $.feat.grandmaster-qi-spells.spell
    label: Qi spell
    records:
      filter:
        all:
        - {type: spell}
        - {spell.category: focus}
        - {trait: classTrait-monk}
        - {level: 9}
      type: spellcasting/spell-id
- key: grant-qi-spell
  effect: spellcasting/grant-focus-spell
  inputs:
    sourceId: e2c36678-f83d-5341-8dfc-d600e0a18f71
    spellId: {choice: $.feat.grandmaster-qi-spells.spell}
- key: qi-focus-point
  effect: spellcasting/add-focus-point
  prerequisites:
  - hasChoice:
      name: $.feat.grandmaster-qi-spells.spell
      isSet: true
