---
name: grandmaster qi spells
level: 18
rarity: common
type: class
traits:
- monk
prerequisites:
- text: Qi Spells
  has: '@feat.qi-spells'
repeatPolicy: {}
description: You have unlocked a qi technique achievable only by those who attain
  complete mastery of both their body and their spirit. You gain [Embrace Nothingness](omen://spell/embrace-nothingness),
  [Qi Form](omen://spell/qi-form), or another 9th-rank qi spell you have access to.
specialText: You can select this feat more than once, choosing a different spell each
  time.
mechanicsScope: builder
foundryID: 6GUl9WG7OKvfVQo4
rules:
- key: choice-qi-tradition
  choice:
    name: $.qi.tradition
    label: Qi tradition
    type: spellcasting/tradition
    cases: [divine, occult]
- key: qi-focus-source
  effect: spellcasting/configure-source
  inputs:
    source: monk-focus-spells
    sourceName: Monk Focus Spells
    castingKind: focus
    tradition: {choice: $.qi.tradition}
    attribute: wisdom
- key: qi-spell-proficiency
  effect: spellcasting/increase-spell-proficiency@2
  inputs:
    rank: trained
- key: choice-feats-grandmaster-qi-spells-spell
  choice:
    name: $.feats.grandmaster-qi-spells.spell
    label: Qi spell
    type: spellcasting/spell-id
    records:
      filter:
        all:
        - {type: spell}
        - {spell.category: focus}
        - {trait: classTrait-monk}
        - {level: 9}
- key: grant-qi-spell
  effect: spellcasting/grant-focus-spell@2
  inputs:
    source: monk-focus-spells
    spell: {choice: $.feats.grandmaster-qi-spells.spell}
