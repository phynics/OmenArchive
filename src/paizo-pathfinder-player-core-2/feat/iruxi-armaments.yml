---
name: iruxi armaments
level: 1
rarity: common
type: ancestry
traits:
- lizardfolk
repeatPolicy:
  maxCount: 3
description: "Your weapons are those you were born with. Choose one of the following
  options:\n\t•\tClaws Your claw attack deals 1d6 slashing damage instead of 1d4 and
  gains the versatile P trait.\n\t•\tFangs You gain a fangs unarmed attack that deals
  1d8 piercing damage and is in the brawling group.\n\t•\tTail You gain a tail unarmed
  attack that deals 1d6 bludgeoning damage, is in the brawling group, and has the
  sweep trait.\nAt 5th level, whenever you get a critical hit with one of the unarmed
  attacks you have gained or improved with this feat, you get its critical specialization
  effect."
specialText: You can take this feat multiple times, choosing a different unarmed attack
  option each time.
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: Its change to the character's Strikes is a note on their attack
  or damage rolls; the sheet's numbers don't include it.
foundryID: VatkAzfBYjA6z6OP
rules:
- key: unarmed-attack-list
  effect: core/declare-list
  inputs:
    list: $.feats.iruxi-armaments.unarmed-attacks
    valueType: core/string
    label: Unarmed Attack
- key: choice-feats-iruxi-armaments-unarmed-attack
  choice:
    name: $.feats.iruxi-armaments.unarmed-attack
    label: Unarmed Attack
    addTo: $.feats.iruxi-armaments.unarmed-attacks
    type: core/string
    cases:
    - {value: claw}
    - key: fangs
      value: fangs
      effects:
      - key: unarmed-attack-fangs
        effect: core/add-to-list
        inputs:
          list: $.strikes.unarmed
          value:
            entry:
              damageDice: {type: core/string, value: 1d8}
              damageType: {type: core/damage-type, value: piercing}
              group: {type: core/weapon-group, value: brawling}
              name: {type: core/string, value: fangs}
              traits: {type: core/trait-list, value: [unarmed]}
    - key: tail
      value: tail
      effects:
      - key: unarmed-attack-tail
        effect: core/add-to-list
        inputs:
          list: $.strikes.unarmed
          value:
            entry:
              damageDice: {type: core/string, value: 1d6}
              damageType: {type: core/damage-type, value: bludgeoning}
              group: {type: core/weapon-group, value: brawling}
              name: {type: core/string, value: tail}
              traits: {type: core/trait-list, value: [sweep, unarmed]}
- key: strike-note-1
  effect: core/add-note
  inputs:
    target: strike-damage
    text: 'Claws: your claw attack deals 1d6 slashing damage instead of 1d4 and gains
      the versatile P trait.'
- key: strike-note-2
  effect: core/add-note
  level: 5
  inputs:
    target: strike-damage
    text: Whenever you get a critical hit with one of the unarmed attacks you have
      gained or improved with Iruxi Armaments, you get its critical specialization
      effect.
