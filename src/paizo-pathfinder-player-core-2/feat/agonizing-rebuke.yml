description: When you terrorize your enemies, you also cause them painful mental distress.
  When you successfully Demoralize an enemy, that enemy takes ternary(gte(@actor.system.skills.intimidation.rank,4),3,ternary(gte(@actor.system.skills.intimidation.rank,3),2,1))d4[mental]
  damage at the start of each of its turns. This effect ends if the creature loses
  the frightened condition, if it is more than 30 feet away from you, or if 1 minute
  passes, whichever comes first. If you have master proficiency in Intimidation, the
  damage increases to 2d4, and if you have legendary proficiency, the damage increases
  to 3d4.
