---
name: qi spells
level: 1
rarity: common
type: class
traits:
- monk
repeatPolicy:
  duplicateSelectionRules:
  - lookupName: $.feats.qi-spells.spell
    valueTypeID: me.atkn.omen.pf2e.playercore-spellcasting/value/spell-id
description: You have cultivated your qi to produce magical effects. You gain [Inner
  Upheaval](omen://spell/inner-upheaval?source=paizo-pathfinder-player-core-2), [Qi
  Rush](omen://spell/qi-rush?source=paizo-pathfinder-player-core-2), or another 1st-rank
  monk qi spell you have access to.
specialText: You can select this feat more than once, choosing a different spell each
  time.
mechanicsScope: builder
foundryID: yA9tsWT9uzL2REnw
rules:
- key: choice-qi-tradition
  choice:
    name: $.qi.tradition
    label: Qi tradition
    type: spellcasting/tradition
    cases: [divine, occult]
- key: qi-focus-source
  effect: spellcasting/configure-source
  inputs:
    source: monk-focus-spells
    sourceName: Monk Focus Spells
    castingKind: focus
    tradition: {choice: $.qi.tradition}
    attribute: wisdom
- key: qi-spell-proficiency
  effect: spellcasting/increase-spell-proficiency@2
  inputs:
    rank: trained
- key: choice-feat-qi-spells-spell
  choice:
    name: $.feats.qi-spells.spell
    label: Qi spell
    type: spellcasting/spell-id
    records:
      filter:
        all:
        - {type: spell}
        - {spell.category: focus}
        - {trait: classTrait-monk}
        - {level: 1}
- key: grant-qi-spell
  effect: spellcasting/grant-focus-spell@2
  inputs:
    source: monk-focus-spells
    spell: {choice: $.feats.qi-spells.spell}
