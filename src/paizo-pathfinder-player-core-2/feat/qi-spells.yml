  - lookupName: $.feat.qi-spells.spell
    valueTypeID: me.atkn.omen.pf2e.playercore-spellcasting/value/spell-id
  instanceLevelGates: []
  maxCount: null
description: You have cultivated your qi to produce magical effects. You gain Inner
  Upheaval, Qi Rush, or another 1st-rank monk qi spell you have access to.
specialText: You can select this feat more than once, choosing a different spell each
  time.
mechanicsScope: builder
foundryID: yA9tsWT9uzL2REnw
rules:
- id: 0245c12b-e4da-5cd8-80ac-7b58a5a47f61
  key: choice-qi-tradition
  choice:
    name: $.qi.tradition
    label: Qi tradition
    type: spellcasting/tradition
    cases:
    - {value: divine}
    - {value: occult}
- id: c436edc9-bc0a-5ae2-b6a5-fb901ea906a2
  key: qi-focus-source
  effect: spellcasting/configure-source
  inputs:
    sourceId: e2c36678-f83d-5341-8dfc-d600e0a18f71
    sourceName: Monk Focus Spells
    castingKind: focus
    tradition: {choice: $.qi.tradition}
    attribute: wis
- id: fc34eaf2-98ee-5387-ae95-96c745539aab
  key: qi-spell-proficiency
  effect: spellcasting/increase-proficiency
  inputs:
    tradition: {choice: $.qi.tradition}
    proficiency: 2
- id: 3fb7ede0-47fc-5edd-afb4-d73d487a68d1
  key: choice-feat-qi-spells-spell
  choice:
    name: $.feat.qi-spells.spell
    label: Qi spell
    records:
      filter:
        all:
        - {type: spell}
        - {spell.category: focus}
        - {trait: classTrait-monk}
        - {level: 1}
      type: spellcasting/spell-id
- id: 580260d9-a1d5-53da-a296-42cbccb23578
  key: grant-qi-spell
  effect: spellcasting/grant-focus-spell
  inputs:
    sourceId: e2c36678-f83d-5341-8dfc-d600e0a18f71
    spellId: {choice: $.feat.qi-spells.spell}
- id: 63903ace-d05f-55a7-b63f-67c653d555f8
  key: qi-focus-point
  effect: spellcasting/add-focus-point
  prerequisites:
