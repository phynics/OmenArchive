  of or [Coerce](omen://action/coerce?source=paizo-pathfinder-player-core) members
  of your own faith, you can attempt a Religion check instead of Diplomacy or Intimidation,
  and you gain a +2 circumstance bonus to the check. On a critically failed attempt
  to make a Request, the target''s attitude toward you doesn''t worsen.'
