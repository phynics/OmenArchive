description: 'You lay a finger on the scales of life and death to heal a creature,
  regardless of whether it''s living or undead. You restore (2*(1+@actor.level))[healing]
  Hit Points to one creature within 30 feet.

  In addition, you can mediate during your daily preparations to place yourself on
  one side of the scales. Choose life or death. If you align yourself with life, you
  can be targeted and healed by vitality healing effects, as normal for most living
  creatures; if you align yourself with death, you gain the void healing ability,
  and can instead be targeted and healed by void effects and other effects that restore
  Hit Points to undead creatures..'
