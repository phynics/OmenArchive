---
name: tengu weapon familiarity
level: 1
rarity: common
type: ancestry
traits:
- tengu
description: 'You gain access to all uncommon weapons with the tengu trait plus the
  katana, khakkara, temple sword, and wakizashi. You have familiarity with these weapons—for
  the purpose of proficiency, you treat any of these that are martial weapons as simple
  weapons and any that are advanced weapons as martial weapons.

  During your daily preparations, you can practice with a weapon from the sword group
  that''s in your possession. You gain familiarity with that weapon as well. This
  lasts until you practice with a different sword in the same way.

  At 5th level, whenever you get a critical hit with one of these weapons, you get
  its critical specialization effect.'
mechanicsScope: mixed
unsupportedCategory: numbers
unsupportedReason: 'Proficiency in weapons with the tengu trait and a weapon the player
  chose is not applied: a weapon filter selects by category, group or name only. Critical
  specialization is not applied: the archive''s effect unlocks it for a whole weapon
  group, not for the weapons or trait this record names. Rule elements not applied:
  ActiveEffectLike.'
foundryID: AmFv3ClkAVRowHLI
