---
name: advanced deity's domain
level: 8
rarity: common
type: class
traits:
- champion
prerequisites:
- text: Deity's Domain
  hasResourceWithName: deity's domain
description: Through your conviction, you have glimpsed the deeper secrets of your
  deity's domain. You gain an advanced domain spell from the domain you chose with
  Deity's Domain as a devotion spell.
mechanicsScope: builder
foundryID: JHJBmiyILzWdFRJO
rules:
- key: choice-deity-domains
  choice:
    name: $.deity.domains
    label: Deity's domains
    multiple: {min: 1, max: 4}
    records: {filter: {type: domain}, type: core/domain-id}
- key: choice-champion-advanced-domains
  choice:
    name: $.champion.advanced-domains
    label: Advanced domain
    optionsFrom: $.champion.domains
    records: {filter: {type: domain}, type: core/domain-id}
- key: configure-source-1
  effect: spellcasting/configure-source
  inputs:
    sourceId: 119e72d7-bb0f-5f5d-ac24-abb1d40addea
    sourceName: Champion Focus Spells
    castingKind: focus
    tradition: divine
    attribute: cha
- key: advanced-domain-spell
  effect: spellcasting/grant-domain-spell
  inputs:
    sourceId: 119e72d7-bb0f-5f5d-ac24-abb1d40addea
    domain: {choice: $.champion.advanced-domains}
    advanced: true
