---
name: lie detector
level: 4
rarity: common
type: class
traits:
- investigator
prerequisites:
- text: empiricism or interrogation methodology
  anyOf:
  - hasChoice:
      name: $.investigator.methodology
      equals: {type: core/feature-id, value: '@class.investigator.methodologies.empiricism-methodology'}
  - hasChoice:
      name: $.investigator.methodology
      equals: {type: core/feature-id, value: '@class.investigator.methodologies.interrogation-methodology'}
description: 'You''re adept at noticing the tells of a liar—sweat, flushing, a quavering
  voice, a quickening pulse. You gain a +1 circumstance bonus to Perception checks
  to [Sense Motive](omen://action/sense-motive?source=paizo-pathfinder-player-core)
  and to Perception DCs against attempts to Lie to you. When you determine someone
  is lying to you, you can use their deceit to your advantage to gain a +1 circumstance
  bonus to the next Deception, Diplomacy, Intimidation, or Performance check you attempt
  against that creature within the next minute.

  If you would gain your Pursue a Lead investigation bonus to any of the above checks,
  that bonus increases by 1 instead of you gaining the +1 bonus listed.'
mechanicsScope: mixed
foundryID: I10dkdvL6kAnqZWA
rules:
- key: annotation-1
  effect: core/add-play-modifier
  inputs:
    source: Lie Detector
    slug: perception
    target:
      description:
      - savingThrow:
          '_0': perception
    amount: 1
    bonusType: circumstance
    mode: add
    condition: Sense Motive
- key: annotation-2
  effect: core/add-play-modifier
  inputs:
    source: Lie Detector
    slug: deception-diplomacy-intimidation-performance
    target:
      description:
      - skill:
          '_0':
            deception: {}
      - skill:
          '_0':
            diplomacy: {}
      - skill:
          '_0':
            intimidation: {}
      - skill:
          '_0':
            performance: {}
    amount: 1
    bonusType: circumstance
    mode: add
    condition: known liar
