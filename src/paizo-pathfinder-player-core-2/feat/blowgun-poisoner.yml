name: blowgun poisoner
level: 1
rarity: common
type: class
traits:
- alchemist
description: 'You can capably deliver toxins with a [Blowgun](omen://item/blowgun?source=paizo-pathfinder-player-core).
  Your blowgun [Strikes](omen://action/strike?source=paizo-pathfinder-player-core)
  can apply injury poisons even if they deal no damage due to a creature''s resistance.
  If you critically succeed at a blowgun Strike using a poisoned dart, the target''s
  initial save against the poison is one degree of success worse than the creature
  rolls; this is a misfortune effect.

  In addition, if you make a blowgun Strike while [Hidden](omen://condition/hidden?source=paizo-pathfinder-player-core)
  or [Undetected](omen://condition/undetected?source=paizo-pathfinder-player-core),
  you don''t automatically become [Observed](omen://condition/observed?source=paizo-pathfinder-player-core).
  Instead, immediately attempt a Stealth check against the Perception DC of the target.
  If you succeed, you don''t become observed, and are hidden \(if you were undetected,
  you still become hidden rather than remaining undetected\).'
