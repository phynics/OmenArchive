description: 'You defy gravity, traversing vertical planes as easily as the ground.
  Stride up to your Speed. You must start your movement on a horizontal surface.

  During this movement, you can run up vertical surfaces, like walls, at your full
  Speed. If you end the Stride off the ground, you fall after taking your next action
  or when your turn ends, whichever comes first \(though you can [Grab an Edge](omen://action/grab-an-edge?source=paizo-pathfinder-player-core),
  if applicable\).

  If you have [Water Step](omen://feat/water-step?source=paizo-pathfinder-player-core-2)
  or a similar ability, Wall Run lets you run along flimsy vertical surfaces, as well
  as vertical liquids, such as a waterfall.'
