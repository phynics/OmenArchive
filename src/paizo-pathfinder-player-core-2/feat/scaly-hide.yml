description: You were born with a layer of scales across your entire body that resemble
  those of your draconic progenitor. When you're unarmored, the scales give you a
  +1 item bonus to AC with a Dexterity cap of +3. The item bonus to AC increases to
  +2 at 5th level. The item bonus to AC from these scales is cumulative with armor
  potency runes on your explorer's clothing, the Mystic Armor spell, or Bands of Force.
