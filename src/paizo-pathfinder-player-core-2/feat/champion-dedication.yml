description: 'Choose a deity. You are bound by your deity''s anathema and gain the
  champion''s aura and sanctification as described in the champion class. Choose a
  cause as you would if you were a champion, with the same options a champion must
  abide by. You gain its edicts and anathema but don''t gain the other abilities.

  You become trained in Religion and your deity''s associated skill; for each of these
  skills in which you were already trained, you instead become trained in a skill
  of your choice. You become trained in champion class DC. If you later gain a devotion
  spell, you become trained in spell attack modifier and spell DC.

  You become trained in light armor and medium armor. If you already were trained
  in light armor and medium armor, you gain training in heavy armor as well. Whenever
  you gain a class feature that grants you expert or greater proficiency in any type
  of armor (but not unarmored defense), you also gain that proficiency in the armor
  types granted to you by this feat. If you have a class feature that grants you expert
  proficiency in unarmored defense and you''re 13th level or higher, you also become
  an expert in the armor types granted to you by this feat.

  Champion'
