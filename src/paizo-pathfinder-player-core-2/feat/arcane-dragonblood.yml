description: You descend from a dragon that wields mastery of their magical abilities,
  such as a fortune dragon or mirage dragon. As such, you can instinctively grasp
  the intricacies of magic. You gain the trained proficiency rank in Arcana. If you
  would automatically become trained in Arcana \(from your background or class, for
  example\), you instead become trained in a skill of your choice. You gain the [Arcane
  Sense](omen://feat/arcane-sense?source=paizo-pathfinder-player-core) skill feat.
  If you choose a draconic exemplar, you must choose an arcane dragon.
