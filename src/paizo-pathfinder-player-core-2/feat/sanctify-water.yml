description: You imbue water with your deity's blessing. Choose a container of water
  with light Bulk possessed by you or an ally within your reach. Until the end of
  your next turn, it becomes holy water or unholy water. You can choose holy water
  if your deity allows holy sanctification, unholy water if your deity allows unholy
  sanctification, or either if your deity allows both sanctifications. This is a temporary
  effect and doesn't impart monetary value or allow the water to be used for costs
  of rituals or the like. If you're a master in Religion, you can sanctify two containers
  when you take this action, and if you're legendary, you can sanctify three.
