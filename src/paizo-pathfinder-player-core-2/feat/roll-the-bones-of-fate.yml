---
name: roll the bones of fate
level: 10
rarity: common
type: class
traits:
- cursebound
- divine
- oracle
- prediction
prerequisites:
- text: bones or lore mystery
  anyOf:
  - hasChoice:
      name: $.oracle.mystery
      equals: {type: core/feature-id, value: '@class.oracle.mysteries.bones'}
  - hasChoice:
      name: $.oracle.mystery
      equals: {type: core/feature-id, value: '@class.oracle.mysteries.lore'}
action:
  count: one_action
  frequency: once per 10 minutes
description: 'You roll a handful of bones to learn (or perhaps influence) the future
  course of events. Roll 1d4 and use the corresponding result below. Whenever you
  Roll the Bones of Fate, any effects from a previous usage immediately end.

  1 Good You or an ally within 30 feet can roll twice on your next attack roll or
  skill check, taking the higher result. This is a fortune effect.

  2 Bad One creature you are observing within 30 feet must succeed at a Will save
  against your spell DC; on a failure, the target must roll twice on their next attack
  roll or skill check that takes at least one action to perform, taking the lower
  result. This is a misfortune effect.

  3 Mixed You gain the benefits of rolling both a 1 and a 2.

  4 Cursed Possibilities Your attempts to meddle in the forces of prophecy bring dire
  consequences for all. Every creature within 30 feet of you when you perform the
  augury rolls twice on their next attack roll or skill check that takes at least
  one action to perform; if the highest number rolled is odd, they take the lower
  result, and if the highest number rolled is even, they take the higher result. If
  they took the lower result, this effect has the misfortune trait for them, and if
  they took the higher result, it has the fortune trait.'
mechanicsScope: mixed
foundryID: 7Q7HWETkvOM9pYwV
