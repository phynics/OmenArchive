description: You can briefly transform into a paragon of your draconic ancestry. You
  can cast Dragon Form as an 8th-rank innate spell once per day. This spell has the
  same tradition as your draconic exemplar. When you cast this innate spell, you must
  transform into your draconic exemplar. However, if you have the Arcane Dragonblood,
  Divine Dragonblood, Occult Dragonblood, or Primal Dragonblood lineage feat, you
  can instead choose any dragon of that tradition.
