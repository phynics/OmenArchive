description: "You permanently mutate to become more like the creatures of your bloodline.
  You gain the appropriate trait or traits for those types of creatures \\(aberration
  for aberrant, angel and celestial for angelic, demon and fiend for demonic, and
  so on\\). You gain low-light vision or darkvision, if one is appropriate for creatures
  with those traits. Choose one of the following.\n\t•\tIf the creatures associated
  with your bloodline have the ability to fly, you gain a fly Speed equal to your
  land Speed.\n\t•\tIf the creatures associated with your bloodline are aquatic or
  amphibious, you become amphibious, able to breathe water and air equally well, and
  you gain a swim Speed equal to your land Speed.\n\t•\tIf creatures associated with
  your bloodline have a resistance or immunity to acid, cold, electricity, fire, void,
  or sonic, choose an energy type your bloodline is immune or resistant to and gain
  resistance 20 against that energy type."
