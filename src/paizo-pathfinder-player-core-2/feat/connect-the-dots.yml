name: connect the dots
level: 6
rarity: common
type: class
traits:
- auditory
- concentrate
- investigator
- linguistic
action:
  count: two_actions
  criticalFailure: You misconstrue a vital piece of information, which temporarily
    disconcerts you. You are [Stupefied 1](omen://condition/stupefied?source=paizo-pathfinder-player-core)
    until the end of your next turn.
  criticalSuccess: You spot a way for your ally to take advantage of the other target's
    flaws and let them know about it. Your ally gains your [Pursue a Lead](omen://action/pursue-a-lead?source=paizo-pathfinder-player-core-2)
    investigation bonus as a circumstance bonus to all its Strikes or skill checks
    against the creature until the start of your next turn.
  failure: You fail to make a connection.
  success: As critical success, but your ally gains the bonus only for their next
    Strike or skill check against the creature.
description: Ephemeral connections between people, places, and concepts are invisible
  to most, but seeing them is your stock and trade. Choose an ally and a non-allied
  creature. You must be able to see both of them. You briefly study the way they both
  move and attempt a Perception check against the higher of the non-allied creature's
  Deception DC or Will DC. Both targets are then temporarily immune to Connect the
  Dots for 10 minutes.
