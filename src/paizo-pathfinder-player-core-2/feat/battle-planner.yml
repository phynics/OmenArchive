description: 'You are constantly drawing up plans and battle scenarios, assembling
  strategies and gathered intelligence for later use. When you scout an enemy''s position
  or receive a detailed report from an ally who scouted the enemy''s position, if
  you have a clear indication of the number, position, and identities of your potential
  foes, you can spend 1 minute to come up with a battle plan that takes such potential
  factors into account and reduces the role luck plays in the equation.

