description: 'When focused on finding your quarry, you''re relentless. You gain the
  Hunt Prey action. You can use Hunt Prey to designate a creature that you''ve observed,
  heard about, or learned about through some other means, such as a bounty board or
  wanted poster. In addition to the other benefits of Hunt Prey, you can designate
  a target as your prey while Gathering Information about them, in addition to designating
  them as your prey when Tracking them as normal. If you have already identified your
  target and selected them as your prey, you gain a +2 circumstance bonus to checks
  to Gather Information about them.

  If you already have Hunt Prey, you gain the Monster Hunter feat in addition to the
  other benefits of this feat.

  Bounty Hunter'
