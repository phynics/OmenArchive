description: 'Thanks to the time you''ve spent studying and experimenting, you know
  how to scale your formulas into larger batches that don''t require any additional
  attention. Increase the number of items you can create each day with [Advanced Alchemy](omen://class/alchemist/alchemy-benefits/advanced-alchemy?source=paizo-pathfinder-player-core-2)
  to 6 + your Intelligence modifier.

  In addition, when you [Craft](omen://action/craft?source=paizo-pathfinder-player-core)
  alchemical consumables during downtime, you can produce twice as many alchemical
  items in a single batch without spending additional preparatory time. For instance,
  if you are creating Elixirs of Life, you can craft up to eight elixirs in a single
  batch using downtime, rather than four. This doesn''t change the amount of alchemical
  reagents or other ingredients required to craft each item, nor does it change your
  rate of progress for days past the base downtime spent.'
