---
name: the dead walk
level: 10
rarity: common
type: class
traits:
- cursebound
- divine
- oracle
prerequisites:
- text: ancestors or battle mystery
  anyOf:
  - hasChoice:
      name: $.oracle.mystery
      equals: {type: core/feature-id, value: '@class.oracle.mysteries.ancestors'}
  - hasChoice:
      name: $.oracle.mystery
      equals: {type: core/feature-id, value: '@class.oracle.mysteries.battle'}
action:
  count: two_actions
description: You beseech warrior spirits to come forth and aid you. Two ghostly warriors
  manifest within a emanation of you and each attempt a Strike against an adjacent
  enemy, using your spell attack modifier. The warriors' Strikes each deal 4d6 spirit
  damage and the warriors can flank with one another and with you and your allies.
  If you are [Cursebound 2](omen://condition/cursebound?source=paizo-pathfinder-player-core-2)
  when you use The Dead Walk, you instead summon three warriors, and if you are cursebound
  3, you instead summon four warriors. The warriors disappear at the start of your
  next turn.
