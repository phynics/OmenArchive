description: "Guided by your ongoing care, your steed has developed incredible intelligence
  and skill. The mount you gained with Faithful Steed is now a specialized animal
  companion. You can select one of the usual specializations or the auspice specialization.
  A faithful steed with the auspice specialization gains the following benefits.\n\t•\tIt
  gains the celestial, fiend, or monitor trait—whichever best matches your deity's
  servitors, and its appearance shifts to look more like those servitors. It also
  gains the holy trait if it's a celestial or the unholy trait if it's a fiend.\n\t•\tIts
  Intelligence modifier increases by 2 and its Wisdom modifier by 1.\n\t•\tIts proficiency
  rank in Religion increases to expert.\n\t•\tIt can speak the language associated
  with your deity's servitors \\(such as Empyrean for celestials, Chthonian for demons,
  or Requian for psychopomps\\).\n\t•\tIts maximum Hit Points increase by 20, increasing
  to 25 at 18th level and 30 at 20th level. If the mount has the celestial trait,
  the extra HP increase by 5, and the mount gains weakness 5 to unholy. If it has
  the fiend trait, the extra HP increase by 5, and the mount gains weakness 5 to holy.\n\t•\tIt
  gains wings that grant it a fly Speed equal to its land Speed."
