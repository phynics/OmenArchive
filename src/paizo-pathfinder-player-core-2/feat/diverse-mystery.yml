description: "You have broadened your understanding of the divine and can tap into
  the wonders of a different mystery. Select one revelation spell from a mystery other
  than your own. You can choose only an initial revelation spell or an advanced revelation
  spell.\nThis spell gains the cursebound trait for you, and when you cast it, you
  gain the Cursebound 1 effects of its mystery in addition to your normal curse effects.
  Any ability that lets you use a cursebound ability without increasing the severity
  of your curse also prevents you from gaining this additional curse effect.\nYou
  can't cast your chosen revelation spell if any of the following conditions are true:\n\t•\tits
  mystery's curse effects directly conflict with or negate the effects of your own
  mystery's curse,\n\t•\tthe curse would have no effect on you (for example, removing
  an ability from your original mystery that you lack),\n\t•\tor if either of these
  criteria would be met once you finish Casting the Spell"
