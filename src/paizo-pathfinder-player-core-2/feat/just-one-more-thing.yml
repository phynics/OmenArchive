description: 'After your attempt to influence someone goes poorly, you add another
  bit of information or ask a pointed question, possibly salvaging your previous attempt.
  Reroll the failed check and use the new result. If the target of the failed check
  is involved with one of your active investigations, double your investigation bonus
  from [Pursue a Lead](omen://action/pursue-a-lead?source=paizo-pathfinder-player-core-2)
  on the rerolled check. That creature is temporarily immune to Just One More Thing
  for 1 day.

  You can also use this action if you failed, but didn''t critically fail, at a check
  to [Lie](omen://action/lie?source=paizo-pathfinder-player-core), [Gather Information](omen://action/gather-information?source=paizo-pathfinder-player-core),
  [Make an Impression](omen://action/make-an-impression?source=paizo-pathfinder-player-core),
  or [Coerce](omen://action/coerce?source=paizo-pathfinder-player-core). In this case,
  rather than spending 1 action, adding Just One More Thing takes you half the amount
  of time you initially spent on the check, to a minimum of 1 more round.'
