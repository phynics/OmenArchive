description: Whenever you [Devise a Stratagem](omen://action/devise-a-stratagem?source=paizo-pathfinder-player-core-2),
  you can also attempt a check to [Recall Knowledge](omen://action/recall-knowledge?source=paizo-pathfinder-player-core)
  as part of that action before rolling the d20. If you critically succeed at the
  Recall Knowledge check, you notice a weakness and can convey the information to
  allies to grant each of them a +1 circumstance bonus to their next attack roll against
  the subject, as long as their attack is made before the beginning of your next turn.
  If you choose an attack stratagem, this bonus applies to that attack roll too.
