description: "The power in your blood allows you to perform minor feats of magic.
  You can perform one of the following actions depending on the tradition of your
  bloodline.\n\t•\tArcane Your mind temporarily opens to the secrets of the world.
  Attempt to Recall Knowledge; you can use Arcana instead of the skill normally needed
  for that subject. If you critically fail at this check, you get a failure instead.\n\t•\tDivine
  Whatever divine provenance is in your lineage guides you to instinctively move yourself
  or others out of harm's way. You Step, or you [Reposition](omen://action/reposition?source=paizo-pathfinder-player-core)
  a target within your reach using Religion for the check.\n\t•\tOccult Strange mists
  or swirling colors hide your movement. You Step up to 10 feet.\n\t•\tPrimal The
  immense power of nature echoes in your voice. You can attempt a Nature check to
  [Demoralize](omen://action/demoralize?source=paizo-pathfinder-player-core) a target."
