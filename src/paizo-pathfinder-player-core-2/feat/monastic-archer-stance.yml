name: monastic archer stance
level: 1
rarity: common
type: class
traits:
- monk
- stance
action:
  count: one_action
  requirements: You are unarmored and wielding a longbow, shortbow, or a bow with
    the monk trait.
description: 'You enter a specialized stance for a unique martial art centered around
  the use of a bow. While in this stance, the only Strikes you can make are those
  using longbows, shortbows, or bows with the monk trait.

  You can use Flurry of Blows with these bows. You can use your other monk feats or
  monk abilities that normally require unarmed attacks with these bows when attacking
  within half the first range increment (normally 50 feet for a longbow and 30 feet
  for a shortbow), so long as the feat or ability doesn''t require a single, specific
  Strike.'
specialText: When you select this feat, you become trained in the longbow, shortbow,
  and any simple and martial bows with the monk trait. If you gain the expert strikes
  class feature, your proficiency rank for these weapons increases to expert, and
  if you gain the master strikes class feature, your proficiency rank for these weapons
  increases to master.
