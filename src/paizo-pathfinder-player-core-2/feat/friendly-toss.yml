name: friendly toss
level: 8
rarity: common
type: class
traits:
- barbarian
- manipulate
- rage
action:
  count: two_actions
  requirements: You are adjacent to an ally and have one or more hands free.
description: You toss your friends around the battlefield. Pick up an adjacent ally
  of your size or smaller and throw them to an unoccupied space you can see within
  30 feet. Their movement doesn't trigger reactions. Your ally ends this movement
  on their feet and doesn't take damage from the fall. If your ally ends this movement
  within melee reach of at least one enemy, they can use their reaction to make a
  melee Strike against such an enemy.
