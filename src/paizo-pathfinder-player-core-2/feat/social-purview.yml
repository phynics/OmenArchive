description: 'You have built a reputation for yourself in your social identity. Choose
  one archetype that you meet the prerequisites for. You gain that archetype''s dedication
  feat and can select feats from that archetype, even if you haven''t yet gained enough
  feats in the vigilante archetype to take another dedication feat.

  These feats become part of your social identity and gain the social trait-for instance,
  a fighter vigilante could take the Wizard Dedication feat and have a wizard social
  identity. Using these feats in your social identity doesn''t risk exposing your
  vigilante identity, but using them in your vigilante identity could put you at risk
  for exposure.'
