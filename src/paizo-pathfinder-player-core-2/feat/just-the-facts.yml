description: "You fundamentally understand everything to the point where your research
  can't possibly be wrong. You are permanently [Quickened](omen://condition/quickened?source=paizo-pathfinder-player-core)
  and can use the extra action to [Recall Knowledge](omen://action/recall-knowledge?source=paizo-pathfinder-player-core).
  In addition, you gain the following benefits with Recall Knowledge.\n\t•\tYour checks
  to Recall Knowledge are no longer secret.\n\t•\tWhen you Recall Knowledge, you use
  the outcome for one degree of success better than the result of your check.\n\t•\tIf
  an effect \\(such as [Dubious Knowledge](omen://feat/dubious-knowledge?source=paizo-pathfinder-player-core)\\)
  would give you inaccurate information from your Recall Knowledge check, you know
  which information is inaccurate.\n\t•\tWhen one of your allies Recalls Knowledge
  and gains false information, you also know that information is inaccurate if they
  share it with you"
