---
name: greater revelation
level: 12
rarity: common
type: class
traits:
- oracle
prerequisites:
- text: initial revelation spell
  anyOf:
  - hasChoice:
      name: $.oracle.mystery
      equals: {type: core/feature-id, value: '@class.oracle.mysteries.ancestors'}
  - hasChoice:
      name: $.oracle.mystery
      equals: {type: core/feature-id, value: '@class.oracle.mysteries.battle'}
  - hasChoice:
      name: $.oracle.mystery
