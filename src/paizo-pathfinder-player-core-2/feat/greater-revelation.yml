  - hasChoice:
      name: $.oracle.mystery
      equals: {type: core/feature-id, value: '@class.oracle.mysteries.tempest'}
description: You unlock deeper revelations hidden within your mystery. You gain your
  mystery's greater revelation spell
mechanicsScope: builder
foundryID: HSW3N9pfHhM7upRB
