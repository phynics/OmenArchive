      name: $.oracle.mystery
      equals: {type: core/feature-id, value: '@class.oracle.mysteries.ancestors'}
  inputs:
    source: oracle-focus-spells
    sourceName: Oracle Focus Spells
    castingKind: focus
    tradition: divine
    attribute: charisma
- key: ancestral-form-focus-spell
