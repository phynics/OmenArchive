action:
  count: two_actions
  requirements: You have one or more hands free.
description: With a great heave, you seize a piece of your surroundings, such as a
  boulder, log, table, wagon, or chunk of earth, and hurl it at your foes. The object
  must be your size or one size smaller than you, and it must not have too much Bulk
  for you to lift it in the first place. Make a ranged Strike with the object; regardless
  of the result, the object takes the same amount of damage it would deal on a success.
