---
name: combine elixirs
level: 6
rarity: common
type: class
traits:
- additive
- alchemist
description: You can add the full ingredients of a second elixir to an elixir you
  make to create a hybrid concoction. You must expend an additional versatile vial
  to make this combined elixir, and the ingredients must be for an elixir of the same
  level or lower that you could create with [Quick Alchemy](omen://action/quick-alchemy?source=paizo-pathfinder-player-core-2).
  When this combination elixir is consumed, both the constituent elixirs take effect.
  For example, you can combine two Lesser Elixirs of Life to create a combined elixir
  that heals twice the normal amount, or you can combine a Lesser Darkvision Elixir
  with a Lesser Eagle-Eye Elixir to both gain darkvision and find secret doors.
