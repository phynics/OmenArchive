name: impossible riposte
level: 14
rarity: common
type: class
traits:
- swashbuckler
prerequisites:
- text: Opportune Riposte
  has: '@action.opportune-riposte'
description: 'Your ripostes can deflect attacks back at their source. You can use
  [Opportune Riposte](omen://class/swashbuckler/features/opportune-riposte) with a
  trigger of "A foe outside of your reach critically fails an attack roll against
  you" in addition to its usual trigger.

  When you use Opportune Riposte with this new trigger against a ranged attack, your
  Strike deflects some of the triggering effect back toward its source. Compare the
  result of your attack roll to the AC of the triggering foe.

  On a hit, you deal the normal amount of damage for your Strike, but the damage type
  changes to that of the triggering attack. For instance, if you used Opportune Riposte
  to deflect a [Blazing Bolt](omen://spell/blazing-bolt?source=paizo-pathfinder-player-core),
  your Strike would deal fire damage instead of its normal damage type.'
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: Its change to the character's Strikes is a note on their attack
  or damage rolls; the sheet's numbers don't include it.
