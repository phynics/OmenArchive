description: You reach for an opponent's item as you move past a foe. If you critically
  succeed at your check to [Tumble Through](omen://action/tumble-through?source=paizo-pathfinder-player-core)
  an enemy's space, you can attempt to [Steal](omen://action/steal?source=paizo-pathfinder-player-core)
  something from the enemy as a reaction. You gain a +1 circumstance bonus to your
  Thievery check to Steal as your tumbling make it difficult for your enemy to keep
  track of your movement. You can Steal any immediately accessible item of light or
  negligible Bulk on the enemy's person, such as a potion or coin purse hanging from
  a belt, but not anything inside a container or anything the enemy is holding. The
  GM has final say on what you can Steal.
