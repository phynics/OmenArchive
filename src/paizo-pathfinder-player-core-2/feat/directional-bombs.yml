name: directional bombs
level: 6
rarity: common
type: class
traits:
- alchemist
description: You can lob bombs with great force and a precise trajectory to angle
  the splash in a cone that sprays in a single direction, potentially allowing you
  to avoid allies and splash deeper into enemy lines. When throwing an alchemical
  bomb with the splash trait, instead of splashing all squares adjacent to the target,
  you can create a splash in a cone. You choose the cone's direction, but its first
  square must be a square in the target's space.
specialText: If you have the [Expanded Splash](omen://feat/expanded-splash?source=paizo-pathfinder-player-core-2)
  feat or another ability that increases the radius of splash damage, you can have
  the splash damage be a cone.
