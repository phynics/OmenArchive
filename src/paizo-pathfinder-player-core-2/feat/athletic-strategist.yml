description: 'You know how to calculatedly manipulate joints and body weight. In addition
  to using an attack stratagem''s roll substitution for a Strike, you can use it to
  modify a [Disarm](omen://action/disarm?source=paizo-pathfinder-player-core), [Grapple](omen://action/grapple?source=paizo-pathfinder-player-core),
  [Reposition](omen://action/reposition?source=paizo-pathfinder-player-core), [Shove](omen://action/shove?source=paizo-pathfinder-player-core),
  or [Trip](omen://action/trip?source=paizo-pathfinder-player-core) attempt, substituting
  your [Devise a Stratagem](omen://action/devise-a-stratagem?source=paizo-pathfinder-player-core-2)
  roll for the Athletics check. You must apply the substitution to the first eligible
  attack you make, whether it''s a Strike or one of the Athletics actions.

  You can also use your Intelligence modifier instead of Strength for the Athletics
  check when you substitute your Devise a Stratagem roll, unless you''re using a weapon
  for the maneuver and the weapon doesn''t fit the restrictions for using Intelligence
  with a stratagem.'
