description: 'You have mastered an ultimate grappling technique capable of breaking
  even the mightiest of foes. You hurl the creature 20 feet into the air, following
  behind it with a powerful jump, and then make an unarmed Strike. If the Strike is
  successful, you can repeat this process up to two more times, moving the creature
  an additional 20 feet directly up into the air with each Strike; the creature keeps
  the grabbed or restrained condition throughout the sequence. If you miss with any
  of the Strikes, Godbreaker and the grabbed or restrained condition immediately end
  and both you and the opponent fall, taking falling damage as normal for the total
  height of your jump.

  If all three Strikes are successful, you immediately grab the creature and bring
  it crashing to the ground, dealing your unarmed Strike damage plus falling damage
  to it. You land on your feet adjacent to the creature, you take no damage from the
  fall, and the creature remains grabbed or restrained by you.'
