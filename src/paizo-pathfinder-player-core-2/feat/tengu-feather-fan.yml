action:
  frequency: once per day
description: 'You''ve learned to bind some of your feathers together into a fan to
  focus your ancestral magic. You gain a tengu feather fan: a magic item of light
  Bulk with a level equal to your level and the primal trait. You \(and only you\)
  can cast tengu magic with the Wave Fan activation. If your fan is lost or destroyed,
  you can create a replacement during your daily preparations; if you do so, your
  previous fan falls apart into mundane feathers.

  Your tengu feather fan contains a 1st-rank [Gust of Wind](omen://spell/gust-of-wind?source=paizo-pathfinder-player-core)
  spell. Further feats might add more spells and grant you additional activations
  of your tengu feather fan, but you can never have more than three activations per
  day, no matter how many such feats you have.

  Activate—Wave Fan \(manipulate\)

  Effect You cast your choice of one spell contained in your tengu feather fan. You
  can instead cast a cantrip you''ve gained from a heritage or an ancestry feat; this
  doesn''t use up one of the fan''s daily activations. This activation takes the spell''s
  normal number of actions. The spell''s DC is your class DC or spell DC, whichever
  is higher.'
