  hasSkillProficiency: {skill: athletics, proficiency: expert}
description: When climbing, you can prepare routes for others to follow, and you can
  pull your allies up to avoid disaster. When your allies attempt to Climb a route
  you set using the Follow the Expert exploration activity, if any of them critically
  fail their checks to Climb, you can attempt an Athletics check against the same
  DC. If you succeed, your ally only fails instead of critically failing. If you also
  critically fail, you both experience the consequences of the critical failure.
