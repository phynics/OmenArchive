---
name: advanced qi spells
level: 6
rarity: common
type: class
traits:
- monk
prerequisites:
- text: Qi Spells
  hasResourceWithName: qi spells
repeatPolicy:
  duplicateSelectionRules:
  - lookupName: $.feat.advanced-qi-spells.spell
    valueTypeID: me.atkn.omen.pf2e.playercore-spellcasting/value/spell-id
description: Your talent at controlling your qi has reached new heights. You gain
  [Qi Blast](omen://spell/qi-blast?source=paizo-pathfinder-player-core-2), [Shrink
  the Span](omen://spell/shrink-the-span?source=paizo-pathfinder-player-core-2), or
  another 3rd-rank qi spell you have access to.
specialText: You can select this feat more than once, choosing a different spell each
  time.
mechanicsScope: builder
foundryID: 10DbphslCihq8mxQ
rules:
- key: choice-qi-tradition
  choice:
    name: $.qi.tradition
    label: Qi tradition
    type: spellcasting/tradition
    cases: [divine, occult]
- key: qi-focus-source
  effect: spellcasting/configure-source
  inputs:
    source: monk-focus-spells
    sourceName: Monk Focus Spells
    castingKind: focus
    tradition: {choice: $.qi.tradition}
    attribute: wis
- key: qi-spell-proficiency
  effect: spellcasting/increase-spell-proficiency@2
  inputs:
    rank: trained
- key: choice-feat-advanced-qi-spells-spell
  choice:
    name: $.feat.advanced-qi-spells.spell
    label: Qi spell
    type: spellcasting/spell-id
    records:
      filter:
        all:
        - {type: spell}
        - {spell.category: focus}
        - {trait: classTrait-monk}
        - {level: 3}
- key: grant-qi-spell
  effect: spellcasting/grant-focus-spell
  inputs:
    source: monk-focus-spells
    spellId: {choice: $.feat.advanced-qi-spells.spell}
