description: 'You have familiarity with the bo staff, longbow, composite longbow,
  scythe, and staff—for the purpose of proficiency, you treat any of these that are
  martial weapons as simple weapons and any that are advanced weapons as martial weapons.

  At 5th level, whenever you get a critical hit with one of these weapons, you get
  its critical specialization effect.'
