description: 'You turn a container and its contents into an imaginary form stored
  in your mind that only you can see and interact with. The container''s physical
  properties—the material from which it''s made, any locks, or other features—are
  irrelevant to the casting of this spell, but the container can''t contain any creatures.
  The container has no Bulk, and you can visualize everything inside it.


  You can retrieve an item from the lockbox as an activity that takes 3 actions and
  has the concentrate and manipulate traits. Putting items back isn''t possible. You
  can Dismiss the spell. When the spell ends, the container returns to its normal
  state, either appearing in your hands if it can fit there or on the ground adjacent
  to you if not.'
