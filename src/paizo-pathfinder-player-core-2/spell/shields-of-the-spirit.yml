description: 'Requirements You are wielding a shield.


  You Raise your Shield, causing ephemeral spirit shields to float within your champion''s
  aura. The shields last until the start of your next turn or until you''re no longer
  raising your shield, whichever comes first. While one of your allies is in your
  champion''s aura, the shields grant them a +1 status bonus to AC, and each time
  an enemy makes an attack against the ally, the enemy takes 1d4 spirit damage \(even
  if it misses\).


  The benefit applies only while an ally is in your aura, ending for any ally that
  leaves and applying to any that enters later. As normal, you don''t count as your
  own ally and therefore don''t get the benefits of the spirit shields yourself.


  Heightened \(+2\) The damage increases by 1d4.'
