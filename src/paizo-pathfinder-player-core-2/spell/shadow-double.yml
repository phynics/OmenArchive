name: shadow double
rank: 4
rarity: rare
category: ritual
traits:
- illusion
traditions: []
time: 1 day
target: 1 living creature
cost: a small item of personal significance to the creature to be duplicated (such
  as an item of clothing they wear everyday or a memento of a romantic tryst), plus
  rare oils, minerals, and pigments with a total value of 300 gp
description: 'You create an illusory duplicate of the target creature by drawing shadowy
  material from the Netherworld and sculpting it into a semi-solid form. The shadow
  double is a 4th-level creature with no special abilities. If it needs to attempt
  a roll or use a DC, use the moderate number for a monster, except as noted below.
  It doesn''t have any specific memories from the target, but it can use information
  about the creature gained from any of the casters to Impersonate the target. It
  looks exactly like the target and has a Deception modifier to Impersonate that creature
  equal to the modifier of the secondary spellcaster who rolled the Deception check,
  with a +4 status bonus. Though it doesn''t have any of the original''s special abilities,
  like a dragon''s breath, illusions allow it to appear to use those abilities; they
  just never seem to have an effect. For instance, against a double''s dragon''s breath,
  all creatures in the area seem to critically succeed at their saving throws and
  take no damage. Creatures can attempt to disbelieve the illusion by attempting a
  Perception check against the Deception DC of the secondary spellcaster who rolled
  the Deception check.


  Critical Success You create the shadow double. It has the minion trait and is under
  your absolute control. You gain a direct mental link with the shadow double and
  can spend an action to command the shadow double via this link, even at a distance.


  Success As a critical success, but there is no special link between you and the
  shadow double. You must spend an action to command it verbally or by some other
  means.


  Failure The ritual fails and has no effect.


  Critical Failure The shadow double is created, but it isn''t your minion and is
  hostile to all the casters. It does everything it can to destroy them, but if it
  can''t immediately slay them, the shadow double tries to escape and plots their
  demise.'
mechanicsScope: encounter
