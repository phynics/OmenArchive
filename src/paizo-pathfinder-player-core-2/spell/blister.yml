description: 'You point at a target in range, and its skin grows searing blisters
  filled with caustic fluid. The target must attempt a Fortitude save.


  Critical Success The target is unaffected.


  Success The target grows one blister. You can spend a single action, which has the
  concentrate trait, to pop a blister. The target and each creature in a cone originating
  from the target takes 7d6 acid damage \(basic Fortitude save\). You choose the direction
  of the cone, which can''t include the target. When no blisters are left, the spell
  ends.


  Failure As success, but the target grows two blisters.


  Critical Failure As success, but the target grows four blisters.


  Heightened \(+1\) The damage of a popped blister increases by 1d6.'
