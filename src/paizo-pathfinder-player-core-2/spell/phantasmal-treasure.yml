description: 'A phantasmal image of the most precious thing imaginable to the target
  appears in a location of your choice within the spell''s range. Only the spell''s
  target can see the treasure, though you can see the vague shape of the treasure-be
  it a pile of items, a deific avatar, or a cherished loved one or hero. The target''s
  response to the treasure is based on the outcome of the target''s Will save.


  Critical Success The target is unaffected.


  Success The target becomes [Fascinated](omen://condition/fascinated?source=paizo-pathfinder-player-core)
  with the treasure, and the duration is until the end of its turn. The target can
  also try to disbelieve the illusion if it touches the treasure, [Seeks](omen://action/seek?source=paizo-pathfinder-player-core)
  to examine it, or speaks to it if the illusion appears to be a person or the like.
  If the target disbelieves the illusion, the spell ends.


  Failure As success, but the duration is 1 minute.


  Critical Failure As success, but the duration is 1 minute. The target finds the
  treasure so appealing that until the spell ends, it must spend each action focused
  on it. This can include moving toward the treasure if the target isn''t next to
  it, and [Interacting](omen://action/interact?source=paizo-pathfinder-player-core)
  with the treasure if the target is next to it. \(If the illusion appears to be a
  person or the like, the target can also Interact to converse with it.\)'
