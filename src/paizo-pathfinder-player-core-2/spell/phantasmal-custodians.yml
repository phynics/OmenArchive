description: 'Area 100 feet × 100 feet, up to 20 feet high


  You create a long-lasting adaptation of the Phantasmal Minion, forming entities
  to carry out basic tasks at a fixed location.


  Critical Success The ritual creates six phantasmal minions. You don''t need to concentrate
  on them, and they aren''t summoned minions. You can spend an action, which has the
  concentrate trait, to command one to perform a basic task; it continues to perform
  the task until commanded again.


  Success As critical success, but the ritual creates three minions.


  Failure The ritual fails to create any phantasmal minions.


  Critical Failure The ritual creates six phantasmal minions, but these creatures
  are hostile and capable of making fist Strikes with an attack bonus equal to your
  skill modifier for the primary skill check, dealing 1d6 force damage. They attack
  you and your allies and attempt to break objects belonging to you and your allies
  within the area.


  Heightened (6th) If destroyed, the phantasmal minions reform the next morning. The
  cost increases to 30 gp'
