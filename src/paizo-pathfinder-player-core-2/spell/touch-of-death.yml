description: 'Make a melee unarmed Strike. If you hit and the target is alive, anytime
  during the duration, you can spend a single action, which has the auditory and concentrate
  traits, to speak a word of death that could instantly slay it. The target must attempt
  a Fortitude save.


  Critical Success The target survives, the spell ends, and the target is then temporarily
  immune for 24 hours.


  Success The target is Stunned 1 and takes 5*spell rank damage, the spell ends, and
  the target is then temporarily immune for 24 hours.


  Failure The target is Stunned 3 and takes 10*spell rank damage. The spell''s duration
  continues, but the target is then temporarily immune for 24 hours against being
  killed by touch of death.


  Critical Failure The target dies.


  If you cast touch of death again, the effects of any touch of death you had previously
  cast end.


  Heightened (+1) The damage increases by 10 on a failure, or 5 on a success.'
