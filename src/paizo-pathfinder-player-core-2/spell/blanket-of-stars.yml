description: 'A flowing cloak of utter darkness drapes over you, filled with pinpricks
  of light like distant stars. It imparts the stillness of the cosmos to you, granting
  you a +2 status bonus to Stealth checks to [Hide](omen://action/hide?source=paizo-pathfinder-player-core)
  and [Sneak](omen://action/sneak?source=paizo-pathfinder-player-core).


  While outside under a starry night sky, you''re also [Invisible](omen://condition/invisible?source=paizo-pathfinder-player-core)
  as long as you remain still. When moving under a starry night sky, you''re [Concealed](omen://condition/concealed?source=paizo-pathfinder-player-core)
  instead.


  Gazing too closely into the stars is disorienting. Any creature that ends its turn
  adjacent to you must attempt a Will save; this is a mental, visual effect.


  Success The creature is unaffected.


  Failure The creature is [Dazzled](omen://condition/dazzled?source=paizo-pathfinder-player-core)
  until the end of its next turn.


  Critical Failure The creature is [Confused](omen://condition/confused?source=paizo-pathfinder-player-core)
  and dazzled until the end of its next turn.'
