description: 'You curse the target with rapid aging or erosion. The effect depends
  on whether the target is an object, a construct, or a living creature. Artifacts,
  along with objects and constructs made of precious materials \(as determined by
  the GM\), are immune.


  Object If the object is attended, its bearer can attempt a Fortitude save. If the
  bearer fails or the object is unattended, the object immediately takes 4d6 damage
  \(applying Hardness normally\) and the item is cursed with an unlimited duration.
  Until the curse ends, the item becomes shoddy and can''t be [Repaired](omen://action/repair?source=paizo-pathfinder-player-core),
  and the curse attempts to counteract any spell that would restore the object''s
  Hit Points. [Cleanse Affliction](omen://spell/cleanse-affliction?source=paizo-pathfinder-player-core)
  can target an item affected by this spell.


  Construct The construct takes 4d6 damage \(basic Fortitude save\). On a failure,
  for 1 hour the construct is [Clumsy 1](omen://condition/clumsy?source=paizo-pathfinder-player-core),
  is [Enfeebled 1](omen://condition/enfeebled?source=paizo-pathfinder-player-core),
  and can''t be Repaired, and the curse attempts to counteract any spell that would
  restore the construct''s Hit Points. On a critical failure, these effects have an
  unlimited duration.


  Living Creature The living creature must attempt a Fortitude save. Ageless creatures
  are immune.


  Critical Success The living creature is unaffected.


  Success The living creature briefly ages, becoming clumsy 1 and enfeebled 1 for
  1 round.


  Failure As success, with a duration of 1 hour.


  Critical Failure As success, with an unlimited duration.


  Heightened \(+1\) The damage increases by 1d6.'
