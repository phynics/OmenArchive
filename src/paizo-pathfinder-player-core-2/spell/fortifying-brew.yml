description: 'You craft a large quantity of restorative drink, such as an invigorating
  tea, a refreshing ale, or a stimulative alchemical tonic. The ritual speeds along
  any natural processes to make the brew, such as fermenting fruit to make a wine.
  At the conclusion of the first 3 hours of the ritual, you produce enough brew for
  up to 10 people to drink, any of whom can be the secondary caster of the ritual.
  The brew must then be consumed over the next hour. There is no danger of the drinkers
  becoming drunk if the brew is alcoholic. Once that hour is completed, you and the
  secondary caster attempt your checks as normal.


  Critical Success The brew is delicious and revitalizing. It casts a 4th-rank [Cleanse
  Affliction](omen://spell/cleanse-affliction?source=paizo-pathfinder-player-core),
  a 4th-rank [Clear Mind](omen://spell/clear-mind?source=paizo-pathfinder-player-core),
  and a 4th-rank [Sound Body](omen://spell/sound-body?source=paizo-pathfinder-player-core)
  on each drinker for each relevant affliction or condition, using your modifier for
  the primary skill check as the counteract modifier. Each drinker also gains 20 temporary
  Hit Points that last 12 hours and a +2 status bonus to saves against diseases and
  poisons for the next 12 hours.


  Success As critical success, except drinkers gain only 10 temporary Hit Points,
  and don''t gain the status bonus to saves.


  Failure You and the other drinkers are left with a sour taste—something went wrong
  with the brewing process.


  Critical Failure Your attempt to craft the drink resulted in something more akin
  to a poison. You and the other drinkers become [Sickened 4](omen://condition/sickened?source=paizo-pathfinder-player-core)
  and can''t reduce the condition for 12 hours.


  Heightened \(+1\) The temporary Hit Points increases by 2 \(or 4 on a critical success\).'
