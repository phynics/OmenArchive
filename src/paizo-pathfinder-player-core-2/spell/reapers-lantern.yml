description: 'You call forth a ghostly lantern that guides the living toward death
  and the undead toward true death. It sheds bright light in the spell''s area and
  dim light to twice that area. The lantern is insubstantial and floats near you,
  suspended from an ephemeral, skeletal hand. Living creatures and undead in the area
  when you Cast the Spell, or that enter the area later, must attempt Fortitude saves.
  Living creatures that fail their Fortitude saves gain only half the normal benefit
  from healing effects while within the area. Undead targets that fail their Fortitude
  saves become Enfeebled 1 while within the area. Once a creature attempts a save
  against reaper''s lantern, it uses the same outcome if it leaves the area and enters
  it again.


  Once per turn, starting on the round after you cast reaper''s lantern, you can Sustain
  the spell to increase the emanation''s radius by 5 feet. When you do so, you force
  creatures in the area that haven''t yet attempted a save against reaper''s lantern
  to attempt one.'
