description: 'You summon a bridge of radiant, shimmering moonlight.


  The 10-foot-wide span must start at the ground on a point within range, and it extends
  as a horizontal plane, either in a straight line or at any angle up to 45 degrees
  upward or downward, for up to 120 feet.


  This bridge has AC 10, Hardness 30, and 60 Hit Points, and it''s immune to all damage
  \(except force, spirit, and damage from Strikes with the Ghost Touch property rune\).
  You and your allies can cross the bridge normally, but other creatures simply pass
  through it if they try to do so. The bridge blocks physical, ethereal, and incorporeal
  attacks from crossing, whether from above or below.


  You can Dismiss the spell.


  Heightened \(+1\) The length of the bridge increases by 20 feet, and its Hit Points
  increase by 20, and you can increase the width of the span by up to an additional
  5 feet.'
