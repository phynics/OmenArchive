description: 'Misshapen skeletal forms erupt from a solid surface, such as a stone
  floor, and fill the burst. The area they fill is difficult terrain. Their grasping
  claws deal 2d6 slashing damage to creatures on the ground in the area when the skeletons
  first appear with a basic Reflex save.


  On subsequent rounds, the first time you Sustain the Spell each round, you can move
  the area of skeletons up to 20 feet within the range of the spell and deal 2d6 slashing
  damage with a basic Reflex save to each creature in the new area.


  Damaging or destroying the skeletons is irrelevant, as new bones pull forth from
  the ground to repair and replace any that are obliterated.


  Heightened (+2) The damage increases by 1d6.'
