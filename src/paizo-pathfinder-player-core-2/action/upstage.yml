---
name: upstage
traits: []
count: reaction
trigger: An enemy attempts a skill check and doesn't get a critical success
description: After your foe has tried their best, you show everyone how it's really
  done. Attempt a check using the same skill that triggered this reaction.
criticalSuccess: You gain a +1 status bonus to attack rolls, Perception checks, saving
  throws, and skill checks until the end of your next turn.
success: As critical success, except you gain the benefits only if the triggering
  creature failed their skill check.
mechanicsScope: encounter
