description: 'You free an ally from restraint.

  If the trigger was an ally taking damage, the ally gains resistance to all damage
  against the triggering damage equal to 2 + your level.

  The ally can attempt to break free of effects grabbing, [Restraining](omen://condition/restrained?source=paizo-pathfinder-player-core),
  [Immobilizing](omen://condition/immobilized?source=paizo-pathfinder-player-core),
  or [Paralyzing](omen://condition/paralyzed?source=paizo-pathfinder-player-core)
  them. They either attempt a new save against one such effect that allows a save,
  or attempt to [Escape](omen://action/escape?source=paizo-pathfinder-player-core)
  from one effect as a free action.

  If they can move, the ally can Step as a free action, even if they didn''t need
  to escape.'
