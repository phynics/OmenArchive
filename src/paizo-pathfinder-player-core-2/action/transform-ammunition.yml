name: transform ammunition
traits:
- magical
count: free_action
frequency: once per round
description: 'Effect You transform a non-magical arrow or bolt on your person into
  a piece of magical ammunition of one type you chose for the [Magic Ammunition](omen://archetype/eldritch-archer/feats/magic-ammunition?source=paizo-pathfinder-player-core-2)
  feat. You must shoot the ammunition before the end of your turn or the magic dissipates.
  If the ammunition has an Activate entry, you still need to spend the required actions
  to activate the ammunition before shooting it.

  You can choose a type of magical ammunition that is typically not available to the
  type of ammunition you''re using—for example, you can use Climbing Bolt on an arrow,
  even though that magical ammunition is normally only found on bolts.'
mechanicsScope: encounter
