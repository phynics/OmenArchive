name: pointed question
traits:
- auditory
- concentrate
- investigator
- linguistic
- mental
count: one_action
description: 'You ask a question that charms or needles someone in just the right
  way. Ask a question of a non-allied creature that you can see. Attempt a Diplomacy
  check against the creature''s Will DC. The creature is then temporarily immune for
  1 hour.

  Whether it answers truthfully or not, you glean something from its body language,
  and it is [Off-Guard](omen://condition/off-guard?source=paizo-pathfinder-player-core)
  to the Strike you make using [Devise a Stratagem](omen://action/devise-a-stratagem?source=paizo-pathfinder-player-core-2)
  against it before the end of your turn.'
criticalSuccess: The target must directly answer your question. It doesn't have to
  answer truthfully, but you gain a +4 circumstance bonus to your Perception DC if
  the creature attempts to [Lie](omen://action/lie?source=paizo-pathfinder-player-core)
  to you.
success: As critical success, but the circumstance bonus to your Perception DC is
  +2.
failure: The target can refuse to answer you as normal.
criticalFailure: The target can refuse to answer you as normal, and its attitude toward
  you decreases by one step due to your aggravating attention.
mechanicsScope: encounter
