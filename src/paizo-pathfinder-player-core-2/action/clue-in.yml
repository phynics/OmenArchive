---
name: clue in
traits:
- concentrate
- investigator
count: reaction
trigger: Another creature attempts a check that could help get you closer to answering
  the question at the heart of one of your active investigations.
frequency: once per 10 minutes
description: You share information with the triggering creature. They gain a circumstance
  bonus to their check equal to your investigation bonus from Pursue a Lead. The GM
  can add any relevant traits to this reaction depending on the situation, such as
  auditory and linguistic if you're conveying information verbally.
mechanicsScope: encounter
