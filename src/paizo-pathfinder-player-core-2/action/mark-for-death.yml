name: mark for death
traits:
- concentrate
count: three_actions
requirements: The creature you intend to mark is observed by you
description: 'Effect You designate a single creature as your mark. Using Mark for
  Death while Hidden or Undetected doesn''t make you Observed. Mark for Death lasts
  until the mark dies or you use Mark for Death again. You gain a +2 circumstance
  bonus to Perception checks to Seek your mark, as well as to Deception checks to
  Feint against your mark. Your mark takes a –2 circumstance penalty to all Perception
  checks to Seek you.

  In addition, when attacking your mark, you have the Sneak Attack class feature,
  except it deals 1d4 precision damage and you don''t increase the number of dice
  as you gain levels. At 6th level, the damage increases to 1d6. If you already have
  the sneak attack class feature, you instead deal an additional 1 precision damage
  with your sneak attacks made against your mark, increasing to 2 precision damage
  at 6th level.'
