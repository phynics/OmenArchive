description: 'You have been blessed by a divinity. For an unknown reason, and irrespective
  of your actual beliefs, a deity has granted you a boon to use for good or ill. Your
  blessing grants wisdom and insight to aid you in your struggles. You may or may
  not even know the identity of the being who blessed you, and the blessing might
  come with a cost you discover later on.

  Choose two attribute boosts. One must be to Wisdom or Charisma, and one is a free
  attribute boost.

  You are trained in a Lore skill associated with the deity who blessed you (such
  as Shelyn Lore) if you know their identity, or else in a Lore skill of the GM''s
  choice if you don''t. Either you can cast Guidance as a divine innate spell at will,
  or you gain a similar blessing determined by the GM.'
