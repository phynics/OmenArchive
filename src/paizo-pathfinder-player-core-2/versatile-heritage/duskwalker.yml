---
name: duskwalker
ancestry: versatile
rarity: uncommon
description: Thanks to an ancient bargain, your soul has been reborn as a duskwalker,
  a planar scion with a connection to psychopomps and the Boneyard. You gain the duskwalker
  trait. You also gain low-light vision, or you gain darkvision if your ancestry already
  has low-light vision. Neither your body nor your spirit can ever become undead.
  You can select from duskwalker feats and feats from your ancestry whenever you gain
  an ancestry feat.
mechanicsScope: builder
rules:
- key: grant-heritage-trait
  effect: core/add-character-ancestry-trait
  inputs:
    trait: duskwalker
- key: sense-1
  effect: core/add-sense
  inputs:
    selector: low-light-vision
    acuity: ''
    range: -1
- key: sense-2
  effect: core/add-sense
  prerequisites:
  - hasAncestryVision: low-light-vision
  inputs:
    selector: darkvision
    acuity: ''
    range: -1
