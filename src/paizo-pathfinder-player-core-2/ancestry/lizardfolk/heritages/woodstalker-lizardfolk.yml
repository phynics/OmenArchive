---
name: woodstalker lizardfolk
ancestry: lizardfolk
rarity: common
description: You move easily through thick forest and jungle, using every branch or
  bush. You can always use the [Take Cover](omen://action/take-cover?source=paizo-pathfinder-player-core)
  action when in forest or jungle terrain to gain cover, even if you're not next to
  an obstacle you would normally be able to Take Cover behind. You gain the [Terrain
  Stalker](omen://feat/terrain-stalker?source=paizo-pathfinder-player-core) feat,
  even if you're not trained in Stealth, and you must choose underbrush as your chosen
  terrain.
mechanicsScope: builder
rules:
- key: terrain-stalker-underbrush-feat
  effect: core/add-feat@3
  inputs:
    feat: '@feat.terrain-stalker?source=paizo-pathfinder-player-core'
    with:
      $.feats.terrain-stalker.terrain: {type: core/string, value: underbrush}
