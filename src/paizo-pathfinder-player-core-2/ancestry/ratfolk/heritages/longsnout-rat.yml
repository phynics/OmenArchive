---
name: longsnout rat
ancestry: ratfolk
rarity: common
description: 'Your long snout gives you a keener sense of smell than most ratfolk.
  You gain imprecise scent with a range of 30 feet. This means you can use your sense
  of smell to determine a creature''s location. The GM will usually double the range
  if you''re downwind from the creature or halve the range if you''re upwind.

  In addition, you gain a +2 circumstance bonus to Perception checks to [Seek](omen://action/seek?source=paizo-pathfinder-player-core)
  a creature or object within the range of your scent.'
mechanicsScope: builder
rules:
- key: scent
  effect: core/add-sense@2
  inputs:
    sense: scent
    acuity: imprecise
    range: 30
- key: perception-circumstance-bonus-seek
  effect: core/add-modifier
  inputs:
    target: perception
    amount: 2
    type: circumstance
    when: Seek
