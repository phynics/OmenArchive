---
name: sewer rat
ancestry: ratfolk
rarity: common
description: You come from a long line of ratfolk with a community based in the sewers
  beneath a large settlement. You are immune to the disease putrid plague. You gain
  a +1 circumstance bonus to saving throws against diseases and poisons. If you roll
  a success on a saving throw against a disease or poison, you get a critical success
  instead. If you have a different ability that would improve the save in this way
  (such as the Battle Hardened fighter class feature), if you roll a critical failure
  on the save you get a failure instead.
mechanicsScope: mixed
rules:
- key: flat-modifier-1
  effect: core/add-roll-modifier@2
  inputs:
    target:
      description:
      - anyNonPerceptionSavingThrow: {}
    description: 'Sewer Rat: +1 circumstance bonus to saving throws (in some situations).'
    numeric: {literal: {amount: 1, applicability: {description: in some situations,
          kind: situational}, type: circumstance}}
