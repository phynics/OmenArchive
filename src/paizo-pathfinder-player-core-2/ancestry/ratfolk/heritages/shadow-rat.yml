---
name: shadow rat
ancestry: ratfolk
rarity: common
description: 'Your ancestors lived in dark spaces underground, granting you dark fur
  and a vaguely unnatural mien. You gain the trained proficiency rank in Intimidation
  and can use Intimidation to [Coerce](omen://action/coerce?source=paizo-pathfinder-player-core)
  animals. When you [Demoralize](omen://action/demoralize?source=paizo-pathfinder-player-core)
  an animal, you don''t take a penalty for not sharing a language with it. If you
  would automatically become trained in Intimidation \(from your background or class,
  for example\), you become trained in another skill of your choice.

  Animals'' attitudes toward you begin one degree worse than normal, usually starting
  at unfriendly instead of indifferent for domesticated animals, and hostile instead
  of unfriendly for wild animals.'
mechanicsScope: builder
rules:
- key: active-effect-like-1
  effect: core/add-skill-increase
  inputs:
    skill: {kind: intimidation}
    proficiencyCap: 2
