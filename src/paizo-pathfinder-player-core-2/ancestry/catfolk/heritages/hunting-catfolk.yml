---
name: hunting catfolk
ancestry: catfolk
rarity: common
description: 'You come from a long line of skilled hunters and trackers and have a
  particularly keen sense of smell. You gain imprecise scent with a range of 30 feet.
  This means you can use your sense of smell to determine a creature''s location.
  The GM will usually double the range if you''re downwind from the creature or halve
  the range if you''re upwind.

  In addition, you gain a +2 circumstance bonus to [Track](omen://action/track?source=paizo-pathfinder-player-core)
  a creature or object if you''ve smelled it before.'
mechanicsScope: builder
rules:
- key: survival-circumstance-bonus-track
  effect: core/add-modifier@2
  inputs:
    target: survival
    amount: 2
    type: circumstance
    when: Track
- key: scent
  effect: core/add-sense@2
  inputs:
    sense: scent
    acuity: imprecise
    range: 30
