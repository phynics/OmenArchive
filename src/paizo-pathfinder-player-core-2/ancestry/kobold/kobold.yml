description: 'Every kobold instinctively understands the importance of power, and
  many are inclined to venerate those who have it, whether they be mighty dragons,
  cruel fiends, imperious fey, or even ancient artifacts. Kobolds seek out these alliances
  out of a sense of pragmatism—after all, who would dare bully a kobold who serves
  an ancient dragon?—but also because kobold eggs incubated near such loci of power
  take on physical traits \(and sometimes abilities\) similar to those of the warren''s
  benefactor. On their own, kobolds are ingenious crafters and devoted allies, but
  outsiders who trespass into their territory find them to be inspired skirmishers
  and clever ambushers. However, these reptilian opportunists prove happy to cooperate
  with other humanoids when it''s to their benefit, combining caution and cunning
  to make their fortunes in the wider world.

