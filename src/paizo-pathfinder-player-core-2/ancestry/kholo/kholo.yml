description: 'Kholo have bad reputations as brutal raiders and demon-worshipers. Many
  believe that kholo are witches, cannibals, and worse. The truth is more complex.
  Kholo are eminently practical and pragmatic hunters and raiders. To them, honor
  is just another word for pointless risk. Any loss of a kholo affects not just the
  individual, but their packmates and kin as well. Wasting time on anything but victory,
  whether it''s mercy or cruelty, is seen as little shy of immoral. Kholo are masters
  of ambushes, tactical feints, and psychological warfare. Equally misunderstood is
  the kholo practice of ancestor worship and endocannibalism. Kholo consume their
  dead as a sign of reverence, holding a grand feast and transforming the bones into
  art or weapons. Kholo extend this honor to respected foes, hoping to bring their
  enemy''s cunning or strength into the clan.

  [Kholo](omen://ancestry/kholo?source=paizo-pathfinder-player-core-2)'
