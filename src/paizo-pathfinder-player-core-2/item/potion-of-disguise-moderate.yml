description: 'Activate 1 (manipulate)

  Upon imbibing this potion, you take on the appearance of a specific type of creature
  for [[/br 2d12 #hours]]{2d12 hours}. The type of creature is determined when the
  potion is created. For example, you might have a potion of elf disguise or potion
  of frog disguise. Drinking the potion doesn''t impart the knowledge of how long
  the effect lasts; the GM rolls the duration in secret.

  The disguise doesn''t change your traits or statistics, nor does it give you any
  of the special abilities of the creature you''re imitating. It might affect what
  items you can hold or wear (for example, your new form might lack opposable thumbs).
  The potion shrinks you down to a minimum of size Tiny, or increases your size if
  the creature is larger than you, to a maximum of Large. This does not change any
  of your statistics, with the exception of reducing your reach to 0 as a Tiny creature.
  The creature has to be of a specific kind, such as "leopard" or "lion" rather than
  just "cat", or "fire giant" or "ogre" rather than just "giant", but the potion can''t
  cause you to mimic a specific individual creature.

  The effects of this potion use the same rules as the Impersonate activity of Deception.
  Onlookers always assume you''re the chosen type of creature unless they''re actively
  Seeking. You gain a +4 status bonus to your Deception DC against such Perception
  checks and add your level even if untrained.'
