description: 'You set a cunning wire to trip a creature. A Medium or smaller creature
  that enters this snare''s square must attempt a reflex|showDC:all|dc:21 save.

  If you want to create a trip snare to trip a larger creature, you must create a
  group of contiguous snares of a length equal to the edge of that larger creature''s
  space, and the creature must be moving such that it moves into the full set of snares.
  For example, three trip snares in a 15-foot-line can trip a Huge creature coming
  down a corridor into the line of snares.'
