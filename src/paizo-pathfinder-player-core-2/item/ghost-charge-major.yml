  only undead and creatures with void healing. A primary target that takes damage
  from a ghost charge becomes Enfeebled 2 until the start of your next turn.

  Ghost charges are designed to explode even on contact with a spiritual substance,
  making them ideal for damaging incorporeal undead.'
