  melee weapon with the effects of a +2 weapon potency rune. They deal 2d8 piercing
  damage and have the deadly d12 and unholy traits. On a critical hit with the horns,
  the target must succeed at a DC 30 Fortitude save or become [Drained 1](omen://condition/drained?source=paizo-pathfinder-player-core)
  \(or [Drained 2](omen://condition/drained?source=paizo-pathfinder-player-core) on
