  gemstones that seem to move and undulate at the corner of your vision. While wielding
  the staff, you can peer through the eyes on the staff rather than your own, using
  your normal visual senses \\(including any benefits of spells like [See the Unseen](omen://spell/see-the-unseen?source=paizo-pathfinder-player-core)\\).
  You can maneuver the staff to see things around corners, at higher elevations, or
  in places where the staff can fit but your head can't. This doesn't provide sufficient
  line of effect to target creatures around corners. The eyes are as vulnerable as
  your eyes and can be affected by anything that alters your vision, such as a blinding
  flash of light.\nActivate Cast a Spell\nEffect You expend a number of charges from
