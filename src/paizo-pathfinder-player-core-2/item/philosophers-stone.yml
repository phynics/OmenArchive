description: "Activate 1 \\(manipulate\\) or 1 or more days; see below\nAn alchemist
  with the [Craft Philosopher's Stone](omen://feat/craft-philosophers-stone?source=paizo-pathfinder-player-core-2)
  feat adds the formula for this item to their formula book. This allows them to create
  a philosopher's stone once per month during their daily preparations using advanced
  alchemy. Unlike other items created with advanced alchemy, the philosopher's stone
  remains potent for 1 month or until the alchemist creates a new one. This is the
  only way to create a philosopher's stone.\nAt a glance, a philosopher's stone appears
  to be an ordinary, sooty piece of natural rock. Breaking the rock open with a [Force
  Open](omen://action/force-open?source=paizo-pathfinder-player-core) action \\(DC
  35\\) reveals a cavity at the stone's heart. The cavity is lined with a rare type
  of quicksilver that can transmute base metals into precious metals or create an
  elixir of rejuvenation.\nTo use the quicksilver, you must be legendary in Crafting
  and have the Alchemical Crafting feat. You can then use the stone's quicksilver
  for one of two effects.\n\t•\tYou can apply the stone's quicksilver to an infused
  Elixir of Life \\(True\\) using an Interact action. This turns the elixir into an
  infused [Elixir of Rejuvenation](omen://item/elixir-of-rejuvenation?source=paizo-pathfinder-player-core-2)
  instantaneously. This doesn't require any crafting time or additional materials.\n\t•\tYou
  can spend up to a month of downtime applying the quicksilver either to iron to create
  silver or to lead to create gold. Treat this as a 20th-level task to [Earn Income](omen://action/earn-income?source=paizo-pathfinder-player-core)
  using Crafting, except that you create 500 gp worth of your chosen metal per day
  on a success or 750 gp worth per day on a critical success."
