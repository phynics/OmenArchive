description: 'This magic ring seems like simple tarnished brass, but it enhances your
  curiosity about traps and devices of all kinds.

  You can use an Interact action to pull a [Thieves'' Toolkit](omen://item/thieves-toolkit?source=paizo-pathfinder-player-core)
  from the ring. This toolkit appears in your hand and any part of it folds back into
  the ring if they would leave your possession.

  They grant you a +3 item bonus to Thievery checks to [Disable a Device](omen://action/disable-a-device?source=paizo-pathfinder-player-core)
  and to [Pick a Lock](omen://action/pick-a-lock?source=paizo-pathfinder-player-core),
  and the ring''s insights grant you the same bonus to Crafting checks to [Craft](omen://action/craft?source=paizo-pathfinder-player-core)
  and [Repair](omen://action/repair?source=paizo-pathfinder-player-core) snares and
  traps.

  Activate—Fireball Trap 10 minutes \(manipulate\)

  Effect You create the effects of a [Rune Trap](omen://spell/rune-trap?source=paizo-pathfinder-player-core)
  ritual containing your choice of either a 7th-rank [Howling Blizzard](omen://spell/howling-blizzard?source=paizo-pathfinder-player-core)
  or 7th-rank [Fireball](omen://spell/fireball?source=paizo-pathfinder-player-core).
  You can have only one trapped rune from a ring of maniacal devices active at a time,
  even if you have multiple rings, and the rune disappears if you lose your investiture
  in the ring.'
