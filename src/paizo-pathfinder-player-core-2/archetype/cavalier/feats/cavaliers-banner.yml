  CAVALIER PLEDGES

  Many cavaliers pledge themselves in service to a specific organization or individual,
  such as a noble family or sovereign ruler, a knightly order or another organization,
  or a particular ideal. A cavalier pledged to an order or ideal must uphold its edicts
  and is beholden to any anathema it has; for example, a cavalier pledged to the druid''s
  animal order would be tied to that anathema, while a cavalier pledged to the church
  of Abadar would be held to the same standards as a cleric of that god. If you pledge
  yourself to an entity or cause without a stated anathema, you should work with your
  GM to determine the edicts and anathema associated with your pledge.

  Cavaliers who have pledged themselves can gain access to certain abilities related
  to that pledge, such as Cavalier''s Banner. If you violate the anathema of your
  pledge, you lose access to those feats until you benefit from an Atone ritual. Changing
  the subject of your pledge is equivalent to retraining a class feature.'
