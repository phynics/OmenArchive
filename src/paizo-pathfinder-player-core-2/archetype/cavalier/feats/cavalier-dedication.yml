  that's at least one size larger than you, but if the animal usually starts as Small,
  you can begin with a Medium version of that animal \(changing no statistics other
  than its size\).
specialText: If you have pledged yourself to a cause, you can take a second dedication
  feat closely tied to that cause even if you haven't taken two additional [Cavalier](omen://archetype/cavalier?source=paizo-pathfinder-player-core-2)
  feats. For instance, if you pledged yourself to fight crime with a group of vigilantes,
  you could take the vigilante dedication without first completing the cavalier archetype.
