---
name: scroll trickster dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
prerequisites:
- text: trained in Arcana, Nature, Occultism, or Religion
  anyOf:
  - hasSkillProficiency: {skill: arcana, rank: trained}
  - hasSkillProficiency: {skill: nature, rank: trained}
  - hasSkillProficiency: {skill: occultism, rank: trained}
  - hasSkillProficiency: {skill: religion, rank: trained}
description: 'You''ve studied scrolls in depth. This might have been a comprehensive
  education in formal setting, or the sort of education where you somehow obtain a
  number of scrolls and try not to explode anything you didn''t mean to explode.

  You gain the [Trick Magic Item](omen://feat/trick-magic-item?source=paizo-pathfinder-player-core)
  feat, and you gain a +2 circumstance bonus to skill checks to Trick scrolls. If
  you roll a critical failure to Trick a Magic Item that''s a scroll, you get a failure
  instead.'
mechanicsScope: builder
foundryID: uxHWqFbYD0ZvkeF8
rules:
- key: skills-circumstance-bonus-trick-magic-scroll
  effect: core/add-modifier@2
  inputs:
    target: skills
    amount: 2
    type: circumstance
    when: Trick Magic Item; the effect has the scroll trait
- key: skills-trick-magic-scroll-critical-failure-note
  effect: core/add-note
  inputs:
    target: skills
    text: When you roll a critical failure on a skill check, the result is one degree
      better.
    when: Trick Magic Item; the effect has the scroll trait
- key: trick-magic-item-feat
  effect: core/add-feat@3
  inputs:
    feat: '@feat.trick-magic-item?source=paizo-pathfinder-player-core'
