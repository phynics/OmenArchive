---
name: monk dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
- multiclass
prerequisites:
- text: Strength +2
  hasAttributeModifier: {attribute: strength, modifier: 2}
- text: Dexterity +2
  hasAttributeModifier: {attribute: dexterity, modifier: 2}
- text: not a member of the monk class
  anyOf:
  - hasClassWithName: alchemist
  - hasClassWithName: barbarian
  - hasClassWithName: bard
  - hasClassWithName: champion
  - hasClassWithName: cleric
  - hasClassWithName: druid
  - hasClassWithName: fighter
  - hasClassWithName: investigator
  - hasClassWithName: oracle
  - hasClassWithName: ranger
  - hasClassWithName: rogue
  - hasClassWithName: sorcerer
  - hasClassWithName: swashbuckler
  - hasClassWithName: witch
  - hasClassWithName: wizard
description: You become trained in unarmed attacks and gain the [Powerful Fist](omen://class/monk/features/powerful-fist)
  class feature. You become trained in your choice of Acrobatics or Athletics; if
  you are already trained in both of these skills, you become trained in a skill of
  your choice. You become trained in monk class DC.
mechanicsScope: builder
foundryID: renUpSO6MJXPSXow
rules:
- key: choice-monk-class-dc-attribute
  choice:
    name: $.monk.class-dc-attribute
    label: Monk class DC attribute
    type: core/attribute
    cases: [strength, dexterity]
- key: dedication-class-dc
  effect: core/add-class-dc@2
  inputs:
    rank: trained
    className: monk
    keyAttribute: {choice: $.monk.class-dc-attribute}
- key: unarmed-attacks-trained
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {category: unarmed}
    rank: trained
- key: grant-features-powerful-fist
  effect: core/add-feature@2
  inputs:
    feature: '@class.monk.features.powerful-fist'
- key: choice-skill
  level: 2
  choice:
    name: $.feats.monk-dedication.skill
    label: Skill
    type: core/skill
    cases:
    - {key: acrobatics, value: acrobatics}
    - {key: athletics, value: athletics}
- key: chosen-skill-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: {choice: $.feats.monk-dedication.skill}
    rank: trained
