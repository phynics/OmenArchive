---
name: investigator dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
- multiclass
prerequisites:
- text: Intelligence +2
  hasAttributeModifier: {attribute: intelligence, modifier: 2}
- text: not a member of the investigator class
  anyOf:
  - hasClassWithName: alchemist
  - hasClassWithName: barbarian
  - hasClassWithName: bard
  - hasClassWithName: champion
  - hasClassWithName: cleric
  - hasClassWithName: druid
  - hasClassWithName: fighter
  - hasClassWithName: monk
  - hasClassWithName: oracle
  - hasClassWithName: ranger
  - hasClassWithName: rogue
  - hasClassWithName: sorcerer
  - hasClassWithName: swashbuckler
  - hasClassWithName: witch
  - hasClassWithName: wizard
description: You gain the [On the Case](omen://class/investigator/features/on-the-case)
  class feature, which grants you both the [Pursue a Lead](omen://action/pursue-a-lead)
  activity and [Clue In](omen://action/clue-in) reaction. You become trained in Society
  and another skill of your choice. If you were already trained in Society, you instead
  become trained in an additional skill of your choice. You also become trained in
  investigator class DC.
mechanicsScope: builder
foundryID: CZXhJS55rG5H6PpB
rules:
- key: dedication-class-dc
  effect: core/add-class-dc@2
  inputs:
    rank: trained
    className: investigator
    keyAttribute: intelligence
- key: choice-feats-investigator-dedication-additional-skill
  choice:
    name: $.feats.investigator-dedication.additional-skill
    label: Skill
    type: core/skill
    cases:
    - {key: acrobatics, value: acrobatics}
    - {key: arcana, value: arcana}
    - {key: athletics, value: athletics}
    - {key: crafting, value: crafting}
    - {key: deception, value: deception}
    - {key: diplomacy, value: diplomacy}
    - {key: intimidation, value: intimidation}
    - {key: medicine, value: medicine}
    - {key: nature, value: nature}
    - {key: occultism, value: occultism}
    - {key: performance, value: performance}
    - {key: religion, value: religion}
    - {key: stealth, value: stealth}
    - {key: survival, value: survival}
    - {key: thievery, value: thievery}
- key: additional-skill-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: {choice: $.feats.investigator-dedication.additional-skill}
    rank: trained
- key: grant-features-on-the-case
  effect: core/add-feature@2
  inputs:
    feature: '@class.investigator.features.on-the-case'
- key: society-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: society
    rank: trained
