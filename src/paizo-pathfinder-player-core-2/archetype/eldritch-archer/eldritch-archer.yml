name: eldritch archer
entryFeat: omen://archetype/eldritch-archer/feats/eldritch-archer-dedication?source=paizo-pathfinder-player-core-2
description: 'You channel powerful magic with your archery, allowing you to deliver
  potent spells through the tip of an arrow rather than the more mundane flick of
  the wrist or whatever other gestures are usually used.

  If you don''t already cast spells from spell slots, you learn to cast spontaneous
  spells and gain the Cast a Spell activity. You gain a spell repertoire with one
  cantrip of your choice, from a tradition of your choice. You choose a common cantrip
  or other cantrip to which you have access. This cantrip must require a spell attack
  roll and come from your chosen tradition. You''re trained in spell attack modifier
  and spell DC. Your key spellcasting attribute for these spells is Charisma. Regardless
  of whether you can already cast spells or gained the ability from this dedication,
  you gain the Eldritch Shot activity.'
