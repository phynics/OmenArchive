description: 'You can concentrate an immense amount of magic to create a piece of
  ammunition that phases through everything but your target.

  Make a bow or crossbow Strike against a foe who is [Observed](omen://condition/observed?source=paizo-pathfinder-player-core)
  or [Hidden](omen://condition/hidden?source=paizo-pathfinder-player-core) to you
  \(but not [Undetected](omen://condition/undetected?source=paizo-pathfinder-player-core)\).

  The ammunition travels to your target in a straight line, passing through any non-magical
  barriers or walls in its way, though magical barriers stop the arrow. The shot ignores
  all cover, the [Concealed](omen://condition/concealed?source=paizo-pathfinder-player-core)
  condition, the hidden condition, and circumstance bonuses to AC from shields. It
  has a +4 status bonus to hit creatures wearing any type of armor.

  The Strike''s damage can''t be reduced with a Shield Block reaction using a non-magical
  shield.'
