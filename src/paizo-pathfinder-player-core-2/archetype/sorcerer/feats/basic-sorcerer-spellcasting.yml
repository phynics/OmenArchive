---
name: basic sorcerer spellcasting
level: 4
rarity: common
type: archetype
traits:
- archetype
prerequisites:
- text: Sorcerer Dedication
  has: '@archetype.sorcerer.feats.sorcerer-dedication'
description: 'You gain the Basic Spellcasting Feat benefits. Each time you gain a
  spell slot of a new level from the sorcerer archetype, add a spell of the appropriate
  spell rank to your repertoire: a common spell of your bloodline''s tradition, one
  of your bloodline''s granted spells, or another spell you have learned or discovered.'
mechanicsScope: builder
foundryID: AvfswILmh3BwNbyR
rules:
- key: slot-4-1
