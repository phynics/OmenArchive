---
name: blessed one dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
description: 'You are touched by a deity and gifted with the ability to alleviate
  the suffering of others.

  You gain the [Lay on Hands](omen://spell/lay-on-hands?source=paizo-pathfinder-player-core-2)
  devotion spell. You can [Refocus](omen://action/refocus?source=paizo-pathfinder-player-core)
  by meditating, whether you reflect on the deity granting the blessing or not, allowing
  your blessing to refill your focus pool. Your devotion spells from the blessed one
  archetype are divine spells. You become trained in spell attack modifier and spell
  DC. Your spellcasting attribute is Charisma.

  [Blessed One](omen://archetype/blessed-one?source=paizo-pathfinder-player-core-2)'
mechanicsScope: mixed
unsupportedReason: Lay on Hands, its focus source and the spell statistics are modeled.
  Refocusing without a deity is not yet.
foundryID: eBdajOzs8kiJDic2
rules:
- key: dedication-spell-proficiency
  effect: spellcasting/increase-spell-proficiency@2
  inputs:
    rank: trained
- key: blessed-one-focus-source
  effect: spellcasting/configure-source
  inputs:
    source: blessed-one-focus-spells
    sourceName: Blessed One Focus Spells
    castingKind: focus
    tradition: divine
    attribute: charisma
- key: grant-lay-on-hands
  effect: spellcasting/grant-focus-spell@2
