description: 'You are touched by a deity and gifted with the ability to alleviate
  the suffering of others.

  You gain the Lay on Hands devotion spell. You can Refocus by meditating, whether
  you reflect on the deity granting the blessing or not, allowing your blessing to
  refill your focus pool. Your devotion spells from the blessed one archetype are
  divine spells. You become trained in spell attack modifier and spell DC. Your spellcasting
  attribute is Charisma.'
