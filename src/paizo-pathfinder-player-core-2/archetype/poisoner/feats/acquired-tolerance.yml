description: A small amount of poison, taken at nonlethal doses, can help the body
  build up resistance against a more deadly dosage. Reroll the triggering check and
  use the second result. Once you use Acquired Tolerance, you can continue to use
  it against the same type of poison that day, but you can't use it against a different
  type of poison until after you make your next daily preparations. For instance,
  if you used the reaction on a save against [Giant Scorpion Venom](omen://item/giant-scorpion-venom?source=paizo-pathfinder-player-core-2),
  you could use it again against giant scorpion venom even if it came from a different
  source, but you couldn't use it against [Wyvern Poison](omen://item/wyvern-poison?source=paizo-pathfinder-player-core-2).
