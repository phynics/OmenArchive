description: 'You have studied the art of crafting snares and laying traps, and few
  have shown more talent in these arts than you. You gain the Snare Crafting feat.
  When you set a snare, the DC of any saving throw it requires uses the higher of
  your class DC or the snare''s DC. If a snare normally takes 1 minute to Craft, you
  can Craft it with 3 Interact actions instead.

  Each day during your daily preparations, you can prepare four snares from your formula
  book for quick deployment (increasing to six snares if you''re a master in Crafting
  and eight if you''re legendary). Snares prepared in this way don''t cost you any
  resources to Craft.

  When you increase your proficiency rank in Crafting to expert, master, or legendary,
  add three additional snare formulas to your formula book. The snares must be of
  your level or lower.'
