description: 'From childhood, you have been exposed to traditional viking combat techniques,
  and you soon learned to handle axe, sword, and shield in battle. Now, you can raid
  proudly alongside your fellows. You gain the [Shield Block](omen://feat/shield-block?source=paizo-pathfinder-player-core)
  reaction. Additionally, you have familiarity with the [Battle Axe](omen://item/battle-axe?source=paizo-pathfinder-player-core),
  [Hatchet](omen://item/hatchet?source=paizo-pathfinder-player-core), [Longsword](omen://item/longsword?source=paizo-pathfinder-player-core),
  [Shield Boss](omen://item/shield-boss?source=paizo-pathfinder-player-core), [Shield
  Spikes](omen://item/shield-spikes?source=paizo-pathfinder-player-core), and [Shortsword](omen://item/shortsword?source=paizo-pathfinder-player-core)—for
  the purposes of proficiency, you treat any of these weapons as simple weapons.

  At 5th level, whenever you get a critical hit with one of these weapons, you get
  its critical specialization effect.'
