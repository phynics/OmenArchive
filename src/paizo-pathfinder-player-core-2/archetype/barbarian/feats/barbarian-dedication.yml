---
name: barbarian dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
- multiclass
prerequisites:
- text: Strength +2
  hasAttributeModifier: {attribute: strength, modifier: 2}
- text: Constitution +2
  hasAttributeModifier: {attribute: constitution, modifier: 2}
- text: not a member of the barbarian class
  anyOf:
  - hasClassWithName: alchemist
  - hasClassWithName: bard
  - hasClassWithName: champion
  - hasClassWithName: cleric
  - hasClassWithName: druid
  - hasClassWithName: fighter
  - hasClassWithName: investigator
  - hasClassWithName: monk
  - hasClassWithName: oracle
  - hasClassWithName: ranger
  - hasClassWithName: rogue
  - hasClassWithName: sorcerer
  - hasClassWithName: swashbuckler
  - hasClassWithName: witch
  - hasClassWithName: wizard
description: 'You become trained in Athletics; if you were already trained in Athletics,
  you instead become trained in a skill of your choice. You become trained in barbarian
  class DC.

  You can use the Rage action. While raging, you take a –1 penalty to AC.

  Choose an instinct as you would if you were a barbarian. You have that instinct
  for all purposes, but you don''t gain any of the other abilities it grants. If that
  instinct has anathema, you''re bound by them.'
mechanicsScope: builder
foundryID: WVU0c8rgcpGSRqSi
rules:
- key: dedication-class-dc
  effect: core/add-class-dc@2
  inputs:
    rank: trained
    className: barbarian
    keyAttribute: strength
- key: choice-barbarian-instinct
  choice:
    name: $.barbarian.instinct
    label: Instinct
    type: core/feature-id
    records: {filter: {pathPrefix: '@class.barbarian.instincts'}}
- key: grant-features-rage
  effect: core/add-feature@2
  inputs:
    feature: '@class.barbarian.features.rage'
- key: athletics-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: athletics
    rank: trained
