---
name: swashbuckler dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
- multiclass
prerequisites:
- text: Charisma +2
  hasAttributeModifier: {attribute: charisma, modifier: 2}
- text: Dexterity +2
  hasAttributeModifier: {attribute: dexterity, modifier: 2}
description: Choose a swashbuckler's style. You gain the [Panache](omen://class/swashbuckler/features/panache)
  and [Stylish Combatant](omen://class/swashbuckler/features/stylish-combatant) class
  features, and you apply the bravado trait to [Tumble Through](omen://action/tumble-through?source=paizo-pathfinder-player-core)
  and any actions indicated in your swashbuckler style, allowing you to gain panache.
  You become trained in Acrobatics or the skill associated with your style. If you
  were already trained in both skills, you instead become trained in a skill of your
  choice. You also become trained in swashbuckler class DC. You don't gain any other
  effects of your chosen style.
mechanicsScope: mixed
unsupportedCategory: benefit
unsupportedReason: What the dedication trains (class DC, spell attack and DC) is modeled.
  The rest of it is not yet.
foundryID: eAlrvPVb8qt8Lruw
rules:
- key: dedication-class-dc
  effect: core/add-class-dc@2
  inputs:
    rank: trained
    className: swashbuckler
    keyAttribute: dexterity
- key: choice-swashbucklers-style
  level: 2
  choice:
    name: $.feats.swashbuckler-dedication.swashbucklers-style
    label: Style
    type: core/feature-id
    records: {filter: {pathPrefix: '@class.swashbuckler.styles'}}
- key: chosen-skill-list
  effect: core/declare-list
  level: 2
  inputs:
    list: $.feats.swashbuckler-dedication.skills
    valueType: core/skill
    label: Skills
- key: add-acrobatics-skill
  effect: core/add-to-list
  level: 2
  inputs:
    list: $.feats.swashbuckler-dedication.skills
    value: {type: core/skill, literal: acrobatics}
- key: add-performance-skill
  effect: core/add-to-list
  level: 2
  prerequisites:
  - hasChoice:
      name: $.feats.swashbuckler-dedication.swashbucklers-style
      equals: {type: core/feature-id, value: '@class.swashbuckler.styles.battledancer'}
  inputs:
    list: $.feats.swashbuckler-dedication.skills
    value: {type: core/skill, literal: performance}
- key: add-intimidation-skill
  effect: core/add-to-list
  level: 2
  prerequisites:
  - hasChoice:
      name: $.feats.swashbuckler-dedication.swashbucklers-style
      equals: {type: core/feature-id, value: '@class.swashbuckler.styles.braggart'}
  inputs:
    list: $.feats.swashbuckler-dedication.skills
    value: {type: core/skill, literal: intimidation}
- key: add-deception-skill
  effect: core/add-to-list
  level: 2
  prerequisites:
  - hasChoice:
      name: $.feats.swashbuckler-dedication.swashbucklers-style
      equals: {type: core/feature-id, value: '@class.swashbuckler.styles.fencer'}
  inputs:
    list: $.feats.swashbuckler-dedication.skills
    value: {type: core/skill, literal: deception}
- key: add-athletics-skill
  effect: core/add-to-list
  level: 2
  prerequisites:
  - hasChoice:
      name: $.feats.swashbuckler-dedication.swashbucklers-style
      equals: {type: core/feature-id, value: '@class.swashbuckler.styles.gymnast'}
  inputs:
    list: $.feats.swashbuckler-dedication.skills
    value: {type: core/skill, literal: athletics}
- key: add-thievery-skill
  effect: core/add-to-list
  level: 2
  prerequisites:
  - hasChoice:
      name: $.feats.swashbuckler-dedication.swashbucklers-style
      equals: {type: core/feature-id, value: '@class.swashbuckler.styles.rascal'}
  inputs:
    list: $.feats.swashbuckler-dedication.skills
    value: {type: core/skill, literal: thievery}
- key: add-diplomacy-skill
  effect: core/add-to-list
  level: 2
  prerequisites:
  - hasChoice:
      name: $.feats.swashbuckler-dedication.swashbucklers-style
      equals: {type: core/feature-id, value: '@class.swashbuckler.styles.wit'}
  inputs:
    list: $.feats.swashbuckler-dedication.skills
    value: {type: core/skill, literal: diplomacy}
- key: choice-skill
  level: 2
  choice:
    name: $.feats.swashbuckler-dedication.skill
    label: Skill
    prerequisites:
    - $.feats.swashbuckler-dedication.swashbucklers-style
    optionsFrom: $.feats.swashbuckler-dedication.skills
    type: core/skill
    cases:
    - {key: acrobatics, value: acrobatics}
    - {key: performance, value: performance}
    - {key: intimidation, value: intimidation}
    - {key: deception, value: deception}
    - {key: athletics, value: athletics}
    - {key: thievery, value: thievery}
    - {key: diplomacy, value: diplomacy}
- key: chosen-skill-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: {choice: $.feats.swashbuckler-dedication.skill}
    rank: trained
