---
name: pirate combat training
level: 4
rarity: common
type: archetype
traits:
- archetype
prerequisites:
- text: Pirate Dedication
  has: '@archetype.pirate.feats.pirate-dedication'
description: 'You''re particularly skilled at wielding the weapons used traditionally
  by pirates. You gain either the [Combat Climber](omen://feat/combat-climber?source=paizo-pathfinder-player-core)
  or [Underwater Marauder](omen://feat/underwater-marauder?source=paizo-pathfinder-player-core)
  skill feat, even if you do not meet its prerequisites. You have familiarity with
  the following weapons: [Hatchet](omen://item/hatchet?source=paizo-pathfinder-player-core),
  [Rapier](omen://item/rapier?source=paizo-pathfinder-player-core), [Scimitar](omen://item/scimitar?source=paizo-pathfinder-player-core),
  and [Whip](omen://item/whip?source=paizo-pathfinder-player-core)—for the purposes
  of proficiency, you treat any of these weapons as simple weapons. Your GM may add
  additional martial weapons to this list as appropriate for your world or region.

  At 5th level, whenever you get a critical hit with one of these weapons, you get
  its critical specialization effect.'
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: Its change to the character's Strikes is a note on their attack
  or damage rolls; the sheet's numbers don't include it.
