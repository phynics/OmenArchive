---
name: alchemist dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
- multiclass
prerequisites:
- text: Intelligence +2
  hasAttributeModifier: {attribute: intelligence, modifier: 2}
- text: not a member of the alchemist class
  anyOf:
  - hasClassWithName: barbarian
  - hasClassWithName: bard
  - hasClassWithName: champion
  - hasClassWithName: cleric
  - hasClassWithName: druid
  - hasClassWithName: fighter
  - hasClassWithName: investigator
  - hasClassWithName: monk
  - hasClassWithName: oracle
  - hasClassWithName: ranger
  - hasClassWithName: rogue
  - hasClassWithName: sorcerer
  - hasClassWithName: swashbuckler
  - hasClassWithName: witch
  - hasClassWithName: wizard
description: 'You put your alchemical interest into practice. You become trained in
  alchemical bombs, the alchemist class DC, and Crafting; if you were already trained
  in Crafting, you instead become trained in a skill of your choice.

  You gain the Quick Alchemy benefits, creating up to 4 versatile vials during your
  daily preparations. Add the formulas for four additional common alchemical items
  to your formula book, in addition to those you gain from Alchemical Crafting.'
mechanicsScope: builder
foundryID: CJMkxlxHiHZQYDCz
rules:
- key: dedication-class-dc
  effect: core/add-class-dc@2
  inputs:
    rank: trained
    className: alchemist
    keyAttribute: intelligence
- key: alchemical-bombs-trained
  effect: core/add-weapon-proficiency@3
  inputs:
    weapons: {group: bomb}
    rank: trained
- key: versatile-vials-pool
  effect: core/add-resource-pool
  inputs:
    name: versatile-vials
    maximum: 4
- key: choice-feats-alchemist-dedication-formulas
  choice:
    name: $.feats.alchemist-dedication.formulas
    label: Alchemist Dedication formulas
    multiple: {min: 4, max: 4}
    type: core/item-id
    records:
      filter:
        all:
        - {type: item}
        - {trait: alchemical}
        - {rarity: common}
- key: learn-choice-feats-alchemist-dedication-formulas
  forEach: $.feats.alchemist-dedication.formulas
  effect: core/add-to-list
  inputs:
    list: $.crafting.formulas
    value: {item: true}
- key: crafting-trained
  effect: core/add-skill-increase@2
  inputs:
    skill: crafting
    rank: trained
- key: alchemical-crafting-feat
  effect: core/add-feat@3
  inputs:
    feat: '@feat.alchemical-crafting?source=paizo-pathfinder-player-core'
- key: quick-alchemy-action
  effect: core/add-action@2
  inputs:
    action: '@action.quick-alchemy'
