---
name: alchemist dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
- multiclass
prerequisites:
- text: Intelligence +2
  hasAttributeModifier: {attribute: intelligence, modifier: 2}
description: 'You put your alchemical interest into practice. You become trained in
  alchemical bombs, the alchemist class DC, and Crafting; if you were already trained
  in Crafting, you instead become trained in a skill of your choice.

  You gain the Quick Alchemy benefits, creating up to 4 versatile vials during your
  daily preparations. Add the formulas for four additional common alchemical items
  to your formula book, in addition to those you gain from Alchemical Crafting.'
mechanicsScope: mixed
unsupportedCategory: benefit
unsupportedReason: What the dedication trains (class DC) is modeled. The rest of it
  is not yet.
