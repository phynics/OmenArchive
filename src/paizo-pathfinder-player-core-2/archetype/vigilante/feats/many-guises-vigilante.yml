description: 'You can take on any number of mundane guises.

  Whenever you change your identity, instead of taking on your social or vigilante
  identity, you can become someone completely ordinary. This identity isn''t a specific
  individual—rather, you become a nondescript member of your ancestry, of any gender,
  and from a mundane occupation such as common laborer, farmer, or peasant.

  Spells and abilities detect you as if you were this ordinary identity, rather than
  either of your two real identities, unless they succeed at a counteract check against
  the same Deception DC used for Vigilante Dedication. Using class or dedication abilities
  ends this disguise.'
