---
name: marshal dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
prerequisites:
- text: trained in martial weapons and either Diplomacy or Intimidation
  unsupported: Unsupported prerequisite for source MYzRfNExDYp25rro "trained in martial
    weapons and either Diplomacy or Intimidation".
  diagnostic: true
description: 'You''ve combined your social skills and combat training to become a
  talented combat leader. Choose Diplomacy or Intimidation. You become trained in
  that skill or become an expert if you were already trained in it.

  In addition, you''re surrounded by a marshal''s aura in a emanation. Your aura has
  the emotion, mental, and visual traits and grants you and allies within the aura
  a +1 status bonus to saving throws against fear.'
mechanicsScope: mixed
unsupportedCategory: scope
unsupportedReason: 'Rule elements not applied: Aura.'
foundryID: MYzRfNExDYp25rro
rules:
- key: options-marshal-skill
  effect: core/declare-list
  level: 2
  inputs:
    list: $.feats.marshal-dedication.marshal-skill-options
    valueType: core/skill
- key: allow-marshal-skill-diplomacy
  effect: core/add-to-list
  level: 2
  prerequisites:
  - hasChoice:
      name: $.skills.diplomacy.rank
      oneOf:
      - {type: core/int, value: 0}
      - {type: core/int, value: 1}
  inputs:
    list: $.feats.marshal-dedication.marshal-skill-options
    value: {type: core/skill, literal: diplomacy}
- key: allow-marshal-skill-intimidation
  effect: core/add-to-list
  level: 2
  prerequisites:
  - hasChoice:
      name: $.skills.intimidation.rank
      oneOf:
      - {type: core/int, value: 0}
      - {type: core/int, value: 1}
  inputs:
    list: $.feats.marshal-dedication.marshal-skill-options
    value: {type: core/skill, literal: intimidation}
- key: choice-marshal-skill
  level: 2
  prerequisites:
  - anyOf:
    - hasChoice:
        name: $.skills.diplomacy.rank
        oneOf:
        - {type: core/int, value: 0}
        - {type: core/int, value: 1}
    - hasChoice:
        name: $.skills.intimidation.rank
        oneOf:
        - {type: core/int, value: 0}
        - {type: core/int, value: 1}
  choice:
    name: $.feats.marshal-dedication.marshal-skill
    label: Marshal Skill
    optionsFrom: $.feats.marshal-dedication.marshal-skill-options
    type: core/skill
    cases:
    - {key: diplomacy, value: diplomacy}
    - {key: intimidation, value: intimidation}
- key: raise-marshal-skill
  effect: core/add-skill-increase@2
  level: 2
  inputs:
    skill: {choice: $.feats.marshal-dedication.marshal-skill}
    rank: expert
