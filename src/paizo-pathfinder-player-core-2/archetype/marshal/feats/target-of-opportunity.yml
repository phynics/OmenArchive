  hasResourceWithName: marshal dedication
action:
  count: reaction
  requirements: You have a ranged or thrown weapon in hand.
  trigger: An ally succeeds at a ranged Strike against an opponent in your weapon's
    first range increment.
description: You capitalize on your ally's attack and use the opportunity to secure
  a blow of your own, adding to the oncoming barrage. Make a ranged Strike with a
  –2 penalty against the opponent targeted by the triggering attack. This Strike doesn't
  count toward your multiple attack penalty, and your multiple attack penalty doesn't
  apply to this Strike. If this Strike is successful, combine the damage from the
  attack with the damage from your ally's attack for the purpose of resistances and
  weaknesses.
