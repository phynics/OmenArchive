---
name: gladiator dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
prerequisites:
- text: Impressive Performance
  has: '@feat.impressive-performance?source=paizo-pathfinder-player-core'
description: 'You know how to turn combat into a form of entertainment. You gain the
  Additional Lore general feat for Gladiatorial Lore. If you were already trained
  in Gladiatorial Lore, you also become trained in a Lore skill of your choice.

  At the start of a combat encounter, if you have spectators, you gain a number of
  temporary HP equal to your character level for 1 minute and you can roll Performance
  for your initiative. If there are sapient creatures observing a combat encounter,
  and these onlookers are neither engaged in the combat themselves nor directly assisting
  any participants, the combatants have spectators. The GM is the final arbiter of
  whether or not a combat has spectators.'
mechanicsScope: mixed
unsupportedCategory: text
unsupportedReason: Its temporary Hit Points and Performance initiative when a fight
  has spectators are in its text.
foundryID: Dm0YMEvSY0qg0jA0
rules:
