---
name: champion dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
- multiclass
prerequisites:
- text: Strength +2
  hasAttributeModifier: {attribute: strength, modifier: 2}
- text: Charisma +2
  hasAttributeModifier: {attribute: charisma, modifier: 2}
- text: not a member of the champion class
  anyOf:
  - hasClassWithName: alchemist
  - hasClassWithName: barbarian
  - hasClassWithName: bard
  - hasClassWithName: cleric
  - hasClassWithName: druid
  - hasClassWithName: fighter
  - hasClassWithName: investigator
  - hasClassWithName: monk
  - hasClassWithName: oracle
  - hasClassWithName: ranger
  - hasClassWithName: rogue
  - hasClassWithName: sorcerer
  - hasClassWithName: swashbuckler
  - hasClassWithName: witch
  - hasClassWithName: wizard
description: 'Choose a deity. You are bound by your deity''s anathema and gain the
  champion''s aura and sanctification as described in the champion class. Choose a
  cause as you would if you were a champion, with the same options a champion must
  abide by. You gain its edicts and anathema but don''t gain the other abilities.

  You become trained in Religion and your deity''s associated skill; for each of these
  skills in which you were already trained, you instead become trained in a skill
  of your choice. You become trained in champion class DC. If you later gain a devotion
  spell, you become trained in spell attack modifier and spell DC.

  You become trained in light armor and medium armor. If you already were trained
  in light armor and medium armor, you gain training in heavy armor as well. Whenever
  you gain a class feature that grants you expert or greater proficiency in any type
  of armor \(but not unarmored defense\), you also gain that proficiency in the armor
  types granted to you by this feat. If you have a class feature that grants you expert
  proficiency in unarmored defense and you''re 13th level or higher, you also become
  an expert in the armor types granted to you by this feat.'
mechanicsScope: mixed
unsupportedCategory: numbers
unsupportedReason: 'The 13th-level clause (expert in light, medium and heavy armor
  for a character with expert unarmored defense) is only approximated: these ranks
  rise with any armor rank the character gains, unarmored defense included, and are
  not capped at expert.'
foundryID: 0YjetnLVIUz9zQt5
rules:
- key: choice-deity-name
  choice:
    name: $.deity.name
    label: Deity's name
    type: core/string
    freeText: true
- key: choice-deity-sanctification
  choice:
    name: $.deity.sanctification
    label: Sanctification
    type: core/string
    cases:
    - key: holy
      value: holy
      effects:
      - key: add-holy-trait
        effect: core/add-trait
        inputs:
          trait: holy
    - key: unholy
      value: unholy
      effects:
      - key: add-unholy-trait
        effect: core/add-trait
        inputs:
          trait: unholy
    - {value: none}
- key: choice-deity-divine-skill
  choice:
    name: $.deity.divine-skill
    label: Divine skill
    type: core/skill
    cases:
    - {key: acrobatics, value: acrobatics}
    - {key: arcana, value: arcana}
    - {key: athletics, value: athletics}
    - {key: crafting, value: crafting}
    - {key: deception, value: deception}
    - {key: diplomacy, value: diplomacy}
    - {key: intimidation, value: intimidation}
    - {key: medicine, value: medicine}
    - {key: nature, value: nature}
    - {key: occultism, value: occultism}
    - {key: performance, value: performance}
    - {key: religion, value: religion}
    - {key: society, value: society}
    - {key: stealth, value: stealth}
    - {key: survival, value: survival}
    - {key: thievery, value: thievery}
- key: deity-divine-skill
  effect: core/add-skill-increase@2
  inputs:
    skill: {choice: $.deity.divine-skill}
    rank: trained
- key: choice-deity-edicts
  choice:
    name: $.deity.edicts
    label: Edicts
    optional: true
    type: core/string
    freeText: true
- key: choice-deity-anathema
  choice:
    name: $.deity.anathema
    label: Anathema
    optional: true
    type: core/string
    freeText: true
- key: dedication-religion
  effect: core/add-skill-increase@2
  inputs:
    skill: religion
    rank: trained
- key: choice-champion-class-dc-attribute
  choice:
    name: $.champion.class-dc-attribute
    label: Champion class DC attribute
    type: core/attribute
    cases: [strength, dexterity]
- key: dedication-class-dc
  effect: core/add-class-dc@2
  inputs:
    rank: trained
    className: champion
    keyAttribute: {choice: $.champion.class-dc-attribute}
- key: dedication-spell-proficiency
  effect: spellcasting/increase-spell-proficiency@2
  inputs:
    rank: trained
- key: choice-champion-cause-holy
  prerequisites:
  - hasChoice:
      name: $.deity.sanctification
      equals: {type: core/string, value: holy}
  choice:
    name: $.champion.cause
    label: Cause
    prerequisites:
    - $.deity.sanctification
    type: core/feature-id
    cases:
    - {key: liberation, value: '@class.champion.causes.liberation'}
    - {key: grandeur, value: '@class.champion.causes.grandeur'}
    - {key: redemption, value: '@class.champion.causes.redemption'}
    - {key: justice, value: '@class.champion.causes.justice'}
    - {key: obedience, value: '@class.champion.causes.obedience'}
- key: choice-champion-cause-unholy
  prerequisites:
  - hasChoice:
      name: $.deity.sanctification
      equals: {type: core/string, value: unholy}
  choice:
    name: $.champion.cause
    label: Cause
    prerequisites:
    - $.deity.sanctification
    type: core/feature-id
    cases:
    - {key: liberation, value: '@class.champion.causes.liberation'}
    - {key: justice, value: '@class.champion.causes.justice'}
    - {key: iniquity, value: '@class.champion.causes.iniquity'}
    - {key: desecration, value: '@class.champion.causes.desecration'}
    - {key: obedience, value: '@class.champion.causes.obedience'}
- key: choice-champion-cause-none
  prerequisites:
  - hasChoice:
      name: $.deity.sanctification
      equals: {type: core/string, value: none}
  choice:
    name: $.champion.cause
    label: Cause
    prerequisites:
    - $.deity.sanctification
    type: core/feature-id
    cases:
    - {key: liberation, value: '@class.champion.causes.liberation'}
    - {key: justice, value: '@class.champion.causes.justice'}
    - {key: obedience, value: '@class.champion.causes.obedience'}
- key: options-armor
  effect: core/declare-list
  level: 2
  inputs:
    list: $.feats.champion-dedication.armor-options
    valueType: core/string
- key: allow-armor-light-and-medium
  effect: core/add-to-list
  level: 2
  prerequisites:
  - anyOf:
    - hasChoice:
        name: $.armor.light.rank
        equals: {type: core/int, value: 0}
    - hasChoice:
        name: $.armor.medium.rank
        equals: {type: core/int, value: 0}
  inputs:
    list: $.feats.champion-dedication.armor-options
    value: {type: core/string, literal: light-and-medium}
- key: allow-armor-heavy
  effect: core/add-to-list
  level: 2
  prerequisites:
  - hasChoice:
      name: $.armor.light.rank
      oneOf:
      - {type: core/int, value: 1}
      - {type: core/int, value: 2}
      - {type: core/int, value: 3}
      - {type: core/int, value: 4}
  - hasChoice:
      name: $.armor.medium.rank
      oneOf:
      - {type: core/int, value: 1}
      - {type: core/int, value: 2}
      - {type: core/int, value: 3}
      - {type: core/int, value: 4}
  inputs:
    list: $.feats.champion-dedication.armor-options
    value: {type: core/string, literal: heavy}
- key: choice-armor
  level: 2
  prerequisites:
  - anyOf:
    - anyOf:
      - hasChoice:
          name: $.armor.light.rank
          equals: {type: core/int, value: 0}
      - hasChoice:
          name: $.armor.medium.rank
          equals: {type: core/int, value: 0}
    - allOf:
      - hasChoice:
          name: $.armor.light.rank
          oneOf:
          - {type: core/int, value: 1}
          - {type: core/int, value: 2}
          - {type: core/int, value: 3}
          - {type: core/int, value: 4}
      - hasChoice:
          name: $.armor.medium.rank
          oneOf:
          - {type: core/int, value: 1}
          - {type: core/int, value: 2}
          - {type: core/int, value: 3}
          - {type: core/int, value: 4}
  choice:
    name: $.feats.champion-dedication.armor
    label: Armor
    optionsFrom: $.feats.champion-dedication.armor-options
    type: core/string
    cases:
    - key: light-and-medium
      label: Light and Medium
      value: light-and-medium
      effects:
      - id: 41bc2f0b-0cd4-5311-b32e-c981a1ed1a16
        key: active-effect-like-4
        effect: core/add-armor-proficiency@3
        inputs:
          armor: {category: light}
          rank: trained
          selfScaling: true
      - id: f997440e-2369-56db-9117-a386a6c1a8ad
        key: active-effect-like-5
        effect: core/add-armor-proficiency@3
        inputs:
          armor: {category: medium}
          rank: trained
          selfScaling: true
    - key: heavy
      value: heavy
      effects:
      - id: 5607bb0c-df19-59cd-a530-a359cad7e5b4
        key: active-effect-like-6
        effect: core/add-armor-proficiency@3
        inputs:
          armor: {category: heavy}
          rank: trained
          selfScaling: true
- key: grant-deity-benefits-champions-aura
  effect: core/add-feature@2
  inputs:
    feature: '@class.champion.deity-benefits.champions-aura'
