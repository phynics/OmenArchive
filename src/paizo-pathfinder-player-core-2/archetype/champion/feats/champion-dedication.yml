---
name: champion dedication
level: 2
rarity: common
type: archetype
traits:
- archetype
- dedication
- multiclass
prerequisites:
- text: Strength +2
  hasAttributeModifier: {attribute: str, modifier: 2}
- text: Charisma +2
  hasAttributeModifier: {attribute: cha, modifier: 2}
description: 'Choose a deity. You are bound by your deity''s anathema and gain the
  champion''s aura and sanctification as described in the champion class. Choose a
  cause as you would if you were a champion, with the same options a champion must
  abide by. You gain its edicts and anathema but don''t gain the other abilities.

  You become trained in Religion and your deity''s associated skill; for each of these
  skills in which you were already trained, you instead become trained in a skill
  of your choice. You become trained in champion class DC. If you later gain a devotion
  spell, you become trained in spell attack modifier and spell DC.

  You become trained in light armor and medium armor. If you already were trained
  in light armor and medium armor, you gain training in heavy armor as well. Whenever
  you gain a class feature that grants you expert or greater proficiency in any type
  of armor \(but not unarmored defense\), you also gain that proficiency in the armor
  types granted to you by this feat. If you have a class feature that grants you expert
  proficiency in unarmored defense and you''re 13th level or higher, you also become
  an expert in the armor types granted to you by this feat.

  [Champion](omen://archetype/champion?source=paizo-pathfinder-player-core-2)'
mechanicsScope: mixed
unsupportedReason: The deity facts, training in Religion, the class DC and the spell
  statistics are modeled. The cause and the armor training are not yet.
foundryID: 0YjetnLVIUz9zQt5
rules:
- key: choice-deity-name
  choice:
    name: $.deity.name
    label: Deity's name
    type: core/string
    freeText: true
- key: choice-deity-sanctification
  choice:
    name: $.deity.sanctification
    label: Sanctification
    type: core/string
    cases:
    - key: holy
      value: holy
      effects:
      - key: add-holy-trait
        effect: core/add-character-trait
        inputs:
          trait: holy
    - key: unholy
      value: unholy
      effects:
      - key: add-unholy-trait
        effect: core/add-character-trait
        inputs:
          trait: unholy
    - {value: none}
- key: choice-deity-divine-skill
  choice:
    name: $.deity.divine-skill
    label: Divine skill
    type: core/skill
    cases:
    - {key: acrobatics, value: acrobatics}
    - {key: arcana, value: arcana}
    - {key: athletics, value: athletics}
    - {key: crafting, value: crafting}
    - {key: deception, value: deception}
    - {key: diplomacy, value: diplomacy}
    - {key: intimidation, value: intimidation}
    - {key: medicine, value: medicine}
    - {key: nature, value: nature}
    - {key: occultism, value: occultism}
    - {key: performance, value: performance}
    - {key: religion, value: religion}
    - {key: society, value: society}
    - {key: stealth, value: stealth}
    - {key: survival, value: survival}
    - {key: thievery, value: thievery}
- key: deity-divine-skill
  effect: core/add-skill-increase
  inputs:
    skill: {choice: $.deity.divine-skill}
    proficiencyCap: 2
- key: choice-deity-edicts
  choice:
    name: $.deity.edicts
    label: Edicts
    optional: true
    type: core/string
    freeText: true
- key: choice-deity-anathema
  choice:
    name: $.deity.anathema
    label: Anathema
    optional: true
    type: core/string
    freeText: true
- key: dedication-religion
  effect: core/add-skill-increase
  inputs:
    skill: religion
    proficiencyCap: 2
- key: choice-champion-class-dc-attribute
  choice:
    name: $.champion.class-dc-attribute
    label: Champion class DC attribute
    type: core/attribute
    cases: [str, dex]
- key: dedication-class-dc
  effect: core/add-class-dc
  inputs:
    proficiencyRank: 2
    className: champion
    keyAttribute: {choice: $.champion.class-dc-attribute}
- key: dedication-spell-proficiency
  effect: spellcasting/increase-spell-proficiency
  inputs:
    proficiency: 2
